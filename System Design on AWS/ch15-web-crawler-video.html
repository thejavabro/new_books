CH({slug:'ch15-web-crawler',n:'15',part:'Part III · System design use cases',sub:'Two systems: one that fetches the web, one that answers questions about it.',end:'Crawl politely, deduplicate cheaply, index by word.',scenes:[

RC('15',[['Pipeline','Fetch, parse, index.'],['Frontier','Priority and politeness.'],['Bloom filter','Cheap deduplication.'],['Inverted index','Word to documents.'],['Relevance','Many signals.'],['Storage','One store per job.']])
]});

/* Auto-playing 16:9 chapter animation. Everything on screen is a function of time, so it can be paused, scrubbed and filmed. */
(function(){
const SPEC=window.SPEC,W=1920,H=1080,X0=120,CW=1680,Y0=270,CH=600;

const st=(o)=>Object.keys(o).map(k=>k+':'+(typeof o[k]==='number'&&!/opacity|z-index|flex|font-weight/.test(k)?o[k]+'px':o[k])).join(';');
const box=(cls,x,y,w,h,inner,a,extra)=>`<div class="${cls}" style="left:${x}px;top:${y}px;width:${w}px;${h?`height:${h}px;`:''}${extra||''}"${a?` data-a="${a}"`:''}>${inner}</div>`;
const fmt=(v,dec)=>dec?v.toFixed(dec):Math.round(v).toLocaleString('en-US');

const DUR={title:s=>7.5,points:s=>3.5+s.items.length*2.7,stats:s=>5+s.items.length*1.7,bars:s=>5+s.items.length*1.3,flow:s=>6.5+s.nodes.length*1.1,
 versus:s=>5.5+(s.a.items.length+s.b.items.length)*1.25,pipeline:s=>4.5+s.stages.length*2.3,cycle:s=>5+s.items.length*2.6,lanes:s=>11,curve:s=>11,scatter:s=>11,

/* ---------- scene builders: return html; register time functions with S.fn(at,dur,f) / S.loop(f) ---------- */
const B={};
B.title=(s,S)=>{
  const words=s.title.split(' ');

  return `<svg class="lay"><g transform="translate(1480 540)"><g id="${S.id}rings" style="transform-origin:0 0"><circle r="330" fill="none" stroke="${S.acc}" stroke-width="3" stroke-dasharray="1" pathLength="1" data-a="draw,.2,2.2" opacity=".5"/><circle r="330" cx="0" cy="0" fill="none" stroke="${S.acc}" stroke-width="14" stroke-dasharray="6 60" opacity=".35"/><circle cx="330" r="16" fill="${S.acc}"/></g>

  +box('bigN',1480-360,540-300,720,600,s.n,'pop,.3,1.1','text-align:center;'+(String(s.n).length>3?'font-size:200px;padding-top:190px;white-space:nowrap;':String(s.n).length>1?'font-size:400px;padding-top:70px;':''))
  +box('',120,300,1100,0,`<i style="display:inline-block;width:60px;height:6px;background:${S.acc};vertical-align:middle;margin-right:20px"></i>${s.part||''}`,'left,.5','font-size:32px;letter-spacing:.2em;text-transform:uppercase;color:#8fa3bf;font-weight:600;')
  +`<div style="left:120px;top:370px;width:${s.title.length>30||String(s.n).length>3?1000:1150}px;font-size:${s.title.length>30?84:s.title.length>14?100:118}px;font-weight:800;line-height:1.04;letter-spacing:-.025em">${words.map((w,i)=>`<span style="display:inline-block;margin-right:.25em" data-a="up,${(.9+i*.14).toFixed(2)},.8">${w}</span>`).join('')}</div>`

B.points=(s,S)=>{
  const n=s.items.length,cols=n<=4?n:Math.ceil(n/2),rows=n<=4?1:2,gap=28,w=(CW-gap*(cols-1))/cols,h=rows===1?540:286,step=(S.T-3)/n;

  +s.items.map((it,i)=>{const at=.8+i*1.2,c=col(it.c||CY[i]),R=Math.min(210,w/2-30),cx=X0+w*(i+.5),cy=Y0+230;

    S.loop((t,g)=>{const a=t*.9+i;const o=g('o'+i);o.setAttribute('cx',cx+Math.cos(a)*R);o.setAttribute('cy',cy+Math.sin(a)*R);o.style.opacity=t>at+1.6?1:0});

     +box('lbl',X0+w*i+20,Y0+470,w-40,0,it.l,`up,${at+.7},.6`,`text-align:center;font-size:${n>3?30:34}px;`)}).join('');

B.bars=(s,S)=>{
  const n=s.items.length,rh=Math.min(120,CH/n),max=s.max||Math.max(...s.items.map(i=>i.v)),lw=s.lw||470,tw=CW-lw-270;
  return s.items.map((it,i)=>{const y=Y0+i*rh+(CH-n*rh)/2,at=1+i*.8,c=col(it.c||'blue'),bh=Math.min(58,rh-34);
    S.fn(at,1.4,(p,t,g)=>{const e=eo(p);g('f'+i).style.width=(tw*it.v/max*e)+'px';g('v'+i).textContent=it.txt!=null?(p>.6?it.txt:''):(it.pre||'')+fmt(it.v*e,it.dec)+(it.suf||'')});

    +box('',X0+lw,y+(rh-bh)/2,tw,bh,`<div id="${S.id}f${i}" style="height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,${c}aa,${c});box-shadow:0 0 30px ${c}66"></div>`,`fade,${at},.4`,'background:#131d30;border-radius:12px;')
    +box('big',X0+lw+tw+24,y,246,rh,`<span id="${S.id}v${i}"></span>`,`fade,${at},.4`,`display:flex;align-items:center;font-size:${it.txt!=null?32:(rh<90?40:50)}px;line-height:1.1;letter-spacing:0;color:${c};`)}).join('')

B.flow=(s,S)=>{
  const cols=s.cols||Math.max(...s.nodes.map(n=>n.col))+1,rows=s.rows||Math.max(...s.nodes.map(n=>n.row))+1,nw=Math.min(380,CW/cols-70),nh=Math.min(120,CH/rows-36);
  const N={},step=Math.min(.8,(S.T-5)/s.nodes.length);
  s.nodes.forEach((n,i)=>{n.x=X0+(n.col+.5)*CW/cols;n.y=Y0+(n.row+.5)*CH/rows;n.at=.9+i*step;N[n.id]=n});
  const clip=(n,ux,uy)=>{const hw=nw/2+10,hh=nh/2+10,t=Math.min(ux?hw/Math.abs(ux):1e9,uy?hh/Math.abs(uy):1e9);return[n.x+ux*t,n.y+uy*t]};

     +box('stamp',X0+930,y+rh/2-36,s.sw||230,72,lab,`stamp,${(at+step*.5).toFixed(2)},.35`,`--c:${c};font-size:${lab.length>9?24:32}px;`)
     +box('',X0+930+(s.sw||230)+30,y+8,CW-960-(s.sw||230),rh-16,it.why||'',`fade,${(at+step*.5+.3).toFixed(2)},.5`,`display:flex;align-items:center;font-size:${rh<110?23:26}px;line-height:1.25;color:#c9d6ea;`)}).join('');
};
B.quote=(s,S)=>{
  const words=s.text.split(' ');let hi=false;
  S.loop((t,g)=>{g('ln').style.width=(clamp((t-.3)/(S.T-2))*900)+'px'});
  return box('q',210,Y0-20,1500,CH-60,`<div>${words.map((w,i)=>{let o='';if(w.startsWith('*')){hi=true;w=w.slice(1)}const end=w.endsWith('*')||/\*[.,;:!?]$/.test(w);w=w.replace('*','');o=`<span data-a="up,${(.5+i*.26).toFixed(2)},.5"${hi?` style="color:${S.acc}"`:''}>${w} </span>`;if(end)hi=false;return o}).join('')}</div>`,'','display:grid;place-items:center;')
   +`<div id="${S.id}ln" style="left:510px;top:${Y0+CH-40}px;height:8px;border-radius:4px;background:${S.acc};width:0"></div>`
   +(s.by?box('',210,Y0+CH-10,1500,0,s.by,`fade,${(.5+words.length*.26).toFixed(2)}`,'text-align:center;font-size:30px;color:#8fa3bf;'):'');
};
B.recap=(s,S)=>{
  const n=s.items.length,cols=n<=3?n:Math.ceil(n/2),rows=n<=3?1:2,gap=26,w=(CW-gap*(cols-1))/cols,h=(CH-gap*(rows-1))/rows;
  return s.items.map((it,i)=>{const c=col(it.c||CY[i%6]),at=.8+i*((S.T-4)/n);
    return box('card',X0+(i%cols)*(w+gap),Y0+Math.floor(i/cols)*(h+gap),w,h,`<div class="bar"></div><svg width="54" height="54" viewBox="0 0 54 54" style="margin-bottom:12px"><circle cx="27" cy="27" r="24" fill="${c}"/><path d="M15 28l8 8 16-17" fill="none" stroke="#0a101c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" data-a="draw,${(at+.5).toFixed(2)},.5"/></svg><h3 style="font-size:35px">${it.t}</h3><p style="font-size:26.5px">${it.d}</p>`,`flip,${at.toFixed(2)},.7`,`--c:${c}`)}).join('');
};
B.outro=(s,S)=>{
  S.loop((t,g)=>{g('ar').style.transform=`translateX(${Math.sin(t*3)*14}px)`});
  return box('',120,300,1680,0,s.line||'That’s the chapter.','up,.4','font-size:54px;font-weight:700;color:#c9d6ea;text-align:center;')
   +(s.next?box('',360,430,1200,300,`<div style="font-size:28px;letter-spacing:.22em;text-transform:uppercase;color:#8fa3bf;font-weight:600;margin-bottom:18px">Next up</div><div style="font-size:66px;font-weight:800;line-height:1.1;color:${S.acc}">${s.next}&nbsp;<span id="${S.id}ar" style="display:inline-block">→</span></div>`,'pop,1.4,.8',`border:3px solid ${S.acc};border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:#101a2c;`):`<span id="${S.id}ar"></span>`)
   +box('',120,820,1680,0,SPEC.credit,'fade,2.6','text-align:center;font-size:26px;color:#8fa3bf;');
};

/* ---------- assemble ---------- */
const stage=document.getElementById('stage'),scenes=[];let total=0;
SPEC.scenes.forEach((s,i)=>{
  const caps=s.cap||[],T=s.dur||Math.max(DUR[s.type](s),caps.reduce((a,c)=>a+2.2+c.replace(/<[^>]+>/g,'').length*.052,1.2));
  const S={id:'s'+i+'_',T,acc:col(s.acc||CY[i%5]),fns:[],anims:[],memo:{}};
  S.fn=(at,dur,f,ease,always)=>S.fns.push({at,dur,f,always});S.loop=f=>S.fns.push({loop:1,f});
  const el=document.createElement('div');el.className='scene';el.style.setProperty('--acc',S.acc);
  let html=B[s.type](s,S);
  if(s.type!=='title'&&s.type!=='outro'){html+=`<div class="kick" data-a="left,.1,.5"><i></i>${s.kick||SPEC.kick}</div>`+(s.title?`<div class="h" data-a="up,.2,.7">${s.title}</div>`:'')}
  const cw=(S.T-1)/Math.max(1,caps.length);
  caps.forEach((c,k)=>{const at=.5+k*cw;let wi=0;const parts=c.split(/(<b>|<\/b>)/);let inb=false,out='';parts.forEach(p=>{if(p==='<b>'){inb=true;return}if(p==='</b>'){inb=false;return}p.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){out+=' ';return}if(/^[.,;:!?)\u2026]+$/.test(w)&&out.endsWith('</span>')){out=out.slice(0,-7)+w+'</span>';return}out+=`<span data-w="${wi++}">${inb?'<b>'+w+'</b>':w}</span>`})});
    html+=`<div class="cap" id="${S.id}cap${k}"><div>${out}</div></div>`;
    S.loop((t,g)=>{const e=g('cap'+k),vis=t>=at-.05&&t<at+cw;e.style.display=vis?'flex':'none';if(!vis)return;const ws=e._w||(e._w=e.querySelectorAll('span'));const sp=Math.min(.16,cw*.45/ws.length);
      for(let j=0;j<ws.length;j++){const p=eo(pr(t,at+j*sp,.3));ws[j].style.opacity=p;ws[j].style.transform=`translateY(${(1-p)*14}px)`}e.style.opacity=k<caps.length-1?1-pr(t,at+cw-.3,.25):1})});
  el.innerHTML=html;stage.appendChild(el);
  S.g=id=>S.memo[id]||(S.memo[id]=document.getElementById(S.id+id));
  el.querySelectorAll('[data-a]').forEach(e=>{const a=e.dataset.a.split(',');if(!a[0])return;S.anims.push({el:e,k:a[0],at:+a[1]||0,dur:+a[2]||.7,base:e.style.transform||''})});
  scenes.push({S,el,start:total,T});total+=T;
});
const prog=document.getElementById('prog');scenes.forEach(sc=>{if(sc.start){const u=document.createElement('u');u.style.left=(sc.start/total*100)+'%';prog.appendChild(u)}});
const pfill=prog.querySelector('i'),bgGrid=document.querySelector('#bg .grid'),blobs=document.querySelectorAll('#bg .blob'),mark=document.getElementById('mark');

function applyA(a,t){const p=clamp((t-a.at)/a.dur),e=a.el.style,o=eo(p);
  switch(a.k){
    case'up':e.opacity=o;e.transform=`${a.base} translateY(${(1-o)*46}px)`;break;
    case'left':e.opacity=o;e.transform=`${a.base} translateX(${(o-1)*70}px)`;break;
    case'right':e.opacity=o;e.transform=`${a.base} translateX(${(1-o)*70}px)`;break;
    case'fade':e.opacity=o;break;
    case'pop':e.opacity=clamp(p*4);e.transform=`${a.base} scale(${p<=0?.3:.3+.7*back(p)})`;break;
    case'draw':e.strokeDashoffset=1-eio(p);e.opacity=p>0?(a.el.getAttribute('opacity')||1):0;break;
    case'flip':e.opacity=clamp(p*3);e.transform=`perspective(1400px) rotateX(${(1-o)*-85}deg) translateY(${(1-o)*40}px)`;break;
    case'stamp':e.opacity=p>0?1:0;e.transform=`scale(${3.2-2.2*o}) rotate(${-7+((1-o)*-14)}deg)`;break;
  }}
let cur=-1;
function render(T){
  T=clamp(T,0,total-.001);let i=scenes.findIndex(sc=>T<sc.start+sc.T);if(i<0)i=scenes.length-1;
  if(i!==cur){scenes.forEach((sc,k)=>sc.el.style.display=k===i?'block':'none');cur=i}
  const sc=scenes[i],S=sc.S,t=T-sc.start,last=i===scenes.length-1;
  const pin=eo(pr(t,0,.55)),pout=last?0:eio(pr(t,sc.T-.45,.45));
  sc.el.style.opacity=pin*(1-pout);sc.el.style.transform=`translateX(${(1-pin)*90-pout*90}px) scale(${1+.015*(t/sc.T)})`;
  S.anims.forEach(a=>applyA(a,t));
  S.fns.forEach(f=>{if(f.loop)f.f(t,S.g);else if(f.always||t>=f.at)f.f(eo(clamp((t-f.at)/f.dur)),t,S.g)});
  pfill.style.width=(T/total*100)+'%';
  bgGrid.style.transform=`translate(${-(T*9)%80}px,${-(T*5)%80}px)`;
  blobs[0].style.transform=`translate(${Math.sin(T*.21)*260}px,${Math.cos(T*.17)*160}px)`;blobs[0].style.background=S.acc;
  blobs[1].style.transform=`translate(${Math.cos(T*.19)*240}px,${Math.sin(T*.23)*180}px)`;
  mark.textContent=String(i+1).padStart(2,'0')+' / '+String(scenes.length).padStart(2,'0');
}
/* ---------- player ---------- */
const q=new URLSearchParams(location.search);let T=+q.get('t')||0,playing=q.get('paused')==null,lastTs=0;
const ui=document.getElementById('ui'),seek=document.getElementById('seek'),btn=document.getElementById('pp'),tm=document.getElementById('tm');seek.max=total;
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',fit);fit();
function frame(ts){if(playing){if(lastTs)T+=Math.min(.1,(ts-lastTs)/1000);if(T>=total){T=total-.001;playing=false}}lastTs=ts;render(T);seek.value=T;tm.textContent=mmss(T)+' / '+mmss(total);btn.textContent=playing?'Pause':(T>=total-.01?'Replay':'Play');requestAnimationFrame(frame)}
function toggle(){if(T>=total-.01)T=0;playing=!playing}
btn.onclick=toggle;seek.oninput=()=>{T=+seek.value};
document.getElementById('rs').onclick=()=>{T=0;playing=true};
document.getElementById('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
let clean=q.get('clean')!=null,hideTimer;function setClean(v){clean=v;document.body.classList.toggle('clean',v);ui.classList.toggle('hide',v)}
setClean(clean);
addEventListener('mousemove',()=>{if(clean)return;ui.classList.remove('hide');clearTimeout(hideTimer);hideTimer=setTimeout(()=>ui.classList.add('hide'),2500)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' '){e.preventDefault();toggle()}else if(k==='r'){T=0;playing=true}else if(k==='f')document.getElementById('fs').onclick();else if(k==='c')setClean(!clean);
  else if(k==='arrowright'){const n=scenes.find(sc=>sc.start>T+.05);T=n?n.start:T}else if(k==='arrowleft'){const p=[...scenes].reverse().find(sc=>sc.start<T-1);T=p?p.start:0}});
window.__seek=t=>{T=t;playing=false;render(T)};window.__total=total;window.__scenes=scenes.map(s=>[s.start,s.T]);
requestAnimationFrame(frame);
})();
</script></body></html>
