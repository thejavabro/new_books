<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="866" viewBox="0 0 1240 866" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two vertical flows compared. The database first flow runs from database tables to one URL per table to the client assembling the product to storage now being published, and ends in many client calls and a contract that breaks when storage moves. The caller first flow runs from caller jobs to product resources to operations, and keeps storage replaceable behind the boundary, ending in fewer but more meaningful calls and freedom to change storage. Only the caller first flow keeps storage behind the API boundary.">
  <defs>
    <marker id="yl03twoflow-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="yl03twoflow-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="yl03twoflow-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl03twoflow-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl03twoflow-k1"><rect x="84" y="190" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl03twoflow-k2"><rect x="84" y="282" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl03twoflow-k3"><rect x="84" y="374" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl03twoflow-k4"><rect x="84" y="466" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl03twoflow-k5"><rect x="84" y="566" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="yl03twoflow-k6"><rect x="684" y="190" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl03twoflow-k7"><rect x="684" y="282" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl03twoflow-k8"><rect x="684" y="374" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl03twoflow-k9"><rect x="684" y="466" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl03twoflow-k10"><rect x="684" y="566" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="866" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Database first against caller first</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">two flows compared, read top to bottom</text>

  
  <rect x="40" y="126" width="556" height="584" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Database first</text>

  
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M320,242 V282" marker-end="url(#yl03twoflow-pk)"/>
    <path d="M320,334 V374" marker-end="url(#yl03twoflow-pk)"/>
    <path d="M320,426 V466" marker-end="url(#yl03twoflow-pk)"/>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="2.5">
    <path d="M320,518 V566" marker-end="url(#yl03twoflow-pk)"/>
  </g>

  <g filter="url(#yl03twoflow-soft)">
    <rect x="84" y="190" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="190" width="6" height="48" fill="#DB2777" clip-path="url(#yl03twoflow-k1)"/>
  </g>
  <circle cx="118" cy="214" r="4.5" fill="#DB2777"/>
  <text x="142" y="221" font-size="18.5" font-weight="600" fill="#111827">Database tables</text>

  <g filter="url(#yl03twoflow-soft)">
    <rect x="84" y="282" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="282" width="6" height="48" fill="#DB2777" clip-path="url(#yl03twoflow-k2)"/>
  </g>
  <circle cx="118" cy="306" r="4.5" fill="#DB2777"/>
  <text x="142" y="313" font-size="18.5" font-weight="600" fill="#111827">One URL per table</text>

  <g filter="url(#yl03twoflow-soft)">
    <rect x="84" y="374" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="374" width="6" height="48" fill="#DB2777" clip-path="url(#yl03twoflow-k3)"/>
  </g>
  <circle cx="118" cy="398" r="4.5" fill="#DB2777"/>
  <text x="142" y="405" font-size="18.5" font-weight="600" fill="#111827">The client assembles the product</text>

  <g filter="url(#yl03twoflow-soft)">
    <rect x="84" y="466" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="466" width="6" height="48" fill="#DB2777" clip-path="url(#yl03twoflow-k4)"/>
  </g>
  <circle cx="118" cy="490" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,481) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="142" y="497" font-size="18.5" font-weight="600" fill="#111827">Storage is now published</text>

  <g filter="url(#yl03twoflow-lift)">
    <rect x="84" y="566" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="566" width="9" height="90" fill="#DB2777" clip-path="url(#yl03twoflow-k5)"/>
  </g>
  <circle cx="118" cy="611" r="16" fill="#FFFFFF"/>
  <g transform="translate(108.4,601.4) scale(0.8)" fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="142" y="618" font-size="18.5" font-weight="600" fill="#111827">Many client calls</text>
  <text x="320" y="681" font-size="15.5" text-anchor="middle" fill="#6B7280">Storage changes may affect clients.</text>

  
  <rect x="644" y="126" width="556" height="584" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#047857">Caller first</text>

  
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M920,242 V282" marker-end="url(#yl03twoflow-em)"/>
    <path d="M920,334 V374" marker-end="url(#yl03twoflow-em)"/>
    <path d="M920,426 V466" marker-end="url(#yl03twoflow-em)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2.5">
    <path d="M920,518 V566" marker-end="url(#yl03twoflow-em)"/>
  </g>

  <g filter="url(#yl03twoflow-soft)">
    <rect x="684" y="190" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="190" width="6" height="48" fill="#059669" clip-path="url(#yl03twoflow-k6)"/>
  </g>
  <circle cx="718" cy="214" r="4.5" fill="#059669"/>
  <text x="742" y="221" font-size="18.5" font-weight="600" fill="#111827">Caller jobs</text>

  <g filter="url(#yl03twoflow-soft)">
    <rect x="684" y="282" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="282" width="6" height="48" fill="#059669" clip-path="url(#yl03twoflow-k7)"/>
  </g>
  <circle cx="718" cy="306" r="4.5" fill="#059669"/>
  <text x="742" y="313" font-size="18.5" font-weight="600" fill="#111827">Product resources</text>

  <g filter="url(#yl03twoflow-soft)">
    <rect x="684" y="374" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="374" width="6" height="48" fill="#059669" clip-path="url(#yl03twoflow-k8)"/>
  </g>
  <circle cx="718" cy="398" r="4.5" fill="#059669"/>
  <text x="742" y="405" font-size="18.5" font-weight="600" fill="#111827">Operations</text>

  <g filter="url(#yl03twoflow-soft)">
    <rect x="684" y="466" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="466" width="6" height="48" fill="#059669" clip-path="url(#yl03twoflow-k9)"/>
  </g>
  <circle cx="718" cy="490" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,481) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="742" y="497" font-size="18.5" font-weight="600" fill="#111827">Storage stays replaceable</text>

  <g filter="url(#yl03twoflow-lift)">
    <rect x="684" y="566" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="566" width="9" height="90" fill="#059669" clip-path="url(#yl03twoflow-k10)"/>
  </g>
  <circle cx="718" cy="611" r="16" fill="#FFFFFF"/>
  <g transform="translate(708.4,601.4) scale(0.8)" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="742" y="618" font-size="18.5" font-weight="600" fill="#111827">Fewer, more meaningful calls</text>
  <text x="920" y="681" font-size="15.5" text-anchor="middle" fill="#6B7280">Storage is free to change behind the boundary.</text>

  
  <rect x="40" y="750" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="795" text-anchor="middle" font-size="16" fill="#475569">Client needs should guide the API; storage details can remain internal.</text>
</svg>