<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="859" viewBox="0 0 1240 859" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="After a timeout the caller knows it sent a request but not whether the server applied it. Which operations may be retried automatically, and the reason for each: GET, a complete PUT, DELETE, and a keyed POST are safe, a value-setting PATCH only if the operation says so, and an unprotected POST is not.">
  <defs>
    <filter id="xl03retryti-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl03retryti-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl03retryti-k1"><rect x="96" y="196" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03retryti-k2"><rect x="672" y="196" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03retryti-k3"><rect x="96" y="351" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03retryti-k4"><rect x="672" y="351" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03retryti-k5"><rect x="96" y="582" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03retryti-k6"><rect x="672" y="582" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="859" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The response was lost. May the caller send it again?</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the card is the operation, the gray line under it is why</text>

  
  <rect x="64" y="126" width="1112" height="362" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="156" font-size="16.5" font-weight="600" fill="#047857">Retry? Yes</text>
  <text x="88" y="178" font-size="15.5" fill="#6B7280">safe to retry automatically</text>

  
  <g filter="url(#xl03retryti-soft)">
    <rect x="96" y="196" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="96" y="196" width="6" height="90" fill="#059669" clip-path="url(#xl03retryti-k1)"/>
  </g>
  <circle cx="134" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(123.56,230.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="160" y="248" font-size="18.5" font-weight="600" fill="#111827">GET</text>
  <text x="332" y="311" font-size="15.5" text-anchor="middle" fill="#6B7280">Safe and idempotent. It asks for no change at all.</text>

  
  <g filter="url(#xl03retryti-soft)">
    <rect x="672" y="196" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="672" y="196" width="6" height="90" fill="#059669" clip-path="url(#xl03retryti-k2)"/>
  </g>
  <circle cx="710" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(699.56,230.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="736" y="248" font-size="18.5" font-weight="600" fill="#111827">PUT with the same complete body</text>
  <text x="908" y="311" font-size="15.5" text-anchor="middle" fill="#6B7280">The same replacement leaves the same final state.</text>

  
  <g filter="url(#xl03retryti-soft)">
    <rect x="96" y="351" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="96" y="351" width="6" height="90" fill="#059669" clip-path="url(#xl03retryti-k3)"/>
  </g>
  <circle cx="134" cy="396" r="18" fill="#FFFFFF"/>
  <g transform="translate(123.56,385.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16"/>
    <path d="M9.5 7V4.5h5V7"/>
    <path d="M6.5 7l1 13.5h9L17.5 7"/>
    <path d="M10 11v6M14 11v6"/>
  </g>
  <text x="160" y="403" font-size="18.5" font-weight="600" fill="#111827">DELETE</text>
  <text x="332" y="466" font-size="15.5" text-anchor="middle" fill="#6B7280">Repetition keeps the member absent.</text>

  
  <g filter="url(#xl03retryti-soft)">
    <rect x="672" y="351" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="672" y="351" width="6" height="90" fill="#059669" clip-path="url(#xl03retryti-k4)"/>
  </g>
  <circle cx="710" cy="396" r="18" fill="#FFFFFF"/>
  <g transform="translate(699.56,385.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="15.5" r="4"/>
    <path d="M10.4 12.6L20.5 2.5"/>
    <path d="M16.2 6.8l3 3"/>
    <path d="M18.9 4.1l3 3"/>
  </g>
  <text x="736" y="403" font-size="18.5" font-weight="600" fill="#111827">POST with a valid Idempotency-Key</text>
  <text x="908" y="466" font-size="15.5" text-anchor="middle" fill="#6B7280">Repeated deliveries map to one logical request.</text>

  
  <rect x="64" y="512" width="536" height="207" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="88" y="542" font-size="16.5" font-weight="600" fill="#B45309">Retry? Only if published</text>
  <text x="88" y="564" font-size="15.5" fill="#6B7280">retry only when the operation says so</text>

  <g filter="url(#xl03retryti-soft)">
    <rect x="96" y="582" width="472" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="96" y="582" width="6" height="90" fill="#D97706" clip-path="url(#xl03retryti-k5)"/>
  </g>
  <circle cx="134" cy="627" r="18" fill="#FFFFFF"/>
  <g transform="translate(123.56,616.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="160" y="634" font-size="18.5" font-weight="600" fill="#111827">A value-setting PATCH</text>
  <text x="332" y="697" font-size="15.5" text-anchor="middle" fill="#6B7280">PATCH is not idempotent by method alone.</text>

  
  <rect x="640" y="512" width="536" height="207" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="542" font-size="16.5" font-weight="600" fill="#BE185D">Retry? No</text>
  <text x="664" y="564" font-size="15.5" fill="#6B7280">not safe to retry automatically</text>

  <g filter="url(#xl03retryti-lift)">
    <rect x="672" y="582" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="672" y="582" width="9" height="90" fill="#DB2777" clip-path="url(#xl03retryti-k6)"/>
  </g>
  <circle cx="710" cy="627" r="18" fill="#FFFFFF"/>
  <g transform="translate(699.56,616.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="736" y="634" font-size="18.5" font-weight="600" fill="#111827">An unprotected POST</text>
  <text x="908" y="697" font-size="15.5" text-anchor="middle" fill="#6B7280">Repetition may create the order twice.</text>

  
  <rect x="40" y="743" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="788" text-anchor="middle" font-size="16" fill="#475569">Idempotent does not mean retry forever. The caller still needs a deadline and an attempt limit.</text>
</svg>