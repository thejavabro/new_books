<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. A user saves a new shipping address and the address service replies saved, then the user opens the confirmation page which reads from the read model and gets the old address back because the address changed event has not arrived yet, and only afterwards does the event reach the read model.">
  <defs>
    <marker id="m05-l05-read-your-writes-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l05-read-your-writes-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l05-read-your-writes-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m05-l05-read-your-writes-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m05-l05-read-your-writes-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <rect x="100" y="320" width="1080" height="410" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="230" y1="145" x2="230" y2="760"/>
    <line x1="640" y1="145" x2="640" y2="760"/>
    <line x1="1030" y1="145" x2="1030" y2="760"/>
  </g>

  <text x="120" y="360" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Convergence window: the read model has not caught up</text>
  <text x="1000" y="360" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">usually milliseconds, sometimes seconds</text>

  <g fill="none" stroke-width="2.5">
    <path d="M236,220 L634,220" stroke="#3B82F6" marker-end="url(#m05-l05-read-your-writes-bl)"/>
    <path d="M634,280 L238,280" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m05-l05-read-your-writes-em)"/>
    <path d="M236,430 L1024,430" stroke="#3B82F6" marker-end="url(#m05-l05-read-your-writes-bl)"/>
    <path d="M1024,500 L238,500" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m05-l05-read-your-writes-rd)"/>
    <path d="M646,700 L1024,700" stroke="#D97706" marker-end="url(#m05-l05-read-your-writes-ab)"/>
  </g>

  <rect x="1023" y="340" width="14" height="350" rx="2" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1050" y="540" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read model</text>
  <text x="1050" y="566" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">is behind</text>

  <text x="435" y="208" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Save the new shipping address</text>
  <text x="435" y="268" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Saved</text>
  <text x="630" y="418" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Open the confirmation page</text>
  <text x="630" y="488" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Old address: the update has not arrived</text>
  <text x="835" y="688" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the event finally arrives</text>

  <g filter="url(#m05-l05-read-your-writes-soft)">
    <rect x="380" y="540" width="500" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="630" y="581" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Nothing is broken.</text>
  <text x="630" y="613" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The user is now certain something is.</text>

  <g filter="url(#m05-l05-read-your-writes-soft)">
    <rect x="110" y="50" width="240" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User</text>
  <text x="230" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">the acting user</text>
  <g filter="url(#m05-l05-read-your-writes-soft)">
    <rect x="490" y="50" width="300" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="640" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Address service</text>
  <text x="640" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">the source of truth</text>
  <g filter="url(#m05-l05-read-your-writes-soft)">
    <rect x="880" y="50" width="300" height="95" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="1030" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Read model</text>
  <text x="1030" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">a copy built for reads</text>

  <g filter="url(#m05-l05-read-your-writes-soft)">
    <rect x="60" y="790" width="540" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="330" y="831" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The fix: read your own writes</text>
  <text x="330" y="863" text-anchor="middle" font-size="20" fill="#64748B">pin this user's reads to the source of truth</text>
  <g filter="url(#m05-l05-read-your-writes-soft)">
    <rect x="640" y="790" width="540" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="910" y="831" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The views converge</text>
  <text x="910" y="863" text-anchor="middle" font-size="20" fill="#64748B">after the user already saw the old value</text>

  <line x1="60" y1="930" x2="96" y2="930" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="937" font-size="20" fill="#475569">Synchronous request, and the user waits</text>
  <line x1="60" y1="970" x2="96" y2="970" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="977" font-size="20" fill="#475569">The reply the user expected</text>
  <line x1="60" y1="1010" x2="96" y2="1010" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1017" font-size="20" fill="#475569">Stale reply, contradicting the user's own action</text>
  <line x1="60" y1="1050" x2="96" y2="1050" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="1057" font-size="20" fill="#475569">Async event, arriving later</text>
</svg>