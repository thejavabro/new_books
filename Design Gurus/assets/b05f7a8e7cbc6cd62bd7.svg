<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Strangler end state: users send live traffic to a checkout service, a search service, and a smaller core monolith, each owning its own database.">
  <defs>
    <marker id="m01-l06-strangler-end-state-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m01-l06-strangler-end-state-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m01-l06-strangler-end-state-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>

  
  <rect x="380" y="70" width="800" height="380" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="402" y="108" font-size="20" font-weight="600" fill="#334155">First extractions: each owns its database from day one</text>

  <rect x="380" y="480" width="800" height="210" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="402" y="518" font-size="20" font-weight="600" fill="#334155">No big-bang rewrite: the core keeps running</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M260,370 C330,370 350,205 420,205" stroke="#3B82F6" marker-end="url(#m01-l06-strangler-end-state-blue)"/>
    <path d="M260,385 C330,385 350,365 420,365" stroke="#3B82F6" marker-end="url(#m01-l06-strangler-end-state-blue)"/>
    <path d="M260,400 C330,400 350,605 420,605" stroke="#3B82F6" marker-end="url(#m01-l06-strangler-end-state-blue)"/>
    <path d="M740,205 L880,205" stroke="#475569" marker-end="url(#m01-l06-strangler-end-state-slate)"/>
    <path d="M740,365 L880,365" stroke="#475569" marker-end="url(#m01-l06-strangler-end-state-slate)"/>
    <path d="M740,605 L880,605" stroke="#475569" marker-end="url(#m01-l06-strangler-end-state-slate)"/>
  </g>

  
  <g filter="url(#m01-l06-strangler-end-state-soft)">
    <rect x="60" y="340" width="200" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="160" y="392" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Users</text>

  
  <g filter="url(#m01-l06-strangler-end-state-soft)">
    <rect x="420" y="150" width="320" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="580" y="195" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout service</text>
  <text x="580" y="227" text-anchor="middle" font-size="20" fill="#64748B">own team, deploys alone</text>

  <g filter="url(#m01-l06-strangler-end-state-soft)">
    <rect x="420" y="310" width="320" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="580" y="355" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Search service</text>
  <text x="580" y="387" text-anchor="middle" font-size="20" fill="#64748B">own team, deploys alone</text>

  
  <g filter="url(#m01-l06-strangler-end-state-soft)">
    <rect x="420" y="550" width="320" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="580" y="595" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Monolith (smaller core)</text>
  <text x="580" y="627" text-anchor="middle" font-size="20" fill="#64748B">keeps shrinking</text>

  
  <g filter="url(#m01-l06-strangler-end-state-soft)">
    <path d="M880,163 L880,248 A140,18 0 0 0 1160,248 L1160,163" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="1020" cy="163" rx="140" ry="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1020" y="200" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout DB</text>
  <text x="1020" y="230" text-anchor="middle" font-size="20" fill="#64748B">no shared tables</text>

  <g filter="url(#m01-l06-strangler-end-state-soft)">
    <path d="M880,323 L880,408 A140,18 0 0 0 1160,408 L1160,323" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="1020" cy="323" rx="140" ry="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1020" y="360" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Search DB</text>
  <text x="1020" y="390" text-anchor="middle" font-size="20" fill="#64748B">no shared tables</text>

  <g filter="url(#m01-l06-strangler-end-state-soft)">
    <path d="M880,563 L880,648 A140,18 0 0 0 1160,648 L1160,563" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="1020" cy="563" rx="140" ry="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1020" y="612" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Monolith DB</text>

  
  <g stroke-width="4">
    <line x1="40" y1="745" x2="74" y2="745" stroke="#3B82F6"/>
    <line x1="400" y1="745" x2="434" y2="745" stroke="#475569"/>
  </g>
  <text x="84" y="752" font-size="20" fill="#475569">Live user traffic</text>
  <text x="444" y="752" font-size="20" fill="#475569">Service-owned database, no shared tables</text>
</svg>