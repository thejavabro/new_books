<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="626" viewBox="0 0 1240 626" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sequence-title sequence-desc">
<title id="sequence-title">The hour, the week, the quarter</title>
<desc id="sequence-desc">Tonight: confirm the connection count, add a pooler in transaction mode, size the pool in the dozens and end idle transactions, none of which needs a deploy. This week: act on the measurements. This quarter: vertical scaling and then replicas. Not yet: sharding, with the numbers that would change that written down.</desc>
<defs>
<marker id="sequence-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sequence-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sequence-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sequence-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="626" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The hour, the week, the quarter</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The sequencing matters as much as the diagnosis.</text>
<rect x="40" y="548" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="548" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="258" height="300" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V412A6 6 0 0 0 46 418H54Z" fill="#39D5AA"/><text x="169" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">The next hour</text>
<text x="169" y="198" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">confirm connection count</text><text x="169" y="228" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">pooler, transaction mode</text><text x="169" y="258" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">pool sized in the dozens</text><text x="169" y="288" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">end idle transactions</text>
<rect x="54" y="346" width="230" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="169" y="380" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">no deploy required</text>
<path d="M304 268H334" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M304 268H334" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="340" y="118" width="258" height="300" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M354 118H346A6 6 0 0 0 340 124V412A6 6 0 0 0 346 418H354Z" fill="#5EC9EC"/><text x="469" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">The next week</text>
<text x="469" y="198" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">act on what you measured</text><text x="469" y="228" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">caching, expiry</text><text x="469" y="258" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">spread out</text><text x="469" y="288" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">or plans and indexes</text><text x="469" y="318" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">for the heaviest queries</text>
<rect x="354" y="346" width="230" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="469" y="367" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">once you have</text><text x="469" y="393" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">measured</text>
<path d="M604 268H634" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M604 268H634" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="640" y="118" width="258" height="300" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V412A6 6 0 0 0 646 418H654Z" fill="#F3CF6A"/><text x="769" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">The next quarter</text>
<text x="769" y="198" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">vertical scaling first</text><text x="769" y="228" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">then read replicas</text><text x="769" y="258" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">with an answer for</text><text x="769" y="288" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">read-your-writes</text>
<rect x="654" y="346" width="230" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="769" y="367" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">if growth</text><text x="769" y="393" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">justifies it</text>
<path d="M904 268H934" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M904 268H934" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="940" y="118" width="258" height="300" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M954 118H946A6 6 0 0 0 940 124V412A6 6 0 0 0 946 418H954Z" fill="#F28B9D"/><text x="1069" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">Not yet</text>
<text x="1069" y="198" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">sharding</text><text x="1069" y="228" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">write the two numbers</text><text x="1069" y="258" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">that would change this</text>
<rect x="954" y="346" width="230" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1069" y="367" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">triggered by</text><text x="1069" y="393" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">measurement</text>
<rect x="40" y="442" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="442" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="473.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Saying what you do tonight AND what you refuse to start tonight</text><text x="64" y="502.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">is most of what separates a senior answer from a confident one.</text>
<text x="66" y="582" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The question is answered by a sequence, not by a choice between three proposals.</text>
</svg>