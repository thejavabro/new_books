<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A VPN wraps all of the device&#39;s traffic in an encrypted tunnel, while a proxy relays traffic from one application without encrypting it">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="px7-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="px7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="px7-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="px7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="380" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="80" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">VPN</text>

  <rect x="640" y="40" width="580" height="380" rx="14" fill="#F1F5F9" fill-opacity="0.7" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="80" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Proxy server</text>

  <text x="145" y="128" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">Your device</text>
  <text x="755" y="128" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">Your device</text>

  <line x1="235" y1="180" x2="279" y2="180" stroke="#059669" stroke-width="2.5" marker-end="url(#px7-emerald)"/>
  <line x1="235" y1="248" x2="279" y2="248" stroke="#059669" stroke-width="2.5" marker-end="url(#px7-emerald)"/>
  <line x1="235" y1="316" x2="279" y2="316" stroke="#059669" stroke-width="2.5" marker-end="url(#px7-emerald)"/>

  <line x1="845" y1="180" x2="889" y2="180" stroke="#D97706" stroke-width="2.5" marker-end="url(#px7-amber)"/>
  <line x1="845" y1="248" x2="1146" y2="248" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#px7-slate)"/>
  <line x1="845" y1="316" x2="1146" y2="316" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#px7-slate)"/>

  <g filter="url(#px7-soft)">
    <rect x="60" y="146" width="175" height="204" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="78" y="158" width="139" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="78" y="226" width="139" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="78" y="294" width="139" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>

    <rect x="285" y="146" width="285" height="204" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

    <rect x="670" y="146" width="175" height="204" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="688" y="158" width="139" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="688" y="226" width="139" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="688" y="294" width="139" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>

    <rect x="895" y="150" width="180" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <text x="147" y="187" font-size="20" fill="#0F172A" text-anchor="middle">Browser</text>
  <text x="147" y="255" font-size="20" fill="#0F172A" text-anchor="middle">Apps</text>
  <text x="147" y="323" font-size="20" fill="#0F172A" text-anchor="middle">Updates</text>

  <text x="427" y="228" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Encrypted tunnel</text>
  <text x="427" y="266" font-size="20" fill="#059669" text-anchor="middle">to the VPN server</text>

  <text x="757" y="187" font-size="20" fill="#0F172A" text-anchor="middle">Browser</text>
  <text x="757" y="255" font-size="20" fill="#0F172A" text-anchor="middle">Apps</text>
  <text x="757" y="323" font-size="20" fill="#0F172A" text-anchor="middle">Updates</text>

  <text x="985" y="187" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Proxy</text>
  <text x="1152" y="240" font-size="20" fill="#64748B" text-anchor="start">direct</text>
  <text x="1152" y="308" font-size="20" fill="#64748B" text-anchor="start">direct</text>

  <text x="310" y="392" font-size="20" fill="#475569" text-anchor="middle">All traffic is routed and encrypted</text>
  <text x="930" y="392" font-size="20" fill="#475569" text-anchor="middle">One app is routed, nothing is encrypted</text>
</svg>