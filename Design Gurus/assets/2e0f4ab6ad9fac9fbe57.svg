<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="packing-title packing-desc">
<title id="packing-title">Arithmetic gives decimals, reality sells machines</title>
<desc id="packing-desc">You cannot buy a fraction of a machine, instance sizes are coarse enough that ten percent more capacity can cost twice as much, and a machine out of memory is full regardless of how much CPU remains.</desc>
<defs>
<marker id="packing-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="packing-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="packing-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="packing-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="590" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Arithmetic gives decimals, reality sells machines</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Vendors sell whole machines, in a small set of sizes.</text>
<rect x="40" y="512" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="512" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="372" height="180" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V292A6 6 0 0 0 46 298H54Z" fill="#F3CF6A"/><text x="226" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">You need 3.7</text>
<text x="226" y="194" font-size="26" font-weight="700" fill="#91642E" text-anchor="middle">You buy 4</text>
<text x="226" y="228" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">and 4 is the honest number</text>
<text x="226" y="260" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">across a small fleet that</text><text x="226" y="284" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">rounding is a real fraction</text>
<rect x="434" y="118" width="372" height="180" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V292A6 6 0 0 0 440 298H448Z" fill="#F28B9D"/><text x="620" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">Sizes are coarse</text>
<rect x="480" y="170" width="280" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="480" y="170" width="280.0" height="26" rx="10" fill="#06AC80"/>
<text x="620" y="220" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">need 10 percent more</text>
<rect x="480" y="232" width="280" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="480" y="232" width="280.0" height="26" rx="10" fill="#F25461"/>
<text x="620" y="282" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">pay 100 percent more</text>
<rect x="828" y="118" width="372" height="180" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V292A6 6 0 0 0 834 298H842Z" fill="#AC8BE8"/><text x="1014" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">Two dimensions</text>
<rect x="848" y="170" width="156" height="86" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="926" y="205.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">CPU</text><text x="926" y="232.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">20% used</text>
<rect x="1024" y="170" width="156" height="86" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1102" y="205.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Memory</text><text x="1102" y="232.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">100% used</text>
<text x="1014" y="282" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">this machine is full</text>
<rect x="40" y="322" width="1160" height="164" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 322H46A6 6 0 0 0 40 328V480A6 6 0 0 0 46 486H54Z" fill="#5EC9EC"/><text x="620" y="358" font-size="23" font-weight="700" fill="#155B9E" text-anchor="middle">Stranded capacity</text>
<text x="620" y="386" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">A fleet reported as 60 percent utilized may have no usable space at all,</text><text x="620" y="411" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">because the average hides which dimension actually ran out.</text>
<rect x="170" y="428" width="420" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="380" y="457" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Plan in the dimension that binds</text>
<rect x="650" y="428" width="420" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="860" y="457" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name it, then check the others</text>
<text x="66" y="546" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Capacity is not one number. It is whichever dimension runs out first, and that differs per service.</text>
</svg>