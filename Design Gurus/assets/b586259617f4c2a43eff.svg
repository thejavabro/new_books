<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="home-title home-desc">
<title id="home-title">Why home-region partitioning usually wins</title>
<desc id="home-desc">If every record has exactly one region allowed to write it, conflicts cannot arise at all. You get local reads everywhere and a single authority per record, with no resolution machinery.</desc>
<defs>
<marker id="home-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="home-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="home-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="home-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="800" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why home-region partitioning usually wins</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The insight is that conflicts only matter when two regions write the same record.</text>
<rect x="40" y="722" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="722" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="560" height="174" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V286A6 6 0 0 0 46 292H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Region A</text>
<rect x="72" y="174" width="496" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="204" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">writes for customers 1 to 50k</text>
<rect x="72" y="232" width="496" height="48" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads for everybody</text>
<rect x="640" y="118" width="560" height="174" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V286A6 6 0 0 0 646 292H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Region B</text>
<rect x="672" y="174" width="496" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="204" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">writes for customers 50k and up</text>
<rect x="672" y="232" width="496" height="48" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads for everybody</text>
<rect x="40" y="310" width="1160" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No record is writable in two places, so no conflict can occur</text>
<text x="40" y="400" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The design work is in three places</text>
<circle cx="60" cy="446" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="453" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="418" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="452" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Choosing the partition</text>
<path d="M536 446H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 446H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#home-marker-slate)"/>
<rect x="580" y="418" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="452" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">usually the customer or user, because activity clusters there</text>
<circle cx="60" cy="514" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="521" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="486" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="520" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Routing writes home</text>
<path d="M536 514H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 514H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#home-marker-slate)"/>
<rect x="580" y="486" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="520" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">costs a hop for the writes that arrive in the wrong region</text>
<circle cx="60" cy="582" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="589" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="554" width="440" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="588" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Moving a record</text>
<path d="M536 582H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 582H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#home-marker-slate)"/>
<rect x="580" y="554" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="575.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stop writes for it, wait for replication,</text><text x="600" y="600.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">change the home, resume</text>
<rect x="40" y="634" width="1160" height="62" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="634" width="5" height="62" rx="2.5" fill="#F3CF6A"/><text x="64" y="671" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">What you give up is any region writing anything, which few products actually need.</text>
<text x="66" y="756" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">It converts a hard problem into an easy one, and most teams do not consider it.</text>
</svg>