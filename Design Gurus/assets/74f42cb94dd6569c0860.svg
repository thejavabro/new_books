<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Stateful: the session lives on one server, so the user must return to it. Stateless: every server can serve any request, and shared state lives outside">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="mc7-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="mc7-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="mc7-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="mc7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="510" rx="14" fill="#FEF2F2" fill-opacity="0.3" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">Stateful: the session lives on one server</text>

  <rect x="640" y="76" width="580" height="510" rx="14" fill="#ECFDF5" fill-opacity="0.3" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Stateless: any server can answer</text>

  
  <line x1="310" y1="176" x2="150" y2="252" stroke="#DC2626" stroke-width="2.5" marker-end="url(#mc7-red)"/>
  <g filter="url(#mc7-soft)">
    <rect x="150" y="110" width="320" height="66" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="60" y="256" width="180" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect x="255" y="256" width="140" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="410" y="256" width="140" height="110" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="310" y="150" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Load balancer</text>
  <text x="224" y="214" font-size="20" fill="#991B1B" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">always to Server A</text>
  <text x="150" y="292" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server A</text>
  <text x="150" y="322" font-size="20" fill="#991B1B" text-anchor="middle">holds the session:</text>
  <text x="150" y="350" font-size="20" fill="#991B1B" text-anchor="middle">cart, preferences</text>
  <text x="325" y="300" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">Server B</text>
  <text x="325" y="330" font-size="20" fill="#94A3B8" text-anchor="middle">cannot help</text>
  <text x="480" y="300" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">Server C</text>
  <text x="480" y="330" font-size="20" fill="#94A3B8" text-anchor="middle">cannot help</text>

  <rect x="60" y="400" width="490" height="76" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="305" y="432" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">If Server A dies, that session is gone</text>
  <text x="305" y="460" font-size="20" fill="#334155" text-anchor="middle">and a new server starts out useless</text>

  <text x="310" y="530" font-size="20" fill="#64748B" text-anchor="middle">Fast local access, but sticky routing,</text>
  <text x="310" y="558" font-size="20" fill="#64748B" text-anchor="middle">awkward scaling, and risky deployments</text>

  
  <line x1="930" y1="176" x2="760" y2="252" stroke="#059669" stroke-width="2" marker-end="url(#mc7-emerald)"/>
  <line x1="930" y1="176" x2="930" y2="252" stroke="#059669" stroke-width="2" marker-end="url(#mc7-emerald)"/>
  <line x1="930" y1="176" x2="1100" y2="252" stroke="#059669" stroke-width="2" marker-end="url(#mc7-emerald)"/>
  <g filter="url(#mc7-soft)">
    <rect x="770" y="110" width="320" height="66" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="680" y="256" width="160" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="850" y="256" width="160" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="1020" y="256" width="160" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="930" y="150" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Load balancer</text>
  <text x="760" y="300" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server A</text>
  <text x="760" y="330" font-size="20" fill="#065F46" text-anchor="middle">no session</text>
  <text x="930" y="300" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server B</text>
  <text x="930" y="330" font-size="20" fill="#065F46" text-anchor="middle">no session</text>
  <text x="1100" y="300" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server C</text>
  <text x="1100" y="330" font-size="20" fill="#065F46" text-anchor="middle">no session</text>

  <line x1="760" y1="366" x2="880" y2="404" stroke="#7C3AED" stroke-width="2" marker-end="url(#mc7-violet)"/>
  <line x1="930" y1="366" x2="930" y2="404" stroke="#7C3AED" stroke-width="2" marker-end="url(#mc7-violet)"/>
  <line x1="1100" y1="366" x2="980" y2="404" stroke="#7C3AED" stroke-width="2" marker-end="url(#mc7-violet)"/>
  <g filter="url(#mc7-soft)">
    <rect x="700" y="408" width="460" height="76" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="930" y="440" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shared store: session cache or database</text>
  <text x="930" y="468" font-size="20" fill="#5B21B6" text-anchor="middle">plus a signed token carried in every request</text>

  <text x="930" y="530" font-size="20" fill="#64748B" text-anchor="middle">Add or lose a server at any time, at the price</text>
  <text x="930" y="558" font-size="20" fill="#64748B" text-anchor="middle">of a dependency on that shared store</text>

  
  <text x="620" y="654" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Stateless does not mean no memory. It means no single server is the only one that remembers.</text>
</svg>