<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three counters at their starting values">
<defs>
<filter id="pk-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">A parking system with 2 big, 1 medium and 1 small spaces</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Each car asks for one kind of space, and is either let in or turned away</text>
<rect x="40" y="106" width="1160" height="468" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The whole design is three counters, one per kind of space</text>
<rect x="226" y="216" width="236" height="104" rx="14" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="344" y="250" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">big</text>
<text x="344" y="294" text-anchor="middle" font-size="27" font-weight="600" fill="#1D4ED8">2 of 2 free</text>
<rect x="502" y="216" width="236" height="104" rx="14" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="250" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">medium</text>
<text x="620" y="294" text-anchor="middle" font-size="27" font-weight="600" fill="#1D4ED8">1 of 1 free</text>
<rect x="778" y="216" width="236" height="104" rx="14" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="896" y="250" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">small</text>
<text x="896" y="294" text-anchor="middle" font-size="27" font-weight="600" fill="#1D4ED8">1 of 1 free</text>
<text x="202" y="424" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the calls</text>
<rect x="226" y="386" width="104" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="278" y="423.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">big</text>
<text x="278" y="468" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="344" y="386" width="104" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="396" y="423.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">medium</text>
<text x="396" y="468" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="462" y="386" width="104" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="514" y="423.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">small</text>
<text x="514" y="468" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="580" y="386" width="104" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="632" y="423.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">medium</text>
<text x="632" y="468" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="698" y="386" width="104" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="750" y="423.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">big</text>
<text x="750" y="468" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<text x="620" y="512" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Nothing needs to be remembered about individual cars, only how many spaces are left</text>
<rect x="40" y="586" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="626" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Three numbers are enough, because the cars are interchangeable</text>
<text x="620" y="658" text-anchor="middle" font-size="18.5" fill="#475569">Any big car fits any free big space, so which space it takes never matters</text>
</svg>