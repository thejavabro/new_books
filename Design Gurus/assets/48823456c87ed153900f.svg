<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="background-color:#ffffff">
<defs>
<marker id="ma" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#3a6fb0"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="30" font-size="14" font-weight="bold">Each layer has the same interface, so anything can wrap anything</text>

<rect x="40" y="60" width="380" height="200" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="230" y="84" text-anchor="middle" font-weight="bold" font-size="12.5">LoggingRepository</text>

<rect x="76" y="98" width="308" height="140" rx="8" fill="#ffffff" stroke="#6c8ebf"/>
<text x="230" y="122" text-anchor="middle" font-weight="bold" font-size="12.5">CachingRepository</text>

<rect x="112" y="136" width="236" height="82" rx="8" fill="#dcefe4" stroke="#2f7a55"/>
<text x="230" y="166" text-anchor="middle" font-weight="bold" font-size="12.5">DatabaseUserRepository</text>
<text x="230" y="190" text-anchor="middle" font-size="11.5" fill="#2f7a55">the real work</text>
<text x="230" y="208" text-anchor="middle" font-size="11.5" fill="#2f7a55">always at the bottom</text>

<text x="440" y="112" font-size="12.5" font-weight="bold">Logging outside</text>
<text x="440" y="136" font-family="monospace" font-size="11.5">[log]   findName(7)</text>
<text x="440" y="154" font-family="monospace" font-size="11.5">[cache] miss for 7</text>
<text x="440" y="172" font-family="monospace" font-size="11.5">[db]    query for user 7</text>
<text x="440" y="196" font-family="monospace" font-size="11.5">[log]   findName(7)</text>
<text x="440" y="214" font-family="monospace" font-size="11.5">[cache] hit for 7</text>
<text x="440" y="240" font-size="11.5" fill="#2f7a55">every call is logged</text>

<text x="700" y="112" font-size="12.5" font-weight="bold">Caching outside</text>
<text x="700" y="136" font-family="monospace" font-size="11.5">[cache] miss for 7</text>
<text x="700" y="154" font-family="monospace" font-size="11.5">[log]   findName(7)</text>
<text x="700" y="172" font-family="monospace" font-size="11.5">[db]    query for user 7</text>
<text x="700" y="196" font-family="monospace" font-size="11.5">[cache] hit for 7</text>
<text x="700" y="240" font-size="11.5" fill="#b4322c">the second call is never logged</text>


<rect x="40" y="288" width="880" height="106" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="62" y="314" font-size="12.5" fill="#414d60">Same three classes, same two calls, different order of wrapping, different behaviour.</text>
<text x="62" y="338" font-size="12.5" fill="#414d60">Neither order is wrong on its own. Logging outside measures what callers asked for; caching outside measures what reached the database.</text>
<text x="62" y="362" font-size="12.5" fill="#414d60">What is wrong is picking one by accident. Nothing in the type system checks the order, so write down why you chose it.</text>
</g>
</svg>