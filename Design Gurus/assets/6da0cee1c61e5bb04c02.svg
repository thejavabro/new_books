<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" style="background-color:#ffffff">
<defs>
<marker id="vsa" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="vsb" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="125" y="44" width="250" height="56" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="125" y="44" width="250" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="250" y="63" text-anchor="middle" font-weight="bold">&#171;interface&#187; Resource</text>
<text x="137" y="90" font-size="11.5">+ accept(visitor : PlanVisitor)</text>

<rect x="510" y="44" width="420" height="96" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="510" y="44" width="420" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="720" y="63" text-anchor="middle" font-weight="bold">&#171;interface&#187; PlanVisitor</text>
<text x="522" y="90" font-size="11.5">+ visit(server : Server)</text>
<text x="522" y="110" font-size="11.5">+ visit(database : Database)</text>
<text x="522" y="130" font-size="11.5">+ visit(loadBalancer : LoadBalancer)</text>

<path d="M 379 72 L 505 72" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#vsb)"/>
<text x="386" y="62" font-size="10.5" fill="#414d60">accept(v) calls</text>
<text x="386" y="90" font-size="10.5" fill="#414d60">v.visit(this)</text>

<rect x="30" y="180" width="140" height="62" fill="#ffffff" stroke="#c3cfe0"/>
<rect x="30" y="180" width="140" height="24" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="100" y="197" text-anchor="middle" font-weight="bold" font-size="11.5">Server</text>
<text x="40" y="216" font-size="10.5">- vcpus</text>
<text x="40" y="232" font-size="10.5">- publicIp</text>

<rect x="180" y="180" width="140" height="62" fill="#ffffff" stroke="#c3cfe0"/>
<rect x="180" y="180" width="140" height="24" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="250" y="197" text-anchor="middle" font-weight="bold" font-size="11.5">Database</text>
<text x="190" y="216" font-size="10.5">- storageGb</text>
<text x="190" y="232" font-size="10.5">- encrypted</text>

<rect x="330" y="180" width="140" height="62" fill="#ffffff" stroke="#c3cfe0"/>
<rect x="330" y="180" width="140" height="24" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="400" y="197" text-anchor="middle" font-weight="bold" font-size="11.5">LoadBalancer</text>
<text x="340" y="216" font-size="10.5">- rules</text>

<path d="M 100 180 L 100 150 L 250 150 L 250 100" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#vsa)"/>
<path d="M 250 180 L 250 150" stroke="#000000" fill="none" stroke-dasharray="5 4"/>
<path d="M 400 180 L 400 150 L 250 150" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<rect x="510" y="180" width="200" height="62" fill="#ffffff" stroke="#c3cfe0"/>
<rect x="510" y="180" width="200" height="24" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="610" y="197" text-anchor="middle" font-weight="bold" font-size="11.5">MonthlyCost</text>
<text x="520" y="216" font-size="10.5">- total : double</text>
<text x="520" y="232" font-size="10.5" fill="#414d60">all the pricing lives here</text>

<rect x="730" y="180" width="200" height="62" fill="#ffffff" stroke="#c3cfe0"/>
<rect x="730" y="180" width="200" height="24" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="830" y="197" text-anchor="middle" font-weight="bold" font-size="11.5">SecurityAudit</text>
<text x="740" y="216" font-size="10.5">- findings : List</text>
<text x="740" y="232" font-size="10.5" fill="#414d60">all the rules live here</text>

<path d="M 610 180 L 610 160 L 720 160 L 720 140" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#vsa)"/>
<path d="M 830 180 L 830 160 L 720 160" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<text x="30" y="262" font-size="11" fill="#414d60">accept(v) is one line in every element: v.visit(this). It is written once and never changes again.</text>

<rect x="30" y="276" width="900" height="62" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="300" font-size="12.5" fill="#414d60">Two interfaces, and the arrow between them is the whole pattern. The operations sit on the right, away from the data on the left.</text>
<text x="52" y="324" font-size="12.5" fill="#b4322c">Adding MonthlyCost or SecurityAudit touches no resource class. Adding a Queue resource forces a new visit() on every visitor.</text>
</g>
</svg>