<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Design A, harden the synchronous charge: the Customer app taps Place Order and waits; Place Order charges the payment provider with an idempotency key and waits at most 3 seconds, with at most 3 provider calls at a time on each server, 18 in total; a reconciliation job looks up unknown charges by key every 5 minutes. It needs no app release, but while the provider is slow, orders stay unconfirmed for minutes. Design B, a background payment worker: the Customer app taps Place Order, which saves the order in the orders table as payment_pending and answers in about 150 ms; the app checks the status every second and Place Order answers each check; the payment worker reads pending orders from the orders table, oldest first and up to 40 at a time, and charges the provider with the key, and the provider&#39;s response confirms the order. Place Order answers in about 150 ms, but the worker is a new part that can stop.">
  <defs>
    <filter id="md01c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md01c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md01c-k1"><rect x="160" y="200" width="320" height="80" rx="12"/></clipPath>
    <clipPath id="md01c-k2"><rect x="160" y="360" width="320" height="80" rx="12"/></clipPath>
    <clipPath id="md01c-k3"><rect x="160" y="520" width="320" height="80" rx="12"/></clipPath>
    <clipPath id="md01c-k4"><rect x="160" y="680" width="320" height="80" rx="12"/></clipPath>
    <clipPath id="md01c-k5"><rect x="760" y="200" width="320" height="80" rx="12"/></clipPath>
    <clipPath id="md01c-k6"><rect x="760" y="360" width="320" height="80" rx="12"/></clipPath>
    <clipPath id="md01c-k7"><rect x="760" y="650" width="320" height="80" rx="12"/></clipPath>
    <clipPath id="md01c-k8"><rect x="760" y="810" width="320" height="80" rx="12"/></clipPath>
    <marker id="md01c-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="md01c-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="md01c-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Design A and Design B for the payment step</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A waits on the provider inside the request; B answers at once and charges in a worker.</text>

  <rect x="40" y="120" width="560" height="930" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Design A: synchronous charge</text>
  <rect x="640" y="120" width="560" height="930" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Design B: background payment worker</text>

  <g fill="none" stroke-width="2">
    <path d="M320,280 V360" stroke="#2563EB" marker-end="url(#md01c-m-blue)"/>
    <path d="M320,440 V520" stroke="#2563EB" marker-end="url(#md01c-m-blue)"/>
    <path d="M320,680 V600" stroke="#D97706" marker-end="url(#md01c-m-amber)"/>
    <path d="M880,280 V360" stroke="#2563EB" marker-end="url(#md01c-m-blue)"/>
    <path d="M960,360 V280" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#md01c-m-blue)"/>
    <path d="M920,440 V504" stroke="#2563EB" marker-end="url(#md01c-m-blue)"/>
    <path d="M920,588 V650" stroke="#D97706" marker-end="url(#md01c-m-amber)"/>
    <path d="M880,730 V810" stroke="#D97706" marker-end="url(#md01c-m-amber)"/>
    <path d="M960,810 V730" stroke="#4F46E5" stroke-dasharray="7 6" marker-end="url(#md01c-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="334" y="326" fill="#1D4ED8" text-anchor="start">tap, then wait for the result</text>
    <text x="334" y="461" fill="#1D4ED8" text-anchor="start">charge with key</text>
    <text x="334" y="485" fill="#1D4ED8" text-anchor="start">waits at most 3 s</text>
    <text x="334" y="509" fill="#1D4ED8" text-anchor="start">at most 18 calls, 3 per server</text>
    <text x="334" y="634" fill="#B45309" text-anchor="start">look up unknown</text>
    <text x="334" y="658" fill="#B45309" text-anchor="start">charges by key</text>
    <text x="866" y="314" fill="#1D4ED8" text-anchor="end">tap; answer</text>
    <text x="866" y="338" fill="#1D4ED8" text-anchor="end">in 150 ms</text>
    <text x="974" y="302" fill="#1D4ED8" text-anchor="start">answers the app's</text>
    <text x="974" y="326" fill="#1D4ED8" text-anchor="start">status check</text>
    <text x="974" y="350" fill="#1D4ED8" text-anchor="start">every second</text>
    <text x="934" y="478" fill="#1D4ED8" text-anchor="start">save as payment_pending</text>
    <text x="934" y="612" fill="#B45309" text-anchor="start">read pending, oldest first,</text>
    <text x="934" y="636" fill="#B45309" text-anchor="start">up to 40 at a time</text>
    <text x="866" y="776" fill="#B45309" text-anchor="end">charge with key</text>
    <text x="974" y="776" fill="#4338CA" text-anchor="start">response</text>
  </g>

  <g filter="url(#md01c-soft)">
    <rect x="160" y="200" width="320" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="160" y="200" width="6" height="80" fill="#64748B" clip-path="url(#md01c-k1)"/>
  </g>
  <circle cx="198" cy="240" r="18" fill="#FFFFFF"/>
  <g transform="translate(187.56,229.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
