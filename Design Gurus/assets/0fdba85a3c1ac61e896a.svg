    <rect x="760" y="360" width="6" height="80" fill="#2563EB" clip-path="url(#md01c-k6)"/>
  </g>
  <circle cx="798" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,389.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="824" y="407" font-size="21.5" font-weight="600" fill="#111827">Place Order</text>
  <g filter="url(#md01c-soft)">
    <rect x="760" y="650" width="320" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="760" y="650" width="6" height="80" fill="#D97706" clip-path="url(#md01c-k7)"/>
  </g>
  <circle cx="798" cy="690" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,679.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="824" y="697" font-size="21.5" font-weight="600" fill="#111827">Payment worker</text>
  <g filter="url(#md01c-soft)">
    <rect x="760" y="810" width="320" height="80" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="760" y="810" width="6" height="80" fill="#4F46E5" clip-path="url(#md01c-k8)"/>
