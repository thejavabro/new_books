  <text x="224" y="407" font-size="21.5" font-weight="600" fill="#111827">Place Order</text>
  <g filter="url(#md01c-soft)">
    <rect x="160" y="520" width="320" height="80" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="160" y="520" width="6" height="80" fill="#4F46E5" clip-path="url(#md01c-k3)"/>
  </g>
  <circle cx="198" cy="560" r="18" fill="#FFFFFF"/>
  <g transform="translate(187.56,549.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="224" y="567" font-size="21.5" font-weight="600" fill="#111827">Payment provider</text>
  <g filter="url(#md01c-soft)">
    <rect x="160" y="680" width="320" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="160" y="680" width="6" height="80" fill="#D97706" clip-path="url(#md01c-k4)"/>
  </g>
  <circle cx="198" cy="720" r="18" fill="#FFFFFF"/>
  <g transform="translate(187.56,709.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="224" y="727" font-size="21.5" font-weight="600" fill="#111827">Reconciliation job</text>
  <g filter="url(#md01c-soft)">
    <rect x="760" y="200" width="320" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="760" y="200" width="6" height="80" fill="#64748B" clip-path="url(#md01c-k5)"/>
  </g>
  <circle cx="798" cy="240" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,229.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="824" y="247" font-size="21.5" font-weight="600" fill="#111827">Customer app</text>
  <g filter="url(#md01c-soft)">
