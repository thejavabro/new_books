  <g transform="translate(78,995) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="1012.5" font-size="18.5" fill="#1F2937">Slow provider: orders unconfirmed for minutes</text>
  <rect x="664" y="930" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,941) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="958.5" font-size="18.5" fill="#1F2937">Place Order answers in about 150 ms</text>
  <rect x="664" y="984" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,995) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="1012.5" font-size="18.5" fill="#1F2937">New part that can stop: the worker</text>




</svg>