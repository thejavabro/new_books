  <circle cx="798" cy="850" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,839.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="824" y="857" font-size="21.5" font-weight="600" fill="#111827">Payment provider</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M820,520 L820,572 A100,16 0 0 0 1020,572 L1020,520" fill="#DBEAFE"/>
