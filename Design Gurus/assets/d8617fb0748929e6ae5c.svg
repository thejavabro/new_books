<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: checkout places a charge, the payment service sends charge attempt 1 to the card network, the charge succeeds but the reply times out, and a blind retry policy of up to five attempts with no idempotency key produces up to five real charges on one card.">
  <defs>
    <marker id="m07-l11-payment-risk-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l11-payment-risk-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l11-payment-risk-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l11-payment-risk-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1170" fill="#FFFFFF"/>

  <rect x="120" y="500" width="1080" height="330" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="220" y1="195" x2="220" y2="860"/>
    <line x1="620" y1="195" x2="620" y2="860"/>
    <line x1="1020" y1="195" x2="1020" y2="860"/>
  </g>

  <rect x="214" y="280" width="12" height="520" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>

  <g fill="none" stroke-width="2.5">
    <path d="M226,280 L614,280" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l11-payment-risk-bl)"/>
    <path d="M626,350 L1014,350" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l11-payment-risk-bl)"/>
    <path d="M1014,420 L838,420" stroke="#059669" stroke-dasharray="6 5"/>
    <path d="M626,600 L1014,600" stroke="#DC2626" marker-end="url(#m07-l11-payment-risk-rd)"/>
    <path d="M626,680 L1014,680" stroke="#DC2626" marker-end="url(#m07-l11-payment-risk-rd)"/>
    <path d="M626,760 L1014,760" stroke="#DC2626" marker-end="url(#m07-l11-payment-risk-rd)"/>
  </g>

  <g stroke="#DC2626" stroke-width="3.5" stroke-linecap="round">
    <line x1="810" y1="408" x2="834" y2="432"/>
    <line x1="834" y1="408" x2="810" y2="432"/>
  </g>

  <text x="420" y="268" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">place the charge</text>
  <text x="820" y="338" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge attempt 1</text>
  <text x="930" y="405" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the charge succeeds at the network</text>
  <text x="795" y="462" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the reply times out</text>
  <text x="280" y="542" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The retry policy: up to 5 attempts, and no idempotency key</text>
  <text x="820" y="588" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge attempt 2</text>
  <text x="820" y="668" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge attempt 3</text>
  <text x="820" y="748" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge attempts 4 and 5</text>
  <text x="245" y="815" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Checkout is still blocked</text>

  <g filter="url(#m07-l11-payment-risk-soft)">
    <rect x="80" y="60" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="220" y="132" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <g filter="url(#m07-l11-payment-risk-soft)">
    <rect x="480" y="60" width="280" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="132" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment service</text>
  <g filter="url(#m07-l11-payment-risk-soft)">
    <rect x="880" y="60" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1020" y="132" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Card network</text>

  <g filter="url(#m07-l11-payment-risk-soft)">
    <rect x="80" y="890" width="520" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="340" y="952" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fix first: an idempotency key per charge</text>
  <g filter="url(#m07-l11-payment-risk-soft)">
    <rect x="660" y="890" width="520" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="920" y="952" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Up to five real charges on one card</text>

  <line x1="60" y1="1050" x2="96" y2="1050" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1057" font-size="20" fill="#475569">The synchronous request path: the caller waits</text>
  <line x1="60" y1="1090" x2="96" y2="1090" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1097" font-size="20" fill="#475569">The charge succeeded, and the reply was lost in flight</text>
  <line x1="60" y1="1130" x2="96" y2="1130" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1137" font-size="20" fill="#475569">A blind retry, and each one is a real charge</text>
</svg>