<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="360" viewBox="0 0 1240 360" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four shapes of NoSQL store: key-value, document, wide-column and graph, each with example systems and the access pattern it fits.">
  <defs>
    <filter id="mtns-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="mtns-k1"><rect x="40" y="60" width="251" height="90" rx="12"/></clipPath>
    <clipPath id="mtns-k2"><rect x="343" y="60" width="251" height="90" rx="12"/></clipPath>
    <clipPath id="mtns-k3"><rect x="646" y="60" width="251" height="90" rx="12"/></clipPath>
    <clipPath id="mtns-k4"><rect x="949" y="60" width="251" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="360" fill="#FFFFFF"/>

  
  <g filter="url(#mtns-soft)">
    <rect x="40" y="60" width="251" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="60" width="6" height="90" fill="#2563EB" clip-path="url(#mtns-k1)"/>
  </g>
  <circle cx="78" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,94.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="104" y="112" font-size="18.5" font-weight="600" fill="#111827">Key-value</text>
  <text x="165.5" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">Redis, DynamoDB</text>
  <text x="165.5" y="198" font-size="15.5" text-anchor="middle" fill="#94A3B8">simple lookups by a single key</text>

  
  <g filter="url(#mtns-soft)">
    <rect x="343" y="60" width="251" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="343" y="60" width="6" height="90" fill="#059669" clip-path="url(#mtns-k2)"/>
  </g>
  <circle cx="381" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,94.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="407" y="112" font-size="18.5" font-weight="600" fill="#111827">Document</text>
  <text x="468.5" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">MongoDB</text>
  <text x="468.5" y="198" font-size="15.5" text-anchor="middle" fill="#94A3B8">self-contained records that need not look alike</text>

  
  <g filter="url(#mtns-soft)">
    <rect x="646" y="60" width="251" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="646" y="60" width="6" height="90" fill="#D97706" clip-path="url(#mtns-k3)"/>
  </g>
  <circle cx="684" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,94.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="710" y="112" font-size="18.5" font-weight="600" fill="#111827">Wide-column</text>
  <text x="771.5" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">Cassandra, HBase</text>
  <text x="771.5" y="198" font-size="15.5" text-anchor="middle" fill="#94A3B8">very heavy writes, range reads by key</text>

  
  <g filter="url(#mtns-soft)">
    <rect x="949" y="60" width="251" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="949" y="60" width="6" height="90" fill="#7C3AED" clip-path="url(#mtns-k4)"/>
  </g>
  <circle cx="987" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,94.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="1013" y="112" font-size="18.5" font-weight="600" fill="#111827">Graph</text>
  <text x="1074.5" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">Neo4j</text>
  <text x="1074.5" y="198" font-size="15.5" text-anchor="middle" fill="#94A3B8">value lives in the connections</text>

  
  <rect x="40" y="248" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="293" text-anchor="middle" font-size="16" fill="#475569">Pick from your access patterns, not from the technology. Say what the two or three hot queries are, and the choice is usually clear.</text>
</svg>