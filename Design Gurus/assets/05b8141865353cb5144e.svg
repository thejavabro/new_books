<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What one backend per client costs, and what keeps it manageable. Duplicated logic is answered by a shared library, more services to deploy is answered by giving each client team its own backend to own, and extra load on the downstream services is answered by caching the shaped response in the backend">
  <defs>
    <marker id="bf2-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="bf2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bf2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bf2-p1"><rect x="72" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="bf2-p2"><rect x="455" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="bf2-p3"><rect x="838" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="bf2-s1"><rect x="72" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="bf2-s2"><rect x="455" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="bf2-s3"><rect x="838" y="398" width="330" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#B45309">What one backend per client costs</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#047857">What keeps it manageable</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M237,296 L237,394" marker-end="url(#bf2-em)"/>
    <path d="M620,296 L620,394" marker-end="url(#bf2-em)"/>
    <path d="M1003,296 L1003,394" marker-end="url(#bf2-em)"/>
  </g>

  <g filter="url(#bf2-soft)">
    <rect x="72" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#D97706" clip-path="url(#bf2-p1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Duplicated Logic</text>
  <text x="237" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">auth, paging, error shapes</text>
  <text x="237" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">written again in each backend</text>

  <g filter="url(#bf2-soft)">
    <rect x="455" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="455" y="112" width="6" height="90" fill="#D97706" clip-path="url(#bf2-p2)"/>
  </g>
  <circle cx="493" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="519" y="164" font-size="18.5" font-weight="600" fill="#111827">More to Run</text>
  <text x="620" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">three services instead of one</text>
  <text x="620" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">three pipelines and three alerts</text>

  <g filter="url(#bf2-soft)">
    <rect x="838" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="838" y="112" width="6" height="90" fill="#D97706" clip-path="url(#bf2-p3)"/>
  </g>
  <circle cx="876" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="902" y="164" font-size="18.5" font-weight="600" fill="#111827">More Load Downstream</text>
  <text x="1003" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">each backend calls the same services</text>
  <text x="1003" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">so the fan-out multiplies</text>

  <g filter="url(#bf2-lift)">
    <rect x="72" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="72" y="398" width="9" height="90" fill="#059669" clip-path="url(#bf2-s1)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Share a Library</text>
  <text x="237" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">common logic in one package</text>
  <text x="237" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">not copied into each backend</text>

  <g filter="url(#bf2-soft)">
    <rect x="455" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="455" y="398" width="6" height="90" fill="#059669" clip-path="url(#bf2-s2)"/>
  </g>
  <circle cx="493" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="519" y="450" font-size="18.5" font-weight="600" fill="#111827">One Owner Each</text>
  <text x="620" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">the team that owns the client</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">also owns its backend</text>

  <g filter="url(#bf2-soft)">
    <rect x="838" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="838" y="398" width="6" height="90" fill="#059669" clip-path="url(#bf2-s3)"/>
  </g>
  <circle cx="876" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="902" y="450" font-size="18.5" font-weight="600" fill="#111827">Cache the Shape</text>
  <text x="1003" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">hold the built response</text>
  <text x="1003" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">so repeat views skip the fan-out</text>

  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The real cost</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">a BFF per client only pays off when the clients genuinely need different data, not different screens</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The line to hold</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">a backend shapes and combines data for its client, it does not hold business rules the services own</text>
</svg>