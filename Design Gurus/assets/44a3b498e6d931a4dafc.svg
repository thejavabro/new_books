<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three ways to count a rate limit compared: a fixed window is cheap but allows a double burst at the boundary, a sliding window is fairer but costs more state, and a token bucket combines a steady refill with a bounded burst, which is the usual API answer.">
  <defs>
    <filter id="p14-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p14-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p14-k1"><rect x="76" y="146" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p14-k2"><rect x="76" y="348" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p14-k3"><rect x="76" y="550" width="340" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three ways to count, and what each one gives up</text>

  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round">
    <path d="M600,66 h15 M600,71.5 h15 M600,77 h10"/>
  </g>
  <text x="628" y="77" font-size="15.5" fill="#6B7280">How it works</text>

  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M790,66 L801,77 M801,66 L790,77"/>
  </g>
  <text x="815" y="77" font-size="15.5" fill="#6B7280">What it costs</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M985,71 L989.5,75.5 L997,65.5"/>
  </g>
  <text x="1011" y="77" font-size="15.5" fill="#6B7280">Fits</text>

  
  <rect x="40" y="126" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p14-soft)">
    <rect x="76" y="146" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p14-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Fixed window</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M900,192 L904.5,196.5 L912,186.5"/>
  </g>
  <text x="926" y="198" font-size="15.5" fill="#6B7280">A cheap administrative limit</text>

  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round">
    <path d="M78,255 h15 M78,260.5 h15 M78,266 h10"/>
  </g>
  <text x="104" y="266" font-size="15.5" fill="#6B7280">Count inside blocks such as 12:00:00 to 12:00:59</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,283 L89,294 M89,283 L78,294"/>
  </g>
  <text x="104" y="294" font-size="15.5" fill="#6B7280">1,200 requests in two seconds across one boundary</text>

  
  <rect x="40" y="328" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p14-soft)">
    <rect x="76" y="348" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="348" width="6" height="90" fill="#2563EB" clip-path="url(#p14-k2)"/>
  </g>
  <circle cx="114" cy="393" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,382.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="5" width="14" height="14" rx="2"/>
    <path d="M18.5 12h4M20.2 9.7L22.5 12l-2.3 2.3"/>
  </g>
  <text x="140" y="400" font-size="18.5" font-weight="600" fill="#111827">Sliding window</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M900,394 L904.5,398.5 L912,388.5"/>
  </g>
  <text x="926" y="400" font-size="15.5" fill="#6B7280">When recent fairness is worth it</text>

  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round">
    <path d="M78,457 h15 M78,462.5 h15 M78,468 h10"/>
  </g>
  <text x="104" y="468" font-size="15.5" fill="#6B7280">Count the exact preceding interval, continuously</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,485 L89,496 M89,485 L78,496"/>
  </g>
  <text x="104" y="496" font-size="15.5" fill="#6B7280">More state, or an approximation</text>

  
  <rect x="40" y="530" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p14-lift)">
    <rect x="76" y="550" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="550" width="9" height="90" fill="#2563EB" clip-path="url(#p14-k3)"/>
  </g>
  <circle cx="114" cy="595" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,584.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="602" font-size="18.5" font-weight="600" fill="#111827">Token bucket</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M900,596 L904.5,600.5 L912,590.5"/>
  </g>
  <text x="926" y="602" font-size="15.5" font-weight="600" fill="#047857">The usual API answer</text>

  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round">
    <path d="M78,659 h15 M78,664.5 h15 M78,670 h10"/>
  </g>
  <text x="104" y="670" font-size="15.5" fill="#6B7280">A capacity for bursts, a steady refill, a cost per call</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,687 L89,698 M89,687 L78,698"/>
  </g>
  <text x="104" y="698" font-size="15.5" fill="#6B7280">Two numbers to publish instead of one</text>

  
  <rect x="40" y="744" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="789" text-anchor="middle" font-size="16" fill="#475569">Do not say "600 per minute" if the behavior is a bucket. That phrase leaves the burst size unknown.</text>
</svg>