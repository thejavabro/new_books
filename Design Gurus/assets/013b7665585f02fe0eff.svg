<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="692" viewBox="0 0 1240 692" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="edge-title edge-desc">
<title id="edge-title">What belongs at the edge</title>
<desc id="edge-desc">The edge suits work that reshapes the request: normalizing the cache key, routing, assigning a variant, and rejecting bad traffic. It does not suit work that depends on current state, such as database reads, strong consistency or authorization decisions.</desc>
<defs>
<marker id="edge-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="edge-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="edge-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="edge-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="692" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What belongs at the edge</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The useful distinction is whether the decision needs data you own.</text>
<rect x="40" y="614" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="614" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="372" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V484A6 6 0 0 0 46 490H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Suited to the edge</text>
<rect x="72" y="174" width="500" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="174" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="96" y="200" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Normalizing the cache key</text><text x="96" y="226" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the highest value thing to do there</text>
<rect x="72" y="250" width="500" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="250" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="96" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Routing and rewriting</text><text x="96" y="302" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">region or device class to a variant</text>
<rect x="72" y="326" width="500" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="326" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="96" y="352" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Assigning a bucket or locale</text><text x="96" y="378" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">from the request, reflected in the key</text>
<rect x="72" y="402" width="500" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="402" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="96" y="428" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Rejecting bad requests</text><text x="96" y="454" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">before they consume origin capacity</text>
<rect x="640" y="118" width="560" height="372" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V484A6 6 0 0 0 646 490H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Not suited to the edge</text>
<rect x="672" y="174" width="500" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="672" y="174" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="696" y="200" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Anything needing your database</text><text x="696" y="226" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a call back to origin gives up the gain</text>
<rect x="672" y="288" width="500" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="672" y="288" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="696" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Anything needing strong consistency</text><text x="696" y="340" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">hundreds of locations, no coordination</text>
<rect x="672" y="402" width="500" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="672" y="402" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="696" y="428" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Authorization that matters</text><text x="696" y="454" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">checking a signature is fine; deciding is not</text>
<rect x="40" y="508" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="508" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="539.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The edge is very good at deciding WHICH cached thing to serve,</text><text x="64" y="568.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">and poor at deciding what is true right now.</text>
<text x="66" y="648" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Work that reshapes the request belongs there. Work that depends on current state does not.</text>
</svg>