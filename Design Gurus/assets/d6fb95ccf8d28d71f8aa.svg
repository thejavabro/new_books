<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1096" viewBox="0 0 1240 1096" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="When the ETA model cannot answer, the service takes the highest working rung: previous version, cached prediction, simple average, or a standard window">
  <defs>
    <marker id="c2svfb-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c2svfb-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="c2svfb-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2svfb-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2svfb-k1"><rect x="510" y="56" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="c2svfb-k2"><rect x="300" y="316" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="c2svfb-k3"><rect x="300" y="471" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="c2svfb-k4"><rect x="300" y="626" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="c2svfb-k5"><rect x="300" y="781" width="640" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="1096" fill="#FFFFFF"/>
  <rect x="40" y="226" width="1160" height="714" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="256" font-size="16.5" font-weight="600" fill="#1D4ED8">Fallback ladder: take the highest rung that works</text>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M620,183 V316" marker-end="url(#c2svfb-mpink)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M620,443 V471" marker-end="url(#c2svfb-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M620,598 V626" marker-end="url(#c2svfb-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M620,753 V781" marker-end="url(#c2svfb-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M180,856 V340" marker-end="url(#c2svfb-mslate)"/></g>
  <g filter="url(#c2svfb-soft)">
    <rect x="510" y="56" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="510" y="56" width="6" height="90" fill="#2563EB" clip-path="url(#c2svfb-k1)"/>
  </g>
  <circle cx="548" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(537.56,90.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="574" y="108" font-size="18.5" font-weight="600" fill="#111827">ETA model</text>
  <text x="620" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">too slow or down</text>
  <g filter="url(#c2svfb-soft)">
    <rect x="300" y="316" width="640" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="300" y="316" width="6" height="90" fill="#7C3AED" clip-path="url(#c2svfb-k2)"/>
  </g>
  <circle cx="338" cy="361" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,350.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="364" y="368" font-size="18.5" font-weight="600" fill="#111827">1. Previous model version</text>
  <text x="620" y="431" font-size="15.5" text-anchor="middle" fill="#6B7280">kept warm and ready</text>
  <g filter="url(#c2svfb-soft)">
    <rect x="300" y="471" width="640" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="300" y="471" width="6" height="90" fill="#2563EB" clip-path="url(#c2svfb-k3)"/>
  </g>
  <circle cx="338" cy="516" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,505.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="364" y="523" font-size="18.5" font-weight="600" fill="#111827">2. Cached recent prediction</text>
  <text x="620" y="586" font-size="15.5" text-anchor="middle" fill="#6B7280">for this exact entity</text>
  <g filter="url(#c2svfb-soft)">
    <rect x="300" y="626" width="640" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="300" y="626" width="6" height="90" fill="#D97706" clip-path="url(#c2svfb-k4)"/>
  </g>
  <circle cx="338" cy="671" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,660.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="364" y="678" font-size="18.5" font-weight="600" fill="#111827">3. Simple heuristic</text>
  <text x="620" y="741" font-size="15.5" text-anchor="middle" fill="#6B7280">population average ETA</text>
  <g filter="url(#c2svfb-soft)">
    <rect x="300" y="781" width="640" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="300" y="781" width="6" height="90" fill="#64748B" clip-path="url(#c2svfb-k5)"/>
  </g>
  <circle cx="338" cy="826" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,815.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="364" y="833" font-size="18.5" font-weight="600" fill="#111827">4. Product-level default</text>
  <text x="620" y="896" font-size="15.5" text-anchor="middle" fill="#6B7280">a standard window, such as 40 to 55 minutes</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="634" y="210" fill="#BE185D">cannot answer</text></g>
  <text x="180" y="322" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">best answer</text>
  <text x="180" y="882" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">worst answer, still in time</text>
  <rect x="40" y="980" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1025" text-anchor="middle" font-size="16" fill="#475569">Test every rung before it is needed, and count how often each one is used.</text>
</svg>