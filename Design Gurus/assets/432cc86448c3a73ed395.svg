<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="592" viewBox="0 0 1240 592" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What each availability target actually allows: 99 percent gives 432 minutes a month, 99.9 gives 43, 99.95 gives 22, and 99.99 gives four minutes">
  <rect x="0" y="0" width="1240" height="592" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">What each number of nines actually buys you, on a 30 day month</text>

  <rect x="50" y="88" width="1140" height="52" fill="#F1F5F9"/>
  <text x="70" y="121" font-size="20" font-weight="600" fill="#334155">Availability</text>
  <text x="460" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Down per month</text>
  <text x="760" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Down per year</text>
  <text x="920" y="121" font-size="20" font-weight="600" fill="#334155">What it feels like</text>

  <text x="70" y="183" font-size="20" font-weight="600" fill="#0F172A">99%</text>
  <text x="460" y="183" font-size="20" fill="#B91C1C" text-anchor="middle">432 minutes</text>
  <text x="760" y="183" font-size="20" fill="#334155" text-anchor="middle">3.6 days</text>
  <text x="920" y="183" font-size="20" fill="#0F172A">a bad afternoon, monthly</text>

  <text x="70" y="255" font-size="20" font-weight="600" fill="#0F172A">99.9%</text>
  <text x="460" y="255" font-size="20" fill="#92400E" text-anchor="middle">43 minutes</text>
  <text x="760" y="255" font-size="20" fill="#334155" text-anchor="middle">8.8 hours</text>
  <text x="920" y="255" font-size="20" fill="#0F172A">one long incident</text>

  <text x="70" y="327" font-size="20" font-weight="600" fill="#0F172A">99.95%</text>
  <text x="460" y="327" font-size="20" fill="#92400E" text-anchor="middle">22 minutes</text>
  <text x="760" y="327" font-size="20" fill="#334155" text-anchor="middle">4.4 hours</text>
  <text x="920" y="327" font-size="20" fill="#0F172A">one short incident</text>

  <text x="70" y="399" font-size="20" font-weight="600" fill="#0F172A">99.99%</text>
  <text x="460" y="399" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">4.3 minutes</text>
  <text x="760" y="399" font-size="20" fill="#334155" text-anchor="middle">53 minutes</text>
  <text x="920" y="399" font-size="20" fill="#0F172A">no time to react by hand</text>

  <line x1="50" y1="88" x2="1190" y2="88" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="1190" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="50" y1="212" x2="1190" y2="212" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="284" x2="1190" y2="284" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="356" x2="1190" y2="356" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="428" x2="1190" y2="428" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="428" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="300" y1="88" x2="300" y2="428" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="620" y1="88" x2="620" y2="428" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="900" y1="88" x2="900" y2="428" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="1190" y1="88" x2="1190" y2="428" stroke="#CBD5E1" stroke-width="1.5"/>

  
  <rect x="50" y="470" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="506" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Each extra nine divides the budget by ten, and multiplies what it costs to hold.</text>
  <text x="620" y="536" font-size="20" fill="#334155" text-anchor="middle">Four nines leaves four minutes a month, which is less time than a human takes to answer a page.</text>
</svg>