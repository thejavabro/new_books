<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The rate limiter data model: one rate limit rule as configuration, and one record per active user in Redis, shaped as a fixed window counter, a sorted set of timestamps, or a hash of minute counters">
<defs>
<filter id="rl2-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="rl2-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="rl2-mamb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<clipPath id="rl2-k1"><rect x="70" y="50" width="470" height="214" rx="12"/></clipPath>
<clipPath id="rl2-k2"><rect x="64" y="432" width="356" height="214" rx="12"/></clipPath>
<clipPath id="rl2-k3"><rect x="442" y="432" width="356" height="178" rx="12"/></clipPath>
<clipPath id="rl2-k4"><rect x="820" y="432" width="356" height="214" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>
<rect x="40" y="380" width="1160" height="338" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="64" y="410" font-size="16.5" font-weight="600" fill="#475569">One record per active user, held in Redis</text><path d="M 540,157 H 928 Q 940,157 940,169 V 377" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#rl2-mamb)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="940" y="272" fill="#B45309">one rule,</text><text x="940" y="294" fill="#B45309">many user records</text></g><g filter="url(#rl2-soft)">
<rect x="70" y="50" width="470" height="214" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="70" y="50" width="6" height="214" fill="#D97706" clip-path="url(#rl2-k1)"/>
</g>
<circle cx="108" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,67.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="134" y="85" font-size="18.5" font-weight="600" fill="#111827">Rate limit rule (configuration)</text><text x="94" y="131" font-size="15.5" fill="#111827">APIName</text><text x="516" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">part of the key</text><line x1="84" y1="142" x2="526" y2="142" stroke="#FCD34D" stroke-width="1"/><text x="94" y="167" font-size="15.5" fill="#111827">AccountTier</text><text x="516" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">part of the key</text><line x1="84" y1="178" x2="526" y2="178" stroke="#FCD34D" stroke-width="1"/><text x="94" y="203" font-size="15.5" fill="#111827">Limit</text><text x="516" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">the cap, for example 500</text><line x1="84" y1="214" x2="526" y2="214" stroke="#FCD34D" stroke-width="1"/><text x="94" y="239" font-size="15.5" fill="#111827">Window</text><text x="516" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">per second, minute, or hour</text><text x="305" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">configuration, read on every check</text><text x="305" y="312" font-size="15.5" text-anchor="middle" fill="#94A3B8">one rule covers every user on a tier</text><g filter="url(#rl2-lift)">
<rect x="64" y="432" width="356" height="214" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="64" y="432" width="9" height="214" fill="#2563EB" clip-path="url(#rl2-k2)"/>
</g>
<circle cx="102" cy="460" r="18" fill="#FFFFFF"/>
<g transform="translate(91.56,449.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
<text x="128" y="467" font-size="18.5" font-weight="600" fill="#111827">Fixed window counter</text><text x="88" y="513" font-size="15.5" fill="#111827">UserID</text><text x="396" y="513" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes, the key</text><line x1="78" y1="524" x2="406" y2="524" stroke="#93C5FD" stroke-width="1"/><text x="88" y="549" font-size="15.5" fill="#111827">Count</text><text x="396" y="549" font-size="15.5" text-anchor="end" fill="#6B7280">2 bytes</text><line x1="78" y1="560" x2="406" y2="560" stroke="#93C5FD" stroke-width="1"/><text x="88" y="585" font-size="15.5" fill="#111827">StartTime</text><text x="396" y="585" font-size="15.5" text-anchor="end" fill="#6B7280">minute and second, 2 bytes</text><line x1="78" y1="596" x2="406" y2="596" stroke="#93C5FD" stroke-width="1"/><text x="88" y="621" font-size="15.5" fill="#111827">Lock</text><text x="396" y="621" font-size="15.5" text-anchor="end" fill="#6B7280">optional, 4 bytes</text><text x="242" y="671" font-size="15.5" text-anchor="middle" fill="#6B7280">12 bytes plus hash-table overhead</text><text x="242" y="694" font-size="15.5" text-anchor="middle" fill="#94A3B8">about 32 MB for one million users</text><g filter="url(#rl2-soft)">
<rect x="442" y="432" width="356" height="178" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="442" y="432" width="6" height="178" fill="#4F46E5" clip-path="url(#rl2-k3)"/>
</g>
<circle cx="480" cy="460" r="18" fill="#FFFFFF"/>
<g transform="translate(469.56,449.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
<text x="506" y="467" font-size="18.5" font-weight="600" fill="#111827">Sliding window</text><text x="466" y="513" font-size="15.5" fill="#111827">UserID</text><text x="774" y="513" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes, the key</text><line x1="456" y1="524" x2="784" y2="524" stroke="#A5B4FC" stroke-width="1"/><text x="466" y="549" font-size="15.5" fill="#111827">Timestamps</text><text x="774" y="549" font-size="15.5" text-anchor="end" fill="#6B7280">Redis Sorted Set</text><line x1="456" y1="560" x2="784" y2="560" stroke="#A5B4FC" stroke-width="1"/><text x="466" y="585" font-size="15.5" fill="#111827">Each entry</text><text x="774" y="585" font-size="15.5" text-anchor="end" fill="#6B7280">4-byte epoch time</text><text x="620" y="635" font-size="15.5" text-anchor="middle" fill="#6B7280">one entry per request in the window</text><text x="620" y="658" font-size="15.5" text-anchor="middle" fill="#94A3B8">about 12 KB at 500 requests per hour</text><g filter="url(#rl2-soft)">
<rect x="820" y="432" width="356" height="214" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<rect x="820" y="432" width="6" height="214" fill="#059669" clip-path="url(#rl2-k4)"/>
</g>
<circle cx="858" cy="460" r="18" fill="#FFFFFF"/>
<g transform="translate(847.56,449.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></g>
<text x="884" y="467" font-size="18.5" font-weight="600" fill="#111827">Sliding window with counters</text><text x="844" y="513" font-size="15.5" fill="#111827">UserID</text><text x="1152" y="513" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes, the key</text><line x1="834" y1="524" x2="1162" y2="524" stroke="#6EE7B7" stroke-width="1"/><text x="844" y="549" font-size="15.5" fill="#111827">Counters</text><text x="1152" y="549" font-size="15.5" text-anchor="end" fill="#6B7280">Redis Hash</text><line x1="834" y1="560" x2="1162" y2="560" stroke="#6EE7B7" stroke-width="1"/><text x="844" y="585" font-size="15.5" fill="#111827">Minute</text><text x="1152" y="585" font-size="15.5" text-anchor="end" fill="#6B7280">4-byte epoch time</text><line x1="834" y1="596" x2="1162" y2="596" stroke="#6EE7B7" stroke-width="1"/><text x="844" y="621" font-size="15.5" fill="#111827">Count</text><text x="1152" y="621" font-size="15.5" text-anchor="end" fill="#6B7280">2 bytes each</text><text x="998" y="671" font-size="15.5" text-anchor="middle" fill="#6B7280">at most 60 minute counters</text><text x="998" y="694" font-size="15.5" text-anchor="middle" fill="#94A3B8">about 1.6 KB per user</text><rect x="40" y="750" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="776" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/><text x="164" y="798" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">One shape per user</text><text x="288" y="798" font-size="15.5" fill="#475569">the limiter keeps one of the three record shapes per user, chosen with the algorithm in step 6</text><rect x="64" y="820" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="842" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Shape decides memory</text><text x="288" y="842" font-size="15.5" fill="#475569">the shape sets the step 2 estimate, about 32 MB with a counter to about 12 GB with a full log</text>
</svg>