<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" style="background-color:#ffffff">
<defs>
<marker id="ita" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#3a6fb0"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="28" font-size="13.5" font-weight="bold">The caller writes one simple loop. The iterator deals with the shape underneath.</text>

<rect x="30" y="48" width="260" height="110" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="160" y="72" text-anchor="middle" font-weight="bold" font-size="12.5">The caller</text>
<text x="46" y="98" font-family="monospace" font-size="11.5">while (it.hasNext()) {</text>
<text x="46" y="116" font-family="monospace" font-size="11.5">    print(it.next());</text>
<text x="46" y="134" font-family="monospace" font-size="11.5">}</text>
<text x="160" y="152" text-anchor="middle" font-size="11" fill="#414d60">no index, no page, no size</text>

<rect x="360" y="60" width="220" height="86" rx="4" fill="#dcefe4" stroke="#2f7a55" stroke-width="2"/>
<text x="470" y="86" text-anchor="middle" font-weight="bold" font-size="12.5">SearchResultIterator</text>
<text x="470" y="108" text-anchor="middle" font-size="11.5" fill="#2f7a55">keeps the position</text>
<text x="470" y="126" text-anchor="middle" font-size="11.5" fill="#2f7a55">fetches a page when it runs out</text>

<rect x="660" y="60" width="270" height="86" rx="4" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="795" y="86" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#414d60">SearchApi</text>
<text x="795" y="108" text-anchor="middle" font-size="11.5" fill="#6b7789">returns 2 results at a time</text>
<text x="795" y="126" text-anchor="middle" font-size="11.5" fill="#6b7789">and nothing else</text>

<path d="M 294 103 L 355 103" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#ita)"/>
<path d="M 584 103 L 655 103" stroke="#3a6fb0" fill="none" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ita)"/>
<text x="590" y="54" font-size="10.5" fill="#414d60">only when needed</text>

<text x="30" y="196" font-size="13" font-weight="bold" fill="#414d60">What the loop sees, against what actually happens</text>

<rect x="30" y="212" width="300" height="150" rx="4" fill="#ffffff" stroke="#c3cfe0"/>
<text x="46" y="234" font-size="11.5" font-weight="bold" fill="#414d60">the caller sees</text>
<text x="46" y="256" font-family="monospace" font-size="11.5">result-1</text>
<text x="46" y="274" font-family="monospace" font-size="11.5">result-2</text>
<text x="46" y="292" font-family="monospace" font-size="11.5">result-3</text>
<text x="46" y="310" font-family="monospace" font-size="11.5">result-4</text>
<text x="46" y="328" font-family="monospace" font-size="11.5">result-5</text>
<text x="46" y="350" font-size="11" fill="#2f7a55">five items, one at a time</text>

<rect x="360" y="212" width="330" height="150" rx="4" fill="#f6ecd6" stroke="#8a5f10"/>
<text x="376" y="234" font-size="11.5" font-weight="bold" fill="#8a5f10">what actually happens</text>
<text x="376" y="256" font-family="monospace" font-size="11.5">fetch page 1</text>
<text x="376" y="274" font-family="monospace" font-size="11.5">fetch page 2</text>
<text x="376" y="292" font-family="monospace" font-size="11.5">fetch page 3</text>
<text x="376" y="310" font-family="monospace" font-size="11.5">fetch page 4  (empty)</text>
<text x="376" y="332" font-size="11" fill="#8a5f10">four network calls, and the last one</text>
<text x="376" y="348" font-size="11" fill="#8a5f10">exists only to discover the end</text>

<text x="716" y="240" font-size="12" fill="#414d60">This is the pattern working, and</text>
<text x="716" y="258" font-size="12" fill="#414d60">the pattern&#39;s risk, in one picture.</text>
<text x="716" y="286" font-size="12" fill="#b4322c">A loop that looks free can be</text>
<text x="716" y="304" font-size="12" fill="#b4322c">making a network call per turn.</text>
<text x="716" y="332" font-size="12" fill="#414d60">Hide the shape, not the cost.</text>
</g>
</svg>