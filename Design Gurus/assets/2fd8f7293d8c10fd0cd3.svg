<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="818" viewBox="0 0 1240 818" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="selffail-title selffail-desc">
<title id="selffail-title">The failures worth recognizing</title>
<desc id="selffail-desc">Patterns of weakness are more useful to know than patterns of strength, because they are correctable and they repeat.</desc>
<defs>
<marker id="selffail-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="selffail-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="selffail-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="selffail-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="818" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The failures worth recognizing</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Patterns of weakness are more useful to know than patterns of strength.</text>
<rect x="40" y="740" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="740" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="300" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The completeness reflex</text>
<rect x="350" y="118" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">adding components because a</text><text x="370" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reference architecture has them</text>
<rect x="720" y="118" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="740" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">can you say what each one does for this</text><text x="740" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">product, without using the word scalability</text>
<rect x="40" y="190" width="300" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The single-answer habit</text>
<rect x="350" y="190" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">presenting each decision</text><text x="370" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">as the obvious one</text>
<rect x="720" y="190" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="740" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">usually alternatives considered and not</text><text x="740" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">written down, so the fix is mechanical</text>
<rect x="40" y="262" width="300" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Optimism about failure</text>
<rect x="350" y="262" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the working path thorough,</text><text x="370" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the broken path brief</text>
<rect x="720" y="262" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="740" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">recognizable when failure appears once,</text><text x="740" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">at the end, as a section</text>
<rect x="40" y="334" width="300" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="190" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cost blindness</text>
<rect x="350" y="334" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">treating cost as a column</text><text x="370" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that belongs to somebody else</text>
<rect x="720" y="334" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="740" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the giveaway is a design with no</text><text x="740" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">number in it anywhere</text>
<rect x="40" y="406" width="300" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="190" y="428.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Operability as an</text><text x="190" y="455.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">afterthought</text>
<rect x="350" y="406" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">monitoring mentioned,</text><text x="370" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">debuggability absent</text>
<rect x="720" y="406" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="740" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one tells you something is wrong,</text><text x="740" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the other tells you what</text>
<rect x="40" y="478" width="300" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="514" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scale anticipation</text>
<rect x="350" y="478" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="501.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">building for traffic</text><text x="370" y="526.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that has not arrived</text>
<rect x="720" y="478" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="740" y="501.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most expensive, and the one most</text><text x="740" y="526.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">associated with experienced engineers</text>
<rect x="40" y="550" width="300" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="572.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Rigidity, and its</text><text x="190" y="599.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">opposite</text>
<rect x="350" y="550" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="573.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">defending a wrong position,</text><text x="370" y="598.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">or abandoning a correct one</text>
<rect x="720" y="550" width="480" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="740" y="586" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">both are failures of the same judgment</text>
<rect x="40" y="634" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="634" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="665.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Reading your three answers for these seven, rather than for correctness,</text><text x="64" y="694.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">is the more productive review</text>
<text x="66" y="774" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Correctness you can look up. These you have to notice.</text>
</svg>