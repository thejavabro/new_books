<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="508" viewBox="0 0 1240 508" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One million idle clients become one million open connections held on your servers. Each one costs memory for its buffers, one file descriptor, and a slot in the connection table, whether the client is busy or idle. Two settings must be changed first: the open file limit on the server, and the idle timeout on the load balancer.">
  <rect x="0" y="0" width="1240" height="508" fill="#FFFFFF"/>
  <defs>
    <marker id="rtd5-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rtd5-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rtd5-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rtd5-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rtd5-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rtd5-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rtd5-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rtd5-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rtd5-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">An idle connection is not a free connection</text>
  <g filter="url(#rtd5-soft)"><rect x="24" y="90" width="292" height="152" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="170" y="146" font-size="34" font-weight="700" fill="#1E40AF" text-anchor="middle">1,000,000</text>
  <text x="170" y="182" font-size="20" fill="#0F172A" text-anchor="middle">idle clients</text>
  <text x="170" y="212" font-size="18" fill="#64748B" text-anchor="middle">connected, sending nothing</text>
  <line x1="322" y1="166" x2="414" y2="166" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#rtd5-s)"/>
  <g filter="url(#rtd5-soft)"><rect x="424" y="90" width="292" height="152" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="570" y="146" font-size="34" font-weight="700" fill="#6D28D9" text-anchor="middle">1,000,000</text>
  <text x="570" y="182" font-size="20" fill="#0F172A" text-anchor="middle">open connections</text>
  <text x="570" y="212" font-size="18" fill="#64748B" text-anchor="middle">held on your servers</text>
  <line x1="722" y1="166" x2="814" y2="166" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#rtd5-s)"/>
  <g filter="url(#rtd5-soft)"><rect x="824" y="90" width="392" height="152" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="1020" y="126" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Each one holds</text>
  <text x="852" y="164" font-size="19" fill="#64748B" text-anchor="start">•</text>
  <text x="876" y="164" font-size="19" fill="#0F172A" text-anchor="start">memory for its buffers</text>
  <text x="852" y="194" font-size="19" fill="#64748B" text-anchor="start">•</text>
  <text x="876" y="194" font-size="19" fill="#0F172A" text-anchor="start">one file descriptor</text>
  <text x="852" y="224" font-size="19" fill="#64748B" text-anchor="start">•</text>
  <text x="876" y="224" font-size="19" fill="#0F172A" text-anchor="start">a slot in the connection table</text>
  <text x="620" y="282" font-size="19" fill="#64748B" text-anchor="middle">The cost is the same whether the client is busy or completely idle.</text>
  <g filter="url(#rtd5-soft)"><rect x="24" y="306" width="588" height="156" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="318" y="344" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Raise the limit on the server</text>
  <text x="318" y="382" font-size="19" fill="#0F172A" text-anchor="middle">A process often starts with a limit of</text>
  <text x="318" y="410" font-size="19" fill="#0F172A" text-anchor="middle">about 1,024 open files. Every open</text>
  <text x="318" y="438" font-size="19" fill="#0F172A" text-anchor="middle">connection uses one of them.</text>
  <g filter="url(#rtd5-soft)"><rect x="628" y="306" width="588" height="156" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="922" y="344" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Configure the load balancer</text>
  <text x="922" y="382" font-size="19" fill="#0F172A" text-anchor="middle">It closes silent connections after a</text>
  <text x="922" y="410" font-size="19" fill="#0F172A" text-anchor="middle">short time, often 60 seconds. Raise</text>
  <text x="922" y="438" font-size="19" fill="#0F172A" text-anchor="middle">the timeout or send a keep-alive.</text>
</svg>