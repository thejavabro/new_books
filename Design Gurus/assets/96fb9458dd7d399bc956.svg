<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="791" viewBox="0 0 1240 791" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="trap-title trap-desc">
<title id="trap-title">The over-engineering trap</title>
<desc id="trap-desc">Putting application data in a coordination store, or running consensus inside an application service. The documented limits of the tools are the clearest statement that they are coordination stores rather than databases.</desc>
<defs>
<marker id="trap-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="trap-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="trap-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="trap-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="791" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The over-engineering trap</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The trap has a recognizable shape: a design that puts application data into a coordination system.</text>
<rect x="40" y="713" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="713" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="130" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V242A6 6 0 0 0 46 248H54Z" fill="#F3CF6A"/><text x="620" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="middle">etcd's own documented limits are the clearest argument</text>
<rect x="90" y="174" width="340" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="260" y="194.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">1.5 MiB</text><text x="260" y="221.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">maximum request</text>
<rect x="460" y="174" width="340" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="630" y="194.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">2 GiB</text><text x="630" y="221.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">default storage quota</text>
<rect x="830" y="174" width="340" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1000" y="194.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">8 GiB</text><text x="1000" y="221.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">suggested maximum</text>
<rect x="40" y="264" width="1160" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="293" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A system designed to hold your orders would not ship with a two gigabyte default</text>
<text x="40" y="348" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three more reasons the trap is expensive</text>
<rect x="40" y="366" width="440" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="260" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Every write is a majority round trip</text>
<path d="M486 392H520" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M486 392H520" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trap-marker-red)"/>
<rect x="530" y="366" width="670" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="398" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">thousands of writes a second, not hundreds of thousands</text>
<rect x="40" y="426" width="440" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="260" y="458" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Losing quorum stops writes</text>
<path d="M486 452H520" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M486 452H520" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trap-marker-red)"/>
<rect x="530" y="426" width="670" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="458" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you have converted a degradation into an outage</text>
<rect x="40" y="486" width="440" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="260" y="518" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">You now operate it</text>
<path d="M486 512H520" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M486 512H520" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trap-marker-red)"/>
<rect x="530" y="486" width="670" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="518" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">quorum sizing, disk latency, upgrades, and an unrehearsed restore</text>
<text x="40" y="578" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Phrases to recognize in your own designs</text>
<rect x="40" y="596" width="372" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="616.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"etcd as our</text><text x="226" y="643.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">source of truth"</text>
<rect x="434" y="596" width="372" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="616.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"run Raft inside</text><text x="620" y="643.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the service"</text>
<rect x="828" y="596" width="372" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="616.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"strong consistency,</text><text x="1014" y="643.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">so consensus"</text>
<text x="1010" y="682" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">the most common, and the least examined</text>
<text x="66" y="745" font-size="18" font-weight="400" fill="#080C50" text-anchor="start">A single-primary database already gives strong consistency for its own data, which is what the requirement usually meant.</text>
</svg>