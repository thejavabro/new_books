<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="512" viewBox="0 0 1240 512" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three clients send their requests to one load balancer. The load balancer forwards each request to one of four servers. Server 3 is not answering its health checks, so it receives no traffic.">
  <rect x="0" y="0" width="1240" height="512" fill="#FFFFFF"/>
  <defs>
    <marker id="lb1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lb1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lb1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lb1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lb1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lb1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lb1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lb1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Every request arrives at the load balancer, which picks a healthy server</text>
  <g filter="url(#lb1-soft)"><rect x="60" y="110" width="150" height="60" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="135" y="147" font-size="19" fill="#0F172A" text-anchor="middle">client 1</text>
  <line x1="214" y1="140" x2="396" y2="226" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lb1-s)"/>
  <g filter="url(#lb1-soft)"><rect x="60" y="190" width="150" height="60" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="135" y="227" font-size="19" fill="#0F172A" text-anchor="middle">client 2</text>
  <line x1="214" y1="220" x2="396" y2="226" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lb1-s)"/>
  <g filter="url(#lb1-soft)"><rect x="60" y="270" width="150" height="60" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="135" y="307" font-size="19" fill="#0F172A" text-anchor="middle">client 3</text>
  <line x1="214" y1="300" x2="396" y2="226" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lb1-s)"/>
  <g filter="url(#lb1-soft)"><rect x="400" y="170" width="200" height="112" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="500" y="216" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">load</text>
  <text x="500" y="246" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">balancer</text>
  <g filter="url(#lb1-soft)"><rect x="760" y="80" width="180" height="64" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="850" y="119" font-size="20" fill="#0F172A" text-anchor="middle">server 1</text>
  <line x1="604" y1="226" x2="754" y2="112" stroke="#059669" stroke-width="2.2" marker-end="url(#lb1-e)"/>
  <g filter="url(#lb1-soft)"><rect x="760" y="160" width="180" height="64" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="850" y="199" font-size="20" fill="#0F172A" text-anchor="middle">server 2</text>
  <line x1="604" y1="226" x2="754" y2="192" stroke="#059669" stroke-width="2.2" marker-end="url(#lb1-e)"/>
  <g filter="url(#lb1-soft)"><rect x="760" y="240" width="180" height="64" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/></g>
  <text x="850" y="279" font-size="20" fill="#B91C1C" text-anchor="middle">server 3</text>
  <line x1="604" y1="226" x2="754" y2="272" stroke="#CBD5E1" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#lb1-g)"/>
  <text x="960" y="270" font-size="18" fill="#B91C1C" text-anchor="start">not answering</text>
  <text x="960" y="296" font-size="18" fill="#B91C1C" text-anchor="start">the health check</text>
  <g filter="url(#lb1-soft)"><rect x="760" y="320" width="180" height="64" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="850" y="359" font-size="20" fill="#0F172A" text-anchor="middle">server 4</text>
  <line x1="604" y1="226" x2="754" y2="352" stroke="#059669" stroke-width="2.2" marker-end="url(#lb1-e)"/>
  <rect x="60" y="424" width="1120" height="56" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="460" font-size="20" fill="#64748B" text-anchor="middle">The client only knows the address of the load balancer. It never sees the servers behind it.</text>
</svg>