<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="628" viewBox="0 0 1240 628" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A weak entity becomes a table whose primary key is the owner key plus the partial key, with the owner key also acting as a foreign key">
<defs>
<marker id="rdb12-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="628" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="342" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Section 1 means nothing alone. Math 101 Section 1 is one specific thing.</text>

<rect x="90" y="100" width="170" height="56" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="175" y="134" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Course</text>
<text x="175" y="176" text-anchor="middle" font-size="14.5" fill="#6B7280">the owner entity</text>

<path d="M420,128 L486,92 L552,128 L486,164 Z" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
<path d="M420,128 L486,102 L552,128 L486,154 Z" fill="none" stroke="#059669" stroke-width="1.5"/>
<text x="486" y="133" text-anchor="middle" font-size="13.5" fill="#111827">has</text>
<text x="486" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">double diamond</text>

<rect x="712" y="94" width="200" height="68" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<rect x="720" y="102" width="184" height="52" rx="4" fill="none" stroke="#2563EB" stroke-width="1.5"/>
<text x="812" y="134" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">CourseSection</text>
<text x="812" y="182" text-anchor="middle" font-size="14.5" fill="#6B7280">double rectangle, the weak entity</text>

<g stroke="#059669" stroke-width="1.5" fill="none">
<path d="M260,128 H420"/>
<path d="M552,124 H712"/>
<path d="M552,132 H712"/>
</g>
<text x="340" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">1</text>
<text x="632" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">N</text>
<text x="632" y="160" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#F8FAFC" stroke-width="5" fill="#94A3B8">total participation</text>

<ellipse cx="1060" cy="128" rx="82" ry="24" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="1060" y="134" text-anchor="middle" font-size="14.5" font-weight="600" fill="#111827">section_number</text>
<path d="M996,148 H1124" stroke="#5B21B6" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M912,128 H978" stroke="#7C3AED" stroke-width="1.5" fill="none"/>
<text x="1060" y="182" text-anchor="middle" font-size="14.5" fill="#6B7280">dashed underline, the partial key</text>

<path d="M620,224 V264" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#rdb12-mslate)"/>
<text x="700" y="250" font-size="15.5" font-weight="600" paint-order="stroke" stroke="#F8FAFC" stroke-width="5" fill="#475569">becomes</text>

<text x="200" y="298" font-size="16.5" font-weight="600" fill="#111827">CourseSection</text>
<g stroke="#CBD5E1" stroke-width="1.2">
<rect x="200" y="310" width="180" height="38" fill="#D1FAE5"/>
<rect x="380" y="310" width="200" height="38" fill="#D1FAE5"/>
<rect x="580" y="310" width="230" height="38" fill="#E2E8F0"/>
<rect x="810" y="310" width="230" height="38" fill="#E2E8F0"/>
<rect x="200" y="348" width="180" height="38" fill="#ECFDF5"/>
<rect x="380" y="348" width="200" height="38" fill="#ECFDF5"/>
<rect x="580" y="348" width="230" height="38" fill="#FFFFFF"/>
<rect x="810" y="348" width="230" height="38" fill="#FFFFFF"/>
