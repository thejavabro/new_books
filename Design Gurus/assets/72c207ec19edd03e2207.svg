<g font-size="14.5" font-weight="600" fill="#047857">
<text x="214" y="335">course_id</text>
<text x="394" y="335">section_number</text>
</g>
<g font-size="14.5" font-weight="600" fill="#475569">
<text x="594" y="335">instructor</text>
<text x="824" y="335">meeting_time</text>
</g>
<g font-size="14.5" fill="#111827">
<text x="214" y="373">MATH101</text>
<text x="394" y="373">1</text>
<text x="594" y="373">Dr Menon</text>
<text x="824" y="373">Mon 10:00</text>
</g>

<rect x="40" y="416" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="442" width="260" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="194" y="464" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">composite primary key</text>
<text x="348" y="464" font-size="15.5" fill="#475569">course_id and section_number together, because neither identifies a row alone</text>
<rect x="64" y="486" width="260" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="194" y="508" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">foreign key, NOT NULL</text>
<text x="348" y="508" font-size="15.5" fill="#475569">course_id also references Course, and total participation makes it NOT NULL</text>
<rect x="64" y="530" width="260" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="194" y="552" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">ON DELETE CASCADE</text>
<text x="348" y="552" font-size="15.5" fill="#475569">existence dependency in SQL: remove the course and its sections go with it</text>
</svg>