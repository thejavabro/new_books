<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="wrong-title wrong-desc">
<title id="wrong-title">Where these estimates go wrong</title>
<desc id="wrong-desc">Five correctable mistakes account for most of the gap between an estimate and a bill, and all five share one cause: the estimate counts the thing being designed rather than everything that has to exist for it to run.</desc>
<defs>
<marker id="wrong-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="wrong-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="wrong-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="wrong-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="750" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where these estimates go wrong</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Five mistakes account for most of the gap between an estimate and a bill.</text>
<rect x="40" y="672" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="672" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Forgetting data transfer</text>
<path d="M536 148H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 148H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the largest and most common error, as the worked example shows</text>
<circle cx="60" cy="218" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="225" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="188" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Sizing from the average</text>
<path d="M536 218H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 218H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="188" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="224" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you pay for provisioned capacity, not consumed capacity</text>
<circle cx="60" cy="288" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="295" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="258" width="440" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Forgetting the storage multiplier</text>
<path d="M536 288H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 288H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="258" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="281.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">2 TB once in the estimate; replica, backups,</text><text x="590" y="306.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">snapshots and staging in reality</text>
<circle cx="60" cy="358" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="365" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="328" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="364" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Leaving out non-production</text>
<path d="M536 358H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 358H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="328" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="364" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sized by copying production, then never revisited</text>
<circle cx="60" cy="428" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="435" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="398" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="434" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ignoring the floor</text>
<path d="M536 428H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 428H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="398" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="421.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">twelve small services can cost more than</text><text x="590" y="446.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">three large ones at zero traffic</text>
<rect x="40" y="480" width="1160" height="72" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="480" width="5" height="72" rx="2.5" fill="#AC8BE8"/><text x="64" y="509" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The same pattern underneath all five</text><text x="64" y="535" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The estimate counts the thing being designed. The bill counts everything that has to exist.</text>
<rect x="40" y="574" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="574" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="601.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">So after producing a number, ask what is missing</text><text x="64" y="630.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">rather than whether the arithmetic is right.</text>
<text x="66" y="706" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The arithmetic is almost never where the error is.</text>
</svg>