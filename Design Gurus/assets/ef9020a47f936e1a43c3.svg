<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="562" viewBox="0 0 1240 562" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels with three replicas each. On the left W is two and R is two, so the write set and the read set must share at least one replica, and the read sees the new value. On the right W is one and R is one, so the two sets can be completely separate and the read can return the old value.">
  <rect x="0" y="0" width="1240" height="562" fill="#FFFFFF"/>
  <defs>
    <marker id="qm2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="qm2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="qm2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="qm2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="qm2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="qm2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="qm2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="qm2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="qm2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Why R + W greater than N guarantees an overlap</text>
  <rect x="24" y="70" width="588" height="424" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="106" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">R + W = 4, and 4 is more than 3</text>
  <text x="318" y="140" font-size="18" fill="#64748B" text-anchor="middle">the write waits for the replicas under this band</text>
  <rect x="73" y="156" width="320" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="233" y="186" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">W = 2</text>
  <g filter="url(#qm2-soft)"><rect x="73" y="218" width="150" height="92" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="148" y="252" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 1</text>
  <text x="148" y="282" font-size="18" fill="#64748B" text-anchor="middle">write only</text>
  <g filter="url(#qm2-soft)"><rect x="243" y="218" width="150" height="92" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2.6"/></g>
  <text x="318" y="252" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 2</text>
  <text x="318" y="282" font-size="18" fill="#065F46" text-anchor="middle">in both sets</text>
  <g filter="url(#qm2-soft)"><rect x="413" y="218" width="150" height="92" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="488" y="252" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 3</text>
  <text x="488" y="282" font-size="18" fill="#64748B" text-anchor="middle">read only</text>
  <rect x="243" y="336" width="320" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="403" y="366" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">R = 2</text>
  <text x="318" y="404" font-size="18" fill="#64748B" text-anchor="middle">the read waits for the replicas under this band</text>
  <text x="318" y="444" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 2 is in both sets, so the read sees the write.</text>
  <text x="318" y="472" font-size="19" fill="#64748B" text-anchor="middle">You cannot fit a 2 and a 2 into 3 without touching twice.</text>
  <rect x="628" y="70" width="588" height="424" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="106" font-size="22" font-weight="600" fill="#B91C1C" text-anchor="middle">R + W = 2, and 2 is not more than 3</text>
  <text x="922" y="140" font-size="18" fill="#64748B" text-anchor="middle">the write waits for the replicas under this band</text>
  <rect x="677" y="156" width="150" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="752" y="186" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">W = 1</text>
  <g filter="url(#qm2-soft)"><rect x="677" y="218" width="150" height="92" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="752" y="252" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 1</text>
  <text x="752" y="282" font-size="18" fill="#64748B" text-anchor="middle">write only</text>
  <g filter="url(#qm2-soft)"><rect x="847" y="218" width="150" height="92" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="922" y="252" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 2</text>
  <text x="922" y="282" font-size="18" fill="#64748B" text-anchor="middle">in neither set</text>
  <g filter="url(#qm2-soft)"><rect x="1017" y="218" width="150" height="92" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="1092" y="252" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 3</text>
  <text x="1092" y="282" font-size="18" fill="#64748B" text-anchor="middle">read only</text>
  <rect x="1017" y="336" width="150" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="1092" y="366" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">R = 1</text>
  <text x="922" y="404" font-size="18" fill="#64748B" text-anchor="middle">the read waits for the replicas under this band</text>
  <text x="922" y="444" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The two sets share nothing, so the read can miss the write.</text>
  <text x="922" y="472" font-size="19" fill="#64748B" text-anchor="middle">Replica 3 still holds the old value and nobody notices.</text>
  <text x="620" y="530" font-size="19" fill="#64748B" text-anchor="middle">The overlap is only about counting. With W plus R replies over N replicas, at least one replica is counted twice.</text>
</svg>