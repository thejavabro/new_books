<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="options-title options-desc">
<title id="options-title">The three options, four questions each</title>
<desc id="options-desc">Read replicas fix read CPU but add lag and more connections and take a quarter. Sharding fixes nothing within a quarter and permanently multiplies operational work on a database far below the thresholds. Caching can remove most read volume but adds staleness and a synchronized expiry burst, and takes a day or two.</desc>
<defs>
<marker id="options-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="options-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="options-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="options-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="702" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The three options, four questions each</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Take each one seriously, including the one you expect to reject.</text>
<rect x="40" y="624" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="624" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="310" y="146" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">What it fixes</text>
<text x="526" y="146" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">What it creates</text>
<text x="742" y="146" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">Measure first</text>
<text x="998" y="146" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">Takes effect</text>
<rect x="40" y="170" width="1160" height="104" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 170H46A6 6 0 0 0 40 176V268A6 6 0 0 0 46 274H54Z" fill="#5EC9EC"/>
<rect x="56" y="186" width="224" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="168" y="228" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A. Read replicas</text>
<text x="310" y="204" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">read CPU, in</text><text x="310" y="229" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">proportion to the</text><text x="310" y="254" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">share that is reads</text>
<text x="526" y="204" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">replica lag, and</text><text x="526" y="229" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">MORE connections</text><text x="526" y="254" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">not fewer</text>
<text x="742" y="204" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">read share, staleness</text><text x="742" y="229" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">tolerance, connection</text><text x="742" y="254" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">count</text>
<text x="998" y="229" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a quarter</text>
<rect x="40" y="290" width="1160" height="104" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 290H46A6 6 0 0 0 40 296V388A6 6 0 0 0 46 394H54Z" fill="#F28B9D"/>
<rect x="56" y="306" width="224" height="72" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="168" y="334.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">B. Shard by</text><text x="168" y="361.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">account_id</text>
<text x="310" y="336.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">nothing within</text><text x="310" y="361.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the next quarter</text>
<text x="526" y="324" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">permanent N-times</text><text x="526" y="349" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">operational work,</text><text x="526" y="374" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">cross-shard queries</text>
<text x="742" y="324" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the pre-sharding</text><text x="742" y="349" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">checklist; 340 GB is</text><text x="742" y="374" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">far below threshold</text>
<text x="998" y="336.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a quarter,</text><text x="998" y="361.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">at best</text>
<rect x="40" y="410" width="1160" height="104" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 410H46A6 6 0 0 0 40 416V508A6 6 0 0 0 46 514H54Z" fill="#39D5AA"/>
<rect x="56" y="426" width="224" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="168" y="468" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">C. Cache hot keys</text>
<text x="310" y="444" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">most read volume,</text><text x="310" y="469" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">IF the 5/80 claim</text><text x="310" y="494" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">is real</text>
<text x="526" y="444" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">staleness, and a</text><text x="526" y="469" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">synchronized expiry</text><text x="526" y="494" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">burst</text>
<text x="742" y="444" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">whether 5/80 was</text><text x="742" y="469" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">measured, and if expiry</text><text x="742" y="494" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">can be spread out</text>
<text x="998" y="469" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a day or two</text>
<rect x="40" y="538" width="1160" height="60" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="538" width="5" height="60" rx="2.5" fill="#F3CF6A"/><text x="64" y="574" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">Not one of the three takes effect tonight, and the column that matters most is the last one.</text>
<text x="66" y="658" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Work the option you expect to reject as carefully as the one you prefer. The reasoning is what matters.</text>
</svg>