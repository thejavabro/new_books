<text x="620" y="736" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Keep one set of seen digits per row, per column and per box</text>
<text x="620" y="768" text-anchor="middle" font-size="18.5" fill="#475569">Then each cell is three lookups and three inserts, and the board is read once</text>
