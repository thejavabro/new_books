<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1194" viewBox="0 0 1240 1194" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven ordered checks for every request: is a credential present, is it valid, is it withdrawn, which caller and tenant does it identify, does it carry the required scope, does the resource belong to that owner or tenant, and does current policy allow the action.">
  <defs>
    <marker id="p19-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p19-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p19-k1"><rect x="320" y="174" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p19-k2"><rect x="320" y="298" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p19-k3"><rect x="320" y="422" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p19-k4"><rect x="320" y="546" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p19-k5"><rect x="320" y="712" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p19-k6"><rect x="320" y="836" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p19-k7"><rect x="320" y="960" width="600" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1194" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Seven checks, in this order, on every request</text>

  
  <rect x="40" y="126" width="1160" height="514" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Checks 1 to 4, the credential and who it identifies</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four checks</text>

  
  <rect x="40" y="664" width="1160" height="390" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="694" font-size="16.5" font-weight="600" fill="#5B21B6">Checks 5 to 7, whether this action on this resource is allowed</text>
  <text x="1176" y="694" text-anchor="end" font-size="15.5" fill="#6B7280">three checks</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,262 V298" marker-end="url(#p19-sl)"/>
    <path d="M620,386 V422" marker-end="url(#p19-sl)"/>
    <path d="M620,510 V546" marker-end="url(#p19-sl)"/>
    <path d="M620,800 V836" marker-end="url(#p19-sl)"/>
    <path d="M620,924 V960" marker-end="url(#p19-sl)"/>
  </g>

  
  <g filter="url(#p19-soft)">
    <rect x="320" y="174" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="174" width="6" height="48" fill="#2563EB" clip-path="url(#p19-k1)"/>
  </g>
  <circle cx="354" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,189) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="378" y="205" font-size="18.5" font-weight="600" fill="#111827">1. Is a credential present in Authorization?</text>
  <text x="620" y="246" text-anchor="middle" font-size="15.5" fill="#6B7280">Never in a query parameter, which logs and referrers record.</text>

  
  <g filter="url(#p19-soft)">
    <rect x="320" y="298" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="298" width="6" height="48" fill="#2563EB" clip-path="url(#p19-k2)"/>
  </g>
  <circle cx="354" cy="322" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,313) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="378" y="329" font-size="18.5" font-weight="600" fill="#111827">2. Is it valid and unexpired?</text>
  <text x="620" y="370" text-anchor="middle" font-size="15.5" fill="#6B7280">A signature or lookup decides this.</text>

  
  <g filter="url(#p19-soft)">
    <rect x="320" y="422" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="422" width="6" height="48" fill="#2563EB" clip-path="url(#p19-k3)"/>
  </g>
  <circle cx="354" cy="446" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,437) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="378" y="453" font-size="18.5" font-weight="600" fill="#111827">3. Has it been withdrawn?</text>
  <text x="620" y="494" text-anchor="middle" font-size="15.5" fill="#6B7280">The cost of this check differs by credential type.</text>

  
  <g filter="url(#p19-soft)">
    <rect x="320" y="546" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="546" width="6" height="48" fill="#2563EB" clip-path="url(#p19-k4)"/>
  </g>
  <circle cx="354" cy="570" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,561) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="378" y="577" font-size="18.5" font-weight="600" fill="#111827">4. Which caller and tenant does it identify?</text>
  <text x="620" y="618" text-anchor="middle" font-size="15.5" fill="#6B7280">Trusted context, not caller-supplied input.</text>

  
  <g filter="url(#p19-soft)">
    <rect x="320" y="712" width="600" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="320" y="712" width="6" height="48" fill="#7C3AED" clip-path="url(#p19-k5)"/>
  </g>
  <circle cx="354" cy="736" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,727) scale(0.75)" fill="none" stroke="#7C3AED" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="378" y="743" font-size="18.5" font-weight="600" fill="#111827">5. Does it carry the required scope?</text>
  <text x="620" y="784" text-anchor="middle" font-size="15.5" fill="#6B7280">A verb on a resource, such as payments:create.</text>

  
  <g filter="url(#p19-soft)">
    <rect x="320" y="836" width="600" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="320" y="836" width="6" height="48" fill="#7C3AED" clip-path="url(#p19-k6)"/>
  </g>
  <circle cx="354" cy="860" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,851) scale(0.75)" fill="none" stroke="#7C3AED" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="378" y="867" font-size="18.5" font-weight="600" fill="#111827">6. Does the resource belong to that owner or tenant?</text>
  <text x="620" y="908" text-anchor="middle" font-size="15.5" fill="#6B7280">An opaque id is not permission.</text>

  
  <g filter="url(#p19-soft)">
    <rect x="320" y="960" width="600" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="320" y="960" width="6" height="48" fill="#7C3AED" clip-path="url(#p19-k7)"/>
  </g>
  <circle cx="354" cy="984" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,975) scale(0.75)" fill="none" stroke="#7C3AED" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="378" y="991" font-size="18.5" font-weight="600" fill="#111827">7. Does current policy allow the action?</text>
  <text x="620" y="1032" text-anchor="middle" font-size="15.5" fill="#6B7280">Refundable, enabled, above a threshold, and so on.</text>

  
  <rect x="40" y="1078" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1123" text-anchor="middle" font-size="16" fill="#475569">Do not reveal which private resource exists while answering these checks.</text>
</svg>