<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="844" viewBox="0 0 1240 844" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="dns-title dns-desc">
<title id="dns-title">Why DNS is a slow switch</title>
<desc id="dns-desc">Resolvers and clients cache beyond the stated time to live and open connections never re-resolve, so DNS failover leaves traffic arriving at a dead region long afterwards. It is a coarse control rather than a fast switch.</desc>
<defs>
<marker id="dns-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="dns-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="dns-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="dns-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="844" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why DNS is a slow switch</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The common design points a hostname at one region and changes the record to fail over.</text>
<rect x="40" y="766" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="766" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#F3CF6A"/><text x="64" y="155" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The time to live on a record is a request, not a contract.</text>
<rect x="40" y="192" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="228" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Resolvers cache past it</text>
<path d="M526 222H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 222H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dns-marker-red)"/>
<rect x="570" y="192" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="228" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and some impose their own minimum</text>
<rect x="40" y="264" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="300" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Clients cache independently</text>
<path d="M526 294H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 294H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dns-marker-red)"/>
<rect x="570" y="264" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="287.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">browsers and runtimes keep their own expiry,</text><text x="590" y="312.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which the record does not control</text>
<rect x="40" y="336" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="372" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Open connections never re-resolve</text>
<path d="M526 366H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 366H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dns-marker-red)"/>
<rect x="570" y="336" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="359.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a live connection to the failed region is used</text><text x="590" y="384.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">until something closes it</text>
<defs><clipPath id="clip-40-412"><rect x="40" y="412" width="1160" height="38" rx="10"/></clipPath></defs><rect x="40" y="412" width="1160" height="38" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="40.0" y="412" width="751.9" height="38" fill="#06AC80" clip-path="url(#clip-40-412)"/><rect x="791.9" y="412" width="408.1" height="38" fill="#F25461" clip-path="url(#clip-40-412)"/><rect x="40" y="412" width="1160" height="38" rx="10" fill="none" stroke="#5EC9EC" stroke-width="2"/>
<text x="40" y="472" font-size="19" font-weight="700" fill="#169B77" text-anchor="start">most traffic moves within minutes</text>
<text x="792" y="472" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">a tail keeps hitting the dead region</text>
<text x="40" y="518" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The faster mechanisms work differently</text>
<rect x="40" y="536" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="572" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Anycast</text>
<path d="M526 566H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 566H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dns-marker-green)"/>
<rect x="570" y="536" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="559.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the address stays the same and routing changes,</text><text x="590" y="584.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so no client learns anything</text>
<rect x="40" y="608" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="644" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A global load balancer</text>
<path d="M526 638H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 638H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dns-marker-green)"/>
<rect x="570" y="608" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="631.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">terminates connections and moves traffic</text><text x="590" y="656.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">without the client re-resolving</text>
<rect x="40" y="680" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="716" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Client-side awareness</text>
<path d="M526 710H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 710H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dns-marker-green)"/>
<rect x="570" y="680" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="703.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the client knows several endpoints and retries;</text><text x="590" y="728.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">fastest, and you must own the client</text>
<text x="66" y="800" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">That tail matters because it is experiencing a total outage rather than a degraded service.</text>
</svg>