<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="842" viewBox="0 0 1240 842" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="healthchecks-title healthchecks-desc">
<title id="healthchecks-title">Health checks that cause the outage</title>
<desc id="healthchecks-desc">A deep check verifies dependencies that every instance shares, so a blip fails every check at once and the fleet is removed entirely. The safety mechanism converts a degradation into a complete outage.</desc>
<defs>
<marker id="healthchecks-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="healthchecks-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="healthchecks-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="healthchecks-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="842" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Health checks that cause the outage</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Health checks decide what is removed from service.</text>
<rect x="40" y="764" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="764" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="188" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V300A6 6 0 0 0 46 306H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Shallow</text>
<rect x="72" y="174" width="496" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the process is alive and answering</text>
<rect x="72" y="240" width="496" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="261.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stable, and misses real failures:</text><text x="92" y="286.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a process can answer and do no work</text>
<rect x="640" y="118" width="560" height="188" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V300A6 6 0 0 0 646 306H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Deep</text>
<rect x="672" y="174" width="496" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the dependencies are reachable</text>
<rect x="672" y="240" width="496" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="261.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">catches real failures, and every</text><text x="692" y="286.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">instance shares those dependencies</text>
<text x="40" y="344" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Which produces the dangerous sequence</text>
<circle cx="64" cy="384" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="64" y="391" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="96" y="360" width="1104" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="648" y="390" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a shared dependency slows down</text>
<circle cx="64" cy="440" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="64" y="447" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="96" y="416" width="1104" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="648" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every instance fails its check at the same moment</text>
<circle cx="64" cy="496" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="64" y="503" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="96" y="472" width="1104" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="648" y="502" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the load balancer removes the entire fleet</text>
<circle cx="64" cy="552" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="64" y="559" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="96" y="528" width="1104" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="648" y="558" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a degradation has become a total outage</text>
<rect x="40" y="592" width="560" height="146" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="592" width="5" height="146" rx="2.5" fill="#39D5AA"/><text x="64" y="619" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The protection is a rule</text><text x="64" y="645" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">in the thing doing the removing</text><text x="64" y="671" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">When far too large a fraction reports</text><text x="64" y="697" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">unhealthy, stop removing instances</text><text x="64" y="723" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and send traffic to all of them.</text>
<rect x="640" y="592" width="560" height="146" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="592" width="5" height="146" rx="2.5" fill="#AC8BE8"/><text x="664" y="619" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Keep the check that governs</text><text x="664" y="645" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">removal shallow.</text><text x="664" y="671" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Put deep checks somewhere</text><text x="664" y="697" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">that alerts a human rather</text><text x="664" y="723" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">than moving traffic.</text>
<text x="66" y="798" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">If everything is unhealthy, the likeliest explanation is the check rather than the fleet.</text>
</svg>