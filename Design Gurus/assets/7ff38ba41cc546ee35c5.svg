<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The routing layer over three phases: at first all traffic reaches the monolith, then one capability&#39;s routes move to an extracted service, and finally most routes reach services with a smaller monolith remaining">
  <defs>
    <marker id="m02-l04-routing-phases-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m02-l04-routing-phases-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="1020" fill="#FFFFFF"/>

  
  <rect x="40" y="60" width="1160" height="170" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="98" font-size="20" font-weight="600" fill="#334155">Before: everything hits the monolith</text>
  <path d="M330,165 L616,165" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m02-l04-routing-phases-bl)"/>
  <text x="473" y="152" font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">100% of traffic</text>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="90" y="125" width="240" height="80" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="210" y="172" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Routing layer</text>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="620" y="125" width="300" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="770" y="160" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Monolith</text>
  <text x="770" y="190" text-anchor="middle" font-size="20" fill="#64748B">all capabilities inside</text>

  
  <rect x="40" y="270" width="1160" height="270" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="308" font-size="20" font-weight="600" fill="#334155">During: one capability moved</text>
  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M330,395 L616,370" marker-end="url(#m02-l04-routing-phases-bl)"/>
    <path d="M330,425 C470,425 490,460 616,460" marker-end="url(#m02-l04-routing-phases-bl)"/>
  </g>
  <text x="473" y="355" font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">everything else</text>
  <text x="473" y="510" font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one capability's routes</text>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="90" y="370" width="240" height="80" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="210" y="417" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Routing layer</text>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="620" y="330" width="300" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="770" y="365" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Monolith</text>
  <text x="770" y="395" text-anchor="middle" font-size="20" fill="#64748B">keeps running</text>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="620" y="420" width="320" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="780" y="455" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Extracted service</text>
  <text x="780" y="485" text-anchor="middle" font-size="20" fill="#64748B">own database</text>

  
  <rect x="40" y="580" width="1160" height="350" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="618" font-size="20" font-weight="600" fill="#334155">After: the monolith shrinks or retires</text>
  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M330,735 C470,735 490,665 616,665" marker-end="url(#m02-l04-routing-phases-bl)"/>
    <path d="M330,760 L616,755" marker-end="url(#m02-l04-routing-phases-bl)"/>
    <path d="M330,785 C470,785 490,855 616,855" marker-end="url(#m02-l04-routing-phases-bl)"/>
  </g>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="90" y="720" width="240" height="80" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="210" y="767" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Routing layer</text>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="620" y="630" width="250" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="745" y="672" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service A</text>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="620" y="720" width="250" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="745" y="762" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service B</text>
  <g filter="url(#m02-l04-routing-phases-soft)">
    <rect x="620" y="810" width="330" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="785" y="848" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Smaller monolith</text>
  <text x="785" y="878" text-anchor="middle" font-size="20" fill="#64748B">a fine end state</text>

  
  <line x1="40" y1="975" x2="74" y2="975" stroke="#3B82F6" stroke-width="4"/>
  <text x="84" y="982" font-size="20" fill="#475569">One capability at a time: ship, stabilize, observe, repeat</text>
</svg>