<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="934" viewBox="0 0 1240 934" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A REST gateway in front of internal gRPC services maps meaning rather than numbers. Most status mappings are direct, but a REST 409 may become ALREADY_EXISTS, FAILED_PRECONDITION, or ABORTED depending on the condition.">
  <defs>
    <marker id="pa-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>

    <filter id="pa-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pa-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pa-k1"><rect x="100" y="198" width="170" height="48" rx="10"/></clipPath>
    <clipPath id="pa-k2"><rect x="100" y="266" width="170" height="48" rx="10"/></clipPath>
    <clipPath id="pa-k3"><rect x="100" y="334" width="170" height="48" rx="10"/></clipPath>
    <clipPath id="pa-k4"><rect x="100" y="402" width="170" height="48" rx="10"/></clipPath>
    <clipPath id="pa-k5"><rect x="100" y="470" width="170" height="48" rx="10"/></clipPath>

    <clipPath id="pa-r1"><rect x="330" y="198" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="pa-r2"><rect x="330" y="266" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="pa-r3"><rect x="330" y="334" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="pa-r4"><rect x="330" y="402" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="pa-r5"><rect x="330" y="470" width="340" height="48" rx="10"/></clipPath>

    <clipPath id="pa-k9"><rect x="100" y="641" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="pa-o1"><rect x="330" y="602" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="pa-o2"><rect x="330" y="662" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="pa-o3"><rect x="330" y="722" width="340" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="934" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">A gateway maps meaning, not numeric codes</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">six REST statuses, and what each one becomes inside</text>

  
  <text x="100" y="132" font-size="15.5" font-weight="600" fill="#94A3B8">Public REST</text>
  <text x="330" y="132" font-size="15.5" font-weight="600" fill="#94A3B8">Internal gRPC</text>
  <text x="710" y="132" font-size="15.5" font-weight="600" fill="#94A3B8">Note</text>

  
  <rect x="40" y="150" width="1160" height="390" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="180" font-size="16.5" font-weight="600" fill="#1D4ED8">Direct mappings</text>
  <text x="1172" y="180" text-anchor="end" font-size="15.5" fill="#6B7280">five statuses</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M270,222 H330" marker-end="url(#pa-bl)"/>
    <path d="M270,290 H330" marker-end="url(#pa-bl)"/>
    <path d="M270,358 H330" marker-end="url(#pa-bl)"/>
    <path d="M270,426 H330" marker-end="url(#pa-bl)"/>
    <path d="M270,494 H330" marker-end="url(#pa-bl)"/>
  </g>

  
  <g filter="url(#pa-soft)">
    <rect x="100" y="198" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="198" width="6" height="48" fill="#2563EB" clip-path="url(#pa-k1)"/>
  </g>
  <circle cx="134" cy="222" r="4.5" fill="#2563EB"/>
  <text x="158" y="229" font-size="18.5" font-weight="600" fill="#111827">400</text>
  <g filter="url(#pa-soft)">
    <rect x="330" y="198" width="340" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="330" y="198" width="6" height="48" fill="#DB2777" clip-path="url(#pa-r1)"/>
  </g>
  <circle cx="364" cy="222" r="4.5" fill="#DB2777"/>
  <text x="388" y="229" font-size="18.5" font-weight="600" fill="#111827">INVALID_ARGUMENT</text>
  <text x="710" y="228" font-size="15.5" fill="#6B7280">Direct</text>

  
  <g filter="url(#pa-soft)">
    <rect x="100" y="266" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="266" width="6" height="48" fill="#2563EB" clip-path="url(#pa-k2)"/>
  </g>
  <circle cx="134" cy="290" r="4.5" fill="#2563EB"/>
  <text x="158" y="297" font-size="18.5" font-weight="600" fill="#111827">401</text>
  <g filter="url(#pa-soft)">
    <rect x="330" y="266" width="340" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="330" y="266" width="6" height="48" fill="#DB2777" clip-path="url(#pa-r2)"/>
  </g>
  <circle cx="364" cy="290" r="4.5" fill="#DB2777"/>
  <text x="388" y="297" font-size="18.5" font-weight="600" fill="#111827">UNAUTHENTICATED</text>
  <text x="710" y="296" font-size="15.5" fill="#6B7280">Direct</text>

  
  <g filter="url(#pa-soft)">
    <rect x="100" y="334" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="334" width="6" height="48" fill="#2563EB" clip-path="url(#pa-k3)"/>
  </g>
  <circle cx="134" cy="358" r="4.5" fill="#2563EB"/>
  <text x="158" y="365" font-size="18.5" font-weight="600" fill="#111827">403</text>
  <g filter="url(#pa-soft)">
    <rect x="330" y="334" width="340" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="330" y="334" width="6" height="48" fill="#DB2777" clip-path="url(#pa-r3)"/>
  </g>
  <circle cx="364" cy="358" r="4.5" fill="#DB2777"/>
  <text x="388" y="365" font-size="18.5" font-weight="600" fill="#111827">PERMISSION_DENIED</text>
  <text x="710" y="364" font-size="15.5" fill="#6B7280">Direct</text>

  
  <g filter="url(#pa-soft)">
    <rect x="100" y="402" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="402" width="6" height="48" fill="#2563EB" clip-path="url(#pa-k4)"/>
  </g>
  <circle cx="134" cy="426" r="4.5" fill="#2563EB"/>
  <text x="158" y="433" font-size="18.5" font-weight="600" fill="#111827">404</text>
  <g filter="url(#pa-soft)">
    <rect x="330" y="402" width="340" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="330" y="402" width="6" height="48" fill="#DB2777" clip-path="url(#pa-r4)"/>
  </g>
  <circle cx="364" cy="426" r="4.5" fill="#DB2777"/>
  <text x="388" y="433" font-size="18.5" font-weight="600" fill="#111827">NOT_FOUND</text>
  <text x="710" y="432" font-size="15.5" fill="#6B7280">Direct</text>

  
  <g filter="url(#pa-soft)">
    <rect x="100" y="470" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="470" width="6" height="48" fill="#2563EB" clip-path="url(#pa-k5)"/>
  </g>
  <circle cx="134" cy="494" r="4.5" fill="#2563EB"/>
  <text x="158" y="501" font-size="18.5" font-weight="600" fill="#111827">429</text>
  <g filter="url(#pa-soft)">
    <rect x="330" y="470" width="340" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="330" y="470" width="6" height="48" fill="#D97706" clip-path="url(#pa-r5)"/>
  </g>
  <circle cx="364" cy="494" r="4.5" fill="#D97706"/>
  <text x="388" y="501" font-size="18.5" font-weight="600" fill="#111827">RESOURCE_EXHAUSTED</text>
  <text x="710" y="500" font-size="15.5" fill="#6B7280">Carry the retry delay across the boundary</text>

  
  <rect x="40" y="566" width="1160" height="226" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="596" font-size="16.5" font-weight="600" fill="#B45309">Needs judgment</text>
  <text x="1172" y="596" text-anchor="end" font-size="15.5" fill="#6B7280">one status, three possible meanings</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2.5">
    <path d="M270,686 H288 Q300,686 300,674 V638 Q300,626 312,626 H330" marker-end="url(#pa-bl)"/>
    <path d="M270,686 H330" marker-end="url(#pa-bl)"/>
    <path d="M270,686 H288 Q300,686 300,698 V734 Q300,746 312,746 H330" marker-end="url(#pa-bl)"/>
  </g>

  
  <g filter="url(#pa-lift)">
    <rect x="100" y="641" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="100" y="641" width="9" height="90" fill="#2563EB" clip-path="url(#pa-k9)"/>
  </g>
  <circle cx="138" cy="686" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,675.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="164" y="693" font-size="18.5" font-weight="600" fill="#111827">409</text>

  
  <g filter="url(#pa-soft)">
    <rect x="330" y="602" width="340" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="330" y="602" width="6" height="48" fill="#D97706" clip-path="url(#pa-o1)"/>
  </g>
  <circle cx="364" cy="626" r="4.5" fill="#D97706"/>
  <text x="388" y="633" font-size="18.5" font-weight="600" fill="#111827">ALREADY_EXISTS</text>

  <g filter="url(#pa-soft)">
    <rect x="330" y="662" width="340" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="330" y="662" width="6" height="48" fill="#D97706" clip-path="url(#pa-o2)"/>
  </g>
  <circle cx="364" cy="686" r="4.5" fill="#D97706"/>
  <text x="388" y="693" font-size="18.5" font-weight="600" fill="#111827">FAILED_PRECONDITION</text>

  <g filter="url(#pa-soft)">
    <rect x="330" y="722" width="340" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="330" y="722" width="6" height="48" fill="#D97706" clip-path="url(#pa-o3)"/>
  </g>
  <circle cx="364" cy="746" r="4.5" fill="#D97706"/>
  <text x="388" y="753" font-size="18.5" font-weight="600" fill="#111827">ABORTED</text>

  <text x="710" y="664" font-size="15.5" fill="#6B7280">State conflicts need judgment. A mechanical</text>
  <text x="710" y="687" font-size="15.5" fill="#6B7280">one-to-one table loses meaning here.</text>
  <text x="710" y="717" font-size="15.5" fill="#94A3B8">The gateway picks one, based on the condition.</text>

  
  <rect x="40" y="818" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="863" text-anchor="middle" font-size="16" fill="#475569">The gateway also translates identity, remaining deadline, idempotency key, and request id.</text>
</svg>