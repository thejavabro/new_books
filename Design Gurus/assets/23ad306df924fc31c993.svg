<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Offset pagination returns a row twice when a new record is inserted between the two page requests, because the offset counts rows in the new list rather than the list the reader already saw">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="ap1-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One insert between two page requests, and a row is returned twice</text>

  
  <rect x="50" y="80" width="520" height="470" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="74" y="118" font-size="20" font-weight="600" fill="#0F172A">Page 1</text>
  <text x="74" y="148" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">GET /posts?limit=3&amp;offset=0</text>

  <rect x="74" y="174" width="472" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="98" y="203" font-size="20" fill="#0F172A">Sharding tips</text>
  <text x="522" y="203" font-size="20" fill="#1E40AF" text-anchor="end">returned</text>

  <rect x="74" y="224" width="472" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="98" y="253" font-size="20" fill="#0F172A">CAP theorem</text>
  <text x="522" y="253" font-size="20" fill="#1E40AF" text-anchor="end">returned</text>

  <rect x="74" y="274" width="472" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="98" y="303" font-size="20" fill="#0F172A">Cache stampede</text>
  <text x="522" y="303" font-size="20" fill="#1E40AF" text-anchor="end">returned</text>

  <rect x="74" y="324" width="472" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="98" y="353" font-size="20" fill="#64748B">Bloom filters</text>

  <rect x="74" y="374" width="472" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="98" y="403" font-size="20" fill="#64748B">Retry storms</text>

  <rect x="74" y="424" width="472" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="98" y="453" font-size="20" fill="#64748B">Idempotency</text>

  
  <line x1="578" y1="300" x2="662" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#ap1-slate)"/>

  <rect x="670" y="80" width="520" height="470" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="694" y="118" font-size="20" font-weight="600" fill="#0F172A">Page 2, after a new post arrives</text>
  <text x="694" y="148" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">GET /posts?limit=3&amp;offset=3</text>

  <rect x="694" y="174" width="472" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="718" y="203" font-size="20" font-weight="600" fill="#92400E">Rate limits</text>
  <text x="1142" y="203" font-size="20" fill="#92400E" text-anchor="end">just inserted</text>

  <rect x="694" y="224" width="472" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="718" y="253" font-size="20" fill="#64748B">Sharding tips</text>
  <text x="1142" y="253" font-size="20" fill="#94A3B8" text-anchor="end">skipped</text>

  <rect x="694" y="274" width="472" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="718" y="303" font-size="20" fill="#64748B">CAP theorem</text>
  <text x="1142" y="303" font-size="20" fill="#94A3B8" text-anchor="end">skipped</text>

  <rect x="694" y="324" width="472" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="718" y="353" font-size="20" font-weight="600" fill="#B91C1C">Cache stampede</text>
  <text x="1142" y="353" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="end">seen on page 1</text>

  <rect x="694" y="374" width="472" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="718" y="403" font-size="20" fill="#0F172A">Bloom filters</text>
  <text x="1142" y="403" font-size="20" fill="#1E40AF" text-anchor="end">returned</text>

  <rect x="694" y="424" width="472" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="718" y="453" font-size="20" fill="#0F172A">Retry storms</text>
  <text x="1142" y="453" font-size="20" fill="#1E40AF" text-anchor="end">returned</text>

  <rect x="694" y="474" width="472" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="718" y="503" font-size="20" fill="#64748B">Idempotency</text>

  
  <rect x="50" y="580" width="1140" height="92" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="616" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Nothing is broken. OFFSET 3 skipped three rows in the new list, not in the list the reader saw.</text>
  <text x="620" y="646" font-size="20" fill="#B91C1C" text-anchor="middle">Cache stampede comes back on page 2. A delete instead of an insert would have hidden a row the same way.</text>
</svg>