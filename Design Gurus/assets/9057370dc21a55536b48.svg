<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The numbers with both product rows still empty">
<defs>
<filter id="pr-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="786" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Replace each number by the product of all the others, without dividing</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Everything except me is everything to my left times everything to my right</text>
<rect x="40" y="106" width="1160" height="534" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Two rows do the work: what lies to the left of each spot, and what lies to the right</text>
<text x="365" y="244" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the numbers</text>
<rect x="389" y="206" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="455" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="539" y="206" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="605" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="689" y="206" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="755" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="839" y="206" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="905" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="365" y="338" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">product to the left</text>
<rect x="389" y="300" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="455" y="337.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="539" y="300" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="605" y="337.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="689" y="300" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="755" y="337.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="839" y="300" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="905" y="337.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="365" y="432" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">product to the right</text>
<rect x="389" y="394" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="455" y="431.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="539" y="394" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="605" y="431.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="689" y="394" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="755" y="431.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="839" y="394" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="905" y="431.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="365" y="526" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">left times right</text>
<rect x="389" y="488" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="455" y="525.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="539" y="488" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="605" y="525.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="689" y="488" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="755" y="525.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="839" y="488" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="905" y="525.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="620" y="588" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Division would make this easy, and a single 0 in the input would then break it</text>
<rect x="40" y="652" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="692" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Split the answer at each spot into a left part and a right part</text>
<text x="620" y="724" text-anchor="middle" font-size="18.5" fill="#475569">Each part is a running product, so each is one sweep across the array</text>
</svg>