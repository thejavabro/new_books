<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="686" viewBox="0 0 1240 686" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="questions-title questions-desc">
<title id="questions-title">The four questions</title>
<desc id="questions-desc">Does the data fit where you are putting it, does the fan-out close for the worst case, does the cost per unit fit under the revenue per unit, and does the build arrive before the growth does.</desc>
<defs>
<marker id="questions-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="questions-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="questions-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="questions-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="686" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The four questions</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Across these cases, the same four questions did the work.</text>
<rect x="40" y="608" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="608" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="150" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Does the data fit?</text>
<path d="M536 150H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 150H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="580" y="118" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">working set against memory, total size against a disk,</text><text x="600" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a day of writes against a device</text>
<circle cx="60" cy="226" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="194" width="440" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Does the fan-out finish in time?</text>
<path d="M536 226H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 226H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="580" y="194" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">writes per event against available throughput, for the</text><text x="600" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">worst case rather than the median</text>
<circle cx="60" cy="302" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="270" width="440" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Does cost fit under revenue?</text>
<path d="M536 302H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 302H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="580" y="270" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="308" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dominant cost component against what the unit earns</text>
<circle cx="60" cy="378" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="385" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="346" width="440" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Does the build beat the growth?</text>
<path d="M536 378H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 378H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="580" y="346" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="384" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">time to deliver against time to outgrow</text>
<rect x="40" y="434" width="1160" height="148" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="620" y="470" font-size="23" font-weight="700" fill="#169B77" text-anchor="middle">Each takes under a minute. Each can eliminate a design outright.</text>
<rect x="70" y="490" width="540" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="70" y="490" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="94" y="519" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Asked early</text><text x="94" y="545" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">changing the answer costs a conversation</text>
<rect x="630" y="490" width="540" height="72" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="630" y="490" width="5" height="72" rx="2.5" fill="#F28B9D"/><text x="654" y="519" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Asked late</text><text x="654" y="545" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">changing the answer costs a quarter</text>
<text x="66" y="642" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Ask them before the diagram gets detailed, because that is when the answer is still cheap to change.</text>
</svg>