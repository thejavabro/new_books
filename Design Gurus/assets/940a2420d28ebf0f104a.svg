<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="806" viewBox="0 0 1240 806" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="safestep-title safestep-desc">
<title id="safestep-title">What makes a step safe</title>
<desc id="safestep-desc">Reversible by a configuration change, independently deployable, and observable. A step missing any one of them needs splitting, is really two steps, or will fail without anybody noticing.</desc>
<defs>
<marker id="safestep-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="safestep-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="safestep-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="safestep-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="806" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What makes a step safe</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Each move in the sequence is a separate deploy, and a step is safe when three things are true of it.</text>
<rect x="40" y="728" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="728" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="150" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reversible</text>
<path d="M536 150H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 150H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safestep-marker-slate)"/>
<rect x="580" y="118" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">undoing it is a configuration change or a deploy revert,</text><text x="600" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a repair</text>
<circle cx="60" cy="226" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="194" width="440" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Independently deployable</text>
<path d="M536 226H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 226H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safestep-marker-slate)"/>
<rect x="580" y="194" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it does not require another change to land at the same time</text>
<circle cx="60" cy="302" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="270" width="440" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Observable</text>
<path d="M536 302H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 302H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safestep-marker-slate)"/>
<rect x="580" y="270" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you can tell whether it worked, from something</text><text x="600" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">other than the absence of complaints</text>
<text x="40" y="374" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">A step missing one of them is not ready</text>
<rect x="40" y="392" width="490" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="285" y="426" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">not reversible</text>
<path d="M536 420H570" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 420H570" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safestep-marker-red)"/>
<rect x="580" y="392" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="426" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">split it until it is</text>
<rect x="40" y="460" width="490" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="285" y="494" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">needs a simultaneous change</text>
<path d="M536 488H570" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 488H570" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safestep-marker-red)"/>
<rect x="580" y="460" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="494" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that is two steps written as one</text>
<rect x="40" y="528" width="490" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="285" y="562" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cannot be verified</text>
<path d="M536 556H570" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 556H570" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safestep-marker-red)"/>
<rect x="580" y="528" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="562" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you will learn it failed from a customer</text>
<rect x="40" y="612" width="1160" height="90" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="612" width="5" height="90" rx="2.5" fill="#AC8BE8"/><text x="64" y="650" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The third is the one most often skipped.</text><text x="64" y="676" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"We deployed dual writes" is a claim about code. How many rows have both values, and do they agree?</text>
<text x="66" y="762" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A migration with no instrumentation has later steps that are taken on faith.</text>
</svg>