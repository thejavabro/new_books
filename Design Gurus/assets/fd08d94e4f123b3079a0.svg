<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four field choices that are most expensive to reverse: money, time, identifiers, and enums. Each row shows the representation to avoid, the representation this course publishes, and the failure the wrong choice produces once callers have stored the values.">
