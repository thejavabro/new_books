  <text x="690" y="393" font-size="18.5" font-weight="600" fill="#111827">"created_at": "&lt;RFC 3339 UTC&gt;"</text>

  <text x="1152" y="436" text-anchor="end" font-size="15.5" fill="#6B7280">A numeric timestamp needs an explicit unit and reference point.</text>

  
