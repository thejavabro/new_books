  <g transform="translate(657,705) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="690" y="721" font-size="18.5" font-weight="600" fill="#111827">"status": "pending"</text>

  <text x="1152" y="764" text-anchor="end" font-size="15.5" fill="#6B7280">Readable strings still need an unknown-value rule.</text>

  
  <rect x="40" y="814" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="859" text-anchor="middle" font-size="16" fill="#475569">A wrong type is not a server fix. Callers stored it, so repair means a new field and a migration.</text>
