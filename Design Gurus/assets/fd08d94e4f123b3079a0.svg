    <filter id="xl06fourper-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <marker id="xl06fourper-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>

    <clipPath id="xl06fourper-k1"><rect x="88" y="198" width="496" height="48" rx="10"/></clipPath>
    <clipPath id="xl06fourper-k2"><rect x="632" y="198" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="xl06fourper-k3"><rect x="88" y="362" width="496" height="48" rx="10"/></clipPath>
