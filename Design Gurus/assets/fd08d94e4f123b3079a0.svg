  <rect x="0" y="0" width="1240" height="930" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Four types that become a caller migration if you get them wrong</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">money, time, identifiers, and enums</text>

  
  <text x="88" y="130" font-size="16.5" font-weight="600" fill="#BE185D">Avoid ambiguous forms</text>
  <text x="632" y="130" font-size="16.5" font-weight="600" fill="#047857">Publish</text>

  
  <rect x="40" y="146" width="1160" height="146" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="180" font-size="16.5" font-weight="600" fill="#B45309">Money</text>

  <g fill="none" stroke="#94A3B8" stroke-width="2">
    <path d="M584,222 H632" marker-end="url(#xl06fourper-ar)"/>
  </g>

  <g filter="url(#xl06fourper-soft)">
    <rect x="88" y="198" width="496" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
