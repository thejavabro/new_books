<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1038" viewBox="0 0 1240 1038" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four bounded fixes for a screen that needs too many calls, each with the trigger that justifies it and the cost it accepts: embed what the screen always shows, add a bounded include parameter, create a dedicated screen operation, or use GraphQL.">
  <defs>
    <filter id="p3c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3c-k1"><rect x="76" y="146" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p3c-k2"><rect x="76" y="342" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p3c-k3"><rect x="76" y="538" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p3c-k4"><rect x="76" y="734" width="440" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1038" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Four fixes, four triggers, four costs</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M580,71 L584.5,75.5 L592,65.5"/>
  </g>
  <text x="606" y="77" font-size="15.5" fill="#6B7280">Trigger, when this fix is right</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M905,64 L905,77 M899.5,71.5 L905,77 L910.5,71.5"/>
  </g>
  <text x="926" y="77" font-size="15.5" fill="#6B7280">Cost, what you accept</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3c-soft)">
    <rect x="76" y="146" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p3c-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Embed what the screen always shows</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,256 L82.5,260.5 L90,250.5"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">A bounded relationship that nearly every consumer needs, in a small projection</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,276 L84,288 M78.5,282.5 L84,288 L89.5,282.5"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">A duplicated projection, a larger response, and a freshness rule for embedded data</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3c-soft)">
    <rect x="76" y="342" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#2563EB" clip-path="url(#p3c-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">A bounded include parameter</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,452 L82.5,456.5 L90,446.5"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">A few known consumers need a few optional projections, each documented</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,472 L84,484 M78.5,478.5 L84,484 L89.5,478.5"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Another response shape, cache variation, and test combinations per expansion</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3c-soft)">
    <rect x="76" y="538" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#2563EB" clip-path="url(#p3c-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">A dedicated screen operation</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,648 L82.5,652.5 L90,642.5"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">A stable, important first-party screen assembled from several resources</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,668 L84,680 M78.5,674.5 L84,680 L89.5,674.5"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">Screen operations multiply, couple the API to layout, and may outlive the screen</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3c-soft)">
    <rect x="76" y="734" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#2563EB" clip-path="url(#p3c-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">GraphQL</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,844 L82.5,848.5 L90,838.5"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">Several clients repeatedly need materially different connected field sets</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,864 L84,876 M78.5,870.5 L84,876 L89.5,870.5"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Depth and cost limits, N+1 prevention, persisted operations, harder caching</text>

  
  <rect x="40" y="922" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="967" text-anchor="middle" font-size="16" fill="#475569">Sometimes two parallel calls are correct. A screen does not need to be one call to be well designed.</text>
</svg>