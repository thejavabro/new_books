<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The support bot priced from one turn to one conversation, one day, and one month, before any optimization">
  <defs>
    <marker id="ieub-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="ieub-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ieub-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ieub-k1"><rect x="66" y="136" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="ieub-k2"><rect x="588" y="136" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="ieub-k3"><rect x="938" y="136" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="ieub-k4"><rect x="140" y="410" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ieub-k5"><rect x="500" y="410" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ieub-k6"><rect x="890" y="410" width="270" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="716" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">One conversation: each turn resends the history</text>
  <rect x="40" y="330" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#B45309">Multiply by volume</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M246,181 H588" marker-end="url(#ieub-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M768,181 H938" marker-end="url(#ieub-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1056,263 V296 Q1056,308 1044,308 H267 Q255,308 255,320 V410" marker-end="url(#ieub-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M370,455 H500" marker-end="url(#ieub-mslate)"/></g>
  <g filter="url(#ieub-soft)">
    <rect x="66" y="136" width="180" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="66" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#ieub-k1)"/>
  </g>
  <circle cx="104" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(93.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="66" y="124" font-size="15.5" font-weight="600" fill="#6B7280">first turn</text>
  <text x="130" y="188" font-size="18.5" font-weight="600" fill="#111827">Turn 1</text>
  <text x="156" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 750 input tokens</text>
  <g filter="url(#ieub-soft)">
    <rect x="588" y="136" width="180" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="588" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#ieub-k2)"/>
  </g>
  <circle cx="626" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(615.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="588" y="124" font-size="15.5" font-weight="600" fill="#6B7280">last turn</text>
  <text x="652" y="188" font-size="18.5" font-weight="600" fill="#111827">Turn 10</text>
  <text x="678" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 5,250 input tokens</text>
  <g filter="url(#ieub-lift)">
    <rect x="938" y="136" width="236" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="938" y="136" width="9" height="90" fill="#059669" clip-path="url(#ieub-k3)"/>
  </g>
  <circle cx="976" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(965.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="938" y="124" font-size="15.5" font-weight="600" fill="#6B7280">the unit</text>
  <text x="1002" y="188" font-size="18.5" font-weight="600" fill="#111827">One conversation</text>
  <text x="1056" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 33,000 tokens, roughly $0.13</text>
  <g filter="url(#ieub-soft)">
    <rect x="140" y="410" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="140" y="410" width="6" height="90" fill="#D97706" clip-path="url(#ieub-k4)"/>
  </g>
  <circle cx="178" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(167.56,444.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="140" y="398" font-size="15.5" font-weight="600" fill="#6B7280">x 100,000</text>
  <text x="204" y="462" font-size="18.5" font-weight="600" fill="#111827">One day</text>
  <text x="255" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">roughly $13K per day</text>
  <g filter="url(#ieub-soft)">
    <rect x="500" y="410" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="500" y="410" width="6" height="90" fill="#D97706" clip-path="url(#ieub-k5)"/>
  </g>
  <circle cx="538" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,444.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="500" y="398" font-size="15.5" font-weight="600" fill="#6B7280">x 30</text>
  <text x="564" y="462" font-size="18.5" font-weight="600" fill="#111827">One month</text>
  <text x="615" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">roughly $400K per month</text>
  <g filter="url(#ieub-soft)">
    <rect x="890" y="410" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="890" y="410" width="6" height="90" fill="#64748B" clip-path="url(#ieub-k6)"/>
  </g>
  <circle cx="928" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(917.56,444.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="890" y="398" font-size="15.5" font-weight="600" fill="#6B7280">for comparison</text>
  <text x="954" y="462" font-size="18.5" font-weight="600" fill="#111827">Human-handled ticket</text>
  <text x="1025" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">about $4 each</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="417" y="167" fill="#1D4ED8">each later turn adds about 500 more tokens</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="853" y="167" fill="#1D4ED8">30,000 in, 3,000 out</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="267" y="378" fill="#047857">price one unit first</text></g>
  <rect x="40" y="600" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="645" text-anchor="middle" font-size="16" fill="#475569">Price one unit first, then multiply. The unit shows which tokens drive the bill.</text>
</svg>