<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="794" viewBox="0 0 1240 794" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A traffic burst causes autoscaling to launch a hundred new instances, all of which start cold, and p99 latency spikes until they finish initialising">
  <rect x="0" y="0" width="1240" height="794" fill="#FFFFFF"/>
  <defs>
    <marker id="sc6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Autoscaling worked. It also made things worse for a minute.</text>

  <line x1="400" y1="100" x2="400" y2="580" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="410" y="90" font-size="20" font-weight="600" fill="#B91C1C">traffic burst</text>

  
  <text x="60" y="180" font-size="20" font-weight="600" fill="#475569">Traffic</text>
  <line x1="180" y1="250" x2="1160" y2="250" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M180 225 H400 V120 H1140" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <text x="290" y="210" font-size="20" fill="#1E40AF" text-anchor="middle">200 req/s</text>
  <text x="770" y="106" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">4,000 req/s</text>

  
  <text x="60" y="325" font-size="20" font-weight="600" fill="#475569">Instances</text>
  <rect x="180" y="300" width="220" height="40" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="290" y="327" font-size="20" fill="#065F46" text-anchor="middle">5 warm</text>
  <rect x="400" y="300" width="740" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="770" y="327" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">100 new instances, all cold</text>

  
  <text x="60" y="475" font-size="20" font-weight="600" fill="#475569">p99 latency</text>
  <path d="M180 561 H400 L430 410 L520 470 L620 530 L700 561 H1140" fill="none" stroke="#DC2626" stroke-width="3"/>
  <text x="290" y="548" font-size="20" fill="#334155" text-anchor="middle">80 ms</text>
  <text x="440" y="402" font-size="20" font-weight="600" fill="#B91C1C">1.4 s</text>
  <line x1="180" y1="570" x2="1190" y2="570" stroke="#475569" stroke-width="2" marker-end="url(#sc6-slate)"/>

  <path d="M400 612 V600 H700 V612" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="550" y="640" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the window where users feel it</text>

  
  <rect x="50" y="672" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="708" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">New capacity arrives cold, so the moment you need it most is the moment it is slowest.</text>
  <text x="620" y="738" font-size="20" fill="#334155" text-anchor="middle">Pre-warmed pools and provisioned concurrency exist to pay that cost before the traffic arrives.</text>
</svg>