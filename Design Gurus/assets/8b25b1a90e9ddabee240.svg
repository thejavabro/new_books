<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="842" viewBox="0 0 1240 842" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Kafka cluster coordination. In current KRaft mode, brokers follow a controller quorum of three or five nodes that keeps cluster metadata in a Kafka log replicated by Raft. In the legacy ZooKeeper mode, removed in Kafka 4, one elected controller broker kept the same metadata in an external ZooKeeper ensemble. Consumer offsets live in the __consumer_offsets topic in both.">
  <defs>
    <filter id="kfck-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="kfck-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="kfck-k1"><rect x="80" y="185" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="kfck-k2"><rect x="430" y="185" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="kfck-k3"><rect x="80" y="460" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="kfck-k4"><rect x="430" y="460" width="290" height="90" rx="12"/></clipPath>
    <marker id="kfck-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="kfck-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="kfck-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="kfck-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="kfck-s-violet" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#7C3AED"/></marker>
    <marker id="kfck-s-amber" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#D97706"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="842" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Kafka cluster coordination</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">KRaft is how Kafka coordinates itself today. ZooKeeper did the same job before it, and offsets were never part of either.</text>

  <rect x="40" y="110" width="1160" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">KRaft mode (current)</text>
  <rect x="40" y="400" width="1160" height="200" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="430" font-size="19.5" font-weight="600" fill="#475569">Before KRaft: ZooKeeper mode (removed in Kafka 4)</text>

  <g fill="none" stroke-width="2">
    <path d="M320,230 H430" stroke="#2563EB" marker-end="url(#kfck-m-blue)"/>
    <path d="M720,230 H840" stroke="#7C3AED" marker-end="url(#kfck-m-violet)" marker-start="url(#kfck-s-violet)"/>
    <path d="M320,505 H430" stroke="#64748B" marker-end="url(#kfck-m-slate)"/>
    <path d="M720,505 H840" stroke="#D97706" marker-end="url(#kfck-m-amber)" marker-start="url(#kfck-s-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="375" y="217" fill="#1D4ED8">follow</text>
    <text x="780" y="217" fill="#5B21B6">metadata</text>
    <text x="375" y="492" fill="#475569">watched</text>
    <text x="780" y="492" fill="#B45309">metadata</text>
  </g>

  <g filter="url(#kfck-soft)">
    <rect x="80" y="185" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="185" width="6" height="90" fill="#2563EB" clip-path="url(#kfck-k1)"/>
  </g>
  <circle cx="118" cy="230" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,219.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="144" y="237" font-size="21.5" font-weight="600" fill="#111827">Brokers</text>
  <text x="200" y="304" font-size="18.5" text-anchor="middle" fill="#6B7280">follow the metadata log</text>
  <text x="200" y="331" font-size="18.5" text-anchor="middle" fill="#94A3B8">like a consumer reads a topic</text>
  <g filter="url(#kfck-lift)">
    <rect x="430" y="185" width="290" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="430" y="185" width="9" height="90" fill="#2563EB" clip-path="url(#kfck-k2)"/>
  </g>
  <circle cx="468" cy="230" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,219.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="494" y="237" font-size="21.5" font-weight="600" fill="#111827">Controller Quorum</text>
  <text x="575" y="304" font-size="18.5" text-anchor="middle" fill="#6B7280">3 or 5 nodes, a Raft leader</text>
  <text x="575" y="331" font-size="18.5" text-anchor="middle" fill="#94A3B8">failover needs no rebuild</text>
  <g filter="url(#kfck-soft)">
    <rect x="80" y="460" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="80" y="460" width="6" height="90" fill="#64748B" clip-path="url(#kfck-k3)"/>
  </g>
  <circle cx="118" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,494.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="144" y="512" font-size="21.5" font-weight="600" fill="#111827">Brokers</text>
  <text x="200" y="579" font-size="18.5" text-anchor="middle" fill="#6B7280">registered in ZooKeeper</text>
  <g filter="url(#kfck-soft)">
    <rect x="430" y="460" width="290" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="430" y="460" width="6" height="90" fill="#64748B" clip-path="url(#kfck-k4)"/>
  </g>
  <circle cx="468" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,494.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="494" y="512" font-size="21.5" font-weight="600" fill="#111827">Controller Broker</text>
  <text x="575" y="579" font-size="18.5" text-anchor="middle" fill="#6B7280">one broker, elected by a lock</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M840,195 L840,289 A160,16 0 0 0 1160,289 L1160,195" fill="#EDE9FE"/>
    <ellipse cx="1000" cy="195" rx="160" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1000" y="257" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Metadata Log</text>
  <text x="1000" y="339" font-size="18.5" text-anchor="middle" fill="#6B7280">a Kafka log, inside Kafka</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M840,465 L840,539 A160,16 0 0 0 1160,539 L1160,465" fill="#FEF3C7"/>
    <ellipse cx="1000" cy="465" rx="160" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1000" y="517" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">ZooKeeper</text>
  <text x="1000" y="589" font-size="18.5" text-anchor="middle" fill="#6B7280">a second cluster to run</text>

  <rect x="40" y="640" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="665" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="690" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">__consumer_offsets</text>
  <text x="323" y="690" font-size="18.5" fill="#475569">where consumer offsets live, and have since Kafka 0.9: a compacted Kafka topic, in both modes</text>
  <rect x="64" y="715" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Metadata log</text>
  <text x="323" y="740" font-size="18.5" fill="#475569">KRaft keeps cluster metadata in a Kafka log agreed by the quorum, so Kafka runs as one system</text>
  <rect x="64" y="765" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Still out there</text>
  <text x="323" y="790" font-size="18.5" fill="#475569">ZooKeeper mode was removed in Kafka 4, but clusters on 3.x still run it, so you will meet both</text>
</svg>