<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="938" viewBox="0 0 1240 938" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Rate limits, quotas, and suspensions are three different refusals. A rate limit refills with short waiting and returns 429. A quota needs a plan or period change and returns 403. A suspended account also returns 403, never a rate limit of zero.">
  <defs>
    <filter id="p15-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p15-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p15-k1"><rect x="76" y="196" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p15-k2"><rect x="432" y="196" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p15-k3"><rect x="658" y="196" width="504" height="90" rx="12"/></clipPath>
    <clipPath id="p15-k4"><rect x="76" y="412" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p15-k5"><rect x="432" y="412" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p15-k6"><rect x="658" y="412" width="504" height="90" rx="12"/></clipPath>
    <clipPath id="p15-k7"><rect x="76" y="628" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p15-k8"><rect x="432" y="628" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p15-k9"><rect x="658" y="628" width="504" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="938" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three refusals that look alike and are not</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one returns 429, two return 403</text>

  
  <text x="76" y="132" font-size="16.5" font-weight="600" fill="#475569">Response</text>
  <text x="432" y="132" font-size="16.5" font-weight="600" fill="#475569">Does waiting fix it?</text>
  <text x="658" y="132" font-size="16.5" font-weight="600" fill="#475569">The caller must</text>

  
  <rect x="44" y="148" width="1152" height="190" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="68" y="178" font-size="16.5" font-weight="600" fill="#B45309">Rate limit</text>

  <g filter="url(#p15-soft)">
    <rect x="76" y="196" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="196" width="6" height="90" fill="#D97706" clip-path="url(#p15-k1)"/>
  </g>
  <circle cx="114" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,230.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="248" font-size="18.5" font-weight="600" fill="#111827">429 + Retry-After</text>

  <g filter="url(#p15-soft)">
    <rect x="432" y="196" width="190" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="432" y="196" width="6" height="90" fill="#64748B" clip-path="url(#p15-k2)"/>
  </g>
  <circle cx="470" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(459.56,230.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="496" y="248" font-size="18.5" font-weight="600" fill="#111827">Yes</text>
  <text x="527" y="311" text-anchor="middle" font-size="15.5" fill="#6B7280">Capacity refills with time</text>

  <g filter="url(#p15-soft)">
    <rect x="658" y="196" width="504" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="658" y="196" width="6" height="90" fill="#059669" clip-path="url(#p15-k3)"/>
  </g>
  <circle cx="696" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(685.56,230.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="722" y="248" font-size="18.5" font-weight="600" fill="#111827">Wait, and add a random extra delay</text>

  
  <rect x="44" y="364" width="1152" height="190" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="68" y="394" font-size="16.5" font-weight="600" fill="#BE185D">Quota</text>

  <g filter="url(#p15-soft)">
    <rect x="76" y="412" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="412" width="6" height="90" fill="#DB2777" clip-path="url(#p15-k4)"/>
  </g>
  <circle cx="114" cy="457" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,446.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="464" font-size="18.5" font-weight="600" fill="#111827">403 quota_exceeded</text>

  <g filter="url(#p15-soft)">
    <rect x="432" y="412" width="190" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="432" y="412" width="6" height="90" fill="#64748B" clip-path="url(#p15-k5)"/>
  </g>
  <circle cx="470" cy="457" r="18" fill="#FFFFFF"/>
  <g transform="translate(459.56,446.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="496" y="464" font-size="18.5" font-weight="600" fill="#111827">No</text>
  <text x="527" y="527" text-anchor="middle" font-size="15.5" fill="#6B7280">It is a plan or period allowance</text>

  <g filter="url(#p15-soft)">
    <rect x="658" y="412" width="504" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="658" y="412" width="6" height="90" fill="#059669" clip-path="url(#p15-k6)"/>
  </g>
  <circle cx="696" cy="457" r="18" fill="#FFFFFF"/>
  <g transform="translate(685.56,446.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="722" y="464" font-size="18.5" font-weight="600" fill="#111827">Change plan or permission state</text>

  
  <rect x="44" y="580" width="1152" height="190" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="68" y="610" font-size="16.5" font-weight="600" fill="#BE185D">Suspension</text>

  <g filter="url(#p15-lift)">
    <rect x="76" y="628" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="76" y="628" width="9" height="90" fill="#DB2777" clip-path="url(#p15-k7)"/>
  </g>
  <circle cx="114" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,662.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="680" font-size="18.5" font-weight="600" fill="#111827">403 account_suspended</text>

  <g filter="url(#p15-soft)">
    <rect x="432" y="628" width="190" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="432" y="628" width="6" height="90" fill="#64748B" clip-path="url(#p15-k8)"/>
  </g>
  <circle cx="470" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(459.56,662.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="496" y="680" font-size="18.5" font-weight="600" fill="#111827">No</text>
  <text x="527" y="743" text-anchor="middle" font-size="15.5" fill="#6B7280">It is an authorization decision</text>

  <g filter="url(#p15-soft)">
    <rect x="658" y="628" width="504" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="658" y="628" width="6" height="90" fill="#059669" clip-path="url(#p15-k9)"/>
  </g>
  <circle cx="696" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(685.56,662.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="722" y="680" font-size="18.5" font-weight="600" fill="#111827">Resolve the account, not the timing</text>

  
  <rect x="40" y="798" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="840" text-anchor="middle" font-size="16" fill="#475569">Calling suspension 429 encourages endless retries and hides authorization inside capacity language.</text>
  <text x="620" y="868" text-anchor="middle" font-size="16" fill="#475569">A suspended account returns 403, never a rate limit of zero.</text>
</svg>