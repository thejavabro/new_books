<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1394" viewBox="0 0 1240 1394" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The stranger test applied to five stages: discovery, the first request, success, failure, and change. At every stage the question is whether a capable developer can proceed without talking to the authors.">
  <defs>
    <marker id="yl06strange-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="yl06strange-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="yl06strange-k1"><rect x="76" y="182" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="yl06strange-k2"><rect x="76" y="406" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="yl06strange-k3"><rect x="76" y="630" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="yl06strange-k4"><rect x="76" y="854" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="yl06strange-k5"><rect x="76" y="1078" width="1088" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1394" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The stranger test, stage by stage</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">five stages, one question at each</text>

  
  <rect x="40" y="126" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Discovery</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">stage 1 of 5</text>

  <rect x="40" y="350" width="1160" height="200" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="380" font-size="16.5" font-weight="600" fill="#5B21B6">First request</text>
  <text x="1176" y="380" text-anchor="end" font-size="15.5" fill="#6B7280">stage 2 of 5</text>

  <rect x="40" y="574" width="1160" height="200" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="604" font-size="16.5" font-weight="600" fill="#047857">Success</text>
  <text x="1176" y="604" text-anchor="end" font-size="15.5" fill="#6B7280">stage 3 of 5</text>

  <rect x="40" y="798" width="1160" height="200" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="828" font-size="16.5" font-weight="600" fill="#BE185D">Failure</text>
  <text x="1176" y="828" text-anchor="end" font-size="15.5" fill="#6B7280">stage 4 of 5</text>

  <rect x="40" y="1022" width="1160" height="200" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="1052" font-size="16.5" font-weight="600" fill="#B45309">Change</text>
  <text x="1176" y="1052" text-anchor="end" font-size="15.5" fill="#6B7280">stage 5 of 5</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,272 V406" marker-end="url(#yl06strange-sl)"/>
    <path d="M620,496 V630" marker-end="url(#yl06strange-sl)"/>
    <path d="M620,720 V854" marker-end="url(#yl06strange-sl)"/>
    <path d="M620,944 V1078" marker-end="url(#yl06strange-sl)"/>
  </g>

  
  <g filter="url(#yl06strange-soft)">
    <rect x="76" y="182" width="1088" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="182" width="6" height="90" fill="#2563EB" clip-path="url(#yl06strange-k1)"/>
  </g>
  <circle cx="114" cy="227" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,216.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="234" font-size="18.5" font-weight="600" fill="#111827">Can they find the operation that matches the job?</text>
  <text x="104" y="297" font-size="15.5" fill="#6B7280">named in the caller's language, related ones predictable</text>

  
  <g filter="url(#yl06strange-soft)">
    <rect x="76" y="406" width="1088" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="406" width="6" height="90" fill="#7C3AED" clip-path="url(#yl06strange-k2)"/>
  </g>
  <circle cx="114" cy="451" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,440.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="458" font-size="18.5" font-weight="600" fill="#111827">Is there one copyable example that runs?</text>
  <text x="104" y="521" font-size="15.5" fill="#6B7280">authentication explained, safe test environment</text>

  
  <g filter="url(#yl06strange-soft)">
    <rect x="76" y="630" width="1088" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="630" width="6" height="90" fill="#059669" clip-path="url(#yl06strange-k3)"/>
  </g>
  <circle cx="114" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,664.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="682" font-size="18.5" font-weight="600" fill="#111827">Does the response carry what the caller needs next?</text>
  <text x="104" y="745" font-size="15.5" fill="#6B7280">unambiguous units, a status code that matches</text>

  
  <g filter="url(#yl06strange-soft)">
    <rect x="76" y="854" width="1088" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="854" width="6" height="90" fill="#DB2777" clip-path="url(#yl06strange-k4)"/>
  </g>
  <circle cx="114" cy="899" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,888.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="906" font-size="18.5" font-weight="600" fill="#111827">Is the code stable and the field at fault named?</text>
  <text x="104" y="969" font-size="15.5" fill="#6B7280">stable codes, the field at fault, a clear retry signal</text>

  
  <g filter="url(#yl06strange-soft)">
    <rect x="76" y="1078" width="1088" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1078" width="6" height="90" fill="#D97706" clip-path="url(#yl06strange-k5)"/>
  </g>
  <circle cx="114" cy="1123" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1112.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="1130" font-size="18.5" font-weight="600" fill="#111827">Can the API add fields without breaking them?</text>
  <text x="104" y="1193" font-size="15.5" fill="#6B7280">deprecation names an alternative and a date</text>

  
  <rect x="40" y="1254" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1296" text-anchor="middle" font-size="16" fill="#475569">Can a capable developer use this correctly without talking to the authors?</text>
  <text x="620" y="1324" text-anchor="middle" font-size="16" fill="#475569">If developers repeatedly need help, improve the contract, examples, or documentation.</text>
</svg>