<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="First question: can a few seconds of downtime cause serious harm? If yes, use fault tolerance. If no, ask: is losing the last few writes unacceptable? If yes, protect the data with synchronous replication. If no, use high availability.">
  <defs>
    <filter id="ft3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ft3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ft3-k1"><rect x="40" y="140" width="700" height="90" rx="12"/></clipPath>
    <clipPath id="ft3-k2"><rect x="880" y="140" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ft3-k3"><rect x="40" y="330" width="700" height="90" rx="12"/></clipPath>
    <clipPath id="ft3-k4"><rect x="880" y="330" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ft3-k5"><rect x="40" y="520" width="700" height="90" rx="12"/></clipPath>
    <marker id="ft3-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ft3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="ft3-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Choosing between the two promises</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Ask two questions for each part of the system.</text>



  <g fill="none" stroke-width="2">
    <path d="M740,185 H880" stroke="#7C3AED" marker-end="url(#ft3-m-violet)"/>
    <path d="M390,230 V330" stroke="#64748B" marker-end="url(#ft3-m-slate)"/>
    <path d="M740,375 H880" stroke="#2563EB" marker-end="url(#ft3-m-blue)"/>
    <path d="M390,420 V520" stroke="#64748B" marker-end="url(#ft3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="810" y="173" fill="#5B21B6">yes</text>
    <text x="418" y="285" fill="#475569">no</text>
    <text x="810" y="363" fill="#1D4ED8">yes</text>
    <text x="418" y="475" fill="#475569">no</text>
  </g>

  <g filter="url(#ft3-soft)">
    <rect x="40" y="140" width="700" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ft3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Can seconds of downtime cause serious harm?</text>
  <g filter="url(#ft3-lift)">
    <rect x="880" y="140" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="880" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#ft3-k2)"/>
  </g>
  <circle cx="918" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="944" y="192" font-size="21.5" font-weight="600" fill="#111827">Fault tolerance</text>
  <text x="1040" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">active copies,</text>
  <text x="1040" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">synchronous writes</text>
  <g filter="url(#ft3-soft)">
    <rect x="40" y="330" width="700" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="330" width="6" height="90" fill="#64748B" clip-path="url(#ft3-k3)"/>
  </g>
  <circle cx="78" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,364.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="382" font-size="21.5" font-weight="600" fill="#111827">Is losing the last few writes unacceptable?</text>
  <g filter="url(#ft3-soft)">
    <rect x="880" y="330" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="880" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#ft3-k4)"/>
  </g>
  <circle cx="918" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="944" y="382" font-size="21.5" font-weight="600" fill="#111827">Protect the data</text>
  <text x="1040" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">synchronous replication,</text>
  <text x="1040" y="476" font-size="18.5" text-anchor="middle" fill="#94A3B8">high availability for the rest</text>
  <g filter="url(#ft3-soft)">
    <rect x="40" y="520" width="700" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="520" width="6" height="90" fill="#059669" clip-path="url(#ft3-k5)"/>
  </g>
  <circle cx="78" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,554.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="572" font-size="21.5" font-weight="600" fill="#111827">High availability</text>
  <text x="390" y="639" font-size="18.5" text-anchor="middle" fill="#6B7280">fast failover, lower cost</text>

  <rect x="40" y="690" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="715" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Fault tolerance</text>
  <text x="323" y="740" font-size="18.5" fill="#475569">finance, healthcare, aviation, and other systems where downtime harms people</text>
  <rect x="64" y="765" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">High availability</text>
  <text x="323" y="790" font-size="18.5" fill="#475569">online stores, streaming, and most business apps</text>
  <rect x="64" y="815" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="840" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Mix them</text>
  <text x="323" y="840" font-size="18.5" fill="#475569">one system can use both, choosing for each part</text>
</svg>