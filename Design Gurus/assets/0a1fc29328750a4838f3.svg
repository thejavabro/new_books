<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A stream of eight events. The client applies through evt_4, the connection drops, and the client reconnects with Last-Event-ID evt_4. If the position is still inside the buffer of up to 10,000 events and up to 10 minutes, the server replays evt_5 to evt_8. If the position expired, the server returns 409 with resync_required and the client does a REST read before opening a fresh stream.">
  <defs>
    <marker id="pi-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="pi-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="pi-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pi-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pi-k1"><rect x="68" y="96" width="116" height="48" rx="10"/></clipPath>
    <clipPath id="pi-k2"><rect x="200" y="96" width="116" height="48" rx="10"/></clipPath>
    <clipPath id="pi-k3"><rect x="332" y="96" width="116" height="48" rx="10"/></clipPath>
    <clipPath id="pi-k4"><rect x="464" y="96" width="116" height="48" rx="10"/></clipPath>
    <clipPath id="pi-k5"><rect x="660" y="96" width="116" height="48" rx="10"/></clipPath>
    <clipPath id="pi-k6"><rect x="792" y="96" width="116" height="48" rx="10"/></clipPath>
    <clipPath id="pi-k7"><rect x="924" y="96" width="116" height="48" rx="10"/></clipPath>
    <clipPath id="pi-k8"><rect x="1056" y="96" width="116" height="48" rx="10"/></clipPath>
    <clipPath id="pi-k9"><rect x="400" y="240" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="pi-k10"><rect x="84" y="442" width="480" height="90" rx="12"/></clipPath>
    <clipPath id="pi-k11"><rect x="676" y="442" width="480" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Disconnect and resume</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">the client applied through evt_4</text>

  
  <g filter="url(#pi-soft)">
    <rect x="68" y="96" width="116" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="68" y="96" width="6" height="48" fill="#059669" clip-path="url(#pi-k1)"/>
  </g>
  <circle cx="92" cy="120" r="4.5" fill="#059669"/>
  <text x="110" y="127" font-size="18.5" font-weight="600" fill="#111827">evt_1</text>

  
  <g filter="url(#pi-soft)">
    <rect x="200" y="96" width="116" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="200" y="96" width="6" height="48" fill="#059669" clip-path="url(#pi-k2)"/>
  </g>
  <circle cx="224" cy="120" r="4.5" fill="#059669"/>
  <text x="242" y="127" font-size="18.5" font-weight="600" fill="#111827">evt_2</text>

  
  <g filter="url(#pi-soft)">
    <rect x="332" y="96" width="116" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="332" y="96" width="6" height="48" fill="#059669" clip-path="url(#pi-k3)"/>
  </g>
  <circle cx="356" cy="120" r="4.5" fill="#059669"/>
  <text x="374" y="127" font-size="18.5" font-weight="600" fill="#111827">evt_3</text>

  
  <g filter="url(#pi-soft)">
    <rect x="464" y="96" width="116" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="464" y="96" width="6" height="48" fill="#059669" clip-path="url(#pi-k4)"/>
  </g>
  <circle cx="488" cy="120" r="4.5" fill="#059669"/>
  <text x="506" y="127" font-size="18.5" font-weight="600" fill="#111827">evt_4</text>

  
  <path d="M606,106 L634,134 M634,106 L606,134" fill="none" stroke="#DB2777" stroke-width="3" stroke-linecap="round"/>

  
  <g filter="url(#pi-soft)">
    <rect x="660" y="96" width="116" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="660" y="96" width="6" height="48" fill="#64748B" clip-path="url(#pi-k5)"/>
  </g>
  <circle cx="684" cy="120" r="4.5" fill="#64748B"/>
  <text x="702" y="127" font-size="18.5" font-weight="600" fill="#111827">evt_5</text>

  
  <g filter="url(#pi-soft)">
    <rect x="792" y="96" width="116" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="792" y="96" width="6" height="48" fill="#64748B" clip-path="url(#pi-k6)"/>
  </g>
  <circle cx="816" cy="120" r="4.5" fill="#64748B"/>
  <text x="834" y="127" font-size="18.5" font-weight="600" fill="#111827">evt_6</text>

  
  <g filter="url(#pi-soft)">
    <rect x="924" y="96" width="116" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="924" y="96" width="6" height="48" fill="#64748B" clip-path="url(#pi-k7)"/>
  </g>
  <circle cx="948" cy="120" r="4.5" fill="#64748B"/>
  <text x="966" y="127" font-size="18.5" font-weight="600" fill="#111827">evt_7</text>

  
  <g filter="url(#pi-soft)">
    <rect x="1056" y="96" width="116" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="1056" y="96" width="6" height="48" fill="#64748B" clip-path="url(#pi-k8)"/>
  </g>
  <circle cx="1080" cy="120" r="4.5" fill="#64748B"/>
  <text x="1098" y="127" font-size="18.5" font-weight="600" fill="#111827">evt_8</text>

  
  <path d="M68,164 H580" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <path d="M660,164 H1172" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#F8FAFC" stroke-width="5">
    <text x="324" y="190" fill="#047857">processed</text>
    <text x="620" y="190" fill="#BE185D">connection drops</text>
    <text x="916" y="190" fill="#475569">missed while disconnected</text>
  </g>

  
  <rect x="40" y="392" width="568" height="190" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="422" font-size="16.5" font-weight="600" fill="#047857">Still inside the buffer</text>
  <text x="584" y="422" text-anchor="end" font-size="15.5" fill="#6B7280">up to 10,000 events, up to 10 minutes</text>

  <rect x="632" y="392" width="568" height="190" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="656" y="422" font-size="16.5" font-weight="600" fill="#B45309">The position expired</text>
  <text x="1176" y="422" text-anchor="end" font-size="15.5" fill="#6B7280">409 with resync_required</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M500,330 V352 Q500,364 488,364 H336 Q324,364 324,376 V392" stroke="#059669" marker-end="url(#pi-em)"/>
    <path d="M740,330 V352 Q740,364 752,364 H904 Q916,364 916,376 V392" stroke="#D97706" marker-end="url(#pi-am)"/>
  </g>

  
  <g filter="url(#pi-lift)">
    <rect x="400" y="240" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="400" y="240" width="9" height="90" fill="#2563EB" clip-path="url(#pi-k9)"/>
  </g>
  <circle cx="438" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,274.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="464" y="292" font-size="18.5" font-weight="600" fill="#111827">Reconnect with Last-Event-ID: evt_4</text>

  
  <g filter="url(#pi-soft)">
    <rect x="84" y="442" width="480" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="442" width="6" height="90" fill="#059669" clip-path="url(#pi-k10)"/>
  </g>
  <circle cx="122" cy="487" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,476.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="148" y="494" font-size="18.5" font-weight="600" fill="#111827">Replay evt_5 to evt_8</text>
  <text x="324" y="557" text-anchor="middle" font-size="15.5" fill="#6B7280">No gap and no full reload.</text>

  
  <g filter="url(#pi-soft)">
    <rect x="676" y="442" width="480" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="676" y="442" width="6" height="90" fill="#D97706" clip-path="url(#pi-k11)"/>
  </g>
  <circle cx="714" cy="487" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,476.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="740" y="494" font-size="18.5" font-weight="600" fill="#111827">REST read, then a fresh stream</text>
  <text x="916" y="557" text-anchor="middle" font-size="15.5" fill="#6B7280">Recovery is promised, infinite history is not.</text>

  
  <rect x="40" y="614" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="659" text-anchor="middle" font-size="16" fill="#475569">Delivery is at least once, so a replayed event must be safe to apply again.</text>
</svg>