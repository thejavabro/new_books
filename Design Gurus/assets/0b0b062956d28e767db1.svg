<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="For 100 requests where 98 take 100 ms and 2 take 5,000 ms, the average is 198 ms, p50 is 100 ms, p95 is 100 ms, and p99 is 5,000 ms.">
  <defs>
    <filter id="lt2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lt2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lt2-k1"><rect x="40" y="130" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="lt2-k2"><rect x="340" y="130" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="lt2-k3"><rect x="640" y="130" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="lt2-k4"><rect x="940" y="130" width="260" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="510" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Why percentiles show what averages hide</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">100 requests: 98 take 100 ms, and 2 take 5,000 ms.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#lt2-soft)">
    <rect x="40" y="130" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#64748B" clip-path="url(#lt2-k1)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">Average: 198 ms</text>
  <text x="170" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">looks fine</text>
  <text x="170" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">hides the slow requests</text>
  <g filter="url(#lt2-soft)">
    <rect x="340" y="130" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="340" y="130" width="6" height="90" fill="#059669" clip-path="url(#lt2-k2)"/>
  </g>
  <circle cx="378" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="404" y="182" font-size="21.5" font-weight="600" fill="#111827">p50: 100 ms</text>
  <text x="470" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">half of the requests</text>
  <text x="470" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">are this fast or faster</text>
  <g filter="url(#lt2-soft)">
    <rect x="640" y="130" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="640" y="130" width="6" height="90" fill="#059669" clip-path="url(#lt2-k3)"/>
  </g>
  <circle cx="678" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="704" y="182" font-size="21.5" font-weight="600" fill="#111827">p95: 100 ms</text>
  <text x="770" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">95 of 100 requests</text>
  <text x="770" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">are this fast or faster</text>
  <g filter="url(#lt2-lift)">
    <rect x="940" y="130" width="260" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="940" y="130" width="9" height="90" fill="#DB2777" clip-path="url(#lt2-k4)"/>
  </g>
  <circle cx="978" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,164.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="1004" y="182" font-size="21.5" font-weight="600" fill="#111827">p99: 5,000 ms</text>
  <text x="1070" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">the slowest users</text>
  <text x="1070" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">wait 50 times longer</text>

  <rect x="40" y="330" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Tail latency</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">the slowest requests, which an average hides</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Many calls</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">a page that makes 10 calls meets at least one slow call about 10% of the time</text>
</svg>