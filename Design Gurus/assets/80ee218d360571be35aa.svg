  <text x="300" y="455" font-size="18" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 : many</text>
  <rect x="591" y="430" width="98" height="36" rx="8" fill="#FFFFFF" opacity="0.96"/>
  <text x="640" y="455" font-size="18" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 : many</text>

  <text x="200" y="770" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One row per recipient address.</text>
  <text x="560" y="770" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Only the key. Not the file.</text>

  <rect x="40" y="830" width="1160" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="620" y="870" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Why the body is not a column</text>
  <text x="620" y="910" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Searching by sender, subject or date reads small indexed rows and never touches a body.</text>
  <text x="620" y="940" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Bodies and attachments are written once and read whole, which is what a keyed store is for.</text>
</svg>