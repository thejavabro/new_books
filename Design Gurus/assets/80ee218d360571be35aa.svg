  <rect x="760" y="120" width="440" height="190" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#sch-shadow)"/>
  <text x="980" y="160" font-size="21" font-weight="700" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Document store</text>
  <text x="980" y="194" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One document per email, keyed by</text>
  <text x="980" y="221" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">email_id. Holds the body.</text>
  <rect x="760" y="520" width="440" height="190" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#sch-shadow)"/>
  <text x="980" y="560" font-size="21" font-weight="700" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Object store</text>
  <text x="980" y="594" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One object per attachment, addressed</text>
  <text x="980" y="621" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">by storage_key. Holds the file.</text>

