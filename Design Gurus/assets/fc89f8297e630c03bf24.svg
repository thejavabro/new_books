<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="relay-title relay-desc">
<title id="relay-title">Getting the events out</title>
<desc id="relay-desc">Polling needs no new infrastructure and costs database load and latency. Change data capture tails the write-ahead log and adds a replication slot that can fill the primary disk. A high-water-mark poller skips rows permanently.</desc>
<defs>
<marker id="relay-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="relay-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="relay-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="relay-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="780" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Getting the events out</text>
<text x="40" y="86" font-size="21" fill="#4A5568">There are two ways to run the relay, and the choice is an operational one rather than a correctness one.</text>
<rect x="40" y="702" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="702" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="40" y="118" width="560" height="196" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V308A6 6 0 0 0 46 314H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Polling</text>
<rect x="72" y="174" width="496" height="92" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="201" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">SELECT ... WHERE published_at IS NULL</text><text x="92" y="226" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">ORDER BY id LIMIT 100</text><text x="92" y="251" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">FOR UPDATE SKIP LOCKED</text>
<text x="320" y="294" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">No new infrastructure. Database load, and latency floor.</text>
<rect x="640" y="118" width="560" height="196" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V308A6 6 0 0 0 646 314H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Change data capture</text>
<rect x="672" y="174" width="496" height="92" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="213.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A connector tails the write-ahead log</text><text x="692" y="238.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and publishes rows as they commit.</text>
<text x="920" y="294" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">No polling load. A new system, and a new failure.</text>
<rect x="40" y="334" width="560" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="356.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SKIP LOCKED lets several relay instances</text><text x="320" y="383.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">run without stepping on each other</text>
<rect x="640" y="334" width="560" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="356.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A stalled connector holds the replication slot</text><text x="920" y="383.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and fills the disk of your primary</text>
<text x="40" y="440" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The watermark bug, which loses rows permanently</text>
<circle cx="60" cy="488" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="495" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="458" width="302" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="241" y="494" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Transaction A takes id 4</text>
<path d="M398 488H452" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M398 488H452" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#relay-marker-slate)"/>
<circle cx="482" cy="488" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="482" y="495" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="512" y="458" width="302" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="663" y="494" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Transaction B takes id 5</text>
<path d="M820 488H874" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M820 488H874" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#relay-marker-slate)"/>
<circle cx="904" cy="488" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="904" y="495" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="934" y="458" width="266" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1067" y="494" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">B commits first</text>
<circle cx="60" cy="560" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="567" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="530" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="566" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The relay reads to 5 and advances</text>
<path d="M566 560H620" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 560H620" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#relay-marker-red)"/>
<circle cx="650" cy="560" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="650" y="567" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="680" y="530" width="520" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="940" y="552.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A commits: row 4 is below the marker,</text><text x="940" y="579.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and is never read</text>
<rect x="40" y="614" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="614" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="651" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Filter on a per-row published flag, never on an id watermark.</text>
<text x="66" y="736" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Sequence values are handed out before commit, which is why the watermark is unsafe.</text>
</svg>