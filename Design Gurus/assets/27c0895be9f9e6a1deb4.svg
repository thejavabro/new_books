<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Turning off a failing feature with a flag takes seconds and needs no deploy, while rolling back the release takes a full build and deploy cycle to remove the same code">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>
  <defs>
    <marker id="rl6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A new recommendation service starts timing out at 09:14</text>

  
  <rect x="40" y="76" width="1160" height="200" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#B91C1C">Without a flag: roll back the release</text>

  <rect x="80" y="140" width="200" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="180" y="172" font-size="20" fill="#B91C1C" text-anchor="middle">revert the commit</text>
  <line x1="284" y1="166" x2="316" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#rl6-slate)"/>
  <rect x="320" y="140" width="160" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="400" y="172" font-size="20" fill="#B91C1C" text-anchor="middle">rebuild</text>
  <line x1="484" y1="166" x2="516" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#rl6-slate)"/>
  <rect x="520" y="140" width="160" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="600" y="172" font-size="20" fill="#B91C1C" text-anchor="middle">run CI</text>
  <line x1="684" y1="166" x2="716" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#rl6-slate)"/>
  <rect x="720" y="140" width="230" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="835" y="172" font-size="20" fill="#B91C1C" text-anchor="middle">deploy every pod</text>
  <text x="980" y="172" font-size="20" font-weight="600" fill="#B91C1C">25 minutes</text>

  <text x="620" y="238" font-size="20" fill="#334155" text-anchor="middle">Users see timeouts for the whole of it, and the rollback itself is a change under pressure.</text>

  
  <rect x="40" y="296" width="1160" height="200" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="330" font-size="20" font-weight="600" fill="#065F46">With a flag: turn the feature off</text>

  <rect x="80" y="360" width="280" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="220" y="392" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">flip recs_enabled to off</text>
  <line x1="364" y1="386" x2="396" y2="386" stroke="#475569" stroke-width="2" marker-end="url(#rl6-slate)"/>
  <rect x="400" y="360" width="300" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="550" y="392" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">every pod reads it within 10 s</text>
  <text x="730" y="392" font-size="20" font-weight="600" fill="#065F46">seconds, no deploy</text>

  <text x="620" y="458" font-size="20" fill="#334155" text-anchor="middle">The broken code is still deployed. It is simply not being called any more.</text>

  <rect x="50" y="536" width="1140" height="112" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="574" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A flag separates deploying code from enabling behaviour, which is what makes the</text>
  <text x="620" y="600" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">fast path also the safe path during an incident.</text>
  <text x="620" y="632" font-size="20" fill="#334155" text-anchor="middle">The price is that every flag is a branch you must eventually delete.</text>
</svg>