<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flow for adopting a service mesh: three checks in order, fewer than about a dozen services, many languages or an mTLS everywhere mandate, and a platform team to run it. Any one answer sends you back to libraries and platform primitives; only when all three point the same way do you adopt a mesh and accept its costs.">
  <defs>
    <marker id="m06-l02-mesh-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l02-mesh-decision-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m06-l02-mesh-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <text x="60" y="44" font-size="20" font-weight="600" fill="#334155">Three checks before a mesh</text>
  <text x="1180" y="44" text-anchor="end" font-size="20" fill="#64748B">any one of them sends you back to libraries</text>

  <g filter="url(#m06-l02-mesh-decision-soft)">
    <rect x="140" y="80" width="440" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="126" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Do we need a service mesh?</text>
  <text x="360" y="158" text-anchor="middle" font-size="20" fill="#64748B">the placement judgment</text>
  <rect x="100" y="225" width="520" height="520" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g filter="url(#m06-l02-mesh-decision-soft)">
    <rect x="140" y="240" width="440" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="296" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Fewer than a dozen services?</text>
  <text x="360" y="328" text-anchor="middle" font-size="20" fill="#64748B">below that, a mesh is ceremony</text>
  <g filter="url(#m06-l02-mesh-decision-soft)">
    <rect x="140" y="420" width="440" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="476" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Polyglot, or mTLS everywhere?</text>
  <text x="360" y="508" text-anchor="middle" font-size="20" fill="#64748B">the most common tipping point</text>
  <g filter="url(#m06-l02-mesh-decision-soft)">
    <rect x="140" y="600" width="440" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3. A platform team to run it?</text>
  <text x="360" y="688" text-anchor="middle" font-size="20" fill="#64748B">somebody has to own the layer</text>

  <g filter="url(#m06-l02-mesh-decision-soft)">
    <rect x="790" y="300" width="390" height="170" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="985" y="344" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Use libraries and</text>
  <text x="985" y="376" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">platform primitives</text>
  <text x="985" y="408" text-anchor="middle" font-size="20" fill="#64748B">timeouts and retries stay in code</text>
  <text x="985" y="440" text-anchor="middle" font-size="20" fill="#64748B">no new layer to run</text>
  <g filter="url(#m06-l02-mesh-decision-soft)">
    <rect x="790" y="530" width="390" height="150" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="985" y="580" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A common mistake</text>
  <text x="985" y="612" text-anchor="middle" font-size="20" fill="#64748B">proposing a mesh for five services</text>
  <text x="985" y="644" text-anchor="middle" font-size="20" fill="#64748B">without naming a single cost</text>
  <g filter="url(#m06-l02-mesh-decision-soft)">
    <rect x="790" y="790" width="390" height="170" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="985" y="834" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Adopt a mesh, and</text>
  <text x="985" y="866" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">accept its costs</text>
  <text x="985" y="898" text-anchor="middle" font-size="20" fill="#64748B">one policy layer, every language</text>
  <text x="985" y="930" text-anchor="middle" font-size="20" fill="#64748B">a critical system of its own</text>

  <g fill="none" stroke-width="2.5">
    <path d="M360,190 L360,232" stroke="#475569" stroke-width="2" marker-end="url(#m06-l02-mesh-decision-sl)"/>
    <path d="M360,370 L360,412" stroke="#3B82F6" marker-end="url(#m06-l02-mesh-decision-bl)"/>
    <path d="M360,550 L360,592" stroke="#3B82F6" marker-end="url(#m06-l02-mesh-decision-bl)"/>
    <path d="M360,730 L360,850 L782,850" stroke="#3B82F6" marker-end="url(#m06-l02-mesh-decision-bl)"/>
    <path d="M580,305 L782,305" stroke="#475569" stroke-width="2" marker-end="url(#m06-l02-mesh-decision-sl)"/>
    <path d="M580,485 L680,485 L680,355 L782,355" stroke="#475569" stroke-width="2" marker-end="url(#m06-l02-mesh-decision-sl)"/>
    <path d="M580,665 L730,665 L730,405 L782,405" stroke="#475569" stroke-width="2" marker-end="url(#m06-l02-mesh-decision-sl)"/>
  </g>

  <text x="396" y="395" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="396" y="575" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="396" y="800" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="660" y="293" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="612" y="473" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="612" y="653" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <line x1="60" y1="1010" x2="96" y2="1010" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1017" font-size="20" fill="#475569">The case for a mesh keeps building: this path ends in adoption</text>
  <line x1="60" y1="1050" x2="96" y2="1050" stroke="#475569" stroke-width="4"/>
  <text x="108" y="1057" font-size="20" fill="#475569">This answer settles it: libraries and platform primitives are enough</text>
</svg>