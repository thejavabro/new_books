<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="752" viewBox="0 0 1240 752" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three related but different markers in an offline sync design: a sync position answers what the client has already applied, a cursor answers where one page of results continues, and an event id answers where a live delivery channel resumes.">
  <defs>
    <filter id="p3f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3f-k1"><rect x="76" y="156" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p3f-k2"><rect x="76" y="322" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p3f-k3"><rect x="76" y="488" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="752" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three markers that look alike and are not</text>
  <text x="424" y="77" font-size="15.5" fill="#6B7280">the question it answers</text>
  <text x="828" y="77" font-size="15.5" fill="#6B7280">typical lifetime</text>

  
  <rect x="40" y="126" width="1160" height="150" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <g filter="url(#p3f-soft)">
    <rect x="76" y="156" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="156" width="6" height="90" fill="#D97706" clip-path="url(#p3f-k1)"/>
  </g>
  <circle cx="114" cy="201" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,190.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="208" font-size="18.5" font-weight="600" fill="#111827">sync position</text>
  <g transform="translate(396,194) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="424" y="207" font-size="15.5" fill="#6B7280">"What has this client already applied?"</text>
  <g transform="translate(800,194) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="828" y="207" font-size="15.5" fill="#94A3B8">Persisted with local state, across restarts</text>

  
  <rect x="40" y="292" width="1160" height="150" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <g filter="url(#p3f-soft)">
    <rect x="76" y="322" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="322" width="6" height="90" fill="#2563EB" clip-path="url(#p3f-k2)"/>
  </g>
  <circle cx="114" cy="367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,356.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="374" font-size="18.5" font-weight="600" fill="#111827">cursor</text>
  <g transform="translate(396,360) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="424" y="373" font-size="15.5" fill="#6B7280">"Where does this page of results continue?"</text>
  <g transform="translate(800,360) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="828" y="373" font-size="15.5" fill="#94A3B8">One traversal of one query</text>

  
  <rect x="40" y="458" width="1160" height="150" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <g filter="url(#p3f-soft)">
    <rect x="76" y="488" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="488" width="6" height="90" fill="#059669" clip-path="url(#p3f-k3)"/>
  </g>
  <circle cx="114" cy="533" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,522.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="540" font-size="18.5" font-weight="600" fill="#111827">event id</text>
  <g transform="translate(396,526) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="424" y="539" font-size="15.5" fill="#6B7280">"Where does the live channel resume?"</text>
  <g transform="translate(800,526) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="828" y="539" font-size="15.5" fill="#94A3B8">The published replay buffer, minutes at most</text>

  
  <rect x="40" y="636" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="681" text-anchor="middle" font-size="16" fill="#475569">A client that reuses one of these as another will eventually lose changes or replay them forever.</text>
</svg>