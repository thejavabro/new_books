<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Estimate what crosses the network</title><desc id="desc">Twenty compressed post records plus ten images total 1.02 MB. At two megabits per second, ideal transfer takes 4.08 seconds before other delays.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="660" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Estimate what crosses the network</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Example values use decimal KB and MB.</tspan></text><rect x="50" y="175" width="345.3333333333333" height="255" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="217" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Post text</tspan></text><text x="72" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">20 × 2 KB = 40 KB</tspan><tspan x="72" dy="32">2:1 compression: 20 KB</tspan></text><path d="M399.3333333333333 302.5 H423.3333333333333" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="427.3333333333333" y="175" width="345.3333333333333" height="255" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="449.3333333333333" y="217" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="449.3333333333333" dy="0">Visible images</tspan></text><text x="449.3333333333333" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="449.3333333333333" dy="0">10 × 100 KB</tspan><tspan x="449.3333333333333" dy="32">1,000 KB total</tspan></text><path d="M776.6666666666666 302.5 H800.6666666666666" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="804.6666666666666" y="175" width="345.3333333333333" height="255" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="826.6666666666666" y="217" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="826.6666666666666" dy="0">Page transfer</tspan></text><text x="826.6666666666666" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="826.6666666666666" dy="0">1,020 KB = 1.02 MB</tspan><tspan x="826.6666666666666" dy="32">At 2 Mb/s: 4.08 s</tspan></text><rect x="50" y="500" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="546" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">This is ideal transfer time, not total screen-loading time.</tspan></text></g></svg>