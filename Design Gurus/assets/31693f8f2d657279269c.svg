<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="764" viewBox="0 0 1240 764" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The facade sits between the client and both systems. It holds one route table. Requests for endpoints that have been migrated go to the new services, and every other endpoint still goes to the legacy system. The client calls one address and never learns which side answered">
  <defs>
    <marker id="sf2-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="sf2-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="sf2-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="sf2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sf2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sf2-kc"><rect x="490" y="54" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="sf2-kf"><rect x="460" y="200" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="sf2-k1"><rect x="72" y="416" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sf2-k2"><rect x="357" y="416" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sf2-k3"><rect x="642" y="416" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sf2-k4"><rect x="927" y="416" width="240" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="764" fill="#FFFFFF"/>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,144 L620,196" marker-end="url(#sf2-sl)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2.5">
    <path d="M620,290 L620,348 Q620,360 608,360 L204,360 Q192,360 192,372 L192,412" marker-end="url(#sf2-em)"/>
    <path d="M620,290 L620,348 Q620,360 608,360 L489,360 Q477,360 477,372 L477,412" marker-end="url(#sf2-em)"/>
  </g>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M620,290 L620,348 Q620,360 632,360 L750,360 Q762,360 762,372 L762,412" marker-end="url(#sf2-am)"/>
    <path d="M620,290 L620,348 Q620,360 632,360 L1035,360 Q1047,360 1047,372 L1047,412" marker-end="url(#sf2-am)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="700" y="177" fill="#475569">one address</text>
  </g>

  
  <g filter="url(#sf2-soft)">
    <rect x="490" y="54" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="490" y="54" width="6" height="90" fill="#64748B" clip-path="url(#sf2-kc)"/>
  </g>
  <circle cx="528" cy="99" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,88.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="554" y="106" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#sf2-lift)">
    <rect x="460" y="200" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="460" y="200" width="9" height="90" fill="#2563EB" clip-path="url(#sf2-kf)"/>
  </g>
  <circle cx="498" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,234.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="524" y="252" font-size="18.5" font-weight="600" fill="#111827">Facade Interface</text>
  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="6"><text x="620" y="315" font-size="15.5" text-anchor="middle" fill="#6B7280">one route table decides where each request goes</text></g>

  
  <g filter="url(#sf2-soft)">
    <rect x="72" y="416" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="416" width="6" height="90" fill="#059669" clip-path="url(#sf2-k1)"/>
  </g>
  <circle cx="110" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,450.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="136" y="468" font-size="18.5" font-weight="600" fill="#111827">/users</text>
  <text x="192" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">new user service</text>
  <text x="192" y="554" font-size="15.5" text-anchor="middle" fill="#94A3B8">migrated first</text>

  <g filter="url(#sf2-soft)">
    <rect x="357" y="416" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="357" y="416" width="6" height="90" fill="#059669" clip-path="url(#sf2-k2)"/>
  </g>
  <circle cx="395" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(384.56,450.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="421" y="468" font-size="18.5" font-weight="600" fill="#111827">/products</text>
  <text x="477" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">new catalog service</text>
  <text x="477" y="554" font-size="15.5" text-anchor="middle" fill="#94A3B8">migrated second</text>

  
  <g filter="url(#sf2-soft)">
    <rect x="642" y="416" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="642" y="416" width="6" height="90" fill="#D97706" clip-path="url(#sf2-k3)"/>
  </g>
  <circle cx="680" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(669.56,450.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="706" y="468" font-size="18.5" font-weight="600" fill="#111827">/orders</text>
  <text x="762" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">still the legacy system</text>
  <text x="762" y="554" font-size="15.5" text-anchor="middle" fill="#94A3B8">next one to move</text>

  <g filter="url(#sf2-soft)">
    <rect x="927" y="416" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="927" y="416" width="6" height="90" fill="#D97706" clip-path="url(#sf2-k4)"/>
  </g>
  <circle cx="965" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(954.56,450.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="991" y="468" font-size="18.5" font-weight="600" fill="#111827">/billing</text>
  <text x="1047" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">still the legacy system</text>
  <text x="1047" y="554" font-size="15.5" text-anchor="middle" fill="#94A3B8">not started</text>

  
  <rect x="40" y="596" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="620" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="642" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Migrated route</text>
  <text x="288" y="642" font-size="15.5" fill="#475569">the new service answers, and the legacy code for this route can be deleted once traffic is stable</text>

  <rect x="64" y="664" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="686" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Unmigrated route</text>
  <text x="288" y="686" font-size="15.5" fill="#475569">the legacy system answers exactly as before, so nothing breaks while the migration is part done</text>
</svg>