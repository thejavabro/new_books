<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="watch-title watch-desc">
<title id="watch-title">What to watch, and what it means</title>
<desc id="watch-desc">Write latency, error rate split by path, backfill rate, replication lag, mismatches split by row age, and the old write path call count. Each is instrumented for a specific failure of this operation.</desc>
<defs>
<marker id="watch-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="watch-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="watch-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="watch-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="832" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What to watch, and what it means</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Each is instrumented for a specific failure of this operation.</text>
<rect x="40" y="754" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="754" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write latency on the dual-write path</text>
<path d="M526 148H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 148H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#watch-marker-slate)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it has gone up; the question is whether anything</text><text x="590" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">upstream has a timeout that no longer fits</text>
<rect x="40" y="190" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Error rate split by path</text>
<path d="M526 220H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 220H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#watch-marker-slate)"/>
<rect x="570" y="190" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an aggregate hides a new path failing entirely</text><text x="590" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">while the old one carries traffic</text>
<rect x="40" y="262" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backfill progress as a rate</text>
<path d="M526 292H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 292H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#watch-marker-slate)"/>
<rect x="570" y="262" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because the question is whether it finishes</text><text x="590" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">before the next thing needs it</text>
<rect x="40" y="334" width="480" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Replication lag</text>
<path d="M526 364H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 364H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#watch-marker-slate)"/>
<rect x="570" y="334" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the first thing a backfill damages, and the</text><text x="590" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">signal the throttle follows</text>
<rect x="40" y="406" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Mismatches split by row age</text>
<path d="M526 436H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 436H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#watch-marker-slate)"/>
<rect x="570" y="406" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">falling on old rows is progress; any on recent</text><text x="590" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rows stops the migration</text>
<rect x="40" y="478" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="514" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The old write path call count</text>
<path d="M526 508H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 508H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#watch-marker-slate)"/>
<rect x="570" y="478" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="501.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">after phase 8 it should be zero, and anything</text><text x="590" y="526.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">else is the writer nobody knew about</text>
<rect x="40" y="568" width="1160" height="74" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="568" width="5" height="74" rx="2.5" fill="#39D5AA"/><text x="64" y="598" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Dashboards for a migration are not ordinary dashboards.</text><text x="64" y="624" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">You are watching for the specific ways this operation fails, rather than for general health.</text>
<rect x="40" y="654" width="1160" height="74" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="654" width="5" height="74" rx="2.5" fill="#F3CF6A"/><text x="64" y="684" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Set up the last one before you need it</text><text x="64" y="710" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">It is the difference between finding a forgotten writer during the soak and after the drop.</text>
<text x="66" y="788" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A plan with gates but no instrumentation cannot actually be gated.</text>
</svg>