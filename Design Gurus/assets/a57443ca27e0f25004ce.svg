<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Strong consistency: the write is confirmed only after every replica holds it, so a later read on any replica returns the new value">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="cp3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="cp3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cp3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="cp3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="1200" height="230" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="76" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">A write is confirmed only after every replica holds it</text>

  
  <line x1="250" y1="165" x2="382" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#cp3-slate)"/>
  <path d="M580,155 C640,155 660,140 712,140" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cp3-blue)"/>
  <path d="M580,175 C640,175 660,208 712,208" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cp3-blue)"/>
  <path d="M900,140 C930,140 930,160 942,160" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#cp3-emerald)"/>
  <path d="M900,208 C930,208 930,180 942,180" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#cp3-emerald)"/>
  <text x="316" y="147" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">write v2</text>

  <g filter="url(#cp3-soft)">
    <rect x="60" y="125" width="190" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="390" y="125" width="190" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="720" y="110" width="180" height="62" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="720" y="178" width="180" height="62" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="950" y="130" width="240" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="155" y="173" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="485" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R1</text>
  <text x="485" y="186" font-size="20" fill="#64748B" text-anchor="middle">v2</text>
  <text x="810" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R2  v2</text>
  <text x="810" y="216" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R3  v2</text>
  <text x="1070" y="160" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">now confirmed</text>
  <text x="1070" y="188" font-size="20" fill="#059669" text-anchor="middle">to the client</text>

  <rect x="20" y="300" width="1200" height="190" rx="14" fill="#ECFDF5" fill-opacity="0.45" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="336" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">A later read on any replica returns the new value</text>

  <line x1="250" y1="410" x2="712" y2="410" stroke="#475569" stroke-width="2.5" marker-end="url(#cp3-slate)"/>
  <line x1="900" y1="410" x2="942" y2="410" stroke="#059669" stroke-width="2.5" marker-end="url(#cp3-emerald)"/>
  <text x="480" y="392" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read, and it lands on R3</text>

  <g filter="url(#cp3-soft)">
    <rect x="60" y="370" width="190" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="720" y="370" width="180" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="950" y="370" width="240" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="155" y="418" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="810" y="418" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R3  v2</text>
  <text x="1070" y="418" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">returns v2</text>

  <text x="620" y="530" font-size="20" fill="#475569" text-anchor="middle">The waiting in the first row is what makes the second row a guarantee rather than a coincidence.</text>
</svg>