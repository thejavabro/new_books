<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="822" viewBox="0 0 1240 822" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four bus routes with the starting stop marked">
<defs>
<filter id="br-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="822" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How few buses get from stop 3 to stop 12?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The answer counts buses taken, not stops travelled, so the search should be over buses</text>
<rect x="40" y="106" width="1160" height="566" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Green is the starting stop 3, and pink is the target 12</text>
<text x="276" y="238" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">bus 0</text>
<rect x="300" y="206" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="346" y="238" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">2</text>
<rect x="408" y="206" width="92" height="50" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2.5"/>
<text x="454" y="238" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">3</text>
<rect x="516" y="206" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="562" y="238" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">4</text>
<text x="276" y="316" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">bus 1</text>
<rect x="300" y="284" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="346" y="316" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">5</text>
<rect x="408" y="284" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="454" y="316" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">6</text>
<rect x="516" y="284" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="562" y="316" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">7</text>
<rect x="624" y="284" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="670" y="316" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">8</text>
<text x="276" y="394" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">bus 2</text>
<rect x="300" y="362" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="346" y="394" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">4</text>
<rect x="408" y="362" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="454" y="394" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">5</text>
<rect x="516" y="362" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="562" y="394" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">9</text>
<rect x="624" y="362" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="670" y="394" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">10</text>
<text x="276" y="472" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">bus 3</text>
<rect x="300" y="440" width="92" height="50" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="346" y="472" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">10</text>
<rect x="408" y="440" width="92" height="50" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2.5"/>
<text x="454" y="472" text-anchor="middle" font-size="19.5" font-weight="600" fill="#BE185D">12</text>
<rect x="290" y="528" width="660" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="561.02" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">standing at stop 3, no buses taken yet</text>
<text x="620" y="616" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Searching stop by stop would count stops, which is not what the question asks</text>
<rect x="40" y="684" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="724" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">One bus ride reaches every stop on that route at once</text>
<text x="620" y="756" text-anchor="middle" font-size="18.5" fill="#475569">So a whole route is a single step, and the search spreads one bus at a time</text>
</svg>