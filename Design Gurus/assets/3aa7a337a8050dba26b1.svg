<text x="164" y="884" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">check the rule</text>
<text x="288" y="884" font-size="15.5" fill="#475569">this answer assumes one PIN covers one area. Where that is false, the key of Location must be Pin and Area together</text>
