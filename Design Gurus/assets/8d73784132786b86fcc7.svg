<text x="320" y="416" font-size="19" font-weight="400" fill="#169B77" text-anchor="middle">spread across the window</text>
<rect x="640" y="118" width="560" height="320" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V432A6 6 0 0 0 646 438H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">One very hot key</text>
<rect x="700" y="174" width="440" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one key, one expiry time</text>
