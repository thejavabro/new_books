<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="704" viewBox="0 0 1240 704" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="jitter-title jitter-desc">
<title id="jitter-title">What jitter fixes, and what it cannot</title>
<desc id="jitter-desc">Jitter spreads apart a population of keys that were written together, turning a wave of misses into a trickle. It does nothing for a single hot key, which has only one expiry moment however randomly that moment is chosen.</desc>
<defs>
<marker id="jitter-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="jitter-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="jitter-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="jitter-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="704" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What jitter fixes, and what it cannot</text>
<text x="40" y="86" font-size="21" fill="#4A5568">They address different problems that produce the same graph.</text>
