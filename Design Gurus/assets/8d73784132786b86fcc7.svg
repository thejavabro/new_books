<rect x="700" y="266" width="440" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">jitter moves that one moment</text>
<path d="M920 324V352" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 324V352" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#jitter-marker-slate)"/>
<rect x="700" y="358" width="440" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="390" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every request still misses at once</text>
<rect x="40" y="462" width="1160" height="138" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="620" y="498" font-size="23" font-weight="700" fill="#6040A8" text-anchor="middle">The two produce the same graph and need opposite fixes.</text>
<rect x="70" y="518" width="540" height="62" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="340" y="541.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Many keys together</text><text x="340" y="568.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">jitter</text>
<rect x="630" y="518" width="540" height="62" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="900" y="541.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One hot key</text><text x="900" y="568.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">coalescing or early refresh</text>
<text x="66" y="660" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A lock across a hundred thousand keys serializes a cache layer that nothing was contending for.</text>
