<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="452" viewBox="0 0 1240 452" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Inserting one row into a table that has three indexes means four writes: one for the table and one for each index. Every index makes reads faster and writes slower.">
  <rect x="0" y="0" width="1240" height="452" fill="#FFFFFF"/>
  <defs>
    <marker id="ix2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ix2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ix2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ix2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ix2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ix2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ix2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ix2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One insert, four writes</text>
  <g filter="url(#ix2-soft)"><rect x="60" y="156" width="220" height="76" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="170" y="202" font-size="20" fill="#0F172A" text-anchor="middle">INSERT one row</text>
  <g filter="url(#ix2-soft)"><rect x="620" y="80" width="320" height="68" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="780" y="122" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">the table</text>
  <line x1="284" y1="194" x2="614" y2="114" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#ix2-v)"/>
  <g filter="url(#ix2-soft)"><rect x="620" y="168" width="320" height="68" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="780" y="210" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">index on email</text>
  <line x1="284" y1="194" x2="614" y2="202" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#ix2-b)"/>
  <g filter="url(#ix2-soft)"><rect x="620" y="256" width="320" height="68" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="780" y="298" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">index on created_at</text>
  <line x1="284" y1="194" x2="614" y2="290" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#ix2-b)"/>
  <g filter="url(#ix2-soft)"><rect x="620" y="344" width="320" height="68" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="780" y="386" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">index on (city, name)</text>
  <line x1="284" y1="194" x2="614" y2="378" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#ix2-b)"/>
  <text x="1180" y="130" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">Reads get faster.</text>
  <text x="1180" y="160" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="end">Writes get slower.</text>
  <text x="170" y="268" font-size="19" fill="#64748B" text-anchor="middle">Also true for every</text>
  <text x="170" y="294" font-size="19" fill="#64748B" text-anchor="middle">UPDATE and DELETE.</text>
</svg>