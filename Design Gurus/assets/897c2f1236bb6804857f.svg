<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Fanout of 500: one root page addresses 400 internal pages, which address 200,000 leaf pages holding 100 million entries, and the top two levels stay cached in memory">
  <rect x="0" y="0" width="1240" height="570" fill="#FFFFFF"/>
  <defs>
    <marker id="ix9-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="ix9-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <text x="293" y="72" font-size="20" fill="#475569" text-anchor="middle">500 per page</text>
  <text x="619" y="72" font-size="20" fill="#475569" text-anchor="middle">500 per page</text>
  <text x="945" y="72" font-size="20" fill="#475569" text-anchor="middle">500 per page</text>

  
  <line x1="243" y1="145" x2="338" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#ix9-slate)"/>
  <line x1="569" y1="145" x2="664" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#ix9-slate)"/>
  <line x1="895" y1="145" x2="990" y2="145" stroke="#475569" stroke-width="2" marker-end="url(#ix9-slate)"/>

  
  <g filter="url(#ix9-soft)">
    <rect x="20" y="90" width="220" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="346" y="90" width="220" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="672" y="90" width="220" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="998" y="90" width="220" height="110" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="130" y="134" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Root</text>
  <text x="130" y="166" font-size="20" fill="#64748B" text-anchor="middle">1 page</text>
  <text x="456" y="134" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Internal level</text>
  <text x="456" y="166" font-size="20" fill="#64748B" text-anchor="middle">400 pages</text>
  <text x="782" y="134" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Leaf level</text>
  <text x="782" y="166" font-size="20" fill="#64748B" text-anchor="middle">200,000 pages</text>
  <text x="1108" y="134" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Index entries</text>
  <text x="1108" y="166" font-size="20" fill="#64748B" text-anchor="middle">100 million</text>

  
  <line x1="130" y1="200" x2="130" y2="242" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="456" y1="200" x2="456" y2="242" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="782" y1="200" x2="782" y2="242" stroke="#CBD5E1" stroke-width="1.5"/>

  
  <rect x="20" y="242" width="546" height="60" rx="12" fill="#ECFDF5" fill-opacity="0.6" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="293" y="279" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">Stays in memory, about 6 MB in total</text>

  <rect x="672" y="242" width="220" height="60" rx="12" fill="#F1F5F9" fill-opacity="0.8" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="782" y="279" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">One disk read</text>

  <text x="620" y="362" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A lookup reads the root, one internal page and one leaf. Only the leaf comes from disk.</text>

  
  <rect x="170" y="400" width="900" height="86" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="435" font-size="20" fill="#334155" text-anchor="middle">Multiply the table by 500 and the tree gains one level.</text>
  <text x="620" y="465" font-size="20" fill="#334155" text-anchor="middle">50 billion rows would be four levels deep, so a lookup would cost one more page read.</text>

  <text x="620" y="536" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The tree grows in levels, not in reads per row, which is why a bigger table barely slows a lookup.</text>
</svg>