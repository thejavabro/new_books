<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The load balancer checks each server every 10 seconds. After 3 failed checks in a row, the server is removed and gets no new traffic. After it recovers and passes 2 checks, it is added back and gets traffic again.">
  <defs>
    <filter id="ld3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ld3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ld3-k1"><rect x="40" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ld3-k2"><rect x="281" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ld3-k3"><rect x="522" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ld3-k4"><rect x="763" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ld3-k5"><rect x="1004" y="140" width="196" height="90" rx="12"/></clipPath>
    <marker id="ld3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How health checks remove and restore a server</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A typical setup: a check every 10 seconds, 3 failures to remove, 2 passes to add back.</text>



  <g fill="none" stroke-width="2">
    <path d="M236,185 H281" stroke="#64748B" marker-end="url(#ld3-m-slate)"/>
    <path d="M477,185 H522" stroke="#64748B" marker-end="url(#ld3-m-slate)"/>
    <path d="M718,185 H763" stroke="#64748B" marker-end="url(#ld3-m-slate)"/>
    <path d="M959,185 H1004" stroke="#64748B" marker-end="url(#ld3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ld3-soft)">
    <rect x="40" y="140" width="196" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ld3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Every 10 s</text>
  <text x="138" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">GET /health</text>
  <text x="138" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">to each server</text>
  <g filter="url(#ld3-soft)">
    <rect x="281" y="140" width="196" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="281" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#ld3-k2)"/>
  </g>
  <circle cx="319" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(308.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="345" y="192" font-size="21.5" font-weight="600" fill="#111827">3 failures</text>
  <text x="379" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">no answer</text>
  <text x="379" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">or an error</text>
  <g filter="url(#ld3-lift)">
    <rect x="522" y="140" width="196" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="522" y="140" width="9" height="90" fill="#D97706" clip-path="url(#ld3-k3)"/>
  </g>
  <circle cx="560" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(549.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="586" y="192" font-size="21.5" font-weight="600" fill="#111827">Removed</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">no new traffic</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">goes to it</text>
  <g filter="url(#ld3-soft)">
    <rect x="763" y="140" width="196" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="763" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ld3-k4)"/>
  </g>
  <circle cx="801" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(790.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="827" y="192" font-size="21.5" font-weight="600" fill="#111827">2 passes</text>
  <text x="861" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the server</text>
  <text x="861" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">has recovered</text>
  <g filter="url(#ld3-soft)">
    <rect x="1004" y="140" width="196" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1004" y="140" width="6" height="90" fill="#059669" clip-path="url(#ld3-k5)"/>
  </g>
  <circle cx="1042" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(1031.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1068" y="192" font-size="21.5" font-weight="600" fill="#111827">Added back</text>
  <text x="1102" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">it gets traffic</text>
  <text x="1102" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">again</text>

  <rect x="40" y="330" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Active checks</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">the load balancer sends test requests on a timer</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Passive checks</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">it also watches real requests for errors and timeouts</text>
</svg>