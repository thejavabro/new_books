<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1626" viewBox="0 0 1240 1626" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven trade-offs of the booking API, each with what it gives and the cost accepted: a hold resource, capacity taken at hold creation, a five-minute published hold, 410 for expired holds, cached availability, a pending booking on unknown payment, and a policy snapshot.">
  <defs>
    <filter id="p2r-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2r-ks"><rect x="598" y="61" width="34" height="22" rx="5"/></clipPath>
    <clipPath id="p2r-k1"><rect x="76" y="146" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2r-k2"><rect x="76" y="342" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2r-k3"><rect x="76" y="538" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2r-k4"><rect x="76" y="734" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2r-k5"><rect x="76" y="930" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2r-k6"><rect x="76" y="1126" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2r-k7"><rect x="76" y="1322" width="440" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1626" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Booking: seven choices, seven costs</text>

  <rect x="598" y="61" width="34" height="22" rx="5" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.4"/>
  <rect x="598" y="61" width="5" height="22" fill="#059669" clip-path="url(#p2r-ks)"/>
  <text x="646" y="77" font-size="15.5" fill="#6B7280">chosen</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M740,71 L744.5,75.5 L752,65.5"/>
  </g>
  <text x="766" y="77" font-size="15.5" fill="#6B7280">what it gives</text>

  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M950,66 L961,77 M961,66 L950,77"/>
  </g>
  <text x="976" y="77" font-size="15.5" fill="#6B7280">cost accepted</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2r-soft)">
    <rect x="76" y="146" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p2r-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">A Hold resource</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,256 L82.5,260.5 L90,250.5"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">Temporary ownership gains an id, quantity, expiry, and lifecycle.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,277 L89,288 M89,277 L78,288"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Cleanup, tombstone retention, and capacity hidden from others.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2r-soft)">
    <rect x="76" y="342" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#059669" clip-path="url(#p2r-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">Capacity taken at hold creation</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,452 L82.5,456.5 L90,446.5"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">Exactly one caller wins the last place before paying.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,473 L89,484 M89,473 L78,484"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Abandoned holds reduce apparent availability until expiry.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2r-soft)">
    <rect x="76" y="538" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p2r-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">A five-minute published hold</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,648 L82.5,652.5 L90,642.5"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">Time to pay, while abandoned capacity returns soon.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,669 L89,680 M89,669 L78,680"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">Rejecting a customer who finishes after the deadline.</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2r-soft)">
    <rect x="76" y="734" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#059669" clip-path="url(#p2r-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">410 for expired holds</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,844 L82.5,848.5 L90,838.5"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">The caller can tell late apart from wrong.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,865 L89,876 M89,865 L78,876"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Retaining expired ids, and making expiry a permanent part of the contract.</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2r-soft)">
    <rect x="76" y="930" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#059669" clip-path="url(#p2r-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">Cached availability</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1040 L82.5,1044.5 L90,1034.5"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">Public reads scale and respond quickly.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1061 L89,1072 M89,1061 L78,1072"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">A visible slot may fail at hold creation, within the stale window.</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2r-soft)">
    <rect x="76" y="1126" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#059669" clip-path="url(#p2r-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">Pending on unknown payment</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1236 L82.5,1240.5 L90,1230.5"/>
  </g>
  <text x="104" y="1242" font-size="15.5" fill="#6B7280">The API never invents a result.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1257 L89,1268 M89,1257 L78,1268"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">Holding capacity while reconciliation finishes.</text>

  
  <rect x="40" y="1302" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2r-soft)">
    <rect x="76" y="1322" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1322" width="6" height="90" fill="#059669" clip-path="url(#p2r-k7)"/>
  </g>
  <circle cx="114" cy="1367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1356.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="140" y="1374" font-size="18.5" font-weight="600" fill="#111827">A policy snapshot on the booking</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1432 L82.5,1436.5 L90,1426.5"/>
  </g>
  <text x="104" y="1438" font-size="15.5" fill="#6B7280">The customer keeps the rule accepted at purchase.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1453 L89,1464 M89,1453 L78,1464"/>
  </g>
  <text x="104" y="1464" font-size="15.5" fill="#6B7280">Storing and honoring several historical policy versions.</text>

  
  <rect x="40" y="1510" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1555" text-anchor="middle" font-size="16" fill="#475569">The cost proves that the alternative was actually considered.</text>
</svg>