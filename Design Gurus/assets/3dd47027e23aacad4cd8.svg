<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1528" viewBox="0 0 1240 1528" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The complete ten-step reconnect sequence: open local data, read the saved position, request changes after it, apply them in order, commit the new position, re-evaluate queued changes, send one at a time per scope, stop on first failure, persist accepted results, and resume the live channel.">
  <defs>
    <marker id="p3i-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p3i-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3i-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3i-k1"><rect x="320" y="174" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k2"><rect x="320" y="298" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k3"><rect x="320" y="406" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k4"><rect x="320" y="514" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k5"><rect x="320" y="622" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k6"><rect x="320" y="770" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k7"><rect x="320" y="894" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k8"><rect x="320" y="1002" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k9"><rect x="320" y="1110" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p3i-k10"><rect x="320" y="1258" width="600" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1528" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">One deterministic reconnect sequence</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">ten steps, in order</text>

  
  <rect x="40" y="126" width="1160" height="572" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Catch up first: apply server changes</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">five steps</text>

  
  <rect x="40" y="722" width="1160" height="464" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="752" font-size="16.5" font-weight="600" fill="#B45309">Then upload the queued local changes</text>
  <text x="1176" y="752" text-anchor="end" font-size="15.5" fill="#6B7280">four steps</text>

  
  <rect x="40" y="1210" width="1160" height="146" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="1240" font-size="16.5" font-weight="600" fill="#047857">Then resume live</text>
  <text x="1176" y="1240" text-anchor="end" font-size="15.5" fill="#6B7280">one step</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,258 V298" marker-end="url(#p3i-sl)"/>
    <path d="M620,356 V406" marker-end="url(#p3i-sl)"/>
    <path d="M620,464 V514" marker-end="url(#p3i-sl)"/>
    <path d="M620,572 V622" marker-end="url(#p3i-sl)"/>
    <path d="M620,680 V770" marker-end="url(#p3i-sl)"/>
    <path d="M620,854 V894" marker-end="url(#p3i-sl)"/>
    <path d="M620,952 V1002" marker-end="url(#p3i-sl)"/>
    <path d="M620,1060 V1110" marker-end="url(#p3i-sl)"/>
    <path d="M620,1168 V1258" marker-end="url(#p3i-sl)"/>
  </g>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="174" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="174" width="6" height="48" fill="#2563EB" clip-path="url(#p3i-k1)"/>
  </g>
  <circle cx="354" cy="198" r="15" fill="#FFFFFF"/>
  <text x="354" y="204" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2563EB">1</text>
  <text x="378" y="205" font-size="18.5" font-weight="600" fill="#111827">Open local data immediately</text>
  <text x="620" y="247" text-anchor="middle" font-size="15.5" fill="#6B7280">So the person is never staring at a spinner</text>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="298" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="298" width="6" height="48" fill="#2563EB" clip-path="url(#p3i-k2)"/>
  </g>
  <circle cx="354" cy="322" r="15" fill="#FFFFFF"/>
  <text x="354" y="328" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2563EB">2</text>
  <text x="378" y="329" font-size="18.5" font-weight="600" fill="#111827">Read the saved sync position</text>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="406" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="406" width="6" height="48" fill="#2563EB" clip-path="url(#p3i-k3)"/>
  </g>
  <circle cx="354" cy="430" r="15" fill="#FFFFFF"/>
  <text x="354" y="436" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2563EB">3</text>
  <text x="378" y="437" font-size="18.5" font-weight="600" fill="#111827">Request changes after that position</text>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="514" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="514" width="6" height="48" fill="#2563EB" clip-path="url(#p3i-k4)"/>
  </g>
  <circle cx="354" cy="538" r="15" fill="#FFFFFF"/>
  <text x="354" y="544" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2563EB">4</text>
  <text x="378" y="545" font-size="18.5" font-weight="600" fill="#111827">Page to the end, and apply server changes in order</text>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="622" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="622" width="6" height="48" fill="#2563EB" clip-path="url(#p3i-k5)"/>
  </g>
  <circle cx="354" cy="646" r="15" fill="#FFFFFF"/>
  <text x="354" y="652" text-anchor="middle" font-size="15.5" font-weight="600" fill="#2563EB">5</text>
  <text x="378" y="653" font-size="18.5" font-weight="600" fill="#111827">Commit the new position together with local state</text>

  
  <g filter="url(#p3i-lift)">
    <rect x="320" y="770" width="600" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="320" y="770" width="9" height="48" fill="#D97706" clip-path="url(#p3i-k6)"/>
  </g>
  <circle cx="354" cy="794" r="15" fill="#FFFFFF"/>
  <text x="354" y="800" text-anchor="middle" font-size="15.5" font-weight="600" fill="#D97706">6</text>
  <text x="378" y="801" font-size="18.5" font-weight="600" fill="#111827">Re-evaluate the queued local changes</text>
  <text x="620" y="843" text-anchor="middle" font-size="15.5" fill="#6B7280">Against what just arrived from the server</text>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="894" width="600" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="320" y="894" width="6" height="48" fill="#D97706" clip-path="url(#p3i-k7)"/>
  </g>
  <circle cx="354" cy="918" r="15" fill="#FFFFFF"/>
  <text x="354" y="924" text-anchor="middle" font-size="15.5" font-weight="600" fill="#D97706">7</text>
  <text x="378" y="925" font-size="18.5" font-weight="600" fill="#111827">Send one change at a time per dependency scope</text>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="1002" width="600" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="320" y="1002" width="6" height="48" fill="#DB2777" clip-path="url(#p3i-k8)"/>
  </g>
  <circle cx="354" cy="1026" r="15" fill="#FFFFFF"/>
  <text x="354" y="1032" text-anchor="middle" font-size="15.5" font-weight="600" fill="#DB2777">8</text>
  <text x="378" y="1033" font-size="18.5" font-weight="600" fill="#111827">Stop that scope on the first failure</text>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="1110" width="600" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="320" y="1110" width="6" height="48" fill="#D97706" clip-path="url(#p3i-k9)"/>
  </g>
  <circle cx="354" cy="1134" r="15" fill="#FFFFFF"/>
  <text x="354" y="1140" text-anchor="middle" font-size="15.5" font-weight="600" fill="#D97706">9</text>
  <text x="378" y="1141" font-size="18.5" font-weight="600" fill="#111827">Persist every accepted server result</text>

  
  <g filter="url(#p3i-soft)">
    <rect x="320" y="1258" width="600" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="320" y="1258" width="6" height="48" fill="#059669" clip-path="url(#p3i-k10)"/>
  </g>
  <circle cx="354" cy="1282" r="15" fill="#FFFFFF"/>
  <text x="354" y="1288" text-anchor="middle" font-size="15.5" font-weight="600" fill="#059669">10</text>
  <text x="378" y="1289" font-size="18.5" font-weight="600" fill="#111827">Open or resume the live channel</text>
  <text x="620" y="1331" text-anchor="middle" font-size="15.5" fill="#6B7280">From the new current state</text>

  
  <rect x="40" y="1388" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1430" text-anchor="middle" font-size="16" fill="#475569">Catch up before uploading, so the local queue evaluates against the newest server state.</text>
  <text x="620" y="1458" text-anchor="middle" font-size="16" fill="#475569">Upload-first is valid only if it publishes how stale dependencies and conflicts are handled.</text>
</svg>