<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="890" viewBox="0 0 1240 890" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. A broker delivers one bad order to a consumer, the consumer errors and never acknowledges it, the broker keeps its at-least-once promise and delivers the same message again and again, while every healthy order behind it in the queue waits and the consumer relives the same failure forever.">
  <defs>
    <marker id="m04-l06-poison-message-loop-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m04-l06-poison-message-loop-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m04-l06-poison-message-loop-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="890" fill="#FFFFFF"/>

  <rect x="340" y="180" width="840" height="420" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="360" y="218" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Redelivery loop: the message can never succeed</text>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="470" y1="145" x2="470" y2="760"/>
    <line x1="1030" y1="145" x2="1030" y2="760"/>
  </g>

  <text x="185" y="232" text-anchor="middle" font-size="20" fill="#64748B">Main queue, strict order</text>
  <rect x="60" y="250" width="250" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="185" y="279" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">the bad order (poison)</text>
  <rect x="60" y="302" width="250" height="44" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="331" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">healthy order</text>
  <rect x="60" y="354" width="250" height="44" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="383" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">healthy order</text>
  <rect x="60" y="406" width="250" height="44" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="435" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">healthy order</text>
  <text x="185" y="480" text-anchor="middle" font-size="20" fill="#B91C1C">all waiting on the queue head</text>

  <rect x="1023" y="260" width="14" height="300" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

  <g fill="none" stroke-width="2.5">
    <path d="M476,270 L1022,270" stroke="#D97706" marker-end="url(#m04-l06-poison-message-loop-ab)"/>
    <path d="M1022,340 L476,340" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m04-l06-poison-message-loop-rd)"/>
    <path d="M476,410 L1022,410" stroke="#D97706" marker-end="url(#m04-l06-poison-message-loop-ab)"/>
    <path d="M1022,480 L476,480" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m04-l06-poison-message-loop-rd)"/>
    <path d="M476,550 L1022,550" stroke="#D97706" marker-end="url(#m04-l06-poison-message-loop-ab)"/>
  </g>
  <g fill="#DC2626">
    <circle cx="750" cy="572" r="4"/>
    <circle cx="750" cy="584" r="4"/>
    <circle cx="750" cy="596" r="4"/>
  </g>

  <text x="750" y="258" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Deliver the bad order</text>
  <text x="750" y="328" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Error, no ack</text>
  <text x="750" y="398" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Deliver the bad order again</text>
  <text x="750" y="468" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Error, no ack</text>
  <text x="750" y="538" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Deliver the bad order again</text>
  <text x="1180" y="636" text-anchor="end" font-size="20" fill="#B91C1C">the consumer stays busy with this one message</text>

  <g filter="url(#m04-l06-poison-message-loop-soft)">
    <rect x="330" y="50" width="280" height="95" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="470" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="470" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">at-least-once delivery</text>
  <g filter="url(#m04-l06-poison-message-loop-soft)">
    <rect x="890" y="50" width="280" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1030" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consumer</text>
  <text x="1030" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">throws on this order</text>

  <g filter="url(#m04-l06-poison-message-loop-soft)">
    <rect x="60" y="680" width="520" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="320" y="721" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Every healthy order behind it waits</text>
  <text x="320" y="753" text-anchor="middle" font-size="20" fill="#64748B">one bad message blocks the queue head</text>
  <g filter="url(#m04-l06-poison-message-loop-soft)">
    <rect x="640" y="680" width="540" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="910" y="721" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The fix: a dead letter queue</text>
  <text x="910" y="753" text-anchor="middle" font-size="20" fill="#64748B">cap the attempts, then move it aside</text>

  <line x1="60" y1="820" x2="96" y2="820" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="827" font-size="20" fill="#475569">Delivery from the broker to the consumer</text>
  <line x1="60" y1="860" x2="96" y2="860" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="867" font-size="20" fill="#475569">The consumer errors, so no acknowledgement comes back</text>
</svg>