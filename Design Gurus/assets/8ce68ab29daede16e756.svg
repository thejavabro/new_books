<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">Vector clocks can reveal concurrent changes</title><desc id="desc">A = [5,7] is ahead of B = [4,8] for replica 1 but behind for replica 2. Neither vector includes all progress of the other, so the versions are concurrent. The vector [5,8] includes both counters. This relationship does not decide how to combine the note text or validate the result.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1030" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Vector clocks can reveal concurrent changes</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Each pair records progress for replica 1 and replica 2; it is not a wall-clock time.</text><rect x="435" y="170" width="330" height="125" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="457" y="210" font-size="24" fill="#475569" font-weight="700">Shared earlier progress</text><text x="457" y="251" font-size="21" fill="#334155" font-weight="400">[4, 7]</text><rect x="50" y="420" width="450" height="165" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="460" font-size="24" fill="#7c3aed" font-weight="700">Version A: [5, 7]</text><text x="72" y="501" font-size="21" fill="#334155" font-weight="400">Replica 1 advanced.</text><text x="72" y="532" font-size="21" fill="#334155" font-weight="400">Replica 2 is still at 7.</text><rect x="700" y="420" width="450" height="165" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="722" y="460" font-size="24" fill="#c2410c" font-weight="700">Version B: [4, 8]</text><text x="722" y="501" font-size="21" fill="#334155" font-weight="400">Replica 2 advanced.</text><text x="722" y="532" font-size="21" fill="#334155" font-weight="400">Replica 1 is still at 4.</text><path d="M510 303 V345 H275 V412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M690 303 V345 H925 V412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="515" y="484" font-size="21" fill="#475569" font-weight="700">Neither</text><text x="515" y="515" font-size="21" fill="#475569" font-weight="700">includes</text><text x="515" y="546" font-size="21" fill="#475569" font-weight="700">the other</text><rect x="375" y="720" width="450" height="135" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="397" y="760" font-size="24" fill="#059669" font-weight="700">Progress including both</text><text x="397" y="801" font-size="21" fill="#334155" font-weight="400">[5, 8]</text><path d="M275 593 V665 H480 V712" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M925 593 V665 H720 V712" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="905" width="1100" height="90" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="945" font-size="24" fill="#ffffff" font-weight="700">Causal information is not a text-resolution policy</text></g></svg>