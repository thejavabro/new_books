  <rect x="0" y="0" width="1240" height="1360" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Serverless database connection exhaustion and how to fix it</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Many execution environments each open a connection until the database reaches its limit.</text>

  <rect x="40" y="120" width="1160" height="420" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#BE185D">The problem</text>
  <rect x="40" y="570" width="1160" height="746" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="600" font-size="19.5" font-weight="600" fill="#047857">How to fix it</text>
  <rect x="64" y="626" width="1112" height="212" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="656" font-size="19.5" font-weight="600" fill="#047857">1. Use a connection pooler</text>
  <rect x="64" y="854" width="1112" height="212" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="884" font-size="19.5" font-weight="600" fill="#047857">2. Use an HTTP-API database</text>
  <rect x="64" y="1082" width="1112" height="212" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="1112" font-size="19.5" font-weight="600" fill="#047857">3. Set reserved concurrency</text>

