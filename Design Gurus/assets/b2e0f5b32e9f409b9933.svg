  <text x="1030" y="962" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="1030" y="988" text-anchor="middle" font-size="18.5" fill="#475569">(HTTP API built in)</text>
  <g stroke="#2563EB" stroke-width="1.5">
