<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1360" viewBox="0 0 1240 1360" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The problem: each execution environment of a function opens its own database connection, so in a traffic spike 2,000 environments can open 2,000 connections against a database that supports a few hundred. Three fixes: 1, use a connection pooler such as RDS Proxy or PgBouncer between the functions and the database; 2, use an HTTP-API database such as DynamoDB or Aurora Serverless with its Data API, where functions send requests straight to the database&#39;s own HTTP API instead of holding open connections; 3, set reserved concurrency, which caps how many environments of a function run at once, at most 2 here, so an extra request is throttled while the running functions call the database directly">
