  <text x="520" y="342" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="520" y="454" font-size="18.5" text-anchor="middle" fill="#6B7280">Database connection</text>
  <text x="520" y="481" font-size="18.5" text-anchor="middle" fill="#94A3B8">limit (a few hundred) reached</text>
