  </g>
  <text x="624" y="1282" font-size="18.5" font-weight="600" fill="#047857">Reserved concurrency: at most 2 environments</text>
  <circle cx="606" cy="1173" r="11" fill="#DB2777" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M601.5,1168.5 L610.5,1177.5 M610.5,1168.5 L601.5,1177.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <text x="538" y="1162" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">throttled</text>
  <text x="730" y="290" font-size="18.5" fill="#6B7280">Each execution environment of a function opens</text>
  <text x="730" y="317" font-size="18.5" fill="#6B7280">its own database connection. In a traffic spike,</text>
  <text x="730" y="344" font-size="18.5" fill="#6B7280">2,000 environments can open 2,000 connections</text>
  <text x="730" y="371" font-size="18.5" fill="#6B7280">against a database that supports a few hundred.</text>
  <text x="88" y="698" font-size="18.5" fill="#6B7280">Use a proxy like RDS Proxy or PgBouncer to</text>
  <text x="88" y="725" font-size="18.5" fill="#6B7280">pool and reuse database connections.</text>
  <text x="88" y="926" font-size="18.5" fill="#6B7280">Databases such as DynamoDB, or Aurora Serverless</text>
  <text x="88" y="953" font-size="18.5" fill="#6B7280">with its Data API, take HTTP requests instead</text>
  <text x="88" y="980" font-size="18.5" fill="#6B7280">of holding open connections.</text>
  <text x="88" y="1154" font-size="18.5" fill="#6B7280">Reserved concurrency caps how many</text>
  <text x="88" y="1181" font-size="18.5" fill="#6B7280">environments run at once; extra</text>
  <text x="88" y="1208" font-size="18.5" fill="#6B7280">requests are throttled.</text>

