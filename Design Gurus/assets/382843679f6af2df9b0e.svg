<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="indicator-title indicator-desc">
<title id="indicator-title">Choosing the indicator</title>
<desc id="indicator-desc">An indicator is useful only if it moves when users are unhappy and stays flat when they are not, which rules out most of what is already on a dashboard.</desc>
<defs>
<marker id="indicator-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="indicator-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="indicator-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="indicator-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="664" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Choosing the indicator</text>
<text x="40" y="86" font-size="21" fill="#4A5568">An indicator is useful only if it moves when users are unhappy and stays flat when they are not.</text>
<rect x="40" y="586" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="586" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="273" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="176.5" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Availability</text>
<rect x="40" y="176" width="273" height="62" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="60" y="200.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the fraction of valid</text><text x="60" y="225.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">requests that succeeded</text>
<rect x="335" y="118" width="273" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="471.5" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Latency</text>
<rect x="335" y="176" width="273" height="62" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="355" y="200.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the fraction served</text><text x="355" y="225.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">faster than a threshold</text>
<rect x="630" y="118" width="273" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="766.5" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Quality</text>
<rect x="630" y="176" width="273" height="62" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="650" y="200.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the fraction served</text><text x="650" y="225.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">without falling back</text>
<rect x="925" y="118" width="273" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1061.5" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Freshness</text>
<rect x="925" y="176" width="273" height="62" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="945" y="200.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how far behind the</text><text x="945" y="225.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">data is</text>
<rect x="40" y="258" width="560" height="124" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 258H46A6 6 0 0 0 40 264V376A6 6 0 0 0 46 382H54Z" fill="#39D5AA"/><text x="70" y="294" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Measure where the user is</text>
<text x="70" y="336" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">server-side counts miss the load balancer,</text><text x="70" y="363" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the network and the client timeout</text>
<rect x="640" y="258" width="560" height="124" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 258H646A6 6 0 0 0 640 264V376A6 6 0 0 0 646 382H654Z" fill="#39D5AA"/><text x="670" y="294" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Count requests, not minutes</text>
<text x="670" y="336" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">minutes of downtime need somebody to judge</text><text x="670" y="363" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">when it started, under pressure and after the fact</text>
<rect x="40" y="400" width="1160" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="400" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="64" y="439" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A latency indicator is a threshold, not a percentile of a percentile</text>
<rect x="40" y="484" width="560" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="484" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="515" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">wrong</text><text x="64" y="541" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">record the p99 each minute, then average those numbers</text>
<rect x="640" y="484" width="560" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="484" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="664" y="515" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">right</text><text x="664" y="541" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">count the requests under 300 ms, divide by the total</text>
<text x="66" y="620" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Nobody has ever been unhappy about a cache hit rate.</text>
</svg>