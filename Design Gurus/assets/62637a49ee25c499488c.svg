<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every index splits the array into a left part, the current value and a right part">
<defs>
<marker id="d-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="d-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="d-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="d-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="d-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="d-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="d-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="d-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="d-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="940" height="500" fill="#FFFFFF"/>
<text x="470" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Every index splits the array into three parts</text>
<rect x="190" y="104" width="96" height="62" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="238" y="142.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="238" y="190" text-anchor="middle" font-size="15" fill="#6B7280">index 0</text>
<rect x="306" y="104" width="96" height="62" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="354" y="142.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="354" y="190" text-anchor="middle" font-size="15" fill="#6B7280">index 1</text>
<rect x="422" y="104" width="96" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="470" y="142.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="470" y="190" text-anchor="middle" font-size="15" fill="#6B7280">index 2</text>
<rect x="538" y="104" width="96" height="62" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="586" y="142.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="586" y="190" text-anchor="middle" font-size="15" fill="#6B7280">index 3</text>
<rect x="654" y="104" width="96" height="62" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="702" y="142.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="702" y="190" text-anchor="middle" font-size="15" fill="#6B7280">index 4</text>
<path d="M190,206 L190,218 L402,218 L402,206" fill="none" stroke="#D97706" stroke-width="2.5"/>
<text x="296" y="248" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">leftSum = 7</text>
<path d="M422,206 L422,218 L518,218 L518,206" fill="none" stroke="#2563EB" stroke-width="2.5"/>
<text x="470" y="248" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">nums[i] = 1</text>
<path d="M538,206 L538,218 L750,218 L750,206" fill="none" stroke="#059669" stroke-width="2.5"/>
<text x="644" y="248" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">rightSum = 7</text>
<rect x="190" y="300" width="260" height="38" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="320" y="325" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">total = 15, and never changes</text>
<text x="480" y="326" text-anchor="start" font-size="18.5" fill="#475569">rightSum = total - leftSum - nums[i] = 15 - 7 - 1 = 7</text>
<text x="470" y="382" text-anchor="middle" font-size="18.5" fill="#1D4ED8">answer at index 2 = |leftSum - rightSum| = |7 - 7| = 0</text>
<rect x="50" y="404" width="840" height="82" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="72" y="440" font-size="18.5" fill="#475569">You never have to add up the right part. The total is known after one pass, and</text>
<text x="72" y="468" font-size="18.5" fill="#475569">subtracting the left part and the current value leaves exactly the right part.</text>
</svg>