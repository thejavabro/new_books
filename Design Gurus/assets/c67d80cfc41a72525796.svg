<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="932" viewBox="0 0 1240 932" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="late-title late-desc">
<title id="late-title">Late data, and the three numbers</title>
<desc id="late-desc">A point arriving after its bucket has been rolled up has three honest handlings, and the failure is picking none of them. The design itself is defined by series cardinality, write rate and retention per tier.</desc>
<defs>
<marker id="late-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="late-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="late-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="late-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="932" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Late data, and the three numbers</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A point arriving after its bucket has been rolled up has three honest handlings.</text>
<rect x="40" y="854" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="854" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="146" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three honest responses to a point arriving after its bucket closed</text>
<rect x="40" y="164" width="390" height="68" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="235" y="204" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A lateness window</text>
<path d="M436 198H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 198H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#late-marker-slate)"/>
<rect x="480" y="164" width="720" height="68" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="191.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">accept writes into a closed bucket for a bounded period and</text><text x="500" y="216.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">recompute its rollups; rollups are then not final until it passes</text>
<rect x="40" y="244" width="390" height="68" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="235" y="284" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Drop it</text>
<path d="M436 278H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 278H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#late-marker-slate)"/>
<rect x="480" y="244" width="720" height="68" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="271.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">fine for high-volume sampled telemetry where a gap averages out,</text><text x="500" y="296.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is the at-most-once decision applied to a different kind of data</text>
<rect x="40" y="324" width="390" height="68" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="235" y="350.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep raw long enough</text><text x="235" y="377.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">to recompute</text>
<path d="M436 358H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 358H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#late-marker-slate)"/>
<rect x="480" y="324" width="720" height="68" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="364" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">expensive, and the only option when the numbers are billed or audited</text>
<rect x="40" y="418" width="1160" height="84" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="418" width="5" height="84" rx="2.5" fill="#F28B9D"/><text x="64" y="453" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The failure is not picking any of them,</text><text x="64" y="479" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which makes rollups silently wrong by an amount nobody has measured.</text>
<text x="40" y="538" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The three numbers that define the design</text>
<circle cx="60" cy="583" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="590" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="556" width="440" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="589" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Series cardinality</text>
<path d="M536 583H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 583H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#late-marker-slate)"/>
<rect x="580" y="556" width="620" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="589" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with the dimension that could explode named</text>
<circle cx="60" cy="647" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="654" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="620" width="440" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="653" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write rate</text>
<path d="M536 647H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 647H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#late-marker-slate)"/>
<rect x="580" y="620" width="620" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="653" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">points per second, which sets bucketing and ingest</text>
<circle cx="60" cy="711" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="718" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="684" width="440" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="717" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Retention per tier</text>
<path d="M536 711H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 711H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#late-marker-slate)"/>
<rect x="580" y="684" width="620" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="717" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which gives the storage estimate and the cost</text>
<rect x="40" y="764" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="764" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="801" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The judgment move here is refusing a dimension, out loud, with the multiplication.</text>
<text x="66" y="888" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The error appears only when two reports disagree, which is long after it started.</text>
</svg>