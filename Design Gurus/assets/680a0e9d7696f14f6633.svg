<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="966" viewBox="0 0 1240 966" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A batch arm and a streaming arm write one set of feature definitions into the offline store and the online store">
  <defs>
    <marker id="c2ftp-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c2ftp-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="c2ftp-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <filter id="c2ftp-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2ftp-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2ftp-k1"><rect x="40" y="265" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="c2ftp-k2"><rect x="250" y="130" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="c2ftp-k3"><rect x="250" y="420" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="c2ftp-k4"><rect x="639" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c2ftp-k5"><rect x="639" y="420" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c2ftp-k6"><rect x="900" y="215" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c2ftp-k7"><rect x="900" y="510" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c2ftp-k8"><rect x="900" y="665" width="280" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="966" fill="#FFFFFF"/>
  <rect x="612" y="56" width="252" height="504" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="636" y="86" font-size="16.5" font-weight="600" fill="#6D28D9">Feature store</text>
  <text x="636" y="110" font-size="15.5" fill="#6B7280">one definition feeds both faces</text>
  <rect x="880" y="56" width="320" height="304" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="904" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline plane</text>
  <rect x="880" y="380" width="320" height="430" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="904" y="410" font-size="16.5" font-weight="600" fill="#1D4ED8">Online plane</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M190,310 H200 Q212,310 212,298 V187 Q212,175 224,175 H250" marker-end="url(#c2ftp-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M190,310 H200 Q212,310 212,322 V453 Q212,465 224,465 H250" marker-end="url(#c2ftp-mslate)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M474,175 H500 Q512,175 512,187 V296 Q512,308 524,308 H612" marker-end="url(#c2ftp-mamber)"/></g>
  <g fill="none" stroke="#2563EB" stroke-width="2"><path d="M474,465 H500 Q512,465 512,453 V344 Q512,332 524,332 H612" marker-end="url(#c2ftp-mblue)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M839,175 H1128 Q1140,175 1140,187 V215" marker-end="url(#c2ftp-mamber)"/></g>
  <g fill="none" stroke="#2563EB" stroke-width="2"><path d="M839,465 H1128 Q1140,465 1140,477 V510" marker-end="url(#c2ftp-mblue)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1140,665 V600" marker-end="url(#c2ftp-mslate)"/></g>
  <g filter="url(#c2ftp-soft)">
    <rect x="40" y="265" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="265" width="6" height="90" fill="#64748B" clip-path="url(#c2ftp-k1)"/>
  </g>
  <circle cx="78" cy="310" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,299.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="317" font-size="18.5" font-weight="600" fill="#111827">Events</text>
  <text x="115" y="380" font-size="15.5" text-anchor="middle" fill="#6B7280">an event log</text>
  <text x="115" y="403" font-size="15.5" text-anchor="middle" fill="#94A3B8">such as Kafka</text>
  <g filter="url(#c2ftp-soft)">
    <rect x="250" y="130" width="224" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="250" y="130" width="6" height="90" fill="#D97706" clip-path="url(#c2ftp-k2)"/>
  </g>
  <circle cx="288" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(277.56,164.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="314" y="182" font-size="18.5" font-weight="600" fill="#111827">Batch path</text>
  <text x="362" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">a nightly Spark or SQL job</text>
  <text x="362" y="268" font-size="15.5" text-anchor="middle" fill="#94A3B8">cheap, and its values are hours old</text>
  <g filter="url(#c2ftp-soft)">
    <rect x="250" y="420" width="224" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="250" y="420" width="6" height="90" fill="#2563EB" clip-path="url(#c2ftp-k3)"/>
  </g>
  <circle cx="288" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(277.56,454.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="314" y="472" font-size="18.5" font-weight="600" fill="#111827">Streaming path</text>
  <text x="362" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">a stream processor such as Flink</text>
  <text x="362" y="558" font-size="15.5" text-anchor="middle" fill="#94A3B8">fresh within seconds, and it costs more</text>
  <g filter="url(#c2ftp-soft)">
    <rect x="639" y="130" width="200" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="639" y="130" width="6" height="90" fill="#D97706" clip-path="url(#c2ftp-k4)"/>
  </g>
  <circle cx="677" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(666.56,164.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="703" y="182" font-size="18.5" font-weight="600" fill="#111827">Offline store</text>
  <text x="739" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">the full history</text>
  <g filter="url(#c2ftp-soft)">
    <rect x="639" y="420" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="639" y="420" width="6" height="90" fill="#2563EB" clip-path="url(#c2ftp-k5)"/>
  </g>
  <circle cx="677" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(666.56,454.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="703" y="472" font-size="18.5" font-weight="600" fill="#111827">Online store</text>
  <text x="739" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">only the latest value</text>
  <g filter="url(#c2ftp-soft)">
    <rect x="900" y="215" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="900" y="215" width="6" height="90" fill="#D97706" clip-path="url(#c2ftp-k6)"/>
  </g>
  <circle cx="938" cy="260" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,249.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="964" y="267" font-size="18.5" font-weight="600" fill="#111827">Training</text>
  <text x="1040" y="330" font-size="15.5" text-anchor="middle" fill="#6B7280">reads the offline store</text>
  <g filter="url(#c2ftp-soft)">
    <rect x="900" y="510" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="510" width="6" height="90" fill="#2563EB" clip-path="url(#c2ftp-k7)"/>
  </g>
  <circle cx="938" cy="555" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,544.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="964" y="562" font-size="18.5" font-weight="600" fill="#111827">Model server</text>
  <text x="1040" y="625" font-size="15.5" text-anchor="middle" fill="#6B7280">reads the online store</text>
  <g filter="url(#c2ftp-soft)">
    <rect x="900" y="665" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="665" width="6" height="90" fill="#2563EB" clip-path="url(#c2ftp-k8)"/>
  </g>
  <circle cx="938" cy="710" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,699.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="964" y="717" font-size="18.5" font-weight="600" fill="#111827">Request-time features</text>
  <text x="1040" y="780" font-size="15.5" text-anchor="middle" fill="#6B7280">computed inline, while the user waits</text>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="498" y="300" fill="#B45309">slow features</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="498" y="352" fill="#1D4ED8">fresh aggregates</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1000" y="161" fill="#B45309">point-in-time-correct joins</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1000" y="451" fill="#1D4ED8">low-latency lookup</text></g>
  <rect x="40" y="850" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="895" text-anchor="middle" font-size="16" fill="#475569">Each arm trades cost against freshness in a different way.</text>
</svg>