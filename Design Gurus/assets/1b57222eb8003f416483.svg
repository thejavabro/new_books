<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With one gateway instance, a failure makes every service unreachable. With several gateway instances behind a load balancer, one instance can fail, the load balancer stops sending it traffic, and the other instances keep serving requests.">
  <defs>
    <filter id="gvd3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="gvd3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="gvd3-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gvd3-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gvd3-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gvd3-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gvd3-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gvd3-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="gvd3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The gateway must not fail alone</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every outside request passes through the gateway.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#BE185D">One gateway instance</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#047857">Several instances behind a load balancer</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#gvd3-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#gvd3-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#gvd3-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#gvd3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#gvd3-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#gvd3-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">All client requests</text>
  <g filter="url(#gvd3-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#gvd3-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">The gateway fails</text>
  <g filter="url(#gvd3-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#gvd3-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Nothing reachable</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">every service is cut off</text>
  <g filter="url(#gvd3-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#gvd3-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <text x="234" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">health checks instances</text>
  <g filter="url(#gvd3-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#D97706" clip-path="url(#gvd3-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">One instance fails</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">removed from rotation</text>
  <g filter="url(#gvd3-lift)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="836" y="430" width="9" height="90" fill="#059669" clip-path="url(#gvd3-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">Others keep serving</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">clients see no outage</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Plan it</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">redundant gateway instances must be designed, not assumed</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Scaling</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">instances keep no user data in memory, so more can be added</text>
</svg>