<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="505" viewBox="0 0 1240 505" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A sidecar is a second container in the same pod: it runs beside the application, shares the pod network and volumes, and is deployed and scaled as one unit with it">
  <defs>
    <marker id="sc1-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="sc1-k1"><rect x="72" y="130" width="520" height="120" rx="12"/></clipPath>
    <clipPath id="sc1-k2"><rect x="648" y="130" width="520" height="120" rx="12"/></clipPath>
    <filter id="sc1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sc1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="505" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="276" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">One pod, deployed and scaled as a single unit</text>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M592,190 H648" marker-end="url(#sc1-mslate)"/>
  </g>
  <g filter="url(#sc1-soft)">
    <rect x="72" y="130" width="520" height="120" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="130" width="6" height="120" fill="#2563EB" clip-path="url(#sc1-k1)"/>
  </g>
  <circle cx="110" cy="190" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,179.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="197" font-size="18.5" font-weight="600" fill="#111827">Application Container</text>
  <text x="332" y="275" font-size="15.5" text-anchor="middle" fill="#6B7280">the business logic, and nothing else</text>
  <g filter="url(#sc1-soft)">
    <rect x="648" y="130" width="520" height="120" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="648" y="130" width="6" height="120" fill="#059669" clip-path="url(#sc1-k2)"/>
  </g>
  <circle cx="686" cy="190" r="18" fill="#FFFFFF"/>
  <g transform="translate(675.56,179.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="712" y="197" font-size="18.5" font-weight="600" fill="#111827">Sidecar Container</text>
  <text x="908" y="275" font-size="15.5" text-anchor="middle" fill="#6B7280">logging, config, or a network proxy</text>
  <rect x="40" y="356" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="380" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="402" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">What they share</text>
  <text x="288" y="402" font-size="15.5" fill="#475569">the pod network, so they reach each other on localhost, and any mounted volumes</text>
  <rect x="64" y="424" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="446" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">What they do not</text>
  <text x="288" y="446" font-size="15.5" fill="#475569">the container image and the process space, which is what keeps them separate</text>
</svg>