<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" style="background-color:#ffffff">
<defs>
<marker id="cma" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#3a6fb0"/></marker>
<marker id="cmb" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#b4322c"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="28" font-size="13.5" font-weight="bold">A method call happens once and leaves no trace. A command object stays around.</text>

<rect x="30" y="52" width="180" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="120" y="76" text-anchor="middle" font-weight="bold" font-size="12.5">CommandHistory</text>
<text x="120" y="94" text-anchor="middle" font-size="11" fill="#414d60">the invoker</text>

<rect x="290" y="52" width="200" height="56" rx="4" fill="#dcefe4" stroke="#2f7a55" stroke-width="2"/>
<text x="390" y="76" text-anchor="middle" font-weight="bold" font-size="12.5">ApplyDiscount</text>
<text x="390" y="94" text-anchor="middle" font-size="11" fill="#2f7a55">the command object</text>

<rect x="570" y="52" width="180" height="56" rx="4" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="660" y="76" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#414d60">Cart</text>
<text x="660" y="94" text-anchor="middle" font-size="11" fill="#6b7789">the receiver</text>

<path d="M 214 80 L 285 80" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#cma)"/>
<text x="218" y="72" font-size="10.5" fill="#414d60">execute()</text>
<path d="M 494 80 L 565 80" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#cma)"/>
<text x="500" y="72" font-size="10.5" fill="#414d60">setDiscount()</text>

<text x="780" y="72" font-size="11.5" fill="#414d60">The invoker knows nothing</text>
<text x="780" y="88" font-size="11.5" fill="#414d60">about carts. The cart knows</text>
<text x="780" y="104" font-size="11.5" fill="#414d60">nothing about commands.</text>

<line x1="30" y1="140" x2="930" y2="140" stroke="#dbe2ed"/>

<text x="30" y="168" font-size="13" font-weight="bold" fill="#414d60">Because the request is an object, it can be kept, and reversed</text>

<rect x="30" y="188" width="330" height="34" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="44" y="210" font-family="monospace" font-size="11.5">AddItem("widget", 2)</text>
<rect x="30" y="228" width="330" height="34" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="44" y="250" font-family="monospace" font-size="11.5">AddItem("gadget", 1)</text>
<rect x="30" y="268" width="330" height="34" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="44" y="290" font-family="monospace" font-size="11.5">ApplyDiscount(10)</text>

<text x="44" y="325" font-size="11.5" fill="#414d60">the history, most recent last</text>

<path d="M 366 285 L 430 285" stroke="#b4322c" fill="none" stroke-width="1.5" marker-end="url(#cmb)"/>
<text x="372" y="277" font-size="10.5" fill="#b4322c">undo()</text>

<rect x="440" y="240" width="490" height="94" rx="4" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="458" y="264" font-size="12" fill="#414d60">ApplyDiscount recorded that the discount was 0% before it ran.</text>
<text x="458" y="286" font-size="12" fill="#414d60">Undo restores that recorded value. It does not try to work out</text>
<text x="458" y="304" font-size="12" fill="#414d60">what the old value must have been.</text>
<text x="458" y="326" font-size="12" fill="#b4322c">Guessing is the classic bug: it is wrong the moment anything else changed.</text>

<rect x="30" y="356" width="900" height="56" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="380" font-size="12.5" fill="#414d60">The same object that ran the action can also be queued for later, written to an audit log, retried with the same arguments,</text>
<text x="52" y="400" font-size="12.5" fill="#414d60">or triggered from a menu item, a keyboard shortcut and a script, without any of them knowing about the others.</text>
</g>
</svg>