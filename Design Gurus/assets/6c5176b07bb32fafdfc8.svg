<text x="700" y="434" font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" fill="#475569">one table per list</text>
<rect x="40" y="462" width="1160" height="252" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="64" y="492" font-size="16.5" font-weight="600" fill="#047857">In 4NF: each list stands on its own</text>
