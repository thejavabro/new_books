<text x="164" y="796" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">multivalued</text>
<text x="288" y="796" font-size="15.5" fill="#475569">Student_ID multi-determines Sport, and separately multi-determines Club. Neither is a functional dependency</text>
<rect x="64" y="818" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="164" y="840" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">the cost</text>
<text x="288" y="840" font-size="15.5" fill="#475569">adding a third sport for Anita forces two new rows, one for each club she is already in</text>
<rect x="64" y="862" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="164" y="884" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">lossless</text>
<text x="288" y="884" font-size="15.5" fill="#475569">pair every sport with every club per student and the original five rows come back</text>
