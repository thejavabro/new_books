<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five-component crawl loop: the URL frontier feeds the HTML fetcher, pages go to the datastore, extracted links pass the duplicate eliminator, and new URLs return to the frontier.">
  <defs>
    <marker id="wc02-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="wc02-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="wc02-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="wc02-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="wc02-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="wc02-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="wc02-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="wc02-k1"><rect x="80" y="90" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="wc02-k2"><rect x="500" y="90" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="wc02-k3"><rect x="930" y="90" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="wc02-k4"><rect x="880" y="360" width="290" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="690" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2">
    <path d="M290,135 H500" stroke="#2563EB" marker-end="url(#wc02-bl)"/>
    <path d="M710,135 H930" stroke="#DB2777" marker-end="url(#wc02-pk)"/>
    <path d="M515,180 V351" stroke="#7C3AED" marker-end="url(#wc02-vi)"/>
    <path d="M945,180 V360" stroke="#059669" marker-end="url(#wc02-em)"/>
    <path d="M920,450 V518 Q920,530 908,530 H57 Q45,530 45,518 V147 Q45,135 57,135 H80" stroke="#D97706" marker-end="url(#wc02-am)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="395" y="126" fill="#1D4ED8">next URL</text>
    <text x="820" y="126" fill="#BE185D">downloaded page</text>
    <text x="515" y="275" fill="#5B21B6">store page</text>
    <text x="945" y="300" fill="#047857">found links</text>
    <text x="400" y="521" fill="#B45309">new URLs only</text>
  </g>

  
  <g filter="url(#wc02-lift)">
    <rect x="80" y="90" width="210" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="80" y="90" width="9" height="90" fill="#2563EB" clip-path="url(#wc02-k1)"/>
  </g>
  <circle cx="118" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="144" y="142" font-size="18.5" font-weight="600" fill="#111827">URL Frontier</text>
  <text x="185" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">the waiting list;</text>
  <text x="185" y="228" font-size="15.5" text-anchor="middle" fill="#6B7280">prioritizes what to crawl next</text>

  
  <g filter="url(#wc02-soft)">
    <rect x="500" y="90" width="210" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="500" y="90" width="6" height="90" fill="#DB2777" clip-path="url(#wc02-k2)"/>
  </g>
  <circle cx="538" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,124.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v11"/>
    <path d="M7 10l5 5 5-5"/>
    <path d="M4.5 20.5h15"/>
  </g>
  <text x="564" y="142" font-size="18.5" font-weight="600" fill="#111827">HTML Fetcher</text>
  <text x="605" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">downloads the page;</text>
  <text x="605" y="228" font-size="15.5" text-anchor="middle" fill="#6B7280">obeys robots.txt</text>

  
  <g filter="url(#wc02-soft)">
    <rect x="930" y="90" width="180" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="930" y="90" width="6" height="90" fill="#059669" clip-path="url(#wc02-k3)"/>
  </g>
  <circle cx="968" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,124.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.6 1.6"/>
    <path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.6-1.6"/>
  </g>
  <text x="994" y="142" font-size="18.5" font-weight="600" fill="#111827">Extractor</text>
  <text x="1020" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">pulls the links</text>
  <text x="1020" y="228" font-size="15.5" text-anchor="middle" fill="#6B7280">out of each page</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M425,366 L425,434 A90,16 0 0 0 605,434 L605,366" fill="#EDE9FE"/>
    <ellipse cx="515" cy="366" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="515" y="412" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Datastore</text>
  <text x="515" y="475" font-size="15.5" text-anchor="middle" fill="#6B7280">pages plus metadata, 2.14 PB</text>

  
  <g filter="url(#wc02-soft)">
    <rect x="880" y="360" width="290" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="880" y="360" width="6" height="90" fill="#D97706" clip-path="url(#wc02-k4)"/>
  </g>
  <circle cx="918" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,394.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="944" y="412" font-size="18.5" font-weight="600" fill="#111827">Duplicate Eliminator</text>
  <text x="1025" y="475" font-size="15.5" text-anchor="middle" fill="#6B7280">drops URLs and content</text>
  <text x="1025" y="498" font-size="15.5" text-anchor="middle" fill="#6B7280">already seen</text>

  
  <rect x="40" y="580" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="625" text-anchor="middle" font-size="16" fill="#475569">The crawl loop: fetch, extract, dedupe, enqueue, repeat, about 6,200 pages per second.</text>
</svg>