<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="658" viewBox="0 0 1240 658" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One LLM call: the prompt is assembled and read in prefill, the answer is written one token at a time in decode, and both phases add to the latency and cost meters">
  <defs>
    <marker id="c4in1-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c4in1-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="c4in1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c4in1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c4in1-k1"><rect x="90" y="146" width="242" height="90" rx="12"/></clipPath>
    <clipPath id="c4in1-k2"><rect x="385" y="146" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="c4in1-k3"><rect x="648" y="146" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="c4in1-k4"><rect x="911" y="146" width="238" height="90" rx="12"/></clipPath>
    <clipPath id="c4in1-k5"><rect x="385" y="386" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="c4in1-k6"><rect x="648" y="386" width="210" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="658" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: one LLM call while the user waits</text>
  <g fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M90,138 V130 H595 V138"/></g>
  <text x="342.5" y="120" font-size="15.5" font-weight="600" text-anchor="middle" fill="#1D4ED8">time to first token (TTFT)</text>
  <g fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M648,138 V130 H1149 V138"/></g>
  <text x="898.5" y="120" font-size="15.5" font-weight="600" text-anchor="middle" fill="#1D4ED8">time per output token (TPOT), for each token</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M332,191 H385" marker-end="url(#c4in1-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M595,191 H648" marker-end="url(#c4in1-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M858,191 H911" marker-end="url(#c4in1-mslate)"/></g>
  <text x="64" y="332" font-size="16.5" font-weight="600" fill="#6D28D9">Cost meter: tokens in and tokens out</text>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M490,273 V386" marker-end="url(#c4in1-mviolet)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M753,273 V386" marker-end="url(#c4in1-mviolet)"/></g>
  <g filter="url(#c4in1-soft)">
    <rect x="90" y="146" width="242" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="90" y="146" width="6" height="90" fill="#4F46E5" clip-path="url(#c4in1-k1)"/>
  </g>
  <circle cx="128" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,180.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="154" y="198" font-size="18.5" font-weight="600" fill="#111827">Context assembly</text>
  <text x="211" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">instructions, history, documents</text>
  <g filter="url(#c4in1-lift)">
    <rect x="385" y="146" width="210" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="385" y="146" width="9" height="90" fill="#2563EB" clip-path="url(#c4in1-k2)"/>
  </g>
  <circle cx="423" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(412.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="449" y="198" font-size="18.5" font-weight="600" fill="#111827">Prefill</text>
  <text x="490" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">reads all prompt tokens together</text>
  <g filter="url(#c4in1-soft)">
    <rect x="648" y="146" width="210" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="648" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#c4in1-k3)"/>
  </g>
  <circle cx="686" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(675.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="712" y="198" font-size="18.5" font-weight="600" fill="#111827">Decode</text>
  <text x="753" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">writes one token per step</text>
  <g filter="url(#c4in1-soft)">
    <rect x="911" y="146" width="238" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="911" y="146" width="6" height="90" fill="#059669" clip-path="url(#c4in1-k4)"/>
  </g>
  <circle cx="949" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(938.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="975" y="198" font-size="18.5" font-weight="600" fill="#111827">Streamed answer</text>
  <text x="1030" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">shown while it is written</text>
  <g filter="url(#c4in1-soft)">
    <rect x="385" y="386" width="210" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="385" y="386" width="6" height="90" fill="#7C3AED" clip-path="url(#c4in1-k5)"/>
  </g>
  <circle cx="423" cy="431" r="18" fill="#FFFFFF"/>
  <g transform="translate(412.56,420.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="449" y="438" font-size="18.5" font-weight="600" fill="#111827">Input tokens</text>
  <text x="490" y="501" font-size="15.5" text-anchor="middle" fill="#6B7280">for example $3 per million</text>
  <g filter="url(#c4in1-soft)">
    <rect x="648" y="386" width="210" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="648" y="386" width="6" height="90" fill="#7C3AED" clip-path="url(#c4in1-k6)"/>
  </g>
  <circle cx="686" cy="431" r="18" fill="#FFFFFF"/>
  <g transform="translate(675.56,420.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="712" y="438" font-size="18.5" font-weight="600" fill="#111827">Output tokens</text>
  <text x="753" y="501" font-size="15.5" text-anchor="middle" fill="#6B7280">for example $12 per million</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="502" y="334.5" fill="#5B21B6">counted</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="765" y="334.5" fill="#5B21B6">counted</text></g>
  <rect x="40" y="542" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="587" text-anchor="middle" font-size="16" fill="#475569">The prompt is read all at once. The answer is written one token at a time.</text>
</svg>