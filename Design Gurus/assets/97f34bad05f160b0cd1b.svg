<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Replay rebuilds state: read the aggregate events in order, apply each one to an empty object, and the result is the current balance">
  <defs>
    <marker id="es2-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="es2-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="es2-k1"><rect x="300" y="130" width="250" height="70" rx="12"/></clipPath>
    <clipPath id="es2-k2"><rect x="590" y="130" width="250" height="70" rx="12"/></clipPath>
    <clipPath id="es2-k3"><rect x="880" y="130" width="250" height="70" rx="12"/></clipPath>
    <clipPath id="es2-k4"><rect x="495" y="310" width="250" height="70" rx="12"/></clipPath>
    <filter id="es2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="es2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M248,170 H292" marker-end="url(#es2-mblue)"/>
  </g>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M550,165 H582" marker-end="url(#es2-mblue)"/>
    <path d="M840,165 H872" marker-end="url(#es2-mblue)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M1005,200 V250 Q1005,262 993,262 H632 Q620,262 620,274 V302" marker-end="url(#es2-memerald)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="110" fill="#1D4ED8">replay: apply each event in order</text>
  </g>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 60,130 L 60,194 A 90,16 0 0 0 240,194 L 240,130" fill="#EDE9FE"/>
    <ellipse cx="150" cy="130" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="150" y="182" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Event Store</text>
  <g filter="url(#es2-soft)">
    <rect x="300" y="130" width="250" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="300" y="130" width="6" height="70" fill="#2563EB" clip-path="url(#es2-k1)"/>
  </g>
  <circle cx="338" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="364" y="172" font-size="18.5" font-weight="600" fill="#111827">AccountOpened</text>
  <g filter="url(#es2-soft)">
    <rect x="590" y="130" width="250" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="590" y="130" width="6" height="70" fill="#2563EB" clip-path="url(#es2-k2)"/>
  </g>
  <circle cx="628" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(617.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="654" y="172" font-size="18.5" font-weight="600" fill="#111827">MoneyDeposited 60</text>
  <g filter="url(#es2-soft)">
    <rect x="880" y="130" width="250" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="880" y="130" width="6" height="70" fill="#2563EB" clip-path="url(#es2-k3)"/>
  </g>
  <circle cx="918" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="944" y="172" font-size="18.5" font-weight="600" fill="#111827">MoneyWithdrawn 20</text>
  <g filter="url(#es2-lift)">
    <rect x="495" y="310" width="250" height="70" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="495" y="310" width="9" height="70" fill="#059669" clip-path="url(#es2-k4)"/>
  </g>
  <circle cx="533" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(522.56,334.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="559" y="352" font-size="18.5" font-weight="600" fill="#111827">Balance = 40</text>
  <text x="620" y="405" font-size="15.5" text-anchor="middle" fill="#6B7280">state is computed, not stored</text>
  <rect x="40" y="470" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="494" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="516" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Replay</text>
  <text x="288" y="516" font-size="15.5" fill="#475569">load the aggregate events, apply them in order, and the result is current state</text>
</svg>