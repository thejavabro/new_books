<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1126" viewBox="0 0 1240 1126" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four interview formats drawn to scale. The solid part of each lane is the time you get for the design, and the dashed outline is the rest of the session. The dedicated round is a solid 45 to 60 minutes and produces a complete contract. The system design segment is 10 to 15 minutes at the end of a 45 to 60 minute round and produces a focused contract. The critique is a solid 30 to 45 minutes and produces a prioritized redesign. The interface part of a coding round is 10 to 15 minutes at the start of a 45 to 60 minute round and produces an implemented interface. Two of the four formats give the same short design window inside a much longer session.">
  <defs>
    <filter id="yl02fourfor-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl02fourfor-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl02fourfor-k1"><rect x="76" y="146" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="yl02fourfor-k2"><rect x="76" y="358" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="yl02fourfor-k3"><rect x="76" y="570" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="yl02fourfor-k4"><rect x="76" y="782" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1126" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Four formats, example time allocations</text>
  <rect x="672" y="61" width="28" height="22" rx="6" fill="#475569"/>
  <text x="708" y="77" font-size="15.5" fill="#6B7280">the time you get for the design</text>
  <rect x="963" y="61" width="28" height="22" rx="6" fill="#FFFFFF" stroke="#475569" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="999" y="77" font-size="15.5" fill="#6B7280">the rest of the session</text>

  
  <rect x="40" y="126" width="1160" height="192" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <g filter="url(#yl02fourfor-soft)">
    <rect x="76" y="146" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#yl02fourfor-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Dedicated round</text>
  <text x="266" y="261" text-anchor="middle" font-size="15.5" fill="#6B7280">Produces a complete contract</text>
  <text x="266" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">45 to 60 min</text>

  <text x="500" y="168" font-size="15.5" fill="#6B7280">The whole round is the design window</text>
  <rect x="500" y="182" width="664" height="44" rx="8" fill="#2563EB"/>
  <text x="500" y="252" font-size="15.5" fill="#6B7280">First move: Identify the callers and their jobs</text>

  
  <rect x="40" y="338" width="1160" height="192" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <g filter="url(#yl02fourfor-lift)">
    <rect x="76" y="358" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="76" y="358" width="9" height="90" fill="#059669" clip-path="url(#yl02fourfor-k2)"/>
  </g>
  <circle cx="114" cy="403" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,392.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="410" font-size="18.5" font-weight="600" fill="#111827">Inside system design</text>
  <text x="266" y="473" text-anchor="middle" font-size="15.5" fill="#6B7280">Produces a focused contract</text>
  <text x="266" y="496" text-anchor="middle" font-size="15.5" fill="#94A3B8">10 to 15 min of 45 to 60</text>

  <text x="500" y="380" font-size="15.5" fill="#6B7280">Example: design after the architecture</text>
  <rect x="500" y="394" width="664" height="44" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" stroke-dasharray="6 5"/>
  <rect x="998" y="394" width="166" height="44" rx="8" fill="#059669" stroke="#059669" stroke-width="2.2"/>
  <text x="749" y="422" text-anchor="middle" font-size="15.5" fill="#6B7280">first the system design</text>
  <text x="500" y="464" font-size="15.5" fill="#6B7280">First move: Pick one caller and one flow</text>

  
  <rect x="40" y="550" width="1160" height="192" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <g filter="url(#yl02fourfor-soft)">
    <rect x="76" y="570" width="380" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="570" width="6" height="90" fill="#D97706" clip-path="url(#yl02fourfor-k3)"/>
  </g>
  <circle cx="114" cy="615" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,604.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="622" font-size="18.5" font-weight="600" fill="#111827">Critique</text>
  <text x="266" y="685" text-anchor="middle" font-size="15.5" fill="#6B7280">Produces a prioritized redesign</text>
  <text x="266" y="708" text-anchor="middle" font-size="15.5" fill="#94A3B8">30 to 45 min</text>

  <text x="500" y="592" font-size="15.5" fill="#6B7280">The whole round is the critique</text>
  <rect x="500" y="606" width="498" height="44" rx="8" fill="#D97706"/>
  <text x="500" y="676" font-size="15.5" fill="#6B7280">First move: Ask who calls it, and whether you may break it</text>

  
  <rect x="40" y="762" width="1160" height="192" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <g filter="url(#yl02fourfor-lift)">
    <rect x="76" y="782" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="76" y="782" width="9" height="90" fill="#7C3AED" clip-path="url(#yl02fourfor-k4)"/>
  </g>
  <circle cx="114" cy="827" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,816.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="140" y="834" font-size="18.5" font-weight="600" fill="#111827">Inside coding</text>
  <text x="266" y="897" text-anchor="middle" font-size="15.5" fill="#6B7280">Produces an implemented interface</text>
  <text x="266" y="920" text-anchor="middle" font-size="15.5" fill="#94A3B8">10 to 15 min of 45 to 60</text>

  <text x="500" y="804" font-size="15.5" fill="#6B7280">Example: design before implementation</text>
  <rect x="500" y="818" width="664" height="44" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="6 5"/>
  <rect x="500" y="818" width="166" height="44" rx="8" fill="#7C3AED" stroke="#7C3AED" stroke-width="2.2"/>
  <text x="915" y="846" text-anchor="middle" font-size="15.5" fill="#6B7280">then the implementation</text>
  <text x="500" y="888" font-size="15.5" fill="#6B7280">First move: Define behavior before the data structure</text>

  
  <rect x="40" y="986" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1030" text-anchor="middle" font-size="16" fill="#475569">Two examples allow 10 to 15 minutes for API design.</text>
  <text x="620" y="1058" text-anchor="middle" font-size="16" fill="#475569">Confirm how much time is available for API design.</text>
</svg>