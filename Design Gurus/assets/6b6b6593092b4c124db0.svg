<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="692" viewBox="0 0 1240 692" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rates-title rates-desc">
<title id="rates-title">Data transfer is four prices</title>
<desc id="rates-desc">Out to the internet, between regions, between availability zones in each direction, and through a subnet gateway on traffic that never leaves the region.</desc>
<defs>
<marker id="rates-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="rates-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="rates-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="rates-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="692" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Data transfer is four prices</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Data transfer is not one price.</text>
<rect x="40" y="614" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="614" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="128" width="330" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="205" y="166" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Out to the internet</text>
<text x="390" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">about $0.09 / GB</text>
<rect x="390" y="166" width="200" height="18" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="390" y="166" width="200.0" height="18" rx="10" fill="#F25461"/>
<rect x="620" y="128" width="580" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="153.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tiering downward, after a free allowance</text><text x="640" y="178.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">of roughly 100 GB a month</text>
<rect x="40" y="204" width="330" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="205" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Between regions</text>
<text x="390" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">about $0.02 / GB</text>
<rect x="390" y="242" width="200" height="18" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="390" y="242" width="44.0" height="18" rx="10" fill="#E8BC60"/>
<rect x="620" y="204" width="580" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">real money for anything replicating continuously</text>
<rect x="40" y="280" width="330" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="205" y="318" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Between zones, one way</text>
<text x="390" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">about $0.01 / GB</text>
<rect x="390" y="318" width="200" height="18" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="390" y="318" width="22.0" height="18" rx="10" fill="#7650D6"/>
<rect x="620" y="280" width="580" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="305.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">charged in both directions, so a round trip</text><text x="640" y="330.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is about $0.02</text>
<rect x="40" y="356" width="330" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="205" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Through a subnet gateway</text>
<text x="390" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">about $0.045 / GB</text>
<rect x="390" y="394" width="200" height="18" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="390" y="394" width="100.0" height="18" rx="10" fill="#159BEF"/>
<rect x="620" y="356" width="580" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="381.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">plus an hourly charge, on traffic that</text><text x="640" y="406.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">never leaves the region</text>
<rect x="40" y="444" width="1160" height="60" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="444" width="5" height="60" rx="2.5" fill="#39D5AA"/><text x="64" y="480" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Inbound is generally free, which is why what a service returns decides its cost shape.</text>
<rect x="40" y="524" width="1160" height="60" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="524" width="5" height="60" rx="2.5" fill="#F28B9D"/><text x="64" y="560" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Four prices, differing by more than an order of magnitude, for moving the same byte.</text>
<text x="66" y="648" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">You choose an instance type from a list with the price next to it. You never choose a zone crossing.</text>
</svg>