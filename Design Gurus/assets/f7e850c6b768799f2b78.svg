<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="812" viewBox="0 0 1240 812" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two bands comparing repeated lookups for a missing record without negative caching, where every request reaches the database, and with negative caching, where only the first request does">
  <rect x="0" y="0" width="1240" height="812" fill="#FFFFFF"/>
  <defs>
    <marker id="ca1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ca1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ca1-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="ca1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One thousand requests for a user ID that does not exist</text>

  
  <rect x="40" y="72" width="1160" height="326" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#B91C1C">Without negative caching</text>

  <line x1="270" y1="238" x2="442" y2="238" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca1-blue)"/>
  <text x="356" y="214" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">GET /users/999</text>

  <line x1="660" y1="238" x2="872" y2="238" stroke="#DC2626" stroke-width="2" marker-end="url(#ca1-red)"/>
  <text x="766" y="214" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">miss, every time</text>

  <g filter="url(#ca1-soft)">
    <rect x="70" y="202" width="200" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="450" y="202" width="210" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="170" y="234" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="170" y="262" font-size="20" fill="#64748B" text-anchor="middle">app or bot</text>
  <text x="555" y="234" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cache</text>
  <text x="555" y="262" font-size="20" fill="#64748B" text-anchor="middle">stores hits only</text>

  <g filter="url(#ca1-soft)">
    <path d="M880 214 a120 18 0 0 1 240 0 v56 a120 18 0 0 1 -240 0 z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1000" cy="214" rx="120" ry="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1000" y="248" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Database</text>
  <text x="1000" y="276" font-size="20" fill="#64748B" text-anchor="middle">returns 0 rows</text>

  <rect x="180" y="308" width="880" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="340" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">1,000 requests reach the database.</text>
  <text x="620" y="368" font-size="20" fill="#7F1D1D" text-anchor="middle">The cache never helps, because there is no result to store.</text>

  
  <rect x="40" y="426" width="1160" height="356" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="460" font-size="20" font-weight="600" fill="#065F46">With negative caching</text>

  <line x1="270" y1="556" x2="442" y2="556" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca1-blue)"/>
  <text x="356" y="532" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1st request</text>

  <line x1="660" y1="556" x2="872" y2="556" stroke="#DC2626" stroke-width="2" marker-end="url(#ca1-red)"/>
  <text x="766" y="532" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one query only</text>

  <g filter="url(#ca1-soft)">
    <rect x="70" y="520" width="200" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="450" y="520" width="210" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="170" y="552" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="170" y="580" font-size="20" fill="#64748B" text-anchor="middle">app or bot</text>
  <text x="555" y="552" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cache</text>
  <text x="555" y="580" font-size="20" fill="#64748B" text-anchor="middle">stores the miss too</text>

  <g filter="url(#ca1-soft)">
    <path d="M880 532 a120 18 0 0 1 240 0 v56 a120 18 0 0 1 -240 0 z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1000" cy="532" rx="120" ry="18" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1000" y="566" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Database</text>
  <text x="1000" y="594" font-size="20" fill="#64748B" text-anchor="middle">returns 0 rows</text>

  
  <rect x="575" y="620" width="430" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="790" y="650" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">the cache now stores</text>
  <text x="790" y="678" font-size="20" fill="#92400E" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">users/999 = miss, TTL 30s</text>

  
  <path d="M555 594 L555 644 L170 644 L170 598" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ca1-emerald)"/>
  <text x="362" y="632" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">requests 2 to 1,000 are answered here</text>

  <rect x="180" y="706" width="880" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="744" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The database sees 1 query instead of 1,000.</text>
</svg>