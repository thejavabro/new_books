<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1400" viewBox="0 0 1240 1400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Payments and wallet service map: the wallet app and merchants call one API gateway into the Orchestrator, which checks Risk and Limits synchronously, posts entries synchronously to the append only Ledger, and calls the Provider Gateway for charges and payouts. The Ledger writes the journal plus the derived balance projection and publishes each posted transaction to the ledger topic, which feeds the statement read model, notifications, and Reconciliation. The card acquirer and bank reply by webhook, which lands on a queue before the Provider Gateway handles it.">
  <defs>
    <marker id="m07-l06-payments-architecture-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l06-payments-architecture-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m07-l06-payments-architecture-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1400" fill="#FFFFFF"/>

  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="60" y="140" width="300" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="210" y="186" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Wallet app</text>
  <text x="210" y="218" text-anchor="middle" font-size="20" fill="#64748B">taps top up or pay</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="400" y="140" width="300" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="550" y="186" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Merchant</text>
  <text x="550" y="218" text-anchor="middle" font-size="20" fill="#64748B">collects a payment</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="760" y="140" width="440" height="250" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="980" y="208" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The journal wins by definition</text>
  <text x="980" y="240" text-anchor="middle" font-size="20" fill="#475569">A balance is a conclusion you defend,</text>
  <text x="980" y="272" text-anchor="middle" font-size="20" fill="#475569">not a field you edit. The running</text>
  <text x="980" y="304" text-anchor="middle" font-size="20" fill="#475569">balance is a projection written in the</text>
  <text x="980" y="336" text-anchor="middle" font-size="20" fill="#475569">same transaction as the entries.</text>

  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="140" y="310" width="300" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="290" y="372" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">API Gateway</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="500" y="310" width="300" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="650" y="372" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Risk and Limits</text>

  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="140" y="490" width="400" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="340" y="546" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orchestrator</text>
  <text x="340" y="578" text-anchor="middle" font-size="20" fill="#64748B">it drives the money flows</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="620" y="490" width="300" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="770" y="546" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Provider Gateway</text>
  <text x="770" y="578" text-anchor="middle" font-size="20" fill="#64748B">and its webhook endpoint</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="980" y="490" width="220" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1090" y="546" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Card acquirer</text>
  <text x="1090" y="578" text-anchor="middle" font-size="20" fill="#64748B">and bank</text>

  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="140" y="700" width="400" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="340" y="756" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Ledger: append only</text>
  <text x="340" y="788" text-anchor="middle" font-size="20" fill="#64748B">the only writer of money facts</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <path d="M600,710 L600,810 A170,20 0 0 0 940,810 L940,710" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="770" cy="710" rx="170" ry="20" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="770" y="752" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Journal, plus the</text>
  <text x="770" y="782" text-anchor="middle" font-size="20" fill="#64748B">balance projection</text>

  <g filter="url(#m07-l06-payments-architecture-soft)">
    <path d="M140,920 L140,1020 A200,20 0 0 0 540,1020 L540,920" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="340" cy="920" rx="200" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="340" y="962" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Ledger topic</text>
  <text x="340" y="992" text-anchor="middle" font-size="20" fill="#64748B">one event per posted entry</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <path d="M1010,900 L1010,990 A95,20 0 0 0 1200,990 L1200,900" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="1105" cy="900" rx="95" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1105" y="937" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Webhook</text>
  <text x="1105" y="967" text-anchor="middle" font-size="20" fill="#64748B">queue</text>

  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="60" y="1110" width="340" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="1171" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Statement read model</text>
  <text x="230" y="1203" text-anchor="middle" font-size="20" fill="#64748B">rebuilt from the topic</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="440" y="1110" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="580" y="1171" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="580" y="1203" text-anchor="middle" font-size="20" fill="#64748B">listens only</text>
  <g filter="url(#m07-l06-payments-architecture-soft)">
    <rect x="760" y="1110" width="340" height="140" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="930" y="1155" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Reconciliation</text>
  <text x="930" y="1187" text-anchor="middle" font-size="20" fill="#64748B">reads the daily</text>
  <text x="930" y="1219" text-anchor="middle" font-size="20" fill="#64748B">settlement files too</text>

  <g fill="none" stroke-width="2.5">
    <path d="M210,250 C210,285 260,272 260,302" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payments-architecture-bl)"/>
    <path d="M550,250 C550,285 330,272 330,302" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payments-architecture-bl)"/>
    <path d="M290,420 L290,482" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payments-architecture-bl)"/>
    <path d="M540,530 C590,530 605,470 650,430" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payments-architecture-bl)"/>
    <path d="M540,570 L612,570" stroke="#3B82F6" marker-end="url(#m07-l06-payments-architecture-bl)"/>
    <path d="M920,555 L972,555" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payments-architecture-bl)"/>
    <path d="M290,620 L290,692" stroke="#3B82F6" marker-end="url(#m07-l06-payments-architecture-bl)"/>
    <path d="M540,760 L592,760" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payments-architecture-bl)"/>
    <path d="M290,830 L290,892" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l06-payments-architecture-ab)"/>
    <path d="M240,1040 L240,1102" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l06-payments-architecture-ab)"/>
    <path d="M400,1040 C440,1060 550,1070 570,1102" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l06-payments-architecture-ab)"/>
    <path d="M500,1040 C620,1070 830,1060 900,1102" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l06-payments-architecture-ab)"/>
    <path d="M1105,620 L1105,872" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l06-payments-architecture-ab)"/>
    <path d="M1010,945 L975,945 L975,665 L870,665 L870,628" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l06-payments-architecture-ab)"/>
  </g>

  <text x="620" y="470" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">check limits (sync)</text>
  <text x="690" y="655" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge or payout</text>
  <text x="310" y="665" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">post entries (sync)</text>
  <text x="310" y="872" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">posted transaction</text>
  <text x="1125" y="760" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">webhook</text>

  <line x1="60" y1="1320" x2="96" y2="1320" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1327" font-size="20" fill="#475569">Synchronous: the caller waits, and money facts are written first</text>
  <line x1="60" y1="1360" x2="96" y2="1360" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1367" font-size="20" fill="#475569">Asynchronous: published or queued, nobody waits</text>
</svg>