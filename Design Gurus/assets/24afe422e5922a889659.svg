<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="828" viewBox="0 0 1240 828" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With the arrival rate unchanged at two hundred requests per second, latency rising from half a second to two seconds takes the number of requests in flight from one hundred to four hundred">
  <rect x="0" y="0" width="1240" height="828" fill="#FFFFFF"/>
  <defs>
    <marker id="sc2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Nobody sent more traffic. One dependency just got slower.</text>

  
  <rect x="50" y="88" width="560" height="212" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#EFF6FF"/>
  <text x="330" y="122" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Before</text>
  <text x="70" y="180" font-size="20" fill="#0F172A">λ = 200 requests per second</text>
  <text x="70" y="222" font-size="20" fill="#0F172A">W = 0.5 s per request</text>
  <text x="70" y="264" font-size="20" font-weight="600" fill="#1E40AF">L = 200 × 0.5 = 100 in flight</text>

  
  <rect x="630" y="88" width="560" height="212" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M630 100 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#FEF2F2"/>
  <text x="910" y="122" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">After a database call slows down</text>
  <text x="650" y="180" font-size="20" fill="#0F172A">λ = 200 requests per second, unchanged</text>
  <text x="650" y="222" font-size="20" font-weight="600" fill="#B91C1C">W = 2 s per request</text>
  <text x="650" y="264" font-size="20" font-weight="600" fill="#B91C1C">L = 200 × 2 = 400 in flight</text>

  <text x="620" y="340" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">the arrival rate never changed: 200 requests per second</text>

  
  <rect x="300" y="580" width="180" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="390" y="566" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">100 in flight</text>

  <rect x="700" y="400" width="180" height="240" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="790" y="386" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">400 in flight</text>

  <line x1="200" y1="640" x2="1120" y2="640" stroke="#475569" stroke-width="2" marker-end="url(#sc2-slate)"/>

  <text x="390" y="672" font-size="20" fill="#334155" text-anchor="middle">latency 0.5 s</text>
  <text x="790" y="672" font-size="20" fill="#334155" text-anchor="middle">latency 2 s</text>

  
  <rect x="50" y="706" width="1140" height="92" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="742" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Traffic did not rise. Latency did, and Little's Law turned that into four times the load.</text>
  <text x="620" y="772" font-size="20" fill="#B91C1C" text-anchor="middle">This is why one slow dependency can make an entire system look overwhelmed.</text>
</svg>