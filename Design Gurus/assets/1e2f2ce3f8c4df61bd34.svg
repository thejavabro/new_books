<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="842" viewBox="0 0 1240 842" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities and flow for a multi tenant notification service: a tenant raises an event, the service builds a notification, user preferences filter it, and it fans out across in-app, push, email and SMS channels to the user">
  <defs>
    <filter id="ntfk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ntfk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ntfk-k1"><rect x="330" y="90" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="ntfk-k2"><rect x="50" y="270" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="ntfk-k3"><rect x="330" y="270" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="ntfk-k4"><rect x="710" y="270" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ntfk-k5"><rect x="1000" y="270" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="ntfk-k6"><rect x="330" y="460" width="280" height="90" rx="12"/></clipPath>
    <marker id="ntfk-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="ntfk-in" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="ntfk-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ntfk-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ntfk-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="842" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Notification service: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One shared service for many tenants, so isolation and user preferences are part of the design, not an afterthought.</text>

  <g fill="none" stroke-width="2">
    <path d="M595,180 V270" stroke="#4F46E5" marker-end="url(#ntfk-in)"/>
    <path d="M250,315 H330" stroke="#64748B" marker-end="url(#ntfk-sl)"/>
    <path d="M595,460 V370" stroke="#D97706" marker-end="url(#ntfk-am)"/>
    <path d="M610,315 H710" stroke="#7C3AED" marker-end="url(#ntfk-vi)"/>
    <path d="M930,315 H1000" stroke="#059669" marker-end="url(#ntfk-em)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="640" y="232" fill="#4338CA">payload</text>
    <text x="290" y="302" fill="#475569">event</text>
    <text x="480" y="435" fill="#B45309">filters and quiet hours</text>
    <text x="660" y="302" fill="#5B21B6">fan out</text>
    <text x="965" y="302" fill="#047857">deliver</text>
  </g>

  
  <g filter="url(#ntfk-soft)">
    <rect x="330" y="90" width="280" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="330" y="90" width="6" height="90" fill="#4F46E5" clip-path="url(#ntfk-k1)"/>
  </g>
  <circle cx="368" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,124.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="394" y="142" font-size="21.5" font-weight="600" fill="#111827">Notification</text>
  <text x="470" y="209" font-size="18.5" text-anchor="middle" fill="#6B7280">the message itself</text>
  <text x="470" y="236" font-size="18.5" text-anchor="middle" fill="#94A3B8">one event, many recipients</text>

  
  <g filter="url(#ntfk-soft)">
    <rect x="50" y="270" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="50" y="270" width="6" height="90" fill="#64748B" clip-path="url(#ntfk-k2)"/>
  </g>
  <circle cx="88" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,304.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="114" y="322" font-size="21.5" font-weight="600" fill="#111827">Tenant</text>
  <text x="150" y="389" font-size="18.5" text-anchor="middle" fill="#6B7280">one client application</text>
  <text x="150" y="416" font-size="18.5" text-anchor="middle" fill="#94A3B8">shares nothing with the rest</text>

  
  <g filter="url(#ntfk-lift)">
    <rect x="330" y="270" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="330" y="270" width="9" height="90" fill="#2563EB" clip-path="url(#ntfk-k3)"/>
  </g>
  <circle cx="368" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,304.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="394" y="322" font-size="21.5" font-weight="600" fill="#111827">Notification Service</text>

  
  <g filter="url(#ntfk-soft)">
    <rect x="330" y="460" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="330" y="460" width="6" height="90" fill="#D97706" clip-path="url(#ntfk-k6)"/>
  </g>
  <circle cx="368" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,494.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="394" y="512" font-size="21.5" font-weight="600" fill="#111827">User Preferences</text>
  <text x="470" y="579" font-size="18.5" text-anchor="middle" fill="#6B7280">opt outs, quiet hours, priority</text>
  <text x="470" y="606" font-size="18.5" text-anchor="middle" fill="#94A3B8">applied before anything is sent</text>

  
  <g filter="url(#ntfk-soft)">
    <rect x="710" y="270" width="220" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="710" y="270" width="6" height="90" fill="#7C3AED" clip-path="url(#ntfk-k4)"/>
  </g>
  <circle cx="748" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,304.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="774" y="322" font-size="21.5" font-weight="600" fill="#111827">Channels</text>
  <text x="820" y="389" font-size="18.5" text-anchor="middle" fill="#6B7280">in-app, push, email, SMS</text>
  <text x="820" y="416" font-size="18.5" text-anchor="middle" fill="#94A3B8">each one can fail on its own</text>

  
  <g filter="url(#ntfk-soft)">
    <rect x="1000" y="270" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1000" y="270" width="6" height="90" fill="#059669" clip-path="url(#ntfk-k5)"/>
  </g>
  <circle cx="1038" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="1064" y="322" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="1095" y="389" font-size="18.5" text-anchor="middle" fill="#6B7280">belongs to one tenant</text>
  <text x="1095" y="416" font-size="18.5" text-anchor="middle" fill="#94A3B8">may hold several devices</text>

  
  <rect x="40" y="640" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="662" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="685" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Multi-tenancy</text>
  <text x="323" y="685" font-size="18.5" fill="#475569">many client applications share the infrastructure, and none of them can see another's data</text>

  <rect x="64" y="706" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="729" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Channel</text>
  <text x="323" y="729" font-size="18.5" fill="#475569">the medium: in-app for live badges, push for closed apps, email and SMS for reach</text>

  <rect x="64" y="750" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="773" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Preferences</text>
  <text x="323" y="773" font-size="18.5" fill="#475569">the user decides what arrives and when; the tenant only asks</text>
</svg>