<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="692" viewBox="0 0 1240 692" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="planner-title planner-desc">
<title id="planner-title">What the planner was absorbing</title>
<desc id="planner-desc">A relational planner stands between the query you want and the layout you have, which is why a normalized schema survives queries nobody anticipated. In a key-value or wide-column store there is no such layer, so the layout is the plan.</desc>
<defs>
<marker id="planner-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="planner-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="planner-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="planner-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="692" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the planner was absorbing</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A relational planner stands between the query you want and the layout you have.</text>
<rect x="40" y="614" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="614" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="316" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V428A6 6 0 0 0 46 434H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Relational</text>
<rect x="72" y="174" width="500" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the query you want</text>
<path d="M320 232V262" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M320 232V262" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planner-marker-slate)"/>
<rect x="72" y="268" width="500" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="300" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the planner</text>
<path d="M320 326V356" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M320 326V356" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planner-marker-slate)"/>
<rect x="72" y="362" width="500" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the physical layout</text>
<rect x="640" y="118" width="560" height="316" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V428A6 6 0 0 0 646 434H654Z" fill="#F3CF6A"/><text x="670" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Key-value and wide-column</text>
<rect x="672" y="174" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the query you want</text>
<path d="M920 232V356" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 232V356" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#planner-marker-red)"/>
<text x="890" y="282" font-size="19" font-weight="700" fill="#8795A5" text-anchor="end">nothing</text><text x="890" y="307" font-size="19" font-weight="700" fill="#8795A5" text-anchor="end">in between</text>
<rect x="672" y="362" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the physical layout</text>
<rect x="40" y="458" width="560" height="128" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="458" width="5" height="128" rx="2.5" fill="#AC8BE8"/><text x="64" y="489" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">With no planner and no join, the</text><text x="64" y="515" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">physical layout is the query plan.</text><text x="64" y="541" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">So you cannot design the schema before</text><text x="64" y="567" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you know the queries.</text>
<rect x="640" y="458" width="560" height="128" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="458" width="5" height="128" rx="2.5" fill="#39D5AA"/><text x="664" y="489" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">A planner and a few indexes absorb an</text><text x="664" y="515" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">enormous amount of mismatch.</text><text x="664" y="541" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">That is why the relational default works</text><text x="664" y="567" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for far longer than people expect.</text>
<text x="66" y="648" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The reason the default stops working is not scale by itself. It is the missing layer.</text>
</svg>