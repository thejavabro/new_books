<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The structure shared by all twelve case studies. Before you draw anything: system definition, requirements, and back-of-the-envelope estimation. The design itself: high-level design, data model and APIs, then detailed component design and scale.">
  <defs>
    <filter id="csp-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="csp-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="csp-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="csp-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="csp-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="csp-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="csp-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="csp-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The shape of every case study</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Twelve different problems, one order of work. The first three steps happen before you draw anything.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Before you draw anything</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">The design itself</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#csp-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#csp-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">1. System definition</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">what it does, who uses it,</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">and what is out of scope</text>
  <g filter="url(#csp-lift)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="450" y="175" width="9" height="90" fill="#4F46E5" clip-path="url(#csp-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">2. Requirements</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">functional, then the</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">non-functional targets</text>
  <g filter="url(#csp-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#64748B" clip-path="url(#csp-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">3. Estimation</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">rough arithmetic: traffic,</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">storage, and read to write</text>
  <g filter="url(#csp-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#059669" clip-path="url(#csp-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">4. High-level design</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">the main parts, and one</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">request traced across them</text>
  <g filter="url(#csp-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#D97706" clip-path="url(#csp-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">5. Data model and APIs</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">storage choice, the keys,</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">and the few calls that matter</text>
  <g filter="url(#csp-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#csp-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">6. Detail and scale</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">the two or three hard parts,</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">then sharding and failure</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Order matters</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">each step uses the answer from the one before it, so skipping one turns the next into a guess</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Steps 1 to 3</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">cheap to do and cheap to redo, and the ones most candidates skip to start drawing boxes</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Not a script</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">some case studies give the API its own step, others fold it into the high-level design</text>
</svg>