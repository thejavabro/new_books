<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="leak-title leak-desc">
<title id="leak-title">Where the boundaries leak</title>
<desc id="leak-desc">Cells, canaries and bulkheads all fail the same way: something is shared that nobody counted. Every cellular design has a global component, and naming it is the difference between a bounded radius and a claimed one.</desc>
<defs>
<marker id="leak-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="leak-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="leak-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="leak-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where the boundaries leak</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Cells, canaries and bulkheads all fail the same way: something is shared that nobody counted.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="430" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="305" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The shared control plane</text>
<path d="M526 148H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 148H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leak-marker-slate)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every cell independent, all getting config from one service</text>
<circle cx="60" cy="220" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="430" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="305" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Shared identity or auth</text>
<path d="M526 220H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 220H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leak-marker-slate)"/>
<rect x="570" y="190" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="226" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most common genuinely global dependency</text>
<circle cx="60" cy="292" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="430" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="305" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The small global database</text>
<path d="M526 292H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 292H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leak-marker-slate)"/>
<rect x="570" y="262" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a lookup table, a flag store, a rate limiter.</text><text x="590" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Small, and shared by everything</text>
<circle cx="60" cy="364" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="430" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="305" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The shared deploy pipeline</text>
<path d="M526 364H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 364H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leak-marker-slate)"/>
<rect x="570" y="334" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">pushes the same bad change into every</text><text x="590" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">independent cell, at speed</text>
<circle cx="60" cy="436" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="443" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="406" width="430" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="305" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Correlated infrastructure</text>
<path d="M526 436H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 436H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leak-marker-slate)"/>
<rect x="570" y="406" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="442" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">same zone, same rack, same managed service underneath</text>
<rect x="40" y="484" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="484" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="510.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Independence is a claim about shared dependencies,</text><text x="64" y="539.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">and it is usually wrong the first time anybody checks.</text>
<rect x="40" y="574" width="1160" height="92" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="574" width="5" height="92" rx="2.5" fill="#39D5AA"/><text x="64" y="600" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The practice that catches them</text><text x="64" y="626" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Take one cell, list everything it touches, mark each inside or outside.</text><text x="64" y="652" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Everything outside is global, and global means it can take everything down.</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Working backwards from one cell is how you find what you did not know was global.</text>
</svg>