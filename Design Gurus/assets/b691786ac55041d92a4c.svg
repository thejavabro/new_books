<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A lookup checks the browser cache, then the operating system cache, then the recursive resolver cache. Only on a miss at every layer does the resolver ask the authoritative servers.">
  <defs>
    <filter id="dr2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dr2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="dr2-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="dr2-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="dr2-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="dr2-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="dr2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Where a DNS answer can come from</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each layer checks its own cache first. The lookup stops at the first fresh answer.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#dr2-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#dr2-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#dr2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="316" y="173" fill="#475569">miss</text>
    <text x="619" y="173" fill="#475569">miss</text>
    <text x="922" y="173" fill="#475569">miss</text>
  </g>

  <g filter="url(#dr2-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#D97706" clip-path="url(#dr2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">1. Browser</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">its own short cache</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">fastest</text>
  <g filter="url(#dr2-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#D97706" clip-path="url(#dr2-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">2. Device OS</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the stub resolver cache</text>
  <g filter="url(#dr2-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#dr2-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">3. Resolver</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">a cache shared by</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">many users</text>
  <g filter="url(#dr2-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#dr2-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">4. Authoritative</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">only if no cache has it</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">the source of the record</text>

  <rect x="40" y="340" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="365" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Cache hit</text>
  <text x="323" y="390" font-size="18.5" fill="#475569">a few milliseconds, and no other server is asked</text>
  <rect x="64" y="415" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="440" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Home router</text>
  <text x="323" y="440" font-size="18.5" fill="#475569">many routers also cache answers, between the device and the resolver</text>
</svg>