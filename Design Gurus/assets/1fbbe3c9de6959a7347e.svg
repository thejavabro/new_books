<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="868" viewBox="0 0 1240 868" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three notification consumers and the delivery mechanism each one needs: Server-Sent Events for an open browser, platform push for a usually-closed mobile application, and a signed webhook for a partner server. All three treat the REST notification resources as the source of truth.">
  <defs>
    <marker id="pt-vm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="pt-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="pt-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="pt-k1"><rect x="76" y="174" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="pt-k2"><rect x="525" y="174" width="310" height="90" rx="12"/></clipPath>
    <clipPath id="pt-k3"><rect x="924" y="174" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="pt-k4"><rect x="76" y="370" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="pt-k5"><rect x="525" y="370" width="310" height="90" rx="12"/></clipPath>
    <clipPath id="pt-k6"><rect x="924" y="370" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="pt-k7"><rect x="76" y="566" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="pt-k8"><rect x="525" y="566" width="310" height="90" rx="12"/></clipPath>
    <clipPath id="pt-k9"><rect x="924" y="566" width="240" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="868" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="92" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Three consumers, three mechanisms, one source of truth</text>
  <text x="76" y="110" font-size="16.5" font-weight="600" fill="#5B21B6">Consumer</text>
  <text x="525" y="110" font-size="16.5" font-weight="600" fill="#047857">Mechanism</text>
  <text x="924" y="110" font-size="16.5" font-weight="600" fill="#1D4ED8">Source of truth</text>

  
  <rect x="40" y="152" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <g fill="none" stroke-width="2">
    <path d="M436,219 H525" stroke="#7C3AED" marker-end="url(#pt-vm)"/>
    <path d="M835,219 H924" stroke="#059669" marker-end="url(#pt-em)"/>
  </g>

  <g filter="url(#pt-soft)">
    <rect x="76" y="174" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#7C3AED" clip-path="url(#pt-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">An open browser page</text>

  <g filter="url(#pt-soft)">
    <rect x="525" y="174" width="310" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="525" y="174" width="6" height="90" fill="#059669" clip-path="url(#pt-k2)"/>
  </g>
  <circle cx="563" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(552.56,208.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="589" y="226" font-size="18.5" font-weight="600" fill="#111827">Server-Sent Events (SSE)</text>
  <text x="680" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">The server sends; the browser only</text>
  <text x="680" y="312" text-anchor="middle" font-size="15.5" fill="#6B7280">receives, and writes over REST</text>

  <g filter="url(#pt-soft)">
    <rect x="924" y="174" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="924" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#pt-k3)"/>
  </g>
  <circle cx="962" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(951.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="988" y="226" font-size="18.5" font-weight="600" fill="#111827">REST resources</text>

  
  <rect x="40" y="348" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <g fill="none" stroke-width="2">
    <path d="M436,415 H525" stroke="#7C3AED" marker-end="url(#pt-vm)"/>
    <path d="M835,415 H924" stroke="#059669" marker-end="url(#pt-em)"/>
  </g>

  <g filter="url(#pt-soft)">
    <rect x="76" y="370" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="370" width="6" height="90" fill="#7C3AED" clip-path="url(#pt-k4)"/>
  </g>
  <circle cx="114" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,404.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/>
    <path d="M10.5 18.5h3"/>
  </g>
  <text x="140" y="422" font-size="18.5" font-weight="600" fill="#111827">A usually-closed mobile app</text>

  <g filter="url(#pt-soft)">
    <rect x="525" y="370" width="310" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="525" y="370" width="6" height="90" fill="#059669" clip-path="url(#pt-k5)"/>
  </g>
  <circle cx="563" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(552.56,404.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="589" y="422" font-size="18.5" font-weight="600" fill="#111827">Platform push</text>
  <text x="680" y="485" text-anchor="middle" font-size="15.5" fill="#6B7280">The operating system can wake or alert</text>
  <text x="680" y="508" text-anchor="middle" font-size="15.5" fill="#6B7280">an application that is not running</text>

  <g filter="url(#pt-soft)">
    <rect x="924" y="370" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="924" y="370" width="6" height="90" fill="#2563EB" clip-path="url(#pt-k6)"/>
  </g>
  <circle cx="962" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(951.56,404.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="988" y="422" font-size="18.5" font-weight="600" fill="#111827">REST resources</text>

  
  <rect x="40" y="544" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <g fill="none" stroke-width="2">
    <path d="M436,611 H525" stroke="#7C3AED" marker-end="url(#pt-vm)"/>
    <path d="M835,611 H924" stroke="#059669" marker-end="url(#pt-em)"/>
  </g>

  <g filter="url(#pt-soft)">
    <rect x="76" y="566" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="566" width="6" height="90" fill="#7C3AED" clip-path="url(#pt-k7)"/>
  </g>
  <circle cx="114" cy="611" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,600.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="140" y="618" font-size="18.5" font-weight="600" fill="#111827">A partner server</text>

  <g filter="url(#pt-soft)">
    <rect x="525" y="566" width="310" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="525" y="566" width="6" height="90" fill="#059669" clip-path="url(#pt-k8)"/>
  </g>
  <circle cx="563" cy="611" r="18" fill="#FFFFFF"/>
  <g transform="translate(552.56,600.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="589" y="618" font-size="18.5" font-weight="600" fill="#111827">Signed webhook</text>
  <text x="680" y="681" text-anchor="middle" font-size="15.5" fill="#6B7280">There is no screen at all, so the</text>
  <text x="680" y="704" text-anchor="middle" font-size="15.5" fill="#6B7280">service becomes the caller</text>

  <g filter="url(#pt-soft)">
    <rect x="924" y="566" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="924" y="566" width="6" height="90" fill="#2563EB" clip-path="url(#pt-k9)"/>
  </g>
  <circle cx="962" cy="611" r="18" fill="#FFFFFF"/>
  <g transform="translate(951.56,600.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="988" y="618" font-size="18.5" font-weight="600" fill="#111827">REST resources</text>

  
  <rect x="40" y="752" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="797" text-anchor="middle" font-size="16" fill="#475569">Using three delivery mechanisms is not inconsistency. One mechanism cannot serve all three.</text>
</svg>