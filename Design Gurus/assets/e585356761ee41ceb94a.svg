<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="autoscale-title autoscale-desc">
<title id="autoscale-title">What autoscaling does not fix</title>
<desc id="autoscale-desc">Demand rises faster than capacity can follow, so the existing fleet serves the whole spike for as long as detection, start-up, warming and health checks take. That sets a floor on steady-state capacity which autoscaling cannot lower.</desc>
<defs>
<marker id="autoscale-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="autoscale-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="autoscale-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="autoscale-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="796" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What autoscaling does not fix</text>
<text x="40" y="86" font-size="21" fill="#4A5568">It changes the problem rather than removing it, and it has four limits worth knowing before relying on it.</text>
<rect x="40" y="718" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="718" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="400" y="184" width="420" height="85" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2" rx="8"/>
<path d="M60 318H1200" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60 288H400V184H1200" fill="none" stroke="#CE475C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1200" y="208" font-size="19" font-weight="700" fill="#A83147" text-anchor="end">demand</text>
<path d="M60 269H740L820 158H1200" fill="none" stroke="#169B77" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1200" y="144" font-size="19" font-weight="700" fill="#169B77" text-anchor="end">capacity</text>
<text x="610" y="220" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">the gap you serve</text><text x="610" y="246" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">with what you already had</text>
<path d="M400 330H820" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="610" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">detect, start, warm, pass health checks</text>
<text x="40" y="140" font-size="19" font-weight="700" fill="#4A5568" text-anchor="start">Load</text>
<rect x="40" y="388" width="480" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="417" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It reacts slower than traffic arrives</text>
<path d="M526 411H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 411H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#autoscale-marker-slate)"/>
<rect x="570" y="388" width="630" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="417" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tens of seconds to several minutes</text>
<rect x="40" y="444" width="480" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="473" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Something must survive the gap</text>
<path d="M526 467H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 467H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#autoscale-marker-slate)"/>
<rect x="570" y="444" width="630" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="473" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which sets a floor autoscaling cannot lower</text>
<rect x="40" y="500" width="480" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="529" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It scales what you told it to</text>
<path d="M526 523H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 523H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#autoscale-marker-slate)"/>
<rect x="570" y="500" width="630" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="529" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">adding instances when the database binds makes it worse</text>
<rect x="40" y="556" width="480" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="585" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scaling down has its own risk</text>
<path d="M526 579H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 579H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#autoscale-marker-slate)"/>
<rect x="570" y="556" width="630" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="585" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and removes capacity during a partial failure</text>
<rect x="40" y="626" width="1160" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="626" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="64" y="665" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Good at following a daily curve. Poor at a spike, and useless on a bottleneck it is not scaling.</text>
<text x="66" y="752" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Autoscaling changes the capacity problem. It does not remove it.</text>
</svg>