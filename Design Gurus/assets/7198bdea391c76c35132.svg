<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Twitter data model: Tweet with media IDs and a retweet reference, User, the UserFollow pair table, Favorite, and file storage for media">
<defs>
<filter id="tw1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="tw1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="tw1-msl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="tw1-mind" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="tw1-mem" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<clipPath id="tw1-k1"><rect x="70" y="50" width="470" height="286" rx="12"/></clipPath>
<clipPath id="tw1-k2"><rect x="760" y="50" width="400" height="214" rx="12"/></clipPath>
<clipPath id="tw1-k3"><rect x="760" y="360" width="400" height="142" rx="12"/></clipPath>
<clipPath id="tw1-k4"><rect x="760" y="600" width="400" height="142" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="960" fill="#FFFFFF"/>
<path d="M 540,160 H 638 Q 650,160 650,148 V 136 Q 650,124 662,124 H 757" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#tw1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="205" fill="#475569">UserID points to the author</text></g><path d="M 960,360 V 267" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#tw1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="960" y="317" fill="#4338CA">both columns are UserIDs</text></g><path d="M 760,674 H 662 Q 650,674 650,662 V 312 Q 650,300 638,300 H 543" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#tw1-mem)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="490" fill="#047857">a favorite links</text><text x="650" y="512" fill="#047857">a user to a tweet</text></g><path d="M 170,336 V 461" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#tw1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="305" y="420" fill="#475569">MediaIDs point here</text></g><g filter="url(#tw1-lift)">
<rect x="70" y="50" width="470" height="286" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="70" y="50" width="9" height="286" fill="#2563EB" clip-path="url(#tw1-k1)"/>
</g>
<circle cx="108" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,67.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
<text x="134" y="85" font-size="18.5" font-weight="600" fill="#111827">Tweet (one row per tweet)</text><text x="94" y="131" font-size="15.5" fill="#111827">TweetID</text><text x="516" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">bigint, primary key</text><line x1="84" y1="142" x2="526" y2="142" stroke="#93C5FD" stroke-width="1"/><text x="94" y="167" font-size="15.5" fill="#111827">UserID</text><text x="516" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">int</text><line x1="84" y1="178" x2="526" y2="178" stroke="#93C5FD" stroke-width="1"/><text x="94" y="203" font-size="15.5" fill="#111827">Content</text><text x="516" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">140 chars, 2 bytes each</text><line x1="84" y1="214" x2="526" y2="214" stroke="#93C5FD" stroke-width="1"/><text x="94" y="239" font-size="15.5" fill="#111827">MediaIDs</text><text x="516" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">list of file IDs</text><line x1="84" y1="250" x2="526" y2="250" stroke="#93C5FD" stroke-width="1"/><text x="94" y="275" font-size="15.5" fill="#111827">OriginalTweetID</text><text x="516" y="275" font-size="15.5" text-anchor="end" fill="#6B7280">set on a retweet</text><line x1="84" y1="286" x2="526" y2="286" stroke="#93C5FD" stroke-width="1"/><text x="94" y="311" font-size="15.5" fill="#111827">TweetLocation, UserLocation</text><text x="516" y="311" font-size="15.5" text-anchor="end" fill="#6B7280">optional</text><text x="305" y="361" font-size="15.5" text-anchor="middle" fill="#6B7280">about 310 bytes per row</text><g filter="url(#tw1-soft)">
<rect x="760" y="50" width="400" height="214" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="760" y="50" width="6" height="214" fill="#64748B" clip-path="url(#tw1-k2)"/>
</g>
<circle cx="798" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,67.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="824" y="85" font-size="18.5" font-weight="600" fill="#111827">User</text><text x="784" y="131" font-size="15.5" fill="#111827">UserID</text><text x="1136" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">int, primary key</text><line x1="774" y1="142" x2="1146" y2="142" stroke="#94A3B8" stroke-width="1"/><text x="784" y="167" font-size="15.5" fill="#111827">Name</text><text x="1136" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(32)</text><line x1="774" y1="178" x2="1146" y2="178" stroke="#94A3B8" stroke-width="1"/><text x="784" y="203" font-size="15.5" fill="#111827">Email</text><text x="1136" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(32)</text><line x1="774" y1="214" x2="1146" y2="214" stroke="#94A3B8" stroke-width="1"/><text x="784" y="239" font-size="15.5" fill="#111827">CreatedAt</text><text x="1136" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g filter="url(#tw1-soft)">
<rect x="760" y="360" width="400" height="142" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="760" y="360" width="6" height="142" fill="#4F46E5" clip-path="url(#tw1-k3)"/>
</g>
<circle cx="798" cy="388" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,377.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
<text x="824" y="395" font-size="18.5" font-weight="600" fill="#111827">UserFollow</text><text x="784" y="441" font-size="15.5" fill="#111827">UserID1, UserID2</text><text x="1136" y="441" font-size="15.5" text-anchor="end" fill="#6B7280">int, composite key</text><line x1="774" y1="452" x2="1146" y2="452" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="477" font-size="15.5" fill="#111827">(follower, followee)</text><text x="1136" y="477" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes per row</text><g filter="url(#tw1-soft)">
<rect x="760" y="600" width="400" height="142" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<rect x="760" y="600" width="6" height="142" fill="#059669" clip-path="url(#tw1-k4)"/>
</g>
<circle cx="798" cy="628" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,617.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.6 6 .6-4.5 4.1 1.3 5.9-5.3-3.1-5.3 3.1 1.3-5.9L5.5 9.2l6-.6z"/></g>
<text x="824" y="635" font-size="18.5" font-weight="600" fill="#111827">Favorite</text><text x="784" y="681" font-size="15.5" fill="#111827">UserID, TweetID</text><text x="1136" y="681" font-size="15.5" text-anchor="end" fill="#6B7280">composite key</text><line x1="774" y1="692" x2="1146" y2="692" stroke="#6EE7B7" stroke-width="1"/><text x="784" y="717" font-size="15.5" fill="#111827">(user, tweet)</text><text x="1136" y="717" font-size="15.5" text-anchor="end" fill="#6B7280">one billion new rows a day</text><g stroke="#64748B" stroke-width="1.5">
<path d="M 130,480 L 130,574 A 150,16 0 0 0 430,574 L 430,480" fill="#E2E8F0"/>
<ellipse cx="280" cy="480" rx="150" ry="16" fill="#F8FAFC"/>
</g>
<text x="280" y="549" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">File storage</text><text x="280" y="615" font-size="15.5" text-anchor="middle" fill="#6B7280">photos and videos; tweet rows keep only the IDs</text><rect x="40" y="790" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="816" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="838" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">No time column</text><text x="288" y="838" font-size="15.5" fill="#475569">deliberate: step 6 places the epoch time inside the TweetID itself</text><rect x="64" y="860" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/><text x="164" y="882" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Huge row counts</text><text x="288" y="882" font-size="15.5" fill="#475569">a tweet row is about 310 bytes; favorites alone arrive at one billion per day</text>
</svg>