<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="424" viewBox="0 0 1240 424" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three places where checksums are already in use: inside network frames and TCP segments, on every small block written by a distributed file system, and next to a published download file.">
  <rect x="0" y="0" width="1240" height="424" fill="#FFFFFF"/>
  <defs>
    <marker id="ck4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ck4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ck4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ck4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ck4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ck4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ck4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ck4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ck4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Where checksums are already working</text>
  <rect x="24" y="76" width="370" height="282" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="209" y="114" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">In the network</text>
  <rect x="434" y="76" width="370" height="282" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="619" y="114" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">In stored data</text>
  <rect x="844" y="76" width="370" height="282" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="1029" y="114" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">In downloads</text>
  <rect x="50" y="146" width="318" height="52" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/>
  <path d="M150,146 L150,198" fill="none" stroke="#3B82F6" stroke-width="1.6"/>
  <path d="M300,146 L300,198" fill="none" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="100" y="179" font-size="18" fill="#0F172A" text-anchor="middle">header</text>
  <text x="225" y="179" font-size="18" fill="#0F172A" text-anchor="middle">data</text>
  <text x="334" y="179" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">CRC</text>
  <text x="209" y="250" font-size="18" fill="#0F172A" text-anchor="middle">An Ethernet frame and a TCP</text>
  <text x="209" y="278" font-size="18" fill="#0F172A" text-anchor="middle">segment each carry one. A bad</text>
  <text x="209" y="306" font-size="18" fill="#0F172A" text-anchor="middle">segment is dropped and sent again.</text>
  <rect x="460" y="146" width="72" height="48" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="496" y="177" font-size="18" fill="#0F172A" text-anchor="middle">blk 1</text>
  <path d="M487,214 L494,222 L506,206" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <rect x="542" y="146" width="72" height="48" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="578" y="177" font-size="18" fill="#0F172A" text-anchor="middle">blk 2</text>
  <path d="M569,214 L576,222 L588,206" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <rect x="624" y="146" width="72" height="48" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="660" y="177" font-size="18" fill="#0F172A" text-anchor="middle">blk 3</text>
  <path d="M652,206 L668,222 M668,206 L652,222" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <rect x="706" y="146" width="72" height="48" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="742" y="177" font-size="18" fill="#0F172A" text-anchor="middle">blk 4</text>
  <path d="M733,214 L740,222 L752,206" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="619" y="250" font-size="18" fill="#0F172A" text-anchor="middle">One checksum per small block,</text>
  <text x="619" y="278" font-size="18" fill="#0F172A" text-anchor="middle">not one for the whole file. Only</text>
  <text x="619" y="306" font-size="18" fill="#0F172A" text-anchor="middle">the bad block is replaced.</text>
  <rect x="879" y="142" width="300" height="52" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/>
  <text x="1029" y="175" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">release.tar.gz</text>
  <text x="1009" y="216" font-size="18" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">sha256 a1c58d2e...</text>
  <path d="M1150,210 L1157,218 L1169,202" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="1029" y="250" font-size="18" fill="#0F172A" text-anchor="middle">The project publishes the value.</text>
  <text x="1029" y="278" font-size="18" fill="#0F172A" text-anchor="middle">You calculate it yourself and</text>
  <text x="1029" y="306" font-size="18" fill="#0F172A" text-anchor="middle">compare the two.</text>
</svg>