<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Command style fan-out: Checkout calls Notifications, Fulfillment, Analytics and Loyalty directly, and a fifth receiver, Fraud check, added next quarter forces Checkout to change.">
  <defs>
    <marker id="m03-l04-point-to-point-fanout-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l04-point-to-point-fanout-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m03-l04-point-to-point-fanout-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <rect x="40" y="56" width="1160" height="560" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="94" font-size="20" font-weight="600" fill="#334155">Command style: the routing knowledge lives inside Checkout</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M500,250 C500,360 154,380 154,466" marker-end="url(#m03-l04-point-to-point-fanout-bl)"/>
    <path d="M560,250 C560,360 387,380 387,466" marker-end="url(#m03-l04-point-to-point-fanout-bl)"/>
    <path d="M680,250 C680,360 853,380 853,466" marker-end="url(#m03-l04-point-to-point-fanout-bl)"/>
    <path d="M620,250 L620,466" marker-end="url(#m03-l04-point-to-point-fanout-bl)"/>
  </g>
  <path d="M790,190 C900,190 1086,236 1086,466" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#m03-l04-point-to-point-fanout-red)"/>

  <g filter="url(#m03-l04-point-to-point-fanout-soft)">
    <rect x="450" y="150" width="340" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="620" y="226" text-anchor="middle" font-size="20" fill="#64748B">its code names every receiver</text>

  <g filter="url(#m03-l04-point-to-point-fanout-soft)">
    <rect x="45" y="470" width="218" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="154" y="516" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="154" y="546" text-anchor="middle" font-size="20" fill="#64748B">confirmation email</text>
  <g filter="url(#m03-l04-point-to-point-fanout-soft)">
    <rect x="278" y="470" width="218" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="387" y="516" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="387" y="546" text-anchor="middle" font-size="20" fill="#64748B">warehouse</text>
  <g filter="url(#m03-l04-point-to-point-fanout-soft)">
    <rect x="511" y="470" width="218" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="620" y="516" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Analytics</text>
  <text x="620" y="546" text-anchor="middle" font-size="20" fill="#64748B">order analytics</text>
  <g filter="url(#m03-l04-point-to-point-fanout-soft)">
    <rect x="744" y="470" width="218" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="853" y="516" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Loyalty</text>
  <text x="853" y="546" text-anchor="middle" font-size="20" fill="#64748B">points update</text>
  <g filter="url(#m03-l04-point-to-point-fanout-soft)">
    <rect x="977" y="470" width="218" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1086" y="516" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fraud check</text>
  <text x="1086" y="546" text-anchor="middle" font-size="20" fill="#64748B">the fifth call site</text>

  <g font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="826" y="252">added next quarter,</text>
    <text x="826" y="284">so Checkout changes</text>
  </g>

  <line x1="50" y1="670" x2="86" y2="670" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="677" font-size="20" fill="#475569">Point-to-point command: Checkout names each receiver</text>
  <line x1="50" y1="710" x2="86" y2="710" stroke="#DC2626" stroke-width="4"/>
  <text x="98" y="717" font-size="20" fill="#475569">A new receiver next quarter means editing Checkout</text>
