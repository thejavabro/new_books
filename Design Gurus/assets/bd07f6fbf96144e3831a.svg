<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1072" viewBox="0 0 1240 1072" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same six framework steps, with steps two and four drawn wider because the product architecture round asks two more outputs of them: entities with their fields and relationships, and the number of calls one screen makes. The adjusted budget is four, eight, eight, thirteen, eight and four minutes, still totalling forty five.">
