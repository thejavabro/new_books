  <rect x="40" y="932" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="974" text-anchor="middle" font-size="16" fill="#475569">Total: 4 + 8 + 8 + 13 + 8 + 4 = 45 minutes.</text>
  <text x="620" y="1002" text-anchor="middle" font-size="16" fill="#475569">The round is no longer than usual. Steps 2 and 4 take their extra minutes from the other four.</text>
