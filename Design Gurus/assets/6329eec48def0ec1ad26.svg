<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-label="Without an index the database reads every row to find a match. With an index it looks the value up in a sorted structure and jumps straight to the row, at the cost of extra space and slower writes.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="540" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">No index: read every row</text>
  <rect x="40" y="72" width="300" height="38" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="64" y="98" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Ada</text>
  <text x="316" y="98" font-size="20" fill="#FCA5A5" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">read</text>
  <rect x="40" y="118" width="300" height="38" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="64" y="144" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Grace</text>
  <text x="316" y="144" font-size="20" fill="#FCA5A5" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">read</text>
  <rect x="40" y="164" width="300" height="38" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="64" y="190" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Linus</text>
  <text x="316" y="190" font-size="20" fill="#FCA5A5" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">read</text>
  <rect x="40" y="210" width="300" height="38" rx="7" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="64" y="236" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Ken</text>
  <text x="316" y="236" font-size="20" font-weight="600" fill="#065F46" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">found</text>
  <rect x="40" y="256" width="300" height="38" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="64" y="282" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Barbara</text>
  <text x="316" y="282" font-size="20" fill="#FCA5A5" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">read</text>
  <rect x="40" y="302" width="300" height="38" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="64" y="328" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Alan</text>
  <text x="316" y="328" font-size="20" fill="#FCA5A5" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">read</text>
  <text x="40" y="372" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Six rows read to find one.</text>
  <text x="430" y="46" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">With an index on the name column</text>
  <rect x="430" y="72" width="360" height="268" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <rect x="450" y="90" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="472" y="114" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Ada</text>
  <text x="750" y="114" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">row →</text>
  <rect x="450" y="132" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="472" y="156" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Alan</text>
  <text x="750" y="156" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">row →</text>
  <rect x="450" y="174" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="472" y="198" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Barbara</text>
  <text x="750" y="198" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">row →</text>
  <rect x="450" y="216" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="472" y="240" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Grace</text>
  <text x="750" y="240" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">row →</text>
  <rect x="450" y="258" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="472" y="282" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Ken</text>
  <text x="750" y="282" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">row →</text>
  <rect x="450" y="300" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="472" y="324" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Linus</text>
  <text x="750" y="324" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">row →</text>
  <text x="430" y="372" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Sorted, so a lookup takes a few steps.</text>
  <rect x="830" y="72" width="370" height="268" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1015" y="112" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">What it costs</text>
  <text x="858" y="156" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Extra storage for the index</text>
  <text x="858" y="190" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Every write that touches the</text>
  <text x="858" y="224" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">column must update it too</text>
  <text x="858" y="258" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">So: faster reads, slower writes</text>
  <rect x="40" y="420" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="456" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">In an interview, name the column and the query it serves.</text>
  <text x="70" y="488" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">"I would index short_key, because every redirect is a lookup on it" is a complete answer.</text>
</svg>