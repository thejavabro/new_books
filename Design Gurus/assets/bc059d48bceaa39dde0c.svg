<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="limits-title limits-desc">
<title id="limits-title">Reading the documented limits</title>
<desc id="limits-desc">DynamoDB publishes three thousand read units and one thousand write units per partition per second. The ceiling is per key rather than per table, and item size is part of the arithmetic that most designs omit.</desc>
<defs>
<marker id="limits-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="limits-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="limits-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="limits-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="790" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Reading the documented limits</text>
<text x="40" y="86" font-size="21" fill="#4A5568">DynamoDB publishes the numbers directly.</text>
<rect x="40" y="712" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="712" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="130" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V242A6 6 0 0 0 46 248H54Z" fill="#5EC9EC"/><text x="620" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="middle">Every DynamoDB partition is designed to deliver</text>
<rect x="120" y="176" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="360" y="210" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">3,000 read units per second</text>
<rect x="640" y="176" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="880" y="210" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">1,000 write units per second</text>
<rect x="40" y="264" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="264" width="5" height="52" rx="2.5" fill="#39D5AA"/><text x="64" y="296" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">one read unit = one strongly consistent read up to 4 KB; one write unit = one write up to 1 KB</text>
<rect x="40" y="334" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 334H46A6 6 0 0 0 40 340V492A6 6 0 0 0 46 498H54Z" fill="#F28B9D"/><text x="70" y="370" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">The ceiling is per key</text>
<text x="70" y="400" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Provisioning more capacity on the</text><text x="70" y="425" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">table does not raise it, and adaptive</text><text x="70" y="450" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">capacity does not remove the</text><text x="70" y="475" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">per-partition ceiling.</text>
<rect x="640" y="334" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 334H646A6 6 0 0 0 640 340V492A6 6 0 0 0 646 498H654Z" fill="#F3CF6A"/><text x="670" y="370" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Item size is in the arithmetic</text>
<text x="670" y="400" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A 20 KB item costs five read units, so that</text><text x="670" y="425" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">partition serves about 600 reads a second</text><text x="670" y="450" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than 3,000. Ignoring size</text><text x="670" y="475" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">over-estimates headroom.</text>
<rect x="40" y="516" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="516" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="544" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Cassandra states it as partition size instead: keep partitions under about a hundred megabytes</text><text x="64" y="570" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and around a hundred thousand rows, because a partition is the unit of read and repair</text>
<rect x="40" y="602" width="1160" height="84" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="602" width="5" height="84" rx="2.5" fill="#39D5AA"/><text x="64" y="635.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Every partitioned store has a per-partition ceiling.</text><text x="64" y="664.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Find the documented one, and estimate your hottest key against it.</text>
<text x="66" y="746" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This is the estimation module applied to a modeling decision.</text>
</svg>