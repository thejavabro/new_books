<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An ADR has five parts. Title: a number and a short name, here ADR 0007, run Dispatch matching in a separate worker pool. Status: proposed, accepted, deprecated or superseded, here accepted. Context: the problem with numbers, the options and the constraints. Decision: what the team will do, here run the matching loop on three dedicated worker machines. Consequences: benefits, costs and the conditions that reopen the decision.">
  <defs>
    <filter id="mf05c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mf05c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mf05c-k1"><rect x="40" y="160" width="280" height="80" rx="12"/></clipPath>
    <clipPath id="mf05c-k2"><rect x="40" y="260" width="280" height="80" rx="12"/></clipPath>
    <clipPath id="mf05c-k3"><rect x="40" y="360" width="280" height="80" rx="12"/></clipPath>
    <clipPath id="mf05c-k4"><rect x="40" y="460" width="280" height="80" rx="12"/></clipPath>
    <clipPath id="mf05c-k5"><rect x="40" y="560" width="280" height="108" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The anatomy of an architecture decision record</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Five parts, each shown with what it holds and the matching line from ADR 0007.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#mf05c-soft)">
    <rect x="40" y="160" width="280" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="160" width="6" height="80" fill="#64748B" clip-path="url(#mf05c-k1)"/>
  </g>
  <circle cx="78" cy="200" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,189.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="104" y="207" font-size="21.5" font-weight="600" fill="#111827">Title</text>
