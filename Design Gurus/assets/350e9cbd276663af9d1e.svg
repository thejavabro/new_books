  <g filter="url(#mf05c-soft)">
    <rect x="40" y="560" width="280" height="108" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="560" width="6" height="108" fill="#D97706" clip-path="url(#mf05c-k5)"/>
  </g>
  <circle cx="78" cy="614" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,603.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="104" y="621" font-size="21.5" font-weight="600" fill="#111827">Consequences</text>
  <text x="40" y="142" font-size="18.5" font-weight="600" fill="#475569">Part</text>
  <text x="350" y="142" font-size="18.5" font-weight="600" fill="#475569">What it holds, and the example from ADR 0007</text>

  <rect x="350" y="160" width="850" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="374" y="193" font-size="18.5" font-weight="600" fill="#1F2937">A number and a short name for the decision</text>
  <text x="374" y="221" font-size="18.5" fill="#6B7280">ADR 0007: Run Dispatch matching in a separate worker pool</text>
  <rect x="350" y="260" width="850" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="374" y="293" font-size="18.5" font-weight="600" fill="#1F2937">Proposed, Accepted, Deprecated or Superseded</text>
  <text x="374" y="321" font-size="18.5" fill="#6B7280">Accepted</text>
  <rect x="350" y="360" width="850" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="374" y="393" font-size="18.5" font-weight="600" fill="#1F2937">The problem with numbers, the options and the constraints</text>
  <text x="374" y="421" font-size="18.5" fill="#6B7280">p99 reaches 1,200 ms; options scored 200, 375 and 420; 8-week deadline</text>
  <rect x="350" y="460" width="850" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="374" y="493" font-size="18.5" font-weight="600" fill="#1F2937">What the team will do</text>
  <text x="374" y="521" font-size="18.5" fill="#6B7280">Run the matching loop on three dedicated worker machines</text>
  <rect x="350" y="560" width="850" height="108" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="374" y="593" font-size="18.5" font-weight="600" fill="#1F2937">Benefits, costs and the conditions that reopen the decision</text>
  <text x="374" y="621" font-size="18.5" fill="#6B7280">p99 below 500 ms at double load; costs $700 per month; releases stay shared;</text>
  <text x="374" y="649" font-size="18.5" fill="#6B7280">reopen above 30 percent database CPU or more than two delayed releases a month</text>


</svg>