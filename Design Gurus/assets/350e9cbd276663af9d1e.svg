    <rect x="40" y="260" width="280" height="80" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="260" width="6" height="80" fill="#7C3AED" clip-path="url(#mf05c-k2)"/>
  </g>
  <circle cx="78" cy="300" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,289.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="104" y="307" font-size="21.5" font-weight="600" fill="#111827">Status</text>
  <g filter="url(#mf05c-soft)">
    <rect x="40" y="360" width="280" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="360" width="6" height="80" fill="#2563EB" clip-path="url(#mf05c-k3)"/>
  </g>
  <circle cx="78" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,389.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="407" font-size="21.5" font-weight="600" fill="#111827">Context</text>
  <g filter="url(#mf05c-lift)">
    <rect x="40" y="460" width="280" height="80" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="460" width="9" height="80" fill="#059669" clip-path="url(#mf05c-k4)"/>
  </g>
  <circle cx="78" cy="500" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,489.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
