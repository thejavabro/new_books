<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="694" viewBox="0 0 1240 694" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="silent-title silent-desc">
<title id="silent-title">Unspoken reasoning scores nothing</title>
<desc id="silent-desc">Two candidates can reason identically and score differently. The write-up is produced from memory hours later and contains what was said out loud, which makes saying decisions and reversals out loud part of the work rather than a layer on top of it.</desc>
<defs>
<marker id="silent-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="silent-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="silent-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="silent-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="694" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Unspoken reasoning scores nothing</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Two candidates can reason identically and score differently.</text>
<rect x="40" y="616" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="616" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="234" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V346A6 6 0 0 0 46 352H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Thought it, did not say it</text>
<rect x="72" y="174" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">considered three options</text>
<rect x="72" y="226" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="255" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">rejected two for good reasons</text>
<rect x="72" y="278" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">announced the third</text>
<rect x="640" y="118" width="560" height="234" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V346A6 6 0 0 0 646 352H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Said it as it happened</text>
<rect x="672" y="174" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">named all three out loud</text>
<rect x="672" y="226" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="255" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">gave the cost of each</text>
<rect x="672" y="278" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">chose, with the condition</text>
<path d="M320 358V392" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M320 358V392" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#silent-marker-red)"/>
<path d="M920 358V392" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 358V392" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#silent-marker-green)"/>
<rect x="40" y="398" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="432" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads as somebody who had one idea</text>
<rect x="640" y="398" width="560" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="432" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads as somebody who decided</text>
<rect x="40" y="478" width="1160" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="478" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="511" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The interviewer writes a paragraph from memory, hours later.</text><text x="64" y="540" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What goes into it is what you said.</text><text x="64" y="569" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">What is worth saying: the decisions, the reasons, and the moments you change your mind.</text>
<text x="66" y="650" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The same habit is what makes a design review productive and a disagreement resolvable.</text>
</svg>