<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Orchestration: one coordinator issues numbered synchronous commands to Inventory, Payments, and Fulfillment, and records saga state so where every order stands is known">
  <defs>
    <marker id="m03-l05-orchestrator-saga-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m03-l05-orchestrator-saga-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <rect x="40" y="420" width="1160" height="230" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="628" font-size="20" font-weight="600" fill="#334155">Participants stay simple: one step each, no process knowledge</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M550,220 C550,340 260,340 260,462" marker-end="url(#m03-l05-orchestrator-saga-bl)"/>
    <path d="M620,220 L620,462" marker-end="url(#m03-l05-orchestrator-saga-bl)"/>
    <path d="M690,220 C690,340 980,340 980,462" marker-end="url(#m03-l05-orchestrator-saga-bl)"/>
  </g>
  <path d="M830,148 L884,148" fill="none" stroke="#475569" stroke-width="2.5"/>

  <g filter="url(#m03-l05-orchestrator-saga-soft)">
    <rect x="410" y="80" width="420" height="140" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="124" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orchestrator</text>
  <text x="620" y="158" text-anchor="middle" font-size="20" fill="#64748B">owns the flow as explicit logic</text>
  <text x="620" y="190" text-anchor="middle" font-size="20" fill="#64748B">a service or a workflow engine</text>

  <g filter="url(#m03-l05-orchestrator-saga-soft)">
    <path d="M890,104 L890,196 A150,15 0 0 0 1190,196 L1190,104" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="1040" cy="104" rx="150" ry="15" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1040" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Saga state</text>
  <text x="1040" y="184" text-anchor="middle" font-size="20" fill="#64748B">where every order stands</text>
  <text x="1040" y="72" text-anchor="middle" font-size="20" fill="#475569">state saved before each step</text>

  <g filter="url(#m03-l05-orchestrator-saga-soft)">
    <rect x="110" y="462" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="260" y="513" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="260" y="543" text-anchor="middle" font-size="20" fill="#64748B">reserve stock</text>
  <g filter="url(#m03-l05-orchestrator-saga-soft)">
    <rect x="470" y="462" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="620" y="513" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="620" y="543" text-anchor="middle" font-size="20" fill="#64748B">charge the card</text>
  <g filter="url(#m03-l05-orchestrator-saga-soft)">
    <rect x="830" y="462" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="980" y="513" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="980" y="543" text-anchor="middle" font-size="20" fill="#64748B">start packing</text>

  <g font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="462" y="306" text-anchor="end">1. reserve</text>
    <text x="656" y="306">2. charge</text>
    <text x="812" y="306">3. fulfill</text>
  </g>

  <text x="620" y="700" text-anchor="middle" font-size="20" fill="#065F46">One place knows the whole flow, so where order 4711 stands is a query, not an investigation.</text>

  <line x1="50" y1="745" x2="86" y2="745" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="752" font-size="20" fill="#475569">Command: the orchestrator calls each step and waits</text>
  <line x1="50" y1="785" x2="86" y2="785" stroke="#475569" stroke-width="4"/>
  <text x="98" y="792" font-size="20" fill="#475569">Saga state: durable progress, so a restarted orchestrator resumes</text>
</svg>