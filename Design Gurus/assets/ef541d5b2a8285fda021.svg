<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="staleread-title staleread-desc">
<title id="staleread-title">A partitioned leader is still a leader</title>
<desc id="staleread-desc">Leadership is believed rather than known, so a leader cut off from the cluster serves stale reads until its heartbeats fail. Making a read linearizable costs either a round trip to a majority or an assumption about clocks.</desc>
<defs>
<marker id="staleread-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="staleread-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="staleread-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="staleread-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="690" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A partitioned leader is still a leader</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Making a read linearizable costs either a round trip to a majority or an assumption about clocks.</text>
<rect x="40" y="612" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="612" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="370" y="130" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">partition</text>
<path d="M370 142V290" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="40" y="150" width="300" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="190" y="186" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">old leader</text>
<rect x="400" y="150" width="300" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="550" y="186" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">new leader</text>
<rect x="740" y="150" width="460" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="970" y="186" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a majority, with the real log</text>
<rect x="40" y="226" width="300" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">client reads here</text>
<rect x="400" y="226" width="800" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="420" y="249.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the old leader believes it is still the leader</text><text x="420" y="274.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">until its next failed heartbeat round</text>
<text x="40" y="312" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">stale data, and not linearizable</text>
<text x="40" y="352" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Raft's answer has two parts</text>
<rect x="40" y="370" width="560" height="80" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="402.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Commit a no-op entry at the start of the term,</text><text x="320" y="429.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">so the leader knows what is committed</text>
<rect x="640" y="370" width="560" height="80" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="402.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Exchange heartbeats with a majority</text><text x="920" y="429.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">before answering the read</text>
<rect x="40" y="476" width="1160" height="110" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="476" width="5" height="110" rx="2.5" fill="#F3CF6A"/><text x="64" y="508" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A lease read skips the heartbeat round trip</text><text x="64" y="537" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">and pays for it with an assumption about clock drift.</text><text x="64" y="566" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Any system offering a fast local read is making that trade. Ask which one you are getting.</text>
<text x="66" y="646" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Raft gives linearizability on the write path. Reads are a separate decision.</text>
</svg>