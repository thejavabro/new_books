<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1138" viewBox="0 0 1240 1138" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four phases for adding a field that will eventually be required: add it as optional with a default, measure who sends it, warn the remaining callers with a date and examples, and only then require it or move it to the next major version.">
  <defs>
    <marker id="p1f-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p1f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1f-k1"><rect x="76" y="174" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1f-k2"><rect x="76" y="402" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1f-k3"><rect x="76" y="630" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1f-k4"><rect x="76" y="858" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1138" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Optional with a default, then measure, warn, and require</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">four phases, in order</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,314 V354" marker-end="url(#p1f-sl)"/>
    <path d="M620,542 V582" marker-end="url(#p1f-sl)"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2.5">
    <path d="M620,770 V810" marker-end="url(#p1f-sl)"/>
  </g>

  
  <rect x="40" y="126" width="1160" height="184" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Phase 1</text>
  <g filter="url(#p1f-soft)">
    <rect x="76" y="174" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p1f-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">Add it as optional</text>
  <text x="76" y="290" font-size="15.5" fill="#6B7280">Give it a documented default, so old callers stay valid by omitting it</text>

  
  <rect x="40" y="354" width="1160" height="184" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="384" font-size="16.5" font-weight="600" fill="#047857">Phase 2</text>
  <g filter="url(#p1f-soft)">
    <rect x="76" y="402" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="402" width="6" height="90" fill="#059669" clip-path="url(#p1f-k2)"/>
  </g>
  <circle cx="114" cy="447" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,436.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="140" y="454" font-size="18.5" font-weight="600" fill="#111827">Measure</text>
  <text x="76" y="518" font-size="15.5" fill="#6B7280">Record which callers send it and which still depend on the default</text>

  
  <rect x="40" y="582" width="1160" height="184" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="612" font-size="16.5" font-weight="600" fill="#B45309">Phase 3</text>
  <g filter="url(#p1f-soft)">
    <rect x="76" y="630" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="630" width="6" height="90" fill="#D97706" clip-path="url(#p1f-k3)"/>
  </g>
  <circle cx="114" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,664.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="682" font-size="18.5" font-weight="600" fill="#111827">Warn</text>
  <text x="76" y="746" font-size="15.5" fill="#6B7280">Publish the requirement, allowed values, examples, affected operations, and the date</text>

  
  <rect x="40" y="810" width="1160" height="184" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="840" font-size="16.5" font-weight="600" fill="#BE185D">Phase 4</text>
  <g filter="url(#p1f-lift)">
    <rect x="76" y="858" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="76" y="858" width="9" height="90" fill="#DB2777" clip-path="url(#p1f-k4)"/>
  </g>
  <circle cx="114" cy="903" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,892.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="910" font-size="18.5" font-weight="600" fill="#111827">Require</text>
  <text x="76" y="974" font-size="15.5" fill="#6B7280">Require in a new major version, or an explicitly coordinated breaking change</text>

  
  <rect x="40" y="1022" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1067" text-anchor="middle" font-size="16" fill="#475569">Do not retire on "95% of traffic has moved." The remaining 5% may be one critical customer.</text>
</svg>