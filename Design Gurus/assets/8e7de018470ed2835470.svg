<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The counts before anything is chosen">
<defs>
<filter id="tk-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="566" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which 2 numbers appear most often in [1, 3, 5, 12, 11, 12, 11]?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Counting is the easy half, and choosing the top few is the half a heap helps with</text>
<rect x="40" y="106" width="1160" height="312" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One count per distinct value</text>
<rect x="250" y="176" width="132" height="74" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="316" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">value 1</text>
<text x="316" y="236" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">seen 1x</text>
<rect x="402" y="176" width="132" height="74" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="468" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">value 3</text>
<text x="468" y="236" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">seen 1x</text>
<rect x="554" y="176" width="132" height="74" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">value 5</text>
<text x="620" y="236" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">seen 1x</text>
<rect x="706" y="176" width="132" height="74" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="772" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">value 12</text>
<text x="772" y="236" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">seen 2x</text>
<rect x="858" y="176" width="132" height="74" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="924" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">value 11</text>
<text x="924" y="236" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">seen 2x</text>
<text x="226" y="221" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">counts</text>
<text x="454" y="355" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<text x="484" y="354" font-size="18.5" fill="#475569">empty</text>
<rect x="40" y="436" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Keep a heap of 2 numbers with the least frequent of them on top</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">The top is the weakest one kept, so it is the first to be pushed out</text>
</svg>