<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Inside the Dropbox client the watcher monitors the workspace folder and feeds events to the indexer, the chunker exchanges file chunks with cloud storage, and the indexer exchanges metadata updates with the synchronization service backed by the remote metadata DB.">
  <defs>
    <marker id="dbx03-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="dbx03-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="dbx03-pk-rev" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="dbx03-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="dbx03-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>

    <filter id="dbx03-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dbx03-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="dbx03-k1"><rect x="294" y="132" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="dbx03-k2"><rect x="614" y="132" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="dbx03-k3"><rect x="294" y="314" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="dbx03-k4"><rect x="614" y="314" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="dbx03-k5"><rect x="928" y="230" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>

  
  <rect x="270" y="78" width="602" height="374" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="294" y="108" font-size="16.5" font-weight="600" fill="#1D4ED8">Client application</text>

  
  <g fill="none" stroke-width="2">
    
    <path d="M614,177 H596 Q584,177 584,189 V322 Q584,334 596,334 H614" stroke="#2563EB" marker-end="url(#dbx03-bl)"/>
    
    <path d="M614,364 H554" stroke="#2563EB" marker-end="url(#dbx03-bl)"/>
    
    <path d="M294,177 H264 Q252,177 252,189 V387 Q252,399 240,399 H210" stroke="#DB2777" stroke-width="2.5" marker-start="url(#dbx03-pk-rev)" marker-end="url(#dbx03-pk)"/>
    
    <path d="M770,314 V301 Q770,289 782,289 H928" stroke="#059669" marker-end="url(#dbx03-em)"/>
    
    <path d="M1068,230 V58 Q1068,46 1056,46 H712 Q700,46 700,58 V132" stroke="#059669" marker-end="url(#dbx03-em)"/>
    
    <path d="M1068,320 V384" stroke="#7C3AED" marker-end="url(#dbx03-vi)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="553" y="270" fill="#1D4ED8">events</text>
    <text x="168" y="268" fill="#BE185D">data flow:</text>
    <text x="168" y="291" fill="#BE185D">chunks up and down</text>
    <text x="810" y="274" fill="#047857">control flow: metadata updates</text>
    <text x="884" y="32" fill="#047857">changes from other devices</text>
  </g>

  
  <g filter="url(#dbx03-soft)">
    <rect x="294" y="132" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="294" y="132" width="6" height="90" fill="#2563EB" clip-path="url(#dbx03-k1)"/>
  </g>
  <circle cx="332" cy="177" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,166.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="358" y="184" font-size="18.5" font-weight="600" fill="#111827">Chunker</text>
  <text x="424" y="247" font-size="15.5" text-anchor="middle" fill="#6B7280">splits files into 4 MB chunks, rebuilds them</text>

  
  <g filter="url(#dbx03-soft)">
    <rect x="614" y="132" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="614" y="132" width="6" height="90" fill="#2563EB" clip-path="url(#dbx03-k2)"/>
  </g>
  <circle cx="652" cy="177" r="18" fill="#FFFFFF"/>
  <g transform="translate(641.56,166.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="678" y="184" font-size="18.5" font-weight="600" fill="#111827">Watcher</text>
  <text x="724" y="247" font-size="15.5" text-anchor="middle" fill="#6B7280">monitors the workspace folder</text>

  
  <g filter="url(#dbx03-soft)">
    <rect x="294" y="314" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="294" y="314" width="6" height="90" fill="#64748B" clip-path="url(#dbx03-k3)"/>
  </g>
  <circle cx="332" cy="359" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,348.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="358" y="366" font-size="18.5" font-weight="600" fill="#111827">Internal Metadata DB</text>
  <text x="424" y="429" font-size="15.5" text-anchor="middle" fill="#6B7280">files, chunks, versions on this device</text>

  
  <g filter="url(#dbx03-soft)">
    <rect x="614" y="314" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="614" y="314" width="6" height="90" fill="#2563EB" clip-path="url(#dbx03-k4)"/>
  </g>
  <circle cx="652" cy="359" r="18" fill="#FFFFFF"/>
  <g transform="translate(641.56,348.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="678" y="366" font-size="18.5" font-weight="600" fill="#111827">Indexer</text>
  <text x="724" y="429" font-size="15.5" text-anchor="middle" fill="#6B7280">processes events, updates the local DB</text>

  
  <g filter="url(#dbx03-soft)">
    <rect x="928" y="230" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="928" y="230" width="6" height="90" fill="#059669" clip-path="url(#dbx03-k5)"/>
  </g>
  <circle cx="966" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(955.56,264.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 12a8 8 0 1 1-2.3-5.7"/>
    <path d="M20 3v4h-4"/>
  </g>
  <text x="992" y="282" font-size="18.5" font-weight="600" fill="#111827">Synchronization Service</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M40,344 L40,428 A85,16 0 0 0 210,428 L210,344" fill="#FEF3C7"/>
    <ellipse cx="125" cy="344" rx="85" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="125" y="402" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Cloud Storage</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M963,400 L963,484 A105,16 0 0 0 1173,484 L1173,400" fill="#EDE9FE"/>
    <ellipse cx="1068" cy="400" rx="105" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1068" y="455" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Remote Metadata DB</text>

  
  <rect x="40" y="552" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="574" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="596" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Data flow</text>
  <text x="288" y="596" font-size="15.5" fill="#475569">file chunks move between the chunker and cloud storage</text>
  <rect x="64" y="618" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="640" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Control flow</text>
  <text x="288" y="640" font-size="15.5" fill="#475569">metadata and change notifications move through the synchronization service</text>
</svg>