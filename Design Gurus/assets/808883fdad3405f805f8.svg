<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1124" viewBox="0 0 1240 1124" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One request becomes at most four attempts with growing gaps and a random extra delay. After repeated temporary failures the circuit opens and later calls fail fast for a short period, then one test request decides whether normal traffic resumes.">
  <defs>
    <marker id="p1r-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p1r-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="p1r-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p1r-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1r-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1r-k1"><rect x="78" y="110" width="173" height="90" rx="12"/></clipPath>
    <clipPath id="p1r-k2"><rect x="307" y="110" width="173" height="90" rx="12"/></clipPath>
    <clipPath id="p1r-k3"><rect x="592" y="110" width="173" height="90" rx="12"/></clipPath>
    <clipPath id="p1r-k4"><rect x="989" y="110" width="173" height="90" rx="12"/></clipPath>
    <clipPath id="p1r-k5"><rect x="530" y="300" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="p1r-k6"><rect x="140" y="524" width="960" height="90" rx="12"/></clipPath>
    <clipPath id="p1r-k7"><rect x="440" y="690" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1r-k8"><rect x="90" y="860" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p1r-k9"><rect x="770" y="860" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1124" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="378" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#B45309">A bounded retry, at most four attempts</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">the gap grows with every attempt</text>

  
  <g fill="none" stroke-width="2">
    <path d="M251,155 H307" stroke="#D97706" marker-end="url(#p1r-am)"/>
    <path d="M480,155 H592" stroke="#D97706" marker-end="url(#p1r-am)"/>
    <path d="M765,155 H989" stroke="#D97706" marker-end="url(#p1r-am)"/>
    <path d="M1075.5,200 V246 Q1075.5,258 1063.5,258 H632 Q620,258 620,270 V300" stroke="#DB2777" marker-end="url(#p1r-pm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="279" y="232" fill="#B45309">~1s + jitter</text>
    <text x="536" y="232" fill="#B45309">~2s + jitter</text>
    <text x="877" y="232" fill="#B45309">~4s + jitter</text>
  </g>
  
  <g filter="url(#p1r-soft)">
    <rect x="78" y="110" width="173" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="78" y="110" width="6" height="90" fill="#D97706" clip-path="url(#p1r-k1)"/>
  </g>
  <circle cx="116" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(105.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="142" y="162" font-size="18.5" font-weight="600" fill="#111827">Attempt 1</text>

  
  <g filter="url(#p1r-soft)">
    <rect x="307" y="110" width="173" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="307" y="110" width="6" height="90" fill="#D97706" clip-path="url(#p1r-k2)"/>
  </g>
  <circle cx="345" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(334.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="371" y="162" font-size="18.5" font-weight="600" fill="#111827">Attempt 2</text>

  
  <g filter="url(#p1r-soft)">
    <rect x="592" y="110" width="173" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="592" y="110" width="6" height="90" fill="#D97706" clip-path="url(#p1r-k3)"/>
  </g>
  <circle cx="630" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(619.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="656" y="162" font-size="18.5" font-weight="600" fill="#111827">Attempt 3</text>

  
  <g filter="url(#p1r-lift)">
    <rect x="989" y="110" width="173" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="989" y="110" width="9" height="90" fill="#D97706" clip-path="url(#p1r-k4)"/>
  </g>
  <circle cx="1027" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(1016.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="1053" y="162" font-size="18.5" font-weight="600" fill="#111827">Attempt 4</text>

  
  <g filter="url(#p1r-soft)">
    <rect x="530" y="300" width="180" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="530" y="300" width="6" height="90" fill="#DB2777" clip-path="url(#p1r-k5)"/>
  </g>
  <circle cx="568" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(557.56,334.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="594" y="352" font-size="18.5" font-weight="600" fill="#111827">Give up</text>

  
  <rect x="40" y="462" width="1160" height="516" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="492" font-size="16.5" font-weight="600" fill="#BE185D">Then a circuit breaker</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,390 V524" stroke="#DB2777" stroke-width="2.5" marker-end="url(#p1r-pm)"/>
    <path d="M200,614 V654 Q200,666 212,666 H608 Q620,666 620,678 V690" stroke="#D97706" marker-end="url(#p1r-am)"/>
    <path d="M440,735 H292 Q280,735 280,747 V860" stroke="#DB2777" marker-end="url(#p1r-pm)"/>
    <path d="M800,735 H948 Q960,735 960,747 V860" stroke="#059669" stroke-width="2.5" marker-end="url(#p1r-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="638" y="446" fill="#BE185D">repeated temporary failures</text>
  </g>

  
  <g filter="url(#p1r-lift)">
    <rect x="140" y="524" width="960" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="140" y="524" width="9" height="90" fill="#DB2777" clip-path="url(#p1r-k6)"/>
  </g>
  <circle cx="178" cy="569" r="18" fill="#FFFFFF"/>
  <g transform="translate(167.56,558.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="204" y="576" font-size="18.5" font-weight="600" fill="#111827">Circuit open</text>
  <text x="620" y="639" font-size="15.5" text-anchor="middle" fill="#6B7280">Later calls fail fast for a short period instead of waiting through the same timeout.</text>

  
  <g filter="url(#p1r-soft)">
    <rect x="440" y="690" width="360" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="440" y="690" width="6" height="90" fill="#D97706" clip-path="url(#p1r-k7)"/>
  </g>
  <circle cx="478" cy="735" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,724.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="504" y="742" font-size="18.5" font-weight="600" fill="#111827">One test request</text>

  
  <g filter="url(#p1r-soft)">
    <rect x="90" y="860" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="90" y="860" width="6" height="90" fill="#DB2777" clip-path="url(#p1r-k8)"/>
  </g>
  <circle cx="128" cy="905" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,894.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="154" y="912" font-size="18.5" font-weight="600" fill="#111827">Still failing, stay open</text>

  
  <g filter="url(#p1r-lift)">
    <rect x="770" y="860" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="770" y="860" width="9" height="90" fill="#059669" clip-path="url(#p1r-k9)"/>
  </g>
  <circle cx="808" cy="905" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,894.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="834" y="912" font-size="18.5" font-weight="600" fill="#111827">Recovered, resume traffic</text>

  
  <rect x="40" y="1008" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1053" text-anchor="middle" font-size="16" fill="#475569">The accepted cost is refusing some calls while the dependency may already be recovering.</text>
</svg>