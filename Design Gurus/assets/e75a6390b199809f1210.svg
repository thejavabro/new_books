<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A distributed monolith: a synchronous chain from service A to D where each hop waits for the next, plus a shared database that all four services read and write">
  <defs>
    <marker id="m02-l05-service-chain-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m02-l05-service-chain-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m02-l05-service-chain-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>

  <rect x="55" y="70" width="1130" height="165" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="77" y="108" font-size="20" font-weight="600" fill="#1E3A8A">Synchronous chain: every request flows A to B to C to D</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M285,170 L371,170" marker-end="url(#m02-l05-service-chain-blue)"/>
    <path d="M575,170 L661,170" marker-end="url(#m02-l05-service-chain-blue)"/>
    <path d="M865,170 L951,170" marker-end="url(#m02-l05-service-chain-blue)"/>
  </g>
  <g font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="328" y="152">waits</text>
    <text x="618" y="152">waits</text>
    <text x="908" y="152">waits</text>
  </g>

  <g fill="none" stroke="#DC2626" stroke-width="2.5">
    <path d="M185,210 C185,300 400,300 500,358" marker-end="url(#m02-l05-service-chain-red)"/>
    <path d="M475,210 C475,290 520,300 560,358" marker-end="url(#m02-l05-service-chain-red)"/>
    <path d="M765,210 C765,290 720,300 680,358" marker-end="url(#m02-l05-service-chain-red)"/>
    <path d="M1055,210 C1055,300 840,300 740,358" marker-end="url(#m02-l05-service-chain-red)"/>
  </g>
  <text x="620" y="322" font-size="20" text-anchor="middle" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reads &amp; writes</text>

  <g filter="url(#m02-l05-service-chain-soft)">
    <rect x="85" y="120" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="185" y="158" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service A</text>
  <text x="185" y="190" text-anchor="middle" font-size="20" fill="#64748B">99.9% available</text>

  <g filter="url(#m02-l05-service-chain-soft)">
    <rect x="375" y="120" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="475" y="158" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service B</text>
  <text x="475" y="190" text-anchor="middle" font-size="20" fill="#64748B">99.9% available</text>

  <g filter="url(#m02-l05-service-chain-soft)">
    <rect x="665" y="120" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="765" y="158" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service C</text>
  <text x="765" y="190" text-anchor="middle" font-size="20" fill="#64748B">99.9% available</text>

  <g filter="url(#m02-l05-service-chain-soft)">
    <rect x="955" y="120" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="1055" y="158" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service D</text>
  <text x="1055" y="190" text-anchor="middle" font-size="20" fill="#64748B">99.9% available</text>

  <text x="620" y="272" font-size="20" text-anchor="middle" fill="#B91C1C">Four services at 99.9% each: the chain delivers 99.6%</text>

  <g filter="url(#m02-l05-service-chain-soft)">
    <path d="M470,380 L470,470 A150,20 0 0 0 770,470 L770,380" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <ellipse cx="620" cy="380" rx="150" ry="20" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="620" y="425" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shared database</text>
  <text x="620" y="457" text-anchor="middle" font-size="20" fill="#64748B">four services, one schema</text>

  <g stroke-width="4">
    <line x1="40" y1="555" x2="74" y2="555" stroke="#3B82F6"/>
    <line x1="40" y1="595" x2="74" y2="595" stroke="#DC2626"/>
  </g>
  <text x="84" y="562" font-size="20" fill="#475569">Synchronous call chain: each hop waits for the next</text>
  <text x="84" y="602" font-size="20" fill="#475569">Shared-database coupling: all four read and write the same tables</text>
</svg>