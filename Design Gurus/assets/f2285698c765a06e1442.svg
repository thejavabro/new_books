<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1520" viewBox="0 0 1240 1520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Gmail high level design: an API gateway routes to a mail reception service, a mail sending service and mail access services, reception also feeds spam filtering and notifications, and all three services use a metadata store, blob storage and a search index">
  <defs>
    <filter id="gm1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="gm1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="gm1-k1"><rect x="40" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="gm1-k2"><rect x="460" y="150" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="gm1-k3"><rect x="64" y="440" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="gm1-k4"><rect x="460" y="440" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="gm1-k5"><rect x="856" y="440" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="gm1-k6"><rect x="64" y="700" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="gm1-k7"><rect x="460" y="700" width="320" height="90" rx="12"/></clipPath>
    <marker id="gm1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="gm1-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="gm1-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="gm1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Gmail: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three services split by what they do with mail: take it in, send it out, and hand it to a reader. Each store holds a different part of a message.</text>

  <rect x="40" y="380" width="1160" height="226" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#1D4ED8">Services, split by what they do with a message</text>
  <rect x="40" y="900" width="1160" height="296" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="930" font-size="19.5" font-weight="600" fill="#475569">One message, three stores</text>

  <g fill="none" stroke-width="2">
    <path d="M280,195 H452" stroke="#2563EB" marker-end="url(#gm1-m-blue)"/>
    <path d="M620,312 V374" stroke="#2563EB" stroke-width="2.5" marker-end="url(#gm1-m-blue)"/>
    <path d="M224,606 V694" stroke="#DB2777" marker-end="url(#gm1-m-pink)"/>
    <path d="M320,606 V660 Q320,672 332,672 H608 Q620,672 620,684 V694" stroke="#7C3AED" marker-end="url(#gm1-m-violet)"/>
    <path d="M900,606 V894" stroke="#64748B" stroke-width="2.5" marker-end="url(#gm1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="366" y="183" fill="#1D4ED8">HTTPS</text>
    <text x="800" y="345" fill="#1D4ED8">routes by what is being asked</text>
    <text x="150" y="654" fill="#BE185D">score it</text>
    <text x="470" y="662" fill="#5B21B6">tell the reader</text>
    <text x="1030" y="660" fill="#475569">read and write</text>
  </g>

  <g filter="url(#gm1-soft)">
    <rect x="40" y="150" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#gm1-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web, mobile, IMAP</text>
  <g filter="url(#gm1-lift)">
    <rect x="460" y="150" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="460" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#gm1-k2)"/>
  </g>
  <circle cx="498" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="524" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="620" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">auth and rate limits</text>
  <g filter="url(#gm1-soft)">
    <rect x="64" y="440" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#gm1-k3)"/>
  </g>
  <circle cx="102" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="128" y="492" font-size="21.5" font-weight="600" fill="#111827">Mail Reception</text>
  <text x="224" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">inbound SMTP servers</text>
  <g filter="url(#gm1-soft)">
    <rect x="460" y="440" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="460" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#gm1-k4)"/>
  </g>
  <circle cx="498" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="524" y="492" font-size="21.5" font-weight="600" fill="#111827">Mail Sending</text>
  <text x="620" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">outbound SMTP</text>
  <g filter="url(#gm1-soft)">
    <rect x="856" y="440" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="856" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#gm1-k5)"/>
  </g>
  <circle cx="894" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(883.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="920" y="492" font-size="21.5" font-weight="600" fill="#111827">Mail Access</text>
  <text x="1016" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">IMAP, POP3 and web APIs</text>
  <g filter="url(#gm1-soft)">
    <rect x="64" y="700" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="700" width="6" height="90" fill="#DB2777" clip-path="url(#gm1-k6)"/>
  </g>
  <circle cx="102" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,734.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="128" y="752" font-size="21.5" font-weight="600" fill="#111827">Spam Filtering</text>
  <text x="224" y="819" font-size="18.5" text-anchor="middle" fill="#6B7280">scores every inbound message</text>
  <g filter="url(#gm1-soft)">
    <rect x="460" y="700" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="460" y="700" width="6" height="90" fill="#7C3AED" clip-path="url(#gm1-k7)"/>
  </g>
  <circle cx="498" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,734.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="524" y="752" font-size="21.5" font-weight="600" fill="#111827">Notification</text>
  <text x="620" y="819" font-size="18.5" text-anchor="middle" fill="#6B7280">tells the client mail arrived</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M64,990 L64,1064 A160,16 0 0 0 384,1064 L384,990" fill="#E0E7FF"/>
    <ellipse cx="224" cy="990" rx="160" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="224" y="1042" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Metadata</text>
  <text x="224" y="1114" font-size="18.5" text-anchor="middle" fill="#6B7280">to, from, subject, flags</text>
  <text x="224" y="1141" font-size="18.5" text-anchor="middle" fill="#94A3B8">what a mailbox listing reads</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M460,990 L460,1064 A160,16 0 0 0 780,1064 L780,990" fill="#E2E8F0"/>
    <ellipse cx="620" cy="990" rx="160" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="620" y="1042" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Blob storage</text>
  <text x="620" y="1114" font-size="18.5" text-anchor="middle" fill="#6B7280">bodies and attachments</text>
  <text x="620" y="1141" font-size="18.5" text-anchor="middle" fill="#94A3B8">big, immutable, cheap</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M856,990 L856,1064 A160,16 0 0 0 1176,1064 L1176,990" fill="#D1FAE5"/>
    <ellipse cx="1016" cy="990" rx="160" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="1016" y="1042" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Search index</text>
  <text x="1016" y="1114" font-size="18.5" text-anchor="middle" fill="#6B7280">Elasticsearch</text>
  <text x="1016" y="1141" font-size="18.5" text-anchor="middle" fill="#94A3B8">the only thing that can find a mail</text>

  <rect x="40" y="1240" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1265" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="1290" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Split the message up</text>
  <text x="323" y="1290" font-size="18.5" fill="#475569">headers are small and queried constantly, bodies are large and read once</text>
  <rect x="64" y="1315" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1340" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Inbound is the risky path</text>
  <text x="323" y="1340" font-size="18.5" fill="#475569">anyone on the internet can send you mail, which is why spam scoring sits here</text>
  <rect x="64" y="1365" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="1390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Search is its own store</text>
  <text x="323" y="1390" font-size="18.5" fill="#475569">no metadata table can answer "find the invoice from March", only an index can</text>
</svg>