<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="synccommit-title synccommit-desc">
<title id="synccommit-title">synchronous_commit is a dial</title>
<desc id="synccommit-desc">The journey of a write from the client to the standby applying it, with the point at which each synchronous_commit setting returns to the client and what each setting can still lose.</desc>
<defs>
<marker id="synccommit-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="synccommit-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="synccommit-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="synccommit-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="664" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">synchronous_commit is a dial</text>
<text x="40" y="86" font-size="21" fill="#4A5568">"Synchronous replication" sounds like one setting.</text>
<rect x="40" y="586" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="586" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Commit returns here</text>
<path d="M292 218V250" fill="none" stroke="#F28B9D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="197" y="168" width="190" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="292" y="197" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">off</text>
<path d="M494 218V250" fill="none" stroke="#F3CF6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="399" y="168" width="190" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="494" y="197" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">local</text>
<path d="M696 218V250" fill="none" stroke="#F3CF6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="601" y="168" width="190" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="696" y="197" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">remote_write</text>
<path d="M898 218V250" fill="none" stroke="#39D5AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="803" y="168" width="190" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="898" y="197" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">on  (default)</text>
<path d="M1100 218V250" fill="none" stroke="#39D5AA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="1005" y="168" width="190" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1100" y="197" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">remote_apply</text>
<path d="M90 268H1100" fill="none" stroke="#284E65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90" cy="268" r="13" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="3"/>
<text x="90" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Client</text><text x="90" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">sends</text>
<circle cx="292" cy="268" r="13" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="3"/>
<text x="292" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Primary</text><text x="292" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">WAL buffer</text>
<circle cx="494" cy="268" r="13" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="3"/>
<text x="494" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Primary</text><text x="494" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">disk</text>
<circle cx="696" cy="268" r="13" fill="#E8FCF3" stroke="#39D5AA" stroke-width="3"/>
<text x="696" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Standby</text><text x="696" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">received</text>
<circle cx="898" cy="268" r="13" fill="#E8FCF3" stroke="#39D5AA" stroke-width="3"/>
<text x="898" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Standby</text><text x="898" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">disk</text>
<circle cx="1100" cy="268" r="13" fill="#E8FCF3" stroke="#39D5AA" stroke-width="3"/>
<text x="1100" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Standby</text><text x="1100" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">applied</text>
<text x="40" y="386" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What you can still lose</text>
<rect x="197" y="404" width="190" height="70" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="292" y="432" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">a crash loses</text><text x="292" y="458" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">recent commits</text>
<rect x="399" y="404" width="190" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="494" y="432" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">losing the primary</text><text x="494" y="458" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">loses them</text>
<rect x="601" y="404" width="190" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="696" y="432" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">a standby crash</text><text x="696" y="458" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">can lose them</text>
<rect x="803" y="404" width="190" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="898" y="432" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">safe against</text><text x="898" y="458" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">one machine</text>
<rect x="1005" y="404" width="190" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1100" y="432" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">readable on the</text><text x="1100" y="458" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">standby at once</text>
<rect x="40" y="498" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="498" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="535" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Durability increases left to right, and so does the latency of every commit.</text>
<text x="66" y="620" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Set it per transaction. The ledger can wait for a standby while the rest of the application does not.</text>
</svg>