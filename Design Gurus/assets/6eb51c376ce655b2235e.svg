<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Store content once; store membership separately</title><desc id="desc">Store content once; store membership separately. A post can appear in several local lists. Removing a list membership does not necessarily delete the post.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="800" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Store content once; store membership separately</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">A post can appear in several local lists.</tspan></text><rect x="300" y="160" width="600" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="322" y="202" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="322" dy="0">Post P17</tspan></text><text x="322" y="250" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="322" dy="0">One account-scoped content record and</tspan><tspan x="322" dy="32">revision.</tspan></text><path d="M600 318 V345 H223 V375" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="380" width="346" height="220" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="422" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Home feed</tspan></text><text x="72" y="470" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Membership: P17</tspan><tspan x="72" dy="32">Position in this query</tspan></text><path d="M600 318 V345 H600 V375" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="427" y="380" width="346" height="220" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="449" y="422" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="449" dy="0">Saved list</tspan></text><text x="449" y="470" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="449" dy="0">Membership: P17</tspan><tspan x="449" dy="32">Saved-list position</tspan></text><path d="M600 318 V345 H977 V375" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="804" y="380" width="346" height="220" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="826" y="422" font-size="25" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="826" dy="0">Search results</tspan></text><text x="826" y="470" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="826" dy="0">Membership: P17</tspan><tspan x="826" dy="32">Search-query context</tspan></text><rect x="50" y="650" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="696" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Removing a list membership does not necessarily delete the post.</tspan></text></g></svg>