<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1050" viewBox="0 0 1240 1050" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One failure moment, two outcomes. Without jitter every client waits exactly 200 ms, so all the retries land in one spike and the service falls over again. With jitter each client waits a random 0 to 200 ms, so the retries arrive spread out under what the service can absorb and it recovers.">
  <defs>
    <marker id="m04-l03-jitter-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l03-jitter-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m04-l03-jitter-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1050" fill="#FFFFFF"/>

  <g filter="url(#m04-l03-jitter-soft)">
    <rect x="380" y="50" width="480" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="620" y="96" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service restarts</text>
  <text x="620" y="128" text-anchor="middle" font-size="20" fill="#64748B">all clients fail at the same instant</text>

  <rect x="60" y="230" width="545" height="640" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="635" y="230" width="545" height="640" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="82" y="275" font-size="20" font-weight="600" fill="#B91C1C">Backoff without jitter</text>
  <text x="657" y="275" font-size="20" font-weight="600" fill="#065F46">Backoff with jitter</text>

  <g fill="none" stroke-width="2.5">
    <path d="M500,160 C500,220 332,215 332,292" stroke="#DC2626" marker-end="url(#m04-l03-jitter-rd)"/>
    <path d="M740,160 C740,220 907,215 907,292" stroke="#059669" marker-end="url(#m04-l03-jitter-em)"/>
    <path d="M332,410 L332,442" stroke="#DC2626" marker-end="url(#m04-l03-jitter-rd)"/>
    <path d="M907,410 L907,442" stroke="#059669" marker-end="url(#m04-l03-jitter-em)"/>
    <path d="M332,680 L332,712" stroke="#DC2626" marker-end="url(#m04-l03-jitter-rd)"/>
    <path d="M907,680 L907,712" stroke="#059669" marker-end="url(#m04-l03-jitter-em)"/>
  </g>

  <g filter="url(#m04-l03-jitter-soft)">
    <rect x="110" y="300" width="445" height="110" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="332.5" y="346" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">No jitter</text>
  <text x="332.5" y="378" text-anchor="middle" font-size="20" fill="#64748B">every client waits exactly 200 ms</text>
  <g filter="url(#m04-l03-jitter-soft)">
    <rect x="685" y="300" width="445" height="110" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="907.5" y="346" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">With jitter</text>
  <text x="907.5" y="378" text-anchor="middle" font-size="20" fill="#64748B">each client waits a random 0 to 200 ms</text>

  <rect x="110" y="450" width="445" height="230" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="130" y="487" font-size="20" fill="#475569">Retry arrivals</text>
  <text x="535" y="487" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">all at once</text>
  <rect x="484" y="498" width="32" height="122" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="130" y="552" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">what the service can absorb</text>
  <line x1="130" y1="562" x2="535" y2="562" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g stroke="#94A3B8" stroke-width="1.5">
    <line x1="130" y1="620" x2="535" y2="620"/>
    <line x1="150" y1="620" x2="150" y2="628"/>
    <line x1="500" y1="620" x2="500" y2="628"/>
  </g>
  <text x="150" y="656" text-anchor="middle" font-size="20" fill="#64748B">0 ms</text>
  <text x="500" y="656" text-anchor="middle" font-size="20" fill="#64748B">200 ms</text>

  <rect x="685" y="450" width="445" height="230" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="705" y="487" font-size="20" fill="#475569">Retry arrivals</text>
  <text x="1110" y="487" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">spread across the window</text>
  <text x="705" y="552" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">what the service can absorb</text>
  <line x1="705" y1="562" x2="1110" y2="562" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g fill="#D1FAE5" stroke="#059669" stroke-width="1.5">
    <rect x="744" y="575" width="20" height="45" rx="2"/>
    <rect x="781" y="584" width="20" height="36" rx="2"/>
    <rect x="818" y="572" width="20" height="48" rx="2"/>
    <rect x="859" y="580" width="20" height="40" rx="2"/>
    <rect x="900" y="572" width="20" height="48" rx="2"/>
    <rect x="941" y="584" width="20" height="36" rx="2"/>
    <rect x="982" y="575" width="20" height="45" rx="2"/>
    <rect x="1022" y="580" width="20" height="40" rx="2"/>
    <rect x="1060" y="584" width="20" height="36" rx="2"/>
  </g>
  <g stroke="#94A3B8" stroke-width="1.5">
    <line x1="705" y1="620" x2="1110" y2="620"/>
    <line x1="725" y1="620" x2="725" y2="628"/>
    <line x1="1075" y1="620" x2="1075" y2="628"/>
  </g>
  <text x="725" y="656" text-anchor="middle" font-size="20" fill="#64748B">0 ms</text>
  <text x="1075" y="656" text-anchor="middle" font-size="20" fill="#64748B">200 ms</text>

  <g filter="url(#m04-l03-jitter-soft)">
    <rect x="110" y="720" width="445" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="332.5" y="766" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">All retries land in one spike</text>
  <text x="332.5" y="798" text-anchor="middle" font-size="20" fill="#64748B">the service falls over again</text>
  <g filter="url(#m04-l03-jitter-soft)">
    <rect x="685" y="720" width="445" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="907.5" y="766" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Retries arrive spread out</text>
  <text x="907.5" y="798" text-anchor="middle" font-size="20" fill="#64748B">the service recovers</text>

  <text x="583" y="858" text-anchor="end" font-size="20" fill="#64748B">backoff alone is half a fix</text>
  <text x="1158" y="858" text-anchor="end" font-size="20" fill="#64748B">the wave spreads into a drizzle</text>

  <line x1="60" y1="920" x2="96" y2="920" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="927" font-size="20" fill="#475569">No jitter: the retries synchronize into one spike</text>
  <line x1="60" y1="960" x2="96" y2="960" stroke="#059669" stroke-width="4"/>
  <text x="108" y="967" font-size="20" fill="#475569">With jitter: randomized waits spread the arrivals out</text>
  <line x1="60" y1="1000" x2="96" y2="1000" stroke="#94A3B8" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1007" font-size="20" fill="#475569">What the service can absorb</text>
</svg>