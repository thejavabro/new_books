<svg xmlns="http://www.w3.org/2000/svg" width="851" height="295" viewBox="5 -8 851 295" font-family="Helvetica, Arial, sans-serif">
<rect x="5" y="-8" width="851" height="295" fill="#ffffff"/>
<text x="13" y="12" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#666666">Encapsulation: the same data, open and then closed</text>

<rect x="30" y="40" width="300" height="102" fill="#fcfcfc" stroke="#c8c8c8" stroke-width="1"/>
<rect x="30" y="40" width="300" height="26" fill="#f5f5f5" stroke="#c8c8c8" stroke-width="1"/>
<text x="180" y="57" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#adadad" text-anchor="middle">OpenAccount</text>
<text x="38" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#adadad">+ account_id: string</text>
<text x="38" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#adadad">+ owner: string</text>
<text x="38" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#adadad">+ balance_cents: int</text>
<line x1="30" y1="130" x2="330" y2="130" stroke="#c8c8c8" stroke-width="1"/>
<rect x="463" y="43" width="330" height="154" fill="#000000" opacity="0.14" rx="1"/>
<rect x="460" y="40" width="330" height="154" fill="#f8fcf7" stroke="#82b366" stroke-width="1"/>
<rect x="460" y="40" width="330" height="26" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="625" y="57" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Account</text>
<text x="468" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">- account_id: string</text>
<text x="468" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">- owner: string</text>
<text x="468" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">- balance_cents: int</text>
<line x1="460" y1="130" x2="790" y2="130" stroke="#82b366" stroke-width="1"/>
<text x="468" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ deposit(): string</text>
<text x="468" y="166" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ withdraw(): string</text>
<text x="468" y="184" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ get_balance_cents(): int</text>
<text x="30" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">Any code anywhere can write balance_cents.</text>
<text x="30" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">There is no one place to fix when the rule changes.</text>
<text x="460" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">balance_cents is private. Every change goes through</text>
<text x="460" y="254" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">deposit or withdraw, and both check the amount first.</text>
</svg>