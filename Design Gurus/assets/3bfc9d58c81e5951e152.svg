<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The failing answer, one service per noun: placing one order needs five synchronous hops across User, Product, Inventory, Order and Payment services, and a failure anywhere in the chain kills the sale">
  <defs>
    <marker id="m02-l06-order-across-services-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m02-l06-order-across-services-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="430" fill="#FFFFFF"/>

  <rect x="250" y="70" width="985" height="230" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="272" y="105" font-size="20" font-weight="600" fill="#B91C1C">The failing answer: one service per noun</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M230,180 L266,180" marker-end="url(#m02-l06-order-across-services-blue)"/>
    <path d="M425,180 L461,180" marker-end="url(#m02-l06-order-across-services-blue)"/>
    <path d="M620,180 L656,180" marker-end="url(#m02-l06-order-across-services-blue)"/>
    <path d="M815,180 L851,180" marker-end="url(#m02-l06-order-across-services-blue)"/>
    <path d="M1010,180 L1046,180" marker-end="url(#m02-l06-order-across-services-blue)"/>
  </g>

  <g filter="url(#m02-l06-order-across-services-soft)">
    <rect x="20" y="140" width="210" height="80" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="125" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Place one order</text>

  <g filter="url(#m02-l06-order-across-services-soft)">
    <rect x="270" y="140" width="155" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="347" y="173" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User</text>
  <text x="347" y="201" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>
  <text x="347" y="250" text-anchor="middle" font-size="20" fill="#64748B">validate user</text>
  <g filter="url(#m02-l06-order-across-services-soft)">
    <rect x="465" y="140" width="155" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="542" y="173" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Product</text>
  <text x="542" y="201" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>
  <text x="542" y="250" text-anchor="middle" font-size="20" fill="#64748B">fetch product</text>
  <text x="542" y="280" text-anchor="middle" font-size="20" fill="#B91C1C">becomes a god object</text>
  <g filter="url(#m02-l06-order-across-services-soft)">
    <rect x="660" y="140" width="155" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="737" y="173" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="737" y="201" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>
  <text x="737" y="250" text-anchor="middle" font-size="20" fill="#64748B">check stock</text>
  <g filter="url(#m02-l06-order-across-services-soft)">
    <rect x="855" y="140" width="155" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="932" y="173" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order</text>
  <text x="932" y="201" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>
  <text x="932" y="250" text-anchor="middle" font-size="20" fill="#64748B">create order</text>
  <g filter="url(#m02-l06-order-across-services-soft)">
    <rect x="1050" y="140" width="155" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1127" y="173" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment</text>
  <text x="1127" y="201" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>
  <text x="1127" y="250" text-anchor="middle" font-size="20" fill="#64748B">charge card</text>

  
  <g font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="248" y="132">hop 1</text>
    <text x="443" y="132">hop 2</text>
    <text x="638" y="132">hop 3</text>
    <text x="833" y="132">hop 4</text>
    <text x="1028" y="132">hop 5</text>
  </g>

  <line x1="40" y1="350" x2="74" y2="350" stroke="#3B82F6" stroke-width="4"/>
  <text x="84" y="357" font-size="20" fill="#475569">Synchronous call: the caller stops and waits</text>
  <text x="84" y="397" font-size="20" fill="#475569">Noun-based split: a failure anywhere in the chain kills the sale</text>
</svg>