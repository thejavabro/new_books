<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="632" viewBox="0 0 1240 632" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A hash ring. Four machines sit at positions five, thirty, fifty-five and eighty. Four keys sit at positions twelve, forty, sixty-two and ninety. Each key belongs to the first machine found by moving clockwise from the key.">
