<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="754" viewBox="0 0 1240 754" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sizing-title sizing-desc">
<title id="sizing-title">Sizing the split against the team</title>
<desc id="sizing-desc">Services divided by engineers gives a number, and below roughly one engineer per service the team cannot operate what it built. The per-service overhead is roughly constant, which hits small teams hardest.</desc>
<defs>
<marker id="sizing-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sizing-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sizing-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sizing-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="754" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Sizing the split against the team</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Services divided by engineers gives a number.</text>
<rect x="40" y="676" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="676" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="82" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="82" rx="2.5" fill="#AC8BE8"/><text x="64" y="152" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Every service needs somebody who can debug it at an inconvenient hour.</text><text x="64" y="178" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Divide services by engineers. Below roughly one each, the team cannot operate it.</text>
<text x="40" y="234" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Which is arithmetic, available before any of the work starts</text>
<rect x="40" y="252" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="286" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">4 engineers</text>
<path d="M526 280H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 280H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sizing-marker-green)"/>
<rect x="570" y="252" width="630" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="885" y="286" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one or two services</text>
<rect x="40" y="318" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="352" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">8 engineers</text>
<path d="M526 346H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 346H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sizing-marker-green)"/>
<rect x="570" y="318" width="630" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="885" y="352" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a handful, not a dozen</text>
<rect x="40" y="384" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="418" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">8 engineers, 15 services</text>
<path d="M526 412H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 412H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sizing-marker-red)"/>
<rect x="570" y="384" width="630" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="885" y="418" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cannot be staffed</text>
<text x="40" y="478" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The follow-on cost, which is roughly constant per service</text>
<rect x="40" y="496" width="275" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="177.5" y="538" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">its own pipeline</text>
<rect x="335" y="496" width="275" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="472.5" y="524.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">its own monitoring</text><text x="472.5" y="551.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and alerts</text>
<rect x="630" y="496" width="275" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="767.5" y="524.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">its own dependency</text><text x="767.5" y="551.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">upgrades</text>
<rect x="925" y="496" width="275" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1062.5" y="524.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">its own runbook</text><text x="1062.5" y="551.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and rotation</text>
<rect x="40" y="590" width="1160" height="60" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="590" width="5" height="60" rx="2.5" fill="#F28B9D"/><text x="64" y="626" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Constant per service means the small team can least afford many of them.</text>
<text x="66" y="710" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Teams routinely plan decompositions implying an operational load they could not staff.</text>
</svg>