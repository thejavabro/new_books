<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="452" viewBox="0 0 1240 452" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="PACELC asks one question about every request. If there is a network partition, the system trades off between availability and consistency, and this case is rare. Else, when the network is healthy, the system trades off between latency and consistency, and this case covers almost all of the time.">
  <rect x="0" y="0" width="1240" height="452" fill="#FFFFFF"/>
  <defs>
    <marker id="pc1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="pc1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="pc1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="pc1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="pc1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="pc1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="pc1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="pc1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="pc1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">PACELC asks one question, and there are two answers</text>
  <g filter="url(#pc1-soft)"><rect x="40" y="195" width="190" height="76" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="135" y="240" font-size="20" fill="#0F172A" text-anchor="middle">a request</text>
  <line x1="234" y1="233" x2="274" y2="233" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#pc1-s)"/>
  <g filter="url(#pc1-soft)"><rect x="280" y="185" width="250" height="96" rx="11" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/></g>
  <text x="405" y="224" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">is the network</text>
  <text x="405" y="254" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">broken?</text>
  <line x1="534" y1="202" x2="660" y2="168" stroke="#DC2626" stroke-width="2.2" marker-end="url(#pc1-r)"/>
  <rect x="571.4675" y="149" width="51.065" height="31" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="597" y="166" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="middle">yes</text>
  <line x1="534" y1="264" x2="660" y2="300" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#pc1-b)"/>
  <rect x="576.645" y="301" width="40.71" height="31" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="597" y="318" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">no</text>
  <g filter="url(#pc1-soft)"><rect x="666" y="110" width="550" height="110" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/></g>
  <text x="941" y="152" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle">P: there is a partition</text>
  <text x="941" y="188" font-size="20" fill="#0F172A" text-anchor="middle">choose availability or consistency</text>
  <g filter="url(#pc1-soft)"><rect x="666" y="250" width="550" height="110" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="941" y="292" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">E: else, the normal case</text>
  <text x="941" y="328" font-size="20" fill="#0F172A" text-anchor="middle">choose latency or consistency</text>
  <rect x="24" y="380" width="1192" height="52" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="413" font-size="19" fill="#64748B" text-anchor="middle">The top half is the CAP theorem. The bottom half is what PACELC adds.</text>
</svg>