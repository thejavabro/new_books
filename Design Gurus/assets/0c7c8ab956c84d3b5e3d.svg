<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="bug1-title bug1-desc">
<title id="bug1-title">Defect one: the gap after commit</title>
<desc id="bug1-desc">The order service closes its transaction and then publishes. A process terminated between the two leaves an order with no event, and nothing in the system reports a problem.</desc>
<defs>
<marker id="bug1-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="bug1-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="bug1-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="bug1-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="716" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Defect one: the gap after commit</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The order service closes its transaction and then publishes.</text>
<rect x="40" y="638" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="638" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What the order service does</text>
<rect x="40" y="168" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">db.transaction: INSERT order</text>
<path d="M526 196H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 196H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bug1-marker-green)"/>
<rect x="570" y="168" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the order row exists, with status created</text>
<rect x="40" y="236" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the process is killed here</text>
<path d="M526 264H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 264H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bug1-marker-red)"/>
<rect x="570" y="236" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a deploy, a pod eviction, an out-of-memory kill</text>
<rect x="40" y="304" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">producer.send never runs</text>
<path d="M526 332H560" fill="none" stroke="#91642E" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 332H560" fill="none" stroke="#91642E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bug1-marker-amber)"/>
<rect x="570" y="304" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">nothing downstream will ever look at that order again</text>
<rect x="40" y="388" width="1160" height="112" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="388" width="5" height="112" rx="2.5" fill="#F28B9D"/><text x="64" y="424" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">No error is raised anywhere.</text><text x="64" y="450" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The transaction succeeded, so from each system the operation went fine.</text><text x="64" y="476" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The customer sees a pending order that stays pending.</text>
<rect x="40" y="524" width="1160" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="524" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="64" y="560" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The repair: move the event inside the transaction</text><text x="64" y="586" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">INSERT order, INSERT outbox row, COMMIT, and a relay publishes</text>
<text x="66" y="672" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The same gap exists in the payment service, between its insert and its send.</text>
</svg>