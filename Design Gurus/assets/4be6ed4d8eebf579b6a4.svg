<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="768" viewBox="0 0 1240 768" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="benefits-title benefits-desc">
<title id="benefits-title">Four of five need only a boundary</title>
<desc id="benefits-desc">List what teams expect from microservices and only one item, independent deployment, actually requires a network. The other four come from having a real boundary, which can exist inside a single deployable unit.</desc>
<defs>
<marker id="benefits-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="benefits-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="benefits-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="benefits-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="768" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four of five need only a boundary</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Only one of them, the ability to deploy independently, requires a network.</text>
<rect x="40" y="690" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="690" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What teams want when they ask for services</text>
<rect x="40" y="168" width="940" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="510" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">clear ownership of an area</text>
<rect x="1000" y="168" width="200" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1100" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">boundary</text>
<rect x="40" y="224" width="940" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="510" y="254" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">change one area without reading all of it</text>
<rect x="1000" y="224" width="200" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1100" y="254" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">boundary</text>
<rect x="40" y="280" width="940" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="510" y="310" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a limited area of damage</text>
<rect x="1000" y="280" width="200" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1100" y="310" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">boundary</text>
<rect x="40" y="336" width="940" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="510" y="366" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">work without blocking other teams</text>
<rect x="1000" y="336" width="200" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1100" y="366" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">boundary</text>
<rect x="40" y="392" width="940" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="510" y="422" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deploy independently of each other</text>
<rect x="1000" y="392" width="200" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1100" y="422" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">network</text>
<rect x="40" y="464" width="1160" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="464" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="64" y="494" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Almost everything people want comes from the boundary.</text><text x="64" y="520" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The network is what you pay for independent deployment,</text><text x="64" y="546" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and it is charged whether or not you needed that.</text>
<rect x="40" y="584" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="584" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="617" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A modular monolith takes the first four without paying for the fifth.</text><text x="64" y="643" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A price measured in discipline rather than in infrastructure.</text>
<text x="66" y="724" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Not a compromise between two architectures. Four benefits, bought differently.</text>
</svg>