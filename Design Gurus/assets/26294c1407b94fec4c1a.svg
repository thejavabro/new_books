<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="No single User service: authentication lives at the edge and each context owns only its slice of user data, all keyed by the same user ID">
  <defs>
    <marker id="m02-l06-user-data-ownership-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m02-l06-user-data-ownership-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <rect x="70" y="280" width="1100" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="92" y="318" font-size="20" font-weight="600" fill="#334155">Each context owns only its slice of user data</text>

  <g fill="none" stroke="#475569" stroke-width="2.5">
    <path d="M560,150 C560,240 260,260 260,346" marker-end="url(#m02-l06-user-data-ownership-slate)"/>
    <path d="M620,150 L620,346" marker-end="url(#m02-l06-user-data-ownership-slate)"/>
    <path d="M680,150 C680,240 980,260 980,346" marker-end="url(#m02-l06-user-data-ownership-slate)"/>
  </g>
  <text x="620" y="245" font-size="20" text-anchor="middle" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">all keyed by the same user ID</text>

  <g filter="url(#m02-l06-user-data-ownership-soft)">
    <rect x="490" y="60" width="260" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="620" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User ID</text>
  <text x="620" y="132" text-anchor="middle" font-size="20" fill="#64748B">auth lives at the edge</text>

  <g filter="url(#m02-l06-user-data-ownership-soft)">
    <rect x="880" y="60" width="320" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1040" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">Single User service</text>
  <text x="1040" y="132" text-anchor="middle" font-size="20" fill="#B91C1C">deliberately absent</text>

  <g filter="url(#m02-l06-user-data-ownership-soft)">
    <rect x="110" y="350" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="260" y="390" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="260" y="422" text-anchor="middle" font-size="20" fill="#64748B">owns addresses</text>

  <g filter="url(#m02-l06-user-data-ownership-soft)">
    <rect x="470" y="350" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="620" y="390" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="620" y="422" text-anchor="middle" font-size="20" fill="#64748B">owns payment methods</text>

  <g filter="url(#m02-l06-user-data-ownership-soft)">
    <rect x="830" y="350" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="980" y="390" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="980" y="422" text-anchor="middle" font-size="20" fill="#64748B">owns contact preferences</text>
</svg>