<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="722" viewBox="0 0 1240 722" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ponr-title ponr-desc">
<title id="ponr-title">The point of no return</title>
<desc id="ponr-desc">Every migration has a step after which rolling back stops being cheap, and it is almost always the moment you stop writing the old representation. Marking it decides where the longest soak belongs.</desc>
<defs>
<marker id="ponr-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ponr-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ponr-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ponr-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="722" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The point of no return</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Every migration has a step after which rolling back stops being cheap.</text>
<rect x="40" y="644" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="644" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="40" y="148" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three regimes, divided by one step</text>
<path d="M455 150V258" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<path d="M785 150V258" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="40" y="164" width="400" height="86" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="199.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">everything before</text><text x="240" y="226.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reversible by a flag, in seconds</text>
<rect x="470" y="164" width="300" height="86" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="199.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">stop writing</text><text x="620" y="226.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the old</text>
<rect x="800" y="164" width="400" height="86" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1000" y="186" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">everything after</text><text x="1000" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reversible only by</text><text x="1000" y="240" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a reverse migration</text>
<text x="620" y="284" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">the point of no return</text>
<rect x="40" y="306" width="1160" height="78" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="306" width="5" height="78" rx="2.5" fill="#F28B9D"/><text x="64" y="338" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Up to then, the old data is current and routing back is a flag change.</text><text x="64" y="364" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">After it, the old data starts going stale immediately, and a rollback means copying data backwards under pressure.</text>
<text x="40" y="422" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two consequences</text>
<rect x="40" y="440" width="560" height="86" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="462" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The step before it deserves the</text><text x="320" y="489" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">longest period of watching, being</text><text x="320" y="516" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the last cheap place to find a problem</text>
<rect x="640" y="440" width="560" height="86" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="462" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep writing the old representation</text><text x="920" y="489" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">longer than feels necessary: that</text><text x="920" y="516" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">costs storage, stopping early does not</text>
<rect x="40" y="552" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="552" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="591" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Naming it in advance is one of the clearest signals of having done this before.</text>
<text x="66" y="677" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">The cost of writing the old data too long is storage. The cost of stopping too early is a second migration.</text>
</svg>