<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Relational databases fit money, stock counts, and rules across rows. Key-value stores fit simple lookups by key at high volume. Document stores fit record shapes that keep changing. Wide-column stores fit writes beyond one machine. Graph databases fit connections many steps deep.">
  <defs>
    <filter id="snq4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="snq4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="snq4-k1"><rect x="40" y="140" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="snq4-k2"><rect x="276" y="140" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="snq4-k3"><rect x="512" y="140" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="snq4-k4"><rect x="748" y="140" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="snq4-k5"><rect x="984" y="140" width="216" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Match the database to the data</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">When no reason forces a choice, start relational.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#snq4-lift)">
    <rect x="40" y="140" width="216" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="40" y="140" width="9" height="90" fill="#2563EB" clip-path="url(#snq4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Relational</text>
  <text x="148" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">money, stock,</text>
  <text x="148" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">rules across rows</text>
  <g filter="url(#snq4-soft)">
    <rect x="276" y="140" width="216" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="276" y="140" width="6" height="90" fill="#D97706" clip-path="url(#snq4-k2)"/>
  </g>
  <circle cx="314" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(303.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="340" y="192" font-size="21.5" font-weight="600" fill="#111827">Key-value</text>
  <text x="384" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">lookups by key,</text>
  <text x="384" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">high volume</text>
  <g filter="url(#snq4-soft)">
    <rect x="512" y="140" width="216" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="512" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#snq4-k3)"/>
  </g>
  <circle cx="550" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(539.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="576" y="192" font-size="21.5" font-weight="600" fill="#111827">Document</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">record shapes</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">keep changing</text>
  <g filter="url(#snq4-soft)">
    <rect x="748" y="140" width="216" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="748" y="140" width="6" height="90" fill="#059669" clip-path="url(#snq4-k4)"/>
  </g>
  <circle cx="786" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(775.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="812" y="192" font-size="21.5" font-weight="600" fill="#111827">Wide-column</text>
  <text x="856" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">writes beyond</text>
  <text x="856" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">one machine</text>
  <g filter="url(#snq4-soft)">
    <rect x="984" y="140" width="216" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="984" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#snq4-k5)"/>
  </g>
  <circle cx="1022" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(1011.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="1048" y="192" font-size="21.5" font-weight="600" fill="#111827">Graph</text>
  <text x="1092" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">connections many</text>
  <text x="1092" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">steps deep</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Default</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">start relational when no question forces another choice</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Many stores</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">normal in real systems, when each store has its own reason</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">The work moves</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">rules and joins the database skips must be done by your code</text>
</svg>