<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five failure modes across the top pointing into one rule. The failures are a clock stepping backwards after an NTP correction, a node restarting and forgetting its last used millisecond, a machine number reused by a new node with an older clock, the coordinator going unreachable so no node can join, and a lost region whose region bits keep its IDs distinct. All five point to a single rule: never generate while behind the last used millisecond, remembered per node, and quarantine a machine number for longer than the clock error you tolerate.">
  <defs>
    <filter id="uidfail-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="uidfail-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="uidfail-k1"><rect x="55" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="uidfail-k2"><rect x="285" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="uidfail-k3"><rect x="515" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="uidfail-k4"><rect x="745" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="uidfail-k5"><rect x="975" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="uidfail-k6"><rect x="330" y="430" width="580" height="90" rx="12"/></clipPath>
    <marker id="uidfail-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="uidfail-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="uidfail-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Five ways to break it, and the one rule that covers them</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Nothing here is stored, so nothing can be lost. What it can do is repeat itself, and only the clock causes that.</text>

  <rect x="40" y="110" width="1160" height="200" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#BE185D">What can go wrong</text>
  <rect x="40" y="380" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#047857">The invariant that covers all five</text>

  <g fill="none" stroke-width="2">
    <path d="M162.5 300 V 352 H 400 V 424" stroke="#DB2777" marker-end="url(#uidfail-m-pink)"/>
    <path d="M392.5 300 V 332 H 510 V 424" stroke="#DB2777" marker-end="url(#uidfail-m-pink)"/>
    <path d="M622.5 300 V 424" stroke="#D97706" marker-end="url(#uidfail-m-amber)"/>
    <path d="M852.5 300 V 332 H 730 V 424" stroke="#D97706" marker-end="url(#uidfail-m-amber)"/>
    <path d="M1082.5 300 V 352 H 840 V 424" stroke="#64748B" marker-end="url(#uidfail-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#uidfail-soft)">
    <rect x="55" y="165" width="215" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="55" y="165" width="6" height="90" fill="#DB2777" clip-path="url(#uidfail-k1)"/>
  </g>
  <circle cx="93" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(82.56,199.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="119" y="217" font-size="21.5" font-weight="600" fill="#111827">Clock slips</text>
  <text x="162.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">NTP correction</text>
  <g filter="url(#uidfail-soft)">
    <rect x="285" y="165" width="215" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="285" y="165" width="6" height="90" fill="#DB2777" clip-path="url(#uidfail-k2)"/>
  </g>
  <circle cx="323" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(312.56,199.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="349" y="217" font-size="21.5" font-weight="600" fill="#111827">Node restarts</text>
  <text x="392.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">last ms forgotten</text>
  <g filter="url(#uidfail-soft)">
    <rect x="515" y="165" width="215" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="515" y="165" width="6" height="90" fill="#D97706" clip-path="url(#uidfail-k3)"/>
  </g>
  <circle cx="553" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(542.56,199.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="579" y="217" font-size="21.5" font-weight="600" fill="#111827">Number reuse</text>
  <text x="622.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">new node, older clock</text>
  <g filter="url(#uidfail-soft)">
    <rect x="745" y="165" width="215" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="745" y="165" width="6" height="90" fill="#D97706" clip-path="url(#uidfail-k4)"/>
  </g>
  <circle cx="783" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(772.56,199.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="809" y="217" font-size="21.5" font-weight="600" fill="#111827">Coordinator</text>
  <text x="852.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">no node can join</text>
  <g filter="url(#uidfail-soft)">
    <rect x="975" y="165" width="215" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="975" y="165" width="6" height="90" fill="#64748B" clip-path="url(#uidfail-k5)"/>
  </g>
  <circle cx="1013" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(1002.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="1039" y="217" font-size="21.5" font-weight="600" fill="#111827">Region lost</text>
  <text x="1082.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">region bits differ</text>
  <g filter="url(#uidfail-lift)">
    <rect x="330" y="430" width="580" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="330" y="430" width="9" height="90" fill="#059669" clip-path="url(#uidfail-k6)"/>
  </g>
  <circle cx="368" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="394" y="482" font-size="21.5" font-weight="600" fill="#111827">Never generate while behind the last used ms</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">remembered per node, and quarantine a number</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">for longer than the clock error you tolerate</text>

  <rect x="40" y="640" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="665" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="690" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Makes a duplicate</text>
  <text x="323" y="690" font-size="18.5" fill="#475569">Same millisecond, same machine number, sequence reset to zero. That is the failure.</text>
  <rect x="64" y="715" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Costs capacity only</text>
  <text x="323" y="740" font-size="18.5" fill="#475569">A lost coordinator stops growth, not serving. A reused number is safe once quarantined.</text>
  <rect x="64" y="765" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Costs nothing</text>
  <text x="323" y="790" font-size="18.5" fill="#475569">A lost region collides with nobody, because its number is part of every ID it made.</text>
</svg>