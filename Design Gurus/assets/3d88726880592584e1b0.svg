<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="868" viewBox="0 0 1240 868" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shadow-title shadow-desc">
<title id="shadow-title">A migration you can verify</title>
<desc id="shadow-desc">Because rating is a pure function, the new system can be proven right before it is trusted. The discrepancies are the deliverable.</desc>
<defs>
<marker id="shadow-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shadow-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shadow-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shadow-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="868" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A migration you can verify</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Because rating is a pure function, the new system can be proven right before it is trusted.</text>
<rect x="40" y="790" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="790" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="510" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="345" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Build the input log, from the same sources</text>
<path d="M606 146H640" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M606 146H640" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shadow-marker-slate)"/>
<rect x="650" y="118" width="550" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="670" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the old system still owns billing</text>
<circle cx="60" cy="212" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="219" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="184" width="510" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="345" y="218" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Run new rating in shadow, output nowhere</text>
<path d="M606 212H640" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M606 212H640" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shadow-marker-slate)"/>
<rect x="650" y="184" width="550" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="670" y="218" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">compare against the old invoices</text>
<circle cx="60" cy="278" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="285" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="250" width="510" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="345" y="284" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Investigate every discrepancy</text>
<path d="M606 278H640" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M606 278H640" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shadow-marker-slate)"/>
<rect x="650" y="250" width="550" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="670" y="284" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">this is the real work, and it is the deliverable</text>
<circle cx="60" cy="344" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="351" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="316" width="510" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="345" y="350" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">New system invoices, old one charges</text>
<path d="M606 344H640" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M606 344H640" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shadow-marker-slate)"/>
<rect x="650" y="316" width="550" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="670" y="350" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">output verified in front of people, money unchanged</text>
<circle cx="60" cy="410" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="417" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="382" width="510" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="345" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">New system charges, old one shadows</text>
<path d="M606 410H640" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M606 410H640" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shadow-marker-slate)"/>
<rect x="650" y="382" width="550" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="670" y="416" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reversible for one cycle, as a second opinion</text>
<circle cx="60" cy="476" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="483" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="90" y="448" width="510" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="345" y="482" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Decommission the old pipeline</text>
<path d="M606 476H640" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M606 476H640" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shadow-marker-slate)"/>
<rect x="650" y="448" width="550" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="670" y="482" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">after two clean closes</text>
<text x="40" y="542" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Step three, where the discrepancies sort into three kinds</text>
<rect x="40" y="560" width="372" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="560" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="592" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The new system is wrong</text><text x="64" y="618" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">fix it. Mostly gone</text><text x="64" y="644" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">after week one</text>
<rect x="434" y="560" width="372" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="434" y="560" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="458" y="592" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The old system was wrong</text><text x="458" y="618" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a real billing defect. Surface it,</text><text x="458" y="644" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">do not fix it silently</text>
<rect x="828" y="560" width="372" height="104" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="828" y="560" width="5" height="104" rx="2.5" fill="#F3CF6A"/><text x="852" y="592" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Both are defensible</text><text x="852" y="618" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">usually proration or rounding.</text><text x="852" y="644" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Finance chooses the rule</text>
<rect x="40" y="684" width="1160" height="80" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="684" width="5" height="80" rx="2.5" fill="#F28B9D"/><text x="64" y="717" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Never resolve a discrepancy by matching the old system</text><text x="64" y="743" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">unless it has been shown correct. Matching is the metric that looks like progress.</text>
<text x="66" y="824" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The invoice being wrong is embarrassing. The charge being wrong is an incident.</text>
</svg>