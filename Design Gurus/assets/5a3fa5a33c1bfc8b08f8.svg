<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One order screen needs fourteen calls in a storage-shaped API. Three workable fixes cut those fourteen calls, embedding down to three and the other two down to one, and each carries a price: embedding gives a larger and coupled body, a composite read creates a screen-shaped operation, and GraphQL requires query-cost control.">
  <defs>
    <marker id="xl10threefi-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="xl10threefi-mv" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="xl10threefi-ma" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="xl10threefi-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl10threefi-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl10threefi-k1"><rect x="80" y="260" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="xl10threefi-k2"><rect x="640" y="100" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="xl10threefi-k3"><rect x="640" y="260" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="xl10threefi-k4"><rect x="640" y="420" width="500" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="540" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One screen, three fixes</text>

  
  <g fill="none" stroke-width="2">
    <path d="M420,280 H488 Q500,280 500,268 V157 Q500,145 512,145 H640" stroke="#2563EB" marker-end="url(#xl10threefi-mb)"/>
    <path d="M420,305 H640" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#xl10threefi-mv)"/>
    <path d="M420,330 H528 Q540,330 540,342 V453 Q540,465 552,465 H640" stroke="#D97706" marker-end="url(#xl10threefi-ma)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="583" y="134" fill="#1D4ED8">3 calls</text>
    <text x="583" y="294" fill="#5B21B6">1 call</text>
    <text x="583" y="454" fill="#B45309">1 call</text>
  </g>

  
  <g filter="url(#xl10threefi-lift)">
    <rect x="80" y="260" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="80" y="260" width="9" height="90" fill="#DB2777" clip-path="url(#xl10threefi-k1)"/>
  </g>
  <circle cx="118" cy="305" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,294.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="144" y="312" font-size="18.5" font-weight="600" fill="#111827">One order screen</text>
  <text x="250" y="375" font-size="15.5" text-anchor="middle" fill="#6B7280">14 calls</text>
  <g stroke="#DB2777" stroke-width="2" stroke-linecap="round">
    <path d="M94,390 V414"/>
    <path d="M118,390 V414"/>
    <path d="M142,390 V414"/>
    <path d="M166,390 V414"/>
    <path d="M190,390 V414"/>
    <path d="M214,390 V414"/>
    <path d="M238,390 V414"/>
    <path d="M262,390 V414"/>
    <path d="M286,390 V414"/>
    <path d="M310,390 V414"/>
    <path d="M334,390 V414"/>
    <path d="M358,390 V414"/>
    <path d="M382,390 V414"/>
    <path d="M406,390 V414"/>
  </g>
  <text x="250" y="446" font-size="15.5" text-anchor="middle" fill="#94A3B8">fourteen round trips on a weak network</text>

  
  <g filter="url(#xl10threefi-soft)">
    <rect x="640" y="100" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="640" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#xl10threefi-k2)"/>
  </g>
  <circle cx="678" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="704" y="152" font-size="18.5" font-weight="600" fill="#111827">Embed what the response always needs</text>
  <text x="890" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">the price: a larger, coupled body</text>

  
  <g filter="url(#xl10threefi-soft)">
    <rect x="640" y="260" width="500" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="640" y="260" width="6" height="90" fill="#7C3AED" clip-path="url(#xl10threefi-k3)"/>
  </g>
  <circle cx="678" cy="305" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,294.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="704" y="312" font-size="18.5" font-weight="600" fill="#111827">One composite read resource</text>
  <text x="890" y="375" font-size="15.5" text-anchor="middle" fill="#6B7280">the price: a screen-shaped operation</text>

  
  <g filter="url(#xl10threefi-soft)">
    <rect x="640" y="420" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="640" y="420" width="6" height="90" fill="#D97706" clip-path="url(#xl10threefi-k4)"/>
  </g>
  <circle cx="678" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,454.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="704" y="472" font-size="18.5" font-weight="600" fill="#111827">One GraphQL query</text>
  <text x="890" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">the price: query-cost control</text>

  
  <rect x="40" y="604" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="649" text-anchor="middle" font-size="16" fill="#475569">Reducing dependent calls can improve latency on slow networks.</text>
</svg>