<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six product APIs with very different pressures all feed the same six-step method. Chat API with one authoritative order, Feature Flag API with huge reads and fast propagation, and Calendar API with recurrence that has no end sit on the left. Booking API with scarce capacity held briefly, Checkout API with a changing price and no double write, and Collaborative Document API with two people typing at once sit on the right. Steps two, four and five are highlighted because the pressure changes what goes into them, while the method itself never changes.">
  <defs>
    <marker id="p2l-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>

    <filter id="p2l-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2l-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2l-k1"><rect x="476" y="146" width="288" height="48" rx="10"/></clipPath>
    <clipPath id="p2l-k2"><rect x="476" y="224" width="288" height="48" rx="10"/></clipPath>
    <clipPath id="p2l-k3"><rect x="476" y="302" width="288" height="48" rx="10"/></clipPath>
    <clipPath id="p2l-k4"><rect x="476" y="380" width="288" height="48" rx="10"/></clipPath>
    <clipPath id="p2l-k5"><rect x="476" y="458" width="288" height="48" rx="10"/></clipPath>
    <clipPath id="p2l-k6"><rect x="476" y="536" width="288" height="48" rx="10"/></clipPath>

    <clipPath id="p2l-p1"><rect x="68" y="164" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p2l-p2"><rect x="68" y="320" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p2l-p3"><rect x="68" y="476" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p2l-p4"><rect x="832" y="164" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p2l-p5"><rect x="832" y="320" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p2l-p6"><rect x="832" y="476" width="340" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="596" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One method, six pressures</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">six APIs, the same six steps</text>

  
  <rect x="452" y="100" width="336" height="508" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="476" y="130" font-size="16.5" font-weight="600" fill="#4338CA">The method, six steps</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M408,209 H452" marker-end="url(#p2l-bm)"/>
    <path d="M408,365 H452" marker-end="url(#p2l-bm)"/>
    <path d="M408,521 H452" marker-end="url(#p2l-bm)"/>
    <path d="M832,209 H788" marker-end="url(#p2l-bm)"/>
    <path d="M832,365 H788" marker-end="url(#p2l-bm)"/>
    <path d="M832,521 H788" marker-end="url(#p2l-bm)"/>
  </g>

  
  <g filter="url(#p2l-soft)">
    <rect x="476" y="146" width="288" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="476" y="146" width="6" height="48" fill="#4F46E5" clip-path="url(#p2l-k1)"/>
  </g>
  <circle cx="510" cy="170" r="4.5" fill="#4F46E5"/>
  <text x="534" y="177" font-size="18.5" font-weight="600" fill="#111827">1 Consumers and jobs</text>

  
  <g filter="url(#p2l-lift)">
    <rect x="476" y="224" width="288" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="476" y="224" width="9" height="48" fill="#D97706" clip-path="url(#p2l-k2)"/>
  </g>
  <circle cx="510" cy="248" r="15" fill="#FFFFFF"/>
  <g transform="translate(501,239) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
