    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="534" y="255" font-size="18.5" font-weight="600" fill="#111827">2 Resources</text>

  
  <g filter="url(#p2l-soft)">
    <rect x="476" y="302" width="288" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="476" y="302" width="6" height="48" fill="#4F46E5" clip-path="url(#p2l-k3)"/>
  </g>
  <circle cx="510" cy="326" r="4.5" fill="#4F46E5"/>
  <text x="534" y="333" font-size="18.5" font-weight="600" fill="#111827">3 Operations</text>

  
  <g filter="url(#p2l-lift)">
    <rect x="476" y="380" width="288" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="476" y="380" width="9" height="48" fill="#D97706" clip-path="url(#p2l-k4)"/>
  </g>
  <circle cx="510" cy="404" r="15" fill="#FFFFFF"/>
  <g transform="translate(501,395) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="534" y="411" font-size="18.5" font-weight="600" fill="#111827">4 One operation in full</text>

  
  <g filter="url(#p2l-lift)">
    <rect x="476" y="458" width="288" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="476" y="458" width="9" height="48" fill="#D97706" clip-path="url(#p2l-k5)"/>
  </g>
  <circle cx="510" cy="482" r="15" fill="#FFFFFF"/>
  <g transform="translate(501,473) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="534" y="489" font-size="18.5" font-weight="600" fill="#111827">5 Hard parts</text>

  
  <g filter="url(#p2l-soft)">
    <rect x="476" y="536" width="288" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="476" y="536" width="6" height="48" fill="#4F46E5" clip-path="url(#p2l-k6)"/>
  </g>
  <circle cx="510" cy="560" r="4.5" fill="#4F46E5"/>
  <text x="534" y="567" font-size="18.5" font-weight="600" fill="#111827">6 Trade-offs</text>

  
  <g filter="url(#p2l-soft)">
    <rect x="68" y="164" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="164" width="6" height="90" fill="#2563EB" clip-path="url(#p2l-p1)"/>
  </g>
  <circle cx="106" cy="209" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,198.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="132" y="216" font-size="18.5" font-weight="600" fill="#111827">Chat API</text>
  <text x="238" y="279" text-anchor="middle" font-size="15.5" fill="#6B7280">one authoritative order</text>

  
  <g filter="url(#p2l-soft)">
    <rect x="68" y="320" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="320" width="6" height="90" fill="#2563EB" clip-path="url(#p2l-p2)"/>
  </g>
  <circle cx="106" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,354.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="132" y="372" font-size="18.5" font-weight="600" fill="#111827">Feature Flag API</text>
  <text x="238" y="435" text-anchor="middle" font-size="15.5" fill="#6B7280">huge reads, fast propagation</text>

  
  <g filter="url(#p2l-soft)">
    <rect x="68" y="476" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="476" width="6" height="90" fill="#2563EB" clip-path="url(#p2l-p3)"/>
  </g>
  <circle cx="106" cy="521" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,510.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="132" y="528" font-size="18.5" font-weight="600" fill="#111827">Calendar API</text>
  <text x="238" y="591" text-anchor="middle" font-size="15.5" fill="#6B7280">recurrence with no end</text>

  
  <g filter="url(#p2l-soft)">
    <rect x="832" y="164" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="832" y="164" width="6" height="90" fill="#2563EB" clip-path="url(#p2l-p4)"/>
  </g>
  <circle cx="870" cy="209" r="18" fill="#FFFFFF"/>
  <g transform="translate(859.56,198.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="896" y="216" font-size="18.5" font-weight="600" fill="#111827">Booking API</text>
  <text x="1002" y="279" text-anchor="middle" font-size="15.5" fill="#6B7280">scarce capacity, held briefly</text>

  
  <g filter="url(#p2l-soft)">
    <rect x="832" y="320" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="832" y="320" width="6" height="90" fill="#2563EB" clip-path="url(#p2l-p5)"/>
  </g>
  <circle cx="870" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(859.56,354.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="896" y="372" font-size="18.5" font-weight="600" fill="#111827">Checkout API</text>
  <text x="1002" y="435" text-anchor="middle" font-size="15.5" fill="#6B7280">changing price, no double write</text>

  
  <g filter="url(#p2l-soft)">
    <rect x="832" y="476" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="832" y="476" width="6" height="90" fill="#2563EB" clip-path="url(#p2l-p6)"/>
  </g>
  <circle cx="870" cy="521" r="18" fill="#FFFFFF"/>
  <g transform="translate(859.56,510.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="896" y="528" font-size="18.5" font-weight="600" fill="#111827">Collaborative Document API</text>
  <text x="1002" y="591" text-anchor="middle" font-size="15.5" fill="#6B7280">two people typing at once</text>

  
  <rect x="40" y="660" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="702" text-anchor="middle" font-size="16" fill="#475569">The pressure changes what goes into steps 2, 4 and 5. It never changes the method.</text>
  <text x="620" y="730" text-anchor="middle" font-size="16" fill="#475569">Those three steps are highlighted because each API fills them differently. The other three are asked the same way every time.</text>
</svg>