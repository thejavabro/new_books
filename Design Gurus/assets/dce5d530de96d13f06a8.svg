  <rect x="40" y="907" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="949" text-anchor="middle" font-size="16" fill="#475569">Both are defensible. The product decides which collision behavior is acceptable.</text>
  <text x="620" y="977" text-anchor="middle" font-size="16" fill="#475569">This answer keeps both surfaces, and publishes clearly different collision behavior for each.</text>
