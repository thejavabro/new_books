<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Event sourcing architecture: commands append to the store with an expected version, snapshots cap replay cost, and projections build read models from the stream">
  <defs>
    <marker id="es3-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="es3-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="es3-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="es3-k1"><rect x="72" y="130" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="es3-k2"><rect x="880" y="105" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="es3-k3"><rect x="880" y="270" width="300" height="90" rx="12"/></clipPath>
    <filter id="es3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="es3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="610" fill="#FFFFFF"/>

  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M372,165 H462" marker-end="url(#es3-mblue)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="417" y="150" fill="#1D4ED8">append</text>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M758,150 H872" marker-end="url(#es3-mviolet)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M725,226 V303 Q725,315 737,315 H872" marker-end="url(#es3-memerald)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="800" y="298" fill="#047857">subscribe</text>
  </g>
  <g filter="url(#es3-soft)">
    <rect x="72" y="130" width="300" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="130" width="6" height="70" fill="#2563EB" clip-path="url(#es3-k1)"/>
  </g>
  <circle cx="110" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="172" font-size="18.5" font-weight="600" fill="#111827">Command Handler</text>
  <text x="222" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">validates against replayed state</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 470,120 L 470,194 A 140,16 0 0 0 750,194 L 750,120" fill="#EDE9FE"/>
    <ellipse cx="610" cy="120" rx="140" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="610" y="177" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Event Store</text>
  <text x="610" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">append only</text>
  <text x="610" y="258" font-size="15.5" text-anchor="middle" fill="#94A3B8">versioned per aggregate</text>
  <g filter="url(#es3-soft)">
    <rect x="880" y="105" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="880" y="105" width="6" height="90" fill="#7C3AED" clip-path="url(#es3-k2)"/>
  </g>
  <circle cx="918" cy="150" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,139.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="944" y="157" font-size="18.5" font-weight="600" fill="#111827">Snapshots</text>
  <text x="1030" y="220" font-size="15.5" text-anchor="middle" fill="#6B7280">state cached every N events</text>
  <g filter="url(#es3-soft)">
    <rect x="880" y="270" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="270" width="6" height="90" fill="#059669" clip-path="url(#es3-k3)"/>
  </g>
  <circle cx="918" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="944" y="322" font-size="18.5" font-weight="600" fill="#111827">Projections</text>
  <text x="1030" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">read models for queries (CQRS)</text>
  <rect x="40" y="450" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="474" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="496" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">The write side</text>
  <text x="288" y="496" font-size="15.5" fill="#475569">append immutable facts, guarded by an expected version per aggregate</text>
  <rect x="64" y="518" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="540" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The read side</text>
  <text x="288" y="540" font-size="15.5" fill="#475569">projections consume the stream and serve queries, a short delay behind</text>
</svg>