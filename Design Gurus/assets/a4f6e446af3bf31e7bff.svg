<rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Both pointers start at the head</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">slow moves one node a step, fast moves two, so a cycle makes them meet</text>
