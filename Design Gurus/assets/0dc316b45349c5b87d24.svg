    <text x="275" y="530" fill="#1D4ED8" text-anchor="start">OrderPlaced event</text>
    <text x="875" y="508" fill="#1D4ED8" text-anchor="start">2. Receives</text>
    <text x="875" y="530" fill="#1D4ED8" text-anchor="start">OrderPlaced event</text>
  </g>

