<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities for a streaming recommendation system: user interaction events feed both an online and an offline path, the recommendation engine combines them with content metadata, and results are served back to the user">
  <defs>
    <filter id="nfxk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nfxk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nfxk-k1"><rect x="40" y="310" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="nfxk-k2"><rect x="330" y="310" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nfxk-k3"><rect x="680" y="310" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxk-k4"><rect x="680" y="140" width="340" height="90" rx="12"/></clipPath>
    <marker id="nfxk-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="nfxk-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="nfxk-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="nfxk-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="nfxk-s-violet" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#7C3AED"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="902" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Recommendation system: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Two paths share one catalogue: a fast online one for the next click, and a slow offline one for taste.</text>



  <g fill="none" stroke-width="2">
    <path d="M230,335 H330" stroke="#2563EB" marker-end="url(#nfxk-m-blue)"/>
    <path d="M580,335 H690" stroke="#059669" marker-end="url(#nfxk-m-emerald)"/>
    <path d="M960,310 V230" stroke="#D97706" marker-end="url(#nfxk-m-amber)"/>
    <path d="M1020,355 H1055" stroke="#7C3AED" marker-end="url(#nfxk-m-violet)" marker-start="url(#nfxk-s-violet)"/>
    <path d="M1000,400 V648 Q1000,660 988,660 H32 Q20,660 20,648 V367 Q20,355 32,355 H40" stroke="#2563EB" stroke-width="2.5" marker-end="url(#nfxk-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="280" y="322" fill="#1D4ED8">watches</text>
    <text x="635" y="322" fill="#047857">feeds</text>
    <text x="1000" y="272" fill="#B45309">ranks</text>
    <text x="430" y="652" fill="#1D4ED8">recommendations, ranked for this user</text>
  </g>

  <g filter="url(#nfxk-soft)">
    <rect x="40" y="310" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#nfxk-k1)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="362" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="135" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">profile and history</text>
  <text x="135" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">ratings and likes</text>
  <g filter="url(#nfxk-soft)">
    <rect x="330" y="310" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="330" y="310" width="6" height="90" fill="#059669" clip-path="url(#nfxk-k2)"/>
  </g>
  <circle cx="368" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,344.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="394" y="362" font-size="21.5" font-weight="600" fill="#111827">Interaction Events</text>
  <text x="455" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">plays, pauses, ratings</text>
  <g filter="url(#nfxk-lift)">
    <rect x="680" y="310" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="680" y="310" width="9" height="90" fill="#2563EB" clip-path="url(#nfxk-k3)"/>
  </g>
  <circle cx="718" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="744" y="362" font-size="21.5" font-weight="600" fill="#111827">Recommendation Engine</text>
  <text x="850" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">online for the next click</text>
  <text x="850" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">offline for the nightly model</text>
  <g filter="url(#nfxk-soft)">
    <rect x="680" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="680" y="140" width="6" height="90" fill="#D97706" clip-path="url(#nfxk-k4)"/>
  </g>
  <circle cx="718" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="744" y="192" font-size="21.5" font-weight="600" fill="#111827">Content Item</text>
  <text x="850" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">title, genre, cast, tags</text>
  <text x="850" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">rating and view counts</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M1055,320 L1055,414 A72.5,16 0 0 0 1200,414 L1200,320" fill="#EDE9FE"/>
    <ellipse cx="1127.5" cy="320" rx="72.5" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1127.5" y="382" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Data Stores</text>
  <text x="1127.5" y="464" font-size="18.5" text-anchor="middle" fill="#6B7280">profiles and histories</text>
  <text x="1127.5" y="491" font-size="18.5" text-anchor="middle" fill="#94A3B8">precomputed results</text>

  <rect x="40" y="700" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="725" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="750" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Online path</text>
  <text x="323" y="750" font-size="18.5" fill="#475569">answers in milliseconds using precomputed results plus whatever the user just did</text>
  <rect x="64" y="775" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="800" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Offline path</text>
  <text x="323" y="800" font-size="18.5" fill="#475569">recomputes models in bulk on a schedule, where long term taste actually gets learned</text>
  <rect x="64" y="825" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="850" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Cold start</text>
  <text x="323" y="850" font-size="18.5" fill="#475569">a new user or a new title has no history, so popularity has to stand in until events arrive</text>
</svg>