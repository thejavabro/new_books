<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1345" viewBox="0 0 1240 1345" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four numbered panels. 1, no server management: servers are handed to the cloud provider, which manages the infrastructure. 2, automatic fine-grained scaling: from 0 instances when idle to 1 instance at low traffic, hundreds of instances as demand rises, to thousands of instances at high traffic, and back down to zero. 3, pay for use, not for capacity: a function invocation runs for an execution time measured in milliseconds and you pay only for what you use. 4, event-driven execution: an HTTP request, a file upload, a message on a queue, a database change or a scheduled timer triggers an on-demand function that processes the event">
