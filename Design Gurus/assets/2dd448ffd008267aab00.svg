  <g transform="translate(807.56,1143.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="844" y="1161" font-size="21.5" font-weight="600" fill="#111827">Process the event</text>
  <text x="64" y="187" font-size="18.5" fill="#475569">You do not provision, maintain, or patch servers. The cloud provider manages the infrastructure.</text>
  <text x="64" y="416" font-size="18.5" fill="#475569">Capacity automatically scales from zero to thousands of instances and back down, based on demand.</text>
  <text x="64" y="443" font-size="18.5" fill="#475569">You do not configure autoscaling policies.</text>
  <text x="64" y="695" font-size="18.5" fill="#475569">You are billed based on actual consumption such as the number of invocations and execution</text>
  <text x="64" y="722" font-size="18.5" fill="#475569">time in milliseconds. When nothing runs, you pay nothing for compute.</text>
  <text x="64" y="974" font-size="18.5" fill="#475569">Code runs in response to events such as an HTTP request, a file upload, a message on a queue,</text>
  <text x="64" y="1001" font-size="18.5" fill="#475569">a database change, or a scheduled timer. There is no always-running process.</text>




</svg>