  <rect x="0" y="0" width="1240" height="1345" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The four defining properties of serverless architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">No server management, fine-grained scaling, pay for use, and event-driven execution.</text>

  <rect x="40" y="125" width="1160" height="205" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#1D4ED8">1. No server management</text>
  <rect x="40" y="354" width="1160" height="255" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="384" font-size="19.5" font-weight="600" fill="#047857">2. Automatic, fine-grained scaling</text>
  <rect x="40" y="633" width="1160" height="255" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="663" font-size="19.5" font-weight="600" fill="#B45309">3. Pay for use, not for capacity</text>
  <rect x="40" y="912" width="1160" height="393" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="942" font-size="19.5" font-weight="600" fill="#4338CA">4. Event-driven execution</text>

