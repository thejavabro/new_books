<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1336" viewBox="0 0 1240 1336" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Seven questions asked in order down the left, each with a yes edge to the tool it points to on the right and a no edge to the next question">
  <defs>
    <filter id="l10dp-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="l10dp-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="l10dp-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="l10dp-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="l10dp-k1"><rect x="40" y="40" width="720" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k2"><rect x="860" y="40" width="340" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k3"><rect x="40" y="208" width="720" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k4"><rect x="860" y="208" width="340" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k5"><rect x="40" y="376" width="720" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k6"><rect x="860" y="376" width="340" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k7"><rect x="40" y="544" width="720" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k8"><rect x="860" y="544" width="340" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k9"><rect x="40" y="712" width="720" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k10"><rect x="860" y="712" width="340" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k11"><rect x="40" y="880" width="720" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k12"><rect x="860" y="880" width="340" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k13"><rect x="40" y="1048" width="720" height="112" rx="12"/></clipPath>
    <clipPath id="l10dp-k14"><rect x="860" y="1048" width="340" height="112" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1336" fill="#FFFFFF"/>

  <g fill="none" stroke-width="2">
    <path d="M760,96 H860" stroke="#059669" marker-end="url(#l10dp-em)"/>
    <path d="M400,152 V208" stroke="#64748B" marker-end="url(#l10dp-sl)"/>
    <path d="M760,264 H860" stroke="#059669" marker-end="url(#l10dp-em)"/>
    <path d="M400,320 V376" stroke="#64748B" marker-end="url(#l10dp-sl)"/>
    <path d="M760,432 H860" stroke="#059669" marker-end="url(#l10dp-em)"/>
    <path d="M400,488 V544" stroke="#64748B" marker-end="url(#l10dp-sl)"/>
    <path d="M760,600 H860" stroke="#059669" marker-end="url(#l10dp-em)"/>
    <path d="M400,656 V712" stroke="#64748B" marker-end="url(#l10dp-sl)"/>
    <path d="M760,768 H860" stroke="#059669" marker-end="url(#l10dp-em)"/>
    <path d="M400,824 V880" stroke="#64748B" marker-end="url(#l10dp-sl)"/>
    <path d="M760,936 H860" stroke="#059669" marker-end="url(#l10dp-em)"/>
    <path d="M400,992 V1048" stroke="#64748B" marker-end="url(#l10dp-sl)"/>
    <path d="M760,1104 H860" stroke="#059669" marker-end="url(#l10dp-em)"/>
  </g>
  <g font-size="20" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="810" y="86" text-anchor="middle" fill="#047857">yes</text>
    <text x="414" y="187" fill="#475569">no</text>
    <text x="810" y="254" text-anchor="middle" fill="#047857">yes</text>
    <text x="414" y="355" fill="#475569">no</text>
    <text x="810" y="422" text-anchor="middle" fill="#047857">yes</text>
    <text x="414" y="523" fill="#475569">no</text>
    <text x="810" y="590" text-anchor="middle" fill="#047857">yes</text>
    <text x="414" y="691" fill="#475569">no</text>
    <text x="810" y="758" text-anchor="middle" fill="#047857">yes</text>
    <text x="414" y="859" fill="#475569">no</text>
    <text x="810" y="926" text-anchor="middle" fill="#047857">yes</text>
    <text x="414" y="1027" fill="#475569">no</text>
    <text x="810" y="1094" text-anchor="middle" fill="#047857">yes</text>
  </g>

  <g filter="url(#l10dp-soft)">
    <rect x="40" y="40" width="720" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="40" width="6" height="112" fill="#64748B" clip-path="url(#l10dp-k1)"/>
  </g>
  <circle cx="78" cy="96" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,85.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="103" font-size="20" font-weight="600" fill="#111827">Step 1: Can the threads avoid sharing?</text>

  <g filter="url(#l10dp-lift)">
    <rect x="860" y="40" width="340" height="112" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="860" y="40" width="9" height="112" fill="#059669" clip-path="url(#l10dp-k2)"/>
  </g>
  <circle cx="898" cy="96" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,85.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="924" y="103" font-size="20" font-weight="600" fill="#111827">No tool, only a join</text>

  <g filter="url(#l10dp-soft)">
    <rect x="40" y="208" width="720" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="208" width="6" height="112" fill="#64748B" clip-path="url(#l10dp-k3)"/>
  </g>
  <circle cx="78" cy="264" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,253.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="271" font-size="20" font-weight="600" fill="#111827">Step 2: Is the shared data one value with one operation?</text>

  <g filter="url(#l10dp-soft)">
    <rect x="860" y="208" width="340" height="112" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="208" width="6" height="112" fill="#059669" clip-path="url(#l10dp-k4)"/>
  </g>
  <circle cx="898" cy="264" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,253.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="924" y="271" font-size="20" font-weight="600" fill="#111827">Atomic variable</text>

  <g filter="url(#l10dp-soft)">
    <rect x="40" y="376" width="720" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="376" width="6" height="112" fill="#64748B" clip-path="url(#l10dp-k5)"/>
  </g>
  <circle cx="78" cy="432" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,421.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="439" font-size="20" font-weight="600" fill="#111827">Step 3: Must several steps or values change together?</text>

  <g filter="url(#l10dp-soft)">
    <rect x="860" y="376" width="340" height="112" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="376" width="6" height="112" fill="#059669" clip-path="url(#l10dp-k6)"/>
  </g>
  <circle cx="898" cy="432" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,421.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="924" y="439" font-size="20" font-weight="600" fill="#111827">Mutex</text>

  <g filter="url(#l10dp-soft)">
    <rect x="40" y="544" width="720" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="544" width="6" height="112" fill="#64748B" clip-path="url(#l10dp-k7)"/>
  </g>
  <circle cx="78" cy="600" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,589.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="607" font-size="20" font-weight="600" fill="#111827">Step 4: Must you limit how many threads do something at once?</text>

  <g filter="url(#l10dp-soft)">
    <rect x="860" y="544" width="340" height="112" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="544" width="6" height="112" fill="#059669" clip-path="url(#l10dp-k8)"/>
  </g>
  <circle cx="898" cy="600" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,589.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="924" y="607" font-size="20" font-weight="600" fill="#111827">Semaphore</text>

  <g filter="url(#l10dp-soft)">
    <rect x="40" y="712" width="720" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="712" width="6" height="112" fill="#64748B" clip-path="url(#l10dp-k9)"/>
  </g>
  <circle cx="78" cy="768" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,757.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="775" font-size="20" font-weight="600" fill="#111827">Step 5: Must a thread wait until something becomes true?</text>

  <g filter="url(#l10dp-soft)">
    <rect x="860" y="712" width="340" height="112" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="712" width="6" height="112" fill="#059669" clip-path="url(#l10dp-k10)"/>
  </g>
  <circle cx="898" cy="768" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,757.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="924" y="775" font-size="20" font-weight="600" fill="#111827">Condition variable</text>

  <g filter="url(#l10dp-soft)">
    <rect x="40" y="880" width="720" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="880" width="6" height="112" fill="#64748B" clip-path="url(#l10dp-k11)"/>
  </g>
  <circle cx="78" cy="936" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,925.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="929" font-size="20" font-weight="600" fill="#111827">Step 6: Must a group of threads all reach one point</text>
  <text x="104" y="957" font-size="20" font-weight="600" fill="#111827">before any goes on?</text>

  <g filter="url(#l10dp-soft)">
    <rect x="860" y="880" width="340" height="112" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="880" width="6" height="112" fill="#059669" clip-path="url(#l10dp-k12)"/>
  </g>
  <circle cx="898" cy="936" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,925.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="924" y="943" font-size="20" font-weight="600" fill="#111827">Barrier</text>

  <g filter="url(#l10dp-soft)">
    <rect x="40" y="1048" width="720" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="1048" width="6" height="112" fill="#64748B" clip-path="url(#l10dp-k13)"/>
  </g>
  <circle cx="78" cy="1104" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,1093.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="1111" font-size="20" font-weight="600" fill="#111827">Step 7: Do you have many small tasks?</text>

  <g filter="url(#l10dp-soft)">
    <rect x="860" y="1048" width="340" height="112" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="1048" width="6" height="112" fill="#059669" clip-path="url(#l10dp-k14)"/>
  </g>
  <circle cx="898" cy="1104" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,1093.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="924" y="1111" font-size="20" font-weight="600" fill="#111827">Thread pool</text>

  <text x="1030" y="518" font-size="20" text-anchor="middle" fill="#6B7280">or a read/write lock</text>
  <text x="1030" y="686" font-size="20" text-anchor="middle" fill="#6B7280">with that many permits</text>
  <text x="1030" y="854" font-size="20" text-anchor="middle" fill="#6B7280">or a bounded blocking queue</text>
  <text x="1030" y="1190" font-size="20" text-anchor="middle" fill="#6B7280">then go back to Step 1</text>

  <rect x="40" y="1226" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1271" text-anchor="middle" font-size="20" fill="#475569">Ask the questions in order, and the first yes points to the tool.</text>
</svg>