<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="824" viewBox="0 0 1240 824" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="loop-title loop-desc">
<title id="loop-title">What changes when it is not one call</title>
<desc id="loop-desc">The demo is impressive and the production version is hard, and the gap has a precise cause: a loop is a distributed workflow with state, partial failure and no fixed duration.</desc>
<defs>
<marker id="loop-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="loop-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="loop-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="loop-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="824" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What changes when it is not one call</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The demo is impressive and the production version is hard, and the gap has a precise cause.</text>
<rect x="40" y="746" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="746" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="248" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="164" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">decide</text>
<path d="M294 145H324" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M294 145H324" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-marker-slate)"/>
<rect x="330" y="118" width="248" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="454" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">call a tool</text>
<path d="M584 145H614" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M584 145H614" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-marker-slate)"/>
<rect x="620" y="118" width="248" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="744" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">see the result</text>
<path d="M874 145H904" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M874 145H904" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-marker-slate)"/>
<rect x="910" y="118" width="248" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1034" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">decide again</text>
<path d="M1158 182C1158 214 164 214 164 182" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1158 182C1158 214 164 214 164 182" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-marker-slate)"/>
<text x="661" y="238" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">until it stops</text>
<rect x="40" y="258" width="560" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="258" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="64" y="289" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A single call</text><text x="64" y="315" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a stateless function, one failure mode</text>
<rect x="640" y="258" width="560" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="258" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="664" y="289" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A loop</text><text x="664" y="315" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a distributed workflow, no fixed duration</text>
<text x="40" y="366" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Four properties create the difficulty</text>
<rect x="40" y="384" width="440" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="260" y="417" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Duration is unbounded</text>
<path d="M486 411H520" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M486 411H520" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-marker-slate)"/>
<rect x="530" y="384" width="670" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="417" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">three steps or thirty, and nothing up front distinguishes them</text>
<rect x="40" y="450" width="440" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="260" y="483" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Failure is partial</text>
<path d="M486 477H520" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M486 477H520" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-marker-slate)"/>
<rect x="530" y="450" width="670" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="483" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">step four failed and the first three had effects. No transaction</text>
<rect x="40" y="516" width="440" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="260" y="549" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The control flow is not yours</text>
<path d="M486 543H520" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M486 543H520" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-marker-slate)"/>
<rect x="530" y="516" width="670" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="549" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">chosen at runtime by a non-deterministic component</text>
<rect x="40" y="582" width="440" height="54" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="260" y="615" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Actions have outside effects</text>
<path d="M486 609H520" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M486 609H520" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-marker-slate)"/>
<rect x="530" y="582" width="670" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="615" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an agent that sends an email cannot un-send it</text>
<rect x="40" y="660" width="1160" height="60" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="660" width="5" height="60" rx="2.5" fill="#AC8BE8"/><text x="64" y="696" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A single call is a request. An agent is a workflow, and it needs what workflows need.</text>
<text x="66" y="780" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Durable state, idempotency, timeouts, budgets, blast radius and observability. All familiar subjects.</text>
</svg>