  <text x="64" y="176" font-size="18.5" fill="#475569">Multiple units update the same key</text>
  <text x="64" y="202" font-size="18.5" fill="#475569">at the same time.</text>
  <text x="664" y="176" font-size="18.5" fill="#475569">Updates arrive at different units and may be</text>
  <text x="664" y="202" font-size="18.5" fill="#475569">applied in different orders.</text>
  <text x="64" y="746" font-size="18.5" fill="#475569">Without proper conflict handling, units can end up</text>
  <text x="64" y="772" font-size="18.5" fill="#475569">with different values temporarily.</text>
  <text x="664" y="746" font-size="18.5" fill="#475569">Give each key a single owner, check versions on</text>
  <text x="664" y="772" font-size="18.5" fill="#475569">that owner, or resolve collisions with a deterministic rule.</text>

