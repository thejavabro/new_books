  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Data collisions in replicated in-memory grids</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">When several processing units update the same key at once, they can end up holding different values.</text>

