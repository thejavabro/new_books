  <rect x="640" y="688" width="560" height="530" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="718" font-size="19.5" font-weight="600" fill="#047857">4. How to handle collisions</text>

