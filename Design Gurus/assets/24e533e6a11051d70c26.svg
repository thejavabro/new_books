<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-label="A load balancer spreads requests across identical servers and stops sending traffic to any server that fails its health check, so a dead machine does not reach users.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="500" fill="#FFFFFF"/>
  <rect x="45" y="193" width="170" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="130" y="237" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Clients</text>
  <rect x="320" y="182" width="220" height="96" rx="10" fill="#F1F5F9" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="430" y="228" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Load balancer</text>
  <text x="430" y="253" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">picks a machine</text>
  <rect x="730" y="41" width="300" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="78" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server 1</text>
  <text x="880" y="103" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">healthy</text>
  <path d="M542 215 C 660 215, 660 80, 726 80" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <path d="M1046 76 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="730" y="151" width="300" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="188" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server 2</text>
  <text x="880" y="213" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">healthy</text>
  <path d="M542 225 C 660 225, 660 190, 726 190" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <path d="M1046 186 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="730" y="261" width="300" height="78" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="298" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server 3</text>
  <text x="880" y="323" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">failed health check</text>
  <path d="M542 235 C 660 235, 660 300, 726 300" fill="none" stroke="#FCA5A5" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M1040 289 l16 16 M1056 289 l-16 16" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="583" y="257" width="114" height="30" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <text x="640" y="278" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">no traffic</text>
  <rect x="730" y="371" width="300" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="408" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server 4</text>
  <text x="880" y="433" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">healthy</text>
  <path d="M542 245 C 660 245, 660 410, 726 410" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <path d="M1046 406 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="216" y1="230" x2="318" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="40" y="476" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Two jobs, not one: spread the work, and take a failed server out of rotation before users notice.</text>
</svg>