<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rows. The top row shows users sending requests to one web server which reads from one database, with a ceiling of about 400 requests per second. The bottom row shows users sending requests to a load balancer, which spreads them across three web servers, all of which read and write the same shared database.">
  <defs>
    <filter id="sdf1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sdf1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sdf1-k1"><rect x="80" y="200" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sdf1-k2"><rect x="420" y="200" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="sdf1-k3"><rect x="80" y="560" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sdf1-k4"><rect x="380" y="560" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="sdf1-k5"><rect x="730" y="470" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sdf1-k6"><rect x="730" y="600" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sdf1-k7"><rect x="730" y="730" width="240" height="90" rx="12"/></clipPath>
    <marker id="sdf1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="sdf1-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="sdf1-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1120" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">From one server to many</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A server has a capacity you can calculate. Passing it is a structural problem, not a coding problem.</text>

  <rect x="40" y="110" width="1160" height="270" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#475569">One server: about 400 requests per second</text>
  <rect x="40" y="420" width="1160" height="440" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="450" font-size="19.5" font-weight="600" fill="#1D4ED8">Many servers: the same work spread out</text>

  <g fill="none" stroke-width="2">
    <path d="M300,245 H420" stroke="#2563EB" marker-end="url(#sdf1-m-blue)"/>
    <path d="M710,245 H840" stroke="#D97706" marker-end="url(#sdf1-m-amber)"/>
    <path d="M300,605 H380" stroke="#2563EB" marker-end="url(#sdf1-m-blue)"/>
    <path d="M660,585 H690 Q710,585 710,565 V515 H730" stroke="#7C3AED" marker-end="url(#sdf1-m-violet)"/>
    <path d="M660,605 H730" stroke="#7C3AED" marker-end="url(#sdf1-m-violet)"/>
    <path d="M660,625 H690 Q710,625 710,645 V775 H730" stroke="#7C3AED" marker-end="url(#sdf1-m-violet)"/>
    <path d="M970,515 H1000 Q1015,515 1015,530 V635 Q1015,650 1030,650" stroke="#D97706" marker-end="url(#sdf1-m-amber)"/>
    <path d="M970,645 H1030" stroke="#D97706" marker-end="url(#sdf1-m-amber)"/>
    <path d="M970,775 H1000 Q1015,775 1015,760 V665 Q1015,650 1030,650" stroke="#D97706" marker-end="url(#sdf1-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="360" y="232" fill="#1D4ED8">requests</text>
    <text x="775" y="232" fill="#B45309">reads</text>
    <text x="340" y="592" fill="#1D4ED8">requests</text>
    <text x="520" y="545" fill="#5B21B6">spreads across three</text>
    <text x="1115" y="575" fill="#047857">all three write here</text>
  </g>

  <g filter="url(#sdf1-soft)">
    <rect x="80" y="200" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="200" width="6" height="90" fill="#2563EB" clip-path="url(#sdf1-k1)"/>
  </g>
  <circle cx="118" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,234.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="144" y="252" font-size="21.5" font-weight="600" fill="#111827">Users</text>
  <text x="190" y="319" font-size="18.5" text-anchor="middle" fill="#6B7280">20,000 in one hour</text>
  <g filter="url(#sdf1-lift)">
    <rect x="420" y="200" width="290" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="420" y="200" width="9" height="90" fill="#D97706" clip-path="url(#sdf1-k2)"/>
  </g>
  <circle cx="458" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,234.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="484" y="252" font-size="21.5" font-weight="600" fill="#111827">Web Server</text>
  <text x="565" y="319" font-size="18.5" text-anchor="middle" fill="#6B7280">8 cores, 20 ms per request</text>
  <text x="565" y="346" font-size="18.5" text-anchor="middle" fill="#94A3B8">about 400 per second</text>
  <g filter="url(#sdf1-soft)">
    <rect x="80" y="560" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="560" width="6" height="90" fill="#2563EB" clip-path="url(#sdf1-k3)"/>
  </g>
  <circle cx="118" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,594.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="144" y="612" font-size="21.5" font-weight="600" fill="#111827">Users</text>
  <text x="190" y="679" font-size="18.5" text-anchor="middle" fill="#6B7280">2,000 per second</text>
  <g filter="url(#sdf1-lift)">
    <rect x="380" y="560" width="280" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="380" y="560" width="9" height="90" fill="#7C3AED" clip-path="url(#sdf1-k4)"/>
  </g>
  <circle cx="418" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(407.56,594.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="444" y="612" font-size="21.5" font-weight="600" fill="#111827">Load Balancer</text>
  <text x="520" y="679" font-size="18.5" text-anchor="middle" fill="#6B7280">picks one server</text>
  <text x="520" y="706" font-size="18.5" text-anchor="middle" fill="#94A3B8">skips a dead one</text>
  <g filter="url(#sdf1-soft)">
    <rect x="730" y="470" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="730" y="470" width="6" height="90" fill="#D97706" clip-path="url(#sdf1-k5)"/>
  </g>
  <circle cx="768" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,504.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="794" y="522" font-size="21.5" font-weight="600" fill="#111827">Web Server 1</text>
  <g filter="url(#sdf1-soft)">
    <rect x="730" y="600" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="730" y="600" width="6" height="90" fill="#D97706" clip-path="url(#sdf1-k6)"/>
  </g>
  <circle cx="768" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,634.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="794" y="652" font-size="21.5" font-weight="600" fill="#111827">Web Server 2</text>
  <g filter="url(#sdf1-soft)">
    <rect x="730" y="730" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="730" y="730" width="6" height="90" fill="#D97706" clip-path="url(#sdf1-k7)"/>
  </g>
  <circle cx="768" cy="775" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,764.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="794" y="782" font-size="21.5" font-weight="600" fill="#111827">Web Server 3</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M840,200 L840,284 A130,16 0 0 0 1100,284 L1100,200" fill="#D1FAE5"/>
    <ellipse cx="970" cy="200" rx="130" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="970" y="257" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="970" y="334" font-size="18.5" text-anchor="middle" fill="#6B7280">recipes and saved lists</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M1030,600 L1030,684 A75,16 0 0 0 1180,684 L1180,600" fill="#D1FAE5"/>
    <ellipse cx="1105" cy="600" rx="75" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="1105" y="657" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="1105" y="734" font-size="18.5" text-anchor="middle" fill="#6B7280">one shared copy</text>

  <rect x="40" y="880" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="905" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="930" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">The ceiling</text>
  <text x="323" y="930" font-size="18.5" fill="#475569">one second divided by 20 ms is 50 requests per core, and 8 cores give about 400 per second</text>
  <rect x="64" y="955" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="980" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Load balancer</text>
  <text x="323" y="980" font-size="18.5" fill="#475569">something must decide which server answers each request, and notice when one of them dies</text>
  <rect x="64" y="1005" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="1030" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Shared data</text>
  <text x="323" y="1030" font-size="18.5" fill="#475569">a recipe saved through one server must be visible through the next one</text>
</svg>