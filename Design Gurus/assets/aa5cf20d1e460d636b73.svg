<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six stage plugin lifecycle: discover and load plugin classes from a directory or a list in code, read their metadata and validate compatibility with the core version, register them with the plugin registry, initialize by creating the instance and calling initialize, active and handling requests with repeated health checks, and shutdown by calling shutdown and unloading it; a failure in validation or initialization leads to an error and the plugin is not loaded">
  <defs>
    <filter id="m09h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m09h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m09h-k1"><rect x="40" y="130" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m09h-k2"><rect x="430" y="130" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m09h-k3"><rect x="820" y="130" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m09h-k4"><rect x="820" y="355" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m09h-k5"><rect x="430" y="355" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m09h-k6"><rect x="40" y="355" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="m09h-k7"><rect x="640" y="545" width="520" height="90" rx="12"/></clipPath>
    <marker id="m09h-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m09h-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Plugin lifecycle: from discovery to shutdown</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A plugin is discovered, validated, registered, initialized, used and shut down.</text>



  <g fill="none" stroke-width="2">
    <path d="M380,175 H430" stroke="#64748B" marker-end="url(#m09h-m-slate)"/>
    <path d="M770,175 H820" stroke="#64748B" marker-end="url(#m09h-m-slate)"/>
    <path d="M1135,220 V355" stroke="#64748B" marker-end="url(#m09h-m-slate)"/>
    <path d="M820,400 H770" stroke="#64748B" marker-end="url(#m09h-m-slate)"/>
    <path d="M430,400 H380" stroke="#64748B" marker-end="url(#m09h-m-slate)"/>
    <path d="M740,130 V124 Q740,112 752,112 H1193 Q1205,112 1205,124 V578 Q1205,590 1193,590 H1160" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#m09h-m-pink)"/>
    <path d="M1160,400 H1205" stroke="#DB2777" stroke-dasharray="7 6"/>
    <path d="M560,355 V327 Q560,315 572,315 H628 Q640,315 640,327 V355" stroke="#64748B" marker-end="url(#m09h-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="652" y="341" fill="#475569" text-anchor="start">health_check()</text>
  </g>

  <g filter="url(#m09h-soft)">
    <rect x="40" y="130" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#m09h-k1)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">1. Discover</text>
  <text x="210" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">find and load plugin classes</text>
  <text x="210" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">(a directory, or a list in code)</text>
  <g filter="url(#m09h-soft)">
    <rect x="430" y="130" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="430" y="130" width="6" height="90" fill="#D97706" clip-path="url(#m09h-k2)"/>
  </g>
  <circle cx="468" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,164.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="494" y="182" font-size="21.5" font-weight="600" fill="#111827">2. Validate</text>
  <text x="600" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">read metadata and check</text>
  <text x="600" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">compatibility with the core version</text>
  <g filter="url(#m09h-soft)">
    <rect x="820" y="130" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="820" y="130" width="6" height="90" fill="#059669" clip-path="url(#m09h-k3)"/>
  </g>
  <circle cx="858" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="884" y="182" font-size="21.5" font-weight="600" fill="#111827">3. Register</text>
  <text x="990" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">register the plugin</text>
  <text x="990" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">with the plugin registry</text>
  <g filter="url(#m09h-soft)">
    <rect x="820" y="355" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="820" y="355" width="6" height="90" fill="#7C3AED" clip-path="url(#m09h-k4)"/>
  </g>
  <circle cx="858" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,389.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="884" y="407" font-size="21.5" font-weight="600" fill="#111827">4. Initialize</text>
  <text x="990" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">create the instance and call</text>
  <text x="990" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">its initialize() method</text>
  <g filter="url(#m09h-soft)">
    <rect x="430" y="355" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="430" y="355" width="6" height="90" fill="#059669" clip-path="url(#m09h-k5)"/>
  </g>
  <circle cx="468" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,389.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="494" y="407" font-size="21.5" font-weight="600" fill="#111827">5. Active</text>
  <text x="600" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">plugin is ready</text>
  <text x="600" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">to handle requests</text>
  <g filter="url(#m09h-soft)">
    <rect x="40" y="355" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="40" y="355" width="6" height="90" fill="#DB2777" clip-path="url(#m09h-k6)"/>
  </g>
  <circle cx="78" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,389.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="104" y="407" font-size="21.5" font-weight="600" fill="#111827">6. Shutdown</text>
  <text x="210" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">call the plugin's shutdown()</text>
  <text x="210" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">method and unload it</text>
  <g filter="url(#m09h-soft)">
    <rect x="640" y="545" width="520" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="640" y="545" width="6" height="90" fill="#DB2777" clip-path="url(#m09h-k7)"/>
  </g>
  <circle cx="678" cy="590" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,579.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/></g>
  <text x="704" y="597" font-size="21.5" font-weight="600" fill="#111827">Error</text>
  <text x="900" y="664" font-size="18.5" text-anchor="middle" fill="#6B7280">failed validation or initialization</text>
  <text x="900" y="691" font-size="18.5" text-anchor="middle" fill="#94A3B8">(plugin not loaded)</text>




</svg>