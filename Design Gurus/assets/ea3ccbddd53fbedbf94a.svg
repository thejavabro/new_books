<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three tiers. Tier 1, the presentation tier: a browser, mobile or desktop app plus the web server that serves it; it handles user interface and user interactions, sends requests to the application tier over HTTP or HTTPS, and renders responses from the application tier. It sends an HTTP or HTTPS request to tier 2, the application tier: an application server in Python, Java, Go and so on, which runs business logic, validates requests, calls the data tier and returns HTML or JSON responses. It sends queries over a database protocol (TCP) to tier 3, the data tier: a database server such as PostgreSQL or MySQL, which stores and manages data, executes queries, ensures integrity, transactions and persistence, and returns query results">
  <defs>
    <filter id="m03d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m03d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m03d-k1"><rect x="64" y="200" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="m03d-k2"><rect x="64" y="490" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="m03d-k3"><rect x="64" y="780" width="440" height="90" rx="12"/></clipPath>
    <marker id="m03d-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m03d-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three-tier architecture: presentation, application, and data tiers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Requests travel down through the tiers and responses travel back up.</text>

  <rect x="40" y="120" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Presentation tier (Tier 1)</text>
  <rect x="40" y="410" width="1160" height="200" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="440" font-size="19.5" font-weight="600" fill="#047857">Application tier (Tier 2)</text>
  <rect x="40" y="700" width="1160" height="200" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="730" font-size="19.5" font-weight="600" fill="#5B21B6">Data tier (Tier 3)</text>

  <g fill="none" stroke-width="2">
    <path d="M300,290 V490" stroke="#2563EB" marker-end="url(#m03d-m-blue)"/>
    <path d="M408,490 V290" stroke="#059669" marker-end="url(#m03d-m-emerald)"/>
    <path d="M300,580 V780" stroke="#2563EB" marker-end="url(#m03d-m-blue)"/>
    <path d="M408,780 V580" stroke="#059669" marker-end="url(#m03d-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="288" y="358" fill="#1D4ED8" text-anchor="end">HTTP/HTTPS</text>
    <text x="288" y="382" fill="#1D4ED8" text-anchor="end">(request)</text>
    <text x="420" y="358" fill="#047857" text-anchor="start">Response</text>
    <text x="420" y="382" fill="#047857" text-anchor="start">(HTML/JSON)</text>
    <text x="288" y="648" fill="#1D4ED8" text-anchor="end">Database protocol</text>
    <text x="288" y="672" fill="#1D4ED8" text-anchor="end">(TCP)</text>
    <text x="420" y="648" fill="#047857" text-anchor="start">Query results</text>
    <text x="420" y="672" fill="#047857" text-anchor="start">(data)</text>
  </g>

  <g filter="url(#m03d-soft)">
    <rect x="64" y="200" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="200" width="6" height="90" fill="#2563EB" clip-path="url(#m03d-k1)"/>
  </g>
  <circle cx="102" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,234.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="239.25" font-size="21.5" font-weight="600" fill="#111827">Browser, mobile or desktop app</text>
  <text x="128" y="264.75" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#m03d-soft)">
    <rect x="64" y="490" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="490" width="6" height="90" fill="#059669" clip-path="url(#m03d-k2)"/>
  </g>
  <circle cx="102" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,524.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="128" y="529.25" font-size="21.5" font-weight="600" fill="#111827">Application server</text>
  <text x="128" y="554.75" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#m03d-soft)">
    <rect x="64" y="780" width="440" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="780" width="6" height="90" fill="#7C3AED" clip-path="url(#m03d-k3)"/>
  </g>
  <circle cx="102" cy="825" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,814.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="128" y="819.25" font-size="21.5" font-weight="600" fill="#111827">Database server</text>
  <text x="128" y="844.75" font-size="21.5" font-weight="600" fill="#111827"></text>
  <text x="128" y="264.75" font-size="18.5" fill="#4B5563">plus the web server that serves it</text>
  <text x="128" y="554.75" font-size="18.5" fill="#4B5563">Python, Java, Go, and so on</text>
  <text x="128" y="844.75" font-size="18.5" fill="#4B5563">PostgreSQL, MySQL, and so on</text>

  <circle cx="560" cy="204" r="3.5" fill="#2563EB"/>
  <text x="574" y="210" font-size="18.5" fill="#1F2937">Handles user interface and user interactions</text>
  <circle cx="560" cy="232" r="3.5" fill="#2563EB"/>
  <text x="574" y="238" font-size="18.5" fill="#1F2937">Sends requests to the application tier (HTTP or HTTPS)</text>
  <circle cx="560" cy="260" r="3.5" fill="#2563EB"/>
  <text x="574" y="266" font-size="18.5" fill="#1F2937">Renders responses from the application tier</text>
  <circle cx="560" cy="484" r="3.5" fill="#059669"/>
  <text x="574" y="490" font-size="18.5" fill="#1F2937">Runs business logic and application code</text>
  <circle cx="560" cy="512" r="3.5" fill="#059669"/>
  <text x="574" y="518" font-size="18.5" fill="#1F2937">Validates requests and processes data</text>
  <circle cx="560" cy="540" r="3.5" fill="#059669"/>
  <text x="574" y="546" font-size="18.5" fill="#1F2937">Calls the data tier (for example, SQL queries)</text>
  <circle cx="560" cy="568" r="3.5" fill="#059669"/>
  <text x="574" y="574" font-size="18.5" fill="#1F2937">Returns results to the presentation tier (JSON or HTML)</text>
  <circle cx="560" cy="774" r="3.5" fill="#7C3AED"/>
  <text x="574" y="780" font-size="18.5" fill="#1F2937">Stores and manages data</text>
  <circle cx="560" cy="802" r="3.5" fill="#7C3AED"/>
  <text x="574" y="808" font-size="18.5" fill="#1F2937">Executes queries from the application tier</text>
  <circle cx="560" cy="830" r="3.5" fill="#7C3AED"/>
  <text x="574" y="836" font-size="18.5" fill="#1F2937">Ensures data integrity, transactions, and persistence</text>
  <circle cx="560" cy="858" r="3.5" fill="#7C3AED"/>
  <text x="574" y="864" font-size="18.5" fill="#1F2937">Returns query results to the application tier</text>


</svg>