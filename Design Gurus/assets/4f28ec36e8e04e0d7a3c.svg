<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="938" viewBox="0 0 1240 938" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two ways to coordinate a saga. In choreography each service reacts to events published by the previous service and there is no coordinator. In orchestration a single saga orchestrator tells each service when to run and collects its reply">
  <defs>
    <marker id="sg2-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="sg2-in" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>

    <filter id="sg2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sg2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="sg2-k1"><rect x="72" y="110" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="sg2-k2"><rect x="490" y="110" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="sg2-k3"><rect x="908" y="110" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="sg2-k4"><rect x="490" y="386" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="sg2-k5"><rect x="72" y="560" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="sg2-k6"><rect x="490" y="560" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="sg2-k7"><rect x="908" y="560" width="260" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="938" fill="#FFFFFF"/>

  
  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Choreography: no coordinator, each service reacts to the event before it</text>

  <rect x="40" y="330" width="1160" height="410" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#4338CA">Orchestration: one coordinator tells each service when to run</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M332,155 L486,155" marker-end="url(#sg2-bl)"/>
    <path d="M750,155 L904,155" marker-end="url(#sg2-bl)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="409" y="148" fill="#1D4ED8">OrderCreated</text>
    <text x="829" y="148" fill="#1D4ED8">PaymentTaken</text>
  </g>

  
  <g fill="none" stroke="#4F46E5" stroke-width="2">
    <path d="M620,476 L620,494 Q620,506 608,506 L214,506 Q202,506 202,518 L202,556" marker-end="url(#sg2-in)"/>
    <path d="M620,476 L620,556" marker-end="url(#sg2-in)"/>
    <path d="M620,476 L620,494 Q620,506 632,506 L1026,506 Q1038,506 1038,518 L1038,556" marker-end="url(#sg2-in)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="202" y="540" fill="#4338CA">step 1</text>
    <text x="620" y="540" fill="#4338CA">step 2</text>
    <text x="1038" y="540" fill="#4338CA">step 3</text>
  </g>

  
  <g filter="url(#sg2-soft)">
    <rect x="72" y="110" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#sg2-k1)"/>
  </g>
  <circle cx="110" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="162" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="202" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">creates the order</text>
  <text x="202" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">then publishes an event</text>

  <g filter="url(#sg2-soft)">
    <rect x="490" y="110" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="490" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#sg2-k2)"/>
  </g>
  <circle cx="528" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="5" width="20" height="14" rx="2"/>
    <path d="M2 10h20"/>
  </g>
  <text x="554" y="162" font-size="18.5" font-weight="600" fill="#111827">Payment Service</text>
  <text x="620" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">subscribes to that event</text>
  <text x="620" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">then publishes its own</text>

  <g filter="url(#sg2-soft)">
    <rect x="908" y="110" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="908" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#sg2-k3)"/>
  </g>
  <circle cx="946" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(935.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="6" width="13" height="10" rx="1.5"/>
    <path d="M14.5 9.5h4l3 3.5v3h-7z"/>
    <circle cx="6" cy="18" r="1.8"/>
    <circle cx="17" cy="18" r="1.8"/>
  </g>
  <text x="972" y="162" font-size="18.5" font-weight="600" fill="#111827">Shipping Service</text>
  <text x="1038" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">subscribes and ships</text>
  <text x="1038" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">the chain ends here</text>

  
  <g filter="url(#sg2-lift)">
    <rect x="490" y="386" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="490" y="386" width="9" height="90" fill="#4F46E5" clip-path="url(#sg2-k4)"/>
  </g>
  <circle cx="528" cy="431" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,420.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="554" y="438" font-size="18.5" font-weight="600" fill="#111827">Saga Orchestrator</text>

  <g filter="url(#sg2-soft)">
    <rect x="72" y="560" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="72" y="560" width="6" height="90" fill="#4F46E5" clip-path="url(#sg2-k5)"/>
  </g>
  <circle cx="110" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,594.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="612" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="202" y="675" font-size="15.5" text-anchor="middle" fill="#6B7280">told to create the order</text>
  <text x="202" y="698" font-size="15.5" text-anchor="middle" fill="#94A3B8">replies when it is done</text>

  <g filter="url(#sg2-soft)">
    <rect x="490" y="560" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="490" y="560" width="6" height="90" fill="#4F46E5" clip-path="url(#sg2-k6)"/>
  </g>
  <circle cx="528" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,594.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="5" width="20" height="14" rx="2"/>
    <path d="M2 10h20"/>
  </g>
  <text x="554" y="612" font-size="18.5" font-weight="600" fill="#111827">Payment Service</text>
  <text x="620" y="675" font-size="15.5" text-anchor="middle" fill="#6B7280">told to charge the card</text>
  <text x="620" y="698" font-size="15.5" text-anchor="middle" fill="#94A3B8">replies when it is done</text>

  <g filter="url(#sg2-soft)">
    <rect x="908" y="560" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="908" y="560" width="6" height="90" fill="#4F46E5" clip-path="url(#sg2-k7)"/>
  </g>
  <circle cx="946" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(935.56,594.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="6" width="13" height="10" rx="1.5"/>
    <path d="M14.5 9.5h4l3 3.5v3h-7z"/>
    <circle cx="6" cy="18" r="1.8"/>
    <circle cx="17" cy="18" r="1.8"/>
  </g>
  <text x="972" y="612" font-size="18.5" font-weight="600" fill="#111827">Shipping Service</text>
  <text x="1038" y="675" font-size="15.5" text-anchor="middle" fill="#6B7280">told to book shipping</text>
  <text x="1038" y="698" font-size="15.5" text-anchor="middle" fill="#94A3B8">replies when it is done</text>

  
  <rect x="40" y="770" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="794" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="816" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Choreography</text>
  <text x="288" y="816" font-size="15.5" fill="#475569">simpler to start, but no single place shows how far the saga has got</text>

  <rect x="64" y="838" width="200" height="32" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="164" y="860" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">Orchestration</text>
  <text x="288" y="860" font-size="15.5" fill="#475569">one more service to run and keep available, in exchange for visible progress and easier undo</text>
</svg>