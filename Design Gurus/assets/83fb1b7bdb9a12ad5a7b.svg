<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One existing API contract in the center, with four groups of hard-part questions around it: failure, safety, change over time, and speed and freshness. Each group carries two representative questions. The chapter strengthens the contract already designed rather than adding four separate feature sets.">
  <defs>
    <marker id="pz-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="pz-vm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="pz-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="pz-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="pz-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pz-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pz-k1"><rect x="90" y="118" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="pz-k2"><rect x="830" y="118" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="pz-k3"><rect x="90" y="350" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="pz-k4"><rect x="830" y="350" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="pz-k5"><rect x="470" y="234" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="480" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Four kinds of hard-part question</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">two representative questions in each group</text>

  
  <g fill="none" stroke-width="2">
    <path d="M470,254 H446 Q434,254 434,242 V175 Q434,163 422,163 H410" stroke="#DB2777" marker-end="url(#pz-pm)"/>
    <path d="M770,254 H794 Q806,254 806,242 V175 Q806,163 818,163 H830" stroke="#7C3AED" marker-end="url(#pz-vm)"/>
    <path d="M470,304 H446 Q434,304 434,316 V383 Q434,395 422,395 H410" stroke="#D97706" marker-end="url(#pz-am)"/>
    <path d="M770,304 H794 Q806,304 806,316 V383 Q806,395 818,395 H830" stroke="#059669" marker-end="url(#pz-em)"/>
  </g>

  
  <g filter="url(#pz-soft)">
    <rect x="90" y="118" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="90" y="118" width="6" height="90" fill="#DB2777" clip-path="url(#pz-k1)"/>
  </g>
  <circle cx="128" cy="163" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,152.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="154" y="170" font-size="18.5" font-weight="600" fill="#111827">Failure</text>
  <text x="250" y="233" text-anchor="middle" font-size="15.5" fill="#6B7280">Is a timed-out write safe to repeat?</text>
  <text x="250" y="256" text-anchor="middle" font-size="15.5" fill="#94A3B8">Which responses may be retried?</text>

  
  <g filter="url(#pz-soft)">
    <rect x="830" y="118" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="830" y="118" width="6" height="90" fill="#7C3AED" clip-path="url(#pz-k2)"/>
  </g>
  <circle cx="868" cy="163" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,152.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="894" y="170" font-size="18.5" font-weight="600" fill="#111827">Safety</text>
  <text x="990" y="233" text-anchor="middle" font-size="15.5" fill="#6B7280">Does the credential carry the scope?</text>
  <text x="990" y="256" text-anchor="middle" font-size="15.5" fill="#94A3B8">May we reveal that it exists?</text>

  
  <g filter="url(#pz-soft)">
    <rect x="90" y="350" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="90" y="350" width="6" height="90" fill="#D97706" clip-path="url(#pz-k3)"/>
  </g>
  <circle cx="128" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,384.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="154" y="402" font-size="18.5" font-weight="600" fill="#111827">Change over time</text>
  <text x="250" y="465" text-anchor="middle" font-size="15.5" fill="#6B7280">May a response gain a field?</text>
  <text x="250" y="488" text-anchor="middle" font-size="15.5" fill="#94A3B8">When is a new version justified?</text>

  
  <g filter="url(#pz-soft)">
    <rect x="830" y="350" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="830" y="350" width="6" height="90" fill="#059669" clip-path="url(#pz-k4)"/>
  </g>
  <circle cx="868" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,384.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="894" y="402" font-size="18.5" font-weight="600" fill="#111827">Speed and freshness</text>
  <text x="990" y="465" text-anchor="middle" font-size="15.5" fill="#6B7280">Does the writer see its own change?</text>
  <text x="990" y="488" text-anchor="middle" font-size="15.5" fill="#94A3B8">How long may a copy be reused?</text>

  
  <g filter="url(#pz-lift)">
    <rect x="470" y="234" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="470" y="234" width="9" height="90" fill="#64748B" clip-path="url(#pz-k5)"/>
  </g>
  <circle cx="508" cy="279" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,268.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="534" y="286" font-size="18.5" font-weight="600" fill="#111827">Existing API contract</text>

  
  <rect x="40" y="544" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="589" text-anchor="middle" font-size="16" fill="#475569">This chapter strengthens the contract you already designed. It does not begin a second API.</text>
</svg>