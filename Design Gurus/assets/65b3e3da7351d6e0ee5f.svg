<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="boundaries-title boundaries-desc">
<title id="boundaries-title">Four boundaries, and most designs have one</title>
<desc id="boundaries-desc">Instance, data, deploy and dependency. Cell-based architecture is the data boundary taken seriously, and the arithmetic is the whole argument for it.</desc>
<defs>
<marker id="boundaries-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="boundaries-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="boundaries-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="boundaries-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four boundaries, and most designs have one</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Blast radius is set by four boundaries, and most designs only have the first.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="430" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="305" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The instance boundary</text>
<path d="M526 148H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 148H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">redundancy. Everybody builds this,</text><text x="590" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and it only covers one machine failing</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="430" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="305" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The data boundary</text>
<path d="M526 220H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 220H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="190" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how state is partitioned. One shared</text><text x="590" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">database makes every failure total</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="430" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="305" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The deploy boundary</text>
<path d="M526 292H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 292H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="262" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how far a change gets before it can be stopped</text>
<circle cx="60" cy="364" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="430" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="305" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The dependency boundary</text>
<path d="M526 364H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 364H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="334" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">without a limit here, your radius is</text><text x="590" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">everybody else's added together</text>
<text x="40" y="436" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Cells: several complete copies, each serving a subset, sharing nothing</text>
<rect x="40" y="454" width="1160" height="122" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/>
<text x="72" y="486" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">one shared stack</text>
<text x="540" y="486" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">a failure affects</text>
<text x="1168" y="486" font-size="20" font-weight="700" fill="#A83147" text-anchor="end">100% of customers</text>
<text x="72" y="524" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">ten cells</text>
<text x="540" y="524" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">a failure affects</text>
<text x="1168" y="524" font-size="20" font-weight="700" fill="#91642E" text-anchor="end">10% of customers</text>
<text x="72" y="562" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">ten cells, deployed one at a time</text>
<text x="540" y="562" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">worst case</text>
<text x="1168" y="562" font-size="20" font-weight="700" fill="#169B77" text-anchor="end">10%, usually 0%</text>
<rect x="40" y="596" width="1160" height="70" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="596" width="5" height="70" rx="2.5" fill="#F3CF6A"/><text x="64" y="623.5" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">What cells cost: infrastructure, a routing layer, a customer migration procedure,</text><text x="64" y="650.5" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">and the discipline that nothing is ever shared between them.</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Sharing one thing is always locally convenient, and it quietly rejoins every cell into one.</text>
</svg>