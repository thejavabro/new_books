<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="904" viewBox="0 0 1240 904" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One decision: does the caller act on it independently by id? The no branch leads to a field or embedded value, with shipping_address as the example. The yes branch is supported by two further signals, its own lifecycle and its own permissions, and reaches resource, with Refund as the example.">
  <defs>
    <marker id="xl02resourc-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="xl02resourc-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="xl02resourc-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl02resourc-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl02resourc-k1"><rect x="370" y="104" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="xl02resourc-k2"><rect x="140" y="364" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="xl02resourc-k3"><rect x="84" y="540" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl02resourc-k4"><rect x="684" y="364" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl02resourc-k5"><rect x="684" y="434" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl02resourc-k6"><rect x="740" y="504" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="xl02resourc-k7"><rect x="684" y="680" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="904" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="214" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Resource or field?</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">one question, two outcomes</text>

  
  <rect x="40" y="294" width="556" height="330" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="84" y="324" font-size="16.5" font-weight="600" fill="#475569">If the answer is no</text>

  
  <rect x="644" y="294" width="556" height="470" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="324" font-size="16.5" font-weight="600" fill="#047857">If the answer is yes</text>

  
  <g fill="none" stroke-width="2">
    <path d="M450,194 V228 Q450,240 438,240 H332 Q320,240 320,252 V364" stroke="#64748B" marker-end="url(#xl02resourc-pm)"/>
    <path d="M790,194 V228 Q790,240 802,240 H908 Q920,240 920,252 V364" stroke="#059669" marker-end="url(#xl02resourc-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="385" y="246" fill="#475569">No</text>
    <text x="855" y="246" fill="#047857">Yes</text>
  </g>

  
  <g filter="url(#xl02resourc-lift)">
    <rect x="370" y="104" width="500" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="370" y="104" width="9" height="90" fill="#7C3AED" clip-path="url(#xl02resourc-k1)"/>
  </g>
  <circle cx="408" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(397.56,138.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="434" y="156" font-size="18.5" font-weight="600" fill="#111827">Does the caller act on it independently by id?</text>

  
  <g filter="url(#xl02resourc-soft)">
    <rect x="140" y="364" width="360" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="140" y="364" width="6" height="90" fill="#64748B" clip-path="url(#xl02resourc-k2)"/>
  </g>
  <circle cx="178" cy="409" r="18" fill="#FFFFFF"/>
  <g transform="translate(167.56,398.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="204" y="416" font-size="18.5" font-weight="600" fill="#111827">Field or embedded value</text>
  <text x="320" y="479" font-size="15.5" text-anchor="middle" fill="#6B7280">the caller does not address it by id</text>

  <text x="84" y="524" font-size="15.5" font-weight="600" fill="#475569">Example</text>
  <g filter="url(#xl02resourc-soft)">
    <rect x="84" y="540" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="540" width="6" height="48" fill="#64748B" clip-path="url(#xl02resourc-k3)"/>
  </g>
  <circle cx="118" cy="564" r="4.5" fill="#64748B"/>
  <text x="142" y="571" font-size="18.5" font-weight="600" fill="#111827">shipping_address</text>

  
  <g filter="url(#xl02resourc-soft)">
    <rect x="684" y="364" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="364" width="6" height="48" fill="#059669" clip-path="url(#xl02resourc-k4)"/>
  </g>
  <circle cx="718" cy="388" r="4.5" fill="#059669"/>
  <text x="742" y="395" font-size="18.5" font-weight="600" fill="#111827">Also: own lifecycle</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M920,412 V434" marker-end="url(#xl02resourc-em)"/>
  </g>

  <g filter="url(#xl02resourc-soft)">
    <rect x="684" y="434" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="434" width="6" height="48" fill="#059669" clip-path="url(#xl02resourc-k5)"/>
  </g>
  <circle cx="718" cy="458" r="4.5" fill="#059669"/>
  <text x="742" y="465" font-size="18.5" font-weight="600" fill="#111827">Also: own permissions</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M920,482 V504" marker-end="url(#xl02resourc-em)"/>
  </g>

  
  <g filter="url(#xl02resourc-lift)">
    <rect x="740" y="504" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="740" y="504" width="9" height="90" fill="#059669" clip-path="url(#xl02resourc-k6)"/>
  </g>
  <circle cx="778" cy="549" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,538.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="804" y="556" font-size="18.5" font-weight="600" fill="#111827">Resource</text>
  <text x="920" y="619" font-size="15.5" text-anchor="middle" fill="#6B7280">the caller addresses it by id</text>

  <text x="684" y="664" font-size="15.5" font-weight="600" fill="#047857">Example</text>
  <g filter="url(#xl02resourc-soft)">
    <rect x="684" y="680" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="680" width="6" height="48" fill="#64748B" clip-path="url(#xl02resourc-k7)"/>
  </g>
  <circle cx="718" cy="704" r="4.5" fill="#64748B"/>
  <text x="742" y="711" font-size="18.5" font-weight="600" fill="#111827">Refund</text>

  
  <rect x="40" y="788" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="833" text-anchor="middle" font-size="16" fill="#475569">Identity is the question, not the name.</text>
</svg>