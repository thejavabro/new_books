<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rows comparing where the ID generation code runs. In the library row, the application process holds its own machine number, makes the ID in place in a few instructions with no network call, and inserts the row without contacting anything else. In the service row, the application holds no machine number, calls the ID service over the network at a cost of one to five milliseconds and a new dependency on every write, and only then inserts the row.">
  <defs>
    <filter id="uidls-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="uidls-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="uidls-k1"><rect x="65" y="165" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uidls-k2"><rect x="450" y="165" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uidls-k3"><rect x="835" y="165" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uidls-k4"><rect x="65" y="415" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uidls-k5"><rect x="450" y="415" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uidls-k6"><rect x="835" y="415" width="340" height="90" rx="12"/></clipPath>
    <marker id="uidls-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="uidls-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Two ways to ship the same algorithm</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The bit layout needs no coordination either way. What differs is where the code runs, and what that costs.</text>

  <rect x="40" y="110" width="1160" height="210" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#047857">As a library, running inside the caller</text>
  <rect x="40" y="360" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="390" font-size="19.5" font-weight="600" fill="#1D4ED8">As a service, called over the network</text>

  <g fill="none" stroke-width="2">
    <path d="M405 210 H 444" stroke="#059669" marker-end="url(#uidls-m-emerald)"/>
    <path d="M790 210 H 829" stroke="#059669" marker-end="url(#uidls-m-emerald)"/>
    <path d="M405 460 H 444" stroke="#2563EB" marker-end="url(#uidls-m-blue)"/>
    <path d="M790 460 H 829" stroke="#2563EB" marker-end="url(#uidls-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#uidls-soft)">
    <rect x="65" y="165" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="65" y="165" width="6" height="90" fill="#059669" clip-path="url(#uidls-k1)"/>
  </g>
  <circle cx="103" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,199.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="129" y="217" font-size="21.5" font-weight="600" fill="#111827">Application process</text>
  <text x="235" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">holds its own machine number</text>
  <g filter="url(#uidls-lift)">
    <rect x="450" y="165" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="450" y="165" width="9" height="90" fill="#059669" clip-path="url(#uidls-k2)"/>
  </g>
  <circle cx="488" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,199.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="217" font-size="21.5" font-weight="600" fill="#111827">Makes the ID in place</text>
  <text x="620" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">a few instructions, no network</text>
  <g filter="url(#uidls-soft)">
    <rect x="835" y="165" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="835" y="165" width="6" height="90" fill="#059669" clip-path="url(#uidls-k3)"/>
  </g>
  <circle cx="873" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(862.56,199.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="899" y="217" font-size="21.5" font-weight="600" fill="#111827">Inserts the row</text>
  <text x="1005" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">nothing else was contacted</text>
  <g filter="url(#uidls-soft)">
    <rect x="65" y="415" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="65" y="415" width="6" height="90" fill="#2563EB" clip-path="url(#uidls-k4)"/>
  </g>
  <circle cx="103" cy="460" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,449.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="129" y="467" font-size="21.5" font-weight="600" fill="#111827">Application process</text>
  <text x="235" y="534" font-size="18.5" text-anchor="middle" fill="#6B7280">holds no machine number</text>
  <g filter="url(#uidls-lift)">
    <rect x="450" y="415" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="450" y="415" width="9" height="90" fill="#D97706" clip-path="url(#uidls-k5)"/>
  </g>
  <circle cx="488" cy="460" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,449.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="514" y="467" font-size="21.5" font-weight="600" fill="#111827">Calls the ID service</text>
  <text x="620" y="534" font-size="18.5" text-anchor="middle" fill="#6B7280">1 to 5ms, and a new</text>
  <text x="620" y="561" font-size="18.5" text-anchor="middle" fill="#94A3B8">dependency on every write</text>
  <g filter="url(#uidls-soft)">
    <rect x="835" y="415" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="835" y="415" width="6" height="90" fill="#2563EB" clip-path="url(#uidls-k6)"/>
  </g>
  <circle cx="873" cy="460" r="18" fill="#FFFFFF"/>
  <g transform="translate(862.56,449.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="899" y="467" font-size="21.5" font-weight="600" fill="#111827">Inserts the row</text>
  <text x="1005" y="534" font-size="18.5" text-anchor="middle" fill="#6B7280">blocked until the call returns</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">The library wins</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">On latency, on failure count, and on not making every insert depend on us.</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">The service wins</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">On handing out machine numbers, on many languages, and on changing the format.</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Ship both</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">A library for the heavy generators, the service for everyone else, batched.</text>
</svg>