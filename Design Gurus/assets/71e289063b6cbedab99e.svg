<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="738" viewBox="0 0 1240 738" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="payload-title payload-desc">
<title id="payload-title">The event that carries too little, and too much</title>
<desc id="payload-desc">A thin event forces consumers to call back, turning an asynchronous system synchronous and creating a race against current state. A fat event publishes every internal field as a contract you then cannot change.</desc>
<defs>
<marker id="payload-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="payload-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="payload-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="payload-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="738" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The event that carries too little, and too much</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Every event design sits between two failure modes, and both are common enough to have names.</text>
<rect x="40" y="660" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="660" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="270" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V382A6 6 0 0 0 46 388H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Too thin</text>
<rect x="270" y="128" width="300" height="36" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="420" y="153" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">OrderCreated { order_id }</text>
<rect x="72" y="174" width="500" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the async system becomes synchronous</text>
<rect x="72" y="242" width="500" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the producer takes read load per consumer</text>
<rect x="72" y="310" width="500" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="330.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the callback reads state</text><text x="322" y="357.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">from after the event</text>
<rect x="640" y="118" width="560" height="270" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V382A6 6 0 0 0 646 388H654Z" fill="#F3CF6A"/><text x="670" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Too fat</text>
<rect x="870" y="128" width="300" height="36" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1020" y="153" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">the whole row, serialized</text>
<rect x="672" y="174" width="500" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every field becomes a published contract</text>
<rect x="672" y="242" width="500" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">renaming a column breaks strangers</text>
<rect x="672" y="310" width="500" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">it leaks data, which becomes compliance</text>
<rect x="40" y="412" width="1160" height="106" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="412" width="5" height="106" rx="2.5" fill="#AC8BE8"/><text x="64" y="445" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The race hidden inside a thin event</text><text x="64" y="471" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">By the time the consumer calls back, the order may have been canceled, so it</text><text x="64" y="497" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">processes a creation using data from after the cancellation.</text>
<text x="40" y="560" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">The workable middle</text>
<rect x="40" y="578" width="372" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="612" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">enough to act on</text>
<rect x="434" y="578" width="372" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="612" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">plus the identifier</text>
<rect x="828" y="578" width="372" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1014" y="612" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">plus a version</text>
<text x="66" y="694" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The event schema is a separate type from your database row, even when they look identical.</text>
</svg>