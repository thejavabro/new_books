<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of the checkout saga: an order starts Pending, moves to Stock reserved when stock is reserved for 15 minutes, then Charged when the card is charged, then Fulfilling when fulfillment is triggered, which ends the happy path. No stock available from Pending, or a failed charge from Stock reserved that releases the stock, moves the order to Cancelled, which also ends. The first three states sit on the synchronous critical path, fulfillment is event-driven, and the charge is deliberately the last forward step.">
  <defs>
    <marker id="m07-l02-order-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l02-order-states-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l02-order-states-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l02-order-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l02-order-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <text x="90" y="200" font-size="20" font-weight="600" fill="#1E3A8A">The buyer is waiting for these three states</text>

  <g filter="url(#m07-l02-order-states-soft)">
    <rect x="90" y="290" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pending</text>
  <text x="230" y="367" text-anchor="middle" font-size="20" fill="#64748B">order row created,</text>
  <text x="230" y="399" text-anchor="middle" font-size="20" fill="#64748B">idempotency key set</text>
  <g filter="url(#m07-l02-order-states-soft)">
    <rect x="470" y="290" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="610" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Stock reserved</text>
  <text x="610" y="367" text-anchor="middle" font-size="20" fill="#64748B">a 15-minute hold,</text>
  <text x="610" y="399" text-anchor="middle" font-size="20" fill="#64748B">it expires on its own</text>
  <g filter="url(#m07-l02-order-states-soft)">
    <rect x="850" y="290" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="990" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Charged</text>
  <text x="990" y="367" text-anchor="middle" font-size="20" fill="#64748B">a keyed charge,</text>
  <text x="990" y="399" text-anchor="middle" font-size="20" fill="#64748B">so a retry is safe</text>
  <g filter="url(#m07-l02-order-states-soft)">
    <rect x="850" y="560" width="280" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="990" y="605" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfilling</text>
  <text x="990" y="637" text-anchor="middle" font-size="20" fill="#64748B">event consumers take</text>
  <text x="990" y="669" text-anchor="middle" font-size="20" fill="#64748B">it from here</text>
  <g filter="url(#m07-l02-order-states-soft)">
    <rect x="300" y="560" width="380" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="490" y="605" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cancelled</text>
  <text x="490" y="637" text-anchor="middle" font-size="20" fill="#64748B">the hold is released, nothing</text>
  <text x="490" y="669" text-anchor="middle" font-size="20" fill="#64748B">was charged, nothing is owed</text>

  <g fill="none" stroke-width="2.5">
    <path d="M73,360 L82,360" stroke="#475569" stroke-width="2" marker-end="url(#m07-l02-order-states-sl)"/>
    <path d="M370,360 L462,360" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l02-order-states-bl)"/>
    <path d="M750,360 L842,360" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l02-order-states-bl)"/>
    <path d="M990,430 L990,552" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l02-order-states-ab)"/>
    <path d="M1130,630 L1148,630" stroke="#475569" stroke-width="2" marker-end="url(#m07-l02-order-states-sl)"/>
    <path d="M230,430 L230,520 L400,520 L400,552" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l02-order-states-rd)"/>
    <path d="M610,430 L610,552" stroke="#DC2626" marker-end="url(#m07-l02-order-states-rd)"/>
    <path d="M680,630 L703,630" stroke="#475569" stroke-width="2" marker-end="url(#m07-l02-order-states-sl)"/>
  </g>

  <circle cx="60" cy="360" r="12" fill="#475569"/>
  <circle cx="1165" cy="630" r="13" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="1165" cy="630" r="7" fill="#475569"/>
  <circle cx="720" cy="630" r="13" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="720" cy="630" r="7" fill="#475569"/>

  <text x="416" y="240" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reserve stock</text>
  <text x="416" y="268" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">for 15 minutes</text>
  <text x="796" y="254" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge the card</text>
  <text x="1010" y="495" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">trigger</text>
  <text x="1010" y="523" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fulfillment</text>
  <text x="250" y="470" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no stock available</text>
  <text x="630" y="470" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the charge fails,</text>
  <text x="630" y="498" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">so release the hold</text>

  <rect x="60" y="760" width="1120" height="180" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="90" y="806" font-size="20" font-weight="600" fill="#334155">The charge sits last on purpose</text>
  <text x="90" y="848" font-size="20" fill="#0F172A">Compensations run in reverse: release the hold, then cancel the order.</text>
  <text x="90" y="890" font-size="20" fill="#0F172A">The riskiest step runs last, so a failure undoes a hold and a pending row.</text>

  <line x1="60" y1="980" x2="96" y2="980" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="987" font-size="20" fill="#475569">Forward steps the buyer waits through</text>
  <line x1="60" y1="1020" x2="96" y2="1020" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="1027" font-size="20" fill="#475569">The handover to event consumers</text>
  <line x1="60" y1="1060" x2="96" y2="1060" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1067" font-size="20" fill="#475569">The compensating path: undo, then stop</text>
</svg>