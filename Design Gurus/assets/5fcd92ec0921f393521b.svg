<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A permission check: an authenticated user requests an action, the authorization layer looks up the role, an Admin is allowed and a User is denied">
  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>
  <defs>
    <marker id="se3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="se3-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="se3-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="se3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="340" y1="272" x2="490" y2="272" stroke="#3B82F6" stroke-width="2" marker-end="url(#se3-blue)"/>
  <text x="415" y="221" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">requests:</text>
  <text x="415" y="248" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">delete report</text>

  <path d="M760,246 C820,246 820,150 890,150" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#se3-emerald)"/>
  <rect x="758" y="163" width="134" height="26" fill="#FFFFFF"/>
  <text x="825" y="185" font-size="20" fill="#065F46" text-anchor="middle">Admin role</text>

  <path d="M760,302 C820,302 820,470 890,470" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#se3-red)"/>
  <rect x="763" y="368" width="124" height="26" fill="#FFFFFF"/>
  <text x="825" y="390" font-size="20" fill="#B91C1C" text-anchor="middle">User role</text>

  <line x1="625" y1="400" x2="625" y2="332" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se3-violet)"/>
  <text x="640" y="374" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">role lookup</text>

  
  <g filter="url(#se3-soft)">
    <rect x="40" y="230" width="300" height="84" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="490" y="212" width="270" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="890" y="100" width="290" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="890" y="420" width="320" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="190" y="262" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Authenticated user</text>
  <text x="190" y="290" font-size="20" fill="#64748B" text-anchor="middle">identity already verified</text>

  <text x="625" y="246" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Permission check</text>
  <text x="625" y="274" font-size="20" fill="#64748B" text-anchor="middle">does the role allow</text>
  <text x="625" y="302" font-size="20" fill="#64748B" text-anchor="middle">this action?</text>

  <text x="1035" y="134" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Request allowed</text>
  <text x="1035" y="162" font-size="20" fill="#64748B" text-anchor="middle">the report is deleted</text>

  <text x="1050" y="454" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Request denied</text>
  <text x="1050" y="482" font-size="20" fill="#64748B" text-anchor="middle">a polite refusal is returned</text>

  
  <g filter="url(#se3-soft)">
    <path d="M535,400 L535,480 A90,14 0 0 0 715,480 L715,400" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="625" cy="400" rx="90" ry="14" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="625" y="440" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Roles and</text>
  <text x="625" y="468" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">permissions</text>

  
  <line x1="40" y1="580" x2="68" y2="580" stroke="#059669" stroke-width="3"/>
  <text x="78" y="587" font-size="20" fill="#475569">allowed</text>
  <line x1="210" y1="580" x2="238" y2="580" stroke="#DC2626" stroke-width="3"/>
  <text x="248" y="587" font-size="20" fill="#475569">denied</text>
  <line x1="370" y1="580" x2="398" y2="580" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="408" y="587" font-size="20" fill="#475569">stored roles and permissions</text>
</svg>