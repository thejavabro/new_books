<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Vertical scaling compared with horizontal scaling across ceiling, cost curve, availability, elasticity, prerequisite and what each preserves">
  <rect x="0" y="0" width="1300" height="760" fill="#FFFFFF"/>

  
  <rect x="400" y="40" width="430" height="66" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="615" y="72" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">Vertical</text>
  <text x="615" y="98" font-size="20" fill="#334155" text-anchor="middle">one bigger machine</text>

  <rect x="846" y="40" width="414" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="1053" y="72" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">Horizontal</text>
  <text x="1053" y="98" font-size="20" fill="#334155" text-anchor="middle">more machines</text>

  
  <rect x="40" y="118" width="1220" height="76" rx="8" fill="#F8FAFC"/>
  <text x="60" y="164" font-size="20" font-weight="700" fill="#0F172A">Ceiling</text>
  <text x="418" y="150" font-size="20" fill="#334155">The catalog runs out. About</text>
  <text x="418" y="178" font-size="20" fill="#334155">64 times the machine you start on.</text>
  <text x="864" y="150" font-size="20" fill="#334155">None in the application tier.</text>
  <text x="864" y="178" font-size="20" fill="#334155">The ceiling moves downstream.</text>

  
  <rect x="40" y="198" width="1220" height="76" rx="8" fill="#FFFFFF"/>
  <text x="60" y="244" font-size="20" font-weight="700" fill="#0F172A">Cost curve</text>
  <text x="418" y="230" font-size="20" font-weight="700" fill="#991B1B">Steepens sharply at the top.</text>
  <text x="418" y="258" font-size="20" fill="#334155">The last doubling costs the most.</text>
  <text x="864" y="230" font-size="20" font-weight="700" fill="#065F46">Roughly linear.</text>
  <text x="864" y="258" font-size="20" fill="#334155">10 times the traffic, 10 times the servers.</text>

  
  <rect x="40" y="278" width="1220" height="76" rx="8" fill="#F8FAFC"/>
  <text x="60" y="324" font-size="20" font-weight="700" fill="#0F172A">Availability</text>
  <text x="418" y="310" font-size="20" fill="#334155">None. It is one bigger single</text>
  <text x="418" y="338" font-size="20" fill="#334155">point of failure.</text>
  <text x="864" y="310" font-size="20" fill="#334155">N plus one. A lost server</text>
  <text x="864" y="338" font-size="20" fill="#334155">becomes routine.</text>

  
  <rect x="40" y="358" width="1220" height="76" rx="8" fill="#FFFFFF"/>
  <text x="60" y="404" font-size="20" font-weight="700" fill="#0F172A">Elasticity</text>
  <text x="418" y="390" font-size="20" fill="#334155">No. A machine cannot be</text>
  <text x="418" y="418" font-size="20" fill="#334155">resized by the hour.</text>
  <text x="864" y="390" font-size="20" fill="#334155">Yes. The fleet grows and shrinks</text>
  <text x="864" y="418" font-size="20" fill="#334155">with the traffic.</text>

  
  <rect x="40" y="438" width="1220" height="76" rx="8" fill="#F8FAFC"/>
  <text x="60" y="484" font-size="20" font-weight="700" fill="#0F172A">Prerequisite</text>
  <text x="418" y="470" font-size="20" fill="#334155">None. It works on the code</text>
  <text x="418" y="498" font-size="20" fill="#334155">you already have.</text>
  <text x="864" y="470" font-size="20" font-weight="700" fill="#92400E">The statelessness overhaul,</text>
  <text x="864" y="498" font-size="20" font-weight="700" fill="#92400E">finished, not mostly finished.</text>

  
  <rect x="40" y="518" width="1220" height="76" rx="8" fill="#FFFFFF"/>
  <text x="60" y="564" font-size="20" font-weight="700" fill="#0F172A">Preserves</text>
  <text x="418" y="550" font-size="20" fill="#334155">Single-machine guarantees,</text>
  <text x="418" y="578" font-size="20" fill="#334155">and simplicity.</text>
  <text x="864" y="550" font-size="20" fill="#334155">Nothing automatically. Sessions,</text>
  <text x="864" y="578" font-size="20" fill="#334155">files, caches and crons all move out.</text>

  <line x1="40" y1="600" x2="1260" y2="600" stroke="#CBD5E1" stroke-width="2"/>

  
  <text x="40" y="648" font-size="20" font-weight="700" fill="#0F172A">Vertical scaling is the one that gets expensive at the top, not horizontal. What horizontal costs is paid</text>
  <text x="40" y="678" font-size="20" font-weight="700" fill="#0F172A">once and up front, in the overhaul, plus about a millisecond per request to fetch state that used to sit</text>
  <text x="40" y="708" font-size="20" font-weight="700" fill="#0F172A">in local memory.</text>

  <text x="40" y="748" font-size="20" fill="#475569">Six servers for 50 requests per second is imitation, not engineering. Two servers and a failover are often enough.</text>
</svg>