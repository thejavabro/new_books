<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for a calendar service: create and edit events including recurring ones, invite people and track RSVPs, find and book a room; and check free busy, handle time zones, and send reminders that sync across devices">
  <defs>
    <filter id="calf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="calf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="calf-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="calf-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="calf-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="calf-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="calf-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="calf-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Google Calendar: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the system has to do. Split into arranging a meeting, and keeping everyone straight afterwards.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Arranging a meeting</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#5B21B6">Keeping everyone straight</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#calf-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#D97706" clip-path="url(#calf-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Create and edit</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">one off or recurring,</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">with title, time and place</text>
  <g filter="url(#calf-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#059669" clip-path="url(#calf-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Invite and RSVP</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">accept, decline or tentative,</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">tracked per invitee</text>
  <g filter="url(#calf-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#64748B" clip-path="url(#calf-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Find a room</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">suggest rooms free at that</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">time, then book one</text>
  <g filter="url(#calf-lift)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="80" y="430" width="9" height="90" fill="#4F46E5" clip-path="url(#calf-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Free and busy</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">check availability and warn</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">on a double booking</text>
  <g filter="url(#calf-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#calf-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Time zones</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">everyone sees the meeting</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">in their own local time</text>
  <g filter="url(#calf-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#calf-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Reminders and sync</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">alerts before an event,</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">the same on every device</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Recurring event</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">one rule that expands into many occurrences, each of which can be edited or cancelled on its own</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Free and busy</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">derived from every calendar involved rather than stored, which is what makes conflict checks expensive</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Room</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">a resource with its own calendar, so double booking a room is the same problem as double booking a person</text>
</svg>