<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three deployment shapes, one per row: a monolith with all code and one database, a modular monolith with ordering, catalog, and billing modules sharing one database with tables per module, and microservices where Ordering, Catalog, and Billing each own a separate database.">
  <defs>
    <filter id="m01-l03-three-deployment-shapes-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="1010" fill="#FFFFFF"/>

  
  <rect x="50" y="40" width="1140" height="210" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="78" font-size="20" font-weight="600" fill="#334155">Monolith: one deployable</text>
  <text x="1168" y="78" text-anchor="end" font-size="20" fill="#64748B">everything ships together</text>

  <g fill="none" stroke="#475569" stroke-width="2.5">
    <path d="M350,170 L430,170"/>
  </g>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <rect x="90" y="120" width="260" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="220" y="162" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">all code</text>
  <text x="220" y="192" text-anchor="middle" font-size="20" fill="#64748B">one process</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <path d="M430,125 L430,215 A150,22 0 0 0 730,215 L730,125" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="580" cy="125" rx="150" ry="22" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="580" y="180" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">one database</text>

  
  <rect x="50" y="280" width="1140" height="330" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="318" font-size="20" font-weight="600" fill="#334155">Modular monolith: one deployable, enforced boundaries</text>
  <text x="1168" y="318" text-anchor="end" font-size="20" fill="#64748B">modules own their tables, no reach-ins</text>

  <g fill="none" stroke="#475569" stroke-width="2.5">
    <path d="M350,385 C425,385 425,440 500,440"/>
    <path d="M350,475 L500,475"/>
    <path d="M350,565 C425,565 425,510 500,510"/>
  </g>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <rect x="90" y="350" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="220" y="392" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">ordering module</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <rect x="90" y="440" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="220" y="482" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">catalog module</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <rect x="90" y="530" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="220" y="572" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">billing module</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <path d="M500,380 L500,550 A150,24 0 0 0 800,550 L800,380" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="650" cy="380" rx="150" ry="24" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="650" y="458" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">one database</text>
  <text x="650" y="490" text-anchor="middle" font-size="20" fill="#64748B">tables per module</text>

  
  <rect x="50" y="640" width="1140" height="330" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="678" font-size="20" font-weight="600" fill="#334155">Microservices: many deployables</text>
  <text x="1168" y="678" text-anchor="end" font-size="20" fill="#64748B">each service owns its database</text>

  <g fill="none" stroke="#475569" stroke-width="2.5">
    <path d="M350,745 L470,745"/>
    <path d="M350,835 L470,835"/>
    <path d="M350,925 L470,925"/>
  </g>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <rect x="90" y="710" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="220" y="752" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Ordering</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <rect x="90" y="800" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="220" y="842" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <rect x="90" y="890" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="220" y="932" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Billing</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <path d="M470,720 L470,770 A120,16 0 0 0 710,770 L710,720" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="590" cy="720" rx="120" ry="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="590" y="752" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">db</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <path d="M470,810 L470,860 A120,16 0 0 0 710,860 L710,810" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="590" cy="810" rx="120" ry="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="590" y="842" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">db</text>

  <g filter="url(#m01-l03-three-deployment-shapes-soft)">
    <path d="M470,900 L470,950 A120,16 0 0 0 710,950 L710,900" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="590" cy="900" rx="120" ry="16" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="590" y="932" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">db</text>
</svg>