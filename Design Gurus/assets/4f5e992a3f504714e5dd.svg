  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Domain-driven design inside a monolith</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each bounded context owns its own entities; the contexts agree to share one kernel and use one database.</text>

