<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1200" viewBox="0 0 1240 1200" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One monolithic application holds four bounded contexts, user, order, inventory and payment, each with two entities and their fields; the order item carries the price, while the inventory product is a SKU with a reorder level and its stock is a StockItem; the order context gets user info from the user context, checks stock with the inventory context and processes payment with the payment context; the contexts agree to share a kernel of domain events, a Money type and shared IDs, and write to one shared database">
