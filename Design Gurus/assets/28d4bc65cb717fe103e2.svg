<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1100" viewBox="0 0 1240 1100" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five rows show how Orders and Dispatch can be coupled, from looser to tighter: a narrow interface with three values, a shared 25-field Order object, a shared orders table that Orders writes and Dispatch reads, Dispatch importing a private helper from Orders, and temporal coupling where Orders waits for a reply from Dispatch. Under each row, a line states what change or outage then forces an edit, or stops or slows checkout.">
