  <text x="845" y="559" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">orders</text>
  <text x="530" y="322" font-size="18.5" fill="#475569">Dispatch can change its tables, algorithm and classes freely</text>
  <text x="530" y="472" font-size="18.5" fill="#475569">Renaming any of the 3 fields Dispatch reads makes Dispatch fail</text>
  <text x="530" y="622" font-size="18.5" fill="#475569">A renamed column or status value makes Dispatch fail, unseen until runtime</text>
  <text x="530" y="772" font-size="18.5" fill="#475569">Any refactoring inside Orders can make Dispatch fail</text>
  <text x="530" y="1032" font-size="18.5" fill="#475569">Checkout stops when Dispatch is down and slows when Dispatch is slow</text>

