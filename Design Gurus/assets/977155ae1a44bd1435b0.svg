    <marker id="m11i-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Clean Architecture: inbound vs. outbound adapters</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Inbound adapters call the use case; the use case uses outbound adapters through the interfaces it defines.</text>

