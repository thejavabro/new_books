  <text x="924" y="412" font-size="21.5" font-weight="600" fill="#111827">Payment gateway</text>
  <text x="1020" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">external service</text>
  <g filter="url(#m11i-soft)">
    <rect x="860" y="505" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
