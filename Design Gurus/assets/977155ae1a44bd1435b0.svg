<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three inbound adapters, an HTTP controller for the REST API, a message consumer for the message queue and a CLI for the command line, call the use case that holds the application logic; the use case uses the entities that hold the business rules and uses three outbound adapters, an order repository for the database, a payment gateway for an external service and an email gateway for an email provider">
