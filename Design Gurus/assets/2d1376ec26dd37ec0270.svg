<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Non-functional requirements for a news aggregator: millions of users, an article reaching interested feeds within seconds, high availability; accepting eventual consistency, a heavy read to write ratio, and a large stored corpus">
  <defs>
    <filter id="nwsn-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nwsn-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nwsn-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsn-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsn-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsn-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsn-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsn-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">News aggregator: non-functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">How well it has to work. Targets first, then what it gives up to reach them.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Targets the design must hit</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#B45309">Trade-offs accepted on purpose</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nwsn-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#nwsn-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Millions of users</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">each opening their feed</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">several times a day</text>
  <g filter="url(#nwsn-lift)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="450" y="175" width="9" height="90" fill="#059669" clip-path="url(#nwsn-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Seconds to the feed</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">from a source publishing</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">to a subscriber seeing it</text>
  <g filter="url(#nwsn-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#nwsn-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Available always</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a news app that is down</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">is simply not used</text>
  <g filter="url(#nwsn-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#D97706" clip-path="url(#nwsn-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Eventual consistency</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a slightly stale feed is</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">better than an error page</text>
  <g filter="url(#nwsn-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#64748B" clip-path="url(#nwsn-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Reads dominate</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">far more feed fetches than</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">articles ingested</text>
  <g filter="url(#nwsn-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#nwsn-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">A large corpus</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">partitioned and indexed,</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">because it only grows</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Near real time</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">seconds, not milliseconds. News does not need instant, and asking for it would change the whole design</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">AP</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">availability chosen over strict consistency, because a feed that is a few seconds behind harms nobody</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Fan out</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">one popular article matches millions of subscriptions, which is the expensive moment in the system</text>
</svg>