<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="866" viewBox="0 0 1240 866" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The offline plane and the online plane, and the two things that cross between them">
  <defs>
    <marker id="m2l0b-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m2l0b-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="m2l0b-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m2l0b-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m2l0b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l0b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m2l0b-k1"><rect x="560" y="104" width="255" height="90" rx="12"/></clipPath>
    <clipPath id="m2l0b-k2"><rect x="170" y="104" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="m2l0b-k3"><rect x="80" y="404" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m2l0b-k4"><rect x="330" y="404" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="m2l0b-k5"><rect x="624" y="404" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="m2l0b-k6"><rect x="898" y="404" width="170" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="866" fill="#FFFFFF"/>

  <rect x="40" y="56" width="1160" height="190" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline processing: background work with completion deadlines</text>
  <rect x="40" y="356" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="386" font-size="16.5" font-weight="600" fill="#1D4ED8">Online plane: one request, a user is waiting</text>

  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M940,149 L815,149" marker-end="url(#m2l0b-am)"/>
    <path d="M560,149 L394,149" marker-end="url(#m2l0b-am)"/>
  </g>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M250,449 L330,449" marker-end="url(#m2l0b-bl)"/>
    <path d="M544,449 L624,449" marker-end="url(#m2l0b-bl)"/>
    <path d="M828,449 L898,449" marker-end="url(#m2l0b-bl)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2.5">
    <path d="M282,194 V278 Q282,290 294,290 H714 Q726,290 726,302 V404" marker-end="url(#m2l0b-vi)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2.5">
    <path d="M983,404 V320 Q983,308 995,308 H1148 Q1160,308 1160,296 V178" marker-end="url(#m2l0b-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7">
    <text x="504" y="284" fill="#5B21B6">the model file goes down</text>
    <text x="1071" y="314" fill="#047857">logs come back up</text>
  </g>

  <g stroke="#D97706" stroke-width="1.5">
    <path d="M940,104 L940,178 A110,16 0 0 0 1160,178 L1160,104" fill="#FEF3C7"/>
    <ellipse cx="1050" cy="104" rx="110" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1050" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Event warehouse</text>
  <text x="1050" y="219" text-anchor="middle" font-size="15.5" fill="#6B7280">raw events, outcomes</text>

  <g filter="url(#m2l0b-soft)">
    <rect x="560" y="104" width="255" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="560" y="104" width="6" height="90" fill="#D97706" clip-path="url(#m2l0b-k1)"/>
  </g>
  <circle cx="598" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(587.56,138.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="624" y="156" font-size="18.5" font-weight="600" fill="#111827">Training pipeline</text>
  <text x="687" y="219" text-anchor="middle" font-size="15.5" fill="#6B7280">joins features to labels, fits a model</text>

  <g filter="url(#m2l0b-soft)">
    <rect x="170" y="104" width="224" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="170" y="104" width="6" height="90" fill="#7C3AED" clip-path="url(#m2l0b-k2)"/>
  </g>
  <circle cx="208" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,138.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="234" y="156" font-size="18.5" font-weight="600" fill="#111827">Model registry</text>
  <text x="282" y="219" text-anchor="middle" font-size="15.5" fill="#6B7280">versions, metrics, rollback</text>

  <g filter="url(#m2l0b-soft)">
    <rect x="80" y="404" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="404" width="6" height="90" fill="#2563EB" clip-path="url(#m2l0b-k3)"/>
  </g>
  <circle cx="118" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,438.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="144" y="456" font-size="18.5" font-weight="600" fill="#111827">Request</text>
  <text x="165" y="519" text-anchor="middle" font-size="15.5" fill="#6B7280">checkout screen opens</text>

  <g filter="url(#m2l0b-soft)">
    <rect x="330" y="404" width="214" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="330" y="404" width="6" height="90" fill="#4F46E5" clip-path="url(#m2l0b-k4)"/>
  </g>
  <circle cx="368" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,438.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="394" y="456" font-size="18.5" font-weight="600" fill="#111827">Feature store</text>
  <text x="437" y="519" text-anchor="middle" font-size="15.5" fill="#6B7280">reads the latest values</text>

  <g filter="url(#m2l0b-lift)">
    <rect x="624" y="404" width="204" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="624" y="404" width="9" height="90" fill="#2563EB" clip-path="url(#m2l0b-k5)"/>
  </g>
  <circle cx="662" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(651.56,438.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="688" y="456" font-size="18.5" font-weight="600" fill="#111827">Model server</text>
  <text x="726" y="519" text-anchor="middle" font-size="15.5" fill="#6B7280">runs the model file</text>

  <g filter="url(#m2l0b-soft)">
    <rect x="898" y="404" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="898" y="404" width="6" height="90" fill="#2563EB" clip-path="url(#m2l0b-k6)"/>
  </g>
  <circle cx="936" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(925.56,438.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="962" y="456" font-size="18.5" font-weight="600" fill="#111827">Response</text>
  <text x="983" y="519" text-anchor="middle" font-size="15.5" fill="#6B7280">34 minutes, plus a log line</text>

  <rect x="40" y="596" width="1160" height="240" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="630" font-size="16" fill="#475569">Four problems come from the gap between the two planes. Each one gets its own lesson.</text>
  <rect x="64" y="656" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="678" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Skew</text>
  <text x="288" y="678" font-size="15.5" fill="#475569">the two planes compute the same feature differently</text>
  <rect x="64" y="700" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="722" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Staleness</text>
  <text x="288" y="722" font-size="15.5" fill="#475569">the online feature is correct but too old to help</text>
  <rect x="64" y="744" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="766" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Drift</text>
  <text x="288" y="766" font-size="15.5" fill="#475569">changed data patterns may affect model quality</text>
  <rect x="64" y="788" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="810" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Cost</text>
  <text x="288" y="810" font-size="15.5" fill="#475569">estimate training jobs and serving requests separately</text>
</svg>