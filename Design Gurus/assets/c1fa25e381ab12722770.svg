<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1240" viewBox="0 0 1240 1240" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Gmail inbound flow: another mail server delivers over SMTP to the mail reception service, which scores it for spam, hands it to mail storage which writes metadata and the body separately, indexes it for search and notifies the recipient">
  <defs>
    <filter id="gm2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="gm2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="gm2-k1"><rect x="420" y="150" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="gm2-k2"><rect x="420" y="340" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="gm2-k3"><rect x="40" y="560" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gm2-k4"><rect x="900" y="560" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gm2-k5"><rect x="420" y="560" width="400" height="90" rx="12"/></clipPath>
    <marker id="gm2-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="gm2-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="gm2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="gm2-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="gm2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="gm2-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="gm2-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1240" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Gmail: receiving a message</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Mail arrives from a stranger, so it is scored before it is stored, then split across the stores and indexed.</text>



  <g fill="none" stroke-width="2">
    <path d="M620,290 V334" stroke="#D97706" stroke-width="2.5" marker-end="url(#gm2-m-amber)"/>
    <path d="M500,490 V506 Q500,518 488,518 H202 Q190,518 190,530 V554" stroke="#DB2777" marker-end="url(#gm2-m-pink)"/>
    <path d="M620,490 V554" stroke="#2563EB" stroke-width="2.5" marker-end="url(#gm2-m-blue)"/>
    <path d="M540,710 V754 Q540,766 528,766 H232 Q220,766 220,778 V794" stroke="#4F46E5" marker-end="url(#gm2-m-indigo)"/>
    <path d="M620,710 V794" stroke="#64748B" marker-end="url(#gm2-m-slate)"/>
    <path d="M700,710 V754 Q700,766 712,766 H1008 Q1020,766 1020,778 V794" stroke="#059669" marker-end="url(#gm2-m-emerald)"/>
    <path d="M828,605 H892" stroke="#7C3AED" marker-end="url(#gm2-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="706" y="308" fill="#B45309">SMTP</text>
    <text x="300" y="502" fill="#BE185D">score it first</text>
    <text x="860" y="545" fill="#5B21B6">you have mail</text>
    <text x="726" y="534" fill="#1D4ED8">store it</text>
    <text x="330" y="742" fill="#4338CA">headers</text>
    <text x="704" y="742" fill="#475569">body</text>
    <text x="910" y="742" fill="#047857">index it</text>
  </g>

  <g filter="url(#gm2-soft)">
    <rect x="420" y="150" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="420" y="150" width="6" height="90" fill="#D97706" clip-path="url(#gm2-k1)"/>
  </g>
  <circle cx="458" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,184.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="484" y="202" font-size="21.5" font-weight="600" fill="#111827">Sending mail server</text>
  <text x="620" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">someone else on the internet</text>
  <g filter="url(#gm2-lift)">
    <rect x="420" y="340" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="420" y="340" width="9" height="90" fill="#2563EB" clip-path="url(#gm2-k2)"/>
  </g>
  <circle cx="458" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,374.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="484" y="392" font-size="21.5" font-weight="600" fill="#111827">Mail Reception</text>
  <text x="620" y="459" font-size="18.5" text-anchor="middle" fill="#6B7280">our inbound SMTP servers</text>
  <g filter="url(#gm2-soft)">
    <rect x="40" y="560" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="40" y="560" width="6" height="90" fill="#DB2777" clip-path="url(#gm2-k3)"/>
  </g>
  <circle cx="78" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,594.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="104" y="612" font-size="21.5" font-weight="600" fill="#111827">Spam Filtering</text>
  <text x="190" y="679" font-size="18.5" text-anchor="middle" fill="#6B7280">reject, or flag and go on</text>
  <g filter="url(#gm2-soft)">
    <rect x="900" y="560" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="900" y="560" width="6" height="90" fill="#7C3AED" clip-path="url(#gm2-k4)"/>
  </g>
  <circle cx="938" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,594.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="964" y="612" font-size="21.5" font-weight="600" fill="#111827">Notification</text>
  <text x="1050" y="679" font-size="18.5" text-anchor="middle" fill="#6B7280">the client is told</text>
  <g filter="url(#gm2-soft)">
    <rect x="420" y="560" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="420" y="560" width="6" height="90" fill="#2563EB" clip-path="url(#gm2-k5)"/>
  </g>
  <circle cx="458" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,594.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="484" y="612" font-size="21.5" font-weight="600" fill="#111827">Mail Storage</text>
  <text x="620" y="679" font-size="18.5" text-anchor="middle" fill="#6B7280">splits the message up</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M60,800 L60,874 A160,16 0 0 0 380,874 L380,800" fill="#E0E7FF"/>
    <ellipse cx="220" cy="800" rx="160" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="220" y="852" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Metadata</text>
  <text x="220" y="924" font-size="18.5" text-anchor="middle" fill="#6B7280">to, from, subject, flags</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M460,800 L460,874 A160,16 0 0 0 780,874 L780,800" fill="#E2E8F0"/>
    <ellipse cx="620" cy="800" rx="160" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="620" y="852" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Blob storage</text>
  <text x="620" y="924" font-size="18.5" text-anchor="middle" fill="#6B7280">body and attachments</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M860,800 L860,874 A160,16 0 0 0 1180,874 L1180,800" fill="#D1FAE5"/>
    <ellipse cx="1020" cy="800" rx="160" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="1020" y="852" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Search index</text>
  <text x="1020" y="924" font-size="18.5" text-anchor="middle" fill="#6B7280">so it can be found later</text>

  <rect x="40" y="990" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1015" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1040" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Score before you store</text>
  <text x="323" y="1040" font-size="18.5" fill="#475569">the cheapest place to stop spam is before it costs you storage and an index write</text>
  <rect x="64" y="1065" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="1090" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">One message, three writes</text>
  <text x="323" y="1090" font-size="18.5" fill="#475569">headers, body and index entry are written separately because they are read separately</text>
  <rect x="64" y="1115" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1140" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">The notification is last</text>
  <text x="323" y="1140" font-size="18.5" fill="#475569">the reader is only told once the message is safely stored, never before</text>
</svg>