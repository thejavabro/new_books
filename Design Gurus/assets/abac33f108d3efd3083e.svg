<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="576" viewBox="0 0 1240 576" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A five minute window with a one minute watermark delay: an event arriving inside the grace period is still counted, and one arriving after the watermark passes is dropped">
  <rect x="0" y="0" width="1240" height="576" fill="#FFFFFF"/>
  <defs>
    <marker id="ms8-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">How long the window waits, and what misses the deadline</text>

  <text x="180" y="140" font-size="20" fill="#64748B" text-anchor="middle">12:00</text>
  <text x="660" y="140" font-size="20" fill="#64748B" text-anchor="middle">12:05</text>
  <text x="756" y="140" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">12:06</text>
  <text x="1140" y="140" font-size="20" fill="#64748B" text-anchor="middle">12:10</text>

  <rect x="180" y="150" width="480" height="50" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="420" y="182" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">window 12:00 to 12:05</text>
  <rect x="660" y="150" width="96" height="50" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="708" y="182" font-size="20" fill="#92400E" text-anchor="middle">grace</text>
  <rect x="756" y="150" width="384" height="50" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="948" y="182" font-size="20" fill="#64748B" text-anchor="middle">closed</text>

  <line x1="756" y1="146" x2="756" y2="252" stroke="#059669" stroke-width="2.5"/>

  <line x1="372" y1="204" x2="372" y2="228" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="708" y1="204" x2="708" y2="228" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="948" y1="204" x2="948" y2="228" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <line x1="180" y1="240" x2="1190" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#ms8-slate)"/>

  <circle cx="372" cy="240" r="9" fill="#059669"/>
  <circle cx="708" cy="240" r="9" fill="#D97706"/>
  <circle cx="948" cy="240" r="9" fill="#DC2626"/>

  <text x="372" y="300" font-size="20" fill="#334155" text-anchor="middle">event time 12:03</text>
  <text x="372" y="326" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">arrives on time</text>

  <text x="708" y="300" font-size="20" fill="#334155" text-anchor="middle">event time 12:04</text>
  <text x="708" y="326" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">late, still counted</text>

  <text x="948" y="300" font-size="20" fill="#334155" text-anchor="middle">event time 12:04</text>
  <text x="948" y="326" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">too late, dropped</text>

  <rect x="180" y="356" width="960" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="394" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">At 12:06 the watermark passes 12:05, the window is emitted, and nothing later can change it.</text>

  
  <rect x="50" y="454" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="490" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A watermark is a promise about how long you will wait, not a guarantee that nothing arrives later.</text>
  <text x="620" y="520" font-size="20" fill="#334155" text-anchor="middle">A longer grace period buys accuracy and costs delay. That trade is the whole configuration.</text>
</svg>