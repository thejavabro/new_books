<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="722" viewBox="0 0 1240 722" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="eos-title eos-desc">
<title id="eos-title">What Kafka exactly-once is built from</title>
<desc id="eos-desc">The idempotent producer removes duplicates from producer retries using a producer id and per-partition sequence numbers. Transactions make writes and offset commits atomic. Together they cover read from Kafka, process, write to Kafka.</desc>
<defs>
<marker id="eos-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="eos-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="eos-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="eos-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="722" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What Kafka exactly-once is built from</text>
<text x="40" y="86" font-size="21" fill="#4A5568">It is built from two mechanisms.</text>
<rect x="40" y="644" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="644" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="560" height="172" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V284A6 6 0 0 0 46 290H54Z" fill="#5EC9EC"/>
<circle cx="94" cy="164" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="94" y="172" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="128" y="172" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Idempotent producer</text>
<text x="72" y="214" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A producer id, plus a sequence number per partition.</text><text x="72" y="239" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The broker rejects a sequence it has already seen,</text><text x="72" y="264" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">so a retry is discarded.</text>
<rect x="640" y="118" width="560" height="172" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V284A6 6 0 0 0 646 290H654Z" fill="#39D5AA"/>
<circle cx="694" cy="164" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="694" y="172" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="728" y="172" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Transactions</text>
<text x="672" y="214" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Writes across partitions and the offset commit</text><text x="672" y="239" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">in one atomic unit. Visible only to consumers</text><text x="672" y="264" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">set to isolation.level read_committed.</text>
<text x="40" y="338" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What enabling idempotence forces</text>
<rect x="40" y="356" width="480" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="388" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">enable.idempotence</text>
<path d="M526 382H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 382H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eos-marker-slate)"/>
<rect x="570" y="356" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="388" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">true by default</text>
<rect x="40" y="418" width="480" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="450" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">acks</text>
<path d="M526 444H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 444H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eos-marker-slate)"/>
<rect x="570" y="418" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="450" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">pinned to all</text>
<rect x="40" y="480" width="480" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="512" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">max.in.flight.requests.per.connection</text>
<path d="M526 506H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 506H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eos-marker-slate)"/>
<rect x="570" y="480" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="512" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">five or fewer, so ordering survives retries</text>
<rect x="40" y="556" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="556" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="593" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Together these cover exactly one thing: read from Kafka, process, write to Kafka.</text>
<text x="66" y="678" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A real and useful guarantee, with a scope narrower than its name suggests.</text>
</svg>