<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The outbox architecture: the business row and the event row commit in one transaction, then a relay publishes the event and marks the row published">
  <defs>
    <marker id="ob2-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="ob2-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <clipPath id="ob2-k1"><rect x="90" y="110" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="ob2-k2"><rect x="860" y="180" width="280" height="80" rx="12"/></clipPath>
    <clipPath id="ob2-k3"><rect x="860" y="360" width="280" height="80" rx="12"/></clipPath>
    <filter id="ob2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ob2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>

  <rect x="40" y="44" width="720" height="400" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#047857">One local ACID transaction</text>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M240,200 V266" marker-end="url(#ob2-memerald)"/>
    <path d="M240,200 V230 Q240,242 252,242 H520 Q535,242 535,254 V266" marker-end="url(#ob2-memerald)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="390" y="226" fill="#047857">both rows or neither</text>
  </g>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M648,325 H770 Q782,325 782,313 V227 Q782,215 794,215 H852" marker-end="url(#ob2-mamber)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="662" y="255" fill="#B45309">reads unpublished rows</text>
  </g>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M1000,260 V352" marker-end="url(#ob2-mamber)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="1000" y="315" fill="#B45309">publish, then mark</text>
  </g>
  <g filter="url(#ob2-soft)">
    <rect x="90" y="110" width="300" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="90" y="110" width="6" height="70" fill="#059669" clip-path="url(#ob2-k1)"/>
  </g>
  <circle cx="128" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,134.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="154" y="152" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M 100,290 L 100,344 A 105,16 0 0 0 310,344 L 310,290" fill="#D1FAE5"/>
    <ellipse cx="205" cy="290" rx="105" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="205" y="337" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">orders table</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M 430,290 L 430,344 A 105,16 0 0 0 640,344 L 640,290" fill="#D1FAE5"/>
    <ellipse cx="535" cy="290" rx="105" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="535" y="337" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">outbox table</text>
  <g filter="url(#ob2-soft)">
    <rect x="860" y="180" width="280" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="860" y="180" width="6" height="80" fill="#D97706" clip-path="url(#ob2-k2)"/>
  </g>
  <circle cx="898" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="924" y="227" font-size="18.5" font-weight="600" fill="#111827">Relay</text>
  <g filter="url(#ob2-soft)">
    <rect x="860" y="360" width="280" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="860" y="360" width="6" height="80" fill="#D97706" clip-path="url(#ob2-k3)"/>
  </g>
  <circle cx="898" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,389.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="924" y="407" font-size="18.5" font-weight="600" fill="#111827">Message Broker</text>
  <text x="1000" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">downstream consumers subscribe here</text>
  <rect x="40" y="520" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="544" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="566" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Inside the transaction</text>
  <text x="288" y="566" font-size="15.5" fill="#475569">the business row and the event row commit together, so they can never disagree</text>
  <rect x="64" y="588" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="610" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">After the commit</text>
  <text x="288" y="610" font-size="15.5" fill="#475569">the relay publishes and retries until the broker accepts</text>
</svg>