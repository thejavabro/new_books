<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="944" viewBox="0 0 1240 944" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three versioning strategies compared: a path prefix is visible and easy to route but appears in every URL, a header keeps the URL stable but is easy to omit and complicates caching, and a query version treats a contract like a filter. This course uses a path prefix.">
  <defs>
    <filter id="p1e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1e-k1"><rect x="76" y="178" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p1e-k2"><rect x="76" y="408" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p1e-k3"><rect x="76" y="638" width="320" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="944" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three places to put a version</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700,71 L704.5,75.5 L712,65.5"/>
  </g>
  <text x="726" y="77" font-size="15.5" fill="#6B7280">what it gives</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M930,66 L941,77 M941,66 L930,77"/>
  </g>
  <text x="956" y="77" font-size="15.5" fill="#6B7280">what it costs</text>

  
  <rect x="40" y="126" width="1160" height="210" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#047857">Path prefix</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">the course default</text>

  <g filter="url(#p1e-lift)">
    <rect x="76" y="178" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="76" y="178" width="9" height="90" fill="#059669" clip-path="url(#p1e-k1)"/>
  </g>
  <circle cx="114" cy="223" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,212.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="230" font-size="18.5" font-weight="600" fill="#111827">/v1/payments</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,287 L84.5,291.5 L92,281.5"/>
  </g>
  <text x="106" y="293" font-size="15.5" fill="#6B7280">Visible in logs, docs, and examples; easy to route; each URL names one contract</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M80,308 L91,319 M91,308 L80,319"/>
  </g>
  <text x="106" y="319" font-size="15.5" fill="#6B7280">The version appears in every URL, and careless teams duplicate implementations</text>

  
  <rect x="40" y="356" width="1160" height="210" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="386" font-size="16.5" font-weight="600" fill="#1D4ED8">Header</text>
  <text x="1176" y="386" text-anchor="end" font-size="15.5" fill="#6B7280">the version sits in a request header</text>

  <g filter="url(#p1e-soft)">
    <rect x="76" y="408" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="408" width="6" height="90" fill="#2563EB" clip-path="url(#p1e-k2)"/>
  </g>
  <circle cx="114" cy="453" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,442.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="460" font-size="18.5" font-weight="600" fill="#111827">API-Version: 2</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,517 L84.5,521.5 L92,511.5"/>
  </g>
  <text x="106" y="523" font-size="15.5" fill="#6B7280">A stable resource URL, with selection kept in metadata</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M80,538 L91,549 M91,538 L80,549"/>
  </g>
  <text x="106" y="549" font-size="15.5" fill="#6B7280">Less visible when debugging, easy to omit by hand, and caches must vary on it</text>

  
  <rect x="40" y="586" width="1160" height="210" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="616" font-size="16.5" font-weight="600" fill="#1D4ED8">Query parameter</text>
  <text x="1176" y="616" text-anchor="end" font-size="15.5" fill="#6B7280">the version sits in the query string</text>

  <g filter="url(#p1e-soft)">
    <rect x="76" y="638" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="638" width="6" height="90" fill="#2563EB" clip-path="url(#p1e-k3)"/>
  </g>
  <circle cx="114" cy="683" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,672.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="690" font-size="18.5" font-weight="600" fill="#111827">?version=2</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,747 L84.5,751.5 L92,741.5"/>
  </g>
  <text x="106" y="753" font-size="15.5" fill="#6B7280">Visible and easy to try</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M80,768 L91,779 M91,768 L80,779"/>
  </g>
  <text x="106" y="779" font-size="15.5" fill="#6B7280">Treats a contract version as a filter, and invites operation-by-operation mixing</text>

  
  <rect x="40" y="828" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="873" text-anchor="middle" font-size="16" fill="#475569">This course uses the path prefix, once at the base, and changes it only for a breaking contract.</text>
</svg>