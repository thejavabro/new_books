<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="decide-title decide-desc">
<title id="decide-title">Deciding, and who decides</title>
<desc id="decide-desc">Automated failover is fast and sometimes fires for the wrong reason. What settles the choice is the cost of failing over unnecessarily, which with asynchronous replication is data loss.</desc>
<defs>
<marker id="decide-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="decide-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="decide-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="decide-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="760" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Deciding, and who decides</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Automated failover is fast and will sometimes fire for the wrong reason.</text>
<rect x="40" y="682" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="682" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="64" y="152.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What decides automation is not speed</text><text x="64" y="181.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">It is how expensive it is to fail over when you should not have.</text>
<rect x="40" y="218" width="1160" height="74" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="247.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">With asynchronous replication, failing over discards whatever had not replicated.</text><text x="620" y="274.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A false trigger causes data loss to fix an outage that did not exist.</text>
<text x="40" y="332" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The arrangement mature teams reach</text>
<circle cx="60" cy="380" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="387" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="348" width="440" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Automate the small and reversible</text>
<path d="M536 380H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 380H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decide-marker-slate)"/>
<rect x="580" y="348" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="373.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an instance, a shard, traffic within a region:</text><text x="600" y="398.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">frequent, cheap when wrong, fast</text>
<circle cx="60" cy="454" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="461" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="422" width="440" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="460" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep a human on the region decision</text>
<path d="M536 454H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 454H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decide-marker-slate)"/>
<rect x="580" y="422" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="447.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rare, expensive to get wrong, and ambiguous</text><text x="600" y="472.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in exactly the cases that matter</text>
<circle cx="60" cy="528" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="535" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="496" width="440" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="534" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Automate the mechanism completely</text>
<path d="M536 528H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 528H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decide-marker-slate)"/>
<rect x="580" y="496" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="521.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so the human action is one command</text><text x="600" y="546.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than a twenty-step runbook</text>
<rect x="40" y="576" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="576" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="609" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The human is there to decide, not to execute.</text><text x="64" y="635" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"We fail over automatically" and "one command after a human decides" are different plans.</text>
<text x="66" y="716" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Both arrangements are reasonable, and a design should say which one it is.</text>
</svg>