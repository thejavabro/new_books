  <text x="64" y="187" font-size="18.5" fill="#475569">One request at a time needs only one execution environment.</text>
  <text x="64" y="386" font-size="18.5" fill="#475569">Multiple concurrent requests create multiple execution environments.</text>
  <text x="64" y="717" font-size="18.5" fill="#475569">The platform automatically scales out to handle thousands of requests.</text>
  <text x="880" y="241" font-size="18.5" font-weight="600" fill="#111827">1 execution environment</text>
  <text x="880" y="268" font-size="18.5" fill="#6B7280">(1 concurrent request)</text>
  <text x="880" y="506" font-size="18.5" font-weight="600" fill="#111827">3 execution environments</text>
  <text x="880" y="533" font-size="18.5" fill="#6B7280">(3 concurrent requests)</text>
