  <text x="780" y="1042" font-size="18.5" font-weight="600" text-anchor="middle" fill="#111827">of execution environments</text>
  <text x="780" y="1069" font-size="18.5" text-anchor="middle" fill="#6B7280">(high concurrency)</text>

