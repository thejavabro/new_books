<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="768" viewBox="0 0 1240 768" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two ways to spread a monotonic key: salting the key with a random bucket suffix, and hashing the key so sequential values scatter">
  <rect x="0" y="0" width="1240" height="768" fill="#FFFFFF"/>
  <defs>
    <marker id="sh2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="sh2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two ways to stop a sequential key from creating a hotspot</text>

  
  <rect x="40" y="72" width="1160" height="316" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#065F46">Salting: add a random bucket to the key</text>

  <g filter="url(#sh2-soft)">
    <rect x="80" y="180" width="280" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="220" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">order 3000001</text>
  <text x="220" y="242" font-size="20" fill="#64748B" text-anchor="middle">picks a bucket 0 to 2</text>

  <line x1="364" y1="220" x2="466" y2="220" stroke="#059669" stroke-width="2" marker-end="url(#sh2-emerald)"/>

  <g filter="url(#sh2-soft)">
    <rect x="470" y="140" width="330" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="470" y="208" width="330" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="470" y="276" width="330" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="494" y="178" font-size="20" fill="#065F46" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">3000001-0</text>
  <text x="494" y="246" font-size="20" fill="#065F46" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">3000001-1</text>
  <text x="494" y="314" font-size="20" fill="#065F46" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">3000001-2</text>
  <text x="784" y="178" font-size="20" fill="#065F46" text-anchor="end">shard 1</text>
  <text x="784" y="246" font-size="20" fill="#065F46" text-anchor="end">shard 2</text>
  <text x="784" y="314" font-size="20" fill="#065F46" text-anchor="end">shard 3</text>

  <text x="840" y="200" font-size="20" fill="#475569">Writes spread across every bucket.</text>
  <text x="840" y="232" font-size="20" fill="#475569">Reading one order now means</text>
  <text x="840" y="260" font-size="20" fill="#475569">querying all 3 buckets and merging.</text>

  
  <rect x="40" y="414" width="1160" height="286" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="448" font-size="20" font-weight="600" fill="#1E40AF">Hashing: shard on hash(key) instead of key</text>

  <g filter="url(#sh2-soft)">
    <rect x="80" y="500" width="280" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="80" y="576" width="280" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="104" y="538" font-size="20" fill="#334155" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">order 3000001</text>
  <text x="104" y="614" font-size="20" fill="#334155" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">order 3000002</text>

  <line x1="364" y1="530" x2="466" y2="530" stroke="#3B82F6" stroke-width="2" marker-end="url(#sh2-emerald)"/>
  <line x1="364" y1="606" x2="466" y2="606" stroke="#3B82F6" stroke-width="2" marker-end="url(#sh2-emerald)"/>
  <text x="415" y="506" font-size="20" fill="#1E40AF" text-anchor="middle">hash</text>

  <g filter="url(#sh2-soft)">
    <rect x="470" y="500" width="330" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="470" y="576" width="330" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="494" y="538" font-size="20" fill="#1E40AF" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">a91f...</text>
  <text x="494" y="614" font-size="20" fill="#1E40AF" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">0c47...</text>
  <text x="784" y="538" font-size="20" fill="#1E40AF" text-anchor="end">shard 4</text>
  <text x="784" y="614" font-size="20" fill="#1E40AF" text-anchor="end">shard 1</text>

  <text x="840" y="522" font-size="20" fill="#475569">Neighbouring ids land far apart,</text>
  <text x="840" y="550" font-size="20" fill="#475569">so writes spread on their own.</text>
  <text x="840" y="590" font-size="20" fill="#475569">The cost: range queries on the</text>
  <text x="840" y="618" font-size="20" fill="#475569">original key now hit every shard.</text>

  <rect x="40" y="716" width="1160" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="743" font-size="20" fill="#334155" text-anchor="middle">Both trade read convenience for write spread. Pick the one whose cost your queries can absorb.</text>
</svg>