<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Splitting one interface per method gives the office workflow three dependencies on the same device, while grouping by caller gives each caller a single role interface">
  <defs>
    <filter id="isp-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="isp-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="isp-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="isp-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <clipPath id="isp-w"><rect x="70" y="240" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="isp-i1"><rect x="390" y="110" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="isp-i2"><rect x="390" y="240" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="isp-i3"><rect x="390" y="370" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="isp-q"><rect x="670" y="130" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="isp-p"><rect x="920" y="130" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="isp-o"><rect x="670" y="320" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="isp-d"><rect x="920" y="320" width="260" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="690" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="460" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#B45309">One interface per method</text>

  <g fill="none" stroke-width="2">
    <path d="M310,285 H330 Q342,285 342,273 V167 Q342,155 354,155 H378" stroke="#D97706" marker-end="url(#isp-am)"/>
    <path d="M310,285 H378" stroke="#D97706" marker-end="url(#isp-am)"/>
    <path d="M310,285 H330 Q342,285 342,297 V403 Q342,415 354,415 H378" stroke="#D97706" marker-end="url(#isp-am)"/>
  </g>

  <g filter="url(#isp-lift)">
    <rect x="70" y="240" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="70" y="240" width="9" height="90" fill="#D97706" clip-path="url(#isp-w)"/>
  </g>
  <circle cx="110" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,274.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="136" y="292" font-size="18.5" font-weight="600" fill="#111827">OfficeWorkflow</text>
  <text x="190" y="355" font-size="15.5" text-anchor="middle" fill="#6B7280">three constructor parameters</text>
  <text x="190" y="378" font-size="15.5" text-anchor="middle" fill="#B45309">the same device passed three times</text>

  <g filter="url(#isp-soft)">
    <rect x="390" y="110" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="390" y="110" width="6" height="90" fill="#64748B" clip-path="url(#isp-i1)"/>
  </g>
  <circle cx="428" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="454" y="162" font-size="18.5" font-weight="600" fill="#111827">Printer</text>

  <g filter="url(#isp-soft)">
    <rect x="390" y="240" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="390" y="240" width="6" height="90" fill="#64748B" clip-path="url(#isp-i2)"/>
  </g>
  <circle cx="428" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,274.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="454" y="292" font-size="18.5" font-weight="600" fill="#111827">Scanner</text>

  <g filter="url(#isp-soft)">
    <rect x="390" y="370" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="390" y="370" width="6" height="90" fill="#64748B" clip-path="url(#isp-i3)"/>
  </g>
  <circle cx="428" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,404.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="454" y="422" font-size="18.5" font-weight="600" fill="#111827">Stapler</text>

  
  <rect x="640" y="40" width="560" height="460" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#047857">One interface per kind of caller</text>

  <g fill="none" stroke-width="2.5">
    <path d="M890,175 H908" stroke="#059669" marker-end="url(#isp-em)"/>
    <path d="M890,365 H908" stroke="#059669" marker-end="url(#isp-em)"/>
  </g>

  <g filter="url(#isp-soft)">
    <rect x="670" y="130" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="670" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#isp-q)"/>
  </g>
  <circle cx="708" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="734" y="182" font-size="18.5" font-weight="600" fill="#111827">PrintQueue</text>
  <text x="780" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">needs printing only</text>

  <g filter="url(#isp-soft)">
    <rect x="920" y="130" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="920" y="130" width="6" height="90" fill="#059669" clip-path="url(#isp-p)"/>
  </g>
  <circle cx="958" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(947.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="984" y="182" font-size="18.5" font-weight="600" fill="#111827">Printer</text>

  <g filter="url(#isp-soft)">
    <rect x="670" y="320" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="670" y="320" width="6" height="90" fill="#2563EB" clip-path="url(#isp-o)"/>
  </g>
  <circle cx="708" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,354.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="734" y="372" font-size="18.5" font-weight="600" fill="#111827">OfficeWorkflow</text>
  <text x="780" y="435" font-size="15.5" text-anchor="middle" fill="#6B7280">needs all three</text>

  <g filter="url(#isp-lift)">
    <rect x="920" y="320" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="920" y="320" width="9" height="90" fill="#059669" clip-path="url(#isp-d)"/>
  </g>
  <circle cx="960" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(949.56,354.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="986" y="372" font-size="18.5" font-weight="600" fill="#111827">DocumentProcessor</text>

  
  <rect x="40" y="530" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="554" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="576" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Split too far</text>
  <text x="288" y="576" font-size="15.5" fill="#475569">the workflow calls all three methods, so separating them removed no dependency at all</text>
  <rect x="64" y="598" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="620" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Split by caller</text>
  <text x="288" y="620" font-size="15.5" fill="#475569">each interface carries what one kind of caller needs, and a basic printer still fits the smaller one</text>
</svg>