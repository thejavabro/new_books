  <circle cx="938" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="964" y="492" font-size="21.5" font-weight="600" fill="#111827">Product service</text>
  <text x="1050" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">/products</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">One address</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">clients use a single entry point for every backend service</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Shared jobs</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">routing, authentication, and rate limiting happen once, at the gateway</text>
