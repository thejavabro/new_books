  </g>
  <circle cx="78" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,474.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="104" y="492" font-size="21.5" font-weight="600" fill="#111827">Partner service</text>
