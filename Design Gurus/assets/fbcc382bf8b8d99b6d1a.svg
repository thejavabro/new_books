  <text x="964" y="192" font-size="21.5" font-weight="600" fill="#111827">User service</text>
  <text x="1050" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">/users</text>
  <g filter="url(#gw1-soft)">
    <rect x="900" y="290" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="290" width="6" height="90" fill="#2563EB" clip-path="url(#gw1-k6)"/>
  </g>
  <circle cx="938" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,324.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="964" y="342" font-size="21.5" font-weight="600" fill="#111827">Order service</text>
  <text x="1050" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">/orders</text>
  <g filter="url(#gw1-soft)">
    <rect x="900" y="440" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#gw1-k7)"/>
