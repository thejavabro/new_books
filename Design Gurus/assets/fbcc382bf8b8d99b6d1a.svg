    <rect x="470" y="290" width="280" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="470" y="290" width="9" height="90" fill="#7C3AED" clip-path="url(#gw1-k4)"/>
  </g>
  <circle cx="508" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,324.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="534" y="342" font-size="21.5" font-weight="600" fill="#111827">API gateway</text>
  <text x="610" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">one entry point</text>
