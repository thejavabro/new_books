<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A web browser, a mobile app, and a partner service send requests to one API gateway. The gateway forwards /users requests to the user service, /orders requests to the order service, and /products requests to the product service.">
  <defs>
    <filter id="gw1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="gw1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="gw1-k1"><rect x="40" y="140" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="gw1-k2"><rect x="40" y="290" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="gw1-k3"><rect x="40" y="440" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="gw1-k4"><rect x="470" y="290" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="gw1-k5"><rect x="900" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gw1-k6"><rect x="900" y="290" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gw1-k7"><rect x="900" y="440" width="300" height="90" rx="12"/></clipPath>
    <marker id="gw1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="gw1-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">An API gateway is a single entry point</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every client calls the gateway. The gateway sends each request to the right microservice.</text>



  <g fill="none" stroke-width="2">
    <path d="M300,185 H400 Q415,185 415,200 V300 Q415,315 430,315 H470" stroke="#64748B" marker-end="url(#gw1-m-slate)"/>
    <path d="M300,335 H470" stroke="#64748B" marker-end="url(#gw1-m-slate)"/>
    <path d="M300,485 H400 Q415,485 415,470 V370 Q415,355 430,355 H470" stroke="#64748B" marker-end="url(#gw1-m-slate)"/>
    <path d="M750,315 H810 Q825,315 825,300 V200 Q825,185 840,185 H900" stroke="#7C3AED" marker-end="url(#gw1-m-violet)"/>
    <path d="M750,335 H900" stroke="#7C3AED" marker-end="url(#gw1-m-violet)"/>
    <path d="M750,355 H810 Q825,355 825,370 V470 Q825,485 840,485 H900" stroke="#7C3AED" marker-end="url(#gw1-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

