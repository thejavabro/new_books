<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Inheritance gives every bird a fly method that a penguin must refuse, while composition gives a bird a movement style object it holds">
  <defs>
    <filter id="lspc-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lspc-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="lspc-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="lspc-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="lspc-k1"><rect x="190" y="100" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="lspc-k2"><rect x="70" y="280" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="lspc-k3"><rect x="310" y="280" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="lspc-k4"><rect x="780" y="100" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="lspc-k5"><rect x="610" y="280" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="lspc-k6"><rect x="805" y="280" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="lspc-k7"><rect x="1000" y="280" width="170" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="500" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Inheritance: a Sparrow is-a Bird</text>

  <rect x="580" y="40" width="620" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="604" y="70" font-size="16.5" font-weight="600" fill="#475569">Composition: a Bird has-a MovementStyle</text>

  
  <g fill="none" stroke-width="2">
    <path d="M290,190 V213 Q290,225 278,225 H182 Q170,225 170,237 V274" stroke="#64748B" marker-end="url(#lspc-sl)"/>
    <path d="M290,190 V213 Q290,225 302,225 H398 Q410,225 410,237 V274" stroke="#64748B" marker-end="url(#lspc-sl)"/>
    <path d="M890,190 V274" stroke="#059669" stroke-width="2.5" marker-end="url(#lspc-em)"/>
    <path d="M890,190 V213 Q890,225 878,225 H707 Q695,225 695,237 V274" stroke="#059669" marker-end="url(#lspc-em)"/>
    <path d="M890,190 V213 Q890,225 902,225 H1073 Q1085,225 1085,237 V274" stroke="#059669" marker-end="url(#lspc-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="290" y="252" fill="#475569">extends</text>
    <text x="790" y="252" fill="#047857">has a, one of</text>
  </g>

  
  <g filter="url(#lspc-soft)">
    <rect x="190" y="100" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="190" y="100" width="6" height="90" fill="#64748B" clip-path="url(#lspc-k1)"/>
  </g>
  <circle cx="228" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,134.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="254" y="152" font-size="18.5" font-weight="600" fill="#111827">Bird</text>
  <text x="402" y="152" font-size="15.5" fill="#6B7280">declares fly()</text>

  
  <g filter="url(#lspc-soft)">
    <rect x="70" y="280" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="280" width="6" height="90" fill="#64748B" clip-path="url(#lspc-k2)"/>
  </g>
  <circle cx="108" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,314.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="134" y="332" font-size="18.5" font-weight="600" fill="#111827">Sparrow</text>
  <text x="170" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">inherits fly()</text>
  <text x="170" y="418" font-size="15.5" text-anchor="middle" fill="#94A3B8">and can honour it</text>

  
  <g filter="url(#lspc-lift)">
    <rect x="310" y="280" width="200" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="310" y="280" width="9" height="90" fill="#DB2777" clip-path="url(#lspc-k3)"/>
  </g>
  <circle cx="350" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(339.56,314.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="376" y="332" font-size="18.5" font-weight="600" fill="#111827">Penguin</text>
  <text x="410" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">inherits fly() too</text>
  <text x="410" y="418" font-size="15.5" text-anchor="middle" fill="#BE185D">and must refuse it</text>

  
  <g filter="url(#lspc-lift)">
    <rect x="780" y="100" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="780" y="100" width="9" height="90" fill="#2563EB" clip-path="url(#lspc-k4)"/>
  </g>
  <circle cx="820" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(809.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="846" y="152" font-size="18.5" font-weight="600" fill="#111827">Bird</text>
  <text x="1012" y="152" font-size="15.5" fill="#6B7280">one class, no subclasses</text>

  
  <g filter="url(#lspc-soft)">
    <rect x="610" y="280" width="170" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="610" y="280" width="6" height="90" fill="#059669" clip-path="url(#lspc-k5)"/>
  </g>
  <circle cx="648" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(637.56,314.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="674" y="332" font-size="18.5" font-weight="600" fill="#111827">Flying</text>

  <g filter="url(#lspc-soft)">
    <rect x="805" y="280" width="170" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="805" y="280" width="6" height="90" fill="#059669" clip-path="url(#lspc-k6)"/>
  </g>
  <circle cx="843" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(832.56,314.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="869" y="332" font-size="18.5" font-weight="600" fill="#111827">Swimming</text>

  <g filter="url(#lspc-soft)">
    <rect x="1000" y="280" width="170" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1000" y="280" width="6" height="90" fill="#059669" clip-path="url(#lspc-k7)"/>
  </g>
  <circle cx="1038" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,314.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="1064" y="332" font-size="18.5" font-weight="600" fill="#111827">Running</text>

  <text x="890" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">a penguin is a Bird built with Swimming</text>
  <text x="890" y="418" font-size="15.5" text-anchor="middle" fill="#94A3B8">so it never receives a method it must refuse</text>

  
  <rect x="40" y="510" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="534" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="556" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Inherited, not wanted</text>
  <text x="288" y="556" font-size="15.5" fill="#475569">a subclass receives every method of its parent, whether it suits the subclass or not</text>
  <rect x="64" y="578" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="600" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Held, not inherited</text>
  <text x="288" y="600" font-size="15.5" fill="#475569">behaviour arrives as an object the class holds, so a class only gets what it was given</text>
</svg>