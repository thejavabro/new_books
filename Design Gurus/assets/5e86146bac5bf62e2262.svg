<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Replicated cache: processing units 1, 2 and 3 each hold partitions A, B and C; each unit stores the entire dataset, any unit serves any request so routing and failover are simple, every write reaches every unit and it uses more memory, and it suits small to moderate data with a low write rate. Partitioned cache: unit 1 holds A as primary and a backup of C, unit 2 holds B as primary and a backup of A, unit 3 holds C as primary and a backup of B; each unit owns a subset of the data, backups are kept on other units, memory is used more efficiently, and it scales better for large datasets">
