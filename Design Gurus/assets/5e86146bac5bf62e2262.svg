  <text x="1046" y="353" font-size="18.5" font-weight="600" fill="#111827">C (primary)</text>
  <text x="64" y="176" font-size="18.5" fill="#475569">Every unit holds a full copy of the data.</text>
  <text x="664" y="176" font-size="18.5" fill="#475569">Data is split across units, with backup copies.</text>

  <rect x="678" y="398" width="136" height="56" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="698" y="432.5" font-size="18.5" font-weight="600" fill="#111827">C (backup)</text>
  <rect x="852" y="398" width="136" height="56" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="872" y="432.5" font-size="18.5" font-weight="600" fill="#111827">A (backup)</text>
  <rect x="1026" y="398" width="136" height="56" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="1046" y="432.5" font-size="18.5" font-weight="600" fill="#111827">B (backup)</text>
  <rect x="64" y="544" width="512" height="150" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="88" cy="574" r="4" fill="#2563EB"/>
  <text x="104" y="580" font-size="18.5" fill="#1F2937">Each unit stores the entire dataset.</text>
  <circle cx="88" cy="604" r="4" fill="#2563EB"/>
  <text x="104" y="610" font-size="18.5" fill="#1F2937">Any unit serves any request; simple routing and failover.</text>
  <circle cx="88" cy="634" r="4" fill="#2563EB"/>
  <text x="104" y="640" font-size="18.5" fill="#1F2937">Every write reaches every unit; uses more memory.</text>
  <circle cx="88" cy="664" r="4" fill="#2563EB"/>
  <text x="104" y="670" font-size="18.5" fill="#1F2937">Good for small to moderate data with a low write rate.</text>
  <rect x="664" y="544" width="512" height="150" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="688" cy="574" r="4" fill="#059669"/>
  <text x="704" y="580" font-size="18.5" fill="#1F2937">Each unit owns a subset of the data (partition).</text>
  <circle cx="688" cy="604" r="4" fill="#059669"/>
  <text x="704" y="610" font-size="18.5" fill="#1F2937">Backup copies are kept on other units.</text>
  <circle cx="688" cy="634" r="4" fill="#059669"/>
  <text x="704" y="640" font-size="18.5" fill="#1F2937">Uses memory more efficiently.</text>
  <circle cx="688" cy="664" r="4" fill="#059669"/>
  <text x="704" y="670" font-size="18.5" fill="#1F2937">Scales better for large datasets.</text>


</svg>