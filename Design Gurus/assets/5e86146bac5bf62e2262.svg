  <text x="436" y="238" font-size="19.5" font-weight="600" fill="#1D4ED8">Processing</text>
  <text x="436" y="262" font-size="19.5" font-weight="600" fill="#1D4ED8">unit 3</text>
  <rect x="664" y="208" width="164" height="316" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="688" y="238" font-size="19.5" font-weight="600" fill="#047857">Processing</text>
  <text x="688" y="262" font-size="19.5" font-weight="600" fill="#047857">unit 1</text>
  <rect x="838" y="208" width="164" height="316" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="862" y="238" font-size="19.5" font-weight="600" fill="#047857">Processing</text>
