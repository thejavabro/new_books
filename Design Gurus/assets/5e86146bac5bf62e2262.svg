  </g>
  <text x="98" y="375" font-size="18.5" font-weight="600" fill="#111827">B</text>
  <g filter="url(#m14i-soft)">
    <rect x="78" y="400" width="136" height="48" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="78" y="400" width="6" height="48" fill="#D97706" clip-path="url(#m14i-k3)"/>
