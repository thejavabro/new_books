    <rect x="426" y="344" width="6" height="48" fill="#059669" clip-path="url(#m14i-k10)"/>
  </g>
  <text x="446" y="375" font-size="18.5" font-weight="600" fill="#111827">B</text>
  <g filter="url(#m14i-soft)">
    <rect x="426" y="400" width="136" height="48" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="426" y="400" width="6" height="48" fill="#D97706" clip-path="url(#m14i-k11)"/>
