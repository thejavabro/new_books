  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Replicated cache vs. partitioned cache</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A replicated cache copies all data to every unit; a partitioned cache splits it across units with backups.</text>

  <rect x="40" y="118" width="560" height="600" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="148" font-size="19.5" font-weight="600" fill="#1D4ED8">Replicated cache</text>
  <rect x="640" y="118" width="560" height="600" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="148" font-size="19.5" font-weight="600" fill="#047857">Partitioned cache</text>
  <rect x="64" y="208" width="164" height="316" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="238" font-size="19.5" font-weight="600" fill="#1D4ED8">Processing</text>
  <text x="88" y="262" font-size="19.5" font-weight="600" fill="#1D4ED8">unit 1</text>
  <rect x="238" y="208" width="164" height="316" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
