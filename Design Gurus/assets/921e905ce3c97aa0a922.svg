<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The dual write problem: save then publish loses the event when publishing fails; publish then save announces an order that was never saved">
  <defs>
    <marker id="ob1-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="ob1-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="ob1-k1"><rect x="72" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ob1-k2"><rect x="455" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ob1-k3"><rect x="838" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ob1-k4"><rect x="72" y="374" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ob1-k5"><rect x="455" y="374" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ob1-k6"><rect x="838" y="374" width="330" height="90" rx="12"/></clipPath>
    <filter id="ob1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ob1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#B45309">Failure order 1: save the order, then publish</text>
  <rect x="40" y="314" width="1160" height="230" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="344" font-size="16.5" font-weight="600" fill="#5B21B6">Failure order 2: publish the event, then save</text>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M402,149 H447" marker-end="url(#ob1-mamber)"/>
    <path d="M785,149 H830" marker-end="url(#ob1-mamber)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M402,419 H447" marker-end="url(#ob1-mviolet)"/>
    <path d="M785,419 H830" marker-end="url(#ob1-mviolet)"/>
  </g>
  <g filter="url(#ob1-soft)">
    <rect x="72" y="104" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="72" y="104" width="6" height="90" fill="#D97706" clip-path="url(#ob1-k1)"/>
  </g>
  <circle cx="110" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,138.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="156" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="237" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">saves the order first</text>
  <g filter="url(#ob1-soft)">
    <rect x="455" y="104" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="455" y="104" width="6" height="90" fill="#059669" clip-path="url(#ob1-k2)"/>
  </g>
  <circle cx="493" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,138.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="519" y="156" font-size="18.5" font-weight="600" fill="#111827">Order Saved</text>
  <text x="620" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">the commit succeeds</text>
  <g filter="url(#ob1-soft)">
    <rect x="838" y="104" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="838" y="104" width="6" height="90" fill="#DB2777" clip-path="url(#ob1-k3)"/>
  </g>
  <circle cx="876" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,138.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="902" y="156" font-size="18.5" font-weight="600" fill="#111827">Publish Fails</text>
  <text x="1003" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">the event never leaves</text>
  <g filter="url(#ob1-soft)">
    <rect x="72" y="374" width="330" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="72" y="374" width="6" height="90" fill="#7C3AED" clip-path="url(#ob1-k4)"/>
  </g>
  <circle cx="110" cy="419" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,408.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="426" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="237" y="489" font-size="15.5" text-anchor="middle" fill="#6B7280">publishes the event first</text>
  <g filter="url(#ob1-soft)">
    <rect x="455" y="374" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="455" y="374" width="6" height="90" fill="#059669" clip-path="url(#ob1-k5)"/>
  </g>
  <circle cx="493" cy="419" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,408.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="519" y="426" font-size="18.5" font-weight="600" fill="#111827">Event Published</text>
  <text x="620" y="489" font-size="15.5" text-anchor="middle" fill="#6B7280">consumers already see it</text>
  <g filter="url(#ob1-soft)">
    <rect x="838" y="374" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="838" y="374" width="6" height="90" fill="#DB2777" clip-path="url(#ob1-k6)"/>
  </g>
  <circle cx="876" cy="419" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,408.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="902" y="426" font-size="18.5" font-weight="600" fill="#111827">Commit Fails</text>
  <text x="1003" y="489" font-size="15.5" text-anchor="middle" fill="#6B7280">the order does not exist</text>
  <rect x="40" y="584" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="608" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="630" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Lost event</text>
  <text x="288" y="630" font-size="15.5" fill="#475569">the order exists and nothing downstream ever hears about it</text>
  <rect x="64" y="652" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="674" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Phantom event</text>
  <text x="288" y="674" font-size="15.5" fill="#475569">downstream acts on an order that was never saved</text>
</svg>