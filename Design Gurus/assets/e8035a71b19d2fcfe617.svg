<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A simplified OAuth flow: the user approves access at the identity provider, which issues the app a limited access token instead of the user&#39;s password">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="se5-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se5-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="se5-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="se5-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="se5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="180" y1="112" x2="180" y2="545" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="620" y1="112" x2="620" y2="545" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1060" y1="112" x2="1060" y2="545" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="188" y1="192" x2="610" y2="192" stroke="#3B82F6" stroke-width="2" marker-end="url(#se5-blue)"/>
  <text x="400" y="168" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. clicks: Log in with Google</text>

  <line x1="628" y1="242" x2="1050" y2="242" stroke="#3B82F6" stroke-width="2" marker-end="url(#se5-blue)"/>
  <text x="840" y="218" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. redirects the user to Google</text>

  <line x1="1052" y1="292" x2="190" y2="292" stroke="#D97706" stroke-width="2" marker-end="url(#se5-amber)"/>
  <text x="620" y="268" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. shows a consent screen: may this app read your photos?</text>

  <line x1="188" y1="342" x2="1050" y2="342" stroke="#3B82F6" stroke-width="2" marker-end="url(#se5-blue)"/>
  <text x="620" y="318" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. approves: the password is typed at Google only</text>

  <line x1="1052" y1="392" x2="630" y2="392" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#se5-violet)"/>
  <text x="840" y="368" font-size="20" fill="#5B21B6" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. issues a limited access token</text>

  <line x1="628" y1="469" x2="1050" y2="469" stroke="#3B82F6" stroke-width="2" marker-end="url(#se5-blue)"/>
  <text x="840" y="418" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. requests photos,</text>
  <text x="840" y="445" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">presenting the token</text>

  <line x1="1052" y1="519" x2="630" y2="519" stroke="#059669" stroke-width="2" marker-end="url(#se5-emerald)"/>
  <text x="840" y="495" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">7. returns the approved photos</text>

  
  <g filter="url(#se5-soft)">
    <rect x="40" y="40" width="280" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="480" y="40" width="280" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="920" y="40" width="280" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="180" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="180" y="98" font-size="20" fill="#64748B" text-anchor="middle">owns the Google account</text>
  <text x="620" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Photo app</text>
  <text x="620" y="98" font-size="20" fill="#64748B" text-anchor="middle">third-party application</text>
  <text x="1060" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Google</text>
  <text x="1060" y="98" font-size="20" fill="#64748B" text-anchor="middle">identity provider</text>

  
  <rect x="200" y="559" width="840" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="590" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The app never sees the user's Google password.</text>
  <text x="620" y="618" font-size="20" fill="#64748B" text-anchor="middle">It holds only a limited token, which the user can revoke at any time.</text>

  
  <line x1="60" y1="671" x2="88" y2="671" stroke="#3B82F6" stroke-width="3"/>
  <text x="98" y="678" font-size="20" fill="#475569">request or redirect</text>
  <line x1="354" y1="671" x2="382" y2="671" stroke="#D97706" stroke-width="3"/>
  <text x="392" y="678" font-size="20" fill="#475569">consent</text>
  <line x1="514" y1="671" x2="542" y2="671" stroke="#7C3AED" stroke-width="3"/>
  <text x="552" y="678" font-size="20" fill="#475569">access token</text>
  <line x1="726" y1="671" x2="754" y2="671" stroke="#059669" stroke-width="3"/>
  <text x="764" y="678" font-size="20" fill="#475569">returned data</text>
</svg>