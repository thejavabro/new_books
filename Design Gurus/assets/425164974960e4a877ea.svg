<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="thebet-title thebet-desc">
<title id="thebet-title">The choice is a bet about knowledge</title>
<desc id="thebet-desc">Normalization wins when the queries are still unknown, the data fits on one machine, update correctness dominates, or the team is small. The pressure in interviews runs the other way, which is why these cases are worth holding.</desc>
<defs>
<marker id="thebet-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="thebet-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="thebet-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="thebet-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="786" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The choice is a bet about knowledge</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The pressure in interviews runs the other way, which is why these cases are worth holding.</text>
<rect x="40" y="708" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="708" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="1160" height="96" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="96" rx="2.5" fill="#AC8BE8"/><text x="64" y="157.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Normalization is a bet that you do not know all the queries yet.</text><text x="64" y="186.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Denormalization is a bet that you do.</text>
<text x="40" y="250" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Four cases where normalizing is still right</text>
<rect x="40" y="272" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The query mix is unknown or moving</text>
<path d="M526 302H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 302H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#thebet-marker-green)"/>
<rect x="570" y="272" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="308" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a normalized model answers questions nobody anticipated</text>
<rect x="40" y="346" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="382" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The data fits on one machine</text>
<path d="M526 376H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 376H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#thebet-marker-green)"/>
<rect x="570" y="346" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="369.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a join across a few million rows with an index</text><text x="590" y="394.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is not a problem</text>
<rect x="40" y="420" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="456" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Update correctness beats read latency</text>
<path d="M526 450H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 450H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#thebet-marker-green)"/>
<rect x="570" y="420" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">anything financial, anything regulated, anything audited</text>
<rect x="40" y="494" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="530" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The team is small</text>
<path d="M526 524H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 524H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#thebet-marker-green)"/>
<rect x="570" y="494" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="530" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">more copies means more moving parts to keep consistent</text>
<rect x="40" y="580" width="560" height="100" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="580" width="5" height="100" rx="2.5" fill="#5EC9EC"/><text x="64" y="621.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Most products, most of the time,</text><text x="64" y="650.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">should be making the first bet.</text>
<rect x="640" y="580" width="560" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="580" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="664" y="609" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The failure to avoid</text><text x="664" y="636" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Designing the schema first, then</text><text x="664" y="663" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">discovering the queries.</text>
<text x="66" y="742" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Say what measurement would change your mind, and restraint reads as judgment rather than timidity.</text>
</svg>