<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="704" viewBox="0 0 1240 704" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="choice-title choice-desc">
<title id="choice-title">Something has to give</title>
<desc id="choice-desc">When a system cannot serve all of its load, the only question is whether you decided what gives or whether the system decided for you.</desc>
<defs>
<marker id="choice-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="choice-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="choice-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="choice-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="704" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Something has to give</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The only question is whether you decided what, or whether the system decided for you.</text>
<rect x="40" y="626" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="626" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="148" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What happens when nobody decides</text>
<rect x="40" y="162" width="200" height="66" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="140" y="187.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">load passes</text><text x="140" y="214.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">capacity</text>
<path d="M243 195H277" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M243 195H277" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#choice-marker-red)"/>
<rect x="280" y="162" width="200" height="66" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="380" y="201" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">queues grow</text>
<path d="M483 195H517" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M483 195H517" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#choice-marker-red)"/>
<rect x="520" y="162" width="200" height="66" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="201" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">clients time out</text>
<path d="M723 195H757" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M723 195H757" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#choice-marker-red)"/>
<rect x="760" y="162" width="200" height="66" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="860" y="201" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">clients retry</text>
<path d="M963 195H997" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M963 195H997" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#choice-marker-red)"/>
<rect x="1000" y="162" width="200" height="66" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1100" y="201" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">load grows again</text>
<path d="M1100 232C1100 276 140 276 140 236" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1100 232C1100 276 140 276 140 236" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#choice-marker-red)"/>
<text x="620" y="296" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">and the system serves nothing while working at full capacity</text>
<rect x="40" y="318" width="560" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="318" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="64" y="363" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">no decision</text><text x="64" y="389" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">100% of users get a 30-second timeout, then an error</text>
<rect x="640" y="318" width="560" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="318" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="664" y="350" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">shedding</text><text x="664" y="376" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">5% get an immediate, clear rejection</text><text x="664" y="402" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">95% get a normal response</text>
<rect x="40" y="440" width="560" height="78" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="471.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Graceful degradation</text><text x="320" y="498.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">serving a worse answer</text>
<rect x="640" y="440" width="560" height="78" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="471.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Load shedding</text><text x="920" y="498.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">serving no answer, quickly, to some</text>
<rect x="40" y="540" width="1160" height="60" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="60" rx="2.5" fill="#AC8BE8"/><text x="64" y="576" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A system that does not choose what to drop drops everything, slowly.</text>
<text x="66" y="659" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Degradation where possible, because a worse answer is still an answer. Shedding is the floor underneath it.</text>
</svg>