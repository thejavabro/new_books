<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1160" viewBox="0 0 1240 1160" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four status-code distinctions interviewers probe, each reduced to one question with two answers: 401 against 403, 400 against 409, 403 against 404 for a private resource, and 404 against 410.">
  <defs>
    <filter id="xl07fourdis-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl07fourdis-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl07fourdis-k1"><rect x="146" y="164" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl07fourdis-k2"><rect x="714" y="164" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl07fourdis-k3"><rect x="146" y="396" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl07fourdis-k4"><rect x="714" y="396" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl07fourdis-k5"><rect x="146" y="628" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl07fourdis-k6"><rect x="714" y="628" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl07fourdis-k7"><rect x="146" y="860" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl07fourdis-k8"><rect x="714" y="860" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1160" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="980" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Four distinctions, four questions</text>

  
  <rect x="64" y="88" width="1112" height="212" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="124" font-size="16.5" font-weight="600" fill="#1D4ED8">401 or 403?</text>
  <text x="88" y="146" font-size="15.5" fill="#6B7280">Are valid authentication credentials missing?</text>

  <g filter="url(#xl07fourdis-soft)">
    <rect x="146" y="164" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="146" y="164" width="6" height="90" fill="#2563EB" clip-path="url(#xl07fourdis-k1)"/>
  </g>
  <circle cx="184" cy="209" r="18" fill="#FFFFFF"/>
  <g transform="translate(173.56,198.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="210" y="216" font-size="18.5" font-weight="600" fill="#111827">Missing or invalid: 401</text>
  <text x="336" y="279" font-size="15.5" text-anchor="middle" fill="#6B7280">The token is missing, expired, or invalid.</text>

  <g filter="url(#xl07fourdis-soft)">
    <rect x="714" y="164" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="714" y="164" width="6" height="90" fill="#2563EB" clip-path="url(#xl07fourdis-k2)"/>
  </g>
  <circle cx="752" cy="209" r="18" fill="#FFFFFF"/>
  <g transform="translate(741.56,198.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="778" y="216" font-size="18.5" font-weight="600" fill="#111827">No: 403</text>
  <text x="904" y="279" font-size="15.5" text-anchor="middle" fill="#6B7280">The server refuses the requested access.</text>

  
  <rect x="64" y="320" width="1112" height="212" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="88" y="356" font-size="16.5" font-weight="600" fill="#BE185D">400 or 409?</text>
  <text x="88" y="378" font-size="15.5" fill="#6B7280">Would the same input be valid against a different current state?</text>

  <g filter="url(#xl07fourdis-soft)">
    <rect x="146" y="396" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="146" y="396" width="6" height="90" fill="#DB2777" clip-path="url(#xl07fourdis-k3)"/>
  </g>
  <circle cx="184" cy="441" r="18" fill="#FFFFFF"/>
  <g transform="translate(173.56,430.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="210" y="448" font-size="18.5" font-weight="600" fill="#111827">No: 400</text>
  <text x="336" y="511" font-size="15.5" text-anchor="middle" fill="#6B7280">The input is invalid in every state.</text>

  <g filter="url(#xl07fourdis-soft)">
    <rect x="714" y="396" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="714" y="396" width="6" height="90" fill="#DB2777" clip-path="url(#xl07fourdis-k4)"/>
  </g>
  <circle cx="752" cy="441" r="18" fill="#FFFFFF"/>
  <g transform="translate(741.56,430.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="778" y="448" font-size="18.5" font-weight="600" fill="#111827">Yes: 409</text>
  <text x="904" y="511" font-size="15.5" text-anchor="middle" fill="#6B7280">Valid input, impossible right now.</text>

  
  <rect x="64" y="552" width="1112" height="212" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="588" font-size="16.5" font-weight="600" fill="#047857">403 or 404?</text>
  <text x="88" y="610" font-size="15.5" fill="#6B7280">Would a distinct error reveal a private resource?</text>

  <g filter="url(#xl07fourdis-soft)">
    <rect x="146" y="628" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="146" y="628" width="6" height="90" fill="#059669" clip-path="url(#xl07fourdis-k5)"/>
  </g>
  <circle cx="184" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(173.56,662.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="210" y="680" font-size="18.5" font-weight="600" fill="#111827">Yes: 404</text>
  <text x="336" y="743" font-size="15.5" text-anchor="middle" fill="#6B7280">The same answer a missing id returns.</text>

  <g filter="url(#xl07fourdis-soft)">
    <rect x="714" y="628" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="714" y="628" width="6" height="90" fill="#059669" clip-path="url(#xl07fourdis-k6)"/>
  </g>
  <circle cx="752" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(741.56,662.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="778" y="680" font-size="18.5" font-weight="600" fill="#111827">No: 403</text>
  <text x="904" y="743" font-size="15.5" text-anchor="middle" fill="#6B7280">The caller already knows this resource exists.</text>

  
  <rect x="64" y="784" width="1112" height="212" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="88" y="820" font-size="16.5" font-weight="600" fill="#B45309">404 or 410?</text>
  <text x="88" y="842" font-size="15.5" fill="#6B7280">Is it safe and useful to reveal that this resource once existed?</text>

  <g filter="url(#xl07fourdis-lift)">
    <rect x="146" y="860" width="380" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="146" y="860" width="9" height="90" fill="#D97706" clip-path="url(#xl07fourdis-k7)"/>
  </g>
  <circle cx="184" cy="905" r="18" fill="#FFFFFF"/>
  <g transform="translate(173.56,894.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="210" y="912" font-size="18.5" font-weight="600" fill="#111827">No: 404</text>
  <text x="336" y="975" font-size="15.5" text-anchor="middle" fill="#6B7280">Do not reveal that it once existed.</text>

  <g filter="url(#xl07fourdis-soft)">
    <rect x="714" y="860" width="380" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="714" y="860" width="6" height="90" fill="#D97706" clip-path="url(#xl07fourdis-k8)"/>
  </g>
  <circle cx="752" cy="905" r="18" fill="#FFFFFF"/>
  <g transform="translate(741.56,894.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="778" y="912" font-size="18.5" font-weight="600" fill="#111827">Yes: 410</text>
  <text x="904" y="975" font-size="15.5" text-anchor="middle" fill="#6B7280">A synchronizer can stop retrying the reference.</text>

  
  <rect x="40" y="1044" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1089" text-anchor="middle" font-size="16" fill="#475569">A private resource returns 404 rather than 403, so the API never confirms that a guessed id exists.</text>
</svg>