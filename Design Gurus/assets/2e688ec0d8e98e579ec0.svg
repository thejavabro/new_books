<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1475" viewBox="0 0 1240 1475" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven hard parts of the offline messaging client: queueing one durable change at a time per conversation, distinguishing retryable from never-retry, catching up from the sync position, deletions appearing in the change list, layering live replay over durable sync, computing unread counts from two server numbers, and combining receipt intent.">
  <defs>
    <filter id="p3o-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3o-k1"><rect x="76" y="174" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3o-k2"><rect x="76" y="324" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3o-k3"><rect x="76" y="535" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3o-k4"><rect x="76" y="685" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3o-k5"><rect x="76" y="835" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3o-k6"><rect x="76" y="1046" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3o-k7"><rect x="76" y="1196" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1475" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Messaging client: seven hard parts, seven decisions</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each card is the hard part, the gray line is the decision it forces</text>

  
  <rect x="40" y="126" width="1160" height="337" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">Sending safely from a queue that may restart</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two hard parts</text>

  <g filter="url(#p3o-soft)">
    <rect x="76" y="174" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#D97706" clip-path="url(#p3o-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">One queued change at a time</text>
  <text x="76" y="288" font-size="15.5" fill="#6B7280">Per conversation, so ordering and dependencies stay correct</text>

  <g filter="url(#p3o-soft)">
    <rect x="76" y="324" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="324" width="6" height="90" fill="#D97706" clip-path="url(#p3o-k2)"/>
  </g>
  <circle cx="114" cy="369" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,358.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="376" font-size="18.5" font-weight="600" fill="#111827">Retryable against never-retry</text>
  <text x="76" y="438" font-size="15.5" fill="#6B7280">The queue classifies the failure before advancing, and stops that conversation at the first one</text>

  
  <rect x="40" y="487" width="1160" height="487" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="517" font-size="16.5" font-weight="600" fill="#475569">Catching up, including the deletions a client cannot see</text>
  <text x="1176" y="517" text-anchor="end" font-size="15.5" fill="#6B7280">three hard parts</text>

  <g filter="url(#p3o-soft)">
    <rect x="76" y="535" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="535" width="6" height="90" fill="#D97706" clip-path="url(#p3o-k3)"/>
  </g>
  <circle cx="114" cy="580" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,569.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="587" font-size="18.5" font-weight="600" fill="#111827">Catch up from the sync position</text>
  <text x="76" y="649" font-size="15.5" fill="#6B7280">A changes operation returns authoritative changes after an opaque position</text>

  <g filter="url(#p3o-soft)">
    <rect x="76" y="685" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="685" width="6" height="90" fill="#D97706" clip-path="url(#p3o-k4)"/>
  </g>
  <circle cx="114" cy="730" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,719.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="737" font-size="18.5" font-weight="600" fill="#111827">Deletions must appear</text>
  <text x="76" y="799" font-size="15.5" fill="#6B7280">A tombstone in the change list, because absence is not a signal</text>

  <g filter="url(#p3o-soft)">
    <rect x="76" y="835" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="835" width="6" height="90" fill="#D97706" clip-path="url(#p3o-k5)"/>
  </g>
  <circle cx="114" cy="880" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,869.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="887" font-size="18.5" font-weight="600" fill="#111827">Live replay over durable sync</text>
  <text x="76" y="949" font-size="15.5" fill="#6B7280">The live channel resumes by event id; durable catch-up owns correctness</text>

  
  <rect x="40" y="998" width="1160" height="337" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1028" font-size="16.5" font-weight="600" fill="#475569">On the screen, computed on two devices at once</text>
  <text x="1176" y="1028" text-anchor="end" font-size="15.5" fill="#6B7280">two hard parts</text>

  <g filter="url(#p3o-soft)">
    <rect x="76" y="1046" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1046" width="6" height="90" fill="#D97706" clip-path="url(#p3o-k6)"/>
  </g>
  <circle cx="114" cy="1091" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1080.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="140" y="1098" font-size="18.5" font-weight="600" fill="#111827">Unread counts from two numbers</text>
  <text x="76" y="1160" font-size="15.5" fill="#6B7280">Latest sequence minus the read position, computed rather than stored per client</text>

  <g filter="url(#p3o-soft)">
    <rect x="76" y="1196" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1196" width="6" height="90" fill="#D97706" clip-path="url(#p3o-k7)"/>
  </g>
  <circle cx="114" cy="1241" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1230.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="1248" font-size="18.5" font-weight="600" fill="#111827">Combine receipt intent</text>
  <text x="76" y="1310" font-size="15.5" fill="#6B7280">One receipt for the visible screen, not one write per message</text>

  
  <rect x="40" y="1359" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1404" text-anchor="middle" font-size="16" fill="#475569">Seven pressures decide this design, and they all come from one fact: the client keeps working while it cannot reach the server.</text>
</svg>