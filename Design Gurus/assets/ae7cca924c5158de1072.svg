<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="768" viewBox="0 0 1240 768" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Eight synchronization tools in three groups: protect shared data, control waiting, and hand off and run work, each with its sale-day need and its question">
  <defs>
    <filter id="l10tg-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="l10tg-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="l10tg-k1"><rect x="64" y="96" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="l10tg-k2"><rect x="64" y="268" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="l10tg-k3"><rect x="64" y="440" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="l10tg-k4"><rect x="459" y="96" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="l10tg-k5"><rect x="459" y="268" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="l10tg-k6"><rect x="459" y="440" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="l10tg-k7"><rect x="854" y="96" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="l10tg-k8"><rect x="854" y="268" width="322" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="768" fill="#FFFFFF"/>

  <rect x="40" y="40" width="370" height="578" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="70" font-size="20" font-weight="600" fill="#1D4ED8">Protect shared data</text>

  <g filter="url(#l10tg-soft)">
    <rect x="64" y="96" width="322" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="96" width="6" height="90" fill="#2563EB" clip-path="url(#l10tg-k1)"/>
  </g>
  <circle cx="102" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,130.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="128" y="148" font-size="20" font-weight="600" fill="#111827">Atomic variable</text>
  <text x="225" y="216" font-size="20" text-anchor="middle" fill="#6B7280">Count the page views</text>
  <text x="225" y="244" font-size="20" text-anchor="middle" fill="#94A3B8">Who may change this one value?</text>

  <g filter="url(#l10tg-soft)">
    <rect x="64" y="268" width="322" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="268" width="6" height="90" fill="#2563EB" clip-path="url(#l10tg-k2)"/>
  </g>
  <circle cx="102" cy="313" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,302.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>
  </g>
  <text x="128" y="320" font-size="20" font-weight="600" fill="#111827">Mutex</text>
  <text x="225" y="388" font-size="20" text-anchor="middle" fill="#6B7280">Sell each seat once</text>
  <text x="225" y="416" font-size="20" text-anchor="middle" fill="#94A3B8">Who may change this data right now?</text>

  <g filter="url(#l10tg-soft)">
    <rect x="64" y="440" width="322" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#l10tg-k3)"/>
  </g>
  <circle cx="102" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/>
  </g>
  <text x="128" y="492" font-size="20" font-weight="600" fill="#111827">Read/write lock</text>
  <text x="225" y="560" font-size="20" text-anchor="middle" fill="#6B7280">Show the seat map</text>
  <text x="225" y="588" font-size="20" text-anchor="middle" fill="#94A3B8">Who may read, and who may write?</text>

  <rect x="435" y="40" width="370" height="578" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="459" y="70" font-size="20" font-weight="600" fill="#5B21B6">Control waiting</text>

  <g filter="url(#l10tg-soft)">
    <rect x="459" y="96" width="322" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="459" y="96" width="6" height="90" fill="#7C3AED" clip-path="url(#l10tg-k4)"/>
  </g>
  <circle cx="497" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(486.56,130.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="523" y="148" font-size="20" font-weight="600" fill="#111827">Semaphore</text>
  <text x="620" y="216" font-size="20" text-anchor="middle" fill="#6B7280">Respect the payment limit</text>
  <text x="620" y="244" font-size="20" text-anchor="middle" fill="#94A3B8">How many threads may do this at once?</text>

  <g filter="url(#l10tg-soft)">
    <rect x="459" y="268" width="322" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="459" y="268" width="6" height="90" fill="#7C3AED" clip-path="url(#l10tg-k5)"/>
  </g>
  <circle cx="497" cy="313" r="18" fill="#FFFFFF"/>
  <g transform="translate(486.56,302.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="523" y="320" font-size="20" font-weight="600" fill="#111827">Condition variable</text>
  <text x="620" y="388" font-size="20" text-anchor="middle" fill="#6B7280">Open the waiting room</text>
  <text x="620" y="416" font-size="20" text-anchor="middle" fill="#94A3B8">Has something become true yet?</text>

  <g filter="url(#l10tg-soft)">
    <rect x="459" y="440" width="322" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="459" y="440" width="6" height="90" fill="#7C3AED" clip-path="url(#l10tg-k6)"/>
  </g>
  <circle cx="497" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(486.56,474.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="523" y="492" font-size="20" font-weight="600" fill="#111827">Barrier</text>
  <text x="620" y="560" font-size="20" text-anchor="middle" fill="#6B7280">Open the gates together</text>
  <text x="620" y="588" font-size="20" text-anchor="middle" fill="#94A3B8">Has every thread reached this point?</text>

  <rect x="830" y="40" width="370" height="578" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="854" y="70" font-size="20" font-weight="600" fill="#047857">Hand off and run work</text>

  <g filter="url(#l10tg-soft)">
    <rect x="854" y="96" width="322" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="854" y="96" width="6" height="90" fill="#059669" clip-path="url(#l10tg-k7)"/>
  </g>
  <circle cx="892" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(881.56,130.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="918" y="148" font-size="20" font-weight="600" fill="#111827">Bounded blocking queue</text>
  <text x="1015" y="216" font-size="20" text-anchor="middle" fill="#6B7280">Process the orders</text>
  <text x="1015" y="244" font-size="20" text-anchor="middle" fill="#94A3B8">Who does this piece of work next?</text>

  <g filter="url(#l10tg-soft)">
    <rect x="854" y="268" width="322" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="854" y="268" width="6" height="90" fill="#059669" clip-path="url(#l10tg-k8)"/>
  </g>
  <circle cx="892" cy="313" r="18" fill="#FFFFFF"/>
  <g transform="translate(881.56,302.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="918" y="320" font-size="20" font-weight="600" fill="#111827">Thread pool</text>
  <text x="1015" y="388" font-size="20" text-anchor="middle" fill="#6B7280">Send the confirmation emails</text>
  <text x="1015" y="416" font-size="20" text-anchor="middle" fill="#94A3B8">Which thread should run this task?</text>

  <rect x="40" y="658" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="703" text-anchor="middle" font-size="20" fill="#475569">Each coordination need asks one question, and each tool answers one question.</text>
</svg>