<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The string with no centre chosen yet">
<defs>
<filter id="ps-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many substrings of "noon" read the same both ways?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Every palindrome has a centre, so look at every possible centre instead of every substring</text>
<rect x="40" y="106" width="1160" height="528" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">A 4 character string has 7 centres: one on each character, and one between each pair</text>
<text x="327" y="274" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the string</text>
<rect x="351" y="236" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="410" y="273.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">n</text>
<rect x="491" y="236" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="550" y="273.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">o</text>
<rect x="631" y="236" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="690" y="273.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">o</text>
<rect x="771" y="236" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="830" y="273.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">n</text>
<text x="327" y="414" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">found here</text>
<rect x="351" y="386" width="520" height="50" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="611" y="417.84" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">nothing counted yet</text>
<rect x="450" y="460" width="340" height="50" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="492.02" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">count so far: 0</text>
<text x="620" y="574" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Odd length palindromes sit on a character, even length ones sit between two</text>
<rect x="40" y="646" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="686" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Grow outwards from a centre while both sides still match</text>
<text x="620" y="718" text-anchor="middle" font-size="18.5" fill="#475569">Each step outwards that matches is one more palindrome, counted as it is found</text>
</svg>