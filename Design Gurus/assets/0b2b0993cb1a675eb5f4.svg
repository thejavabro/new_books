<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="746" viewBox="0 0 1240 746" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The autonomy ladder: suggest, approve, bounded auto, and audited auto, with measured promotion upward, automatic demotion downward, and three standing controls under every stage">
  <defs>
    <marker id="ec3-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="ec3-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="ec3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ec3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ec3-k1"><rect x="60" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ec3-k2"><rect x="360" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ec3-k3"><rect x="660" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ec3-k4"><rect x="960" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ec3-k5"><rect x="142" y="440" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ec3-k6"><rect x="495" y="440" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ec3-k7"><rect x="848" y="440" width="250" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="746" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="294" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">One action tier climbs the ladder</text>
  <rect x="40" y="380" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="410" font-size="16.5" font-weight="600" fill="#475569">Standing controls at every stage</text>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M280,181 H360" marker-end="url(#ec3-memerald)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M382,226 V292 Q382,304 370,304 H270 Q258,304 258,292 V226" marker-end="url(#ec3-mpink)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M580,181 H660" marker-end="url(#ec3-memerald)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M682,226 V292 Q682,304 670,304 H570 Q558,304 558,292 V226" marker-end="url(#ec3-mpink)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M880,181 H960" marker-end="url(#ec3-memerald)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M982,226 V292 Q982,304 970,304 H870 Q858,304 858,292 V226" marker-end="url(#ec3-mpink)"/></g>
  <g filter="url(#ec3-soft)">
    <rect x="60" y="136" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#ec3-k1)"/>
  </g>
  <circle cx="98" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="60" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Stage 1</text>
  <text x="124" y="188" font-size="18.5" font-weight="600" fill="#111827">Suggest</text>
  <text x="170" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a person does</text>
  <text x="170" y="274" font-size="15.5" text-anchor="middle" fill="#6B7280">the real work</text>
  <g filter="url(#ec3-soft)">
    <rect x="360" y="136" width="220" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="360" y="136" width="6" height="90" fill="#7C3AED" clip-path="url(#ec3-k2)"/>
  </g>
  <circle cx="398" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,170.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="360" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Stage 2</text>
  <text x="424" y="188" font-size="18.5" font-weight="600" fill="#111827">Approve</text>
  <text x="470" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a person approves</text>
  <text x="470" y="274" font-size="15.5" text-anchor="middle" fill="#6B7280">or rejects it</text>
  <g filter="url(#ec3-soft)">
    <rect x="660" y="136" width="220" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="660" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#ec3-k3)"/>
  </g>
  <circle cx="698" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="660" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Stage 3</text>
  <text x="724" y="188" font-size="18.5" font-weight="600" fill="#111827">Bounded auto</text>
  <text x="770" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">acts alone below</text>
  <text x="770" y="274" font-size="15.5" text-anchor="middle" fill="#6B7280">a set line</text>
  <g filter="url(#ec3-soft)">
    <rect x="960" y="136" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="960" y="136" width="6" height="90" fill="#059669" clip-path="url(#ec3-k4)"/>
  </g>
  <circle cx="998" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(987.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="960" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Stage 4</text>
  <text x="1024" y="188" font-size="18.5" font-weight="600" fill="#111827">Audited auto</text>
  <text x="1070" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a random sample</text>
  <text x="1070" y="274" font-size="15.5" text-anchor="middle" fill="#6B7280">reviewed after the fact</text>
  <g filter="url(#ec3-soft)">
    <rect x="142" y="440" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="142" y="440" width="6" height="90" fill="#64748B" clip-path="url(#ec3-k5)"/>
  </g>
  <circle cx="180" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(169.56,474.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="206" y="492" font-size="18.5" font-weight="600" fill="#111827">Budget caps</text>
  <text x="267" y="555" font-size="15.5" text-anchor="middle" fill="#6B7280">enforced by the runtime</text>
  <g filter="url(#ec3-soft)">
    <rect x="495" y="440" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="495" y="440" width="6" height="90" fill="#64748B" clip-path="url(#ec3-k6)"/>
  </g>
  <circle cx="533" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(522.56,474.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="559" y="492" font-size="18.5" font-weight="600" fill="#111827">Kill switches</text>
  <text x="620" y="555" font-size="15.5" text-anchor="middle" fill="#6B7280">stop a tier or the whole agent</text>
  <g filter="url(#ec3-soft)">
    <rect x="848" y="440" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="848" y="440" width="6" height="90" fill="#64748B" clip-path="url(#ec3-k7)"/>
  </g>
  <circle cx="886" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(875.56,474.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="912" y="492" font-size="18.5" font-weight="600" fill="#111827">Anomaly alarms</text>
  <text x="973" y="555" font-size="15.5" text-anchor="middle" fill="#6B7280">on action rates</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="320" y="167" fill="#047857">promote</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="320" y="327" fill="#BE185D">demote</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="167" fill="#047857">promote</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="327" fill="#BE185D">demote</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="920" y="167" fill="#047857">promote</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="920" y="327" fill="#BE185D">demote</text></g>
  <rect x="40" y="630" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="675" text-anchor="middle" font-size="16" fill="#475569">Each action tier earns promotion on its own evidence and its own stakes.</text>
</svg>