<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="746" viewBox="0 0 1240 746" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="choose-title choose-desc">
<title id="choose-title">Choosing between the two that exist</title>
<desc id="choose-desc">At-most-once suits high volume streams where a duplicate corrupts an aggregate and a gap averages out. At-least-once suits everything that will be reconciled later, which is why it is the default in nearly every broker.</desc>
<defs>
<marker id="choose-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="choose-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="choose-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="choose-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="746" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Choosing between the two that exist</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Since exactly-once is not available, the real decision is between losing messages and repeating them.</text>
<rect x="40" y="668" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="668" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="380" y="118" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Which error costs more in this stream?</text>
<path d="M440 180V212" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M440 180V212" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#choose-marker-slate)"/>
<path d="M800 180V212" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M800 180V212" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#choose-marker-slate)"/>
<text x="420" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">a duplicate</text>
<text x="820" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a gap</text>
<rect x="40" y="218" width="560" height="282" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 218H46A6 6 0 0 0 40 224V494A6 6 0 0 0 46 500H54Z" fill="#F3CF6A"/><text x="70" y="254" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">At-most-once</text>
<rect x="62" y="274" width="516" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="303" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">metrics samples</text>
<rect x="62" y="326" width="516" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="355" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">telemetry and click events</text>
<rect x="62" y="378" width="516" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="407" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">log shipping</text>
<rect x="62" y="430" width="516" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="459" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cache invalidation hints</text>
<rect x="640" y="218" width="560" height="282" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 218H646A6 6 0 0 0 640 224V494A6 6 0 0 0 646 500H654Z" fill="#39D5AA"/><text x="670" y="254" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">At-least-once</text>
<rect x="662" y="274" width="516" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="303" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">orders and payments</text>
<rect x="662" y="326" width="516" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="355" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">state changes</text>
<rect x="662" y="378" width="516" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="407" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">notifications</text>
<rect x="662" y="430" width="516" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="459" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">anything later reconciled against a database</text>
<rect x="40" y="524" width="560" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="524" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="563" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The ambiguous cases usually are not.</text><text x="64" y="589" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A duplicate email is embarrassing.</text><text x="64" y="615" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A missing password reset is a support ticket.</text>
<rect x="640" y="524" width="560" height="118" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="524" width="5" height="118" rx="2.5" fill="#5EC9EC"/><text x="664" y="560" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">"At-least-once, and the consumer</text><text x="664" y="589" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">deduplicates on the order id"</text><text x="664" y="618" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">is a decision.</text>
<text x="66" y="702" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Naming the deduplication key is what turns a configuration value into a decision.</text>
</svg>