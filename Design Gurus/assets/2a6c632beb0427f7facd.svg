<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Capacity estimation for a calendar service: 100 million users with 10 to 20 million daily, about 5 events per creating user, and roughly 1 KB an event; giving 50 million events a day, 5 to 10 thousand reads a second at peak, and about 20 TB a year">
  <defs>
    <filter id="cales-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cales-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cales-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="cales-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="cales-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="cales-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="cales-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="cales-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Google Calendar: capacity estimation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A modest write rate, a much larger read rate, and a storage number that grows without limit.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">What we assume</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">What follows from it</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#cales-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#cales-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">100M users</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">with 10 to 20 million</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">opening it each day</text>
  <g filter="url(#cales-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#cales-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">5 events each</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">from the 10% who create</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">anything on a given day</text>
  <g filter="url(#cales-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#64748B" clip-path="url(#cales-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">About 1 KB an event</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">metadata and the</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">invitee list</text>
  <g filter="url(#cales-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#059669" clip-path="url(#cales-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">50M events a day</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">about 600 a second, with</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">peaks of 2 to 5 thousand</text>
  <g filter="url(#cales-lift)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="450" y="430" width="9" height="90" fill="#DB2777" clip-path="url(#cales-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">5 to 10k reads a second</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">at peak, roughly ten times</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">the write rate</text>
  <g filter="url(#cales-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#D97706" clip-path="url(#cales-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">About 20 TB a year</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">50 GB a day, so pruning</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">becomes a real question</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">10 to 1</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">reads to writes. People look at a calendar far more often than they change one</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Morning peak</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">scheduling clusters into working mornings, so the peak is several times the daily average</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Growth</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">events are rarely deleted, so storage only accumulates and needs archiving or pruning by design</text>
</svg>