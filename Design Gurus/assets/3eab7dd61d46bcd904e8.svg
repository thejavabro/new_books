<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="472" viewBox="0 0 1240 472" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four kinds of negatives used to train a retrieval model">
  <defs>

    <filter id="m2l1f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l1f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m2l1f-k1"><rect x="50" y="64" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1f-k2"><rect x="334" y="64" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1f-k3"><rect x="618" y="64" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1f-k4"><rect x="1018" y="64" width="170" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="472" fill="#FFFFFF"/>


  <g filter="url(#m2l1f-soft)">
    <rect x="50" y="64" width="170" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#D97706" clip-path="url(#m2l1f-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Random</text>
  <text x="135" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">too easy</text>
  <text x="135" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">may be too easy</text>
  <g filter="url(#m2l1f-lift)">
    <rect x="334" y="64" width="170" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="334" y="64" width="9" height="90" fill="#059669" clip-path="url(#m2l1f-k2)"/>
  </g>
  <circle cx="372" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(361.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="398" y="116" font-size="18.5" font-weight="600" fill="#111827">In-batch</text>
  <text x="419" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">reuses batch items</text>
  <g filter="url(#m2l1f-soft)">
    <rect x="618" y="64" width="286" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="618" y="64" width="6" height="90" fill="#059669" clip-path="url(#m2l1f-k3)"/>
  </g>
  <circle cx="656" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(645.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="682" y="116" font-size="18.5" font-weight="600" fill="#111827">Popularity-corrected</text>
  <text x="761" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">keeps popular items fair</text>
  <g filter="url(#m2l1f-soft)">
    <rect x="1018" y="64" width="170" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="1018" y="64" width="6" height="90" fill="#DB2777" clip-path="url(#m2l1f-k4)"/>
  </g>
  <circle cx="1056" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(1045.56,98.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="1082" y="116" font-size="18.5" font-weight="600" fill="#111827">Hard</text>
  <text x="1103" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">a few only</text>
  <text x="1103" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">check false negatives</text>
  <rect x="40" y="280" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="314" font-size="16" fill="#475569">Explain your sampling choices and compare them using retrieval quality.</text>
  <rect x="64" y="340" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="362" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The recipe</text>
  <text x="288" y="362" font-size="15.5" fill="#475569">in-batch by default, popularity-corrected, plus a small share of hard negatives</text>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The trap</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">too many false negatives can reduce retrieval quality</text>
</svg>