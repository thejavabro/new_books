<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="UUIDv4, ULID, KSUID and Snowflake drawn to scale by bit width, showing how much of each is a timestamp and how much is randomness or coordination">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Four ID formats, drawn to scale, and what each spends its bits on</text>

  <text x="290" y="92" font-size="20" fill="#64748B" text-anchor="end">bits</text>
  <text x="320" y="92" font-size="20" fill="#64748B">0</text>
  <text x="660" y="92" font-size="20" fill="#64748B" text-anchor="middle">64</text>
  <text x="1000" y="92" font-size="20" fill="#64748B" text-anchor="middle">128</text>
  <text x="1170" y="92" font-size="20" fill="#64748B" text-anchor="middle">160</text>

  <text x="290" y="146" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">UUIDv4</text>
  <rect x="320" y="118" width="680" height="44" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="660" y="147" font-size="20" fill="#B91C1C" text-anchor="middle">122 random bits, no time at all</text>

  <text x="290" y="216" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">ULID</text>
  <rect x="320" y="188" width="255" height="44" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="447" y="217" font-size="20" fill="#1E40AF" text-anchor="middle">48 bit time</text>
  <rect x="575" y="188" width="425" height="44" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="787" y="217" font-size="20" fill="#334155" text-anchor="middle">80 random</text>

  <text x="290" y="286" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">KSUID</text>
  <rect x="320" y="258" width="170" height="44" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="405" y="287" font-size="20" fill="#1E40AF" text-anchor="middle">32 bit time</text>
  <rect x="490" y="258" width="680" height="44" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="830" y="287" font-size="20" fill="#334155" text-anchor="middle">128 random</text>

  <text x="290" y="356" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">Snowflake</text>
  <rect x="320" y="328" width="218" height="44" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="429" y="357" font-size="20" fill="#1E40AF" text-anchor="middle">41 bit time</text>
  <rect x="538" y="328" width="53" height="44" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="591" y="328" width="64" height="44" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="700" y="357" font-size="20" fill="#92400E">10 worker, 12 sequence, only 64 bits total</text>

  <rect x="50" y="410" width="1140" height="130" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="448" font-size="20" font-weight="600" fill="#475569">The trade being made</text>
  <text x="70" y="482" font-size="20" fill="#0F172A">More random bits means no coordination is needed, and no useful sort order.</text>
  <text x="70" y="514" font-size="20" fill="#0F172A">More structure means the ID sorts by time, and something has to hand out worker numbers.</text>

  <rect x="50" y="570" width="1140" height="62" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="608" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Snowflake fits in a 64 bit integer, which is why it survives in databases that care about that.</text>
</svg>