  <circle cx="484" cy="142" r="18" fill="#FFFFFF"/>
  <g transform="translate(473.56,131.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="510" y="149" font-size="18.5" font-weight="600" fill="#111827">BFF</text>
  <text x="620" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">a response shaped per client</text>
  <g filter="url(#wr2-soft)">
    <rect x="820" y="104" width="348" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
