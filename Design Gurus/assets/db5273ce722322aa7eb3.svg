      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="wr2-k1"><rect x="72" y="104" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="wr2-k2"><rect x="446" y="104" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="wr2-k3"><rect x="820" y="104" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="wr2-k4"><rect x="72" y="330" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="wr2-k5"><rect x="446" y="330" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="wr2-k6"><rect x="820" y="330" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="wr2-k7"><rect x="72" y="556" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="wr2-k8"><rect x="446" y="556" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="wr2-k9"><rect x="820" y="556" width="348" height="76" rx="12"/></clipPath>
    <filter id="wr2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="wr2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="190" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">At the edge</text>
  <rect x="40" y="270" width="1160" height="190" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="300" font-size="16.5" font-weight="600" fill="#BE185D">Between services</text>
  <rect x="40" y="496" width="1160" height="190" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="526" font-size="16.5" font-weight="600" fill="#5B21B6">Behind each service</text>
