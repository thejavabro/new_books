<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One order system using many of the patterns together: a gateway and BFFs at the edge, discovery and resilience patterns between services, and the data patterns behind each service">
