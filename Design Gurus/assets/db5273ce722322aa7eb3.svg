  <g transform="translate(99.56,131.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="136" y="149" font-size="18.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="246" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">one address for every client</text>
  <g filter="url(#wr2-soft)">
    <rect x="446" y="104" width="348" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="446" y="104" width="6" height="76" fill="#2563EB" clip-path="url(#wr2-k2)"/>
