    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="884" y="149" font-size="18.5" font-weight="600" fill="#111827">Configuration</text>
  <text x="994" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">settings supplied at startup</text>
  <g filter="url(#wr2-soft)">
    <rect x="72" y="330" width="348" height="76" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="330" width="6" height="76" fill="#DB2777" clip-path="url(#wr2-k4)"/>
  </g>
  <circle cx="110" cy="368" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,357.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="136" y="375" font-size="18.5" font-weight="600" fill="#111827">Service Discovery</text>
  <text x="246" y="431" font-size="15.5" text-anchor="middle" fill="#6B7280">find the current addresses</text>
  <g filter="url(#wr2-soft)">
    <rect x="446" y="330" width="348" height="76" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="446" y="330" width="6" height="76" fill="#DB2777" clip-path="url(#wr2-k5)"/>
  </g>
  <circle cx="484" cy="368" r="18" fill="#FFFFFF"/>
  <g transform="translate(473.56,357.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="510" y="375" font-size="18.5" font-weight="600" fill="#111827">Retry and Breaker</text>
  <text x="620" y="431" font-size="15.5" text-anchor="middle" fill="#6B7280">survive a failing dependency</text>
  <g filter="url(#wr2-soft)">
    <rect x="820" y="330" width="348" height="76" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="330" width="6" height="76" fill="#DB2777" clip-path="url(#wr2-k6)"/>
  </g>
  <circle cx="858" cy="368" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,357.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="884" y="375" font-size="18.5" font-weight="600" fill="#111827">Bulkhead and Sidecar</text>
  <text x="994" y="431" font-size="15.5" text-anchor="middle" fill="#6B7280">contain it, and run it</text>
  <g filter="url(#wr2-soft)">
    <rect x="72" y="556" width="348" height="76" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="72" y="556" width="6" height="76" fill="#7C3AED" clip-path="url(#wr2-k7)"/>
  </g>
  <circle cx="110" cy="594" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,583.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="136" y="601" font-size="18.5" font-weight="600" fill="#111827">Database per Service</text>
  <text x="246" y="657" font-size="15.5" text-anchor="middle" fill="#6B7280">one private store each</text>
  <g filter="url(#wr2-soft)">
    <rect x="446" y="556" width="348" height="76" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="446" y="556" width="6" height="76" fill="#7C3AED" clip-path="url(#wr2-k8)"/>
  </g>
  <circle cx="484" cy="594" r="18" fill="#FFFFFF"/>
  <g transform="translate(473.56,583.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="510" y="601" font-size="18.5" font-weight="600" fill="#111827">Saga and Outbox</text>
  <text x="620" y="657" font-size="15.5" text-anchor="middle" fill="#6B7280">change data across services</text>
  <g filter="url(#wr2-soft)">
    <rect x="820" y="556" width="348" height="76" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="820" y="556" width="6" height="76" fill="#7C3AED" clip-path="url(#wr2-k9)"/>
  </g>
  <circle cx="858" cy="594" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,583.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="884" y="601" font-size="18.5" font-weight="600" fill="#111827">CQRS and Sourcing</text>
  <text x="994" y="657" font-size="15.5" text-anchor="middle" fill="#6B7280">shape reads, keep history</text>
  <rect x="40" y="722" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="746" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="768" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">The edge</text>
  <text x="288" y="768" font-size="15.5" fill="#475569">what a client reaches, and where each service gets its settings</text>
  <rect x="64" y="790" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="812" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The middle</text>
  <text x="288" y="812" font-size="15.5" fill="#475569">how services find each other and keep one failure from spreading</text>
  <rect x="64" y="834" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="856" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">The data</text>
  <text x="288" y="856" font-size="15.5" fill="#475569">how each service stores its own truth and changes it across boundaries</text>
</svg>