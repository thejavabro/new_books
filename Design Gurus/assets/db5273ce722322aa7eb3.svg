    <path d="M620,234 V264" marker-end="url(#wr2-mslate)"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,460 V490" marker-end="url(#wr2-mslate)"/>
  </g>
  <g filter="url(#wr2-soft)">
