<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="584" viewBox="0 0 1240 584" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="three-title three-desc">
<title id="three-title">The whole design space</title>
<desc id="three-desc">Once a cached value goes out of date there are only three responses: let it expire, update it in place, or delete it so the next read repopulates. Each makes a different promise about what a reader can observe.</desc>
<defs>
<marker id="three-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="three-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="three-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="three-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="584" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The whole design space</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Once a value is in a cache and the underlying data changes, you have exactly three options.</text>
<rect x="40" y="506" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="506" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="254" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V366A6 6 0 0 0 46 372H54Z" fill="#39D5AA"/>
<circle cx="92" cy="160" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="92" y="168" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="128" y="154" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Let it expire</text>
<text x="128" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">do nothing on write</text>
<text x="64" y="222" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">what a reader gets</text>
<rect x="60" y="234" width="332" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="272" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Wrong for at most T seconds</text>
<text x="64" y="328" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">self-healing, and the only one</text><text x="64" y="353" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that needs nothing of the writer</text>
<rect x="434" y="118" width="372" height="254" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V366A6 6 0 0 0 440 372H448Z" fill="#F3CF6A"/>
<circle cx="486" cy="160" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="486" y="168" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="522" y="154" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Update it</text>
<text x="522" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">write the new value in</text>
<text x="458" y="222" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">what a reader gets</text>
<rect x="454" y="234" width="332" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="272" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reads see the write at once</text>
<text x="458" y="328" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not idempotent, and wrong forever</text><text x="458" y="353" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if two writes land out of order</text>
<rect x="828" y="118" width="372" height="254" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V366A6 6 0 0 0 834 372H842Z" fill="#5EC9EC"/>
<circle cx="880" cy="160" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="880" y="168" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="916" y="154" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Delete it</text>
<text x="916" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">remove on write</text>
<text x="852" y="222" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">what a reader gets</text>
<rect x="848" y="234" width="332" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1014" y="258.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Next read loads</text><text x="1014" y="285.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">from the store</text>
<text x="852" y="328" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">idempotent and order-proof, at the</text><text x="852" y="353" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cost of one extra miss</text>
<rect x="40" y="396" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="396" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="429.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Everything else is a variation on these three, or a decision about who performs them.</text><text x="64" y="458.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The difficulty is never the mechanism. It is which promise the product can tolerate.</text>
<text x="66" y="540" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Not which is best. What is the worst thing a reader can see under each one.</text>
</svg>