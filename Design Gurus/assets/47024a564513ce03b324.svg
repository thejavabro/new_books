<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A sequential key appends to one hot page at the right edge; a random key splits pages across the whole tree and leaves them half empty">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="ix11-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ix11-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ix11-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="ix11-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="424" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">Sequential key: every insert lands at the right edge</text>

  <rect x="640" y="76" width="580" height="424" rx="14" fill="#FFFBEB" fill-opacity="0.4" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">Random key: inserts land anywhere</text>

  
  <path d="M310,156 C310,215 530,205 530,244" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#ix11-green)"/>

  
  <g filter="url(#ix11-soft)">
    <rect x="230" y="104" width="160" height="52" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="310" y="138" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">new row</text>

  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="452" y="200" font-size="20" fill="#047857" text-anchor="middle">always here</text>
  </g>

  <rect x="50" y="250" width="120" height="110" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="55" y="256" width="110" height="98" rx="4" fill="#BBF7D0"/>
  <rect x="190" y="250" width="120" height="110" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="195" y="256" width="110" height="98" rx="4" fill="#BBF7D0"/>
  <rect x="330" y="250" width="120" height="110" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="335" y="256" width="110" height="98" rx="4" fill="#BBF7D0"/>
  <rect x="470" y="250" width="120" height="110" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <rect x="475" y="304" width="110" height="50" rx="4" fill="#BBF7D0"/>

  <text x="110" y="390" font-size="20" fill="#64748B" text-anchor="middle">page 1</text>
  <text x="250" y="390" font-size="20" fill="#64748B" text-anchor="middle">page 2</text>
  <text x="390" y="390" font-size="20" fill="#64748B" text-anchor="middle">page 3</text>
  <text x="530" y="390" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">hot page</text>

  <text x="310" y="436" font-size="20" fill="#334155" text-anchor="middle">One page is hot. It fills, then a new one starts.</text>
  <text x="310" y="466" font-size="20" fill="#334155" text-anchor="middle">The pages behind it stay nearly full.</text>

  
  <path d="M930,156 C930,215 730,205 730,244" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ix11-amber)"/>
  <path d="M930,156 C930,215 1010,215 1010,244" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ix11-amber)"/>
  <path d="M930,156 C930,215 1150,205 1150,244" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ix11-amber)"/>

  
  <g filter="url(#ix11-soft)">
    <rect x="850" y="104" width="160" height="52" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="930" y="138" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">new row</text>

  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="930" y="208" font-size="20" fill="#B45309" text-anchor="middle">anywhere</text>
  </g>

  <rect x="670" y="250" width="120" height="110" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <rect x="675" y="288" width="110" height="66" rx="4" fill="#FDE68A"/>
  <rect x="810" y="250" width="120" height="110" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="815" y="288" width="110" height="66" rx="4" fill="#FDE68A"/>
  <rect x="950" y="250" width="120" height="110" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <rect x="955" y="288" width="110" height="66" rx="4" fill="#FDE68A"/>
  <rect x="1090" y="250" width="120" height="110" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <rect x="1095" y="288" width="110" height="66" rx="4" fill="#FDE68A"/>

  <text x="730" y="390" font-size="20" fill="#64748B" text-anchor="middle">page 1</text>
  <text x="870" y="390" font-size="20" fill="#64748B" text-anchor="middle">page 2</text>
  <text x="1010" y="390" font-size="20" fill="#64748B" text-anchor="middle">page 3</text>
  <text x="1150" y="390" font-size="20" fill="#64748B" text-anchor="middle">page 4</text>

  <text x="930" y="436" font-size="20" fill="#334155" text-anchor="middle">Splits happen all over the tree, and each one</text>
  <text x="930" y="466" font-size="20" fill="#334155" text-anchor="middle">leaves pages around 70 percent full.</text>

  
  <rect x="170" y="536" width="890" height="110" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="205" y="580" font-size="20" font-weight="600" fill="#334155">What a split does:</text>
  <text x="205" y="610" font-size="20" fill="#334155">it writes two pages instead of one.</text>

  <line x1="790" y1="591" x2="838" y2="591" stroke="#475569" stroke-width="2" marker-end="url(#ix11-slate)"/>

  <rect x="700" y="554" width="80" height="74" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="704" y="558" width="72" height="66" rx="4" fill="#CBD5E1"/>
  <rect x="850" y="554" width="80" height="74" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="854" y="592" width="72" height="32" rx="4" fill="#CBD5E1"/>
  <rect x="950" y="554" width="80" height="74" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="954" y="592" width="72" height="32" rx="4" fill="#CBD5E1"/>

  <text x="620" y="690" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A key that arrives in order costs one page. A key that arrives at random costs a read, a split and wasted space.</text>
</svg>