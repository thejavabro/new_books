<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The original four node cycle with nothing copied yet">
<defs>
<filter id="cg-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Copy this graph so the copy shares no node with the original</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The four nodes form a cycle, which is the whole difficulty</text>
<rect x="40" y="106" width="1160" height="552" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The map remembers which originals already have a copy, and it starts empty</text>
<text x="350" y="180" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">the original</text>
<line x1="250" y1="236" x2="450" y2="236" stroke="#94A3B8" stroke-width="2.5"/>
<line x1="250" y1="236" x2="250" y2="436" stroke="#94A3B8" stroke-width="2.5"/>
<line x1="450" y1="236" x2="450" y2="436" stroke="#94A3B8" stroke-width="2.5"/>
<line x1="450" y1="436" x2="250" y2="436" stroke="#94A3B8" stroke-width="2.5"/>
<circle cx="250" cy="236" r="34" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="250" y="244" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">1</text>
<circle cx="450" cy="236" r="34" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="450" y="244" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">2</text>
<circle cx="450" cy="436" r="34" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="450" y="444" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">3</text>
<circle cx="250" cy="436" r="34" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="250" y="444" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">4</text>
<text x="860" y="180" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">the copy</text>
<line x1="760" y1="236" x2="960" y2="236" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="760" y1="236" x2="760" y2="436" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="960" y1="236" x2="960" y2="436" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="960" y1="436" x2="760" y2="436" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="760" cy="236" r="34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5"/>
<text x="760" y="244" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">1'</text>
<circle cx="960" cy="236" r="34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5"/>
<text x="960" y="244" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">2'</text>
<circle cx="960" cy="436" r="34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5"/>
<text x="960" y="444" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">3'</text>
<circle cx="760" cy="436" r="34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5"/>
<text x="760" y="444" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">4'</text>
<text x="190" y="564" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the map</text>
<text x="210" y="564" font-size="18" fill="#475569">empty</text>
<text x="620" y="628" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Walking the connections from 1 leads back to 1, so a plain walk never stops</text>
<rect x="40" y="668" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="708" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Put a copy in the map before walking its connections, not after</text>
<text x="620" y="740" text-anchor="middle" font-size="18.5" fill="#475569">Copying first and recording afterwards lets the walk re-enter a node it is already inside</text>
</svg>