<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="822" viewBox="0 0 1240 822" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="distmono-title distmono-desc">
<title id="distmono-title">The distributed monolith</title>
<desc id="distmono-desc">The worst outcome of a split is not a monolith and not microservices. It is services with all the costs of distribution and none of the independence, usually caused by splitting along technical layers.</desc>
<defs>
<marker id="distmono-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="distmono-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="distmono-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="distmono-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="822" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The distributed monolith</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The worst outcome of a split is not a monolith and not microservices.</text>
<rect x="40" y="744" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="744" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="155" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Can you deploy any one of these without coordinating another?</text>
<rect x="40" y="208" width="254" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="167" y="244" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">service A</text>
<path d="M302 238H336" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M302 238H336" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#distmono-marker-red)"/>
<path d="M167 268V310" fill="none" stroke="#91642E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="342" y="208" width="254" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="469" y="244" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">service B</text>
<path d="M604 238H638" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M604 238H638" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#distmono-marker-red)"/>
<path d="M469 268V310" fill="none" stroke="#91642E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="644" y="208" width="254" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="771" y="244" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">service C</text>
<path d="M906 238H940" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M906 238H940" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#distmono-marker-red)"/>
<path d="M771 268V310" fill="none" stroke="#91642E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="946" y="208" width="254" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1073" y="244" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">service D</text>
<path d="M1073 268V310" fill="none" stroke="#91642E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="310" width="1160" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="341" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one shared database</text>
<text x="620" y="392" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">availability is the product of all four, and no service owns its data</text>
<text x="40" y="436" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The symptoms</text>
<rect x="40" y="454" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="488" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deployed together, in a required order</text>
<rect x="640" y="454" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="488" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a shared database, so no service owns its data</text>
<rect x="40" y="522" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="556" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">synchronous call chains across four services</text>
<rect x="640" y="522" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="556" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">nothing can be tested independently</text>
<rect x="40" y="600" width="1160" height="118" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="600" width="5" height="118" rx="2.5" fill="#F3CF6A"/><text x="64" y="639" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The usual cause: splitting by technical layer rather than by domain.</text><text x="64" y="665" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">An API service, a logic service and a data service always deploy together,</text><text x="64" y="691" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">because every feature touches all three.</text>
<text x="66" y="778" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">If the answer is no, they are one system with network calls inserted into the middle of it.</text>
</svg>