<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="All four projects waiting, ordered by the capital they need">
<defs>
<filter id="mc-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="736" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Pick 3 of these 4 projects to end with the most capital</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Starting capital is 0, and a finished project hands back its cost plus its profit</text>
<rect x="40" y="106" width="1160" height="484" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Every project starts in the waiting row, ordered by the capital it needs</text>
<rect x="470" y="432" width="300" height="46" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="620" y="462" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">capital now: 0</text>
<text x="276" y="237" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">cannot afford yet</text>
<rect x="300" y="196" width="132" height="66" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="366" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">needs 0</text>
<text x="366" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">project 0, profit 1</text>
<rect x="448" y="196" width="132" height="66" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="514" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">needs 1</text>
<text x="514" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">project 1, profit 2</text>
<rect x="596" y="196" width="132" height="66" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="662" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">needs 2</text>
<text x="662" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">project 2, profit 3</text>
<rect x="744" y="196" width="132" height="66" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="810" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">needs 3</text>
<text x="810" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">project 3, profit 5</text>
<text x="366" y="184" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">front</text>
<text x="276" y="371" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">can afford now</text>
<text x="306" y="370" font-size="18" fill="#475569">nothing has moved across yet</text>
<text x="620" y="512" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Capital only ever grows, so a project that becomes affordable stays affordable</text>
<rect x="40" y="602" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="642" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Order the waiting row by cost, and the ready row by profit</text>
<text x="620" y="674" text-anchor="middle" font-size="18.5" fill="#475569">Then each round is: move whatever just became affordable across, and take the best of it</text>
</svg>