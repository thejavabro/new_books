<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Replication can make several copies and may lag behind, while mirroring keeps one copy in step with the original at all times">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="db11-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="db11-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="db11-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="390" rx="14" fill="#ECFDF5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="80" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Replication</text>

  <rect x="640" y="40" width="580" height="390" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="80" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Mirroring</text>

  <line x1="310" y1="176" x2="130" y2="228" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#db11-emerald)"/>
  <line x1="310" y1="176" x2="310" y2="228" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#db11-emerald)"/>
  <line x1="310" y1="176" x2="490" y2="228" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#db11-emerald)"/>

  <line x1="930" y1="176" x2="930" y2="228" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#db11-blue)"/>

  <g filter="url(#db11-soft)">
    <rect x="190" y="110" width="240" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="232" width="140" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="240" y="232" width="140" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="420" y="232" width="140" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

    <rect x="810" y="110" width="240" height="66" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="810" y="232" width="240" height="66" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>

  <text x="310" y="150" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Primary</text>
  <text x="130" y="272" font-size="20" fill="#065F46" text-anchor="middle">Copy</text>
  <text x="310" y="272" font-size="20" fill="#065F46" text-anchor="middle">Copy</text>
  <text x="490" y="272" font-size="20" fill="#065F46" text-anchor="middle">Copy</text>
  <text x="310" y="326" font-size="20" fill="#059669" text-anchor="middle">may lag behind</text>

  <text x="930" y="150" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Original</text>
  <text x="930" y="272" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Mirror</text>
  <text x="930" y="326" font-size="20" fill="#2563EB" text-anchor="middle">always in step</text>

  <text x="310" y="372" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Several copies, sync or async</text>
  <text x="930" y="372" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">One copy, typically synchronous</text>
  <text x="310" y="404" font-size="20" fill="#475569" text-anchor="middle">availability, load balancing, reporting</text>
  <text x="930" y="404" font-size="20" fill="#475569" text-anchor="middle">disaster recovery, high availability</text>

  <text x="620" y="472" font-size="20" fill="#475569" text-anchor="middle">Mirroring costs more in write performance, because every write waits for the mirror</text>
</svg>