<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two Instagram requests through the API gateway. Uploading a photo is routing: the gateway checks the token and forwards the request to one service. Opening the feed is aggregation: the gateway calls the feed service and the notification service at the same time and combines the two replies into one response">
  <defs>
    <marker id="ag2-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="ag2-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="ag2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ag2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ag2-a1"><rect x="72" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ag2-a2"><rect x="455" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ag2-a3"><rect x="838" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ag2-b1"><rect x="72" y="398" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="ag2-b2"><rect x="357" y="398" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="ag2-b3"><rect x="642" y="398" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="ag2-b4"><rect x="927" y="398" width="240" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Uploading a photo: the gateway checks the token, then forwards to one service</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#5B21B6">Opening the feed: the gateway calls two services at once and combines the replies</text>

  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M402,157 L451,157" marker-end="url(#ag2-bl)"/>
    <path d="M785,157 L834,157" marker-end="url(#ag2-bl)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M312,443 L353,443" marker-end="url(#ag2-vi)"/>
    <path d="M597,443 L638,443" marker-end="url(#ag2-vi)"/>
    <path d="M882,443 L923,443" marker-end="url(#ag2-vi)"/>
  </g>

  
  <g filter="url(#ag2-soft)">
    <rect x="72" y="112" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#2563EB" clip-path="url(#ag2-a1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Instagram App</text>
  <text x="237" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">uploads a photo</text>
  <text x="237" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">one request to one address</text>

  <g filter="url(#ag2-lift)">
    <rect x="455" y="112" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="455" y="112" width="9" height="90" fill="#2563EB" clip-path="url(#ag2-a2)"/>
  </g>
  <circle cx="493" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="519" y="164" font-size="18.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="620" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">checks the token first</text>
  <text x="620" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">then routes to one service</text>

  <g filter="url(#ag2-soft)">
    <rect x="838" y="112" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="838" y="112" width="6" height="90" fill="#2563EB" clip-path="url(#ag2-a3)"/>
  </g>
  <circle cx="876" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="5" width="20" height="14" rx="2"/>
    <path d="M2 10h20"/>
  </g>
  <text x="902" y="164" font-size="18.5" font-weight="600" fill="#111827">Photo Service</text>
  <text x="1003" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">processes and stores it</text>
  <text x="1003" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">replies to the gateway</text>

  
  <g filter="url(#ag2-soft)">
    <rect x="72" y="398" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="72" y="398" width="6" height="90" fill="#7C3AED" clip-path="url(#ag2-b1)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Instagram App</text>
  <text x="192" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">opens the feed</text>
  <text x="192" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">makes one request</text>

  <g filter="url(#ag2-lift)">
    <rect x="357" y="398" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="357" y="398" width="9" height="90" fill="#7C3AED" clip-path="url(#ag2-b2)"/>
  </g>
  <circle cx="395" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(384.56,432.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="421" y="450" font-size="18.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="477" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">authenticates the user</text>
  <text x="477" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">then calls both services</text>

  <g filter="url(#ag2-soft)">
    <rect x="642" y="398" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="642" y="398" width="6" height="90" fill="#7C3AED" clip-path="url(#ag2-b3)"/>
  </g>
  <circle cx="680" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(669.56,432.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="706" y="450" font-size="18.5" font-weight="600" fill="#111827">Two Services</text>
  <text x="762" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">feed and notifications</text>
  <text x="762" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">asked at the same time</text>

  <g filter="url(#ag2-soft)">
    <rect x="927" y="398" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="927" y="398" width="6" height="90" fill="#7C3AED" clip-path="url(#ag2-b4)"/>
  </g>
  <circle cx="965" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(954.56,432.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="991" y="450" font-size="18.5" font-weight="600" fill="#111827">One Response</text>
  <text x="1047" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">the gateway combines them</text>
  <text x="1047" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">the app gets one payload</text>

  
  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Routing</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">one request in, one service called, one reply out, and the gateway adds only the auth check</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Aggregation</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">one request in, several services called at once, one combined reply out, so the app makes one call</text>
</svg>