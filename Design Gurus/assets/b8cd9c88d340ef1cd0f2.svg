<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="794" viewBox="0 0 1240 794" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cost-title cost-desc">
<title id="cost-title">What it actually costs</title>
<desc id="cost-desc">The infrastructure bill is the smallest part and the only part usually estimated. The permanent cost is that every change now happens twice, and drift between the two is what breaks failovers.</desc>
<defs>
<marker id="cost-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="cost-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="cost-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="cost-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="794" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What it actually costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The infrastructure bill is the smallest part and the only part that usually gets estimated.</text>
<rect x="40" y="716" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="716" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Roughly double the infrastructure</text>
<path d="M526 150H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 150H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cost-marker-slate)"/>
<rect x="570" y="118" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">plus cross-region transfer, charged where</text><text x="590" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">intra-region frequently is not</text>
<rect x="40" y="194" width="480" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A permanent cost on every change</text>
<path d="M526 226H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 226H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cost-marker-slate)"/>
<rect x="570" y="194" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every deploy, migration, config and secret</text><text x="590" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">now happens in two places</text>
<rect x="40" y="270" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">New failure modes</text>
<path d="M526 302H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 302H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cost-marker-slate)"/>
<rect x="570" y="270" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">split brain, visible replication lag, and one</text><text x="590" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">region slow rather than dead</text>
<rect x="40" y="346" width="480" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The engineering time</text>
<path d="M526 378H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 378H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cost-marker-slate)"/>
<rect x="570" y="346" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the real cost for a small team, spent on something</text><text x="590" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that produces no features</text>
<rect x="40" y="426" width="1160" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="458" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Preventing drift between the two is ongoing work rather than a one-off</text>
<rect x="40" y="498" width="1160" height="108" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="498" width="5" height="108" rx="2.5" fill="#F28B9D"/><text x="64" y="532" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">And the structural problem from the first lesson</text><text x="64" y="558" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The second region is the one that is not exercised,</text><text x="64" y="584" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">so it is the one that is quietly broken.</text>
<rect x="40" y="626" width="1160" height="64" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="626" width="5" height="64" rx="2.5" fill="#AC8BE8"/><text x="64" y="664" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">A region that has never served traffic is a hypothesis about your availability.</text>
<text x="66" y="750" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Buying it without drilling it buys a belief rather than a capability.</text>
</svg>