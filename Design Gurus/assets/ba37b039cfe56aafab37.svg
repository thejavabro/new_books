<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The full Yelp design, where searches fan out from aggregator servers to partitioned QuadTree servers, the aggregator then reads the full place records through a cache in front of the places database, and a QuadTree Index server rebuilds lost servers from that same database.">
  <defs>
    <marker id="yp04-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="yp04-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="yp04-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="yp04-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yp04-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="yp04-k1"><rect x="40" y="215" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k2"><rect x="280" y="215" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k3"><rect x="570" y="112" width="256" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k4"><rect x="570" y="227" width="256" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k5"><rect x="570" y="342" width="256" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k6"><rect x="968" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k7"><rect x="968" y="227" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k8"><rect x="968" y="342" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k9"><rect x="640" y="615" width="296" height="90" rx="12"/></clipPath>
    <clipPath id="yp04-k10"><rect x="124" y="470" width="272" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="960" fill="#FFFFFF"/>

  
  <rect x="550" y="60" width="296" height="400" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="574" y="90" font-size="16.5" font-weight="600" fill="#5B21B6">Aggregator Servers</text>
  <rect x="950" y="60" width="272" height="400" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="974" y="90" font-size="16.5" font-weight="600" fill="#1D4ED8">QuadTree Servers</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M210,260 H280" marker-end="url(#yp04-bl)"/>
    <path d="M494,260 H550" marker-end="url(#yp04-bl)"/>
    <path d="M846,272 H968" marker-end="url(#yp04-bl)"/>
    <path d="M846,272 H870 Q882,272 882,260 V169 Q882,157 894,157 H968" marker-end="url(#yp04-bl)"/>
    <path d="M846,272 H870 Q882,272 882,284 V375 Q882,387 894,387 H968" marker-end="url(#yp04-bl)"/>
    <path d="M570,387 H500 Q488,387 488,399 V503 Q488,515 476,515 H404" marker-end="url(#yp04-bl)"/>
    <path d="M260,560 V586" marker-end="url(#yp04-bl)"/>
  </g>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M380,660 H640" marker-end="url(#yp04-am)"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M936,660 H1188 Q1200,660 1200,648 V460" marker-end="url(#yp04-sl)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="245" y="250" fill="#1D4ED8">search</text>
    <text x="907" y="120" fill="#1D4ED8">query all</text>
    <text x="907" y="142" fill="#1D4ED8">partitions</text>
    <text x="510" y="650" fill="#B45309">walk all places once</text>
    <text x="1067" y="650" fill="#475569">rebuild a dead server</text>
    <text x="395" y="435" fill="#1D4ED8">fetch place details</text>
    <text x="395" y="457" fill="#1D4ED8">by LocationID</text>
    <text x="350" y="580" fill="#1D4ED8">on a cache miss</text>
  </g>

  
  <g filter="url(#yp04-soft)">
    <rect x="40" y="215" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="215" width="6" height="90" fill="#2563EB" clip-path="url(#yp04-k1)"/>
  </g>
  <circle cx="78" cy="260" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,249.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="104" y="267" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#yp04-soft)">
    <rect x="280" y="215" width="214" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="280" y="215" width="6" height="90" fill="#64748B" clip-path="url(#yp04-k2)"/>
  </g>
  <circle cx="318" cy="260" r="18" fill="#FFFFFF"/>
  <g transform="translate(307.56,249.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="344" y="267" font-size="18.5" font-weight="600" fill="#111827">Load Balancer</text>

  
  <g filter="url(#yp04-soft)">
    <rect x="570" y="112" width="256" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="570" y="112" width="6" height="90" fill="#7C3AED" clip-path="url(#yp04-k3)"/>
  </g>
  <circle cx="608" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(597.56,146.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="634" y="164" font-size="18.5" font-weight="600" fill="#111827">Aggregator Server</text>

  <g filter="url(#yp04-soft)">
    <rect x="570" y="227" width="256" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="570" y="227" width="6" height="90" fill="#7C3AED" clip-path="url(#yp04-k4)"/>
  </g>
  <circle cx="608" cy="272" r="18" fill="#FFFFFF"/>
  <g transform="translate(597.56,261.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="634" y="279" font-size="18.5" font-weight="600" fill="#111827">Aggregator Server</text>

  <g filter="url(#yp04-soft)">
    <rect x="570" y="342" width="256" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="570" y="342" width="6" height="90" fill="#7C3AED" clip-path="url(#yp04-k5)"/>
  </g>
  <circle cx="608" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(597.56,376.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="634" y="394" font-size="18.5" font-weight="600" fill="#111827">Aggregator Server</text>

  
  <g filter="url(#yp04-soft)">
    <rect x="968" y="112" width="236" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="968" y="112" width="6" height="90" fill="#2563EB" clip-path="url(#yp04-k6)"/>
  </g>
  <circle cx="1006" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(995.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <path d="M12 3v18M3 12h18"/>
    <path d="M16.5 3v9M12 7.5h9"/>
  </g>
  <text x="1032" y="164" font-size="18.5" font-weight="600" fill="#111827">QuadTree Server</text>

  <g filter="url(#yp04-soft)">
    <rect x="968" y="227" width="236" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="968" y="227" width="6" height="90" fill="#2563EB" clip-path="url(#yp04-k7)"/>
  </g>
  <circle cx="1006" cy="272" r="18" fill="#FFFFFF"/>
  <g transform="translate(995.56,261.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <path d="M12 3v18M3 12h18"/>
    <path d="M16.5 3v9M12 7.5h9"/>
  </g>
  <text x="1032" y="279" font-size="18.5" font-weight="600" fill="#111827">QuadTree Server</text>

  <g filter="url(#yp04-soft)">
    <rect x="968" y="342" width="236" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="968" y="342" width="6" height="90" fill="#2563EB" clip-path="url(#yp04-k8)"/>
  </g>
  <circle cx="1006" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(995.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <path d="M12 3v18M3 12h18"/>
    <path d="M16.5 3v9M12 7.5h9"/>
  </g>
  <text x="1032" y="394" font-size="18.5" font-weight="600" fill="#111827">QuadTree Server</text>

  
  <text x="698" y="485" font-size="15.5" text-anchor="middle" fill="#6B7280">merge nearby results from every partition</text>
  <text x="1086" y="485" font-size="15.5" text-anchor="middle" fill="#6B7280">each holds its own tree</text>
  <text x="1086" y="508" font-size="15.5" text-anchor="middle" fill="#6B7280">over its hash-share of places</text>
  <text x="1086" y="531" font-size="15.5" text-anchor="middle" fill="#94A3B8">primary plus replica</text>

  
  <g filter="url(#yp04-soft)">
    <rect x="124" y="470" width="272" height="90" rx="12" fill="#CCFBF1" stroke="#5EEAD4" stroke-width="1.5"/>
    <rect x="124" y="470" width="6" height="90" fill="#0D9488" clip-path="url(#yp04-k10)"/>
  </g>
  <circle cx="162" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(151.56,504.56) scale(0.87)" fill="none" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2 L4 14h6l-1 8 9-12h-6z"/>
  </g>
  <text x="188" y="522" font-size="18.5" font-weight="600" fill="#111827">Cache</text>
  <text x="190" y="450" font-size="15.5" text-anchor="middle" fill="#6B7280">hot places, LRU eviction</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M140,610 L140,714 A120,16 0 0 0 380,714 L380,610" fill="#FEF3C7"/>
    <ellipse cx="260" cy="610" rx="120" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="260" y="676" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Places Database</text>
  <text x="260" y="757" font-size="15.5" text-anchor="middle" fill="#6B7280">full place records, reviews, photos</text>

  
  <g filter="url(#yp04-lift)">
    <rect x="640" y="615" width="296" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="640" y="615" width="9" height="90" fill="#64748B" clip-path="url(#yp04-k9)"/>
  </g>
  <circle cx="678" cy="660" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,649.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="704" y="667" font-size="18.5" font-weight="600" fill="#111827">QuadTree Index Server</text>
  <text x="788" y="730" font-size="15.5" text-anchor="middle" fill="#6B7280">reverse index: which places</text>
  <text x="788" y="753" font-size="15.5" text-anchor="middle" fill="#6B7280">each server holds, for rebuilds</text>

  
  <rect x="40" y="800" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="818" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="840" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Search path</text>
  <text x="288" y="840" font-size="15.5" fill="#475569">fan out to every partition, merge the LocationIDs, then read the full records through the cache</text>
  <rect x="64" y="862" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="884" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Recovery path</text>
  <text x="288" y="884" font-size="15.5" fill="#475569">the Index server tells a replacement server which places to fetch</text>
</svg>