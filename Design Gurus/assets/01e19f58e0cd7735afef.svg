<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three columns, each holding one scaling problem above its answer. The durable write: billions of reaction rows are too large for one node, so the table is sharded by user_id, which spreads one video reactions across every shard. The hot cache key: one count is one key on one node taking fifty thousand writes a second, so the key is split into ten, with writes picking one at random and a read summing all ten. The read path: two hundred and fifty thousand reads a second, mostly comment counts, become one batched call of about eleven and a half thousand a second carrying twenty-one keys each.">
  <defs>
    <filter id="ytscale-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytscale-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytscale-k1"><rect x="65" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ytscale-k2"><rect x="65" y="360" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ytscale-k3"><rect x="460" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ytscale-k4"><rect x="460" y="360" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ytscale-k5"><rect x="855" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ytscale-k6"><rect x="855" y="360" width="320" height="90" rx="12"/></clipPath>
    <marker id="ytscale-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ytscale-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ytscale-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three scaling problems, three different answers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Sharding spreads the durable writes. It does nothing for one hot key, and nothing for the read path.</text>

  <rect x="40" y="110" width="370" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">The durable write</text>
  <rect x="435" y="110" width="370" height="420" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="459" y="140" font-size="19.5" font-weight="600" fill="#B45309">The hot cache key</text>
  <rect x="830" y="110" width="370" height="420" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="854" y="140" font-size="19.5" font-weight="600" fill="#047857">The read path</text>

  <g fill="none" stroke-width="2">
    <path d="M225 300 V 354" stroke="#2563EB" marker-end="url(#ytscale-m-blue)"/>
    <path d="M620 300 V 354" stroke="#D97706" marker-end="url(#ytscale-m-amber)"/>
    <path d="M1015 300 V 354" stroke="#059669" marker-end="url(#ytscale-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ytscale-soft)">
    <rect x="65" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="65" y="165" width="6" height="90" fill="#64748B" clip-path="url(#ytscale-k1)"/>
  </g>
  <circle cx="103" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="129" y="217" font-size="21.5" font-weight="600" fill="#111827">Billions of rows</text>
  <text x="225" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">too large for one node</text>
  <g filter="url(#ytscale-lift)">
    <rect x="65" y="360" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="65" y="360" width="9" height="90" fill="#2563EB" clip-path="url(#ytscale-k2)"/>
  </g>
  <circle cx="103" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="129" y="412" font-size="21.5" font-weight="600" fill="#111827">Shard by user_id</text>
  <text x="225" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">one video's reactions</text>
  <text x="225" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">land on every shard</text>
  <g filter="url(#ytscale-soft)">
    <rect x="460" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="460" y="165" width="6" height="90" fill="#64748B" clip-path="url(#ytscale-k3)"/>
  </g>
  <circle cx="498" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="524" y="217" font-size="21.5" font-weight="600" fill="#111827">One key, one node</text>
  <text x="620" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">50,000 writes a second</text>
  <g filter="url(#ytscale-lift)">
    <rect x="460" y="360" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="460" y="360" width="9" height="90" fill="#D97706" clip-path="url(#ytscale-k4)"/>
  </g>
  <circle cx="498" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,394.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="524" y="412" font-size="21.5" font-weight="600" fill="#111827">Split into ten keys</text>
  <text x="620" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">writes pick one at random</text>
  <text x="620" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">a read sums all ten</text>
  <g filter="url(#ytscale-soft)">
    <rect x="855" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="855" y="165" width="6" height="90" fill="#64748B" clip-path="url(#ytscale-k5)"/>
  </g>
  <circle cx="893" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="919" y="217" font-size="21.5" font-weight="600" fill="#111827">250,000 reads</text>
  <text x="1015" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">a second, mostly comments</text>
  <g filter="url(#ytscale-lift)">
    <rect x="855" y="360" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="855" y="360" width="9" height="90" fill="#059669" clip-path="url(#ytscale-k6)"/>
  </g>
  <circle cx="893" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="919" y="412" font-size="21.5" font-weight="600" fill="#111827">One batched call</text>
  <text x="1015" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">about 11,500 a second</text>
  <text x="1015" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">of 21 keys each</text>

  <rect x="40" y="570" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="595" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Shard by user_id</text>
  <text x="323" y="620" font-size="18.5" fill="#475569">Spreads the writes, because the people reacting differ even when the video does not.</text>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Split the hot key</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">Sharding cannot divide one key. Ten keys can, summed in a single pipelined read.</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Batch the read</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">One call per page turns 250,000 requests a second into roughly 11,500.</text>
</svg>