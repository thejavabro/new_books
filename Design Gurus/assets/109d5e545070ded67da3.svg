<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Each result points at the design decision it forces: read heavy traffic to a cache, large outgoing bandwidth to a CDN, petabytes to object storage, and a terabyte of popular photos kept at the CDN edges rather than in memory">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="be10b-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="be10b-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="280" y="55" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">What the numbers said</text>
  <text x="960" y="55" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">What the design must do</text>

  <line x1="505" y1="120" x2="730" y2="120" stroke="#D97706" stroke-width="2.5" marker-end="url(#be10b-amber)"/>
  <line x1="505" y1="220" x2="730" y2="220" stroke="#D97706" stroke-width="2.5" marker-end="url(#be10b-amber)"/>
  <line x1="505" y1="320" x2="730" y2="320" stroke="#D97706" stroke-width="2.5" marker-end="url(#be10b-amber)"/>
  <line x1="505" y1="420" x2="730" y2="420" stroke="#D97706" stroke-width="2.5" marker-end="url(#be10b-amber)"/>

  <g filter="url(#be10b-soft)">
    <rect x="60" y="80" width="440" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="180" width="440" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="280" width="440" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="380" width="440" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

    <rect x="740" y="80" width="440" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="740" y="180" width="440" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="740" y="280" width="440" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="740" y="380" width="440" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="280" y="128" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">30,000 reads against 300 writes</text>
  <text x="280" y="228" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">15 GB a second at peak</text>
  <text x="280" y="328" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">30 PB kept</text>
  <text x="280" y="428" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">1 TB of popular photos</text>

  <text x="960" y="128" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">A cache and read replicas</text>
  <text x="960" y="228" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">A content delivery network</text>
  <text x="960" y="328" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Object storage, not a database</text>
  <text x="960" y="428" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Kept at CDN edges, not in memory</text>

  <text x="620" y="486" font-size="20" fill="#475569" text-anchor="middle">This is the payoff: every number forces a decision that can be defended</text>
</svg>