<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="842" viewBox="0 0 1240 842" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rightsize-title rightsize-desc">
<title id="rightsize-title">Rightsizing, which comes first</title>
<desc id="rightsize-desc">Four checks find most of the waste: utilization at peak, which resource is binding, the instance generation, and storage provisioned for a load test. Rightsize, then shape, then commit.</desc>
<defs>
<marker id="rightsize-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="rightsize-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="rightsize-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="rightsize-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="842" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Rightsizing, which comes first</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four checks find most of the waste.</text>
<rect x="40" y="764" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="764" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="155" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The instance type was a guess made when the service was created, and never revisited.</text>
<circle cx="60" cy="226" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="196" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Utilization at peak, not average</text>
<path d="M566 226H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 226H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rightsize-marker-slate)"/>
<rect x="610" y="196" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a service peaking at fifteen percent CPU is two</text><text x="630" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sizes too large</text>
<circle cx="60" cy="296" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="303" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="266" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="302" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Which resource is binding</text>
<path d="M566 296H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 296H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rightsize-marker-slate)"/>
<rect x="610" y="266" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="289.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a memory-bound service on a compute instance pays</text><text x="630" y="314.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for cores it cannot use</text>
<circle cx="60" cy="366" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="373" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="336" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="372" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The instance generation</text>
<path d="M566 366H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 366H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rightsize-marker-slate)"/>
<rect x="610" y="336" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="359.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">newer families are routinely cheaper per unit of</text><text x="630" y="384.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">work, and it is a config edit</text>
<circle cx="60" cy="436" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="443" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="406" width="470" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Storage provisioning</text>
<path d="M566 436H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 436H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rightsize-marker-slate)"/>
<rect x="610" y="406" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">throughput bought for a load test that ran once,</text><text x="630" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">never reduced since</text>
<rect x="40" y="484" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="484" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="521" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Dull, needs no architectural change, and often returns more than any autoscaling work.</text>
<text x="40" y="584" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And it has to be first</text>
<rect x="40" y="602" width="348" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="214" y="636" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Rightsize</text>
<path d="M398 630H436" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M398 630H436" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rightsize-marker-slate)"/>
<rect x="446" y="602" width="348" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="636" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Shape</text>
<path d="M804 630H842" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M804 630H842" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rightsize-marker-slate)"/>
<rect x="852" y="602" width="348" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1026" y="636" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Commit</text>
<rect x="40" y="676" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="676" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="713" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">Autoscaling a fleet of oversized instances only varies the number of oversized instances.</text>
<text x="66" y="798" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Reversing the order means committing for three years to capacity you did not need.</text>
</svg>