<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two contracts compared. In one consistent model the caller learns operation one and operation two, then guesses operation three correctly, because the id style, the timestamp names, the cursor and the error shape repeat. In a contract with a new shape every time, operation three cannot be guessed and the caller reads the documentation again, because the id style, the casing, the paging and the error shape all changed. Consistency is saved learning effort, not visual neatness.">
  <defs>
    <marker id="yl06predict-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="yl06predict-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="yl06predict-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl06predict-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl06predict-k1"><rect x="84" y="210" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl06predict-k2"><rect x="84" y="274" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl06predict-k3"><rect x="84" y="398" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl06predict-k4"><rect x="684" y="210" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl06predict-k5"><rect x="684" y="274" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl06predict-k6"><rect x="684" y="398" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Consistency lets a caller predict parts of the API they have never read</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">two contracts, the same third operation</text>

  
  <rect x="40" y="126" width="556" height="448" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="84" y="156" font-size="16.5" font-weight="600" fill="#047857">One consistent model</text>

  <text x="84" y="196" font-size="15.5" font-weight="600" fill="#047857">Learned</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M320,322 V398" stroke="#059669" marker-end="url(#yl06predict-em)"/>
  </g>

  <g filter="url(#yl06predict-soft)">
    <rect x="84" y="210" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="210" width="6" height="48" fill="#64748B" clip-path="url(#yl06predict-k1)"/>
  </g>
  <circle cx="118" cy="234" r="4.5" fill="#64748B"/>
  <text x="142" y="241" font-size="18.5" font-weight="600" fill="#111827">Operation 1</text>

  <g filter="url(#yl06predict-soft)">
    <rect x="84" y="274" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="274" width="6" height="48" fill="#64748B" clip-path="url(#yl06predict-k2)"/>
  </g>
  <circle cx="118" cy="298" r="4.5" fill="#64748B"/>
  <text x="142" y="305" font-size="18.5" font-weight="600" fill="#111827">Operation 2</text>

  <text x="84" y="366" font-size="15.5" font-weight="600" fill="#047857">Predicted</text>

  <g filter="url(#yl06predict-lift)">
    <rect x="84" y="398" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="84" y="398" width="9" height="48" fill="#059669" clip-path="url(#yl06predict-k3)"/>
  </g>
  <circle cx="118" cy="422" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,413) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="142" y="429" font-size="18.5" font-weight="600" fill="#111827">Operation 3, guessed correctly</text>

  <text x="84" y="491" font-size="15.5" font-weight="600" fill="#047857">Because these repeat</text>
  <circle cx="92" cy="516" r="3.5" fill="#059669"/>
  <text x="106" y="521" font-size="15.5" fill="#6B7280">Same id style, same _at names</text>
  <circle cx="92" cy="546" r="3.5" fill="#059669"/>
  <text x="106" y="551" font-size="15.5" fill="#6B7280">Same cursor, same error shape</text>

  
  <rect x="644" y="126" width="556" height="448" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="684" y="156" font-size="16.5" font-weight="600" fill="#BE185D">A new shape every time</text>

  <text x="684" y="196" font-size="15.5" font-weight="600" fill="#BE185D">Learned</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M920,322 V398" stroke="#DB2777" marker-end="url(#yl06predict-pk)"/>
  </g>

  <g filter="url(#yl06predict-soft)">
    <rect x="684" y="210" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="210" width="6" height="48" fill="#64748B" clip-path="url(#yl06predict-k4)"/>
  </g>
  <circle cx="718" cy="234" r="4.5" fill="#64748B"/>
  <text x="742" y="241" font-size="18.5" font-weight="600" fill="#111827">Operation 1</text>

  <g filter="url(#yl06predict-soft)">
    <rect x="684" y="274" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="274" width="6" height="48" fill="#64748B" clip-path="url(#yl06predict-k5)"/>
  </g>
  <circle cx="718" cy="298" r="4.5" fill="#64748B"/>
  <text x="742" y="305" font-size="18.5" font-weight="600" fill="#111827">Operation 2</text>

  <text x="684" y="366" font-size="15.5" font-weight="600" fill="#BE185D">Not predicted</text>

  <g filter="url(#yl06predict-lift)">
    <rect x="684" y="398" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="684" y="398" width="9" height="48" fill="#DB2777" clip-path="url(#yl06predict-k6)"/>
  </g>
  <circle cx="718" cy="422" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,413) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="742" y="429" font-size="18.5" font-weight="600" fill="#111827">Operation 3, read the docs again</text>

  <text x="684" y="491" font-size="15.5" font-weight="600" fill="#BE185D">Because these change</text>
  <circle cx="692" cy="516" r="3.5" fill="#DB2777"/>
  <text x="706" y="521" font-size="15.5" fill="#6B7280">New id style, new casing</text>
  <circle cx="692" cy="546" r="3.5" fill="#DB2777"/>
  <text x="706" y="551" font-size="15.5" fill="#6B7280">New paging, new error shape</text>

  
  <rect x="40" y="614" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="659" text-anchor="middle" font-size="16" fill="#475569">Consistency reduces how much developers need to learn.</text>
</svg>