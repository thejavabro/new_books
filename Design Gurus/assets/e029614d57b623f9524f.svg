<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Tokens drip into the bucket at a fixed rate, each request removes one, and a request arriving at an empty bucket is rejected">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="rl3-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rl3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rl3-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rl3-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="rl3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="560" y1="78" x2="560" y2="145" stroke="#D97706" stroke-width="3" marker-end="url(#rl3-amber)"/>
  <line x1="250" y1="270" x2="415" y2="270" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rl3-blue)"/>
  <line x1="700" y1="230" x2="785" y2="230" stroke="#059669" stroke-width="2.5" marker-end="url(#rl3-green)"/>
  <line x1="700" y1="350" x2="785" y2="350" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rl3-red)"/>

  <g filter="url(#rl3-soft)">
    <rect x="40" y="230" width="210" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="420" y="150" width="280" height="230" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
    <rect x="790" y="190" width="330" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="790" y="310" width="330" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <circle cx="452" cy="340" r="22" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="506" cy="340" r="22" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="560" cy="340" r="22" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="614" cy="340" r="22" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="668" cy="340" r="22" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="452" cy="284" r="22" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="506" cy="284" r="22" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="560" cy="284" r="22" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="614" cy="284" r="22" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="668" cy="284" r="22" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="560" y="60" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Refill: 1 token per second</text>
  <text x="560" y="196" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Bucket, capacity 10</text>
  <text x="560" y="228" font-size="20" fill="#B45309" text-anchor="middle">6 tokens available</text>

  <text x="145" y="278" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Request arrives</text>
  <text x="332" y="248" font-size="20" fill="#3B82F6" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">takes 1 token</text>

  <text x="955" y="238" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Served, 5 tokens left</text>
  <text x="955" y="350" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Bucket empty</text>
  <text x="955" y="382" font-size="20" fill="#DC2626" text-anchor="middle">request rejected</text>

  <text x="620" y="455" font-size="20" fill="#475569" text-anchor="middle">A full bucket lets a burst of 10 through at once, while the long run rate stays at the refill rate</text>
</svg>