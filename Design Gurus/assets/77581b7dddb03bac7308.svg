<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An order record with order_id, customer_id and total_amount flows into an enricher filter, which fetches customer details from a customer database, and comes out as an order record with customer details: order_id, customer_id, total_amount, customer_name, customer_tier and is_first_order">
  <defs>
    <filter id="m08h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m08h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m08h-k1"><rect x="64" y="180" width="312" height="90" rx="12"/></clipPath>
    <clipPath id="m08h-k2"><rect x="470" y="180" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="m08h-k3"><rect x="864" y="180" width="312" height="90" rx="12"/></clipPath>
    <marker id="m08h-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m08h-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Enricher filter: adding external information</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The enricher looks up customer details and adds them to the order record.</text>

  <rect x="40" y="120" width="360" height="264" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Input data</text>
  <rect x="840" y="120" width="360" height="264" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="864" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Enriched data</text>

  <g fill="none" stroke-width="2">
    <path d="M376,225 H470" stroke="#64748B" marker-end="url(#m08h-m-slate)"/>
    <path d="M770,225 H864" stroke="#64748B" marker-end="url(#m08h-m-slate)"/>
    <path d="M620,414 V270" stroke="#2563EB" marker-end="url(#m08h-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m08h-soft)">
    <rect x="64" y="180" width="312" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#m08h-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Order record</text>
  <text x="220" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">order_id, customer_id,</text>
  <text x="220" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">total_amount</text>
  <g filter="url(#m08h-lift)">
    <rect x="470" y="180" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="470" y="180" width="9" height="90" fill="#4F46E5" clip-path="url(#m08h-k2)"/>
  </g>
  <circle cx="508" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,214.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="534" y="232" font-size="21.5" font-weight="600" fill="#111827">Enricher filter</text>
  <g filter="url(#m08h-soft)">
    <rect x="864" y="180" width="312" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="864" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#m08h-k3)"/>
  </g>
  <circle cx="902" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(891.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="928" y="219.25" font-size="21.5" font-weight="600" fill="#111827">Order record with</text>
  <text x="928" y="244.75" font-size="21.5" font-weight="600" fill="#111827">customer details</text>
  <text x="1020" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">order_id, customer_id, total_amount,</text>
  <text x="1020" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">customer_name, customer_tier,</text>
  <text x="1020" y="353" font-size="18.5" text-anchor="middle" fill="#94A3B8">is_first_order</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M520,430 L520,514 A100,16 0 0 0 720,514 L720,430" fill="#DBEAFE"/>
    <ellipse cx="620" cy="430" rx="100" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="620" y="474.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Customer</text>
  <text x="620" y="499.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">database</text>
  <text x="620" y="564" font-size="18.5" text-anchor="middle" fill="#6B7280">customer details</text>
  <text x="636" y="322" font-size="18.5" fill="#6B7280">fetches additional data</text>
  <text x="636" y="349" font-size="18.5" fill="#6B7280">from external sources</text>




</svg>