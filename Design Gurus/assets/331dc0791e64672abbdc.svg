<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="890" viewBox="0 0 1240 890" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four panels. Slow certificates, a traffic issue: a Monday p95 of 44 minutes against 2.1 on other days, with 28,000 digest emails ahead in one lane; it reopens ADR 0043; the answer retains the design and adds worker lanes, about 3 engineer-days. Billing releases, a structural issue: 7 waits behind freezes and 4 behind rollbacks, the same at every hour; it reopens ADR 0041; the answer is a separate Billing deployable on the shared PostgreSQL server, about 6 engineer-weeks. Reporting pressure, a traffic issue: an API p95 of 610 ms in the refresh minutes, and a refresh of 9 minutes at peak and 3 at 04:00; it reopens ADR 0041; the answer retains the design and moves report reads to a read replica with an incremental refresh, 6 engineer-days. Cross-feature changes, a structural issue: 41 pull requests changed the same 3 modules, and one completion rule exists in three places; it reopens ADR 0041; the answer is a refactor inside the monolith that gives the rule one owner, about 2 engineer-weeks.">
