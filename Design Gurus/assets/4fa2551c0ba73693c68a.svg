<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="725" viewBox="0 0 1240 725" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A composition root builds a per-request session, StripePaymentGateway and InventoryService; it injects the session into the data access layer and the gateway and inventory service into the business logic layer; the repository implementation is injected into OrderService, which depends on interfaces, and OrderService is stored on the app, where the orders controller reads it">
  <defs>
    <filter id="m02g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m02g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m02g-k1"><rect x="64" y="170" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m02g-k2"><rect x="440" y="170" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m02g-k3"><rect x="816" y="170" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m02g-k4"><rect x="56" y="522" width="288" height="90" rx="12"/></clipPath>
    <clipPath id="m02g-k5"><rect x="476" y="522" width="288" height="90" rx="12"/></clipPath>
    <clipPath id="m02g-k6"><rect x="896" y="522" width="288" height="90" rx="12"/></clipPath>
    <marker id="m02g-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="725" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Dependency injection: how layers are wired together</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The composition root builds every concrete object and injects each one into the layer that needs it.</text>

  <rect x="40" y="120" width="1160" height="200" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Composition root</text>
  <rect x="40" y="430" width="320" height="240" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="460" font-size="19.5" font-weight="600" fill="#5B21B6">Data access layer</text>
  <rect x="460" y="430" width="320" height="240" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="484" y="460" font-size="19.5" font-weight="600" fill="#047857">Business logic layer</text>
  <rect x="880" y="430" width="320" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="904" y="460" font-size="19.5" font-weight="600" fill="#1D4ED8">Presentation layer</text>

  <g fill="none" stroke-width="2">
    <path d="M200,320 V430" stroke="#4F46E5" marker-end="url(#m02g-m-indigo)"/>
    <path d="M620,320 V430" stroke="#4F46E5" marker-end="url(#m02g-m-indigo)"/>
    <path d="M996,320 V368 Q996,380 984,380 H632 Q620,380 620,392" stroke="#4F46E5"/>
    <path d="M360,567 H460" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#m02g-m-indigo)"/>
    <path d="M780,567 H880" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#m02g-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="634" y="357" fill="#4338CA" text-anchor="start">Inject dependencies</text>
    <text x="410" y="529" fill="#4338CA">Injected</text>
    <text x="410" y="551" fill="#4338CA">into</text>
    <text x="830" y="529" fill="#4338CA">Stored on</text>
    <text x="830" y="551" fill="#4338CA">the app</text>
  </g>

  <g filter="url(#m02g-soft)">
    <rect x="64" y="170" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="170" width="6" height="90" fill="#7C3AED" clip-path="url(#m02g-k1)"/>
  </g>
  <circle cx="102" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,204.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="128" y="222" font-size="20" font-weight="600" fill="#111827">Session (per request)</text>
  <text x="244" y="289" font-size="18.5" text-anchor="middle" fill="#6B7280">(PostgreSQL)</text>
  <g filter="url(#m02g-soft)">
    <rect x="440" y="170" width="360" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="440" y="170" width="6" height="90" fill="#D97706" clip-path="url(#m02g-k2)"/>
  </g>
  <circle cx="478" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,204.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="504" y="222" font-size="20" font-weight="600" fill="#111827">StripePaymentGateway</text>
  <text x="620" y="289" font-size="18.5" text-anchor="middle" fill="#6B7280">(Stripe)</text>
  <g filter="url(#m02g-soft)">
    <rect x="816" y="170" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="816" y="170" width="6" height="90" fill="#059669" clip-path="url(#m02g-k3)"/>
  </g>
  <circle cx="854" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(843.56,204.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="880" y="222" font-size="20" font-weight="600" fill="#111827">InventoryService</text>
  <text x="996" y="289" font-size="18.5" text-anchor="middle" fill="#6B7280">(Business service)</text>
  <g filter="url(#m02g-soft)">
    <rect x="56" y="522" width="288" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="56" y="522" width="6" height="90" fill="#7C3AED" clip-path="url(#m02g-k4)"/>
  </g>
  <text x="76" y="574" font-size="19.5" font-weight="600" fill="#111827">PostgresOrderRepository</text>
  <text x="200" y="641" font-size="18.5" text-anchor="middle" fill="#6B7280">(Implementation)</text>
  <g filter="url(#m02g-soft)">
    <rect x="476" y="522" width="288" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="476" y="522" width="6" height="90" fill="#059669" clip-path="url(#m02g-k5)"/>
  </g>
  <text x="496" y="574" font-size="19.5" font-weight="600" fill="#111827">OrderService</text>
  <text x="620" y="641" font-size="18.5" text-anchor="middle" fill="#6B7280">(Depends on interfaces)</text>
  <g filter="url(#m02g-soft)">
    <rect x="896" y="522" width="288" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="896" y="522" width="6" height="90" fill="#2563EB" clip-path="url(#m02g-k6)"/>
  </g>
  <text x="916" y="574" font-size="19.5" font-weight="600" fill="#111827">Orders controller</text>
  <text x="1040" y="641" font-size="18.5" text-anchor="middle" fill="#6B7280">(Depends on service)</text>
  <text x="64" y="486" font-size="18.5" fill="#5B21B6">(Repositories, ORM)</text>
  <text x="484" y="486" font-size="18.5" fill="#047857">(Services, Use Cases)</text>
  <text x="904" y="486" font-size="18.5" fill="#1D4ED8">(Controllers, API handlers)</text>




</svg>