<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A map of the rapid-fire question bank: 40 questions fan out into six groups, the big decision with 5 questions, boundaries with 5, communication with 7, resilience with 9, data and consistency with 9, and operations with 5.">
  <defs>
    <marker id="m08-l01-question-map-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m08-l01-question-map-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
