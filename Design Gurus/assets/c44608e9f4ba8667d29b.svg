  </g>

  <line x1="60" y1="830" x2="96" y2="830" stroke="#475569" stroke-width="4"/>
  <text x="108" y="837" font-size="20" fill="#475569">Architecture decisions, and where the lines go</text>
  <line x1="60" y1="870" x2="96" y2="870" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="877" font-size="20" fill="#475569">Synchronous calls, APIs, and failure handling</text>
  <line x1="60" y1="910" x2="96" y2="910" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="917" font-size="20" fill="#475569">Events, consistency, the platform, and security</text>
