    <marker id="m08-l01-question-map-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m08-l01-question-map-soft" x="-10%" y="-10%" width="120%" height="130%">
