  </g>
  <text x="230" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The Big Decision</text>
  <text x="230" y="283" text-anchor="middle" font-size="20" fill="#64748B">5 questions</text>
  <g filter="url(#m08-l01-question-map-soft)">
    <rect x="60" y="400" width="340" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="451" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Boundaries</text>
  <text x="230" y="483" text-anchor="middle" font-size="20" fill="#64748B">5 questions</text>
  <g filter="url(#m08-l01-question-map-soft)">
    <rect x="60" y="600" width="340" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="230" y="651" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Communication</text>
  <text x="230" y="683" text-anchor="middle" font-size="20" fill="#64748B">7 questions</text>
  <g filter="url(#m08-l01-question-map-soft)">
    <rect x="840" y="200" width="340" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1010" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Resilience</text>
  <text x="1010" y="283" text-anchor="middle" font-size="20" fill="#64748B">9 questions</text>
  <g filter="url(#m08-l01-question-map-soft)">
    <rect x="840" y="400" width="340" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1010" y="451" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Data and consistency</text>
  <text x="1010" y="483" text-anchor="middle" font-size="20" fill="#64748B">9 questions</text>
  <g filter="url(#m08-l01-question-map-soft)">
    <rect x="840" y="600" width="340" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1010" y="651" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Operations</text>
