  </g>
  <text x="620" y="665" text-anchor="middle" font-size="20" fill="#475569">Cover the answer,</text>
  <text x="620" y="697" text-anchor="middle" font-size="20" fill="#475569">say yours out loud,</text>
  <text x="620" y="729" text-anchor="middle" font-size="20" fill="#475569">then compare</text>

  <g fill="none" stroke-width="2.5">
    <path d="M450,440 C420,440 430,260 408,260" stroke="#475569" stroke-width="2" marker-end="url(#m08-l01-question-map-sl)"/>
    <path d="M450,470 L408,460" stroke="#475569" stroke-width="2" marker-end="url(#m08-l01-question-map-sl)"/>
    <path d="M450,500 C420,500 430,660 408,660" stroke="#3B82F6" stroke-width="2" marker-end="url(#m08-l01-question-map-bl)"/>
    <path d="M790,440 C820,440 810,260 832,260" stroke="#DC2626" stroke-width="2" marker-end="url(#m08-l01-question-map-rd)"/>
    <path d="M790,470 L832,460" stroke="#D97706" stroke-width="2" marker-end="url(#m08-l01-question-map-ab)"/>
