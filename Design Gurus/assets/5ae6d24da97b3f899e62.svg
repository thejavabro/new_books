<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array and its counts, smallest first">
<defs>
<filter id="lu-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="674" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Removing exactly 6 numbers, how few different values can be left?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array holds 4 different values, appearing 1, 2, 3, 4 times</text>
<rect x="40" y="106" width="1160" height="420" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">A value disappears only when every copy of it is removed, so its count is its price</text>
<text x="93" y="214" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">array</text>
<rect x="115" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="161" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="217" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="263" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="319" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="365" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="421" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="467" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="523" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="569" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="625" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="671" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="727" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="773" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="829" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="875" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="931" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="977" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="1033" y="176" width="92" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="1079" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="307" y="438" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">counts, smallest first</text>
<rect x="329" y="400" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="395" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="395" y="482" text-anchor="middle" font-size="15.5" fill="#94A3B8">appears 1x</text>
<rect x="479" y="400" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="545" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="545" y="482" text-anchor="middle" font-size="15.5" fill="#94A3B8">appears 2x</text>
<rect x="629" y="400" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="695" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="695" y="482" text-anchor="middle" font-size="15.5" fill="#94A3B8">appears 3x</text>
<rect x="779" y="400" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="845" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="845" y="482" text-anchor="middle" font-size="15.5" fill="#94A3B8">appears 4x</text>
<text x="620" y="318" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">The budget is 6 removals, and clearing the cheapest value first buys the most</text>
<text x="620" y="346" text-anchor="middle" font-size="18" fill="#475569">Removing part of a value changes nothing, because that value is still present</text>
<rect x="40" y="548" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="588" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The counts are sorted once, and then simply paid for in order</text>
<text x="620" y="620" text-anchor="middle" font-size="18.5" fill="#475569">Nothing has to be searched, because the cheapest value is always the best one to clear next</text>
</svg>