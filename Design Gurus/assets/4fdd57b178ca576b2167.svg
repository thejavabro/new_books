<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Daily active users times actions per user gives actions per day, dividing by 100,000 seconds gives average QPS, and multiplying by the peak factor gives the number to design for">
  <rect x="0" y="0" width="1240" height="430" fill="#FFFFFF"/>
  <defs>
    <marker id="be6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="be6-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="be6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="290" y1="175" x2="343" y2="175" stroke="#475569" stroke-width="2.5" marker-end="url(#be6-slate)"/>
  <line x1="600" y1="175" x2="653" y2="175" stroke="#475569" stroke-width="2.5" marker-end="url(#be6-slate)"/>
  <line x1="910" y1="175" x2="963" y2="175" stroke="#475569" stroke-width="2.5" marker-end="url(#be6-slate)"/>
  <line x1="785" y1="230" x2="785" y2="273" stroke="#059669" stroke-width="2.5" marker-end="url(#be6-green)"/>

  <g filter="url(#be6-soft)">
    <rect x="40" y="120" width="250" height="110" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="350" y="120" width="250" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="660" y="120" width="250" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="970" y="120" width="250" height="110" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="660" y="280" width="250" height="100" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="165" y="165" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">100 million</text>
  <text x="165" y="198" font-size="20" fill="#475569" text-anchor="middle">daily users</text>

  <text x="475" y="165" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">10 million</text>
  <text x="475" y="198" font-size="20" fill="#3B82F6" text-anchor="middle">writes a day</text>

  <text x="785" y="165" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">100 writes</text>
  <text x="785" y="198" font-size="20" fill="#3B82F6" text-anchor="middle">a second</text>

  <text x="1095" y="165" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">300 writes</text>
  <text x="1095" y="198" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">a second at peak</text>

  <text x="785" y="322" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">10,000 reads</text>
  <text x="785" y="355" font-size="20" fill="#059669" text-anchor="middle">a second</text>

  <text x="316" y="100" font-size="20" fill="#475569" text-anchor="middle">x 10 percent</text>
  <text x="626" y="100" font-size="20" fill="#475569" text-anchor="middle">divide by 100,000</text>
  <text x="936" y="100" font-size="20" fill="#475569" text-anchor="middle">x 3 for peak</text>
  <text x="920" y="262" font-size="20" fill="#059669" text-anchor="middle">x 100 read ratio</text>

  <text x="620" y="410" font-size="20" fill="#475569" text-anchor="middle">Write traffic first, then reads from the ratio, then peak at the end</text>
</svg>