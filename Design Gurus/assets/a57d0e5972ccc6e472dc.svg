<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Clean Architecture, with rings for frameworks and drivers, interface adapters, use cases and entities, is for complex and long-lived applications: use it when the application has complex business logic, is expected to grow over time, must support multiple interfaces such as HTTP, batch jobs, message consumers and CLI, and must keep business logic independent of frameworks and databases. Simple layered architecture, with presentation, business and data access layers over a database, is for smaller and simpler applications: use it when the application is small or medium-sized, business logic is straightforward, you need a simple and fast-to-build solution, and the team is small or prefers a simpler structure">
  <defs>
    <filter id="m11p-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m11p-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m11p-k1"><rect x="124" y="390" width="402" height="70" rx="12"/></clipPath>
    <clipPath id="m11p-k2"><rect x="715" y="210" width="400" height="72" rx="12"/></clipPath>
    <clipPath id="m11p-k3"><rect x="715" y="310" width="400" height="72" rx="12"/></clipPath>
    <clipPath id="m11p-k4"><rect x="715" y="410" width="400" height="72" rx="12"/></clipPath>
    <marker id="m11p-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When to use Clean Architecture vs. simple layered architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Clean Architecture pays off for complex, long-lived applications; simple layers suit smaller ones.</text>

  <rect x="40" y="125" width="570" height="758" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#1D4ED8">Clean Architecture</text>
  <rect x="64" y="210" width="522" height="330" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="240" font-size="19.5" font-weight="600" fill="#1D4ED8">Frameworks and Drivers</text>
  <rect x="84" y="270" width="482" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="108" y="300" font-size="19.5" font-weight="600" fill="#047857">Interface Adapters</text>
  <rect x="104" y="330" width="442" height="170" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="128" y="360" font-size="19.5" font-weight="600" fill="#B45309">Use Cases</text>
  <rect x="630" y="125" width="570" height="758" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="654" y="155" font-size="19.5" font-weight="600" fill="#047857">Simple Layered Architecture</text>

  <g fill="none" stroke-width="2">
    <path d="M915,282 V310" stroke="#64748B" marker-end="url(#m11p-m-slate)"/>
    <path d="M915,382 V410" stroke="#64748B" marker-end="url(#m11p-m-slate)"/>
    <path d="M915,482 V510" stroke="#64748B" marker-end="url(#m11p-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m11p-soft)">
    <rect x="124" y="390" width="402" height="70" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="124" y="390" width="6" height="70" fill="#4F46E5" clip-path="url(#m11p-k1)"/>
  </g>
  <circle cx="162" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(151.56,414.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="188" y="432" font-size="21.5" font-weight="600" fill="#111827">Entities</text>
  <g filter="url(#m11p-soft)">
    <rect x="715" y="210" width="400" height="72" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="715" y="210" width="6" height="72" fill="#2563EB" clip-path="url(#m11p-k2)"/>
  </g>
  <text x="735" y="253" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#m11p-soft)">
    <rect x="715" y="310" width="400" height="72" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="715" y="310" width="6" height="72" fill="#059669" clip-path="url(#m11p-k3)"/>
  </g>
  <text x="735" y="353" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#m11p-soft)">
    <rect x="715" y="410" width="400" height="72" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="715" y="410" width="6" height="72" fill="#D97706" clip-path="url(#m11p-k4)"/>
  </g>
  <text x="735" y="453" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M825,526 L825,564 A90,16 0 0 0 1005,564 L1005,526" fill="#DBEAFE"/>
    <ellipse cx="915" cy="526" rx="90" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="915" y="560" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="64" y="181" font-size="18.5" fill="#475569">Use for complex and long-lived applications</text>
  <text x="654" y="181" font-size="18.5" fill="#475569">Use for smaller and simpler applications</text>
  <text x="915" y="241" font-size="21.5" font-weight="600" text-anchor="middle" fill="#111827">Presentation layer</text>
  <text x="915" y="267" font-size="18.5" text-anchor="middle" fill="#1D4ED8">(UI / controllers)</text>
  <text x="915" y="341" font-size="21.5" font-weight="600" text-anchor="middle" fill="#111827">Business layer</text>
  <text x="915" y="367" font-size="18.5" text-anchor="middle" fill="#047857">(service / business logic)</text>
  <text x="915" y="441" font-size="21.5" font-weight="600" text-anchor="middle" fill="#111827">Data access layer</text>
  <text x="915" y="467" font-size="18.5" text-anchor="middle" fill="#B45309">(repositories / DAOs)</text>

  <rect x="64" y="600" width="522" height="258" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="88" y="638" font-size="21.5" font-weight="700" fill="#111827">Use when:</text>
  <circle cx="94" cy="670" r="6" fill="#2563EB"/>
  <text x="114" y="676" font-size="18.5" fill="#1F2937">Application has complex business logic</text>
  <circle cx="94" cy="706" r="6" fill="#2563EB"/>
  <text x="114" y="712" font-size="18.5" fill="#1F2937">Expected to grow over time</text>
  <circle cx="94" cy="742" r="6" fill="#2563EB"/>
  <text x="114" y="748" font-size="18.5" fill="#1F2937">Need to support multiple interfaces</text>
  <text x="114" y="775" font-size="18.5" fill="#1F2937">(HTTP, batch jobs, message consumers, CLI)</text>
  <circle cx="94" cy="805" r="6" fill="#2563EB"/>
  <text x="114" y="811" font-size="18.5" fill="#1F2937">Want to keep business logic independent of</text>
  <text x="114" y="838" font-size="18.5" fill="#1F2937">frameworks and databases</text>
  <rect x="654" y="600" width="522" height="258" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="678" y="638" font-size="21.5" font-weight="700" fill="#111827">Use when:</text>
  <circle cx="684" cy="670" r="6" fill="#059669"/>
  <text x="704" y="676" font-size="18.5" fill="#1F2937">Application is small or medium-sized</text>
  <circle cx="684" cy="706" r="6" fill="#059669"/>
  <text x="704" y="712" font-size="18.5" fill="#1F2937">Business logic is straightforward</text>
  <circle cx="684" cy="742" r="6" fill="#059669"/>
  <text x="704" y="748" font-size="18.5" fill="#1F2937">You need a simple and fast-to-build solution</text>
  <circle cx="684" cy="778" r="6" fill="#059669"/>
  <text x="704" y="784" font-size="18.5" fill="#1F2937">Team is small or prefers a simpler structure</text>


</svg>