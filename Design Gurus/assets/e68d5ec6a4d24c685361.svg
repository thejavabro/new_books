<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="906" viewBox="0 0 1240 906" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="deciding-title deciding-desc">
<title id="deciding-title">Four honest decisions</title>
<desc id="deciding-desc">A threat model that produces a list of threats has done half the job. The half that matters is deciding, and accepting is a legitimate engineering decision when it is written down.</desc>
<defs>
<marker id="deciding-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="deciding-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="deciding-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="deciding-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="906" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four honest decisions</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A threat model that produces a list of threats has done half the job.</text>
<rect x="40" y="828" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="828" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="300" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Mitigate</text>
<path d="M346 144H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 144H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deciding-marker-slate)"/>
<rect x="390" y="118" width="810" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="150" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">change the design so the threat does not apply, or is much harder</text>
<rect x="40" y="178" width="300" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="210" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Eliminate</text>
<path d="M346 204H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 204H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deciding-marker-slate)"/>
<rect x="390" y="178" width="810" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="210" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">remove the feature or the data. A field you do not store cannot leak</text>
<rect x="40" y="238" width="300" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="190" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Transfer</text>
<path d="M346 264H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 264H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deciding-marker-slate)"/>
<rect x="390" y="238" width="810" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">use a provider whose entire business is that thing</text>
<rect x="40" y="298" width="300" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="190" y="330" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Accept</text>
<path d="M346 324H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 324H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deciding-marker-slate)"/>
<rect x="390" y="298" width="810" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="330" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">write it down with a name and a date, and move on</text>
<rect x="40" y="378" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="378" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="415" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">An unwritten acceptance is indistinguishable from an oversight six months later</text>
<text x="40" y="480" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Prioritization crude enough to produce decisions rather than arguments</text>
<rect x="40" y="498" width="300" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="527" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">fix now</text>
<path d="M346 521H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 521H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deciding-marker-slate)"/>
<rect x="390" y="498" width="810" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="527" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">easy to exploit AND bad if exploited</text>
<rect x="40" y="550" width="300" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="190" y="579" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">fix soon</text>
<path d="M346 573H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 573H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deciding-marker-slate)"/>
<rect x="390" y="550" width="810" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="579" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">hard to exploit AND bad if exploited</text>
<rect x="40" y="602" width="300" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="631" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">write down</text>
<path d="M346 625H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 625H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deciding-marker-slate)"/>
<rect x="390" y="602" width="810" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="631" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">easy to exploit AND not very bad</text>
<rect x="40" y="654" width="300" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="683" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">accept</text>
<path d="M346 677H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 677H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deciding-marker-slate)"/>
<rect x="390" y="654" width="810" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="683" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">hard to exploit AND not very bad</text>
<rect x="40" y="726" width="1160" height="76" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="726" width="5" height="76" rx="2.5" fill="#AC8BE8"/><text x="64" y="756.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">Two things move items up: anything touching authentication or authorization,</text><text x="64" y="783.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">and anything where the damage is unbounded, even if exploitation is hard.</text>
<text x="66" y="862" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A bug that leaks one record is different in kind from one that leaks the table.</text>
</svg>