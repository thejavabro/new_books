<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="648" viewBox="0 0 1240 648" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A Snowflake ID divides 64 bits into one unused sign bit, 41 bits of millisecond timestamp, 10 bits of worker id and 12 bits of sequence, and each field buys a specific property">
  <rect x="0" y="0" width="1240" height="648" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">64 bits, split four ways, and what each split buys</text>

  <rect x="60" y="110" width="30" height="70" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="90" y="110" width="700" height="70" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="440" y="152" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">41 bits: milliseconds since a custom epoch</text>
  <rect x="790" y="110" width="180" height="70" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="880" y="152" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">10: worker</text>
  <rect x="970" y="110" width="210" height="70" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1075" y="152" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">12: sequence</text>

  <text x="75" y="204" font-size="20" fill="#64748B" text-anchor="middle">1</text>

  <rect x="50" y="240" width="1140" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="282" font-size="20" font-weight="600" fill="#475569">1 unused sign bit</text>
  <text x="420" y="282" font-size="20" fill="#0F172A">keeps the value positive in languages with signed 64 bit integers</text>

  <rect x="50" y="322" width="1140" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="70" y="364" font-size="20" font-weight="600" fill="#1E40AF">41 bits of time</text>
  <text x="420" y="364" font-size="20" fill="#0F172A">makes the ID sort by creation time, and lasts about 69 years</text>

  <rect x="50" y="404" width="1140" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="446" font-size="20" font-weight="600" fill="#92400E">10 bits of worker id</text>
  <text x="420" y="446" font-size="20" fill="#0F172A">lets 1,024 generators run without talking to each other</text>

  <rect x="50" y="486" width="1140" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="70" y="528" font-size="20" font-weight="600" fill="#5B21B6">12 bits of sequence</text>
  <text x="420" y="528" font-size="20" fill="#0F172A">4,096 IDs per worker per millisecond before it must wait</text>

  <rect x="50" y="586" width="1140" height="48" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="616" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">About four million IDs a second across the fleet, with no coordination at generation time.</text>
</svg>