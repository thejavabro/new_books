<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="764" viewBox="0 0 1240 764" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="fake-title fake-desc">
<title id="fake-title">The triggers that are not</title>
<desc id="fake-desc">The five reasons given most often are mostly not reasons, and none of them names a cost being paid today. Recognizing them in your own designs is more useful than recognizing them in somebody else.</desc>
<defs>
<marker id="fake-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="fake-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="fake-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="fake-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="764" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The triggers that are not</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The five reasons given most often are mostly not reasons.</text>
<rect x="40" y="686" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="686" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"It will scale better"</text>
<path d="M526 148H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 148H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fake-marker-red)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a monolith scales by running more copies;</text><text x="590" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what does not scale is the organization</text>
<rect x="40" y="190" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"The codebase is too large"</text>
<path d="M526 220H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 220H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fake-marker-red)"/>
<rect x="570" y="190" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">size argues for modules; network calls make</text><text x="590" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">code smaller in each place and larger in total</text>
<rect x="40" y="262" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"We want a different language here"</text>
<path d="M526 292H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 292H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fake-marker-red)"/>
<rect x="570" y="262" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">occasionally real, usually a preference</text>
<rect x="40" y="334" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"This is how large companies build"</text>
<path d="M526 364H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 364H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fake-marker-red)"/>
<rect x="570" y="334" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">they arrived over years, with platform teams</text><text x="590" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you do not have</text>
<rect x="40" y="406" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"We might need it later"</text>
<path d="M526 436H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 436H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fake-marker-red)"/>
<rect x="570" y="406" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the option is bought by a module boundary,</text><text x="590" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not by a network call</text>
<rect x="40" y="482" width="1160" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="482" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="64" y="512" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The common property</text><text x="64" y="538" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">None of them names a cost being paid right now.</text><text x="64" y="564" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A trigger you cannot measure today is a prediction.</text>
<rect x="40" y="598" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="598" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="635" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Buy the option, not the thing.</text>
<text x="66" y="719" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">"We want a different language" is worth the cost only if the component needs capabilities your stack lacks.</text>
</svg>