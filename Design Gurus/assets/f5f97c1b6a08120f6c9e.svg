<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="806" viewBox="0 0 1240 806" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Enrollment table with three shapes of dependency marked: a full dependency on the whole key, two partial dependencies on half the key, and a transitive dependency from Instructor to Dept">
<defs>
<marker id="rdb16-mem" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="rdb16-mam" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="rdb16-mpk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="806" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="520" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Enrollment. The candidate key is shaded, and every dependency is drawn below the table.</text>

<g stroke="#CBD5E1" stroke-width="1.2">
<rect x="70" y="96" width="170" height="40" fill="#E0E7FF"/>
<rect x="240" y="96" width="160" height="40" fill="#E0E7FF"/>
<rect x="400" y="96" width="220" height="40" fill="#E2E8F0"/>
<rect x="620" y="96" width="120" height="40" fill="#E2E8F0"/>
<rect x="740" y="96" width="200" height="40" fill="#E2E8F0"/>
<rect x="940" y="96" width="180" height="40" fill="#E2E8F0"/>
<rect x="70" y="136" width="170" height="38" fill="#EEF2FF"/><rect x="240" y="136" width="160" height="38" fill="#EEF2FF"/><rect x="400" y="136" width="220" height="38" fill="#FFFFFF"/><rect x="620" y="136" width="120" height="38" fill="#FFFFFF"/><rect x="740" y="136" width="200" height="38" fill="#FFFFFF"/><rect x="940" y="136" width="180" height="38" fill="#FFFFFF"/>
<rect x="70" y="174" width="170" height="38" fill="#EEF2FF"/><rect x="240" y="174" width="160" height="38" fill="#EEF2FF"/><rect x="400" y="174" width="220" height="38" fill="#FFFFFF"/><rect x="620" y="174" width="120" height="38" fill="#FFFFFF"/><rect x="740" y="174" width="200" height="38" fill="#FFFFFF"/><rect x="940" y="174" width="180" height="38" fill="#FFFFFF"/>
<rect x="70" y="212" width="170" height="38" fill="#EEF2FF"/><rect x="240" y="212" width="160" height="38" fill="#EEF2FF"/><rect x="400" y="212" width="220" height="38" fill="#FFFFFF"/><rect x="620" y="212" width="120" height="38" fill="#FFFFFF"/><rect x="740" y="212" width="200" height="38" fill="#FFFFFF"/><rect x="940" y="212" width="180" height="38" fill="#FFFFFF"/>
<rect x="70" y="250" width="170" height="38" fill="#EEF2FF"/><rect x="240" y="250" width="160" height="38" fill="#EEF2FF"/><rect x="400" y="250" width="220" height="38" fill="#FFFFFF"/><rect x="620" y="250" width="120" height="38" fill="#FFFFFF"/><rect x="740" y="250" width="200" height="38" fill="#FFFFFF"/><rect x="940" y="250" width="180" height="38" fill="#FFFFFF"/>
<rect x="70" y="288" width="170" height="38" fill="#EEF2FF"/><rect x="240" y="288" width="160" height="38" fill="#EEF2FF"/><rect x="400" y="288" width="220" height="38" fill="#FFFFFF"/><rect x="620" y="288" width="120" height="38" fill="#FFFFFF"/><rect x="740" y="288" width="200" height="38" fill="#FFFFFF"/><rect x="940" y="288" width="180" height="38" fill="#FFFFFF"/>
</g>
<g font-size="14.5" font-weight="600" fill="#4338CA">
<text x="84" y="122">Student_ID</text>
<text x="254" y="122">Course_ID</text>
</g>
<g font-size="14.5" font-weight="600" fill="#475569">
<text x="414" y="122">Student_Name</text>
<text x="634" y="122">Grade</text>
<text x="754" y="122">Instructor</text>
<text x="954" y="122">Dept</text>
</g>
<g font-size="14.5" fill="#111827">
<text x="84" y="161">S101</text><text x="254" y="161">C101</text><text x="414" y="161">Alice Smith</text><text x="634" y="161">A</text><text x="754" y="161">Dr. Smith</text><text x="954" y="161">Science</text>
<text x="84" y="199">S101</text><text x="254" y="199">C102</text><text x="414" y="199">Alice Smith</text><text x="634" y="199">B</text><text x="754" y="199">Dr. Brown</text><text x="954" y="199">Arts</text>
<text x="84" y="237">S102</text><text x="254" y="237">C101</text><text x="414" y="237">Bob Johnson</text><text x="634" y="237">B</text><text x="754" y="237">Dr. Smith</text><text x="954" y="237">Science</text>
<text x="84" y="275">S103</text><text x="254" y="275">C103</text><text x="414" y="275">Carol White</text><text x="634" y="275">C</text><text x="754" y="275">Dr. Lee</text><text x="954" y="275">Commerce</text>
<text x="84" y="313">S103</text><text x="254" y="313">C104</text><text x="414" y="313">Carol White</text><text x="634" y="313">A</text><text x="754" y="313">Dr. Smith</text><text x="954" y="313">Science</text>
</g>
<text x="155" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#4338CA">prime</text>
<text x="320" y="350" text-anchor="middle" font-size="14" font-weight="600" fill="#4338CA">prime</text>

<path d="M155,364 V372 H320 V364" fill="none" stroke="#059669" stroke-width="2.5"/>
<path d="M237,372 V402 H680 V330" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#rdb16-mem)"/>
<text x="460" y="396" text-anchor="middle" font-size="14.5" font-weight="600" paint-order="stroke" stroke="#F8FAFC" stroke-width="5" fill="#047857">whole key</text>

<path d="M155,364 V442 H510 V330" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#rdb16-mam)"/>
<text x="415" y="436" text-anchor="middle" font-size="14.5" font-weight="600" paint-order="stroke" stroke="#F8FAFC" stroke-width="5" fill="#B45309">Student_ID only</text>

<path d="M320,364 V482 H820 V330" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#rdb16-mam)"/>
<text x="570" y="476" text-anchor="middle" font-size="14.5" font-weight="600" paint-order="stroke" stroke="#F8FAFC" stroke-width="5" fill="#B45309">Course_ID only</text>

<path d="M880,364 V516 H1030 V330" fill="none" stroke="#DB2777" stroke-width="2.5" marker-end="url(#rdb16-mpk)"/>
<text x="955" y="540" text-anchor="middle" font-size="14.5" font-weight="600" paint-order="stroke" stroke="#F8FAFC" stroke-width="5" fill="#BE185D">through Instructor</text>

<rect x="40" y="594" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="620" width="250" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="189" y="642" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">full dependency</text>
<text x="338" y="642" font-size="15.5" fill="#475569">Grade needs the whole key. Drop either half and it is no longer fixed. This shape is fine.</text>
<rect x="64" y="664" width="250" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="189" y="686" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">partial dependency</text>
<text x="338" y="686" font-size="15.5" fill="#475569">Student_Name needs only Student_ID. Instructor needs only Course_ID. Second normal form bans this.</text>
<rect x="64" y="708" width="250" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="189" y="730" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">transitive dependency</text>
<text x="338" y="730" font-size="15.5" fill="#475569">the key reaches Dept only through Instructor, which is not a key. Third normal form bans this.</text>
</svg>