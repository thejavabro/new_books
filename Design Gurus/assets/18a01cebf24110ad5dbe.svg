<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="990" viewBox="0 0 1240 990" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The synchronous approach: the like and dislike service writes the user action and increments the total in a single transaction, which is strongly consistent but puts every like on a viral video in contention for one counter row">
  <defs>
    <filter id="ytc2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytc2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytc2-k1"><rect x="40" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="ytc2-k2"><rect x="400" y="150" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="ytc2-k3"><rect x="780" y="150" width="340" height="90" rx="12"/></clipPath>
    <marker id="ytc2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ytc2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="990" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Approach 1: write the action and the count together</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One transaction updates both rows before the request returns. Correct on the first read, and the reason a viral video melts it.</text>

  <rect x="300" y="390" width="800" height="246" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="324" y="420" font-size="19.5" font-weight="600" fill="#475569">One transaction, both writes</text>

  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#ytc2-m-blue)"/>
    <path d="M680,195 H772" stroke="#2563EB" marker-end="url(#ytc2-m-blue)"/>
    <path d="M880,312 V384" stroke="#64748B" stroke-width="2.5" marker-end="url(#ytc2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="336" y="183" fill="#1D4ED8">likes</text>
    <text x="726" y="183" fill="#1D4ED8">routes</text>
    <text x="1000" y="350" fill="#475569">commit, then reply</text>
  </g>

  <g filter="url(#ytc2-soft)">
    <rect x="40" y="150" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#ytc2-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web and mobile</text>
  <g filter="url(#ytc2-soft)">
    <rect x="400" y="150" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="400" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#ytc2-k2)"/>
  </g>
  <circle cx="438" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="464" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="540" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">auth and rate limits</text>
  <g filter="url(#ytc2-lift)">
    <rect x="780" y="150" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="780" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#ytc2-k3)"/>
  </g>
  <circle cx="818" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6-6 6 6"/><path d="M6 14l6 6 6-6"/></g>
  <text x="844" y="202" font-size="21.5" font-weight="600" fill="#111827">Like/Dislike Service</text>
  <text x="950" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">stateless, scales out</text>
  <text x="950" y="296" font-size="18.5" text-anchor="middle" fill="#94A3B8">one write path, one read path</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M380,450 L380,534 A140,16 0 0 0 660,534 L660,450" fill="#D1FAE5"/>
    <ellipse cx="520" cy="450" rx="140" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="520" y="507" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">User actions</text>
  <text x="520" y="584" font-size="18.5" text-anchor="middle" fill="#6B7280">insert or update</text>
  <text x="520" y="611" font-size="18.5" text-anchor="middle" fill="#94A3B8">one row per user</text>
  <g stroke="#DB2777" stroke-width="1.5">
    <path d="M740,450 L740,534 A140,16 0 0 0 1020,534 L1020,450" fill="#FCE7F3"/>
    <ellipse cx="880" cy="450" rx="140" ry="16" fill="#FDF2F8"/>
  </g>
  <text x="880" y="507" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Counts</text>
  <text x="880" y="584" font-size="18.5" text-anchor="middle" fill="#6B7280">increment in place</text>
  <text x="880" y="611" font-size="18.5" text-anchor="middle" fill="#94A3B8">one row, every liker</text>

  <rect x="40" y="680" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Strongly consistent</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">the total is right the instant the write returns, so any later read is correct</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Nothing to operate</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">no queue, no worker, no cache, which is worth more than it sounds</text>
  <rect x="64" y="805" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="830" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">One hot row</text>
  <text x="323" y="830" font-size="18.5" fill="#475569">every like on the same video contends for the same counter, and throughput collapses</text>
  <rect x="64" y="855" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="880" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">No buffer anywhere</text>
  <text x="323" y="880" font-size="18.5" fill="#475569">the database absorbs every write and every read, so a surge has nowhere to go</text>
</svg>