<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A network partition splits five machines into a group of three and a group of two. Both groups keep running and keep serving users, but no message can pass between them, so a write made on one side is not seen on the other side.">
  <rect x="0" y="0" width="1240" height="510" fill="#FFFFFF"/>
  <defs>
    <marker id="cp1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cp1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cp1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cp1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="cp1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="cp1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="cp1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="cp1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="cp1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A network partition: both sides alive, no messages between them</text>
  <rect x="24" y="80" width="520" height="250" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="284" y="118" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">Side A, three machines</text>
  <g filter="url(#cp1-soft)"><rect x="78" y="148" width="130" height="100" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="143" y="190" font-size="18" fill="#64748B" text-anchor="middle">node</text>
  <text x="143" y="222" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">X = 2</text>
  <g filter="url(#cp1-soft)"><rect x="219" y="148" width="130" height="100" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="284" y="190" font-size="18" fill="#64748B" text-anchor="middle">node</text>
  <text x="284" y="222" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">X = 2</text>
  <g filter="url(#cp1-soft)"><rect x="360" y="148" width="130" height="100" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="425" y="190" font-size="18" fill="#64748B" text-anchor="middle">node</text>
  <text x="425" y="222" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">X = 2</text>
  <text x="284" y="296" font-size="19" fill="#64748B" text-anchor="middle">These three have the new value.</text>
  <rect x="696" y="80" width="520" height="250" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="956" y="118" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Side B, two machines</text>
  <g filter="url(#cp1-soft)"><rect x="820" y="148" width="130" height="100" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="885" y="190" font-size="18" fill="#64748B" text-anchor="middle">node</text>
  <text x="885" y="222" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">X = 1</text>
  <g filter="url(#cp1-soft)"><rect x="961" y="148" width="130" height="100" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="1026" y="190" font-size="18" fill="#64748B" text-anchor="middle">node</text>
  <text x="1026" y="222" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">X = 1</text>
  <text x="956" y="296" font-size="19" fill="#64748B" text-anchor="middle">These two still hold the old value.</text>
  <path d="M548 198 H692" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M612,190 L628,206 M628,190 L612,206" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="620" y="156" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="middle">link broken</text>
  <text x="620" y="240" font-size="18" fill="#64748B" text-anchor="middle">nothing gets</text>
  <text x="620" y="264" font-size="18" fill="#64748B" text-anchor="middle">through</text>
  <g filter="url(#cp1-soft)"><rect x="134" y="360" width="300" height="66" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="284" y="400" font-size="20" fill="#0F172A" text-anchor="middle">a user writes X = 2</text>
  <line x1="284" y1="356" x2="284" y2="334" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#cp1-s)"/>
  <g filter="url(#cp1-soft)"><rect x="806" y="360" width="300" height="66" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="956" y="400" font-size="20" fill="#0F172A" text-anchor="middle">a user reads and gets X = 1</text>
  <line x1="956" y1="356" x2="956" y2="334" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#cp1-s)"/>
  <rect x="24" y="442" width="1192" height="52" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="475" font-size="19" fill="#64748B" text-anchor="middle">Nothing has crashed. Each side is running, and neither side knows what the other side did.</text>
</svg>