<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1225" viewBox="0 0 1240 1225" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six requirement answers and the contract decision each one settles. A weak network reduces sequential calls and keeps the common response compact. Millions of records require pagination, filters, deterministic order and a maximum page size. Several minutes of processing creates a job resource. Automatic partner retries define idempotent creation and a stable conflict rule. Errors handled by scripts require stable codes, field details and retry guidance. A nightly analytics read provides export, bulk or event access.">
