<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="scope-title scope-desc">
<title id="scope-title">The first seven minutes decide the rest</title>
<desc id="scope-desc">The segment candidates rush and seniors protect, because every later decision is justified by something established here.</desc>
<defs>
<marker id="scope-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="scope-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="scope-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="scope-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The first seven minutes decide the rest</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Scoping is the segment candidates rush and seniors protect.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Who the users are, and what they do</text>
<path d="M536 148H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 148H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scope-marker-slate)"/>
<rect x="580" y="118" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not features, actions. One action is usually the core</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The scale, as numbers</text>
<path d="M536 220H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 220H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scope-marker-slate)"/>
<rect x="580" y="190" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">users, requests, data, growth.</text><text x="600" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Asking for them is the signal</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What matters most</text>
<path d="M536 292H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 292H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scope-marker-slate)"/>
<rect x="580" y="262" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">latency, consistency, cost, availability. They conflict,</text><text x="600" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the winner makes later trade-offs decidable</text>
<circle cx="60" cy="364" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What is out of scope</text>
<path d="M536 364H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 364H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scope-marker-slate)"/>
<rect x="580" y="334" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">said explicitly. Naming three things you are not</text><text x="600" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">designing protects the one you are</text>
<rect x="40" y="414" width="1160" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="414" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="64" y="444.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">"I will treat authentication, billing and admin as out of scope unless you want them"</text><text x="64" y="471.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Nine seconds to say, and it buys back ten minutes.</text>
<rect x="40" y="510" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="510" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="541" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Asking questions is not the same as scoping</text><text x="64" y="567" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The test is whether the answers show up later as reasons.</text>
<rect x="40" y="606" width="1160" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="642" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">End by saying the scope back in one sentence, and getting agreement</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">That sentence is what you return to when the interviewer pushes somewhere unexpected.</text>
</svg>