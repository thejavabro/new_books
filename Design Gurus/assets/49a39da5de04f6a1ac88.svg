<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One call with a mesh: the service makes a plain call to its own proxy, the two proxies carry it between them over an encrypted connection, and the receiving proxy hands it to the callee">
  <defs>
    <marker id="sm2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="sm2-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="sm2-k1"><rect x="82" y="164" width="236" height="72" rx="12"/></clipPath>
    <clipPath id="sm2-k2"><rect x="362" y="164" width="236" height="72" rx="12"/></clipPath>
    <clipPath id="sm2-k3"><rect x="642" y="164" width="236" height="72" rx="12"/></clipPath>
    <clipPath id="sm2-k4"><rect x="922" y="164" width="236" height="72" rx="12"/></clipPath>
    <filter id="sm2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sm2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="284" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#047857">One call, and what each part of it does</text>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M318,200 H362" marker-end="url(#sm2-mslate)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="340" y="150" fill="#475569">plain call</text>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M598,200 H642" marker-end="url(#sm2-memerald)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="150" fill="#047857">encrypted</text>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M878,200 H922" marker-end="url(#sm2-mslate)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="900" y="150" fill="#475569">plain call</text>
  </g>
  <g filter="url(#sm2-soft)">
    <rect x="82" y="164" width="236" height="72" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="82" y="164" width="6" height="72" fill="#2563EB" clip-path="url(#sm2-k1)"/>
  </g>
  <circle cx="120" cy="200" r="18" fill="#FFFFFF"/>
  <g transform="translate(109.56,189.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="146" y="207" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="200" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">no retry or TLS code</text>
  <g filter="url(#sm2-soft)">
    <rect x="362" y="164" width="236" height="72" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="362" y="164" width="6" height="72" fill="#059669" clip-path="url(#sm2-k2)"/>
  </g>
  <circle cx="400" cy="200" r="18" fill="#FFFFFF"/>
  <g transform="translate(389.56,189.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="426" y="207" font-size="18.5" font-weight="600" fill="#111827">Caller Proxy</text>
  <text x="480" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">retries, times out, encrypts</text>
  <g filter="url(#sm2-soft)">
    <rect x="642" y="164" width="236" height="72" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="642" y="164" width="6" height="72" fill="#059669" clip-path="url(#sm2-k3)"/>
  </g>
  <circle cx="680" cy="200" r="18" fill="#FFFFFF"/>
  <g transform="translate(669.56,189.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="706" y="207" font-size="18.5" font-weight="600" fill="#111827">Callee Proxy</text>
  <text x="760" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">checks identity, decrypts</text>
  <g filter="url(#sm2-soft)">
    <rect x="922" y="164" width="236" height="72" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="922" y="164" width="6" height="72" fill="#2563EB" clip-path="url(#sm2-k4)"/>
  </g>
  <circle cx="960" cy="200" r="18" fill="#FFFFFF"/>
  <g transform="translate(949.56,189.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="986" y="207" font-size="18.5" font-weight="600" fill="#111827">Payment Service</text>
  <text x="1040" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">receives a plain call</text>
  <rect x="40" y="364" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="388" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="410" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">What moved</text>
  <text x="288" y="410" font-size="15.5" fill="#475569">retry, timeout, circuit breaking, encryption and metrics now live in the proxies</text>
</svg>