<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One delivery-time prediction: served online within 100 ms, then its outcome becomes a label that trains and safely rolls out the next model">
  <defs>
    <marker id="m2in2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m2in2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2in2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m2in2-k1"><rect x="89" y="136" width="228" height="90" rx="12"/></clipPath>
    <clipPath id="m2in2-k2"><rect x="365" y="136" width="232" height="90" rx="12"/></clipPath>
    <clipPath id="m2in2-k3"><rect x="650" y="136" width="218" height="90" rx="12"/></clipPath>
    <clipPath id="m2in2-k4"><rect x="916" y="136" width="242" height="90" rx="12"/></clipPath>
    <clipPath id="m2in2-k5"><rect x="137" y="410" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="m2in2-k6"><rect x="524" y="410" width="192" height="90" rx="12"/></clipPath>
    <clipPath id="m2in2-k7"><rect x="896" y="410" width="190" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="716" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: within 100 ms</text>
  <rect x="40" y="330" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#B45309">Later: the outcome, then offline work</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M317,181 H365" marker-end="url(#m2in2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M597,181 H650" marker-end="url(#m2in2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M868,181 H916" marker-end="url(#m2in2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M361,455 H524" marker-end="url(#m2in2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M716,455 H896" marker-end="url(#m2in2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1037,263 V296 Q1037,308 1025,308 H261 Q249,308 249,320 V410" marker-end="url(#m2in2-mslate)"/></g>
  <g filter="url(#m2in2-soft)">
    <rect x="89" y="136" width="228" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="89" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#m2in2-k1)"/>
  </g>
  <circle cx="127" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(116.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="89" y="124" font-size="15.5" font-weight="600" fill="#6B7280">6:02 PM</text>
  <text x="153" y="188" font-size="18.5" font-weight="600" fill="#111827">Checkout opens</text>
  <text x="203" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a request arrives</text>
  <g filter="url(#m2in2-soft)">
    <rect x="365" y="136" width="232" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="365" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#m2in2-k2)"/>
  </g>
  <circle cx="403" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(392.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="365" y="124" font-size="15.5" font-weight="600" fill="#6B7280">about 10 ms</text>
  <text x="429" y="188" font-size="18.5" font-weight="600" fill="#111827">Features fetched</text>
  <text x="481" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">prep time, queue, route</text>
  <g filter="url(#m2in2-lift)">
    <rect x="650" y="136" width="218" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="650" y="136" width="9" height="90" fill="#2563EB" clip-path="url(#m2in2-k3)"/>
  </g>
  <circle cx="688" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="650" y="124" font-size="15.5" font-weight="600" fill="#6B7280">about 15 ms</text>
  <text x="714" y="188" font-size="18.5" font-weight="600" fill="#111827">Model predicts</text>
  <text x="759" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">it predicts 32 minutes</text>
  <g filter="url(#m2in2-soft)">
    <rect x="916" y="136" width="242" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="916" y="136" width="6" height="90" fill="#059669" clip-path="url(#m2in2-k4)"/>
  </g>
  <circle cx="954" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(943.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="916" y="124" font-size="15.5" font-weight="600" fill="#6B7280">about 20 ms</text>
  <text x="980" y="188" font-size="18.5" font-weight="600" fill="#111827">Prediction logged</text>
  <text x="1037" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">with the features it used</text>
  <g filter="url(#m2in2-lift)">
    <rect x="137" y="410" width="224" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="137" y="410" width="9" height="90" fill="#059669" clip-path="url(#m2in2-k5)"/>
  </g>
  <circle cx="175" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(164.56,444.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="137" y="398" font-size="15.5" font-weight="600" fill="#6B7280">6:40 PM</text>
  <text x="201" y="462" font-size="18.5" font-weight="600" fill="#111827">Order delivered</text>
  <text x="249" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">38 minutes becomes the label</text>
  <g filter="url(#m2in2-soft)">
    <rect x="524" y="410" width="192" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="524" y="410" width="6" height="90" fill="#D97706" clip-path="url(#m2in2-k6)"/>
  </g>
  <circle cx="562" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(551.56,444.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="524" y="398" font-size="15.5" font-weight="600" fill="#6B7280">that night</text>
  <text x="588" y="462" font-size="18.5" font-weight="600" fill="#111827">Training job</text>
  <text x="620" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">joins logs with labels</text>
  <g filter="url(#m2in2-soft)">
    <rect x="896" y="410" width="190" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="896" y="410" width="6" height="90" fill="#7C3AED" clip-path="url(#m2in2-k7)"/>
  </g>
  <circle cx="934" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,444.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="896" y="398" font-size="15.5" font-weight="600" fill="#6B7280">the next days</text>
  <text x="960" y="462" font-size="18.5" font-weight="600" fill="#111827">Safe rollout</text>
  <text x="991" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">evaluate, shadow, canary</text>
  <rect x="40" y="600" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="645" text-anchor="middle" font-size="16" fill="#475569">The prediction is only half the work: its outcome teaches the next model.</text>
</svg>