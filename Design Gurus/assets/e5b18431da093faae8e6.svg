<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A geohash gives nearby points a shared prefix, a quadtree splits dense areas into smaller cells, and an R-tree groups shapes into nested bounding rectangles">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <filter id="ix20-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="46" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Three ways to make points that are close on a map close together in an index</text>

  
  <rect x="20" y="76" width="380" height="404" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="210" y="112" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Geohash</text>

  <rect x="70" y="136" width="280" height="200" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="210" y1="136" x2="210" y2="336" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="70" y1="236" x2="350" y2="236" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="140" y1="136" x2="140" y2="236" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="70" y1="186" x2="210" y2="186" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="140" y="186" width="70" height="50" fill="#DBEAFE"/>
  <circle cx="163" cy="206" r="6" fill="#1D4ED8"/>
  <circle cx="188" cy="219" r="6" fill="#1D4ED8"/>
  <circle cx="172" cy="226" r="6" fill="#1D4ED8"/>
  <circle cx="300" cy="290" r="6" fill="#94A3B8"/>

  <text x="210" y="372" font-size="20" fill="#0F172A" text-anchor="middle">Nearby points share a prefix:</text>
  <text x="210" y="400" font-size="20" font-weight="600" fill="#1D4ED8" text-anchor="middle">u33db, u33dc, u33df</text>
  <text x="210" y="440" font-size="20" fill="#64748B" text-anchor="middle">A prefix match, so a plain</text>
  <text x="210" y="464" font-size="20" fill="#64748B" text-anchor="middle">B-tree can serve it.</text>

  
  <rect x="430" y="76" width="380" height="404" rx="14" fill="#ECFDF5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="112" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">Quadtree</text>

  <rect x="480" y="136" width="280" height="200" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="620" y1="136" x2="620" y2="336" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="480" y1="236" x2="760" y2="236" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="550" y1="136" x2="550" y2="236" stroke="#A7F3D0" stroke-width="1.5"/>
  <line x1="480" y1="186" x2="620" y2="186" stroke="#A7F3D0" stroke-width="1.5"/>
  <line x1="515" y1="186" x2="515" y2="236" stroke="#A7F3D0" stroke-width="1.5"/>
  <line x1="480" y1="211" x2="550" y2="211" stroke="#A7F3D0" stroke-width="1.5"/>
  <circle cx="497" cy="198" r="5" fill="#047857"/>
  <circle cx="530" cy="199" r="5" fill="#047857"/>
  <circle cx="498" cy="224" r="5" fill="#047857"/>
  <circle cx="532" cy="225" r="5" fill="#047857"/>
  <circle cx="505" cy="160" r="5" fill="#047857"/>
  <circle cx="585" cy="165" r="5" fill="#047857"/>
  <circle cx="700" cy="300" r="5" fill="#94A3B8"/>

  <text x="620" y="372" font-size="20" fill="#0F172A" text-anchor="middle">Dense areas keep splitting.</text>
  <text x="620" y="400" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">Cell size follows density.</text>
  <text x="620" y="440" font-size="20" fill="#64748B" text-anchor="middle">The usual answer when</text>
  <text x="620" y="464" font-size="20" fill="#64748B" text-anchor="middle">designing a nearby search.</text>

  
  <rect x="840" y="76" width="380" height="404" rx="14" fill="#F5F3FF" fill-opacity="0.35" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1030" y="112" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">R-tree</text>

  <rect x="890" y="136" width="280" height="200" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="905" y="152" width="150" height="110" rx="4" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="1000" y="200" width="155" height="120" rx="4" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M920,175 L975,168 L985,215 L930,225 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M995,190 L1045,180 L1050,245 L1000,250 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M1065,225 L1140,215 L1145,300 L1070,310 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>

  <text x="1030" y="372" font-size="20" fill="#0F172A" text-anchor="middle">Shapes grouped into boxes,</text>
  <text x="1030" y="400" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">boxes grouped into bigger boxes.</text>
  <text x="1030" y="440" font-size="20" fill="#64748B" text-anchor="middle">The only one that answers</text>
  <text x="1030" y="464" font-size="20" fill="#64748B" text-anchor="middle">which zone contains a point.</text>

  <rect x="120" y="514" width="1000" height="56" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="549" font-size="20" fill="#334155" text-anchor="middle">All three narrow the search to a region. Exact distances are still computed over the candidates.</text>

  <text x="620" y="614" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A composite index on latitude and longitude cannot do this, because a sort orders one dimension at a time.</text>
</svg>