<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="816" viewBox="0 0 1240 816" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="own-title own-desc">
<title id="own-title">Making your own pivot</title>
<desc id="own-desc">The strongest candidates do not only respond to pivots. They create them, which is the most reliable way to be assessed on your strengths.</desc>
<defs>
<marker id="own-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="own-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="own-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="own-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="816" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Making your own pivot</text>
<text x="40" y="86" font-size="21" fill="#4A5568">They create them, which is the most reliable way to be assessed on your strengths.</text>
<rect x="40" y="738" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="738" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="110" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="110" rx="2.5" fill="#39D5AA"/><text x="64" y="152" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">"The three difficult parts here are the write path at scale, keeping the cache</text><text x="64" y="179" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">consistent, and what happens when the payment provider is slow.</text><text x="64" y="206" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Which would be most useful to go into?"</text>
<circle cx="60" cy="282" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="252" width="428" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Demonstrates judgment before depth</text>
<path d="M526 282H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 282H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#own-marker-slate)"/>
<rect x="570" y="252" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">identifying the hard parts is itself a senior skill</text>
<circle cx="60" cy="354" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="361" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="324" width="428" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="360" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Gives a menu of prepared areas</text>
<path d="M526 354H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 354H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#own-marker-slate)"/>
<rect x="570" y="324" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="360" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and interviewers usually take one</text>
<circle cx="60" cy="426" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="433" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="396" width="428" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="432" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Converts examination into review</text>
<path d="M526 426H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 426H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#own-marker-slate)"/>
<rect x="570" y="396" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="432" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is also the behavior being assessed</text>
<circle cx="60" cy="498" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="505" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="468" width="428" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="306" y="504" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Prevents the worst case</text>
<path d="M526 498H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 498H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#own-marker-slate)"/>
<rect x="570" y="468" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="491.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">being pivoted into your weakest area without</text><text x="590" y="516.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">having offered three strong ones</text>
<rect x="40" y="552" width="1160" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="588" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">If they decline the menu, it still worked: you showed you knew where the difficulty was</text>
<rect x="40" y="636" width="1160" height="76" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="636" width="5" height="76" rx="2.5" fill="#5EC9EC"/><text x="64" y="667" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">A second way: go one level deeper than asked, briefly, then stop</text><text x="64" y="693" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Interviewers frequently follow genuine depth, and that is a pivot you chose.</text>
<text x="66" y="772" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Depth is a structure, not a quantity.</text>
</svg>