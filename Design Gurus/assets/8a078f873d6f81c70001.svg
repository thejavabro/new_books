<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before counting starts">
<defs>
<filter id="gp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Count the good pairs in [1, 2, 3, 1, 1, 3]</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A good pair is two equal values at two different positions, with the earlier one first</text>
