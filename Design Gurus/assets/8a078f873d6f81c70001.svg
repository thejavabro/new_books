<text x="400" y="220.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="400" y="266" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="449" y="182" width="78" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="488" y="220.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="488" y="266" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="537" y="182" width="78" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="576" y="220.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<text x="576" y="266" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="625" y="182" width="78" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="664" y="220.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="664" y="266" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="713" y="182" width="78" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="752" y="220.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="752" y="266" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="801" y="182" width="78" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="840" y="220.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<text x="840" y="266" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<text x="620" y="300" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">how many times each value has been seen so far</text>
<text x="620" y="364" text-anchor="middle" font-size="19" fill="#94A3B8">empty</text>
<rect x="40" y="430" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="470" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">total = 0</text>
<text x="620" y="502" text-anchor="middle" font-size="18.5" fill="#475569">Rather than compare every pair, count how many equal values each new value can pair with</text>
</svg>