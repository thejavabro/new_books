<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="deployrelease-title deployrelease-desc">
<title id="deployrelease-title">Deploying and releasing are different events</title>
<desc id="deployrelease-desc">A flag holds apart the moment code reaches the servers and the moment it takes effect. When the two are the same, every deploy is a release and the only way to undo anything is to undo all of it.</desc>
<defs>
<marker id="deployrelease-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="deployrelease-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="deployrelease-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="deployrelease-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="720" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Deploying and releasing are different events</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A flag holds apart the moment code reaches the servers and the moment it takes effect.</text>
<rect x="40" y="642" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="642" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="420" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="250" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Deploy</text><text x="250" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">code reaches the servers</text>
<path d="M466 154H526" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 154H526" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deployrelease-marker-slate)"/>
<rect x="536" y="118" width="168" height="72" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the flag</text>
<path d="M710 154H770" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M710 154H770" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deployrelease-marker-green)"/>
<rect x="780" y="118" width="420" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="990" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Release</text><text x="990" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">it takes effect</text>
<rect x="40" y="214" width="1160" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="214" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="64" y="246" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">When they are the same event</text><text x="64" y="272" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Every deploy carries risk proportional to everything in it, and undoing anything means undoing all of it.</text><text x="64" y="298" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">So teams deploy less often, which makes each deploy larger, which makes it riskier.</text>
<text x="40" y="356" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What separation makes available</text>
<rect x="40" y="374" width="560" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="410" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deploying becomes boring</text>
<rect x="640" y="374" width="560" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="410" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">undoing becomes fast</text>
<rect x="40" y="444" width="560" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="466.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a change can be exercised</text><text x="320" y="493.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">before it is relied on</text>
<rect x="640" y="444" width="560" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="480" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a migration becomes controllable</text>
<rect x="40" y="526" width="1160" height="88" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="526" width="5" height="88" rx="2.5" fill="#AC8BE8"/><text x="64" y="563" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">For a migration, every switch is a flag</text><text x="64" y="589" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so the whole sequence can be advanced or reversed by somebody not shipping code.</text>
<text x="66" y="676" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The loop is self-reinforcing, and separating the two is what breaks it.</text>
</svg>