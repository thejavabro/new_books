<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="682" viewBox="0 0 1240 682" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every API has two sides. The consumer is the program that calls, and it needs the capability without owning it. The provider is the team that publishes the API and operates the code behind it. Between them sits the published agreement. The consumer knows only the agreement, never the storage, services, or language behind it.">
  <defs>
    <marker id="yapitwoside-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="yapitwoside-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="yapitwoside-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yapitwoside-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yapitwoside-k1"><rect x="84" y="180" width="292" height="90" rx="12"/></clipPath>
    <clipPath id="yapitwoside-k2"><rect x="864" y="180" width="292" height="90" rx="12"/></clipPath>
    <clipPath id="yapitwoside-k3"><rect x="470" y="274" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yapitwoside-k4"><rect x="84" y="326" width="292" height="48" rx="10"/></clipPath>
    <clipPath id="yapitwoside-k5"><rect x="84" y="390" width="292" height="48" rx="10"/></clipPath>
    <clipPath id="yapitwoside-k6"><rect x="84" y="454" width="292" height="48" rx="10"/></clipPath>
    <clipPath id="yapitwoside-k7"><rect x="864" y="326" width="292" height="48" rx="10"/></clipPath>
    <clipPath id="yapitwoside-k8"><rect x="864" y="390" width="292" height="48" rx="10"/></clipPath>
    <clipPath id="yapitwoside-k9"><rect x="864" y="454" width="292" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="682" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Every API has two sides</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the agreement is shared, everything behind it is not</text>

  
  <rect x="44" y="126" width="372" height="416" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="84" y="160" font-size="16.5" font-weight="600" fill="#B45309">The side that calls</text>

  <rect x="824" y="126" width="372" height="416" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="864" y="160" font-size="16.5" font-weight="600" fill="#047857">The side that publishes</text>

  
  <g fill="none" stroke-width="2">
    <path d="M376,225 H436 Q448,225 448,237 V307 Q448,319 460,319 H470" stroke="#D97706" marker-end="url(#yapitwoside-am)"/>
    <path d="M864,225 H804 Q792,225 792,237 V307 Q792,319 780,319 H770" stroke="#059669" marker-end="url(#yapitwoside-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="450" y="209" fill="#B45309">reads it</text>
    <text x="776" y="209" fill="#047857">publishes it</text>
  </g>

  
  <g filter="url(#yapitwoside-soft)">
    <rect x="84" y="180" width="292" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="84" y="180" width="6" height="90" fill="#D97706" clip-path="url(#yapitwoside-k1)"/>
  </g>
  <circle cx="122" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,214.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="148" y="232" font-size="18.5" font-weight="600" fill="#111827">Consumer</text>
  <text x="230" y="295" font-size="15.5" text-anchor="middle" fill="#6B7280">the program that calls</text>

  <g filter="url(#yapitwoside-soft)">
    <rect x="84" y="326" width="292" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="84" y="326" width="6" height="48" fill="#D97706" clip-path="url(#yapitwoside-k4)"/>
  </g>
  <circle cx="118" cy="350" r="4.5" fill="#D97706"/>
  <text x="142" y="357" font-size="18.5" font-weight="600" fill="#111827">Needs the capability</text>

  <g filter="url(#yapitwoside-soft)">
    <rect x="84" y="390" width="292" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="84" y="390" width="6" height="48" fill="#D97706" clip-path="url(#yapitwoside-k5)"/>
  </g>
  <circle cx="118" cy="414" r="4.5" fill="#D97706"/>
  <text x="142" y="421" font-size="18.5" font-weight="600" fill="#111827">Does not own it</text>

  <g filter="url(#yapitwoside-soft)">
    <rect x="84" y="454" width="292" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="84" y="454" width="6" height="48" fill="#D97706" clip-path="url(#yapitwoside-k6)"/>
  </g>
  <circle cx="118" cy="478" r="4.5" fill="#D97706"/>
  <text x="142" y="485" font-size="18.5" font-weight="600" fill="#111827">Reads the agreement</text>

  
  <g filter="url(#yapitwoside-soft)">
    <rect x="864" y="180" width="292" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="864" y="180" width="6" height="90" fill="#059669" clip-path="url(#yapitwoside-k2)"/>
  </g>
  <circle cx="902" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(891.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="928" y="232" font-size="18.5" font-weight="600" fill="#111827">Provider</text>
  <text x="1010" y="295" font-size="15.5" text-anchor="middle" fill="#6B7280">the team that publishes it</text>

  <g filter="url(#yapitwoside-soft)">
    <rect x="864" y="326" width="292" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="864" y="326" width="6" height="48" fill="#059669" clip-path="url(#yapitwoside-k7)"/>
  </g>
  <circle cx="898" cy="350" r="4.5" fill="#059669"/>
  <text x="922" y="357" font-size="18.5" font-weight="600" fill="#111827">Operates the code</text>

  <g filter="url(#yapitwoside-soft)">
    <rect x="864" y="390" width="292" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="864" y="390" width="6" height="48" fill="#059669" clip-path="url(#yapitwoside-k8)"/>
  </g>
  <circle cx="898" cy="414" r="4.5" fill="#059669"/>
  <text x="922" y="421" font-size="18.5" font-weight="600" fill="#111827">Owns the storage</text>

  <g filter="url(#yapitwoside-soft)">
    <rect x="864" y="454" width="292" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="864" y="454" width="6" height="48" fill="#059669" clip-path="url(#yapitwoside-k9)"/>
  </g>
  <circle cx="898" cy="478" r="4.5" fill="#059669"/>
  <text x="922" y="485" font-size="18.5" font-weight="600" fill="#111827">Keeps the promises</text>

  
  <g filter="url(#yapitwoside-lift)">
    <rect x="470" y="274" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="470" y="274" width="9" height="90" fill="#7C3AED" clip-path="url(#yapitwoside-k3)"/>
  </g>
  <circle cx="508" cy="319" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,308.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="534" y="326" font-size="18.5" font-weight="600" fill="#111827">The agreement</text>
  <text x="620" y="389" font-size="15.5" text-anchor="middle" fill="#6B7280">what may be asked, and what comes back</text>

  
  <rect x="40" y="566" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="611" text-anchor="middle" font-size="16" fill="#475569">The consumer never sees the language, the storage, or the services behind the agreement.</text>
</svg>