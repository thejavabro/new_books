<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Caches at five places between the user and the database: the browser on the device, the CDN close to the user, local memory inside each server, a shared cache such as Redis, and the database own cache.">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="ca2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ca2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ca2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ca2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ca2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ca2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ca2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ca2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ca2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A system has several caches, at different distances from the user</text>
  <g filter="url(#ca2-soft)"><rect x="24" y="100" width="210" height="110" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <text x="129" y="142" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">browser</text>
  <text x="129" y="176" font-size="18" fill="#64748B" text-anchor="middle">on the user device</text>
  <line x1="236" y1="155" x2="260" y2="155" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ca2-s)"/>
  <g filter="url(#ca2-soft)"><rect x="266" y="100" width="210" height="110" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/></g>
  <text x="371" y="142" font-size="21" font-weight="700" fill="#0F766E" text-anchor="middle">CDN</text>
  <text x="371" y="176" font-size="18" fill="#64748B" text-anchor="middle">near the user</text>
  <line x1="478" y1="155" x2="502" y2="155" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ca2-s)"/>
  <g filter="url(#ca2-soft)"><rect x="508" y="100" width="210" height="110" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="613" y="142" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">server memory</text>
  <text x="613" y="176" font-size="18" fill="#64748B" text-anchor="middle">inside each server</text>
  <line x1="720" y1="155" x2="744" y2="155" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ca2-s)"/>
  <g filter="url(#ca2-soft)"><rect x="750" y="100" width="210" height="110" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="855" y="142" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">shared cache</text>
  <text x="855" y="176" font-size="18" fill="#64748B" text-anchor="middle">Redis, Memcached</text>
  <line x1="962" y1="155" x2="986" y2="155" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ca2-s)"/>
  <g filter="url(#ca2-soft)"><rect x="992" y="100" width="210" height="110" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="1097" y="142" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">database cache</text>
  <text x="1097" y="176" font-size="18" fill="#64748B" text-anchor="middle">inside the database</text>
  <path d="M24 250 H1216" fill="none" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="60" y="288" font-size="20" font-weight="600" fill="#065F46" text-anchor="start">closer to the user</text>
  <text x="60" y="316" font-size="19" fill="#64748B" text-anchor="start">faster, and harder to update</text>
  <text x="1180" y="288" font-size="20" font-weight="600" fill="#6D28D9" text-anchor="end">closer to the data</text>
  <text x="1180" y="316" font-size="19" fill="#64748B" text-anchor="end">slower, and easier to keep correct</text>
  <rect x="24" y="344" width="1192" height="56" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="380" font-size="19" fill="#64748B" text-anchor="middle">Local memory is the fastest server-side cache, and every server holds its own copy.</text>
</svg>