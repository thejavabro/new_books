<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="848" viewBox="0 0 1240 848" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Which failures may be retried and which may not. Connection failures, timeouts, selected 5xx responses, 503, and 429 are usually retryable. Most 4xx responses are not retryable unchanged, because each one requires a meaningful caller change.">
  <defs>
    <filter id="p1p-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1p-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1p-k1"><rect x="84" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k2"><rect x="84" y="256" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k3"><rect x="84" y="338" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k4"><rect x="84" y="420" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k5"><rect x="84" y="502" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k6"><rect x="84" y="592" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k7"><rect x="684" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k8"><rect x="684" y="256" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k9"><rect x="684" y="338" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k10"><rect x="684" y="420" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k11"><rect x="684" y="502" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p1p-k12"><rect x="684" y="584" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="848" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Retry changes the outcome only when waiting changes something</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the split is not simply 4xx against 5xx</text>

  
  <rect x="40" y="126" width="556" height="550" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#047857">Usually retryable</text>
  <text x="572" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">five signals, one condition</text>

  <g filter="url(#p1p-lift)">
    <rect x="84" y="174" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="84" y="174" width="9" height="48" fill="#059669" clip-path="url(#p1p-k1)"/>
  </g>
  <circle cx="118" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,189) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="142" y="205" font-size="18.5" font-weight="600" fill="#111827">A connection failure before any response</text>

  <g filter="url(#p1p-soft)">
    <rect x="84" y="256" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="256" width="6" height="48" fill="#059669" clip-path="url(#p1p-k2)"/>
  </g>
  <circle cx="118" cy="280" r="4.5" fill="#059669"/>
  <text x="142" y="287" font-size="18.5" font-weight="600" fill="#111827">A timeout</text>

  <g filter="url(#p1p-soft)">
    <rect x="84" y="338" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="338" width="6" height="48" fill="#059669" clip-path="url(#p1p-k3)"/>
  </g>
  <circle cx="118" cy="362" r="4.5" fill="#059669"/>
  <text x="142" y="369" font-size="18.5" font-weight="600" fill="#111827">Selected 5xx responses</text>

  <g filter="url(#p1p-soft)">
    <rect x="84" y="420" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="420" width="6" height="48" fill="#059669" clip-path="url(#p1p-k4)"/>
  </g>
  <circle cx="118" cy="444" r="4.5" fill="#059669"/>
  <text x="142" y="451" font-size="18.5" font-weight="600" fill="#111827">503 Service Unavailable</text>

  <g filter="url(#p1p-soft)">
    <rect x="84" y="502" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="502" width="6" height="48" fill="#059669" clip-path="url(#p1p-k5)"/>
  </g>
  <circle cx="118" cy="526" r="4.5" fill="#059669"/>
  <text x="142" y="533" font-size="18.5" font-weight="600" fill="#111827">429 Too Many Requests</text>
  <text x="320" y="570" text-anchor="middle" font-size="15.5" fill="#6B7280">A common retriable 4xx case</text>

  
  <g filter="url(#p1p-soft)">
    <rect x="84" y="592" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="592" width="6" height="48" fill="#64748B" clip-path="url(#p1p-k6)"/>
  </g>
  <circle cx="118" cy="616" r="4.5" fill="#64748B"/>
  <text x="142" y="623" font-size="18.5" font-weight="600" fill="#111827">Only if repeating is safe</text>
  <text x="320" y="660" text-anchor="middle" font-size="15.5" fill="#6B7280">This condition applies to every signal above</text>

  
  <rect x="644" y="126" width="556" height="550" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Not retryable unchanged</text>
  <text x="1172" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">seven responses</text>

  <g filter="url(#p1p-lift)">
    <rect x="684" y="174" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="684" y="174" width="9" height="48" fill="#DB2777" clip-path="url(#p1p-k7)"/>
  </g>
  <circle cx="718" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,189) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="742" y="205" font-size="18.5" font-weight="600" fill="#111827">400</text>
  <text x="920" y="242" text-anchor="middle" font-size="15.5" fill="#6B7280">The input is invalid in every state</text>

  <g filter="url(#p1p-soft)">
    <rect x="684" y="256" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="256" width="6" height="48" fill="#DB2777" clip-path="url(#p1p-k8)"/>
  </g>
  <circle cx="718" cy="280" r="4.5" fill="#DB2777"/>
  <text x="742" y="287" font-size="18.5" font-weight="600" fill="#111827">401</text>
  <text x="920" y="324" text-anchor="middle" font-size="15.5" fill="#6B7280">Refresh first, which is a changed request</text>

  <g filter="url(#p1p-soft)">
    <rect x="684" y="338" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="338" width="6" height="48" fill="#DB2777" clip-path="url(#p1p-k9)"/>
  </g>
  <circle cx="718" cy="362" r="4.5" fill="#DB2777"/>
  <text x="742" y="369" font-size="18.5" font-weight="600" fill="#111827">403</text>
  <text x="920" y="406" text-anchor="middle" font-size="15.5" fill="#6B7280">A missing permission or quota</text>

  <g filter="url(#p1p-soft)">
    <rect x="684" y="420" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="420" width="6" height="48" fill="#DB2777" clip-path="url(#p1p-k10)"/>
  </g>
  <circle cx="718" cy="444" r="4.5" fill="#DB2777"/>
  <text x="742" y="451" font-size="18.5" font-weight="600" fill="#111827">404</text>
  <text x="920" y="488" text-anchor="middle" font-size="15.5" fill="#6B7280">A missing or private resource</text>

  <g filter="url(#p1p-soft)">
    <rect x="684" y="502" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="502" width="6" height="48" fill="#DB2777" clip-path="url(#p1p-k11)"/>
  </g>
  <circle cx="718" cy="526" r="4.5" fill="#DB2777"/>
  <text x="742" y="533" font-size="18.5" font-weight="600" fill="#111827">409</text>
  <text x="920" y="570" text-anchor="middle" font-size="15.5" fill="#6B7280">A product-state conflict</text>

  <g filter="url(#p1p-soft)">
    <rect x="684" y="584" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="584" width="6" height="48" fill="#DB2777" clip-path="url(#p1p-k12)"/>
  </g>
  <circle cx="718" cy="608" r="4.5" fill="#DB2777"/>
  <text x="742" y="615" font-size="18.5" font-weight="600" fill="#111827">410 and 412</text>
  <text x="920" y="652" text-anchor="middle" font-size="15.5" fill="#6B7280">Gone, or a stale precondition</text>

  
  <rect x="40" y="708" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="750" text-anchor="middle" font-size="16" fill="#475569">For a write, retryable also requires idempotent method semantics or the idempotency-key contract.</text>
  <text x="620" y="778" text-anchor="middle" font-size="16" fill="#475569">Most 4xx responses are not retryable unchanged, because each one requires a meaningful caller change.</text>
</svg>