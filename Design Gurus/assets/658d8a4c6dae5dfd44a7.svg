<svg xmlns="http://www.w3.org/2000/svg" width="940" height="802" viewBox="0 0 940 802" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Table of array operations and their time complexity">
<defs>
<marker id="arrc-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="arrc-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="arrc-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="arrc-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="arrc-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="arrc-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="arrc-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="arrc-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="arrc-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="940" height="802" fill="#FFFFFF"/>
<text x="470" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What each array operation costs</text>
<text x="470" y="90" text-anchor="middle" font-size="19" fill="#475569">n is the number of elements currently in the array</text>
<rect x="60" y="150" width="820" height="56" rx="12" fill="#475569"/>
<rect x="60" y="192" width="820" height="14" fill="#475569"/>
<text x="88" y="186" font-size="19.5" font-weight="600" fill="#FFFFFF">Operation</text>
<text x="460" y="186" font-size="19.5" font-weight="600" fill="#FFFFFF">When</text>
<text x="852" y="186" text-anchor="end" font-size="19.5" font-weight="600" fill="#FFFFFF">Time</text>
<rect x="60" y="206" width="820" height="58" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="88" y="243" font-size="21.5" font-weight="600" fill="#111827">Access</text>
<text x="460" y="243" font-size="18.5" fill="#6B7280">by index</text>
<rect x="734" y="217" width="118" height="36" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="793" y="241" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">O(1)</text>
<rect x="60" y="264" width="820" height="58" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="88" y="301" font-size="21.5" font-weight="600" fill="#111827">Insert</text>
<text x="460" y="301" font-size="18.5" fill="#6B7280">at the end</text>
<rect x="734" y="275" width="118" height="36" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="793" y="299" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">O(1)</text>
<rect x="60" y="322" width="820" height="58" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="88" y="359" font-size="21.5" font-weight="600" fill="#111827">Insert</text>
<text x="460" y="359" font-size="18.5" fill="#6B7280">at a specific index</text>
<rect x="734" y="333" width="118" height="36" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="793" y="357" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">O(n)</text>
<rect x="60" y="380" width="820" height="58" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="88" y="417" font-size="21.5" font-weight="600" fill="#111827">Delete</text>
<text x="460" y="417" font-size="18.5" fill="#6B7280">from the end</text>
<rect x="734" y="391" width="118" height="36" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="793" y="415" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">O(1)</text>
<rect x="60" y="438" width="820" height="58" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="88" y="475" font-size="21.5" font-weight="600" fill="#111827">Delete</text>
<text x="460" y="475" font-size="18.5" fill="#6B7280">from a specific index</text>
<rect x="734" y="449" width="118" height="36" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="793" y="473" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">O(n)</text>
<rect x="60" y="496" width="820" height="58" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="88" y="533" font-size="21.5" font-weight="600" fill="#111827">Search</text>
<text x="460" y="533" font-size="18.5" fill="#6B7280">unsorted array</text>
<rect x="734" y="507" width="118" height="36" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="793" y="531" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">O(n)</text>
<rect x="60" y="554" width="820" height="58" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="88" y="591" font-size="21.5" font-weight="600" fill="#111827">Search</text>
<text x="460" y="591" font-size="18.5" fill="#6B7280">sorted array, binary search</text>
<rect x="734" y="565" width="118" height="36" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="793" y="589" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">O(log n)</text>
<rect x="60" y="612" width="820" height="58" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="88" y="649" font-size="21.5" font-weight="600" fill="#111827">Update</text>
<text x="460" y="649" font-size="18.5" fill="#6B7280">by index</text>
<rect x="734" y="623" width="118" height="36" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="793" y="647" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">O(1)</text>
<rect x="60" y="696" width="820" height="86" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="84" y="730" font-size="18.5" fill="#475569">Inserting or deleting anywhere except the end costs O(n), because every element after that</text>
<text x="84" y="758" font-size="18.5" fill="#475569">position has to shift by one to keep the array contiguous.</text>
</svg>