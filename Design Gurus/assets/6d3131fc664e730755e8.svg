<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1482" viewBox="0 0 1240 1482" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three interview questions and the contract each one justifies: a public package-tracking API chooses REST, an internal feature-evaluation service chooses gRPC, and first-party commerce clients consider GraphQL. Each choice names its reason and the cost accepted.">
  <defs>
    <filter id="p6-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p6-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <marker id="p6-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p6-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <clipPath id="p6-k1"><rect x="68" y="176" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k2"><rect x="796" y="176" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k3"><rect x="68" y="340" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k4"><rect x="676" y="340" width="500" height="90" rx="12"/></clipPath>

    <clipPath id="p6-k5"><rect x="68" y="580" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k6"><rect x="796" y="580" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k7"><rect x="68" y="744" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k8"><rect x="676" y="744" width="500" height="90" rx="12"/></clipPath>

    <clipPath id="p6-k9"><rect x="68" y="984" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k10"><rect x="796" y="984" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k11"><rect x="68" y="1148" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p6-k12"><rect x="676" y="1148" width="500" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1482" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three questions, three different answers</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the situation, the choice, because, and the cost accepted</text>

  
  <rect x="40" y="126" width="1160" height="380" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">Question one</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#94A3B8">a public API</text>

  
  <g fill="none" stroke-width="2">
    <path d="M568,221 H796" stroke="#059669" marker-end="url(#p6-em)"/>
    <path d="M926,266 V340" stroke="#D97706" marker-end="url(#p6-am)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="682" y="209" fill="#047857">choice</text>
  </g>

  
  <g filter="url(#p6-soft)">
    <rect x="68" y="176" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="176" width="6" height="90" fill="#2563EB" clip-path="url(#p6-k1)"/>
  </g>
  <circle cx="106" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,210.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="132" y="228" font-size="18.5" font-weight="600" fill="#111827">Public package tracking</text>
  <text x="318" y="291" text-anchor="middle" font-size="15.5" fill="#6B7280">merchants in many languages, stable shapes</text>

  
  <g filter="url(#p6-lift)">
    <rect x="796" y="176" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="796" y="176" width="9" height="90" fill="#059669" clip-path="url(#p6-k2)"/>
  </g>
  <circle cx="834" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(823.56,210.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="860" y="228" font-size="18.5" font-weight="600" fill="#111827">REST</text>

  
  <g filter="url(#p6-soft)">
    <rect x="68" y="340" width="500" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="68" y="340" width="6" height="90" fill="#64748B" clip-path="url(#p6-k3)"/>
  </g>
  <circle cx="106" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,374.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="132" y="392" font-size="18.5" font-weight="600" fill="#111827">Because</text>
  <text x="318" y="455" text-anchor="middle" font-size="15.5" fill="#6B7280">Public compatibility and easy inspection</text>
  <text x="318" y="478" text-anchor="middle" font-size="15.5" fill="#6B7280">matter more than picked fields</text>

  
  <g filter="url(#p6-soft)">
    <rect x="676" y="340" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="676" y="340" width="6" height="90" fill="#D97706" clip-path="url(#p6-k4)"/>
  </g>
  <circle cx="714" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,374.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="740" y="392" font-size="18.5" font-weight="600" fill="#111827">Cost accepted</text>
  <text x="926" y="455" text-anchor="middle" font-size="15.5" fill="#6B7280">A few unused fields, and related resources</text>
  <text x="926" y="478" text-anchor="middle" font-size="15.5" fill="#6B7280">need separate bounded calls</text>

  
  <rect x="40" y="530" width="1160" height="380" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="560" font-size="16.5" font-weight="600" fill="#475569">Question two</text>
  <text x="1176" y="560" text-anchor="end" font-size="15.5" fill="#94A3B8">an internal service</text>

  <g fill="none" stroke-width="2">
    <path d="M568,625 H796" stroke="#059669" marker-end="url(#p6-em)"/>
    <path d="M926,670 V744" stroke="#D97706" marker-end="url(#p6-am)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="682" y="613" fill="#047857">choice</text>
  </g>

  <g filter="url(#p6-soft)">
    <rect x="68" y="580" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="580" width="6" height="90" fill="#2563EB" clip-path="url(#p6-k5)"/>
  </g>
  <circle cx="106" cy="625" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,614.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="132" y="632" font-size="18.5" font-weight="600" fill="#111827">Internal feature evaluation</text>
  <text x="318" y="695" text-anchor="middle" font-size="15.5" fill="#6B7280">hundreds of services, very high volume, no browser</text>

  <g filter="url(#p6-lift)">
    <rect x="796" y="580" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="796" y="580" width="9" height="90" fill="#059669" clip-path="url(#p6-k6)"/>
  </g>
  <circle cx="834" cy="625" r="18" fill="#FFFFFF"/>
  <g transform="translate(823.56,614.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="860" y="632" font-size="18.5" font-weight="600" fill="#111827">gRPC</text>

  <g filter="url(#p6-soft)">
    <rect x="68" y="744" width="500" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="68" y="744" width="6" height="90" fill="#64748B" clip-path="url(#p6-k7)"/>
  </g>
  <circle cx="106" cy="789" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,778.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="132" y="796" font-size="18.5" font-weight="600" fill="#111827">Because</text>
  <text x="318" y="859" text-anchor="middle" font-size="15.5" fill="#6B7280">Controlled callers and call volume make</text>
  <text x="318" y="882" text-anchor="middle" font-size="15.5" fill="#6B7280">generated types worth it</text>

  <g filter="url(#p6-soft)">
    <rect x="676" y="744" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="676" y="744" width="6" height="90" fill="#D97706" clip-path="url(#p6-k8)"/>
  </g>
  <circle cx="714" cy="789" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,778.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="740" y="796" font-size="18.5" font-weight="600" fill="#111827">Cost accepted</text>
  <text x="926" y="859" text-anchor="middle" font-size="15.5" fill="#6B7280">Schema tooling, deadline propagation,</text>
  <text x="926" y="882" text-anchor="middle" font-size="15.5" fill="#6B7280">protocol-aware debugging, a gateway later</text>

  
  <rect x="40" y="934" width="1160" height="380" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="964" font-size="16.5" font-weight="600" fill="#475569">Question three</text>
  <text x="1176" y="964" text-anchor="end" font-size="15.5" fill="#94A3B8">first-party clients</text>

  <g fill="none" stroke-width="2">
    <path d="M568,1029 H796" stroke="#059669" marker-end="url(#p6-em)"/>
    <path d="M926,1074 V1148" stroke="#D97706" marker-end="url(#p6-am)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="682" y="1017" fill="#047857">choice</text>
  </g>

  <g filter="url(#p6-soft)">
    <rect x="68" y="984" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="984" width="6" height="90" fill="#2563EB" clip-path="url(#p6-k9)"/>
  </g>
  <circle cx="106" cy="1029" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,1018.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="132" y="1036" font-size="18.5" font-weight="600" fill="#111827">First-party commerce apps</text>
  <text x="318" y="1099" text-anchor="middle" font-size="15.5" fill="#6B7280">whose screen operations keep multiplying</text>

  <g filter="url(#p6-lift)">
    <rect x="796" y="984" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="796" y="984" width="9" height="90" fill="#059669" clip-path="url(#p6-k10)"/>
  </g>
  <circle cx="834" cy="1029" r="18" fill="#FFFFFF"/>
  <g transform="translate(823.56,1018.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="860" y="1036" font-size="18.5" font-weight="600" fill="#111827">GraphQL</text>

  <g filter="url(#p6-soft)">
    <rect x="68" y="1148" width="500" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="68" y="1148" width="6" height="90" fill="#64748B" clip-path="url(#p6-k11)"/>
  </g>
  <circle cx="106" cy="1193" r="18" fill="#FFFFFF"/>
  <g transform="translate(95.56,1182.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="132" y="1200" font-size="18.5" font-weight="600" fill="#111827">Because</text>
  <text x="318" y="1263" text-anchor="middle" font-size="15.5" fill="#6B7280">Repeated variation in connected field sets</text>
  <text x="318" y="1286" text-anchor="middle" font-size="15.5" fill="#6B7280">is the real trigger</text>

  <g filter="url(#p6-soft)">
    <rect x="676" y="1148" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="676" y="1148" width="6" height="90" fill="#D97706" clip-path="url(#p6-k12)"/>
  </g>
  <circle cx="714" cy="1193" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,1182.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="740" y="1200" font-size="18.5" font-weight="600" fill="#111827">Cost accepted</text>
  <text x="926" y="1263" text-anchor="middle" font-size="15.5" fill="#6B7280">Depth limits, field-cost budgets, persisted</text>
  <text x="926" y="1286" text-anchor="middle" font-size="15.5" fill="#6B7280">operations, batching, harder caching</text>

  
  <rect x="40" y="1342" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1384" text-anchor="middle" font-size="16" fill="#475569">The answer does not need one technology for every boundary.</text>
  <text x="620" y="1412" text-anchor="middle" font-size="16" fill="#475569">Each choice names its reason and the cost accepted.</text>
</svg>