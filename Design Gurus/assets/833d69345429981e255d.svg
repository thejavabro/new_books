<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With the origin unreachable, a cache past its soft TTL keeps serving the last good value, while a cache past its hard TTL stops serving and the request fails">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="ca4-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ca4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ca4-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="ca4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The origin is down. What the reader gets depends on which TTL has passed.</text>

  
  <rect x="40" y="76" width="1160" height="286" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#065F46">Past the soft TTL, before the hard TTL</text>

  <line x1="286" y1="204" x2="452" y2="204" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca4-blue)"/>
  <text x="369" y="180" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>

  <line x1="452" y1="258" x2="286" y2="258" stroke="#059669" stroke-width="2" marker-end="url(#ca4-emerald)"/>
  <text x="369" y="292" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">last good value</text>

  <line x1="672" y1="204" x2="856" y2="204" stroke="#D97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ca4-red)"/>
  <text x="764" y="180" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">background refresh</text>
  <text x="764" y="240" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fails silently</text>

  <g filter="url(#ca4-soft)">
    <rect x="86" y="196" width="200" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="452" y="180" width="220" height="104" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="860" y="196" width="220" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="186" y="240" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Reader</text>
  <text x="562" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cache</text>
  <text x="562" y="244" font-size="20" fill="#64748B" text-anchor="middle">holds a stale</text>
  <text x="562" y="270" font-size="20" fill="#64748B" text-anchor="middle">but usable copy</text>
  <text x="970" y="230" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Origin</text>
  <text x="970" y="256" font-size="20" fill="#B91C1C" text-anchor="middle">unreachable</text>

  <rect x="86" y="316" width="1028" height="34" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="600" y="340" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The site stays up on slightly old data.</text>

  
  <rect x="40" y="390" width="1160" height="286" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="424" font-size="20" font-weight="600" fill="#B91C1C">Past the hard TTL</text>

  <line x1="286" y1="518" x2="452" y2="518" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca4-blue)"/>
  <text x="369" y="494" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>

  <line x1="452" y1="572" x2="286" y2="572" stroke="#DC2626" stroke-width="2" marker-end="url(#ca4-red)"/>
  <text x="369" y="606" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">error or fallback</text>

  <line x1="672" y1="518" x2="856" y2="518" stroke="#D97706" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ca4-red)"/>
  <text x="764" y="494" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">refresh attempted</text>
  <text x="764" y="554" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">still failing</text>

  <g filter="url(#ca4-soft)">
    <rect x="86" y="510" width="200" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="452" y="494" width="220" height="104" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="860" y="510" width="220" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="186" y="554" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Reader</text>
  <text x="562" y="526" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cache</text>
  <text x="562" y="558" font-size="20" fill="#64748B" text-anchor="middle">entry is too old</text>
  <text x="562" y="584" font-size="20" fill="#64748B" text-anchor="middle">to serve at all</text>
  <text x="970" y="544" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Origin</text>
  <text x="970" y="570" font-size="20" fill="#B91C1C" text-anchor="middle">unreachable</text>

  <rect x="86" y="630" width="1028" height="34" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="600" y="654" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Deliberate: a 30 minute old price is worse than no price.</text>
</svg>