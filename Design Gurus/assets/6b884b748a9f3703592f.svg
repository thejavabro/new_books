<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="splitbrain-title splitbrain-desc">
<title id="splitbrain-title">The failover gap</title>
<desc id="splitbrain-desc">A failover tool that cannot reach the primary cannot tell whether it is dead, so promoting a replica can produce two primaries accepting divergent writes. The replication mode then decides how much data a clean failover loses.</desc>
<defs>
<marker id="splitbrain-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="splitbrain-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="splitbrain-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="splitbrain-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="786" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The failover gap</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Replication looks complete until the primary fails, and then the gap becomes visible.</text>
<rect x="40" y="708" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="708" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<text x="40" y="146" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">From outside, dead and unreachable look the same</text>
<rect x="40" y="164" width="360" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="220" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">primary, still alive</text>
<path d="M420 152V280" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="440" y="164" width="360" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">failover tool</text>
<path d="M806 192H840" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M806 192H840" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#splitbrain-marker-red)"/>
<rect x="840" y="164" width="360" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1020" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">replica, promoted</text>
<rect x="40" y="230" width="360" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="220" y="259" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">accepting writes</text>
<rect x="840" y="230" width="360" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1020" y="259" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">accepting writes</text>
<text x="620" y="260" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">two primaries</text>
<rect x="40" y="296" width="1160" height="60" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="296" width="5" height="60" rx="2.5" fill="#F28B9D"/><text x="64" y="332" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">The decision must be made once, by a majority, or it can be made twice.</text>
<text x="40" y="396" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And the replication mode decides how much is at risk</text>
<rect x="40" y="414" width="300" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Asynchronous</text>
<path d="M346 440H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 440H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#splitbrain-marker-slate)"/>
<rect x="390" y="414" width="810" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="446" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">acknowledge before replicas have it: fast failover, loses everything in flight</text>
<rect x="40" y="478" width="300" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="190" y="510" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Synchronous</text>
<path d="M346 504H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 504H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#splitbrain-marker-slate)"/>
<rect x="390" y="478" width="810" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="510" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">wait for a replica: no loss, and a slow replica now stalls your writes</text>
<rect x="40" y="542" width="300" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="574" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Semi-synchronous</text>
<path d="M346 568H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 568H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#splitbrain-marker-slate)"/>
<rect x="390" y="542" width="810" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="574" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">wait for one of several: the usual compromise, and worth naming as one</text>
<rect x="40" y="622" width="1160" height="60" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="622" width="5" height="60" rx="2.5" fill="#AC8BE8"/><text x="64" y="658" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">"We have replicas" describes a topology, not a guarantee.</text>
<text x="66" y="742" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Split brain is why automated failover without consensus is dangerous rather than merely incomplete.</text>
</svg>