<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. The left panel shows redundancy: server A takes the traffic and server B is a spare that takes none. The right panel shows replication: a primary holds the value name equals Ana and the same value is applied to two copies.">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="rr1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rr1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rr1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rr1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rr1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rr1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rr1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rr1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two different words</text>
  <rect x="30" y="70" width="580" height="350" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="320" y="110" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">Redundancy</text>
  <text x="320" y="142" font-size="19" fill="#64748B" text-anchor="middle">a spare copy of a part</text>
  <g filter="url(#rr1-soft)"><rect x="80" y="180" width="210" height="82" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="185" y="214" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">server A</text>
  <text x="185" y="242" font-size="18" fill="#64748B" text-anchor="middle">takes the traffic</text>
  <g filter="url(#rr1-soft)"><rect x="350" y="180" width="210" height="82" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5"/></g>
  <text x="455" y="214" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">server B</text>
  <text x="455" y="242" font-size="18" fill="#64748B" text-anchor="middle">spare, no traffic</text>
  <line x1="440" y1="290" x2="300" y2="290" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#rr1-s)"/>
  <text x="320" y="322" font-size="19" fill="#0F172A" text-anchor="middle">B takes over if A stops</text>
  <text x="320" y="356" font-size="19" fill="#64748B" text-anchor="middle">It is about the machines.</text>
  <rect x="630" y="70" width="580" height="350" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="920" y="110" font-size="22" font-weight="700" fill="#6D28D9" text-anchor="middle">Replication</text>
  <text x="920" y="142" font-size="19" fill="#64748B" text-anchor="middle">copies of data kept in step</text>
  <g filter="url(#rr1-soft)"><rect x="810" y="172" width="220" height="66" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="920" y="200" font-size="19" font-weight="700" fill="#6D28D9" text-anchor="middle">primary</text>
  <text x="920" y="226" font-size="18" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">name = Ana</text>
  <line x1="900" y1="242" x2="810" y2="292" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#rr1-v)"/>
  <line x1="940" y1="242" x2="1030" y2="292" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#rr1-v)"/>
  <g filter="url(#rr1-soft)"><rect x="690" y="296" width="220" height="66" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="800" y="324" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">copy</text>
  <text x="800" y="350" font-size="18" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">name = Ana</text>
  <g filter="url(#rr1-soft)"><rect x="930" y="296" width="220" height="66" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="1040" y="324" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">copy</text>
  <text x="1040" y="350" font-size="18" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">name = Ana</text>
  <text x="920" y="392" font-size="19" fill="#64748B" text-anchor="middle">The same change reaches every copy. It is about the data.</text>
  <text x="620" y="452" font-size="19" fill="#64748B" text-anchor="middle">You usually need both. A spare machine is not useful without the same data on it.</text>
</svg>