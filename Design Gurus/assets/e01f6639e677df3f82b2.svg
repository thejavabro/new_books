<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="942" viewBox="0 0 1240 942" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two upload designs side by side. On the left the client sends bytes through the API, which can inspect or transform them on the way to storage. On the right the API issues a short lived signed location and the client sends bytes straight to storage. Both finish at the same file resource with the same whole file checksum. Downloads use the same choice in reverse.">
  <defs>
    <marker id="ps-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="ps-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="ps-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ps-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ps-k1"><rect x="227" y="146" width="226" height="90" rx="12"/></clipPath>
    <clipPath id="ps-k2"><rect x="227" y="310" width="226" height="90" rx="12"/></clipPath>
    <clipPath id="ps-k3"><rect x="227" y="504" width="226" height="90" rx="12"/></clipPath>
    <clipPath id="ps-k4"><rect x="791" y="146" width="226" height="90" rx="12"/></clipPath>
    <clipPath id="ps-k5"><rect x="652" y="424" width="226" height="90" rx="12"/></clipPath>
    <clipPath id="ps-k6"><rect x="930" y="424" width="226" height="90" rx="12"/></clipPath>
    <clipPath id="ps-k7"><rect x="370" y="692" width="500" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="942" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="608" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Carry the bytes, or return a signed location</text>

  
  <rect x="64" y="90" width="544" height="534" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="120" font-size="16.5" font-weight="600" fill="#1D4ED8">The API carries the bytes</text>

  
  <rect x="632" y="90" width="544" height="534" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="656" y="120" font-size="16.5" font-weight="600" fill="#047857">The client sends bytes to storage</text>

  
  <g fill="none" stroke-width="2">
    <path d="M340,236 V310" stroke="#2563EB" marker-end="url(#ps-bl)"/>
    <path d="M340,441 V504" stroke="#2563EB" marker-end="url(#ps-bl)"/>
    <path d="M340,594 V725 Q340,737 352,737 H370" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ps-bl)"/>
    <path d="M840,424 V236" stroke="#059669" stroke-dasharray="7 5" marker-end="url(#ps-em)"/>
    <path d="M980,236 V424" stroke="#059669" marker-end="url(#ps-em)"/>
    <path d="M1080,514 V725 Q1080,737 1068,737 H870" stroke="#059669" stroke-width="2.5" marker-end="url(#ps-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="380" y="279" text-anchor="middle" fill="#1D4ED8">bytes</text>
    <text x="826" y="336" text-anchor="end" fill="#047857">signed location</text>
    <text x="994" y="336" fill="#047857">bytes</text>
  </g>

  
  <g filter="url(#ps-soft)">
    <rect x="227" y="146" width="226" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="227" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#ps-k1)"/>
  </g>
  <circle cx="265" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(254.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="291" y="198" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#ps-lift)">
    <rect x="227" y="310" width="226" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="227" y="310" width="9" height="90" fill="#2563EB" clip-path="url(#ps-k2)"/>
  </g>
  <circle cx="265" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(254.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="291" y="362" font-size="18.5" font-weight="600" fill="#111827">API server</text>
  <text x="340" y="425" font-size="15.5" text-anchor="middle" fill="#6B7280">can inspect or transform</text>

  
  <g filter="url(#ps-soft)">
    <rect x="227" y="504" width="226" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="227" y="504" width="6" height="90" fill="#2563EB" clip-path="url(#ps-k3)"/>
  </g>
  <circle cx="265" cy="549" r="18" fill="#FFFFFF"/>
  <g transform="translate(254.56,538.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="291" y="556" font-size="18.5" font-weight="600" fill="#111827">Storage</text>

  
  <g filter="url(#ps-soft)">
    <rect x="791" y="146" width="226" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="791" y="146" width="6" height="90" fill="#059669" clip-path="url(#ps-k4)"/>
  </g>
  <circle cx="829" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(818.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="855" y="198" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#ps-lift)">
    <rect x="652" y="424" width="226" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="652" y="424" width="9" height="90" fill="#059669" clip-path="url(#ps-k5)"/>
  </g>
  <circle cx="690" cy="469" r="18" fill="#FFFFFF"/>
  <g transform="translate(679.56,458.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="716" y="476" font-size="18.5" font-weight="600" fill="#111827">API server</text>

  
  <g filter="url(#ps-soft)">
    <rect x="930" y="424" width="226" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="930" y="424" width="6" height="90" fill="#059669" clip-path="url(#ps-k6)"/>
  </g>
  <circle cx="968" cy="469" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,458.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="994" y="476" font-size="18.5" font-weight="600" fill="#111827">Storage</text>

  <text x="765" y="539" font-size="15.5" text-anchor="middle" fill="#6B7280">The API still owns limits, quota,</text>
  <text x="765" y="562" font-size="15.5" text-anchor="middle" fill="#6B7280">metadata, completion, cleanup.</text>

  
  <g filter="url(#ps-lift)">
    <rect x="370" y="692" width="500" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="370" y="692" width="9" height="90" fill="#7C3AED" clip-path="url(#ps-k7)"/>
  </g>
  <circle cx="408" cy="737" r="18" fill="#FFFFFF"/>
  <g transform="translate(397.56,726.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="434" y="744" font-size="18.5" font-weight="600" fill="#111827">Same File resource, same whole-file checksum</text>

  
  <rect x="40" y="826" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="871" text-anchor="middle" font-size="16" fill="#475569">Downloads use the same choice in reverse, with byte ranges to resume.</text>
</svg>