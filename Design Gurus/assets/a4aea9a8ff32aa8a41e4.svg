<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Changing a value on a running service. The new value is committed, the configuration server serves it, the service is told to refresh, and traffic uses it without a restart. Two traps: only the parts in refresh scope reload, and the change reaches every instance at once">
  <defs>
    <marker id="cf4-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="cf4-k1"><rect x="72" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf4-k2"><rect x="358" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf4-k3"><rect x="644" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf4-k4"><rect x="930" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf4-k5"><rect x="72" y="398" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="cf4-k6"><rect x="648" y="398" width="520" height="90" rx="12"/></clipPath>
    <filter id="cf4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cf4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#047857">Changing a value on a running service</text>
  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#BE185D">Two things that catch people out</text>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M308,157 H350" marker-end="url(#cf4-memerald)"/>
    <path d="M594,157 H636" marker-end="url(#cf4-memerald)"/>
    <path d="M880,157 H922" marker-end="url(#cf4-memerald)"/>
  </g>
  <g filter="url(#cf4-soft)">
    <rect x="72" y="112" width="236" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#059669" clip-path="url(#cf4-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Commit It</text>
  <text x="190" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the new value is pushed to</text>
  <text x="190" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">the configuration store</text>
  <g filter="url(#cf4-soft)">
    <rect x="358" y="112" width="236" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="358" y="112" width="6" height="90" fill="#059669" clip-path="url(#cf4-k2)"/>
  </g>
  <circle cx="396" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(385.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="422" y="164" font-size="18.5" font-weight="600" fill="#111827">Server Sees It</text>
  <text x="476" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the configuration server</text>
  <text x="476" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">now serves the new value</text>
  <g filter="url(#cf4-soft)">
    <rect x="644" y="112" width="236" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="644" y="112" width="6" height="90" fill="#059669" clip-path="url(#cf4-k3)"/>
  </g>
  <circle cx="682" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="708" y="164" font-size="18.5" font-weight="600" fill="#111827">Refresh</text>
  <text x="762" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the service is told to fetch</text>
  <text x="762" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">its values again</text>
  <g filter="url(#cf4-soft)">
    <rect x="930" y="112" width="236" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="930" y="112" width="6" height="90" fill="#059669" clip-path="url(#cf4-k4)"/>
  </g>
  <circle cx="968" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="994" y="164" font-size="18.5" font-weight="600" fill="#111827">Nothing Restarts</text>
  <text x="1048" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">traffic uses the new value</text>
  <text x="1048" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">on the very next request</text>
  <g filter="url(#cf4-soft)">
    <rect x="72" y="398" width="520" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="398" width="6" height="90" fill="#DB2777" clip-path="url(#cf4-k5)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Only Scoped Parts Reload</text>
  <text x="332" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">a component built once at startup keeps the old value</text>
  <text x="332" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">until the service restarts or the scope is widened</text>
  <g filter="url(#cf4-lift)">
    <rect x="648" y="398" width="520" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="648" y="398" width="9" height="90" fill="#DB2777" clip-path="url(#cf4-k6)"/>
  </g>
  <circle cx="686" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(675.56,432.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="712" y="450" font-size="18.5" font-weight="600" fill="#111827">It Reaches Every Instance</text>
  <text x="908" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">a config change has no staged rollout in front of it</text>
  <text x="908" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">so change one environment first and watch it</text>
  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="636" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The gain</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">a value changes in seconds, with no rebuild, no redeploy and no restart</text>
  <rect x="64" y="680" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The catch</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">a mistake travels just as fast, which is why a config change deserves the care a deployment gets</text>
</svg>