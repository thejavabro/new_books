  <circle cx="378" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="404" y="116" font-size="18.5" font-weight="600" fill="#111827">A choice</text>
  <text x="475" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">with clear reasons</text>
