  <g transform="translate(947.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="984" y="116" font-size="18.5" font-weight="600" fill="#111827">The family</text>
  <text x="1055" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">and main design decisions</text>
  <rect x="40" y="236" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="270" font-size="16" fill="#475569">No architecture yet. This is the opening, and it is worth practising on its own.</text>
  <rect x="64" y="296" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="318" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">State the limits</text>
  <text x="288" y="318" font-size="15.5" fill="#475569">confirm language, channel, and refund limits; identify numerical assumptions</text>
  <rect x="64" y="340" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="362" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Why it helps</text>
  <text x="288" y="362" font-size="15.5" fill="#475569">the interviewer can confirm the task before the detailed design</text>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Avoid scope errors</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">resolve unclear requirements before choosing components</text>
  <rect x="40" y="482" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="527" text-anchor="middle" font-size="16" fill="#475569">Practice aloud for ten minutes, including clarification and discussion.</text>
</svg>