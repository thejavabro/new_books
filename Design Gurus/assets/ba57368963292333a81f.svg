  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Options</text>
  <text x="185" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">by family, in 30 seconds</text>
  <g filter="url(#m1l5c-soft)">
    <rect x="340" y="64" width="270" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
