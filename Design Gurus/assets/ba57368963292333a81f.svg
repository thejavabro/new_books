  <text x="694" y="116" font-size="18.5" font-weight="600" fill="#111827">The numbers</text>
  <text x="765" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">quality, latency, scale, cost</text>
  <g filter="url(#m1l5c-lift)">
    <rect x="920" y="64" width="270" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
