<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four UML diagrams this course uses, and when to draw each">
  <defs>
    <marker id="umlw-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="umlw-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="umlw-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="umlw-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="umlw-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="umlw-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="umlw-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="umlw-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="umlw-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="umlw-d0"><rect x="44" y="78" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="umlw-q0"><rect x="570" y="78" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="umlw-d1"><rect x="44" y="166" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="umlw-q1"><rect x="570" y="166" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="umlw-d2"><rect x="44" y="254" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="umlw-q2"><rect x="570" y="254" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="umlw-d3"><rect x="44" y="342" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="umlw-q3"><rect x="570" y="342" width="626" height="64" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <text x="44" y="56" font-size="16.5" fill="#6B7280" font-weight="600">The diagram</text>
  <text x="570" y="56" font-size="16.5" fill="#6B7280" font-weight="600">The question it answers</text>
  <g filter="url(#umlw-soft)">
    <rect x="44" y="78" width="470" height="64" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="44" y="78" width="6" height="64" fill="#4F46E5" clip-path="url(#umlw-d0)"/>
  </g>
  <circle cx="82" cy="110.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="116.5" font-size="17" font-weight="700" text-anchor="middle" fill="#4F46E5">1</text>
  <text x="112" y="116.5" font-size="18.5" font-weight="600" fill="#111827">Use case diagram</text>
  <g filter="url(#umlw-soft)">
    <rect x="570" y="78" width="626" height="64" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="570" y="78" width="6" height="64" fill="#4F46E5" clip-path="url(#umlw-q0)"/>
  </g>
  <text x="592" y="116.5" font-size="18.5" font-weight="600" fill="#111827">who uses this, and what can each of them do?</text>
  <path d="M514,110 L570,110" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#umlw-arrow-indigo)"/>
  <g filter="url(#umlw-soft)">
    <rect x="44" y="166" width="470" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="44" y="166" width="6" height="64" fill="#2563EB" clip-path="url(#umlw-d1)"/>
  </g>
  <circle cx="82" cy="198.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="204.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">2</text>
  <text x="112" y="204.5" font-size="18.5" font-weight="600" fill="#111827">Class diagram</text>
  <g filter="url(#umlw-soft)">
    <rect x="570" y="166" width="626" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="570" y="166" width="6" height="64" fill="#2563EB" clip-path="url(#umlw-q1)"/>
  </g>
  <text x="592" y="204.5" font-size="18.5" font-weight="600" fill="#111827">what are the classes, and how do they connect?</text>
  <path d="M514,198 L570,198" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#umlw-arrow-blue)"/>
  <g filter="url(#umlw-soft)">
    <rect x="44" y="254" width="470" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="44" y="254" width="6" height="64" fill="#7C3AED" clip-path="url(#umlw-d2)"/>
  </g>
  <circle cx="82" cy="286.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="292.5" font-size="17" font-weight="700" text-anchor="middle" fill="#7C3AED">3</text>
  <text x="112" y="292.5" font-size="18.5" font-weight="600" fill="#111827">Activity diagram</text>
  <g filter="url(#umlw-soft)">
    <rect x="570" y="254" width="626" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="570" y="254" width="6" height="64" fill="#7C3AED" clip-path="url(#umlw-q2)"/>
  </g>
  <text x="592" y="292.5" font-size="18.5" font-weight="600" fill="#111827">what are the steps of one flow, and where does it branch?</text>
  <path d="M514,286 L570,286" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#umlw-arrow-violet)"/>
  <g filter="url(#umlw-soft)">
    <rect x="44" y="342" width="470" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="44" y="342" width="6" height="64" fill="#059669" clip-path="url(#umlw-d3)"/>
  </g>
  <circle cx="82" cy="374.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="380.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">4</text>
  <text x="112" y="380.5" font-size="18.5" font-weight="600" fill="#111827">Sequence diagram</text>
  <g filter="url(#umlw-soft)">
    <rect x="570" y="342" width="626" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="570" y="342" width="6" height="64" fill="#059669" clip-path="url(#umlw-q3)"/>
  </g>
  <text x="592" y="380.5" font-size="18.5" font-weight="600" fill="#111827">which object calls which, and in what order?</text>
  <path d="M514,374 L570,374" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#umlw-arrow-emerald)"/>
  <text x="620" y="452" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">UML defines fourteen. Two of these four are drawn in almost every interview; the other two on request.</text>
</svg>