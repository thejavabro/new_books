<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="measure-title measure-desc">
<title id="measure-title">What you are actually measuring</title>
<desc id="measure-desc">The output of a drill is numbers and a list rather than a verdict. The most valuable one is how many manual steps were needed and how many of them were absent from the runbook.</desc>
<defs>
<marker id="measure-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="measure-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="measure-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="measure-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="860" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What you are actually measuring</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The output of a drill is numbers and a list, not a verdict.</text>
<rect x="40" y="782" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="782" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="420" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="250" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Recovery time, split three ways</text>
<path d="M466 150H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 150H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#measure-marker-slate)"/>
<rect x="510" y="118" width="690" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="156" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">detect, decide and redirect, each against what the plan claimed</text>
<rect x="40" y="190" width="420" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="250" y="228" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Data loss, measured</text>
<path d="M466 222H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 222H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#measure-marker-slate)"/>
<rect x="510" y="190" width="690" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="215.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than assumed, which usually needs</text><text x="530" y="240.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the comparison tooling from migrations</text>
<rect x="40" y="262" width="420" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="250" y="300" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The number of manual steps</text>
<path d="M466 294H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 294H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#measure-marker-slate)"/>
<rect x="510" y="262" width="690" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="287.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and how many were not in the runbook.</text><text x="530" y="312.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The most valuable number, rarely recorded</text>
<rect x="40" y="334" width="420" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="250" y="372" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Time waiting on a person</text>
<path d="M466 366H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 366H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#measure-marker-slate)"/>
<rect x="510" y="334" width="690" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="359.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">separately from time waiting on a system,</text><text x="530" y="384.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because they have different fixes</text>
<rect x="40" y="406" width="420" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="250" y="444" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What broke that was unrelated</text>
<path d="M466 438H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 438H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#measure-marker-slate)"/>
<rect x="510" y="406" width="690" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="431.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">drills surface hidden problems, and those</text><text x="530" y="456.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">findings are a large part of the value</text>
<rect x="40" y="490" width="1160" height="86" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="490" width="5" height="86" rx="2.5" fill="#F3CF6A"/><text x="64" y="526" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Eleven manual steps and four of them not written down</text><text x="64" y="552" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">means a third of the runbook is wrong, learned on a day when it cost nothing.</text>
<rect x="40" y="596" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="596" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="637" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A drill that produces no findings was probably too shallow to exercise anything.</text>
<rect x="40" y="686" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="686" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="727" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Last drilled when, at which rung, with what measured, and what it found.</text>
<text x="66" y="815" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A team that can state those four things has a capability. One that describes the architecture has a diagram.</text>
</svg>