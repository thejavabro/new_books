<rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the smallest number of jumps from the start to the end?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Each number says how far forward you may jump from that spot, never further</text>
