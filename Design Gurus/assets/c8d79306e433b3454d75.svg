<text x="620" y="474" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Only the start is known at zero jumps, and a dash means no route is known yet</text>
<rect x="40" y="570" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="610" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Every spot is reached in one more jump than the spot you left</text>
<text x="620" y="642" text-anchor="middle" font-size="18.5" fill="#475569">So each spot only has to offer its own count plus one to everything it can reach</text>
</svg>