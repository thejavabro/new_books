<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="866" viewBox="0 0 1240 866" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The protocol cheat sheet: REST for public or mixed callers, gRPC for controlled internal services needing generated code and deadlines, and GraphQL for trusted clients needing materially different field sets.">
  <defs>
    <filter id="p4e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p4e-k1"><rect x="76" y="146" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p4e-k2"><rect x="76" y="342" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p4e-k3"><rect x="76" y="538" width="340" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="866" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">REST, gRPC, or GraphQL: one trigger each</text>
  <g transform="translate(636,62.5) scale(0.62)" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="662" y="77" font-size="15.5" fill="#6B7280">the trigger</text>
  <g transform="translate(800,62.5) scale(0.62)" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="826" y="77" font-size="15.5" fill="#6B7280">the interview sentence</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p4e-soft)">
    <rect x="76" y="146" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p4e-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">REST</text>
  <g transform="translate(76,247.5) scale(0.62)" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">Public or mixed callers need a predictable resource contract over HTTP.</text>
  <g transform="translate(76,273.5) scale(0.62)" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">"Choose REST; accept several fixed response shapes rather than caller-selected fields."</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p4e-soft)">
    <rect x="76" y="342" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#7C3AED" clip-path="url(#p4e-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">gRPC</text>
  <g transform="translate(76,443.5) scale(0.62)" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">Controlled internal services need schema-generated code, compact messages, deadlines, or streaming.</text>
  <g transform="translate(76,469.5) scale(0.62)" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">"Choose gRPC; accept coordinated schema evolution, gateway translation, and weaker direct browser ergonomics."</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p4e-soft)">
    <rect x="76" y="538" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p4e-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">GraphQL</text>
  <g transform="translate(76,639.5) scale(0.62)" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">Clients need different field selections or graph traversal.</text>
  <g transform="translate(76,665.5) scale(0.62)" fill="none" stroke="#64748B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">"Choose GraphQL; accept query-cost controls, resolver N+1 risk, field authorization, and harder shared caching."</text>

  
  <rect x="40" y="726" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="768" text-anchor="middle" font-size="16" fill="#475569">These are example use cases, not restrictions on which callers each API style can serve.</text>
  <text x="620" y="796" text-anchor="middle" font-size="16" fill="#475569">Choose from the requirements, then explain the cost and the alternative you rejected.</text>
</svg>