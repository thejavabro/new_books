<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="622" viewBox="0 0 1240 622" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A day of traffic against its average line and its evening peak, with the gap between them marked as the headroom you must provision but rarely use">
  <rect x="0" y="0" width="1240" height="622" fill="#FFFFFF"/>
  <defs>
    <marker id="sc4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The average never happens. The evening does.</text>

  <rect x="180" y="150" width="980" height="140" fill="#FFFBEB"/>

  <line x1="176" y1="110" x2="176" y2="430" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="180" y1="430" x2="1190" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#sc4-slate)"/>

  <line x1="180" y1="290" x2="1160" y2="290" stroke="#475569" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="180" y1="150" x2="1160" y2="150" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 5"/>

  <polyline points="180,370 302,390 425,366 547,286 670,246 792,262 915,190 997,150 1079,262 1160,350" fill="none" stroke="#3B82F6" stroke-width="3"/>

  <text x="190" y="142" font-size="20" font-weight="600" fill="#B91C1C">peak 7,000 QPS, about 2x the average</text>
  <text x="190" y="282" font-size="20" font-weight="600" fill="#334155">average 3,500 QPS</text>
  <text x="590" y="224" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">the headroom you provision but rarely use</text>

  <text x="168" y="156" font-size="20" fill="#64748B" text-anchor="end">7,000</text>
  <text x="168" y="296" font-size="20" fill="#64748B" text-anchor="end">3,500</text>
  <text x="168" y="436" font-size="20" fill="#64748B" text-anchor="end">0</text>

  <text x="180" y="458" font-size="20" fill="#64748B" text-anchor="middle">midnight</text>
  <text x="425" y="458" font-size="20" fill="#64748B" text-anchor="middle">6 am</text>
  <text x="670" y="458" font-size="20" fill="#64748B" text-anchor="middle">noon</text>
  <text x="915" y="458" font-size="20" fill="#64748B" text-anchor="middle">6 pm</text>
  <text x="1160" y="458" font-size="20" fill="#64748B" text-anchor="middle">midnight</text>

  
  <rect x="50" y="500" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="536" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Size for the average and you are short every evening. Size for the peak and half the fleet idles at 4 am.</text>
  <text x="620" y="566" font-size="20" fill="#334155" text-anchor="middle">State the multiplier you assumed, usually 2x to 3x, then replace it with your own traffic data.</text>
</svg>