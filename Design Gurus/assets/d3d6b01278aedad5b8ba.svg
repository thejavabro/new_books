<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img" aria-labelledby="title desc"><title id="title">One operation can have several attempts</title><desc id="desc">A comment operation retains its identity across a failed attempt and a safe retry, then completes when its outcome is known.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="795" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">One operation can have several attempts</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">The logical operation ID remains unchanged.</tspan></text><rect x="50" y="165" width="1100" height="96" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="75" y="204" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Local record</tspan></text><text x="475" y="204" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Operation A: post the same comment</tspan></text><rect x="50" y="280" width="1100" height="96" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="75" y="319" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Attempt 1</tspan></text><text x="475" y="319" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Connection lost; result is unknown</tspan></text><rect x="50" y="395" width="1100" height="96" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="75" y="434" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Attempt 2</tspan></text><text x="475" y="434" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Same ID and immutable request, if safe</tspan></text><rect x="50" y="510" width="1100" height="96" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="75" y="549" font-size="25" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Known outcome</tspan></text><text x="475" y="549" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Store result and complete operation A</tspan></text><rect x="50" y="640" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="686" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">A new attempt is not a new intended comment.</tspan></text></g></svg>