<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Writing one record per call takes 5 ms, so the service writes at most 200 records per second, and each record is written right away. Writing batches of 100 records takes 50 ms per call, so the service writes up to 2,000 records per second, but each record waits for the batch to fill.">
  <defs>
    <filter id="lvt4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lvt4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lvt4-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="lvt4-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="lvt4-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="lvt4-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="lvt4-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="lvt4-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="lvt4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Batching trades latency for throughput</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One database write takes 5 ms. A write of 100 records takes 50 ms.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">One write per record</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#B45309">One write per 100 records</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#lvt4-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#lvt4-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#lvt4-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#lvt4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#lvt4-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#lvt4-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">A record arrives</text>
  <g filter="url(#lvt4-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#lvt4-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">Write it now</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">5 ms, low latency</text>
  <g filter="url(#lvt4-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#64748B" clip-path="url(#lvt4-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Up to 200 per second</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">1,000 ms / 5 ms</text>
  <g filter="url(#lvt4-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#D97706" clip-path="url(#lvt4-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">Wait for 100 records</text>
  <text x="234" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">the first record waits</text>
  <g filter="url(#lvt4-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#D97706" clip-path="url(#lvt4-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Write all 100</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">50 ms for one call</text>
  <g filter="url(#lvt4-lift)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="836" y="430" width="9" height="90" fill="#059669" clip-path="url(#lvt4-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">Up to 2,000 per second</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">ten times more</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Throughput</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">goes up, because the cost of each call is shared by 100 records</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Latency</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">goes up too, because each record waits until the batch is full</text>
</svg>