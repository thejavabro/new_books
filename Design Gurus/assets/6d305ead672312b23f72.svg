<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-label="Four ways a server can get a new event to a client: repeated polling, long polling, server-sent events and WebSockets, plus webhooks for server to server delivery.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="620" fill="#FFFFFF"/>
  <rect x="40" y="48" width="1160" height="116" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="40" y="48" width="9" height="116" rx="4" fill="#DC2626"/>
  <text x="74" y="88" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Polling</text>
  <text x="74" y="116" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">client asks again and again</text>
  <text x="74" y="148" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Simple. Most answers are empty, and news is up to one interval late.</text>
  <line x1="640" y1="104" x2="1140" y2="104" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="670" y1="88" x2="670" y2="100" stroke="#DC2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
  <text x="670" y="80" font-size="20" fill="#CBD5E1" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">empty</text>
  <line x1="780" y1="88" x2="780" y2="100" stroke="#DC2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
  <text x="780" y="80" font-size="20" fill="#CBD5E1" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">empty</text>
  <line x1="890" y1="88" x2="890" y2="100" stroke="#DC2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
  <text x="890" y="80" font-size="20" fill="#CBD5E1" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">empty</text>
  <line x1="1000" y1="88" x2="1000" y2="100" stroke="#DC2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
  <text x="1000" y="80" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">data</text>
  <line x1="1110" y1="88" x2="1110" y2="100" stroke="#DC2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
  <text x="1110" y="80" font-size="20" fill="#CBD5E1" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">empty</text>
  <rect x="40" y="180" width="1160" height="116" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <rect x="40" y="180" width="9" height="116" rx="4" fill="#D97706"/>
  <text x="74" y="220" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Long polling</text>
  <text x="74" y="248" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the server holds the request open</text>
  <text x="74" y="280" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Near-instant, no new protocol. Ties up a connection per waiting client.</text>
  <line x1="640" y1="236" x2="1140" y2="236" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="670" y="226" width="300" height="20" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="820" y="218" font-size="20" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">request held open</text>
  <line x1="980" y1="236" x2="1040" y2="236" stroke="#D97706" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="1092" y="218" font-size="20" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">data arrives</text>
  <rect x="40" y="312" width="1160" height="116" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="312" width="9" height="116" rx="4" fill="#059669"/>
  <text x="74" y="352" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server-sent events</text>
  <text x="74" y="380" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">one open channel, server to client</text>
  <text x="74" y="412" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Clean for feeds and notifications. One direction only.</text>
  <line x1="640" y1="368" x2="1140" y2="368" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="670" y="358" width="470" height="20" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <line x1="750" y1="386" x2="750" y2="372" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-grn)"/>
  <line x1="860" y1="386" x2="860" y2="372" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-grn)"/>
  <line x1="970" y1="386" x2="970" y2="372" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-grn)"/>
  <line x1="1080" y1="386" x2="1080" y2="372" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-grn)"/>
  <text x="905" y="350" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">server pushes whenever it likes</text>
  <rect x="40" y="444" width="1160" height="116" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="40" y="444" width="9" height="116" rx="4" fill="#3B82F6"/>
  <text x="74" y="484" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">WebSockets</text>
  <text x="74" y="512" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">one open channel, both directions</text>
  <text x="74" y="544" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">What chat and multiplayer need. You now manage connection state.</text>
  <line x1="640" y1="500" x2="1140" y2="500" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="670" y="490" width="470" height="20" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="750" y1="518" x2="750" y2="504" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#ar-blu)"/>
  <line x1="860" y1="482" x2="860" y2="496" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#ar-blu)"/>
  <line x1="970" y1="518" x2="970" y2="504" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#ar-blu)"/>
  <line x1="1080" y1="482" x2="1080" y2="496" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#ar-blu)"/>
  <text x="905" y="472" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">either side can send at any time</text>
  <rect x="40" y="578" width="1160" height="0" rx="10" fill="none" stroke="none" stroke-width="1.5"/>
  <text x="620" y="600" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Webhooks are the same idea between two servers: you register a URL and the other system posts to it when something happens.</text>
</svg>