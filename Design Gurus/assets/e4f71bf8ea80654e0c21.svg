<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The core system processes a request, validates input, finds a suitable plugin and invokes it through the plugin interface. The interface, or contract, has five methods: get_metadata, initialize with a context, execute with an operation and payload, health_check and shutdown. The Stripe, PayPal and Razorpay plugins each implement the interface and its five methods">
