  <rect x="0" y="0" width="1240" height="860" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Plugin contract: how the core communicates with plugins</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The core calls plugins only through the interface, and every plugin implements the same five methods.</text>

  <rect x="40" y="120" width="500" height="370" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Core system (microkernel)</text>
  <rect x="640" y="120" width="560" height="370" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#B45309">Plugin interface (contract)</text>
