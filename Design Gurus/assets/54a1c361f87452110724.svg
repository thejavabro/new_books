<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1040" viewBox="0 0 1240 1040" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. The core system, or microkernel, holds stable, essential functionality that every use case requires: request lifecycle, validation, routing to plugins, logging, plugin management and plugin discovery. Plugin families across the lesson&#39;s examples hold variable, extensible functionality for specific use cases: payment plugins such as Stripe, PayPal and Razorpay; shipping plugins such as FedEx, UPS and DHL; language plugins such as Python, Java, Go and Rust; export format plugins such as CSV, JSON and Parquet; notification plugins such as email, SMS and Slack; and custom business plugins for customer-specific logic">
