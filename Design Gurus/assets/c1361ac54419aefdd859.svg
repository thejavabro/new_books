<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1470" viewBox="0 0 1240 1470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The asset lifecycle state machine. An upload starts in uploading, which goes to uploaded once all parts are committed or to abandoned when the session expires. Uploaded goes to probing, which goes to rejected if the file is unreadable or on to transcoding. Transcoding goes to playable once the minimum ladder succeeds, or to failed when the minimum ladder exhausts its retries. Playable goes to complete once every rendition has landed. There is no transition from uploading straight to playable.">
  <defs>
    <marker id="m07-l08-asset-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l08-asset-states-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l08-asset-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l08-asset-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l08-asset-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1470" fill="#FFFFFF"/>

  <text x="620" y="60" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The guard: there is no uploading to playable transition,</text>
  <text x="620" y="92" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">so nothing is ever advertised before it can decode</text>

  <path d="M170,242 C400,140 900,140 1024,242" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-asset-states-rd)"/>
  <circle cx="600" cy="152" r="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <g stroke="#DC2626" stroke-width="3" stroke-linecap="round">
    <line x1="591" y1="143" x2="609" y2="161"/>
    <line x1="609" y1="143" x2="591" y2="161"/>
  </g>

  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="60" y="250" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="210" y="311" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">uploading</text>
  <text x="210" y="343" text-anchor="middle" font-size="20" fill="#64748B">the parts are still landing</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="470" y="250" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="311" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">uploaded</text>
  <text x="620" y="343" text-anchor="middle" font-size="20" fill="#64748B">the source object exists</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="880" y="250" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1030" y="311" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">probing</text>
  <text x="1030" y="343" text-anchor="middle" font-size="20" fill="#64748B">format and duration</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="60" y="580" width="300" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="210" y="641" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">rejected</text>
  <text x="210" y="673" text-anchor="middle" font-size="20" fill="#64748B">it cannot be decoded</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="470" y="580" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="641" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">transcoding</text>
  <text x="620" y="673" text-anchor="middle" font-size="20" fill="#64748B">segments in parallel</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="880" y="580" width="300" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1030" y="641" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">playable</text>
  <text x="1030" y="673" text-anchor="middle" font-size="20" fill="#64748B">the minimum ladder is live</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="60" y="910" width="300" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="210" y="971" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">abandoned</text>
  <text x="210" y="1003" text-anchor="middle" font-size="20" fill="#64748B">no source object</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="470" y="910" width="300" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="971" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">failed</text>
  <text x="620" y="1003" text-anchor="middle" font-size="20" fill="#64748B">no watchable output</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="880" y="910" width="300" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1030" y="971" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">complete</text>
  <text x="1030" y="1003" text-anchor="middle" font-size="20" fill="#64748B">every rung landed</text>

  <g fill="none" stroke-width="2.5">
    <path d="M210,210 L210,242" stroke="#475569" stroke-width="2" marker-end="url(#m07-l08-asset-states-sl)"/>
    <path d="M360,320 L462,320" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l08-asset-states-bl)"/>
    <path d="M770,320 L872,320" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l08-asset-states-bl)"/>
    <path d="M1000,390 L1000,460 L620,460 L620,572" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l08-asset-states-bl)"/>
    <path d="M1060,390 L1060,505 L210,505 L210,572" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l08-asset-states-rd)"/>
    <path d="M770,650 L872,650" stroke="#059669" marker-end="url(#m07-l08-asset-states-em)"/>
    <path d="M60,320 L40,320 L40,830 L210,830 L210,902" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l08-asset-states-rd)"/>
    <path d="M620,720 L620,902" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l08-asset-states-rd)"/>
    <path d="M1030,720 L1030,902" stroke="#059669" marker-end="url(#m07-l08-asset-states-em)"/>
  </g>

  <circle cx="210" cy="198" r="12" fill="#475569"/>

  <text x="411" y="220" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">all the parts are committed</text>
  <text x="821" y="235" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">automatic</text>
  <text x="800" y="448" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">it decodes ok</text>
  <text x="500" y="493" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the file is unreadable</text>
  <text x="821" y="550" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the minimum ladder succeeds</text>
  <text x="60" y="862" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the session expires</text>
  <text x="640" y="800" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the ladder exhausts its retries</text>
  <text x="1010" y="860" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">every rendition landed</text>

  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="60" y="1120" width="540" height="190" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="330" y="1174" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Playable is not a stop on the way</text>
  <text x="330" y="1206" text-anchor="middle" font-size="20" fill="#475569">The manifest lists exactly the renditions that</text>
  <text x="330" y="1238" text-anchor="middle" font-size="20" fill="#475569">exist, so a missing 4K is simply absent from it.</text>
  <text x="330" y="1270" text-anchor="middle" font-size="20" fill="#475569">Late renditions regenerate the manifest.</text>
  <g filter="url(#m07-l08-asset-states-soft)">
    <rect x="640" y="1120" width="540" height="190" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="910" y="1174" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Partial success is the normal case</text>
  <text x="910" y="1206" text-anchor="middle" font-size="20" fill="#475569">1080p done and 4K failed is not an incident.</text>
  <text x="910" y="1238" text-anchor="middle" font-size="20" fill="#475569">The minimum ladder is what makes the asset</text>
  <text x="910" y="1270" text-anchor="middle" font-size="20" fill="#475569">playable at all, and the rest is upside.</text>

  <line x1="60" y1="1350" x2="96" y2="1350" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1357" font-size="20" fill="#475569">A forward transition while the asset is still being made</text>
  <line x1="60" y1="1390" x2="96" y2="1390" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1397" font-size="20" fill="#475569">Success: watchable now, or every rendition landed</text>
  <line x1="60" y1="1430" x2="96" y2="1430" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1437" font-size="20" fill="#475569">A terminal failure, and the move the guard rejects</text>
</svg>