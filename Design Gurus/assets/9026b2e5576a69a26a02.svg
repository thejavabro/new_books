<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Gmail outbound flow: the client hands a message to our outbound SMTP servers, which look up the recipient domain MX records in DNS, apply spam and policy checks, and deliver over SMTP to the recipient mail exchange server which files it in the user inbox">
  <defs>
    <filter id="gm3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="gm3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="gm3-k1"><rect x="40" y="200" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gm3-k2"><rect x="470" y="200" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gm3-k3"><rect x="900" y="200" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gm3-k4"><rect x="470" y="430" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gm3-k5"><rect x="900" y="430" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="gm3-k6"><rect x="900" y="680" width="300" height="90" rx="12"/></clipPath>
    <marker id="gm3-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="gm3-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="gm3-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="gm3-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="gm3-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="gm3-s-violet" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#7C3AED"/></marker>
    <marker id="gm3-s-pink" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#DB2777"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Gmail: sending a message, and how email actually routes</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">There is no central directory. The sending server asks DNS which machine accepts mail for that domain, then talks to it directly.</text>



  <g fill="none" stroke-width="2">
    <path d="M340,245 H462" stroke="#2563EB" stroke-width="2.5" marker-end="url(#gm3-m-blue)"/>
    <path d="M770,245 H892" stroke="#D97706" stroke-width="2.5" marker-end="url(#gm3-m-amber)"/>
    <path d="M620,350 V424" stroke="#7C3AED" marker-end="url(#gm3-m-violet)" marker-start="url(#gm3-s-violet)"/>
    <path d="M1050,350 V424" stroke="#DB2777" marker-end="url(#gm3-m-pink)" marker-start="url(#gm3-s-pink)"/>
    <path d="M1050,600 V674" stroke="#059669" stroke-width="2.5" marker-end="url(#gm3-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="401" y="233" fill="#1D4ED8">hand it over</text>
    <text x="831" y="233" fill="#B45309">SMTP</text>
    <text x="700" y="392" fill="#5B21B6">MX lookup</text>
    <text x="1128" y="392" fill="#BE185D">checked</text>
    <text x="1120" y="644" fill="#047857">filed</text>
  </g>

  <g filter="url(#gm3-soft)">
    <rect x="40" y="200" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="200" width="6" height="90" fill="#2563EB" clip-path="url(#gm3-k1)"/>
  </g>
  <circle cx="78" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,234.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="252" font-size="21.5" font-weight="600" fill="#111827">Email client</text>
  <text x="190" y="319" font-size="18.5" text-anchor="middle" fill="#6B7280">sender@domain1.com</text>
  <g filter="url(#gm3-lift)">
    <rect x="470" y="200" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="470" y="200" width="9" height="90" fill="#2563EB" clip-path="url(#gm3-k2)"/>
  </g>
  <circle cx="508" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,234.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="534" y="252" font-size="21.5" font-weight="600" fill="#111827">Our SMTP server</text>
  <text x="620" y="319" font-size="18.5" text-anchor="middle" fill="#6B7280">outbound mail servers</text>
  <g filter="url(#gm3-soft)">
    <rect x="900" y="200" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="900" y="200" width="6" height="90" fill="#D97706" clip-path="url(#gm3-k3)"/>
  </g>
  <circle cx="938" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,234.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="964" y="252" font-size="21.5" font-weight="600" fill="#111827">Their MX server</text>
  <text x="1050" y="319" font-size="18.5" text-anchor="middle" fill="#6B7280">domain2.com accepts it</text>
  <g filter="url(#gm3-soft)">
    <rect x="470" y="430" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#gm3-k4)"/>
  </g>
  <circle cx="508" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="534" y="482" font-size="21.5" font-weight="600" fill="#111827">DNS</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">which machine takes mail</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">for domain2.com?</text>
  <g filter="url(#gm3-soft)">
    <rect x="900" y="430" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="900" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#gm3-k5)"/>
  </g>
  <circle cx="938" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="964" y="482" font-size="21.5" font-weight="600" fill="#111827">Spam and policy</text>
  <text x="1050" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">SPF, DKIM and DMARC</text>
  <text x="1050" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">checked by the receiver</text>
  <g filter="url(#gm3-soft)">
    <rect x="900" y="680" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="900" y="680" width="6" height="90" fill="#059669" clip-path="url(#gm3-k6)"/>
  </g>
  <circle cx="938" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,714.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="964" y="732" font-size="21.5" font-weight="600" fill="#111827">User inbox</text>
  <text x="1050" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">user@domain2.com</text>

  <rect x="40" y="850" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="875" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="900" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">DNS is the directory</text>
  <text x="323" y="900" font-size="18.5" fill="#475569">MX records are how one mail server finds another, and there is no registry above them</text>
  <rect x="64" y="925" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="950" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Prove who you are</text>
  <text x="323" y="950" font-size="18.5" fill="#475569">SPF, DKIM and DMARC are why your mail lands in an inbox and not a spam folder</text>
  <rect x="64" y="975" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="1000" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Delivery is best effort</text>
  <text x="323" y="1000" font-size="18.5" fill="#475569">the receiving server can defer or reject, so an outbound queue has to retry for days</text>
</svg>