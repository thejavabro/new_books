<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="726" viewBox="0 0 1240 726" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="100 requests per second at 400 output tokens each gives 40,000 output tokens per second; divided by 2,500 per node that is 16 nodes at peak; headroom raises it to about 20 nodes; at $3 per hour that is $1,440 per day and roughly $525K per year">
  <defs>
    <marker id="c4env2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="c4env2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="c4env2-k1"><rect x="150" y="136" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c4env2-k2"><rect x="700" y="136" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="c4env2-k3"><rect x="160" y="420" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="c4env2-k4"><rect x="500" y="420" width="235" height="90" rx="12"/></clipPath>
    <clipPath id="c4env2-k5"><rect x="880" y="420" width="284" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="726" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Size: from peak traffic to nodes</text>
  <rect x="40" y="340" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="370" font-size="16.5" font-weight="600" fill="#B45309">Price: nodes by the hour</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M430,181 H700" marker-end="url(#c4env2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M400,465 H500" marker-end="url(#c4env2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M735,465 H880" marker-end="url(#c4env2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M845,263 V304 Q845,316 833,316 H292 Q280,316 280,328 V420" marker-end="url(#c4env2-mslate)"/></g>
  <g filter="url(#c4env2-soft)">
    <rect x="150" y="136" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="150" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#c4env2-k1)"/>
  </g>
  <circle cx="188" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="150" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 1</text>
  <text x="214" y="188" font-size="18.5" font-weight="600" fill="#111827">Output-token rate</text>
  <text x="290" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">100 requests per second,</text>
  <text x="290" y="274" font-size="15.5" text-anchor="middle" fill="#6B7280">400 output tokens each</text>
  <g filter="url(#c4env2-soft)">
    <rect x="700" y="136" width="290" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="700" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#c4env2-k2)"/>
  </g>
  <circle cx="738" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="700" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 2</text>
  <text x="764" y="188" font-size="18.5" font-weight="600" fill="#111827">Divide by one node</text>
  <text x="845" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">40,000 divided by 2,500: 16 nodes at peak</text>
  <g filter="url(#c4env2-soft)">
    <rect x="160" y="420" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="160" y="420" width="6" height="90" fill="#7C3AED" clip-path="url(#c4env2-k3)"/>
  </g>
  <circle cx="198" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(187.56,454.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="160" y="408" font-size="15.5" font-weight="600" fill="#6B7280">Step 3</text>
  <text x="224" y="472" font-size="18.5" font-weight="600" fill="#111827">Add headroom</text>
  <text x="280" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">about 20 nodes, near 80 percent busy at peak</text>
  <g filter="url(#c4env2-soft)">
    <rect x="500" y="420" width="235" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="500" y="420" width="6" height="90" fill="#D97706" clip-path="url(#c4env2-k4)"/>
  </g>
  <circle cx="538" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,454.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="500" y="408" font-size="15.5" font-weight="600" fill="#6B7280">Step 4</text>
  <text x="564" y="472" font-size="18.5" font-weight="600" fill="#111827">Price the fleet</text>
  <text x="617.5" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">20 times $3 times 24 hours: $1,440 per day</text>
  <g filter="url(#c4env2-soft)">
    <rect x="880" y="420" width="284" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="420" width="6" height="90" fill="#059669" clip-path="url(#c4env2-k5)"/>
  </g>
  <circle cx="918" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,454.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="944" y="472" font-size="18.5" font-weight="600" fill="#111827">Roughly $525K per year</text>
  <text x="1022" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">for the whole fleet</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="565" y="167" fill="#1D4ED8">40,000 output tokens per second</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="807.5" y="451" fill="#B45309">times 365 days</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="562" y="306" fill="#1D4ED8">room for spikes and a failed node</text></g>
  <rect x="40" y="610" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="655" text-anchor="middle" font-size="16" fill="#475569">Start the fleet math from output tokens, because decode runs one token at a time.</text>
</svg>