<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five steps: check inventory, reserve inventory, charge payment, confirm the order (the entity confirms it and the repository saves it), and notify the customer and publish an event. CreateOrderUseCase orchestrates the workflow, calls domain entities directly and reaches infrastructure through interfaces; it calls the InventoryRepository, PaymentGateway and OrderRepository interfaces, and each interface reaches the inventory database, the payment service or the orders database through an adapter that implements it">
