<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A DFS visits the nodes from the bottom up">
<defs>
<filter id="ps-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">A DFS visits the nodes from the bottom up</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">each node reports its best upward path, and separately records its best bending path</text>
<rect x="40" y="100" width="1160" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="130" font-size="19.5" font-weight="600" fill="#475569">the tree</text>
<line x1="620" y1="228" x2="470" y2="272" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
<line x1="620" y1="228" x2="770" y2="272" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
<circle cx="620" cy="190" r="38" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="198" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">1</text>
<text x="620" y="258" text-anchor="middle" font-size="17.5" fill="#475569">not visited yet</text>
<circle cx="470" cy="310" r="38" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="470" y="318" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">2</text>
<text x="470" y="378" text-anchor="middle" font-size="17.5" fill="#475569">not visited yet</text>
<circle cx="770" cy="310" r="38" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="770" y="318" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">3</text>
<text x="770" y="378" text-anchor="middle" font-size="17.5" fill="#475569">not visited yet</text>
<rect x="40" y="406" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="436" font-size="19.5" font-weight="600" fill="#047857">best path bending at each node</text>
<rect x="210" y="448" width="200" height="68" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="310" y="488.5" text-anchor="middle" font-size="18" fill="#94A3B8">node 2</text>
<rect x="550" y="448" width="200" height="68" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="650" y="488.5" text-anchor="middle" font-size="18" fill="#94A3B8">node 3</text>
<rect x="890" y="448" width="200" height="68" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="990" y="488.5" text-anchor="middle" font-size="18" fill="#94A3B8">node 1</text>
<rect x="40" y="546" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="586" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">nothing visited yet</text>
<text x="620" y="618" text-anchor="middle" font-size="18.5" fill="#475569">the answer must contain at least one node, so it starts at a real node value</text>
</svg>