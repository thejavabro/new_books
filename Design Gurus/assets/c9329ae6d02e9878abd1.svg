<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="898" viewBox="0 0 1240 898" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What a retry costs, depending on where the first attempt ended. Two outcomes are rejected before any work starts, so nothing is billed. Four outcomes have already done work, so that work is billed, and a same-key retry replays the recorded outcome instead of paying for new generation.">
  <defs>
    <filter id="p2e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2e-k1"><rect x="76" y="174" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p2e-k2"><rect x="664" y="174" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p2e-k3"><rect x="76" y="412" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p2e-k4"><rect x="664" y="412" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p2e-k5"><rect x="76" y="588" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p2e-k6"><rect x="664" y="588" width="500" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="898" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">What a retry costs depends on where the first attempt ended</text>
  <g transform="translate(612,63.4) scale(0.72)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="15.5" r="4.5"/>
    <path d="M10.7 12.3L20 3M17.2 5.8l2.4 2.4M14.6 8.4l2.4 2.4"/>
  </g>
  <text x="640" y="77" font-size="15.5" fill="#6B7280">what a same-key retry does</text>
  <g transform="translate(876,63.4) scale(0.72)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
    <path d="M2.5 9.8h19"/>
  </g>
  <text x="904" y="77" font-size="15.5" fill="#6B7280">what it bills</text>

  
  <rect x="40" y="126" width="1160" height="214" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#047857">Rejected before any work, so nothing is billed</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two outcomes</text>

  
  <g filter="url(#p2e-soft)">
    <rect x="76" y="174" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#059669" clip-path="url(#p2e-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">A 4xx before any work</text>
  <g transform="translate(76,276.4) scale(0.72)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="15.5" r="4.5"/>
    <path d="M10.7 12.3L20 3M17.2 5.8l2.4 2.4M14.6 8.4l2.4 2.4"/>
  </g>
  <text x="104" y="290" font-size="15.5" fill="#6B7280">Returns or reevaluates the failure</text>
  <g transform="translate(76,302.4) scale(0.72)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
    <path d="M2.5 9.8h19"/>
  </g>
  <text x="104" y="316" font-size="15.5" fill="#6B7280">No inference charge, because the work never started</text>

  
  <g filter="url(#p2e-soft)">
    <rect x="664" y="174" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="664" y="174" width="6" height="90" fill="#059669" clip-path="url(#p2e-k2)"/>
  </g>
  <circle cx="702" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,208.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="728" y="226" font-size="18.5" font-weight="600" fill="#111827">A 429 admission refusal</text>
  <g transform="translate(664,276.4) scale(0.72)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="15.5" r="4.5"/>
    <path d="M10.7 12.3L20 3M17.2 5.8l2.4 2.4M14.6 8.4l2.4 2.4"/>
  </g>
  <text x="692" y="290" font-size="15.5" fill="#6B7280">May retry after Retry-After</text>
  <g transform="translate(664,302.4) scale(0.72)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
    <path d="M2.5 9.8h19"/>
  </g>
  <text x="692" y="316" font-size="15.5" fill="#6B7280">No inference charge for the refusal</text>

  
  <rect x="40" y="364" width="1160" height="390" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="394" font-size="16.5" font-weight="600" fill="#B45309">Work already happened, so that work is billed</text>
  <text x="1176" y="394" text-anchor="end" font-size="15.5" fill="#6B7280">four outcomes</text>

  
  <g filter="url(#p2e-soft)">
    <rect x="76" y="412" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="412" width="6" height="90" fill="#D97706" clip-path="url(#p2e-k3)"/>
  </g>
  <circle cx="114" cy="457" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,446.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="140" y="464" font-size="18.5" font-weight="600" fill="#111827">Still running</text>
  <g transform="translate(76,514.4) scale(0.72)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="15.5" r="4.5"/>
    <path d="M10.7 12.3L20 3M17.2 5.8l2.4 2.4M14.6 8.4l2.4 2.4"/>
  </g>
  <text x="104" y="528" font-size="15.5" fill="#6B7280">Returns 409 idempotency_request_in_progress</text>
  <g transform="translate(76,540.4) scale(0.72)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
    <path d="M2.5 9.8h19"/>
  </g>
  <text x="104" y="554" font-size="15.5" fill="#6B7280">The original work keeps accruing actual usage</text>

  
  <g filter="url(#p2e-lift)">
    <rect x="664" y="412" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="664" y="412" width="9" height="90" fill="#D97706" clip-path="url(#p2e-k4)"/>
  </g>
  <circle cx="702" cy="457" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,446.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="728" y="464" font-size="18.5" font-weight="600" fill="#111827">Completed, response lost</text>
  <g transform="translate(664,514.4) scale(0.72)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="15.5" r="4.5"/>
    <path d="M10.7 12.3L20 3M17.2 5.8l2.4 2.4M14.6 8.4l2.4 2.4"/>
  </g>
  <text x="692" y="528" font-size="15.5" fill="#6B7280">Replays the original result</text>
  <g transform="translate(664,540.4) scale(0.72)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
    <path d="M2.5 9.8h19"/>
  </g>
  <text x="692" y="554" font-size="15.5" fill="#6B7280">Same key: no new charge. New key: new charge</text>

  
  <g filter="url(#p2e-soft)">
    <rect x="76" y="588" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="588" width="6" height="90" fill="#D97706" clip-path="url(#p2e-k5)"/>
  </g>
  <circle cx="114" cy="633" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,622.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="640" font-size="18.5" font-weight="600" fill="#111827">Failed after partial output</text>
  <g transform="translate(76,690.4) scale(0.72)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="15.5" r="4.5"/>
    <path d="M10.7 12.3L20 3M17.2 5.8l2.4 2.4M14.6 8.4l2.4 2.4"/>
  </g>
  <text x="104" y="704" font-size="15.5" fill="#6B7280">Replays the failure and its usage</text>
  <g transform="translate(76,716.4) scale(0.72)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
    <path d="M2.5 9.8h19"/>
  </g>
  <text x="104" y="730" font-size="15.5" fill="#6B7280">The work performed is billed. A new key bills new generation again</text>

  
  <g filter="url(#p2e-soft)">
    <rect x="664" y="588" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="664" y="588" width="6" height="90" fill="#D97706" clip-path="url(#p2e-k6)"/>
  </g>
  <circle cx="702" cy="633" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,622.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <rect x="8.5" y="8.5" width="7" height="7" rx="1.5"/>
  </g>
  <text x="728" y="640" font-size="18.5" font-weight="600" fill="#111827">Cancelled</text>
  <g transform="translate(664,690.4) scale(0.72)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="15.5" r="4.5"/>
    <path d="M10.7 12.3L20 3M17.2 5.8l2.4 2.4M14.6 8.4l2.4 2.4"/>
  </g>
  <text x="692" y="704" font-size="15.5" fill="#6B7280">Replays the cancelled outcome</text>
  <g transform="translate(664,716.4) scale(0.72)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
    <path d="M2.5 9.8h19"/>
  </g>
  <text x="692" y="730" font-size="15.5" fill="#6B7280">Work before cancellation is billed</text>

  
  <rect x="40" y="782" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="827" text-anchor="middle" font-size="16" fill="#475569">Retry uncertain delivery with the same key. Use a new key only when you intend new generation.</text>
</svg>