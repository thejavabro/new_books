<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Synchronous communication, where the client waits for the response: the client sends a request to the broker, the broker routes it to a server, the server processes it and returns a response through the broker, and the client waits for the response before continuing. Asynchronous communication, where the client continues without waiting: the client sends a one-way call to the broker and continues, the broker forwards the request to one server, and the server later returns the result through the broker to the client&#39;s callback, where a correlation ID links the result to its request">
  <defs>
    <filter id="m12e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m12e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m12e-k1"><rect x="195" y="225" width="260" height="80" rx="12"/></clipPath>
    <clipPath id="m12e-k2"><rect x="195" y="375" width="260" height="80" rx="12"/></clipPath>
    <clipPath id="m12e-k3"><rect x="195" y="525" width="260" height="80" rx="12"/></clipPath>
    <clipPath id="m12e-k4"><rect x="785" y="225" width="260" height="80" rx="12"/></clipPath>
    <clipPath id="m12e-k5"><rect x="785" y="375" width="260" height="80" rx="12"/></clipPath>
    <clipPath id="m12e-k6"><rect x="785" y="525" width="260" height="80" rx="12"/></clipPath>
    <marker id="m12e-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m12e-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Synchronous vs. asynchronous broker communication</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">In synchronous flow the client waits for the response; in asynchronous flow it continues without waiting.</text>

  <rect x="40" y="115" width="570" height="745" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="145" font-size="19.5" font-weight="600" fill="#1D4ED8">Synchronous communication</text>
  <rect x="630" y="115" width="570" height="745" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="654" y="145" font-size="19.5" font-weight="600" fill="#4338CA">Asynchronous communication</text>

  <g fill="none" stroke-width="2">
    <path d="M295,305 V375" stroke="#2563EB" marker-end="url(#m12e-m-blue)"/>
    <path d="M295,455 V525" stroke="#2563EB" marker-end="url(#m12e-m-blue)"/>
    <path d="M355,375 V305" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12e-m-blue)"/>
    <path d="M355,525 V455" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12e-m-blue)"/>
    <path d="M885,305 V375" stroke="#2563EB" marker-end="url(#m12e-m-blue)"/>
    <path d="M885,455 V525" stroke="#2563EB" marker-end="url(#m12e-m-blue)"/>
    <path d="M945,375 V305" stroke="#4F46E5" stroke-dasharray="7 6" marker-end="url(#m12e-m-indigo)"/>
    <path d="M945,525 V455" stroke="#4F46E5" stroke-dasharray="7 6" marker-end="url(#m12e-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="281" y="346" fill="#1D4ED8" text-anchor="end">Request</text>
    <text x="281" y="496" fill="#1D4ED8" text-anchor="end">Request</text>
    <text x="369" y="346" fill="#1D4ED8" text-anchor="start">Response</text>
    <text x="369" y="496" fill="#1D4ED8" text-anchor="start">Response</text>
    <text x="871" y="346" fill="#1D4ED8" text-anchor="end">One-way call</text>
    <text x="871" y="496" fill="#1D4ED8" text-anchor="end">Request</text>
    <text x="959" y="335" fill="#4338CA" text-anchor="start">Callback with</text>
    <text x="959" y="357" fill="#4338CA" text-anchor="start">correlation ID</text>
    <text x="959" y="496" fill="#4338CA" text-anchor="start">Result</text>
  </g>

  <g filter="url(#m12e-soft)">
    <rect x="195" y="225" width="260" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="195" y="225" width="6" height="80" fill="#64748B" clip-path="url(#m12e-k1)"/>
  </g>
  <circle cx="233" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(222.56,254.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="259" y="272" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m12e-lift)">
    <rect x="195" y="375" width="260" height="80" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="195" y="375" width="9" height="80" fill="#7C3AED" clip-path="url(#m12e-k2)"/>
  </g>
  <circle cx="233" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(222.56,404.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="259" y="422" font-size="21.5" font-weight="600" fill="#111827">Broker</text>
  <g filter="url(#m12e-soft)">
    <rect x="195" y="525" width="260" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="195" y="525" width="6" height="80" fill="#2563EB" clip-path="url(#m12e-k3)"/>
  </g>
  <circle cx="233" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(222.56,554.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="259" y="572" font-size="21.5" font-weight="600" fill="#111827">Server</text>
  <g filter="url(#m12e-soft)">
    <rect x="785" y="225" width="260" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="785" y="225" width="6" height="80" fill="#64748B" clip-path="url(#m12e-k4)"/>
  </g>
  <circle cx="823" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(812.56,254.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="849" y="272" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m12e-lift)">
    <rect x="785" y="375" width="260" height="80" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="785" y="375" width="9" height="80" fill="#7C3AED" clip-path="url(#m12e-k5)"/>
  </g>
  <circle cx="823" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(812.56,404.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="849" y="422" font-size="21.5" font-weight="600" fill="#111827">Broker</text>
  <g filter="url(#m12e-soft)">
    <rect x="785" y="525" width="260" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="785" y="525" width="6" height="80" fill="#2563EB" clip-path="url(#m12e-k6)"/>
  </g>
  <circle cx="823" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(812.56,554.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="849" y="572" font-size="21.5" font-weight="600" fill="#111827">Server</text>
  <text x="64" y="172" font-size="18.5" fill="#6B7280">Client waits for response</text>
  <text x="654" y="172" font-size="18.5" fill="#6B7280">Client continues without waiting</text>

  <rect x="64" y="640" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="89" cy="662" r="13" fill="#2563EB"/>
  <text x="89" y="668.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="114" y="668.5" font-size="18.5" fill="#1F2937">Client sends a request to the broker</text>
  <rect x="64" y="694" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="89" cy="716" r="13" fill="#2563EB"/>
  <text x="89" y="722.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="114" y="722.5" font-size="18.5" fill="#1F2937">Broker routes the request to a server</text>
  <rect x="64" y="748" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="89" cy="770" r="13" fill="#2563EB"/>
  <text x="89" y="776.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="114" y="776.5" font-size="18.5" fill="#1F2937">Server processes the request and returns a response</text>
  <rect x="64" y="802" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="89" cy="824" r="13" fill="#2563EB"/>
  <text x="89" y="830.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
  <text x="114" y="830.5" font-size="18.5" fill="#1F2937">Client waits for the response before continuing</text>
  <rect x="654" y="640" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="679" cy="662" r="13" fill="#4F46E5"/>
  <text x="679" y="668.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="704" y="668.5" font-size="18.5" fill="#1F2937">Client sends a one-way call and continues</text>
  <rect x="654" y="694" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="679" cy="716" r="13" fill="#4F46E5"/>
  <text x="679" y="722.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="704" y="722.5" font-size="18.5" fill="#1F2937">Broker forwards the request to a server</text>
  <rect x="654" y="748" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="679" cy="770" r="13" fill="#4F46E5"/>
  <text x="679" y="776.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="704" y="776.5" font-size="18.5" fill="#1F2937">Server later sends the result to the callback</text>
  <rect x="654" y="802" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="679" cy="824" r="13" fill="#4F46E5"/>
  <text x="679" y="830.5" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
  <text x="704" y="830.5" font-size="18.5" fill="#1F2937">Correlation ID links the result to its request</text>


</svg>