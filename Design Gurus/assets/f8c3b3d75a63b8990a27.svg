<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="986" viewBox="0 0 1240 986" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An architecture band at the top holding clients, services, a queue, and a database. A dashed boundary below it marks where internal names stop. Under the boundary, a four step vertical sequence reads choose one caller, choose one job, list 2 to 4 operations, then design one operation fully. On the right, two examples translate architecture decisions into API behavior: a queue behind the service becomes a job status resource, and an eventually consistent index becomes a published search delay. The closing note says internal component names stay internal while the contract publishes behavior.">
