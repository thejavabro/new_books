<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="824" viewBox="0 0 1240 824" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Why an event-driven system feels faster. Calling every service in turn keeps the user waiting for all four steps, about 300 milliseconds. Publishing one event instead means the user waits only for the write and the publish, about 45 milliseconds, while the same three consumers do their work after the reply has been sent">
  <defs>
    <marker id="ed3-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="ed3-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="ed3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ed3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ed3-k1"><rect x="72" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ed3-k2"><rect x="364" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ed3-k3"><rect x="656" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ed3-k4"><rect x="948" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="ed3-k5"><rect x="72" y="398" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed3-k6"><rect x="490" y="398" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed3-k7"><rect x="908" y="398" width="260" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="824" fill="#FFFFFF"/>

  
  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#B45309">Calling each service in turn: the user waits for all four steps, about 300 ms</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#047857">Publishing one event: the user waits for two steps, about 45 ms</text>

  
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M292,157 L360,157" marker-end="url(#ed3-am)"/>
    <path d="M584,157 L652,157" marker-end="url(#ed3-am)"/>
    <path d="M876,157 L944,157" marker-end="url(#ed3-am)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M332,443 L486,443" marker-end="url(#ed3-em)"/>
    <path d="M750,443 L904,443" marker-end="url(#ed3-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="409" y="436" fill="#047857">then</text>
    <text x="827" y="436" fill="#047857">after the reply</text>
  </g>

  
  <g filter="url(#ed3-soft)">
    <rect x="72" y="112" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#D97706" clip-path="url(#ed3-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Create Order</text>
  <text x="182" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">40 ms</text>
  <text x="182" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">user waiting</text>

  <g filter="url(#ed3-soft)">
    <rect x="364" y="112" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="364" y="112" width="6" height="90" fill="#D97706" clip-path="url(#ed3-k2)"/>
  </g>
  <circle cx="402" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(391.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="428" y="164" font-size="18.5" font-weight="600" fill="#111827">Send Email</text>
  <text x="474" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">120 ms</text>
  <text x="474" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">user waiting</text>

  <g filter="url(#ed3-soft)">
    <rect x="656" y="112" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="656" y="112" width="6" height="90" fill="#D97706" clip-path="url(#ed3-k3)"/>
  </g>
  <circle cx="694" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="720" y="164" font-size="18.5" font-weight="600" fill="#111827">Log Analytics</text>
  <text x="766" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">60 ms</text>
  <text x="766" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">user waiting</text>

  <g filter="url(#ed3-soft)">
    <rect x="948" y="112" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="948" y="112" width="6" height="90" fill="#D97706" clip-path="url(#ed3-k4)"/>
  </g>
  <circle cx="986" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(975.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="1012" y="164" font-size="18.5" font-weight="600" fill="#111827">Reserve Stock</text>
  <text x="1058" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">80 ms</text>
  <text x="1058" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">reply sent at 300 ms</text>

  
  <g filter="url(#ed3-soft)">
    <rect x="72" y="398" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="398" width="6" height="90" fill="#059669" clip-path="url(#ed3-k5)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Create Order</text>
  <text x="202" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">40 ms</text>
  <text x="202" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">user waiting</text>

  <g filter="url(#ed3-lift)">
    <rect x="490" y="398" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="490" y="398" width="9" height="90" fill="#059669" clip-path="url(#ed3-k6)"/>
  </g>
  <circle cx="528" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="554" y="450" font-size="18.5" font-weight="600" fill="#111827">Publish Event</text>
  <text x="620" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">5 ms</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">reply sent at 45 ms</text>

  <g filter="url(#ed3-soft)">
    <rect x="908" y="398" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="908" y="398" width="6" height="90" fill="#64748B" clip-path="url(#ed3-k7)"/>
  </g>
  <circle cx="946" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(935.56,432.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="972" y="450" font-size="18.5" font-weight="600" fill="#111827">Three Consumers</text>
  <text x="1038" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">email, analytics, stock</text>
  <text x="1038" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">nobody is waiting on them</text>

  
  <rect x="40" y="612" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">On the request path</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">every millisecond here is time the user spends looking at a spinner</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">After the reply</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">the same work still runs, but each failure now needs its own retry and its own alert</text>

  <rect x="64" y="724" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="746" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">What it costs</text>
  <text x="288" y="746" font-size="15.5" fill="#475569">the user is told the order succeeded before the stock has actually been reserved</text>
</svg>