<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="666" viewBox="0 0 1240 666" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="recover-title recover-desc">
<title id="recover-title">Recovering from a wrong turn</title>
<desc id="recover-desc">Name the mistake plainly, say specifically what it breaks, say what you are changing and whether the fix is local or structural, then continue at the same pace. The error is recoverable, and defending it after noticing is not.</desc>
<defs>
<marker id="recover-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="recover-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="recover-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="recover-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="666" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Recovering from a wrong turn</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The form is short, and the order matters.</text>
<rect x="40" y="588" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="588" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="150" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name it plainly</text>
<path d="M566 150H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 150H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#recover-marker-slate)"/>
<rect x="610" y="118" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="156" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"I need to revise something I said earlier."</text>
<circle cx="60" cy="226" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="194" width="470" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say what it breaks</text>
<path d="M566 226H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 226H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#recover-marker-slate)"/>
<rect x="610" y="194" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"That approach does not survive a user</text><text x="630" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with ten thousand followers."</text>
<circle cx="60" cy="302" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="270" width="470" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say what you are changing, and how far</text>
<path d="M566 302H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 302H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#recover-marker-slate)"/>
<rect x="610" y="270" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"This is a local fix" or</text><text x="630" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"this needs a different design here."</text>
<circle cx="60" cy="378" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="385" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="346" width="470" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Move on at the same pace</text>
<path d="M566 378H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 378H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#recover-marker-slate)"/>
<rect x="610" y="346" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">No repeated apology.</text><text x="630" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">One sentence of acknowledgment is enough.</text>
<rect x="40" y="434" width="560" height="128" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="128" rx="2.5" fill="#39D5AA"/><text x="64" y="465" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Why this scores</text><text x="64" y="491" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Interviewers need evidence of how you behave when</text><text x="64" y="517" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">wrong, and rarely get it. Most candidates do not</text><text x="64" y="543" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">notice, or hope nobody else did.</text>
<rect x="640" y="434" width="560" height="128" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="434" width="5" height="128" rx="2.5" fill="#F28B9D"/><text x="664" y="465" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">What actually costs a candidate</text><text x="664" y="491" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Not the error.</text><text x="664" y="517" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Defending it after noticing,</text><text x="664" y="543" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which becomes evidence about feedback.</text>
<text x="66" y="622" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">If you are unsure an objection is right, say "let me check that", and then check it out loud.</text>
</svg>