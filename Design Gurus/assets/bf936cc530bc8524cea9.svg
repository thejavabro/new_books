<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1480" viewBox="0 0 1240 1480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Chat and presence architecture: a sender client holds a socket to stateful gateway node 7, which sends synchronously to Chat, the single writer that assigns sequence numbers and commits to the message store; Chat publishes the committed message to the conversation topic, Fan-out consumes it, looks up the connection registry to find which gateway holds each device, pushes to gateway node 12 which delivers to the recipient client, and notifies offline users; both gateways heartbeat into Presence, which writes keys with a TTL; gateway node 12 sends acks to Receipts.">
  <defs>
    <marker id="m07-l07-chat-architecture-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l07-chat-architecture-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l07-chat-architecture-vt" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m07-l07-chat-architecture-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1480" fill="#FFFFFF"/>

  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="60" y="140" width="300" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="210" y="202" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Sender client</text>
  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="880" y="140" width="300" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1030" y="202" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Recipient client</text>

  <rect x="40" y="290" width="1160" height="190" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="322" text-anchor="middle" font-size="20" font-weight="600" fill="#1E3A8A">Stateful edge: about 100 nodes hold 10 million connections</text>
  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="60" y="350" width="300" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="210" y="412" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway node 7</text>
  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="880" y="350" width="300" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="1030" y="412" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway node 12</text>

  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="60" y="530" width="320" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="220" y="575" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Chat service</text>
  <text x="220" y="607" text-anchor="middle" font-size="20" fill="#64748B">the single writer,</text>
  <text x="220" y="639" text-anchor="middle" font-size="20" fill="#64748B">it assigns the numbers</text>
  <g filter="url(#m07-l07-chat-architecture-soft)">
    <path d="M440,550 L440,650 A160,20 0 0 0 760,650 L760,550" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="600" cy="550" rx="160" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="600" y="607" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Conversation topic</text>
  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="830" y="530" width="350" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1005" y="591" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Presence service</text>
  <text x="1005" y="623" text-anchor="middle" font-size="20" fill="#64748B">derived, never authoritative</text>

  <g filter="url(#m07-l07-chat-architecture-soft)">
    <path d="M60,760 L60,860 A170,20 0 0 0 400,860 L400,760" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="230" cy="760" rx="170" ry="20" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="230" y="802" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Message store</text>
  <text x="230" y="832" text-anchor="middle" font-size="20" fill="#64748B">and inboxes</text>
  <g filter="url(#m07-l07-chat-architecture-soft)">
    <path d="M830,760 L830,860 A175,20 0 0 0 1180,860 L1180,760" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="1005" cy="760" rx="175" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1005" y="802" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Presence keys</text>
  <text x="1005" y="832" text-anchor="middle" font-size="20" fill="#64748B">with a TTL</text>

  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="440" y="940" width="320" height="140" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="600" y="1001" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fan-out service</text>
  <text x="600" y="1033" text-anchor="middle" font-size="20" fill="#64748B">no durable state</text>
  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="830" y="940" width="350" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1005" y="1001" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="1005" y="1033" text-anchor="middle" font-size="20" fill="#64748B">for offline devices</text>

  <g filter="url(#m07-l07-chat-architecture-soft)">
    <path d="M440,1160 L440,1260 A170,20 0 0 0 780,1260 L780,1160" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="610" cy="1160" rx="170" ry="20" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="610" y="1202" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Connection registry</text>
  <text x="610" y="1232" text-anchor="middle" font-size="20" fill="#64748B">which node holds you</text>
  <g filter="url(#m07-l07-chat-architecture-soft)">
    <rect x="830" y="1140" width="350" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1005" y="1201" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Receipts service</text>
  <text x="1005" y="1233" text-anchor="middle" font-size="20" fill="#64748B">a lower priority stream</text>

  <g fill="none" stroke-width="2.5">
    <path d="M210,250 L210,342" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l07-chat-architecture-bl)"/>
    <path d="M210,460 L210,522" stroke="#3B82F6" marker-end="url(#m07-l07-chat-architecture-bl)"/>
    <path d="M380,600 L432,600" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-chat-architecture-ab)"/>
    <path d="M200,670 L200,732" stroke="#7C3AED" stroke-width="2" marker-end="url(#m07-l07-chat-architecture-vt)"/>
    <path d="M600,672 L600,932" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-chat-architecture-ab)"/>
    <path d="M600,1080 L600,1132" stroke="#7C3AED" marker-end="url(#m07-l07-chat-architecture-vt)"/>
    <path d="M440,1000 L410,1000 L410,490 L1030,490 L1030,468" stroke="#3B82F6" marker-end="url(#m07-l07-chat-architecture-bl)"/>
    <path d="M1030,350 L1030,258" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l07-chat-architecture-bl)"/>
    <path d="M360,400 C560,400 700,480 822,555" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-chat-architecture-ab)"/>
    <path d="M1150,460 L1150,522" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-chat-architecture-ab)"/>
    <path d="M1005,670 L1005,732" stroke="#7C3AED" stroke-width="2" marker-end="url(#m07-l07-chat-architecture-vt)"/>
    <path d="M760,1010 L822,1010" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-chat-architecture-ab)"/>
    <path d="M1180,400 L1215,400 L1215,1210 L1190,1210" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-chat-architecture-ab)"/>
  </g>

  <text x="230" y="500" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">send (sync)</text>
  <text x="720" y="512" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push to the right node</text>
  <text x="220" y="712" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">commit</text>
  <text x="590" y="1112" text-anchor="end" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">registry lookup</text>
  <text x="600" y="440" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">heartbeat every 30 seconds</text>
  <text x="791" y="1112" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">recipient offline</text>
  <text x="1205" y="700" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">acks</text>

  <line x1="60" y1="1360" x2="96" y2="1360" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1367" font-size="20" fill="#475569">The live path: the send, and the push back out</text>
  <line x1="60" y1="1400" x2="96" y2="1400" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1407" font-size="20" fill="#475569">Async: events, heartbeats, acks, alerts</text>
  <line x1="60" y1="1440" x2="96" y2="1440" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="1447" font-size="20" fill="#475569">Store access: the commit, and the registry lookup</text>
</svg>