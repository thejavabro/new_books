<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="912" viewBox="0 0 1240 912" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two request sequences compared. With 301 Moved Permanently, the first visit reaches the redirect service and is counted, but repeat visits are answered by the browser cache and go straight to the destination, so they are not counted. With 302 Found, every visit passes through the redirect service before reaching the destination, so every visit is counted at the cost of one request per visit.">
  <defs>
    <marker id="yl07redirec-sm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="yl07redirec-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="yl07redirec-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="yl07redirec-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl07redirec-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl07redirec-k1"><rect x="88" y="202" width="225" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k2"><rect x="381" y="202" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k3"><rect x="694" y="202" width="195" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k4"><rect x="957" y="202" width="195" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k5"><rect x="88" y="352" width="225" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k6"><rect x="694" y="352" width="195" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k7"><rect x="957" y="352" width="195" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k8"><rect x="88" y="600" width="225" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k9"><rect x="381" y="600" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k10"><rect x="694" y="600" width="195" height="90" rx="12"/></clipPath>
    <clipPath id="yl07redirec-k11"><rect x="957" y="600" width="195" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="912" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">How redirect caching affects analytics</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">cached redirect versus no-store redirect</text>

  
  <rect x="40" y="126" width="1160" height="370" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#B45309">301, cached by the browser</text>
  <text x="64" y="178" font-size="15.5" fill="#6B7280">The browser kept the redirect, so those visits never reach you.</text>

  
  <g fill="none" stroke-width="2">
    <path d="M313,247 H381" stroke="#64748B" marker-end="url(#yl07redirec-sm)"/>
    <path d="M626,247 H694" stroke="#64748B" marker-end="url(#yl07redirec-sm)"/>
    <path d="M889,247 H957" stroke="#059669" marker-end="url(#yl07redirec-em)"/>
    <path d="M313,397 H694" stroke="#DB2777" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#yl07redirec-pm)"/>
    <path d="M889,397 H957" stroke="#DB2777" marker-end="url(#yl07redirec-pm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="503" y="388" fill="#BE185D">no server call</text>
  </g>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="88" y="202" width="225" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="88" y="202" width="6" height="90" fill="#64748B" clip-path="url(#yl07redirec-k1)"/>
  </g>
  <circle cx="126" cy="247" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,236.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="152" y="254" font-size="18.5" font-weight="600" fill="#111827">Visit 1</text>
  <text x="200" y="317" font-size="15.5" text-anchor="middle" fill="#6B7280">the first visit reaches the service</text>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="381" y="202" width="245" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="381" y="202" width="6" height="90" fill="#D97706" clip-path="url(#yl07redirec-k2)"/>
  </g>
  <circle cx="419" cy="247" r="18" fill="#FFFFFF"/>
  <g transform="translate(408.56,236.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="445" y="254" font-size="18.5" font-weight="600" fill="#111827">Redirect service</text>
  <text x="503" y="317" font-size="15.5" text-anchor="middle" fill="#6B7280">answers with 301 and the destination</text>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="694" y="202" width="195" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="694" y="202" width="6" height="90" fill="#64748B" clip-path="url(#yl07redirec-k3)"/>
  </g>
  <circle cx="732" cy="247" r="18" fill="#FFFFFF"/>
  <g transform="translate(721.56,236.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="758" y="254" font-size="18.5" font-weight="600" fill="#111827">Destination</text>
  <text x="791" y="317" font-size="15.5" text-anchor="middle" fill="#6B7280">the target page loads</text>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="957" y="202" width="195" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="957" y="202" width="6" height="90" fill="#059669" clip-path="url(#yl07redirec-k4)"/>
  </g>
  <circle cx="995" cy="247" r="18" fill="#FFFFFF"/>
  <g transform="translate(984.56,236.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="1021" y="254" font-size="18.5" font-weight="600" fill="#111827">Counted</text>
  <text x="1054" y="317" font-size="15.5" text-anchor="middle" fill="#6B7280">counted in your statistics</text>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="88" y="352" width="225" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="88" y="352" width="6" height="90" fill="#64748B" clip-path="url(#yl07redirec-k5)"/>
  </g>
  <circle cx="126" cy="397" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,386.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="152" y="404" font-size="18.5" font-weight="600" fill="#111827">Visits 2 and 3</text>
  <text x="200" y="467" font-size="15.5" text-anchor="middle" fill="#6B7280">the browser already has the redirect</text>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="694" y="352" width="195" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="694" y="352" width="6" height="90" fill="#64748B" clip-path="url(#yl07redirec-k6)"/>
  </g>
  <circle cx="732" cy="397" r="18" fill="#FFFFFF"/>
  <g transform="translate(721.56,386.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="758" y="404" font-size="18.5" font-weight="600" fill="#111827">Destination</text>
  <text x="791" y="467" font-size="15.5" text-anchor="middle" fill="#6B7280">reached straight from the cache</text>

  
  <g filter="url(#yl07redirec-lift)">
    <rect x="957" y="352" width="195" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="957" y="352" width="9" height="90" fill="#DB2777" clip-path="url(#yl07redirec-k7)"/>
  </g>
  <circle cx="995" cy="397" r="18" fill="#FFFFFF"/>
  <g transform="translate(984.56,386.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="1021" y="404" font-size="18.5" font-weight="600" fill="#111827">Not counted</text>
  <text x="1054" y="467" font-size="15.5" text-anchor="middle" fill="#6B7280">your statistics never see it</text>

  
  <rect x="40" y="524" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="554" font-size="16.5" font-weight="600" fill="#047857">302 with Cache-Control: no-store</text>
  <text x="64" y="576" font-size="15.5" fill="#6B7280">No-store prevents redirect reuse. Each request reaches the service.</text>

  
  <g fill="none" stroke-width="2">
    <path d="M313,645 H381" stroke="#64748B" marker-end="url(#yl07redirec-sm)"/>
    <path d="M626,645 H694" stroke="#64748B" marker-end="url(#yl07redirec-sm)"/>
    <path d="M889,645 H957" stroke="#059669" stroke-width="2.5" marker-end="url(#yl07redirec-em)"/>
  </g>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="88" y="600" width="225" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="88" y="600" width="6" height="90" fill="#64748B" clip-path="url(#yl07redirec-k8)"/>
  </g>
  <circle cx="126" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,634.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="152" y="652" font-size="18.5" font-weight="600" fill="#111827">Every visit</text>
  <text x="200" y="715" font-size="15.5" text-anchor="middle" fill="#6B7280">first, second, and every later one</text>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="381" y="600" width="245" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="381" y="600" width="6" height="90" fill="#D97706" clip-path="url(#yl07redirec-k9)"/>
  </g>
  <circle cx="419" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(408.56,634.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="445" y="652" font-size="18.5" font-weight="600" fill="#111827">Redirect service</text>
  <text x="503" y="715" font-size="15.5" text-anchor="middle" fill="#6B7280">returns 302 and no-store</text>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="694" y="600" width="195" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="694" y="600" width="6" height="90" fill="#64748B" clip-path="url(#yl07redirec-k10)"/>
  </g>
  <circle cx="732" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(721.56,634.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="758" y="652" font-size="18.5" font-weight="600" fill="#111827">Destination</text>
  <text x="791" y="715" font-size="15.5" text-anchor="middle" fill="#6B7280">the target page loads</text>

  
  <g filter="url(#yl07redirec-soft)">
    <rect x="957" y="600" width="195" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="957" y="600" width="6" height="90" fill="#059669" clip-path="url(#yl07redirec-k11)"/>
  </g>
  <circle cx="995" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(984.56,634.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="1021" y="652" font-size="18.5" font-weight="600" fill="#111827">Counted</text>
  <text x="1054" y="715" font-size="15.5" text-anchor="middle" fill="#6B7280">available for counting</text>

  
  <rect x="40" y="772" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="814" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">Use no-store when repeat requests must reach the service.</text>
  <text x="620" y="846" text-anchor="middle" font-size="16" fill="#475569">A cached redirect bypasses server-side request counting.</text>
</svg>