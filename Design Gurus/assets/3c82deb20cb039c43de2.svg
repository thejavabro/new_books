<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="606" viewBox="0 0 1240 606" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ryw-title ryw-desc">
<title id="ryw-title">Four ways to hide replica lag</title>
<desc id="ryw-desc">A user who writes and immediately reads can be served stale data by an asynchronous replica. The fixes run from routing that session to the primary briefly, through carrying the write position in the session, to letting the client render its own write.</desc>
<defs>
<marker id="ryw-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ryw-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ryw-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ryw-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="606" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four ways to hide replica lag</text>
<text x="40" y="86" font-size="21" fill="#4A5568">There are four ways to handle it, in order of how much machinery they need.</text>
<rect x="40" y="528" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="528" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#F28B9D"/><text x="64" y="151" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The user writes to the primary, then reads from a replica 2s behind</text><text x="64" y="177" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">Their own comment is missing. Nothing is lost; it has not arrived.</text>
<rect x="40" y="222" width="272" height="280" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 222H46A6 6 0 0 0 40 228V496A6 6 0 0 0 46 502H54Z" fill="#39D5AA"/>
<circle cx="176" cy="260" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="176" y="268" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="176" y="310" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Sticky primary</text>
<text x="176" y="342" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">send this session to</text><text x="176" y="367" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the primary for a few</text><text x="176" y="392" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">seconds after a write</text>
<rect x="64" y="414" width="224" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="176" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Simplest</text>
<text x="176" y="484" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">slightly wasteful</text>
<rect x="336" y="222" width="272" height="280" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M350 222H342A6 6 0 0 0 336 228V496A6 6 0 0 0 342 502H350Z" fill="#5EC9EC"/>
<circle cx="472" cy="260" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="472" y="268" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="472" y="310" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Session token</text>
<text x="472" y="342" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">record the write</text><text x="472" y="367" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">position, read only from</text><text x="472" y="392" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a replica past it</text>
<rect x="360" y="414" width="224" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="472" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Most precise</text>
<text x="472" y="484" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">more parts to operate</text>
<rect x="632" y="222" width="272" height="280" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M646 222H638A6 6 0 0 0 632 228V496A6 6 0 0 0 638 502H646Z" fill="#AC8BE8"/>
<circle cx="768" cy="260" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="768" y="268" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="768" y="310" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Causal database</text>
<text x="768" y="342" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the system tracks</text><text x="768" y="367" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">ordering per session</text><text x="768" y="392" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">for you</text>
<rect x="656" y="414" width="224" height="44" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="768" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Built in</text>
<text x="768" y="484" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a database choice</text>
<rect x="928" y="222" width="272" height="280" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M942 222H934A6 6 0 0 0 928 228V496A6 6 0 0 0 934 502H942Z" fill="#F3CF6A"/>
<circle cx="1064" cy="260" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1064" y="268" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1064" y="310" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Render on client</text>
<text x="1064" y="342" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the write is already</text><text x="1064" y="367" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">in the browser;</text><text x="1064" y="392" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">show it from there</text>
<rect x="952" y="414" width="224" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cheapest</text>
<text x="1064" y="484" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">not a database fix</text>
<text x="66" y="562" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Most systems stop at the first option, and most systems are right to.</text>
</svg>