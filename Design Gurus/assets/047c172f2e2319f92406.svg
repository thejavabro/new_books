<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="528" viewBox="0 0 1240 528" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before any comparison">
<defs>
<filter id="cd-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="528" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Does [3, 2, 6, -1, 2, 1] contain a duplicate?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The brute force answer: compare every value with every value that comes after it</text>
<rect x="40" y="106" width="1160" height="268" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Nothing compared yet</text>
<rect x="338" y="190" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="380" y="230.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<text x="380" y="278" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="434" y="190" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="476" y="230.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="476" y="278" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="530" y="190" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="572" y="230.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">6</text>
<text x="572" y="278" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="626" y="190" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="668" y="230.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-1</text>
<text x="668" y="278" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="722" y="190" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="764" y="230.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="764" y="278" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="818" y="190" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="860" y="230.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="860" y="278" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<rect x="40" y="398" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="438" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">For each position i, look at every position j to its right</text>
<text x="620" y="470" text-anchor="middle" font-size="18.5" fill="#475569">The first equal pair found answers the question, so the scan can stop there</text>
</svg>