<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Root servers point to TLD servers for .com, .org, and .uk. The .com TLD servers point to the authoritative servers for example.com, which hold its records.">
  <defs>
    <filter id="ds3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ds3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ds3-k1"><rect x="470" y="130" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ds3-k2"><rect x="90" y="320" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ds3-k3"><rect x="470" y="320" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ds3-k4"><rect x="850" y="320" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ds3-k5"><rect x="70" y="510" width="340" height="90" rx="12"/></clipPath>
    <marker id="ds3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="ds3-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="910" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The DNS hierarchy</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">No server knows every name. Each level points to the next one down.</text>



  <g fill="none" stroke-width="2">
    <path d="M620,220 V255 Q620,270 605,270 H255 Q240,270 240,285 V320" stroke="#64748B" marker-end="url(#ds3-m-slate)"/>
    <path d="M620,220 V320" stroke="#64748B" marker-end="url(#ds3-m-slate)"/>
    <path d="M620,220 V255 Q620,270 635,270 H985 Q1000,270 1000,285 V320" stroke="#64748B" marker-end="url(#ds3-m-slate)"/>
    <path d="M240,410 V510" stroke="#7C3AED" marker-end="url(#ds3-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ds3-soft)">
    <rect x="470" y="130" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="470" y="130" width="6" height="90" fill="#64748B" clip-path="url(#ds3-k1)"/>
  </g>
  <circle cx="508" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="534" y="182" font-size="21.5" font-weight="600" fill="#111827">Root servers</text>
  <g filter="url(#ds3-soft)">
    <rect x="90" y="320" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="90" y="320" width="6" height="90" fill="#7C3AED" clip-path="url(#ds3-k2)"/>
  </g>
  <circle cx="128" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,354.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="154" y="372" font-size="21.5" font-weight="600" fill="#111827">.com TLD servers</text>
  <g filter="url(#ds3-soft)">
    <rect x="470" y="320" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="320" width="6" height="90" fill="#7C3AED" clip-path="url(#ds3-k3)"/>
  </g>
  <circle cx="508" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,354.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="534" y="372" font-size="21.5" font-weight="600" fill="#111827">.org TLD servers</text>
  <g filter="url(#ds3-soft)">
    <rect x="850" y="320" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="850" y="320" width="6" height="90" fill="#7C3AED" clip-path="url(#ds3-k4)"/>
  </g>
  <circle cx="888" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,354.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="914" y="372" font-size="21.5" font-weight="600" fill="#111827">.uk TLD servers</text>
  <g filter="url(#ds3-lift)">
    <rect x="70" y="510" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="70" y="510" width="9" height="90" fill="#059669" clip-path="url(#ds3-k5)"/>
  </g>
  <circle cx="108" cy="555" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,544.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="134" y="562" font-size="21.5" font-weight="600" fill="#111827">Authoritative servers</text>
  <text x="240" y="629" font-size="18.5" text-anchor="middle" fill="#6B7280">hold the records for example.com</text>

  <rect x="40" y="680" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Root</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">13 named root server clusters, each made of many servers</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">TLD</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">knows which name servers are authoritative for each domain</text>
  <rect x="64" y="805" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="830" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Authoritative</text>
  <text x="323" y="830" font-size="18.5" fill="#475569">holds the real records and gives the final answer</text>
</svg>