<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three pillars of a DFS: replication, scalability, and consistency, each with what it gives, how it is done, and what it costs">
  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>
  <defs>
    <filter id="df5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="35" y="60" width="373" height="548" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="433" y="60" width="373" height="548" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="831" y="60" width="373" height="548" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <g filter="url(#df5-soft)">
    <rect x="45" y="80" width="353" height="50" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="443" y="80" width="353" height="50" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="841" y="80" width="353" height="50" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="222" y="112" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replication</text>
  <text x="620" y="112" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Scalability</text>
  <text x="1018" y="112" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consistency</text>

  
  <g filter="url(#df5-soft)">
    <rect x="45" y="150" width="353" height="130" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="45" y="304" width="353" height="130" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="45" y="458" width="353" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="61" y="174" font-size="20" font-weight="600" fill="#334155">What it gives</text>
  <text x="61" y="204" font-size="20" fill="#64748B">No data loss when a node</text>
  <text x="61" y="231" font-size="20" fill="#64748B">fails. Data stays available</text>
  <text x="61" y="258" font-size="20" fill="#64748B">during outages.</text>
  <text x="61" y="328" font-size="20" font-weight="600" fill="#334155">How it is done</text>
  <text x="61" y="358" font-size="20" fill="#64748B">Each block copied to several</text>
  <text x="61" y="385" font-size="20" fill="#64748B">nodes (replication factor),</text>
  <text x="61" y="412" font-size="20" fill="#64748B">spread across racks.</text>
  <text x="61" y="482" font-size="20" font-weight="600" fill="#B91C1C">What it costs</text>
  <text x="61" y="512" font-size="20" fill="#64748B">Extra storage for every copy,</text>
  <text x="61" y="539" font-size="20" fill="#64748B">plus network bandwidth to</text>
  <text x="61" y="566" font-size="20" fill="#64748B">create copies.</text>

  
  <g filter="url(#df5-soft)">
    <rect x="443" y="150" width="353" height="130" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="443" y="304" width="353" height="130" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="443" y="458" width="353" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="459" y="174" font-size="20" font-weight="600" fill="#334155">What it gives</text>
  <text x="459" y="204" font-size="20" fill="#64748B">Capacity and speed grow with</text>
  <text x="459" y="231" font-size="20" fill="#64748B">demand, with no downtime while</text>
  <text x="459" y="258" font-size="20" fill="#64748B">growing.</text>
  <text x="459" y="328" font-size="20" font-weight="600" fill="#334155">How it is done</text>
  <text x="459" y="358" font-size="20" fill="#64748B">Add storage nodes (horizontal</text>
  <text x="459" y="385" font-size="20" fill="#64748B">scaling) and spread blocks</text>
  <text x="459" y="412" font-size="20" fill="#64748B">evenly across them.</text>
  <text x="459" y="482" font-size="20" font-weight="600" fill="#B91C1C">What it costs</text>
  <text x="459" y="512" font-size="20" fill="#64748B">Metadata can become the</text>
  <text x="459" y="539" font-size="20" fill="#64748B">bottleneck, and new nodes need</text>
  <text x="459" y="566" font-size="20" fill="#64748B">rebalancing.</text>

  
  <g filter="url(#df5-soft)">
    <rect x="841" y="150" width="353" height="130" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="841" y="304" width="353" height="130" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="841" y="458" width="353" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="857" y="174" font-size="20" font-weight="600" fill="#334155">What it gives</text>
  <text x="857" y="204" font-size="20" fill="#64748B">All clients see the same</text>
  <text x="857" y="231" font-size="20" fill="#64748B">data, with no stale or</text>
  <text x="857" y="258" font-size="20" fill="#64748B">conflicting reads.</text>
  <text x="857" y="328" font-size="20" font-weight="600" fill="#334155">How it is done</text>
  <text x="857" y="358" font-size="20" fill="#64748B">Strong or eventual model,</text>
  <text x="857" y="385" font-size="20" fill="#64748B">versioning, and locks for</text>
  <text x="857" y="412" font-size="20" fill="#64748B">concurrent writes.</text>
  <text x="857" y="482" font-size="20" font-weight="600" fill="#B91C1C">What it costs</text>
  <text x="857" y="512" font-size="20" fill="#64748B">Stronger consistency means</text>
  <text x="857" y="539" font-size="20" fill="#64748B">slower writes and more</text>
  <text x="857" y="566" font-size="20" fill="#64748B">coordination.</text>

  
  <rect x="240" y="648" width="760" height="110" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="678" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Every DFS balances all three.</text>
  <text x="620" y="706" font-size="20" fill="#64748B" text-anchor="middle">Strengthening one usually costs another:</text>
  <text x="620" y="733" font-size="20" fill="#64748B" text-anchor="middle">more copies, more coordination, or slower writes.</text>
</svg>