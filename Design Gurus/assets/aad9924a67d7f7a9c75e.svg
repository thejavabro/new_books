<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="922" viewBox="0 0 1240 922" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A user writes to the primary and immediately reads from a lagging replica, seeing their old data; the fix routes reads back to the primary for a short window after that user writes">
  <rect x="0" y="0" width="1240" height="922" fill="#FFFFFF"/>
  <defs>
    <marker id="db6-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="db6-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="db6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="db6-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="db6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A user renames themselves, reloads, and sees the old name</text>

  
  <rect x="40" y="76" width="1160" height="364" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#B91C1C">The problem: the write goes to the primary, the next read goes to a replica</text>

  <path d="M270 220 H390 V155 H512" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#db6-blue)"/>
  <text x="380" y="186" font-size="20" fill="#1E40AF" text-anchor="end">1. write the new name</text>

  <path d="M270 250 H390 V335 H512" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#db6-red)"/>
  <text x="380" y="306" font-size="20" fill="#B91C1C" text-anchor="end">2. read it back</text>

  <line x1="640" y1="194" x2="640" y2="292" stroke="#D97706" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#db6-amber)"/>
  <text x="660" y="250" font-size="20" font-weight="600" fill="#92400E">replication lag 800 ms</text>

  <line x1="764" y1="155" x2="872" y2="155" stroke="#059669" stroke-width="2" marker-end="url(#db6-emerald)"/>
  <line x1="764" y1="335" x2="872" y2="335" stroke="#DC2626" stroke-width="2" marker-end="url(#db6-red)"/>

  <g filter="url(#db6-soft)">
    <rect x="70" y="200" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="520" y="120" width="240" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="520" y="300" width="240" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="880" y="120" width="290" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="300" width="290" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="170" y="242" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="640" y="162" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Primary</text>
  <text x="640" y="342" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica</text>
  <text x="1025" y="162" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">the primary has Sam</text>
  <text x="1025" y="342" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the replica still has Alex</text>

  <text x="620" y="412" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">The user saved their name and the very next page load shows the old one.</text>

  
  <rect x="40" y="460" width="1160" height="310" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="494" font-size="20" font-weight="600" fill="#065F46">The fix: send reads back to the primary for a short window after a write</text>

  <line x1="254" y1="615" x2="322" y2="615" stroke="#475569" stroke-width="2" marker-end="url(#db6-emerald)"/>

  <path d="M614 600 H680 V555 H752" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#db6-blue)"/>
  <text x="752" y="530" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="end">wrote recently</text>

  <path d="M614 630 H680 V675 H752" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#db6-emerald)"/>
  <text x="752" y="712" font-size="20" fill="#5B21B6" text-anchor="end">everything else</text>

  <g filter="url(#db6-soft)">
    <rect x="70" y="580" width="180" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="330" y="580" width="280" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="760" y="520" width="240" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="760" y="640" width="240" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="160" y="622" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="470" y="612" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Router</text>
  <text x="470" y="638" font-size="20" fill="#065F46" text-anchor="middle">did this user just write?</text>
  <text x="880" y="562" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Primary</text>
  <text x="880" y="682" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica</text>

  <text x="620" y="748" font-size="20" fill="#334155" text-anchor="middle">The replica still serves every other read.</text>

  
  <rect x="40" y="800" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="836" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica lag is not a bug to fix. It is the price of asynchronous replication.</text>
  <text x="620" y="866" font-size="20" fill="#334155" text-anchor="middle">You route around it: only the reads that must see the write go to the primary.</text>
</svg>