<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1360" viewBox="0 0 1240 1360" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of a provider call: the Orchestrator writes an intent row with an idempotency key, charges 5000 minor units with that key, gets no response so the outcome is unknown, queries status by the same key, learns the charge succeeded, then posts the two entries for the top up to the Ledger, which commits.">
  <defs>
    <marker id="m07-l06-provider-call-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l06-provider-call-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l06-provider-call-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l06-provider-call-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l06-provider-call-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1360" fill="#FFFFFF"/>

  <rect x="40" y="250" width="1160" height="220" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="510" width="1160" height="180" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="730" width="1160" height="280" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="200" y1="195" x2="200" y2="1040"/>
    <line x1="620" y1="195" x2="620" y2="1040"/>
    <line x1="1050" y1="195" x2="1050" y2="1040"/>
  </g>

  <rect x="194" y="640" width="12" height="40" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <rect x="1044" y="925" width="12" height="60" rx="2" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>

  <g fill="none" stroke-width="2.5">
    <path d="M206,330 H272 Q284,330 284,344 V356 Q284,370 272,370 H208" stroke="#475569" stroke-width="2" marker-end="url(#m07-l06-provider-call-sl)"/>
    <path d="M206,430 L614,430" stroke="#3B82F6" marker-end="url(#m07-l06-provider-call-bl)"/>
    <path d="M614,620 L220,620" stroke="#DC2626" stroke-dasharray="6 5"/>
    <path d="M206,830 L614,830" stroke="#3B82F6" marker-end="url(#m07-l06-provider-call-bl)"/>
    <path d="M614,880 L206,880" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m07-l06-provider-call-em)"/>
    <path d="M206,930 L1040,930" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-provider-call-bl)"/>
    <path d="M1040,980 L206,980" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l06-provider-call-em)"/>
  </g>

  <circle cx="208" cy="620" r="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <g stroke="#DC2626" stroke-width="3" stroke-linecap="round">
    <line x1="199" y1="611" x2="217" y2="629"/>
    <line x1="217" y1="611" x2="199" y2="629"/>
  </g>

  <text x="60" y="292" font-size="20" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. Write the intent down first, so the key exists before money moves</text>
  <text x="60" y="552" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. The timeout: your request never came back</text>
  <text x="1180" y="552" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">never resend blind</text>
  <text x="60" y="772" font-size="20" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. Ask instead of resending: the key is the handle</text>
  <text x="1180" y="772" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a webhook is never the only path</text>

  <text x="300" y="356" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. write the intent row with the key</text>
  <text x="410" y="418" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. charge 5,000 minor units with that key</text>
  <text x="430" y="598" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. no response, the outcome is unknown</text>
  <text x="230" y="668" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the movement sits in unknown</text>
  <text x="410" y="818" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. query status by the same key</text>
  <text x="410" y="868" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. the charge succeeded</text>
  <text x="625" y="918" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. post the two entries</text>
  <text x="625" y="968" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">7. committed</text>
  <text x="1035" y="905" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one transaction</text>

  <g filter="url(#m07-l06-provider-call-soft)">
    <rect x="60" y="60" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orchestrator</text>
  <text x="200" y="148" text-anchor="middle" font-size="20" fill="#64748B">owns the flow and the key</text>
  <g filter="url(#m07-l06-provider-call-soft)">
    <rect x="480" y="60" width="280" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Provider</text>
  <text x="620" y="148" text-anchor="middle" font-size="20" fill="#64748B">real money, no rollback</text>
  <g filter="url(#m07-l06-provider-call-soft)">
    <rect x="910" y="60" width="280" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="1050" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Ledger</text>
  <text x="1050" y="148" text-anchor="middle" font-size="20" fill="#64748B">the only writer</text>

  <rect x="40" y="1070" width="1160" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="1118" text-anchor="middle" font-size="20" fill="#065F46">Write the intent, call with the key, and when no answer comes, ask by that key.</text>
  <text x="620" y="1156" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The key is both the safety on the retry and the handle for the question.</text>

  <line x1="60" y1="1240" x2="96" y2="1240" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1247" font-size="20" fill="#475569">A request out: the caller is waiting</text>
  <line x1="60" y1="1280" x2="96" y2="1280" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1287" font-size="20" fill="#475569">No response, marked with a cross: the outcome is unknown</text>
  <line x1="60" y1="1320" x2="96" y2="1320" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1327" font-size="20" fill="#475569">A reply: the status answer, then the commit</text>
</svg>