<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1070" viewBox="0 0 1240 1070" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two callers read the same order and both hold ETag r7. Caller A writes with If-Match r7 and the resource advances to r8. Caller B then writes with the same stale r7, so the server applies nothing and returns 412 precondition failed.">
  <defs>
    <marker id="p1i-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p1i-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p1i-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="p1i-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p1i-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p1i-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1i-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1i-k1"><rect x="460" y="100" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p1i-k2"><rect x="70" y="280" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1i-k3"><rect x="810" y="280" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1i-k4"><rect x="70" y="455" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1i-k5"><rect x="810" y="455" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1i-k6"><rect x="70" y="630" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1i-k7"><rect x="810" y="630" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1i-k8"><rect x="460" y="800" width="320" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1070" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="900" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Preventing a lost update</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">two callers, one order</text>

  
  <g fill="none" stroke-width="2">
    <path d="M460,145 H262 Q250,145 250,157 V280" stroke="#64748B" marker-end="url(#p1i-sl)"/>
    <path d="M780,145 H978 Q990,145 990,157 V280" stroke="#64748B" marker-end="url(#p1i-sl)"/>
    <path d="M250,412 V455" stroke="#2563EB" marker-end="url(#p1i-bl)"/>
    <path d="M990,412 V455" stroke="#7C3AED" marker-end="url(#p1i-vi)"/>
    <path d="M990,587 V630" stroke="#DB2777" marker-end="url(#p1i-pk)"/>
    <path d="M990,762 V833 Q990,845 978,845 H780" stroke="#DB2777" marker-end="url(#p1i-pk)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M250,587 V630" stroke="#059669" marker-end="url(#p1i-em)"/>
    <path d="M250,762 V833 Q250,845 262,845 H460" stroke="#059669" marker-end="url(#p1i-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="361" y="836" fill="#047857">advances to r8</text>
    <text x="879" y="836" fill="#BE185D">nothing applied</text>
  </g>

  
  <g filter="url(#p1i-soft)">
    <rect x="460" y="100" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="460" y="100" width="6" height="90" fill="#64748B" clip-path="url(#p1i-k1)"/>
  </g>
  <circle cx="498" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,134.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="524" y="152" font-size="18.5" font-weight="600" fill="#111827">Order</text>
  <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">ETag "ord-81M-r7"</text>

  
  <g filter="url(#p1i-soft)">
    <rect x="70" y="280" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="280" width="6" height="90" fill="#2563EB" clip-path="url(#p1i-k2)"/>
  </g>
  <circle cx="108" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,314.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="134" y="332" font-size="18.5" font-weight="600" fill="#111827">Caller A reads r7</text>
  <text x="250" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">holds ETag "ord-81M-r7"</text>

  
  <g filter="url(#p1i-soft)">
    <rect x="810" y="280" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="810" y="280" width="6" height="90" fill="#7C3AED" clip-path="url(#p1i-k3)"/>
  </g>
  <circle cx="848" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(837.56,314.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="874" y="332" font-size="18.5" font-weight="600" fill="#111827">Caller B reads r7</text>
  <text x="990" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">holds the same ETag "ord-81M-r7"</text>

  
  <g filter="url(#p1i-soft)">
    <rect x="70" y="455" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="455" width="6" height="90" fill="#2563EB" clip-path="url(#p1i-k4)"/>
  </g>
  <circle cx="108" cy="500" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,489.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="134" y="507" font-size="18.5" font-weight="600" fill="#111827">1. PATCH with its ETag</text>
  <text x="250" y="570" font-size="15.5" text-anchor="middle" fill="#6B7280">If-Match: "ord-81M-r7"</text>

  
  <g filter="url(#p1i-soft)">
    <rect x="810" y="455" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="810" y="455" width="6" height="90" fill="#7C3AED" clip-path="url(#p1i-k5)"/>
  </g>
  <circle cx="848" cy="500" r="18" fill="#FFFFFF"/>
  <g transform="translate(837.56,489.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="874" y="507" font-size="18.5" font-weight="600" fill="#111827">2. PATCH with the same ETag</text>
  <text x="990" y="570" font-size="15.5" text-anchor="middle" fill="#6B7280">If-Match: "ord-81M-r7"</text>

  
  <g filter="url(#p1i-lift)">
    <rect x="70" y="630" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="70" y="630" width="9" height="90" fill="#059669" clip-path="url(#p1i-k6)"/>
  </g>
  <circle cx="108" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,664.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="134" y="682" font-size="18.5" font-weight="600" fill="#111827">200 OK</text>
  <text x="250" y="745" font-size="15.5" text-anchor="middle" fill="#6B7280">new ETag "ord-81M-r8"</text>

  
  <g filter="url(#p1i-lift)">
    <rect x="810" y="630" width="360" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="810" y="630" width="9" height="90" fill="#DB2777" clip-path="url(#p1i-k7)"/>
  </g>
  <circle cx="848" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(837.56,664.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="874" y="682" font-size="18.5" font-weight="600" fill="#111827">412 Precondition Failed</text>
  <text x="990" y="745" font-size="15.5" text-anchor="middle" fill="#6B7280">no state changed</text>

  
  <g filter="url(#p1i-soft)">
    <rect x="460" y="800" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="460" y="800" width="6" height="90" fill="#64748B" clip-path="url(#p1i-k8)"/>
  </g>
  <circle cx="498" cy="845" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,834.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="524" y="852" font-size="18.5" font-weight="600" fill="#111827">Order is now r8</text>
  <text x="620" y="915" font-size="15.5" text-anchor="middle" fill="#6B7280">ETag "ord-81M-r8"</text>

  
  <rect x="40" y="970" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1015" text-anchor="middle" font-size="16" fill="#475569">B reads again, reapplies its intent, and resends. It does not retry the stale body.</text>
</svg>