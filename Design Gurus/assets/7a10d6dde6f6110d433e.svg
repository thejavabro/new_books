<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Step 1: a client sends a write request, for example place order, to a processing unit, whose application logic updates its in-memory data grid. Step 2: the unit puts a write event, for example the order data, on the data pump, a durable queue. Step 3: the unit sends a fast response to the client without waiting for the database. Step 4: the data writers consume the event from the data pump. Step 5: the data writers persist it to the database. The path from the data pump through the writers to the database is asynchronous persistence in the background">
  <defs>
    <filter id="m14f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m14f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m14f-k1"><rect x="40" y="215" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m14f-k2"><rect x="464" y="190" width="252" height="80" rx="12"/></clipPath>
    <clipPath id="m14f-k3"><rect x="464" y="310" width="252" height="80" rx="12"/></clipPath>
    <clipPath id="m14f-k4"><rect x="960" y="215" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="m14f-k5"><rect x="960" y="530" width="240" height="90" rx="12"/></clipPath>
    <marker id="m14f-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m14f-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="m14f-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="m14f-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How data pumps enable asynchronous persistence</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The processing unit answers from memory; the data pump and data writers update the database later.</text>

  <rect x="440" y="140" width="300" height="274" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="464" y="170" font-size="19.5" font-weight="600" fill="#1D4ED8">Processing unit</text>

  <g fill="none" stroke-width="2">
    <path d="M210,260 H440" stroke="#2563EB" marker-end="url(#m14f-m-blue)"/>
    <path d="M590,270 V310" stroke="#7C3AED" marker-end="url(#m14f-m-violet)"/>
    <path d="M740,260 H960" stroke="#D97706" marker-end="url(#m14f-m-amber)"/>
    <path d="M590,414 V458 Q590,470 578,470 H137 Q125,470 125,458 V305" stroke="#059669" marker-end="url(#m14f-m-emerald)"/>
    <path d="M1080,305 V530" stroke="#D97706" marker-end="url(#m14f-m-amber)"/>
    <path d="M960,575 H780" stroke="#D97706" marker-end="url(#m14f-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="325" y="224" fill="#1D4ED8">Write request</text>
    <text x="850" y="224" fill="#B45309">Write event</text>
    <text x="256" y="504" fill="#047857" text-anchor="start">Fast response</text>
    <text x="1094" y="446" fill="#B45309" text-anchor="start">Writer</text>
    <text x="1094" y="469" fill="#B45309" text-anchor="start">consumes</text>
    <text x="870" y="534" fill="#B45309">Persist to</text>
    <text x="870" y="557" fill="#B45309">database</text>
    <text x="1064" y="420" fill="#B45309" text-anchor="end">Asynchronous persistence</text>
  </g>

  <g filter="url(#m14f-soft)">
    <rect x="40" y="215" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="215" width="6" height="90" fill="#2563EB" clip-path="url(#m14f-k1)"/>
  </g>
  <circle cx="78" cy="260" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,249.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="267" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m14f-soft)">
    <rect x="464" y="190" width="252" height="80" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="464" y="190" width="6" height="80" fill="#7C3AED" clip-path="url(#m14f-k2)"/>
  </g>
  <circle cx="502" cy="230" r="18" fill="#FFFFFF"/>
  <g transform="translate(491.56,219.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="528" y="237" font-size="21.5" font-weight="600" fill="#111827">Application logic</text>
  <g filter="url(#m14f-soft)">
    <rect x="464" y="310" width="252" height="80" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="464" y="310" width="6" height="80" fill="#059669" clip-path="url(#m14f-k3)"/>
  </g>
  <circle cx="502" cy="350" r="18" fill="#FFFFFF"/>
  <g transform="translate(491.56,339.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="528" y="344.25" font-size="21.5" font-weight="600" fill="#111827">In-memory</text>
  <text x="528" y="369.75" font-size="21.5" font-weight="600" fill="#111827">data grid</text>
  <g filter="url(#m14f-soft)">
    <rect x="960" y="215" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="960" y="215" width="6" height="90" fill="#D97706" clip-path="url(#m14f-k4)"/>
  </g>
  <circle cx="998" cy="260" r="18" fill="#FFFFFF"/>
  <g transform="translate(987.56,249.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="1024" y="254.25" font-size="21.5" font-weight="600" fill="#111827">Data pump</text>
  <text x="1024" y="279.75" font-size="21.5" font-weight="600" fill="#111827">(durable queue)</text>
  <g filter="url(#m14f-soft)">
    <rect x="960" y="530" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="960" y="530" width="6" height="90" fill="#D97706" clip-path="url(#m14f-k5)"/>
  </g>
  <circle cx="998" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(987.56,564.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="1024" y="582" font-size="21.5" font-weight="600" fill="#111827">Data writers</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M600,505 L600,609 A90,16 0 0 0 780,609 L780,505" fill="#DBEAFE"/>
    <ellipse cx="690" cy="505" rx="90" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="690" y="572" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="690" y="659" font-size="18.5" text-anchor="middle" fill="#6B7280">(durable storage)</text>
  <text x="325" y="248" font-size="17" text-anchor="middle" fill="#475569">(for example, place order)</text>
  <text x="850" y="248" font-size="17" text-anchor="middle" fill="#475569">(for example, order data)</text>
  <text x="256" y="528" font-size="17" text-anchor="start" fill="#475569">(does not wait for database)</text>
  <text x="1064" y="443" font-size="17" text-anchor="end" fill="#475569">(in the background)</text>

  <circle cx="325" cy="186" r="16" fill="#2563EB"/>
  <text x="325" y="192.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="850" cy="186" r="16" fill="#D97706"/>
  <text x="850" y="192.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="230" cy="509" r="16" fill="#059669"/>
  <text x="230" y="515.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">3</text>
  <circle cx="1136" cy="405" r="16" fill="#D97706"/>
  <text x="1136" y="411.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">4</text>
  <circle cx="870" cy="498" r="16" fill="#D97706"/>
  <text x="870" y="504.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">5</text>


</svg>