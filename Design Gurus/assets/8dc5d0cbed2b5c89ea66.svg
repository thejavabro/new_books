<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A table of cluster sizes from three to seven. It shows the majority needed and how many machines can fail. Three and four machines both tolerate one failure, and five and six both tolerate two, so an even number never buys extra fault tolerance.">
  <rect x="0" y="0" width="1240" height="590" fill="#FFFFFF"/>
  <defs>
    <marker id="qm4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="qm4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="qm4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="qm4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="qm4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="qm4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="qm4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="qm4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="qm4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A majority quorum, and why an odd number of machines is normal</text>
  <text x="64" y="104" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">MACHINES (N)</text>
  <text x="354" y="104" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">MAJORITY NEEDED</text>
  <text x="644" y="104" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">FAILURES IT SURVIVES</text>
  <text x="884" y="104" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">WORTH IT ?</text>
  <path d="M24 116 H1216" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
  <g filter="url(#qm4-soft)"><rect x="24" y="128" width="1192" height="66" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="64" y="168" font-size="22" font-weight="700" fill="#065F46" text-anchor="start">3</text>
  <text x="354" y="168" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">2</text>
  <text x="644" y="168" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">1</text>
  <path d="M887,161 L894,169 L906,153" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="922" y="168" font-size="19" fill="#065F46" text-anchor="start">good value</text>
  <g filter="url(#qm4-soft)"><rect x="24" y="203" width="1192" height="66" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="64" y="243" font-size="22" font-weight="700" fill="#64748B" text-anchor="start">4</text>
  <text x="354" y="243" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">3</text>
  <text x="644" y="243" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">1</text>
  <path d="M888,228 L904,244 M904,228 L888,244" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="922" y="243" font-size="19" fill="#64748B" text-anchor="start">no safer than 3 machines</text>
  <g filter="url(#qm4-soft)"><rect x="24" y="278" width="1192" height="66" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="64" y="318" font-size="22" font-weight="700" fill="#065F46" text-anchor="start">5</text>
  <text x="354" y="318" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">3</text>
  <text x="644" y="318" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">2</text>
  <path d="M887,311 L894,319 L906,303" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="922" y="318" font-size="19" fill="#065F46" text-anchor="start">good value</text>
  <g filter="url(#qm4-soft)"><rect x="24" y="353" width="1192" height="66" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="64" y="393" font-size="22" font-weight="700" fill="#64748B" text-anchor="start">6</text>
  <text x="354" y="393" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">4</text>
  <text x="644" y="393" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">2</text>
  <path d="M888,378 L904,394 M904,378 L888,394" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="922" y="393" font-size="19" fill="#64748B" text-anchor="start">no safer than 5 machines</text>
  <g filter="url(#qm4-soft)"><rect x="24" y="428" width="1192" height="66" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="64" y="468" font-size="22" font-weight="700" fill="#065F46" text-anchor="start">7</text>
  <text x="354" y="468" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">4</text>
  <text x="644" y="468" font-size="21" font-weight="600" fill="#0F172A" text-anchor="start">3</text>
  <path d="M887,461 L894,469 L906,453" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="922" y="468" font-size="19" fill="#065F46" text-anchor="start">good value</text>
  <text x="620" y="537" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A majority is N divided by 2, rounded down, plus one. Two majorities of the same cluster always share a machine.</text>
  <text x="620" y="565" font-size="19" fill="#64748B" text-anchor="middle">That is why only one side of a network split can keep working, and the other side has to stop.</text>
</svg>