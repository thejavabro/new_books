<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="814" viewBox="0 0 1240 814" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="chunking-title chunking-desc">
<title id="chunking-title">Chunking that does not degrade</title>
<desc id="chunking-desc">A key-range cursor costs the same for every batch and cannot be moved by concurrent writes. OFFSET gets slower as it progresses and can skip or repeat rows under modification.</desc>
<defs>
<marker id="chunking-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="chunking-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="chunking-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="chunking-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="814" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Chunking that does not degrade</text>
<text x="40" y="86" font-size="21" fill="#4A5568">OFFSET is the common mistake and it fails in two ways.</text>
<rect x="40" y="736" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="736" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="196" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V308A6 6 0 0 0 46 314H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">OFFSET</text>
<rect x="110.0" y="254.0" width="52" height="14" rx="5" fill="#F25461"/>
<rect x="182.0" y="238.0" width="52" height="30" rx="5" fill="#F25461"/>
<rect x="254.0" y="222.0" width="52" height="46" rx="5" fill="#F25461"/>
<rect x="326.0" y="206.0" width="52" height="62" rx="5" fill="#F25461"/>
<rect x="398.0" y="190.0" width="52" height="78" rx="5" fill="#F25461"/>
<rect x="470.0" y="174.0" width="52" height="94" rx="5" fill="#F25461"/>
<path d="M70 268H570" stroke="#284E65" stroke-width="3" stroke-linecap="round"/>
<text x="320" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">cost grows with every batch</text>
<rect x="640" y="118" width="560" height="196" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V308A6 6 0 0 0 646 314H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Key range cursor</text>
<rect x="710.0" y="242.0" width="52" height="26" rx="5" fill="#06AC80"/>
<rect x="782.0" y="242.0" width="52" height="26" rx="5" fill="#06AC80"/>
<rect x="854.0" y="242.0" width="52" height="26" rx="5" fill="#06AC80"/>
<rect x="926.0" y="242.0" width="52" height="26" rx="5" fill="#06AC80"/>
<rect x="998.0" y="242.0" width="52" height="26" rx="5" fill="#06AC80"/>
<rect x="1070.0" y="242.0" width="52" height="26" rx="5" fill="#06AC80"/>
<path d="M670 268H1170" stroke="#284E65" stroke-width="3" stroke-linecap="round"/>
<text x="920" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">an index seek and a bounded scan</text>
<rect x="40" y="328" width="1160" height="56" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="328" width="5" height="56" rx="2.5" fill="#F3CF6A"/><text x="64" y="362" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">OFFSET also shifts under concurrent inserts and deletes, so rows can be processed twice or skipped</text>
<text x="40" y="418" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three more properties the job needs</text>
<rect x="40" y="436" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="470" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A durable cursor</text>
<path d="M526 464H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 464H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chunking-marker-slate)"/>
<rect x="570" y="436" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="457.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">written after each batch, so a restart</text><text x="590" y="482.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">resumes rather than starting over</text>
<rect x="40" y="504" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="538" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A derived transformation</text>
<path d="M526 532H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 532H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chunking-marker-slate)"/>
<rect x="570" y="504" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="538" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">computed from the source, so applying it twice is safe</text>
<rect x="40" y="572" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="606" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A throttle on a signal</text>
<path d="M526 600H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 600H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chunking-marker-slate)"/>
<rect x="570" y="572" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="593.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">replication lag or primary load, so it</text><text x="590" y="618.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">yields at peak and works overnight</text>
<rect x="40" y="648" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="648" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="685" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A backfill that cannot be re-run is a backfill you cannot restart.</text>
<text x="66" y="770" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The job runs over a table that is also serving traffic, which makes how you walk it a real decision.</text>
</svg>