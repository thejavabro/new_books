<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The origin is one central source of truth, while edge servers are many cached copies positioned near the users">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <filter id="cd4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="330" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="78" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Origin server: one source</text>

  <rect x="640" y="40" width="580" height="330" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="78" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Edge servers: many copies</text>

  <g filter="url(#cd4-soft)">
    <rect x="180" y="110" width="260" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

    <rect x="672" y="110" width="160" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="850" y="110" width="160" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="1028" y="110" width="160" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="310" y="152" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Original content</text>
  <text x="310" y="184" font-size="20" fill="#2563EB" text-anchor="middle">managed here</text>

  <text x="752" y="152" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Copy</text>
  <text x="752" y="184" font-size="20" fill="#059669" text-anchor="middle">near users</text>
  <text x="930" y="152" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Copy</text>
  <text x="930" y="184" font-size="20" fill="#059669" text-anchor="middle">near users</text>
  <text x="1108" y="152" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Copy</text>
  <text x="1108" y="184" font-size="20" fill="#059669" text-anchor="middle">near users</text>

  <text x="60" y="270" font-size="20" fill="#334155">Source of truth for every asset</text>
  <text x="60" y="304" font-size="20" fill="#334155">Reached on a miss, or with no CDN</text>
  <text x="60" y="338" font-size="20" fill="#334155">Slows down when it answers everyone</text>

  <text x="680" y="270" font-size="20" fill="#334155">Cached copies, not the source</text>
  <text x="680" y="304" font-size="20" fill="#334155">Reached on a hit, which is most requests</text>
  <text x="680" y="338" font-size="20" fill="#334155">Spread the load and shorten the distance</text>

  <text x="620" y="428" font-size="20" fill="#475569" text-anchor="middle">The origin is where content lives, and the edge is where users meet it</text>
</svg>