<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="738" viewBox="0 0 1240 738" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On one HTTP 1.1 connection responses must come back in order, so a slow response holds up the ones behind it, and the browser works around this by opening six connections">
  <rect x="0" y="0" width="1240" height="738" fill="#FFFFFF"/>
  <defs>
    <marker id="nw5-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One connection, one queue, and everything waits its turn</text>

  
  <rect x="40" y="76" width="1160" height="244" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#B91C1C">One HTTP/1.1 connection: responses must come back in order</text>

  <rect x="250" y="160" width="120" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="310" y="196" font-size="20" fill="#1E40AF" text-anchor="middle">A</text>
  <rect x="370" y="160" width="420" height="60" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="580" y="196" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">B is slow</text>
  <rect x="790" y="160" width="120" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="850" y="196" font-size="20" fill="#1E40AF" text-anchor="middle">C</text>
  <rect x="910" y="160" width="120" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="970" y="196" font-size="20" fill="#1E40AF" text-anchor="middle">D</text>

  <line x1="250" y1="248" x2="1150" y2="248" stroke="#475569" stroke-width="2" marker-end="url(#nw5-slate)"/>
  <text x="620" y="292" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">C and D were ready to send immediately. They waited for B to finish.</text>

  
  <rect x="40" y="340" width="1160" height="290" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="374" font-size="20" font-weight="600" fill="#92400E">The workaround: the browser opens six connections at once</text>
  <text x="64" y="510" font-size="20" font-weight="600" fill="#92400E">six</text>
  <text x="64" y="536" font-size="20" font-weight="600" fill="#92400E">at once</text>

  <rect x="300" y="400" width="220" height="24" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="300" y="430" width="440" height="24" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="300" y="460" width="180" height="24" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="300" y="490" width="260" height="24" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="300" y="520" width="150" height="24" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="300" y="550" width="210" height="24" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

  <text x="760" y="448" font-size="20" fill="#B91C1C">blocks only its own connection</text>
  <text x="620" y="606" font-size="20" fill="#334155" text-anchor="middle">Six is a hard limit per origin, and every one of them pays for its own handshake.</text>

  
  <rect x="40" y="666" width="1160" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="698" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">HTTP/1.1 has no way to interleave, so the only fix available was more connections.</text>
</svg>