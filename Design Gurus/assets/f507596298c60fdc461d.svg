<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="516" viewBox="0 0 1240 516" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One round of the drill: say it out loud, keep time, mark it, revisit the misses; missed questions only return to the start on a later day">
