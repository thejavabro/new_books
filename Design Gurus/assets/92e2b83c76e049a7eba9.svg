<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1440" viewBox="0 0 1240 1440" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven hard parts of the booking API, each with the decision it forces: several holds against one slot, expiry against a wrong id, confirmation that must never run twice, confirmation racing expiry, cacheable availability against uncacheable booking, cancellation policy, and released capacity after a failed payment.">
  <defs>
    <filter id="p2q-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2q-ks"><rect x="700" y="60" width="30" height="22" rx="6"/></clipPath>
    <clipPath id="p2q-k1"><rect x="76" y="174" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2q-k2"><rect x="76" y="318" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2q-k3"><rect x="76" y="524" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2q-k4"><rect x="76" y="668" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2q-k5"><rect x="76" y="874" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2q-k6"><rect x="76" y="1018" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p2q-k7"><rect x="76" y="1162" width="440" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1440" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Seven hard parts, seven decisions</text>
  <rect x="700" y="60" width="30" height="22" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <rect x="700" y="60" width="5" height="22" fill="#D97706" clip-path="url(#p2q-ks)"/>
  <text x="742" y="77" font-size="15.5" fill="#6B7280">the hard part</text>
  <g fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M900,66 L907.5,71.5 L900,77"/>
  </g>
  <text x="924" y="77" font-size="15.5" fill="#6B7280">the decision it forces</text>

  
  <rect x="40" y="126" width="1160" height="330" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">Holding a slot</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two hard parts</text>

  <g filter="url(#p2q-soft)">
    <rect x="76" y="174" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#D97706" clip-path="url(#p2q-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">Several holds against one slot</text>
  <g fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,279 L86.5,284.5 L79,290"/>
  </g>
  <text x="104" y="290" font-size="15.5" fill="#6B7280">A hold is a resource with quantity, owner, and expiry, not a flag on the slot</text>

  <g filter="url(#p2q-soft)">
    <rect x="76" y="318" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="318" width="6" height="90" fill="#D97706" clip-path="url(#p2q-k2)"/>
  </g>
  <circle cx="114" cy="363" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,352.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="370" font-size="18.5" font-weight="600" fill="#111827">Expiry against a wrong id</text>
  <g fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,423 L86.5,428.5 L79,434"/>
  </g>
  <text x="104" y="434" font-size="15.5" fill="#6B7280">An unknown hold is 404; every operation on an expired hold is 410</text>

  
  <rect x="40" y="476" width="1160" height="330" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="506" font-size="16.5" font-weight="600" fill="#475569">Confirming the booking</text>
  <text x="1176" y="506" text-anchor="end" font-size="15.5" fill="#6B7280">two hard parts</text>

  <g filter="url(#p2q-soft)">
    <rect x="76" y="524" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="524" width="6" height="90" fill="#D97706" clip-path="url(#p2q-k3)"/>
  </g>
  <circle cx="114" cy="569" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,558.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="576" font-size="18.5" font-weight="600" fill="#111827">Confirmation must never run twice</text>
  <g fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,629 L86.5,634.5 L79,640"/>
  </g>
  <text x="104" y="640" font-size="15.5" fill="#6B7280">Booking creation uses the 24-hour idempotency contract, because it charges money</text>

  <g filter="url(#p2q-soft)">
    <rect x="76" y="668" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="668" width="6" height="90" fill="#D97706" clip-path="url(#p2q-k4)"/>
  </g>
  <circle cx="114" cy="713" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,702.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="720" font-size="18.5" font-weight="600" fill="#111827">Confirmation racing expiry</text>
  <g fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,773 L86.5,778.5 L79,784"/>
  </g>
  <text x="104" y="784" font-size="15.5" fill="#6B7280">One atomic transition decides the winner; there is no both-true window</text>

  
  <rect x="40" y="826" width="1160" height="474" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="856" font-size="16.5" font-weight="600" fill="#475569">Caching, cancellation, and capacity</text>
  <text x="1176" y="856" text-anchor="end" font-size="15.5" fill="#6B7280">three hard parts</text>

  <g filter="url(#p2q-soft)">
    <rect x="76" y="874" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="874" width="6" height="90" fill="#D97706" clip-path="url(#p2q-k5)"/>
  </g>
  <circle cx="114" cy="919" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,908.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="926" font-size="18.5" font-weight="600" fill="#111827">Availability against booking</text>
  <g fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,979 L86.5,984.5 L79,990"/>
  </g>
  <text x="104" y="990" font-size="15.5" fill="#6B7280">Availability is publicly cacheable for five seconds; holds and bookings are no-store</text>

  <g filter="url(#p2q-soft)">
    <rect x="76" y="1018" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1018" width="6" height="90" fill="#D97706" clip-path="url(#p2q-k6)"/>
  </g>
  <circle cx="114" cy="1063" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1052.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="1070" font-size="18.5" font-weight="600" fill="#111827">Cancellation policy</text>
  <g fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,1123 L86.5,1128.5 L79,1134"/>
  </g>
  <text x="104" y="1134" font-size="15.5" fill="#6B7280">The rule captured on the booking at purchase time is the rule that applies</text>

  <g filter="url(#p2q-soft)">
    <rect x="76" y="1162" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1162" width="6" height="90" fill="#D97706" clip-path="url(#p2q-k7)"/>
  </g>
  <circle cx="114" cy="1207" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1196.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="1214" font-size="18.5" font-weight="600" fill="#111827">Released capacity, failed payment</text>
  <g fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,1267 L86.5,1272.5 L79,1278"/>
  </g>
  <text x="104" y="1278" font-size="15.5" fill="#6B7280">Capacity returns on a named terminal outcome, not on a guess</text>

  
  <rect x="40" y="1324" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1369" text-anchor="middle" font-size="16" fill="#475569">Each hard part forces one decision. Name the decision first, then the endpoint that carries it.</text>
</svg>