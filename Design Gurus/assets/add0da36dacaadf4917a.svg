<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1290" viewBox="0 0 1240 1290" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five live delivery triggers and the choice each one leads to: polling, SSE, WebSockets, a signed at least once webhook, and a durable read plus resync, with the sentence to say for each choice in the interview.">
  <defs>
    <filter id="p4d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p4d-k1"><rect x="76" y="202" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p4d-k2"><rect x="76" y="404" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p4d-k3"><rect x="76" y="606" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p4d-k4"><rect x="76" y="808" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p4d-k5"><rect x="76" y="1010" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1290" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="88" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="72" font-size="16.5" font-weight="600" fill="#475569">Live delivery: Polling, SSE, WebSockets, or webhooks</text>
  <text x="64" y="100" font-size="15.5" fill="#6B7280">the band is the trigger, the card is the choice, the gray line is the interview sentence</text>

  
  <rect x="40" y="152" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="182" font-size="16.5" font-weight="600" fill="#475569">Changes are infrequent or inbound connections are impossible</text>
  <g filter="url(#p4d-soft)">
    <rect x="76" y="202" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="202" width="6" height="90" fill="#059669" clip-path="url(#p4d-k1)"/>
  </g>
  <circle cx="114" cy="247" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,236.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="254" font-size="18.5" font-weight="600" fill="#111827">Polling</text>
  <text x="78" y="317" font-size="15.5" fill="#6B7280">"Choose polling; accept empty calls and detection delayed until a later successful poll."</text>

  
  <rect x="40" y="354" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="384" font-size="16.5" font-weight="600" fill="#475569">Browser or app only receives on the live connection</text>
  <g filter="url(#p4d-soft)">
    <rect x="76" y="404" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="404" width="6" height="90" fill="#059669" clip-path="url(#p4d-k2)"/>
  </g>
  <circle cx="114" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,438.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="456" font-size="18.5" font-weight="600" fill="#111827">SSE</text>
  <text x="78" y="519" font-size="15.5" fill="#6B7280">"Choose SSE; accept a separate HTTP path for client commands."</text>

  
  <rect x="40" y="556" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="586" font-size="16.5" font-weight="600" fill="#475569">The same live session must send and receive</text>
  <g filter="url(#p4d-soft)">
    <rect x="76" y="606" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="606" width="6" height="90" fill="#059669" clip-path="url(#p4d-k3)"/>
  </g>
  <circle cx="114" cy="651" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,640.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="658" font-size="18.5" font-weight="600" fill="#111827">WebSockets</text>
  <text x="78" y="721" font-size="15.5" fill="#6B7280">"Choose WebSockets; accept connection state, backpressure, heartbeat, and reconnect complexity."</text>

  
  <rect x="40" y="758" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="788" font-size="16.5" font-weight="600" fill="#475569">Another server needs event delivery</text>
  <g filter="url(#p4d-soft)">
    <rect x="76" y="808" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="808" width="6" height="90" fill="#059669" clip-path="url(#p4d-k4)"/>
  </g>
  <circle cx="114" cy="853" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,842.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="860" font-size="18.5" font-weight="600" fill="#111827">Signed webhook, at least once</text>
  <text x="78" y="923" font-size="15.5" fill="#6B7280">"Choose webhooks; accept duplicate delivery, retry schedules, signature rotation, and receiver availability."</text>

  
  <rect x="40" y="960" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="990" font-size="16.5" font-weight="600" fill="#475569">Live replay position is too old</text>
  <g filter="url(#p4d-soft)">
    <rect x="76" y="1010" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1010" width="6" height="90" fill="#059669" clip-path="url(#p4d-k5)"/>
  </g>
  <circle cx="114" cy="1055" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1044.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="1062" font-size="18.5" font-weight="600" fill="#111827">Durable read plus resync</text>
  <text x="78" y="1125" font-size="15.5" fill="#6B7280">"Choose resync; accept replacing local state rather than promising unbounded event retention."</text>

  
  <rect x="40" y="1174" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1219" text-anchor="middle" font-size="16" fill="#475569">Match the trigger first, name the choice, then say the sentence that accepts its cost.</text>
</svg>