<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shaping-title shaping-desc">
<title id="shaping-title">Shaping the keys to the patterns</title>
<desc id="shaping-desc">The partition key is the entry point and the sort key is the ordering, so a pattern with a known entry point becomes a single request. A pattern without one is telling you it belongs somewhere else.</desc>
<defs>
<marker id="shaping-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shaping-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shaping-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shaping-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="740" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Shaping the keys to the patterns</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The partition key is the entry point and the sort key is the ordering.</text>
<rect x="40" y="662" width="1160" height="52" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="662" width="5" height="52" rx="2.5" fill="#AC8BE8"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Each pattern becomes a key, or it does not fit</text>
<rect x="40" y="168" width="520" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="300" y="190.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"the twenty most recent orders for a</text><text x="300" y="217.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">customer"</text>
<path d="M566 198H600" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 198H600" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shaping-marker-green)"/>
<rect x="610" y="168" width="400" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="810" y="204" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">pk = customer id, sk = timestamp</text>
<rect x="1040" y="176" width="160" height="44" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1120" y="205" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">one request</text>
<rect x="40" y="238" width="520" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="300" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"everything about this one order"</text>
<path d="M566 268H600" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 268H600" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shaping-marker-green)"/>
<rect x="610" y="238" width="400" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="810" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">pk = order id, sk = entity prefix</text>
<rect x="1040" y="246" width="160" height="44" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1120" y="275" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">one request</text>
<rect x="40" y="308" width="520" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="300" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"all orders over a hundred dollars"</text>
<path d="M566 338H600" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 338H600" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shaping-marker-red)"/>
<rect x="610" y="308" width="400" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="810" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no entry point at all</text>
<rect x="1040" y="316" width="160" height="44" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1120" y="345" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">does not fit</text>
<rect x="40" y="390" width="1160" height="86" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="390" width="5" height="86" rx="2.5" fill="#F3CF6A"/><text x="64" y="426" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The pattern that does not fit is the most useful output of the exercise.</text><text x="64" y="452" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A secondary index, a separate table, or work for an analytical store.</text>
<rect x="40" y="498" width="1160" height="136" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 498H46A6 6 0 0 0 40 504V628A6 6 0 0 0 46 634H54Z" fill="#5EC9EC"/><text x="70" y="534" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Overloading: several entity types in one partition</text>
<rect x="104" y="556" width="240" height="56" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="224" y="591" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ORDER#1234</text><rect x="368" y="556" width="240" height="56" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="488" y="591" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ITEM#1</text><rect x="632" y="556" width="240" height="56" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="752" y="591" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ITEM#2</text><rect x="896" y="556" width="240" height="56" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1016" y="591" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ADDRESS#ship</text>
<text x="66" y="696" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Overloading returns a whole aggregate in one read, and it is harder to change later.</text>
</svg>