<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" style="background-color:#ffffff">
<defs>
<marker id="ua" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="ud" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="300" y="40" width="320" height="90" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="300" y="40" width="320" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="460" y="59" text-anchor="middle" font-weight="bold">&#171;interface&#187; FileSystemNode</text>
<text x="312" y="88">+ name() : String</text>
<text x="312" y="108">+ size() : int</text>
<text x="312" y="126">+ print(indent)</text>

<rect x="60" y="230" width="290" height="72" fill="#ffffff" stroke="#2f7a55"/>
<rect x="60" y="230" width="290" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="205" y="249" text-anchor="middle" font-weight="bold">FileNode  (leaf)</text>
<text x="72" y="278">- bytes : int</text>
<text x="72" y="296" font-size="11.5" fill="#2f7a55">answers size() directly</text>

<rect x="560" y="230" width="320" height="112" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="560" y="230" width="320" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="720" y="249" text-anchor="middle" font-weight="bold">FolderNode  (composite)</text>
<text x="572" y="278">- children : List&lt;FileSystemNode&gt;</text>
<text x="572" y="300">+ add(FileSystemNode)</text>
<text x="572" y="322" font-size="11.5" fill="#414d60">answers size() by asking its children</text>

<path d="M 205 230 L 205 180 L 460 180 L 460 130" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#ua)"/>
<path d="M 720 230 L 720 180 L 460 180" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<path d="M 800 226 L 800 84 L 625 84" stroke="#000000" fill="none" marker-start="url(#ud)"/>
<text x="812" y="150" font-size="11.5" fill="#414d60">holds many,</text>
<text x="812" y="166" font-size="11.5" fill="#414d60">of either kind</text>

<rect x="60" y="360" width="820" height="46" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="82" y="380" font-size="12.5" fill="#414d60">Note where add() lives: on FolderNode, not on the interface. A file has no children, so giving it an add() that throws would be worse</text>
<text x="82" y="398" font-size="12.5" fill="#414d60">than the type check the pattern removed. That choice has a name and a trade-off, covered below.</text>
</g>
</svg>