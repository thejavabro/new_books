<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="When a hot cache entry expires, without a lock every concurrent request rebuilds it and hammers the database, while with a lock only one request rebuilds and the rest wait or serve stale">
  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
  <defs>
    <marker id="ca7-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ca7-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ca7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="ca7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A popular cache entry expires while 30 requests are in flight</text>

  
  <rect x="40" y="72" width="1160" height="322" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#B91C1C">Without a lock: every request rebuilds</text>

  <g filter="url(#ca7-soft)">
    <rect x="86" y="150" width="230" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="86" y="220" width="230" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="86" y="290" width="230" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="201" y="186" font-size="20" fill="#334155" text-anchor="middle">request 1</text>
  <text x="201" y="256" font-size="20" fill="#334155" text-anchor="middle">request 2</text>
  <text x="201" y="326" font-size="20" fill="#334155" text-anchor="middle">requests 3 to 30</text>

  <line x1="320" y1="178" x2="856" y2="222" stroke="#DC2626" stroke-width="2" marker-end="url(#ca7-red)"/>
  <line x1="320" y1="248" x2="856" y2="244" stroke="#DC2626" stroke-width="2" marker-end="url(#ca7-red)"/>
  <line x1="320" y1="318" x2="856" y2="266" stroke="#DC2626" stroke-width="2" marker-end="url(#ca7-red)"/>
  <rect x="466" y="174" width="228" height="30" fill="#FFFFFF"/>
  <text x="580" y="196" font-size="20" fill="#B91C1C" text-anchor="middle">30 identical rebuilds</text>

  <g filter="url(#ca7-soft)">
    <path d="M860 206 a110 17 0 0 1 220 0 v56 a110 17 0 0 1 -220 0 z" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <ellipse cx="970" cy="206" rx="110" ry="17" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="970" y="242" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Database</text>
  <text x="970" y="268" font-size="20" fill="#B91C1C" text-anchor="middle">overwhelmed</text>

  <text x="620" y="374" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">One expiry becomes a traffic spike. This is the cache stampede.</text>

  
  <rect x="40" y="422" width="1160" height="322" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="456" font-size="20" font-weight="600" fill="#065F46">With a distributed lock: one rebuild</text>

  <g filter="url(#ca7-soft)">
    <rect x="86" y="500" width="230" height="56" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="86" y="570" width="230" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="86" y="640" width="230" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="201" y="536" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">request 1</text>
  <text x="201" y="606" font-size="20" fill="#334155" text-anchor="middle">request 2</text>
  <text x="201" y="676" font-size="20" fill="#334155" text-anchor="middle">requests 3 to 30</text>

  <line x1="320" y1="528" x2="424" y2="546" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca7-blue)"/>
  <line x1="320" y1="598" x2="424" y2="580" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ca7-slate)"/>
  <line x1="320" y1="668" x2="424" y2="600" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ca7-slate)"/>

  <g filter="url(#ca7-soft)">
    <rect x="428" y="524" width="260" height="96" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="558" y="556" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Lock on the key</text>
  <text x="558" y="584" font-size="20" fill="#92400E" text-anchor="middle">only one holder,</text>
  <text x="558" y="608" font-size="20" fill="#92400E" text-anchor="middle">the rest wait</text>

  <line x1="692" y1="572" x2="856" y2="572" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca7-blue)"/>
  <text x="774" y="548" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1 rebuild</text>

  <g filter="url(#ca7-soft)">
    <path d="M860 556 a110 17 0 0 1 220 0 v56 a110 17 0 0 1 -220 0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="970" cy="556" rx="110" ry="17" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="970" y="592" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Database</text>
  <text x="970" y="618" font-size="20" fill="#065F46" text-anchor="middle">one query</text>

  <text x="620" y="712" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The waiting requests read the fresh value as soon as the lock is released.</text>
</svg>