  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Clean Architecture: composition root and dependency injection</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The composition root creates every object and hands each one the dependencies it needs.</text>

