<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The OrderController inbound adapter in the Interface Adapters ring calls CreateOrderUseCase in the Use Cases ring, which calls the OrderRepository interface that the Use Cases ring owns, and the call reaches the PostgresOrderRepository outbound adapter in the Interface Adapters ring; the composition root in the Frameworks and Drivers ring creates PostgresOrderRepository, injects it into CreateOrderUseCase, injects the use case into OrderController, and passes the controller to create_flask_app">
