<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="failmodes-title failmodes-desc">
<title id="failmodes-title">Four ways narration goes wrong</title>
<desc id="failmodes-desc">Narrating the obvious, filling silence, naming considerations without resolving any, and explaining a topic rather than reasoning about a choice. The last one is the most common failure among well-prepared candidates.</desc>
<defs>
<marker id="failmodes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="failmodes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="failmodes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="failmodes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="736" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four ways narration goes wrong</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Narration done badly is worse than silence, in four recognizable ways.</text>
<rect x="40" y="658" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="658" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="150" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Narrating the obvious</text>
<path d="M566 150H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 150H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failmodes-marker-slate)"/>
<rect x="610" y="118" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">describing what a load balancer does suggests</text><text x="630" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you think it is the interesting part</text>
<circle cx="60" cy="226" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="194" width="470" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Filling silence</text>
<path d="M566 226H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 226H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failmodes-marker-slate)"/>
<rect x="610" y="194" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">thinking time is allowed, and quiet reads as composure</text>
<circle cx="60" cy="302" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="270" width="470" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Narrating without deciding</text>
<path d="M566 302H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 302H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failmodes-marker-slate)"/>
<rect x="610" y="270" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="308" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">naming every consideration and resolving none</text>
<circle cx="60" cy="378" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="385" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="346" width="470" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Explaining rather than reasoning</text>
<path d="M566 378H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 378H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failmodes-marker-slate)"/>
<rect x="610" y="346" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most common way a well-prepared candidate</text><text x="630" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">uses time badly</text>
<rect x="40" y="434" width="1160" height="112" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="112" rx="2.5" fill="#39D5AA"/><text x="64" y="469" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The self-check, every couple of minutes</text><text x="64" y="496" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Did I say anything that could have been different?</text><text x="64" y="523" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">If it was all facts any competent engineer would also state, you are explaining, not deciding.</text>
<rect x="40" y="570" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="570" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="607" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Every trade-off you open has to be closed.</text>
<text x="66" y="692" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The interviewer is assessing whether you can choose, not whether you can explain a well-known algorithm.</text>
</svg>