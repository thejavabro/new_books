<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1230" viewBox="0 0 1240 1230" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of one capability&#39;s data migration: tables separated inside the monolith schema, then data copied out with CDC syncing both stores, then shadow reads comparing old and new answers, then traffic cut over to the new service when the answers match or back to CDC syncing when they disagree, and finally monolith reads removed so the extraction is done.">
  <defs>
    <marker id="m07-l10-data-migration-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l10-data-migration-states-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l10-data-migration-states-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l10-data-migration-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l10-data-migration-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l10-data-migration-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1230" fill="#FFFFFF"/>

  <g filter="url(#m07-l10-data-migration-states-soft)">
    <rect x="60" y="250" width="340" height="180" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="315" text-anchor="middle" font-size="20" fill="#475569">S1</text>
  <text x="230" y="347" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Tables separated</text>
  <text x="230" y="379" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">in the monolith</text>
  <g filter="url(#m07-l10-data-migration-states-soft)">
    <rect x="450" y="250" width="340" height="180" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="620" y="315" text-anchor="middle" font-size="20" fill="#475569">S2</text>
  <text x="620" y="347" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Data copied out,</text>
  <text x="620" y="379" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">CDC keeps both in sync</text>
  <g filter="url(#m07-l10-data-migration-states-soft)">
    <rect x="840" y="250" width="340" height="180" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1010" y="315" text-anchor="middle" font-size="20" fill="#475569">S3</text>
  <text x="1010" y="347" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shadow reads compare</text>
  <text x="1010" y="379" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">old and new answers</text>
  <g filter="url(#m07-l10-data-migration-states-soft)">
    <rect x="450" y="600" width="340" height="180" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="665" text-anchor="middle" font-size="20" fill="#475569">S4</text>
  <text x="620" y="697" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Traffic cut over to</text>
  <text x="620" y="729" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the new service</text>
  <g filter="url(#m07-l10-data-migration-states-soft)">
    <rect x="840" y="600" width="340" height="180" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1010" y="665" text-anchor="middle" font-size="20" fill="#475569">S5</text>
  <text x="1010" y="697" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Monolith reads gone,</text>
  <text x="1010" y="729" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the extraction is done</text>

  <g fill="none" stroke-width="2.5">
    <path d="M230,222 L230,242" stroke="#475569" stroke-width="2" marker-end="url(#m07-l10-data-migration-states-sl)"/>
    <path d="M400,340 L442,340" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l10-data-migration-states-ab)"/>
    <path d="M790,340 L832,340" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l10-data-migration-states-bl)"/>
    <path d="M1120,430 L1120,560 L620,560 L620,592" stroke="#059669" marker-end="url(#m07-l10-data-migration-states-em)"/>
    <path d="M900,435 L900,510 L620,510 L620,438" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l10-data-migration-states-rd)"/>
    <path d="M790,690 L832,690" stroke="#059669" marker-end="url(#m07-l10-data-migration-states-em)"/>
  </g>

  <circle cx="230" cy="210" r="12" fill="#475569"/>
  <circle cx="1180" cy="690" r="14" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <circle cx="1180" cy="690" r="7" fill="#059669"/>

  <text x="421" y="220" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">copy the data out</text>
  <text x="811" y="220" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">shadow reads</text>
  <text x="870" y="548" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the answers match</text>
  <text x="760" y="498" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the answers disagree</text>
  <text x="811" y="810" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">remove the monolith reads</text>

  <g filter="url(#m07-l10-data-migration-states-soft)">
    <rect x="60" y="850" width="540" height="160" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="330" y="905" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Every state ships on its own</text>
  <text x="330" y="937" text-anchor="middle" font-size="20" fill="#065F46">None of them needs the next one to be</text>
  <text x="330" y="969" text-anchor="middle" font-size="20" fill="#065F46">planned, or even decided, yet.</text>
  <g filter="url(#m07-l10-data-migration-states-soft)">
    <rect x="640" y="850" width="540" height="160" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="910" y="905" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Stopping at S4 is the trap</text>
  <text x="910" y="937" text-anchor="middle" font-size="20" fill="#B91C1C">Two live paths to the same data, forever,</text>
  <text x="910" y="969" text-anchor="middle" font-size="20" fill="#B91C1C">is worse than either one alone.</text>

  <line x1="60" y1="1070" x2="96" y2="1070" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="1077" font-size="20" fill="#475569">Data copied out, with CDC syncing both stores</text>
  <line x1="60" y1="1110" x2="96" y2="1110" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1117" font-size="20" fill="#475569">Shadow reads running on live traffic</text>
  <line x1="60" y1="1150" x2="96" y2="1150" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1157" font-size="20" fill="#475569">The answers match, and the extraction completes</text>
  <line x1="60" y1="1190" x2="96" y2="1190" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1197" font-size="20" fill="#475569">The answers disagree, so it goes back to syncing</text>
</svg>