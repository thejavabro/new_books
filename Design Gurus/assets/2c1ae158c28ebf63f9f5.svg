<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="backpressure-title backpressure-desc">
<title id="backpressure-title">Kafka has no backpressure</title>
<desc id="backpressure-desc">The broker accepts writes at whatever rate the producer sends, regardless of consumer progress. An overwhelmed consumer group does not slow the producer, it loses the oldest records at the retention boundary.</desc>
<defs>
<marker id="backpressure-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="backpressure-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="backpressure-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="backpressure-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="740" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Kafka has no backpressure</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Backpressure is a system's ability to make a fast producer slow down when a consumer cannot keep up.</text>
<rect x="40" y="662" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="662" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="300" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Producer</text>
<path d="M346 148H464" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 148H464" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#backpressure-marker-slate)"/>
<rect x="470" y="118" width="300" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Broker</text>
<path d="M776 148H894" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M776 148H894" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#backpressure-marker-slate)"/>
<rect x="900" y="118" width="300" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1050" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Consumer</text>
<path d="M900 204H340" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="620" y="236" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">no credit, no window, no signal flowing backwards</text>
<rect x="40" y="262" width="1160" height="98" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="262" width="5" height="98" rx="2.5" fill="#F28B9D"/><text x="64" y="291" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">So what actually happens to an overwhelmed group</text><text x="64" y="317" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Lag grows until the oldest unread records pass the retention boundary and are deleted. The committed offset</text><text x="64" y="343" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">is out of range, and auto.offset.reset decides. Its default jumps to the end of the partition.</text>
<rect x="40" y="376" width="1160" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="407" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Unacknowledged data loss, reported as a recovery, because lag returns to normal</text>
<text x="40" y="468" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Where backpressure has to be instead</text>
<rect x="40" y="486" width="560" height="150" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 486H46A6 6 0 0 0 40 492V630A6 6 0 0 0 46 636H54Z" fill="#F28B9D"/><text x="70" y="522" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">The unbounded buffer</text>
<text x="70" y="556" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Poll fast, commit, push into an in-memory queue.</text><text x="70" y="582" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Lag looks perfect. The backlog has moved into</text><text x="70" y="608" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">process memory, where it is not durable.</text>
<rect x="640" y="486" width="560" height="150" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 486H646A6 6 0 0 0 640 492V630A6 6 0 0 0 646 636H654Z" fill="#39D5AA"/><text x="670" y="522" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">The bounded queue</text>
<text x="670" y="556" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Bound the queue and pause the partitions when it</text><text x="670" y="582" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">is full. The backlog stays in the broker, where</text><text x="670" y="608" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">it is durable and replayable.</text>
<text x="66" y="696" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Alert on time lag crossing a fraction of retention, while there is still something to do about it.</text>
</svg>