<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="several-title several-desc">
<title id="several-title">Managing several pivots</title>
<desc id="several-desc">A session often has two or three, and running them well is as much about allocation as about content.</desc>
<defs>
<marker id="several-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="several-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="several-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="several-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="772" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Managing several pivots</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A session often has two or three, and running them well is as much about allocation as about content.</text>
<rect x="40" y="694" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="694" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="1050" y="128" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">time</text>
<rect x="40" y="146" width="260" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="170" y="182" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The first pivot</text>
<path d="M306 176H340" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M306 176H340" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#several-marker-slate)"/>
<rect x="350" y="146" width="516" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="169.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">gets the most time: usually their primary area</text><text x="370" y="194.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the heaviest weight</text>
<rect x="900" y="159" width="300" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="900" y="159" width="300.0" height="34" rx="10" fill="#F25461"/>
<rect x="40" y="218" width="260" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="170" y="254" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Later pivots</text>
<path d="M306 248H340" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M306 248H340" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#several-marker-slate)"/>
<rect x="350" y="218" width="516" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="254" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">get less, and that is appropriate</text>
<rect x="900" y="231" width="300" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="900" y="231" width="135.0" height="34" rx="10" fill="#E8BC60"/>
<rect x="40" y="290" width="260" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="170" y="326" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A repeated pivot</text>
<path d="M306 320H340" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M306 320H340" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#several-marker-slate)"/>
<rect x="350" y="290" width="516" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="313.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is not exploration. They are telling you</text><text x="370" y="338.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">something is wrong there</text>
<rect x="900" y="303" width="300" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="900" y="303" width="210.0" height="34" rx="10" fill="#7650D6"/>
<rect x="40" y="372" width="1160" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="400.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Four minutes deep on a second and three on a third</text><text x="620" y="427.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">beats fifteen on one and nothing on the others</text>
<rect x="40" y="466" width="560" height="108" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="466" width="5" height="108" rx="2.5" fill="#5EC9EC"/><text x="64" y="500" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Ask how deep they want</text><text x="64" y="526" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"I can go into the ordering guarantees or stay</text><text x="64" y="552" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">at the mechanism level, which is more useful?"</text>
<rect x="640" y="466" width="560" height="108" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="466" width="5" height="108" rx="2.5" fill="#F3CF6A"/><text x="664" y="500" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Flag the branch, do not take it</text><text x="664" y="526" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"That opens up exactly-once, which I am happy</text><text x="664" y="552" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">to get into, but let me finish this first"</text>
<rect x="40" y="596" width="1160" height="72" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="596" width="5" height="72" rx="2.5" fill="#F28B9D"/><text x="64" y="625" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Do not treat a pivot as a request to defend</text><text x="64" y="651" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The interviewer pointing at a component is interested, not hostile.</text>
<text x="66" y="728" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Answering defensively wastes the most collaborative part of the interview.</text>
</svg>