<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="624" viewBox="0 0 1240 624" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven expand and contract steps shown as three tracks, the schema, where writes go and where reads come from, with the dual write window marked as the range in which a rollback is still cheap">
  <rect x="0" y="0" width="1240" height="624" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Expand and contract: at no point do the code and the schema disagree</text>

  
  <circle cx="269" cy="132" r="18" fill="#7C3AED"/><text x="269" y="139" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="269" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Expand</text>
  <text x="269" y="190" font-size="20" fill="#64748B" text-anchor="middle">the schema</text>

  <circle cx="407" cy="132" r="18" fill="#D97706"/><text x="407" y="139" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="407" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Dual write</text>
  <text x="407" y="190" font-size="20" fill="#64748B" text-anchor="middle">new and old</text>

  <circle cx="545" cy="132" r="18" fill="#D97706"/><text x="545" y="139" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="545" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Backfill</text>
  <text x="545" y="190" font-size="20" fill="#64748B" text-anchor="middle">old rows</text>

  <circle cx="683" cy="132" r="18" fill="#D97706"/><text x="683" y="139" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="683" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Verify</text>
  <text x="683" y="190" font-size="20" fill="#64748B" text-anchor="middle">the new path</text>

  <circle cx="821" cy="132" r="18" fill="#3B82F6"/><text x="821" y="139" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="821" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Switch</text>
  <text x="821" y="190" font-size="20" fill="#64748B" text-anchor="middle">reads</text>

  <circle cx="959" cy="132" r="18" fill="#059669"/><text x="959" y="139" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="959" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Stop writing</text>
  <text x="959" y="190" font-size="20" fill="#64748B" text-anchor="middle">to the old</text>

  <circle cx="1097" cy="132" r="18" fill="#059669"/><text x="1097" y="139" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="1097" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Contract</text>
  <text x="1097" y="190" font-size="20" fill="#64748B" text-anchor="middle">drop the old</text>

  
  <line x1="200" y1="204" x2="200" y2="396" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="338" y1="204" x2="338" y2="396" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="476" y1="204" x2="476" y2="396" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="614" y1="204" x2="614" y2="396" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="752" y1="204" x2="752" y2="396" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1028" y1="204" x2="1028" y2="396" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1166" y1="204" x2="1166" y2="396" stroke="#E2E8F0" stroke-width="1.5"/>

  
  <text x="190" y="245" font-size="20" font-weight="600" fill="#475569" text-anchor="end">Schema</text>
  <text x="190" y="311" font-size="20" font-weight="600" fill="#475569" text-anchor="end">Writes go to</text>
  <text x="190" y="377" font-size="20" font-weight="600" fill="#475569" text-anchor="end">Reads come from</text>

  
  <rect x="202" y="212" width="824" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="614" y="245" font-size="20" fill="#5B21B6" text-anchor="middle">old and new columns coexist</text>
  <rect x="1030" y="212" width="134" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1097" y="245" font-size="20" fill="#5B21B6" text-anchor="middle">new only</text>

  
  <rect x="202" y="278" width="134" height="52" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="269" y="311" font-size="20" fill="#334155" text-anchor="middle">old</text>
  <rect x="340" y="278" width="548" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="614" y="311" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">old and new (dual write)</text>
  <rect x="892" y="278" width="272" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1028" y="311" font-size="20" fill="#065F46" text-anchor="middle">new only</text>

  
  <rect x="202" y="344" width="548" height="52" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="476" y="377" font-size="20" fill="#334155" text-anchor="middle">old</text>
  <rect x="754" y="344" width="410" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="959" y="377" font-size="20" fill="#065F46" text-anchor="middle">new</text>

  
  <line x1="890" y1="110" x2="890" y2="412" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 5"/>

  <path d="M338 424 V412 H890 V424" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="614" y="452" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">rolling back is free anywhere in here</text>
  <text x="900" y="452" font-size="20" font-weight="600" fill="#B91C1C">rollback gets expensive here</text>

  
  <rect x="40" y="502" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="538" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">At every step the application and the database agree, which is what makes it zero downtime.</text>
  <text x="620" y="568" font-size="20" fill="#334155" text-anchor="middle">The dual write window is the safety net. Do not shorten it to save calendar time.</text>
</svg>