<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A regular HTTP request: the client sends a request, the server prepares and returns a response, and the exchange is complete">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="rt1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rt1-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rt1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="240" y1="112" x2="240" y2="356" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1000" y1="112" x2="1000" y2="356" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="248" y1="192" x2="990" y2="192" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt1-blue)"/>
  <text x="620" y="168" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. The client opens a connection and sends a request</text>

  <line x1="992" y1="330" x2="250" y2="330" stroke="#059669" stroke-width="2" marker-end="url(#rt1-emerald)"/>
  <text x="620" y="306" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. The server sends the response back</text>

  
  <g filter="url(#rt1-soft)">
    <rect x="120" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="880" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="240" y="98" font-size="20" fill="#64748B" text-anchor="middle">web browser or app</text>
  <text x="1000" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="1000" y="98" font-size="20" fill="#64748B" text-anchor="middle">web server</text>

  
  <g filter="url(#rt1-soft)">
    <rect x="870" y="218" width="260" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1000" y="249" font-size="20" fill="#334155" text-anchor="middle">2. The server prepares</text>
  <text x="1000" y="276" font-size="20" fill="#334155" text-anchor="middle">the response</text>

  
  <rect x="200" y="368" width="840" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="399" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The exchange is complete.</text>
  <text x="620" y="427" font-size="20" fill="#64748B" text-anchor="middle">For new data, the client must ask again. The server can never speak first.</text>
</svg>