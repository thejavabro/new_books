<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="redlock-title redlock-desc">
<title id="redlock-title">Why Redlock is contested</title>
<desc id="redlock-desc">The published critique argues the algorithm assumes bounded network delay, bounded process pauses and bounded clock drift. The objection is really about lease-based locking in general rather than about Redis.</desc>
<defs>
<marker id="redlock-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="redlock-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="redlock-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="redlock-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why Redlock is contested</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The objection is really about lease-based locking in general rather than about Redis.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="92" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="92" rx="2.5" fill="#5EC9EC"/><text x="64" y="144" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Redlock, in one sentence</text><text x="64" y="170" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Acquire across several independent instances, keep it only on a majority</text><text x="64" y="196" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">obtained within a time budget, with validity reduced by the elapsed time.</text>
<text x="40" y="248" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The critique targets three assumptions</text>
<rect x="40" y="266" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="300" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Bounded network delay</text>
<path d="M526 294H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 294H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#redlock-marker-red)"/>
<rect x="570" y="266" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="300" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">messages arrive within some known time</text>
<rect x="40" y="330" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="364" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Bounded process pauses</text>
<path d="M526 358H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 358H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#redlock-marker-red)"/>
<rect x="570" y="330" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="364" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">your process does not stop for longer than the lease</text>
<rect x="40" y="394" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="428" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Bounded clock drift</text>
<path d="M526 422H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 422H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#redlock-marker-red)"/>
<rect x="570" y="394" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="428" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an expiry means roughly the same thing on different machines</text>
<rect x="40" y="474" width="1160" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="504" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">None of them hold in a general network</text>
<rect x="40" y="548" width="1160" height="122" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="548" width="5" height="122" rx="2.5" fill="#AC8BE8"/><text x="64" y="576" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The conclusion worth carrying is broader than the algorithm</text><text x="64" y="602" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Every lease-based lock rests on those assumptions, so the objection applies</text><text x="64" y="628" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">to locks built on ZooKeeper and etcd too. Consensus makes the lock service</text><text x="64" y="654" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">reliable, and does nothing about what happens inside your process.</text>
<text x="66" y="729" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Reaching for a quorum store does not answer the critique, because the critique is not about where the lock is stored.</text>
</svg>