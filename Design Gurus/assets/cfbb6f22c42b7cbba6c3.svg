<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="728" viewBox="0 0 1240 728" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A ride platform in the center. On the left a driver app sends bounded location writes with PUT. On the right a rider app receives an SSE stream and makes separate REST writes. Below, an internal matching service exchanges typed high volume gRPC calls. Each consumer box names the pressure that selected its mechanism.">
  <defs>
    <marker id="p4-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p4-im" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="p4-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p4-k1"><rect x="70" y="150" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p4-k2"><rect x="470" y="150" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p4-k3"><rect x="870" y="150" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p4-k4"><rect x="470" y="390" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="728" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="520" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One product, three boundaries</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">each consumer box names the pressure that selected its mechanism</text>

  
  <g fill="none" stroke-width="2">
    <path d="M370,195 H470" stroke="#2563EB" marker-end="url(#p4-bm)"/>
    <path d="M770,172 H870" stroke="#4F46E5" marker-end="url(#p4-im)"/>
    <path d="M870,218 H770" stroke="#2563EB" marker-end="url(#p4-bm)"/>
    <path d="M700,240 V344 Q700,356 688,356 H632 Q620,356 620,368 V390" stroke="#059669" stroke-width="2.5" marker-end="url(#p4-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="420" y="183" fill="#1D4ED8">PUT</text>
    <text x="820" y="160" fill="#4338CA">SSE</text>
    <text x="820" y="242" fill="#1D4ED8">REST</text>
    <text x="756" y="302" fill="#047857">gRPC</text>
  </g>

  
  <g filter="url(#p4-soft)">
    <rect x="70" y="150" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#p4-k1)"/>
  </g>
  <circle cx="108" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="134" y="202" font-size="18.5" font-weight="600" fill="#111827">Driver app</text>
  <text x="220" y="265" font-size="15.5" text-anchor="middle" fill="#6B7280">Bounded writes</text>
  <text x="220" y="288" font-size="15.5" text-anchor="middle" fill="#94A3B8">Pressure: modest write rate</text>

  
  <g filter="url(#p4-lift)">
    <rect x="470" y="150" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="470" y="150" width="9" height="90" fill="#64748B" clip-path="url(#p4-k2)"/>
  </g>
  <circle cx="508" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,184.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="534" y="202" font-size="18.5" font-weight="600" fill="#111827">Ride platform</text>
  <text x="620" y="265" font-size="15.5" text-anchor="middle" fill="#6B7280">one product</text>

  
  <g filter="url(#p4-soft)">
    <rect x="870" y="150" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="870" y="150" width="6" height="90" fill="#4F46E5" clip-path="url(#p4-k3)"/>
  </g>
  <circle cx="908" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(897.56,184.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="934" y="202" font-size="18.5" font-weight="600" fill="#111827">Rider app</text>
  <text x="1020" y="265" font-size="15.5" text-anchor="middle" fill="#6B7280">Receives changes</text>
  <text x="1020" y="288" font-size="15.5" text-anchor="middle" fill="#94A3B8">Pressure: one direction only</text>

  
  <g filter="url(#p4-soft)">
    <rect x="470" y="390" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="470" y="390" width="6" height="90" fill="#059669" clip-path="url(#p4-k4)"/>
  </g>
  <circle cx="508" cy="435" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,424.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="534" y="442" font-size="18.5" font-weight="600" fill="#111827">Matching service</text>
  <text x="620" y="505" font-size="15.5" text-anchor="middle" fill="#6B7280">Typed calls</text>
  <text x="620" y="528" font-size="15.5" text-anchor="middle" fill="#94A3B8">Pressure: very high volume</text>

  
  <rect x="40" y="584" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="626" text-anchor="middle" font-size="16" fill="#475569">Each arrow is chosen by a consumer pressure, not by a technology preference.</text>
  <text x="620" y="656" text-anchor="middle" font-size="16" fill="#475569">Consistency means each boundary is predictable for its consumer.</text>
</svg>