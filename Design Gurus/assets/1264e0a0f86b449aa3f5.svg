<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="863" viewBox="0 0 1240 863" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three credentials compared on three questions: an API key for server automation, an opaque token when immediate central withdrawal matters, and a signed token when many services verify locally. The signed token cannot normally be withdrawn before it expires without adding a lookup, which is why its withdrawal row is the largest.">
  <defs>
    <filter id="p18-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p18-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p18-k1"><rect x="76" y="174" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="p18-k2"><rect x="450" y="174" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="p18-k3"><rect x="824" y="174" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="p18-k4"><rect x="76" y="372" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="p18-k5"><rect x="450" y="372" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="p18-k6"><rect x="824" y="372" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="p18-k7"><rect x="76" y="570" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="p18-k8"><rect x="450" y="570" width="340" height="48" rx="10"/></clipPath>
    <clipPath id="p18-k9"><rect x="824" y="570" width="340" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="863" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three credentials, and how each one is taken back</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each row answers the same three questions</text>

  
  <rect x="40" y="126" width="1160" height="174" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">API key</text>

  <g filter="url(#p18-soft)">
    <rect x="76" y="174" width="340" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="48" fill="#059669" clip-path="url(#p18-k1)"/>
  </g>
  <circle cx="110" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,189) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="134" y="205" font-size="18.5" font-weight="600" fill="#111827">Use it for</text>
  <text x="246" y="244" text-anchor="middle" font-size="15.5" fill="#6B7280">Server-to-server work,</text>
  <text x="246" y="267" text-anchor="middle" font-size="15.5" fill="#94A3B8">scripts, partner automation</text>

  <g filter="url(#p18-soft)">
    <rect x="450" y="174" width="340" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="174" width="6" height="48" fill="#64748B" clip-path="url(#p18-k2)"/>
  </g>
  <circle cx="484" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(475,189) scale(0.75)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="508" y="205" font-size="18.5" font-weight="600" fill="#111827">What it gives</text>
  <text x="620" y="244" text-anchor="middle" font-size="15.5" fill="#6B7280">Simple issuance and clear</text>
  <text x="620" y="267" text-anchor="middle" font-size="15.5" fill="#94A3B8">attribution</text>

  <g filter="url(#p18-soft)">
    <rect x="824" y="174" width="340" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="824" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p18-k3)"/>
  </g>
  <circle cx="858" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(849,189) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="882" y="205" font-size="18.5" font-weight="600" fill="#111827">Early withdrawal</text>
  <text x="994" y="244" text-anchor="middle" font-size="15.5" fill="#6B7280">Mark it revoked; later</text>
  <text x="994" y="267" text-anchor="middle" font-size="15.5" fill="#94A3B8">checks fail with 401</text>

  
  <rect x="40" y="324" width="1160" height="174" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="354" font-size="16.5" font-weight="600" fill="#475569">Opaque token</text>

  <g filter="url(#p18-soft)">
    <rect x="76" y="372" width="340" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="372" width="6" height="48" fill="#059669" clip-path="url(#p18-k4)"/>
  </g>
  <circle cx="110" cy="396" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,387) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="134" y="403" font-size="18.5" font-weight="600" fill="#111827">Use it for</text>
  <text x="246" y="442" text-anchor="middle" font-size="15.5" fill="#6B7280">Sessions and grants that</text>
  <text x="246" y="465" text-anchor="middle" font-size="15.5" fill="#94A3B8">change often</text>

  <g filter="url(#p18-soft)">
    <rect x="450" y="372" width="340" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="372" width="6" height="48" fill="#64748B" clip-path="url(#p18-k5)"/>
  </g>
  <circle cx="484" cy="396" r="15" fill="#FFFFFF"/>
  <g transform="translate(475,387) scale(0.75)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="508" y="403" font-size="18.5" font-weight="600" fill="#111827">What it gives</text>
  <text x="620" y="442" text-anchor="middle" font-size="15.5" fill="#6B7280">Immediate central</text>
  <text x="620" y="465" text-anchor="middle" font-size="15.5" fill="#94A3B8">withdrawal</text>

  <g filter="url(#p18-soft)">
    <rect x="824" y="372" width="340" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="824" y="372" width="6" height="48" fill="#DB2777" clip-path="url(#p18-k6)"/>
  </g>
  <circle cx="858" cy="396" r="15" fill="#FFFFFF"/>
  <g transform="translate(849,387) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="882" y="403" font-size="18.5" font-weight="600" fill="#111827">Early withdrawal</text>
  <text x="994" y="442" text-anchor="middle" font-size="15.5" fill="#6B7280">Remove it. Caching weakens</text>
  <text x="994" y="465" text-anchor="middle" font-size="15.5" fill="#94A3B8">this by the cache lifetime</text>

  
  <rect x="40" y="522" width="1160" height="197" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="552" font-size="16.5" font-weight="600" fill="#475569">Signed token</text>
  <text x="1176" y="552" text-anchor="end" font-size="15.5" fill="#6B7280">the one row where withdrawal is hard</text>

  <g filter="url(#p18-soft)">
    <rect x="76" y="570" width="340" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="570" width="6" height="48" fill="#059669" clip-path="url(#p18-k7)"/>
  </g>
  <circle cx="110" cy="594" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,585) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="134" y="601" font-size="18.5" font-weight="600" fill="#111827">Use it for</text>
  <text x="246" y="640" text-anchor="middle" font-size="15.5" fill="#6B7280">Many services verifying</text>
  <text x="246" y="663" text-anchor="middle" font-size="15.5" fill="#94A3B8">locally at low latency</text>

  <g filter="url(#p18-soft)">
    <rect x="450" y="570" width="340" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="570" width="6" height="48" fill="#64748B" clip-path="url(#p18-k8)"/>
  </g>
  <circle cx="484" cy="594" r="15" fill="#FFFFFF"/>
  <g transform="translate(475,585) scale(0.75)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="508" y="601" font-size="18.5" font-weight="600" fill="#111827">What it gives</text>
  <text x="620" y="640" text-anchor="middle" font-size="15.5" fill="#6B7280">No central lookup on every</text>
  <text x="620" y="663" text-anchor="middle" font-size="15.5" fill="#94A3B8">call</text>

  <g filter="url(#p18-lift)">
    <rect x="824" y="570" width="340" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="824" y="570" width="9" height="48" fill="#DB2777" clip-path="url(#p18-k9)"/>
  </g>
  <circle cx="858" cy="594" r="15" fill="#FFFFFF"/>
  <g transform="translate(849,585) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="882" y="601" font-size="18.5" font-weight="600" fill="#111827">Early withdrawal</text>
  <text x="994" y="640" text-anchor="middle" font-size="15.5" fill="#6B7280">Not normally possible</text>
  <text x="994" y="663" text-anchor="middle" font-size="15.5" fill="#94A3B8">before expiry, without</text>
  <text x="994" y="686" text-anchor="middle" font-size="15.5" fill="#94A3B8">adding a lookup</text>

  
  <rect x="40" y="747" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="792" text-anchor="middle" font-size="16" fill="#475569">"Stateless authentication" is not free. It trades immediate control for local verification.</text>
</svg>