<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three sorted bookings with the floor and ceiling of a new booking marked, showing that only those two neighbours can clash"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="772" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="420" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Only the two neighbours of a new booking can possibly clash with it</text>
<text x="212" y="233" text-anchor="end" font-size="19.5" font-weight="600" fill="#475569">booked</text>
<rect x="240" y="190" width="190" height="70" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="335" y="233" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">[10, 20)</text>
<text x="335" y="180" text-anchor="middle" font-size="17.5" fill="#94A3B8">floor of 25</text>
<rect x="460" y="190" width="190" height="70" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="555" y="233" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">[30, 40)</text>
<text x="555" y="180" text-anchor="middle" font-size="17.5" fill="#94A3B8">ceiling of 25</text>
<rect x="680" y="190" width="190" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="775" y="233" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">[50, 60)</text>
<text x="322" y="353" text-anchor="end" font-size="19.5" font-weight="600" fill="#047857">new</text>
<rect x="350" y="310" width="190" height="70" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="445" y="353" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">[25, 30)</text>
<text x="240" y="430" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">[10, 20) ends at 20, which is not after 25, so no clash</text>
<text x="240" y="462" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">[30, 40) starts at 30, which is not before 30, so no clash</text>
<rect x="40" y="508" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="530" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="556" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">floor</text>
<text x="348" y="556" font-size="19.5" fill="#475569">the last booking starting at or before the new start</text>
<rect x="64" y="578" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="604" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">ceiling</text>
<text x="348" y="604" font-size="19.5" fill="#475569">the first booking starting at or after the new start</text>
<rect x="64" y="626" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="652" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">the new booking</text>
<text x="348" y="652" font-size="19.5" fill="#475569">accepted, because neither neighbour overlaps it</text>
<rect x="64" y="674" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="700" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">everything else</text>
<text x="348" y="700" font-size="19.5" fill="#475569">separated by a neighbour, so it cannot clash</text>
</svg>