<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" style="background-color:#ffffff">
<defs>
<marker id="itb" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
<marker id="itd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="50" width="220" height="60" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="50" width="220" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="140" y="69" text-anchor="middle" font-weight="bold">Client</text>
<text x="42" y="98" font-size="11.5" fill="#414d60">holds only an iterator</text>

<rect x="330" y="50" width="270" height="60" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="330" y="50" width="270" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="465" y="69" text-anchor="middle" font-weight="bold">SearchResults  (aggregate)</text>
<text x="342" y="98">+ iterator() : SearchResultIterator</text>

<rect x="330" y="196" width="270" height="98" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="330" y="196" width="270" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="465" y="215" text-anchor="middle" font-weight="bold">SearchResultIterator</text>
<text x="342" y="244" font-size="11.5">- currentPage, positionInPage</text>
<text x="342" y="264" font-size="11.5">+ hasNext() : boolean</text>
<text x="342" y="284" font-size="11.5">+ next() : String</text>

<rect x="690" y="196" width="240" height="70" fill="#f5f7fa" stroke="#c3cfe0"/>
<rect x="690" y="196" width="240" height="28" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="810" y="215" text-anchor="middle" font-weight="bold" fill="#414d60">SearchApi</text>
<text x="702" y="244" font-size="11.5" fill="#414d60">+ fetchPage(n) : List</text>

<path d="M 254 80 L 325 80" stroke="#000000" fill="none" marker-end="url(#itb)"/>
<text x="258" y="72" font-size="11" fill="#414d60">asks for one</text>

<path d="M 465 114 L 465 192" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#itb)"/>
<text x="476" y="158" font-size="11" fill="#414d60">creates</text>

<path d="M 604 232 L 685 232" stroke="#000000" fill="none" marker-start="url(#itd)" marker-end="url(#itb)"/>
<text x="612" y="224" font-size="11" fill="#414d60">pages from</text>

<path d="M 140 114 L 140 250 L 325 250" stroke="#000000" fill="none" marker-end="url(#itb)"/>
<text x="152" y="242" font-size="11" fill="#414d60">then calls hasNext() and next()</text>

<rect x="30" y="316" width="900" height="58" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="340" font-size="12.5" fill="#414d60">The client depends on two methods. It does not know there is an API behind them, or that the results arrive two at a time.</text>
<text x="52" y="362" font-size="12.5" fill="#414d60">The position lives in the iterator, not the collection, which is why two loops over the same results do not interfere.</text>
</g>
</svg>