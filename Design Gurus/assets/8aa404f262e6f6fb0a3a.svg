<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">Five steps for explaining a mobile design</title><desc id="desc">The course method moves through requirements, API and records, app responsibilities, detailed decisions, and failure recovery and releases.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="960" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Five steps for explaining a mobile design</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Use this course method to organize your answer.</tspan></text><rect x="100" y="145" width="1000" height="110" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="122" y="187" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="122" dy="0">1. Requirements</tspan></text><text x="122" y="235" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="122" dy="0">Which features and conditions must the app support?</tspan></text><path d="M600 262 V270" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="275" width="1000" height="110" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="122" y="317" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="122" dy="0">2. API and data model</tspan></text><text x="122" y="365" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="122" dy="0">What requests, responses, and saved records are needed?</tspan></text><path d="M600 392 V400" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="405" width="1000" height="110" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="122" y="447" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="122" dy="0">3. Client architecture</tspan></text><text x="122" y="495" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="122" dy="0">Which part of the app is responsible for each task?</tspan></text><path d="M600 522 V530" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="535" width="1000" height="110" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="122" y="577" font-size="25" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="122" dy="0">4. Deep dive</tspan></text><text x="122" y="625" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="122" dy="0">How do the most important technical decisions work?</tspan></text><path d="M600 652 V660" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="665" width="1000" height="110" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="122" y="707" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="122" dy="0">5. Failure, offline, and shipping</tspan></text><text x="122" y="755" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="122" dy="0">How does the app recover, and how will updates be tested?</tspan></text><rect x="50" y="820" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="866" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Adjust the time and detail to the interview requirements.</tspan></text></g></svg>