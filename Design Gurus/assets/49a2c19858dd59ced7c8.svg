<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="460" viewBox="0 0 1240 460" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three bounded contexts, Catalog, Inventory, and Shipping, each holding its own product model and meeting only at the shared product ID">
  <defs>
    <filter id="m02-l01-three-product-contexts-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="460" fill="#FFFFFF"/>

  
  <g fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="6 5">
    <path d="M215,170 C215,235 540,215 540,280"/>
    <path d="M620,170 L620,280"/>
    <path d="M1025,170 C1025,235 700,215 700,280"/>
  </g>

  
  <g filter="url(#m02-l01-three-product-contexts-soft)">
    <rect x="25" y="60" width="380" height="110" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="215" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Catalog context</text>
  <text x="215" y="140" text-anchor="middle" font-size="20" fill="#0F172A">product = title, images, price</text>

  <g filter="url(#m02-l01-three-product-contexts-soft)">
    <rect x="430" y="60" width="380" height="110" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="620" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Inventory context</text>
  <text x="620" y="140" text-anchor="middle" font-size="20" fill="#0F172A">product = stock count, warehouse</text>

  <g filter="url(#m02-l01-three-product-contexts-soft)">
    <rect x="835" y="60" width="380" height="110" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1025" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Shipping context</text>
  <text x="1025" y="140" text-anchor="middle" font-size="20" fill="#0F172A">product = weight, dimensions</text>

  
  <g filter="url(#m02-l01-three-product-contexts-soft)">
    <rect x="470" y="280" width="300" height="90" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="620" y="318" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">product ID</text>
  <text x="620" y="350" text-anchor="middle" font-size="20" fill="#64748B">the only thing shared</text>

  
  <line x1="40" y1="418" x2="74" y2="418" stroke="#475569" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="84" y="425" font-size="20" fill="#475569">Dotted seam: contexts share only the product ID, never each other's model</text>
</svg>