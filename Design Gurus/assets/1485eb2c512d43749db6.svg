<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" style="background-color:#ffffff">
<defs>
<marker id="fa" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#3a6fb0"/></marker>
<marker id="fb" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#b4322c"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#000000">

<text x="40" y="34" font-size="14" font-weight="bold">generate(), written once in ReportGenerator</text>

<rect x="40" y="52" width="180" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="130" y="77" text-anchor="middle">Collect the rows</text>
<text x="130" y="95" text-anchor="middle" font-size="11.5" fill="#414d60">same for every report</text>

<rect x="270" y="52" width="200" height="56" rx="4" fill="#ffffff" stroke="#b4322c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="370" y="77" text-anchor="middle" font-family="monospace" font-size="13" fill="#b4322c">createDocument()</text>
<text x="370" y="95" text-anchor="middle" font-size="11.5" fill="#b4322c">the only step that varies</text>

<rect x="520" y="52" width="180" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="610" y="77" text-anchor="middle">Render the document</text>
<text x="610" y="95" text-anchor="middle" font-size="11.5" fill="#414d60">same for every report</text>

<rect x="750" y="52" width="170" height="56" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="835" y="86" text-anchor="middle">Report ready</text>

<path d="M 220 80 L 265 80" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#fa)"/>
<path d="M 470 80 L 515 80" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#fa)"/>
<path d="M 700 80 L 745 80" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#fa)"/>

<text x="560" y="178" font-size="14" font-weight="bold" fill="#b4322c">Subclasses fill in that one step</text>

<rect x="150" y="190" width="250" height="60" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="275" y="213" text-anchor="middle" font-weight="bold">PdfReportGenerator</text>
<text x="275" y="235" text-anchor="middle" font-family="monospace" font-size="12">returns a PdfDocument</text>

<rect x="440" y="190" width="250" height="60" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="565" y="213" text-anchor="middle" font-weight="bold">HtmlReportGenerator</text>
<text x="565" y="235" text-anchor="middle" font-family="monospace" font-size="12">returns an HtmlDocument</text>

<path d="M 330 190 L 330 140 L 370 140 L 370 112" stroke="#b4322c" fill="none" stroke-dasharray="5 4" marker-end="url(#fb)"/>
<path d="M 510 190 L 510 140 L 370 140" stroke="#b4322c" fill="none" stroke-dasharray="5 4"/>

<rect x="40" y="300" width="880" height="94" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="62" y="328" font-size="13" fill="#414d60">Adding a CSV report means adding one class that returns a CsvDocument.</text>
<text x="62" y="352" font-size="13" fill="#414d60">Nothing above changes: the collecting, the rendering, and the ordering were written once and stay written.</text>
<text x="62" y="376" font-size="13" fill="#414d60">That is the difference from a switch statement, which you would have to find and edit every time.</text>
</g>
</svg>