<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array and the axis of values that can be asked about">
<defs>
<filter id="rp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many earlier values are more than double a later one?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array is [7, 1, 5, 2, 3], and reading it right to left turns this into counting, not comparing</text>
<rect x="40" y="106" width="1160" height="386" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One slot per value that can ever be asked about, the numbers and their doubles</text>
<text x="324" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<rect x="346" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="396" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="396" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="458" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="508" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="508" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="570" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="620" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="682" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="732" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="732" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="794" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="844" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="844" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<text x="107" y="426" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">doubles</text>
<rect x="129" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="179" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="179" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="241" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="291" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="291" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="353" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="403" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<text x="403" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="465" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="515" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">4</text>
<text x="515" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="577" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="627" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">5</text>
<text x="627" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="689" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="739" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">6</text>
<text x="739" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="801" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="851" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">7</text>
<text x="851" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="913" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="963" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">10</text>
<text x="963" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="1025" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1075" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">14</text>
<text x="1075" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<text x="620" y="288" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">Walking right to left, each number asks how many doubles already placed are smaller than it</text>
<text x="620" y="316" text-anchor="middle" font-size="18" fill="#475569">so the answer for one position is a count over a stretch of the axis, not a scan of the array</text>
<rect x="40" y="510" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="550" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A prefix count is the one thing a binary indexed tree does fastest</text>
<text x="620" y="582" text-anchor="middle" font-size="18.5" fill="#475569">Both the placing and the counting cost a step per level, not a step per slot</text>
</svg>