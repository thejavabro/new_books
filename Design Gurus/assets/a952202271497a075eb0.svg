<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1124" viewBox="0 0 1240 1124" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One batch request passes request-level gates for authentication, size validation, idempotency, and admission. Inside a published bound of one to one hundred items, independent entries fan out into per-item results. A request of one hundred items is accepted, and a request of one hundred and one items is refused with 400 and the code batch_size_too_large, never truncated to the first hundred.">
  <defs>
    <marker id="xl11bounded-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="xl11bounded-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="xl11bounded-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl11bounded-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl11bounded-k1"><rect x="98" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="xl11bounded-k2"><rect x="366" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="xl11bounded-k3"><rect x="634" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="xl11bounded-k4"><rect x="902" y="136" width="240" height="90" rx="12"/></clipPath>

    <clipPath id="xl11bounded-k5"><rect x="150" y="430" width="380" height="48" rx="10"/></clipPath>
    <clipPath id="xl11bounded-k6"><rect x="150" y="494" width="380" height="48" rx="10"/></clipPath>
    <clipPath id="xl11bounded-k7"><rect x="150" y="558" width="380" height="48" rx="10"/></clipPath>
    <clipPath id="xl11bounded-k8"><rect x="710" y="430" width="380" height="48" rx="10"/></clipPath>
    <clipPath id="xl11bounded-k9"><rect x="710" y="494" width="380" height="48" rx="10"/></clipPath>
    <clipPath id="xl11bounded-k10"><rect x="710" y="558" width="380" height="48" rx="10"/></clipPath>

    <clipPath id="xl11bounded-k11"><rect x="150" y="796" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl11bounded-k12"><rect x="710" y="796" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1124" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="680" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Two layers of batch contract</text>

  
  <rect x="64" y="88" width="1112" height="208" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="88" y="118" font-size="16.5" font-weight="600" fill="#B45309">Layer one, the request is judged as a whole</text>
  <text x="1152" y="118" text-anchor="end" font-size="15.5" fill="#6B7280">all four run before any item is touched</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="98" y="136" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="98" y="136" width="6" height="90" fill="#D97706" clip-path="url(#xl11bounded-k1)"/>
  </g>
  <circle cx="136" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(125.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="162" y="188" font-size="18.5" font-weight="600" fill="#111827">Authentication</text>
  <text x="218" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">who is calling</text>
  <text x="218" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">and are they allowed</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="366" y="136" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="366" y="136" width="6" height="90" fill="#D97706" clip-path="url(#xl11bounded-k2)"/>
  </g>
  <circle cx="404" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(393.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="430" y="188" font-size="18.5" font-weight="600" fill="#111827">Size validation</text>
  <text x="486" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">how many items</text>
  <text x="486" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">against a hard cap</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="634" y="136" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="634" y="136" width="6" height="90" fill="#D97706" clip-path="url(#xl11bounded-k3)"/>
  </g>
  <circle cx="672" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(661.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="698" y="188" font-size="18.5" font-weight="600" fill="#111827">Idempotency</text>
  <text x="754" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">is this a repeat</text>
  <text x="754" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">of an earlier call</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="902" y="136" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="902" y="136" width="6" height="90" fill="#D97706" clip-path="url(#xl11bounded-k4)"/>
  </g>
  <circle cx="940" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(929.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="966" y="188" font-size="18.5" font-weight="600" fill="#111827">Admission</text>
  <text x="1022" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">take the whole request</text>
  <text x="1022" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">or refuse the whole request</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M620,302 V342" stroke="#D97706" marker-end="url(#xl11bounded-am)"/>
  </g>

  
  <rect x="64" y="344" width="1112" height="352" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="374" font-size="16.5" font-weight="600" fill="#1D4ED8">Layer two, every item gets its own result</text>
  <text x="1152" y="374" text-anchor="end" font-size="15.5" fill="#6B7280">the hard boundary is 1 to 100 items</text>

  <text x="150" y="410" font-size="15.5" fill="#6B7280">Items in the request</text>
  <text x="710" y="410" font-size="15.5" fill="#6B7280">Per-item results</text>

  
  <g fill="none" stroke-width="2">
    <path d="M530,454 H710" stroke="#64748B" marker-end="url(#xl11bounded-sl)"/>
    <path d="M530,518 H710" stroke="#64748B" marker-end="url(#xl11bounded-sl)"/>
    <path d="M530,582 H710" stroke="#64748B" marker-end="url(#xl11bounded-sl)"/>
  </g>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="150" y="430" width="380" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="150" y="430" width="6" height="48" fill="#64748B" clip-path="url(#xl11bounded-k5)"/>
  </g>
  <circle cx="184" cy="454" r="4.5" fill="#64748B"/>
  <text x="208" y="461" font-size="18.5" font-weight="600" fill="#111827">item_1</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="150" y="494" width="380" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="150" y="494" width="6" height="48" fill="#64748B" clip-path="url(#xl11bounded-k6)"/>
  </g>
  <circle cx="184" cy="518" r="4.5" fill="#64748B"/>
  <text x="208" y="525" font-size="18.5" font-weight="600" fill="#111827">item_2</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="150" y="558" width="380" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="150" y="558" width="6" height="48" fill="#64748B" clip-path="url(#xl11bounded-k7)"/>
  </g>
  <circle cx="184" cy="582" r="4.5" fill="#64748B"/>
  <text x="208" y="589" font-size="18.5" font-weight="600" fill="#111827">item_3</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="710" y="430" width="380" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="710" y="430" width="6" height="48" fill="#059669" clip-path="url(#xl11bounded-k8)"/>
  </g>
  <circle cx="744" cy="454" r="15" fill="#FFFFFF"/>
  <g transform="translate(735,445) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="768" y="461" font-size="18.5" font-weight="600" fill="#111827">created</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="710" y="494" width="380" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="710" y="494" width="6" height="48" fill="#DB2777" clip-path="url(#xl11bounded-k9)"/>
  </g>
  <circle cx="744" cy="518" r="15" fill="#FFFFFF"/>
  <g transform="translate(735,509) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="768" y="525" font-size="18.5" font-weight="600" fill="#111827">failed</text>

  
  <g filter="url(#xl11bounded-soft)">
    <rect x="710" y="558" width="380" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="710" y="558" width="6" height="48" fill="#059669" clip-path="url(#xl11bounded-k10)"/>
  </g>
  <circle cx="744" cy="582" r="15" fill="#FFFFFF"/>
  <g transform="translate(735,573) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="768" y="589" font-size="18.5" font-weight="600" fill="#111827">created</text>

  
  <circle cx="158" cy="639" r="3.5" fill="#2563EB"/>
  <text x="172" y="644" font-size="15.5" fill="#6B7280">Each item is judged on its own.</text>
  <circle cx="158" cy="669" r="3.5" fill="#2563EB"/>
  <text x="172" y="674" font-size="15.5" fill="#6B7280">A failure in one item does not fail the others.</text>

  
  <rect x="40" y="748" width="1160" height="208" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="778" font-size="16.5" font-weight="600" fill="#475569">Over the maximum the whole request is refused, never truncated</text>

  <g filter="url(#xl11bounded-lift)">
    <rect x="150" y="796" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="150" y="796" width="9" height="90" fill="#059669" clip-path="url(#xl11bounded-k11)"/>
  </g>
  <circle cx="188" cy="841" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,830.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="214" y="848" font-size="18.5" font-weight="600" fill="#111827">100 items, accepted</text>
  <text x="340" y="911" font-size="15.5" text-anchor="middle" fill="#6B7280">100 is the published maximum</text>
  <text x="340" y="934" font-size="15.5" text-anchor="middle" fill="#94A3B8">the whole array is handled</text>

  <g filter="url(#xl11bounded-lift)">
    <rect x="710" y="796" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="710" y="796" width="9" height="90" fill="#DB2777" clip-path="url(#xl11bounded-k12)"/>
  </g>
  <circle cx="748" cy="841" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,830.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="774" y="848" font-size="18.5" font-weight="600" fill="#111827">101 items, refused</text>
  <text x="900" y="911" font-size="15.5" text-anchor="middle" fill="#6B7280">400 batch_size_too_large</text>
  <text x="900" y="934" font-size="15.5" text-anchor="middle" fill="#94A3B8">the body names provided and maximum</text>

  
  <rect x="40" y="980" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1022" text-anchor="middle" font-size="16" fill="#475569">The request is judged first. Then every item gets its own result.</text>
  <text x="620" y="1052" text-anchor="middle" font-size="16" fill="#475569">The first 100 are never quietly processed, because the caller would believe the whole array was handled.</text>
</svg>