<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of the outbox pattern. Checkout commits the order row and the outbox row in one local transaction, then a relay reads committed outbox rows, publishes the order placed event to the broker, and marks the row sent. A crash anywhere in the relay window only means re-reading and re-publishing, which is at-least-once delivery.">
  <defs>
    <marker id="m05-l03-outbox-sequence-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l03-outbox-sequence-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l03-outbox-sequence-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m05-l03-outbox-sequence-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <rect x="60" y="190" width="600" height="130" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="340" y="360" width="840" height="390" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="185" y1="145" x2="185" y2="760"/>
    <line x1="475" y1="145" x2="475" y2="760"/>
    <line x1="755" y1="145" x2="755" y2="760"/>
    <line x1="1040" y1="145" x2="1040" y2="760"/>
  </g>

  <text x="80" y="228" font-size="20" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Step 1: one local transaction</text>
  <text x="360" y="398" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Steps 2 to 4: the relay publishes from the outbox</text>
  <text x="1160" y="398" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">polling, or CDC on the log</text>

  <g fill="none" stroke-width="2.5">
    <path d="M191,290 L469,290" stroke="#3B82F6" marker-end="url(#m05-l03-outbox-sequence-bl)"/>
    <path d="M749,450 L481,450" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l03-outbox-sequence-ab)"/>
    <path d="M761,510 L1034,510" stroke="#D97706" marker-end="url(#m05-l03-outbox-sequence-ab)"/>
    <path d="M749,570 L481,570" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l03-outbox-sequence-ab)"/>
    <path d="M749,700 L481,700" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m05-l03-outbox-sequence-em)"/>
  </g>
  <rect x="748" y="440" width="14" height="140" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>

  <text x="330" y="272" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">order row + outbox row, one transaction</text>
  <text x="615" y="432" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read the committed outbox rows</text>
  <text x="897" y="492" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish the event</text>
  <text x="615" y="552" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">mark the row sent</text>
  <text x="590" y="662" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on restart: re-read unsent rows</text>
  <text x="590" y="688" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">and publish again</text>

  <g filter="url(#m05-l03-outbox-sequence-soft)">
    <rect x="60" y="620" width="260" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="190" y="650" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout did</text>
  <text x="190" y="682" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">one write</text>
  <text x="190" y="714" text-anchor="middle" font-size="20" fill="#64748B">it never calls the broker</text>
  <g filter="url(#m05-l03-outbox-sequence-soft)">
    <rect x="800" y="620" width="360" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="980" y="650" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The relay crashes here</text>
  <text x="980" y="682" text-anchor="middle" font-size="20" fill="#64748B">the outbox row is still there,</text>
  <text x="980" y="714" text-anchor="middle" font-size="20" fill="#64748B">and still unsent</text>

  <g filter="url(#m05-l03-outbox-sequence-soft)">
    <rect x="60" y="50" width="250" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="185" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="185" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">does the write</text>
  <g filter="url(#m05-l03-outbox-sequence-soft)">
    <rect x="340" y="50" width="270" height="95" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="475" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Database</text>
  <text x="475" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">orders + outbox</text>
  <g filter="url(#m05-l03-outbox-sequence-soft)">
    <rect x="640" y="50" width="230" height="95" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="755" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Relay</text>
  <text x="755" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">polling or CDC</text>
  <g filter="url(#m05-l03-outbox-sequence-soft)">
    <rect x="900" y="50" width="280" height="95" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1040" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="1040" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">Kafka, or SQS</text>

  <line x1="60" y1="800" x2="96" y2="800" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">Local transaction: checkout waits for one commit</text>
  <line x1="60" y1="840" x2="96" y2="840" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="847" font-size="20" fill="#475569">Relay: read the outbox, publish, mark it sent</text>
  <line x1="60" y1="880" x2="96" y2="880" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="887" font-size="20" fill="#475569">Recovery: re-read and re-publish</text>
</svg>