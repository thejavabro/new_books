<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One tight workflow split into five chained services: a user request crosses five network hops and the services still ship and fail together">
  <defs>
    <marker id="m01-l05-chained-latency-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m01-l05-chained-latency-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="400" fill="#FFFFFF"/>

  
  <rect x="300" y="60" width="910" height="200" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="755" y="98" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">Distributed monolith in effect: the services still ship and fail together</text>

  
  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M260,160 L318,160" marker-end="url(#m01-l05-chained-latency-bl)"/>
    <path d="M448,160 L506,160" marker-end="url(#m01-l05-chained-latency-bl)"/>
    <path d="M636,160 L694,160" marker-end="url(#m01-l05-chained-latency-bl)"/>
    <path d="M824,160 L882,160" marker-end="url(#m01-l05-chained-latency-bl)"/>
    <path d="M1012,160 L1070,160" marker-end="url(#m01-l05-chained-latency-bl)"/>
  </g>

  
  <g font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="289" y="242">hop 1</text>
    <text x="477" y="242">hop 2</text>
    <text x="665" y="242">hop 3</text>
    <text x="853" y="242">hop 4</text>
    <text x="1041" y="242">hop 5</text>
  </g>

  
  <g filter="url(#m01-l05-chained-latency-soft)">
    <rect x="40" y="110" width="220" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User request</text>
  <text x="150" y="182" text-anchor="middle" font-size="20" fill="#64748B">every user action</text>

  
  <g filter="url(#m01-l05-chained-latency-soft)">
    <rect x="318" y="110" width="130" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="383" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Step 1</text>
  <text x="383" y="182" text-anchor="middle" font-size="20" fill="#64748B">service</text>

  <g filter="url(#m01-l05-chained-latency-soft)">
    <rect x="506" y="110" width="130" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="571" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Step 2</text>
  <text x="571" y="182" text-anchor="middle" font-size="20" fill="#64748B">service</text>

  <g filter="url(#m01-l05-chained-latency-soft)">
    <rect x="694" y="110" width="130" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="759" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Step 3</text>
  <text x="759" y="182" text-anchor="middle" font-size="20" fill="#64748B">service</text>

  <g filter="url(#m01-l05-chained-latency-soft)">
    <rect x="882" y="110" width="130" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="947" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Step 4</text>
  <text x="947" y="182" text-anchor="middle" font-size="20" fill="#64748B">service</text>

  <g filter="url(#m01-l05-chained-latency-soft)">
    <rect x="1070" y="110" width="130" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="1135" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Step 5</text>
  <text x="1135" y="182" text-anchor="middle" font-size="20" fill="#64748B">service</text>

  
  <g stroke-width="4">
    <line x1="40" y1="320" x2="74" y2="320" stroke="#3B82F6"/>
    <line x1="40" y1="360" x2="74" y2="360" stroke="#DC2626" stroke-dasharray="6 5"/>
  </g>
  <text x="84" y="327" font-size="20" fill="#475569">Synchronous request path: each hop is a network round trip plus serialization</text>
  <text x="84" y="367" font-size="20" fill="#475569">One release unit in effect: five hops added, no independence gained</text>
</svg>