<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two ways to arrange an event-driven system. With a mediator, every event passes through one central component that filters, transforms and decides where it goes. With a broker, the producer publishes to a named channel and each consumer subscribes to it directly, with no routing logic in the middle">
  <defs>
    <marker id="ed2-in" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="ed2-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>

    <filter id="ed2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ed2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ed2-k1"><rect x="72" y="110" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed2-k2"><rect x="490" y="110" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed2-k3"><rect x="908" y="110" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed2-k4"><rect x="72" y="396" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed2-k5"><rect x="490" y="396" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed2-k6"><rect x="908" y="396" width="260" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  
  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#4338CA">Mediator: every event passes through one component that decides where it goes</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#5B21B6">Broker: the producer publishes to a channel and each consumer subscribes to it</text>

  
  <g fill="none" stroke="#4F46E5" stroke-width="2">
    <path d="M332,155 L486,155" marker-end="url(#ed2-in)"/>
    <path d="M750,155 L904,155" marker-end="url(#ed2-in)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M332,441 L486,441" marker-end="url(#ed2-vi)"/>
    <path d="M904,441 L754,441" marker-end="url(#ed2-vi)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="409" y="148" fill="#4338CA">sends</text>
    <text x="829" y="148" fill="#4338CA">routes to it</text>
    <text x="409" y="434" fill="#5B21B6">publishes</text>
    <text x="829" y="434" fill="#5B21B6">subscribes</text>
  </g>

  
  <g filter="url(#ed2-soft)">
    <rect x="72" y="110" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="72" y="110" width="6" height="90" fill="#4F46E5" clip-path="url(#ed2-k1)"/>
  </g>
  <circle cx="110" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,144.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="162" font-size="18.5" font-weight="600" fill="#111827">Event Producer</text>
  <text x="202" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">emits a state change</text>
  <text x="202" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">addresses the mediator</text>

  <g filter="url(#ed2-lift)">
    <rect x="490" y="110" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="490" y="110" width="9" height="90" fill="#4F46E5" clip-path="url(#ed2-k2)"/>
  </g>
  <circle cx="528" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,144.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="554" y="162" font-size="18.5" font-weight="600" fill="#111827">Mediator</text>
  <text x="620" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">filters and transforms</text>
  <text x="620" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">then picks the target</text>

  <g filter="url(#ed2-soft)">
    <rect x="908" y="110" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="908" y="110" width="6" height="90" fill="#4F46E5" clip-path="url(#ed2-k3)"/>
  </g>
  <circle cx="946" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(935.56,144.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="972" y="162" font-size="18.5" font-weight="600" fill="#111827">Event Consumer</text>
  <text x="1038" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">receives what it is sent</text>
  <text x="1038" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">chooses nothing itself</text>

  
  <g filter="url(#ed2-soft)">
    <rect x="72" y="396" width="260" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="72" y="396" width="6" height="90" fill="#7C3AED" clip-path="url(#ed2-k4)"/>
  </g>
  <circle cx="110" cy="441" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,430.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="448" font-size="18.5" font-weight="600" fill="#111827">Event Producer</text>
  <text x="202" y="511" font-size="15.5" text-anchor="middle" fill="#6B7280">emits a state change</text>
  <text x="202" y="534" font-size="15.5" text-anchor="middle" fill="#94A3B8">knows only the topic name</text>

  <g filter="url(#ed2-lift)">
    <rect x="490" y="396" width="260" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="490" y="396" width="9" height="90" fill="#7C3AED" clip-path="url(#ed2-k5)"/>
  </g>
  <circle cx="528" cy="441" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,430.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="554" y="448" font-size="18.5" font-weight="600" fill="#111827">Event Channel</text>
  <text x="620" y="511" font-size="15.5" text-anchor="middle" fill="#6B7280">holds events, routes nothing</text>
  <text x="620" y="534" font-size="15.5" text-anchor="middle" fill="#94A3B8">no logic to become a bottleneck</text>

  <g filter="url(#ed2-soft)">
    <rect x="908" y="396" width="260" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="908" y="396" width="6" height="90" fill="#7C3AED" clip-path="url(#ed2-k6)"/>
  </g>
  <circle cx="946" cy="441" r="18" fill="#FFFFFF"/>
  <g transform="translate(935.56,430.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="972" y="448" font-size="18.5" font-weight="600" fill="#111827">Event Consumer</text>
  <text x="1038" y="511" font-size="15.5" text-anchor="middle" fill="#6B7280">subscribes to the topic</text>
  <text x="1038" y="534" font-size="15.5" text-anchor="middle" fill="#94A3B8">decides for itself</text>

  
  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">Mediator</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">routing and transformation live in one place you can read, and in one place that can fail</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Broker</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">easier to scale and simpler to run, but no single place tells you where an event ends up</text>
</svg>