<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="818" viewBox="0 0 1240 818" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three differences to record after every practice attempt: a step you never reached, an operation for which you never designed failures, and a choice for which you never named a cost. Those three notes produce a better next attempt than copying the worked answer.">
  <defs>
    <filter id="p2j-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2j-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2j-k1"><rect x="340" y="146" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p2j-k2"><rect x="340" y="326" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p2j-k3"><rect x="340" y="506" width="560" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="818" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Record three differences, not a score</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">after every practice attempt</text>

  
  <rect x="40" y="126" width="1160" height="160" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#B45309">Difference one</text>
  <g filter="url(#p2j-lift)">
    <rect x="340" y="146" width="560" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="340" y="146" width="9" height="90" fill="#D97706" clip-path="url(#p2j-k1)"/>
  </g>
  <circle cx="378" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,180.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="404" y="198" font-size="18.5" font-weight="600" fill="#111827">A step you never reached</text>
  <text x="620" y="262" text-anchor="middle" font-size="15.5" fill="#6B7280">Repeatedly missing the same step is a pacing problem, not a knowledge problem</text>

  
  <rect x="40" y="306" width="1160" height="160" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="336" font-size="16.5" font-weight="600" fill="#B45309">Difference two</text>
  <g filter="url(#p2j-soft)">
    <rect x="340" y="326" width="560" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="340" y="326" width="6" height="90" fill="#D97706" clip-path="url(#p2j-k2)"/>
  </g>
  <circle cx="378" cy="371" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,360.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="404" y="378" font-size="18.5" font-weight="600" fill="#111827">An operation with no failures designed</text>
  <text x="620" y="442" text-anchor="middle" font-size="15.5" fill="#6B7280">A success body covers only the success case</text>

  
  <rect x="40" y="486" width="1160" height="160" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="516" font-size="16.5" font-weight="600" fill="#B45309">Difference three</text>
  <g filter="url(#p2j-soft)">
    <rect x="340" y="506" width="560" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="340" y="506" width="6" height="90" fill="#D97706" clip-path="url(#p2j-k3)"/>
  </g>
  <circle cx="378" cy="551" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,540.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="404" y="558" font-size="18.5" font-weight="600" fill="#111827">A choice with no cost named</text>
  <text x="620" y="622" text-anchor="middle" font-size="15.5" fill="#6B7280">If you cannot name the cost, you may not yet have made the decision</text>

  
  <rect x="40" y="678" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="720" text-anchor="middle" font-size="16" fill="#475569">Do not repair pacing by deleting Step 4. Compress the number of consumers and operations instead.</text>
  <text x="620" y="748" text-anchor="middle" font-size="16" fill="#475569">Those three notes produce a better next attempt than copying the worked answer.</text>
</svg>