<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="background-color:#ffffff">
<defs>
<marker id="cmc" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="cmd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="cme" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="46" width="230" height="76" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="46" width="230" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="145" y="65" text-anchor="middle" font-weight="bold">CommandHistory</text>
<text x="42" y="94">- done : List&lt;Command&gt;</text>
<text x="42" y="114">+ run(Command), undoLast()</text>

<rect x="380" y="46" width="230" height="76" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="380" y="46" width="230" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="495" y="65" text-anchor="middle" font-weight="bold">&#171;interface&#187; Command</text>
<text x="392" y="94">+ execute()</text>
<text x="392" y="114">+ undo()</text>

<rect x="720" y="46" width="210" height="98" fill="#f5f7fa" stroke="#c3cfe0"/>
<rect x="720" y="46" width="210" height="28" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="825" y="65" text-anchor="middle" font-weight="bold" fill="#414d60">Cart  (receiver)</text>
<text x="732" y="94" fill="#414d60">+ add(sku, qty)</text>
<text x="732" y="114" fill="#414d60">+ removeLast()</text>
<text x="732" y="134" fill="#414d60">+ setDiscount(percent)</text>

<rect x="270" y="232" width="230" height="76" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="270" y="232" width="230" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="385" y="251" text-anchor="middle" font-weight="bold">AddItemCommand</text>
<text x="282" y="280" font-size="11.5">- sku, qty</text>
<text x="282" y="300" font-size="11.5">+ execute(), undo()</text>

<rect x="530" y="232" width="270" height="76" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="530" y="232" width="270" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="665" y="251" text-anchor="middle" font-weight="bold">ApplyDiscountCommand</text>
<text x="542" y="280" font-size="11.5">- percent</text>
<text x="542" y="300" font-size="11.5" fill="#2f7a55">- previousPercent  {captured in execute}</text>

<path d="M 264 84 L 375 84" stroke="#000000" fill="none" marker-start="url(#cmd)" marker-end="url(#cme)"/>
<text x="272" y="76" font-size="11" fill="#414d60">keeps many</text>

<path d="M 385 232 L 385 180 L 495 180 L 495 122" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#cmc)"/>
<path d="M 665 232 L 665 180 L 495 180" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<path d="M 804 270 L 860 270 L 860 148" stroke="#000000" fill="none" marker-end="url(#cme)"/>
<text x="812" y="216" font-size="11" fill="#414d60">calls</text>

<rect x="30" y="336" width="900" height="66" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="362" font-size="12.5" fill="#414d60">Three roles: the invoker runs and remembers, the command knows how to do and undo one thing, the receiver does the work.</text>
<text x="52" y="386" font-size="12.5" fill="#b4322c">previousPercent is the whole trick. Undo restores what was recorded, rather than trying to work out what the old value must have been.</text>
</g>
</svg>