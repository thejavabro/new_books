<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of an order saga in flight. Order received leads to confirming payment, which either advances to reserving stock and then confirmed, or branches to payment failed. Both terminal states end the flow, and every state in between is one the interface can name out loud instead of flipping straight from nothing to done.">
  <defs>
    <marker id="m05-l05-status-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l05-status-states-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l05-status-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l05-status-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l05-status-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="950" fill="#FFFFFF"/>

  <rect x="60" y="100" width="1120" height="240" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="140" font-size="20" font-weight="600" fill="#334155">A saga in flight has honest intermediate states</text>
  <text x="1160" y="140" text-anchor="end" font-size="20" fill="#64748B">users know this shape from delivery apps</text>

  <g filter="url(#m05-l05-status-states-soft)">
    <rect x="80" y="200" width="250" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="205" y="235" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order received</text>
  <text x="205" y="267" text-anchor="middle" font-size="20" fill="#64748B">the write has landed,</text>
  <text x="205" y="299" text-anchor="middle" font-size="20" fill="#64748B">nothing else is done</text>
  <g filter="url(#m05-l05-status-states-soft)">
    <rect x="360" y="200" width="250" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="485" y="235" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Confirming payment</text>
  <text x="485" y="267" text-anchor="middle" font-size="20" fill="#64748B">pending, said out loud,</text>
  <text x="485" y="299" text-anchor="middle" font-size="20" fill="#64748B">with a progress bar</text>
  <g filter="url(#m05-l05-status-states-soft)">
    <rect x="640" y="200" width="250" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="765" y="235" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Reserving stock</text>
  <text x="765" y="267" text-anchor="middle" font-size="20" fill="#64748B">the next honest step,</text>
  <text x="765" y="299" text-anchor="middle" font-size="20" fill="#64748B">and still not done</text>
  <g filter="url(#m05-l05-status-states-soft)">
    <rect x="920" y="200" width="250" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1045" y="235" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Confirmed</text>
  <text x="1045" y="267" text-anchor="middle" font-size="20" fill="#64748B">the only state that</text>
  <text x="1045" y="299" text-anchor="middle" font-size="20" fill="#64748B">claims to be done</text>
  <g filter="url(#m05-l05-status-states-soft)">
    <rect x="360" y="440" width="280" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="500" y="475" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment failed</text>
  <text x="500" y="507" text-anchor="middle" font-size="20" fill="#64748B">an honest outcome,</text>
  <text x="500" y="539" text-anchor="middle" font-size="20" fill="#64748B">not a spinner forever</text>

  <g fill="none" stroke-width="2.5">
    <path d="M62,260 L72,260" stroke="#475569" stroke-width="2" marker-end="url(#m05-l05-status-states-sl)"/>
    <path d="M330,260 L352,260" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l05-status-states-ab)"/>
    <path d="M610,260 L632,260" stroke="#059669" marker-end="url(#m05-l05-status-states-em)"/>
    <path d="M890,260 L912,260" stroke="#059669" stroke-width="2" marker-end="url(#m05-l05-status-states-em)"/>
    <path d="M485,320 L485,432" stroke="#DC2626" marker-end="url(#m05-l05-status-states-rd)"/>
  </g>

  <circle cx="50" cy="260" r="12" fill="#475569"/>

  <text x="341" y="180" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the payment starts</text>
  <text x="621" y="180" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">payment confirmed</text>
  <text x="901" y="180" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">stock reserved</text>
  <text x="502" y="390" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">payment fails</text>

  <g filter="url(#m05-l05-status-states-soft)">
    <rect x="60" y="600" width="380" height="150" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="250" y="650" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">When the lag spikes</text>
  <text x="250" y="682" text-anchor="middle" font-size="20" fill="#0F172A">named states simply stay</text>
  <text x="250" y="714" text-anchor="middle" font-size="20" fill="#0F172A">pending for longer</text>
  <g filter="url(#m05-l05-status-states-soft)">
    <rect x="700" y="600" width="480" height="150" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="940" y="650" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The anti-pattern: the binary interface</text>
  <text x="940" y="682" text-anchor="middle" font-size="20" fill="#0F172A">it knows only done and not done, so it has</text>
  <text x="940" y="714" text-anchor="middle" font-size="20" fill="#0F172A">no words for the seconds in between</text>

  <line x1="60" y1="790" x2="96" y2="790" stroke="#475569" stroke-width="4"/>
  <text x="108" y="797" font-size="20" fill="#475569">Lifecycle: the start and the end</text>
  <line x1="60" y1="830" x2="96" y2="830" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="837" font-size="20" fill="#475569">The order is accepted, and the async step begins</text>
  <line x1="60" y1="870" x2="96" y2="870" stroke="#059669" stroke-width="4"/>
  <text x="108" y="877" font-size="20" fill="#475569">The step succeeded, so the state advances</text>
  <line x1="60" y1="910" x2="96" y2="910" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="917" font-size="20" fill="#475569">The payment fails: a terminal failure state</text>
</svg>