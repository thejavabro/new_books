<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1136" viewBox="0 0 1240 1136" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven steps of the data modeling process, with three arrows showing where the work loops back to an earlier step">
<defs>
<filter id="rdb09-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="rdb09-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="rdb09-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="rdb09-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<clipPath id="rdb09-c1"><rect x="410" y="120" width="420" height="80" rx="12"/></clipPath>
<clipPath id="rdb09-c2"><rect x="410" y="230" width="420" height="80" rx="12"/></clipPath>
<clipPath id="rdb09-c3"><rect x="410" y="340" width="420" height="80" rx="12"/></clipPath>
<clipPath id="rdb09-c4"><rect x="410" y="450" width="420" height="80" rx="12"/></clipPath>
<clipPath id="rdb09-c5"><rect x="410" y="560" width="420" height="80" rx="12"/></clipPath>
<clipPath id="rdb09-c6"><rect x="410" y="670" width="420" height="80" rx="12"/></clipPath>
<clipPath id="rdb09-c7"><rect x="410" y="780" width="420" height="80" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="1136" fill="#FFFFFF"/>

<rect x="40" y="60" width="1160" height="830" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="90" font-size="16.5" font-weight="600" fill="#475569">The data modeling process, and the three places where it sends you back</text>

<g fill="none" stroke="#2563EB" stroke-width="2">
<path d="M620,200 V230" marker-end="url(#rdb09-mblue)"/>
<path d="M620,310 V340" marker-end="url(#rdb09-mblue)"/>
<path d="M620,420 V450" marker-end="url(#rdb09-mblue)"/>
<path d="M620,530 V560" marker-end="url(#rdb09-mblue)"/>
<path d="M620,640 V670" marker-end="url(#rdb09-mblue)"/>
<path d="M620,750 V780" marker-end="url(#rdb09-mblue)"/>
</g>
<g fill="none" stroke="#D97706" stroke-width="2">
<path d="M410,490 H322 Q310,490 310,478 V282 Q310,270 322,270 H402" marker-end="url(#rdb09-mamber)"/>
<path d="M410,600 H272 Q260,600 260,588 V392 Q260,380 272,380 H402" marker-end="url(#rdb09-mamber)"/>
<path d="M410,820 H322 Q310,820 310,808 V722 Q310,710 322,710 H402" marker-end="url(#rdb09-mamber)"/>
</g>

<g filter="url(#rdb09-soft)">
<rect x="410" y="120" width="420" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="410" y="120" width="6" height="80" fill="#64748B" clip-path="url(#rdb09-c1)"/>
</g>
<circle cx="448" cy="160" r="18" fill="#FFFFFF"/>
<g transform="translate(437.56,149.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="474" y="167" font-size="18.5" font-weight="600" fill="#111827">1. Gather requirements</text>
<text x="856" y="165" font-size="15.5" fill="#6B7280">the data, and the questions it must answer</text>

<g filter="url(#rdb09-soft)">
<rect x="410" y="230" width="420" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="410" y="230" width="6" height="80" fill="#64748B" clip-path="url(#rdb09-c2)"/>
</g>
<circle cx="448" cy="270" r="18" fill="#FFFFFF"/>
<g transform="translate(437.56,259.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
<text x="474" y="277" font-size="18.5" font-weight="600" fill="#111827">2. Find the entities</text>
<text x="856" y="275" font-size="15.5" fill="#6B7280">underline the nouns, then cut the list</text>

<g filter="url(#rdb09-soft)">
<rect x="410" y="340" width="420" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="410" y="340" width="6" height="80" fill="#64748B" clip-path="url(#rdb09-c3)"/>
</g>
<circle cx="448" cy="380" r="18" fill="#FFFFFF"/>
<g transform="translate(437.56,369.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
<text x="474" y="387" font-size="18.5" font-weight="600" fill="#111827">3. Find the relationships</text>
<text x="856" y="385" font-size="15.5" fill="#6B7280">underline the verbs, and count each side</text>

<g filter="url(#rdb09-lift)">
<rect x="410" y="450" width="420" height="80" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="410" y="450" width="9" height="80" fill="#2563EB" clip-path="url(#rdb09-c4)"/>
</g>
<circle cx="448" cy="490" r="18" fill="#FFFFFF"/>
<g transform="translate(437.56,479.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
<text x="474" y="497" font-size="18.5" font-weight="600" fill="#111827">4. Conceptual model</text>
<text x="856" y="488" font-size="15.5" fill="#6B7280">boxes and lines, reviewed with the business</text>
<text x="856" y="510" font-size="15.5" fill="#94A3B8">do not move on until they agree</text>

<g filter="url(#rdb09-soft)">
<rect x="410" y="560" width="420" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="410" y="560" width="6" height="80" fill="#2563EB" clip-path="url(#rdb09-c5)"/>
</g>
<circle cx="448" cy="600" r="18" fill="#FFFFFF"/>
<g transform="translate(437.56,589.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
<text x="474" y="607" font-size="18.5" font-weight="600" fill="#111827">5. Logical model</text>
<text x="856" y="605" font-size="15.5" fill="#6B7280">attributes, keys, then normalize</text>

<g filter="url(#rdb09-soft)">
<rect x="410" y="670" width="420" height="80" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="410" y="670" width="6" height="80" fill="#4F46E5" clip-path="url(#rdb09-c6)"/>
</g>
<circle cx="448" cy="710" r="18" fill="#FFFFFF"/>
<g transform="translate(437.56,699.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
<text x="474" y="717" font-size="18.5" font-weight="600" fill="#111827">6. Physical model</text>
<text x="856" y="715" font-size="15.5" fill="#6B7280">exact types and indexes, for one DBMS</text>

<g filter="url(#rdb09-soft)">
<rect x="410" y="780" width="420" height="80" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<rect x="410" y="780" width="6" height="80" fill="#059669" clip-path="url(#rdb09-c7)"/>
</g>
<circle cx="448" cy="820" r="18" fill="#FFFFFF"/>
<g transform="translate(437.56,809.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
<text x="474" y="827" font-size="18.5" font-weight="600" fill="#111827">7. Validate and refine</text>
<text x="856" y="818" font-size="15.5" fill="#6B7280">realistic data and the real queries,</text>
<text x="856" y="840" font-size="15.5" fill="#94A3B8">then keep watching after go live</text>

<rect x="40" y="924" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="950" width="240" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="184" y="972" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">review to entities</text>
<text x="328" y="972" font-size="15.5" fill="#475569">the business names something you never modelled</text>
<rect x="64" y="994" width="240" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="184" y="1016" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">normalize to links</text>
<text x="328" y="1016" font-size="15.5" fill="#475569">splitting a table reveals a relationship you had not drawn</text>
<rect x="64" y="1038" width="240" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="184" y="1060" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">validate to physical</text>
<text x="328" y="1060" font-size="15.5" fill="#475569">a slow query means a missing index, or a different key choice</text>
</svg>