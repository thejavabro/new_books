<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-label="A DNS lookup: the browser asks a resolver, which walks the root server, the top level domain server and the authoritative name server, then caches the answer and returns the IP address.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="480" fill="#FFFFFF"/>
  <rect x="45" y="109" width="210" height="82" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Browser</text>
  <text x="150" y="173" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">needs designgurus.io</text>
  <rect x="325" y="109" width="210" height="82" rx="10" fill="#F1F5F9" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="430" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Resolver</text>
  <text x="430" y="173" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">does the walking</text>
  <rect x="680" y="31" width="400" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="68" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Root server</text>
  <text x="880" y="93" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">knows who runs .io</text>
  <rect x="680" y="133" width="400" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="170" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">TLD server for .io</text>
  <text x="880" y="195" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">knows the name server</text>
  <rect x="680" y="235" width="400" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="272" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Authoritative server</text>
  <text x="880" y="297" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">holds the actual record</text>
  <line x1="255" y1="134" x2="322" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="288.5" y="120" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1</text>
  <line x1="322" y1="168" x2="255" y2="168" stroke="#1E40AF" stroke-width="2" marker-end="url(#ar-blu)"/>
  <text x="288.5" y="196" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">8</text>
  <path d="M535 130 C 620 130, 620 56, 678 56" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <path d="M678 86 C 620 86, 620 170, 535 170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="652" y="50" font-size="20" fill="#065F46" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2</text>
  <text x="652" y="110" font-size="20" fill="#64748B" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">3</text>
  <path d="M535 138 C 620 138, 620 158, 678 158" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <path d="M678 188 C 620 188, 620 178, 535 178" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="652" y="152" font-size="20" fill="#065F46" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">4</text>
  <text x="652" y="212" font-size="20" fill="#64748B" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">5</text>
  <path d="M535 146 C 620 146, 620 260, 678 260" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <path d="M678 290 C 620 290, 620 186, 535 186" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="652" y="254" font-size="20" fill="#065F46" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">6</text>
  <text x="652" y="314" font-size="20" fill="#64748B" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">7</text>
  <rect x="150" y="342" width="940" height="104" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="374" font-size="20" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Steps 1 and 8 are the browser asking, and getting back an IP address.</text>
  <text x="180" y="404" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Every step is cached: in the browser, in the operating system, and in the resolver.</text>
  <text x="180" y="432" font-size="20" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The second visit to a domain usually skips this walk entirely.</text>
</svg>