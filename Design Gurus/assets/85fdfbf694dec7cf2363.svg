<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three strategies. 1, discard and continue: input data passes filter 1 and filter 2; filter 2 discards the failed record and the pipeline continues through filter 3 to output data. 2, dead-letter routing: filter 2 sends the failed record to a dead-letter destination and the pipeline continues through filter 3 to output data. 3, stop and retry: an error occurs in filter 2, the pipeline pauses, so filter 3 and output data wait, and filter 2 retries the record">
