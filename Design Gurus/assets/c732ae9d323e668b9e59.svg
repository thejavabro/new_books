<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" role="img" aria-label="Back-of-the-envelope estimation turns the agreed user numbers into requests per second, storage, bandwidth and the read to write ratio.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="430" fill="#FFFFFF"/>
  <rect x="40" y="84" width="220" height="92" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="128" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">200M</text>
  <text x="150" y="153" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">daily users</text>
  <rect x="345" y="84" width="250" height="92" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="470" y="128" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Requests/sec</text>
  <text x="470" y="153" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">at peak</text>
  <rect x="665" y="84" width="250" height="92" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="790" y="128" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Storage</text>
  <text x="790" y="153" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">per year</text>
  <rect x="965" y="84" width="250" height="92" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1090" y="128" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Bandwidth</text>
  <text x="1090" y="153" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">in and out</text>
  <line x1="262" y1="130" x2="342" y2="130" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <line x1="596" y1="130" x2="662" y2="130" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <line x1="916" y1="130" x2="962" y2="130" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <rect x="40" y="226" width="1160" height="96" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="262" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">And the one most candidates skip: the read to write ratio.</text>
  <text x="70" y="294" font-size="20" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A hundred reads per write points at caches and replicas. The reverse points at queues and write-optimised storage.</text>
  <text x="620" y="372" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Round hard, say it out loud, and make sure the numbers visibly drive your later choices.</text>
</svg>