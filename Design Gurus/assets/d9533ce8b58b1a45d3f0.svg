<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three levels at which a bulkhead can be drawn: separate thread pools inside one service, separate service instances, and separate infrastructure, each isolating more and costing more">
  <defs>
    <marker id="bh3-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <clipPath id="bh3-k1"><rect x="72" y="104" width="336" height="100" rx="12"/></clipPath>
    <clipPath id="bh3-k2"><rect x="452" y="104" width="336" height="100" rx="12"/></clipPath>
    <clipPath id="bh3-k3"><rect x="832" y="104" width="336" height="100" rx="12"/></clipPath>
    <filter id="bh3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bh3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="284" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Where you can draw the partition</text>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M414,154 H444" marker-end="url(#bh3-mblue)"/>
    <path d="M794,154 H824" marker-end="url(#bh3-mblue)"/>
  </g>
  <g filter="url(#bh3-soft)">
    <rect x="72" y="104" width="336" height="100" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="104" width="6" height="100" fill="#2563EB" clip-path="url(#bh3-k1)"/>
  </g>
  <circle cx="110" cy="154" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,143.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="136" y="161" font-size="18.5" font-weight="600" fill="#111827">Thread Pools</text>
  <text x="240" y="229" font-size="15.5" text-anchor="middle" fill="#6B7280">one pool per dependency</text>
  <text x="240" y="252" font-size="15.5" text-anchor="middle" fill="#94A3B8">inside a single service</text>
  <text x="240" y="275" font-size="15.5" text-anchor="middle" fill="#94A3B8">cheapest, isolates threads only</text>
  <g filter="url(#bh3-soft)">
    <rect x="452" y="104" width="336" height="100" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="452" y="104" width="6" height="100" fill="#7C3AED" clip-path="url(#bh3-k2)"/>
  </g>
  <circle cx="490" cy="154" r="18" fill="#FFFFFF"/>
  <g transform="translate(479.56,143.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="516" y="161" font-size="18.5" font-weight="600" fill="#111827">Service Instances</text>
  <text x="620" y="229" font-size="15.5" text-anchor="middle" fill="#6B7280">separate instances serve</text>
  <text x="620" y="252" font-size="15.5" text-anchor="middle" fill="#94A3B8">separate groups of callers</text>
  <text x="620" y="275" font-size="15.5" text-anchor="middle" fill="#94A3B8">isolates memory and crashes</text>
  <g filter="url(#bh3-soft)">
    <rect x="832" y="104" width="336" height="100" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="832" y="104" width="6" height="100" fill="#059669" clip-path="url(#bh3-k3)"/>
  </g>
  <circle cx="870" cy="154" r="18" fill="#FFFFFF"/>
  <g transform="translate(859.56,143.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="896" y="161" font-size="18.5" font-weight="600" fill="#111827">Infrastructure</text>
  <text x="1000" y="229" font-size="15.5" text-anchor="middle" fill="#6B7280">separate machines, clusters</text>
  <text x="1000" y="252" font-size="15.5" text-anchor="middle" fill="#94A3B8">or database connection pools</text>
  <text x="1000" y="275" font-size="15.5" text-anchor="middle" fill="#94A3B8">isolates most, costs most</text>
  <rect x="40" y="352" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="376" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="398" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">The trade</text>
  <text x="288" y="398" font-size="15.5" fill="#475569">each level isolates more failure than the one before it and costs more to run</text>
  <rect x="64" y="420" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="442" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The rule</text>
  <text x="288" y="442" font-size="15.5" fill="#475569">partition where the failures actually spread, and give each partition its own share</text>
</svg>