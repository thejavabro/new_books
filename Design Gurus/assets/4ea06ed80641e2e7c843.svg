<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="672" viewBox="0 0 1240 672" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="two-title two-desc">
<title id="two-title">Two problems that share a name</title>
<desc id="two-desc">Multi-tenancy creates an availability problem and a security problem, and they get discussed as one. The second has no acceptable rate.</desc>
<defs>
<marker id="two-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="two-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="two-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="two-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="672" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two problems that share a name</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Multi-tenancy creates two distinct problems and they get discussed as one.</text>
<rect x="40" y="594" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="594" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="172" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V284A6 6 0 0 0 46 290H54Z" fill="#F3CF6A"/><text x="70" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Noisy neighbors</text>
<rect x="72" y="174" width="500" height="86" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one tenant consumes the capacity</text><text x="92" y="223" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the others needed</text><text x="92" y="248" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an availability and fairness problem</text>
<rect x="640" y="118" width="560" height="172" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V284A6 6 0 0 0 646 290H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Cross-tenant exposure</text>
<rect x="672" y="174" width="500" height="86" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one tenant sees another's data</text><text x="692" y="223" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a correctness and security problem</text><text x="692" y="248" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the one that ends companies</text>
<rect x="40" y="314" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="314" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="355" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">There is no error budget for showing one customer another customer's data.</text>
<rect x="40" y="404" width="560" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="440" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Can be adjusted and tuned over time</text>
<rect x="640" y="404" width="560" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="440" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Has to be correct by design</text>
<rect x="40" y="488" width="1160" height="74" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="488" width="5" height="74" rx="2.5" fill="#F28B9D"/><text x="64" y="518" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">A noisy neighbor incident is a bad day.</text><text x="64" y="544" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">A leak is a disclosure, a notification obligation, and a permanent change.</text>
<text x="66" y="628" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Detecting exposure after the fact is usually a customer email rather than an alert.</text>
</svg>