<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-label="A forward proxy sits in front of clients and speaks for them. A reverse proxy sits in front of servers and speaks for them. Load balancers and API gateways are both reverse proxies.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="560" fill="#FFFFFF"/>
  <rect x="40" y="60" width="570" height="380" rx="10" fill="none" stroke="#6D28D9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="62" y="44" width="163" height="32" rx="8" fill="#FFFFFF"/>
  <text x="143.5" y="67" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Forward proxy</text>
  <text x="325" y="112" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">sits in front of clients, and speaks for them</text>
  <rect x="65" y="157" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="197" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Client</text>
  <rect x="65" y="257" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="297" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Client</text>
  <rect x="285" y="201" width="190" height="78" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="380" y="247" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Forward proxy</text>
  <line x1="216" y1="190" x2="284" y2="214" stroke="#6D28D9" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="216" y1="290" x2="284" y2="266" stroke="#6D28D9" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="476" y1="240" x2="556" y2="240" stroke="#6D28D9" stroke-width="2" marker-end="url(#ar)"/>
  <text x="568" y="200" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the internet</text>
  <rect x="70" y="350" width="510" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="95" y="378" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Controls what the clients can reach.</text>
  <text x="95" y="406" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A company network filtering sites is one of these.</text>
  <rect x="630" y="60" width="570" height="380" rx="10" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="652" y="44" width="163" height="32" rx="8" fill="#FFFFFF"/>
  <text x="733.5" y="67" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reverse proxy</text>
  <text x="915" y="112" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">sits in front of servers, and speaks for them</text>
  <rect x="1025" y="157" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1100" y="197" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server</text>
  <rect x="1025" y="257" width="150" height="66" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1100" y="297" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server</text>
  <rect x="765" y="201" width="190" height="78" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="860" y="247" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reverse proxy</text>
  <line x1="956" y1="214" x2="1024" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <line x1="956" y1="266" x2="1024" y2="290" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <line x1="684" y1="240" x2="764" y2="240" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <text x="676" y="200" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the internet</text>
  <rect x="660" y="350" width="510" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="685" y="378" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Decides which server actually answers.</text>
  <text x="685" y="406" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The client thinks it is talking to one machine.</text>
  <rect x="40" y="470" width="1160" height="62" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="508" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Your load balancer and your API gateway are both reverse proxies. Forward proxies rarely appear in a backend design.</text>
</svg>