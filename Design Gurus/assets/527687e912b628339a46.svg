<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="656" viewBox="0 0 1240 656" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="twoq-title twoq-desc">
<title id="twoq-title">Two problems that get confused</title>
<desc id="twoq-desc">Replication answers where the data lives and how it stays durable. Agreement answers which node may accept writes right now. Single-leader replication solves the first and says nothing at all about the second.</desc>
<defs>
<marker id="twoq-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="twoq-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="twoq-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="twoq-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="656" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two problems that get confused</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Almost every distributed system has two separate questions to answer.</text>
<rect x="40" y="578" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="578" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="240" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V352A6 6 0 0 0 46 358H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Where is the data kept?</text>
<rect x="72" y="174" width="500" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">single-leader replication</text>
<rect x="72" y="240" width="500" height="96" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Durability, read scaling, and a</text><text x="92" y="294" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">straightforward consistency story.</text><text x="92" y="319" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">What almost every database does.</text>
<rect x="640" y="118" width="560" height="240" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V352A6 6 0 0 0 646 358H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Who may accept writes now?</text>
<rect x="672" y="174" width="500" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">consensus</text>
<rect x="672" y="240" width="500" height="96" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Nothing in the replication protocol</text><text x="692" y="294" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">decides which node is the primary.</text><text x="692" y="319" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">That decision belongs here.</text>
<rect x="40" y="382" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="382" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="417" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Replication moves the data. Consensus decides who is in charge.</text><text x="64" y="443" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Different problems, usually wanting different machinery.</text>
<rect x="40" y="490" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="490" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="527" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Most over-engineering here comes from answering both with one mechanism.</text>
<text x="66" y="612" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Single-leader replication gives you durability. It does not give you a decision.</text>
</svg>