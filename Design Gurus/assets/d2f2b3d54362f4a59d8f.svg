<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flow for any metric you could alert on: ask whether users feel it. Yes pages on call on error rate or latency against the SLO, and someone wakes up and acts. No goes to a dashboard only, for causes like CPU or queue depth, read after the page to find the cause.">
  <defs>
    <marker id="m06-l03-alert-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l03-alert-decision-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m06-l03-alert-decision-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m06-l03-alert-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <g filter="url(#m06-l03-alert-decision-soft)">
    <rect x="50" y="310" width="250" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="175" y="345" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A metric you could</text>
  <text x="175" y="377" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">alert on</text>
  <text x="175" y="409" text-anchor="middle" font-size="20" fill="#64748B">error rate, or CPU</text>
  <g filter="url(#m06-l03-alert-decision-soft)">
    <path d="M470,290 L620,370 L470,450 L320,370 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="470" y="377" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Do users feel it?</text>
  <text x="470" y="500" text-anchor="middle" font-size="20" fill="#64748B">SLO: the latency you promise users</text>

  <rect x="690" y="100" width="490" height="240" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="710" y="140" font-size="20" font-weight="600" fill="#B91C1C">Yes: this earns an interrupt</text>
  <text x="1160" y="172" text-anchor="end" font-size="20" fill="#64748B">symptoms, against an SLO</text>
  <g filter="url(#m06-l03-alert-decision-soft)">
    <rect x="710" y="200" width="450" height="120" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="935" y="235" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Page on call</text>
  <text x="935" y="267" text-anchor="middle" font-size="20" fill="#64748B">error rate or latency vs the SLO</text>
  <text x="935" y="299" text-anchor="middle" font-size="20" fill="#64748B">someone wakes up and acts</text>

  <rect x="690" y="420" width="490" height="240" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="710" y="460" font-size="20" font-weight="600" fill="#92400E">No: no interrupt</text>
  <text x="1160" y="492" text-anchor="end" font-size="20" fill="#64748B">cause paging drowns on-call in noise</text>
  <g filter="url(#m06-l03-alert-decision-soft)">
    <rect x="710" y="520" width="450" height="120" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="935" y="555" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Dashboard only</text>
  <text x="935" y="587" text-anchor="middle" font-size="20" fill="#64748B">CPU or queue depth</text>
  <text x="935" y="619" text-anchor="middle" font-size="20" fill="#64748B">read after the page</text>

  <g fill="none" stroke-width="2.5">
    <path d="M300,370 L312,370" stroke="#475569" stroke-width="2" marker-end="url(#m06-l03-alert-decision-sl)"/>
    <path d="M620,350 C660,350 665,260 702,260" stroke="#DC2626" marker-end="url(#m06-l03-alert-decision-rd)"/>
    <path d="M620,390 C660,390 665,580 702,580" stroke="#D97706" marker-end="url(#m06-l03-alert-decision-ab)"/>
  </g>

  <text x="598" y="300" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="598" y="455" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <line x1="60" y1="700" x2="96" y2="700" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="707" font-size="20" fill="#475569">Symptom path: users feel it, so it pages on call</text>
  <line x1="60" y1="740" x2="96" y2="740" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="747" font-size="20" fill="#475569">Cause path: dashboard only, read after the page</text>
</svg>