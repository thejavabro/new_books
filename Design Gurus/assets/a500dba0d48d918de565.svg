  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Advantages vs. limitations of serverless architecture</text>


  <rect x="40" y="120" width="560" height="1166" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Advantages</text>
  <rect x="640" y="120" width="560" height="1166" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#BE185D">Limitations</text>

  <g fill="none" stroke-width="2">

  </g>

