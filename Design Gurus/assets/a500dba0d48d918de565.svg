  <text x="128" y="242" font-size="21.5" font-weight="600" fill="#111827">No server management</text>
  <g filter="url(#m15o-soft)">
    <rect x="64" y="356" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
