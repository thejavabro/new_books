  <text x="128" y="710" font-size="21.5" font-weight="600" fill="#111827">Faster development</text>
  <g filter="url(#m15o-soft)">
    <rect x="64" y="824" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="824" width="6" height="70" fill="#059669" clip-path="url(#m15o-k5)"/>
