  <g transform="translate(91.56,848.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="128" y="866" font-size="21.5" font-weight="600" fill="#111827">Built-in availability</text>
  <g filter="url(#m15o-soft)">
    <rect x="664" y="200" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="200" width="6" height="70" fill="#DB2777" clip-path="url(#m15o-k6)"/>
  </g>
  <circle cx="702" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,224.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="728" y="242" font-size="21.5" font-weight="600" fill="#111827">Execution limits</text>
  <g filter="url(#m15o-soft)">
    <rect x="664" y="356" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="356" width="6" height="70" fill="#DB2777" clip-path="url(#m15o-k7)"/>
  </g>
  <circle cx="702" cy="391" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,380.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="728" y="398" font-size="21.5" font-weight="600" fill="#111827">Cold starts</text>
  <g filter="url(#m15o-soft)">
    <rect x="664" y="512" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="512" width="6" height="70" fill="#DB2777" clip-path="url(#m15o-k8)"/>
  </g>
  <circle cx="702" cy="547" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,536.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5"/></g>
  <text x="728" y="554" font-size="21.5" font-weight="600" fill="#111827">Harder local development and testing</text>
  <g filter="url(#m15o-soft)">
    <rect x="664" y="668" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="668" width="6" height="70" fill="#DB2777" clip-path="url(#m15o-k9)"/>
  </g>
  <circle cx="702" cy="703" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,692.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="728" y="710" font-size="21.5" font-weight="600" fill="#111827">Vendor coupling</text>
  <g filter="url(#m15o-soft)">
    <rect x="664" y="824" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="824" width="6" height="70" fill="#DB2777" clip-path="url(#m15o-k10)"/>
  </g>
  <circle cx="702" cy="859" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,848.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/></g>
  <text x="728" y="866" font-size="21.5" font-weight="600" fill="#111827">Complex debugging of distributed flows</text>
  <g filter="url(#m15o-soft)">
    <rect x="664" y="980" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="980" width="6" height="70" fill="#DB2777" clip-path="url(#m15o-k11)"/>
  </g>
  <circle cx="702" cy="1015" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,1004.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="728" y="1022" font-size="21.5" font-weight="600" fill="#111827">Cost at sustained scale</text>
  <g filter="url(#m15o-soft)">
    <rect x="664" y="1136" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="1136" width="6" height="70" fill="#DB2777" clip-path="url(#m15o-k12)"/>
  </g>
  <circle cx="702" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,1160.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="728" y="1178" font-size="21.5" font-weight="600" fill="#111827">Downstream pressure</text>
  <text x="320" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">Provider handles provisioning, patching,</text>
  <text x="320" y="326" font-size="18.5" text-anchor="middle" fill="#6B7280">and infrastructure maintenance.</text>
  <text x="320" y="455" font-size="18.5" text-anchor="middle" fill="#6B7280">Scales automatically based on demand,</text>
  <text x="320" y="482" font-size="18.5" text-anchor="middle" fill="#6B7280">from zero to high traffic.</text>
  <text x="320" y="611" font-size="18.5" text-anchor="middle" fill="#6B7280">You pay per request and for the time your</text>
  <text x="320" y="638" font-size="18.5" text-anchor="middle" fill="#6B7280">functions run, not for idle servers.</text>
  <text x="320" y="767" font-size="18.5" text-anchor="middle" fill="#6B7280">Focus on writing code and business logic</text>
  <text x="320" y="794" font-size="18.5" text-anchor="middle" fill="#6B7280">instead of managing infrastructure.</text>
  <text x="320" y="923" font-size="18.5" text-anchor="middle" fill="#6B7280">On AWS Lambda, functions run across several</text>
  <text x="320" y="950" font-size="18.5" text-anchor="middle" fill="#6B7280">availability zones by default.</text>
  <text x="920" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">Caps on time, memory, and payload size,</text>
  <text x="920" y="326" font-size="18.5" text-anchor="middle" fill="#6B7280">and no inbound connections.</text>
  <text x="920" y="455" font-size="18.5" text-anchor="middle" fill="#6B7280">Functions may take longer to start</text>
  <text x="920" y="482" font-size="18.5" text-anchor="middle" fill="#6B7280">when they have been idle.</text>
  <text x="920" y="611" font-size="18.5" text-anchor="middle" fill="#6B7280">Emulating cloud event sources and managed</text>
  <text x="920" y="638" font-size="18.5" text-anchor="middle" fill="#6B7280">services locally is imperfect.</text>
  <text x="920" y="767" font-size="18.5" text-anchor="middle" fill="#6B7280">Tightly coupled to the cloud provider's services</text>
  <text x="920" y="794" font-size="18.5" text-anchor="middle" fill="#6B7280">and event models.</text>
  <text x="920" y="923" font-size="18.5" text-anchor="middle" fill="#6B7280">Event chains across many small components</text>
  <text x="920" y="950" font-size="18.5" text-anchor="middle" fill="#6B7280">need disciplined tracing and correlation.</text>
  <text x="920" y="1079" font-size="18.5" text-anchor="middle" fill="#6B7280">High, constant throughput is often cheaper</text>
  <text x="920" y="1106" font-size="18.5" text-anchor="middle" fill="#6B7280">on provisioned infrastructure.</text>
  <text x="920" y="1235" font-size="18.5" text-anchor="middle" fill="#6B7280">Unbounded concurrency can overwhelm databases</text>
  <text x="920" y="1262" font-size="18.5" text-anchor="middle" fill="#6B7280">and APIs that cannot scale as quickly.</text>




</svg>