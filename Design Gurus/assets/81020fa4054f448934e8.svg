<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="794" viewBox="0 0 1240 794" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ladder-title ladder-desc">
<title id="ladder-title">The drill ladder</title>
<desc id="ladder-desc">Tabletop, component failover in test, component failover in production, announced full evacuation, then unannounced. Knowing which rung you have actually reached is more useful than claiming to have a plan.</desc>
<defs>
<marker id="ladder-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ladder-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ladder-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ladder-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="794" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The drill ladder</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Knowing which rung you have actually reached is more useful than claiming to have a plan.</text>
<rect x="40" y="716" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="716" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="1030" y="130" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">realism and risk</text>
<circle cx="60" cy="174" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="181" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="142" width="420" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="300" y="180" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Tabletop</text>
<rect x="530" y="142" width="480" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="167.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">walk the runbook out loud; an hour, no risk,</text><text x="550" y="192.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the first one always finds something</text>
<rect x="1030" y="160" width="170" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1030" y="160" width="35.2" height="28" rx="10" fill="#06AC80"/>
<circle cx="60" cy="246" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="253" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="214" width="420" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="300" y="252" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Component failover in test</text>
<rect x="530" y="214" width="480" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="239.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">confirms the mechanism</text><text x="550" y="264.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">where nothing is at stake</text>
<rect x="1030" y="232" width="170" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1030" y="232" width="64.5" height="28" rx="10" fill="#06AC80"/>
<circle cx="60" cy="318" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="325" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="286" width="420" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="300" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Component failover in production</text>
<rect x="530" y="286" width="480" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="311.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one service or shard, quiet window;</text><text x="550" y="336.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the first time anything is proven</text>
<rect x="1030" y="304" width="170" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1030" y="304" width="99.7" height="28" rx="10" fill="#E8BC60"/>
<circle cx="60" cy="390" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="397" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="358" width="420" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="300" y="396" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Full evacuation, announced</text>
<rect x="530" y="358" width="480" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="396" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">all traffic moved, with everybody expecting it</text>
<rect x="1030" y="376" width="170" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1030" y="376" width="134.8" height="28" rx="10" fill="#F25461"/>
<circle cx="60" cy="462" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="469" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="430" width="420" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="300" y="468" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Full evacuation, unannounced</text>
<rect x="530" y="430" width="480" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="550" y="455.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tests detection and the humans</text><text x="550" y="480.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">as well as the mechanism</text>
<rect x="1030" y="448" width="170" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1030" y="448" width="170.0" height="28" rx="10" fill="#F25461"/>
<rect x="40" y="514" width="1160" height="86" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="514" width="5" height="86" rx="2.5" fill="#F3CF6A"/><text x="64" y="548.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Most organizations are between two and three</text><text x="64" y="577.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">and describe themselves as being at four.</text>
<rect x="40" y="620" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="620" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="661" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A first drill at rung four is how a drill becomes an incident.</text>
<text x="66" y="750" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">And that is how an organization decides never to drill again.</text>
</svg>