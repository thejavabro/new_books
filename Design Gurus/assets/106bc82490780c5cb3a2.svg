<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same wide Printer interface is honest for AdvancedPrinter, which performs all four operations, but forces BasicPrinter to throw on three of them">
  <defs>
    <filter id="iod-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="iod-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="iod-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="iod-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <clipPath id="iod-top"><rect x="505" y="90" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="iod-b"><rect x="200" y="250" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="iod-a"><rect x="740" y="250" width="300" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>

  <rect x="40" y="40" width="1160" height="390" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One interface, two devices with very different abilities</text>

  <g fill="none" stroke-width="2.5">
    <path d="M620,180 V198 Q620,210 608,210 H362 Q350,210 350,222 V244" stroke="#DB2777" marker-end="url(#iod-pk)"/>
    <path d="M620,180 V198 Q620,210 632,210 H878 Q890,210 890,222 V244" stroke="#059669" marker-end="url(#iod-em)"/>
  </g>

  <g filter="url(#iod-lift)">
    <rect x="505" y="90" width="230" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="505" y="90" width="9" height="90" fill="#64748B" clip-path="url(#iod-top)"/>
  </g>
  <circle cx="545" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(534.56,124.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="571" y="142" font-size="18.5" font-weight="600" fill="#111827">Printer</text>

  <g filter="url(#iod-lift)">
    <rect x="200" y="250" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="200" y="250" width="9" height="90" fill="#DB2777" clip-path="url(#iod-b)"/>
  </g>
  <circle cx="240" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(229.56,284.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="266" y="302" font-size="18.5" font-weight="600" fill="#111827">BasicPrinter</text>
  <text x="350" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">it can only print</text>
  <text x="350" y="388" font-size="15.5" text-anchor="middle" fill="#BE185D">three of the four methods must throw</text>

  <g filter="url(#iod-soft)">
    <rect x="740" y="250" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="740" y="250" width="6" height="90" fill="#059669" clip-path="url(#iod-a)"/>
  </g>
  <circle cx="778" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,284.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="804" y="302" font-size="18.5" font-weight="600" fill="#111827">AdvancedPrinter</text>
  <text x="890" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">it prints, scans, faxes and staples</text>
  <text x="890" y="388" font-size="15.5" text-anchor="middle" fill="#047857">every method does real work</text>

  
  <rect x="40" y="460" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="484" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="506" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Fits the larger device</text>
  <text x="288" y="506" font-size="15.5" fill="#475569">the wide interface is honest here, because this machine really performs all four operations</text>
  <rect x="64" y="528" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="550" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Punishes the smaller one</text>
  <text x="288" y="550" font-size="15.5" fill="#475569">the device that needs least pays the most, so split the interface by what each caller uses</text>
</svg>