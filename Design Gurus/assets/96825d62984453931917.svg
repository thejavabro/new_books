<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1350" viewBox="0 0 1240 1350" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six kinds of lookup that must all be tenant-scoped: direct reads, updates and deletes; nested lists and cursors; search results; cache entries; event subscriptions and webhooks; and idempotency records. Each carries the cost of missing the tenant condition. A cursor created in one tenant is invalid in another, and a resource in another tenant returns the same 404 as a missing id.">
  <defs>
    <filter id="p1b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1b-k1"><rect x="76" y="146" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p1b-k2"><rect x="76" y="312" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p1b-k3"><rect x="76" y="478" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p1b-k4"><rect x="76" y="644" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p1b-k5"><rect x="76" y="810" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p1b-k6"><rect x="76" y="976" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p1b-kc"><rect x="40" y="1138" width="1160" height="64" rx="14"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1350" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Tenant scope is not only on reads</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">every one of these is resolved inside the tenant from the credential</text>

  
  <rect x="40" y="126" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1b-soft)">
    <rect x="76" y="146" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#DB2777" clip-path="url(#p1b-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Direct reads, updates, deletes</text>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">A missed condition is not a display bug; it discloses another customer.</text>

  
  <rect x="40" y="292" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1b-soft)">
    <rect x="76" y="312" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="312" width="6" height="90" fill="#DB2777" clip-path="url(#p1b-k2)"/>
  </g>
  <circle cx="114" cy="357" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,346.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="364" font-size="18.5" font-weight="600" fill="#111827">Nested lists and cursors</text>
  <text x="104" y="428" font-size="15.5" fill="#6B7280">A cursor from another tenant returns 400 invalid_cursor, even for a shared member.</text>

  
  <rect x="40" y="458" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1b-soft)">
    <rect x="76" y="478" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="478" width="6" height="90" fill="#DB2777" clip-path="url(#p1b-k3)"/>
  </g>
  <circle cx="114" cy="523" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,512.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="530" font-size="18.5" font-weight="600" fill="#111827">Search results</text>
  <text x="104" y="594" font-size="15.5" fill="#6B7280">Filtering after the fact is not the same as scoping the query.</text>

  
  <rect x="40" y="624" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1b-soft)">
    <rect x="76" y="644" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="644" width="6" height="90" fill="#DB2777" clip-path="url(#p1b-k4)"/>
  </g>
  <circle cx="114" cy="689" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,678.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="696" font-size="18.5" font-weight="600" fill="#111827">Cache entries</text>
  <text x="104" y="760" font-size="15.5" fill="#6B7280">A cache key without the tenant will serve the wrong customer.</text>

  
  <rect x="40" y="790" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1b-soft)">
    <rect x="76" y="810" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="810" width="6" height="90" fill="#DB2777" clip-path="url(#p1b-k5)"/>
  </g>
  <circle cx="114" cy="855" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,844.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="862" font-size="18.5" font-weight="600" fill="#111827">Event subscriptions and webhooks</text>
  <text x="104" y="926" font-size="15.5" fill="#6B7280">A registration belongs to one tenant and delivers only its events.</text>

  
  <rect x="40" y="956" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1b-soft)">
    <rect x="76" y="976" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="976" width="6" height="90" fill="#DB2777" clip-path="url(#p1b-k6)"/>
  </g>
  <circle cx="114" cy="1021" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1010.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="1028" font-size="18.5" font-weight="600" fill="#111827">Idempotency records</text>
  <text x="104" y="1092" font-size="15.5" fill="#6B7280">The scope becomes tenant plus caller plus operation plus key.</text>

  
  <rect x="40" y="1138" width="1160" height="64" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="40" y="1138" width="6" height="64" fill="#2563EB" clip-path="url(#p1b-kc)"/>
  <text x="72" y="1176" font-size="16.5" font-weight="600" fill="#1D4ED8">A resource in another tenant returns the same 404 as a missing id, so a typo looks like a bug.</text>

  
  <rect x="40" y="1234" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1279" text-anchor="middle" font-size="16" fill="#475569">Find the order where id matches AND tenant matches. Not: find by id, then check tenant if somebody remembers.</text>
</svg>