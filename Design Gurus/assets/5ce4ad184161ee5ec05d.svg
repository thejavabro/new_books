<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="686" viewBox="0 0 1240 686" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A point-in-time join takes the value from 6:01 PM for a 6:02 PM example and skips the value from 6:05 PM">
  <defs>
    <marker id="c2fpit-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="c2fpit-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2fpit-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2fpit-k1"><rect x="104" y="150" width="172" height="90" rx="12"/></clipPath>
    <clipPath id="c2fpit-k2"><rect x="554" y="150" width="172" height="90" rx="12"/></clipPath>
    <clipPath id="c2fpit-k3"><rect x="924" y="150" width="172" height="90" rx="12"/></clipPath>
    <clipPath id="c2fpit-k4"><rect x="520" y="384" width="240" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="686" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="248" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline store: orders in the kitchen</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M64,272 H1176"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M190,240 V272"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M640,240 V272"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1010,240 V272"/></g>
  <g fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 5"><path d="M780,124 V288"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M600,240 V384" marker-end="url(#c2fpit-memerald)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2" stroke-dasharray="6 5"><path d="M960,240 V417 Q960,429 948,429 H788"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2.5" stroke-linecap="round"><path d="M773,422 L787,436M787,422 L773,436"/></g>
  <g filter="url(#c2fpit-soft)">
    <rect x="104" y="150" width="172" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="104" y="150" width="6" height="90" fill="#D97706" clip-path="url(#c2fpit-k1)"/>
  </g>
  <circle cx="142" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(131.56,184.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="104" y="138" font-size="15.5" font-weight="600" fill="#6B7280">5:55 PM</text>
  <text x="168" y="202" font-size="18.5" font-weight="600" fill="#111827">6 orders</text>
  <g filter="url(#c2fpit-lift)">
    <rect x="554" y="150" width="172" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="554" y="150" width="9" height="90" fill="#059669" clip-path="url(#c2fpit-k2)"/>
  </g>
  <circle cx="592" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(581.56,184.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="554" y="138" font-size="15.5" font-weight="600" fill="#6B7280">6:01 PM</text>
  <text x="618" y="202" font-size="18.5" font-weight="600" fill="#111827">9 orders</text>
  <g filter="url(#c2fpit-soft)">
    <rect x="924" y="150" width="172" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="924" y="150" width="6" height="90" fill="#DB2777" clip-path="url(#c2fpit-k3)"/>
  </g>
  <circle cx="962" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(951.56,184.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="924" y="138" font-size="15.5" font-weight="600" fill="#6B7280">6:05 PM</text>
  <text x="988" y="202" font-size="18.5" font-weight="600" fill="#111827">14 orders</text>
  <g filter="url(#c2fpit-soft)">
    <rect x="520" y="384" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="520" y="384" width="6" height="90" fill="#7C3AED" clip-path="url(#c2fpit-k4)"/>
  </g>
  <circle cx="558" cy="429" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,418.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="584" y="436" font-size="18.5" font-weight="600" fill="#111827">Training example</text>
  <text x="640" y="499" font-size="15.5" text-anchor="middle" fill="#6B7280">the 6:02 PM order</text>
  <text x="640" y="522" font-size="15.5" text-anchor="middle" fill="#94A3B8">its label is 38 minutes</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="780" y="116" fill="#1D4ED8">prediction at 6:02 PM</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="588" y="345" fill="#047857">the latest value at or before 6:02 PM</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="974" y="345" fill="#BE185D">skipped: nobody knew it yet</text></g>
  <rect x="40" y="570" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="615" text-anchor="middle" font-size="16" fill="#475569">The join returns each feature value exactly as it was at that moment.</text>
</svg>