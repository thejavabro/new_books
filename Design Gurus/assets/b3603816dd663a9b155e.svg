<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The browser has a stored copy of the page with ETag v42. It asks the server whether the ETag has changed. The page has not changed, so the server replies 304 Not Modified with no body. The browser reuses its stored copy.">
  <defs>
    <filter id="ssc3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ssc3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ssc3-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ssc3-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ssc3-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ssc3-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="ssc3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Revalidating a client copy with an ETag</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Cache-Control: no-cache means "check with the server before reusing".</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#ssc3-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#ssc3-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#ssc3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ssc3-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ssc3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Browser has copy</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">ETag "v42",</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">about 100 KB</text>
  <g filter="url(#ssc3-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ssc3-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Asks if changed</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">sends the</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">ETag</text>
  <g filter="url(#ssc3-lift)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="646" y="140" width="9" height="90" fill="#059669" clip-path="url(#ssc3-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">304 Not Modified</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">a tiny reply,</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">no page body</text>
  <g filter="url(#ssc3-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#ssc3-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Reuse the copy</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">about 100 KB</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">not downloaded</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">ETag</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">a short identifier for one version of the content</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Saves</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">the download, but the browser still makes a round trip</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Hashed names</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">for static files: no check needed, a new version gets a new URL</text>
</svg>