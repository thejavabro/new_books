<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="678" viewBox="0 0 1240 678" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="scatter-title scatter-desc">
<title id="scatter-title">Scatter-gather and the tail</title>
<desc id="scatter-desc">A fan-out query finishes only when its slowest shard answers. If each shard exceeds its 99th percentile one time in a hundred, one shard is slow for one percent of requests, four shards for four percent, sixteen for fifteen percent and sixty four for forty seven percent.</desc>
<defs>
<marker id="scatter-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="scatter-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="scatter-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="scatter-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="678" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Scatter-gather and the tail</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A fan-out query finishes only when the slowest shard answers.</text>
<rect x="40" y="600" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="600" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Each shard independently exceeds its p99 one time in a hundred</text>
<text x="40" y="200" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Share of fan-out</text><text x="40" y="225" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">requests that are slow</text>
<rect x="325.0" y="388.0" width="150" height="16" rx="5" fill="#06AC80"/>
<text x="400" y="370" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">1%</text>
<rect x="565.0" y="388.0" width="150" height="16" rx="5" fill="#06AC80"/>
<text x="640" y="370" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">3.9%</text>
<rect x="805.0" y="344.4" width="150" height="59.599999999999994" rx="5" fill="#E8BC60"/>
<text x="880" y="326.4" font-size="20" font-weight="700" fill="#91642E" text-anchor="middle">14.9%</text>
<rect x="1045.0" y="214.4" width="150" height="189.6" rx="5" fill="#F25461"/>
<text x="1120" y="196.4" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">47.4%</text>
<path d="M300 404H1200" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><path d="M400 404V416" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="400" y="444" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">1 shard</text><path d="M640 404V416" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="640" y="444" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">4 shards</text><path d="M880 404V416" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="880" y="444" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">16 shards</text><path d="M1120 404V416" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="1120" y="444" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">64 shards</text>
<rect x="40" y="470" width="1160" height="104" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="470" width="5" height="104" rx="2.5" fill="#AC8BE8"/><text x="64" y="502" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">No shard got slower. The request simply has more chances to meet a slow one.</text><text x="64" y="528" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">To keep 1% of fan-outs slow across 16 shards, each shard must hold at its p99.94</text><text x="64" y="554" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the latency it used to hold at its p99.</text>
<text x="66" y="634" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This is why a design that needs routine cross-shard queries has the wrong shard key, not a tuning problem.</text>
</svg>