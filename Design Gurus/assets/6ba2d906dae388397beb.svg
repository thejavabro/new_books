<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-label="Closing the interview means answering two different questions: where the design runs out of room, and what happens when part of it dies.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="500" fill="#FFFFFF"/>
  <rect x="40" y="60" width="560" height="300" rx="10" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="62" y="44" width="273" height="32" rx="8" fill="#FFFFFF"/>
  <text x="198.5" y="67" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Where does it saturate?</text>
  <text x="76" y="126" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The single primary taking every write</text>
  <text x="76" y="164" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One shard holding a celebrity</text>
  <text x="76" y="202" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The cache, once the set outgrows memory</text>
  <rect x="76" y="272" width="488" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="100" y="304" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Name the number that takes it there</text>
  <text x="100" y="332" font-size="20" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">and what you would do about it.</text>
  <rect x="640" y="60" width="560" height="300" rx="10" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="662" y="44" width="306" height="32" rx="8" fill="#FFFFFF"/>
  <text x="815" y="67" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">What happens when it dies?</text>
  <text x="676" y="126" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Single points of failure</text>
  <text x="676" y="164" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">More than one of each thing</text>
  <text x="676" y="202" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A queue that is backing up</text>
  <text x="676" y="240" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A dependency that went slow, not down</text>
  <rect x="676" y="272" width="488" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="700" y="304" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reduced service or total stop?</text>
  <text x="700" y="332" font-size="20" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">And how would you know?</text>
  <rect x="40" y="396" width="1160" height="90" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="432" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Volunteering both before you are asked is one of the clearest seniority signals available to you.</text>
  <text x="70" y="464" font-size="20" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Most candidates present a design as though nothing ever fails and nothing ever fills up.</text>
</svg>