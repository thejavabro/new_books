<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="954" viewBox="0 0 1240 954" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five items joined into groups by pointing one root at another"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1240" height="954" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="602" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Each item points at a parent, and the root names the group</text>
<circle cx="70" cy="176" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="183" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">1</text>
<circle cx="150" cy="176" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="150" y="183" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">0</text>
<circle cx="246" cy="176" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="246" y="183" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">1</text>
<circle cx="342" cy="176" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="342" y="183" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">2</text>
<circle cx="438" cy="176" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="438" y="183" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">3</text>
<circle cx="534" cy="176" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="534" y="183" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">4</text>
<text x="640" y="166" font-size="22.5" font-weight="600" fill="#111827">everyone starts alone</text>
<text x="640" y="196" font-size="19.5" fill="#6B7280">five groups, each of size 1</text>
<circle cx="70" cy="304" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="311" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">2</text>
<circle cx="150" cy="304" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="150" y="311" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">0</text>
<circle cx="246" cy="304" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<text x="246" y="311" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">1</text>
<circle cx="342" cy="304" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="342" y="311" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">2</text>
<circle cx="438" cy="304" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="438" y="311" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">3</text>
<circle cx="534" cy="304" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="534" y="311" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">4</text>
<path d="M216.0,304.0 L188.0,304.0" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="640" y="294" font-size="22.5" font-weight="600" fill="#111827">union 0 and 1</text>
<text x="640" y="324" font-size="19.5" fill="#6B7280">1 now points at 0</text>
<circle cx="70" cy="432" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="439" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">3</text>
<circle cx="150" cy="432" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="150" y="439" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">0</text>
<circle cx="246" cy="432" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<text x="246" y="439" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">1</text>
<circle cx="342" cy="432" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<text x="342" y="439" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">2</text>
