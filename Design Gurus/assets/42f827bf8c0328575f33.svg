<path d="M216.0,560.0 L188.0,560.0" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M312.0,560.0 L188.0,560.0" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M504.0,560.0 L476.0,560.0" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="640" y="550" font-size="22.5" font-weight="600" fill="#111827">union 3 and 4</text>
<text x="640" y="580" font-size="19.5" fill="#6B7280">a second group forms, apart from the first</text>
<rect x="40" y="690" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="712" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="738" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">a root</text>
<text x="348" y="738" font-size="19.5" fill="#475569">it is its own parent, so it names a group</text>
<rect x="64" y="760" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="786" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">points at a parent</text>
<text x="348" y="786" font-size="19.5" fill="#475569">following the arrows reaches its root</text>
<rect x="64" y="808" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="834" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">union</text>
<text x="348" y="834" font-size="19.5" fill="#475569">find both roots, then point one at the other</text>
<rect x="64" y="856" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="882" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">same group</text>
<text x="348" y="882" font-size="19.5" fill="#475569">two items are together when find returns the same root</text>
</svg>