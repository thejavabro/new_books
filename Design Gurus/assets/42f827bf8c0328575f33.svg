<text x="438" y="439" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">3</text>
<circle cx="534" cy="432" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="534" y="439" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">4</text>
<path d="M216.0,432.0 L188.0,432.0" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<path d="M312.0,432.0 L188.0,432.0" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
<text x="640" y="422" font-size="22.5" font-weight="600" fill="#111827">union 1 and 2</text>
<text x="640" y="452" font-size="19.5" fill="#6B7280">find(1) is 0, so 2 points at 0</text>
<circle cx="70" cy="560" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="567" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">4</text>
<circle cx="150" cy="560" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="150" y="567" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">0</text>
<circle cx="246" cy="560" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<text x="246" y="567" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">1</text>
<circle cx="342" cy="560" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<text x="342" y="567" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">2</text>
<circle cx="438" cy="560" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="438" y="567" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">3</text>
