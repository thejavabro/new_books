<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="788" viewBox="0 0 1240 788" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="batching-title batching-desc">
<title id="batching-title">Where the throughput comes from</title>
<desc id="batching-desc">The scheduler is the most important component in a serving stack, and continuous batching plus a paged attention cache is the single biggest capacity decision.</desc>
<defs>
<marker id="batching-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="batching-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="batching-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="batching-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="788" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where the throughput comes from</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The scheduler is the most important component in a serving stack.</text>
<rect x="40" y="710" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="710" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="298" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V410A6 6 0 0 0 46 416H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Static batching</text>
<rect x="110" y="176" width="240" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="110" y="176" width="240.0" height="24" rx="10" fill="#159BEF"/>
<rect x="350" y="176" width="180" height="24" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="110" y="210" width="135" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="110" y="210" width="135.0" height="24" rx="10" fill="#159BEF"/>
<rect x="245" y="210" width="285" height="24" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="110" y="244" width="420" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="110" y="244" width="420.0" height="24" rx="10" fill="#159BEF"/>
<rect x="110" y="278" width="180" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="110" y="278" width="180.0" height="24" rx="10" fill="#159BEF"/>
<rect x="290" y="278" width="240" height="24" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="320" y="332" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the whole batch runs at the speed</text><text x="320" y="358" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">of the longest sequence</text>
<text x="320" y="392" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">the dashed part is idle capacity</text>
<rect x="640" y="118" width="560" height="298" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V410A6 6 0 0 0 646 416H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Continuous batching</text>
<rect x="710" y="176" width="240" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="710" y="176" width="240.0" height="24" rx="10" fill="#159BEF"/>
<rect x="710" y="210" width="135" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="710" y="210" width="135.0" height="24" rx="10" fill="#159BEF"/>
<rect x="710" y="244" width="420" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="710" y="244" width="420.0" height="24" rx="10" fill="#159BEF"/>
<rect x="710" y="278" width="180" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="710" y="278" width="180.0" height="24" rx="10" fill="#159BEF"/>
<rect x="950" y="176" width="180" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="950" y="176" width="180.0" height="24" rx="10" fill="#06AC80"/>
<rect x="845" y="210" width="285" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="845" y="210" width="285.0" height="24" rx="10" fill="#06AC80"/>
<text x="920" y="332" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the scheduling unit is one decode step</text>
<text x="920" y="392" font-size="19" font-weight="400" fill="#169B77" text-anchor="middle">freed slots admit waiting requests</text>
<rect x="40" y="440" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="440" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="481" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Reported gains over static batching are commonly cited at ten to twenty times.</text>
<rect x="40" y="534" width="372" height="150" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 534H46A6 6 0 0 0 40 540V678A6 6 0 0 0 46 684H54Z" fill="#AC8BE8"/>
<text x="226" y="578" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Paged attention cache</text>
<text x="226" y="614" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">fixed-size blocks on demand,</text><text x="226" y="639" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">instead of one block sized</text><text x="226" y="664" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">for the worst case</text>
<rect x="434" y="534" width="372" height="150" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 534H440A6 6 0 0 0 434 540V678A6 6 0 0 0 440 684H448Z" fill="#5EC9EC"/>
<text x="620" y="578" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Prefix caching</text>
<text x="620" y="614" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">reuse the computed cache of a</text><text x="620" y="639" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">shared prompt</text>
<rect x="828" y="534" width="372" height="150" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 534H834A6 6 0 0 0 828 540V678A6 6 0 0 0 834 684H842Z" fill="#F3CF6A"/>
<text x="1014" y="578" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Speculative decoding</text>
<text x="1014" y="614" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a draft model proposes, the</text><text x="1014" y="639" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">main model verifies</text>
<text x="66" y="744" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">It is a choice of serving framework rather than something you build.</text>
</svg>