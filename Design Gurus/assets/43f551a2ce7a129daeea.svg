<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="462" viewBox="0 0 1240 462" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A relational database usually grows in three steps: a bigger machine, then read replicas that serve reads while writes still go to one machine, then a sharding layer such as Vitess for MySQL or Citus for PostgreSQL. Many NoSQL stores spread data across nodes by key from the first day, so you add a node and the cluster moves data onto it.">
  <rect x="0" y="0" width="1240" height="462" fill="#FFFFFF"/>
  <defs>
    <marker id="sn4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="sn4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="sn4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="sn4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="sn4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="sn4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="sn4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="sn4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="sn4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">How each family grows</text>
  <text x="24" y="90" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="start">RELATIONAL</text>
  <g filter="url(#sn4-soft)"><rect x="40" y="112" width="260" height="110" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/></g>
  <text x="170" y="150" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">One machine</text>
  <text x="170" y="180" font-size="19" fill="#64748B" text-anchor="middle">where everything</text>
  <text x="170" y="206" font-size="19" fill="#64748B" text-anchor="middle">starts</text>
  <line x1="305" y1="167" x2="335" y2="167" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#sn4-b)"/>
  <g filter="url(#sn4-soft)"><rect x="340" y="112" width="260" height="110" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/></g>
  <text x="470" y="150" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">A bigger machine</text>
  <text x="470" y="180" font-size="19" fill="#64748B" text-anchor="middle">more CPU, memory,</text>
  <text x="470" y="206" font-size="19" fill="#64748B" text-anchor="middle">faster disk</text>
  <line x1="605" y1="167" x2="635" y2="167" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#sn4-b)"/>
  <g filter="url(#sn4-soft)"><rect x="640" y="112" width="260" height="110" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/></g>
  <text x="770" y="150" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">Read replicas</text>
  <text x="770" y="180" font-size="19" fill="#64748B" text-anchor="middle">copies that serve reads,</text>
  <text x="770" y="206" font-size="19" fill="#64748B" text-anchor="middle">writes go to one machine</text>
  <line x1="905" y1="167" x2="935" y2="167" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#sn4-b)"/>
  <g filter="url(#sn4-soft)"><rect x="940" y="112" width="260" height="110" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/></g>
  <text x="1070" y="150" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">A sharding layer</text>
  <text x="1070" y="180" font-size="19" fill="#64748B" text-anchor="middle">Vitess for MySQL,</text>
  <text x="1070" y="206" font-size="19" fill="#64748B" text-anchor="middle">Citus for PostgreSQL</text>
  <text x="24" y="272" font-size="21" font-weight="700" fill="#065F46" text-anchor="start">MANY NoSQL STORES</text>
  <rect x="40" y="290" width="1160" height="142" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="74" y="332" font-size="20" font-weight="600" fill="#065F46" text-anchor="start">Spread across nodes by key from the first day</text>
  <text x="74" y="364" font-size="19" fill="#64748B" text-anchor="start">You add a node, and the cluster moves data onto it.</text>
  <text x="74" y="394" font-size="19" fill="#64748B" text-anchor="start">You design the tables around your queries.</text>
  <rect x="605" y="322" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <line x1="617" y1="334" x2="703" y2="334" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="617" y1="362" x2="703" y2="362" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="660" y="400" font-size="18" fill="#64748B" text-anchor="middle">node 1</text>
  <rect x="735" y="322" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <line x1="747" y1="334" x2="833" y2="334" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="747" y1="362" x2="833" y2="362" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="790" y="400" font-size="18" fill="#64748B" text-anchor="middle">node 2</text>
  <rect x="865" y="322" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <line x1="877" y1="334" x2="963" y2="334" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="877" y1="362" x2="963" y2="362" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="920" y="400" font-size="18" fill="#64748B" text-anchor="middle">node 3</text>
  <text x="997" y="358" font-size="28" font-weight="700" fill="#065F46" text-anchor="middle">+</text>
  <rect x="1025" y="322" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="1080" y="400" font-size="18" fill="#065F46" text-anchor="middle">new node</text>
</svg>