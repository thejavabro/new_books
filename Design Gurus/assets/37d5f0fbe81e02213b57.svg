<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="390" viewBox="0 0 1240 390" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The window moves with each request, old timestamps fall out of the back and the count is always exact">
  <rect x="0" y="0" width="1240" height="390" fill="#FFFFFF"/>
  <defs>
    <marker id="rl6-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
  </defs>

  <g transform="translate(0,-60)">

  <rect x="520" y="150" width="600" height="150" rx="12" fill="#EFF6FF" fill-opacity="0.6" stroke="#3B82F6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="820" y="192" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">The window: the last 60 seconds</text>

  <line x1="60" y1="300" x2="1180" y2="300" stroke="#475569" stroke-width="2"/>

  <circle cx="120" cy="300" r="11" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="200" cy="300" r="11" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="280" cy="300" r="11" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="360" cy="300" r="11" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>

  <circle cx="560" cy="300" r="11" fill="#3B82F6"/>
  <circle cx="650" cy="300" r="11" fill="#3B82F6"/>
  <circle cx="740" cy="300" r="11" fill="#3B82F6"/>
  <circle cx="830" cy="300" r="11" fill="#3B82F6"/>
  <circle cx="920" cy="300" r="11" fill="#3B82F6"/>
  <circle cx="1010" cy="300" r="11" fill="#3B82F6"/>

  <text x="240" y="352" font-size="20" fill="#64748B" text-anchor="middle">older than the window</text>
  <text x="240" y="382" font-size="20" fill="#64748B" text-anchor="middle">dropped from the log</text>

  <text x="800" y="352" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">6 timestamps kept, so the count is 6</text>

  <line x1="1000" y1="225" x2="1105" y2="225" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rl6-blue)"/>
  <text x="1050" y="262" font-size="20" fill="#3B82F6" text-anchor="middle">slides</text>

  <text x="620" y="425" font-size="20" fill="#475569" text-anchor="middle">Exact, because the window moves with each request, at the cost of one stored timestamp per request</text>
  </g>
</svg>