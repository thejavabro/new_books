<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="696" viewBox="0 0 1240 696" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Why a vague operation description causes wrong calls. Three overlapping names give a model three indistinguishable choices, while a description that names when to use the operation and how it differs from its nearest neighbor makes the choice decidable.">
  <defs>
    <filter id="p23-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p23-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p23-k1"><rect x="72" y="194" width="396" height="48" rx="10"/></clipPath>
    <clipPath id="p23-k2"><rect x="72" y="314" width="396" height="48" rx="10"/></clipPath>
    <clipPath id="p23-k3"><rect x="72" y="434" width="396" height="48" rx="10"/></clipPath>
    <clipPath id="p23-k4"><rect x="562" y="186" width="606" height="90" rx="12"/></clipPath>
    <clipPath id="p23-k5"><rect x="562" y="366" width="606" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="696" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The description is now part of execution</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">same JSON, different calls</text>

  
  <rect x="40" y="126" width="460" height="404" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">A model sees three identical choices</text>

  <g filter="url(#p23-soft)">
    <rect x="72" y="194" width="396" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="194" width="6" height="48" fill="#DB2777" clip-path="url(#p23-k1)"/>
  </g>
  <circle cx="106" cy="218" r="4.5" fill="#DB2777"/>
  <text x="130" y="225" font-size="18.5" font-weight="600" fill="#111827">get_orders: Gets orders.</text>

  <g filter="url(#p23-soft)">
    <rect x="72" y="314" width="396" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="314" width="6" height="48" fill="#DB2777" clip-path="url(#p23-k2)"/>
  </g>
  <circle cx="106" cy="338" r="4.5" fill="#DB2777"/>
  <text x="130" y="345" font-size="18.5" font-weight="600" fill="#111827">find_orders: Finds orders.</text>

  <g filter="url(#p23-soft)">
    <rect x="72" y="434" width="396" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="434" width="6" height="48" fill="#DB2777" clip-path="url(#p23-k3)"/>
  </g>
  <circle cx="106" cy="458" r="4.5" fill="#DB2777"/>
  <text x="130" y="465" font-size="18.5" font-weight="600" fill="#111827">search_orders: Searches orders.</text>

  
  <rect x="530" y="126" width="670" height="404" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="554" y="156" font-size="16.5" font-weight="600" fill="#047857">A model can decide between these</text>

  <g filter="url(#p23-lift)">
    <rect x="562" y="186" width="606" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="562" y="186" width="9" height="90" fill="#059669" clip-path="url(#p23-k4)"/>
  </g>
  <circle cx="600" cy="231" r="18" fill="#FFFFFF"/>
  <g transform="translate(589.56,220.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="626" y="238" font-size="18.5" font-weight="600" fill="#111827">get_order</text>
  <text x="865" y="301" text-anchor="middle" font-size="15.5" fill="#6B7280">Use when the caller already has one exact order_id and needs the current order.</text>
  <text x="865" y="324" text-anchor="middle" font-size="15.5" fill="#94A3B8">Do not use it to discover an order from customer, date, or status.</text>

  <g filter="url(#p23-soft)">
    <rect x="562" y="366" width="606" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="562" y="366" width="6" height="90" fill="#059669" clip-path="url(#p23-k5)"/>
  </g>
  <circle cx="600" cy="411" r="18" fill="#FFFFFF"/>
  <g transform="translate(589.56,400.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="626" y="418" font-size="18.5" font-weight="600" fill="#111827">find_orders</text>
  <text x="865" y="481" text-anchor="middle" font-size="15.5" fill="#6B7280">Use when there is no order_id and orders must be found by customer, date, or status.</text>
  <text x="865" y="504" text-anchor="middle" font-size="15.5" fill="#94A3B8">Use get_order for complete detail after an id is known.</text>

  
  <rect x="40" y="556" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="596" text-anchor="middle" font-size="16" fill="#475569">Every agent-facing description says when to use it, and how it differs from the closest alternative.</text>
  <text x="620" y="624" text-anchor="middle" font-size="16" fill="#475569">Changing a description redirects calls even when the JSON is identical. That is a compatibility change.</text>
</svg>