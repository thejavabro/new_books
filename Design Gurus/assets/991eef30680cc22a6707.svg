<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="744" viewBox="0 0 1240 744" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shapes-title shapes-desc">
<title id="shapes-title">The shape decides the strategy</title>
<desc id="shapes-desc">Flat, daily-cycle and spiky load have different answers. The peak-to-average ratio summarizes the shape in one number and tells you whether the rest of the work is worth doing.</desc>
<defs>
<marker id="shapes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shapes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shapes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shapes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="744" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The shape decides the strategy</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The shape tells you which lever is worth pulling, and the three common shapes have different answers.</text>
<rect x="40" y="666" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="666" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="146" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Flat</text>
<rect x="40" y="174" width="372" height="150" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><polygon points="56.0,302.0 56.0,253.6 86.9,250.5 117.8,252.9 148.7,249.0 179.6,252.1 210.5,249.7 241.5,252.9 272.4,250.5 303.3,252.1 334.2,251.3 365.1,252.9 396.0,250.5 396.0,302.0" fill="#E7F7FE"/><polyline points="56.0,253.6 86.9,250.5 117.8,252.9 148.7,249.0 179.6,252.1 210.5,249.7 241.5,252.9 272.4,250.5 303.3,252.1 334.2,251.3 365.1,252.9 396.0,250.5" fill="none" stroke="#5EC9EC" stroke-width="2.5"/><path d="M56 239.6H396" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="392" y="227.6" font-size="19" font-weight="400" fill="#A83147" text-anchor="end">provisioned</text>
<rect x="40" y="336" width="372" height="44" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="365" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">peak to average</text><text x="396" y="365" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">about 1.5</text>
<rect x="40" y="392" width="372" height="86" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="60" y="416" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">autoscaling saves little; the</text><text x="60" y="441" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">lever is commitments and</text><text x="60" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rightsizing</text>
<rect x="434" y="118" width="372" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="146" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A daily cycle</text>
<rect x="434" y="174" width="372" height="150" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><polygon points="450.0,302.0 450.0,289.5 480.9,291.1 511.8,284.8 542.7,264.6 573.6,244.3 604.5,230.2 635.5,233.4 666.4,227.9 697.3,245.8 728.2,267.7 759.1,281.7 790.0,288.7 790.0,302.0" fill="#E8FCF3"/><polyline points="450.0,289.5 480.9,291.1 511.8,284.8 542.7,264.6 573.6,244.3 604.5,230.2 635.5,233.4 666.4,227.9 697.3,245.8 728.2,267.7 759.1,281.7 790.0,288.7" fill="none" stroke="#39D5AA" stroke-width="2.5"/><path d="M450 224.0H790" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="786" y="212" font-size="19" font-weight="400" fill="#A83147" text-anchor="end">provisioned</text>
<rect x="434" y="336" width="372" height="44" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="450" y="365" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">peak to average</text><text x="790" y="365" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">3 to 5</text>
<rect x="434" y="392" width="372" height="86" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="454" y="416" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">where autoscaling pays, roughly</text><text x="454" y="441" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the area under the curve you stop</text><text x="454" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">renting</text>
<rect x="828" y="118" width="372" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="146" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Spiky</text>
<rect x="828" y="174" width="372" height="150" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><polygon points="844.0,302.0 844.0,298.1 874.9,298.9 905.8,297.3 936.7,298.1 967.6,227.1 998.5,284.8 1029.5,298.1 1060.4,297.3 1091.3,233.4 1122.2,291.1 1153.1,298.1 1184.0,297.3 1184.0,302.0" fill="#FFF0F0"/><polyline points="844.0,298.1 874.9,298.9 905.8,297.3 936.7,298.1 967.6,227.1 998.5,284.8 1029.5,298.1 1060.4,297.3 1091.3,233.4 1122.2,291.1 1153.1,298.1 1184.0,297.3" fill="none" stroke="#F28B9D" stroke-width="2.5"/><path d="M844 224.0H1184" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="1180" y="212" font-size="19" font-weight="400" fill="#A83147" text-anchor="end">provisioned</text>
<rect x="828" y="336" width="372" height="44" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="844" y="365" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">peak to average</text><text x="1184" y="365" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">20 or more</text>
<rect x="828" y="392" width="372" height="86" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="848" y="416" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the spike arrives faster than</text><text x="848" y="441" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">capacity; queue it, or price per</text><text x="848" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">request</text>
<rect x="40" y="492" width="1160" height="70" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="492" width="5" height="70" rx="2.5" fill="#F3CF6A"/><text x="64" y="520" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The white space between the curve and the dashed line is what you rent and do not use</text><text x="64" y="546" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which is why the shape decides the strategy, before any tactic is chosen.</text>
<rect x="40" y="578" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="578" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="615" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Teams routinely build elaborate autoscaling for a flat workload, and save nothing.</text>
<text x="66" y="700" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Computing the ratio takes a few minutes and decides everything that follows.</text>
</svg>