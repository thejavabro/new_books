<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A coordination service such as ZooKeeper, etcd or Consul runs as a cluster of three nodes and provides configuration management, service discovery, leader election and distributed locks.">
  <defs>
    <filter id="cc4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cc4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cc4-k1"><rect x="90" y="180" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cc4-k2"><rect x="470" y="180" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cc4-k3"><rect x="850" y="180" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cc4-k4"><rect x="40" y="420" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cc4-k5"><rect x="343" y="420" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cc4-k6"><rect x="646" y="420" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cc4-k7"><rect x="949" y="420" width="250" height="90" rx="12"/></clipPath>
    <marker id="cc4-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">What a coordination service provides</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A small cluster that many servers trust for the tasks that are hard to build correctly.</text>

  <rect x="40" y="120" width="1160" height="200" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Coordination service, like ZooKeeper, etcd, or Consul</text>

  <g fill="none" stroke-width="2">
    <path d="M165,320 V420" stroke="#7C3AED" marker-end="url(#cc4-m-violet)"/>
    <path d="M468,320 V420" stroke="#7C3AED" marker-end="url(#cc4-m-violet)"/>
    <path d="M771,320 V420" stroke="#7C3AED" marker-end="url(#cc4-m-violet)"/>
    <path d="M1074,320 V420" stroke="#7C3AED" marker-end="url(#cc4-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#cc4-soft)">
    <rect x="90" y="180" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="90" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#cc4-k1)"/>
  </g>
  <circle cx="128" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="154" y="232" font-size="21.5" font-weight="600" fill="#111827">Node 1</text>
  <g filter="url(#cc4-soft)">
    <rect x="470" y="180" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#cc4-k2)"/>
  </g>
  <circle cx="508" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="534" y="232" font-size="21.5" font-weight="600" fill="#111827">Node 2</text>
  <g filter="url(#cc4-soft)">
    <rect x="850" y="180" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="850" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#cc4-k3)"/>
  </g>
  <circle cx="888" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="914" y="232" font-size="21.5" font-weight="600" fill="#111827">Node 3</text>
  <g filter="url(#cc4-soft)">
    <rect x="40" y="420" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="420" width="6" height="90" fill="#2563EB" clip-path="url(#cc4-k4)"/>
  </g>
  <circle cx="78" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,454.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="472" font-size="21.5" font-weight="600" fill="#111827">Configuration</text>
  <text x="165" y="539" font-size="18.5" text-anchor="middle" fill="#6B7280">one shared set of settings</text>
  <text x="165" y="566" font-size="18.5" text-anchor="middle" fill="#94A3B8">every server reads it</text>
  <g filter="url(#cc4-soft)">
    <rect x="343" y="420" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="420" width="6" height="90" fill="#2563EB" clip-path="url(#cc4-k5)"/>
  </g>
  <circle cx="381" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,454.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="407" y="472" font-size="21.5" font-weight="600" fill="#111827">Discovery</text>
  <text x="468" y="539" font-size="18.5" text-anchor="middle" fill="#6B7280">find healthy instances</text>
  <text x="468" y="566" font-size="18.5" text-anchor="middle" fill="#94A3B8">and their addresses</text>
  <g filter="url(#cc4-soft)">
    <rect x="646" y="420" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="646" y="420" width="6" height="90" fill="#2563EB" clip-path="url(#cc4-k6)"/>
  </g>
  <circle cx="684" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,454.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="710" y="472" font-size="21.5" font-weight="600" fill="#111827">Leader election</text>
  <text x="771" y="539" font-size="18.5" text-anchor="middle" fill="#6B7280">exactly one leader</text>
  <text x="771" y="566" font-size="18.5" text-anchor="middle" fill="#94A3B8">a new one if it crashes</text>
  <g filter="url(#cc4-soft)">
    <rect x="949" y="420" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="949" y="420" width="6" height="90" fill="#2563EB" clip-path="url(#cc4-k7)"/>
  </g>
  <circle cx="987" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,454.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="1013" y="472" font-size="21.5" font-weight="600" fill="#111827">Locks</text>
  <text x="1074" y="539" font-size="18.5" text-anchor="middle" fill="#6B7280">one holder at a time</text>
  <text x="1074" y="566" font-size="18.5" text-anchor="middle" fill="#94A3B8">released if it crashes</text>

  <rect x="40" y="610" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="635" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="660" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Quorum</text>
  <text x="323" y="660" font-size="18.5" fill="#475569">the nodes accept each change by majority vote, so one node can fail</text>
  <rect x="64" y="685" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="710" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Why use one</text>
  <text x="323" y="710" font-size="18.5" fill="#475569">these tasks are hard to build correctly, and bugs appear only under load</text>
</svg>