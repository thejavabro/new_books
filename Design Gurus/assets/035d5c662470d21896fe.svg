<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A message queue is a pipe between a producer and its workers; a service bus is a central hub that routes and transforms messages between many applications">
  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>
  <defs>
    <marker id="mc6-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="mc6-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="mc6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="490" rx="14" fill="#FFFBEB" fill-opacity="0.35" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Message queue: a pipe</text>

  <rect x="640" y="76" width="580" height="490" rx="14" fill="#F5F3FF" fill-opacity="0.35" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Service bus: a hub</text>

  
  <line x1="310" y1="170" x2="310" y2="204" stroke="#D97706" stroke-width="2" marker-end="url(#mc6-amber)"/>
  <line x1="250" y1="288" x2="160" y2="346" stroke="#D97706" stroke-width="2" marker-end="url(#mc6-amber)"/>
  <line x1="310" y1="292" x2="310" y2="346" stroke="#D97706" stroke-width="2" marker-end="url(#mc6-amber)"/>
  <line x1="370" y1="288" x2="460" y2="346" stroke="#D97706" stroke-width="2" marker-end="url(#mc6-amber)"/>

  <g filter="url(#mc6-soft)">
    <rect x="140" y="110" width="340" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="140" y="208" width="340" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="60" y="350" width="150" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="235" y="350" width="150" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="410" y="350" width="150" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="310" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="310" y="242" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Queue</text>
  <text x="310" y="272" font-size="20" fill="#92400E" text-anchor="middle">holds messages in order</text>
  <text x="135" y="384" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Worker</text>
  <text x="135" y="410" font-size="20" fill="#64748B" text-anchor="middle">one message</text>
  <text x="310" y="384" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Worker</text>
  <text x="310" y="410" font-size="20" fill="#64748B" text-anchor="middle">one message</text>
  <text x="485" y="384" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Worker</text>
  <text x="485" y="410" font-size="20" fill="#64748B" text-anchor="middle">one message</text>

  <text x="310" y="474" font-size="20" fill="#64748B" text-anchor="middle">The payload is opaque. No routing, no</text>
  <text x="310" y="504" font-size="20" fill="#64748B" text-anchor="middle">transformation. All logic sits in the services.</text>
  <text x="310" y="542" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Light to run, easy to scale</text>

  
  <line x1="790" y1="150" x2="880" y2="216" stroke="#7C3AED" stroke-width="2" marker-end="url(#mc6-violet)"/>
  <line x1="1070" y1="150" x2="980" y2="216" stroke="#7C3AED" stroke-width="2" marker-end="url(#mc6-violet)"/>
  <line x1="880" y1="330" x2="790" y2="390" stroke="#7C3AED" stroke-width="2" marker-end="url(#mc6-violet)"/>
  <line x1="980" y1="330" x2="1070" y2="390" stroke="#7C3AED" stroke-width="2" marker-end="url(#mc6-violet)"/>

  <g filter="url(#mc6-soft)">
    <rect x="680" y="110" width="200" height="60" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="980" y="110" width="200" height="60" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="790" y="220" width="280" height="110" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="680" y="394" width="200" height="60" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="980" y="394" width="200" height="60" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="780" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Orders (XML)</text>
  <text x="1080" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Inventory</text>
  <text x="930" y="258" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Service bus</text>
  <text x="930" y="288" font-size="20" fill="#5B21B6" text-anchor="middle">routes by content,</text>
  <text x="930" y="316" font-size="20" fill="#5B21B6" text-anchor="middle">converts formats, orchestrates</text>
  <text x="780" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Billing (JSON)</text>
  <text x="1080" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shipping</text>

  <text x="930" y="490" font-size="20" fill="#64748B" text-anchor="middle">The integration logic lives in the hub, not in</text>
  <text x="930" y="520" font-size="20" fill="#64748B" text-anchor="middle">any application that a team owns.</text>
  <text x="930" y="556" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Powerful, central, and a bottleneck</text>

  
  <text x="620" y="642" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Use the queue inside your own system. Use the bus when the real problem is joining many systems.</text>
</svg>