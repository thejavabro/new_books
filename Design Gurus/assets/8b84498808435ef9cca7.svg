<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="866" viewBox="0 0 1240 866" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The most important boundary in a streaming API: before 200 is sent the server can still return an ordinary status code, and after it is sent every outcome must be an event. Failures before admission carry no generated-token usage, while failures after admission carry final usage.">
  <defs>
    <filter id="p21-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p21-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p21-k1"><rect x="76" y="236" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p21-k2"><rect x="616" y="236" width="560" height="48" rx="10"/></clipPath>
    <clipPath id="p21-k3"><rect x="76" y="376" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p21-k4"><rect x="616" y="376" width="560" height="48" rx="10"/></clipPath>
    <clipPath id="p21-k5"><rect x="76" y="516" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p21-k6"><rect x="616" y="516" width="560" height="48" rx="10"/></clipPath>
    <clipPath id="p21-k7"><rect x="76" y="656" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p21-k8"><rect x="616" y="656" width="560" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="866" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Once 200 is sent, there is no second status code</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">four rows, one boundary</text>

  
  <rect x="76" y="124" width="500" height="42" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="100" y="151" font-size="16.5" font-weight="600" fill="#1D4ED8">Before 200</text>
  <rect x="616" y="124" width="560" height="42" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="640" y="151" font-size="16.5" font-weight="600" fill="#B45309">After 200</text>

  
  <rect x="40" y="186" width="1160" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="217" font-size="16.5" font-weight="600" fill="#475569">How a failure appears</text>

  <g filter="url(#p21-soft)">
    <rect x="76" y="236" width="500" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="236" width="6" height="48" fill="#2563EB" clip-path="url(#p21-k1)"/>
  </g>
  <circle cx="110" cy="260" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,251) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="134" y="267" font-size="18.5" font-weight="600" fill="#111827">An ordinary HTTP status</text>

  <g filter="url(#p21-lift)">
    <rect x="616" y="236" width="560" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="616" y="236" width="9" height="48" fill="#D97706" clip-path="url(#p21-k2)"/>
  </g>
  <circle cx="650" cy="260" r="15" fill="#FFFFFF"/>
  <g transform="translate(641,251) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="674" y="267" font-size="18.5" font-weight="600" fill="#111827">A response.failed event</text>

  
  <rect x="40" y="326" width="1160" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="357" font-size="16.5" font-weight="600" fill="#475569">The error body</text>

  <g filter="url(#p21-soft)">
    <rect x="76" y="376" width="500" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="376" width="6" height="48" fill="#2563EB" clip-path="url(#p21-k3)"/>
  </g>
  <circle cx="110" cy="400" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,391) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="134" y="407" font-size="18.5" font-weight="600" fill="#111827">The ordinary error object</text>

  <g filter="url(#p21-soft)">
    <rect x="616" y="376" width="560" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="616" y="376" width="6" height="48" fill="#D97706" clip-path="url(#p21-k4)"/>
  </g>
  <circle cx="650" cy="400" r="15" fill="#FFFFFF"/>
  <g transform="translate(641,391) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="674" y="407" font-size="18.5" font-weight="600" fill="#111827">The same error object, inside the event</text>

  
  <rect x="40" y="466" width="1160" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="497" font-size="16.5" font-weight="600" fill="#475569">Usage</text>

  <g filter="url(#p21-soft)">
    <rect x="76" y="516" width="500" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="516" width="6" height="48" fill="#2563EB" clip-path="url(#p21-k5)"/>
  </g>
  <circle cx="110" cy="540" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,531) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="134" y="547" font-size="18.5" font-weight="600" fill="#111827">No generated-token usage</text>

  <g filter="url(#p21-soft)">
    <rect x="616" y="516" width="560" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="616" y="516" width="6" height="48" fill="#D97706" clip-path="url(#p21-k6)"/>
  </g>
  <circle cx="650" cy="540" r="15" fill="#FFFFFF"/>
  <g transform="translate(641,531) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="674" y="547" font-size="18.5" font-weight="600" fill="#111827">Final observed usage, with a billing rule</text>

  
  <rect x="40" y="606" width="1160" height="120" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="637" font-size="16.5" font-weight="600" fill="#475569">The stream</text>

  <g filter="url(#p21-soft)">
    <rect x="76" y="656" width="500" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="656" width="6" height="48" fill="#2563EB" clip-path="url(#p21-k7)"/>
  </g>
  <circle cx="110" cy="680" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,671) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="134" y="687" font-size="18.5" font-weight="600" fill="#111827">None has begun</text>

  <g filter="url(#p21-soft)">
    <rect x="616" y="656" width="560" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="616" y="656" width="6" height="48" fill="#D97706" clip-path="url(#p21-k8)"/>
  </g>
  <circle cx="650" cy="680" r="15" fill="#FFFFFF"/>
  <g transform="translate(641,671) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="674" y="687" font-size="18.5" font-weight="600" fill="#111827">It has begun and must end in one terminal event</text>

  
  <rect x="40" y="750" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="795" text-anchor="middle" font-size="16" fill="#475569">So validate credential, scope, shape, limits, spend, and admission before opening the stream.</text>
</svg>