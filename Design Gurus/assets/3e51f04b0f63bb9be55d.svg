<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1540" viewBox="0 0 1240 1540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of a video upload. The creator client starts an upload of 1.5 GB with the Upload service, which returns a session id plus one presigned URL per part; the client PUTs the parts straight to object storage. Storage tells the Orchestrator the upload is complete for asset 913. The Orchestrator sends a probe task to the worker fleet, gets back 1080p source and 22 minutes, then fans out one task per rendition. Workers report 360p key ready and 720p key ready, and that the 4K task failed. The Orchestrator tells Assets the video is publishable with 360p and 720p, Assets emits an asset published event to Notifications, and Notifications tells the creator it is playable now with 4K still processing.">
  <defs>
    <marker id="m07-l08-transcode-sequence-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l08-transcode-sequence-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l08-transcode-sequence-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l08-transcode-sequence-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l08-transcode-sequence-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1540" fill="#FFFFFF"/>

  <rect x="40" y="250" width="1160" height="220" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="510" width="1160" height="430" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="980" width="1160" height="230" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="105" y1="195" x2="105" y2="1230"/>
    <line x1="275" y1="195" x2="275" y2="1230"/>
    <line x1="445" y1="195" x2="445" y2="1230"/>
    <line x1="615" y1="195" x2="615" y2="1230"/>
    <line x1="785" y1="195" x2="785" y2="1230"/>
    <line x1="955" y1="195" x2="955" y2="1230"/>
    <line x1="1125" y1="195" x2="1125" y2="1230"/>
  </g>

  <rect x="949" y="1075" width="12" height="60" rx="2" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>

  <g fill="none" stroke-width="2.5">
    <path d="M111,350 L269,350" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l08-transcode-sequence-bl)"/>
    <path d="M269,400 L111,400" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-transcode-sequence-bl)"/>
    <path d="M111,450 L439,450" stroke="#3B82F6" marker-end="url(#m07-l08-transcode-sequence-bl)"/>
    <path d="M451,610 L609,610" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l08-transcode-sequence-ab)"/>
    <path d="M621,660 L779,660" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l08-transcode-sequence-ab)"/>
    <path d="M779,710 L621,710" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-transcode-sequence-ab)"/>
    <path d="M621,760 L779,760" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l08-transcode-sequence-ab)"/>
    <path d="M779,810 L621,810" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-transcode-sequence-em)"/>
    <path d="M779,860 L621,860" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-transcode-sequence-em)"/>
    <path d="M779,910 L621,910" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m07-l08-transcode-sequence-rd)"/>
    <path d="M621,1080 L945,1080" stroke="#059669" marker-end="url(#m07-l08-transcode-sequence-em)"/>
    <path d="M961,1130 L1119,1130" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l08-transcode-sequence-ab)"/>
    <path d="M1119,1180 L111,1180" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-transcode-sequence-em)"/>
  </g>

  <text x="60" y="292" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Upload handshake: credentials out, then the bytes go straight to storage</text>
  <text x="60" y="552" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Pipeline: each message carries object keys, never the payload</text>
  <text x="1180" y="552" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">minutes per task</text>
  <text x="60" y="1022" font-size="20" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Publish: partial success, and the creator hears about it</text>
  <text x="1180" y="1022" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">partial success is normal</text>

  <text x="190" y="338" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. start an upload of 1.5 GB</text>
  <text x="190" y="388" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. a session id, one URL per part</text>
  <text x="275" y="438" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. PUT the parts straight to storage</text>
  <text x="530" y="598" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. upload complete for asset 913</text>
  <text x="700" y="648" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. probe task</text>
  <text x="700" y="698" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. 1080p source, 22 minutes</text>
  <text x="700" y="748" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">7. fan out one task per rendition</text>
  <text x="700" y="798" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">8. 360p key ready</text>
  <text x="700" y="848" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">9. 720p key ready</text>
  <text x="700" y="898" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">10. the 4K task failed</text>
  <text x="785" y="1068" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">11. publishable with 360p and 720p</text>
  <text x="1040" y="1118" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">12. asset published event</text>
  <text x="615" y="1168" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">13. playable now, 4K still processing</text>

  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="25" y="60" width="160" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="105" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Creator</text>
  <text x="105" y="148" text-anchor="middle" font-size="20" fill="#64748B">uploads, waits</text>
  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="195" y="60" width="160" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="275" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Upload</text>
  <text x="275" y="148" text-anchor="middle" font-size="20" fill="#64748B">issues URLs</text>
  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="365" y="60" width="160" height="130" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="445" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Storage</text>
  <text x="445" y="148" text-anchor="middle" font-size="20" fill="#64748B">holds bytes</text>
  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="535" y="60" width="160" height="130" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="615" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orchestrator</text>
  <text x="615" y="148" text-anchor="middle" font-size="20" fill="#64748B">the step graph</text>
  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="705" y="60" width="160" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="785" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Workers</text>
  <text x="785" y="148" text-anchor="middle" font-size="20" fill="#64748B">minutes each</text>
  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="875" y="60" width="160" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="955" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Assets</text>
  <text x="955" y="148" text-anchor="middle" font-size="20" fill="#64748B">publish state</text>
  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="1045" y="60" width="160" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1125" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="1125" y="148" text-anchor="middle" font-size="20" fill="#64748B">tells creators</text>

  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="50" y="680" width="310" height="200" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="205" y="723" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Deterministic keys</text>
  <text x="205" y="755" text-anchor="middle" font-size="20" fill="#5B21B6">assets/913/720p/</text>
  <text x="205" y="787" text-anchor="middle" font-size="20" fill="#5B21B6">segment_0042.ts</text>
  <text x="205" y="819" text-anchor="middle" font-size="20" fill="#64748B">so a retried step just</text>
  <text x="205" y="851" text-anchor="middle" font-size="20" fill="#64748B">overwrites itself</text>
  <g filter="url(#m07-l08-transcode-sequence-soft)">
    <rect x="50" y="1060" width="310" height="140" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="205" y="1105" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The row and the event</text>
  <text x="205" y="1137" text-anchor="middle" font-size="20" fill="#64748B">commit together, so they</text>
  <text x="205" y="1169" text-anchor="middle" font-size="20" fill="#64748B">can never disagree</text>

  <rect x="40" y="1260" width="1160" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="1315" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The asset went playable with two renditions while the third was still failing.</text>

  <line x1="60" y1="1400" x2="96" y2="1400" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1407" font-size="20" fill="#475569">A live call: the creator is waiting on this one</text>
  <line x1="60" y1="1440" x2="96" y2="1440" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1447" font-size="20" fill="#475569">An async event or a dispatched task: nobody waits</text>
  <line x1="60" y1="1480" x2="96" y2="1480" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1487" font-size="20" fill="#475569">A result: a rendition landed, so the asset can publish</text>
  <line x1="60" y1="1520" x2="96" y2="1520" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1527" font-size="20" fill="#475569">A result: the 4K rendition failed, optional and not fatal</text>
</svg>