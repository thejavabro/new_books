<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Choreography: Checkout publishes order placed, Inventory reserves stock and publishes stock reserved, Payments charges the card and publishes payment completed, Fulfillment starts packing. No coordinator owns the sequence, so asking where an order is stuck means correlating events across all four services.">
  <defs>
    <marker id="m03-l05-choreography-chain-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m03-l05-choreography-chain-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m03-l05-choreography-chain-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>

  <rect x="40" y="86" width="1160" height="250" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="124" font-size="20" font-weight="600" fill="#92400E">Choreography: the flow emerges from the subscriptions</text>
  <text x="1178" y="124" text-anchor="end" font-size="20" fill="#B91C1C">No coordinator: no service knows the whole flow</text>

  <rect x="310" y="380" width="620" height="140" rx="12" fill="#FEF2F2" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g fill="none">
    <path d="M306,225 L344,225" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l05-choreography-chain-am)"/>
    <path d="M606,225 L644,225" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l05-choreography-chain-am)"/>
    <path d="M906,225 L944,225" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l05-choreography-chain-am)"/>
    <g stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5">
      <path d="M350,376 C280,376 175,350 175,288" marker-end="url(#m03-l05-choreography-chain-red)"/>
      <path d="M460,376 C460,340 475,330 475,288" marker-end="url(#m03-l05-choreography-chain-red)"/>
      <path d="M780,376 C780,340 775,330 775,288" marker-end="url(#m03-l05-choreography-chain-red)"/>
      <path d="M890,376 C960,376 1075,350 1075,288" marker-end="url(#m03-l05-choreography-chain-red)"/>
    </g>
  </g>

  <g filter="url(#m03-l05-choreography-chain-soft)">
    <rect x="50" y="170" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="175" y="221" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="175" y="251" text-anchor="middle" font-size="20" fill="#64748B">publishes, does not wait</text>
  <g filter="url(#m03-l05-choreography-chain-soft)">
    <rect x="350" y="170" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="475" y="221" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="475" y="251" text-anchor="middle" font-size="20" fill="#64748B">reserves stock</text>
  <g filter="url(#m03-l05-choreography-chain-soft)">
    <rect x="650" y="170" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="775" y="221" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="775" y="251" text-anchor="middle" font-size="20" fill="#64748B">charges the card</text>
  <g filter="url(#m03-l05-choreography-chain-soft)">
    <rect x="950" y="170" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1075" y="221" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="1075" y="251" text-anchor="middle" font-size="20" fill="#64748B">starts packing</text>

  <text x="620" y="424" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Where is order 4711 stuck?</text>
  <text x="620" y="460" text-anchor="middle" font-size="20" fill="#B91C1C">One question, four places to look. Nothing records</text>
  <text x="620" y="492" text-anchor="middle" font-size="20" fill="#B91C1C">the sequence, so you correlate events across services.</text>

  
  <g font-size="20" text-anchor="middle" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="325" y="316">order placed</text>
    <text x="625" y="316">stock reserved</text>
    <text x="925" y="316">payment completed</text>
  </g>

  <line x1="50" y1="580" x2="86" y2="580" stroke="#D97706" stroke-width="4"/>
  <text x="98" y="587" font-size="20" fill="#475569">Asynchronous event: the publisher does not wait, subscribers react</text>
  <line x1="50" y1="620" x2="86" y2="620" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="98" y="627" font-size="20" fill="#475569">The invisible process: no single place records where an order stands</text>
</svg>