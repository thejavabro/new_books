<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Left: Orders and Dispatch both query the Orders tables in PostgreSQL, Dispatch with 14 direct queries, so moving Dispatch takes 3 engineers about 7 weeks and two teams must release in a fixed order. In both panels, a dashed cylinder marks the target of the move: a Dispatch database for the courier locations. Right: only Orders queries its tables and Dispatch calls the Orders interface, so the move takes 1 engineer about 1 week and only Dispatch changes.">
