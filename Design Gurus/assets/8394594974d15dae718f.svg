  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Moving Dispatch to its own database</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">An early decision about who reads which tables sets the cost of the move (figures are illustrative).</text>

