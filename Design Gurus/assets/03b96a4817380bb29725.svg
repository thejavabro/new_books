<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A waterfall chart dividing a 600 ms p95 target for placing an order: mobile network 150 ms, Orders validates the request 30 ms, Orders checks the cart and prices 50 ms, Orders writes to PostgreSQL 30 ms, Payments calls the payment provider 300 ms, and a 40 ms margin">
  <defs>
    <filter id="mf04a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mf04a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mf04a-k1"><rect x="40" y="180" width="430" height="56" rx="12"/></clipPath>
    <clipPath id="mf04a-k2"><rect x="40" y="256" width="430" height="56" rx="12"/></clipPath>
    <clipPath id="mf04a-k3"><rect x="40" y="332" width="430" height="56" rx="12"/></clipPath>
    <clipPath id="mf04a-k4"><rect x="40" y="408" width="430" height="56" rx="12"/></clipPath>
    <clipPath id="mf04a-k5"><rect x="40" y="484" width="430" height="56" rx="12"/></clipPath>
    <clipPath id="mf04a-k6"><rect x="40" y="560" width="430" height="56" rx="12"/></clipPath>
    <clipPath id="mf04a-k7"><rect x="40" y="660" width="430" height="56" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="750" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A latency budget for placing an order</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Illustrative allowances for each step, from tapping the order button to seeing the confirmation.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#mf04a-soft)">
    <rect x="40" y="180" width="430" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="180" width="6" height="56" fill="#64748B" clip-path="url(#mf04a-k1)"/>
  </g>
  <text x="60" y="215" font-size="18.5" font-weight="600" fill="#111827">Mobile network, both ways</text>
  <g filter="url(#mf04a-soft)">
    <rect x="40" y="256" width="430" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="256" width="6" height="56" fill="#2563EB" clip-path="url(#mf04a-k2)"/>
  </g>
  <text x="60" y="291" font-size="18.5" font-weight="600" fill="#111827">Orders validates the request</text>
  <g filter="url(#mf04a-soft)">
    <rect x="40" y="332" width="430" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="332" width="6" height="56" fill="#2563EB" clip-path="url(#mf04a-k3)"/>
  </g>
  <text x="60" y="367" font-size="18.5" font-weight="600" fill="#111827">Orders checks the cart and prices</text>
  <g filter="url(#mf04a-soft)">
    <rect x="40" y="408" width="430" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="408" width="6" height="56" fill="#2563EB" clip-path="url(#mf04a-k4)"/>
  </g>
  <text x="60" y="443" font-size="18.5" font-weight="600" fill="#111827">Orders writes to PostgreSQL</text>
  <g filter="url(#mf04a-soft)">
    <rect x="40" y="484" width="430" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="40" y="484" width="6" height="56" fill="#4F46E5" clip-path="url(#mf04a-k5)"/>
  </g>
  <text x="60" y="519" font-size="18.5" font-weight="600" fill="#111827">Payments calls the payment provider</text>
  <g filter="url(#mf04a-soft)">
    <rect x="40" y="560" width="430" height="56" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="560" width="6" height="56" fill="#059669" clip-path="url(#mf04a-k6)"/>
  </g>
  <text x="60" y="595" font-size="18.5" font-weight="600" fill="#111827">Margin for slow moments</text>
  <g filter="url(#mf04a-lift)">
    <rect x="40" y="660" width="430" height="56" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="40" y="660" width="9" height="56" fill="#DB2777" clip-path="url(#mf04a-k7)"/>
  </g>
  <text x="60" y="695" font-size="18.5" font-weight="600" fill="#111827">Target: p95 of 600 ms</text>
  <text x="500" y="124" font-size="18.5" font-weight="600" fill="#475569">Allowance within the 600 ms budget</text>
  <text x="500" y="156" font-size="17" text-anchor="middle" fill="#6B7280">0 ms</text>
  <text x="613.3" y="156" font-size="17" text-anchor="middle" fill="#6B7280">100</text>
  <text x="726.7" y="156" font-size="17" text-anchor="middle" fill="#6B7280">200</text>
  <text x="840" y="156" font-size="17" text-anchor="middle" fill="#6B7280">300</text>
  <text x="953.3" y="156" font-size="17" text-anchor="middle" fill="#6B7280">400</text>
  <text x="1066.7" y="156" font-size="17" text-anchor="middle" fill="#6B7280">500</text>
  <text x="1180" y="156" font-size="17" text-anchor="middle" fill="#6B7280">600</text>

  <line x1="500.0" y1="166" x2="500.0" y2="726" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="613.3" y1="166" x2="613.3" y2="726" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="726.7" y1="166" x2="726.7" y2="726" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="840.0" y1="166" x2="840.0" y2="726" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="953.3" y1="166" x2="953.3" y2="726" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1066.7" y1="166" x2="1066.7" y2="726" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1180.0" y1="166" x2="1180.0" y2="726" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="500.0" y="194" width="170.0" height="28" rx="4" fill="#64748B"/>
  <text x="680.0" y="214" text-anchor="start" font-size="18.5" font-weight="600" fill="#475569" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">150 ms</text>
  <rect x="670.0" y="270" width="34.0" height="28" rx="4" fill="#2563EB"/>
  <text x="714.0" y="290" text-anchor="start" font-size="18.5" font-weight="600" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">30 ms</text>
  <rect x="704.0" y="346" width="56.7" height="28" rx="4" fill="#2563EB"/>
  <text x="770.7" y="366" text-anchor="start" font-size="18.5" font-weight="600" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">50 ms</text>
  <rect x="760.7" y="422" width="34.0" height="28" rx="4" fill="#2563EB"/>
  <text x="804.7" y="442" text-anchor="start" font-size="18.5" font-weight="600" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">30 ms</text>
  <rect x="794.7" y="498" width="340.0" height="28" rx="4" fill="#4F46E5"/>
  <text x="964.7" y="518" text-anchor="middle" font-size="18.5" font-weight="600" fill="#FFFFFF">300 ms, half of the budget</text>
  <rect x="1134.7" y="574" width="45.3" height="28" rx="4" fill="#059669"/>
  <text x="1124.7" y="594" text-anchor="end" font-size="18.5" font-weight="600" fill="#047857" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke">40 ms</text>
  <rect x="500" y="674" width="680.0" height="28" rx="4" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="840" y="694" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">150 + 30 + 50 + 30 + 300 + 40 = 600 ms</text>


</svg>