  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">One rule, finite exceptions, computed occurrences</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one stored rule, two stored exceptions</text>

  
  <rect x="40" y="126" width="420" height="618" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
