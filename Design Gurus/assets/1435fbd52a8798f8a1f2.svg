<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="916" viewBox="0 0 1240 916" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One stored recurrence rule and two exceptions addressed by their original local starts. A bounded range expands them into occurrences: one is moved to a later hour, one is cancelled and omitted, and the rest are returned unchanged. No occurrence is stored as a row.">
  <defs>
    <marker id="p31-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
