  <circle cx="668" cy="674" r="4.5" fill="#059669"/>
  <text x="692" y="681" font-size="18.5" font-weight="600" fill="#111827">fifth Monday</text>
  <text x="901" y="718" text-anchor="middle" font-size="15.5" fill="#6B7280">16:00Z, returned unchanged</text>

  
  <rect x="40" y="776" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="818" text-anchor="middle" font-size="16" fill="#475569">No occurrence is stored. Each one is computed from the rule and its exceptions.</text>
  <text x="620" y="846" text-anchor="middle" font-size="16" fill="#475569">An exception keeps its original local start even after the occurrence moves.</text>
