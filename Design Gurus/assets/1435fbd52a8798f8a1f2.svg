  <circle cx="668" cy="330" r="4.5" fill="#059669"/>
  <text x="692" y="337" font-size="18.5" font-weight="600" fill="#111827">first Monday</text>
  <text x="901" y="374" text-anchor="middle" font-size="15.5" fill="#6B7280">16:00Z, returned unchanged</text>

