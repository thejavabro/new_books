<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sites in Frankfurt, Virginia, and Singapore all announce the IP address 198.51.100.53. A user in Paris reaches Frankfurt, a user in New York reaches Virginia, and a user in Tokyo reaches Singapore. If a site fails, users reach the next nearest site.">
  <defs>
    <filter id="dl3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dl3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="dl3-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dl3-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dl3-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dl3-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dl3-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dl3-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="dl3-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Anycast: one address, many sites</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every site announces 198.51.100.53. The network delivers each query to the nearest one.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Three sites, one shared IP address</text>

  <g fill="none" stroke-width="2">
    <path d="M124,430 V270" stroke="#2563EB" marker-end="url(#dl3-m-blue)"/>
    <path d="M510,430 V270" stroke="#2563EB" marker-end="url(#dl3-m-blue)"/>
    <path d="M896,430 V270" stroke="#2563EB" marker-end="url(#dl3-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#dl3-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#dl3-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Frankfurt</text>
  <text x="234" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">198.51.100.53</text>
  <g filter="url(#dl3-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#dl3-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">Virginia</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">198.51.100.53</text>
  <g filter="url(#dl3-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#dl3-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Singapore</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">198.51.100.53</text>
  <g filter="url(#dl3-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#dl3-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">User in Paris</text>
  <text x="234" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">reaches Frankfurt</text>
  <g filter="url(#dl3-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#64748B" clip-path="url(#dl3-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">User in New York</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">reaches Virginia</text>
  <g filter="url(#dl3-soft)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="836" y="430" width="6" height="90" fill="#64748B" clip-path="url(#dl3-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">User in Tokyo</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">reaches Singapore</text>

  <rect x="40" y="600" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Anycast</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">many servers share one IP address, and the network picks the nearest</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">If a site fails</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">it stops announcing the address, so users reach the next nearest site</text>
  <rect x="64" y="725" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="750" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Used by</text>
  <text x="323" y="750" font-size="18.5" fill="#475569">root servers, public resolvers like 1.1.1.1, and CDNs</text>
</svg>