  <text x="140" y="525" font-size="18.5" fill="#1F2937">Piece 5</text>
  <text x="140" y="573" font-size="18.5" fill="#1F2937">Piece 6</text>
  <text x="436" y="475" font-size="18.5" text-anchor="middle" fill="#374151">Piece 1: 2</text>
  <text x="436" y="502" font-size="18.5" text-anchor="middle" fill="#374151">Piece 2: 2</text>
  <text x="436" y="529" font-size="18.5" text-anchor="middle" fill="#374151">Piece 3: 2</text>
  <text x="646" y="475" font-size="18.5" text-anchor="middle" fill="#374151">Piece 2: 2</text>
  <text x="646" y="502" font-size="18.5" text-anchor="middle" fill="#374151">Piece 4: 2</text>
  <text x="646" y="529" font-size="18.5" text-anchor="middle" fill="#374151">Piece 5: 3</text>
  <text x="856" y="475" font-size="18.5" text-anchor="middle" fill="#374151">Piece 1: 2</text>
  <text x="856" y="502" font-size="18.5" text-anchor="middle" fill="#374151">Piece 4: 2</text>
  <text x="856" y="529" font-size="18.5" text-anchor="middle" fill="#374151">Piece 5: 3</text>
  <text x="1066" y="475" font-size="18.5" text-anchor="middle" fill="#B45309">Piece 3: 2</text>
  <text x="1066" y="502" font-size="18.5" text-anchor="middle" fill="#B45309">Piece 5: 3</text>
  <text x="1066" y="529" font-size="18.5" text-anchor="middle" fill="#B45309">Piece 6: 1</text>
  <text x="64" y="888" font-size="18.5" fill="#6B7280">The client uploads to the peers that give the highest download speed.</text>
  <text x="64" y="914" font-size="18.5" fill="#6B7280">This encourages peers to share with you.</text>
  <text x="620" y="1419" font-size="19.5" font-weight="600" text-anchor="middle" fill="#B45309">Peers that upload more to you get more data in return.</text>
  <text x="620" y="1447" font-size="19.5" font-weight="600" text-anchor="middle" fill="#B45309">Peers that do not share receive less data.</text>

