<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1530" viewBox="0 0 1240 1530" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two BitTorrent strategies. Rarest-first: a file is split into six pieces; Peer A holds pieces 1, 2, 3, Peer B holds 2, 4, 5, Peer C holds 1, 4, 5 and Peer D holds 3, 5, 6, so, by the client&#39;s count, pieces 1 to 4 are on two peers, piece 5 on three and piece 6 on only one; piece 6 is the rarest, so the client downloads it first. Tit-for-tat: the client downloads 500 KB/s from Peer A and uploads 50 KB/s to it, downloads 300 KB/s from Peer B and uploads 30 KB/s to it, and downloads 50 KB/s from Peer C while uploading little, 5 KB/s, to it; peers that upload more get more data in return">
