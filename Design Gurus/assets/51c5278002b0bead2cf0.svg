  <text x="1024" y="1322" font-size="21.5" font-weight="600" fill="#111827">Peer C</text>
  <text x="422" y="640" font-size="18.5" text-anchor="end" fill="#475569">The client counts the</text>
  <text x="422" y="666" font-size="18.5" text-anchor="end" fill="#475569">copies of each piece</text>
  <text x="64" y="176" font-size="18.5" fill="#6B7280">The client prefers to download the rarest available pieces first.</text>
  <text x="64" y="202" font-size="18.5" fill="#6B7280">This helps spread all pieces quickly across the network.</text>
  <text x="140" y="333" font-size="18.5" fill="#1F2937">Piece 1</text>
  <text x="140" y="381" font-size="18.5" fill="#1F2937">Piece 2</text>
