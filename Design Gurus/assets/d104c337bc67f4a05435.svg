<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Input records flow into a tester filter that checks a condition; records that pass go to valid records, and duplicate records are discarded">
  <defs>
    <filter id="m08g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m08g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m08g-k1"><rect x="40" y="170" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="m08g-k2"><rect x="420" y="170" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="m08g-k3"><rect x="920" y="170" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="m08g-k4"><rect x="920" y="345" width="280" height="90" rx="12"/></clipPath>
    <marker id="m08g-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m08g-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m08g-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Tester filter: pass or discard</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A tester checks each record against a condition and either passes it on or discards it.</text>



  <g fill="none" stroke-width="2">
    <path d="M310,215 H420" stroke="#64748B" marker-end="url(#m08g-m-slate)"/>
    <path d="M700,215 H920" stroke="#059669" marker-end="url(#m08g-m-emerald)"/>
    <path d="M670,260 V378 Q670,390 682,390 H920" stroke="#DB2777" marker-end="url(#m08g-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="810" y="203" fill="#047857">Pass</text>
    <text x="800" y="378" fill="#BE185D">Discard</text>
  </g>

  <g filter="url(#m08g-soft)">
    <rect x="40" y="170" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="170" width="6" height="90" fill="#2563EB" clip-path="url(#m08g-k1)"/>
  </g>
  <circle cx="78" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,204.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="104" y="222" font-size="21.5" font-weight="600" fill="#111827">Input records</text>
  <g filter="url(#m08g-lift)">
    <rect x="420" y="170" width="280" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="420" y="170" width="9" height="90" fill="#4F46E5" clip-path="url(#m08g-k2)"/>
  </g>
  <circle cx="458" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,204.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="484" y="222" font-size="21.5" font-weight="600" fill="#111827">Tester filter</text>
  <text x="560" y="289" font-size="18.5" text-anchor="middle" fill="#6B7280">check condition</text>
  <g filter="url(#m08g-soft)">
    <rect x="920" y="170" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="920" y="170" width="6" height="90" fill="#059669" clip-path="url(#m08g-k3)"/>
  </g>
  <circle cx="958" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(947.56,204.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="984" y="222" font-size="21.5" font-weight="600" fill="#111827">Valid records</text>
  <g filter="url(#m08g-soft)">
    <rect x="920" y="345" width="280" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="920" y="345" width="6" height="90" fill="#DB2777" clip-path="url(#m08g-k4)"/>
  </g>
  <circle cx="958" cy="390" r="18" fill="#FFFFFF"/>
  <g transform="translate(947.56,379.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="984" y="397" font-size="21.5" font-weight="600" fill="#111827">Duplicate records</text>




</svg>