<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In the normalized design, renaming the product is one update, and every order page shows the new name. In the denormalized design, the rename needs 40,000 updates, and if one copy is missed, the system stores two different names for the same product.">
  <defs>
    <filter id="nvd3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nvd3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nvd3-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nvd3-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nvd3-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nvd3-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nvd3-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nvd3-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="nvd3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Renaming a product in both designs</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">"Wireless Mouse" becomes "Wireless Mouse Pro".</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Normalized</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#BE185D">Denormalized</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#nvd3-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#nvd3-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#nvd3-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#nvd3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nvd3-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#nvd3-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Rename product</text>
  <g filter="url(#nvd3-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#059669" clip-path="url(#nvd3-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">1 update</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">in the products table</text>
  <g filter="url(#nvd3-lift)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="836" y="180" width="9" height="90" fill="#059669" clip-path="url(#nvd3-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Every page correct</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">nothing can be missed</text>
  <g filter="url(#nvd3-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#nvd3-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">Rename product</text>
  <g filter="url(#nvd3-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#nvd3-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">40,000 updates</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">one per order row</text>
  <g filter="url(#nvd3-soft)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="836" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#nvd3-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">One copy missed</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">two names for one product</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Drift</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">copies slowly stop agreeing, because some update was missed</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Not a copy</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">the price paid on an order is a separate fact, and should not change</text>
</svg>