<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="nohelp-title nohelp-desc">
<title id="nohelp-title">Where a second region does not help</title>
<desc id="nohelp-desc">If writes must reach a single home region, servers near the user do nothing for them. The honest description of that design is read replicas near users, which needs no active-active architecture.</desc>
<defs>
<marker id="nohelp-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="nohelp-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="nohelp-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="nohelp-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where a second region does not help</text>
<text x="40" y="86" font-size="21" fill="#4A5568">If writes must reach a single home region, placing servers near the user does nothing for them.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="300" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">user, far away</text>
<path d="M346 146H394" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 146H394" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nohelp-marker-green)"/>
<rect x="404" y="118" width="320" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="564" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">nearby region</text>
<path d="M730 146H846" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M730 146H846" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nohelp-marker-red)"/>
<rect x="856" y="118" width="300" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1006" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">home region</text>
<rect x="588" y="188" width="400" height="46" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="588" y="188" width="5" height="46" rx="2.5" fill="#F28B9D"/><text x="788" y="217" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">the write still crosses the ocean</text>
<rect x="40" y="256" width="1160" height="56" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="256" width="5" height="56" rx="2.5" fill="#AC8BE8"/><text x="64" y="290" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">All the second region improves is reads.</text>
<text x="40" y="348" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">So ask which operations are actually slow</text>
<rect x="40" y="366" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="402" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reads dominate, staleness tolerated</text>
<path d="M526 396H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 396H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nohelp-marker-slate)"/>
<rect x="570" y="366" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="402" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a read replica or a cache near the user is the entire answer</text>
<rect x="40" y="438" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="474" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The slow operations are writes</text>
<path d="M526 468H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 468H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nohelp-marker-slate)"/>
<rect x="570" y="438" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="461.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a second region helps only if writes for that user are</text><text x="590" y="486.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">owned there</text>
<rect x="40" y="510" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="546" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Static content and connection setup</text>
<path d="M526 540H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 540H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nohelp-marker-slate)"/>
<rect x="570" y="510" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="533.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which it very often is: a content delivery network,</text><text x="590" y="558.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no backend change</text>
<rect x="40" y="596" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="596" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="624" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Measure before deciding.</text><text x="64" y="650" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Timings split by geography usually show the backend round trip is the minority.</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The most common error here is buying a second region for latency and not getting any.</text>
</svg>