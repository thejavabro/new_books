<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six numbered steps: an HTTP request GET /orders/123 reaches the REST adapter, which converts it to an application call on the driving port, the interface method get_order; the use case inside the domain, beside its entities and business rules, calls the driven port, the repository method find_by_id; the database adapter implements the repository port and queries the database, which returns the order data">
  <defs>
    <filter id="m10f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m10f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m10f-k1"><rect x="40" y="130" width="350" height="90" rx="12"/></clipPath>
    <clipPath id="m10f-k2"><rect x="445" y="130" width="350" height="90" rx="12"/></clipPath>
    <clipPath id="m10f-k3"><rect x="850" y="130" width="350" height="90" rx="12"/></clipPath>
    <clipPath id="m10f-k4"><rect x="40" y="575" width="350" height="90" rx="12"/></clipPath>
    <clipPath id="m10f-k5"><rect x="445" y="575" width="350" height="90" rx="12"/></clipPath>
    <marker id="m10f-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a request flows through hexagonal architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The arrows follow one GET request from the client to the database; they show calls, not dependencies.</text>



  <g fill="none" stroke-width="2">
    <path d="M390,175 H445" stroke="#2563EB" marker-end="url(#m10f-m-blue)"/>
    <path d="M795,175 H850" stroke="#2563EB" marker-end="url(#m10f-m-blue)"/>
    <path d="M1175,220 V413 Q1175,425 1163,425 H940" stroke="#2563EB" marker-end="url(#m10f-m-blue)"/>
    <path d="M300,425 H77 Q65,425 65,437 V575" stroke="#2563EB" marker-end="url(#m10f-m-blue)"/>
    <path d="M390,620 H445" stroke="#2563EB" marker-end="url(#m10f-m-blue)"/>
    <path d="M795,620 H920" stroke="#2563EB" marker-end="url(#m10f-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m10f-soft)">
    <rect x="40" y="130" width="350" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#64748B" clip-path="url(#m10f-k1)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">1. HTTP request</text>
  <text x="215" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">GET /orders/123</text>
  <g filter="url(#m10f-soft)">
    <rect x="445" y="130" width="350" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="445" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#m10f-k2)"/>
  </g>
  <circle cx="483" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(472.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="509" y="182" font-size="21.5" font-weight="600" fill="#111827">2. REST adapter</text>
  <text x="620" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">converts HTTP request to</text>
  <text x="620" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">application call</text>
  <g filter="url(#m10f-soft)">
    <rect x="850" y="130" width="350" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="850" y="130" width="6" height="90" fill="#64748B" clip-path="url(#m10f-k3)"/>
  </g>
  <circle cx="888" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="914" y="182" font-size="21.5" font-weight="600" fill="#111827">3. Driving port (interface)</text>
  <g filter="url(#m10f-soft)">
    <rect x="40" y="575" width="350" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="575" width="6" height="90" fill="#64748B" clip-path="url(#m10f-k4)"/>
  </g>
  <circle cx="78" cy="620" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,609.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="104" y="627" font-size="21.5" font-weight="600" fill="#111827">4. Driven port (repository)</text>
  <g filter="url(#m10f-soft)">
    <rect x="445" y="575" width="350" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="445" y="575" width="6" height="90" fill="#2563EB" clip-path="url(#m10f-k5)"/>
  </g>
  <circle cx="483" cy="620" r="18" fill="#FFFFFF"/>
  <g transform="translate(472.56,609.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="509" y="627" font-size="21.5" font-weight="600" fill="#111827">5. Database adapter</text>
  <text x="620" y="694" font-size="18.5" text-anchor="middle" fill="#6B7280">implements the</text>
  <text x="620" y="721" font-size="18.5" text-anchor="middle" fill="#94A3B8">repository port</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M920,579 L920,659 A105,16 0 0 0 1130,659 L1130,579" fill="#DBEAFE"/>
    <ellipse cx="1025" cy="579" rx="105" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1025" y="634" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6. Database</text>
  <text x="1025" y="709" font-size="18.5" text-anchor="middle" fill="#6B7280">returns order data</text>

  <text x="1025" y="249" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#4B5563">get_order(order_id, ...)</text>
  <text x="215" y="694" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#4B5563">find_by_id(order_id)</text>
  <polygon points="300,425 360,320 880,320 940,425 880,530 360,530" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2" filter="url(#m10f-lift)"/>
  <text x="620" y="411" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Domain <tspan font-weight="400" font-size="18.5" fill="#4338CA">(business logic)</tspan></text>
  <rect x="351" y="437" width="150" height="36" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="426" y="461" text-anchor="middle" font-size="17" fill="#1F2937">Entities</text>
  <rect x="515" y="437" width="170" height="36" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="600" y="461" text-anchor="middle" font-size="17" fill="#1F2937">Business rules</text>
  <rect x="699" y="437" width="190" height="36" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="794" y="461" text-anchor="middle" font-size="17" fill="#1F2937">Use cases</text>


</svg>