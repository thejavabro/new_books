<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: Checkout charges a card with a 1 second timeout, the timeout fires at 1,000 ms and the caller gives up with the outcome unknown, the charge commits downstream at 1,200 ms, then a retry carrying an idempotency key is recognized as a duplicate so the card is charged once.">
  <defs>
    <marker id="m04-l02-timeout-ambiguity-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l02-timeout-ambiguity-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l02-timeout-ambiguity-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <filter id="m04-l02-timeout-ambiguity-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  
  <rect x="150" y="252" width="1030" height="220" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <rect x="150" y="500" width="1030" height="136" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="330" y1="104" x2="330" y2="650"/>
    <line x1="910" y1="104" x2="910" y2="650"/>
  </g>

  
  <text x="90" y="134" text-anchor="middle" font-size="12" fill="#64748B">time</text>
  <line x1="90" y1="146" x2="90" y2="628" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#m04-l02-timeout-ambiguity-sl)"/>

  
  <text x="172" y="278" font-size="13.5" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">The ambiguity window: the timeout fired, the outcome is unknown</text>
  <text x="1158" y="278" text-anchor="end" font-size="12" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">the caller cannot tell success from failure</text>

  <text x="172" y="526" font-size="13.5" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">Safe retry: idempotency makes the second attempt harmless</text>
  <text x="1158" y="526" text-anchor="end" font-size="12" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">doing it twice has the same effect as doing it once</text>

  
  <g fill="none">
    <path d="M338,170 L902,170" stroke="#3B82F6" stroke-width="2" marker-end="url(#m04-l02-timeout-ambiguity-bl)"/>
    <path d="M338,376 L884,376" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path d="M338,568 L902,568" stroke="#3B82F6" stroke-width="2" marker-end="url(#m04-l02-timeout-ambiguity-bl)"/>
    <path d="M904,620 L340,620" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m04-l02-timeout-ambiguity-em)"/>
  </g>

  
  <g stroke="#DC2626" stroke-width="2.5" stroke-linecap="round">
    <line x1="886" y1="368" x2="902" y2="384"/>
    <line x1="902" y1="368" x2="886" y2="384"/>
  </g>

  
  <rect x="324" y="162" width="12" height="84" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <g font-size="12" text-anchor="end" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="312" y="193">Checkout blocks</text>
    <text x="312" y="209">for up to 1,000 ms</text>
  </g>

  
  <g font-size="12" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="620" y="158" fill="#1E40AF">Charge card, 1 second timeout</text>
    <text x="620" y="364" fill="#B91C1C">Caller gives up, outcome unknown</text>
    <text x="620" y="556" fill="#1E40AF">Retry carrying an idempotency key</text>
    <text x="620" y="608" fill="#065F46">Recognized as a duplicate, charged once</text>
  </g>

  
  <g filter="url(#m04-l02-timeout-ambiguity-soft)">
    <rect x="175" y="290" width="310" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="330" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#B91C1C">Timeout fires at 1,000 ms</text>
  <text x="330" y="337" text-anchor="middle" font-size="12" fill="#64748B">the call is marked failed at the deadline</text>

  <g filter="url(#m04-l02-timeout-ambiguity-soft)">
    <rect x="755" y="394" width="310" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="910" y="420" text-anchor="middle" font-size="13" font-weight="600" fill="#065F46">The charge commits at 1,200 ms</text>
  <text x="910" y="441" text-anchor="middle" font-size="12" fill="#64748B">the work finished after the caller left</text>

  
  <g filter="url(#m04-l02-timeout-ambiguity-soft)">
    <rect x="230" y="40" width="200" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="330" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="330" y="88" text-anchor="middle" font-size="12" fill="#64748B">caller, 1 second timeout</text>

  <g filter="url(#m04-l02-timeout-ambiguity-soft)">
    <rect x="810" y="40" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="910" y="67" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Payments</text>
  <text x="910" y="88" text-anchor="middle" font-size="12" fill="#64748B">median 50 ms, p99 400 ms</text>

  
  <g stroke-width="3" fill="none">
    <line x1="150" y1="700" x2="178" y2="700" stroke="#3B82F6"/>
    <line x1="430" y1="700" x2="458" y2="700" stroke="#DC2626" stroke-dasharray="6 5"/>
    <line x1="800" y1="700" x2="828" y2="700" stroke="#059669" stroke-dasharray="6 5"/>
  </g>
  <text x="186" y="704" font-size="12.5" fill="#475569">Synchronous call, the caller is waiting</text>
  <text x="466" y="704" font-size="12.5" fill="#475569">Timeout fires, the caller abandons the call</text>
  <text x="836" y="704" font-size="12.5" fill="#475569">Reply on the retry, recognized as a duplicate</text>
</svg>