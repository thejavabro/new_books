<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram for one service instance: it starts, becomes Ready when the readiness probe passes, moves out of the load-balancing pool and back again when readiness fails and then recovers, and is killed and replaced when the liveness probe fails.">
  <defs>
    <marker id="m06-l04-probe-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l04-probe-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m06-l04-probe-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m06-l04-probe-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <rect x="440" y="120" width="740" height="280" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="460" y="160" font-size="20" font-weight="600" fill="#1E3A8A">Readiness moves traffic</text>
  <text x="1160" y="160" text-anchor="end" font-size="20" fill="#64748B">reversible: the process stays alive</text>
  <rect x="440" y="430" width="740" height="250" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="460" y="650" font-size="20" font-weight="600" fill="#B91C1C">Liveness ends processes</text>
  <text x="1160" y="650" text-anchor="end" font-size="20" fill="#64748B">one way: it never comes back</text>

  <g filter="url(#m06-l04-probe-states-soft)">
    <rect x="130" y="230" width="260" height="120" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="260" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Starting</text>
  <text x="260" y="297" text-anchor="middle" font-size="20" fill="#64748B">process is up,</text>
  <text x="260" y="329" text-anchor="middle" font-size="20" fill="#64748B">not in the pool yet</text>
  <g filter="url(#m06-l04-probe-states-soft)">
    <rect x="470" y="230" width="280" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="610" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Ready</text>
  <text x="610" y="297" text-anchor="middle" font-size="20" fill="#64748B">in the load-balancing pool</text>
  <text x="610" y="329" text-anchor="middle" font-size="20" fill="#64748B">serving live traffic</text>
  <g filter="url(#m06-l04-probe-states-soft)">
    <rect x="880" y="230" width="280" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1020" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Out of pool</text>
  <text x="1020" y="297" text-anchor="middle" font-size="20" fill="#64748B">process still alive,</text>
  <text x="1020" y="329" text-anchor="middle" font-size="20" fill="#64748B">no traffic sent to it</text>
  <g filter="url(#m06-l04-probe-states-soft)">
    <rect x="470" y="480" width="280" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="610" y="531" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Killed</text>
  <text x="610" y="563" text-anchor="middle" font-size="20" fill="#64748B">the process is destroyed</text>

  <g fill="none" stroke-width="2.5">
    <path d="M83,290 L122,290" stroke="#475569" stroke-width="2" marker-end="url(#m06-l04-probe-states-sl)"/>
    <path d="M390,290 L462,290" stroke="#059669" marker-end="url(#m06-l04-probe-states-em)"/>
    <path d="M750,265 L872,265" stroke="#DC2626" stroke-width="2" marker-end="url(#m06-l04-probe-states-rd)"/>
    <path d="M872,315 L750,315" stroke="#059669" stroke-width="2" marker-end="url(#m06-l04-probe-states-em)"/>
    <path d="M610,350 L610,472" stroke="#DC2626" marker-end="url(#m06-l04-probe-states-rd)"/>
    <path d="M750,540 L872,540" stroke="#DC2626" stroke-width="2" marker-end="url(#m06-l04-probe-states-rd)"/>
  </g>

  <circle cx="70" cy="290" r="13" fill="#475569"/>
  <text x="70" y="340" text-anchor="middle" font-size="20" fill="#64748B">new instance</text>
  <circle cx="890" cy="540" r="15" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/>
  <circle cx="890" cy="540" r="8" fill="#DC2626"/>
  <text x="925" y="547" font-size="20" fill="#B91C1C">a fresh copy starts</text>

  <text x="426" y="205" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">readiness passes</text>
  <text x="811" y="205" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">readiness fails</text>
  <text x="811" y="385" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">it recovers</text>
  <text x="626" y="412" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">liveness fails</text>

  <line x1="60" y1="720" x2="96" y2="720" stroke="#059669" stroke-width="4"/>
  <text x="108" y="727" font-size="20" fill="#475569">Probe passes: the instance is in the pool and serving traffic</text>
  <line x1="60" y1="760" x2="96" y2="760" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="767" font-size="20" fill="#475569">Probe fails: readiness stops traffic, liveness ends the process</text>
</svg>