<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cdc-title cdc-desc">
<title id="cdc-title">Invalidation from the change stream</title>
<desc id="cdc-desc">Writer-side invalidation requires every writer to participate, which migrations and administrative tools do not. Reading the database change log turns every committed change into a cache deletion regardless of who made it.</desc>
<defs>
<marker id="cdc-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="cdc-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="cdc-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="cdc-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="750" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Invalidation from the change stream</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The alternative is to derive invalidation from the data change itself.</text>
<rect x="40" y="672" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="672" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="560" height="252" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V364A6 6 0 0 0 46 370H54Z" fill="#F3CF6A"/><text x="70" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Invalidation in the writer</text>
<rect x="72" y="172" width="220" height="42" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="182" y="199" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Service A</text>
<text x="312" y="200" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">remembers to invalidate</text>
<rect x="72" y="218" width="220" height="42" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="182" y="245" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Migration</text>
<text x="312" y="246" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">does not</text>
<rect x="72" y="264" width="220" height="42" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="182" y="291" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Admin console</text>
<text x="312" y="292" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">does not</text>
<rect x="72" y="310" width="220" height="42" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="182" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Someone with psql</text>
<text x="312" y="338" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">does not</text>
<rect x="640" y="118" width="560" height="252" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V364A6 6 0 0 0 646 370H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Invalidation from the change stream</text>
<rect x="672" y="186" width="156" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="750" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Database log</text>
<path d="M834 214H868" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M834 214H868" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cdc-marker-slate)"/>
<rect x="872" y="186" width="168" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="956" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Change stream</text>
<path d="M1046 214H1080" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1046 214H1080" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cdc-marker-slate)"/>
<rect x="1084" y="186" width="88" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1128" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">delete</text>
<rect x="672" y="266" width="500" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="301.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every committed change invalidates,</text><text x="692" y="326.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">whoever made it</text>
<text x="40" y="408" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What follows from reading the log</text>
<rect x="40" y="426" width="372" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="462" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Fires after commit</text>
<text x="226" y="516" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">so it cannot repopulate from an</text><text x="226" y="541" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">uncommitted read</text>
<rect x="434" y="426" width="372" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="448.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">At least once,</text><text x="620" y="475.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">so a restart replays</text>
<text x="620" y="516" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">harmless for a deletion,</text><text x="620" y="541" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">wrong for a value</text>
<rect x="828" y="426" width="372" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="448.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Lag of hundreds of</text><text x="1014" y="475.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">milliseconds or worse</text>
<text x="1014" y="516" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">and a stalled consumer silently</text><text x="1014" y="541" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">stops invalidating</text>
<rect x="40" y="568" width="1160" height="78" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="568" width="5" height="78" rx="2.5" fill="#AC8BE8"/><text x="64" y="598.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A stalled consumer degrades you to the expiry guarantee,</text><text x="64" y="627.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">which is why expiry stays underneath.</text>
<text x="66" y="706" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Deletions survive duplication and reordering. The same stream carrying new values would not.</text>
</svg>