<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The gateway&#39;s strengths and its costs both follow from being the single place all traffic passes through">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <filter id="ag6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="62" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">One place for all traffic, read two ways</text>

  <rect x="20" y="88" width="580" height="332" rx="14" fill="#ECFDF5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="128" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Because everything passes through it</text>

  <rect x="640" y="88" width="580" height="332" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="128" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Because everything passes through it</text>

  <g filter="url(#ag6-soft)">
    <rect x="44" y="152" width="532" height="58" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="44" y="222" width="532" height="58" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="44" y="292" width="532" height="58" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="44" y="362" width="532" height="42" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

    <rect x="664" y="152" width="532" height="58" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="664" y="222" width="532" height="58" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="664" y="292" width="532" height="58" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="664" y="362" width="532" height="42" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <text x="310" y="188" font-size="20" fill="#065F46" text-anchor="middle">Security and policy enforced in one place</text>
  <text x="310" y="258" font-size="20" fill="#065F46" text-anchor="middle">Routing, caching and transformation in one place</text>
  <text x="310" y="328" font-size="20" fill="#065F46" text-anchor="middle">Metrics and logs for every request</text>
  <text x="310" y="390" font-size="20" fill="#065F46" text-anchor="middle">Clients see one simple interface</text>

  <text x="930" y="188" font-size="20" fill="#991B1B" text-anchor="middle">One outage can affect the entire system</text>
  <text x="930" y="258" font-size="20" fill="#991B1B" text-anchor="middle">One more hop in every request path</text>
  <text x="930" y="328" font-size="20" fill="#991B1B" text-anchor="middle">Configuration complexity, and cost</text>
  <text x="930" y="390" font-size="20" fill="#991B1B" text-anchor="middle">A managed service means lock-in</text>

  <text x="620" y="452" font-size="20" fill="#475569" text-anchor="middle">The same sentence heads both columns, which is the whole trade</text>
</svg>