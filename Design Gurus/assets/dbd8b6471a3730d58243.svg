<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="URLs such as https://example.com/logo.png and ftp://files.example.com/report.pdf describe where a resource is. URNs such as urn:isbn:0451450523 and a UUID URN name a resource, and need a resolver to find a current copy.">
  <defs>
    <filter id="ur3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ur3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ur3-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ur3-k2"><rect x="64" y="330" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ur3-k3"><rect x="654" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ur3-k4"><rect x="654" y="330" width="522" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Locating a resource, and naming it</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A URL says where a resource is. A URN says what it is.</text>

  <rect x="40" y="120" width="570" height="370" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">URLs: where it is</text>
  <rect x="630" y="120" width="570" height="370" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#047857">URNs: what it is</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ur3-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#ur3-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">https://example.com/logo.png</text>
  <text x="325" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">an image on a web server</text>
  <g filter="url(#ur3-soft)">
    <rect x="64" y="330" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#ur3-k2)"/>
  </g>
  <circle cx="102" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="128" y="382" font-size="21.5" font-weight="600" fill="#111827">ftp://files.example.com/a.pdf</text>
  <text x="325" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">a file on an FTP server</text>
  <g filter="url(#ur3-soft)">
    <rect x="654" y="180" width="522" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="654" y="180" width="6" height="90" fill="#059669" clip-path="url(#ur3-k3)"/>
  </g>
  <circle cx="692" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="718" y="232" font-size="21.5" font-weight="600" fill="#111827">urn:isbn:0451450523</text>
  <text x="915" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">a book, by its ISBN</text>
  <g filter="url(#ur3-soft)">
    <rect x="654" y="330" width="522" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="654" y="330" width="6" height="90" fill="#059669" clip-path="url(#ur3-k4)"/>
  </g>
  <circle cx="692" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,364.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="718" y="382" font-size="21.5" font-weight="600" fill="#111827">urn:uuid:6e8bc430-9c3a-...</text>
  <text x="915" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">any object, by its UUID</text>

  <rect x="40" y="520" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="545" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="570" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">If it moves</text>
  <text x="323" y="570" font-size="18.5" fill="#475569">a URL can break, because it describes where the resource was</text>
  <rect x="64" y="595" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Resolver</text>
  <text x="323" y="620" font-size="18.5" fill="#475569">a URN keeps working, but a resolver must look up a current copy</text>
</svg>