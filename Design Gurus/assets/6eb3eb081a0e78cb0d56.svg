<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A message broker holds two copies of OrderPlaced with event_id 123. Step 1 delivers the event to the consumer service, which first inserts the event ID into the processed events store, where the ID is a unique key. If the insert does not conflict, it processes the event and runs the business logic, and step 2 commits the ID and the side effect in the same transaction. Step 3 delivers the duplicate event; its insert conflicts with the stored ID, so the consumer skips processing. The business logic charges the payment provider with the event ID as its idempotency key">
  <defs>
    <filter id="m07h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m07h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m07h-k1"><rect x="64" y="180" width="172" height="80" rx="12"/></clipPath>
    <clipPath id="m07h-k2"><rect x="64" y="280" width="172" height="80" rx="12"/></clipPath>
    <clipPath id="m07h-k7"><rect x="985" y="470" width="191" height="90" rx="12"/></clipPath>
    <clipPath id="m07h-k4"><rect x="745" y="235" width="195" height="90" rx="12"/></clipPath>
    <clipPath id="m07h-k5"><rect x="985" y="235" width="191" height="90" rx="12"/></clipPath>
    <clipPath id="m07h-k6"><rect x="500" y="440" width="200" height="90" rx="12"/></clipPath>
    <marker id="m07h-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m07h-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m07h-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Idempotent consumer: handling duplicate events</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A redelivered event finds its ID already stored and is skipped instead of processed twice.</text>

  <rect x="40" y="130" width="220" height="260" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="160" font-size="19.5" font-weight="600" fill="#475569">Message broker</text>
  <rect x="470" y="130" width="730" height="510" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="494" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Consumer service</text>

  <g fill="none" stroke-width="2">
    <path d="M236,240 H558" stroke="#2563EB" marker-end="url(#m07h-m-blue)"/>
    <path d="M236,320 H558" stroke="#2563EB" marker-end="url(#m07h-m-blue)"/>
    <path d="M680,280 H743" stroke="#059669" marker-end="url(#m07h-m-emerald)"/>
    <path d="M940,280 H983" stroke="#2563EB" marker-end="url(#m07h-m-blue)"/>
    <path d="M600,360 V438" stroke="#DB2777" marker-end="url(#m07h-m-pink)"/>
    <path d="M842,325 V462" stroke="#2563EB" marker-end="url(#m07h-m-blue)"/>
    <path d="M1140,325 V468" stroke="#2563EB" marker-end="url(#m07h-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="308" y="226" fill="#1D4ED8" text-anchor="start">Deliver event</text>
    <text x="308" y="356" fill="#1D4ED8" text-anchor="start">Deliver</text>
    <text x="278" y="381" fill="#1D4ED8" text-anchor="start">duplicate event</text>
    <text x="712" y="266" fill="#047857">No</text>
    <text x="614" y="405" fill="#BE185D" text-anchor="start">Yes</text>
    <text x="888" y="386" fill="#1D4ED8" text-anchor="start">Commit ID and side effect</text>
    <text x="857" y="411" fill="#1D4ED8" text-anchor="start">in the same transaction</text>
  </g>

  <g filter="url(#m07h-soft)">
    <rect x="64" y="180" width="172" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="80" fill="#2563EB" clip-path="url(#m07h-k1)"/>
  </g>
  <text x="84" y="215.75" font-size="18.5" font-weight="600" fill="#111827">OrderPlaced</text>
  <text x="84" y="238.25" font-size="18.5" font-weight="600" fill="#111827">event_id: 123</text>
  <g filter="url(#m07h-soft)">
    <rect x="64" y="280" width="172" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="280" width="6" height="80" fill="#2563EB" clip-path="url(#m07h-k2)"/>
  </g>
  <text x="84" y="315.75" font-size="18.5" font-weight="600" fill="#111827">OrderPlaced</text>
  <text x="84" y="338.25" font-size="18.5" font-weight="600" fill="#111827">event_id: 123</text>
  <g filter="url(#m07h-soft)">
    <rect x="745" y="235" width="195" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="745" y="235" width="6" height="90" fill="#059669" clip-path="url(#m07h-k4)"/>
  </g>
  <circle cx="783" cy="280" r="18" fill="#FFFFFF"/>
  <g transform="translate(772.56,269.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="809" y="274.25" font-size="21.5" font-weight="600" fill="#111827">Process</text>
  <text x="809" y="299.75" font-size="21.5" font-weight="600" fill="#111827">event</text>
  <g filter="url(#m07h-soft)">
    <rect x="985" y="235" width="191" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="985" y="235" width="6" height="90" fill="#4F46E5" clip-path="url(#m07h-k5)"/>
  </g>
  <circle cx="1023" cy="280" r="18" fill="#FFFFFF"/>
  <g transform="translate(1012.56,269.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="1049" y="274.25" font-size="21.5" font-weight="600" fill="#111827">Business</text>
  <text x="1049" y="299.75" font-size="21.5" font-weight="600" fill="#111827">logic</text>
  <g filter="url(#m07h-soft)">
    <rect x="500" y="440" width="200" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="500" y="440" width="6" height="90" fill="#DB2777" clip-path="url(#m07h-k6)"/>
  </g>
  <text x="520" y="480.75" font-size="18.5" font-weight="600" fill="#111827">Skip processing</text>
  <text x="520" y="503.25" font-size="18.5" font-weight="600" fill="#111827">(duplicate)</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M752,478 L752,562 A90,16 0 0 0 932,562 L932,478" fill="#DBEAFE"/>
    <ellipse cx="842" cy="478" rx="90" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="842" y="522.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Processed</text>
  <text x="842" y="547.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">events store</text>
  <text x="842" y="612" font-size="18.5" text-anchor="middle" fill="#6B7280">event_id: 123</text>

  <g filter="url(#m07h-soft)">
    <rect x="985" y="470" width="191" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="985" y="470" width="6" height="90" fill="#D97706" clip-path="url(#m07h-k7)"/>
  </g>
  <circle cx="1023" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(1012.56,504.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="1049" y="509.25" font-size="21.5" font-weight="600" fill="#111827">Payment</text>
  <text x="1049" y="534.75" font-size="21.5" font-weight="600" fill="#111827">provider</text>
  <text x="1080" y="589" font-size="18.5" text-anchor="middle" fill="#6B7280">idempotency key:</text>
  <text x="1080" y="614" font-size="18.5" text-anchor="middle" fill="#6B7280">event_id</text>

  <polygon points="600,200 680,280 600,360 520,280" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8" stroke-linejoin="round" filter="url(#m07h-soft)"/>
  <text x="600" y="263" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Insert ID:</text>
  <text x="600" y="286" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">unique key</text>
  <text x="600" y="309" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">conflict?</text>
  <circle cx="291" cy="220" r="13" fill="#2563EB"/>
  <text x="291" y="225.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="870" cy="380" r="13" fill="#2563EB"/>
  <text x="870" y="385.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="291" cy="350" r="13" fill="#2563EB"/>
  <text x="291" y="355.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">3</text>


</svg>