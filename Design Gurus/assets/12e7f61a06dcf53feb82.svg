<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The item tower embeds the catalog every night into an ANN index, and the user tower runs on each request to search it for about 500 candidates">
  <defs>
    <marker id="emb2t2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="emb2t2-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="emb2t2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="emb2t2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="emb2t2-k1"><rect x="66" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t2-k2"><rect x="500" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t2-k3"><rect x="934" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t2-k4"><rect x="66" y="430" width="282" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t2-k5"><rect x="396.67" y="430" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t2-k6"><rect x="645.33" y="430" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t2-k7"><rect x="904" y="430" width="270" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="736" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline: every night</text>
  <rect x="40" y="350" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="380" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: on every request</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M306,181 H500" marker-end="url(#emb2t2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M740,181 H934" marker-end="url(#emb2t2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M348,475 H396.67" marker-end="url(#emb2t2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M596.67,475 H645.33" marker-end="url(#emb2t2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M855.33,475 H904" marker-end="url(#emb2t2-mslate)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M1054,263 V314 Q1054,326 1042,326 H762.33 Q750.33,326 750.33,338 V430" marker-end="url(#emb2t2-mviolet)"/></g>
  <g filter="url(#emb2t2-soft)">
    <rect x="66" y="136" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="66" y="136" width="6" height="90" fill="#D97706" clip-path="url(#emb2t2-k1)"/>
  </g>
  <circle cx="104" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(93.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="66" y="124" font-size="15.5" font-weight="600" fill="#6B7280">that night</text>
  <text x="130" y="188" font-size="18.5" font-weight="600" fill="#111827">Item tower</text>
  <text x="186" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">runs over 100 million products</text>
  <g filter="url(#emb2t2-soft)">
    <rect x="500" y="136" width="240" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="500" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#emb2t2-k2)"/>
  </g>
  <circle cx="538" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="564" y="188" font-size="18.5" font-weight="600" fill="#111827">Item vectors</text>
  <text x="620" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">one per product</text>
  <g filter="url(#emb2t2-soft)">
    <rect x="934" y="136" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="934" y="136" width="6" height="90" fill="#D97706" clip-path="url(#emb2t2-k3)"/>
  </g>
  <circle cx="972" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(961.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="998" y="188" font-size="18.5" font-weight="600" fill="#111827">ANN index</text>
  <text x="1054" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">built from those vectors</text>
  <g filter="url(#emb2t2-soft)">
    <rect x="66" y="430" width="282" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="66" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#emb2t2-k4)"/>
  </g>
  <circle cx="104" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(93.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="66" y="418" font-size="15.5" font-weight="600" fill="#6B7280">8:15 PM</text>
  <text x="130" y="482" font-size="18.5" font-weight="600" fill="#111827">Shopper opens the app</text>
  <text x="207" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">viewed two tents earlier</text>
  <g filter="url(#emb2t2-soft)">
    <rect x="396.67" y="430" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="396.67" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#emb2t2-k5)"/>
  </g>
  <circle cx="434.67" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(424.23,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="396.67" y="418" font-size="15.5" font-weight="600" fill="#6B7280">about 5 ms</text>
  <text x="460.67" y="482" font-size="18.5" font-weight="600" fill="#111827">User tower</text>
  <text x="496.67" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">outputs one user vector</text>
  <g filter="url(#emb2t2-soft)">
    <rect x="645.33" y="430" width="210" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="645.33" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#emb2t2-k6)"/>
  </g>
  <circle cx="683.33" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(672.89,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="645.33" y="418" font-size="15.5" font-weight="600" fill="#6B7280">about 10 ms</text>
  <text x="709.33" y="482" font-size="18.5" font-weight="600" fill="#111827">ANN search</text>
  <text x="750.33" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">finds the highest dot products</text>
  <g filter="url(#emb2t2-soft)">
    <rect x="904" y="430" width="270" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="904" y="430" width="6" height="90" fill="#059669" clip-path="url(#emb2t2-k7)"/>
  </g>
  <circle cx="942" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(931.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="904" y="418" font-size="15.5" font-weight="600" fill="#6B7280">next</text>
  <text x="968" y="482" font-size="18.5" font-weight="600" fill="#111827">About 500 candidates</text>
  <text x="1039" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">go to the ranker</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="902.17" y="312" fill="#5B21B6">ready before the shopper arrives</text></g>
  <rect x="40" y="620" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="665" text-anchor="middle" font-size="16" fill="#475569">The item tower runs nightly, and the user tower runs per request.</text>
</svg>