<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-label="The database schema for the YouTube likes counter. The UserLikes table has a composite primary key of user_id and content_id and holds the action type, a timestamp and a version, so there is one row per user per item. The ContentStats table is keyed by content_id and holds total_likes, total_dislikes and updated_at, one row per item. Many UserLikes rows roll up into one ContentStats row, and the totals are stored rather than counted on read.">
  <defs>
    <filter id="ytsch-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
    <marker id="ytsch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>

  <rect x="40" y="60" width="480" height="262" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" filter="url(#ytsch-shadow)"/>
  <path d="M40 74 a14 14 0 0 1 14 -14 h452 a14 14 0 0 1 14 14 v38 h-480 z" fill="#7C3AED"/>
  <text x="280" y="94" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">UserLikes</text>
  <path d="M40 112 h 480" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="52" y="121" width="38" height="24" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="71" y="139" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">PK</text>
  <text x="102" y="140" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">user_id</text>
  <text x="504" y="140" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">String</text>
  <rect x="41.5" y="154" width="477" height="42" fill="#F8FAFC"/>
  <path d="M40 154 h 480" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="52" y="163" width="38" height="24" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
  <text x="71" y="181" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">PK</text>
  <text x="102" y="182" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">content_id</text>
  <text x="504" y="182" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">String</text>
  <path d="M40 196 h 480" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="102" y="224" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">action_type</text>
  <text x="504" y="224" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">like | dislike</text>
  <rect x="41.5" y="238" width="477" height="42" fill="#F8FAFC"/>
  <path d="M40 238 h 480" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="102" y="266" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">timestamp</text>
  <text x="504" y="266" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">DateTime</text>
  <path d="M40 280 h 480" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="102" y="308" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">version</text>
  <text x="504" y="308" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Integer</text>

  <rect x="760" y="102" width="440" height="220" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.8" filter="url(#ytsch-shadow)"/>
  <path d="M760 116 a14 14 0 0 1 14 -14 h412 a14 14 0 0 1 14 14 v38 h-440 z" fill="#4F46E5"/>
  <text x="980" y="136" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">ContentStats</text>
  <path d="M760 154 h 440" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="772" y="163" width="38" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="791" y="181" font-size="15" font-weight="700" fill="#4338CA" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">PK</text>
  <text x="822" y="182" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">content_id</text>
  <text x="1184" y="182" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">String</text>
  <rect x="761.5" y="196" width="437" height="42" fill="#F8FAFC"/>
  <path d="M760 196 h 440" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="822" y="224" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">total_likes</text>
  <text x="1184" y="224" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Integer</text>
  <path d="M760 238 h 440" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="822" y="266" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">total_dislikes</text>
  <text x="1184" y="266" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Integer</text>
  <rect x="761.5" y="280" width="437" height="42" fill="#F8FAFC"/>
  <path d="M760 280 h 440" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="822" y="308" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">updated_at</text>
  <text x="1184" y="308" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">DateTime</text>

  <path d="M520 175 H 754" fill="none" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#ytsch-arrow)"/>
  <rect x="582" y="157" width="110" height="36" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <text x="637" y="182" font-size="18" font-weight="600" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">many : 1</text>

  <text x="280" y="352" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A repeat updates this row. The version makes that safe.</text>
  <text x="980" y="352" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One lookup here answers the whole count.</text>

  <rect x="40" y="392" width="1160" height="170" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="620" y="432" font-size="21" font-weight="700" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Why the totals live in their own table</text>
  <text x="620" y="472" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Counting the UserLikes rows on every view would scan millions of rows for one number.</text>
  <text x="620" y="502" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The total is written ahead of the read, so answering a view is a single key lookup.</text>
  <text x="620" y="532" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">That write is the hard part, because one row per item becomes a hot row under load.</text>
</svg>