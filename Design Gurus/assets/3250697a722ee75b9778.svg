<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="722" viewBox="0 0 1240 722" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="purge-title purge-desc">
<title id="purge-title">Purging, and the alternative</title>
<desc id="purge-desc">Purging by exact address is precise and does not scale, by prefix is convenient and blunt, and by tag removes exactly the pages carrying that tag. Purging everything makes every location miss at once. A versioned address needs no purge at all.</desc>
<defs>
<marker id="purge-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="purge-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="purge-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="purge-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="722" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Purging, and the alternative</text>
<text x="40" y="86" font-size="21" fill="#4A5568">When an address must stay stable and the content behind it changes, you have to remove the cached copy.</text>
<rect x="40" y="644" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="644" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three levels of precision</text>
<rect x="40" y="168" width="400" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="240" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">By exact address</text>
<path d="M446 200H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 200H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purge-marker-slate)"/>
<rect x="490" y="168" width="710" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="510" y="195" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">precise</text>
<text x="510" y="220" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">useless when one change affects a thousand pages</text>
<rect x="40" y="244" width="400" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="240" y="282" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">By prefix or pattern</text>
<path d="M446 276H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 276H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purge-marker-slate)"/>
<rect x="490" y="244" width="710" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="510" y="271" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">convenient</text>
<text x="510" y="296" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">routinely removes far more than intended</text>
<rect x="40" y="320" width="400" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="358" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">By tag</text>
<path d="M446 352H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 352H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purge-marker-slate)"/>
<rect x="490" y="320" width="710" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="510" y="347" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">exactly the pages that mention that entity</text>
<text x="510" y="372" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">the origin must decide at response time what each page depends on</text>
<rect x="40" y="408" width="560" height="124" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="408" width="5" height="124" rx="2.5" fill="#F28B9D"/><text x="64" y="437" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Purge everything</text><text x="64" y="463" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">every location misses</text><text x="64" y="489" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">every request reaches the origin</text><text x="64" y="515" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">an outage you perform on yourself</text>
<rect x="640" y="408" width="560" height="124" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="408" width="5" height="124" rx="2.5" fill="#39D5AA"/><text x="664" y="437" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A versioned address</text><text x="664" y="463" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">no purge at all</text><text x="664" y="489" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the old entry ages out unused</text><text x="664" y="515" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">a naming problem, not a purge problem</text>
<rect x="40" y="556" width="1160" height="62" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="556" width="5" height="62" rx="2.5" fill="#F3CF6A"/><text x="64" y="593" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A purge is eventually consistent, so never build a user-facing flow that waits for one.</text>
<text x="66" y="678" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Moving a problem from the purge path to the naming scheme removes a whole category of incident.</text>
</svg>