<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">Dependencies determine the waiting path</title><desc id="desc">Three sequential 200-millisecond requests take about 600 milliseconds. Truly independent concurrent requests can reduce the ideal waiting portion to about 200 milliseconds.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="790" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Dependencies determine the waiting path</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Illustrative request durations; other work is excluded.</tspan></text><text x="50" y="180" font-size="25" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Three dependent requests</tspan></text><rect x="50" y="210" width="345.3333333333333" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="252" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Account</tspan></text><text x="72" y="300" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">200 ms</tspan></text><path d="M399.3333333333333 295 H423.3333333333333" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="427.3333333333333" y="210" width="345.3333333333333" height="170" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="449.3333333333333" y="252" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="449.3333333333333" dy="0">Feed</tspan></text><text x="449.3333333333333" y="300" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="449.3333333333333" dy="0">200 ms</tspan></text><path d="M776.6666666666666 295 H800.6666666666666" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="804.6666666666666" y="210" width="345.3333333333333" height="170" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="826.6666666666666" y="252" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="826.6666666666666" dy="0">Authors</tspan></text><text x="826.6666666666666" y="300" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="826.6666666666666" dy="0">200 ms</tspan></text><text x="50" y="430" font-size="25" fill="#334155" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Approximate request waiting: 600 ms</tspan></text><rect x="50" y="480" width="1100" height="115" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="75" y="520" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="75" dy="0">If requests are truly independent: start them together.</tspan><tspan x="75" dy="32">Ideal waiting is about 200 ms, not 600 ms.</tspan></text><rect x="50" y="640" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="686" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Aggregation can reduce dependencies but may add payload or server delay.</tspan></text></g></svg>