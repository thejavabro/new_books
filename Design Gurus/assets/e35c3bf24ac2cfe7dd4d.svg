<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="686" viewBox="0 0 1240 686" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="triggers-title triggers-desc">
<title id="triggers-title">The triggers that are real</title>
<desc id="triggers-desc">Deploy coupling limiting delivery, divergent scaling needs, isolation as a requirement, an organization that has already split, and sharply different rates of change. Each one can be checked rather than argued about.</desc>
<defs>
<marker id="triggers-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="triggers-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="triggers-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="triggers-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="686" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The triggers that are real</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Five conditions genuinely justify it, and each can be checked rather than argued about.</text>
<rect x="40" y="608" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="608" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Deploy coupling is limiting delivery</text>
<path d="M566 148H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 148H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="118" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">deploy frequency limited by coordination</text><text x="630" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than by readiness</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scaling needs have diverged</text>
<path d="M566 220H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 220H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="190" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the whole application on expensive instances</text><text x="630" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">to serve one path</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Isolation is a requirement</text>
<path d="M566 292H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 292H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="262" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a narrower compliance scope, or a failure</text><text x="630" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that must not reach the rest</text>
<circle cx="60" cy="364" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="470" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The organization has already split</text>
<path d="M566 364H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 364H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="334" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">separate roadmaps, and coordination</text><text x="630" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">between them is the bottleneck</text>
<circle cx="60" cy="436" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="443" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="406" width="470" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Rates of change differ sharply</text>
<path d="M566 436H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 436H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="406" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">daily next to yearly, and the stable one</text><text x="630" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">keeps being redeployed</text>
<rect x="40" y="482" width="1160" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="482" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="512" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What they share</text><text x="64" y="538" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">They are all statements about the present. Something is currently costing you,</text><text x="64" y="564" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and the split is the response to it.</text>
<text x="66" y="642" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A split should be caused by something observable.</text>
</svg>