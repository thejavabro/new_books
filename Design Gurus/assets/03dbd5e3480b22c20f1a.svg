<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What AI adds to the classic interview structure">
  <defs>

    <filter id="m1l4a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l4a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m1l4a-k1"><rect x="50" y="70" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="m1l4a-k2"><rect x="650" y="70" width="540" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>


  <g filter="url(#m1l4a-lift)">
    <rect x="50" y="70" width="540" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="50" y="70" width="9" height="90" fill="#2563EB" clip-path="url(#m1l4a-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Metrics at the start</text>
  <text x="320" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">define quality targets early</text>
  <text x="320" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">use them to compare design choices</text>
  <g filter="url(#m1l4a-lift)">
    <rect x="650" y="70" width="540" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="650" y="70" width="9" height="90" fill="#059669" clip-path="url(#m1l4a-k2)"/>
  </g>
  <circle cx="688" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="714" y="122" font-size="18.5" font-weight="600" fill="#111827">A feedback process</text>
  <text x="920" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">explain how results are evaluated</text>
  <text x="920" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">and how improvements are released</text>
  <rect x="40" y="280" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="314" font-size="16" fill="#475569">The classic structure still works. Make quality and ongoing evaluation explicit.</text>
  <rect x="64" y="340" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="362" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">What carries over</text>
  <text x="288" y="362" font-size="15.5" fill="#475569">requirements, estimates, APIs, architecture, details, and summary</text>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Change one</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">state quality targets early so they guide later decisions</text>
  <rect x="64" y="428" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="450" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Change two</text>
  <text x="288" y="450" font-size="15.5" fill="#475569">include permitted logging, evaluation, improvements, and safe rollout</text>
  <rect x="40" y="496" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="541" text-anchor="middle" font-size="16" fill="#475569">The seven-step framework organizes these decisions. Adapt the depth to the question.</text>
</svg>