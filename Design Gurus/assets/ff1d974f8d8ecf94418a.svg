<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" style="background-color:#ffffff">
<defs>
<marker id="mdb" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
<marker id="mdc" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="46" width="260" height="70" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="46" width="260" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="160" y="65" text-anchor="middle" font-weight="bold" font-style="italic">Component</text>
<text x="42" y="94"># mediator : Mediator</text>
<text x="42" y="110" font-size="11" fill="#414d60">the only reference it holds</text>

<rect x="600" y="46" width="290" height="70" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="600" y="46" width="290" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="745" y="65" text-anchor="middle" font-weight="bold">&#171;interface&#187; Mediator</text>
<text x="612" y="94">+ notify(sender, event)</text>

<rect x="20" y="222" width="152" height="46" fill="#ffffff" stroke="#6c8ebf"/>
<text x="96" y="250" text-anchor="middle" font-size="11.5">CountrySelect</text>
<rect x="184" y="222" width="152" height="46" fill="#ffffff" stroke="#6c8ebf"/>
<text x="260" y="250" text-anchor="middle" font-size="11.5">MethodSelect</text>
<rect x="348" y="222" width="152" height="46" fill="#ffffff" stroke="#6c8ebf"/>
<text x="424" y="250" text-anchor="middle" font-size="11.5">PriceLabel</text>
<rect x="512" y="222" width="152" height="46" fill="#ffffff" stroke="#6c8ebf"/>
<text x="588" y="250" text-anchor="middle" font-size="11.5">SubmitButton</text>

<rect x="700" y="212" width="240" height="66" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="700" y="212" width="240" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="820" y="231" text-anchor="middle" font-weight="bold" font-size="12">ShippingFormMediator</text>
<text x="712" y="260" font-size="11" fill="#2f7a55">holds all four, and every rule</text>

<path d="M 96 222 L 96 170 L 160 170 L 160 116" stroke="#000000" fill="none" marker-end="url(#mdc)"/>
<path d="M 260 222 L 260 170" stroke="#000000" fill="none"/>
<path d="M 424 222 L 424 170" stroke="#000000" fill="none"/>
<path d="M 588 222 L 588 170 L 160 170" stroke="#000000" fill="none"/>

<path d="M 820 212 L 820 160 L 745 160 L 745 116" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#mdc)"/>

<path d="M 294 80 L 595 80" stroke="#000000" fill="none" marker-end="url(#mdb)"/>
<text x="330" y="72" font-size="11" fill="#414d60">calls notify() and nothing else</text>

<text x="700" y="298" font-size="11" fill="#414d60">and calls back into the components it holds</text>

<rect x="30" y="330" width="900" height="62" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="354" font-size="12.5" fill="#414d60">Components depend on the Mediator interface, not on the concrete mediator and not on each other, so they can be reused on another screen.</text>
<text x="52" y="378" font-size="12.5" fill="#b4322c">One direct reference between two components and the guarantee is gone. That is a code-review rule, not something the compiler enforces.</text>
</g>
</svg>