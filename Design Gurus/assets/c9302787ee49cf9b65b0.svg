<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three columns, each holding a capacity ceiling above what happens when it is reached. Sequence bits give four thousand and ninety-six IDs per millisecond, about four million a second, and a node that hits it waits for the next tick, which is also the signal to add nodes. Machine numbers give one thousand and twenty-four in ten bits split between region and node, and this is the real ceiling, reached long before throughput is. Nodes per region are added by asking the coordinator for a free number, and that is the whole scaling operation, with no data to move and no leader to elect.">
  <defs>
    <filter id="uidscale-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="uidscale-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="uidscale-k1"><rect x="65" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="uidscale-k2"><rect x="65" y="360" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="uidscale-k3"><rect x="460" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="uidscale-k4"><rect x="460" y="360" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="uidscale-k5"><rect x="855" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="uidscale-k6"><rect x="855" y="360" width="320" height="90" rx="12"/></clipPath>
    <marker id="uidscale-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="uidscale-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="uidscale-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three ceilings, and only one you will ever reach</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Nothing here is stored, so nothing here is sharded. Capacity is decided by three numbers.</text>

  <rect x="40" y="110" width="370" height="420" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#047857">Sequence bits</text>
  <rect x="435" y="110" width="370" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="459" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Machine numbers</text>
  <rect x="830" y="110" width="370" height="420" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="854" y="140" font-size="19.5" font-weight="600" fill="#B45309">Nodes per region</text>

  <g fill="none" stroke-width="2">
    <path d="M225 300 V 354" stroke="#059669" marker-end="url(#uidscale-m-emerald)"/>
    <path d="M620 300 V 354" stroke="#2563EB" marker-end="url(#uidscale-m-blue)"/>
    <path d="M1015 300 V 354" stroke="#D97706" marker-end="url(#uidscale-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#uidscale-soft)">
    <rect x="65" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="65" y="165" width="6" height="90" fill="#64748B" clip-path="url(#uidscale-k1)"/>
  </g>
  <circle cx="103" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="129" y="217" font-size="21.5" font-weight="600" fill="#111827">4096 per ms</text>
  <text x="225" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">about 4 million a second</text>
  <g filter="url(#uidscale-lift)">
    <rect x="65" y="360" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="65" y="360" width="9" height="90" fill="#059669" clip-path="url(#uidscale-k2)"/>
  </g>
  <circle cx="103" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="129" y="412" font-size="21.5" font-weight="600" fill="#111827">Node waits a tick</text>
  <text x="225" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">sub-millisecond pause,</text>
  <text x="225" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">and the signal to add nodes</text>
  <g filter="url(#uidscale-soft)">
    <rect x="460" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="460" y="165" width="6" height="90" fill="#64748B" clip-path="url(#uidscale-k3)"/>
  </g>
  <circle cx="498" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="524" y="217" font-size="21.5" font-weight="600" fill="#111827">1024 in ten bits</text>
  <text x="620" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">split region and node</text>
  <g filter="url(#uidscale-lift)">
    <rect x="460" y="360" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="460" y="360" width="9" height="90" fill="#2563EB" clip-path="url(#uidscale-k4)"/>
  </g>
  <circle cx="498" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="524" y="412" font-size="21.5" font-weight="600" fill="#111827">The real ceiling</text>
  <text x="620" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">reached long before</text>
  <text x="620" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">throughput ever is</text>
  <g filter="url(#uidscale-soft)">
    <rect x="855" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="855" y="165" width="6" height="90" fill="#64748B" clip-path="url(#uidscale-k5)"/>
  </g>
  <circle cx="893" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="919" y="217" font-size="21.5" font-weight="600" fill="#111827">Add a node</text>
  <text x="1015" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">ask for a free number</text>
  <g filter="url(#uidscale-lift)">
    <rect x="855" y="360" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="855" y="360" width="9" height="90" fill="#D97706" clip-path="url(#uidscale-k6)"/>
  </g>
  <circle cx="893" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,394.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="919" y="412" font-size="21.5" font-weight="600" fill="#111827">That is the whole job</text>
  <text x="1015" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">no data to move,</text>
  <text x="1015" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">no leader to elect</text>

  <rect x="40" y="570" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="595" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Per node throughput</text>
  <text x="323" y="620" font-size="18.5" fill="#475569">One node covers roughly forty times the whole system target on its own.</text>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">What runs out first</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">Machine numbers. Widening that field is a format change, so plan the split early.</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Scaling operation</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">Start a process, take a free number, join the load balancer. There is nothing else.</text>
</svg>