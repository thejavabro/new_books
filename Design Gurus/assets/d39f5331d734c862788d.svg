<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Polyglot persistence: orders in a relational store, catalog in a document store, cart in a key-value store, and search in a search index, each picked for its data">
  <defs>
    <marker id="dbps3-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="dbps3-k1"><rect x="72" y="104" width="248" height="70" rx="12"/></clipPath>
    <clipPath id="dbps3-k2"><rect x="362" y="104" width="248" height="70" rx="12"/></clipPath>
    <clipPath id="dbps3-k3"><rect x="652" y="104" width="248" height="70" rx="12"/></clipPath>
    <clipPath id="dbps3-k4"><rect x="942" y="104" width="248" height="70" rx="12"/></clipPath>
    <filter id="dbps3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dbps3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="320" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#5B21B6">Each service picks the store that fits its data</text>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M196,174 V216" marker-end="url(#dbps3-mviolet)"/>
    <path d="M486,174 V216" marker-end="url(#dbps3-mviolet)"/>
    <path d="M776,174 V216" marker-end="url(#dbps3-mviolet)"/>
    <path d="M1066,174 V216" marker-end="url(#dbps3-mviolet)"/>
  </g>
  <g filter="url(#dbps3-soft)">
    <rect x="72" y="104" width="248" height="70" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="72" y="104" width="6" height="70" fill="#7C3AED" clip-path="url(#dbps3-k1)"/>
  </g>
  <circle cx="110" cy="139" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,128.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="146" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 106,240 L 106,289 A 90,16 0 0 0 286,289 L 286,240" fill="#EDE9FE"/>
    <ellipse cx="196" cy="240" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="196" y="284.5" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Relational</text>
  <text x="196" y="330" font-size="15.5" text-anchor="middle" fill="#6B7280">orders need transactions</text>
  <g filter="url(#dbps3-soft)">
    <rect x="362" y="104" width="248" height="70" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="362" y="104" width="6" height="70" fill="#7C3AED" clip-path="url(#dbps3-k2)"/>
  </g>
  <circle cx="400" cy="139" r="18" fill="#FFFFFF"/>
  <g transform="translate(389.56,128.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/>
  </g>
  <text x="426" y="146" font-size="18.5" font-weight="600" fill="#111827">Catalog Service</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 396,240 L 396,289 A 90,16 0 0 0 576,289 L 576,240" fill="#EDE9FE"/>
    <ellipse cx="486" cy="240" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="486" y="284.5" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Document Store</text>
  <text x="486" y="330" font-size="15.5" text-anchor="middle" fill="#6B7280">product shapes vary</text>
  <g filter="url(#dbps3-soft)">
    <rect x="652" y="104" width="248" height="70" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="652" y="104" width="6" height="70" fill="#7C3AED" clip-path="url(#dbps3-k3)"/>
  </g>
  <circle cx="690" cy="139" r="18" fill="#FFFFFF"/>
  <g transform="translate(679.56,128.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="716" y="146" font-size="18.5" font-weight="600" fill="#111827">Cart Service</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 686,240 L 686,289 A 90,16 0 0 0 866,289 L 866,240" fill="#EDE9FE"/>
    <ellipse cx="776" cy="240" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="776" y="284.5" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Key-Value Store</text>
  <text x="776" y="330" font-size="15.5" text-anchor="middle" fill="#6B7280">reads must be instant</text>
  <g filter="url(#dbps3-soft)">
    <rect x="942" y="104" width="248" height="70" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="942" y="104" width="6" height="70" fill="#7C3AED" clip-path="url(#dbps3-k4)"/>
  </g>
  <circle cx="980" cy="139" r="18" fill="#FFFFFF"/>
  <g transform="translate(969.56,128.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="1006" y="146" font-size="18.5" font-weight="600" fill="#111827">Search Service</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 976,240 L 976,289 A 90,16 0 0 0 1156,289 L 1156,240" fill="#EDE9FE"/>
    <ellipse cx="1066" cy="240" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1066" y="284.5" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Search Index</text>
  <text x="1066" y="330" font-size="15.5" text-anchor="middle" fill="#6B7280">text search built in</text>
  <rect x="40" y="404" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="428" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="450" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Polyglot persistence</text>
  <text x="288" y="450" font-size="15.5" fill="#475569">ownership makes it possible: each team runs the store that fits its data</text>
</svg>