<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four status families mapped to caller action. 2xx means continue. 3xx means use another representation or location. 4xx means the caller must change input, identity, state, permission, or timing, and 429 sits here because waiting is the required change. 5xx means the server failed and a bounded retry may help.">
  <defs>
    <filter id="xl07statusf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl07statusf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl07statusf-k1"><rect x="76" y="104" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="xl07statusf-k2"><rect x="644" y="104" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="xl07statusf-k3"><rect x="76" y="266" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="xl07statusf-k4"><rect x="644" y="266" width="520" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="416" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">What each status family tells the caller to do</text>

  
  <g filter="url(#xl07statusf-soft)">
    <rect x="76" y="104" width="520" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="104" width="6" height="90" fill="#059669" clip-path="url(#xl07statusf-k1)"/>
  </g>
  <circle cx="114" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,138.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="156" font-size="18.5" font-weight="600" fill="#047857">2xx</text>
  <text x="186" y="156" font-size="18.5" font-weight="600" fill="#111827">Continue</text>
  <text x="336" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">use the response as it is</text>

  
  <g filter="url(#xl07statusf-soft)">
    <rect x="644" y="104" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="644" y="104" width="6" height="90" fill="#2563EB" clip-path="url(#xl07statusf-k2)"/>
  </g>
  <circle cx="682" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,138.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="708" y="156" font-size="18.5" font-weight="600" fill="#1D4ED8">3xx</text>
  <text x="754" y="156" font-size="18.5" font-weight="600" fill="#111827">Look elsewhere</text>
  <text x="904" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">another location, or a cached copy is still current</text>

  
  <g filter="url(#xl07statusf-lift)">
    <rect x="76" y="266" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="76" y="266" width="9" height="90" fill="#D97706" clip-path="url(#xl07statusf-k3)"/>
  </g>
  <circle cx="114" cy="311" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,300.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="318" font-size="18.5" font-weight="600" fill="#B45309">4xx</text>
  <text x="186" y="318" font-size="18.5" font-weight="600" fill="#111827">You must change something</text>
  <text x="336" y="381" font-size="15.5" text-anchor="middle" fill="#6B7280">input, identity, permission, state, or timing</text>
  <rect x="170" y="398" width="110" height="30" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="225" y="418" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">429: wait</text>
  <text x="294" y="418" font-size="15.5" fill="#94A3B8">waiting is the required change</text>

  
  <g filter="url(#xl07statusf-soft)">
    <rect x="644" y="266" width="520" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="644" y="266" width="6" height="90" fill="#DB2777" clip-path="url(#xl07statusf-k4)"/>
  </g>
  <circle cx="682" cy="311" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,300.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="708" y="318" font-size="18.5" font-weight="600" fill="#BE185D">5xx</text>
  <text x="754" y="318" font-size="18.5" font-weight="600" fill="#111827">The server failed</text>
  <text x="904" y="381" font-size="15.5" text-anchor="middle" fill="#6B7280">a bounded retry with growing delays may help</text>

  
  <rect x="40" y="484" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="529" text-anchor="middle" font-size="16" fill="#475569">The status names the kind of change. The body names the exact one.</text>
</svg>