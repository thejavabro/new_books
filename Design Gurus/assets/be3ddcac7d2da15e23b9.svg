<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A valid binary search tree: every value left of the root 8 is smaller than 8 and every value right of it is larger">
<defs>
