<text x="675" y="134" text-anchor="middle" font-size="17" font-weight="600" fill="#475569">root</text>
<text x="620" y="605" text-anchor="middle" font-size="18.5" fill="#6B7280">In-order walk: 1, 3, 4, 6, 7, 8, 10, 13, 14. Sorted, smallest first.</text>
