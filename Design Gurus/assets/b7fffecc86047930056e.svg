<text x="64" y="776" font-size="19.5" font-weight="600" fill="#047857">Combine: what each merge returns, from the leaves upward</text>
<text x="64" y="804" font-size="18.5" fill="#475569">A single element is its own majority, so every leaf returns its value.</text>
<text x="80" y="832" font-size="18.5" font-weight="600" fill="#111827">[4] and [4]</text>
<text x="330" y="832" font-size="18.5" fill="#475569">both halves agree, so it returns without counting</text>
<rect x="1082" y="810" width="82" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="1123" y="832" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">4</text>
<text x="80" y="888" font-size="18.5" font-weight="600" fill="#111827">[4] and [4]</text>
<text x="330" y="888" font-size="18.5" fill="#475569">both halves agree, so it returns without counting</text>
<rect x="1082" y="866" width="82" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="1123" y="888" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">4</text>
<text x="80" y="944" font-size="18.5" font-weight="600" fill="#111827">[4, 4] and [4, 4]</text>
<text x="330" y="944" font-size="18.5" fill="#475569">both halves agree</text>
<rect x="1082" y="922" width="82" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="1123" y="944" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">4</text>
<rect x="60" y="974" width="1120" height="42" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="80" y="1000" font-size="18.5" font-weight="600" fill="#111827">[7] and [4]</text>
<text x="330" y="1000" font-size="18.5" fill="#BE185D">they disagree, so counting in [7, 4] ties 1 to 1, and a tie keeps the right half</text>
<rect x="1082" y="978" width="82" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="1123" y="1000" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">4</text>
<text x="80" y="1056" font-size="18.5" font-weight="600" fill="#111827">[7, 4] and [4]</text>
<text x="330" y="1056" font-size="18.5" fill="#475569">both report 4, so they agree</text>
<rect x="1082" y="1034" width="82" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="1123" y="1056" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">4</text>
<text x="80" y="1112" font-size="18.5" font-weight="600" fill="#111827">[4, 4, 4, 4] and [7, 4, 4]</text>
<text x="330" y="1112" font-size="18.5" fill="#475569">both report 4, so the top level never counts either</text>
<rect x="1082" y="1090" width="82" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="1123" y="1112" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">4</text>
<rect x="40" y="1200" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="1224" width="230" height="38" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="179" y="1249" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">The answer is 4</text>
<text x="318" y="1249" font-size="18.5" fill="#475569">4 appears 6 times in 7 elements, so it is the majority of the whole array.</text>
<text x="64" y="1282" font-size="18.5" fill="#475569">Counting only happens when two halves disagree, which is what keeps this approach faster than counting everything at every level.</text>
</svg>