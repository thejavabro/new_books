<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="848" viewBox="0 0 1240 848" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="review-title review-desc">
<title id="review-title">The review that changes something</title>
<desc id="review-desc">Five questions, of which the detection-time question is the most undervalued. The output is where reviews are usually lost, because a list of twenty action items will not be done.</desc>
<defs>
<marker id="review-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="review-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="review-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="review-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="848" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The review that changes something</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The review after an incident has one job, which is to leave the system different.</text>
<rect x="40" y="770" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="770" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="88" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="88" rx="2.5" fill="#AC8BE8"/><text x="64" y="155" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Blameless is an information strategy, not a courtesy</text><text x="64" y="181" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The moment a review can assign fault, people stop explaining what they actually did.</text>
<circle cx="60" cy="256" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="263" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="226" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What was the user impact</text>
<path d="M536 256H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 256H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#review-marker-slate)"/>
<rect x="576" y="226" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="262" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in numbers and duration, not in adjectives</text>
<circle cx="60" cy="322" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="329" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="292" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="328" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What was the trigger</text>
<path d="M536 322H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 322H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#review-marker-slate)"/>
<rect x="576" y="292" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="328" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is rarely the cause</text>
<circle cx="60" cy="388" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="395" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="358" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Why did detection take so long</text>
<path d="M536 388H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 388H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#review-marker-slate)"/>
<rect x="576" y="358" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="381.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">frequently the largest part of the outage,</text><text x="596" y="406.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and more often fixable than the cause</text>
<circle cx="60" cy="454" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="461" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="424" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="460" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What made diagnosis slow</text>
<path d="M536 454H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 454H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#review-marker-slate)"/>
<rect x="576" y="424" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="460" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every answer here is a debuggability finding</text>
<circle cx="60" cy="520" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="527" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="490" width="440" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="526" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What would have limited the damage</text>
<path d="M536 520H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 520H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#review-marker-slate)"/>
<rect x="576" y="490" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="513.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">independent of the cause: timeouts, limits,</text><text x="596" y="538.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a flag, a smaller area of damage</text>
<rect x="40" y="570" width="1160" height="88" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="570" width="5" height="88" rx="2.5" fill="#39D5AA"/><text x="64" y="607" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Two action items that ship beat twenty that are filed.</text><text x="64" y="633" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Writing down "we decided not to fix this, and why" is a legitimate outcome.</text>
<rect x="40" y="678" width="1160" height="66" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="678" width="5" height="66" rx="2.5" fill="#F3CF6A"/><text x="64" y="717" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">Not why the person was careless, but what made the mistake easy to make and hard to notice.</text>
<text x="66" y="804" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The second half of that sentence is the only part you can change.</text>
</svg>