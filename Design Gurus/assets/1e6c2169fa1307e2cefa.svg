<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Stateful: request 1 goes to Server A, which keeps the cart in memory, and request 2 goes to Server B, which has no cart. Stateless: both servers read and write the cart in one shared session store.">
  <defs>
    <filter id="sc2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sc2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sc2-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-k2"><rect x="64" y="360" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-k3"><rect x="356" y="360" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-k4"><rect x="654" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-k5"><rect x="654" y="360" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-k6"><rect x="946" y="360" width="230" height="90" rx="12"/></clipPath>
    <marker id="sc2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="sc2-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="sc2-s-indigo" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#4F46E5"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="930" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Why scaling out needs stateless servers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">If a server keeps the cart in its own memory, the next server cannot see it.</text>

  <rect x="40" y="120" width="570" height="600" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Stateful: the cart lives in one server</text>
  <rect x="630" y="120" width="570" height="600" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#475569">Stateless: the cart lives in a shared store</text>

  <g fill="none" stroke-width="2">
    <path d="M179,270 V360" stroke="#2563EB" marker-end="url(#sc2-m-blue)"/>
    <path d="M471,270 V360" stroke="#2563EB" marker-end="url(#sc2-m-blue)"/>
    <path d="M769,270 V360" stroke="#2563EB" marker-end="url(#sc2-m-blue)"/>
    <path d="M1061,270 V360" stroke="#2563EB" marker-end="url(#sc2-m-blue)"/>
    <path d="M769,458 V526" stroke="#4F46E5" marker-end="url(#sc2-m-indigo)" marker-start="url(#sc2-s-indigo)"/>
    <path d="M1061,458 V526" stroke="#4F46E5" marker-end="url(#sc2-m-indigo)" marker-start="url(#sc2-s-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="236" y="322" fill="#1D4ED8">request 1</text>
    <text x="528" y="322" fill="#1D4ED8">request 2</text>
    <text x="826" y="322" fill="#1D4ED8">request 1</text>
    <text x="1118" y="322" fill="#1D4ED8">request 2</text>
    <text x="915" y="498" fill="#4338CA">read and write</text>
  </g>

  <g filter="url(#sc2-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#sc2-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <g filter="url(#sc2-soft)">
    <rect x="64" y="360" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="360" width="6" height="90" fill="#2563EB" clip-path="url(#sc2-k2)"/>
  </g>
  <circle cx="102" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="128" y="412" font-size="21.5" font-weight="600" fill="#111827">Server A</text>
  <text x="179" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">has the cart in memory</text>
  <g filter="url(#sc2-soft)">
    <rect x="356" y="360" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="356" y="360" width="6" height="90" fill="#DB2777" clip-path="url(#sc2-k3)"/>
  </g>
  <circle cx="394" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(383.56,394.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="420" y="412" font-size="21.5" font-weight="600" fill="#111827">Server B</text>
  <text x="471" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">has no cart, so the</text>
  <text x="471" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">user sees an empty cart</text>
  <g filter="url(#sc2-soft)">
    <rect x="654" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#sc2-k4)"/>
  </g>
  <circle cx="692" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="718" y="232" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <g filter="url(#sc2-soft)">
    <rect x="654" y="360" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="654" y="360" width="6" height="90" fill="#059669" clip-path="url(#sc2-k5)"/>
  </g>
  <circle cx="692" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="718" y="412" font-size="21.5" font-weight="600" fill="#111827">Server A</text>
  <g filter="url(#sc2-soft)">
    <rect x="946" y="360" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="946" y="360" width="6" height="90" fill="#059669" clip-path="url(#sc2-k6)"/>
  </g>
  <circle cx="984" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(973.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="1010" y="412" font-size="21.5" font-weight="600" fill="#111827">Server B</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M700,540 L700,614 A215,16 0 0 0 1130,614 L1130,540" fill="#E0E7FF"/>
    <ellipse cx="915" cy="540" rx="215" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="915" y="592" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Shared session store</text>
  <text x="915" y="664" font-size="18.5" text-anchor="middle" fill="#6B7280">carts and logins</text>
  <text x="915" y="691" font-size="18.5" text-anchor="middle" fill="#94A3B8">Redis or a database</text>

  <rect x="40" y="750" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="775" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="800" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Stateful</text>
  <text x="323" y="800" font-size="18.5" fill="#475569">a server keeps user data in its own memory, so requests must return to it</text>
  <rect x="64" y="825" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="850" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Stateless</text>
  <text x="323" y="850" font-size="18.5" fill="#475569">any server can handle any request, so adding a server just works</text>
</svg>