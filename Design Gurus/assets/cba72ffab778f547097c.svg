<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="822" viewBox="0 0 1240 822" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="evals-title evals-desc">
<title id="evals-title">The evals that make it production-ready</title>
<desc id="evals-desc">Retrieval and generation fail differently and the fix is different, so they are measured separately. Recall at k is the first number to fix.</desc>
<defs>
<marker id="evals-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="evals-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="evals-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="evals-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="822" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The evals that make it production-ready</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Retrieval and generation fail differently and the fix is different, so they are measured separately.</text>
<rect x="40" y="744" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="744" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="180" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V292A6 6 0 0 0 46 298H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Retrieval, measured first</text>
<rect x="72" y="174" width="496" height="104" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="207" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">recall at k: was the right passage</text><text x="92" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in the top k?</text><text x="92" y="257" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">precision: how much was useful?</text>
<rect x="640" y="118" width="560" height="180" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V292A6 6 0 0 0 646 298H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Generation, measured after</text>
<rect x="672" y="174" width="496" height="104" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="207" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">faithfulness: every claim supported?</text><text x="692" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">relevance: does it answer it?</text><text x="692" y="257" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">refusal: declines only when it should?</text>
<rect x="40" y="318" width="1160" height="90" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="318" width="5" height="90" rx="2.5" fill="#F28B9D"/><text x="64" y="356" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Recall is the one to fix first</text><text x="64" y="382" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Poor recall with a good model produces fluent answers that are wrong.</text>
<rect x="40" y="428" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="450.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Start with thirty questions,</text><text x="280" y="477.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">not three thousand</text>
<path d="M526 458H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 458H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evals-marker-slate)"/>
<rect x="570" y="428" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="464" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">hand-built from real user questions</text>
<rect x="40" y="500" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="536" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep the failures</text>
<path d="M526 530H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 530H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evals-marker-slate)"/>
<rect x="570" y="500" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="536" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every wrong answer becomes a permanent test case</text>
<rect x="40" y="572" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="608" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Run on every change</text>
<path d="M526 602H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 602H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#evals-marker-slate)"/>
<rect x="570" y="572" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="595.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">especially model upgrades, which regress</text><text x="590" y="620.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what the prompt depended on</text>
<rect x="40" y="652" width="1160" height="64" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="652" width="5" height="64" rx="2.5" fill="#F3CF6A"/><text x="64" y="690" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Without measurement, every change feels like an improvement.</text>
<text x="66" y="778" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The dataset that matters builds itself, if you let it.</text>
</svg>