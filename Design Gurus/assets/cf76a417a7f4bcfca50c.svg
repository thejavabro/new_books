<circle cx="810" cy="515" r="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="810" y="523" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">#</text>
