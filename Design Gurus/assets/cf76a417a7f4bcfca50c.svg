<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="964" viewBox="0 0 1240 964" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A binary tree written out in preorder with a marker for every empty child, so the shape survives"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="964" fill="#FFFFFF"/>
