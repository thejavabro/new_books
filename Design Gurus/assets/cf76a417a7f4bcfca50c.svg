<text x="993" y="613" text-anchor="middle" font-size="20.5" font-weight="600" fill="#94A3B8">#</text>
<text x="200" y="690" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">11 tokens for 5 nodes, because each of the 6 empty places is written down</text>
<rect x="40" y="748" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="770" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="796" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">a real node</text>
<text x="348" y="796" font-size="19.5" fill="#475569">writes its value, then its left and right child</text>
<rect x="64" y="818" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="844" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">an empty child</text>
<text x="348" y="844" font-size="19.5" fill="#475569">writes the marker, which is what fixes the shape</text>
<rect x="64" y="866" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="892" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">the output</text>
<text x="348" y="892" font-size="19.5" fill="#475569">read back in the same order to rebuild the tree</text>
</svg>