<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="968" viewBox="0 0 1240 968" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="retention-title retention-desc">
<title id="retention-title">Retention, and the percentile trap</title>
<desc id="retention-desc">Tiered retention is part of the design because it sets the storage bill. Counts, sums, minimums and maximums roll up correctly; averages need their counts; percentiles do not roll up at all.</desc>
<defs>
<marker id="retention-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="retention-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="retention-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="retention-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="968" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Retention, and the percentile trap</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Tiered retention is part of the design because it sets the storage bill.</text>
<rect x="40" y="890" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="890" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="40" y="142" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Tiers, because value decays</text>
<rect x="40" y="160" width="292" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="186" y="191" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Raw resolution</text>
<rect x="352" y="160" width="220" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="462" y="191" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">days</text>
<rect x="592" y="160" width="608" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="612" y="191" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what incidents are debugged from</text>
<rect x="40" y="218" width="292" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="186" y="249" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A coarser rollup</text>
<rect x="352" y="218" width="220" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="462" y="249" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">weeks to months</text>
<rect x="592" y="218" width="608" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="612" y="249" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">trends and capacity planning</text>
<rect x="40" y="276" width="292" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="186" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Coarser again</text>
<rect x="352" y="276" width="220" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="462" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">years</text>
<rect x="592" y="276" width="608" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="612" y="307" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what anybody actually looks at that far back</text>
<rect x="40" y="344" width="1160" height="50" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="375" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">series count x points per series per day x bytes per point, for each tier</text>
<rect x="40" y="418" width="1160" height="84" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="418" width="5" height="84" rx="2.5" fill="#F28B9D"/><text x="64" y="453" font-size="24" font-weight="700" fill="#A83147" text-anchor="start">You cannot average percentiles.</text><text x="64" y="479" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A p99 of a set of p99s is not the p99, and it is usually optimistic.</text>
<text x="40" y="536" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What rolls up, and what does not</text>
<rect x="40" y="554" width="1160" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="56" y="584" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">counts and sums</text><text x="1184" y="584" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">yes, they are additive</text>
<rect x="40" y="608" width="1160" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="56" y="638" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">minimums and maximums</text><text x="1184" y="638" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">yes</text>
<rect x="40" y="662" width="1160" height="46" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="56" y="692" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">averages</text><text x="1184" y="692" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">only if you keep the count alongside</text>
<rect x="40" y="716" width="1160" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="56" y="746" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">percentiles</text><text x="1184" y="746" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">no, not at all</text>
<rect x="40" y="782" width="1160" height="80" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="782" width="5" height="80" rx="2.5" fill="#5EC9EC"/><text x="64" y="815" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Downsampling throws away the ability to answer questions you have not asked yet.</text><text x="64" y="841" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">For percentiles over long windows you need histograms or a sketch, decided at write time.</text>
<text x="66" y="924" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Choosing what to pre-aggregate is choosing which future questions remain answerable.</text>
</svg>