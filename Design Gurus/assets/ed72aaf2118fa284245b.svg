<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="778" viewBox="0 0 1240 778" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="modes-title modes-desc">
<title id="modes-title">How to use the three exercises</title>
<desc id="modes-desc">The same structure in each, and three ways to work one depending on the time available. All three modes are productive.</desc>
<defs>
<marker id="modes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="modes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="modes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="modes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="778" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">How to use the three exercises</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The same structure in each, and three ways to work one depending on the time available.</text>
<rect x="40" y="700" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="700" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Each exercise has the same six parts</text>
<circle cx="70" cy="196" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="70" y="203" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="102" y="168" width="310" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="257" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The brief</text>
<circle cx="464" cy="196" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="464" y="203" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="496" y="168" width="310" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="651" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Questions worth asking</text>
<circle cx="858" cy="196" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="858" y="203" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="890" y="168" width="310" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1045" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A worked design</text>
<circle cx="70" cy="264" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="70" y="271" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="102" y="236" width="310" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="257" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The decisions inside</text>
<circle cx="464" cy="264" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="464" y="271" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="496" y="236" width="310" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="651" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Failure and operations</text>
<circle cx="858" cy="264" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="858" y="271" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="890" y="236" width="310" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1045" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The rubric applied</text>
<text x="40" y="340" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three ways to work one, all useful</text>
<rect x="40" y="358" width="260" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="170" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Thirty minutes</text>
<path d="M306 388H340" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M306 388H340" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#modes-marker-slate)"/>
<rect x="350" y="358" width="850" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="381.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">scope it, state the priority, name the hardest parts, sketch the shape. The most</text><text x="370" y="406.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">valuable half hour, because scoping and difficulty carry the most weight</text>
<rect x="40" y="430" width="260" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="170" y="466" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ninety minutes</text>
<path d="M306 460H340" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M306 460H340" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#modes-marker-slate)"/>
<rect x="350" y="430" width="850" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="453.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the full design written out, with trade-offs explicit and numbers attempted.</text><text x="370" y="478.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A real interview plus the thinking time one does not give you</text>
<rect x="40" y="502" width="260" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="170" y="538" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">With another person</text>
<path d="M306 532H340" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M306 532H340" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#modes-marker-slate)"/>
<rect x="350" y="502" width="850" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="525.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one designs, one reviews with the rubric. The reviewer role teaches as much,</text><text x="370" y="550.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because the rubric gaps are obvious in work that is not yours</text>
<rect x="40" y="586" width="1160" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="586" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="64" y="622" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Write the numbers down, even if you invent them</text><text x="64" y="648" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">An invented number is a commitment that can be checked for consistency.</text>
<text x="66" y="734" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A design with no numbers cannot be wrong, which is why it also cannot be good.</text>
</svg>