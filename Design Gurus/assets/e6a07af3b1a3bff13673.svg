<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two sequences with an empty stack">
<defs>
<filter id="ss-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Could these pushes and pops have happened on one stack?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The order of both lists is fixed, and only the interleaving is free</text>
<rect x="40" y="106" width="1160" height="538" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Violet marks the value that has to come off the stack next</text>
<text x="226" y="250" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">to push</text>
<rect x="250" y="212" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="308" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="382" y="212" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="440" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="514" y="212" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="572" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="646" y="212" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="704" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="778" y="212" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="836" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<rect x="910" y="212" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="968" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="226" y="360" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">to pop, in order</text>
<rect x="250" y="322" width="116" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="308" y="359.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="382" y="322" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="440" y="359.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<rect x="514" y="322" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="572" y="359.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="646" y="322" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="704" y="359.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="778" y="322" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="836" y="359.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<rect x="910" y="322" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="968" y="359.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="226" y="486" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the stack</text>
<text x="256" y="485" font-size="18" fill="#475569">the stack is empty</text>
<text x="620" y="586" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">There is no choice to make: pop whenever the top is what is wanted next</text>
<rect x="40" y="656" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="696" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Push in order, and pop the moment the top matches what is wanted</text>
<text x="620" y="728" text-anchor="middle" font-size="18.5" fill="#475569">Delaying a possible pop can never help, because the wanted value would be buried</text>
</svg>