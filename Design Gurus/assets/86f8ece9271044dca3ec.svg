<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="598" viewBox="0 0 1120 598" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A hash table stores a key with a value, a hash set stores only the values">
<defs>
<marker id="hset-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="hset-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="hset-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="hset-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="hset-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="hset-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="hset-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="hset-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="hset-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1120" height="598" fill="#FFFFFF"/>
<text x="560" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Hash table and hash set</text>
<text x="560" y="90" text-anchor="middle" font-size="19" fill="#475569">A hash table is like a dictionary: each word carries its meaning. A hash set keeps only the words.</text>
<rect x="60" y="148" width="620" height="260" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="80" y="176" font-size="19.5" font-weight="600" fill="#1D4ED8">Hash table: key to value</text>
<rect x="720" y="148" width="340" height="260" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="740" y="176" font-size="19.5" font-weight="600" fill="#047857">Hash set: values only</text>
<rect x="80" y="198" width="150" height="44" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.4"/>
<text x="155" y="227" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">run</text>
<text x="244" y="227" font-size="17" fill="#475569">to move quickly on foot</text>
<rect x="815" y="198" width="150" height="44" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.4"/>
<text x="890" y="227" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">run</text>
<rect x="80" y="264" width="150" height="44" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.4"/>
<text x="155" y="293" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">meal</text>
<text x="244" y="293" font-size="17" fill="#475569">the food served and eaten at one time</text>
<rect x="815" y="264" width="150" height="44" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.4"/>
<text x="890" y="293" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">meal</text>
<rect x="80" y="330" width="150" height="44" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.4"/>
<text x="155" y="359" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">interview</text>
<text x="244" y="359" font-size="17" fill="#475569">a formal meeting where someone is asked questions</text>
<rect x="815" y="330" width="150" height="44" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.4"/>
<text x="890" y="359" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">interview</text>
<rect x="60" y="450" width="1000" height="106" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="84" y="484" font-size="18.5" fill="#475569">Use a hash table when you need to look something up and get information back: a count, a name, a definition.</text>
<text x="84" y="512" font-size="18.5" fill="#475569">Use a hash set when the only question is "have I seen this before", because storing a value would waste space.</text>
<text x="84" y="540" font-size="18.5" fill="#475569">Both answer that question in constant time on average. Neither keeps any order.</text>
</svg>