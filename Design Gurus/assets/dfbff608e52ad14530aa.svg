<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1206" viewBox="0 0 1240 1206" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One ETA request split into stages, each with its own share of the 100 ms budget, with logging kept off the critical path">
  <defs>
    <marker id="c2svlb-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c2svlb-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="c2svlb-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2svlb-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2svlb-k1"><rect x="190" y="116" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2svlb-k2"><rect x="190" y="271" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2svlb-k3"><rect x="190" y="426" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2svlb-k4"><rect x="190" y="581" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2svlb-k5"><rect x="190" y="736" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2svlb-k6"><rect x="800" y="736" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2svlb-k7"><rect x="800" y="891" width="300" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="1206" fill="#FFFFFF"/>
  <rect x="40" y="56" width="600" height="994" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Critical path: the user waits, about 100 ms</text>
  <rect x="700" y="676" width="500" height="374" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="724" y="706" font-size="16.5" font-weight="600" fill="#B45309">In the background: nobody waits</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M340,243 V271" marker-end="url(#c2svlb-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M340,398 V426" marker-end="url(#c2svlb-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M340,553 V581" marker-end="url(#c2svlb-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M340,708 V736" marker-end="url(#c2svlb-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M950,863 V891" marker-end="url(#c2svlb-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M490,781 H800" marker-end="url(#c2svlb-memerald)"/></g>
  <g filter="url(#c2svlb-soft)">
    <rect x="190" y="116" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="190" y="116" width="6" height="90" fill="#2563EB" clip-path="url(#c2svlb-k1)"/>
  </g>
  <circle cx="228" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,150.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="254" y="168" font-size="18.5" font-weight="600" fill="#111827">Routing and checks</text>
  <text x="340" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">1 to 5 ms, login and input checked</text>
  <g filter="url(#c2svlb-lift)">
    <rect x="190" y="271" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="190" y="271" width="9" height="90" fill="#4F46E5" clip-path="url(#c2svlb-k2)"/>
  </g>
  <circle cx="228" cy="316" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,305.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="254" y="323" font-size="18.5" font-weight="600" fill="#111827">Feature fetch</text>
  <text x="340" y="386" font-size="15.5" text-anchor="middle" fill="#6B7280">5 to 20 ms, the usual bottleneck</text>
  <g filter="url(#c2svlb-soft)">
    <rect x="190" y="426" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="190" y="426" width="6" height="90" fill="#2563EB" clip-path="url(#c2svlb-k3)"/>
  </g>
  <circle cx="228" cy="471" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,460.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="254" y="478" font-size="18.5" font-weight="600" fill="#111827">Request-time features</text>
  <text x="340" y="541" font-size="15.5" text-anchor="middle" fill="#6B7280">0 to 15 ms, route distance computed now</text>
  <g filter="url(#c2svlb-soft)">
    <rect x="190" y="581" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="190" y="581" width="6" height="90" fill="#2563EB" clip-path="url(#c2svlb-k4)"/>
  </g>
  <circle cx="228" cy="626" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,615.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="254" y="633" font-size="18.5" font-weight="600" fill="#111827">Model inference</text>
  <text x="340" y="696" font-size="15.5" text-anchor="middle" fill="#6B7280">1 to 10 ms, the model runs</text>
  <g filter="url(#c2svlb-soft)">
    <rect x="190" y="736" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="190" y="736" width="6" height="90" fill="#2563EB" clip-path="url(#c2svlb-k5)"/>
  </g>
  <circle cx="228" cy="781" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,770.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="254" y="788" font-size="18.5" font-weight="600" fill="#111827">Response</text>
  <text x="340" y="851" font-size="15.5" text-anchor="middle" fill="#6B7280">1 to 2 ms, the estimate is returned</text>
  <g filter="url(#c2svlb-soft)">
    <rect x="800" y="736" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="800" y="736" width="6" height="90" fill="#D97706" clip-path="url(#c2svlb-k6)"/>
  </g>
  <circle cx="838" cy="781" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,770.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="864" y="788" font-size="18.5" font-weight="600" fill="#111827">Background writer</text>
  <text x="950" y="851" font-size="15.5" text-anchor="middle" fill="#6B7280">takes the record, writes it later</text>
  <g filter="url(#c2svlb-soft)">
    <rect x="800" y="891" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="800" y="891" width="6" height="90" fill="#059669" clip-path="url(#c2svlb-k7)"/>
  </g>
  <circle cx="838" cy="936" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,925.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="864" y="943" font-size="18.5" font-weight="600" fill="#111827">Prediction log</text>
  <text x="950" y="1006" font-size="15.5" text-anchor="middle" fill="#6B7280">the estimate, its features, and the model version</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="645" y="767" fill="#047857">the log record, handed off</text></g>
  <rect x="40" y="1090" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1135" text-anchor="middle" font-size="16" fill="#475569">Logging is kept off the critical path, so a slow log store cannot slow down checkout.</text>
</svg>