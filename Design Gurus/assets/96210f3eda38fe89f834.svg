  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="626.25" y="286" fill="#B45309">rejected: revise, at most twice</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="885" y="394" fill="#475569">still rejected after two revisions</text></g>
