<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">Image loading has several cache paths</title><desc id="desc">First check for a valid decoded output. Otherwise, use eligible compressed bytes or fetch the source from the network. Compressed bytes still need target-sized decoding. Before display, every path checks the target’s current subscription identity, including a memory-cache hit. Cache eligibility includes the access, version, and representation rules.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1110" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Image loading has several cache paths</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Every path still ends with the same target-identity check.</text><rect x="50" y="190" width="330" height="175" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="230" font-size="24" fill="#7c3aed" font-weight="700">Decoded-output cache</text><text x="72" y="271" font-size="21" fill="#334155" font-weight="400">Correct output key?</text><text x="72" y="302" font-size="21" fill="#334155" font-weight="400">Valid for this request?</text><rect x="435" y="190" width="330" height="175" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="457" y="230" font-size="24" fill="#2563eb" font-weight="700">Compressed-byte cache</text><text x="457" y="271" font-size="21" fill="#334155" font-weight="400">Eligible source bytes?</text><text x="457" y="302" font-size="21" fill="#334155" font-weight="400">Same access and version?</text><rect x="820" y="190" width="330" height="175" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="230" font-size="24" fill="#c2410c" font-weight="700">Network fetch</text><text x="842" y="271" font-size="21" fill="#334155" font-weight="400">Fetch or validate the source.</text><text x="842" y="302" font-size="21" fill="#334155" font-weight="400">Share compatible work.</text><path d="M388 275 H427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M773 275 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="389" y="251" font-size="17" fill="#334155" font-weight="400">miss</text><text x="774" y="251" font-size="17" fill="#334155" font-weight="400">miss</text><rect x="350" y="535" width="500" height="165" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="372" y="575" font-size="24" fill="#059669" font-weight="700">Decode for target pixels</text><text x="372" y="616" font-size="21" fill="#334155" font-weight="400">Apply the requested transformation.</text><text x="372" y="647" font-size="21" fill="#334155" font-weight="400">Bound dimensions and concurrent work.</text><path d="M600 373 V527" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="620" y="463" font-size="20" fill="#64748b" font-weight="400">Eligible bytes</text><path d="M985 373 V615 H858" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="990" y="470" font-size="20" fill="#64748b" font-weight="400">Source</text><text x="990" y="501" font-size="20" fill="#64748b" font-weight="400">bytes</text><rect x="50" y="850" width="1100" height="165" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="890" font-size="24" fill="#2563eb" font-weight="700">Check the current subscription, then display</text><text x="72" y="931" font-size="21" fill="#334155" font-weight="400">Compare the result with the target’s current item and request identity.</text><text x="72" y="962" font-size="21" fill="#334155" font-weight="400">A cached hit needs the same identity and documented callback-timing contract as a network hit.</text><path d="M215 373 V842" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="65" y="528" font-size="21" fill="#64748b" font-weight="400">Valid</text><text x="65" y="559" font-size="21" fill="#64748b" font-weight="400">decoded</text><text x="65" y="590" font-size="21" fill="#64748b" font-weight="400">hit</text><path d="M600 708 V842" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="50" y="1070" font-size="21" fill="#475569" font-weight="400">A disk hit avoids a source download, but it does not avoid disk reading or image decoding.</text></g></svg>