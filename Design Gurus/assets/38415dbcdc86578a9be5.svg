<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="791" viewBox="0 0 1240 791" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A router sends hard turns to a frontier API and easy, high-volume turns to a small model, with a token budget and a fallback guarding the API path">
  <defs>
    <marker id="iemx-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="iemx-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="iemx-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="iemx-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="iemx-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="iemx-k1"><rect x="62" y="220" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="iemx-k2"><rect x="306" y="220" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="iemx-k3"><rect x="576" y="310" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="iemx-k4"><rect x="940" y="310" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="iemx-k5"><rect x="940" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="iemx-k6"><rect x="530" y="520" width="270" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="791" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="408" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">One support turn</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M262,265 H306" marker-end="url(#iemx-mslate)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M506,285 H518 Q530,285 530,297 V343 Q530,355 542,355 H576" marker-end="url(#iemx-mviolet)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M812,355 H940" marker-end="url(#iemx-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M506,245 H518 Q530,245 530,233 V187 Q530,175 542,175 H940" marker-end="url(#iemx-memerald)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"><path d="M596,472 V520" marker-end="url(#iemx-mslate)"/></g>
  <g filter="url(#iemx-soft)">
    <rect x="62" y="220" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="62" y="220" width="6" height="90" fill="#2563EB" clip-path="url(#iemx-k1)"/>
  </g>
  <circle cx="100" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(89.56,254.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="126" y="272" font-size="18.5" font-weight="600" fill="#111827">Customer turn</text>
  <text x="162" y="335" font-size="15.5" text-anchor="middle" fill="#6B7280">a new message arrives</text>
  <g filter="url(#iemx-soft)">
    <rect x="306" y="220" width="200" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="306" y="220" width="6" height="90" fill="#4F46E5" clip-path="url(#iemx-k2)"/>
  </g>
  <circle cx="344" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(333.56,254.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="370" y="272" font-size="18.5" font-weight="600" fill="#111827">Router</text>
  <text x="406" y="335" font-size="15.5" text-anchor="middle" fill="#6B7280">picks the model for each turn</text>
  <g filter="url(#iemx-soft)">
    <rect x="576" y="310" width="236" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="576" y="310" width="6" height="90" fill="#D97706" clip-path="url(#iemx-k3)"/>
  </g>
  <circle cx="614" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(603.56,344.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="640" y="362" font-size="18.5" font-weight="600" fill="#111827">Client-side budget</text>
  <text x="694" y="425" font-size="15.5" text-anchor="middle" fill="#6B7280">each feature gets a share;</text>
  <text x="694" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">slows or queues work near the limit</text>
  <g filter="url(#iemx-soft)">
    <rect x="940" y="310" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="940" y="310" width="6" height="90" fill="#7C3AED" clip-path="url(#iemx-k4)"/>
  </g>
  <circle cx="978" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,344.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="1004" y="362" font-size="18.5" font-weight="600" fill="#111827">Frontier API</text>
  <text x="1040" y="425" font-size="15.5" text-anchor="middle" fill="#6B7280">hard, lower-volume paths</text>
  <g filter="url(#iemx-soft)">
    <rect x="940" y="130" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="940" y="130" width="6" height="90" fill="#059669" clip-path="url(#iemx-k5)"/>
  </g>
  <circle cx="978" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="1004" y="182" font-size="18.5" font-weight="600" fill="#111827">Small model</text>
  <text x="1040" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">high-volume paths, hosted or self-hosted</text>
  <g filter="url(#iemx-soft)">
    <rect x="530" y="520" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="530" y="520" width="6" height="90" fill="#64748B" clip-path="url(#iemx-k6)"/>
  </g>
  <circle cx="568" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(557.56,554.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="594" y="572" font-size="18.5" font-weight="600" fill="#111827">Graceful degradation</text>
  <text x="665" y="635" font-size="15.5" text-anchor="middle" fill="#6B7280">a smaller model, a shorter answer, or a handoff to a human agent</text>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="568" y="384" fill="#5B21B6">hard turns, such as refund disputes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="876" y="341" fill="#B45309">within budget</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="741" y="161" fill="#047857">easy turns, such as order-status questions</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="608" y="501" fill="#475569">limit reached or provider down</text></g>
  <rect x="40" y="675" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="720" text-anchor="middle" font-size="16" fill="#475569">The end state is usually a mix: a frontier API for the hard paths, cheaper models for the high-volume paths.</text>
</svg>