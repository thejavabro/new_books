<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two relay styles: a polling publisher that selects unpublished rows on an interval, and change data capture that streams the database log in near real time">
  <defs>
    <marker id="ob3-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="ob3-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="ob3-k1"><rect x="170" y="280" width="260" height="70" rx="12"/></clipPath>
    <clipPath id="ob3-k2"><rect x="770" y="280" width="260" height="70" rx="12"/></clipPath>
    <clipPath id="ob3-k3"><rect x="470" y="540" width="300" height="80" rx="12"/></clipPath>
    <filter id="ob3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ob3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <rect x="40" y="44" width="560" height="430" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Style 1: polling publisher</text>
  <rect x="640" y="44" width="560" height="430" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="664" y="74" font-size="16.5" font-weight="600" fill="#5B21B6">Style 2: log tailing (CDC)</text>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M300,206 V272" marker-end="url(#ob3-mblue)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="300" y="246" fill="#1D4ED8">SELECT every interval</text>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M900,206 V272" marker-end="url(#ob3-mviolet)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="900" y="246" fill="#5B21B6">streams committed changes</text>
  </g>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M430,315 H600 Q612,315 612,327 V532" marker-end="url(#ob3-mblue)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M770,315 H640 Q628,315 628,327 V532" marker-end="url(#ob3-mviolet)"/>
  </g>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M 150,120 L 150,174 A 150,16 0 0 0 450,174 L 450,120" fill="#DBEAFE"/>
    <ellipse cx="300" cy="120" rx="150" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="300" y="167" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">outbox table</text>
  <g filter="url(#ob3-soft)">
    <rect x="170" y="280" width="260" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="170" y="280" width="6" height="70" fill="#2563EB" clip-path="url(#ob3-k1)"/>
  </g>
  <circle cx="208" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,304.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="234" y="322" font-size="18.5" font-weight="600" fill="#111827">Poller</text>
  <text x="300" y="375" font-size="15.5" text-anchor="middle" fill="#6B7280">delay up to one polling interval</text>
  <text x="300" y="398" font-size="15.5" text-anchor="middle" fill="#94A3B8">works on any database</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 750,120 L 750,174 A 150,16 0 0 0 1050,174 L 1050,120" fill="#EDE9FE"/>
    <ellipse cx="900" cy="120" rx="150" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="900" y="167" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">write-ahead log</text>
  <g filter="url(#ob3-soft)">
    <rect x="770" y="280" width="260" height="70" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="770" y="280" width="6" height="70" fill="#7C3AED" clip-path="url(#ob3-k2)"/>
  </g>
  <circle cx="808" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,304.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="834" y="322" font-size="18.5" font-weight="600" fill="#111827">CDC Connector</text>
  <text x="900" y="375" font-size="15.5" text-anchor="middle" fill="#6B7280">near real time, no query load</text>
  <text x="900" y="398" font-size="15.5" text-anchor="middle" fill="#94A3B8">one more system to run (Debezium)</text>
  <g filter="url(#ob3-soft)">
    <rect x="470" y="540" width="300" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="470" y="540" width="6" height="80" fill="#64748B" clip-path="url(#ob3-k3)"/>
  </g>
  <circle cx="508" cy="580" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,569.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="534" y="587" font-size="18.5" font-weight="600" fill="#111827">Message Broker</text>
  <rect x="40" y="660" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="684" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="706" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Pick polling</text>
  <text x="288" y="706" font-size="15.5" fill="#475569">when simplicity wins and a second of delay is acceptable</text>
  <rect x="64" y="728" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="750" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Pick CDC</text>
  <text x="288" y="750" font-size="15.5" fill="#475569">when the delay must be small and the team can run one more system</text>
</svg>