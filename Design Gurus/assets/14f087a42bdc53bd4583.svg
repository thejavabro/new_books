<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="614" viewBox="0 0 1240 614" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pagesplit-title pagesplit-desc">
<title id="pagesplit-title">A B-tree page split</title>
<desc id="pagesplit-desc">A leaf page holding four entries in four slots receives key 24. The entries are divided across two pages and the parent gains one new separator key. Five entries now occupy two pages, both with free space. One logical insert costs a write-ahead log record, a new page, a rewrite of the old page, and a parent update.</desc>
<defs>
<marker id="pagesplit-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pagesplit-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pagesplit-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pagesplit-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="614" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A B-tree page split</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Every split turns one logical write into several physical writes.</text>
<rect x="40" y="536" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="536" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="500" height="312" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V424A6 6 0 0 0 46 430H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">BEFORE: the leaf page is full</text>
<rect x="72" y="174" width="436" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="92" y="213" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Parent: separator keys</text>
<rect x="338" y="183" width="70" height="46" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="373" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">45</text><rect x="418" y="183" width="70" height="46" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="453" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">90</text>
<path d="M290 242V276" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M290 242V276" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pagesplit-marker-slate)"/>
<rect x="72" y="280" width="436" height="76" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="92" y="325" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Leaf</text>
<rect x="194" y="290" width="66" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="227" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">12</text><rect x="270" y="290" width="66" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="303" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">19</text><rect x="346" y="290" width="66" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="379" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">31</text><rect x="422" y="290" width="66" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="455" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">40</text>
<text x="290" y="408" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">Four slots, four entries, no room for key 24</text>
<text x="600" y="172" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">INSERT</text>
<rect x="560" y="183" width="80" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="600" y="212" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">24</text>
<path d="M600 233V306" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<path d="M546 318H654" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M546 318H654" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pagesplit-marker-red)"/>
<rect x="660" y="118" width="540" height="312" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M674 118H666A6 6 0 0 0 660 124V424A6 6 0 0 0 666 430H674Z" fill="#39D5AA"/><text x="690" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">AFTER: the page has split</text>
<rect x="692" y="174" width="476" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="712" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Parent gains</text><text x="712" y="222" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one separator</text>
<rect x="918" y="183" width="70" height="46" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="953" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">31</text><rect x="998" y="183" width="70" height="46" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1033" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">45</text><rect x="1078" y="183" width="70" height="46" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1113" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">90</text>
<path d="M807 242V276" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M807 242V276" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pagesplit-marker-slate)"/>
<path d="M1053 242V276" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1053 242V276" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pagesplit-marker-slate)"/>
<rect x="692" y="280" width="230" height="76" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="702" y="290" width="48" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="726" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">12</text><rect x="756" y="290" width="48" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="780" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">19</text><rect x="810" y="290" width="48" height="56" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="834" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">24</text><rect x="864" y="290" width="48" height="56" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="938" y="280" width="230" height="76" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="948" y="290" width="48" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="972" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">31</text><rect x="1002" y="290" width="48" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1026" y="325" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">40</text><rect x="1056" y="290" width="48" height="56" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/><rect x="1110" y="290" width="48" height="56" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="807" y="380" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">one free slot</text>
<text x="1053" y="380" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">two free slots</text>
<text x="930" y="408" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">Five entries now occupy two pages instead of one</text>
<rect x="40" y="450" width="400" height="60" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="450" width="5" height="60" rx="2.5" fill="#F3CF6A"/><text x="64" y="471.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">One logical insert,</text><text x="64" y="500.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">four physical writes</text>
<rect x="460" y="450" width="176" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="548" y="486" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">WAL record</text>
<rect x="648" y="450" width="176" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="736" y="472.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">new page</text><text x="736" y="499.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">written</text>
<rect x="836" y="450" width="176" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="924" y="472.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">old page</text><text x="924" y="499.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">rewritten</text>
<rect x="1024" y="450" width="176" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1112" y="472.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">parent page</text><text x="1112" y="499.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">updated</text>
<rect x="40" y="536" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="536" width="5" height="52" rx="2.5" fill="#F3CF6A"/><text x="64" y="555" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A split can cascade: if the parent is also full it splits too,</text><text x="64" y="581" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and a split that reaches the root is what makes the tree taller.</text>
<text x="66" y="570" font-size="21" font-weight="400" fill="#080C50" text-anchor="start"></text>
</svg>