<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="784" viewBox="0 0 1240 784" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An array counted in one pass into a tally, with the two values reaching the highest count marked"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="784" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="480" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">One pass builds the tally, then the answer is a pass over the tally</text>
<text x="212" y="189" text-anchor="end" font-size="19.5" font-weight="600" fill="#475569">input</text>
<rect x="240" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="286" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="286" y="138" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=0</text>
<rect x="342" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="388" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">2</text>
<text x="388" y="138" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=1</text>
<rect x="444" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="490" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">2</text>
<text x="490" y="138" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=2</text>
<rect x="546" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="592" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">3</text>
<text x="592" y="138" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=3</text>
<rect x="648" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="694" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="694" y="138" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=4</text>
<rect x="750" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="796" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">4</text>
<text x="796" y="138" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=5</text>
<text x="240" y="262" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">walk it once, adding one to the entry for each value</text>
<text x="352" y="331" text-anchor="end" font-size="19.5" font-weight="600" fill="#475569">value</text>
<text x="352" y="421" text-anchor="end" font-size="19.5" font-weight="600" fill="#1D4ED8">count</text>
<rect x="380" y="290" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="426" y="331" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<rect x="380" y="380" width="92" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="426" y="421" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">2</text>
<rect x="482" y="290" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="528" y="331" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">2</text>
<rect x="482" y="380" width="92" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="528" y="421" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">2</text>
<rect x="584" y="290" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="630" y="331" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">3</text>
<rect x="584" y="380" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="630" y="421" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">1</text>
<rect x="686" y="290" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="732" y="331" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">4</text>
<rect x="686" y="380" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="732" y="421" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">1</text>
<text x="380" y="500" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">the highest count is 2, and two values reach it, so the answer is 2</text>
<rect x="40" y="568" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="590" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="616" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">reaches the top</text>
<text x="348" y="616" font-size="19.5" fill="#475569">its count equals the highest count in the tally</text>
<rect x="64" y="638" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="664" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">counted, but lower</text>
<text x="348" y="664" font-size="19.5" fill="#475569">still in the tally, and not part of the answer</text>
<rect x="64" y="686" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="712" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">the input</text>
<text x="348" y="712" font-size="19.5" fill="#475569">read once, then never scanned again</text>
</svg>