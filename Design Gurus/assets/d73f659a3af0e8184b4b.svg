<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="570" viewBox="0 0 1300 570" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Service mesh: one control plane pushes configuration and certificates to the same sidecars that carry the service-to-service traffic">
  <rect x="0" y="0" width="1300" height="570" fill="#FFFFFF"/>
  <defs>
    <marker id="v" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
    <marker id="b" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1E3A8A"/>
    </marker>
    <marker id="bs" viewBox="0 0 9 9" refX="0.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#1E3A8A"/>
    </marker>
  </defs>

  
  <rect x="350" y="25" width="600" height="110" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="650" y="63" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">Control plane</text>
  <text x="650" y="93" font-size="20" fill="#334155" text-anchor="middle">Watches the registry. Issues and rotates</text>
  <text x="650" y="119" font-size="20" fill="#334155" text-anchor="middle">certificates. Holds the policy.</text>

  
  <text x="70" y="182" font-size="20" font-weight="700" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="7">Configuration and certificates, pushed over long-lived streams (xDS)</text>
  <line x1="650" y1="135" x2="650" y2="190" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="240" y1="190" x2="1020" y2="190" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="240" y1="190" x2="240" y2="242" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#v)"/>
  <line x1="630" y1="190" x2="630" y2="242" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#v)"/>
  <line x1="1020" y1="190" x2="1020" y2="242" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#v)"/>

  
  <rect x="100" y="240" width="280" height="162" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="115" y="252" width="250" height="58" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="240" y="288" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">sidecar proxy</text>
  <rect x="115" y="322" width="250" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="240" y="362" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Checkout</text>

  
  <rect x="490" y="240" width="280" height="162" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="505" y="252" width="250" height="58" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="630" y="288" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">sidecar proxy</text>
  <rect x="505" y="322" width="250" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="630" y="362" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Inventory</text>

  
  <rect x="880" y="240" width="280" height="162" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="895" y="252" width="250" height="58" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="1020" y="288" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">sidecar proxy</text>
  <rect x="895" y="322" width="250" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="1020" y="362" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Payments</text>

  <text x="1180" y="288" font-size="20" font-weight="700" fill="#475569">x 440</text>

  
  <text x="435" y="272" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">mTLS</text>
  <line x1="373" y1="288" x2="497" y2="288" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#b)" marker-start="url(#bs)"/>
  <text x="825" y="272" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">mTLS</text>
  <line x1="763" y1="288" x2="887" y2="288" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#b)" marker-start="url(#bs)"/>

  <text x="70" y="440" font-size="20" fill="#475569">Each dashed box is one service instance: the proxy runs beside the service it serves.</text>

  
  <text x="70" y="500" font-size="20" font-weight="700" fill="#0F172A">The control plane configures the same sidecars that carry the traffic. If it goes quiet, they keep</text>
  <text x="70" y="530" font-size="20" font-weight="700" fill="#0F172A">serving on their last configuration: changes freeze, traffic does not.</text>
</svg>