<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Anycast lets the network pick from many servers sharing one address, DNS-based routing answers the lookup with a chosen server, and GeoIP-based routing maps the client IP to a location first">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="cd6-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cd6-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="cd6-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="cd6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="386" height="390" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="213" y="78" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Anycast</text>

  <rect x="426" y="40" width="386" height="390" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="619" y="78" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">DNS-based routing</text>

  <rect x="832" y="40" width="386" height="390" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1025" y="78" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">GeoIP-based routing</text>

  <line x1="213" y1="162" x2="213" y2="190" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cd6-blue)"/>
  <line x1="213" y1="256" x2="90" y2="312" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cd6-blue)"/>
  <line x1="213" y1="256" x2="213" y2="312" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cd6-blue)"/>
  <line x1="213" y1="256" x2="336" y2="312" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cd6-blue)"/>

  <line x1="619" y1="162" x2="619" y2="190" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#cd6-violet)"/>
  <line x1="619" y1="256" x2="619" y2="312" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#cd6-violet)"/>

  <line x1="1025" y1="162" x2="1025" y2="190" stroke="#D97706" stroke-width="2.5" marker-end="url(#cd6-amber)"/>
  <line x1="1025" y1="256" x2="1025" y2="312" stroke="#D97706" stroke-width="2.5" marker-end="url(#cd6-amber)"/>

  <g filter="url(#cd6-soft)">
    <rect x="133" y="102" width="160" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="93" y="196" width="240" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="40" y="318" width="100" height="58" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="163" y="318" width="100" height="58" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="286" y="318" width="100" height="58" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

    <rect x="539" y="102" width="160" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="499" y="196" width="240" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="519" y="318" width="200" height="58" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>

    <rect x="945" y="102" width="160" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="905" y="196" width="240" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="925" y="318" width="200" height="58" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <text x="213" y="139" font-size="20" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="213" y="233" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">One shared IP</text>
  <text x="90" y="354" font-size="20" fill="#1E3A8A" text-anchor="middle">Edge</text>
  <text x="213" y="354" font-size="20" fill="#1E3A8A" text-anchor="middle">Edge</text>
  <text x="336" y="354" font-size="20" fill="#1E3A8A" text-anchor="middle">Edge</text>
  <text x="213" y="406" font-size="20" fill="#475569" text-anchor="middle">The network picks the nearest</text>

  <text x="619" y="139" font-size="20" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="619" y="233" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">CDN DNS server</text>
  <text x="619" y="354" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Chosen edge</text>
  <text x="619" y="406" font-size="20" fill="#475569" text-anchor="middle">The reply names one server</text>

  <text x="1025" y="139" font-size="20" fill="#0F172A" text-anchor="middle">Client IP</text>
  <text x="1025" y="233" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Look up location</text>
  <text x="1025" y="354" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Nearest edge</text>
  <text x="1025" y="406" font-size="20" fill="#475569" text-anchor="middle">Chosen by physical distance</text>
</svg>