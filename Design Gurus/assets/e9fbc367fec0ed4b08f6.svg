<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Adding apple: the three hash functions return positions 2, 7, and 11, and those bits are set to 1. Adding banana: the hash functions return positions 4, 9, and 11. Bits 4 and 9 are set to 1, and bit 11 is already 1. Afterwards bits 2, 4, 7, 9, and 11 are 1.">
  <defs>
    <filter id="bl2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bl2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bl2-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bl2-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bl2-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bl2-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bl2-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bl2-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="bl2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Adding two items to a 12-bit Bloom filter</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three hash functions turn each item into three positions. Those bits become 1.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Add apple</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#1D4ED8">Add banana</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#bl2-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#bl2-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#bl2-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#bl2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#bl2-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#bl2-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">apple</text>
  <g filter="url(#bl2-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#bl2-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">Positions 2, 7, 11</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">from 3 hash functions</text>
  <g filter="url(#bl2-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#bl2-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Set bits 2, 7, 11</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">0 becomes 1</text>
  <g filter="url(#bl2-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#bl2-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">banana</text>
  <g filter="url(#bl2-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#bl2-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Positions 4, 9, 11</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">from the same 3 functions</text>
  <g filter="url(#bl2-lift)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="836" y="430" width="9" height="90" fill="#2563EB" clip-path="url(#bl2-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">Set bits 4, 9, 11</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">bit 11 is already 1</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Bits now 1</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">2, 4, 7, 9, and 11. All other bits are still 0.</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Never cleared</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">bits only change from 0 to 1, so the order of adding does not matter</text>
</svg>