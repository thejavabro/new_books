<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" style="background-color:#ffffff">
<defs>
<marker id="ga" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#3a6fb0"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">

<text x="30" y="30" font-size="14" font-weight="bold" fill="#b4322c">Without the pattern: nothing stops a mismatch</text>

<rect x="30" y="48" width="200" height="52" rx="4" fill="#ffffff" stroke="#c3cfe0"/>
<text x="130" y="70" text-anchor="middle" font-size="12.5">PostgresConnection</text>
<text x="130" y="89" text-anchor="middle" font-size="11.5" fill="#414d60">port 5432</text>

<text x="252" y="80" text-anchor="middle" font-size="18" fill="#b4322c">+</text>

<rect x="275" y="48" width="210" height="52" rx="4" fill="#ffffff" stroke="#c3cfe0"/>
<text x="380" y="70" text-anchor="middle" font-size="12.5">MySqlQueryBuilder</text>
<text x="380" y="89" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#414d60">SELECT * FROM `orders`</text>

<rect x="520" y="44" width="410" height="60" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="540" y="68" font-size="12.5" fill="#b4322c">Compiles. Runs. Fails at the database, because</text>
<text x="540" y="88" font-size="12.5" fill="#b4322c">Postgres does not accept backtick-quoted identifiers.</text>

<line x1="30" y1="136" x2="930" y2="136" stroke="#dbe2ed"/>

<text x="30" y="172" font-size="14" font-weight="bold" fill="#2f7a55">With the pattern: one factory hands you a matched set</text>

<rect x="30" y="196" width="230" height="150" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="145" y="222" text-anchor="middle" font-weight="bold">PostgresFactory</text>
<rect x="50" y="238" width="190" height="42" rx="3" fill="#ffffff" stroke="#6c8ebf"/>
<text x="145" y="264" text-anchor="middle" font-size="12.5">PostgresConnection</text>
<rect x="50" y="290" width="190" height="42" rx="3" fill="#ffffff" stroke="#6c8ebf"/>
<text x="145" y="316" text-anchor="middle" font-size="12.5">PostgresQueryBuilder</text>

<rect x="300" y="196" width="230" height="150" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="415" y="222" text-anchor="middle" font-weight="bold">MySqlFactory</text>
<rect x="320" y="238" width="190" height="42" rx="3" fill="#ffffff" stroke="#6c8ebf"/>
<text x="415" y="264" text-anchor="middle" font-size="12.5">MySqlConnection</text>
<rect x="320" y="290" width="190" height="42" rx="3" fill="#ffffff" stroke="#6c8ebf"/>
<text x="415" y="316" text-anchor="middle" font-size="12.5">MySqlQueryBuilder</text>

<rect x="600" y="220" width="200" height="52" rx="4" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="700" y="243" text-anchor="middle" font-family="monospace" font-size="12.5">runReport(factory)</text>
<text x="700" y="262" text-anchor="middle" font-size="11.5" fill="#414d60">names no concrete class</text>

<path d="M 530 246 L 595 246" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#ga)"/>
<path d="M 260 246 L 280 246 L 280 360 L 700 360 L 700 276" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#ga)"/>

<rect x="30" y="386" width="900" height="42" rx="6" fill="#dcefe4" stroke="#2f7a55"/>
<text x="52" y="412" font-size="13" fill="#2f7a55">Both objects come from the same factory, so a mismatched pair is not something the code can express.</text>
</g>
</svg>