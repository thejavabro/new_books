<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1410" viewBox="0 0 1240 1410" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The hybrid approach: the service writes the user action and publishes an event to Kafka, and aggregator workers batch the events into a single periodic update of the counts store">
  <defs>
    <filter id="ytc3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytc3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytc3-k1"><rect x="40" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="ytc3-k2"><rect x="400" y="150" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="ytc3-k3"><rect x="780" y="150" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytc3-k4"><rect x="700" y="410" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytc3-k5"><rect x="700" y="650" width="340" height="90" rx="12"/></clipPath>
    <marker id="ytc3-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ytc3-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ytc3-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ytc3-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1410" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Approach 2: record the action now, count it later</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The action is stored and an event is published, then workers batch many likes into one counter update.</text>



  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#ytc3-m-blue)"/>
    <path d="M680,195 H772" stroke="#2563EB" marker-end="url(#ytc3-m-blue)"/>
    <path d="M880,312 V342 Q880,354 868,354 H302 Q290,354 290,366 V414" stroke="#059669" marker-end="url(#ytc3-m-emerald)"/>
    <path d="M950,312 V404" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ytc3-m-violet)"/>
    <path d="M870,576 V644" stroke="#7C3AED" marker-end="url(#ytc3-m-violet)"/>
    <path d="M870,816 V884" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ytc3-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="336" y="183" fill="#1D4ED8">likes</text>
    <text x="726" y="183" fill="#1D4ED8">routes</text>
    <text x="600" y="336" fill="#047857">write the action</text>
    <text x="1070" y="366" fill="#5B21B6">publish</text>
    <text x="1000" y="614" fill="#5B21B6">consume in batches</text>
    <text x="1010" y="854" fill="#4338CA">one update per batch</text>
  </g>

  <g filter="url(#ytc3-soft)">
    <rect x="40" y="150" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#ytc3-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web and mobile</text>
  <g filter="url(#ytc3-soft)">
    <rect x="400" y="150" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="400" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#ytc3-k2)"/>
  </g>
  <circle cx="438" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="464" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="540" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">auth and rate limits</text>
  <g filter="url(#ytc3-lift)">
    <rect x="780" y="150" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="780" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#ytc3-k3)"/>
  </g>
  <circle cx="818" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6-6 6 6"/><path d="M6 14l6 6 6-6"/></g>
  <text x="844" y="202" font-size="21.5" font-weight="600" fill="#111827">Like/Dislike Service</text>
  <text x="950" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">stateless, scales out</text>
  <text x="950" y="296" font-size="18.5" text-anchor="middle" fill="#94A3B8">one write path, one read path</text>
  <g filter="url(#ytc3-soft)">
    <rect x="700" y="410" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="700" y="410" width="6" height="90" fill="#7C3AED" clip-path="url(#ytc3-k4)"/>
  </g>
  <circle cx="738" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,444.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="764" y="462" font-size="21.5" font-weight="600" fill="#111827">Kafka topic</text>
  <text x="870" y="529" font-size="18.5" text-anchor="middle" fill="#6B7280">one event per reaction</text>
  <text x="870" y="556" font-size="18.5" text-anchor="middle" fill="#94A3B8">durable until processed</text>
  <g filter="url(#ytc3-soft)">
    <rect x="700" y="650" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="700" y="650" width="6" height="90" fill="#7C3AED" clip-path="url(#ytc3-k5)"/>
  </g>
  <circle cx="738" cy="695" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,684.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="764" y="702" font-size="21.5" font-weight="600" fill="#111827">Aggregator workers</text>
  <text x="870" y="769" font-size="18.5" text-anchor="middle" fill="#6B7280">buffer in memory</text>
  <text x="870" y="796" font-size="18.5" text-anchor="middle" fill="#94A3B8">flush on a count or a timer</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M140,420 L140,504 A150,16 0 0 0 440,504 L440,420" fill="#D1FAE5"/>
    <ellipse cx="290" cy="420" rx="150" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="290" y="477" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">User actions</text>
  <text x="290" y="554" font-size="18.5" text-anchor="middle" fill="#6B7280">written on the request</text>
  <text x="290" y="581" font-size="18.5" text-anchor="middle" fill="#94A3B8">the durable record</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M700,890 L700,974 A170,16 0 0 0 1040,974 L1040,890" fill="#E0E7FF"/>
    <ellipse cx="870" cy="890" rx="170" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="870" y="947" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Counts</text>
  <text x="870" y="1024" font-size="18.5" text-anchor="middle" fill="#6B7280">the durable total</text>
  <text x="870" y="1051" font-size="18.5" text-anchor="middle" fill="#94A3B8">seconds behind the action</text>

  <rect x="40" y="1120" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1145" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1170" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">The user never waits</text>
  <text x="323" y="1170" font-size="18.5" fill="#475569">an insert and a publish are both fast, and the counting happens behind the reply</text>
  <rect x="64" y="1195" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="1220" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Batching kills the hot row</text>
  <text x="323" y="1220" font-size="18.5" fill="#475569">a hundred likes become one update, which is what makes the counter survive</text>
  <rect x="64" y="1245" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="1270" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Eventually consistent</text>
  <text x="323" y="1270" font-size="18.5" fill="#475569">the stored total lags the action by seconds, so a reader can see a stale count</text>
  <rect x="64" y="1295" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1320" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Must be idempotent</text>
  <text x="323" y="1320" font-size="18.5" fill="#475569">a replayed event double counts unless the worker dedupes, and Kafka will replay</text>
</svg>