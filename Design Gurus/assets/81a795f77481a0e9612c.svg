<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-label="When several nodes must agree on one answer, such as which of them is the leader, they ask a coordination service. It grants the claim to exactly one of them and tells the others no.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="520" fill="#FFFFFF"/>
  <rect x="45" y="41" width="250" height="82" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="80" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Node A</text>
  <text x="170" y="105" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">asks to be leader</text>
  <path d="M298 82 C 400 82, 400 216, 452 199.92000000000002" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="45" y="175" width="250" height="82" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="214" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Node B</text>
  <text x="170" y="239" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">asks to be leader</text>
  <path d="M298 216 C 400 216, 400 216, 452 216" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="45" y="309" width="250" height="82" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="348" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Node C</text>
  <text x="170" y="373" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">asks to be leader</text>
  <path d="M298 350 C 400 350, 400 216, 452 232.07999999999998" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="460" y="140" width="300" height="152" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="186" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Coordination</text>
  <text x="610" y="216" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">service</text>
  <text x="610" y="258" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">ZooKeeper, etcd</text>
  <path d="M768 199.92000000000002 C 830 199.92000000000002, 830 82, 892 82" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-grn)"/>
  <rect x="900" y="52" width="300" height="60" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <path d="M922 78 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1075" y="90" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">You are the leader</text>
  <path d="M768 216 C 830 216, 830 216, 892 216" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="900" y="186" width="300" height="60" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M922 207 l16 16 M938 207 l-16 16" fill="none" stroke="#CBD5E1" stroke-width="2.6" stroke-linecap="round"/>
  <text x="1075" y="224" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Not you</text>
  <path d="M768 232.07999999999998 C 830 232.07999999999998, 830 350, 892 350" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="900" y="320" width="300" height="60" rx="10" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M922 341 l16 16 M938 341 l-16 16" fill="none" stroke="#CBD5E1" stroke-width="2.6" stroke-linecap="round"/>
  <text x="1075" y="358" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Not you</text>
  <rect x="40" y="424" width="1160" height="72" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="458" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Mention one for leader election, distributed locking, service discovery, or shared configuration.</text>
  <text x="70" y="488" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">If your design has none of those, you do not need one.</text>
</svg>