<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Detailed Twitter design: clients reach application servers through a load balancer, aggregator servers merge partial timeline results from cache servers that fall back to the sharded tweet database partitions, while new tweets go to the database partitions and media goes to file storage.">
  <defs>
    <marker id="tw04-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="tw04-mp" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="tw04-ma" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="tw04-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="tw04-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="tw04-k1"><rect x="50" y="60" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="tw04-k2"><rect x="330" y="60" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="tw04-k3"><rect x="680" y="60" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="tw04-k4"><rect x="880" y="310" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="tw04-k5"><rect x="560" y="310" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="tw04-k6"><rect x="240" y="310" width="214" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M220,105 H330" marker-end="url(#tw04-mb)"/>
    <path d="M544,105 H680" marker-end="url(#tw04-mb)"/>
    <path d="M930,150 V310" marker-end="url(#tw04-mb)"/>
    <path d="M880,355 H774" marker-end="url(#tw04-mb)"/>
    <path d="M560,355 H454" marker-end="url(#tw04-mb)"/>
    <path d="M240,380 H192 Q180,380 180,392 V628 Q180,640 192,640 H450" marker-end="url(#tw04-mb)"/>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M700,150 V240 Q700,252 712,252 H815 Q827,252 827,264 V550" marker-end="url(#tw04-mp)"/>
  </g>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M956,105 H1198 Q1210,105 1210,117 V588 Q1210,600 1198,600 H1170" marker-end="url(#tw04-ma)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="1005" y="245" fill="#1D4ED8">timeline request</text>
    <text x="507" y="346" fill="#1D4ED8">hot tweets</text>
    <text x="320" y="630" fill="#1D4ED8">on miss, query every partition</text>
    <text x="827" y="470" fill="#BE185D">new tweets</text>
    <text x="1210" y="300" fill="#B45309">media</text>
  </g>

  
  <g filter="url(#tw04-soft)">
    <rect x="50" y="60" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="60" width="6" height="90" fill="#2563EB" clip-path="url(#tw04-k1)"/>
  </g>
  <circle cx="88" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,94.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="114" y="112" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#tw04-soft)">
    <rect x="330" y="60" width="214" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="330" y="60" width="6" height="90" fill="#64748B" clip-path="url(#tw04-k2)"/>
  </g>
  <circle cx="368" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,94.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="394" y="112" font-size="18.5" font-weight="600" fill="#111827">Load Balancer</text>

  
  <g filter="url(#tw04-soft)">
    <rect x="680" y="60" width="276" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="680" y="60" width="6" height="90" fill="#2563EB" clip-path="url(#tw04-k3)"/>
  </g>
  <circle cx="718" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,94.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="744" y="112" font-size="18.5" font-weight="600" fill="#111827">Application Servers</text>
  <text x="818" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">handle writes and</text>
  <text x="818" y="198" font-size="15.5" text-anchor="middle" fill="#6B7280">start timeline reads</text>

  
  <g filter="url(#tw04-lift)">
    <rect x="880" y="310" width="265" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="880" y="310" width="9" height="90" fill="#7C3AED" clip-path="url(#tw04-k4)"/>
  </g>
  <circle cx="918" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,344.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="944" y="362" font-size="18.5" font-weight="600" fill="#111827">Aggregator Servers</text>
  <text x="1012" y="425" font-size="15.5" text-anchor="middle" fill="#6B7280">merge and sort partial results</text>
  <text x="1012" y="448" font-size="15.5" text-anchor="middle" fill="#6B7280">into one timeline</text>

  
  <g filter="url(#tw04-soft)">
    <rect x="560" y="310" width="214" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="560" y="310" width="6" height="90" fill="#64748B" clip-path="url(#tw04-k5)"/>
  </g>
  <circle cx="598" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(587.56,344.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="624" y="362" font-size="18.5" font-weight="600" fill="#111827">Load Balancer</text>

  
  <g filter="url(#tw04-soft)">
    <rect x="240" y="310" width="214" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="240" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#tw04-k6)"/>
  </g>
  <circle cx="278" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(267.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="304" y="362" font-size="18.5" font-weight="600" fill="#111827">Cache Servers</text>
  <text x="347" y="425" font-size="15.5" text-anchor="middle" fill="#6B7280">tweets from the last three days,</text>
  <text x="347" y="448" font-size="15.5" text-anchor="middle" fill="#6B7280">about 90 GB, replicated</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M450,560 L450,668 A210,16 0 0 0 870,668 L870,560" fill="#EDE9FE"/>
    <ellipse cx="660" cy="560" rx="210" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="660" y="630" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Tweet DB partitions</text>
  <text x="660" y="712" font-size="15.5" text-anchor="middle" fill="#6B7280">sharded by TweetID; primary plus read replicas</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M950,560 L950,668 A110,16 0 0 0 1170,668 L1170,560" fill="#FEF3C7"/>
    <ellipse cx="1060" cy="560" rx="110" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1060" y="630" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">File Storage</text>
  <text x="1060" y="712" font-size="15.5" text-anchor="middle" fill="#6B7280">photos and videos</text>

  
  <rect x="40" y="770" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="794" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="816" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Read path</text>
  <text x="288" y="816" font-size="15.5" fill="#475569">cache first; a miss fans out to every partition and the aggregator merges</text>
  <rect x="64" y="838" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="860" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Write path</text>
  <text x="288" y="860" font-size="15.5" fill="#475569">new tweets go to the partition their TweetID hashes to</text>
</svg>