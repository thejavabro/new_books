<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram with five lifelines: client, client stub, broker, server skeleton and server. 1, the client makes a method call on the client stub. 2, the stub serializes the request and sends it to the broker. 3, the broker routes it to the server skeleton. 4, the skeleton deserializes it and the server executes it. 5, the server returns the result to the skeleton. 6, the skeleton serializes the response and sends it to the broker. 7, the broker returns the response to the client stub. 8, the stub deserializes it and returns the value to the client. The client stays active from step 1 to step 8 while it waits for the response">
  <defs>
    <filter id="m12d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m12d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m12d-k1"><rect x="40" y="120" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m12d-k2"><rect x="280" y="120" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m12d-k3"><rect x="520" y="120" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m12d-k4"><rect x="760" y="120" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m12d-k5"><rect x="1000" y="120" width="200" height="90" rx="12"/></clipPath>
    <marker id="m12d-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m12d-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="910" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Broker architecture: complete request-response flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Four messages carry the call from the client to the server, and four carry the result back.</text>



  <g fill="none" stroke-width="2">
    <path d="M140,210 V870" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M380,210 V870" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M620,210 V870" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M860,210 V870" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M1100,210 V870" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M147,300 H373" stroke="#2563EB" marker-end="url(#m12d-m-blue)"/>
    <path d="M387,365 H613" stroke="#2563EB" marker-end="url(#m12d-m-blue)"/>
    <path d="M627,430 H853" stroke="#2563EB" marker-end="url(#m12d-m-blue)"/>
    <path d="M867,520 H1093" stroke="#2563EB" marker-end="url(#m12d-m-blue)"/>
    <path d="M1093,595 H867" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12d-m-blue)"/>
    <path d="M853,660 H627" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12d-m-blue)"/>
    <path d="M613,725 H387" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12d-m-blue)"/>
    <path d="M373,815 H147" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12d-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="160" y="286" fill="#1D4ED8" text-anchor="start">1. Method call</text>
    <text x="400" y="351" fill="#1D4ED8" text-anchor="start">2. Serialize request</text>
    <text x="640" y="416" fill="#1D4ED8" text-anchor="start">3. Route to server</text>
    <text x="880" y="483" fill="#1D4ED8" text-anchor="start">4. Deserialize</text>
    <text x="880" y="506" fill="#1D4ED8" text-anchor="start">and execute</text>
    <text x="880" y="581" fill="#1D4ED8" text-anchor="start">5. Return result</text>
    <text x="640" y="646" fill="#1D4ED8" text-anchor="start">6. Serialize response</text>
    <text x="400" y="711" fill="#1D4ED8" text-anchor="start">7. Return response</text>
    <text x="160" y="778" fill="#1D4ED8" text-anchor="start">8. Deserialize</text>
    <text x="160" y="801" fill="#1D4ED8" text-anchor="start">and return</text>
  </g>

  <g filter="url(#m12d-soft)">
    <rect x="40" y="120" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="120" width="6" height="90" fill="#64748B" clip-path="url(#m12d-k1)"/>
  </g>
  <circle cx="78" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,154.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="172" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m12d-soft)">
    <rect x="280" y="120" width="200" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="280" y="120" width="6" height="90" fill="#4F46E5" clip-path="url(#m12d-k2)"/>
  </g>
  <circle cx="318" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(307.56,154.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="344" y="159.25" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="344" y="184.75" font-size="21.5" font-weight="600" fill="#111827">stub</text>
  <g filter="url(#m12d-lift)">
    <rect x="520" y="120" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="520" y="120" width="9" height="90" fill="#7C3AED" clip-path="url(#m12d-k3)"/>
  </g>
  <circle cx="558" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,154.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="584" y="172" font-size="21.5" font-weight="600" fill="#111827">Broker</text>
  <g filter="url(#m12d-soft)">
    <rect x="760" y="120" width="200" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="760" y="120" width="6" height="90" fill="#4F46E5" clip-path="url(#m12d-k4)"/>
  </g>
  <circle cx="798" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,154.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="824" y="159.25" font-size="21.5" font-weight="600" fill="#111827">Server</text>
  <text x="824" y="184.75" font-size="21.5" font-weight="600" fill="#111827">skeleton</text>
  <g filter="url(#m12d-soft)">
    <rect x="1000" y="120" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="1000" y="120" width="6" height="90" fill="#2563EB" clip-path="url(#m12d-k5)"/>
  </g>
  <circle cx="1038" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="1064" y="172" font-size="21.5" font-weight="600" fill="#111827">Server</text>

  <rect x="373" y="288" width="14" height="539" rx="3" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="613" y="353" width="14" height="384" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="853" y="418" width="14" height="254" rx="3" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="1093" y="508" width="14" height="99" rx="3" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <rect x="133" y="288" width="14" height="551" rx="3" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>


</svg>