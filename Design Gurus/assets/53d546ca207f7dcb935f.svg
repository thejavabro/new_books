<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" style="background-color:#ffffff">
<defs>
<marker id="fwa" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#2f7a55"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="28" font-size="13.5" font-weight="bold" fill="#b4322c">Without the pattern: every marker carries its own copy of the icon</text>

<rect x="30" y="44" width="200" height="76" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="130" y="66" text-anchor="middle" font-size="12">Marker 1</text>
<text x="44" y="86" font-size="11">lat, lon</text>
<text x="44" y="104" font-size="11" fill="#b4322c">icon bitmap, 2 MB</text>

<rect x="248" y="44" width="200" height="76" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="348" y="66" text-anchor="middle" font-size="12">Marker 2</text>
<text x="262" y="86" font-size="11">lat, lon</text>
<text x="262" y="104" font-size="11" fill="#b4322c">icon bitmap, 2 MB</text>

<rect x="466" y="44" width="200" height="76" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="566" y="66" text-anchor="middle" font-size="12">Marker 3</text>
<text x="480" y="86" font-size="11">lat, lon</text>
<text x="480" y="104" font-size="11" fill="#b4322c">icon bitmap, 2 MB</text>

<text x="690" y="70" font-size="13" fill="#b4322c">A million markers means a million</text>
<text x="690" y="90" font-size="13" fill="#b4322c">copies of the same bitmap.</text>
<text x="690" y="114" font-size="13" font-weight="bold" fill="#b4322c">That is not slow. That is a crash.</text>

<line x1="30" y1="150" x2="930" y2="150" stroke="#dbe2ed"/>

<text x="30" y="180" font-size="13.5" font-weight="bold" fill="#2f7a55">With the pattern: split the state, and share the half that repeats</text>

<rect x="30" y="198" width="230" height="46" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="44" y="216" font-size="12">Marker 1</text>
<text x="44" y="234" font-size="11" fill="#414d60">lat, lon &#183; style reference</text>

<rect x="30" y="252" width="230" height="46" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="44" y="270" font-size="12">Marker 2</text>
<text x="44" y="288" font-size="11" fill="#414d60">lat, lon &#183; style reference</text>

<rect x="30" y="306" width="230" height="46" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="44" y="324" font-size="12">Marker 3</text>
<text x="44" y="342" font-size="11" fill="#414d60">lat, lon &#183; style reference</text>

<rect x="30" y="360" width="230" height="46" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="44" y="378" font-size="12">Marker 4</text>
<text x="44" y="396" font-size="11" fill="#414d60">lat, lon &#183; style reference</text>

<rect x="560" y="254" width="230" height="96" rx="4" fill="#dcefe4" stroke="#2f7a55" stroke-width="2"/>
<text x="675" y="280" text-anchor="middle" font-weight="bold">MarkerStyle</text>
<text x="675" y="302" text-anchor="middle" font-size="11.5" fill="#2f7a55">icon bitmap, 2 MB</text>
<text x="675" y="322" text-anchor="middle" font-size="11.5" fill="#2f7a55">colour, size</text>
<text x="675" y="342" text-anchor="middle" font-size="11" fill="#2f7a55">one object, immutable</text>

<path d="M 264 221 L 410 221 L 410 284 L 555 284" stroke="#2f7a55" fill="none" marker-end="url(#fwa)"/>
<path d="M 264 275 L 430 275 L 430 296 L 555 296" stroke="#2f7a55" fill="none" marker-end="url(#fwa)"/>
<path d="M 264 329 L 430 329 L 430 308 L 555 308" stroke="#2f7a55" fill="none" marker-end="url(#fwa)"/>
<path d="M 264 383 L 410 383 L 410 320 L 555 320" stroke="#2f7a55" fill="none" marker-end="url(#fwa)"/>

<text x="810" y="284" font-size="12.5" fill="#2f7a55">Unique state stays</text>
<text x="810" y="302" font-size="12.5" fill="#2f7a55">in the marker.</text>
<text x="810" y="326" font-size="12.5" fill="#2f7a55">Shared state moves</text>
<text x="810" y="344" font-size="12.5" fill="#2f7a55">out, exactly once.</text>

<rect x="30" y="424" width="900" height="34" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="446" font-size="12.5" fill="#414d60">The shared half must be immutable. If one marker could recolour the style, every marker on the map would change with it.</text>
</g>
</svg>