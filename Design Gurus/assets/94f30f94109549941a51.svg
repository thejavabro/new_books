<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="682" viewBox="0 0 1240 682" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="perrequest-title perrequest-desc">
<title id="perrequest-title">Cost per request, worked</title>
<desc id="perrequest-desc">Compute, database and egress estimated for one request returning two hundred kilobytes. Egress dominates by a wide margin, and the only comparison that matters is against what the request earns.</desc>
<defs>
<marker id="perrequest-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="perrequest-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="perrequest-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="perrequest-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="682" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Cost per request, worked</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Compute, database and egress estimated for one request returning two hundred kilobytes.</text>
<rect x="40" y="604" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="604" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="240" y="118" width="760" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="152" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">One request: serves a page, reads a database, returns 200 KB</text>
<rect x="40" y="198" width="230" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="155" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Compute</text>
<rect x="290" y="198" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="310" y="221.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">1 instance at 200 req/sec,</text><text x="310" y="246.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">about 10 cents an hour</text>
<rect x="650" y="211" width="300" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="650" y="211" width="14.0" height="34" rx="10" fill="#06AC80"/>
<text x="966" y="235" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">about 0.00001 cents</text>
<rect x="40" y="274" width="230" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="155" y="310" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Database</text>
<rect x="290" y="274" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="310" y="297.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">say five times the</text><text x="310" y="322.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">application tier</text>
<rect x="650" y="287" width="300" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="650" y="287" width="14.0" height="34" rx="10" fill="#06AC80"/>
<text x="966" y="311" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">about 0.00007 cents</text>
<rect x="40" y="350" width="230" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="155" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Egress</text>
<rect x="290" y="350" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="310" y="373.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">200 KB at the order of</text><text x="310" y="398.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">ten cents a gigabyte</text>
<rect x="650" y="363" width="300" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="650" y="363" width="300.0" height="34" rx="10" fill="#F25461"/>
<text x="966" y="387" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">about 0.002 cents</text>
<rect x="40" y="434" width="1160" height="144" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="620" y="470" font-size="23" font-weight="700" fill="#6040A8" text-anchor="middle">Egress dominates by a wide margin, from a calculation that took a minute</text>
<rect x="72" y="490" width="540" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="342" y="514.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Page earns 0.1 cents</text><text x="342" y="541.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">comfortable</text>
<rect x="628" y="490" width="540" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="898" y="514.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Page earns 0.001 cents</text><text x="898" y="541.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">egress alone exceeds revenue</text>
<text x="66" y="638" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Find the dominant component and compare it to revenue. Precision in the small terms is wasted.</text>
</svg>