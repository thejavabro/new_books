<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="zones-title zones-desc">
<title id="zones-title">Paying to cross a zone</title>
<desc id="zones-desc">A three-zone deployment sends roughly two thirds of its internal traffic across a zone boundary, charged in both directions. Zone-aware routing keeps the availability property and removes most of the cost.</desc>
<defs>
<marker id="zones-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="zones-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="zones-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="zones-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="664" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Paying to cross a zone</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The cross-zone charge is the one that catches people.</text>
<rect x="40" y="586" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="586" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="142" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Spread over three zones for availability, as everybody is told to</text>
<rect x="40" y="160" width="360" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="220" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">zone a</text>
<rect x="440" y="160" width="360" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">zone b</text>
<rect x="840" y="160" width="360" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1020" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">zone c</text>
<path d="M220 222C220 258 600 258 600 222" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M220 222C220 258 600 258 600 222" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#zones-marker-slate)"/>
<path d="M660 222C660 258 1020 258 1020 222" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M660 222C660 258 1020 258 1020 222" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#zones-marker-slate)"/>
<path d="M130 226C130 292 1120 292 1120 224" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M130 226C130 292 1120 292 1120 224" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#zones-marker-slate)"/>
<text x="620" y="308" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">services call each other without knowing which zone the other instance is in</text>
<rect x="40" y="330" width="560" height="150" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="330" width="5" height="150" rx="2.5" fill="#F28B9D"/><text x="64" y="372" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">What that costs</text><text x="64" y="398" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">about two thirds of internal traffic</text><text x="64" y="424" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">crosses a zone boundary</text><text x="64" y="450" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">50 TB a month = several hundred dollars</text>
<rect x="640" y="330" width="560" height="150" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="330" width="5" height="150" rx="2.5" fill="#39D5AA"/><text x="664" y="372" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The fix is not one zone</text><text x="664" y="398" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">zone-aware routing: prefer a local</text><text x="664" y="424" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">instance, fall back to a remote one</text><text x="664" y="450" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">keeps the availability, drops the hops</text>
<rect x="40" y="500" width="1160" height="60" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="500" width="5" height="60" rx="2.5" fill="#AC8BE8"/><text x="64" y="536" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">The architecture that causes this charge is the architecture everybody recommends.</text>
<text x="66" y="620" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Traffic that stayed inside one region, billed at a rate most people associate with the internet.</text>
</svg>