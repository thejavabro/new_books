<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="952" viewBox="0 0 1240 952" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="expand-title expand-desc">
<title id="expand-title">Expand and contract</title>
<desc id="expand-desc">Add the new structure without removing anything, write both and backfill and move reads, then stop writing the old and remove it. Each phase is a separate deploy so that each one is independently reversible.</desc>
<defs>
<marker id="expand-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="expand-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="expand-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="expand-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="952" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Expand and contract</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The pattern that satisfies the constraint is three phases, each a separate deploy.</text>
<rect x="40" y="874" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="874" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="186" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V298A6 6 0 0 0 46 304H54Z" fill="#39D5AA"/>
<circle cx="226" cy="152" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="226" y="160" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="226" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Expand</text>
<text x="226" y="240" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">add the new structure, remove</text><text x="226" y="265" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">nothing; old code ignores it and</text><text x="226" y="290" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">nothing breaks if you stop here</text>
<rect x="434" y="118" width="372" height="186" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V298A6 6 0 0 0 440 304H448Z" fill="#F3CF6A"/>
<circle cx="620" cy="152" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="160" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="620" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Migrate</text>
<text x="620" y="240" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">write both, backfill the existing</text><text x="620" y="265" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">rows, then move reads; each of</text><text x="620" y="290" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">those is its own step</text>
<rect x="828" y="118" width="372" height="186" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V298A6 6 0 0 0 834 304H842Z" fill="#5EC9EC"/>
<circle cx="1014" cy="152" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1014" y="160" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1014" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Contract</text>
<text x="1014" y="240" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">stop writing the old, confirm</text><text x="1014" y="265" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">nothing reads it, then remove it</text>
<rect x="40" y="326" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="326" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="357.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Each phase is a separate deploy, and each can be rolled back on its own.</text><text x="64" y="386.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A change you cannot roll back at three in the morning becomes a long incident.</text>
<text x="40" y="446" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Renaming a column, in full</text>
<circle cx="60" cy="486" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="493" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="464" width="1108" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="112" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">add email_address alongside email</text>
<circle cx="60" cy="536" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="543" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="514" width="1108" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="112" y="542" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">deploy code that writes both and reads email</text>
<circle cx="60" cy="586" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="593" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="564" width="1108" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="112" y="592" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">backfill email_address for existing rows</text>
<circle cx="60" cy="636" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="643" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="614" width="1108" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="112" y="642" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">deploy code that reads email_address</text>
<circle cx="60" cy="686" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="693" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="92" y="664" width="1108" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="112" y="692" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">deploy code that writes only email_address</text>
<circle cx="60" cy="736" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="743" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="92" y="714" width="1108" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="112" y="742" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">drop email</text>
<rect x="40" y="782" width="1160" height="66" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="782" width="5" height="66" rx="2.5" fill="#F3CF6A"/><text x="64" y="821" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Six deploys for a rename. That is the price of being safe at every intermediate point.</text>
<text x="66" y="908" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The number of steps is the point, and it is the answer an interviewer is listening for.</text>
</svg>