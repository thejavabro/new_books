<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The sorted array and its prefix sums">
<defs>
<filter id="ad-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">For each number in [1, 3, 6], add up its distance to every other number</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array is sorted, so everything left of a number is smaller and everything right is larger</text>
<rect x="40" y="106" width="1160" height="366" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Prefix sum p[i] is the total of the first i numbers, so any stretch is one subtraction</text>
<text x="440" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">sorted</text>
<rect x="462" y="160" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="510" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="510" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="572" y="160" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="620" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="682" y="160" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="730" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="730" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<text x="385" y="302" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">prefix sums</text>
<rect x="407" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="455" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="455" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">p0</text>
<rect x="517" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="565" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="565" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">p1</text>
<rect x="627" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="675" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="675" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">p2</text>
<rect x="737" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="785" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="785" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">p3</text>
<text x="440" y="406" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">answer</text>
<rect x="462" y="368" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="510" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="572" y="368" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="682" y="368" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="730" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="40" y="490" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="530" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Sorted order removes the absolute value, and prefix sums remove the inner loop</text>
<text x="620" y="562" text-anchor="middle" font-size="18.5" fill="#475569">Each answer then costs a fixed amount of arithmetic instead of a full scan</text>
</svg>