  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Monolith vs. microservices architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A monolith runs one application on one database; microservices run several services, each with its own database.</text>

  <rect x="40" y="120" width="1160" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Monolith architecture: single application, single database</text>
