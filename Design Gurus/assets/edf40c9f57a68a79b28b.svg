<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="632" viewBox="0 0 1240 632" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Hot, warm, cold and archive storage compared on how often the data is read, how long retrieval takes, and what it costs per gigabyte">
  <rect x="0" y="0" width="1240" height="632" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">You are not buying space. You are buying how fast you can get it back.</text>

  <rect x="50" y="88" width="1140" height="52" fill="#F1F5F9"/>
  <text x="70" y="121" font-size="20" font-weight="600" fill="#334155">Tier</text>
  <text x="440" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Read how often</text>
  <text x="720" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Time to first byte</text>
  <text x="1000" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Cost per GB</text>

  <text x="70" y="181" font-size="20" font-weight="600" fill="#B91C1C">Hot</text>
  <text x="440" y="181" font-size="20" fill="#334155" text-anchor="middle">many times a day</text>
  <text x="720" y="181" font-size="20" fill="#065F46" text-anchor="middle">milliseconds</text>
  <text x="1000" y="181" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">highest</text>

  <text x="70" y="249" font-size="20" font-weight="600" fill="#D97706">Warm</text>
  <text x="440" y="249" font-size="20" fill="#334155" text-anchor="middle">a few times a month</text>
  <text x="720" y="249" font-size="20" fill="#065F46" text-anchor="middle">milliseconds</text>
  <text x="1000" y="249" font-size="20" fill="#334155" text-anchor="middle">lower</text>

  <text x="70" y="317" font-size="20" font-weight="600" fill="#1E40AF">Cold</text>
  <text x="440" y="317" font-size="20" fill="#334155" text-anchor="middle">once or twice a year</text>
  <text x="720" y="317" font-size="20" fill="#92400E" text-anchor="middle">minutes</text>
  <text x="1000" y="317" font-size="20" fill="#334155" text-anchor="middle">lower still</text>

  <text x="70" y="385" font-size="20" font-weight="600" fill="#5B21B6">Archive</text>
  <text x="440" y="385" font-size="20" fill="#334155" text-anchor="middle">almost never</text>
  <text x="720" y="385" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">hours</text>
  <text x="1000" y="385" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">lowest</text>

  <line x1="50" y1="88" x2="1190" y2="88" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="1190" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="50" y1="208" x2="1190" y2="208" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="276" x2="1190" y2="276" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="344" x2="1190" y2="344" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="412" x2="1190" y2="412" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="412" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="290" y1="88" x2="290" y2="412" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="590" y1="88" x2="590" y2="412" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="860" y1="88" x2="860" y2="412" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1190" y1="88" x2="1190" y2="412" stroke="#CBD5E1" stroke-width="1.5"/>

  <rect x="50" y="442" width="1140" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="484" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Archive tiers usually charge to read as well, so a cheap tier read often is the expensive option.</text>

  
  <rect x="50" y="540" width="1140" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="578" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Pick the tier from how urgently you would need the data back, not from how big it is.</text>
</svg>