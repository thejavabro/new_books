<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="784" viewBox="0 0 1240 784" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="unit-title unit-desc">
<title id="unit-title">The number that survives growth</title>
<desc id="unit-desc">A monthly total is a fact about today. Dividing it by whatever the business counts produces a unit cost, which scales honestly, compares against revenue, and compares two designs that do not share assumptions.</desc>
<defs>
<marker id="unit-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="unit-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="unit-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="unit-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="784" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The number that survives growth</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Convert the total into a unit cost, by dividing by whatever the business counts.</text>
<rect x="40" y="706" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="706" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="340" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="210" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">$7,900 per month</text>
<path d="M386 146H424" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M386 146H424" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#unit-marker-slate)"/>
<rect x="432" y="118" width="336" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="600" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">/ 2.6B requests</text>
<path d="M774 146H812" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M774 146H812" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#unit-marker-slate)"/>
<rect x="820" y="118" width="380" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1010" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">$0.003 per 1,000</text>
<text x="40" y="214" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Pick a unit somebody outside engineering already uses</text>
<rect x="40" y="232" width="237" height="44" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="158.5" y="261" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">per 1,000 requests</text>
<rect x="299" y="232" width="291" height="44" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="444.5" y="261" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">per monthly active user</text>
<rect x="612" y="232" width="141" height="44" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="682.5" y="261" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">per order</text>
<rect x="775" y="232" width="184" height="44" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="867" y="261" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">per GB stored</text>
<rect x="981" y="232" width="216" height="44" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1089" y="261" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">per video minute</text>
<circle cx="60" cy="330" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="337" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="300" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="336" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It scales honestly</text>
<path d="M536 330H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 330H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#unit-marker-slate)"/>
<rect x="570" y="300" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="323.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">ten times the traffic is roughly ten times the bill,</text><text x="590" y="348.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">unless something is not linear</text>
<circle cx="60" cy="402" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="409" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="372" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="408" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It compares against revenue</text>
<path d="M536 402H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 402H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#unit-marker-slate)"/>
<rect x="570" y="372" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="395.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">earning $0.01 and spending $0.003 is a business;</text><text x="590" y="420.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">earning $0.001 is a problem</text>
<circle cx="60" cy="474" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="481" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="444" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="480" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It compares two designs</text>
<path d="M536 474H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 474H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#unit-marker-slate)"/>
<rect x="570" y="444" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="480" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">even when they do not share the same traffic assumptions</text>
<rect x="40" y="524" width="1160" height="58" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="524" width="5" height="58" rx="2.5" fill="#39D5AA"/><text x="64" y="559" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A cost estimate without a unit is a number. With a unit it is an argument.</text>
<rect x="40" y="602" width="1160" height="78" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="602" width="5" height="78" rx="2.5" fill="#F28B9D"/><text x="64" y="634" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The most valuable thing a unit cost reveals</text><text x="64" y="660" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A line that grows faster than the business gets worse while you succeed.</text>
<text x="66" y="740" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A fixed cost that stays flat as traffic grows is good news. The other kind ends the architecture.</text>
</svg>