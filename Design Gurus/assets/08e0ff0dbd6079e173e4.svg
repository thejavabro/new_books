<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A load balancer can use round-robin, which sends each request to the next server in turn; least connections, which sends it to the server with the fewest active requests; or consistent hashing, which sends the same key to the same server.">
  <defs>
    <filter id="lt5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lt5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lt5-k1"><rect x="470" y="130" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="lt5-k2"><rect x="40" y="330" width="354" height="90" rx="12"/></clipPath>
    <clipPath id="lt5-k3"><rect x="443" y="330" width="354" height="90" rx="12"/></clipPath>
    <clipPath id="lt5-k4"><rect x="846" y="330" width="354" height="90" rx="12"/></clipPath>
    <marker id="lt5-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three ways to pick a server</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A load balancer uses an algorithm to choose a server for each request.</text>



  <g fill="none" stroke-width="2">
    <path d="M620,220 V260 Q620,275 605,275 H232 Q217,275 217,290 V330" stroke="#64748B" marker-end="url(#lt5-m-slate)"/>
    <path d="M620,220 V330" stroke="#64748B" marker-end="url(#lt5-m-slate)"/>
    <path d="M620,220 V260 Q620,275 635,275 H1008 Q1023,275 1023,290 V330" stroke="#64748B" marker-end="url(#lt5-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#lt5-soft)">
    <rect x="470" y="130" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#lt5-k1)"/>
  </g>
  <circle cx="508" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="534" y="182" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <g filter="url(#lt5-soft)">
    <rect x="40" y="330" width="354" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#lt5-k2)"/>
  </g>
  <circle cx="78" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="382" font-size="21.5" font-weight="600" fill="#111827">Round-robin</text>
  <text x="217" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">sends each request to</text>
  <text x="217" y="476" font-size="18.5" text-anchor="middle" fill="#94A3B8">the next server in turn</text>
  <text x="217" y="503" font-size="18.5" text-anchor="middle" fill="#94A3B8">simple, but ignores load</text>
  <g filter="url(#lt5-soft)">
    <rect x="443" y="330" width="354" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="443" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#lt5-k3)"/>
  </g>
  <circle cx="481" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(470.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="507" y="382" font-size="21.5" font-weight="600" fill="#111827">Least connections</text>
  <text x="620" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">sends each request to the server</text>
  <text x="620" y="476" font-size="18.5" text-anchor="middle" fill="#94A3B8">with the fewest active requests</text>
  <text x="620" y="503" font-size="18.5" text-anchor="middle" fill="#94A3B8">follows the real load</text>
  <g filter="url(#lt5-soft)">
    <rect x="846" y="330" width="354" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="846" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#lt5-k4)"/>
  </g>
  <circle cx="884" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(873.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="910" y="382" font-size="21.5" font-weight="600" fill="#111827">Consistent hashing</text>
  <text x="1023" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">sends the same key to</text>
  <text x="1023" y="476" font-size="18.5" text-anchor="middle" fill="#94A3B8">the same server every time</text>
  <text x="1023" y="503" font-size="18.5" text-anchor="middle" fill="#94A3B8">keeps each server's cache useful</text>

  <rect x="40" y="550" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="575" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="600" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Goal</text>
  <text x="323" y="600" font-size="18.5" fill="#475569">no single server is overloaded, so no request waits in a long queue</text>
</svg>