<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array with the target position marked">
<defs>
<filter id="qs-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Find the 3rd smallest number in [5, 12, 11, -1, 12]</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Sorting would put it at position 2, so the goal is to get one number into that position</text>
<rect x="40" y="106" width="1160" height="548" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Green marks position 2, which is where the answer must end up</text>
<rect x="242" y="184" width="756" height="106" rx="12" fill="none" stroke="#C4B5FD" stroke-width="3" stroke-dasharray="6 5"/>
<text x="620" y="174" text-anchor="middle" font-size="17.5" font-weight="600" fill="#5B21B6">the whole array is still in play</text>
<text x="226" y="253" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the numbers</text>
<rect x="250" y="214" width="132" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="316" y="252.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="402" y="214" width="132" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="468" y="252.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">12</text>
<rect x="554" y="214" width="132" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="252.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">11</text>
<rect x="706" y="214" width="132" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="772" y="252.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-1</text>
<rect x="858" y="214" width="132" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="924" y="252.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">12</text>
<text x="226" y="375" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">positions</text>
<rect x="250" y="336" width="132" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="316" y="374.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="402" y="336" width="132" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="468" y="374.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="554" y="336" width="132" height="62" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="620" y="374.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="706" y="336" width="132" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="772" y="374.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="858" y="336" width="132" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="924" y="374.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="280" y="442" width="680" height="54" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="476.02" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">nothing partitioned yet</text>
<text x="620" y="596" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Sorting everything answers a much bigger question than the one being asked</text>
<rect x="40" y="666" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="706" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">One partition puts its pivot in the position it would occupy if sorted</text>
<text x="620" y="738" text-anchor="middle" font-size="18.5" fill="#475569">So partitioning until a pivot lands on the target position is enough, with no full sort</text>
</svg>