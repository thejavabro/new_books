<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="644" viewBox="0 0 1240 644" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="dash-title dash-desc">
<title id="dash-title">What you were given, and what you were not</title>
<desc id="dash-desc">The incident dashboard reports machine size, CPU, latency, database size, throughput, application pool configuration and recent changes. It reports nothing about connection count, idle transactions, where execution time goes, lock waits or vacuum state, which is what every proposed option depends on.</desc>
<defs>
<marker id="dash-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="dash-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="dash-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="dash-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="644" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What you were given, and what you were not</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The primary Postgres behind your main application is struggling at peak.</text>
<rect x="40" y="566" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="566" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="620" height="324" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V436A6 6 0 0 0 46 442H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">What the dashboard shows</text>
<text x="72" y="184" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">Machine</text>
<text x="628" y="184" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">16 vCPU, 64 GB, one primary</text>
<path d="M72 198H628" fill="none" stroke="#D5E3EF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="224" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">CPU at peak</text>
<text x="628" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">95%, sustained ~90 min/day</text>
<path d="M72 238H628" fill="none" stroke="#D5E3EF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="264" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">p99 reads</text>
<text x="628" y="264" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">180 ms, normally 55 ms</text>
<path d="M72 278H628" fill="none" stroke="#D5E3EF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="304" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">Database size</text>
<text x="628" y="304" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">340 GB, +8 GB a month</text>
<path d="M72 318H628" fill="none" stroke="#D5E3EF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="344" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">Throughput</text>
<text x="628" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">28,000 reads/s, 4,000 writes/s</text>
<path d="M72 358H628" fill="none" stroke="#D5E3EF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="384" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">Application</text>
<text x="628" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">24 instances x pool of 40</text>
<path d="M72 398H628" fill="none" stroke="#D5E3EF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="72" y="424" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">Recent changes</text>
<text x="628" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">none for six days</text>
<rect x="680" y="118" width="520" height="324" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M694 118H686A6 6 0 0 0 680 124V436A6 6 0 0 0 686 442H694Z" fill="#F28B9D"/><text x="710" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">What it does not show</text>
<rect x="712" y="172" width="456" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="728" y="202" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Connection count</text><text x="1152" y="202" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">pg_stat_activity</text>
<rect x="712" y="224" width="456" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="728" y="254" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Idle in transaction</text><text x="1152" y="254" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">xact_start</text>
<rect x="712" y="276" width="456" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="728" y="306" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Where the CPU goes</text><text x="1152" y="306" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">pg_stat_statements</text>
<rect x="712" y="328" width="456" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="728" y="358" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Lock waits</text><text x="1152" y="358" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">pg_locks</text>
<rect x="712" y="380" width="456" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="728" y="410" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Dead tuples, vacuum</text><text x="1152" y="410" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">pg_stat_user_tables</text>
<rect x="40" y="466" width="1160" height="74" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="466" width="5" height="74" rx="2.5" fill="#F3CF6A"/><text x="64" y="495.5" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">Every option that was proposed depends on a number in the right-hand panel.</text><text x="64" y="522.5" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">An option chosen before these is a guess with a deployment plan attached.</text>
<text x="66" y="600" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Read what is missing from a dashboard before you read what is on it.</text>
</svg>