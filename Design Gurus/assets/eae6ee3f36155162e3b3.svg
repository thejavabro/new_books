  <rect x="64" y="426" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="448" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Who gets asked</text>
