  <text x="325" y="251" text-anchor="middle" font-size="17" font-weight="600" fill="#475569">Design a chat system</text>
  <rect x="658" y="96" width="514" height="50" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="915" y="127" text-anchor="middle" font-size="17" font-weight="600" fill="#5B21B6">Design YouTube recommendations</text>
  <rect x="658" y="158" width="514" height="50" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="915" y="189" text-anchor="middle" font-size="17" font-weight="600" fill="#5B21B6">Design a ChatGPT-style assistant</text>
  <rect x="658" y="220" width="514" height="50" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="915" y="251" text-anchor="middle" font-size="17" font-weight="600" fill="#5B21B6">Design a support-ticket agent</text>
