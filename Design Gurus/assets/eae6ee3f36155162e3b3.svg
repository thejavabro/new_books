  <rect x="68" y="158" width="514" height="50" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="325" y="189" text-anchor="middle" font-size="17" font-weight="600" fill="#475569">Design a URL shortener</text>
