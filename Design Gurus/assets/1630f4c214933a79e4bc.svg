  </defs>

  <rect x="0" y="0" width="1240" height="1050" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Database transactions: monolith vs. microservices</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A monolith updates orders and inventory in one atomic transaction; microservices run two local transactions and compensate on failure.</text>

  <rect x="40" y="120" width="560" height="700" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Monolith: one atomic database transaction</text>
