<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1050" viewBox="0 0 1240 1050" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Left, a monolith: a create order request enters a monolithic application whose order module calls the inventory module&#39;s interface to reserve stock, and both modules write a single database in one transaction, then a success response leaves. Right, microservices: the request enters an order service, which calls an inventory service and then returns the success response; each service writes its own database, so the update is a saga of two local transactions with compensation on failure">
