  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#BE185D">Microservices: a saga of local transactions</text>
  <rect x="64" y="372" width="512" height="418" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="402" font-size="19.5" font-weight="600" fill="#1D4ED8">Monolithic application</text>

