<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="562" viewBox="0 0 1240 562" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before any number is moved">
<defs>
<filter id="cys-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="562" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the smallest missing positive number in [-3, 1, 5, 4, 2]?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Only the values 1 to 5 can matter, so anything outside that range is ignored</text>
<rect x="40" y="106" width="1160" height="300" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Nothing placed yet</text>
<rect x="386" y="210" width="84" height="64" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="428" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-3</text>
<text x="428" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="482" y="210" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="524" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="524" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="578" y="210" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="620" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="674" y="210" width="84" height="64" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="716" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="716" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="770" y="210" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="812" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="812" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<path d="M419,326 L437,326 L428,312 Z" fill="#4F46E5"/>
<text x="428" y="350" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">i</text>
<rect x="40" y="432" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="472" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Send every value v to index v minus 1, then look at what does not fit</text>
<text x="620" y="504" text-anchor="middle" font-size="18.5" fill="#475569">Green marks a value already at its own index, and grey marks one that cannot be placed at all</text>
</svg>