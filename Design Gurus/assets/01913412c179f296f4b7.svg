<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What one reader is promised: eventual consistency, monotonic reads, read your writes, and session consistency. What everyone agrees on: causal consistency, sequential consistency, and linearizability.">
  <defs>
    <filter id="cc5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cc5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cc5-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc5-k2"><rect x="64" y="330" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc5-k3"><rect x="64" y="480" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc5-k4"><rect x="64" y="630" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc5-k5"><rect x="654" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc5-k6"><rect x="654" y="330" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc5-k7"><rect x="654" y="480" width="522" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="1000" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Seven consistency models in two groups</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Some promise something to one reader. Others set rules that every reader shares.</text>

  <rect x="40" y="120" width="570" height="670" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">What one reader is promised</text>
  <rect x="630" y="120" width="570" height="670" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">What everyone agrees on</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#cc5-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#cc5-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Eventual</text>
  <text x="325" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">all copies match in the end, with no time promised</text>
  <g filter="url(#cc5-soft)">
    <rect x="64" y="330" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#cc5-k2)"/>
  </g>
  <circle cx="102" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="128" y="382" font-size="21.5" font-weight="600" fill="#111827">Monotonic reads</text>
  <text x="325" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">a reader never sees older data again</text>
  <g filter="url(#cc5-soft)">
    <rect x="64" y="480" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="480" width="6" height="90" fill="#2563EB" clip-path="url(#cc5-k3)"/>
  </g>
  <circle cx="102" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,514.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="532" font-size="21.5" font-weight="600" fill="#111827">Read your writes</text>
  <text x="325" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">the writer sees their own change at once</text>
  <g filter="url(#cc5-soft)">
    <rect x="64" y="630" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="630" width="6" height="90" fill="#2563EB" clip-path="url(#cc5-k4)"/>
  </g>
  <circle cx="102" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,664.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="682" font-size="21.5" font-weight="600" fill="#111827">Session</text>
  <text x="325" y="749" font-size="18.5" text-anchor="middle" fill="#6B7280">read your writes for a whole visit</text>
  <g filter="url(#cc5-soft)">
    <rect x="654" y="180" width="522" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="654" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#cc5-k5)"/>
  </g>
  <circle cx="692" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="718" y="232" font-size="21.5" font-weight="600" fill="#111827">Causal</text>
  <text x="915" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">a reply is never visible without its post</text>
  <g filter="url(#cc5-soft)">
    <rect x="654" y="330" width="522" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="654" y="330" width="6" height="90" fill="#7C3AED" clip-path="url(#cc5-k6)"/>
  </g>
  <circle cx="692" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,364.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="718" y="382" font-size="21.5" font-weight="600" fill="#111827">Sequential</text>
  <text x="915" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">every reader sees the same order</text>
  <g filter="url(#cc5-lift)">
    <rect x="654" y="480" width="522" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="654" y="480" width="9" height="90" fill="#7C3AED" clip-path="url(#cc5-k7)"/>
  </g>
  <circle cx="692" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,514.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="718" y="532" font-size="21.5" font-weight="600" fill="#111827">Linearizable</text>
  <text x="915" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">the same order, matching real time</text>
  <text x="915" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">also called strong consistency</text>

  <rect x="40" y="820" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="845" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="870" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Not a ladder</text>
  <text x="323" y="870" font-size="18.5" fill="#475569">the two groups make different kinds of promises</text>
  <rect x="64" y="895" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="920" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Cost</text>
  <text x="323" y="920" font-size="18.5" fill="#475569">stronger promises need more coordination: slower writes, less availability</text>
</svg>