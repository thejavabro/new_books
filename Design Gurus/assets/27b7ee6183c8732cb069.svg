<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1220" viewBox="0 0 1240 1220" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Direct communication, tightly coupled: a web app, a mobile app and a batch job each call the user, order and product services directly; every client maintains server addresses, the system is tightly coupled, server changes, failures and scaling are hard to handle, and updates are required in multiple clients. Broker architecture, loosely coupled: the three clients send requests to a broker, which routes them to the three services; the broker handles service discovery and routing, clients are decoupled from server locations, and servers can be added, removed or scaled without client changes">
