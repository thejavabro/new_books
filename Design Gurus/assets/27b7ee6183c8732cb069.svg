  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Direct communication vs. broker architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Without a broker, every client calls every service; with one, every client calls only the broker.</text>

