<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="764" viewBox="0 0 1240 764" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With one shared thread pool, the slow payments dependency holds eight of the ten threads, so the healthy inventory and search calls cannot get a thread and start failing even though nothing is wrong with them">
  <defs>
    <marker id="bh1-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="bh1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bh1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bh1-kp"><rect x="460" y="110" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="bh1-bar"><rect x="460" y="226" width="320" height="22" rx="6"/></clipPath>
    <clipPath id="bh1-k1"><rect x="72" y="380" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="bh1-k2"><rect x="480" y="380" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="bh1-k3"><rect x="888" y="380" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="764" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="520" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">One shared pool: whichever dependency is slowest decides how many threads are left</text>

  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M620,252 L620,330 Q620,342 608,342 L224,342 Q212,342 212,354 L212,376" marker-end="url(#bh1-pk)"/>
    <path d="M620,252 L620,376" marker-end="url(#bh1-pk)"/>
    <path d="M620,252 L620,330 Q620,342 632,342 L1016,342 Q1028,342 1028,354 L1028,376" marker-end="url(#bh1-pk)"/>
  </g>

  <g filter="url(#bh1-lift)">
    <rect x="460" y="110" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="460" y="110" width="9" height="90" fill="#DB2777" clip-path="url(#bh1-kp)"/>
  </g>
  <circle cx="498" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,144.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="524" y="162" font-size="18.5" font-weight="600" fill="#111827">Shared Thread Pool</text>

  <g clip-path="url(#bh1-bar)">
    <rect x="460" y="226" width="320" height="22" fill="#E2E8F0"/>
    <rect x="460" y="226" width="256" height="22" fill="#DB2777"/>
  </g>
  <rect x="460" y="226" width="320" height="22" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="6"><text x="620" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">10 threads, 8 of them held by payments</text></g>

  <g filter="url(#bh1-soft)">
    <rect x="72" y="380" width="280" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="380" width="6" height="90" fill="#DB2777" clip-path="url(#bh1-k1)"/>
  </g>
  <circle cx="110" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,414.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="136" y="432" font-size="18.5" font-weight="600" fill="#111827">Payments</text>
  <text x="212" y="495" font-size="15.5" text-anchor="middle" fill="#6B7280">slow, 30 seconds per call</text>
  <text x="212" y="518" font-size="15.5" text-anchor="middle" fill="#94A3B8">holds 8 of the 10 threads</text>

  <g filter="url(#bh1-soft)">
    <rect x="480" y="380" width="280" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="480" y="380" width="6" height="90" fill="#DB2777" clip-path="url(#bh1-k2)"/>
  </g>
  <circle cx="518" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,414.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="544" y="432" font-size="18.5" font-weight="600" fill="#111827">Inventory</text>
  <text x="620" y="495" font-size="15.5" text-anchor="middle" fill="#6B7280">fast and perfectly healthy</text>
  <text x="620" y="518" font-size="15.5" text-anchor="middle" fill="#94A3B8">but cannot get a thread</text>

  <g filter="url(#bh1-soft)">
    <rect x="888" y="380" width="280" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="888" y="380" width="6" height="90" fill="#DB2777" clip-path="url(#bh1-k3)"/>
  </g>
  <circle cx="926" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(915.56,414.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="952" y="432" font-size="18.5" font-weight="600" fill="#111827">Search</text>
  <text x="1028" y="495" font-size="15.5" text-anchor="middle" fill="#6B7280">fast and perfectly healthy</text>
  <text x="1028" y="518" font-size="15.5" text-anchor="middle" fill="#94A3B8">but cannot get a thread</text>

  <rect x="40" y="596" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="620" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="642" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The shared pool</text>
  <text x="288" y="642" font-size="15.5" fill="#475569">every dependency draws threads from the same place, so one slow neighbour starves all the others</text>

  <rect x="64" y="664" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="686" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">What actually fails</text>
  <text x="288" y="686" font-size="15.5" fill="#475569">inventory and search start returning errors for a reason that has nothing to do with either of them</text>
</svg>