<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-label="The data model names the entities and their keys, then states the hot queries, and the hot queries pick the store. Large files go to object storage with the path kept in the row.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="480" fill="#FFFFFF"/>
  <rect x="40" y="56" width="272" height="104" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="40" y="56" width="272" height="8" rx="4" fill="#6D28D9"/>
  <text x="176" y="102" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">User</text>
  <text x="176" y="134" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">userId, name, email</text>
  <rect x="332" y="56" width="272" height="104" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="332" y="56" width="272" height="8" rx="4" fill="#6D28D9"/>
  <text x="468" y="102" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Tweet</text>
  <text x="468" y="134" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">tweetId, userId, content</text>
  <rect x="624" y="56" width="272" height="104" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="624" y="56" width="272" height="8" rx="4" fill="#6D28D9"/>
  <text x="760" y="102" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Follow</text>
  <text x="760" y="134" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">followerId, followeeId</text>
  <rect x="916" y="56" width="272" height="104" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="916" y="56" width="272" height="8" rx="4" fill="#6D28D9"/>
  <text x="1052" y="102" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Media</text>
  <text x="1052" y="134" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">mediaId, tweetId, path</text>
  <line x1="620" y1="172" x2="620" y2="216" stroke="#6D28D9" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="40" y="222" width="1160" height="96" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="70" y="258" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Then the sentence that matters: what are the two or three hot queries?</text>
  <text x="70" y="290" font-size="20" fill="#5B21B6" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">"Get a tweet by id, and get recent tweets from the people I follow. No joins, billions of rows, so a wide-column store."</text>
  <rect x="40" y="340" width="1160" height="96" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="376" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Media never goes in the database.</text>
  <text x="70" y="408" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The file goes to object storage and the row keeps only the path to it.</text>
</svg>