<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1116" viewBox="0 0 1240 1116" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Correct recovery after a 412 is not a blind retry. Read the latest representation, compare the intended change with current state, reapply or merge it, ask the user if it cannot be resolved safely, and send the result with the latest If-Match.">
  <defs>
    <marker id="p1h-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p1h-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="p1h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1h-k1"><rect x="340" y="100" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p1h-k2"><rect x="340" y="276" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p1h-k3"><rect x="340" y="452" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p1h-k4"><rect x="340" y="628" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p1h-k5"><rect x="340" y="804" width="560" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1116" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="905" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Recovery after 412 is not a blind retry</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">five steps, in order</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,231 V276" stroke="#64748B" marker-end="url(#p1h-sl)"/>
    <path d="M620,407 V452" stroke="#64748B" marker-end="url(#p1h-sl)"/>
    <path d="M620,583 V628" stroke="#64748B" marker-end="url(#p1h-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,759 V804" stroke="#D97706" marker-end="url(#p1h-am)"/>
  </g>

  
  <g filter="url(#p1h-soft)">
    <rect x="340" y="100" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#p1h-k1)"/>
  </g>
  <circle cx="378" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="404" y="152" font-size="18.5" font-weight="600" fill="#111827">1. GET the latest representation</text>
  <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">The response also carries the new ETag.</text>

  
  <g filter="url(#p1h-soft)">
    <rect x="340" y="276" width="560" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="340" y="276" width="6" height="90" fill="#64748B" clip-path="url(#p1h-k2)"/>
  </g>
  <circle cx="378" cy="321" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,310.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="404" y="328" font-size="18.5" font-weight="600" fill="#111827">2. Compare the intent with current state</text>
  <text x="620" y="391" font-size="15.5" text-anchor="middle" fill="#6B7280">The change may no longer make sense at all.</text>

  
  <g filter="url(#p1h-soft)">
    <rect x="340" y="452" width="560" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="340" y="452" width="6" height="90" fill="#059669" clip-path="url(#p1h-k3)"/>
  </g>
  <circle cx="378" cy="497" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,486.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="404" y="504" font-size="18.5" font-weight="600" fill="#111827">3. Reapply or merge the change</text>
  <text x="620" y="567" font-size="15.5" text-anchor="middle" fill="#6B7280">A value-setting patch is far easier here than a whole-object replace.</text>

  
  <g filter="url(#p1h-soft)">
    <rect x="340" y="628" width="560" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="340" y="628" width="6" height="90" fill="#DB2777" clip-path="url(#p1h-k4)"/>
  </g>
  <circle cx="378" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,662.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="404" y="680" font-size="18.5" font-weight="600" fill="#111827">4. Ask the person if it is not safe</text>
  <text x="620" y="743" font-size="15.5" text-anchor="middle" fill="#6B7280">For money or permissions, show the new state rather than choosing for them.</text>

  
  <g filter="url(#p1h-lift)">
    <rect x="340" y="804" width="560" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="340" y="804" width="9" height="90" fill="#D97706" clip-path="url(#p1h-k5)"/>
  </g>
  <circle cx="378" cy="849" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,838.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="404" y="856" font-size="18.5" font-weight="600" fill="#111827">5. Resend with the latest If-Match</text>
  <text x="620" y="919" font-size="15.5" text-anchor="middle" fill="#6B7280">The API prevented silent loss; it did not decide whose intent wins.</text>

  
  <rect x="40" y="975" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1017" text-anchor="middle" font-size="16" fill="#475569">Steps 1 to 4 are a read and a decision. Only step 5 writes, and it uses the ETag that arrived with step 1.</text>
  <text x="620" y="1045" text-anchor="middle" font-size="16" fill="#475569">Resending the original body with the stale validator just produces another 412, which is why a blind retry never works.</text>
</svg>