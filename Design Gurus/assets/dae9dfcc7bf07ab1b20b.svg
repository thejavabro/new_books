<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="745" viewBox="0 0 1240 745" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Before, two lanes: the default lane with 3 slots runs every job in arrival order; 28,000 digest emails were added at 09:00; the certificate job from 09:12 waits 39.6 minutes; 3 worker tasks still send only 10 emails per second; 41 percent of send attempts get HTTP 429; the reports lane with 1 slot runs the hourly refresh. Certificate p95 on Mondays is 44 minutes against a 5-minute target. After, six lanes: certificates with 2 slots, claimed in about 1 second; email with 3 slots for receipts and certificate emails; bulk with 1 slot, sending the digest at 8 per second; access with 2 slots for grants after payment; default with 3 slots for video sync and other jobs; reports with 1 slot for the hourly refresh. Certificates wait seconds, and the digest finishes in about 58 minutes.">
