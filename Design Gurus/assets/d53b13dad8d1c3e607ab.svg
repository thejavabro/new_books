<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1040" viewBox="0 0 1240 1040" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One question decides how to handle every async edge: who observes the lag? The acting user gets read your own writes, a user in the middle of a multi-step flow gets honest pending states, two users racing for one resource get strong consistency at the commit point, and another user just browsing usually needs no fix at all.">
  <defs>
    <marker id="m05-l05-lag-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l05-lag-decision-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m05-l05-lag-decision-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l05-lag-decision-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l05-lag-decision-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m05-l05-lag-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1040" fill="#FFFFFF"/>

  <rect x="40" y="40" width="380" height="110" rx="10" fill="#ECFDF5" fill-opacity="0.6" stroke="#34D399" stroke-width="1.5"/>
  <text x="230" y="82" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">Fine when nobody observes the lag,</text>
  <text x="230" y="114" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">or when you show it honestly</text>
  <rect x="820" y="40" width="380" height="110" rx="10" fill="#FEF2F2" fill-opacity="0.6" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="1010" y="82" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">Fatal when the interface</text>
  <text x="1010" y="114" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">contradicts what the user just did</text>

  <g filter="url(#m05-l05-lag-decision-soft)">
    <rect x="440" y="190" width="360" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="620" y="236" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">An async edge in the design</text>
  <text x="620" y="268" text-anchor="middle" font-size="20" fill="#64748B">events and sagas both add lag</text>
  <g filter="url(#m05-l05-lag-decision-soft)">
    <path d="M620,310 L900,400 L620,490 L340,400 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="620" y="407" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Who observes the lag?</text>

  <g filter="url(#m05-l05-lag-decision-soft)">
    <rect x="40" y="660" width="255" height="170" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="167.5" y="720" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The acting user</text>
  <text x="167.5" y="752" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Read your own writes</text>
  <text x="167.5" y="784" text-anchor="middle" font-size="20" fill="#64748B">pin the session to the source</text>
  <g filter="url(#m05-l05-lag-decision-soft)">
    <rect x="335" y="660" width="255" height="170" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="462.5" y="720" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Mid multi-step flow</text>
  <text x="462.5" y="752" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Show pending states</text>
  <text x="462.5" y="784" text-anchor="middle" font-size="20" fill="#64748B">like a delivery status page</text>
  <g filter="url(#m05-l05-lag-decision-soft)">
    <rect x="630" y="660" width="255" height="170" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="757.5" y="720" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Two users racing</text>
  <text x="757.5" y="752" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Strong consistency</text>
  <text x="757.5" y="784" text-anchor="middle" font-size="20" fill="#64748B">at the commit point</text>
  <g filter="url(#m05-l05-lag-decision-soft)">
    <rect x="925" y="660" width="255" height="170" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1052.5" y="720" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Another user browsing</text>
  <text x="1052.5" y="752" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Usually no fix needed</text>
  <text x="1052.5" y="784" text-anchor="middle" font-size="20" fill="#64748B">no synchronized instant</text>

  <g fill="none" stroke-width="2.5">
    <path d="M620,300 L620,308" stroke="#475569" stroke-width="2" marker-end="url(#m05-l05-lag-decision-sl)"/>
    <path d="M450,430 C300,470 167,520 167,652" stroke="#DC2626" marker-end="url(#m05-l05-lag-decision-rd)"/>
    <path d="M540,485 C500,530 462,560 462,652" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l05-lag-decision-ab)"/>
    <path d="M700,485 C740,530 757,560 757,652" stroke="#3B82F6" stroke-width="2" marker-end="url(#m05-l05-lag-decision-bl)"/>
    <path d="M790,430 C940,470 1052,520 1052,652" stroke="#059669" stroke-width="2" marker-end="url(#m05-l05-lag-decision-em)"/>
  </g>

  <line x1="60" y1="880" x2="96" y2="880" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="887" font-size="20" fill="#475569">Unacceptable if unhandled: the acting user loses their own write</text>
  <line x1="60" y1="920" x2="96" y2="920" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="927" font-size="20" fill="#475569">Async steps exist, so name them out loud instead of hiding them</text>
  <line x1="60" y1="960" x2="96" y2="960" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="967" font-size="20" fill="#475569">Contention: the commit point earns strong consistency</text>
  <line x1="60" y1="1000" x2="96" y2="1000" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1007" font-size="20" fill="#475569">Lag nobody can observe: spend eventual consistency here</text>
</svg>