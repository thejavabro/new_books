<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pays-title pays-desc">
<title id="pays-title">The changes that pay for themselves</title>
<desc id="pays-desc">Six specific changes produce most of the practical benefit, and all of them are achievable by a small team.</desc>
<defs>
<marker id="pays-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pays-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pays-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pays-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="796" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The changes that pay for themselves</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A short list of specific changes produces most of the practical benefit.</text>
<rect x="40" y="718" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="718" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Single sign-on with a second factor</text>
<path d="M526 145H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 145H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pays-marker-slate)"/>
<rect x="570" y="118" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="138.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">including the console, database tooling,</text><text x="590" y="163.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the pipeline, support tooling</text>
<rect x="40" y="180" width="480" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No standing access to production</text>
<path d="M526 207H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 207H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pays-marker-slate)"/>
<rect x="570" y="180" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="200.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">requested, time-bound, logged. A permanent</text><text x="590" y="225.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">capability becomes a logged event</text>
<rect x="40" y="242" width="480" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="275" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Short-lived credentials for everything</text>
<path d="M526 269H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 269H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pays-marker-slate)"/>
<rect x="570" y="242" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="262.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which makes the previous point</text><text x="590" y="287.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">enforceable rather than procedural</text>
<rect x="40" y="304" width="480" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Service identity, not network allowlists</text>
<path d="M526 331H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 331H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pays-marker-slate)"/>
<rect x="570" y="304" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="337" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so moving a service does not silently change who can reach it</text>
<rect x="40" y="366" width="480" height="54" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="399" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An audit trail the audited cannot edit</text>
<path d="M526 393H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 393H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pays-marker-slate)"/>
<rect x="570" y="366" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="399" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a log an attacker can change is not an audit trail</text>
<rect x="40" y="428" width="480" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="461" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Offboarding that is one action</text>
<path d="M526 455H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 455H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pays-marker-slate)"/>
<rect x="570" y="428" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="448.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">everywhere, within minutes. Most small</text><text x="590" y="473.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">companies cannot do this</text>
<rect x="40" y="508" width="1160" height="98" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="508" width="5" height="98" rx="2.5" fill="#F28B9D"/><text x="64" y="537" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The largest reduction in blast radius per unit of work</text><text x="64" y="563" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Most compromises use a credential that was always valid and always had access.</text><text x="64" y="589" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Time-bounding it makes a stolen credential useless most of the time.</text>
<rect x="40" y="628" width="1160" height="64" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="628" width="5" height="64" rx="2.5" fill="#39D5AA"/><text x="64" y="666" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">One-action offboarding is also how you cut off a compromised identity quickly.</text>
<text x="66" y="752" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A design naming four changes made and two deferred is more credible than one claiming the full model.</text>
</svg>