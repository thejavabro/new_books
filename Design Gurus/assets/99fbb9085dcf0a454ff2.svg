<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc"><title id="title">Photo backup: client architecture</title><desc id="desc">The library adapter discovers permitted assets, and the resource preparer obtains stable files. The backup repository saves durable jobs. Transfer workers upload resources, and the asset coordinator confirms the complete asset through the API. A new worker can recover saved work after interruption. Selected connections are shown.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1240" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><rect x="25" y="140" width="1150" height="760" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Photo backup: client architecture</text><text x="50" y="106" font-size="22" fill="#334155" font-weight="400">Keep durable backup jobs separate from the screen and each worker instance.</text><rect x="50" y="165" width="1100" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="205" font-size="24" fill="#2563eb" font-weight="700">Backup screen + presentation state</text><text x="72" y="243" font-size="21" fill="#334155" font-weight="400">Show confirmed backups, progress, waiting reasons, and user controls.</text><text x="995" y="310" font-size="18" fill="#64748b" font-weight="700">MOBILE APP</text><path d="M600 273 V342" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><rect x="50" y="350" width="330" height="205" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="390" font-size="24" fill="#7c3aed" font-weight="700">Library adapter +</text><text x="72" y="420" font-size="24" fill="#7c3aed" font-weight="700">resource preparer</text><text x="72" y="458" font-size="21" fill="#334155" font-weight="400">Discover permitted assets.</text><text x="72" y="488" font-size="21" fill="#334155" font-weight="400">Obtain stable source files.</text><rect x="435" y="350" width="330" height="205" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="457" y="390" font-size="24" fill="#059669" font-weight="700">Backup repository</text><text x="457" y="428" font-size="21" fill="#334155" font-weight="400">Store versions, jobs,</text><text x="457" y="458" font-size="21" fill="#334155" font-weight="400">and confirmed progress.</text><rect x="820" y="350" width="330" height="205" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="390" font-size="24" fill="#c2410c" font-weight="700">Transfer worker +</text><text x="842" y="420" font-size="24" fill="#c2410c" font-weight="700">asset coordinator</text><text x="842" y="458" font-size="21" fill="#334155" font-weight="400">Upload resources, then</text><text x="842" y="488" font-size="21" fill="#334155" font-weight="400">confirm the complete asset.</text><path d="M388 450 H427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M773 450 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M215 563 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M540 563 V612 H450 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M985 563 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="260" y="651" font-size="19" fill="#64748b" font-weight="400">Saved data</text><text x="1000" y="603" font-size="19" fill="#64748b" font-weight="400">Requests</text><text x="1000" y="633" font-size="19" fill="#64748b" font-weight="400">and updates</text><rect x="50" y="680" width="520" height="185" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="720" font-size="24" fill="#7c3aed" font-weight="700">Backup database + staged files</text><text x="72" y="758" font-size="21" fill="#334155" font-weight="400">Asset and resource versions</text><text x="72" y="788" font-size="21" fill="#334155" font-weight="400">Durable jobs and library checkpoints</text><text x="72" y="818" font-size="21" fill="#334155" font-weight="400">Stable files within a disk budget</text><rect x="650" y="680" width="500" height="185" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="672" y="720" font-size="24" fill="#2563eb" font-weight="700">Upload API client</text><text x="672" y="758" font-size="21" fill="#334155" font-weight="400">Send parts of the same resource version.</text><text x="672" y="788" font-size="21" fill="#334155" font-weight="400">Query server-retained progress.</text><text x="672" y="818" font-size="21" fill="#334155" font-weight="400">Recover complete-asset finalization.</text><path d="M900 873 V952" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="922" y="927" font-size="19" fill="#64748b" font-weight="400">Network</text><rect x="50" y="960" width="520" height="185" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="1000" font-size="24" fill="#ffffff" font-weight="700">A worker can stop at any time</text><text x="72" y="1038" font-size="21" fill="#ffffff" font-weight="400">The database retains the job.</text><text x="72" y="1068" font-size="21" fill="#ffffff" font-weight="400">Resume when execution is allowed.</text><text x="72" y="1098" font-size="21" fill="#ffffff" font-weight="400">Sent bytes alone do not mean Backed up.</text><rect x="650" y="960" width="500" height="185" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="672" y="1000" font-size="24" fill="#c2410c" font-weight="700">Backup service</text><text x="672" y="1038" font-size="21" fill="#334155" font-weight="400">Retain and verify resource bytes.</text><text x="672" y="1068" font-size="21" fill="#334155" font-weight="400">Confirm the complete asset manifest.</text><text x="672" y="1098" font-size="21" fill="#334155" font-weight="400">Enforce account ownership.</text><text x="50" y="1191" font-size="19" fill="#475569" font-weight="400">Selected connections shown. Workers read saved jobs and stable source files; concurrency is bounded.</text></g></svg>