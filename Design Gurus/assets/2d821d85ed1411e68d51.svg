<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="822" viewBox="0 0 1240 822" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="api-title api-desc">
<title id="api-title">The same problem at the API boundary</title>
<desc id="api-desc">Adding an optional field is safe, removing or renaming is an expand and contract measured by your slowest client, and making a field required is breaking. A tolerant reader is what makes any of it work.</desc>
<defs>
<marker id="api-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="api-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="api-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="api-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="822" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The same problem at the API boundary</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The constraint is identical where the consumers are other services or installed clients.</text>
<rect x="40" y="744" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="744" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="148" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The same constraint, with different names</text>
<rect x="40" y="166" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Adding an optional field</text>
<path d="M526 196H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 196H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#api-marker-green)"/>
<rect x="570" y="166" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">safe, because old clients ignore it</text>
<rect x="40" y="238" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Removing or renaming a field</text>
<path d="M526 268H560" fill="none" stroke="#91642E" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 268H560" fill="none" stroke="#91642E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#api-marker-amber)"/>
<rect x="570" y="238" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="261.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">expand and contract, over a timescale</text><text x="590" y="286.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">set by your slowest client</text>
<rect x="40" y="310" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="346" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Making an optional field required</text>
<path d="M526 340H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 340H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#api-marker-red)"/>
<rect x="570" y="310" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="346" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">breaking, even though nothing in the shape changed</text>
<rect x="40" y="394" width="1160" height="94" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="394" width="5" height="94" rx="2.5" fill="#5EC9EC"/><text x="64" y="421" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">The tolerant reader</text><text x="64" y="447" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A client that ignores fields it does not recognize is what makes additive change safe.</text><text x="64" y="473" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Strict validation turns the client library into the constraint.</text>
<rect x="40" y="514" width="1160" height="112" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="514" width="5" height="112" rx="2.5" fill="#F28B9D"/><text x="64" y="537" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">And the change no validation catches</text><text x="64" y="563" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Changing what a field means without changing its type.</text><text x="64" y="589" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Cents to dollars, or local time to UTC: the same shape,</text><text x="64" y="615" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a completely different meaning. A new field and a deprecation is the only safe handling.</text>
<rect x="40" y="652" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="652" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="691" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The question to ask about any schema change: what runs while both versions are live?</text>
<text x="66" y="778" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The judgment signal is refusing to do it in one step, and being able to say why each step exists.</text>
</svg>