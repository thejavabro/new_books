<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1134" viewBox="0 0 1240 1134" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated stock exchange architecture: risk checked ingestion, sequencer, in memory matching engine, asynchronous settlement and market data fan out">
  <defs>
    <filter id="se-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="se-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="se-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="se-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="se-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1134" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Stock exchange: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">A single threaded engine in RAM, a sequencer that makes it replayable, and everything else pushed off the hot path</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Ingestion (hot path) · validate and accept, no database writes here</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#se-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <path d="M577,194 L662,194" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#se-emerald)"/>
  <text x="620" y="182" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">lock</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#se-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">202</text>
  <g filter="url(#se-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Trader</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">limit or market</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Risk Engine</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">freezes the cash</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis balances</text>
  <text x="776" y="262" font-size="20" fill="#065F46" text-anchor="middle">not SQL, too slow</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Sequencer</text>
  <text x="1089" y="262" font-size="20" fill="#92400E" text-anchor="middle">one global order</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. Matching · single threaded per symbol, so ordering is free</text>
  <path d="M364,436 L456,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#se-blue)"/>
  <text x="410" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">in order</text>
  <path d="M784,436 L876,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#se-blue)"/>
  <text x="830" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">match</text>
  <g filter="url(#se-soft)">
    <path d="M40,413 L40,459 A160,15 0 0 0 360,459 L360,413" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="200" cy="413" rx="160" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,413 L880,459 A160,15 0 0 0 1200,459 L1200,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1040" cy="413" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="200" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Sequencer</text>
  <text x="200" y="504" font-size="20" fill="#92400E" text-anchor="middle">replay rebuilds state</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Matching Engine</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">under 1ms</text>
  <text x="1040" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Order book</text>
  <text x="1040" y="504" font-size="20" fill="#065F46" text-anchor="middle">in RAM, price then time</text>

  <rect x="24" y="580" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#92400E">3. Settlement (asynchronous) · the engine emits events and moves on</text>
  <path d="M264,678 L349,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#se-amber)"/>
  <text x="307" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">emit</text>
  <path d="M577,678 L662,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#se-amber)"/>
  <text x="620" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consume</text>
  <path d="M890,678 L975,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#se-amber)"/>
  <text x="933" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">write</text>
  <g filter="url(#se-soft)">
    <rect x="40" y="640" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,655 L353,701 A110,15 0 0 0 573,701 L573,655" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="655" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="640" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,655 L979,701 A110,15 0 0 0 1199,701 L1199,655" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="655" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Matching Engine</text>
  <text x="150" y="700" font-size="20" fill="#64748B" text-anchor="middle">never writes SQL</text>
  <text x="463" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Results topic</text>
  <text x="463" y="746" font-size="20" fill="#92400E" text-anchor="middle">many readers</text>
  <text x="776" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Persistence</text>
  <text x="776" y="700" font-size="20" fill="#64748B" text-anchor="middle">trades and balances</text>
  <text x="1089" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">PostgreSQL</text>
  <text x="1089" y="746" font-size="20" fill="#5B21B6" text-anchor="middle">partitioned by date</text>

  <rect x="24" y="822" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="854" font-size="20" font-weight="600" fill="#475569">4. Fan out and failover · 1 GB/s of market data, and a hot standby</text>
  <path d="M364,920 L456,920" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#se-blue)"/>
  <text x="410" y="908" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>
  <path d="M784,920 L876,920" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#se-amber)"/>
  <text x="830" y="908" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">shadow</text>
  <g filter="url(#se-soft)">
    <path d="M40,897 L40,943 A160,15 0 0 0 360,943 L360,897" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="200" cy="897" rx="160" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="460" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Results topic</text>
  <text x="200" y="988" font-size="20" fill="#92400E" text-anchor="middle">the same events</text>
  <text x="620" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Market data</text>
  <text x="620" y="942" font-size="20" fill="#64748B" text-anchor="middle">WebSocket fan out</text>
  <text x="1040" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Hot standby</text>
  <text x="1040" y="942" font-size="20" fill="#64748B" text-anchor="middle">same input, no output</text>
  <line x1="44" y1="1094" x2="72" y2="1094" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1101" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1094" x2="344.576" y2="1094" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1101" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1085" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1101" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1085" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1101" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1085" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1101" font-size="20" fill="#475569">core service</text>
</svg>