<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="768" viewBox="0 0 1240 768" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="questions-title questions-desc">
<title id="questions-title">Six questions that fix most answers</title>
<desc id="questions-desc">If the nine-item list is for auditing, this shorter list is for repairing. Each question reliably improves the design it is applied to.</desc>
<defs>
<marker id="questions-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="questions-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="questions-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="questions-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="768" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Six questions that fix most answers</text>
<text x="40" y="86" font-size="21" fill="#4A5568">If the nine-item list is for auditing, this shorter list is for repairing.</text>
<rect x="40" y="690" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="690" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="140.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What did I assume, and what</text><text x="325" y="167.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">breaks if it is wrong?</text>
<path d="M566 148H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 148H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="610" y="118" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">assumptions are invisible to their author,</text><text x="630" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the design depends on them</text>
<circle cx="60" cy="220" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="470" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="212.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What takes everything with it</text><text x="325" y="239.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">if it fails?</text>
<path d="M566 220H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 220H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="610" y="190" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every design has one, and it is usually</text><text x="630" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a component nobody calls critical</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="284.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Which decision would be</text><text x="325" y="311.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">hardest to undo?</text>
<path d="M566 292H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 292H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="610" y="262" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">this locates where the care belongs.</text><text x="630" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Usually the data model</text>
<circle cx="60" cy="364" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="356.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What is the cheaper design,</text><text x="325" y="383.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and why did I reject it?</text>
<path d="M566 364H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 364H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="610" y="334" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a design chosen without one is a default</text><text x="630" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than a decision</text>
<circle cx="60" cy="436" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="443" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="406" width="470" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="428.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How would a person on call</text><text x="325" y="455.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">at 3am experience this?</text>
<path d="M566 436H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 436H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="610" y="406" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it converts an abstract property into</text><text x="630" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a scene with a person in it</text>
<circle cx="60" cy="508" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="515" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="90" y="478" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="500.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What would I have to see</text><text x="325" y="527.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">to change my mind?</text>
<path d="M566 508H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 508H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="610" y="478" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="514" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the question that separates a position from a preference</text>
<rect x="40" y="558" width="1160" height="106" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="558" width="5" height="106" rx="2.5" fill="#39D5AA"/><text x="64" y="591" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">These are not interview technique</text><text x="64" y="617" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">They are a design review you can run on your own work before anybody else does,</text><text x="64" y="643" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is the habit the whole course has been trying to install.</text>
<text x="66" y="724" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The interview performance is a side effect rather than the goal.</text>
</svg>