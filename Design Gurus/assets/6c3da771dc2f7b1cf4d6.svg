<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-label="Analytics runs on a separate path. Events are emitted to a stream, processed in real time for dashboards and in batches into a warehouse for reporting, so heavy queries never touch the production database.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="600" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The serving path, which users wait on</text>
  <rect x="50" y="83" width="220" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="125" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Your services</text>
  <path d="M390 91 v62 a130 13 0 0 0 260 0 v-62 z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <ellipse cx="520" cy="91" rx="130" ry="13" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="520" y="118" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Production database</text>
  <line x1="272" y1="118" x2="384" y2="118" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <rect x="720" y="84" width="480" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="960" y="126" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Never run reports against this</text>
  <line x1="40" y1="190" x2="1200" y2="190" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="40" y="232" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The analytics path, which nobody waits on</text>
  <rect x="35" y="282" width="230" height="76" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="318" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Events</text>
  <text x="150" y="343" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">from your services</text>
  <rect x="335" y="282" width="230" height="76" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="450" y="318" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Event stream</text>
  <text x="450" y="343" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Kafka</text>
  <line x1="257" y1="320" x2="332" y2="320" stroke="#6D28D9" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="680" y="217" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="830" y="252" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Stream processing</text>
  <text x="830" y="277" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">seconds old</text>
  <rect x="680" y="351" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="830" y="386" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Batch processing</text>
  <text x="830" y="411" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">hours old</text>
  <path d="M568 302 C 618 302, 624 254, 674 254" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <path d="M568 338 C 618 338, 624 388, 674 388" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="995" y="217" width="190" height="74" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1090" y="261" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Live dashboards</text>
  <rect x="995" y="351" width="190" height="74" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1090" y="395" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Warehouse</text>
  <line x1="982" y1="254" x2="990" y2="254" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <line x1="982" y1="388" x2="990" y2="388" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="40" y="470" width="1160" height="68" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="511" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The rule is simple: analytics must never sit on the request path, and heavy queries get their own store.</text>
</svg>