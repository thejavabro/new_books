<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Rate limiter high level design: the web server asks the limiter first, and only allowed requests reach the API servers">
<defs>
<filter id="rl1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="rl1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="rl1-m2563EB" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker><marker id="rl1-mDB2777" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker><marker id="rl1-m059669" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<clipPath id="rl1-k1"><rect x="60" y="140" width="170" height="90" rx="12"/></clipPath>
<clipPath id="rl1-k2"><rect x="300" y="140" width="200" height="90" rx="12"/></clipPath>
<clipPath id="rl1-k3"><rect x="570" y="140" width="220" height="90" rx="12"/></clipPath>
<clipPath id="rl1-k4"><rect x="940" y="110" width="230" height="90" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>
<rect x="540" y="60" width="290" height="420" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/><text x="564" y="90" font-size="16.5" font-weight="600" fill="#BE185D">The check</text><rect x="900" y="60" width="300" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><text x="924" y="90" font-size="16.5" font-weight="600" fill="#1D4ED8">The application</text><path d="M 230,185 H 297" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#rl1-m2563EB)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="265" y="170" fill="#1D4ED8">request</text></g><path d="M 500,185 H 567" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#rl1-m2563EB)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="535" y="170" fill="#1D4ED8">ask first</text></g><path d="M 790,170 H 937" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#rl1-m059669)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="865" y="155" fill="#047857">allowed: forward</text></g><path d="M 570,212 H 542 Q 530,212 530,224 V 470 Q 530,482 518,482 H 157 Q 145,482 145,470 V 233" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#rl1-mDB2777)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="335" y="445" fill="#BE185D">over the limit: 429 Too Many Requests,</text></g><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="335" y="467" fill="#BE185D">the request never reaches the API servers</text></g><path d="M 680,230 V 311" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#rl1-mDB2777)"/><g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="694" y="300" fill="#BE185D">read + update</text></g><path d="M 1055,200 V 311" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#rl1-m2563EB)"/><g filter="url(#rl1-soft)">
<rect x="60" y="140" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="60" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#rl1-k1)"/>
</g>
<circle cx="98" cy="185" r="18" fill="#FFFFFF"/>
<g transform="translate(87.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
<text x="124" y="192" font-size="18.5" font-weight="600" fill="#111827">Clients</text><g filter="url(#rl1-soft)">
<rect x="300" y="140" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="300" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#rl1-k2)"/>
</g>
<circle cx="338" cy="185" r="18" fill="#FFFFFF"/>
<g transform="translate(327.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
<text x="364" y="192" font-size="18.5" font-weight="600" fill="#111827">Web Server</text><g filter="url(#rl1-lift)">
<rect x="570" y="140" width="220" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<rect x="570" y="140" width="9" height="90" fill="#DB2777" clip-path="url(#rl1-k3)"/>
</g>
<circle cx="608" cy="185" r="18" fill="#FFFFFF"/>
<g transform="translate(597.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
<text x="634" y="192" font-size="18.5" font-weight="600" fill="#111827">Rate Limiter</text><text x="680" y="255" font-size="15.5" text-anchor="middle" fill="#6B7280">one small record per user</text><g filter="url(#rl1-soft)">
<rect x="940" y="110" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="940" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#rl1-k4)"/>
</g>
<circle cx="978" cy="155" r="18" fill="#FFFFFF"/>
<g transform="translate(967.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
<text x="1004" y="162" font-size="18.5" font-weight="600" fill="#111827">API Servers</text><text x="1055" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">only allowed requests arrive</text><g stroke="#DB2777" stroke-width="1.5"><path d="M 590,330 L 590,404 A 90,16 0 0 0 770,404 L 770,330" fill="#FCE7F3"/><ellipse cx="680" cy="330" rx="90" ry="16" fill="#FDF2F8"/></g>
<text x="680" y="384" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Counters</text><text x="680" y="444" text-anchor="middle" font-size="15.5" fill="#6B7280">Redis, sharded by user</text><g stroke="#4F46E5" stroke-width="1.5"><path d="M 960,330 L 960,404 A 80,16 0 0 0 1120,404 L 1120,330" fill="#E0E7FF"/><ellipse cx="1040" cy="330" rx="80" ry="16" fill="#EEF2FF"/></g>
<text x="1040" y="384" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">App Database</text><text x="1040" y="444" text-anchor="middle" font-size="15.5" fill="#6B7280">the limiter never touches it</text><rect x="40" y="520" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="546" width="200" height="30" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="567" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Request path</text><text x="288" y="567" font-size="15.5" fill="#475569">client to web server to API servers, but only after the check</text><rect x="64" y="582" width="200" height="30" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/><text x="164" y="603" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The check</text><text x="288" y="603" font-size="15.5" fill="#475569">the limiter reads and updates its own counter store, then answers allow or reject</text><rect x="64" y="618" width="200" height="30" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/><text x="164" y="639" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Allowed</text><text x="288" y="639" font-size="15.5" fill="#475569">forwarded to the API servers; a rejected request costs the application nothing</text>
</svg>