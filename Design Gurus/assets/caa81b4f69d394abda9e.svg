<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="704" viewBox="0 0 1240 704" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="dest-title dest-desc">
<title id="dest-title">Ticket, dashboard, or delete</title>
<desc id="dest-desc">Everything that fails the page test still needs a destination, and there are only three honest ones. The deletion pile is larger than people expect.</desc>
<defs>
<marker id="dest-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="dest-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="dest-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="dest-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="704" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Ticket, dashboard, or delete</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Everything that fails the page test still needs a destination, and there are only three honest ones.</text>
<rect x="40" y="626" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="626" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="156" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="163" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="240" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="210" y="162" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ticket</text>
<rect x="350" y="118" width="310" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="149.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">real, needs a person,</text><text x="370" y="174.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">does not need one now</text>
<rect x="680" y="118" width="520" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="700" y="149.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">slow budget burn, a certificate expiring in three</text><text x="700" y="174.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">weeks, a disk filling next month</text>
<circle cx="60" cy="244" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="251" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="206" width="240" height="76" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="210" y="250" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Dashboard</text>
<rect x="350" y="206" width="310" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="250" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">context rather than findings</text>
<rect x="680" y="206" width="520" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="700" y="237.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">saturation, throughput, cache behavior, queue</text><text x="700" y="262.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">depth: what you look at once a page woke you</text>
<circle cx="60" cy="332" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="339" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="294" width="240" height="76" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="210" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Delete</text>
<rect x="350" y="294" width="310" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="370" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">more than people expect</text>
<rect x="680" y="294" width="520" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="700" y="325.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">fired forty times, produced no action forty times.</text><text x="700" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">That is a measurement, and it says remove it</text>
<rect x="40" y="394" width="560" height="112" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="394" width="5" height="112" rx="2.5" fill="#39D5AA"/><text x="64" y="430" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Every page gets reviewed</text><text x="64" y="456" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which fired, which were actionable,</text><text x="64" y="482" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which should change category</text>
<rect x="640" y="394" width="560" height="112" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="394" width="5" height="112" rx="2.5" fill="#39D5AA"/><text x="664" y="430" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A new alert names an action</text><text x="664" y="456" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a link to a runbook means ready;</text><text x="664" y="482" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"investigate" means not yet</text>
<rect x="40" y="530" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="530" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="571" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">If you cannot say what the responder does in the first five minutes, the alert is not finished.</text>
<text x="66" y="660" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A ticket queue nobody reads is the same problem on a longer timescale.</text>
</svg>