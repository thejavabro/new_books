<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One published message splits into two branches. The safe branch reserves the removed number three, keeps recorded_at as number four, and adds accuracy_meters as number five. The breaking branch reuses number three for speed and keeps recorded_at as number four, so an old caller decodes speed as longitude. The wire carries field numbers, not source names.">
  <defs>
    <marker id="pb-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="pb-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="pb-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pb-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pb-k1"><rect x="74" y="410" width="362" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k2"><rect x="74" y="470" width="362" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k3"><rect x="74" y="530" width="362" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k12"><rect x="74" y="590" width="362" height="48" rx="10"/></clipPath>

    <clipPath id="pb-k4"><rect x="696" y="174" width="468" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k5"><rect x="696" y="234" width="468" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k6"><rect x="696" y="294" width="468" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k7"><rect x="696" y="354" width="468" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k8"><rect x="696" y="414" width="468" height="48" rx="10"/></clipPath>

    <clipPath id="pb-k9"><rect x="696" y="598" width="468" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k10"><rect x="696" y="658" width="468" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k11"><rect x="696" y="718" width="468" height="48" rx="10"/></clipPath>
    <clipPath id="pb-k13"><rect x="696" y="778" width="468" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1080" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Field numbers are permanent</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one published message, two ways to change it</text>

  
  <rect x="40" y="362" width="430" height="312" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="392" font-size="16.5" font-weight="600" fill="#1D4ED8">Published version</text>
  <text x="446" y="392" text-anchor="end" font-size="15.5" fill="#6B7280">four fields, four numbers</text>

  
  <rect x="660" y="126" width="540" height="400" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="156" font-size="16.5" font-weight="600" fill="#047857">Reserve the retired number</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four fields, number three retired</text>

  
  <rect x="660" y="550" width="540" height="360" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="684" y="580" font-size="16.5" font-weight="600" fill="#BE185D">Breaking: reuse the number</text>
  <text x="1176" y="580" text-anchor="end" font-size="15.5" fill="#6B7280">four fields, number three reused</text>

  
  <g fill="none" stroke-width="2">
    <path d="M470,440 H478 Q490,440 490,428 V338 Q490,326 502,326 H660" stroke="#059669" stroke-width="2.5" marker-end="url(#pb-em)"/>
    <path d="M470,540 H478 Q490,540 490,552 V688 Q490,700 502,700 H660" stroke="#DB2777" stroke-width="2.5" marker-end="url(#pb-pm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="578" y="312" fill="#047857">safe change</text>
    <text x="578" y="686" fill="#BE185D">breaking change</text>
  </g>

  
  <g filter="url(#pb-soft)">
    <rect x="74" y="410" width="362" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="74" y="410" width="6" height="48" fill="#2563EB" clip-path="url(#pb-k1)"/>
  </g>
  <circle cx="108" cy="434" r="4.5" fill="#2563EB"/>
  <text x="132" y="441" font-size="18.5" font-weight="600" fill="#111827">driver_id = 1</text>

  <g filter="url(#pb-soft)">
    <rect x="74" y="470" width="362" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="74" y="470" width="6" height="48" fill="#2563EB" clip-path="url(#pb-k2)"/>
  </g>
  <circle cx="108" cy="494" r="4.5" fill="#2563EB"/>
  <text x="132" y="501" font-size="18.5" font-weight="600" fill="#111827">latitude = 2</text>

  <g filter="url(#pb-soft)">
    <rect x="74" y="530" width="362" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="74" y="530" width="6" height="48" fill="#2563EB" clip-path="url(#pb-k3)"/>
  </g>
  <circle cx="108" cy="554" r="4.5" fill="#2563EB"/>
  <text x="132" y="561" font-size="18.5" font-weight="600" fill="#111827">longitude = 3</text>

  <g filter="url(#pb-soft)">
    <rect x="74" y="590" width="362" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="74" y="590" width="6" height="48" fill="#2563EB" clip-path="url(#pb-k12)"/>
  </g>
  <circle cx="108" cy="614" r="4.5" fill="#2563EB"/>
  <text x="132" y="621" font-size="18.5" font-weight="600" fill="#111827">recorded_at = 4</text>

  
  <g filter="url(#pb-soft)">
    <rect x="696" y="174" width="468" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="696" y="174" width="6" height="48" fill="#059669" clip-path="url(#pb-k4)"/>
  </g>
  <circle cx="730" cy="198" r="4.5" fill="#059669"/>
  <text x="754" y="205" font-size="18.5" font-weight="600" fill="#111827">driver_id = 1</text>

  <g filter="url(#pb-soft)">
    <rect x="696" y="234" width="468" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="696" y="234" width="6" height="48" fill="#059669" clip-path="url(#pb-k5)"/>
  </g>
  <circle cx="730" cy="258" r="4.5" fill="#059669"/>
  <text x="754" y="265" font-size="18.5" font-weight="600" fill="#111827">latitude = 2</text>

  <g filter="url(#pb-lift)">
    <rect x="696" y="294" width="468" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="696" y="294" width="9" height="48" fill="#059669" clip-path="url(#pb-k6)"/>
  </g>
  <circle cx="730" cy="318" r="15" fill="#FFFFFF"/>
  <g transform="translate(721,309) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="754" y="325" font-size="18.5" font-weight="600" fill="#111827">reserved 3</text>

  <g filter="url(#pb-soft)">
    <rect x="696" y="354" width="468" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="696" y="354" width="6" height="48" fill="#059669" clip-path="url(#pb-k7)"/>
  </g>
  <circle cx="730" cy="378" r="4.5" fill="#059669"/>
  <text x="754" y="385" font-size="18.5" font-weight="600" fill="#111827">recorded_at = 4</text>

  <g filter="url(#pb-soft)">
    <rect x="696" y="414" width="468" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="696" y="414" width="6" height="48" fill="#059669" clip-path="url(#pb-k8)"/>
  </g>
  <circle cx="730" cy="438" r="4.5" fill="#059669"/>
  <text x="754" y="445" font-size="18.5" font-weight="600" fill="#111827">accuracy_meters = 5</text>

  <g fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M747,487 L753,493 L765,479"/>
  </g>
  <text x="930" y="492" text-anchor="middle" font-size="15.5" fill="#6B7280">Binary parsing works; field removal still needs review.</text>

  
  <g filter="url(#pb-soft)">
    <rect x="696" y="598" width="468" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="696" y="598" width="6" height="48" fill="#DB2777" clip-path="url(#pb-k9)"/>
  </g>
  <circle cx="730" cy="622" r="4.5" fill="#DB2777"/>
  <text x="754" y="629" font-size="18.5" font-weight="600" fill="#111827">driver_id = 1</text>

  <g filter="url(#pb-soft)">
    <rect x="696" y="658" width="468" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="696" y="658" width="6" height="48" fill="#DB2777" clip-path="url(#pb-k10)"/>
  </g>
  <circle cx="730" cy="682" r="4.5" fill="#DB2777"/>
  <text x="754" y="689" font-size="18.5" font-weight="600" fill="#111827">latitude = 2</text>

  <g filter="url(#pb-lift)">
    <rect x="696" y="718" width="468" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="696" y="718" width="9" height="48" fill="#DB2777" clip-path="url(#pb-k11)"/>
  </g>
  <circle cx="730" cy="742" r="15" fill="#FFFFFF"/>
  <g transform="translate(721,733) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="754" y="749" font-size="18.5" font-weight="600" fill="#111827">speed = 3</text>

  <g filter="url(#pb-soft)">
    <rect x="696" y="778" width="468" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="696" y="778" width="6" height="48" fill="#DB2777" clip-path="url(#pb-k13)"/>
  </g>
  <circle cx="730" cy="802" r="4.5" fill="#DB2777"/>
  <text x="754" y="809" font-size="18.5" font-weight="600" fill="#111827">recorded_at = 4</text>

  <text x="930" y="856" text-anchor="middle" font-size="15.5" fill="#6B7280">The bytes still decode.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M759,870 L771,882 M771,870 L759,882"/>
  </g>
  <text x="930" y="881" text-anchor="middle" font-size="15.5" fill="#6B7280">An old caller reads speed as longitude.</text>

  
  <rect x="40" y="940" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="982" text-anchor="middle" font-size="16" fill="#475569">The encoded message carries the number. It never carries the field name.</text>
  <text x="620" y="1010" text-anchor="middle" font-size="16" fill="#475569">A silent wrong meaning is worse than a visible error.</text>
</svg>