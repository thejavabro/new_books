<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1326" viewBox="0 0 1240 1326" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six interview questions in this chapter and the deciding pressure behind each: chat ordering, booking contention over scarce capacity, feature-flag read volume with fast propagation, checkout prices that change, calendar recurrence across time zones, and simultaneous document editing.">
  <defs>
    <filter id="p2i-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2i-ks"><rect x="620" y="60" width="28" height="20" rx="5"/></clipPath>
    <clipPath id="p2i-k1"><rect x="76" y="146" width="456" height="90" rx="12"/></clipPath>
    <clipPath id="p2i-k2"><rect x="76" y="320" width="456" height="90" rx="12"/></clipPath>
    <clipPath id="p2i-k3"><rect x="76" y="494" width="456" height="90" rx="12"/></clipPath>
    <clipPath id="p2i-k4"><rect x="76" y="668" width="456" height="90" rx="12"/></clipPath>
    <clipPath id="p2i-k5"><rect x="76" y="842" width="456" height="90" rx="12"/></clipPath>
    <clipPath id="p2i-k6"><rect x="76" y="1016" width="456" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1326" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Six questions, six deciding pressures</text>
  <rect x="620" y="60" width="28" height="20" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <rect x="620" y="60" width="4" height="20" fill="#2563EB" clip-path="url(#p2i-ks)"/>
  <text x="660" y="77" font-size="15.5" fill="#6B7280">Interview question</text>
  <g transform="translate(878,63) scale(0.7)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="906" y="77" font-size="15.5" fill="#6B7280">Deciding pressure</text>

  
  <rect x="40" y="126" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2i-soft)">
    <rect x="76" y="146" width="456" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p2i-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">2. Design a Chat API</text>
  <g transform="translate(78,252) scale(0.62)" fill="none" stroke="#DB2777" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="104" y="265" font-size="15.5" fill="#6B7280">Messages must have one authoritative order while history grows forever.</text>

  
  <rect x="40" y="300" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2i-soft)">
    <rect x="76" y="320" width="456" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="320" width="6" height="90" fill="#2563EB" clip-path="url(#p2i-k2)"/>
  </g>
  <circle cx="114" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,354.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="140" y="372" font-size="18.5" font-weight="600" fill="#111827">3. Design a Booking API</text>
  <g transform="translate(78,426) scale(0.62)" fill="none" stroke="#DB2777" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="104" y="439" font-size="15.5" fill="#6B7280">Two callers may want the same slot while one needs time to pay.</text>

  
  <rect x="40" y="474" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2i-soft)">
    <rect x="76" y="494" width="456" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="494" width="6" height="90" fill="#2563EB" clip-path="url(#p2i-k3)"/>
  </g>
  <circle cx="114" cy="539" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,528.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="546" font-size="18.5" font-weight="600" fill="#111827">4. Design a Feature Flag API</text>
  <g transform="translate(78,600) scale(0.62)" fill="none" stroke="#DB2777" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="104" y="613" font-size="15.5" fill="#6B7280">Reads are enormous, but a change must reach clients within seconds.</text>

  
  <rect x="40" y="648" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2i-soft)">
    <rect x="76" y="668" width="456" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="668" width="6" height="90" fill="#2563EB" clip-path="url(#p2i-k4)"/>
  </g>
  <circle cx="114" cy="713" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,702.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="720" font-size="18.5" font-weight="600" fill="#111827">5. Design a Checkout API</text>
  <g transform="translate(78,774) scale(0.62)" fill="none" stroke="#DB2777" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="104" y="787" font-size="15.5" fill="#6B7280">Prices can change while a customer decides, and checkout must never run twice.</text>

  
  <rect x="40" y="822" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2i-soft)">
    <rect x="76" y="842" width="456" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="842" width="6" height="90" fill="#2563EB" clip-path="url(#p2i-k5)"/>
  </g>
  <circle cx="114" cy="887" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,876.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="894" font-size="18.5" font-weight="600" fill="#111827">6. Design a Calendar API</text>
  <g transform="translate(78,948) scale(0.62)" fill="none" stroke="#DB2777" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="104" y="961" font-size="15.5" fill="#6B7280">A recurring series may never end and must stay correct across time zones.</text>

  
  <rect x="40" y="996" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2i-soft)">
    <rect x="76" y="1016" width="456" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="1016" width="6" height="90" fill="#2563EB" clip-path="url(#p2i-k6)"/>
  </g>
  <circle cx="114" cy="1061" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1050.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="1068" font-size="18.5" font-weight="600" fill="#111827">7. Design a Collaborative Document API</text>
  <g transform="translate(78,1122) scale(0.62)" fill="none" stroke="#DB2777" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="104" y="1135" font-size="15.5" fill="#6B7280">Two people may edit the same text without either redoing all their work.</text>

  
  <rect x="40" y="1186" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1228" text-anchor="middle" font-size="16" fill="#475569">The pressure is the requirement that makes an ordinary-looking answer fail.</text>
  <text x="620" y="1256" text-anchor="middle" font-size="16" fill="#475569">The pressure also shapes the resource model, which is why you identify it before listing endpoints.</text>
</svg>