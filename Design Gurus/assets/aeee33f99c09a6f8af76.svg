<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="theyfind-title theyfind-desc">
<title id="theyfind-title">When the interviewer finds it</title>
<desc id="theyfind-desc">A question whose purpose is to show you a problem is rarely idle curiosity, and answering around what it implies costs more the second time it is asked.</desc>
<defs>
<marker id="theyfind-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="theyfind-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="theyfind-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="theyfind-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="830" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">When the interviewer finds it</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A specific and common case: the interviewer asks a question whose purpose is to show you a problem.</text>
<rect x="40" y="752" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="752" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="104" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="104" rx="2.5" fill="#5EC9EC"/><text x="64" y="149" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"What happens when two users do that at the same time?"</text><text x="64" y="176" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"How does that query perform when a customer has a million records?"</text><text x="64" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"Which service owns that write?"</text>
<rect x="40" y="246" width="1160" height="58" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="246" width="5" height="58" rx="2.5" fill="#F28B9D"/><text x="64" y="281" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A question with an uncomfortable answer was asked because the answer is uncomfortable</text>
<circle cx="60" cy="358" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="365" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="330" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="364" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Engage honestly</text>
<path d="M536 358H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 358H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#theyfind-marker-slate)"/>
<rect x="580" y="330" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="351.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">work through it rather than answering around it,</text><text x="600" y="376.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">including when what happens is bad</text>
<circle cx="60" cy="426" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="433" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="398" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="432" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Draw the conclusion yourself</text>
<path d="M536 426H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 426H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#theyfind-marker-slate)"/>
<rect x="580" y="398" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="419.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"so two concurrent updates would both read</text><text x="600" y="444.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the old value and one would be lost"</text>
<circle cx="60" cy="494" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="501" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="466" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="500" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Then fix it</text>
<path d="M536 494H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 494H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#theyfind-marker-slate)"/>
<rect x="580" y="466" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="500" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with the five-step sequence</text>
<rect x="40" y="546" width="1160" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="580" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reaching the conclusion yourself is worth considerably more than being walked to it</text>
<rect x="40" y="626" width="1160" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="626" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="64" y="656" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">And the opposite case: not every probe is a correction</text><text x="64" y="682" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Do not change a correct design because a question sounded skeptical.</text><text x="64" y="708" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Abandoning a defensible position under mild pressure is its own negative signal.</text>
<text x="66" y="786" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An honest working-through finds the problem if there is one, and confirms the design if there is not.</text>
</svg>