<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="behind-title behind-desc">
<title id="behind-title">The question behind the question</title>
<desc id="behind-desc">The microservices question is asked as a technology question and is almost never one. Underneath it are three questions about the organization and about what is already known, and the costs of each option arrive at different times.</desc>
<defs>
<marker id="behind-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="behind-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="behind-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="behind-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="740" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The question behind the question</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Underneath it are three questions that actually have answers.</text>
<rect x="40" y="662" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="662" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="405" y="118" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="645" y="154" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">"Should we use microservices?"</text>
<path d="M645 184V214" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M645 184V214" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#behind-marker-slate)"/>
<circle cx="60" cy="250" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="257" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="222" width="1110" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="645" y="256" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Can teams ship without coordinating with each other?</text>
<circle cx="60" cy="318" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="325" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="290" width="1110" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="645" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do parts of this need to scale or be isolated differently?</text>
<circle cx="60" cy="386" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="393" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="358" width="1110" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="645" y="392" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do we know where the boundaries are?</text>
<rect x="40" y="438" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="438" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="475" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">All three are about your organization, or about facts you can check.</text>
<rect x="40" y="518" width="1160" height="118" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="518" width="5" height="118" rx="2.5" fill="#39D5AA"/><text x="64" y="556" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The position worth defending is not that monoliths are better.</text><text x="64" y="583" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A monolith's costs grow gradually with size. Distribution's costs arrive</text><text x="64" y="610" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">immediately and in full, long before the scale that would justify them.</text>
<text x="66" y="696" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An answer that starts from the technology has skipped the part that decides it.</text>
</svg>