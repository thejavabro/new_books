<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A write arriving during a partition forces a choice: answer it and let the replicas disagree, or refuse it and stay in agreement">
  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
  <defs>
    <marker id="cp2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="cp2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="400" y1="52" x2="400" y2="108" stroke="#475569" stroke-width="2.5" marker-end="url(#cp2-slate)"/>
  <line x1="530" y1="155" x2="592" y2="155" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="648" y1="155" x2="710" y2="155" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M606,141 L634,169 M634,141 L606,169" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round"/>

  <text x="400" y="38" font-size="20" fill="#475569" text-anchor="middle">a client writes v2 to this side</text>
  <text x="620" y="232" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">network partition</text>

  <g filter="url(#cp2-soft)">
    <rect x="270" y="110" width="260" height="90" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="710" y="110" width="260" height="90" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="400" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica R1</text>
  <text x="400" y="176" font-size="20" fill="#64748B" text-anchor="middle">holds v1</text>
  <text x="840" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica R2</text>
  <text x="840" y="176" font-size="20" fill="#64748B" text-anchor="middle">holds v1, unreachable</text>

  
  <rect x="30" y="248" width="560" height="316" rx="14" fill="#ECFDF5" fill-opacity="0.45" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="284" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Answer the write</text>

  <rect x="650" y="248" width="560" height="316" rx="14" fill="#EFF6FF" fill-opacity="0.45" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="284" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Refuse the write</text>

  <g filter="url(#cp2-soft)">
    <rect x="70" y="310" width="220" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="330" y="310" width="220" height="76" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="690" y="310" width="220" height="76" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="950" y="310" width="220" height="76" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="180" y="344" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R1</text>
  <text x="180" y="372" font-size="20" fill="#065F46" text-anchor="middle">now v2</text>
  <text x="440" y="344" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R2</text>
  <text x="440" y="372" font-size="20" fill="#64748B" text-anchor="middle">still v1</text>
  <text x="800" y="344" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R1</text>
  <text x="800" y="372" font-size="20" fill="#64748B" text-anchor="middle">still v1</text>
  <text x="1060" y="344" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R2</text>
  <text x="1060" y="372" font-size="20" fill="#64748B" text-anchor="middle">still v1</text>

  <text x="310" y="432" font-size="20" fill="#334155" text-anchor="middle">Both sides keep serving,</text>
  <text x="310" y="460" font-size="20" fill="#334155" text-anchor="middle">but they no longer agree.</text>
  <text x="930" y="432" font-size="20" fill="#334155" text-anchor="middle">The copies still agree,</text>
  <text x="930" y="460" font-size="20" fill="#334155" text-anchor="middle">but the client got an error.</text>

  <g filter="url(#cp2-soft)">
    <rect x="90" y="492" width="440" height="52" rx="26" fill="#059669"/>
    <rect x="710" y="492" width="440" height="52" rx="26" fill="#3B82F6"/>
  </g>
  <text x="310" y="525" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Available, not consistent</text>
  <text x="930" y="525" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">Consistent, not available</text>
</svg>