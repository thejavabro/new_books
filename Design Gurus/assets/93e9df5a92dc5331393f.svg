<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four stacked tiers, presentation, business logic, data access and database, with allowed calls from each tier to the one directly below; three forbidden calls are crossed out: presentation calling data access directly, data access calling business logic, and business logic calling presentation">
  <defs>
    <filter id="m02i-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m02i-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m02i-k1"><rect x="250" y="130" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="m02i-k2"><rect x="250" y="290" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="m02i-k3"><rect x="250" y="450" width="560" height="90" rx="12"/></clipPath>
    <marker id="m02i-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m02i-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="980" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Strict dependency rule: allowed vs. forbidden calls</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each layer calls only the layer directly below it; skipping a layer or calling upward is forbidden.</text>



  <g fill="none" stroke-width="2">
    <path d="M370,220 V290" stroke="#059669" stroke-width="2.5" marker-end="url(#m02i-m-emerald)"/>
    <path d="M370,380 V450" stroke="#059669" stroke-width="2.5" marker-end="url(#m02i-m-emerald)"/>
    <path d="M370,540 V604" stroke="#059669" stroke-width="2.5" marker-end="url(#m02i-m-emerald)"/>
    <path d="M810,160 H1030 V510 H810" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#m02i-m-pink)"/>
    <path d="M810,470 H930 V350 H810" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#m02i-m-pink)"/>
    <path d="M810,310 H870 V190 H810" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#m02i-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m02i-soft)">
    <rect x="250" y="130" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="250" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#m02i-k1)"/>
  </g>
  <circle cx="288" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(277.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="314" y="182" font-size="21.5" font-weight="600" fill="#111827">Presentation layer</text>
  <text x="530" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">(Controllers, Views)</text>
  <g filter="url(#m02i-soft)">
    <rect x="250" y="290" width="560" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="250" y="290" width="6" height="90" fill="#059669" clip-path="url(#m02i-k2)"/>
  </g>
  <circle cx="288" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(277.56,324.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="314" y="342" font-size="21.5" font-weight="600" fill="#111827">Business logic layer</text>
  <text x="530" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">(Services, Use Cases)</text>
  <g filter="url(#m02i-soft)">
    <rect x="250" y="450" width="560" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="250" y="450" width="6" height="90" fill="#7C3AED" clip-path="url(#m02i-k3)"/>
  </g>
  <circle cx="288" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(277.56,484.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="314" y="502" font-size="21.5" font-weight="600" fill="#111827">Data access layer</text>
  <text x="530" y="569" font-size="18.5" text-anchor="middle" fill="#6B7280">(Repositories, ORM)</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M250,620 L250,704 A120,16 0 0 0 490,704 L490,620" fill="#DBEAFE"/>
    <ellipse cx="370" cy="620" rx="120" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="370" y="677" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="370" y="754" font-size="18.5" text-anchor="middle" fill="#6B7280">(Data storage)</text>

  <circle cx="1030" cy="335" r="15" fill="#DB2777" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M1025,330 L1035,340 M1035,330 L1025,340" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="930" cy="410" r="15" fill="#DB2777" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M925,405 L935,415 M935,405 L925,415" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="870" cy="250" r="15" fill="#DB2777" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M865,245 L875,255 M875,245 L865,255" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

  <rect x="40" y="800" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="825" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="850" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Allowed call</text>
  <text x="323" y="850" font-size="18.5" fill="#475569">only to the next lower layer</text>
  <rect x="64" y="875" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="900" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Forbidden call</text>
  <text x="323" y="900" font-size="18.5" fill="#475569">cannot skip a layer or call upward</text>
</svg>