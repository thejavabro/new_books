<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Batch processing waits for a window of data to close and processes it as one unit; stream processing handles each record as it arrives">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="mc1-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="mc1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="mc1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="1200" height="230" rx="14" fill="#FFFBEB" fill-opacity="0.4" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="140" y="56" font-size="20" font-weight="600" fill="#92400E">Batch processing</text>

  <rect x="20" y="340" width="1200" height="230" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="140" y="330" font-size="20" font-weight="600" fill="#1E3A8A">Stream processing</text>

  
  <rect x="60" y="110" width="580" height="120" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="350" y="140" font-size="20" fill="#92400E" text-anchor="middle">records collect for a whole day</text>
  <circle cx="120" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="180" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="240" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="300" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="360" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="420" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="480" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="540" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="600" cy="186" r="14" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>

  <line x1="644" y1="170" x2="700" y2="170" stroke="#D97706" stroke-width="2.5" marker-end="url(#mc1-amber)"/>
  <g filter="url(#mc1-soft)">
    <rect x="704" y="130" width="240" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="824" y="164" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One job runs</text>
  <text x="824" y="192" font-size="20" fill="#64748B" text-anchor="middle">over all of it at once</text>

  <line x1="948" y1="170" x2="1000" y2="170" stroke="#D97706" stroke-width="2.5" marker-end="url(#mc1-amber)"/>
  <g filter="url(#mc1-soft)">
    <rect x="1004" y="130" width="180" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1094" y="164" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Report</text>
  <text x="1094" y="192" font-size="20" fill="#64748B" text-anchor="middle">hours later</text>

  <text x="350" y="268" font-size="20" fill="#64748B" text-anchor="middle">high throughput, heavy computation, easy to rerun</text>

  
  <circle cx="120" cy="430" r="14" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="240" cy="430" r="14" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="360" cy="430" r="14" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="480" cy="430" r="14" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="600" cy="430" r="14" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="140" y1="430" x2="222" y2="430" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc1-blue)"/>
  <line x1="260" y1="430" x2="342" y2="430" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc1-blue)"/>
  <line x1="380" y1="430" x2="462" y2="430" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc1-blue)"/>
  <line x1="500" y1="430" x2="582" y2="430" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc1-blue)"/>
  <line x1="620" y1="430" x2="700" y2="430" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc1-blue)"/>
  <text x="350" y="392" font-size="20" fill="#1E40AF" text-anchor="middle">records arrive one at a time, without end</text>

  <g filter="url(#mc1-soft)">
    <rect x="704" y="390" width="240" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="824" y="424" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Always running</text>
  <text x="824" y="452" font-size="20" fill="#64748B" text-anchor="middle">handles each record</text>

  <line x1="948" y1="430" x2="1000" y2="430" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#mc1-blue)"/>
  <g filter="url(#mc1-soft)">
    <rect x="1004" y="390" width="180" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1094" y="424" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Action</text>
  <text x="1094" y="452" font-size="20" fill="#065F46" text-anchor="middle">within seconds</text>

  <text x="350" y="530" font-size="20" fill="#64748B" text-anchor="middle">low latency, windowed computation, never finishes</text>

  
  <text x="620" y="612" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The difference is not the data. It is whether you wait for a window to close before doing the work.</text>
</svg>