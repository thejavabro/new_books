<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="596" viewBox="0 0 1240 596" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four cost levers in the order to pull them: batching, where users notice almost nothing; warm pools, where users notice nothing; quality dials, where users can see a small drop in quality; and free-tier queue stretch, which users feel most. A bar under them runs from the lever users feel least to the one they feel most.">
  <defs>
    <marker id="c8tsl-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="c8tsl-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="c8tsl-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A7F3D0"/><stop offset="1" stop-color="#FDA4AF"/></linearGradient>
    <clipPath id="c8tsl-k1"><rect x="70" y="140" width="255" height="200" rx="12"/></clipPath>
    <clipPath id="c8tsl-k2"><rect x="352" y="140" width="255" height="200" rx="12"/></clipPath>
    <clipPath id="c8tsl-k3"><rect x="634" y="140" width="255" height="200" rx="12"/></clipPath>
    <clipPath id="c8tsl-k4"><rect x="916" y="140" width="255" height="200" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="596" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="384" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Pull the cost levers in a fixed order</text>
  <text x="70" y="128" font-size="15.5" font-weight="600" fill="#6B7280">Lever 1</text>
  <g filter="url(#c8tsl-soft)">
    <rect x="70" y="140" width="255" height="200" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="70" y="140" width="6" height="200" fill="#059669" clip-path="url(#c8tsl-k1)"/>
  </g>
  <circle cx="108" cy="174" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,163.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="134" y="181" font-size="18.5" font-weight="600" fill="#111827">Batching</text>
  <text x="200.5" y="238" font-size="15.5" text-anchor="middle" fill="#4B5563">More images come out</text>
  <text x="200.5" y="259" font-size="15.5" text-anchor="middle" fill="#4B5563">of each GPU-second</text>
  <text x="200.5" y="318" font-size="15.5" font-weight="600" text-anchor="middle" fill="#059669">Users notice almost nothing</text>
  <text x="352" y="128" font-size="15.5" font-weight="600" fill="#6B7280">Lever 2</text>
  <g filter="url(#c8tsl-soft)">
    <rect x="352" y="140" width="255" height="200" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="352" y="140" width="6" height="200" fill="#2563EB" clip-path="url(#c8tsl-k2)"/>
  </g>
  <circle cx="390" cy="174" r="18" fill="#FFFFFF"/>
  <g transform="translate(379.56,163.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="416" y="181" font-size="18.5" font-weight="600" fill="#111827">Warm pools</text>
  <text x="482.5" y="238" font-size="15.5" text-anchor="middle" fill="#4B5563">Size the warm pool from the</text>
  <text x="482.5" y="259" font-size="15.5" text-anchor="middle" fill="#4B5563">spikes you really measured</text>
  <text x="482.5" y="318" font-size="15.5" font-weight="600" text-anchor="middle" fill="#2563EB">Users notice nothing</text>
  <text x="634" y="128" font-size="15.5" font-weight="600" fill="#6B7280">Lever 3</text>
  <g filter="url(#c8tsl-soft)">
    <rect x="634" y="140" width="255" height="200" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="634" y="140" width="6" height="200" fill="#D97706" clip-path="url(#c8tsl-k3)"/>
  </g>
  <circle cx="672" cy="174" r="18" fill="#FFFFFF"/>
  <g transform="translate(661.56,163.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="698" y="181" font-size="18.5" font-weight="600" fill="#111827">Quality dials</text>
  <text x="764.5" y="238" font-size="15.5" text-anchor="middle" fill="#4B5563">Steps and resolution,</text>
  <text x="764.5" y="259" font-size="15.5" text-anchor="middle" fill="#4B5563">set per tier</text>
  <text x="764.5" y="297" font-size="15.5" font-weight="600" text-anchor="middle" fill="#D97706">Users can see a small</text>
  <text x="764.5" y="318" font-size="15.5" font-weight="600" text-anchor="middle" fill="#D97706">drop in quality</text>
  <text x="916" y="128" font-size="15.5" font-weight="600" fill="#6B7280">Lever 4</text>
  <g filter="url(#c8tsl-soft)">
    <rect x="916" y="140" width="255" height="200" rx="12" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1.5"/>
    <rect x="916" y="140" width="6" height="200" fill="#E11D48" clip-path="url(#c8tsl-k4)"/>
  </g>
  <circle cx="954" cy="174" r="18" fill="#FFFFFF"/>
  <g transform="translate(943.56,163.56) scale(0.87)" fill="none" stroke="#E11D48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="980" y="181" font-size="18.5" font-weight="600" fill="#111827">Free-tier queue</text>
  <text x="980" y="203" font-size="18.5" font-weight="600" fill="#111827">stretch</text>
  <text x="1046.5" y="238" font-size="15.5" text-anchor="middle" fill="#4B5563">Free jobs absorb the peak</text>
  <text x="1046.5" y="318" font-size="15.5" font-weight="600" text-anchor="middle" fill="#E11D48">Users feel this lever most</text>
  <rect x="70" y="376" width="1090" height="14" rx="7" fill="url(#c8tsl-grad)"/>
  <path d="M1155,372 L1171,383 L1155,394 Z" fill="#64748B"/>
  <text x="70" y="416" font-size="15.5" font-weight="600" fill="#059669">users feel least</text>
  <text x="1171" y="416" font-size="15.5" font-weight="600" text-anchor="end" fill="#E11D48">users feel most</text>
  <rect x="40" y="480" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="512.5" font-size="15.5" text-anchor="middle" fill="#374151">This order is for cutting the everyday bill.</text>
  <text x="620" y="534.5" font-size="15.5" text-anchor="middle" fill="#374151">A sudden queue backup is a different problem with its own order.</text>
</svg>