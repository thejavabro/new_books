<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="916" viewBox="0 0 1240 916" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five classes of HTTP status codes: 1xx informational, request received and processing continues (100 Continue, 101 Switching Protocols); 2xx success (200 OK, 201 Created, 204 No Content); 3xx redirection, further action is required (301 Moved Permanently, 302 Found, 304 Not Modified); 4xx client error, the request contains bad syntax or cannot be fulfilled (400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 409 Conflict, 422 Unprocessable Entity, 429 Too Many Requests); 5xx server error, the server failed while processing the request (500 Internal Server Error, 502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout)">
