<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five steps from top to bottom: state the problem with numbers, list two or three real options, score the options in a weighted table, check the highest-scoring option against the constraints, then decide and record the decision in an ADR. If the option fails a constraint, the team stays at step 4 and checks the next option on the ranked list.">
  <defs>
    <filter id="mf05a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mf05a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mf05a-k1"><rect x="300" y="120" width="460" height="80" rx="12"/></clipPath>
    <clipPath id="mf05a-k2"><rect x="300" y="240" width="460" height="80" rx="12"/></clipPath>
    <clipPath id="mf05a-k3"><rect x="300" y="360" width="460" height="80" rx="12"/></clipPath>
    <clipPath id="mf05a-k4"><rect x="300" y="480" width="460" height="80" rx="12"/></clipPath>
    <clipPath id="mf05a-k5"><rect x="300" y="600" width="460" height="80" rx="12"/></clipPath>
    <marker id="mf05a-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="mf05a-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="mf05a-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The five-step decision process</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Weights are fixed before scoring, and a failed constraint check sends the team to the next option.</text>



  <g fill="none" stroke-width="2">
    <path d="M530,200 V240" stroke="#64748B" marker-end="url(#mf05a-m-slate)"/>
    <path d="M530,320 V360" stroke="#64748B" marker-end="url(#mf05a-m-slate)"/>
    <path d="M530,440 V480" stroke="#64748B" marker-end="url(#mf05a-m-slate)"/>
    <path d="M530,560 V600" stroke="#059669" marker-end="url(#mf05a-m-emerald)"/>
    <path d="M300,544 H252 Q240,544 240,532 V508 Q240,496 252,496 H300" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#mf05a-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="226" y="514" fill="#BE185D" text-anchor="end">fails a constraint:</text>
    <text x="226" y="538" fill="#BE185D" text-anchor="end">check the next option</text>
    <text x="546" y="586" fill="#047857" text-anchor="start">passes every constraint</text>
  </g>

  <g filter="url(#mf05a-soft)">
    <rect x="300" y="120" width="460" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="300" y="120" width="6" height="80" fill="#2563EB" clip-path="url(#mf05a-k1)"/>
  </g>
  <circle cx="338" cy="160" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,149.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="364" y="167" font-size="21.5" font-weight="600" fill="#111827">1. State the problem</text>
  <g filter="url(#mf05a-soft)">
    <rect x="300" y="240" width="460" height="80" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="300" y="240" width="6" height="80" fill="#4F46E5" clip-path="url(#mf05a-k2)"/>
  </g>
  <circle cx="338" cy="280" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,269.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="364" y="287" font-size="21.5" font-weight="600" fill="#111827">2. List real options</text>
  <g filter="url(#mf05a-soft)">
    <rect x="300" y="360" width="460" height="80" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="300" y="360" width="6" height="80" fill="#7C3AED" clip-path="url(#mf05a-k3)"/>
  </g>
  <circle cx="338" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,389.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="364" y="407" font-size="21.5" font-weight="600" fill="#111827">3. Score in a weighted table</text>
  <g filter="url(#mf05a-soft)">
    <rect x="300" y="480" width="460" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="300" y="480" width="6" height="80" fill="#D97706" clip-path="url(#mf05a-k4)"/>
  </g>
  <circle cx="338" cy="520" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,509.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="364" y="527" font-size="21.5" font-weight="600" fill="#111827">4. Check the constraints</text>
  <g filter="url(#mf05a-lift)">
    <rect x="300" y="600" width="460" height="80" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="300" y="600" width="9" height="80" fill="#059669" clip-path="url(#mf05a-k5)"/>
  </g>
  <circle cx="338" cy="640" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,629.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="364" y="647" font-size="21.5" font-weight="600" fill="#111827">5. Decide and record</text>
  <text x="800" y="154" font-size="18.5" fill="#475569">Name the quality attributes that matter,</text>
  <text x="800" y="181" font-size="18.5" fill="#475569">with numbers, such as p99 under 500 ms</text>
  <text x="800" y="274" font-size="18.5" fill="#475569">Two or three options the team</text>
  <text x="800" y="301" font-size="18.5" fill="#475569">could really build and operate</text>
  <text x="800" y="394" font-size="18.5" fill="#475569">Fix weights that add up to 100, then</text>
  <text x="800" y="421" font-size="18.5" fill="#475569">score each option from 1 to 5</text>
  <text x="800" y="514" font-size="18.5" fill="#475569">Team, budget, deadline, regulation,</text>
  <text x="800" y="541" font-size="18.5" fill="#475569">existing systems and organization</text>
  <text x="800" y="634" font-size="18.5" fill="#475569">Choose, then record the decision</text>
  <text x="800" y="661" font-size="18.5" fill="#475569">and its reopen conditions in an ADR</text>




</svg>