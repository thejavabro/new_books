<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Least bandwidth load balancing sends the next request to Server 2 because it is currently serving the least traffic.">
  <defs>
    <marker id="lb08-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="lb08-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="lb08-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lb08-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lb08-k1"><rect x="70" y="130" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="lb08-k2"><rect x="70" y="330" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="lb08-k3"><rect x="510" y="235" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="lb08-k4"><rect x="950" y="80" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="lb08-k5"><rect x="950" y="235" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="lb08-k6"><rect x="950" y="390" width="180" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="620" y="42" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">8. Least Bandwidth</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M240,175 H363 Q375,175 375,187 V250 Q375,262 387,262 H510" marker-end="url(#lb08-bl)"/>
    <path d="M240,375 H363 Q375,375 375,363 V310 Q375,298 387,298 H510" marker-end="url(#lb08-bl)"/>
  </g>
  <g fill="none" stroke="#059669">
