  </g>
  <text x="1014" y="442" font-size="18.5" font-weight="600" fill="#111827">Server 3</text>

  
  <text x="1040" y="195" font-size="15.5" text-anchor="middle" fill="#6B7280">90 Mbps</text>
  <text x="1040" y="350" font-size="15.5" text-anchor="middle" fill="#6B7280">20 Mbps</text>
  <text x="1040" y="505" font-size="15.5" text-anchor="middle" fill="#6B7280">60 Mbps</text>
