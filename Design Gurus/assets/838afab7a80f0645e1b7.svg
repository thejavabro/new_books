<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Compare hosting and training choices against the requirements.">
  <defs>

    <filter id="m1l2c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l2c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m1l2c-k1"><rect x="50" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m1l2c-k2"><rect x="440" y="70" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="m1l2c-k3"><rect x="830" y="70" width="360" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>


  <g filter="url(#m1l2c-soft)">
    <rect x="50" y="70" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="70" width="6" height="90" fill="#2563EB" clip-path="url(#m1l2c-k1)"/>
  </g>
  <circle cx="88" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="114" y="122" font-size="18.5" font-weight="600" fill="#111827">Call a hosted API</text>
  <text x="230" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">less hosting work; evaluate integration needs</text>
  <text x="230" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">check cost, data handling, and service limits</text>
  <g filter="url(#m1l2c-soft)">
    <rect x="440" y="70" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="440" y="70" width="6" height="90" fill="#7C3AED" clip-path="url(#m1l2c-k2)"/>
  </g>
  <circle cx="478" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,104.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="504" y="122" font-size="18.5" font-weight="600" fill="#111827">Self-host open weights</text>
  <text x="620" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">more deployment and data control</text>
  <text x="620" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">you operate the serving infrastructure</text>
  <g filter="url(#m1l2c-soft)">
    <rect x="830" y="70" width="360" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="830" y="70" width="6" height="90" fill="#D97706" clip-path="url(#m1l2c-k3)"/>
  </g>
  <circle cx="868" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,104.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.9L18.8 9.8l-4.9 1.9L12 16.6l-1.9-4.9L5.2 9.8l4.9-1.9z"/><path d="M18.5 15.5l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9z"/></g>
  <text x="894" y="122" font-size="18.5" font-weight="600" fill="#111827">Train or fine-tune</text>
  <text x="1010" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">adapt the model using suitable data</text>
  <text x="1010" y="208" font-size="15.5" text-anchor="middle" fill="#94A3B8">justify training and maintenance costs</text>
  <rect x="40" y="268" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="302" font-size="16" fill="#475569">Hosting and training are separate choices. A tuned model can use managed hosting.</text>
  <rect x="64" y="328" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="350" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Classic ML</text>
  <text x="288" y="350" font-size="15.5" fill="#475569">ranking and fraud may use your data with in-house or managed systems</text>
  <rect x="64" y="372" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="394" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Generative</text>
  <text x="288" y="394" font-size="15.5" fill="#475569">evaluate an existing model before deciding whether to train or fine-tune</text>
  <rect x="64" y="416" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="438" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Compare total cost</text>
  <text x="288" y="438" font-size="15.5" fill="#475569">include model usage, hardware, utilization, engineering, and operational support</text>
  <rect x="40" y="496" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="541" text-anchor="middle" font-size="16" fill="#475569">Choose based on quality, privacy, latency, cost, volume, and team capability.</text>
</svg>