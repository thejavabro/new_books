<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="798" viewBox="0 0 1240 798" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="contents-title contents-desc">
<title id="contents-title">What a runbook contains</title>
<desc id="contents-desc">Short, specific and mostly commands. A page of prose explaining the architecture is not useful to somebody who has been awake for ninety seconds.</desc>
<defs>
<marker id="contents-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="contents-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="contents-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="contents-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="798" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What a runbook contains</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The useful form is short, specific and mostly commands.</text>
<rect x="40" y="720" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="720" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="400" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="240" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What this alert means</text>
<path d="M446 144H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 144H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#contents-marker-slate)"/>
<rect x="484" y="118" width="716" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="504" y="150" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one sentence, in terms of what users are experiencing</text>
<rect x="40" y="180" width="400" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="212" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How to confirm it</text>
<path d="M446 206H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 206H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#contents-marker-slate)"/>
<rect x="484" y="180" width="716" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="504" y="212" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a query or a link, so the first move is verification rather than belief</text>
<rect x="40" y="242" width="400" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="240" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The first thing to try</text>
<path d="M446 268H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 268H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#contents-marker-slate)"/>
<rect x="484" y="242" width="716" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="504" y="274" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the exact command, the exact dashboard, the exact toggle</text>
<rect x="40" y="304" width="400" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="240" y="336" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How to make it stop</text>
<path d="M446 330H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 330H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#contents-marker-slate)"/>
<rect x="484" y="304" width="716" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="504" y="336" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">separately from how to fix it. Mitigation first</text>
<rect x="40" y="366" width="400" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="240" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Who to escalate to</text>
<path d="M446 392H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 392H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#contents-marker-slate)"/>
<rect x="484" y="366" width="716" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="504" y="398" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">by role rather than by name, with the actual route</text>
<rect x="40" y="428" width="400" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="240" y="460" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What not to do</text>
<path d="M446 454H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 454H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#contents-marker-slate)"/>
<rect x="484" y="428" width="716" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="504" y="460" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the section that saves the most damage, and is almost always absent</text>
<rect x="40" y="500" width="1160" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="500" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="64" y="533" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A runbook that does not say what makes things worse invites somebody to find out</text><text x="64" y="559" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Restarting clears the queue. Failing over loses unreplicated writes.</text><text x="64" y="585" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Scaling up exhausts the database connections.</text>
<rect x="40" y="626" width="560" height="68" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="652.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Rots if it documents the architecture,</text><text x="320" y="679.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">because every change invalidates it</text>
<rect x="640" y="626" width="560" height="68" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="652.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Does not exist if it is behind a login</text><text x="920" y="679.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">that depends on the service that is failing</text>
<text x="66" y="754" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A runbook that has never been followed is a hypothesis. Exercise it in a drill.</text>
</svg>