<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="E-commerce order architecture: clients reach an API Gateway that calls Cart and Checkout, which synchronously reserves stock in Inventory and charges through Payments, then publishes one order placed event to the orders topic that Orders and Fulfillment, Notifications and Analytics each consume independently.">
  <defs>
    <marker id="m07-l02-ecommerce-architecture-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l02-ecommerce-architecture-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m07-l02-ecommerce-architecture-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1120" fill="#FFFFFF"/>

  <rect x="40" y="110" width="1160" height="380" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="155" font-size="20" font-weight="600" fill="#1E3A8A">Synchronous critical path: the buyer is waiting</text>
  <text x="1180" y="155" text-anchor="end" font-size="20" fill="#64748B">about 8 orders a second at peak</text>

  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="55" y="250" width="210" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="160" y="301" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Clients</text>
  <text x="160" y="333" text-anchor="middle" font-size="20" fill="#64748B">web and mobile</text>
  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="300" y="250" width="250" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="425" y="301" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">API Gateway</text>
  <text x="425" y="333" text-anchor="middle" font-size="20" fill="#64748B">auth at the edge</text>
  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="620" y="230" width="280" height="160" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="760" y="285" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cart and Checkout</text>
  <text x="760" y="317" text-anchor="middle" font-size="20" fill="#1E40AF">carts and order placement</text>
  <text x="760" y="349" text-anchor="middle" font-size="20" fill="#1E40AF">one writer per datum</text>
  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="990" y="170" width="200" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1090" y="221" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="1090" y="253" text-anchor="middle" font-size="20" fill="#64748B">stock and holds</text>
  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="990" y="330" width="200" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1090" y="381" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="1090" y="413" text-anchor="middle" font-size="20" fill="#64748B">isolated for PCI</text>

  <g fill="none" stroke-width="2.5">
    <path d="M265,310 L292,310" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l02-ecommerce-architecture-bl)"/>
    <path d="M550,310 L612,310" stroke="#3B82F6" marker-end="url(#m07-l02-ecommerce-architecture-bl)"/>
    <path d="M900,265 C940,265 945,230 982,230" stroke="#3B82F6" marker-end="url(#m07-l02-ecommerce-architecture-bl)"/>
    <path d="M900,355 C940,355 945,390 982,390" stroke="#3B82F6" marker-end="url(#m07-l02-ecommerce-architecture-bl)"/>
    <path d="M760,390 L760,620 L580,620 L580,652" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m07-l02-ecommerce-architecture-am)"/>
    <path d="M740,690 C800,690 812,680 872,680" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l02-ecommerce-architecture-am)"/>
    <path d="M740,730 C800,730 812,800 872,800" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l02-ecommerce-architecture-am)"/>
    <path d="M740,770 C800,770 812,920 872,920" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l02-ecommerce-architecture-am)"/>
  </g>

  <text x="278" y="225" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">REST</text>
  <text x="581" y="218" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">gRPC</text>
  <text x="941" y="200" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reserve</text>
  <text x="941" y="420" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge</text>
  <text x="740" y="560" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">order placed (one fat event)</text>

  <rect x="40" y="530" width="1160" height="470" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="575" font-size="20" font-weight="600" fill="#92400E">Event-driven remainder</text>
  <text x="60" y="607" font-size="20" fill="#64748B">one fat event, everything downstream reads it</text>

  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="420" y="660" width="320" height="140" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="580" y="705" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders topic</text>
  <text x="580" y="737" text-anchor="middle" font-size="20" fill="#92400E">each consumer reads</text>
  <text x="580" y="769" text-anchor="middle" font-size="20" fill="#92400E">it independently</text>
  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="880" y="630" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1030" y="687" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders and Fulfillment</text>
  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="880" y="750" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1030" y="807" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="880" y="870" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1030" y="927" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Analytics</text>
  <g filter="url(#m07-l02-ecommerce-architecture-soft)">
    <rect x="60" y="830" width="330" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="225" y="875" text-anchor="middle" font-size="20" fill="#475569">The event carries the</text>
  <text x="225" y="907" text-anchor="middle" font-size="20" fill="#475569">whole order, so nobody</text>
  <text x="225" y="939" text-anchor="middle" font-size="20" fill="#475569">has to call back</text>

  <line x1="60" y1="1040" x2="96" y2="1040" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1047" font-size="20" fill="#475569">Synchronous: the buyer is waiting on this call</text>
  <line x1="60" y1="1080" x2="96" y2="1080" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1087" font-size="20" fill="#475569">Asynchronous: published once, read independently</text>
</svg>