<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The app server checks the cache first. A hit returns in about 1 ms. A miss reads the database in 150 ms and saves a copy in the cache. With 90 percent hits the average is about 16 ms.">
  <defs>
    <filter id="lt3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lt3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lt3-k1"><rect x="40" y="230" width="240" height="90" rx="12"/></clipPath>
    <marker id="lt3-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lt3-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lt3-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="710" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a cache cuts latency</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Most reads are answered from memory. Only a miss pays for the database.</text>



  <g fill="none" stroke-width="2">
    <path d="M280,255 H460" stroke="#D97706" marker-end="url(#lt3-m-amber)"/>
    <path d="M460,300 H280" stroke="#059669" marker-end="url(#lt3-m-emerald)"/>
    <path d="M160,320 V420 Q160,435 175,435 H1025 Q1040,435 1040,420 V331" stroke="#4F46E5" marker-end="url(#lt3-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="370" y="244" fill="#B45309">check first</text>
    <text x="370" y="326" fill="#047857">hit: 1 ms</text>
    <text x="800" y="426" fill="#4338CA">miss: read the database, 150 ms</text>
  </g>

  <g filter="url(#lt3-soft)">
    <rect x="40" y="230" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="230" width="6" height="90" fill="#2563EB" clip-path="url(#lt3-k1)"/>
  </g>
  <circle cx="78" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,264.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="104" y="282" font-size="21.5" font-weight="600" fill="#111827">App server</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M460,210 L460,314 A120,16 0 0 0 700,314 L700,210" fill="#FEF3C7"/>
    <ellipse cx="580" cy="210" rx="120" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="580" y="277" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Cache</text>
  <text x="580" y="364" font-size="18.5" text-anchor="middle" fill="#6B7280">in memory, like Redis</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M920,210 L920,314 A120,16 0 0 0 1160,314 L1160,210" fill="#E0E7FF"/>
    <ellipse cx="1040" cy="210" rx="120" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="1040" y="277" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>

  <rect x="40" y="480" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="505" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="530" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Cache hit</text>
  <text x="323" y="530" font-size="18.5" fill="#475569">the data is already in the cache, so the answer takes about 1 ms</text>
  <rect x="64" y="555" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="580" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Cache miss</text>
  <text x="323" y="580" font-size="18.5" fill="#475569">the app reads the database, then saves a copy in the cache</text>
  <rect x="64" y="605" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="630" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">90% hits</text>
  <text x="323" y="630" font-size="18.5" fill="#475569">average = 0.9 x 1 + 0.1 x 151 = about 16 ms, instead of 150 ms</text>
</svg>