<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="threeways-title threeways-desc">
<title id="threeways-title">Three ways a key goes wrong</title>
<desc id="threeways-desc">Low cardinality gives too few partitions, skew gives uneven traffic across many, and a monotonic key sends every write to the newest one. Each has a different repair, which is why naming the failure is most of the diagnosis.</desc>
<defs>
<marker id="threeways-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="threeways-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="threeways-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="threeways-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="760" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three ways a key goes wrong</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Bad keys fail in three recognizable ways.</text>
<rect x="40" y="682" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="682" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="270" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V382A6 6 0 0 0 46 388H54Z" fill="#F28B9D"/>
<text x="226" y="156" font-size="23" font-weight="700" fill="#A83147" text-anchor="middle">Low cardinality</text>
<text x="226" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">few distinct values, so few</text><text x="226" y="204" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">partitions</text>
<rect x="64" y="218" width="324" height="110" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="83.0" y="240.0" width="20" height="80" rx="5" fill="#F25461"/>
<rect x="112.0" y="244.0" width="20" height="76" rx="5" fill="#F25461"/>
<rect x="141.0" y="236.0" width="20" height="84" rx="5" fill="#F25461"/>
<text x="226" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">needs a different key</text>
<rect x="434" y="118" width="372" height="270" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V382A6 6 0 0 0 440 388H448Z" fill="#F3CF6A"/>
<text x="620" y="156" font-size="23" font-weight="700" fill="#91642E" text-anchor="middle">Skew</text>
<text x="620" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">high cardinality, uneven</text><text x="620" y="204" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">traffic</text>
<rect x="458" y="218" width="324" height="110" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="477.0" y="310.0" width="20" height="10" rx="5" fill="#E8BC60"/>
<rect x="506.0" y="314.0" width="20" height="6" rx="5" fill="#E8BC60"/>
<rect x="535.0" y="224.0" width="20" height="96" rx="5" fill="#E8BC60"/>
<rect x="564.0" y="312.0" width="20" height="8" rx="5" fill="#E8BC60"/>
<rect x="593.0" y="315.0" width="20" height="5" rx="5" fill="#E8BC60"/>
<rect x="622.0" y="313.0" width="20" height="7" rx="5" fill="#E8BC60"/>
<rect x="651.0" y="309.0" width="20" height="11" rx="5" fill="#E8BC60"/>
<rect x="680.0" y="314.0" width="20" height="6" rx="5" fill="#E8BC60"/>
<rect x="709.0" y="311.0" width="20" height="9" rx="5" fill="#E8BC60"/>
<rect x="738.0" y="314.0" width="20" height="6" rx="5" fill="#E8BC60"/>
<text x="620" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">needs sharding or isolation</text>
<rect x="828" y="118" width="372" height="270" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V382A6 6 0 0 0 834 388H842Z" fill="#AC8BE8"/>
<text x="1014" y="156" font-size="23" font-weight="700" fill="#6040A8" text-anchor="middle">Monotonic</text>
<text x="1014" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">every write targets the newest</text>
<rect x="852" y="218" width="324" height="110" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="871.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="900.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="929.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="958.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="987.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="1016.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="1045.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="1074.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="1103.0" y="317.0" width="20" height="3" rx="5" fill="#7650D6"/>
<rect x="1132.0" y="224.0" width="20" height="96" rx="5" fill="#7650D6"/>
<text x="1014" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">needs bucketing</text>
<text x="620" y="412" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">traffic per partition</text>
<text x="40" y="450" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The giveaways</text>
<rect x="40" y="468" width="420" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="250" y="502" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Low cardinality</text>
<path d="M466 496H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 496H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threeways-marker-slate)"/>
<rect x="510" y="468" width="690" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="502" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you can list the possible values from memory</text>
<rect x="40" y="534" width="420" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="250" y="568" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Skew</text>
<path d="M466 562H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 562H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threeways-marker-slate)"/>
<rect x="510" y="534" width="690" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="568" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it looks fine in testing and appears when a real customer arrives</text>
<rect x="40" y="600" width="420" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="250" y="634" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Monotonic</text>
<path d="M466 628H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 628H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threeways-marker-slate)"/>
<rect x="510" y="600" width="690" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="634" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dashboards look healthy while writes throttle</text>
<text x="66" y="716" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Uniqueness is easy. Evenness is the thing that fails.</text>
</svg>