<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Continuous replication ships each change as it happens, while snapshot replication ships the whole dataset on a schedule and nothing in between">
  <rect x="0" y="0" width="1240" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="rr9-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr9-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="rr9-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="50" width="580" height="290" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="88" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Streaming each change</text>

  <rect x="640" y="50" width="580" height="290" rx="14" fill="#FFFBEB" fill-opacity="0.45" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="88" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Snapshot on a schedule</text>

  <line x1="250" y1="160" x2="290" y2="160" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr9-blue)"/>
  <line x1="310" y1="160" x2="350" y2="160" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr9-blue)"/>
  <line x1="370" y1="160" x2="410" y2="160" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr9-blue)"/>
  <line x1="430" y1="160" x2="472" y2="160" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr9-blue)"/>
  <line x1="870" y1="160" x2="922" y2="160" stroke="#D97706" stroke-width="3" marker-end="url(#rr9-amber)"/>
  <line x1="1052" y1="160" x2="1092" y2="160" stroke="#D97706" stroke-width="3" marker-end="url(#rr9-amber)"/>

  <g filter="url(#rr9-soft)">
    <rect x="60" y="125" width="190" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="480" y="125" width="90" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="680" y="125" width="190" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="930" y="118" width="120" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="1100" y="125" width="100" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>

  <text x="155" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Source</text>
  <text x="525" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Copy</text>
  <text x="775" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Source</text>
  <text x="990" y="153" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">full</text>
  <text x="990" y="181" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">dataset</text>
  <text x="1150" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Copy</text>

  <text x="310" y="250" font-size="20" fill="#1E3A8A" text-anchor="middle">each change ships as it happens,</text>
  <text x="310" y="282" font-size="20" fill="#1E3A8A" text-anchor="middle">so the copy is never far behind</text>
  <text x="930" y="250" font-size="20" fill="#92400E" text-anchor="middle">the whole dataset ships on a timer,</text>
  <text x="930" y="282" font-size="20" fill="#92400E" text-anchor="middle">and nothing arrives in between</text>

  <text x="620" y="398" font-size="20" fill="#475569" text-anchor="middle">A one-row change still triggers a full delivery, which is why snapshots suit slow-changing data.</text>
</svg>