<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="478" viewBox="0 0 1240 478" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The relational model has three parts: structure, integrity and manipulation, each answering a different question">
<defs>
<filter id="rdb13-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<clipPath id="rdb13-k1"><rect x="60" y="100" width="300" height="90" rx="12"/></clipPath>
<clipPath id="rdb13-k2"><rect x="470" y="100" width="300" height="90" rx="12"/></clipPath>
<clipPath id="rdb13-k3"><rect x="880" y="100" width="300" height="90" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="478" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="300" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The relational model is three things, not one</text>

<g filter="url(#rdb13-soft)">
<rect x="60" y="100" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="60" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#rdb13-k1)"/>
</g>
<circle cx="98" cy="145" r="18" fill="#FFFFFF"/>
<g transform="translate(87.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="124" y="152" font-size="18.5" font-weight="600" fill="#111827">Structure</text>
<rect x="60" y="206" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
<text x="78" y="232" font-size="15.5" font-weight="600" fill="#1D4ED8">What shape does data take?</text>
<text x="78" y="256" font-size="15" fill="#111827">Relations, tuples, attributes</text>
<text x="78" y="278" font-size="15" fill="#6B7280">and domains. Everything is</text>
<text x="78" y="296" font-size="15" fill="#6B7280">a table of plain values.</text>

<g filter="url(#rdb13-soft)">
<rect x="470" y="100" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="470" y="100" width="6" height="90" fill="#7C3AED" clip-path="url(#rdb13-k2)"/>
</g>
<circle cx="508" cy="145" r="18" fill="#FFFFFF"/>
<g transform="translate(497.56,134.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
<text x="534" y="152" font-size="18.5" font-weight="600" fill="#111827">Integrity</text>
<rect x="470" y="206" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="488" y="232" font-size="15.5" font-weight="600" fill="#5B21B6">Which tables are legal?</text>
<text x="488" y="256" font-size="15" fill="#111827">Entity integrity and</text>
<text x="488" y="278" font-size="15" fill="#6B7280">referential integrity. Keys must</text>
<text x="488" y="296" font-size="15" fill="#6B7280">be present, and must match.</text>

<g filter="url(#rdb13-soft)">
<rect x="880" y="100" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<rect x="880" y="100" width="6" height="90" fill="#059669" clip-path="url(#rdb13-k3)"/>
</g>
<circle cx="918" cy="145" r="18" fill="#FFFFFF"/>
<g transform="translate(907.56,134.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
<text x="944" y="152" font-size="18.5" font-weight="600" fill="#111827">Manipulation</text>
<rect x="880" y="206" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="898" y="232" font-size="15.5" font-weight="600" fill="#047857">How do you get data out?</text>
<text x="898" y="256" font-size="15" fill="#111827">Relational algebra, and SQL</text>
<text x="898" y="278" font-size="15" fill="#6B7280">built on it. You say what you</text>
<text x="898" y="296" font-size="15" fill="#6B7280">want, not how to fetch it.</text>

<rect x="40" y="374" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="412" font-size="16" fill="#475569">Most courses teach only the first part. The other two are where the model earns its place.</text>
</svg>