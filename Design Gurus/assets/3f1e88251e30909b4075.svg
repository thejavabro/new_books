<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A vault mints a database credential on demand with a one hour lease, the service uses it, and when the lease expires the vault deletes the credential from the database without anyone acting">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>
  <defs>
    <marker id="se6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A password that nobody ever knew, and nobody has to revoke</text>

  <line x1="324" y1="240" x2="346" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#se6-slate)"/>
  <line x1="614" y1="240" x2="636" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#se6-slate)"/>
  <line x1="904" y1="240" x2="926" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#se6-slate)"/>

  
  <rect x="50" y="100" width="270" height="280" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="185" y="140" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1  Service asks</text>
  <rect x="80" y="170" width="210" height="80" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="202" font-size="20" fill="#334155" text-anchor="middle">proves who it is</text>
  <text x="185" y="230" font-size="20" fill="#334155" text-anchor="middle">to the vault</text>
  <text x="185" y="300" font-size="20" fill="#334155" text-anchor="middle">No password is</text>
  <text x="185" y="326" font-size="20" fill="#334155" text-anchor="middle">stored anywhere</text>
  <text x="185" y="352" font-size="20" fill="#334155" text-anchor="middle">in the service.</text>

  
  <rect x="340" y="100" width="270" height="280" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="475" y="140" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">2  Vault mints one</text>
  <rect x="370" y="170" width="210" height="80" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="475" y="202" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">creates a new</text>
  <text x="475" y="230" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">database user</text>
  <text x="475" y="300" font-size="20" fill="#5B21B6" text-anchor="middle">Unique to this one</text>
  <text x="475" y="326" font-size="20" fill="#5B21B6" text-anchor="middle">service instance,</text>
  <text x="475" y="352" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">lease: 1 hour.</text>

  
  <rect x="630" y="100" width="270" height="280" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="765" y="140" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">3  Service uses it</text>
  <rect x="660" y="170" width="210" height="80" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="765" y="202" font-size="20" fill="#065F46" text-anchor="middle">connects and</text>
  <text x="765" y="230" font-size="20" fill="#065F46" text-anchor="middle">does its work</text>
  <text x="765" y="300" font-size="20" fill="#065F46" text-anchor="middle">It can renew the</text>
  <text x="765" y="326" font-size="20" fill="#065F46" text-anchor="middle">lease while it is</text>
  <text x="765" y="352" font-size="20" fill="#065F46" text-anchor="middle">still running.</text>

  
  <rect x="920" y="100" width="270" height="280" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <text x="1055" y="140" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">4  The lease ends</text>
  <rect x="950" y="170" width="210" height="80" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1055" y="202" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the vault drops</text>
  <text x="1055" y="230" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the database user</text>
  <text x="1055" y="300" font-size="20" fill="#B91C1C" text-anchor="middle">Nobody filed a</text>
  <text x="1055" y="326" font-size="20" fill="#B91C1C" text-anchor="middle">ticket. Nobody</text>
  <text x="1055" y="352" font-size="20" fill="#B91C1C" text-anchor="middle">had to remember.</text>

  <rect x="50" y="420" width="1140" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="462" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">If that credential leaks, it is worthless within the hour, and it only ever worked for one service.</text>

  
  <rect x="50" y="526" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="562" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A static secret has to be rotated. A leased one rotates because doing nothing expires it.</text>
  <text x="620" y="592" font-size="20" fill="#334155" text-anchor="middle">That is the whole shift: the safe path stops depending on anyone remembering to take it.</text>
</svg>