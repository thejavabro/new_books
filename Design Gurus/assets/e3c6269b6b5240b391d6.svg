<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three strategies. By business capability, a monolith splits into user, order, payment and notification services. By subdomain, it splits into a recommendation engine (core, given the most investment), seller onboarding (supporting, built in-house) and authentication (generic, bought, such as Auth0). By team structure, it splits into user, order and payment services owned by the user team, the order team and the payment team">
