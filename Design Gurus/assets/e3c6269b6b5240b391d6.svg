  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three ways to decompose a monolith into microservices</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same monolith can be split by business capability, by subdomain, or by team.</text>

