<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="418" viewBox="0 0 1240 418" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three study plans, and what each one covers">
  <defs>
    <marker id="oods-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oods-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oods-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oods-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oods-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oods-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oods-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oods-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oods-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oods-t0"><rect x="44" y="78" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oods-u0"><rect x="570" y="78" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oods-t1"><rect x="44" y="166" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oods-u1"><rect x="570" y="166" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oods-t2"><rect x="44" y="254" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oods-u2"><rect x="570" y="254" width="626" height="64" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="418" fill="#FFFFFF"/>
  <text x="44" y="56" font-size="16.5" fill="#6B7280" font-weight="600">The time you have</text>
  <text x="570" y="56" font-size="16.5" fill="#6B7280" font-weight="600">What that covers</text>
  <g filter="url(#oods-soft)">
    <rect x="44" y="78" width="470" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="78" width="6" height="64" fill="#64748B" clip-path="url(#oods-t0)"/>
  </g>
  <circle cx="82" cy="110.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="116.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">2h</text>
  <text x="112" y="116.5" font-size="18.5" font-weight="600" fill="#111827">One evening</text>
  <g filter="url(#oods-soft)">
    <rect x="570" y="78" width="626" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="570" y="78" width="6" height="64" fill="#64748B" clip-path="url(#oods-u0)"/>
  </g>
  <text x="592" y="116.5" font-size="18.5" font-weight="600" fill="#111827">four method lessons, then two case studies</text>
  <path d="M514,110 L570,110" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oods-arrow-slate)"/>
  <g filter="url(#oods-soft)">
    <rect x="44" y="166" width="470" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="44" y="166" width="6" height="64" fill="#2563EB" clip-path="url(#oods-t1)"/>
  </g>
  <circle cx="82" cy="198.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="204.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">8h</text>
  <text x="112" y="204.5" font-size="18.5" font-weight="600" fill="#111827">One week</text>
  <g filter="url(#oods-soft)">
    <rect x="570" y="166" width="626" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="570" y="166" width="6" height="64" fill="#2563EB" clip-path="url(#oods-u1)"/>
  </g>
  <text x="592" y="204.5" font-size="18.5" font-weight="600" fill="#111827">add the UML chapter, eight case studies, one timed run</text>
  <path d="M514,198 L570,198" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#oods-arrow-blue)"/>
  <g filter="url(#oods-soft)">
    <rect x="44" y="254" width="470" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="44" y="254" width="6" height="64" fill="#059669" clip-path="url(#oods-t2)"/>
  </g>
  <circle cx="82" cy="286.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="292.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">20h</text>
  <text x="112" y="292.5" font-size="18.5" font-weight="600" fill="#111827">One month</text>
  <g filter="url(#oods-soft)">
    <rect x="570" y="254" width="626" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="570" y="254" width="6" height="64" fill="#059669" clip-path="url(#oods-u2)"/>
  </g>
  <text x="592" y="292.5" font-size="18.5" font-weight="600" fill="#111827">the whole course, then four timed runs</text>
  <path d="M514,286 L570,286" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oods-arrow-emerald)"/>
  <text x="620" y="388" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">Every plan ends with one timed run from a blank page. That run decides the result.</text>
</svg>