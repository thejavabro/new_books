<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="756" viewBox="0 0 1240 756" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="strategies-title strategies-desc">
<title id="strategies-title">Five ways to map keys to shards</title>
<desc id="strategies-desc">Range sharding preserves locality but hotspots on the newest range. Hash sharding spreads evenly and loses locality. Directory, consistent hashing with virtual nodes, and slot-based schemes all exist to make the shard count changeable later.</desc>
<defs>
<marker id="strategies-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="strategies-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="strategies-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="strategies-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="756" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Five ways to map keys to shards</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The strategy decides how key values map to shards.</text>
<rect x="40" y="678" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="678" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="515" y="160" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Range queries</text>
<text x="793" y="160" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Distribution</text>
<text x="1071" y="136" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Changing the</text>
<text x="1071" y="160" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">shard count</text>
<rect x="40" y="180" width="330" height="64" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="180" width="5" height="64" rx="2.5" fill="#5EC9EC"/><text x="64" y="205" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Range</text><text x="64" y="231" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">shard owns a key range</text>
<rect x="386" y="184" width="258" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="515" y="218" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">keeps locality</text>
<rect x="664" y="184" width="258" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="793" y="204.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">hotspots on the</text><text x="793" y="231.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">newest range</text>
<rect x="942" y="184" width="258" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1071" y="218" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">hard</text>
<rect x="40" y="256" width="330" height="64" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="256" width="5" height="64" rx="2.5" fill="#39D5AA"/><text x="64" y="281" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Hash</text><text x="64" y="307" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">hash(key) mod N</text>
<rect x="386" y="260" width="258" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="515" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no locality</text>
<rect x="664" y="260" width="258" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="793" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">even spread</text>
<rect x="942" y="260" width="258" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1071" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">hard</text>
<rect x="40" y="332" width="330" height="64" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="332" width="5" height="64" rx="2.5" fill="#AC8BE8"/><text x="64" y="357" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Directory</text><text x="64" y="383" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a lookup service maps keys</text>
<rect x="386" y="336" width="258" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="515" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">your choice</text>
<rect x="664" y="336" width="258" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="793" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">your choice</text>
<rect x="942" y="336" width="258" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1071" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">easy</text>
<rect x="40" y="408" width="330" height="64" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="408" width="5" height="64" rx="2.5" fill="#F3CF6A"/><text x="64" y="433" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Consistent hashing</text><text x="64" y="459" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a ring with virtual nodes</text>
<rect x="386" y="412" width="258" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="515" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no locality</text>
<rect x="664" y="412" width="258" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="793" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">even spread</text>
<rect x="942" y="412" width="258" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1071" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">easy</text>
<rect x="40" y="484" width="330" height="64" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="484" width="5" height="64" rx="2.5" fill="#39D5AA"/><text x="64" y="509" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Slot-based</text><text x="64" y="535" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">16,384 slots in Redis Cluster</text>
<rect x="386" y="488" width="258" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="515" y="522" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no locality</text>
<rect x="664" y="488" width="258" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="793" y="522" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">even spread</text>
<rect x="942" y="488" width="258" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1071" y="522" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">easy</text>
<rect x="40" y="572" width="1160" height="80" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="572" width="5" height="80" rx="2.5" fill="#F3CF6A"/><text x="64" y="605" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The bottom three exist for the last column alone.</text><text x="64" y="631" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Pay for a changeable shard count before you need to change it.</text>
<text x="66" y="712" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Range sharding on time-ordered data puts every new write on one shard while the rest sit idle.</text>
</svg>