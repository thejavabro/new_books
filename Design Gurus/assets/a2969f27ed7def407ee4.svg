<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="904" viewBox="0 0 1240 904" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six steps of a monotonic queue over an array, with the window maximum always at the front"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="904" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="600" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Values that arrive after a larger one can never be the maximum again</text>
<text x="64" y="180" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">i=0   value 1</text>
<rect x="400" y="140" width="80" height="60" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="440" y="178" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">1</text>
<text x="700" y="180" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">the window is not full yet</text>
<text x="64" y="264" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">i=1   value 3</text>
<rect x="400" y="224" width="80" height="60" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="440" y="262" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">3</text>
<text x="700" y="264" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">1 is smaller and older, so it goes</text>
<text x="64" y="348" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">i=2   value -1</text>
<rect x="400" y="308" width="80" height="60" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="440" y="346" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">3</text>
<rect x="490" y="308" width="80" height="60" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="530" y="346" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">-1</text>
<text x="700" y="348" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">window is full, so the max is 3</text>
<text x="64" y="432" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">i=3   value -3</text>
<rect x="400" y="392" width="80" height="60" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="440" y="430" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">3</text>
<rect x="490" y="392" width="80" height="60" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="530" y="430" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">-1</text>
<rect x="580" y="392" width="80" height="60" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="620" y="430" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">-3</text>
<text x="700" y="432" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">the max is still 3</text>
<text x="64" y="516" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">i=4   value 5</text>
<rect x="400" y="476" width="80" height="60" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="440" y="514" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">5</text>
<text x="700" y="516" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">5 is larger than all of them</text>
<text x="64" y="600" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">i=5   value 3</text>
<rect x="400" y="560" width="80" height="60" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="440" y="598" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">5</text>
<rect x="490" y="560" width="80" height="60" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="530" y="598" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">3</text>
<text x="700" y="600" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">the max is 5</text>
<rect x="40" y="688" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="710" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="736" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">front of the queue</text>
<text x="348" y="736" font-size="19.5" fill="#475569">the largest value in the current window</text>
<rect x="64" y="758" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="784" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">still a candidate</text>
<text x="348" y="784" font-size="19.5" fill="#475569">smaller now, but it outlives the values ahead of it</text>
<rect x="64" y="806" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="832" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">removed from the back</text>
<text x="348" y="832" font-size="19.5" fill="#475569">a larger value arrived later, so it can never win</text>
</svg>