<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Updates land on the primary and ripple out to the replicas, and each replica confirms receipt before the next update follows">
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="rr3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rr3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rr3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="670" y="52" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">The primary sends every update to every replica</text>

  <line x1="240" y1="230" x2="312" y2="230" stroke="#475569" stroke-width="2.5" marker-end="url(#rr3-slate)"/>
  <line x1="550" y1="230" x2="782" y2="115" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr3-blue)"/>
  <line x1="550" y1="230" x2="782" y2="230" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr3-blue)"/>
  <line x1="550" y1="230" x2="782" y2="345" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr3-blue)"/>
  <path d="M900,380 L900,440 L435,440 L435,292" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#rr3-emerald)"/>

  <g filter="url(#rr3-soft)">
    <rect x="50" y="190" width="190" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="320" y="180" width="230" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="790" y="80" width="220" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="790" y="195" width="220" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="790" y="310" width="220" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>

  <text x="145" y="238" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client update</text>
  <text x="435" y="222" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Primary</text>
  <text x="435" y="250" font-size="20" fill="#64748B" text-anchor="middle">takes every update</text>
  <text x="900" y="122" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 1</text>
  <text x="900" y="237" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 2</text>
  <text x="900" y="352" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 3</text>

  <text x="670" y="486" font-size="20" fill="#059669" text-anchor="middle">Each replica confirms it received the update, and only then is the next one sent.</text>
</svg>