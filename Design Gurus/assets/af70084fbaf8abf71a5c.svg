<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Video playback has several data owners</title><desc id="desc">Video playback has several data owners. Keep different lifetimes and costs separate. Downloaded bytes do not prove that the user viewed the story.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Video playback has several data owners</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Keep different lifetimes and costs separate.</tspan></text><rect x="50" y="175" width="345.3333333333333" height="280" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="217" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Metadata</tspan></text><text x="72" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Post identity, expiry,</tspan><tspan x="72" dy="32">poster, and media</tspan><tspan x="72" dy="32">variants.</tspan></text><rect x="427.3333333333333" y="175" width="345.3333333333333" height="280" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="449.3333333333333" y="217" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="449.3333333333333" dy="0">Media cache</tspan></text><text x="449.3333333333333" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="449.3333333333333" dy="0">Bounded segments or files</tspan><tspan x="449.3333333333333" dy="32">with eligibility checks.</tspan></text><rect x="804.6666666666666" y="175" width="345.3333333333333" height="280" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="826.6666666666666" y="217" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="826.6666666666666" dy="0">Player state</tspan></text><text x="826.6666666666666" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="826.6666666666666" dy="0">Current item, position,</tspan><tspan x="826.6666666666666" dy="32">decoder, and buffers.</tspan></text><rect x="50" y="515" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="561" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Downloaded bytes do not prove that the user viewed the story.</tspan></text></g></svg>