<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Input data passes through a queue to filter 1, which validates the data; through a queue to filter 2, which enriches it, for example with user info; through a queue to filter 3, which aggregates it; and through a queue to filter 4, which stores it or publishes it to downstream systems as output data. Common use cases: compilers, ML feature pipelines, log processing and network packet processing, each with its stages">
