<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1388" viewBox="0 0 1240 1388" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The method and success cheat sheet: GET for a safe read, collection POST for server-assigned identity, PUT for full replacement, PATCH for named fields, DELETE for absence, and the sentence to say for each.">
  <defs>
    <filter id="p49-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p49-k1"><rect x="76" y="174" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p49-k2"><rect x="76" y="298" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p49-k3"><rect x="76" y="422" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p49-k4"><rect x="76" y="546" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p49-k5"><rect x="76" y="670" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p49-k6"><rect x="76" y="859" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p49-k7"><rect x="76" y="983" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p49-k8"><rect x="76" y="1107" width="360" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1388" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Method and success: which method, and what its success commits</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each row: the trigger, the choice, the interview sentence</text>

  
  <rect x="40" y="126" width="1160" height="661" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Which method the trigger asks for</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">five method choices</text>

  
  <g filter="url(#p49-soft)">
    <rect x="76" y="174" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="48" fill="#2563EB" clip-path="url(#p49-k1)"/>
  </g>
  <circle cx="110" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,189) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="142" y="205" font-size="18.5" font-weight="600" fill="#111827">GET</text>
  <text x="104" y="244" font-size="15.5" fill="#6B7280">When: safe read of a resource or collection.</text>
  <text x="104" y="267" font-size="15.5" fill="#6B7280">Say: "Choose GET; accept that the operation cannot require a caller-visible state change."</text>

  
  <g filter="url(#p49-soft)">
    <rect x="76" y="298" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="298" width="6" height="48" fill="#2563EB" clip-path="url(#p49-k2)"/>
  </g>
  <circle cx="110" cy="322" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,313) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="142" y="329" font-size="18.5" font-weight="600" fill="#111827">POST on the collection</text>
  <text x="104" y="368" font-size="15.5" fill="#6B7280">When: the server assigns identity for a new collection member.</text>
  <text x="104" y="391" font-size="15.5" fill="#6B7280">Say: "Choose collection POST; accept duplicate-safety obligations for retry-sensitive work."</text>

  
  <g filter="url(#p49-soft)">
    <rect x="76" y="422" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="422" width="6" height="48" fill="#2563EB" clip-path="url(#p49-k3)"/>
  </g>
  <circle cx="110" cy="446" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,437) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="142" y="453" font-size="18.5" font-weight="600" fill="#111827">PUT</text>
  <text x="104" y="492" font-size="15.5" fill="#6B7280">When: the caller knows the complete member URL and replaces its full value.</text>
  <text x="104" y="515" font-size="15.5" fill="#6B7280">Say: "Choose PUT; accept that omitted representation fields are replaced, not preserved."</text>

  
  <g filter="url(#p49-soft)">
    <rect x="76" y="546" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="546" width="6" height="48" fill="#2563EB" clip-path="url(#p49-k4)"/>
  </g>
  <circle cx="110" cy="570" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,561) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="142" y="577" font-size="18.5" font-weight="600" fill="#111827">PATCH</text>
  <text x="104" y="616" font-size="15.5" fill="#6B7280">When: the caller changes an explicit subset of allowed fields.</text>
  <text x="104" y="639" font-size="15.5" fill="#6B7280">Say: "Choose PATCH; accept field-level omission and null rules plus concurrency semantics."</text>

  
  <g filter="url(#p49-soft)">
    <rect x="76" y="670" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="670" width="6" height="48" fill="#2563EB" clip-path="url(#p49-k5)"/>
  </g>
  <circle cx="110" cy="694" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,685) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16"/>
    <path d="M10 4h4"/>
    <path d="M6.5 7l1 13h9l1-13"/>
  </g>
  <text x="142" y="701" font-size="18.5" font-weight="600" fill="#111827">DELETE with 204</text>
  <text x="104" y="740" font-size="15.5" fill="#6B7280">When: the caller removes a resource and needs no response body.</text>
  <text x="104" y="763" font-size="15.5" fill="#6B7280">Say: "Choose DELETE and 204; accept that repeated deletion behavior must still be documented."</text>

  
  <rect x="40" y="811" width="1160" height="413" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="841" font-size="16.5" font-weight="600" fill="#047857">Which success response the outcome commits to</text>
  <text x="1176" y="841" text-anchor="end" font-size="15.5" fill="#6B7280">three success choices</text>

  
  <g filter="url(#p49-soft)">
    <rect x="76" y="859" width="360" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="859" width="6" height="48" fill="#059669" clip-path="url(#p49-k6)"/>
  </g>
  <circle cx="110" cy="883" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,874) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="142" y="890" font-size="18.5" font-weight="600" fill="#111827">200</text>
  <text x="104" y="929" font-size="15.5" fill="#6B7280">When: the request completed and returns an ordinary result.</text>
  <text x="104" y="952" font-size="15.5" fill="#6B7280">Say: "Choose 200; accept that the response makes no new-member Location promise."</text>

  
  <g filter="url(#p49-soft)">
    <rect x="76" y="983" width="360" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="983" width="6" height="48" fill="#059669" clip-path="url(#p49-k7)"/>
  </g>
  <circle cx="110" cy="1007" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,998) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="142" y="1014" font-size="18.5" font-weight="600" fill="#111827">201 with Location</text>
  <text x="104" y="1053" font-size="15.5" fill="#6B7280">When: a resource now exists.</text>
  <text x="104" y="1076" font-size="15.5" fill="#6B7280">Say: "Choose 201; accept the obligation that the created resource is addressable when the response returns."</text>

  
  <g filter="url(#p49-soft)">
    <rect x="76" y="1107" width="360" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1107" width="6" height="48" fill="#059669" clip-path="url(#p49-k8)"/>
  </g>
  <circle cx="110" cy="1131" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,1122) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="142" y="1138" font-size="18.5" font-weight="600" fill="#111827">202 with status tracking</text>
  <text x="104" y="1177" font-size="15.5" fill="#6B7280">When: work was accepted but will finish later.</text>
  <text x="104" y="1200" font-size="15.5" fill="#6B7280">Say: "Choose 202; provide status tracking, completion or failure details, and a clear recovery policy."</text>

  
  <rect x="40" y="1248" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1290" text-anchor="middle" font-size="16" fill="#475569">Every row has the same shape: name the choice, then name the obligation the choice accepts.</text>
  <text x="620" y="1318" text-anchor="middle" font-size="16" fill="#475569">GET for a safe read, collection POST for server-assigned identity, PUT for full replacement, PATCH for named fields, DELETE for absence.</text>
</svg>