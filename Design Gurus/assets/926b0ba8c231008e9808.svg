<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="852" viewBox="0 0 1240 852" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities and flow for a YouTube likes and dislikes backend: a user reacts to a video or a comment, the likes service appends the reaction to a reaction store and increments a count store, and returns updated counts">
  <defs>
    <filter id="ytke-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytke-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytke-k1"><rect x="50" y="270" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="ytke-k2"><rect x="340" y="140" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="ytke-k3"><rect x="340" y="400" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="ytke-k4"><rect x="650" y="270" width="250" height="90" rx="12"/></clipPath>
    <marker id="ytke-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ytke-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ytke-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ytke-in" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="ytke-in-s" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#4F46E5"/></marker>
    <marker id="ytke-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="852" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">YouTube likes and dislikes: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One reaction is written twice: appended as a record, and folded into an aggregate count.</text>

  
  <g fill="none" stroke-width="2">
    
    <path d="M240,290 H278 Q290,290 290,278 V197 Q290,185 302,185 H340" stroke="#2563EB" marker-end="url(#ytke-bl)"/>
    
    <path d="M240,340 H278 Q290,340 290,352 V433 Q290,445 302,445 H340" stroke="#2563EB" marker-end="url(#ytke-bl)"/>
    
    <path d="M540,185 H578 Q590,185 590,197 V283 Q590,295 602,295 H650" stroke="#D97706" marker-end="url(#ytke-am)"/>
    
    <path d="M540,445 H578 Q590,445 590,433 V347 Q590,335 602,335 H650" stroke="#059669" marker-end="url(#ytke-em)"/>
    
    <path d="M900,295 H938 Q950,295 950,283 V202 Q950,190 962,190 H1000" stroke="#4F46E5" marker-end="url(#ytke-in)" marker-start="url(#ytke-in-s)"/>
    
    <path d="M900,335 H938 Q950,335 950,347 V438 Q950,450 962,450 H1000" stroke="#7C3AED" marker-end="url(#ytke-vi)"/>
    
    <path d="M775,360 V588 Q775,600 763,600 H52 Q40,600 40,588 V327 Q40,315 52,315 H50" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ytke-bl)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="290" y="250" fill="#1D4ED8">reacts to</text>
    <text x="290" y="388" fill="#1D4ED8">reacts to</text>
    <text x="595" y="242" fill="#B45309">reaction</text>
    <text x="595" y="400" fill="#047857">reaction</text>
    <text x="925" y="250" fill="#4338CA">increment and read</text>
    <text x="925" y="400" fill="#5B21B6">append</text>
    <text x="470" y="592" fill="#1D4ED8">confirmation and updated counts</text>
  </g>

  
  <g filter="url(#ytke-soft)">
    <rect x="50" y="270" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="270" width="6" height="90" fill="#2563EB" clip-path="url(#ytke-k1)"/>
  </g>
  <circle cx="88" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,304.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="114" y="322" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="145" y="389" font-size="18.5" text-anchor="middle" fill="#6B7280">e.g. User A, id=123</text>
  <text x="145" y="416" font-size="18.5" text-anchor="middle" fill="#94A3B8">clicks like or dislike</text>

  
  <g filter="url(#ytke-soft)">
    <rect x="340" y="140" width="200" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="340" y="140" width="6" height="90" fill="#D97706" clip-path="url(#ytke-k2)"/>
  </g>
  <circle cx="378" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="404" y="192" font-size="21.5" font-weight="600" fill="#111827">Video</text>
  <text x="440" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">e.g. Video V, id=XYZ1</text>
  <text x="440" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">tracks likes and dislikes</text>

  
  <g filter="url(#ytke-soft)">
    <rect x="340" y="400" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="340" y="400" width="6" height="90" fill="#059669" clip-path="url(#ytke-k3)"/>
  </g>
  <circle cx="378" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,434.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="404" y="452" font-size="21.5" font-weight="600" fill="#111827">Comment</text>
  <text x="440" y="519" font-size="18.5" text-anchor="middle" fill="#6B7280">e.g. Comment C, id=cmt99</text>
  <text x="440" y="546" font-size="18.5" text-anchor="middle" fill="#94A3B8">tracks like counts</text>

  
  <g filter="url(#ytke-lift)">
    <rect x="650" y="270" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="650" y="270" width="9" height="90" fill="#2563EB" clip-path="url(#ytke-k4)"/>
  </g>
  <circle cx="688" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,304.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="714" y="322" font-size="21.5" font-weight="600" fill="#111827">Likes Service (API)</text>

  
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M1000,140 L1000,234 A95,16 0 0 0 1190,234 L1190,140" fill="#E0E7FF"/>
    <ellipse cx="1095" cy="140" rx="95" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="1095" y="200" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Count Store</text>
  <text x="1095" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">cache and DB</text>
  <text x="1095" y="311" font-size="18.5" text-anchor="middle" fill="#94A3B8">aggregated counts</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M1000,400 L1000,494 A95,16 0 0 0 1190,494 L1190,400" fill="#EDE9FE"/>
    <ellipse cx="1095" cy="400" rx="95" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1095" y="460" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Reaction Store</text>
  <text x="1095" y="544" font-size="18.5" text-anchor="middle" fill="#6B7280">NoSQL DB</text>
  <text x="1095" y="571" font-size="18.5" text-anchor="middle" fill="#94A3B8">user, target, type, time</text>

  
  <rect x="40" y="650" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="672" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="695" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Like and Dislike</text>
  <text x="323" y="695" font-size="18.5" fill="#475569">the two reaction types; a user can toggle or remove either at any time</text>

  <rect x="64" y="716" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="739" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Reaction</text>
  <text x="323" y="739" font-size="18.5" fill="#475569">the association linking one user to one video or comment, with a type and a timestamp</text>

  <rect x="64" y="760" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="783" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Count</text>
  <text x="323" y="783" font-size="18.5" fill="#475569">the aggregate per video or comment, read on every page view so it has to stay fast</text>
</svg>