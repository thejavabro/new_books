<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1220" viewBox="0 0 1240 1220" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four ways serverless functions handle state. 1, stateless functions: a request goes to a function with no local state, which returns a response. 2, external storage for persistent state: a function reads and writes a database or object storage such as DynamoDB or S3. 3, caching for short-lived state: a function reads and writes a cache such as Redis or ElastiCache. 4, external orchestration for workflow state: two functions exchange state with a workflow orchestrator such as Step Functions">
  <defs>
    <filter id="m15j-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m15j-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m15j-k1"><rect x="610" y="200" width="140" height="90" rx="12"/></clipPath>
    <clipPath id="m15j-k2"><rect x="820" y="200" width="140" height="90" rx="12"/></clipPath>
    <clipPath id="m15j-k3"><rect x="1030" y="200" width="146" height="90" rx="12"/></clipPath>
    <clipPath id="m15j-k4"><rect x="640" y="470" width="140" height="90" rx="12"/></clipPath>
    <clipPath id="m15j-k5"><rect x="640" y="740" width="140" height="90" rx="12"/></clipPath>
    <clipPath id="m15j-k6"><rect x="590" y="1010" width="140" height="90" rx="12"/></clipPath>
    <clipPath id="m15j-k7"><rect x="788" y="1010" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="m15j-k8"><rect x="1036" y="1010" width="140" height="90" rx="12"/></clipPath>
    <marker id="m15j-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m15j-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1220" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How serverless functions manage state</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Functions keep no state themselves, so state lives in storage, a cache, or a workflow service.</text>

  <rect x="40" y="120" width="1160" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Stateless functions</text>
  <rect x="64" y="226" width="490" height="134" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="256" font-size="19.5" font-weight="600" fill="#1D4ED8">Key point</text>
  <rect x="40" y="390" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="420" font-size="19.5" font-weight="600" fill="#B45309">2. External storage for persistent state</text>
  <rect x="64" y="502" width="490" height="118" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="88" y="532" font-size="19.5" font-weight="600" fill="#B45309">Key point</text>
  <rect x="40" y="660" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="690" font-size="19.5" font-weight="600" fill="#047857">3. Caching for short-lived state</text>
  <rect x="64" y="772" width="490" height="118" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="802" font-size="19.5" font-weight="600" fill="#047857">Key point</text>
  <rect x="40" y="930" width="1160" height="250" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="960" font-size="19.5" font-weight="600" fill="#475569">4. External orchestration for workflow state</text>
  <rect x="64" y="1042" width="490" height="118" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="88" y="1072" font-size="19.5" font-weight="600" fill="#475569">Key point</text>

  <g fill="none" stroke-width="2">
    <path d="M750,245 H820" stroke="#2563EB" marker-end="url(#m15j-m-blue)"/>
    <path d="M960,245 H1030" stroke="#2563EB" marker-end="url(#m15j-m-blue)"/>
    <path d="M780,503 H900" stroke="#2563EB" marker-end="url(#m15j-m-blue)"/>
    <path d="M900,527 H780" stroke="#2563EB" marker-end="url(#m15j-m-blue)"/>
    <path d="M780,773 H900" stroke="#2563EB" marker-end="url(#m15j-m-blue)"/>
    <path d="M900,797 H780" stroke="#2563EB" marker-end="url(#m15j-m-blue)"/>
    <path d="M730,1043 H788" stroke="#4F46E5" marker-end="url(#m15j-m-indigo)"/>
    <path d="M788,1067 H730" stroke="#4F46E5" marker-end="url(#m15j-m-indigo)"/>
    <path d="M978,1043 H1036" stroke="#4F46E5" marker-end="url(#m15j-m-indigo)"/>
    <path d="M1036,1067 H978" stroke="#4F46E5" marker-end="url(#m15j-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m15j-soft)">
    <rect x="610" y="200" width="140" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="610" y="200" width="6" height="90" fill="#2563EB" clip-path="url(#m15j-k1)"/>
  </g>
  <text x="630" y="252" font-size="21.5" font-weight="600" fill="#111827">Request</text>
  <g filter="url(#m15j-soft)">
    <rect x="820" y="200" width="140" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="820" y="200" width="6" height="90" fill="#7C3AED" clip-path="url(#m15j-k2)"/>
  </g>
  <text x="840" y="252" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <text x="890" y="319" font-size="18.5" text-anchor="middle" fill="#6B7280">(no local state)</text>
  <g filter="url(#m15j-soft)">
    <rect x="1030" y="200" width="146" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1030" y="200" width="6" height="90" fill="#059669" clip-path="url(#m15j-k3)"/>
  </g>
  <text x="1050" y="252" font-size="21.5" font-weight="600" fill="#111827">Response</text>
  <g filter="url(#m15j-soft)">
    <rect x="640" y="470" width="140" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="640" y="470" width="6" height="90" fill="#7C3AED" clip-path="url(#m15j-k4)"/>
  </g>
  <text x="660" y="522" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g filter="url(#m15j-soft)">
    <rect x="640" y="740" width="140" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="640" y="740" width="6" height="90" fill="#7C3AED" clip-path="url(#m15j-k5)"/>
  </g>
  <text x="660" y="792" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g filter="url(#m15j-soft)">
    <rect x="590" y="1010" width="140" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="590" y="1010" width="6" height="90" fill="#7C3AED" clip-path="url(#m15j-k6)"/>
  </g>
  <text x="610" y="1062" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g filter="url(#m15j-soft)">
    <rect x="788" y="1010" width="190" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="788" y="1010" width="6" height="90" fill="#4F46E5" clip-path="url(#m15j-k7)"/>
  </g>
  <text x="808" y="1049.25" font-size="21.5" font-weight="600" fill="#111827">Workflow</text>
  <text x="808" y="1074.75" font-size="21.5" font-weight="600" fill="#111827">orchestrator</text>
  <text x="883" y="1129" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, Step Functions)</text>
  <g filter="url(#m15j-soft)">
    <rect x="1036" y="1010" width="140" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="1036" y="1010" width="6" height="90" fill="#7C3AED" clip-path="url(#m15j-k8)"/>
  </g>
  <text x="1056" y="1062" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M900,472 L900,552 A105,16 0 0 0 1110,552 L1110,472" fill="#DBEAFE"/>
    <ellipse cx="1005" cy="472" rx="105" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1005" y="514.5" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">Database or</text>
  <text x="1005" y="539.5" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">object storage</text>
  <text x="1005" y="602" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, DynamoDB, S3)</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M900,742 L900,822 A105,16 0 0 0 1110,822 L1110,742" fill="#DBEAFE"/>
    <ellipse cx="1005" cy="742" rx="105" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1005" y="797" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Cache</text>
  <text x="1005" y="872" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, Redis, ElastiCache)</text>
  <text x="64" y="186" font-size="18.5" fill="#6B7280">Functions do not keep state between invocations.</text>
  <text x="64" y="213" font-size="18.5" fill="#6B7280">Each invocation is independent.</text>
  <text x="88" y="285" font-size="18.5" fill="#1F2937">Memory and files may survive between warm</text>
  <text x="88" y="312" font-size="18.5" fill="#1F2937">invocations of one environment, so use them as</text>
  <text x="88" y="339" font-size="18.5" fill="#1F2937">a cache, never as the source of truth.</text>
  <text x="64" y="456" font-size="18.5" fill="#6B7280">Use managed storage services to store and</text>
  <text x="64" y="483" font-size="18.5" fill="#6B7280">retrieve state across invocations.</text>
  <text x="88" y="564" font-size="18.5" fill="#1F2937">Store user data, application state, and any</text>
  <text x="88" y="591" font-size="18.5" fill="#1F2937">information that needs to persist.</text>
  <text x="64" y="726" font-size="18.5" fill="#6B7280">Use managed caches to store temporary state like</text>
  <text x="64" y="753" font-size="18.5" fill="#6B7280">session data or frequently accessed data.</text>
  <text x="88" y="834" font-size="18.5" fill="#1F2937">Useful for caching, sessions, rate limiting, and</text>
  <text x="88" y="861" font-size="18.5" fill="#1F2937">temporary data with an expiry time.</text>
  <text x="64" y="996" font-size="18.5" fill="#6B7280">Use a managed workflow service to maintain state</text>
  <text x="64" y="1023" font-size="18.5" fill="#6B7280">across multiple function invocations.</text>
  <text x="88" y="1104" font-size="18.5" fill="#1F2937">Stores the state of long-running workflows and</text>
  <text x="88" y="1131" font-size="18.5" fill="#1F2937">coordinates multiple function invocations.</text>




</svg>