<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The payment platform: idempotency at the entrance, a payment intent state machine driven by the card network&#39;s webhooks, an append-only double-entry ledger with balances as projections, payouts as a saga, and reconciliation comparing four books">
  <rect x="0" y="0" width="1300" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="s" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="ss" viewBox="0 0 9 9" refX="0.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  
  <rect x="60" y="40" width="540" height="72" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="330" y="84" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">The buyer presses pay, possibly twice</text>
  <line x1="330" y1="112" x2="330" y2="148" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="60" y="150" width="540" height="86" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="84" y="186" font-size="20" font-weight="700" fill="#5B21B6">API gateway: an idempotency key is required</text>
  <text x="84" y="216" font-size="20" fill="#334155">The second press returns the first result, not a second charge.</text>
  <line x1="330" y1="236" x2="330" y2="272" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="60" y="274" width="540" height="112" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/>
  <text x="84" y="310" font-size="22" font-weight="700" fill="#5B21B6">Payment intent: one state machine per payment</text>
  <text x="84" y="342" font-size="20" fill="#334155">created, authorized, captured, refunded, failed. Every</text>
  <text x="84" y="370" font-size="20" fill="#334155">transition is recorded before it is acknowledged.</text>
  <line x1="330" y1="386" x2="330" y2="424" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="60" y="426" width="540" height="118" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
  <text x="84" y="464" font-size="22" font-weight="700" fill="#065F46">The ledger: the only source of truth</text>
  <text x="84" y="496" font-size="20" fill="#334155">Append-only, double-entry, immutable. Nothing is ever</text>
  <text x="84" y="524" font-size="20" fill="#334155">updated in place, so history cannot be rewritten.</text>
  <line x1="330" y1="544" x2="330" y2="582" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>

  <rect x="60" y="584" width="540" height="86" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="84" y="620" font-size="20" font-weight="700" fill="#065F46">Balances are projections, not stored numbers</text>
  <text x="84" y="650" font-size="20" fill="#334155">Any balance, as of any moment, is replayed from the ledger.</text>

  
  <rect x="700" y="274" width="540" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="724" y="310" font-size="22" font-weight="700" fill="#92400E">The card network</text>
  <text x="724" y="342" font-size="20" fill="#334155">Someone else's system, which also fails, and which</text>
  <text x="724" y="370" font-size="20" fill="#334155">answers whenever it answers.</text>

  <line x1="608" y1="318" x2="692" y2="318" stroke="#475569" stroke-width="2.5" marker-end="url(#s)" marker-start="url(#ss)"/>
  <text x="650" y="256" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">authorize, capture</text>

  <line x1="970" y1="386" x2="970" y2="424" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="992" y="412" font-size="20" fill="#475569">confirmations, at least once</text>

  <rect x="700" y="426" width="540" height="118" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="724" y="464" font-size="22" font-weight="700" fill="#5B21B6">Webhook receiver</text>
  <text x="724" y="496" font-size="20" fill="#334155">Verify the signature, persist, acknowledge fast, then</text>
  <text x="724" y="524" font-size="20" fill="#334155">deduplicate: the same confirmation will arrive again.</text>

  
  <path d="M698,470 L648,470 L648,362 L608,362" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#s)"/>
  <text x="662" y="580" font-size="20" font-weight="700" fill="#5B21B6">The confirmation is what advances</text>
  <text x="662" y="608" font-size="20" font-weight="700" fill="#5B21B6">the intent, and the ledger entry is</text>
  <text x="662" y="636" font-size="20" font-weight="700" fill="#5B21B6">written once, however many</text>
  <text x="662" y="664" font-size="20" font-weight="700" fill="#5B21B6">copies arrive.</text>

  
  <rect x="60" y="700" width="1180" height="112" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="84" y="736" font-size="22" font-weight="700" fill="#991B1B">Reconciliation, daily: it assumes we are wrong</text>
  <text x="84" y="768" font-size="20" fill="#334155">Four books are compared: our ledger, the network's webhook stream, the network's settlement files,</text>
  <text x="84" y="796" font-size="20" fill="#334155">and the bank statements behind the payouts. Payouts themselves run as a saga with idempotent instructions.</text>

  
  <text x="60" y="864" font-size="20" font-weight="700" fill="#0F172A">Never trust the webhook alone. A confirmation that never arrives is caught by the settlement file within a day,</text>
  <text x="60" y="894" font-size="20" font-weight="700" fill="#0F172A">and by the intent's own timeout within hours.</text>
</svg>