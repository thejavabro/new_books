      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="pn-k1"><rect x="80" y="174" width="470" height="90" rx="12"/></clipPath>
    <clipPath id="pn-k2"><rect x="690" y="174" width="470" height="90" rx="12"/></clipPath>
