    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="144" y="882" font-size="18.5" font-weight="600" fill="#111827">rate_limit_exceeded</text>
  <rect x="472" y="857" width="62" height="36" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.4"/>
  <text x="503" y="881" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">429</text>
  <text x="315" y="945" text-anchor="middle" font-size="15.5" fill="#6B7280">The published create rate was reached</text>

  <g filter="url(#pn-soft)">
    <rect x="690" y="830" width="470" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="690" y="830" width="6" height="90" fill="#059669" clip-path="url(#pn-k10)"/>
  </g>
  <circle cx="728" cy="875" r="18" fill="#FFFFFF"/>
