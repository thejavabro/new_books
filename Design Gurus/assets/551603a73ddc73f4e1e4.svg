    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="754" y="882" font-size="18.5" font-weight="600" fill="#111827">Wait for Retry-After</text>

  
  <rect x="40" y="994" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1024" font-size="16.5" font-weight="600" fill="#475569">Cannot accept work now, 503</text>
  <text x="1176" y="1024" text-anchor="end" font-size="15.5" fill="#6B7280">one failure</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M550,1087 H690" marker-end="url(#pn-em)"/>
  </g>

  
  <g filter="url(#pn-soft)">
    <rect x="80" y="1042" width="470" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="1042" width="6" height="90" fill="#DB2777" clip-path="url(#pn-k11)"/>
  </g>
  <circle cx="118" cy="1087" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,1076.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="144" y="1094" font-size="18.5" font-weight="600" fill="#111827">job_service_unavailable</text>
  <rect x="472" y="1069" width="62" height="36" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.4"/>
  <text x="503" y="1093" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">503</text>
  <text x="315" y="1157" text-anchor="middle" font-size="15.5" fill="#6B7280">The service cannot durably accept work now</text>

  <g filter="url(#pn-soft)">
    <rect x="690" y="1042" width="470" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
