    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="144" y="586" font-size="18.5" font-weight="600" fill="#111827">authentication_required</text>
  <rect x="472" y="561" width="62" height="36" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.4"/>
  <text x="503" y="585" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">401</text>
  <text x="315" y="649" text-anchor="middle" font-size="15.5" fill="#6B7280">The credential is missing or invalid</text>

