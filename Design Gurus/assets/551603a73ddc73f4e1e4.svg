  </g>
  <text x="144" y="734" font-size="18.5" font-weight="600" fill="#111827">export_not_allowed</text>
  <rect x="472" y="709" width="62" height="36" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.4"/>
  <text x="503" y="733" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">403</text>
  <text x="315" y="797" text-anchor="middle" font-size="15.5" fill="#6B7280">No export scope, or a nonrenewing quota is spent</text>

  <g filter="url(#pn-soft)">
    <rect x="690" y="682" width="470" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="690" y="682" width="6" height="90" fill="#059669" clip-path="url(#pn-k8)"/>
  </g>
  <circle cx="728" cy="727" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,716.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="754" y="734" font-size="18.5" font-weight="600" fill="#111827">Get permission, or stop</text>

  
  <g filter="url(#pn-soft)">
    <rect x="80" y="830" width="470" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="830" width="6" height="90" fill="#DB2777" clip-path="url(#pn-k9)"/>
  </g>
