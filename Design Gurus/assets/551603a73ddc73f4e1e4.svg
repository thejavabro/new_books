    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="754" y="1094" font-size="18.5" font-weight="600" fill="#111827">Retry with the same idempotency key</text>

  
  <rect x="40" y="1206" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1232" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="1254" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Status and code</text>
  <text x="288" y="1254" font-size="15.5" fill="#475569">the HTTP status, and the stable error code the caller matches on</text>
  <rect x="64" y="1276" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="1298" text-anchor="middle" font-size="15.5" font-weight="600" fill="#6B7280">Condition</text>
  <text x="288" y="1298" font-size="15.5" fill="#475569">the gray line under each failure card: what was true at submission time</text>
  <rect x="64" y="1320" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="1342" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Caller action</text>
  <text x="288" y="1342" font-size="15.5" fill="#475569">the one next step the caller takes, shown at the end of each arrow</text>

  
  <rect x="40" y="1402" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1447" text-anchor="middle" font-size="16" fill="#475569">A failure that can only happen during execution appears in the final failed state.</text>
