    <clipPath id="pn-k9"><rect x="80" y="830" width="470" height="90" rx="12"/></clipPath>
    <clipPath id="pn-k10"><rect x="690" y="830" width="470" height="90" rx="12"/></clipPath>
    <clipPath id="pn-k11"><rect x="80" y="1042" width="470" height="90" rx="12"/></clipPath>
    <clipPath id="pn-k12"><rect x="690" y="1042" width="470" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1518" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Validate at submission. Do not accept a job certain to fail.</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">six named failures at create time</text>

  
  <rect x="40" y="126" width="1160" height="336" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">Bad input, rejected with 400</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two failures</text>

