  </g>
  <text x="754" y="586" font-size="18.5" font-weight="600" fill="#111827">Authenticate</text>

  
  <g filter="url(#pn-soft)">
    <rect x="80" y="682" width="470" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
