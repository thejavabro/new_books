<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1518" viewBox="0 0 1240 1518" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six named failures of creating an export job, each with its status, stable code, condition, and the action the caller should take next. Everything knowable at submission time is validated before the job is accepted.">
  <defs>
