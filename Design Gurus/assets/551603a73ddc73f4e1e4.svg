  </g>
  <text x="144" y="374" font-size="18.5" font-weight="600" fill="#111827">invalid_time_range</text>
  <rect x="472" y="349" width="62" height="36" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.4"/>
  <text x="503" y="373" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="315" y="437" text-anchor="middle" font-size="15.5" fill="#6B7280">Start is not before end, or the range is too wide</text>

  <g filter="url(#pn-soft)">
    <rect x="690" y="322" width="470" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="690" y="322" width="6" height="90" fill="#059669" clip-path="url(#pn-k4)"/>
