  </g>
  <text x="754" y="226" font-size="18.5" font-weight="600" fill="#111827">Choose an allowed enum value</text>

  
  <g filter="url(#pn-soft)">
    <rect x="80" y="322" width="470" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="322" width="6" height="90" fill="#DB2777" clip-path="url(#pn-k3)"/>
