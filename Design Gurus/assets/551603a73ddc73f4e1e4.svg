    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="754" y="374" font-size="18.5" font-weight="600" fill="#111827">Correct the fields</text>

  
  <rect x="40" y="486" width="1160" height="484" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="516" font-size="16.5" font-weight="600" fill="#475569">Permission and capacity, 401, 403 and 429</text>
  <text x="1176" y="516" text-anchor="end" font-size="15.5" fill="#6B7280">three failures</text>

