<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six step pipeline: code changes, build, test, build artifact, deploy to staging, deploy to production; a change is pushed to the main branch, the build compiles it and runs unit tests, the test step runs integration tests, one deployable artifact such as a JAR or Docker image is created, it is deployed to staging where smoke tests run, and the same artifact is deployed to production with a rolling or blue-green deployment">
  <defs>
    <filter id="msa1h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="msa1h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="msa1h-k1"><rect x="40" y="130" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="msa1h-k2"><rect x="450" y="130" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="msa1h-k3"><rect x="820" y="130" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="msa1h-k4"><rect x="40" y="355" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="msa1h-k5"><rect x="410" y="355" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="msa1h-k6"><rect x="820" y="355" width="380" height="90" rx="12"/></clipPath>
    <marker id="msa1h-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Monolithic deployment pipeline</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Six steps take a code change from commit to production as one deployable artifact.</text>



  <g fill="none" stroke-width="2">
    <path d="M380,175 H450" stroke="#64748B" marker-end="url(#msa1h-m-slate)"/>
    <path d="M750,175 H820" stroke="#64748B" marker-end="url(#msa1h-m-slate)"/>
    <path d="M1120,175 H1150 Q1162,175 1162,187 V313 Q1162,325 1150,325 H202 Q190,325 190,337 V355" stroke="#64748B" marker-end="url(#msa1h-m-slate)"/>
    <path d="M340,400 H410" stroke="#64748B" stroke-width="2.5" marker-end="url(#msa1h-m-slate)"/>
    <path d="M750,400 H820" stroke="#64748B" stroke-width="2.5" marker-end="url(#msa1h-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#msa1h-soft)">
    <rect x="40" y="130" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#msa1h-k1)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">1. Code changes</text>
  <text x="210" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">push the change</text>
  <text x="210" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">to the main branch</text>
  <g filter="url(#msa1h-soft)">
    <rect x="450" y="130" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="450" y="130" width="6" height="90" fill="#059669" clip-path="url(#msa1h-k2)"/>
  </g>
  <circle cx="488" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="514" y="182" font-size="21.5" font-weight="600" fill="#111827">2. Build</text>
  <text x="600" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">compile the code</text>
  <text x="600" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">and run unit tests</text>
  <g filter="url(#msa1h-soft)">
    <rect x="820" y="130" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="820" y="130" width="6" height="90" fill="#7C3AED" clip-path="url(#msa1h-k3)"/>
  </g>
  <circle cx="858" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,164.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="884" y="182" font-size="21.5" font-weight="600" fill="#111827">3. Test</text>
  <text x="970" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">run integration tests</text>
  <g filter="url(#msa1h-lift)">
    <rect x="40" y="355" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="40" y="355" width="9" height="90" fill="#D97706" clip-path="url(#msa1h-k4)"/>
  </g>
  <circle cx="78" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,389.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="104" y="407" font-size="21.5" font-weight="600" fill="#111827">4. Build artifact</text>
  <text x="190" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">create one deployable artifact</text>
  <text x="190" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">such as a JAR or Docker image</text>
  <g filter="url(#msa1h-soft)">
    <rect x="410" y="355" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="410" y="355" width="6" height="90" fill="#DB2777" clip-path="url(#msa1h-k5)"/>
  </g>
  <circle cx="448" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(437.56,389.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="474" y="407" font-size="21.5" font-weight="600" fill="#111827">5. Deploy to staging</text>
  <text x="580" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">deploy the artifact to staging</text>
  <text x="580" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">and run smoke tests</text>
  <g filter="url(#msa1h-soft)">
    <rect x="820" y="355" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="820" y="355" width="6" height="90" fill="#2563EB" clip-path="url(#msa1h-k6)"/>
  </g>
  <circle cx="858" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,389.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M4 16.5v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></g>
  <text x="884" y="407" font-size="21.5" font-weight="600" fill="#111827">6. Deploy to production</text>
  <text x="1010" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">deploy the same artifact,</text>
  <text x="1010" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">rolling or blue-green</text>




</svg>