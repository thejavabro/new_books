<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A hash index answers an exact match in one jump but cannot serve a range query; a B-tree keeps keys in order and serves both">
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
  <defs>
    <marker id="ix7-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ix7-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ix7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="ix7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="500" rx="14" fill="#F8FAFC" fill-opacity="0.6" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Hash index: buckets, no order</text>

  <rect x="640" y="76" width="580" height="500" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">B-tree index: keys stay in order</text>

  
  <line x1="310" y1="172" x2="310" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#ix7-slate)"/>
  <g filter="url(#ix7-soft)">
    <rect x="90" y="110" width="440" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="90" y="216" width="440" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="310" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">key = 'ABC123'</text>
  <text x="310" y="255" font-size="20" fill="#334155" text-anchor="middle">hash(key) picks a bucket</text>

  
  <path d="M310,278 C310,296 365,300 365,316" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ix7-emerald)"/>
  <g filter="url(#ix7-soft)">
    <rect x="60" y="320" width="110" height="70" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="185" y="320" width="110" height="70" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="310" y="320" width="110" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="435" y="320" width="110" height="70" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="115" y="363" font-size="20" fill="#94A3B8" text-anchor="middle">bucket</text>
  <text x="240" y="363" font-size="20" fill="#94A3B8" text-anchor="middle">bucket</text>
  <text x="365" y="363" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">found</text>
  <text x="490" y="363" font-size="20" fill="#94A3B8" text-anchor="middle">bucket</text>

  
  <rect x="60" y="418" width="485" height="58" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="302" y="455" font-size="20" fill="#065F46" text-anchor="middle">Exact match: one jump, constant time</text>
  <rect x="60" y="490" width="485" height="58" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="302" y="527" font-size="20" fill="#991B1B" text-anchor="middle">Range or ORDER BY: not possible</text>

  
  <line x1="930" y1="172" x2="930" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#ix7-slate)"/>
  <line x1="930" y1="278" x2="735" y2="318" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="930" y1="278" x2="985" y2="318" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="930" y1="278" x2="1110" y2="318" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="930" y1="278" x2="862" y2="314" stroke="#059669" stroke-width="2" marker-end="url(#ix7-emerald)"/>
  <g filter="url(#ix7-soft)">
    <rect x="710" y="110" width="440" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="830" y="216" width="200" height="62" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="930" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">key = 'ABC123'</text>
  <text x="930" y="255" font-size="20" fill="#334155" text-anchor="middle">root node</text>

  
  <g filter="url(#ix7-soft)">
    <rect x="680" y="320" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="805" y="320" width="110" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="930" y="320" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="1055" y="320" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="735" y="363" font-size="20" fill="#334155" text-anchor="middle">AAA</text>
  <text x="860" y="363" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">ABC</text>
  <text x="985" y="363" font-size="20" fill="#334155" text-anchor="middle">BCD</text>
  <text x="1110" y="363" font-size="20" fill="#334155" text-anchor="middle">CDE</text>

  
  <rect x="695" y="418" width="485" height="58" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="937" y="455" font-size="20" fill="#065F46" text-anchor="middle">Exact match: a few steps down the tree</text>
  <rect x="695" y="490" width="485" height="58" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="937" y="527" font-size="20" fill="#065F46" text-anchor="middle">Range or ORDER BY: walk the leaves</text>

  
  <text x="620" y="622" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A hash scatters keys on purpose, which is why it is fast for equality and useless for ranges.</text>
</svg>