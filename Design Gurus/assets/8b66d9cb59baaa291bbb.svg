<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" style="background-color:#ffffff">
<defs>
<marker id="a2" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#000000">

<rect x="40" y="66" width="250" height="74" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="66" width="250" height="30" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="165" y="86" text-anchor="middle" font-weight="bold">BillingService</text>
<text x="52" y="122">+ chargeCustomer()</text>

<rect x="470" y="40" width="330" height="236" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="470" y="40" width="330" height="30" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="635" y="60" text-anchor="middle" font-weight="bold">ConfigStore</text>

<line x1="470" y1="70" x2="800" y2="70" stroke="#6c8ebf"/>
<text x="482" y="94">- INSTANCE : ConfigStore  {static}</text>
<text x="482" y="118">- values : Map&lt;String, String&gt;</text>

<line x1="470" y1="134" x2="800" y2="134" stroke="#6c8ebf"/>
<text x="482" y="158">- ConfigStore()</text>
<text x="482" y="182">+ getInstance() : ConfigStore  {static}</text>
<text x="482" y="206">+ get(key : String) : String</text>
<text x="482" y="230">+ set(key : String, value : String)</text>

<path d="M 290 96 L 465 96" stroke="#000000" fill="none" marker-end="url(#a2)"/>
<text x="300" y="88" font-size="12" fill="#414d60">calls getInstance()</text>

<path d="M 470 250 L 165 250 L 165 145" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#a2)"/>
<text x="180" y="242" font-size="12" fill="#414d60">returns the one INSTANCE</text>

<rect x="40" y="308" width="760" height="72" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="60" y="334" font-size="13" fill="#414d60">The private constructor is what enforces the pattern: no caller can write new ConfigStore().</text>
<text x="60" y="358" font-size="13" fill="#414d60">getInstance() is the only way in, and it always hands back the same INSTANCE.</text>
</g>
</svg>