<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="496" viewBox="0 0 1240 496" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Over one month of 43,200 minutes, a single ten-minute partition is about two hundredths of one percent of the time. The remaining 99.98 percent is the else case, so the latency against consistency trade is the one that every request pays.">
  <rect x="0" y="0" width="1240" height="496" fill="#FFFFFF"/>
  <defs>
    <marker id="pc3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="pc3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="pc3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="pc3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="pc3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="pc3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="pc3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="pc3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="pc3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One month of running: how much time is each case?</text>
  <rect x="60" y="110" width="1120" height="70" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="490" y="154" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">E: healthy network, 99.98 percent of the month</text>
  <rect x="998" y="110" width="6" height="70" fill="#DC2626"/>
  <text x="60" y="212" font-size="18" fill="#64748B" text-anchor="start">start of the month</text>
  <text x="1180" y="212" font-size="18" fill="#64748B" text-anchor="end">end of the month</text>
  <line x1="1001" y1="258" x2="1001" y2="188" stroke="#DC2626" stroke-width="2.2" marker-end="url(#pc3-r)"/>
  <text x="1001" y="292" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="middle">P: one partition, 10 minutes</text>
  <text x="1001" y="318" font-size="19" fill="#64748B" text-anchor="middle">0.02 percent of the month</text>
  <g filter="url(#pc3-soft)"><rect x="60" y="350" width="540" height="116" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/></g>
  <text x="330" y="392" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle">The P half</text>
  <text x="330" y="428" font-size="19" fill="#0F172A" text-anchor="middle">decides what happens during a rare bad hour</text>
  <g filter="url(#pc3-soft)"><rect x="640" y="350" width="540" height="116" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="910" y="392" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">The E half</text>
  <text x="910" y="428" font-size="19" fill="#0F172A" text-anchor="middle">decides what every request feels, all day</text>
</svg>