<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1156" viewBox="0 0 1240 1156" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A create request and the resource response do not match, and should not. The request carries only the decisions the caller owns: items, shipping_address_id, and an optional delivery_note. The response carries the public truth after the server validates, prices, defaults, and creates. The server assigns or derives the id, the customer, the prices, the status, and the timestamps. Two ways this goes wrong: returning only the id, and forcing both shapes to match.">
  <defs>
    <filter id="xl05request-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl05request-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl05request-k1"><rect x="84" y="198" width="472" height="48" rx="10"/></clipPath>
