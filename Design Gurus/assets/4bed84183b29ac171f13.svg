    <clipPath id="xl05request-k3"><rect x="84" y="326" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl05request-k4"><rect x="684" y="198" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl05request-k5"><rect x="684" y="262" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl05request-k6"><rect x="684" y="326" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl05request-k7"><rect x="684" y="390" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl05request-k8"><rect x="684" y="454" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl05request-k9"><rect x="64" y="624" width="208" height="90" rx="12"/></clipPath>
    <clipPath id="xl05request-k10"><rect x="290" y="624" width="208" height="90" rx="12"/></clipPath>
    <clipPath id="xl05request-k11"><rect x="516" y="624" width="208" height="90" rx="12"/></clipPath>
    <clipPath id="xl05request-k12"><rect x="742" y="624" width="208" height="90" rx="12"/></clipPath>
    <clipPath id="xl05request-k13"><rect x="968" y="624" width="208" height="90" rx="12"/></clipPath>
    <clipPath id="xl05request-k14"><rect x="84" y="848" width="496" height="90" rx="12"/></clipPath>
    <clipPath id="xl05request-k15"><rect x="660" y="848" width="496" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1156" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The request and the response are not the same shape</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one create call, two different shapes</text>

  
  <rect x="40" y="126" width="556" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="84" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">The request: POST /orders</text>
  <text x="84" y="178" font-size="15.5" fill="#6B7280">only what the caller owns</text>

  <g filter="url(#xl05request-soft)">
    <rect x="84" y="198" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="198" width="6" height="48" fill="#2563EB" clip-path="url(#xl05request-k1)"/>
  </g>
  <circle cx="118" cy="222" r="4.5" fill="#2563EB"/>
  <text x="142" y="229" font-size="18.5" font-weight="600" fill="#111827">items: product_id and quantity</text>

  <g filter="url(#xl05request-soft)">
    <rect x="84" y="262" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="262" width="6" height="48" fill="#2563EB" clip-path="url(#xl05request-k2)"/>
  </g>
  <circle cx="118" cy="286" r="4.5" fill="#2563EB"/>
  <text x="142" y="293" font-size="18.5" font-weight="600" fill="#111827">shipping_address_id</text>

  <g filter="url(#xl05request-soft)">
    <rect x="84" y="326" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="326" width="6" height="48" fill="#2563EB" clip-path="url(#xl05request-k3)"/>
  </g>
  <circle cx="118" cy="350" r="4.5" fill="#2563EB"/>
  <text x="142" y="357" font-size="18.5" font-weight="600" fill="#111827">delivery_note (optional)</text>

  <text x="84" y="422" font-size="15.5" font-weight="600" fill="#1D4ED8">Everything else is missing on purpose</text>
  <circle cx="92" cy="447" r="3.5" fill="#2563EB"/>
  <text x="106" y="452" font-size="15.5" fill="#6B7280">no id, no customer_id, no status, no prices, no timestamps</text>
  <circle cx="92" cy="477" r="3.5" fill="#2563EB"/>
  <text x="106" y="482" font-size="15.5" fill="#6B7280">the caller does not own those values</text>

  
  <rect x="644" y="126" width="556" height="420" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="156" font-size="16.5" font-weight="600" fill="#047857">The response: 201 Created</text>
  <text x="684" y="178" font-size="15.5" fill="#6B7280">the complete public resource, ready to render</text>

  <g filter="url(#xl05request-soft)">
    <rect x="684" y="198" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="198" width="6" height="48" fill="#059669" clip-path="url(#xl05request-k4)"/>
  </g>
  <circle cx="718" cy="222" r="4.5" fill="#059669"/>
  <text x="742" y="229" font-size="18.5" font-weight="600" fill="#111827">id, customer_id, status</text>

  <g filter="url(#xl05request-soft)">
    <rect x="684" y="262" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="262" width="6" height="48" fill="#059669" clip-path="url(#xl05request-k5)"/>
  </g>
  <circle cx="718" cy="286" r="4.5" fill="#059669"/>
  <text x="742" y="293" font-size="18.5" font-weight="600" fill="#111827">items with name and unit_amount</text>

  <g filter="url(#xl05request-soft)">
    <rect x="684" y="326" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="326" width="6" height="48" fill="#059669" clip-path="url(#xl05request-k6)"/>
  </g>
  <circle cx="718" cy="350" r="4.5" fill="#059669"/>
  <text x="742" y="357" font-size="18.5" font-weight="600" fill="#111827">total_amount and currency</text>

  <g filter="url(#xl05request-soft)">
    <rect x="684" y="390" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="390" width="6" height="48" fill="#059669" clip-path="url(#xl05request-k7)"/>
  </g>
  <circle cx="718" cy="414" r="4.5" fill="#059669"/>
  <text x="742" y="421" font-size="18.5" font-weight="600" fill="#111827">shipping_address, delivery_note</text>

  <g filter="url(#xl05request-soft)">
    <rect x="684" y="454" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="454" width="6" height="48" fill="#059669" clip-path="url(#xl05request-k8)"/>
  </g>
  <circle cx="718" cy="478" r="4.5" fill="#059669"/>
  <text x="742" y="485" font-size="18.5" font-weight="600" fill="#111827">created_at, updated_at</text>

  
  <rect x="40" y="570" width="1160" height="200" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="600" font-size="16.5" font-weight="600" fill="#B45309">The server assigns or derives the rest</text>
  <text x="1176" y="600" text-anchor="end" font-size="15.5" fill="#6B7280">all of it appears in the response, none of it in the request</text>

  <g filter="url(#xl05request-soft)">
    <rect x="64" y="624" width="208" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="624" width="6" height="90" fill="#D97706" clip-path="url(#xl05request-k9)"/>
  </g>
  <circle cx="102" cy="669" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,658.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="128" y="676" font-size="18.5" font-weight="600" fill="#111827">The id</text>
  <text x="168" y="739" font-size="15.5" text-anchor="middle" fill="#6B7280">not sent by the caller</text>

  <g filter="url(#xl05request-soft)">
    <rect x="290" y="624" width="208" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="290" y="624" width="6" height="90" fill="#D97706" clip-path="url(#xl05request-k10)"/>
  </g>
  <circle cx="328" cy="669" r="18" fill="#FFFFFF"/>
  <g transform="translate(317.56,658.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="354" y="676" font-size="18.5" font-weight="600" fill="#111827">The customer</text>
  <text x="394" y="739" font-size="15.5" text-anchor="middle" fill="#6B7280">the authenticated caller</text>

  <g filter="url(#xl05request-soft)">
    <rect x="516" y="624" width="208" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="516" y="624" width="6" height="90" fill="#D97706" clip-path="url(#xl05request-k11)"/>
  </g>
  <circle cx="554" cy="669" r="18" fill="#FFFFFF"/>
  <g transform="translate(543.56,658.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="580" y="676" font-size="18.5" font-weight="600" fill="#111827">The prices</text>
  <text x="620" y="739" font-size="15.5" text-anchor="middle" fill="#6B7280">from the current offer</text>

  <g filter="url(#xl05request-soft)">
    <rect x="742" y="624" width="208" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="742" y="624" width="6" height="90" fill="#D97706" clip-path="url(#xl05request-k12)"/>
  </g>
  <circle cx="780" cy="669" r="18" fill="#FFFFFF"/>
  <g transform="translate(769.56,658.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="806" y="676" font-size="18.5" font-weight="600" fill="#111827">The status</text>
  <text x="846" y="739" font-size="15.5" text-anchor="middle" fill="#6B7280">set by the server</text>

  <g filter="url(#xl05request-soft)">
    <rect x="968" y="624" width="208" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="968" y="624" width="6" height="90" fill="#D97706" clip-path="url(#xl05request-k13)"/>
  </g>
  <circle cx="1006" cy="669" r="18" fill="#FFFFFF"/>
  <g transform="translate(995.56,658.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="1032" y="676" font-size="18.5" font-weight="600" fill="#111827">Timestamps</text>
  <text x="1072" y="739" font-size="15.5" text-anchor="middle" fill="#6B7280">created_at, updated_at</text>

  
  <rect x="40" y="794" width="1160" height="222" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="824" font-size="16.5" font-weight="600" fill="#BE185D">Two ways this goes wrong</text>

  <g filter="url(#xl05request-lift)">
    <rect x="84" y="848" width="496" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="848" width="9" height="90" fill="#DB2777" clip-path="url(#xl05request-k14)"/>
  </g>
  <circle cx="122" cy="893" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,882.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="148" y="900" font-size="18.5" font-weight="600" fill="#111827">Returning only the id</text>
  <text x="332" y="963" font-size="15.5" text-anchor="middle" fill="#6B7280">the body is { "id": "ord_7M2K" } and nothing else</text>
  <text x="332" y="986" font-size="15.5" text-anchor="middle" fill="#94A3B8">which forces an immediate GET the server could have avoided</text>

  <g filter="url(#xl05request-lift)">
    <rect x="660" y="848" width="496" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="660" y="848" width="9" height="90" fill="#DB2777" clip-path="url(#xl05request-k15)"/>
  </g>
  <circle cx="698" cy="893" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,882.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="724" y="900" font-size="18.5" font-weight="600" fill="#111827">Forcing both shapes to match</text>
  <text x="908" y="963" font-size="15.5" text-anchor="middle" fill="#6B7280">makes the caller send values it does not own</text>
  <text x="908" y="986" font-size="15.5" text-anchor="middle" fill="#94A3B8">such as the id, the price, and the status</text>

  
  <rect x="40" y="1040" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1085" text-anchor="middle" font-size="16" fill="#475569">The request carries client choices. The response carries server-confirmed values.</text>
</svg>