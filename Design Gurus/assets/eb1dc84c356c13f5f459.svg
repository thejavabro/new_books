<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of one saga step publishing through an outbox. The payment service writes the charge row and the outbox row in one local transaction and gets a commit back, then an outbox publisher reads the unsent rows, publishes the payment succeeded event to the message broker, and the broker delivers it to the fulfillment service, sometimes twice, where an idempotency key drops the duplicate.">
  <defs>
    <marker id="m05-l04-saga-outbox-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l04-saga-outbox-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l04-saga-outbox-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m05-l04-saga-outbox-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1000" fill="#FFFFFF"/>

  <rect x="50" y="185" width="470" height="190" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="280" y="420" width="900" height="290" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="167" y1="145" x2="167" y2="760"/>
    <line x1="392" y1="145" x2="392" y2="760"/>
    <line x1="617" y1="145" x2="617" y2="760"/>
    <line x1="842" y1="145" x2="842" y2="760"/>
    <line x1="1067" y1="145" x2="1067" y2="760"/>
  </g>

  <text x="70" y="222" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">One transaction, no dual write</text>
  <text x="300" y="458" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The publisher forwards the committed message</text>
  <text x="1160" y="458" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the message cannot be lost</text>

  <g fill="none" stroke-width="2.5">
    <path d="M173,280 L386,280" stroke="#3B82F6" marker-end="url(#m05-l04-saga-outbox-bl)"/>
    <path d="M386,340 L175,340" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m05-l04-saga-outbox-em)"/>
    <path d="M611,510 L398,510" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l04-saga-outbox-ab)"/>
    <path d="M623,565 L836,565" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l04-saga-outbox-ab)"/>
    <path d="M848,620 L1061,620" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l04-saga-outbox-ab)"/>
    <path d="M848,660 L1061,660" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m05-l04-saga-outbox-ab)"/>
  </g>

  <rect x="161" y="272" width="12" height="76" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

  <text x="280" y="262" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge row + outbox row</text>
  <text x="280" y="322" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">committed</text>
  <text x="505" y="492" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read unsent rows</text>
  <text x="730" y="547" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish the event</text>
  <text x="955" y="602" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">deliver the event</text>
  <text x="955" y="692" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">sometimes twice</text>
  <text x="150" y="318" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">caller waits</text>

  <g filter="url(#m05-l04-saga-outbox-soft)">
    <rect x="760" y="740" width="420" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="970" y="781" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">An idempotency key</text>
  <text x="970" y="813" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">drops the duplicate</text>

  <g filter="url(#m05-l04-saga-outbox-soft)">
    <rect x="60" y="50" width="215" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="167.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment service</text>
  <text x="167.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">charges the card</text>
  <g filter="url(#m05-l04-saga-outbox-soft)">
    <rect x="285" y="50" width="215" height="95" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="392.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment DB</text>
  <text x="392.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">charge + outbox</text>
  <g filter="url(#m05-l04-saga-outbox-soft)">
    <rect x="510" y="50" width="215" height="95" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="617.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Outbox publisher</text>
  <text x="617.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">polls, then forwards</text>
  <g filter="url(#m05-l04-saga-outbox-soft)">
    <rect x="735" y="50" width="215" height="95" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="842.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Message broker</text>
  <text x="842.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">at least once</text>
  <g filter="url(#m05-l04-saga-outbox-soft)">
    <rect x="960" y="50" width="215" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1067.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="1067.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">the next step</text>

  <line x1="60" y1="880" x2="96" y2="880" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="887" font-size="20" fill="#475569">Synchronous write: the caller waits for the commit</text>
  <line x1="60" y1="920" x2="96" y2="920" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="927" font-size="20" fill="#475569">The commit is acknowledged</text>
  <line x1="60" y1="960" x2="96" y2="960" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="967" font-size="20" fill="#475569">Async relay and delivery, with the duplicate shown dashed</text>
</svg>