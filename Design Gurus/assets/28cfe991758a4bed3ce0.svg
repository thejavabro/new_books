<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. On the left every write passes through one leader, so write capacity is one machine. On the right the data is split into three parts, each with its own leader, so the parts accept writes at the same time.">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="lf5-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lf5-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lf5-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lf5-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lf5-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lf5-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="lf5-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lf5-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lf5-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The leader sets the write capacity</text>
  <rect x="30" y="66" width="580" height="340" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="320" y="106" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">One leader for all the data</text>
  <text x="320" y="146" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle">all writes</text>
  <line x1="180" y1="160" x2="286" y2="202" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#lf5-b)"/>
  <line x1="320" y1="160" x2="320" y2="202" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#lf5-b)"/>
  <line x1="460" y1="160" x2="354" y2="202" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#lf5-b)"/>
  <g filter="url(#lf5-soft)"><rect x="220" y="206" width="200" height="72" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="320" y="250" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">leader</text>
  <line x1="320" y1="282" x2="165" y2="306" stroke="#059669" stroke-width="2.2" marker-end="url(#lf5-e)"/>
  <g filter="url(#lf5-soft)"><rect x="90" y="310" width="150" height="52" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="165" y="342" font-size="18" fill="#0F172A" text-anchor="middle">follower</text>
  <line x1="320" y1="282" x2="330" y2="306" stroke="#059669" stroke-width="2.2" marker-end="url(#lf5-e)"/>
  <g filter="url(#lf5-soft)"><rect x="255" y="310" width="150" height="52" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="330" y="342" font-size="18" fill="#0F172A" text-anchor="middle">follower</text>
  <line x1="320" y1="282" x2="495" y2="306" stroke="#059669" stroke-width="2.2" marker-end="url(#lf5-e)"/>
  <g filter="url(#lf5-soft)"><rect x="420" y="310" width="150" height="52" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="495" y="342" font-size="18" fill="#0F172A" text-anchor="middle">follower</text>
  <text x="320" y="390" font-size="19" font-weight="600" fill="#B45309" text-anchor="middle">Write capacity is one machine.</text>
  <rect x="630" y="66" width="580" height="340" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="920" y="106" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">One leader for each part</text>
  <text x="920" y="146" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle">writes are split by key</text>
  <line x1="740" y1="160" x2="740" y2="202" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#lf5-b)"/>
  <g filter="url(#lf5-soft)"><rect x="655" y="206" width="170" height="72" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="740" y="238" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">leader</text>
  <text x="740" y="264" font-size="18" fill="#64748B" text-anchor="middle">part 1</text>
  <line x1="740" y1="282" x2="740" y2="306" stroke="#059669" stroke-width="2.2" marker-end="url(#lf5-e)"/>
  <g filter="url(#lf5-soft)"><rect x="655" y="310" width="170" height="52" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="740" y="342" font-size="18" fill="#0F172A" text-anchor="middle">follower</text>
  <line x1="920" y1="160" x2="920" y2="202" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#lf5-b)"/>
  <g filter="url(#lf5-soft)"><rect x="835" y="206" width="170" height="72" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="920" y="238" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">leader</text>
  <text x="920" y="264" font-size="18" fill="#64748B" text-anchor="middle">part 2</text>
  <line x1="920" y1="282" x2="920" y2="306" stroke="#059669" stroke-width="2.2" marker-end="url(#lf5-e)"/>
  <g filter="url(#lf5-soft)"><rect x="835" y="310" width="170" height="52" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="920" y="342" font-size="18" fill="#0F172A" text-anchor="middle">follower</text>
  <line x1="1100" y1="160" x2="1100" y2="202" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#lf5-b)"/>
  <g filter="url(#lf5-soft)"><rect x="1015" y="206" width="170" height="72" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="1100" y="238" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">leader</text>
  <text x="1100" y="264" font-size="18" fill="#64748B" text-anchor="middle">part 3</text>
  <line x1="1100" y1="282" x2="1100" y2="306" stroke="#059669" stroke-width="2.2" marker-end="url(#lf5-e)"/>
  <g filter="url(#lf5-soft)"><rect x="1015" y="310" width="170" height="52" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1100" y="342" font-size="18" fill="#0F172A" text-anchor="middle">follower</text>
  <text x="920" y="390" font-size="19" font-weight="600" fill="#065F46" text-anchor="middle">Write capacity grows with the parts.</text>
  <text x="620" y="450" font-size="19" fill="#64748B" text-anchor="middle">Adding followers adds read capacity and safety. It does not add write capacity.</text>
</svg>