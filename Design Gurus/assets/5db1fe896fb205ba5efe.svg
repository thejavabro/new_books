<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six-service e-commerce split with its data ownership: Catalog, Cart and Checkout, Inventory, Payments, Orders and Fulfillment, and Notifications, with only two synchronous edges on the purchase path and events everywhere else">
  <defs>
    <marker id="m02-l06-ecommerce-boundaries-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m02-l06-ecommerce-boundaries-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m02-l06-ecommerce-boundaries-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="670" fill="#FFFFFF"/>

  <g fill="none" stroke-width="2.5">
    <path d="M570,120 C570,160 260,150 260,186" stroke="#3B82F6" marker-end="url(#m02-l06-ecommerce-boundaries-blue)"/>
    <path d="M660,120 L672,176" stroke="#3B82F6" marker-end="url(#m02-l06-ecommerce-boundaries-blue)"/>
    <path d="M400,240 L516,240" stroke="#D97706" marker-end="url(#m02-l06-ecommerce-boundaries-amber)"/>
    <path d="M600,300 C600,360 165,360 165,416" stroke="#3B82F6" stroke-width="3" marker-end="url(#m02-l06-ecommerce-boundaries-blue)"/>
    <path d="M645,300 C645,360 470,360 470,416" stroke="#3B82F6" stroke-width="3" marker-end="url(#m02-l06-ecommerce-boundaries-blue)"/>
    <path d="M715,300 C715,360 775,360 775,416" stroke="#D97706" marker-end="url(#m02-l06-ecommerce-boundaries-amber)"/>
    <path d="M760,300 C760,360 1080,360 1080,416" stroke="#D97706" marker-end="url(#m02-l06-ecommerce-boundaries-amber)"/>
  </g>
  <g font-size="20" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="458" y="226" text-anchor="middle" fill="#92400E">price events</text>
    <text x="300" y="382" text-anchor="middle" fill="#1E40AF">reserve (sync)</text>
    <text x="540" y="396" text-anchor="middle" fill="#1E40AF">charge (sync)</text>
    <text x="835" y="372" text-anchor="middle" fill="#92400E">order placed (event)</text>
    <text x="1035" y="340" text-anchor="middle" fill="#92400E">order placed (event)</text>
  </g>

  <g filter="url(#m02-l06-ecommerce-boundaries-soft)">
    <rect x="500" y="50" width="240" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="620" y="92" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">API Gateway</text>

  <g filter="url(#m02-l06-ecommerce-boundaries-soft)">
    <rect x="120" y="186" width="280" height="100" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="260" y="226" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog</text>
  <text x="260" y="258" text-anchor="middle" font-size="20" fill="#64748B">display data, prices</text>

  <g filter="url(#m02-l06-ecommerce-boundaries-soft)">
    <rect x="520" y="176" width="320" height="124" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="680" y="216" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cart and Checkout</text>
  <text x="680" y="248" text-anchor="middle" font-size="20" fill="#64748B">carts, order placement,</text>
  <text x="680" y="278" text-anchor="middle" font-size="20" fill="#64748B">price copies</text>

  <g filter="url(#m02-l06-ecommerce-boundaries-soft)">
    <rect x="25" y="416" width="280" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="165" y="458" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="165" y="490" text-anchor="middle" font-size="20" fill="#64748B">stock per warehouse</text>

  <g filter="url(#m02-l06-ecommerce-boundaries-soft)">
    <rect x="330" y="416" width="280" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="470" y="458" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="470" y="490" text-anchor="middle" font-size="20" fill="#64748B">charges, refunds (PCI)</text>

  <g filter="url(#m02-l06-ecommerce-boundaries-soft)">
    <rect x="635" y="416" width="280" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="775" y="458" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders and Fulfillment</text>
  <text x="775" y="490" text-anchor="middle" font-size="20" fill="#64748B">lifecycle, shipping</text>

  <g filter="url(#m02-l06-ecommerce-boundaries-soft)">
    <rect x="940" y="416" width="280" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1080" y="458" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="1080" y="490" text-anchor="middle" font-size="20" fill="#64748B">templates, delivery</text>

  <g stroke-width="4">
    <line x1="40" y1="590" x2="74" y2="590" stroke="#3B82F6"/>
    <line x1="40" y1="630" x2="74" y2="630" stroke="#D97706"/>
  </g>
  <text x="84" y="597" font-size="20" fill="#475569">Synchronous call (blocking, on the purchase path)</text>
  <text x="84" y="637" font-size="20" fill="#475569">Event (async, nothing waits on it)</text>
</svg>