<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="portfolio-title portfolio-desc">
<title id="portfolio-title">Three prices for the same capacity</title>
<desc id="portfolio-desc">Committed capacity for the baseline, on-demand for the variable top, and interruptible for work that can be retried. The sizing rule is to commit to the trough rather than the average.</desc>
<defs>
<marker id="portfolio-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="portfolio-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="portfolio-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="portfolio-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="772" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three prices for the same capacity</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Providers sell the same capacity at several prices, in exchange for different promises.</text>
<rect x="40" y="694" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="694" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="352" y="140" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">discount against on-demand</text>
<rect x="40" y="158" width="280" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="180" y="196" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Interruptible</text>
<text x="352" y="184" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">up to about 90% off</text>
<rect x="352" y="196" width="240" height="20" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="352" y="196" width="216.0" height="20" rx="10" fill="#06AC80"/>
<rect x="640" y="158" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="660" y="196" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">work that can be retried or delayed</text>
<rect x="40" y="234" width="280" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="180" y="272" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">On-demand</text>
<text x="352" y="260" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">full price, instant</text>
<rect x="352" y="272" width="240" height="20" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="640" y="234" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="660" y="272" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the variable top of the daily curve</text>
<rect x="40" y="310" width="280" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="180" y="348" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Committed</text>
<text x="352" y="336" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">about 66% to 72% off</text>
<rect x="352" y="348" width="240" height="20" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="352" y="348" width="168.0" height="20" rx="10" fill="#159BEF"/>
<rect x="640" y="310" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="660" y="348" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the baseline that is always running</text>
<rect x="40" y="390" width="1160" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="390" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="64" y="420" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Commit to the trough, not the average</text><text x="64" y="446" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A commitment is paid whether or not it is used. Increasing one later costs</text><text x="64" y="472" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">almost nothing; over-committing is money that cannot be recovered.</text>
<rect x="40" y="508" width="560" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="535.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Suits interruption: batch, CI,</text><text x="320" y="562.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">stateless rendering, queue consumers</text>
<rect x="640" y="508" width="560" height="70" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="535.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Does not: a database,</text><text x="920" y="562.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">or anything holding state in memory</text>
<rect x="40" y="596" width="1160" height="70" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="596" width="5" height="70" rx="2.5" fill="#F3CF6A"/><text x="64" y="624" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The warning is commonly two minutes, and best effort rather than guaranteed</text><text x="64" y="650" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A service that cannot survive it probably cannot survive an unplanned failure either.</text>
<text x="66" y="728" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Autoscaling changes how much you run. Commitment pricing changes what each hour costs.</text>
</svg>