<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="BasicPrinter must implement all four methods of the Printer interface, but only printDocument does real work while the other three throw an error">
  <defs>
    <filter id="ibf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ibf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="ibf-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ibf-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <clipPath id="ibf-top"><rect x="505" y="90" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ibf-m1"><rect x="70" y="250" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ibf-m2"><rect x="360" y="250" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ibf-m3"><rect x="650" y="250" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ibf-m4"><rect x="940" y="250" width="230" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>

  <rect x="40" y="40" width="1160" height="390" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#B45309">BasicPrinter must implement all four methods of the Printer interface</text>

  <g fill="none" stroke-width="2">
    <path d="M535,180 V193 Q535,205 523,205 H197 Q185,205 185,217 V244" stroke="#059669" marker-end="url(#ibf-em)"/>
    <path d="M590,180 V206 Q590,218 578,218 H487 Q475,218 475,230 V244" stroke="#DB2777" marker-end="url(#ibf-pk)"/>
    <path d="M650,180 V206 Q650,218 662,218 H753 Q765,218 765,230 V244" stroke="#DB2777" marker-end="url(#ibf-pk)"/>
    <path d="M705,180 V193 Q705,205 717,205 H1043 Q1055,205 1055,217 V244" stroke="#DB2777" marker-end="url(#ibf-pk)"/>
  </g>

  <g filter="url(#ibf-lift)">
    <rect x="505" y="90" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="505" y="90" width="9" height="90" fill="#D97706" clip-path="url(#ibf-top)"/>
  </g>
  <circle cx="545" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(534.56,124.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="571" y="142" font-size="18.5" font-weight="600" fill="#111827">BasicPrinter</text>

  <g filter="url(#ibf-soft)">
    <rect x="70" y="250" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="70" y="250" width="6" height="90" fill="#059669" clip-path="url(#ibf-m1)"/>
  </g>
  <circle cx="108" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,284.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="134" y="302" font-size="18.5" font-weight="600" fill="#111827">printDocument</text>
  <text x="185" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">the device really prints</text>
  <text x="185" y="388" font-size="15.5" text-anchor="middle" fill="#047857">this promise it can keep</text>

  <g filter="url(#ibf-soft)">
    <rect x="360" y="250" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="360" y="250" width="6" height="90" fill="#DB2777" clip-path="url(#ibf-m2)"/>
  </g>
  <circle cx="398" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,284.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="424" y="302" font-size="18.5" font-weight="600" fill="#111827">scanDocument</text>
  <text x="475" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">there is no scanner</text>
  <text x="475" y="388" font-size="15.5" text-anchor="middle" fill="#BE185D">so the method throws</text>

  <g filter="url(#ibf-soft)">
    <rect x="650" y="250" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="650" y="250" width="6" height="90" fill="#DB2777" clip-path="url(#ibf-m3)"/>
  </g>
  <circle cx="688" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,284.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="714" y="302" font-size="18.5" font-weight="600" fill="#111827">faxDocument</text>
  <text x="765" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">there is no fax line</text>
  <text x="765" y="388" font-size="15.5" text-anchor="middle" fill="#BE185D">so the method throws</text>

  <g filter="url(#ibf-soft)">
    <rect x="940" y="250" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="940" y="250" width="6" height="90" fill="#DB2777" clip-path="url(#ibf-m4)"/>
  </g>
  <circle cx="978" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,284.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="1004" y="302" font-size="18.5" font-weight="600" fill="#111827">stapleDocument</text>
  <text x="1055" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">there is no stapler</text>
  <text x="1055" y="388" font-size="15.5" text-anchor="middle" fill="#BE185D">so the method throws</text>

  
  <rect x="40" y="460" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="484" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="506" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">One real method</text>
  <text x="288" y="506" font-size="15.5" fill="#475569">the basic printer prints, and printing is the only thing it can honestly do</text>
  <rect x="64" y="528" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="550" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Three refusals</text>
  <text x="288" y="550" font-size="15.5" fill="#475569">the other three exist only to throw, which is the price of an interface that is too wide</text>
</svg>