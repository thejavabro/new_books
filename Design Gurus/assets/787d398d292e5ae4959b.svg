<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="envelopes-title envelopes-desc">
<title id="envelopes-title">The second envelope</title>
<desc id="envelopes-desc">Every design discussion computes requests per second, storage and latency. Very few compute cost per request, cost per user and cost per gigabyte, which are the units that make the number comparable against revenue.</desc>
<defs>
<marker id="envelopes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="envelopes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="envelopes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="envelopes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="660" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The second envelope</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Very few compute the other one, which is what the design costs to run.</text>
<rect x="40" y="582" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="582" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="560" height="268" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V380A6 6 0 0 0 46 386H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">The envelope everyone computes</text>
<rect x="72" y="174" width="500" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">requests per second</text>
<rect x="72" y="242" width="500" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">storage</text>
<rect x="72" y="310" width="500" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">latency</text>
<rect x="640" y="118" width="560" height="268" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V380A6 6 0 0 0 646 386H654Z" fill="#F3CF6A"/><text x="670" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">The envelope almost nobody does</text>
<rect x="672" y="174" width="500" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cost per request</text>
<rect x="672" y="242" width="500" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cost per user per month</text>
<rect x="672" y="310" width="500" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cost per gigabyte per month</text>
<rect x="40" y="406" width="560" height="150" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="406" width="5" height="150" rx="2.5" fill="#F28B9D"/><text x="64" y="435" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">A design that meets every performance target</text><text x="64" y="461" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">and costs more than the product earns</text><text x="64" y="487" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">is not a working design.</text><text x="64" y="513" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Nobody describes it that way, because the cost</text><text x="64" y="539" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">arrives months later as a finance conversation.</text>
<rect x="640" y="406" width="560" height="150" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="406" width="5" height="150" rx="2.5" fill="#39D5AA"/><text x="664" y="460" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">A monthly bill tells you what you spent.</text><text x="664" y="487" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">A per-unit figure tells you whether</text><text x="664" y="514" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">the design survives ten times the users.</text>
<text x="66" y="616" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Cost is a design constraint of exactly the same kind as latency.</text>
</svg>