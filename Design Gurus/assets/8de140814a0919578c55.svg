    <rect x="470" y="140" width="9" height="90" fill="#64748B" clip-path="url(#tw3-k1)"/>
  </g>
  <circle cx="508" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="534" y="192" font-size="21.5" font-weight="600" fill="#111827">index.html</text>
  <g filter="url(#tw3-soft)">
    <rect x="40" y="330" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#tw3-k2)"/>
  </g>
  <circle cx="78" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="104" y="382" font-size="21.5" font-weight="600" fill="#111827">styles.css</text>
  <text x="165" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">stylesheet</text>
  <g filter="url(#tw3-soft)">
    <rect x="343" y="330" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="343" y="330" width="6" height="90" fill="#7C3AED" clip-path="url(#tw3-k3)"/>
  </g>
  <circle cx="381" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,364.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="407" y="382" font-size="21.5" font-weight="600" fill="#111827">app.js</text>
  <text x="468" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">script</text>
  <g filter="url(#tw3-soft)">
    <rect x="646" y="330" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="646" y="330" width="6" height="90" fill="#D97706" clip-path="url(#tw3-k4)"/>
  </g>
  <circle cx="684" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,364.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="710" y="382" font-size="21.5" font-weight="600" fill="#111827">photo.jpg</text>
  <text x="771" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">image</text>
  <g filter="url(#tw3-soft)">
    <rect x="949" y="330" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="330" width="6" height="90" fill="#059669" clip-path="url(#tw3-k5)"/>
  </g>
  <circle cx="987" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,364.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="1013" y="382" font-size="21.5" font-weight="600" fill="#111827">font.woff2</text>
  <text x="1074" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">font</text>

  <rect x="40" y="500" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="525" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="550" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">One connection</text>
  <text x="323" y="550" font-size="18.5" fill="#475569">with HTTP/2, all four requests share the open connection at the same time</text>
  <rect x="64" y="575" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="600" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Browser cache</text>
  <text x="323" y="600" font-size="18.5" fill="#475569">on a repeat visit, files that have not changed are not downloaded again</text>
</svg>