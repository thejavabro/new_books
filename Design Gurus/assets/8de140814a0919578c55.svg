<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The browser receives index.html and finds a stylesheet, a script, an image, and a font. It requests all four over the connection that is already open.">
  <defs>
    <filter id="tw3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="tw3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="tw3-k1"><rect x="470" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="tw3-k2"><rect x="40" y="330" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tw3-k3"><rect x="343" y="330" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tw3-k4"><rect x="646" y="330" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tw3-k5"><rect x="949" y="330" width="250" height="90" rx="12"/></clipPath>
    <marker id="tw3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The HTML asks for more files</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Reading the page reveals the other files it needs. Each one is another request.</text>



  <g fill="none" stroke-width="2">
    <path d="M620,230 V260 Q620,275 605,275 H180 Q165,275 165,290 V330" stroke="#64748B" marker-end="url(#tw3-m-slate)"/>
    <path d="M620,230 V260 Q620,275 605,275 H483 Q468,275 468,290 V330" stroke="#64748B" marker-end="url(#tw3-m-slate)"/>
    <path d="M620,230 V260 Q620,275 635,275 H756 Q771,275 771,290 V330" stroke="#64748B" marker-end="url(#tw3-m-slate)"/>
    <path d="M620,230 V260 Q620,275 635,275 H1059 Q1074,275 1074,290 V330" stroke="#64748B" marker-end="url(#tw3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#tw3-lift)">
