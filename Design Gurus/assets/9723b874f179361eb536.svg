<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Graceful degradation: the fallback sequence from a fresh answer down to hiding the feature, and how far each criticality tier is allowed to descend">
  <rect x="0" y="0" width="1300" height="660" fill="#FFFFFF"/>
  <defs>
    <marker id="d" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="60" y="42" font-size="22" font-weight="700" fill="#0F172A">The fallback sequence</text>

  
  <rect x="60" y="60" width="560" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="80" y="90" font-size="20" font-weight="700" fill="#065F46">1. Fresh, personalized answer</text>
  <text x="80" y="117" font-size="20" fill="#334155">full quality</text>
  <line x1="200" y1="130" x2="200" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="222" y="147" font-size="19" fill="#475569">the dependency fails</text>

  
  <rect x="60" y="158" width="560" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="80" y="188" font-size="20" font-weight="700" fill="#1E3A8A">2. Cached copy</text>
  <text x="80" y="215" font-size="20" fill="#334155">seconds to minutes old</text>
  <line x1="200" y1="228" x2="200" y2="248" stroke="#475569" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="222" y="245" font-size="19" fill="#475569">cache miss, or too stale to serve</text>

  
  <rect x="60" y="256" width="560" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="80" y="286" font-size="20" font-weight="700" fill="#92400E">3. Static default</text>
  <text x="80" y="313" font-size="20" fill="#334155">"popular this week", the list price</text>
  <line x1="200" y1="326" x2="200" y2="346" stroke="#475569" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="222" y="343" font-size="19" fill="#475569">no sensible default exists</text>

  
  <rect x="60" y="354" width="560" height="70" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
  <text x="80" y="384" font-size="20" font-weight="700" fill="#334155">4. Hide the feature</text>
  <text x="80" y="411" font-size="20" fill="#334155">the page renders without it</text>
  <line x1="200" y1="424" x2="200" y2="444" stroke="#475569" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="222" y="441" font-size="19" fill="#475569">only if the feature is critical</text>

  
  <rect x="60" y="452" width="560" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="80" y="482" font-size="20" font-weight="700" fill="#991B1B">5. Refuse, clearly and loudly</text>
  <text x="80" y="509" font-size="20" fill="#334155">nothing was charged, nothing was faked</text>

  
  <text x="700" y="42" font-size="22" font-weight="700" fill="#0F172A">How far each tier may descend</text>

  <rect x="700" y="60" width="540" height="130" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="722" y="95" font-size="20" font-weight="700" fill="#065F46">Optional</text>
  <text x="722" y="126" font-size="20" fill="#334155">recommendations, recently viewed</text>
  <text x="722" y="157" font-size="20" font-weight="700" fill="#334155">may go all the way to step 4: hidden</text>

  <rect x="700" y="212" width="540" height="130" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="722" y="247" font-size="20" font-weight="700" fill="#92400E">Important</text>
  <text x="722" y="278" font-size="20" fill="#334155">pricing detail, search filters</text>
  <text x="722" y="309" font-size="20" font-weight="700" fill="#334155">stops at step 3: a static default</text>

  <rect x="700" y="364" width="540" height="158" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="722" y="399" font-size="20" font-weight="700" fill="#991B1B">Critical</text>
  <text x="722" y="430" font-size="20" fill="#334155">checkout, login, payment capture</text>
  <text x="722" y="461" font-size="20" font-weight="700" fill="#334155">never serves a lesser answer.</text>
  <text x="722" y="492" font-size="20" font-weight="700" fill="#334155">It goes straight to step 5 and refuses.</text>

  
  <text x="60" y="582" font-size="20" font-weight="700" fill="#0F172A">How far a feature may fall is decided with product before the incident, not by an exception handler</text>
  <text x="60" y="612" font-size="20" font-weight="700" fill="#0F172A">during one. Degraded mode still pages the on-call engineer, even when users notice nothing.</text>
</svg>