<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="748" viewBox="0 0 1240 748" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In ordinary TLS only the server presents a certificate and the client stays anonymous, while in mutual TLS both sides present certificates and each verifies the other">
  <rect x="0" y="0" width="1240" height="748" fill="#FFFFFF"/>
  <defs>
    <marker id="se3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="se3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Who proves who they are, and who stays anonymous</text>

  
  <rect x="40" y="76" width="1160" height="272" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#1E40AF">TLS: the server proves itself, the client does not</text>

  <g filter="url(#se3-soft)">
    <rect x="90" y="170" width="220" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="890" y="170" width="220" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="1000" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>

  <text x="600" y="164" font-size="20" fill="#1E40AF" text-anchor="middle">hello</text>
  <line x1="314" y1="186" x2="886" y2="186" stroke="#3B82F6" stroke-width="2" marker-end="url(#se3-blue)"/>
  <line x1="886" y1="226" x2="314" y2="226" stroke="#3B82F6" stroke-width="2" marker-end="url(#se3-blue)"/>
  <text x="600" y="264" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">here is my certificate</text>

  <text x="200" y="300" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">presents nothing</text>
  <text x="1000" y="300" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">identity proven</text>
  <text x="620" y="328" font-size="20" fill="#334155" text-anchor="middle">The channel is encrypted, but the server has no idea who is on the other end.</text>

  
  <rect x="40" y="368" width="1160" height="292" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="402" font-size="20" font-weight="600" fill="#065F46">mTLS: both sides present a certificate, and both verify</text>

  <g filter="url(#se3-soft)">
    <rect x="90" y="470" width="220" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="890" y="470" width="220" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="200" y="512" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Service A</text>
  <text x="1000" y="512" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Service B</text>

  <text x="600" y="464" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">here is my certificate</text>
  <line x1="314" y1="486" x2="886" y2="486" stroke="#059669" stroke-width="2" marker-end="url(#se3-emerald)"/>
  <line x1="886" y1="526" x2="314" y2="526" stroke="#059669" stroke-width="2" marker-end="url(#se3-emerald)"/>
  <text x="600" y="564" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">and here is mine</text>

  <text x="200" y="600" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">identity proven</text>
  <text x="1000" y="600" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">identity proven</text>
  <text x="620" y="632" font-size="20" fill="#334155" text-anchor="middle">Neither side will talk to anything that cannot produce a certificate the CA signed.</text>

  
  <rect x="40" y="688" width="1160" height="48" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="718" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">TLS answers "am I talking to the right server". mTLS also answers "should this caller be here at all".</text>
</svg>