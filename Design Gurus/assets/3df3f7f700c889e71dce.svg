<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="756" viewBox="0 0 1240 756" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Version one publishes three string enum values. Version two adds a fourth. A client with an unknown-value fallback shows a neutral value and continues. A client with an exhaustive switch crashes, which turns an additive server change into an outage.">
