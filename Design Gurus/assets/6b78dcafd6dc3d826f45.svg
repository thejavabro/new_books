<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" style="background-color:#ffffff">
<defs>
<marker id="na" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="nd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="330" y="40" width="290" height="56" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="330" y="40" width="290" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="475" y="59" text-anchor="middle" font-weight="bold">&#171;interface&#187; UserRepository</text>
<text x="342" y="87">+ findName(id) : String</text>

<rect x="40" y="200" width="250" height="56" fill="#ffffff" stroke="#2f7a55"/>
<rect x="40" y="200" width="250" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="165" y="219" text-anchor="middle" font-weight="bold">DatabaseUserRepository</text>
<text x="52" y="247" font-size="11.5" fill="#2f7a55">does the real work</text>

<rect x="360" y="200" width="250" height="80" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="360" y="200" width="250" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="485" y="219" text-anchor="middle" font-weight="bold">LoggingRepository</text>
<text x="372" y="247">- inner : UserRepository</text>
<text x="372" y="269">+ findName(id) : String</text>

<rect x="650" y="200" width="250" height="80" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="650" y="200" width="250" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="775" y="219" text-anchor="middle" font-weight="bold">CachingRepository</text>
<text x="662" y="247">- inner : UserRepository</text>
<text x="662" y="269">+ findName(id) : String</text>

<path d="M 165 200 L 165 150 L 475 150 L 475 96" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#na)"/>
<path d="M 485 200 L 485 150" stroke="#000000" fill="none" stroke-dasharray="5 4"/>
<path d="M 775 200 L 775 150 L 475 150" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<path d="M 620 68 L 700 68 L 700 196" stroke="#000000" fill="none" marker-end="url(#nd)"/>
<text x="706" y="120" font-size="11.5" fill="#414d60">a decorator holds</text>
<text x="706" y="136" font-size="11.5" fill="#414d60">one of these</text>

<rect x="40" y="316" width="860" height="94" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="62" y="342" font-size="12.5" fill="#414d60">Every class in the row implements the same interface, and the two decorators also hold one. That is the whole structure.</text>
<text x="62" y="366" font-size="12.5" fill="#414d60">Because a decorator holds the interface and not a concrete class, it can wrap the database, or another decorator, or a test double.</text>
<text x="62" y="390" font-size="12.5" fill="#414d60">A decorator that handles one method and forgets to delegate the rest changes behaviour silently. Forward everything you do not touch.</text>
</g>
</svg>