<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The interview decision: ask whether wrong data or no answer is worse, and let the answer pick consistency or availability">
  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>
  <defs>
    <marker id="cp11-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cp11-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="cp11-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <path d="M620,150 C620,192 330,182 330,224" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cp11-blue)"/>
  <path d="M620,150 C620,192 910,182 910,224" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#cp11-emerald)"/>
  <line x1="330" y1="316" x2="330" y2="356" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cp11-blue)"/>
  <line x1="910" y1="316" x2="910" y2="356" stroke="#059669" stroke-width="2.5" marker-end="url(#cp11-emerald)"/>

  <rect x="348" y="168" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="418" y="192" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">wrong data</text>
  <rect x="756" y="168" width="132" height="34" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
  <text x="822" y="192" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">no answer</text>

  <g filter="url(#cp11-soft)">
    <rect x="360" y="60" width="520" height="90" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <rect x="90" y="224" width="480" height="92" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="670" y="224" width="480" height="92" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="90" y="356" width="480" height="110" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="670" y="356" width="480" height="110" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="620" y="98" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Which is worse for this system:</text>
  <text x="620" y="126" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">showing wrong data, or showing nothing?</text>

  <text x="330" y="262" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Favour consistency, lean CP</text>
  <text x="330" y="294" font-size="20" fill="#3B82F6" text-anchor="middle">better to make the user wait</text>

  <text x="910" y="262" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Favour availability, lean AP</text>
  <text x="910" y="294" font-size="20" fill="#059669" text-anchor="middle">better to answer with what you have</text>

  <text x="330" y="392" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">balances, orders, inventory,</text>
  <text x="330" y="420" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">cluster configuration</text>
  <text x="330" y="450" font-size="20" fill="#64748B" text-anchor="middle">cost: brief unavailability, so queue and retry</text>

  <text x="910" y="392" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">feeds, catalogs, carts,</text>
  <text x="910" y="420" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">caches, dashboards</text>
  <text x="910" y="450" font-size="20" fill="#64748B" text-anchor="middle">cost: stale reads, so define how to merge</text>

  <text x="620" y="512" font-size="20" fill="#475569" text-anchor="middle">One product can sit on both sides: browse the catalog the AP way, take the payment the CP way.</text>
</svg>