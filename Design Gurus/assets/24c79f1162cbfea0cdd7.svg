<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The reviews service becomes slow and takes 30 seconds per call. All 200 web server threads fill up waiting for it. Checkout finds no free thread and fails. The whole store is down for users.">
  <defs>
    <filter id="re1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="re1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="re1-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="re1-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="re1-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="re1-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="re1-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How one slow service stops a whole store</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Follow the failure from left to right. Only the first part was actually broken.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#DB2777" marker-end="url(#re1-m-pink)"/>
    <path d="M593,185 H646" stroke="#DB2777" marker-end="url(#re1-m-pink)"/>
    <path d="M896,185 H949" stroke="#DB2777" marker-end="url(#re1-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#re1-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#D97706" clip-path="url(#re1-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Reviews slow</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">30 seconds per call</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">the only real problem</text>
  <g filter="url(#re1-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#re1-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Threads full</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">all 200 threads</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">waiting for reviews</text>
  <g filter="url(#re1-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#re1-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Checkout fails</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">no free thread left</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">though it never calls reviews</text>
  <g filter="url(#re1-lift)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="949" y="140" width="9" height="90" fill="#DB2777" clip-path="url(#re1-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Store is down</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">every page fails</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">for every user</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Cascading failure</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">a failure in one part spreads to parts that did not fail</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Cause</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">nothing limited how long, or how many threads, could wait</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">The fixes</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">timeouts, circuit breakers, fallbacks, and bulkheads stop the spread</text>
</svg>