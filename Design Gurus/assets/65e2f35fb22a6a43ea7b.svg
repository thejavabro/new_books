<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="742" viewBox="0 0 1240 742" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A new encoder passes the judged-set regression suite, then an interleaved slice, before the full re-embed and the atomic promotion of the encoder and index together">
