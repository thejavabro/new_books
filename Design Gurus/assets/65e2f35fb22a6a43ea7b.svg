    </marker>
    <filter id="c8vsu-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c8vsu-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c8vsu-k1"><rect x="90" y="136" width="324" height="90" rx="12"/></clipPath>
    <clipPath id="c8vsu-k2"><rect x="560" y="136" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c8vsu-k3"><rect x="170" y="430" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="c8vsu-k4"><rect x="500" y="430" width="302" height="90" rx="12"/></clipPath>
    <clipPath id="c8vsu-k5"><rect x="892" y="430" width="282" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="742" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#475569">Cheap: before paying for the re-embed</text>
  <rect x="40" y="350" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="380" font-size="16.5" font-weight="600" fill="#475569">Expensive: only after both checks pass</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M414,181 H560" marker-end="url(#c8vsu-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M580,226 V306 Q580,318 568,318 H397 Q385,318 385,330 V430" marker-end="url(#c8vsu-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M410,475 H500" marker-end="url(#c8vsu-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M802,475 H892" marker-end="url(#c8vsu-m64748b)"/></g>
  <g filter="url(#c8vsu-soft)">
    <rect x="90" y="136" width="324" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="90" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c8vsu-k1)"/>
  </g>
  <circle cx="128" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="90" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 1</text>
  <text x="154" y="188" font-size="18.5" font-weight="600" fill="#111827">Judged-set regression suite</text>
  <text x="252" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">NDCG, overall and per category</text>
  <g filter="url(#c8vsu-soft)">
    <rect x="560" y="136" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="560" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#c8vsu-k2)"/>
  </g>
  <circle cx="598" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(587.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="560" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 2</text>
  <text x="624" y="188" font-size="18.5" font-weight="600" fill="#111827">Interleaved slice</text>
  <text x="700" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">one category in one region</text>
  <g filter="url(#c8vsu-soft)">
    <rect x="170" y="430" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="170" y="430" width="6" height="90" fill="#D97706" clip-path="url(#c8vsu-k3)"/>
  </g>
  <circle cx="208" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="170" y="418" font-size="15.5" font-weight="600" fill="#6B7280">Step 3</text>
  <text x="234" y="482" font-size="18.5" font-weight="600" fill="#111827">Full re-embed</text>
  <text x="290" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">100 million listings into a second index</text>
  <g filter="url(#c8vsu-soft)">
    <rect x="500" y="430" width="302" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="500" y="430" width="6" height="90" fill="#059669" clip-path="url(#c8vsu-k4)"/>
  </g>
  <circle cx="538" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="500" y="418" font-size="15.5" font-weight="600" fill="#6B7280">Step 4</text>
  <text x="564" y="482" font-size="18.5" font-weight="600" fill="#111827">Promote both atomically</text>
  <text x="651" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">encoder and index in one step</text>
  <g filter="url(#c8vsu-soft)">
    <rect x="892" y="430" width="282" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="892" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#c8vsu-k5)"/>
  </g>
  <circle cx="930" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(919.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="892" y="418" font-size="15.5" font-weight="600" fill="#6B7280">Step 5</text>
  <text x="956" y="482" font-size="18.5" font-weight="600" fill="#111827">Ramp with an A/B test</text>
  <text x="1033" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">contact-seller rate decides</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="487" y="167" fill="#475569">passes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="482" y="309" fill="#475569">buyers prefer it</text></g>
  <rect x="40" y="626" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="671" text-anchor="middle" font-size="16" fill="#475569">Steps 1 and 2 are cheap, and Step 3 is the expensive one. So it comes only after two cheaper checks have passed.</text>
</svg>