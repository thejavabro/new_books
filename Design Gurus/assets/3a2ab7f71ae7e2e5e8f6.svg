<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="956" viewBox="0 0 1240 956" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="underneath-title underneath-desc">
<title id="underneath-title">The defect underneath, and the repairs</title>
<desc id="underneath-desc">No producer sets a partition key, so the sequence the pipeline assumes was never guaranteed. Five repairs follow, and together they produce at-least-once delivery with idempotent consumers rather than exactly-once.</desc>
<defs>
<marker id="underneath-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="underneath-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="underneath-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="underneath-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="956" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The defect underneath, and the repairs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">No producer sets a partition key, so the sequence the pipeline assumes was never guaranteed.</text>
<rect x="40" y="878" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="878" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="188" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V300A6 6 0 0 0 46 306H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Every producer.send is called without a key</text>
<rect x="80" y="174" width="480" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">OrderCreated for order 4471</text>
<rect x="680" y="174" width="480" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">PaymentReceived for order 4471</text>
<text x="320" y="252" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">partition 2</text>
<text x="920" y="252" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">partition 7</text>
<text x="620" y="290" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">different consumers, no ordering between them</text>
<rect x="40" y="330" width="1160" height="80" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="330" width="5" height="80" rx="2.5" fill="#F3CF6A"/><text x="64" y="363" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Why it was never caught</text><text x="64" y="389" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It is correct at one consumer and wrong at two, so scaling introduces the bug.</text>
<text x="40" y="448" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The repair list, each item with its reason</text>
<rect x="40" y="466" width="480" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="497" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Outbox in both producers</text>
<path d="M526 491H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 491H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#underneath-marker-slate)"/>
<rect x="570" y="466" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="497" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the state change and the event become atomic</text>
<rect x="40" y="524" width="480" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="555" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Manual commits after processing</text>
<path d="M526 549H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 549H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#underneath-marker-slate)"/>
<rect x="570" y="524" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="555" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">at-least-once as a decision, not a side effect</text>
<rect x="40" y="582" width="480" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="613" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Idempotency key and unique constraint</text>
<path d="M526 607H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 607H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#underneath-marker-slate)"/>
<rect x="570" y="582" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="613" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a redelivery changes nothing</text>
<rect x="40" y="640" width="480" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="671" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Guarded state transition</text>
<path d="M526 665H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 665H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#underneath-marker-slate)"/>
<rect x="570" y="640" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="671" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an out-of-order message is rejected, not applied</text>
<rect x="40" y="698" width="480" height="50" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="729" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A partition key on every send</text>
<path d="M526 723H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 723H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#underneath-marker-slate)"/>
<rect x="570" y="698" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="729" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">events for one order stay ordered</text>
<rect x="40" y="772" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="772" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="805" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">None of this makes the system exactly-once.</text><text x="64" y="831" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The duplicates still arrive. They simply stop changing anything.</text>
<text x="66" y="912" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Present the defects by blast radius, not in the order they appear in the code.</text>
</svg>