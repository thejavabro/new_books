<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A full-text index splits text into words and stores, for each word, the list of documents that contain it">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="ix6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="ix6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <text x="260" y="56" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Documents</text>
  <text x="940" y="56" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Inverted index: word to documents</text>

  
  <rect x="40" y="76" width="440" height="380" rx="14" fill="#F8FAFC" fill-opacity="0.6" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="620" y="76" width="580" height="380" rx="14" fill="#F5F3FF" fill-opacity="0.4" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="490" y1="266" x2="610" y2="266" stroke="#475569" stroke-width="2.5" marker-end="url(#ix6-slate)"/>
  <text x="550" y="230" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">split into</text>
  <text x="550" y="322" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">words</text>

  
  <g filter="url(#ix6-soft)">
    <rect x="70" y="110" width="380" height="90" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="70" y="220" width="380" height="90" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="70" y="330" width="380" height="90" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="94" y="148" font-size="20" font-weight="600" fill="#0F172A">Doc 1</text>
  <text x="94" y="180" font-size="20" fill="#334155">"index the database"</text>
  <text x="94" y="258" font-size="20" font-weight="600" fill="#0F172A">Doc 2</text>
  <text x="94" y="290" font-size="20" fill="#334155">"cache the database"</text>
  <text x="94" y="368" font-size="20" font-weight="600" fill="#0F172A">Doc 3</text>
  <text x="94" y="400" font-size="20" fill="#334155">"index the cache"</text>

  
  <g filter="url(#ix6-soft)">
    <rect x="650" y="110" width="520" height="60" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="650" y="186" width="520" height="60" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="650" y="262" width="520" height="60" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="650" y="338" width="520" height="60" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="676" y="147" font-size="20" font-weight="600" fill="#0F172A">cache</text>
  <text x="1144" y="147" font-size="20" fill="#5B21B6" text-anchor="end">Doc 2, Doc 3</text>
  <text x="676" y="223" font-size="20" font-weight="600" fill="#0F172A">database</text>
  <text x="1144" y="223" font-size="20" fill="#5B21B6" text-anchor="end">Doc 1, Doc 2</text>
  <text x="676" y="299" font-size="20" font-weight="600" fill="#0F172A">index</text>
  <text x="1144" y="299" font-size="20" fill="#5B21B6" text-anchor="end">Doc 1, Doc 3</text>
  <text x="676" y="375" font-size="20" font-weight="600" fill="#0F172A">the</text>
  <text x="1144" y="375" font-size="20" fill="#64748B" text-anchor="end">skipped, a common word</text>

  
  <rect x="240" y="490" width="760" height="80" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="524" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Search for "database"</text>
  <text x="620" y="554" font-size="20" fill="#334155" text-anchor="middle">read one entry, return Doc 1 and Doc 2, with no document scanned</text>
</svg>