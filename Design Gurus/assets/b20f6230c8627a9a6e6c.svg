<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A remote that works with only one television is high coupling, while a universal remote that works with any device is low coupling">
  <defs>
    <filter id="cda-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cda-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="cda-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="cda-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <clipPath id="cda-r1"><rect x="180" y="120" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cda-t1"><rect x="180" y="280" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cda-u"><rect x="790" y="120" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="cda-d1"><rect x="700" y="280" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cda-d2"><rect x="940" y="280" width="200" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="400" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">High coupling: the pair only works together</text>

  <g fill="none" stroke-width="2.5">
    <path d="M280,210 V274" stroke="#DB2777" marker-end="url(#cda-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="400" y="248" fill="#BE185D">controls this one only</text>
  </g>

  <g filter="url(#cda-soft)">
    <rect x="180" y="120" width="200" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="180" y="120" width="6" height="90" fill="#DB2777" clip-path="url(#cda-r1)"/>
  </g>
  <circle cx="218" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,154.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="244" y="172" font-size="18.5" font-weight="600" fill="#111827">Remote</text>

  <g filter="url(#cda-lift)">
    <rect x="180" y="280" width="200" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="180" y="280" width="9" height="90" fill="#DB2777" clip-path="url(#cda-t1)"/>
  </g>
  <circle cx="220" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(209.56,314.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="246" y="332" font-size="18.5" font-weight="600" fill="#111827">One TV</text>
  <text x="280" y="395" font-size="15.5" text-anchor="middle" fill="#BE185D">replace either one and you replace both</text>

  
  <rect x="640" y="40" width="560" height="400" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#047857">Low coupling: either side can be swapped</text>

  <g fill="none" stroke-width="2">
    <path d="M920,210 V228 Q920,240 908,240 H812 Q800,240 800,252 V274" stroke="#059669" marker-end="url(#cda-em)"/>
    <path d="M920,210 V228 Q920,240 932,240 H1028 Q1040,240 1040,252 V274" stroke="#059669" marker-end="url(#cda-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="920" y="266" fill="#047857">controls any of them</text>
  </g>

  <g filter="url(#cda-lift)">
    <rect x="790" y="120" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="790" y="120" width="9" height="90" fill="#059669" clip-path="url(#cda-u)"/>
  </g>
  <circle cx="830" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(819.56,154.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="856" y="172" font-size="18.5" font-weight="600" fill="#111827">Any remote</text>

  <g filter="url(#cda-soft)">
    <rect x="700" y="280" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="700" y="280" width="6" height="90" fill="#2563EB" clip-path="url(#cda-d1)"/>
  </g>
  <circle cx="738" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,314.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="764" y="332" font-size="18.5" font-weight="600" fill="#111827">Any TV</text>

  <g filter="url(#cda-soft)">
    <rect x="940" y="280" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="940" y="280" width="6" height="90" fill="#2563EB" clip-path="url(#cda-d2)"/>
  </g>
  <circle cx="978" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,314.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="1004" y="332" font-size="18.5" font-weight="600" fill="#111827">Any speaker</text>
  <text x="920" y="395" font-size="15.5" text-anchor="middle" fill="#047857">each side can be replaced on its own</text>

  
  <rect x="40" y="470" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="494" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="516" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Named, not described</text>
  <text x="288" y="516" font-size="15.5" fill="#475569">the remote knows one specific television, so neither can be changed alone</text>
  <rect x="64" y="538" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="560" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">An agreed signal</text>
  <text x="288" y="560" font-size="15.5" fill="#475569">both sides agree on a shared standard instead, which is what an interface does in code</text>
</svg>