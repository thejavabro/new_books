<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Monolith release train: three teams&#39; changes converge on one shared deploy. Microservices: payments and search deploy independently on their own schedules.">
  <defs>
    <marker id="m01-l04-release-trains-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m01-l04-release-trains-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m01-l04-release-trains-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="850" fill="#FFFFFF"/>

  
  <rect x="40" y="70" width="1160" height="340" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="108" font-size="20" font-weight="600" fill="#92400E">Monolith: one release train</text>

  <g fill="none" stroke-width="2.5">
    <path d="M370,172 C465,172 465,225 560,225" stroke="#D97706" marker-end="url(#m01-l04-release-trains-am)"/>
    <path d="M370,260 L560,260" stroke="#D97706" marker-end="url(#m01-l04-release-trains-am)"/>
    <path d="M370,348 C465,348 465,295 560,295" stroke="#D97706" marker-end="url(#m01-l04-release-trains-am)"/>
  </g>

  <g filter="url(#m01-l04-release-trains-soft)">
    <rect x="70" y="140" width="300" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="220" y="179" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments change</text>

  <g filter="url(#m01-l04-release-trains-soft)">
    <rect x="70" y="228" width="300" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="220" y="267" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Search change</text>

  <g filter="url(#m01-l04-release-trains-soft)">
    <rect x="70" y="316" width="300" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="220" y="355" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Recommendations change</text>

  <g filter="url(#m01-l04-release-trains-soft)">
    <rect x="560" y="195" width="340" height="130" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="730" y="243" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One shared deploy</text>
  <text x="730" y="275" text-anchor="middle" font-size="20" fill="#64748B">everyone's changes ship</text>
  <text x="730" y="303" text-anchor="middle" font-size="20" fill="#64748B">together, or nobody's do</text>

  <text x="730" y="372" text-anchor="middle" font-size="20" font-style="italic" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a delay in one team delays everyone</text>

  
  <rect x="40" y="440" width="1160" height="290" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="478" font-size="20" font-weight="600" fill="#065F46">Microservices: independent deploys</text>

  <g fill="none" stroke-width="2.5">
    <path d="M370,542 L560,542" stroke="#059669" marker-end="url(#m01-l04-release-trains-em)"/>
    <path d="M370,652 L560,652" stroke="#059669" marker-end="url(#m01-l04-release-trains-em)"/>
  </g>

  <g filter="url(#m01-l04-release-trains-soft)">
    <rect x="70" y="510" width="300" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="220" y="549" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments change</text>

  <g filter="url(#m01-l04-release-trains-soft)">
    <rect x="70" y="620" width="300" height="64" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="220" y="659" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Search change</text>

  <g filter="url(#m01-l04-release-trains-soft)">
    <rect x="560" y="500" width="300" height="84" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="710" y="536" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments deploy</text>
  <text x="710" y="566" text-anchor="middle" font-size="20" fill="#64748B">Tuesday</text>

  <g filter="url(#m01-l04-release-trains-soft)">
    <rect x="560" y="610" width="300" height="84" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="710" y="646" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Search deploy</text>
  <text x="710" y="676" text-anchor="middle" font-size="20" fill="#64748B">four times a day</text>

  <text x="1030" y="600" text-anchor="middle" font-size="20" font-style="italic" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">neither team waits for the other</text>

  
  <g stroke-width="4">
    <line x1="40" y1="775" x2="74" y2="775" stroke="#D97706"/>
    <line x1="40" y1="815" x2="74" y2="815" stroke="#059669"/>
  </g>
  <text x="84" y="782" font-size="20" fill="#475569">Release train: every change boards the same shared deploy</text>
  <text x="84" y="822" font-size="20" fill="#475569">Independent deploy: each team ships on its own schedule</text>
</svg>