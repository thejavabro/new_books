<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A B-tree node is one disk page holding hundreds of keys, so the tree is wide and shallow: root, one internal level, then the leaves that point at rows">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="ix8-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="ix8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <text x="610" y="82" font-size="20" fill="#64748B" text-anchor="middle">Root</text>
  <text x="610" y="238" font-size="20" fill="#64748B" text-anchor="middle">Internal nodes</text>
  <text x="620" y="388" font-size="20" fill="#64748B" text-anchor="middle">Leaf nodes</text>

  
  <path d="M610,162 C610,210 310,210 310,248" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix8-blue)"/>
  <path d="M610,162 C610,210 910,210 910,248" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix8-blue)"/>

  <path d="M310,318 C310,355 130,360 130,398" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix8-blue)"/>
  <path d="M310,318 L310,398" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix8-blue)"/>
  <path d="M310,318 C310,355 490,360 490,398" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix8-blue)"/>
  <path d="M910,318 C910,355 730,360 730,398" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix8-blue)"/>
  <path d="M910,318 L910,398" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix8-blue)"/>
  <path d="M910,318 C910,355 1090,360 1090,398" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix8-blue)"/>

  
  <g filter="url(#ix8-soft)">
    <rect x="520" y="98" width="180" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="610" y="137" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">120</text>

  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="452" y="200" font-size="20" fill="#1D4ED8" text-anchor="middle">less than 120</text>
    <text x="772" y="200" font-size="20" fill="#1D4ED8" text-anchor="middle">120 and up</text>
  </g>

  
  <g filter="url(#ix8-soft)">
    <rect x="170" y="254" width="280" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="770" y="254" width="280" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <line x1="310" y1="254" x2="310" y2="318" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="910" y1="254" x2="910" y2="318" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="240" y="293" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">40</text>
  <text x="380" y="293" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">80</text>
  <text x="840" y="293" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">160</text>
  <text x="980" y="293" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">200</text>

  
  <g filter="url(#ix8-soft)">
    <rect x="55" y="404" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="235" y="404" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="415" y="404" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="655" y="404" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="835" y="404" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="1015" y="404" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="130" y="443" font-size="20" fill="#0F172A" text-anchor="middle">1 to 39</text>
  <text x="310" y="443" font-size="20" fill="#0F172A" text-anchor="middle">40 to 79</text>
  <text x="490" y="443" font-size="20" fill="#0F172A" text-anchor="middle">80 to 119</text>
  <text x="730" y="443" font-size="20" fill="#0F172A" text-anchor="middle">120 to 159</text>
  <text x="910" y="443" font-size="20" fill="#0F172A" text-anchor="middle">160 to 199</text>
  <text x="1090" y="443" font-size="20" fill="#0F172A" text-anchor="middle">200 and up</text>

  <text x="620" y="512" font-size="20" fill="#64748B" text-anchor="middle">Every leaf entry also carries a pointer to the full row.</text>

  
  <rect x="170" y="548" width="900" height="84" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="582" font-size="20" fill="#334155" text-anchor="middle">Two or three children per node are drawn here so the picture fits.</text>
  <text x="620" y="612" font-size="20" fill="#334155" text-anchor="middle">A real node is one 16 KB page holding hundreds of keys.</text>

  <text x="620" y="672" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">That width is the whole trick: hundreds of children per node keeps the tree only three levels deep.</text>
</svg>