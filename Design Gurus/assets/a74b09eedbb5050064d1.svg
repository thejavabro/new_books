<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="High level design of the ticket booking system: browsing traffic is served from a cache while the low volume booking traffic goes straight to the ACID database.">
  <defs>
    <marker id="tm02-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="tm02-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="tm02-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="tm02-k1"><rect x="50" y="64" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="tm02-k2"><rect x="290" y="64" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="tm02-k3"><rect x="574" y="64" width="194" height="90" rx="12"/></clipPath>
    <clipPath id="tm02-k4"><rect x="838" y="64" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="tm02-k5"><rect x="300" y="300" width="170" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M220,109 L290,109" marker-end="url(#tm02-bl)"/>
    <path d="M504,109 L574,109" marker-end="url(#tm02-bl)"/>
    <path d="M768,109 L838,109" marker-end="url(#tm02-bl)"/>
    <path d="M900,154 V188 Q900,200 888,200 H397 Q385,200 385,212 V300" marker-end="url(#tm02-bl)"/>
    <path d="M470,345 H950" marker-end="url(#tm02-bl)"/>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="2.5">
    <path d="M1040,154 V284" marker-end="url(#tm02-pk)"/>
  </g>

  
  <g filter="url(#tm02-soft)">
    <rect x="50" y="64" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#tm02-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  <g filter="url(#tm02-soft)">
    <rect x="290" y="64" width="214" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="290" y="64" width="6" height="90" fill="#64748B" clip-path="url(#tm02-k2)"/>
  </g>
  <circle cx="328" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(317.56,98.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="354" y="116" font-size="18.5" font-weight="600" fill="#111827">Load Balancer</text>

  <g filter="url(#tm02-soft)">
    <rect x="574" y="64" width="194" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="574" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#tm02-k3)"/>
  </g>
  <circle cx="612" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(601.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="638" y="116" font-size="18.5" font-weight="600" fill="#111827">Web Servers</text>

  <g filter="url(#tm02-soft)">
    <rect x="838" y="64" width="276" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="838" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#tm02-k4)"/>
  </g>
  <circle cx="876" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="902" y="116" font-size="18.5" font-weight="600" fill="#111827">Application Servers</text>

  
  <g filter="url(#tm02-soft)">
    <rect x="300" y="300" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="300" y="300" width="6" height="90" fill="#2563EB" clip-path="url(#tm02-k5)"/>
  </g>
  <circle cx="338" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,334.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="364" y="352" font-size="18.5" font-weight="600" fill="#111827">Cache</text>
  <text x="385" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">listings change rarely</text>
  <text x="385" y="438" font-size="15.5" text-anchor="middle" fill="#94A3B8">about 1,000 views per second</text>

  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M950,300 L950,404 A90,16 0 0 0 1130,404 L1130,300" fill="#EDE9FE"/>
    <ellipse cx="1040" cy="300" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1040" y="372" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Database</text>
  <text x="1040" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">ACID; Serializable transaction</text>
  <text x="1040" y="468" font-size="15.5" text-anchor="middle" fill="#94A3B8">locks the Show_Seat rows</text>

  
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="642" y="192" text-anchor="middle" fill="#1D4ED8">browse: movies, shows, seat maps</text>
    <text x="710" y="337" text-anchor="middle" fill="#1D4ED8">on miss</text>
    <text x="1024" y="245" text-anchor="end" fill="#BE185D">book: about 3 per second,</text>
    <text x="1024" y="268" text-anchor="end" fill="#BE185D">every one must be correct</text>
  </g>

  
  <rect x="40" y="500" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="523" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="545" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Browse path</text>
  <text x="288" y="545" font-size="15.5" fill="#475569">read-heavy and cacheable</text>
  <rect x="64" y="567" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="589" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Booking path</text>
  <text x="288" y="589" font-size="15.5" fill="#475569">low volume, fully transactional</text>
</svg>