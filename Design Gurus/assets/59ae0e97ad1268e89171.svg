<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Strangler migration architecture: travellers reach one routing layer, which sends notifications and reviews traffic to extracted services that each own their own database, and everything else to the shrinking Rails monolith with its own database.">
  <defs>
    <marker id="m07-l10-migration-architecture-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l10-migration-architecture-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m07-l10-migration-architecture-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="870" fill="#FFFFFF"/>

  <rect x="40" y="110" width="560" height="620" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="152" font-size="20" font-weight="600" fill="#334155">Edge: one entry point, unchanged for users</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <rect x="170" y="200" width="260" height="120" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="300" y="267" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Travellers</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <rect x="110" y="400" width="380" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="300" y="451" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Routing layer</text>
  <text x="300" y="483" text-anchor="middle" font-size="20" fill="#64748B">the gateway</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <rect x="70" y="570" width="470" height="140" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  </g>
  <text x="305" y="615" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Routing is config, not a deploy</text>
  <text x="305" y="647" text-anchor="middle" font-size="20" fill="#1E40AF">canary 1% of traffic, compare,</text>
  <text x="305" y="679" text-anchor="middle" font-size="20" fill="#1E40AF">then promote or fall back</text>

  <rect x="640" y="110" width="560" height="380" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="660" y="152" font-size="20" font-weight="600" fill="#065F46">Extracted services</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <rect x="660" y="190" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="790" y="252" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <path d="M950,205 L950,285 A120,20 0 0 0 1190,285 L1190,205" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="1070" cy="205" rx="120" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1070" y="252" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">its own DB</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <rect x="660" y="350" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="790" y="412" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Reviews</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <path d="M950,365 L950,445 A120,20 0 0 0 1190,445 L1190,365" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="1070" cy="365" rx="120" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1070" y="412" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">its own DB</text>

  <rect x="640" y="540" width="560" height="190" rx="14" fill="#F1F5F9" fill-opacity="0.4" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="660" y="582" font-size="20" font-weight="600" fill="#334155">Shrinking core</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <rect x="660" y="600" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="790" y="662" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rails monolith</text>
  <g filter="url(#m07-l10-migration-architecture-soft)">
    <path d="M950,615 L950,695 A120,20 0 0 0 1190,695 L1190,615" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="1070" cy="615" rx="120" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1070" y="662" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the monolith DB</text>

  <g fill="none" stroke-width="2.5">
    <path d="M300,320 L300,392" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l10-migration-architecture-bl)"/>
    <path d="M490,430 C560,430 590,245 652,245" stroke="#3B82F6" marker-end="url(#m07-l10-migration-architecture-bl)"/>
    <path d="M490,460 C570,460 590,405 652,405" stroke="#3B82F6" marker-end="url(#m07-l10-migration-architecture-bl)"/>
    <path d="M490,490 C580,490 590,655 652,655" stroke="#3B82F6" marker-end="url(#m07-l10-migration-architecture-bl)"/>
    <path d="M920,245 L942,245" stroke="#475569" stroke-width="2" marker-end="url(#m07-l10-migration-architecture-sl)"/>
    <path d="M920,405 L942,405" stroke="#475569" stroke-width="2" marker-end="url(#m07-l10-migration-architecture-sl)"/>
    <path d="M920,655 L942,655" stroke="#475569" stroke-width="2" marker-end="url(#m07-l10-migration-architecture-sl)"/>
  </g>

  <line x1="60" y1="790" x2="96" y2="790" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="797" font-size="20" fill="#475569">The live request path: the gateway routes each capability</text>
  <line x1="60" y1="830" x2="96" y2="830" stroke="#475569" stroke-width="4"/>
  <text x="108" y="837" font-size="20" fill="#475569">Each service to its own database, on its own private schema</text>
</svg>