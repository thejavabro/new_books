<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="next-title next-desc">
<title id="next-title">What to do with it next</title>
<desc id="next-desc">The course is finished and the material is not, so the useful question is what makes it stick.</desc>
<defs>
<marker id="next-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="next-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="next-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="next-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="832" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What to do with it next</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The course is finished and the material is not, so the useful question is what makes it stick.</text>
<rect x="40" y="754" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="754" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="400" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="290" y="140.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Work the three capstones</text><text x="290" y="167.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">again, later</text>
<path d="M496 148H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 148H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#next-marker-slate)"/>
<rect x="540" y="118" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">after a few weeks, from the brief, without rereading.</text><text x="560" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The gap between attempts is more informative than either one</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="400" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="290" y="212.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Run the six questions</text><text x="290" y="239.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">on something real</text>
<path d="M496 220H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 220H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#next-marker-slate)"/>
<rect x="540" y="190" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a design in front of you at work, or a proposal somebody</text><text x="560" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">else wrote. They work on existing systems too</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="400" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="290" y="284.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write one decision a week,</text><text x="290" y="311.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">with its alternative</text>
<path d="M496 292H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 292H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#next-marker-slate)"/>
<rect x="540" y="262" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a paragraph, not a document. The alternatives accumulate</text><text x="560" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">into comparisons you have already made</text>
<circle cx="60" cy="364" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="400" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="290" y="356.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Review a design you did not</text><text x="290" y="383.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">write, with the rubric</text>
<path d="M496 364H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 364H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#next-marker-slate)"/>
<rect x="540" y="334" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the gaps are obvious in work that is not yours</text><text x="560" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and invisible in your own</text>
<circle cx="60" cy="436" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="443" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="406" width="400" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="290" y="428.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep a short list</text><text x="290" y="455.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">of your own numbers</text>
<path d="M496 436H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 436H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#next-marker-slate)"/>
<rect x="540" y="406" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">latency per distance, transfer cost each way,</text><text x="560" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">nines per month, what one database sustains</text>
<rect x="40" y="488" width="1160" height="84" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="488" width="5" height="84" rx="2.5" fill="#F28B9D"/><text x="64" y="523" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Do not treat this as preparation that ends at an interview</text><text x="64" y="549" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Everything here was chosen because it changes the system you run as much as the answer you give.</text>
<rect x="40" y="594" width="1160" height="134" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="594" width="5" height="134" rx="2.5" fill="#AC8BE8"/><text x="64" y="628" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What the capstones were for</text><text x="64" y="654" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Practice at being uncomfortable productively. The skill is not resolving the ambiguity into certainty.</text><text x="64" y="680" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It is making a defensible decision inside it, saying what it costs,</text><text x="64" y="706" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and knowing what would change your mind.</text>
<text x="66" y="788" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A handful of figures you can produce without reference turns an argument into a calculation.</text>
</svg>