<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1042" viewBox="0 0 1240 1042" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated distributed lock manager architecture: leader election through consensus, blocking cache invalidation, session expiry cleanup and proxy based scaling">
  <defs>
    <filter id="lm-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="lm-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lm-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lm-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lm-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lm-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1042" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Distributed lock manager: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Consensus for writes, cached reads that can never go stale, and sessions that clean up after a crash</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Leader election · three servers race, exactly one wins</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#lm-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">create</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#lm-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">propose</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#lm-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">exists</text>
  <g filter="url(#lm-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="979" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Clients A B C</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">all want to lead</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DLM leader</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">proposes only</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Raft quorum</text>
  <text x="776" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">3 of 5 must agree</text>
  <text x="1089" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Losers watch</text>
  <text x="1089" y="216" font-size="20" fill="#64748B" text-anchor="middle">ready to take over</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. Cached reads · writes are slowed so reads can never be wrong</text>
  <path d="M364,436 L456,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#lm-blue)"/>
  <text x="410" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">set</text>
  <path d="M784,436 L876,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#lm-blue)"/>
  <text x="830" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">invalidate</text>
  <g filter="url(#lm-soft)">
    <rect x="40" y="398" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,413 L880,459 A160,15 0 0 0 1200,459 L1200,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1040" cy="413" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="200" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Writer</text>
  <text x="200" y="458" font-size="20" fill="#64748B" text-anchor="middle">request is held</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DLM leader</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">blocks, then commits</text>
  <text x="1040" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client caches</text>
  <text x="1040" y="504" font-size="20" fill="#065F46" text-anchor="middle">invalidated, then acked</text>

  <rect x="24" y="580" width="1192" height="166" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#92400E">3. Crash cleanup · a pulled power cord releases the lock on its own</text>
  <path d="M264,678 L349,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#lm-amber)"/>
  <text x="307" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">silence</text>
  <path d="M577,678 L662,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#lm-amber)"/>
  <text x="620" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">expire</text>
  <path d="M890,678 L975,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#lm-amber)"/>
  <text x="933" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">notify</text>
  <g filter="url(#lm-soft)">
    <rect x="40" y="640" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="666" y="640" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="979" y="640" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Holder</text>
  <text x="150" y="700" font-size="20" fill="#64748B" text-anchor="middle">heartbeat every 10s</text>
  <text x="463" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Lease expires</text>
  <text x="463" y="700" font-size="20" fill="#64748B" text-anchor="middle">after 20 seconds</text>
  <text x="776" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ephemeral GC</text>
  <text x="776" y="700" font-size="20" fill="#64748B" text-anchor="middle">deletes its nodes</text>
  <text x="1089" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Watcher</text>
  <text x="1089" y="700" font-size="20" fill="#64748B" text-anchor="middle">elected next</text>

  <rect x="24" y="776" width="1192" height="166" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="808" font-size="20" font-weight="600" fill="#475569">4. Scale and safety · one leader takes all writes, so protect it</text>
  <path d="M364,874 L456,874" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#lm-blue)"/>
  <text x="410" y="862" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GC pause</text>
  <path d="M784,874 L876,874" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#lm-blue)"/>
  <text x="830" y="862" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">growth</text>
  <g filter="url(#lm-soft)">
    <rect x="40" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Proxies</text>
  <text x="200" y="896" font-size="20" fill="#64748B" text-anchor="middle">batch the heartbeats</text>
  <text x="620" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Fencing token</text>
  <text x="620" y="896" font-size="20" fill="#64748B" text-anchor="middle">stops a zombie write</text>
  <text x="1040" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cells</text>
  <text x="1040" y="896" font-size="20" fill="#64748B" text-anchor="middle">split by namespace</text>
  <line x1="44" y1="1002" x2="72" y2="1002" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1009" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1002" x2="344.576" y2="1002" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1009" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="993" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1009" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="993" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1009" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="993" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1009" font-size="20" fill="#475569">core service</text>
</svg>