<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="632" viewBox="0 0 1240 632" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="CRC32, MD5 and SHA-256 compared on speed, digest size, accidental error detection and resistance to deliberate tampering">
  <rect x="0" y="0" width="1240" height="632" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three digests, and the question each one actually answers</text>

  <rect x="50" y="88" width="1140" height="52" fill="#F1F5F9"/>
  <text x="481" y="121" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">CRC32</text>
  <text x="745" y="121" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">MD5</text>
  <text x="1008" y="121" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">SHA-256</text>

  <text x="70" y="181" font-size="20" font-weight="600" fill="#0F172A">Speed</text>
  <text x="481" y="181" font-size="20" fill="#065F46" text-anchor="middle">fastest</text>
  <text x="745" y="181" font-size="20" fill="#334155" text-anchor="middle">fast</text>
  <text x="1008" y="181" font-size="20" fill="#334155" text-anchor="middle">slower</text>

  <text x="70" y="249" font-size="20" font-weight="600" fill="#0F172A">Digest size</text>
  <text x="481" y="249" font-size="20" fill="#334155" text-anchor="middle">32 bits</text>
  <text x="745" y="249" font-size="20" fill="#334155" text-anchor="middle">128 bits</text>
  <text x="1008" y="249" font-size="20" fill="#334155" text-anchor="middle">256 bits</text>

  <text x="70" y="317" font-size="20" font-weight="600" fill="#0F172A">Catches accidental errors</text>
  <text x="481" y="317" font-size="20" fill="#065F46" text-anchor="middle">yes</text>
  <text x="745" y="317" font-size="20" fill="#065F46" text-anchor="middle">yes</text>
  <text x="1008" y="317" font-size="20" fill="#065F46" text-anchor="middle">yes</text>

  <text x="70" y="385" font-size="20" font-weight="600" fill="#0F172A">Resists deliberate tampering</text>
  <text x="481" y="385" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">no, trivial to forge</text>
  <text x="745" y="385" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">no, broken</text>
  <text x="1008" y="385" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">yes</text>

  <text x="70" y="453" font-size="20" font-weight="600" fill="#0F172A">Reach for it when</text>
  <text x="481" y="453" font-size="20" fill="#334155" text-anchor="middle">checking a wire or disk</text>
  <text x="745" y="453" font-size="20" fill="#334155" text-anchor="middle">legacy fingerprints</text>
  <text x="1008" y="453" font-size="20" fill="#334155" text-anchor="middle">anything security facing</text>

  <line x1="50" y1="88" x2="1190" y2="88" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="1190" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="50" y1="208" x2="1190" y2="208" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="276" x2="1190" y2="276" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="344" x2="1190" y2="344" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="412" x2="1190" y2="412" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="480" x2="1190" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="350" y1="88" x2="350" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="613" y1="88" x2="613" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="877" y1="88" x2="877" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1190" y1="88" x2="1190" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>

  
  <rect x="50" y="510" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="546" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">All three catch a corrupted download. Only one of them catches a substituted one.</text>
  <text x="620" y="576" font-size="20" fill="#334155" text-anchor="middle">Decide first whether you are defending against noise or against an adversary.</text>
</svg>