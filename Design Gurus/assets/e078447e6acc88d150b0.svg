<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="890" viewBox="0 0 1240 890" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A payment succeeds but the response is lost in the network; the client retries with the same idempotency key and the server replays the stored result instead of charging the card a second time">
  <rect x="0" y="0" width="1240" height="890" fill="#FFFFFF"/>
  <defs>
    <marker id="ap7-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ap7-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ap7-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="ap7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The charge went through. The client just never found out.</text>

  
  <line x1="200" y1="134" x2="200" y2="740" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="134" x2="620" y2="740" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1040" y1="134" x2="1040" y2="740" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>

  
  <g filter="url(#ap7-soft)">
    <rect x="100" y="80" width="200" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="500" y="80" width="240" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="930" y="80" width="220" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="620" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Payment API</text>
  <text x="1040" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Card network</text>

  
  <text x="48" y="170" font-size="20" font-weight="600" fill="#1E40AF">First attempt</text>

  <text x="410" y="200" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">POST /charge  $40</text>
  <text x="410" y="224" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">Idempotency-Key: k-9f2</text>
  <line x1="204" y1="238" x2="616" y2="238" stroke="#3B82F6" stroke-width="2" marker-end="url(#ap7-blue)"/>

  <rect x="520" y="256" width="200" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="620" y="284" font-size="20" fill="#1E40AF" text-anchor="middle">key k-9f2 is new</text>

  <text x="830" y="330" font-size="20" fill="#1E40AF" text-anchor="middle">charge the card</text>
  <line x1="624" y1="344" x2="1036" y2="344" stroke="#3B82F6" stroke-width="2" marker-end="url(#ap7-blue)"/>

  <text x="830" y="376" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">approved, txn t-771</text>
  <line x1="1036" y1="390" x2="624" y2="390" stroke="#059669" stroke-width="2" marker-end="url(#ap7-emerald)"/>

  <rect x="505" y="408" width="230" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="436" font-size="20" fill="#065F46" text-anchor="middle">k-9f2 is done, t-771</text>

  <text x="490" y="482" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">200 OK, lost in the network</text>
  <line x1="616" y1="496" x2="418" y2="496" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="390" y1="486" x2="410" y2="506" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="410" y1="486" x2="390" y2="506" stroke="#DC2626" stroke-width="2.5"/>

  
  <text x="48" y="530" font-size="20" font-weight="600" fill="#92400E">The retry</text>

  <text x="410" y="560" font-size="20" fill="#92400E" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">POST /charge  $40</text>
  <text x="410" y="584" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">Idempotency-Key: k-9f2</text>
  <line x1="204" y1="598" x2="616" y2="598" stroke="#D97706" stroke-width="2" marker-end="url(#ap7-amber)"/>

  <rect x="465" y="616" width="310" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="620" y="644" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">k-9f2 was already used</text>
  <text x="620" y="670" font-size="20" fill="#065F46" text-anchor="middle">the stored result is replayed</text>

  <rect x="930" y="680" width="220" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="1040" y="716" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">charged exactly once</text>

  <text x="410" y="712" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">the same 200 OK, no new charge</text>
  <line x1="616" y1="726" x2="204" y2="726" stroke="#059669" stroke-width="2" marker-end="url(#ap7-emerald)"/>

  
  <rect x="50" y="772" width="1140" height="92" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="808" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The retry is not the problem. Retrying without a key is.</text>
  <text x="620" y="838" font-size="20" fill="#065F46" text-anchor="middle">The key turns the second attempt into a lookup, so the card is charged exactly once.</text>
</svg>