<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="460" viewBox="0 0 1240 460" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Backup restores data into a system that is still running, while disaster recovery rebuilds the systems and infrastructure themselves and contains backup as one part">
  <rect x="0" y="0" width="1240" height="460" fill="#FFFFFF"/>
  <defs>
    <filter id="rr10-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="50" width="580" height="310" rx="14" fill="#F5F3FF" fill-opacity="0.4" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="88" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Data backup</text>

  <rect x="640" y="50" width="580" height="310" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="88" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Disaster recovery</text>

  <g filter="url(#rr10-soft)">
    <rect x="80" y="120" width="460" height="140" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="310" y="160" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">copies of files, databases</text>
  <text x="310" y="192" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">and application data</text>
  <text x="310" y="228" font-size="20" fill="#64748B" text-anchor="middle">on tapes, disks or cloud storage</text>

  <rect x="676" y="112" width="508" height="182" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>

  <g filter="url(#rr10-soft)">
    <rect x="696" y="132" width="234" height="66" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="944" y="132" width="224" height="66" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="696" y="212" width="234" height="66" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="944" y="212" width="224" height="66" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <text x="813" y="172" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">the backups</text>
  <text x="1056" y="172" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">servers and networks</text>
  <text x="813" y="252" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">an alternate site</text>
  <text x="1056" y="252" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">a tested runbook</text>

  <text x="310" y="324" font-size="20" fill="#5B21B6" text-anchor="middle">restores data into a system that is still running</text>
  <text x="930" y="324" font-size="20" fill="#1E3A8A" text-anchor="middle">rebuilds the systems and infrastructure themselves</text>

  <text x="620" y="424" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">Backup is one essential part of a disaster recovery plan, not a substitute for one.</text>
</svg>