    <rect x="44" y="350" width="6" height="64" fill="#D97706" clip-path="url(#oodi5-c3)"/>
  </g>
  <circle cx="82" cy="382.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="388.5" font-size="17" font-weight="700" text-anchor="middle" fill="#D97706">I</text>
  <text x="112" y="388.5" font-size="18.5" font-weight="600" fill="#111827">Interface segregation</text>
  <g filter="url(#oodi5-soft)">
    <rect x="570" y="350" width="626" height="64" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="570" y="350" width="6" height="64" fill="#D97706" clip-path="url(#oodi5-g3)"/>
  </g>
  <text x="592" y="388.5" font-size="18.5" font-weight="600" fill="#111827">an empty method body</text>
  <path d="M514,382 L570,382" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#oodi5-arrow-amber)"/>
  <g filter="url(#oodi5-soft)">
    <rect x="44" y="438" width="470" height="64" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="44" y="438" width="6" height="64" fill="#4F46E5" clip-path="url(#oodi5-c4)"/>
  </g>
  <circle cx="82" cy="470.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="476.5" font-size="17" font-weight="700" text-anchor="middle" fill="#4F46E5">D</text>
  <text x="112" y="476.5" font-size="18.5" font-weight="600" fill="#111827">Dependency inversion</text>
  <g filter="url(#oodi5-soft)">
    <rect x="570" y="438" width="626" height="64" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="570" y="438" width="6" height="64" fill="#4F46E5" clip-path="url(#oodi5-g4)"/>
  </g>
  <text x="592" y="476.5" font-size="18.5" font-weight="600" fill="#111827">a high level class naming a low level one</text>
  <path d="M514,470 L570,470" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#oodi5-arrow-indigo)"/>
  <text x="620" y="556" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">Two findings out of five is a good pass. Five means rework. Zero means you did not look.</text>
</svg>