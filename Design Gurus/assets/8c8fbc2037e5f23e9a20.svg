  </g>
  <text x="592" y="212.5" font-size="18.5" font-weight="600" fill="#111827">a switch over a type</text>
  <path d="M514,206 L570,206" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#oodi5-arrow-violet)"/>
  <g filter="url(#oodi5-soft)">
