  <rect x="0" y="0" width="1240" height="596" fill="#FFFFFF"/>
  <text x="44" y="64" font-size="16.5" fill="#6B7280" font-weight="600">The check</text>
  <text x="560" y="64" font-size="16.5" fill="#6B7280" font-weight="600">The signal that it failed</text>
  <g filter="url(#oodi5-soft)">
    <rect x="44" y="86" width="470" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="44" y="86" width="6" height="64" fill="#2563EB" clip-path="url(#oodi5-c0)"/>
  </g>
  <circle cx="82" cy="118.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="124.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">S</text>
  <text x="112" y="124.5" font-size="18.5" font-weight="600" fill="#111827">Single responsibility</text>
