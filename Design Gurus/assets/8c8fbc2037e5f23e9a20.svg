<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="596" viewBox="0 0 1240 596" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five checks to run over a finished class diagram">
  <defs>
    <marker id="oodi5-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oodi5-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oodi5-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oodi5-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oodi5-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oodi5-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oodi5-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oodi5-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oodi5-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oodi5-c0"><rect x="44" y="86" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-g0"><rect x="570" y="86" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-c1"><rect x="44" y="174" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-g1"><rect x="570" y="174" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-c2"><rect x="44" y="262" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-g2"><rect x="570" y="262" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-c3"><rect x="44" y="350" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-g3"><rect x="570" y="350" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-c4"><rect x="44" y="438" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodi5-g4"><rect x="570" y="438" width="626" height="64" rx="12"/></clipPath>
