  </g>
  <text x="592" y="300.5" font-size="18.5" font-weight="600" fill="#111827">a subclass that refuses one of its parent methods</text>
  <path d="M514,294 L570,294" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oodi5-arrow-emerald)"/>
  <g filter="url(#oodi5-soft)">
