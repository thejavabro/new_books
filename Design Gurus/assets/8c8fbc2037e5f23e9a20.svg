    <rect x="570" y="86" width="626" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="570" y="86" width="6" height="64" fill="#2563EB" clip-path="url(#oodi5-g0)"/>
  </g>
  <text x="592" y="124.5" font-size="18.5" font-weight="600" fill="#111827">the responsibility sentence needs an "and"</text>
  <path d="M514,118 L570,118" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#oodi5-arrow-blue)"/>
  <g filter="url(#oodi5-soft)">
