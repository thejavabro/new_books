<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Redundancy turns an upgrade into a rolling operation: one node is taken out and patched while the other keeps serving traffic">
  <rect x="0" y="0" width="1240" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="rr2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="rr2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="404" y1="215" x2="426" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#rr2-slate)"/>
  <line x1="814" y1="215" x2="836" y2="215" stroke="#475569" stroke-width="2.5" marker-end="url(#rr2-slate)"/>

  <rect x="20" y="50" width="380" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="210" y="88" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">1. Both serving</text>

  <rect x="430" y="50" width="380" height="290" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="88" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">2. Node A is patched</text>

  <rect x="840" y="50" width="380" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1030" y="88" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">3. Node A rejoins</text>

  <g filter="url(#rr2-soft)">
    <rect x="60" y="120" width="300" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="216" width="300" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="470" y="120" width="300" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="470" y="216" width="300" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="120" width="300" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="216" width="300" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="210" y="152" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node A</text>
  <text x="210" y="180" font-size="20" fill="#059669" text-anchor="middle">taking traffic</text>
  <text x="210" y="248" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node B</text>
  <text x="210" y="276" font-size="20" fill="#059669" text-anchor="middle">taking traffic</text>

  <text x="620" y="152" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node A</text>
  <text x="620" y="180" font-size="20" fill="#92400E" text-anchor="middle">out of rotation</text>
  <text x="620" y="248" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node B</text>
  <text x="620" y="276" font-size="20" fill="#059669" text-anchor="middle">taking all traffic</text>

  <text x="1030" y="152" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node A</text>
  <text x="1030" y="180" font-size="20" fill="#059669" text-anchor="middle">patched, back in</text>
  <text x="1030" y="248" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node B</text>
  <text x="1030" y="276" font-size="20" fill="#059669" text-anchor="middle">taking traffic</text>

  <text x="620" y="398" font-size="20" fill="#475569" text-anchor="middle">Without a second node, every upgrade in the middle step would be an outage.</text>
</svg>