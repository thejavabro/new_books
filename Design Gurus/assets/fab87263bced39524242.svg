<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="698" viewBox="0 0 1240 698" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="three-title three-desc">
<title id="three-title">The three estimates that decide architecture</title>
<desc id="three-desc">Peak write rate decides whether one primary can hold the write path. Working set against memory decides whether reads touch disk. Fan-out decides whether one write becoming many is a job or an architecture. Each has a threshold where the design changes shape.</desc>
<defs>
<marker id="three-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="three-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="three-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="three-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="698" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The three estimates that decide architecture</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Most design-relevant estimates fall into three families.</text>
<rect x="40" y="620" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="620" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="372" height="394" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V506A6 6 0 0 0 46 512H54Z" fill="#5EC9EC"/><text x="226" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="middle">Peak write rate</text>
<text x="226" y="184" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Can one primary hold the write path?</text>
<rect x="64" y="202" width="324" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="230" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">low thousands/sec</text>
<text x="226" y="266" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">comfortable</text>
<rect x="64" y="284" width="324" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="226" y="312" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">tens of thousands</text>
<text x="226" y="348" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">possible with care</text>
<rect x="64" y="366" width="324" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">beyond that</text>
<text x="226" y="430" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">partition, batch, or change engine</text>
<text x="226" y="466" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">reads do not force this, because</text><text x="226" y="491" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">reads spread across copies</text>
<rect x="434" y="118" width="372" height="394" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V506A6 6 0 0 0 440 512H448Z" fill="#39D5AA"/><text x="620" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="middle">Working set vs memory</text>
<text x="620" y="184" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Can reads be served without disk?</text>
<rect x="458" y="202" width="324" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="230" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">fits</text>
<text x="620" y="266" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">reads are solved</text>
<rect x="458" y="284" width="324" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="312" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">two or three times</text>
<text x="620" y="348" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">depends on access skew</text>
<rect x="458" y="366" width="324" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ten times</text>
<text x="620" y="430" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">you are designing a cache</text>
<text x="620" y="466" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">the working set is far smaller than</text><text x="620" y="491" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">the total, almost always</text>
<rect x="828" y="118" width="372" height="394" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V506A6 6 0 0 0 834 512H842Z" fill="#F3CF6A"/><text x="1014" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="middle">Fan-out</text>
<text x="1014" y="184" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">How many things change per write?</text>
<rect x="852" y="202" width="324" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1014" y="230" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one row</text>
<text x="1014" y="266" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a normal system</text>
<rect x="852" y="284" width="324" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="312" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a hundred</text>
<text x="1014" y="348" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a background job</text>
<rect x="852" y="366" width="324" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a million</text>
<text x="1014" y="430" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">an architecture</text>
<text x="1014" y="466" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">the estimate most likely to eliminate</text><text x="1014" y="491" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">a design, and least often computed</text>
<rect x="40" y="532" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="532" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="569" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Each has a threshold where the design changes shape rather than merely getting bigger.</text>
<text x="66" y="654" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Fan-out is the one that most often eliminates a design, and the one candidates compute least often.</text>
</svg>