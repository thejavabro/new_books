<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Cold start: no execution environment exists, so the platform allocates an environment, loads the function code, initializes the runtime, runs the init code and then executes the function handler, with higher latency of tens of milliseconds to seconds. Warm start: an existing environment is reused, so the platform skips the four initialization steps and executes the function handler right away, with low latency and no initialization cost">
  <defs>
    <filter id="m15e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m15e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m15e-k1"><rect x="64" y="215" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m15e-k2"><rect x="292" y="215" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m15e-k3"><rect x="520" y="215" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m15e-k4"><rect x="748" y="215" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m15e-k5"><rect x="976" y="215" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m15e-k6"><rect x="64" y="519" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="m15e-k7"><rect x="440" y="519" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="m15e-k8"><rect x="876" y="519" width="300" height="90" rx="12"/></clipPath>
    <marker id="m15e-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m15e-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="m15e-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="750" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a serverless function executes: cold start vs. warm start</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A cold start creates a new environment first; a warm start reuses one.</text>

  <rect x="40" y="125" width="1160" height="280" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#BE185D">Cold start</text>
  <rect x="40" y="429" width="1160" height="280" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="459" font-size="19.5" font-weight="600" fill="#047857">Warm start</text>

  <g fill="none" stroke-width="2">
    <path d="M264,260 H292" stroke="#64748B" marker-end="url(#m15e-m-slate)"/>
    <path d="M492,260 H520" stroke="#64748B" marker-end="url(#m15e-m-slate)"/>
    <path d="M720,260 H748" stroke="#64748B" marker-end="url(#m15e-m-slate)"/>
    <path d="M948,260 H976" stroke="#64748B" marker-end="url(#m15e-m-slate)"/>
    <path d="M364,564 H440" stroke="#64748B" marker-end="url(#m15e-m-slate)"/>
    <path d="M876,564 H740" stroke="#64748B" stroke-dasharray="7 6" marker-end="url(#m15e-m-slate)"/>
    <path d="M64,340 H1176" stroke="#DB2777" stroke-width="2.5" marker-end="url(#m15e-m-pink)"/>
    <path d="M64,644 H1176" stroke="#059669" stroke-width="2.5" marker-end="url(#m15e-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m15e-soft)">
    <rect x="64" y="215" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="215" width="6" height="90" fill="#7C3AED" clip-path="url(#m15e-k1)"/>
  </g>
  <text x="84" y="255.75" font-size="18.5" font-weight="600" fill="#111827">1. Allocate</text>
  <text x="84" y="278.25" font-size="18.5" font-weight="600" fill="#111827">environment</text>
  <g filter="url(#m15e-soft)">
    <rect x="292" y="215" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="292" y="215" width="6" height="90" fill="#7C3AED" clip-path="url(#m15e-k2)"/>
  </g>
  <text x="312" y="255.75" font-size="18.5" font-weight="600" fill="#111827">2. Load</text>
  <text x="312" y="278.25" font-size="18.5" font-weight="600" fill="#111827">function code</text>
  <g filter="url(#m15e-soft)">
    <rect x="520" y="215" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="520" y="215" width="6" height="90" fill="#7C3AED" clip-path="url(#m15e-k3)"/>
  </g>
  <text x="540" y="255.75" font-size="18.5" font-weight="600" fill="#111827">3. Initialize</text>
  <text x="540" y="278.25" font-size="18.5" font-weight="600" fill="#111827">runtime</text>
  <g filter="url(#m15e-soft)">
    <rect x="748" y="215" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="748" y="215" width="6" height="90" fill="#7C3AED" clip-path="url(#m15e-k4)"/>
  </g>
  <text x="768" y="255.75" font-size="18.5" font-weight="600" fill="#111827">4. Run</text>
  <text x="768" y="278.25" font-size="18.5" font-weight="600" fill="#111827">init code</text>
  <g filter="url(#m15e-soft)">
    <rect x="976" y="215" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="976" y="215" width="6" height="90" fill="#2563EB" clip-path="url(#m15e-k5)"/>
  </g>
  <text x="996" y="255.75" font-size="18.5" font-weight="600" fill="#111827">5. Execute</text>
  <text x="996" y="278.25" font-size="18.5" font-weight="600" fill="#111827">function handler</text>
  <g filter="url(#m15e-soft)">
    <rect x="64" y="519" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="519" width="6" height="90" fill="#2563EB" clip-path="url(#m15e-k6)"/>
  </g>
  <text x="84" y="571" font-size="18.5" font-weight="600" fill="#111827">Steps 1 to 4 skipped</text>
  <g filter="url(#m15e-soft)">
    <rect x="440" y="519" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="519" width="6" height="90" fill="#2563EB" clip-path="url(#m15e-k7)"/>
  </g>
  <text x="460" y="571" font-size="18.5" font-weight="600" fill="#111827">5. Execute function handler</text>
  <g filter="url(#m15e-soft)">
    <rect x="876" y="519" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="876" y="519" width="6" height="90" fill="#64748B" clip-path="url(#m15e-k8)"/>
  </g>
  <circle cx="914" cy="564" r="18" fill="#FFFFFF"/>
  <g transform="translate(903.56,553.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="940" y="559.75" font-size="18.5" font-weight="600" fill="#111827">Reuses existing</text>
  <text x="940" y="582.25" font-size="18.5" font-weight="600" fill="#111827">environment</text>
  <text x="64" y="187" font-size="18.5" fill="#475569">No existing execution environment. The platform creates a new one before running your code.</text>
  <text x="64" y="491" font-size="18.5" fill="#475569">An existing execution environment is reused. Your code runs immediately.</text>
  <text x="620" y="376" font-size="18.5" text-anchor="middle" fill="#475569">Higher latency (tens of milliseconds to seconds)</text>
  <text x="620" y="680" font-size="18.5" text-anchor="middle" fill="#475569">Low latency (no initialization cost)</text>

  <path d="M64,329 V351" stroke="#DB2777" stroke-width="2.5"/>
  <path d="M64,633 V655" stroke="#059669" stroke-width="2.5"/>


</svg>