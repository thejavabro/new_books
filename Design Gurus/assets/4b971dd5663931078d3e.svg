<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="442" viewBox="0 0 1240 442" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The usual phrasing says you pick two of consistency, availability and partition tolerance, and that a relational database is CA. The accurate phrasing is that partition tolerance is required, that you choose between consistency and availability only during a partition, and that a single-machine database is not a distributed system at all.">
  <rect x="0" y="0" width="1240" height="442" fill="#FFFFFF"/>
  <defs>
    <marker id="cp3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cp3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cp3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cp3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="cp3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="cp3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="cp3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="cp3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="cp3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Why "pick two of three" is the wrong way to say it</text>
  <rect x="24" y="70" width="588" height="302" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="110" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle">How it is usually said</text>
  <path d="M60,150 L76,166 M76,150 L60,166" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="102" y="164" font-size="19" fill="#0F172A" text-anchor="start">Pick two of the three: CA, CP, or AP.</text>
  <path d="M60,202 L76,218 M76,202 L60,218" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="102" y="216" font-size="19" fill="#0F172A" text-anchor="start">A relational database is a CA system.</text>
  <path d="M60,254 L76,270 M76,254 L60,270" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="102" y="268" font-size="19" fill="#0F172A" text-anchor="start">Partition tolerance is one you can drop.</text>
  <path d="M60,306 L76,322 M76,306 L60,322" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="102" y="320" font-size="19" fill="#0F172A" text-anchor="start">You give up one of the three forever.</text>
  <rect x="628" y="70" width="588" height="302" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="110" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">What is actually true</text>
  <path d="M663,158 L670,166 L682,150" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="706" y="164" font-size="19" fill="#0F172A" text-anchor="start">Partition tolerance is required, not chosen.</text>
  <path d="M663,210 L670,218 L682,202" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="706" y="216" font-size="19" fill="#0F172A" text-anchor="start">During a partition, choose C or A.</text>
  <path d="M663,262 L670,270 L682,254" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="706" y="268" font-size="19" fill="#0F172A" text-anchor="start">With no partition you get both C and A.</text>
  <path d="M663,314 L670,322 L682,306" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="706" y="320" font-size="19" fill="#0F172A" text-anchor="start">One machine is not a distributed system.</text>
  <rect x="24" y="386" width="1192" height="52" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="419" font-size="19" fill="#64748B" text-anchor="middle">A database on one machine has no network between machines, so CAP does not describe it.</text>
</svg>