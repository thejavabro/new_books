<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1235" viewBox="0 0 1240 1235" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The payments-down run: Checkout calls Payments with a 1 second timeout, answers inside the budget record the charge, a timeout triggers one retry with jitter under the same idempotency key, a second failure opens the breaker, and then the product choice is either failing cleanly with the cart saved or accepting the order as payment_pending with the charge queued and a dead letter queue behind it.">
  <defs>
    <marker id="m07-l02-payment-edge-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l02-payment-edge-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l02-payment-edge-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l02-payment-edge-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m07-l02-payment-edge-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1235" fill="#FFFFFF"/>

  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="50" y="60" width="420" height="130" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="260" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Why the retry is safe</text>
  <text x="260" y="132" text-anchor="middle" font-size="20" fill="#64748B">the same idempotency key means</text>
  <text x="260" y="164" text-anchor="middle" font-size="20" fill="#64748B">the charge can only land once</text>
  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="940" y="90" width="250" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1065" y="141" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Charge recorded</text>
  <text x="1065" y="173" text-anchor="middle" font-size="20" fill="#64748B">exactly once</text>

  <rect x="40" y="210" width="1160" height="440" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="252" font-size="20" font-weight="600" fill="#334155">The mechanisms fire in order</text>

  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="50" y="285" width="270" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="185" y="346" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout calls</text>
  <text x="185" y="378" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <g filter="url(#m07-l02-payment-edge-soft)">
    <path d="M490,270 L640,355 L490,440 L340,355 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="490" y="346" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Answer within</text>
  <text x="490" y="378" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1 second?</text>
  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="690" y="285" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="830" y="346" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One retry with jitter,</text>
  <text x="830" y="378" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">same idempotency key</text>
  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="690" y="490" width="280" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="830" y="551" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Breaker opens,</text>
  <text x="830" y="583" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">stop calling Payments</text>
  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="60" y="490" width="560" height="140" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="340" y="551" text-anchor="middle" font-size="20" fill="#475569">The 1 second comes from the p99 latency, and a</text>
  <text x="340" y="583" text-anchor="middle" font-size="20" fill="#475569">bulkhead caps the threads Payments can tie up.</text>

  <g fill="none" stroke-width="2.5">
    <path d="M320,355 L332,355" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l02-payment-edge-bl)"/>
    <path d="M640,355 L682,355" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l02-payment-edge-rd)"/>
    <path d="M490,270 L490,150 L932,150" stroke="#059669" stroke-width="2" marker-end="url(#m07-l02-payment-edge-em)"/>
    <path d="M830,285 L830,190 L932,190" stroke="#059669" marker-end="url(#m07-l02-payment-edge-em)"/>
    <path d="M830,425 L830,482" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l02-payment-edge-rd)"/>
    <path d="M830,630 L830,675 L620,675 L620,739" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l02-payment-edge-rd)"/>
  </g>

  <text x="510" y="140" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="661" y="337" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="850" y="228" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Works</text>
  <text x="850" y="464" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Fails again</text>

  <rect x="40" y="720" width="1160" height="360" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="765" font-size="20" font-weight="600" fill="#334155">Then the product choice</text>
  <g filter="url(#m07-l02-payment-edge-soft)">
    <path d="M620,747 L780,825 L620,903 L460,825 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="620" y="832" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Product choice</text>

  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="60" y="925" width="380" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="250" y="970" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Show an error,</text>
  <text x="250" y="1002" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the cart stays saved</text>
  <text x="250" y="1034" text-anchor="middle" font-size="20" fill="#64748B">nothing was charged</text>
  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="490" y="925" width="380" height="140" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="680" y="986" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order set to payment_pending</text>
  <text x="680" y="1018" text-anchor="middle" font-size="20" fill="#64748B">the charge is queued for later</text>
  <g filter="url(#m07-l02-payment-edge-soft)">
    <rect x="920" y="925" width="280" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1060" y="970" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Dead letter queue</text>
  <text x="1060" y="1002" text-anchor="middle" font-size="20" fill="#64748B">if the queued charge</text>
  <text x="1060" y="1034" text-anchor="middle" font-size="20" fill="#64748B">keeps failing</text>

  <g fill="none" stroke-width="2.5">
    <path d="M460,825 L250,825 L250,917" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l02-payment-edge-rd)"/>
    <path d="M620,903 L620,917" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l02-payment-edge-ab)"/>
    <path d="M870,995 L912,995" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l02-payment-edge-rd)"/>
  </g>

  <text x="355" y="813" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Fail cleanly</text>
  <text x="700" y="890" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Accept the order</text>

  <line x1="60" y1="1115" x2="96" y2="1115" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1122" font-size="20" fill="#475569">The charge lands: once, and only once</text>
  <line x1="60" y1="1155" x2="96" y2="1155" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1162" font-size="20" fill="#475569">The failure path: timeout, retry, breaker, then a choice</text>
  <line x1="60" y1="1195" x2="96" y2="1195" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="1202" font-size="20" fill="#475569">Deferred work: accepted now, charged later</text>
</svg>