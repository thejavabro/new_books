<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="754" viewBox="0 0 1240 754" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="lie-title lie-desc">
<title id="lie-title">Four ways alerts lie</title>
<desc id="lie-desc">No duration condition, alerting per instance, ratios at low traffic, and no dependency suppression. All four have known fixes and one shared root cause.</desc>
<defs>
<marker id="lie-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="lie-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="lie-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="lie-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="754" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four ways alerts lie</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four mechanical problems produce false pages, and all four have known fixes.</text>
<rect x="40" y="676" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="676" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="320" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="200" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No duration condition</text>
<path d="M366 150H400" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 150H400" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lie-marker-slate)"/>
<rect x="410" y="118" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="430" y="156" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">fires on a single slow scrape</text>
<path d="M736 150H770" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M736 150H770" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lie-marker-green)"/>
<rect x="780" y="118" width="420" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="990" y="142.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">require the condition to hold</text><text x="990" y="169.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">for several minutes</text>
<rect x="40" y="194" width="320" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="200" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Alerting per instance</text>
<path d="M366 226H400" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 226H400" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lie-marker-slate)"/>
<rect x="410" y="194" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="430" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">twenty pods, twenty pages,</text><text x="430" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one problem</text>
<path d="M736 226H770" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M736 226H770" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lie-marker-green)"/>
<rect x="780" y="194" width="420" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="990" y="218.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">alert on the aggregate the</text><text x="990" y="245.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">user experiences</text>
<rect x="40" y="270" width="320" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="200" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Low traffic breaks ratios</text>
<path d="M366 302H400" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 302H400" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lie-marker-slate)"/>
<rect x="410" y="270" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="430" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">two failures in ten is a</text><text x="430" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">20% error rate</text>
<path d="M736 302H770" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M736 302H770" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lie-marker-green)"/>
<rect x="780" y="270" width="420" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="990" y="294.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">require a minimum request</text><text x="990" y="321.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">count before firing</text>
<rect x="40" y="346" width="320" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="200" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No dependency suppression</text>
<path d="M366 378H400" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 378H400" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lie-marker-slate)"/>
<rect x="410" y="346" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="430" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the database is down and</text><text x="430" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">everything pages</text>
<path d="M736 378H770" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M736 378H770" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lie-marker-green)"/>
<rect x="780" y="346" width="420" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="990" y="370.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">suppress downstream when an</text><text x="990" y="397.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">upstream cause fires</text>
<rect x="40" y="434" width="1160" height="106" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="106" rx="2.5" fill="#AC8BE8"/><text x="64" y="467" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">All four share one root cause</text><text x="64" y="493" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The alert was written as a condition on a metric rather than a statement about users.</text><text x="64" y="519" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Rewriting it as "users are experiencing X" makes the right configuration obvious.</text>
<rect x="40" y="564" width="1160" height="86" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="564" width="5" height="86" rx="2.5" fill="#F28B9D"/><text x="64" y="598.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The failure mode that feels responsible</text><text x="64" y="627.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Thoroughly monitored, and completely unheard.</text>
<text x="66" y="710" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Grouping related alerts converts fifteen pages during one incident into one.</text>
</svg>