<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">Match dependencies to their lifetimes</title><desc id="desc">A process-level service can outlive several signed-in sessions, and each session can outlive several screens. Scope account data and screen state accordingly. On sign-out, stop account work and reject late results for the old session; a long-lived object must not keep an old account or screen alive.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1030" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Match dependencies to their lifetimes</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Nested scopes describe lifetimes, not permission to retain everything inside them.</text><rect x="50" y="165" width="1100" height="655" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="75" y="209" font-size="24" fill="#2563eb" font-weight="700">APP PROCESS</text><text x="75" y="250" font-size="23" fill="#334155" font-weight="400">Example: a shared HTTP client</text><rect x="90" y="295" width="1020" height="475" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="115" y="339" font-size="24" fill="#7c3aed" font-weight="700">SIGNED-IN SESSION</text><text x="115" y="380" font-size="23" fill="#334155" font-weight="400">Example: account-scoped repositories and observations</text><rect x="130" y="430" width="450" height="230" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="152" y="470" font-size="24" fill="#059669" font-weight="700">Screen A</text><text x="152" y="511" font-size="21" fill="#334155" font-weight="400">Screen model and selection</text><text x="152" y="542" font-size="21" fill="#334155" font-weight="400">End this scope when its</text><text x="152" y="573" font-size="21" fill="#334155" font-weight="400">navigation lifetime ends.</text><rect x="630" y="430" width="440" height="230" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="652" y="470" font-size="24" fill="#059669" font-weight="700">Screen B</text><text x="652" y="511" font-size="21" fill="#334155" font-weight="400">A separate screen lifetime</text><text x="652" y="542" font-size="21" fill="#334155" font-weight="400">It can use the same account</text><text x="652" y="573" font-size="21" fill="#334155" font-weight="400">services through their contracts.</text><text x="130" y="716" font-size="23" fill="#334155" font-weight="400">Sign-out ends the old account scope; the app process may continue.</text><rect x="50" y="870" width="1100" height="115" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="910" font-size="24" fill="#ffffff" font-weight="700">Check lifetime and identity</text><text x="72" y="951" font-size="21" fill="#ffffff" font-weight="400">Do not retain old screens. Reject responses whose account or session generation no longer matches.</text></g></svg>