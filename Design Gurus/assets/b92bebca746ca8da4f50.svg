<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sidecar: each service instance runs a proxy beside it, the app speaks plaintext over localhost, and the two sidecars carry the traffic between instances over mutual TLS">
  <rect x="0" y="0" width="1300" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="s" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="b" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1E3A8A"/>
    </marker>
    <marker id="bs" viewBox="0 0 9 9" refX="0.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#1E3A8A"/>
    </marker>
  </defs>

  
  <rect x="50" y="60" width="470" height="230" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="72" y="96" font-size="20" font-weight="700" fill="#475569">One Checkout instance (Go)</text>

  <rect x="74" y="118" width="190" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="169" y="158" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Checkout</text>
  <text x="169" y="186" font-size="20" fill="#334155" text-anchor="middle">business logic</text>

  <line x1="266" y1="163" x2="304" y2="163" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="286" y="240" font-size="20" fill="#334155" text-anchor="middle">plaintext, over localhost</text>
  <text x="286" y="266" font-size="20" fill="#334155" text-anchor="middle">the app does no network work</text>

  <rect x="306" y="118" width="190" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="401" y="158" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Sidecar</text>
  <text x="401" y="186" font-size="20" fill="#334155" text-anchor="middle">same binary</text>

  
  <rect x="780" y="60" width="470" height="230" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="802" y="96" font-size="20" font-weight="700" fill="#475569">One Inventory instance (Python)</text>

  <rect x="804" y="118" width="190" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="899" y="158" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Sidecar</text>
  <text x="899" y="186" font-size="20" fill="#334155" text-anchor="middle">same binary</text>

  <line x1="996" y1="163" x2="1034" y2="163" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="1016" y="240" font-size="20" fill="#334155" text-anchor="middle">plaintext, over localhost</text>
  <text x="1016" y="266" font-size="20" fill="#334155" text-anchor="middle">the app does no network work</text>

  <rect x="1036" y="118" width="190" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="1131" y="158" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Inventory</text>
  <text x="1131" y="186" font-size="20" fill="#334155" text-anchor="middle">business logic</text>

  
  <line x1="504" y1="163" x2="796" y2="163" stroke="#1E3A8A" stroke-width="3" marker-end="url(#b)" marker-start="url(#bs)"/>
  <text x="650" y="202" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">mutual TLS</text>
  <text x="650" y="232" font-size="20" fill="#334155" text-anchor="middle">the only hop that</text>
  <text x="650" y="260" font-size="20" fill="#334155" text-anchor="middle">leaves the machine:</text>
  <text x="650" y="288" font-size="20" fill="#334155" text-anchor="middle">timeouts, retries,</text>
  <text x="650" y="316" font-size="20" fill="#334155" text-anchor="middle">breaking, metrics, traces</text>

  
  <rect x="50" y="356" width="1200" height="86" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="76" y="392" font-size="20" font-weight="700" fill="#92400E">Repeated per instance, not per service:</text>
  <text x="76" y="424" font-size="20" fill="#334155">11 services x 40 instances = 440 sidecars, about 50 MB each, about 22 GB of fleet memory spent on networking.</text>

  
  <text x="50" y="506" font-size="20" font-weight="700" fill="#0F172A">East-west traffic has hundreds of entrances, so the proxy goes to every instance instead of the traffic going</text>
  <text x="50" y="536" font-size="20" font-weight="700" fill="#0F172A">to one proxy. Because it is a process and not a library, Go and Python get identical behavior, and a new retry</text>
  <text x="50" y="566" font-size="20" font-weight="700" fill="#0F172A">policy ships by rolling the sidecar fleet with zero application deploys.</text>
</svg>