<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1070" viewBox="0 0 1240 1070" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: you announce a plan of six steps in order, the room redirects you to skip ahead and go deep on consistency, you move to step 4 and stay there for the 7 to 10 minute depth step, then state a visible timebox on two boundaries, and the room agrees, so no time is lost arguing.">
  <defs>
    <marker id="m07-l01-handling-redirects-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l01-handling-redirects-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l01-handling-redirects-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l01-handling-redirects-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1070" fill="#FFFFFF"/>

  <rect x="40" y="200" width="1150" height="200" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="430" width="1150" height="130" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="590" width="1150" height="200" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="340" y1="185" x2="340" y2="800"/>
    <line x1="950" y1="185" x2="950" y2="800"/>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M346,300 L944,300" stroke="#3B82F6" marker-end="url(#m07-l01-handling-redirects-bl)"/>
    <path d="M944,360 L346,360" stroke="#475569" stroke-width="2" marker-end="url(#m07-l01-handling-redirects-sl)"/>
    <path d="M346,530 L944,530" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l01-handling-redirects-bl)"/>
    <path d="M346,690 L944,690" stroke="#3B82F6" marker-end="url(#m07-l01-handling-redirects-bl)"/>
    <path d="M944,750 L346,750" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l01-handling-redirects-em)"/>
  </g>

  <text x="60" y="240" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Announce the plan in the first minute</text>
  <text x="1170" y="240" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">it invites the redirect early</text>
  <text x="60" y="470" font-size="20" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Follow the energy in the room</text>
  <text x="1170" y="470" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the framework is a map, not a script</text>
  <text x="60" y="630" font-size="20" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Timebox visibly</text>
  <text x="1170" y="630" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">an unfinished step 4 costs more than a rushed step 2</text>

  <text x="645" y="288" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Here is my plan, six steps in this order</text>
  <text x="645" y="348" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Skip ahead, go deep on consistency</text>
  <text x="645" y="518" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Moves to step 4 and stays there</text>
  <text x="645" y="678" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">I will fix these two boundaries and revisit</text>
  <text x="645" y="738" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Agrees, so no time is lost arguing</text>

  <g filter="url(#m07-l01-handling-redirects-soft)">
    <rect x="190" y="60" width="300" height="115" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="340" y="108.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">You</text>
  <text x="340" y="140.5" text-anchor="middle" font-size="20" fill="#64748B">drive the six steps</text>
  <g filter="url(#m07-l01-handling-redirects-soft)">
    <rect x="800" y="60" width="300" height="115" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="950" y="108.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The room</text>
  <text x="950" y="140.5" text-anchor="middle" font-size="20" fill="#64748B">sets where depth is wanted</text>

  <g filter="url(#m07-l01-handling-redirects-soft)">
    <rect x="60" y="830" width="540" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="330" y="892" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The mistake: fighting for the agenda</text>
  <g filter="url(#m07-l01-handling-redirects-soft)">
    <rect x="650" y="830" width="530" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="915" y="892" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The result: depth where it was wanted</text>

  <line x1="60" y1="980" x2="96" y2="980" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="987" font-size="20" fill="#475569">What you say</text>
  <line x1="60" y1="1020" x2="96" y2="1020" stroke="#475569" stroke-width="4"/>
  <text x="108" y="1027" font-size="20" fill="#475569">What comes back at you</text>
  <line x1="60" y1="1060" x2="96" y2="1060" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1067" font-size="20" fill="#475569">Agreement, reached without argument</text>
</svg>