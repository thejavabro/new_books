<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" role="img" aria-label="The write path and the read path. Shortening runs at about 200 requests a second: the shortening service inserts one row into the URL database, using a key it already holds from the key generation service. Redirecting runs at 20,000 requests a second through the redirect service and a cache, reaching the database only on a miss. One request in a hundred is a write, so everything expensive belongs on the read path.">
