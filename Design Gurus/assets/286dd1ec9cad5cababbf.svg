<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A subclass may accept more than its parent but never less, and may promise more than its parent but never less">
  <defs>
    <filter id="lpp-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lpp-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="lpp-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lpp-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <clipPath id="lpp-p1"><rect x="200" y="110" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lpp-a1"><rect x="60" y="300" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="lpp-a2"><rect x="350" y="300" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="lpp-p2"><rect x="800" y="110" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lpp-b1"><rect x="660" y="300" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="lpp-b2"><rect x="950" y="300" width="230" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="670" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Preconditions: what the caller must provide</text>

  <g fill="none" stroke-width="2">
    <path d="M215,200 V253 Q215,265 203,265 H187 Q175,265 175,277 V294" stroke="#059669" marker-end="url(#lpp-em)"/>
    <path d="M425,200 V253 Q425,265 437,265 H453 Q465,265 465,277 V294" stroke="#DB2777" marker-end="url(#lpp-pk)"/>
  </g>

  <g filter="url(#lpp-soft)">
    <rect x="200" y="110" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="200" y="110" width="6" height="90" fill="#64748B" clip-path="url(#lpp-p1)"/>
  </g>
  <circle cx="238" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/><path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="264" y="162" font-size="18.5" font-weight="600" fill="#111827">Discount</text>
  <text x="320" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">any positive amount</text>

  <g filter="url(#lpp-soft)">
    <rect x="60" y="300" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="60" y="300" width="6" height="90" fill="#059669" clip-path="url(#lpp-a1)"/>
  </g>
  <circle cx="98" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,334.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="124" y="352" font-size="18.5" font-weight="600" fill="#111827">Accepts more</text>
  <text x="175" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">also takes zero</text>
  <text x="175" y="438" font-size="15.5" text-anchor="middle" fill="#047857">every old caller still works</text>

  <g filter="url(#lpp-lift)">
    <rect x="350" y="300" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="350" y="300" width="9" height="90" fill="#DB2777" clip-path="url(#lpp-a2)"/>
  </g>
  <circle cx="390" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(379.56,334.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="416" y="352" font-size="18.5" font-weight="600" fill="#111827">Accepts less</text>
  <text x="465" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">rejects 100 and above</text>
  <text x="465" y="438" font-size="15.5" text-anchor="middle" fill="#BE185D">a valid call now fails</text>

  
  <rect x="640" y="40" width="560" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#475569">Postconditions: what the method guarantees</text>

  <g fill="none" stroke-width="2">
    <path d="M815,200 V253 Q815,265 803,265 H787 Q775,265 775,277 V294" stroke="#059669" marker-end="url(#lpp-em)"/>
    <path d="M1025,200 V253 Q1025,265 1037,265 H1053 Q1065,265 1065,277 V294" stroke="#DB2777" marker-end="url(#lpp-pk)"/>
  </g>

  <g filter="url(#lpp-soft)">
    <rect x="800" y="110" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="800" y="110" width="6" height="90" fill="#64748B" clip-path="url(#lpp-p2)"/>
  </g>
  <circle cx="838" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/><path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="864" y="162" font-size="18.5" font-weight="600" fill="#111827">Account</text>
  <text x="920" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">balance never negative</text>

  <g filter="url(#lpp-soft)">
    <rect x="660" y="300" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="660" y="300" width="6" height="90" fill="#059669" clip-path="url(#lpp-b1)"/>
  </g>
  <circle cx="698" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,334.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="724" y="352" font-size="18.5" font-weight="600" fill="#111827">Promises more</text>
  <text x="775" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">never below the fee</text>
  <text x="775" y="438" font-size="15.5" text-anchor="middle" fill="#047857">every old caller still works</text>

  <g filter="url(#lpp-lift)">
    <rect x="950" y="300" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="950" y="300" width="9" height="90" fill="#DB2777" clip-path="url(#lpp-b2)"/>
  </g>
  <circle cx="990" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(979.56,334.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="1016" y="352" font-size="18.5" font-weight="600" fill="#111827">Promises less</text>
  <text x="1065" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">balance may go negative</text>
  <text x="1065" y="438" font-size="15.5" text-anchor="middle" fill="#BE185D">no error, just a wrong result</text>

  
  <rect x="40" y="510" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="534" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="556" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Widen, never narrow</text>
  <text x="288" y="556" font-size="15.5" fill="#475569">a subclass may ask less of its callers and offer them more, in both cases safely</text>
  <rect x="64" y="578" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="600" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The quiet direction</text>
  <text x="288" y="600" font-size="15.5" fill="#475569">promising less breaks callers without throwing, which is why it survives code review</text>
</svg>