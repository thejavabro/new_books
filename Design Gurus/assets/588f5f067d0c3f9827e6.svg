<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The client sends SYN to ask for a connection. The server replies with SYN-ACK. The client sends ACK, and the connection is open. Then data flows. The handshake costs one round trip.">
  <defs>
    <filter id="tu1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="tu1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="tu1-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="tu1-k2"><rect x="654" y="320" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="tu1-k3"><rect x="64" y="460" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="tu1-k4"><rect x="40" y="740" width="1160" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="1030" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The TCP three-way handshake</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Follow the numbers. Data can move only after the connection is open.</text>

  <rect x="40" y="120" width="570" height="580" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Client</text>
  <rect x="630" y="120" width="570" height="580" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Server</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#tu1-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#tu1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">1. SYN</text>
  <text x="325" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">"can we open a connection?"</text>
  <g filter="url(#tu1-soft)">
    <rect x="654" y="320" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="320" width="6" height="90" fill="#2563EB" clip-path="url(#tu1-k2)"/>
  </g>
  <circle cx="692" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,354.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="718" y="372" font-size="21.5" font-weight="600" fill="#111827">2. SYN-ACK</text>
  <text x="915" y="439" font-size="18.5" text-anchor="middle" fill="#6B7280">"yes, and I got your request"</text>
  <g filter="url(#tu1-soft)">
    <rect x="64" y="460" width="522" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="460" width="6" height="90" fill="#64748B" clip-path="url(#tu1-k3)"/>
  </g>
  <circle cx="102" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,494.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="128" y="512" font-size="21.5" font-weight="600" fill="#111827">3. ACK</text>
  <text x="325" y="579" font-size="18.5" text-anchor="middle" fill="#6B7280">"I got your reply"</text>
  <g filter="url(#tu1-lift)">
    <rect x="40" y="740" width="1160" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="740" width="9" height="90" fill="#059669" clip-path="url(#tu1-k4)"/>
  </g>
  <circle cx="78" cy="785" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,774.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="792" font-size="21.5" font-weight="600" fill="#111827">4. Connection open: data can flow</text>
  <text x="620" y="859" font-size="18.5" text-anchor="middle" fill="#6B7280">the handshake cost one round trip</text>

  <rect x="40" y="900" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="925" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="950" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Round trip</text>
  <text x="323" y="950" font-size="18.5" fill="#475569">with 100 ms per round trip, the first request waits about 100 ms</text>
</svg>