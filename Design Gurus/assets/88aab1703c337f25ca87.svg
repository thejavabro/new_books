<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A user writes a new name to the primary, then reads the same field. The read is answered by a copy that has not received the change yet, so the page shows the old value.">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="rr4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rr4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rr4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rr4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rr4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rr4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rr4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rr4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The user does not see their own change</text>
  <g filter="url(#rr4-soft)"><rect x="60" y="200" width="170" height="84" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="145" y="250" font-size="20" fill="#0F172A" text-anchor="middle">user</text>
  <line x1="234" y1="222" x2="474" y2="172" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#rr4-s)"/>
  <rect x="258.5" y="174" width="191" height="30" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="354" y="190" font-size="18" fill="#0F172A" text-anchor="middle">1. write name = Ana</text>
  <line x1="234" y1="262" x2="474" y2="322" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#rr4-s)"/>
  <rect x="245" y="284" width="218" height="30" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="354" y="300" font-size="18" fill="#0F172A" text-anchor="middle">2. read the same field</text>
  <g filter="url(#rr4-soft)"><rect x="480" y="126" width="260" height="92" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="610" y="164" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">primary</text>
  <text x="610" y="196" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">name = Ana</text>
  <line x1="610" y1="224" x2="610" y2="288" stroke="#CBD5E1" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#rr4-g)"/>
  <text x="646" y="262" font-size="18" fill="#64748B" text-anchor="start">the change is still on its way</text>
  <g filter="url(#rr4-soft)"><rect x="480" y="292" width="260" height="92" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="610" y="330" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">copy</text>
  <text x="610" y="362" font-size="19" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">name = Bob</text>
  <g filter="url(#rr4-soft)"><rect x="860" y="126" width="320" height="92" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1020" y="164" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">replication lag</text>
  <text x="1020" y="196" font-size="18" fill="#0F172A" text-anchor="middle">the copy is 200 ms behind</text>
  <line x1="746" y1="338" x2="854" y2="338" stroke="#DC2626" stroke-width="2.2" marker-end="url(#rr4-r)"/>
  <text x="800" y="320" font-size="18" fill="#64748B" text-anchor="middle">3. answer</text>
  <g filter="url(#rr4-soft)"><rect x="860" y="292" width="320" height="92" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1020" y="330" font-size="19" fill="#0F172A" text-anchor="middle">the page shows</text>
  <text x="1020" y="362" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">name = Bob</text>
  <rect x="60" y="408" width="1120" height="52" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="440" font-size="19" fill="#64748B" text-anchor="middle">The write went to the primary. The read went to a copy that is 200 ms behind.</text>
</svg>