  <text x="128" y="512" font-size="18.5" fill="#6B7280">(repositories, DAOs)</text>
  <text x="128" y="642" font-size="18.5" fill="#6B7280">(PostgreSQL, MongoDB, and so on)</text>
  <text x="88" y="944" font-size="19.5" font-weight="600" fill="#1D4ED8">(inbound)</text>
  <text x="870" y="944" font-size="19.5" font-weight="600" fill="#1D4ED8">(outbound)</text>
  <text x="144" y="1056" font-size="18.5" fill="#6B7280">(HTTP requests)</text>
  <text x="144" y="1166" font-size="18.5" fill="#6B7280">(command line)</text>
  <text x="144" y="1276" font-size="18.5" fill="#6B7280">(events)</text>
  <text x="926" y="1056" font-size="18.5" fill="#6B7280">(PostgreSQL, MongoDB)</text>
  <text x="926" y="1166" font-size="18.5" fill="#6B7280">(Stripe, PayPal)</text>
  <text x="926" y="1276" font-size="18.5" fill="#6B7280">(Email, SMS, Slack)</text>

  <path d="M500,202 V262" stroke="#94A3B8" stroke-width="2"/>
  <text x="524" y="239" font-size="18.5" fill="#1F2937">Handles user requests and responses.</text>
  <path d="M500,332 V392" stroke="#94A3B8" stroke-width="2"/>
  <text x="524" y="369" font-size="18.5" fill="#1F2937">Contains business logic and owns its repository and gateway interfaces.</text>
  <path d="M500,462 V522" stroke="#94A3B8" stroke-width="2"/>
  <text x="524" y="499" font-size="18.5" fill="#1F2937">Handles data access and depends on the database.</text>
  <path d="M500,592 V652" stroke="#94A3B8" stroke-width="2"/>
  <text x="524" y="629" font-size="18.5" fill="#1F2937">Stores data.</text>
