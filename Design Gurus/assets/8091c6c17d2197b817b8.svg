  <text x="620" y="727" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">The stack still has a top and a bottom.</text>
  <text x="620" y="755" text-anchor="middle" font-size="18.5" fill="#475569">The UI is the only entry point on top, and data access sits at the bottom.</text>
  <path d="M450,900 V1322 M790,900 V1322" stroke="#64748B" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
  <g font-size="19.5" font-weight="600" text-anchor="middle" fill="#475569">
    <text x="450" y="1356">Driving ports</text><text x="450" y="1382">(inbound)</text>
    <text x="790" y="1356">Driven ports</text><text x="790" y="1382">(outbound)</text>
  </g>
