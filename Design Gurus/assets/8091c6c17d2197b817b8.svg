  <text x="620" y="1243" text-anchor="middle" font-size="17" fill="#1F2937">Use cases</text>
  <rect x="64" y="1420" width="1112" height="80" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1453" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">Dependencies point inward to the domain.</text>
  <text x="620" y="1481" text-anchor="middle" font-size="18.5" fill="#475569">The domain is independent of infrastructure, which is accessed through ports.</text>


