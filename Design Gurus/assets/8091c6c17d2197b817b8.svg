  <text x="64" y="858" font-size="19.5" font-weight="600" fill="#475569">Hexagonal architecture</text>
  <rect x="64" y="888" width="330" height="434" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="918" font-size="19.5" font-weight="600" fill="#1D4ED8">Driving adapters</text>
