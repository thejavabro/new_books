<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1564" viewBox="0 0 1240 1564" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Layered architecture: the presentation layer (controllers, UI) depends on the business layer (services), which contains business logic and owns its repository and gateway interfaces; the data access layer (repositories, DAOs) implements those interfaces and depends on the database; the stack still has a top and a bottom. Hexagonal architecture: web and REST, CLI and message queue driving (inbound) adapters depend on the domain through driving ports, and database, payment and notification driven (outbound) adapters depend on it through driven ports; dependencies point inward to the domain">
