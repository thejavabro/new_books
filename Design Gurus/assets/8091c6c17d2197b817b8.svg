  <rect x="0" y="0" width="1240" height="1564" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Layered architecture vs. hexagonal architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Arrows show dependencies: the layered stack keeps a top and a bottom, while every hexagonal arrow points inward.</text>

