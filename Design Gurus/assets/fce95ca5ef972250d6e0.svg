<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1160" viewBox="0 0 1240 1160" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The published ride state machine: every current state, the state it may move to next, and which actor is allowed to make that transition.">
  <defs>
    <filter id="p3z-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3z-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3z-k1"><rect x="80" y="178" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="p3z-k2"><rect x="640" y="178" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="p3z-k3"><rect x="80" y="352" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="p3z-k4"><rect x="640" y="352" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="p3z-k5"><rect x="80" y="526" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="p3z-k6"><rect x="640" y="526" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="p3z-k7"><rect x="360" y="700" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="p3z-k8"><rect x="80" y="874" width="520" height="48" rx="10"/></clipPath>
    <clipPath id="p3z-k9"><rect x="640" y="874" width="520" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1160" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The published ride state machine</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">six states, seven allowed transitions</text>

  
  <rect x="40" y="126" width="1160" height="150" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Current state: searching</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two allowed next states</text>

  <g filter="url(#p3z-soft)">
    <rect x="80" y="178" width="520" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="178" width="6" height="48" fill="#2563EB" clip-path="url(#p3z-k1)"/>
  </g>
  <circle cx="114" cy="202" r="15" fill="#FFFFFF"/>
  <g transform="translate(105,193) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="138" y="209" font-size="18.5" font-weight="600" fill="#111827">driver_assigned</text>
  <text x="340" y="251" text-anchor="middle" font-size="15.5" fill="#6B7280">Actor: Dispatch service</text>

  <g filter="url(#p3z-soft)">
    <rect x="640" y="178" width="520" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="640" y="178" width="6" height="48" fill="#DB2777" clip-path="url(#p3z-k2)"/>
  </g>
  <circle cx="674" cy="202" r="15" fill="#FFFFFF"/>
  <g transform="translate(665,193) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="698" y="209" font-size="18.5" font-weight="600" fill="#111827">cancelled</text>
  <text x="900" y="251" text-anchor="middle" font-size="15.5" fill="#6B7280">Actor: Rider or search timeout</text>

  
  <rect x="40" y="300" width="1160" height="150" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="330" font-size="16.5" font-weight="600" fill="#4338CA">Current state: driver_assigned</text>
  <text x="1176" y="330" text-anchor="end" font-size="15.5" fill="#6B7280">two allowed next states</text>

  <g filter="url(#p3z-soft)">
    <rect x="80" y="352" width="520" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="352" width="6" height="48" fill="#2563EB" clip-path="url(#p3z-k3)"/>
  </g>
  <circle cx="114" cy="376" r="15" fill="#FFFFFF"/>
  <g transform="translate(105,367) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="138" y="383" font-size="18.5" font-weight="600" fill="#111827">arriving</text>
  <text x="340" y="425" text-anchor="middle" font-size="15.5" fill="#6B7280">Actor: Assigned driver</text>

  <g filter="url(#p3z-soft)">
    <rect x="640" y="352" width="520" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="640" y="352" width="6" height="48" fill="#DB2777" clip-path="url(#p3z-k4)"/>
  </g>
  <circle cx="674" cy="376" r="15" fill="#FFFFFF"/>
  <g transform="translate(665,367) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="698" y="383" font-size="18.5" font-weight="600" fill="#111827">cancelled</text>
  <text x="900" y="425" text-anchor="middle" font-size="15.5" fill="#6B7280">Actor: Rider or authorized service</text>

  
  <rect x="40" y="474" width="1160" height="150" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="504" font-size="16.5" font-weight="600" fill="#5B21B6">Current state: arriving</text>
  <text x="1176" y="504" text-anchor="end" font-size="15.5" fill="#6B7280">two allowed next states</text>

  <g filter="url(#p3z-soft)">
    <rect x="80" y="526" width="520" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="526" width="6" height="48" fill="#2563EB" clip-path="url(#p3z-k5)"/>
  </g>
  <circle cx="114" cy="550" r="15" fill="#FFFFFF"/>
  <g transform="translate(105,541) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="138" y="557" font-size="18.5" font-weight="600" fill="#111827">in_progress</text>
  <text x="340" y="599" text-anchor="middle" font-size="15.5" fill="#6B7280">Actor: Assigned driver</text>

  <g filter="url(#p3z-soft)">
    <rect x="640" y="526" width="520" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="640" y="526" width="6" height="48" fill="#DB2777" clip-path="url(#p3z-k6)"/>
  </g>
  <circle cx="674" cy="550" r="15" fill="#FFFFFF"/>
  <g transform="translate(665,541) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="698" y="557" font-size="18.5" font-weight="600" fill="#111827">cancelled</text>
  <text x="900" y="599" text-anchor="middle" font-size="15.5" fill="#6B7280">Actor: Rider or authorized service</text>

  
  <rect x="40" y="648" width="1160" height="150" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="678" font-size="16.5" font-weight="600" fill="#047857">Current state: in_progress</text>
  <text x="1176" y="678" text-anchor="end" font-size="15.5" fill="#6B7280">one allowed next state</text>

  <g filter="url(#p3z-lift)">
    <rect x="360" y="700" width="520" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="360" y="700" width="9" height="48" fill="#059669" clip-path="url(#p3z-k7)"/>
  </g>
  <circle cx="394" cy="724" r="15" fill="#FFFFFF"/>
  <g transform="translate(385,715) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="418" y="731" font-size="18.5" font-weight="600" fill="#111827">completed</text>
  <text x="620" y="773" text-anchor="middle" font-size="15.5" fill="#6B7280">Actor: Assigned driver</text>

  
  <rect x="40" y="822" width="1160" height="173" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="852" font-size="16.5" font-weight="600" fill="#475569">Terminal states</text>
  <text x="1176" y="852" text-anchor="end" font-size="15.5" fill="#6B7280">no transitions out</text>

  <g filter="url(#p3z-soft)">
    <rect x="80" y="874" width="520" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="874" width="6" height="48" fill="#059669" clip-path="url(#p3z-k8)"/>
  </g>
  <circle cx="114" cy="898" r="15" fill="#FFFFFF"/>
  <g transform="translate(105,889) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="138" y="905" font-size="18.5" font-weight="600" fill="#111827">completed</text>
  <text x="340" y="947" text-anchor="middle" font-size="15.5" fill="#6B7280">Allowed next state: none</text>
  <text x="340" y="970" text-anchor="middle" font-size="15.5" fill="#94A3B8">Terminal</text>

  <g filter="url(#p3z-soft)">
    <rect x="640" y="874" width="520" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="640" y="874" width="6" height="48" fill="#DB2777" clip-path="url(#p3z-k9)"/>
  </g>
  <circle cx="674" cy="898" r="15" fill="#FFFFFF"/>
  <g transform="translate(665,889) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="698" y="905" font-size="18.5" font-weight="600" fill="#111827">cancelled</text>
  <text x="900" y="947" text-anchor="middle" font-size="15.5" fill="#6B7280">Allowed next state: none</text>
  <text x="900" y="970" text-anchor="middle" font-size="15.5" fill="#94A3B8">Terminal</text>

  
  <rect x="40" y="1019" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1061" text-anchor="middle" font-size="16" fill="#475569">A state machine the caller can read is worth more than a list of endpoints.</text>
  <text x="620" y="1089" text-anchor="middle" font-size="16" fill="#475569">Each card is a state the ride may move to next, and the actor under it is the only party allowed to make that move.</text>
</svg>