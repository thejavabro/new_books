<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five HTTP methods, what each one means, what the caller asks for, and what happens if the same request is sent twice">
  <defs>
    <filter id="c2ru-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2ru-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="c2ru-k1"><rect x="95" y="92" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2ru-k2"><rect x="470" y="92" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2ru-k3"><rect x="845" y="92" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2ru-k4"><rect x="282" y="272" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2ru-k5"><rect x="657" y="272" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="400" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Five common methods for resource-oriented APIs</text>

  
  <g filter="url(#c2ru-lift)">
    <rect x="95" y="92" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="95" y="92" width="9" height="90" fill="#059669" clip-path="url(#c2ru-k1)"/>
  </g>
  <circle cx="133" cy="137" r="18" fill="#FFFFFF"/>
  <g transform="translate(122.56,126.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="159" y="144" font-size="18.5" font-weight="600" fill="#111827">GET<tspan dx="10">read it</tspan></text>
  <text x="245" y="207" font-size="15.5" text-anchor="middle" fill="#6B7280">asks for the current state</text>
  <text x="245" y="230" font-size="15.5" text-anchor="middle" fill="#94A3B8">no state change requested</text>

  
  <g filter="url(#c2ru-soft)">
    <rect x="470" y="92" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="92" width="6" height="90" fill="#2563EB" clip-path="url(#c2ru-k2)"/>
  </g>
  <circle cx="508" cy="137" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,126.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="534" y="144" font-size="18.5" font-weight="600" fill="#111827">POST<tspan dx="10">create it</tspan></text>
  <text x="620" y="207" font-size="15.5" text-anchor="middle" fill="#6B7280">often creates a collection member</text>
  <text x="620" y="230" font-size="15.5" text-anchor="middle" fill="#94A3B8">twice may create two</text>

  
  <g filter="url(#c2ru-soft)">
    <rect x="845" y="92" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="845" y="92" width="6" height="90" fill="#7C3AED" clip-path="url(#c2ru-k3)"/>
  </g>
  <circle cx="883" cy="137" r="18" fill="#FFFFFF"/>
  <g transform="translate(872.56,126.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="909" y="144" font-size="18.5" font-weight="600" fill="#111827">PUT<tspan dx="10">replace it</tspan></text>
  <text x="995" y="207" font-size="15.5" text-anchor="middle" fill="#6B7280">sends the whole new representation</text>
  <text x="995" y="230" font-size="15.5" text-anchor="middle" fill="#94A3B8">twice leaves one result</text>

  
  <g filter="url(#c2ru-soft)">
    <rect x="282" y="272" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="282" y="272" width="6" height="90" fill="#4F46E5" clip-path="url(#c2ru-k4)"/>
  </g>
  <circle cx="320" cy="317" r="18" fill="#FFFFFF"/>
  <g transform="translate(309.56,306.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="346" y="324" font-size="18.5" font-weight="600" fill="#111827">PATCH<tspan dx="10">change part of it</tspan></text>
  <text x="432" y="387" font-size="15.5" text-anchor="middle" fill="#6B7280">sends a defined set of changes</text>
  <text x="432" y="410" font-size="15.5" text-anchor="middle" fill="#94A3B8">depends on the fields</text>

  
  <g filter="url(#c2ru-soft)">
    <rect x="657" y="272" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="657" y="272" width="6" height="90" fill="#DB2777" clip-path="url(#c2ru-k5)"/>
  </g>
  <circle cx="695" cy="317" r="18" fill="#FFFFFF"/>
  <g transform="translate(684.56,306.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="721" y="324" font-size="18.5" font-weight="600" fill="#111827">DELETE<tspan dx="10">remove it</tspan></text>
  <text x="807" y="387" font-size="15.5" text-anchor="middle" fill="#6B7280">asks for it to be absent</text>
  <text x="807" y="410" font-size="15.5" text-anchor="middle" fill="#94A3B8">twice leaves it absent</text>

  
  <rect x="40" y="464" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="509" text-anchor="middle" font-size="16" fill="#475569">Learn them once for one resource, and you have learned them for all of them.</text>
</svg>