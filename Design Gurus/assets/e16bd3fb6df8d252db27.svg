  <text x="449" y="1518" font-size="18.5" font-weight="600" fill="#111827">13. Capstone: The Twitter API</text>
  <text x="620" y="1580" font-size="15.5" text-anchor="middle" fill="#6B7280">Can every convention hold inside one 45-minute answer?</text>

  
  <rect x="40" y="1628" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1670" text-anchor="middle" font-size="16" fill="#475569">Each decision is made once here, then reused by every later lesson and worked answer.</text>
  <text x="620" y="1700" text-anchor="middle" font-size="16" fill="#475569">The order matters: URLs are easier once resources are known, and paging once shapes are stable.</text>
