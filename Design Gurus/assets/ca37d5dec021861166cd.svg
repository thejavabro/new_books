<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" style="background-color:#ffffff">
<defs>
<marker id="ra" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#3a6fb0"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">

<text x="30" y="28" font-size="14" font-weight="bold" fill="#b4322c">One hierarchy: every pairing needs its own class</text>

<rect x="30" y="44" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="100" y="66" text-anchor="middle" font-size="11.5">EmailAlert</text>
<rect x="180" y="44" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="250" y="66" text-anchor="middle" font-size="11.5">SmsAlert</text>
<rect x="330" y="44" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="400" y="66" text-anchor="middle" font-size="11.5">PushAlert</text>

<rect x="30" y="86" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="100" y="108" text-anchor="middle" font-size="11.5">EmailReminder</text>
<rect x="180" y="86" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="250" y="108" text-anchor="middle" font-size="11.5">SmsReminder</text>
<rect x="330" y="86" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="400" y="108" text-anchor="middle" font-size="11.5">PushReminder</text>

<rect x="30" y="128" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="100" y="150" text-anchor="middle" font-size="11.5">EmailDigest</text>
<rect x="180" y="128" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="250" y="150" text-anchor="middle" font-size="11.5">SmsDigest</text>
<rect x="330" y="128" width="140" height="34" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="400" y="150" text-anchor="middle" font-size="11.5">PushDigest</text>

<text x="500" y="70" font-size="13" fill="#b4322c">3 types multiplied by 3 channels = 9 classes.</text>
<text x="500" y="94" font-size="13" fill="#b4322c">A fourth channel makes it 12. A fourth type makes it 16.</text>
<text x="500" y="118" font-size="13" fill="#b4322c">The giveaway is a class name with two nouns in it.</text>
<text x="500" y="146" font-size="13" fill="#b4322c">Every one of these duplicates either the message</text>
<text x="500" y="164" font-size="13" fill="#b4322c">building or the sending.</text>

<line x1="30" y1="196" x2="950" y2="196" stroke="#dbe2ed"/>

<text x="30" y="232" font-size="14" font-weight="bold" fill="#2f7a55">Two hierarchies with a reference between them: they add up instead</text>

<rect x="30" y="252" width="170" height="34" rx="3" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="115" y="274" text-anchor="middle" font-size="11.5">AlertNotification</text>
<rect x="30" y="294" width="170" height="34" rx="3" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="115" y="316" text-anchor="middle" font-size="11.5">ReminderNotification</text>
<rect x="30" y="336" width="170" height="34" rx="3" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="115" y="358" text-anchor="middle" font-size="11.5">DigestNotification</text>

<text x="115" y="392" text-anchor="middle" font-size="11.5" fill="#414d60">what the message is</text>

<rect x="290" y="294" width="130" height="34" rx="3" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="355" y="316" text-anchor="middle" font-family="monospace" font-size="11.5">channel</text>
<text x="355" y="348" text-anchor="middle" font-size="11" fill="#414d60">the bridge</text>

<rect x="510" y="252" width="150" height="34" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="585" y="274" text-anchor="middle" font-size="11.5">EmailChannel</text>
<rect x="510" y="294" width="150" height="34" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="585" y="316" text-anchor="middle" font-size="11.5">SmsChannel</text>
<rect x="510" y="336" width="150" height="34" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="585" y="358" text-anchor="middle" font-size="11.5">PushChannel</text>

<text x="585" y="392" text-anchor="middle" font-size="11.5" fill="#414d60">how it goes out</text>

<path d="M 200 311 L 285 311" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#ra)"/>
<path d="M 420 311 L 505 311" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#ra)"/>

<text x="700" y="278" font-size="13" fill="#2f7a55">3 plus 3 = 6 classes, and any pairing works.</text>
<text x="700" y="302" font-size="13" fill="#2f7a55">A fourth channel is one class, not four.</text>
<text x="700" y="326" font-size="13" fill="#2f7a55">The pairing is chosen at run time, so the</text>
<text x="700" y="344" font-size="13" fill="#2f7a55">same alert can go out by SMS in tests and</text>
<text x="700" y="362" font-size="13" fill="#2f7a55">by email in production.</text>
</g>
</svg>