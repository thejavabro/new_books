<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="636" viewBox="0 0 1240 636" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="stampede-title stampede-desc">
<title id="stampede-title">The miss window</title>
<desc id="stampede-desc">A key serving ten thousand requests per second expires. For the two hundred milliseconds it takes to recompute the value, nothing is cached, so two thousand requests all miss and all recompute the same value at once.</desc>
<defs>
<marker id="stampede-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="stampede-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="stampede-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="stampede-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="636" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The miss window</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A key serving ten thousand requests per second expires.</text>
<rect x="40" y="558" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="558" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="40" y="154" width="558" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="319" y="185" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cache HIT, 10,000 req/sec absorbed</text>
<rect x="602" y="136" width="196" height="86" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/>
<text x="700" y="170" font-size="22" font-weight="700" fill="#A83147" text-anchor="middle">200 ms</text>
<text x="700" y="198" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">no value cached</text>
<rect x="802" y="154" width="398" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1001" y="185" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">HIT again</text>
<text x="700" y="250" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">entry expires</text>
<rect x="40" y="278" width="1160" height="146" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 278H46A6 6 0 0 0 40 284V418A6 6 0 0 0 46 424H54Z" fill="#F3CF6A"/><text x="620" y="314" font-size="23" font-weight="700" fill="#91642E" text-anchor="middle">Every request arriving inside that window also misses</text>
<rect x="110" y="336" width="280" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="250" y="374" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">10,000 req/sec</text>
<text x="415" y="376" font-size="26" font-weight="700" fill="#080C50" text-anchor="middle">x</text>
<rect x="440" y="336" width="280" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="580" y="374" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">0.2 seconds</text>
<text x="745" y="376" font-size="26" font-weight="700" fill="#080C50" text-anchor="middle">=</text>
<rect x="770" y="336" width="360" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="950" y="374" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">2,000 recomputations</text>
<rect x="40" y="448" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="448" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="481" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Two thousand copies of one query, at the moment load was highest.</text><text x="64" y="507" font-size="19" font-weight="400" fill="#6040A8" text-anchor="start">Nothing about the traffic changed. The cache stopped protecting what it exists to protect.</text>
<text x="66" y="592" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">And it repeats. The next expiry arrives one period later, into a backend that may not have recovered.</text>
</svg>