<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The saga log records a row before each step runs and updates it when the step finishes. If the coordinator crashes while step three is still marked started, it restarts, asks the payment service whether the charge went through, and then either finishes the saga or compensates the earlier steps">
  <defs>
    <marker id="sg3-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="sg3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sg3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="sg3-k1"><rect x="72" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg3-k2"><rect x="364" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg3-k3"><rect x="656" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg3-k4"><rect x="948" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg3-k5"><rect x="72" y="448" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="sg3-k6"><rect x="480" y="448" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="sg3-k7"><rect x="888" y="448" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  
  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">The saga log: a row is written before a step runs, then updated when it finishes</text>

  <rect x="40" y="380" width="1160" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="16.5" font-weight="600" fill="#1D4ED8">On restart the coordinator reads the log and resolves the one unfinished step</text>

  
  <g fill="none" stroke="#DB2777" stroke-width="2.5">
    <path d="M620,296 L620,376" marker-end="url(#sg3-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="341" fill="#BE185D">the coordinator crashes here</text>
  </g>

  
  <g filter="url(#sg3-soft)">
    <rect x="72" y="112" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#059669" clip-path="url(#sg3-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Create Order</text>
  <text x="182" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">logged: DONE</text>
  <text x="182" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">result is known</text>

  <g filter="url(#sg3-soft)">
    <rect x="364" y="112" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="364" y="112" width="6" height="90" fill="#059669" clip-path="url(#sg3-k2)"/>
  </g>
  <circle cx="402" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(391.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="428" y="164" font-size="18.5" font-weight="600" fill="#111827">Reserve Stock</text>
  <text x="474" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">logged: DONE</text>
  <text x="474" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">result is known</text>

  <g filter="url(#sg3-lift)">
    <rect x="656" y="112" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="656" y="112" width="9" height="90" fill="#D97706" clip-path="url(#sg3-k3)"/>
  </g>
  <circle cx="694" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="720" y="164" font-size="18.5" font-weight="600" fill="#111827">Charge Card</text>
  <text x="766" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">logged: STARTED</text>
  <text x="766" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">no result written</text>

  <g filter="url(#sg3-soft)">
    <rect x="948" y="112" width="220" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="948" y="112" width="6" height="90" fill="#64748B" clip-path="url(#sg3-k4)"/>
  </g>
  <circle cx="986" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(975.56,146.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8 12h8"/>
  </g>
  <text x="1012" y="164" font-size="18.5" font-weight="600" fill="#111827">Book Shipping</text>
  <text x="1058" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">no row at all</text>
  <text x="1058" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">never started</text>

  
  <g filter="url(#sg3-lift)">
    <rect x="72" y="448" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="72" y="448" width="9" height="90" fill="#2563EB" clip-path="url(#sg3-k5)"/>
  </g>
  <circle cx="110" cy="493" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,482.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="136" y="500" font-size="18.5" font-weight="600" fill="#111827">Ask the Service</text>
  <text x="212" y="563" font-size="15.5" text-anchor="middle" fill="#6B7280">did charge 1234 go through?</text>
  <text x="212" y="586" font-size="15.5" text-anchor="middle" fill="#94A3B8">the only safe way to find out</text>

  <g filter="url(#sg3-soft)">
    <rect x="480" y="448" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="480" y="448" width="6" height="90" fill="#059669" clip-path="url(#sg3-k6)"/>
  </g>
  <circle cx="518" cy="493" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,482.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="544" y="500" font-size="18.5" font-weight="600" fill="#111827">It Did Charge</text>
  <text x="620" y="563" font-size="15.5" text-anchor="middle" fill="#6B7280">mark step 3 as DONE</text>
  <text x="620" y="586" font-size="15.5" text-anchor="middle" fill="#94A3B8">then carry on to step 4</text>

  <g filter="url(#sg3-soft)">
    <rect x="888" y="448" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="888" y="448" width="6" height="90" fill="#D97706" clip-path="url(#sg3-k7)"/>
  </g>
  <circle cx="926" cy="493" r="18" fill="#FFFFFF"/>
  <g transform="translate(915.56,482.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10h11a5 5 0 0 1 0 10h-6"/>
    <path d="M6.5 6.5L3 10l3.5 3.5"/>
  </g>
  <text x="952" y="500" font-size="18.5" font-weight="600" fill="#111827">It Did Not</text>
  <text x="1028" y="563" font-size="15.5" text-anchor="middle" fill="#6B7280">compensate steps 2 and 1</text>
  <text x="1028" y="586" font-size="15.5" text-anchor="middle" fill="#94A3B8">in reverse order</text>

  
  <rect x="40" y="662" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="686" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="708" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">STARTED</text>
  <text x="288" y="708" font-size="15.5" fill="#475569">the step ran but no result was recorded, so recovery has to ask before it decides anything</text>

  <rect x="64" y="730" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="752" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Idempotency key</text>
  <text x="288" y="752" font-size="15.5" fill="#475569">each charge carries a unique id, so asking again or retrying never takes the money twice</text>
</svg>