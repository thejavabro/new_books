<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="574" viewBox="0 0 1240 574" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="skew-title skew-desc">
<title id="skew-title">Lost update and write skew</title>
<desc id="skew-desc">In a lost update two transactions write the same row, so the collision is visible to the database. In write skew each transaction writes a different row after reading an overlapping set, so there is no single row where the conflict appears.</desc>
<defs>
<marker id="skew-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="skew-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="skew-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="skew-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="574" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Lost update and write skew</text>
<text x="40" y="86" font-size="21" fill="#4A5568">In a lost update two transactions write the same row, so the collision is visible to the database.</text>
<rect x="40" y="496" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="496" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="40" y="118" width="560" height="352" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V464A6 6 0 0 0 46 470H54Z" fill="#F3CF6A"/><text x="70" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Lost update: two writes, ONE row</text>
<text x="70" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rule: seats must not be oversold</text>
<rect x="72" y="196" width="244" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="86" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">A</text>
<text x="110" y="225" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">reads seats = 10</text>
<rect x="328" y="196" width="244" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="342" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">B</text>
<text x="366" y="225" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">reads seats = 10</text>
<rect x="72" y="246" width="244" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="86" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">A</text>
<text x="110" y="275" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">calculates 9</text>
<rect x="328" y="246" width="244" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="342" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">B</text>
<text x="366" y="275" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">calculates 9</text>
<rect x="72" y="296" width="244" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="86" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">A</text>
<text x="110" y="325" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">writes 9</text>
<rect x="328" y="296" width="244" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="342" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">B</text>
<text x="366" y="325" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">writes 9</text>
<rect x="72" y="352" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="380" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">seats = 9, two bookings sold</text>
<rect x="72" y="408" width="500" height="44" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="408" width="5" height="44" rx="2.5" fill="#39D5AA"/><text x="96" y="436" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">The database CAN see this collision</text>
<rect x="640" y="118" width="560" height="352" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V464A6 6 0 0 0 646 470H654Z" fill="#AC8BE8"/><text x="670" y="154" font-size="23" font-weight="700" fill="#6040A8" text-anchor="start">Write skew: two writes, TWO rows</text>
<text x="670" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rule: at least one doctor on call</text>
<rect x="672" y="196" width="244" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="686" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">A</text>
<text x="710" y="225" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">reads: both on call</text>
<rect x="928" y="196" width="244" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="942" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">B</text>
<text x="966" y="225" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">reads: both on call</text>
<rect x="672" y="246" width="244" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="686" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">A</text>
<text x="710" y="275" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">sees B is on call</text>
<rect x="928" y="246" width="244" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="942" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">B</text>
<text x="966" y="275" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">sees A is on call</text>
<rect x="672" y="296" width="244" height="44" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="686" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">A</text>
<text x="710" y="325" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">writes row A = off</text>
<rect x="928" y="296" width="244" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="942" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">B</text>
<text x="966" y="325" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">writes row B = off</text>
<rect x="672" y="352" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="380" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">nobody on call</text>
<rect x="672" y="408" width="500" height="44" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="672" y="408" width="5" height="44" rx="2.5" fill="#F28B9D"/><text x="696" y="436" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">No row was written twice to detect</text>
<text x="66" y="529" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Both transactions behaved correctly against what they read. Only the second one leaves the database nothing to catch.</text>
</svg>