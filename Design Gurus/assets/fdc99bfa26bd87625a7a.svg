<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four steps of a failover: detect, decide, switch, and restore. Users see errors during the first three steps. Restoring the failed part happens after users are served again.">
  <defs>
    <filter id="av5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="av5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="av5-k1"><rect x="52" y="160" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av5-k2"><rect x="348" y="160" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av5-k3"><rect x="644" y="160" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av5-k4"><rect x="950" y="160" width="250" height="90" rx="12"/></clipPath>
    <marker id="av5-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The four steps of a failover</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Users see errors only until traffic reaches a healthy copy.</text>

  <rect x="28" y="110" width="894" height="260" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="52" y="140" font-size="19.5" font-weight="600" fill="#BE185D">Users see errors during these three steps</text>

  <g fill="none" stroke-width="2">
    <path d="M302,205 H348" stroke="#64748B" marker-end="url(#av5-m-slate)"/>
    <path d="M598,205 H644" stroke="#64748B" marker-end="url(#av5-m-slate)"/>
    <path d="M894,205 H950" stroke="#64748B" marker-end="url(#av5-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#av5-soft)">
    <rect x="52" y="160" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="52" y="160" width="6" height="90" fill="#DB2777" clip-path="url(#av5-k1)"/>
  </g>
  <circle cx="90" cy="205" r="18" fill="#FFFFFF"/>
  <g transform="translate(79.56,194.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="116" y="212" font-size="21.5" font-weight="600" fill="#111827">1. Detect</text>
  <text x="177" y="279" font-size="18.5" text-anchor="middle" fill="#6B7280">health checks fail</text>
  <text x="177" y="306" font-size="18.5" text-anchor="middle" fill="#94A3B8">example: 3 misses x 5 s</text>
  <g filter="url(#av5-soft)">
    <rect x="348" y="160" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="348" y="160" width="6" height="90" fill="#64748B" clip-path="url(#av5-k2)"/>
  </g>
  <circle cx="386" cy="205" r="18" fill="#FFFFFF"/>
  <g transform="translate(375.56,194.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="412" y="212" font-size="21.5" font-weight="600" fill="#111827">2. Decide</text>
  <text x="473" y="279" font-size="18.5" text-anchor="middle" fill="#6B7280">pick a healthy copy</text>
  <text x="473" y="306" font-size="18.5" text-anchor="middle" fill="#94A3B8">or promote a replica</text>
  <g filter="url(#av5-soft)">
    <rect x="644" y="160" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="644" y="160" width="6" height="90" fill="#2563EB" clip-path="url(#av5-k3)"/>
  </g>
  <circle cx="682" cy="205" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,194.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="708" y="212" font-size="21.5" font-weight="600" fill="#111827">3. Switch</text>
  <text x="769" y="279" font-size="18.5" text-anchor="middle" fill="#6B7280">send traffic to it</text>
  <text x="769" y="306" font-size="18.5" text-anchor="middle" fill="#94A3B8">update LB or DNS</text>
  <g filter="url(#av5-soft)">
    <rect x="950" y="160" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="950" y="160" width="6" height="90" fill="#059669" clip-path="url(#av5-k4)"/>
  </g>
  <circle cx="988" cy="205" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,194.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1014" y="212" font-size="21.5" font-weight="600" fill="#111827">4. Restore</text>
  <text x="1075" y="279" font-size="18.5" text-anchor="middle" fill="#6B7280">fix the failed part</text>
  <text x="1075" y="306" font-size="18.5" text-anchor="middle" fill="#94A3B8">add it back as a copy</text>

  <rect x="40" y="400" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="425" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="450" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Downtime</text>
  <text x="323" y="450" font-size="18.5" fill="#475569">time to detect, decide and switch; automation keeps it to seconds</text>
  <rect x="64" y="475" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="500" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Restore</text>
  <text x="323" y="500" font-size="18.5" fill="#475569">fixing the failed part happens while users are already served</text>
</svg>