<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One question separates 401 from 403: would presenting a valid or refreshed credential solve the problem? If the answer is yes the code is 401 Unauthorized, covering a missing, malformed, expired, badly signed, or revoked credential. If the answer is no the code is 403 Forbidden, covering missing scope, wrong role, exhausted quota, or a tenant policy that refuses.">
  <defs>
    <marker id="p17-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p17-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p17-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p17-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p17-k1"><rect x="70" y="250" width="470" height="112" rx="12"/></clipPath>
    <clipPath id="p17-k2"><rect x="680" y="140" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="p17-k3"><rect x="680" y="380" width="440" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="520" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One question separates 401 from 403</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">the answer sits on the arrow, the examples sit under each code</text>

  
  <g fill="none" stroke-width="2">
    <path d="M540,285 H558 Q570,285 570,273 V197 Q570,185 582,185 H680" stroke="#059669" stroke-width="2.5" marker-end="url(#p17-em)"/>
    <path d="M540,327 H558 Q570,327 570,339 V413 Q570,425 582,425 H680" stroke="#DB2777" stroke-width="2.5" marker-end="url(#p17-pm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="630" y="171" fill="#047857">Yes</text>
    <text x="630" y="411" fill="#BE185D">No</text>
  </g>

  
  <g filter="url(#p17-lift)">
    <rect x="70" y="250" width="470" height="112" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="70" y="250" width="9" height="112" fill="#64748B" clip-path="url(#p17-k1)"/>
  </g>
  <circle cx="108" cy="306" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,295.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="134" y="299" font-size="18.5" font-weight="600" fill="#111827">Are valid authentication credentials</text>
  <text x="134" y="326" font-size="18.5" font-weight="600" fill="#111827">missing or invalid for this resource?</text>
  <text x="305" y="399" font-size="15.5" text-anchor="middle" fill="#6B7280">ask this one question before choosing the code</text>

  
  <g filter="url(#p17-soft)">
    <rect x="680" y="140" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="680" y="140" width="6" height="90" fill="#D97706" clip-path="url(#p17-k2)"/>
  </g>
  <circle cx="718" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="744" y="192" font-size="18.5" font-weight="600" fill="#111827">401 Unauthorized</text>
  <text x="900" y="255" font-size="15.5" text-anchor="middle" fill="#6B7280">No credential, malformed credential, expired access token,</text>
  <text x="900" y="278" font-size="15.5" text-anchor="middle" fill="#94A3B8">invalid signature, revoked opaque token</text>

  
  <g filter="url(#p17-soft)">
    <rect x="680" y="380" width="440" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="680" y="380" width="6" height="90" fill="#DB2777" clip-path="url(#p17-k3)"/>
  </g>
  <circle cx="718" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,414.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="744" y="432" font-size="18.5" font-weight="600" fill="#111827">403 Forbidden</text>
  <text x="900" y="495" font-size="15.5" text-anchor="middle" fill="#6B7280">Missing scope, wrong role, quota exhausted, tenant policy</text>
  <text x="900" y="518" font-size="15.5" text-anchor="middle" fill="#94A3B8">refuses, or the action is simply not permitted</text>

  
  <rect x="40" y="584" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="629" text-anchor="middle" font-size="16" fill="#475569">In this course 401 means authentication is needed, 403 means the known identity is not allowed.</text>
</svg>