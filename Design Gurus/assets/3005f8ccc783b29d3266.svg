<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="848" viewBox="0 0 1240 848" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cost-title cost-desc">
<title id="cost-title">Cost, the rejection, the signals</title>
<desc id="cost-desc">The design fits the ceiling with headroom. Naming the cheaper design that was rejected is what proves the expensive one was chosen.</desc>
<defs>
<marker id="cost-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="cost-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="cost-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="cost-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="848" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Cost, the rejection, the signals</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Naming the cheaper design that was rejected is what proves the expensive one was chosen.</text>
<rect x="40" y="770" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="770" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="148" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Against an eighteen thousand ceiling</text>
<rect x="40" y="164" width="1160" height="42" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="192" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">European application tier, sized to serve everything</text><text x="1184" y="192" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~5,200</text>
<rect x="40" y="214" width="1160" height="42" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="56" y="242" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">European read replica</text><text x="1184" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~4,100</text>
<rect x="40" y="264" width="1160" height="42" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="292" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">European cache</text><text x="1184" y="292" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~900</text>
<rect x="40" y="314" width="1160" height="42" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="56" y="342" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">cross-region replication transfer</text><text x="1184" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~2,400</text>
<rect x="40" y="364" width="1160" height="42" rx="9" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="56" y="392" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">observability on the second region</text><text x="1184" y="392" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~600</text>
<rect x="40" y="424" width="1160" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="455" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">about 13,200 of an 18,000 budget, with headroom</text>
<rect x="40" y="492" width="560" height="100" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="492" width="5" height="100" rx="2.5" fill="#F3CF6A"/><text x="64" y="522" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The line that grows</text><text x="64" y="548" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">transfer scales with write volume, not with the size</text><text x="64" y="574" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">of the second region. It is measured in bytes</text>
<rect x="640" y="492" width="560" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="492" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="664" y="522" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The rejected cheaper design</text><text x="664" y="548" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a warm standby with no European serving, about 5,000.</text><text x="664" y="574" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Meets the objective, does nothing for latency</text>
<text x="40" y="632" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three signals, and the one that matters most</text>
<rect x="40" y="648" width="372" height="96" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="648" width="5" height="96" rx="2.5" fill="#F28B9D"/><text x="64" y="676" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Replication lag,</text><text x="64" y="702" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">as a time value</text><text x="64" y="728" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">page above thirty seconds</text>
<rect x="434" y="648" width="372" height="96" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="434" y="648" width="5" height="96" rx="2.5" fill="#5EC9EC"/><text x="458" y="676" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Share of European reads</text><text x="458" y="702" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">served locally</text><text x="458" y="728" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is the win landing</text>
<rect x="828" y="648" width="372" height="96" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="828" y="648" width="5" height="96" rx="2.5" fill="#39D5AA"/><text x="852" y="676" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Read-after-write anomalies</text><text x="852" y="702" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">counted, not inferred</text><text x="852" y="728" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">from complaints</text>
<text x="66" y="804" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A broken replication link stops the lag clock and nobody notices.</text>
</svg>