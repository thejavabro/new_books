<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of a monolith extraction. The monolith moves to a shared reads stage when a service is extracted but still reads monolith tables, then to its own store once data is copied over and events are wired up, then to fully extracted once the shared reads are deleted. If no end date is agreed, the shared reads stage becomes a distributed monolith.">
  <defs>
    <marker id="m05-l01-extraction-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l01-extraction-states-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l01-extraction-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l01-extraction-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l01-extraction-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  <rect x="50" y="90" width="1140" height="290" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="130" font-size="20" font-weight="600" fill="#334155">Intended path: shared reads are a stage with an end date</text>
  <text x="1170" y="130" text-anchor="end" font-size="20" fill="#64748B">not done until they are gone</text>

  <g fill="none" stroke-width="2.5">
    <path d="M84,285 L97,285" stroke="#475569" stroke-width="2" marker-end="url(#m05-l01-extraction-states-sl)"/>
    <path d="M325,285 L387,285" stroke="#475569" stroke-width="2" marker-end="url(#m05-l01-extraction-states-sl)"/>
    <path d="M615,285 L677,285" stroke="#D97706" marker-end="url(#m05-l01-extraction-states-ab)"/>
    <path d="M905,285 L952,285" stroke="#059669" marker-end="url(#m05-l01-extraction-states-em)"/>
    <path d="M505,340 L505,432" stroke="#DC2626" marker-end="url(#m05-l01-extraction-states-rd)"/>
  </g>

  <text x="356" y="175" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">service extracted,</text>
  <text x="356" y="201" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">still reads the tables</text>
  <text x="646" y="175" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">data copied over,</text>
  <text x="646" y="201" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">events wired up</text>
  <text x="932" y="188" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">shared reads deleted</text>
  <text x="522" y="400" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no end date agreed</text>

  <circle cx="72" cy="285" r="12" fill="#475569"/>

  <g filter="url(#m05-l01-extraction-states-soft)">
    <rect x="105" y="230" width="220" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="215" y="276" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Monolith</text>
  <text x="215" y="308" text-anchor="middle" font-size="20" fill="#64748B">the starting point</text>
  <g filter="url(#m05-l01-extraction-states-soft)">
    <rect x="395" y="230" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="505" y="276" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shared reads</text>
  <text x="505" y="308" text-anchor="middle" font-size="20" fill="#64748B">transitional stage</text>
  <g filter="url(#m05-l01-extraction-states-soft)">
    <rect x="685" y="230" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="795" y="276" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Own store</text>
  <text x="795" y="308" text-anchor="middle" font-size="20" fill="#64748B">events feed the copy</text>
  <g filter="url(#m05-l01-extraction-states-soft)">
    <rect x="960" y="230" width="220" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1070" y="276" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Extracted</text>
  <text x="1070" y="308" text-anchor="middle" font-size="20" fill="#64748B">the extraction is done</text>

  <g filter="url(#m05-l01-extraction-states-soft)">
    <rect x="390" y="440" width="340" height="170" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="560" y="500" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Distributed monolith</text>
  <text x="560" y="532" text-anchor="middle" font-size="20" fill="#64748B">split on the diagram,</text>
  <text x="560" y="564" text-anchor="middle" font-size="20" fill="#64748B">still released as one piece</text>
  <g filter="url(#m05-l01-extraction-states-soft)">
    <rect x="760" y="440" width="420" height="170" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="970" y="484" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The sentence to use</text>
  <text x="970" y="516" text-anchor="middle" font-size="20" fill="#0F172A">"Shared reads are transitional</text>
  <text x="970" y="548" text-anchor="middle" font-size="20" fill="#0F172A">scaffolding, and we are not done</text>
  <text x="970" y="580" text-anchor="middle" font-size="20" fill="#0F172A">until they are gone."</text>

  <line x1="60" y1="670" x2="96" y2="670" stroke="#475569" stroke-width="4"/>
  <text x="108" y="677" font-size="20" fill="#475569">A neutral step in the migration</text>
  <line x1="60" y1="710" x2="96" y2="710" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="717" font-size="20" fill="#475569">Data copied over, and events wired up</text>
  <line x1="60" y1="750" x2="96" y2="750" stroke="#059669" stroke-width="4"/>
  <text x="108" y="757" font-size="20" fill="#475569">Completes the extraction</text>
  <line x1="60" y1="790" x2="96" y2="790" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="797" font-size="20" fill="#475569">Failure: no end date was agreed</text>
</svg>