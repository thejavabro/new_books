<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Redundancy keeps a standby that waits for a failure, while replication keeps copies that are all doing work">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="rr4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rr4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rr4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="330" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="78" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Redundancy: passive</text>

  <rect x="640" y="40" width="580" height="330" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="78" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Replication: active</text>

  <line x1="200" y1="170" x2="200" y2="204" stroke="#059669" stroke-width="2.5" marker-end="url(#rr4-emerald)"/>
  <line x1="440" y1="170" x2="440" y2="204" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#rr4-slate)"/>
  <line x1="755" y1="170" x2="755" y2="204" stroke="#059669" stroke-width="2.5" marker-end="url(#rr4-emerald)"/>
  <line x1="935" y1="170" x2="935" y2="204" stroke="#059669" stroke-width="2.5" marker-end="url(#rr4-emerald)"/>
  <line x1="1115" y1="170" x2="1115" y2="204" stroke="#059669" stroke-width="2.5" marker-end="url(#rr4-emerald)"/>

  <g filter="url(#rr4-soft)">
    <rect x="60" y="110" width="500" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="100" y="210" width="200" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="340" y="210" width="200" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>

    <rect x="680" y="110" width="500" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="675" y="210" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="855" y="210" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="1035" y="210" width="160" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="310" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Incoming work</text>
  <text x="200" y="244" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Active</text>
  <text x="200" y="272" font-size="20" fill="#059669" text-anchor="middle">doing the work</text>
  <text x="440" y="244" font-size="20" font-weight="600" fill="#64748B" text-anchor="middle">Standby</text>
  <text x="440" y="272" font-size="20" fill="#94A3B8" text-anchor="middle">idle until it fails</text>

  <text x="930" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Incoming work</text>
  <text x="755" y="244" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Copy 1</text>
  <text x="755" y="272" font-size="20" fill="#059669" text-anchor="middle">in use</text>
  <text x="935" y="244" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Copy 2</text>
  <text x="935" y="272" font-size="20" fill="#059669" text-anchor="middle">in use</text>
  <text x="1115" y="244" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Copy 3</text>
  <text x="1115" y="272" font-size="20" fill="#059669" text-anchor="middle">in use</text>

  <text x="310" y="424" font-size="20" fill="#475569" text-anchor="middle">Focus: reliability of the whole system</text>
  <text x="930" y="424" font-size="20" fill="#475569" text-anchor="middle">Focus: availability and integrity of the data</text>
</svg>