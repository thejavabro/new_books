  <text x="64" y="326" font-size="16.5" font-weight="600" fill="#475569">Random split: the model sees week 12 before it predicts week 3</text>
  <rect x="976" y="308" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1076" y="330" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">leaks the future</text>

