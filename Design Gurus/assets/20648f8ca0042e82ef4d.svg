<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A temporal split compared with a random split">
  <defs>

    <filter id="m2l1g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l1g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <rect x="700" y="28" width="16" height="16" rx="4" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="724" y="42" font-size="15.5" fill="#64748B">train</text>
  <rect x="810" y="28" width="16" height="16" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="834" y="42" font-size="15.5" fill="#64748B">validate</text>
  <rect x="950" y="28" width="16" height="16" rx="4" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="974" y="42" font-size="15.5" fill="#64748B">test</text>
  <rect x="40" y="56" width="1160" height="190" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#475569">Temporal split: train on the past, test on the future</text>
  <rect x="976" y="68" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="1076" y="90" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">correct</text>
