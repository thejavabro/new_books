  <rect x="624" y="350" width="85" height="64" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="666.5" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">7</text>
  <rect x="717" y="350" width="85" height="64" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="759.5" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">8</text>
  <rect x="810" y="350" width="85" height="64" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="852.5" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">9</text>
  <rect x="903" y="350" width="85" height="64" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="945.5" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">10</text>
  <rect x="996" y="350" width="85" height="64" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="1038.5" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">11</text>
  <rect x="1089" y="350" width="85" height="64" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="1131.5" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">12</text>
  <text x="620" y="450" font-size="15.5" text-anchor="middle" fill="#475569">later training data can make estimates of future performance too optimistic</text>
  <rect x="40" y="526" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="571" text-anchor="middle" font-size="16" fill="#475569">Use a time split to test future performance; other goals may need entity-based splits.</text>
