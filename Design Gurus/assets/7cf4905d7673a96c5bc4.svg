<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The temperatures with nothing on the stack yet">
<defs>
<filter id="dt-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">For each day, how long until a warmer one?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A day sits waiting until some later day is warmer than it</text>
<rect x="40" y="106" width="1160" height="508" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The stack holds the days that have not yet found a warmer day</text>
<text x="240" y="244" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">temperature</text>
<rect x="264" y="206" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="328" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">45</text>
<text x="328" y="288" text-anchor="middle" font-size="15.5" fill="#94A3B8">day 0</text>
<rect x="410" y="206" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="474" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">50</text>
<text x="474" y="288" text-anchor="middle" font-size="15.5" fill="#94A3B8">day 1</text>
<rect x="556" y="206" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">40</text>
<text x="620" y="288" text-anchor="middle" font-size="15.5" fill="#94A3B8">day 2</text>
<rect x="702" y="206" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="766" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">60</text>
<text x="766" y="288" text-anchor="middle" font-size="15.5" fill="#94A3B8">day 3</text>
<rect x="848" y="206" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="912" y="243.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">55</text>
<text x="912" y="288" text-anchor="middle" font-size="15.5" fill="#94A3B8">day 4</text>
<text x="240" y="368" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">days still waiting</text>
<text x="270" y="367" font-size="18" fill="#475569">no days waiting</text>
<text x="240" y="486" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">days to wait</text>
<rect x="264" y="448" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="328" y="485.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="410" y="448" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="474" y="485.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="556" y="448" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="485.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="702" y="448" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="766" y="485.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="848" y="448" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="912" y="485.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="620" y="552" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Reading ahead from every day would reread the same days over and over</text>
<rect x="40" y="626" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="666" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">One warm day can settle several waiting days at once</text>
<text x="620" y="698" text-anchor="middle" font-size="18.5" fill="#475569">So walk forwards once, and let each day settle everything it is warmer than</text>
</svg>