<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="855" viewBox="0 0 1200 855" role="img" aria-labelledby="title desc"><title id="title">Trace the cancellation through its owners</title><desc id="desc">The cancellation flow moves from user interaction through a durable operation, server validation, and committed result back to the screen.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="855" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Trace the cancellation through its owners</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Arrows show the main runtime sequence.</tspan></text><rect x="50" y="165" width="500" height="205" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="207" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Screen and state owner</tspan></text><text x="72" y="255" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Cancel selected order</tspan><tspan x="72" dy="32">Observe pending state</tspan></text><rect x="650" y="165" width="500" height="205" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="672" y="207" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="672" dy="0">Repository and database</tspan></text><text x="672" y="255" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="672" dy="0">Durably record operation</tspan><tspan x="672" dy="32">with order and account IDs</tspan></text><rect x="650" y="455" width="500" height="205" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="497" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="672" dy="0">Sender and Order API</tspan></text><text x="672" y="545" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="672" dy="0">Submit the operation</tspan><tspan x="672" dy="32">Server validates cancellation</tspan></text><rect x="50" y="455" width="500" height="205" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="72" y="497" font-size="25" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Repository result</tspan></text><text x="72" y="545" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Store confirmed outcome</tspan><tspan x="72" dy="32">Complete pending record</tspan></text><path d="M560 265 H640" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M900 380 V445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 550 H560" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 445 V380" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="705" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="751" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Screen lifetime and operation lifetime can be different.</tspan></text></g></svg>