<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A REST GET /products/42 request can be answered by a CDN that holds a copy, so 90 percent of requests are answered at the edge and only 100,000 reach the servers. A gRPC call is sent as an HTTP POST, so the CDN cannot cache it, and all 1,000,000 requests reach the servers.">
  <defs>
    <filter id="rvr3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rvr3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rvr3-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rvr3-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rvr3-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rvr3-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rvr3-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rvr3-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="rvr3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Why REST can use HTTP caches and gRPC cannot</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same product data, requested 1,000,000 times per day.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">REST GET: caches on the path can answer</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#BE185D">gRPC call: every call reaches the server</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#rvr3-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#rvr3-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#rvr3-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#rvr3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#rvr3-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#rvr3-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">GET /products/42</text>
  <g filter="url(#rvr3-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#059669" clip-path="url(#rvr3-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">CDN has a copy</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">90 percent answered here</text>
  <g filter="url(#rvr3-lift)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="836" y="180" width="9" height="90" fill="#059669" clip-path="url(#rvr3-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">100,000 reach servers</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">only the cache misses</text>
  <g filter="url(#rvr3-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#rvr3-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">GetProduct call</text>
  <g filter="url(#rvr3-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#rvr3-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Sent as a POST</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">caches cannot store it</text>
  <g filter="url(#rvr3-soft)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="836" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#rvr3-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">1,000,000 reach servers</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">10 times more load</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Safe GET</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">only reads data, so browsers, CDNs, and proxies can reuse the response</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Inside</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">between services, caching matters less than speed and the contract</text>
</svg>