<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1134" viewBox="0 0 1240 1134" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated distributed cache architecture: smart client with consistent hashing, node internals, cluster manager and failover, and the hot key mitigation">
  <defs>
    <filter id="dc-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="dc-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="dc-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="dc-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dc-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="dc-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1134" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Distributed cache: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Smart client routing, the in-memory engine, replication and the hot key problem</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Routing · no load balancer, so the client reaches the right node in one hop</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dc-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#dc-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">direct</text>
  <g filter="url(#dc-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,171 L880,217 A160,15 0 0 0 1200,217 L1200,171" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1040" cy="171" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">App server</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">holds the SDK</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Smart client</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">consistent hash</text>
  <text x="1040" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cache node</text>
  <text x="1040" y="262" font-size="20" fill="#065F46" text-anchor="middle">600 nodes, 50 GB each</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. Inside one node · every operation is O(1), 10 million QPS across the cluster</text>
  <path d="M264,436 L349,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dc-blue)"/>
  <text x="307" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">lookup</text>
  <path d="M577,436 L662,436" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#dc-emerald)"/>
  <text x="620" y="424" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">touch</text>
  <path d="M890,436 L975,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#dc-amber)"/>
  <text x="933" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fork</text>
  <g filter="url(#dc-soft)">
    <rect x="40" y="398" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M353,413 L353,459 A110,15 0 0 0 573,459 L573,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="463" cy="413" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M666,413 L666,459 A110,15 0 0 0 886,459 L886,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="413" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M979,413 L979,459 A110,15 0 0 0 1199,459 L1199,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="413" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Event loop</text>
  <text x="150" y="458" font-size="20" fill="#64748B" text-anchor="middle">single threaded</text>
  <text x="463" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Hash map</text>
  <text x="463" y="504" font-size="20" fill="#065F46" text-anchor="middle">key to entry, O(1)</text>
  <text x="776" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">LRU list</text>
  <text x="776" y="504" font-size="20" fill="#065F46" text-anchor="middle">evicts from the tail</text>
  <text x="1089" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">RDB snapshot</text>
  <text x="1089" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">warm restart only</text>

  <rect x="24" y="580" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#92400E">3. Failure handling · replication is fire and forget, so a crash can lose writes</text>
  <path d="M264,678 L349,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#dc-amber)"/>
  <text x="307" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">copy</text>
  <path d="M577,678 L662,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#dc-amber)"/>
  <text x="620" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">ping</text>
  <path d="M890,678 L975,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#dc-amber)"/>
  <text x="933" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <g filter="url(#dc-soft)">
    <path d="M40,655 L40,701 A110,15 0 0 0 260,701 L260,655" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="150" cy="655" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M353,655 L353,701 A110,15 0 0 0 573,701 L573,655" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="463" cy="655" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="666" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="979" y="640" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="150" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Primary</text>
  <text x="150" y="746" font-size="20" fill="#065F46" text-anchor="middle">acks immediately</text>
  <text x="463" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica</text>
  <text x="463" y="746" font-size="20" fill="#065F46" text-anchor="middle">async copy</text>
  <text x="776" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cluster manager</text>
  <text x="776" y="700" font-size="20" fill="#64748B" text-anchor="middle">ZooKeeper or Etcd</text>
  <text x="1089" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Smart client</text>
  <text x="1089" y="700" font-size="20" fill="#64748B" text-anchor="middle">new cluster map</text>

  <rect x="24" y="822" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="854" font-size="20" font-weight="600" fill="#475569">4. The celebrity key · one shard cannot serve a million reads a second</text>
  <path d="M364,920 L456,920" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dc-blue)"/>
  <text x="410" y="908" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>
  <path d="M784,920 L876,920" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#dc-amber)"/>
  <text x="830" y="908" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">spill</text>
  <g filter="url(#dc-soft)">
    <path d="M40,897 L40,943 A160,15 0 0 0 360,943 L360,897" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="200" cy="897" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M460,897 L460,943 A160,15 0 0 0 780,943 L780,897" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="897" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M880,897 L880,943 A160,15 0 0 0 1200,943 L1200,897" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="897" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Near cache</text>
  <text x="200" y="988" font-size="20" fill="#065F46" text-anchor="middle">in the app, seconds</text>
  <text x="620" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Hot shard</text>
  <text x="620" y="988" font-size="20" fill="#065F46" text-anchor="middle">the one holding the key</text>
  <text x="1040" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Flash tier</text>
  <text x="1040" y="988" font-size="20" fill="#5B21B6" text-anchor="middle">cold data, cheaper RAM</text>
  <line x1="44" y1="1094" x2="72" y2="1094" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1101" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1094" x2="344.576" y2="1094" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1101" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1085" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1101" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1085" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1101" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1085" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1101" font-size="20" fill="#475569">core service</text>
</svg>