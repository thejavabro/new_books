<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1700" viewBox="0 0 1240 1700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Gmail detailed component design: reception, sending and access services sit behind the gateway, a mail storage service fronts the metadata store, object store and document store with a cache, an index queue feeds index workers that build the Elasticsearch index, and notification workers tell clients">
  <defs>
    <filter id="gm4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="gm4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="gm4-k1"><rect x="40" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="gm4-k2"><rect x="460" y="150" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="gm4-k3"><rect x="64" y="440" width="320" height="90" rx="12"/></clipPath>
