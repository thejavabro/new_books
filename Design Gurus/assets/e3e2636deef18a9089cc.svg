    <marker id="gm4-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="gm4-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="gm4-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="gm4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Gmail: detailed component design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same three services, with the storage service in front of four stores and an index pipeline that runs behind every write.</text>

  <rect x="40" y="380" width="1160" height="226" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#1D4ED8">Services, split by what they do with a message</text>
  <rect x="40" y="900" width="740" height="430" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="930" font-size="19.5" font-weight="600" fill="#475569">Four stores, one message</text>
  <rect x="830" y="900" width="370" height="430" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="854" y="930" font-size="19.5" font-weight="600" fill="#047857">Search</text>

  <g fill="none" stroke-width="2">
    <path d="M280,195 H452" stroke="#2563EB" marker-end="url(#gm4-m-blue)"/>
    <path d="M620,312 V374" stroke="#2563EB" stroke-width="2.5" marker-end="url(#gm4-m-blue)"/>
    <path d="M180,606 V694" stroke="#DB2777" marker-end="url(#gm4-m-pink)"/>
    <path d="M620,606 V694" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#gm4-m-violet)"/>
    <path d="M1000,606 V694" stroke="#059669" marker-end="url(#gm4-m-emerald)"/>
    <path d="M620,840 V894" stroke="#64748B" stroke-width="2.5" marker-end="url(#gm4-m-slate)"/>
    <path d="M1015,840 V954" stroke="#059669" marker-end="url(#gm4-m-emerald)"/>
    <path d="M1015,1100 V1144" stroke="#059669" marker-end="url(#gm4-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="366" y="183" fill="#1D4ED8">HTTPS</text>
    <text x="760" y="345" fill="#1D4ED8">routes by what is being asked</text>
    <text x="108" y="654" fill="#BE185D">score</text>
    <text x="740" y="654" fill="#5B21B6">all writes go here</text>
    <text x="1110" y="654" fill="#047857">enqueue</text>
    <text x="740" y="862" fill="#475569">writes each part</text>
    <text x="1105" y="890" fill="#047857">consume</text>
  </g>

  <g filter="url(#gm4-soft)">
    <rect x="40" y="150" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#gm4-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web, mobile, IMAP</text>
  <g filter="url(#gm4-lift)">
    <rect x="460" y="150" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="460" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#gm4-k2)"/>
  </g>
  <circle cx="498" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="524" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="620" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">auth and rate limits</text>
  <g filter="url(#gm4-soft)">
    <rect x="64" y="440" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#gm4-k3)"/>
  </g>
  <circle cx="102" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="128" y="492" font-size="21.5" font-weight="600" fill="#111827">Mail Reception</text>
  <text x="224" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">inbound SMTP</text>
  <g filter="url(#gm4-soft)">
    <rect x="460" y="440" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="460" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#gm4-k4)"/>
  </g>
  <circle cx="498" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="524" y="492" font-size="21.5" font-weight="600" fill="#111827">Mail Sending</text>
  <text x="620" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">outbound SMTP</text>
  <g filter="url(#gm4-soft)">
    <rect x="856" y="440" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="856" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#gm4-k5)"/>
  </g>
  <circle cx="894" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(883.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="920" y="492" font-size="21.5" font-weight="600" fill="#111827">Mail Access</text>
  <text x="1016" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">IMAP, POP3, web APIs</text>
  <g filter="url(#gm4-soft)">
    <rect x="64" y="700" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="700" width="6" height="90" fill="#DB2777" clip-path="url(#gm4-k6)"/>
  </g>
  <circle cx="102" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,734.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="128" y="752" font-size="21.5" font-weight="600" fill="#111827">Spam Filtering</text>
  <text x="214" y="819" font-size="18.5" text-anchor="middle" fill="#6B7280">scores inbound mail</text>
  <g filter="url(#gm4-soft)">
    <rect x="440" y="700" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="440" y="700" width="6" height="90" fill="#7C3AED" clip-path="url(#gm4-k7)"/>
  </g>
  <circle cx="478" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,734.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="504" y="752" font-size="21.5" font-weight="600" fill="#111827">Mail Storage Service</text>
  <text x="620" y="819" font-size="18.5" text-anchor="middle" fill="#6B7280">the only writer to the stores</text>
  <g filter="url(#gm4-soft)">
    <rect x="880" y="700" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="700" width="6" height="90" fill="#059669" clip-path="url(#gm4-k8)"/>
  </g>
  <circle cx="918" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,734.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="944" y="752" font-size="21.5" font-weight="600" fill="#111827">Index queue</text>
  <text x="1030" y="819" font-size="18.5" text-anchor="middle" fill="#6B7280">one job per message</text>
  <g filter="url(#gm4-soft)">
    <rect x="880" y="960" width="270" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="960" width="6" height="90" fill="#059669" clip-path="url(#gm4-k9)"/>
  </g>
  <circle cx="918" cy="1005" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,994.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="944" y="1012" font-size="21.5" font-weight="600" fill="#111827">Index workers</text>
  <text x="1015" y="1079" font-size="18.5" text-anchor="middle" fill="#6B7280">a pool, scaled out</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M64,970 L64,1044 A120,16 0 0 0 304,1044 L304,970" fill="#E0E7FF"/>
    <ellipse cx="184" cy="970" rx="120" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="184" y="1022" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Metadata</text>
  <text x="184" y="1094" font-size="18.5" text-anchor="middle" fill="#6B7280">to, from, subject</text>
  <text x="184" y="1121" font-size="18.5" text-anchor="middle" fill="#94A3B8">flags and labels</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M328,970 L328,1044 A100,16 0 0 0 528,1044 L528,970" fill="#E2E8F0"/>
    <ellipse cx="428" cy="970" rx="100" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="428" y="1022" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Objects</text>
  <text x="428" y="1094" font-size="18.5" text-anchor="middle" fill="#6B7280">attachments</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M552,970 L552,1044 A102,16 0 0 0 756,1044 L756,970" fill="#E2E8F0"/>
    <ellipse cx="654" cy="970" rx="102" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="654" y="1022" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Documents</text>
  <text x="654" y="1094" font-size="18.5" text-anchor="middle" fill="#6B7280">message bodies</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M880,1150 L880,1224 A135,16 0 0 0 1150,1224 L1150,1150" fill="#D1FAE5"/>
    <ellipse cx="1015" cy="1150" rx="135" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="1015" y="1202" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Index store</text>
  <text x="1015" y="1274" font-size="18.5" text-anchor="middle" fill="#6B7280">Elasticsearch</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M240,1165 L240,1239 A170,16 0 0 0 580,1239 L580,1165" fill="#FEF3C7"/>
    <ellipse cx="410" cy="1165" rx="170" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="410" y="1217" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Cache</text>
  <text x="410" y="1289" font-size="18.5" text-anchor="middle" fill="#6B7280">the mailbox listing</text>

  <rect x="40" y="1390" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1415" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1440" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">One writer</text>
  <text x="323" y="1440" font-size="18.5" fill="#475569">a single storage service owns the stores, so three services cannot disagree about a message</text>
  <rect x="64" y="1465" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="1490" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Bodies are documents</text>
  <text x="323" y="1490" font-size="18.5" fill="#475569">a body is read whole and never updated, so it does not belong in the metadata table</text>
  <rect x="64" y="1515" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="1540" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Indexing is asynchronous</text>
  <text x="323" y="1540" font-size="18.5" fill="#475569">a message is stored and acknowledged first, and becomes searchable a moment later</text>
  <rect x="64" y="1565" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1590" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Cache the mailbox listing</text>
  <text x="323" y="1590" font-size="18.5" fill="#475569">opening a mailbox reads headers over and over, and that is the query worth caching</text>
</svg>