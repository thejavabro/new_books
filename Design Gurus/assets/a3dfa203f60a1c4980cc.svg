<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Transfer and verify with a checksum: the sender sends the data plus its checksum, the receiver recomputes and compares, a match accepts the data, a mismatch requests it again">
  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>
  <defs>
    <marker id="ck1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ck1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="ck1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="240" y1="112" x2="240" y2="634" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1000" y1="112" x2="1000" y2="634" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="248" y1="286" x2="990" y2="286" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ck1-blue)"/>
  <text x="620" y="262" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. Send the data plus its checksum</text>

  
  <line x1="992" y1="596" x2="250" y2="596" stroke="#DC2626" stroke-width="2" marker-end="url(#ck1-red)"/>
  <text x="620" y="572" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Mismatch: the data is corrupted, request it again</text>

  
  <g filter="url(#ck1-soft)">
    <rect x="110" y="140" width="260" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="171" font-size="20" fill="#334155" text-anchor="middle">1. Compute the checksum</text>
  <text x="240" y="198" font-size="20" fill="#334155" text-anchor="middle">of the data</text>

  
  <g filter="url(#ck1-soft)">
    <rect x="820" y="336" width="360" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1000" y="367" font-size="20" fill="#334155" text-anchor="middle">3. Recompute the checksum from</text>
  <text x="1000" y="394" font-size="20" fill="#334155" text-anchor="middle">the received data and compare</text>

  
  <g filter="url(#ck1-soft)">
    <rect x="810" y="452" width="380" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1000" y="483" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Match: the data arrived intact</text>
  <text x="1000" y="510" font-size="20" fill="#065F46" text-anchor="middle">accept the data</text>

  
  <g filter="url(#ck1-soft)">
    <rect x="120" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="880" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Sender</text>
  <text x="240" y="98" font-size="20" fill="#64748B" text-anchor="middle">has the original data</text>
  <text x="1000" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Receiver</text>
  <text x="1000" y="98" font-size="20" fill="#64748B" text-anchor="middle">wants an exact copy</text>

  
  <rect x="220" y="646" width="800" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="677" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A checksum catches accidental corruption.</text>
  <text x="620" y="705" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">It does not prove who sent the data.</text>

  
  <line x1="213" y1="759" x2="241" y2="759" stroke="#3B82F6" stroke-width="3"/>
  <text x="251" y="766" font-size="20" fill="#475569">data + checksum</text>
  <rect x="455" y="750" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="493" y="766" font-size="20" fill="#475569">match: data accepted</text>
  <line x1="749" y1="759" x2="777" y2="759" stroke="#DC2626" stroke-width="3"/>
  <text x="787" y="766" font-size="20" fill="#475569">mismatch: request again</text>
</svg>