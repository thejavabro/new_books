<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="618" viewBox="0 0 1240 618" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two workers generating IDs in the same millisecond stay unique because their worker ids differ, and within one worker the sequence counter keeps successive IDs apart">
  <rect x="0" y="0" width="1240" height="618" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two workers, the same millisecond, and no collision</text>

  <rect x="50" y="84" width="1140" height="52" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="620" y="116" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">both clocks read the same millisecond: 1739812004221</text>

  <rect x="50" y="166" width="555" height="240" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <path d="M50 178 a12 12 0 0 1 12 -12 h531 a12 12 0 0 1 12 12 v40 h-555 z" fill="#FFFBEB"/>
  <text x="327" y="200" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Worker 7</text>
  <text x="70" y="254" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">time=...4221  worker=7  seq=0</text>
  <text x="70" y="290" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">time=...4221  worker=7  seq=1</text>
  <text x="70" y="326" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">time=...4221  worker=7  seq=2</text>
  <text x="70" y="376" font-size="20" font-weight="600" fill="#92400E">the sequence keeps these three apart</text>

  <rect x="635" y="166" width="555" height="240" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <path d="M635 178 a12 12 0 0 1 12 -12 h531 a12 12 0 0 1 12 12 v40 h-555 z" fill="#F5F3FF"/>
  <text x="912" y="200" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Worker 12</text>
  <text x="655" y="254" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">time=...4221  worker=12  seq=0</text>
  <text x="655" y="290" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">time=...4221  worker=12  seq=1</text>
  <text x="655" y="326" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">time=...4221  worker=12  seq=2</text>
  <text x="655" y="376" font-size="20" font-weight="600" fill="#5B21B6">and the worker id keeps the columns apart</text>

  <rect x="50" y="436" width="1140" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="478" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Six IDs, identical timestamps, all distinct, and neither worker asked anyone anything.</text>

  <rect x="50" y="536" width="1140" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="574" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The coordination happens once, when a worker is assigned its number, not on every ID.</text>
</svg>