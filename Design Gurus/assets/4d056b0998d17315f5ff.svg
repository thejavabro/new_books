<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" role="img" aria-labelledby="title desc"><title id="title">Slow feed: architecture and measurement points</title><desc id="desc">Trace the real dependency path from launch setup through the repository, data sources, presentation mapping, and row rendering. Image preparation is a separate path, so available text need not wait for images. Record actual timestamps, execution context, waits, and retained resources for a cold launch and a scroll update before selecting a fix.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1340" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><rect x="25" y="140" width="1150" height="940" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Slow feed: architecture and measurement points</text><text x="50" y="106" font-size="22" fill="#334155" font-weight="400">Use real trace timestamps to find the work that delays useful content.</text><rect x="50" y="170" width="520" height="160" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="210" font-size="24" fill="#2563eb" font-weight="700">Launch setup + initialization</text><text x="72" y="248" font-size="21" fill="#334155" font-weight="400">Identify required dependencies.</text><text x="72" y="278" font-size="21" fill="#334155" font-weight="400">Measure each task and what it waits for.</text><rect x="650" y="170" width="500" height="160" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="210" font-size="24" fill="#059669" font-weight="700">Feed repository</text><text x="672" y="248" font-size="21" fill="#334155" font-weight="400">Coordinate stored and remote data.</text><text x="672" y="278" font-size="21" fill="#334155" font-weight="400">Check identity before applying results.</text><path d="M578 250 H642" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="440" width="520" height="160" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="480" font-size="24" fill="#7c3aed" font-weight="700">Local store + API client</text><text x="72" y="518" font-size="21" fill="#334155" font-weight="400">Read available content; fetch as required.</text><text x="72" y="548" font-size="21" fill="#334155" font-weight="400">Record storage and network timings.</text><path d="M780 338 V385 H310 V432" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><rect x="650" y="440" width="500" height="160" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="480" font-size="24" fill="#059669" font-weight="700">Presentation mapping</text><text x="672" y="518" font-size="21" fill="#334155" font-weight="400">Map valid content to visible row state.</text><text x="672" y="548" font-size="21" fill="#334155" font-weight="400">Measure mapping and publication time.</text><path d="M1010 338 V432" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="1033" y="394" font-size="20" fill="#64748b" font-weight="400">Data</text><rect x="50" y="750" width="520" height="170" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="72" y="790" font-size="24" fill="#c2410c" font-weight="700">Image preparation</text><text x="72" y="828" font-size="21" fill="#334155" font-weight="400">Fetch, downsample, and cache.</text><text x="72" y="858" font-size="21" fill="#334155" font-weight="400">Measure decoding and retained memory.</text><text x="72" y="888" font-size="21" fill="#334155" font-weight="400">Check the destination item identity.</text><rect x="650" y="750" width="500" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="672" y="790" font-size="24" fill="#2563eb" font-weight="700">Row rendering</text><text x="672" y="828" font-size="21" fill="#334155" font-weight="400">Render available text and placeholders.</text><text x="672" y="858" font-size="21" fill="#334155" font-weight="400">Apply a valid image when it is ready.</text><text x="672" y="888" font-size="21" fill="#334155" font-weight="400">Measure frame work and visible delay.</text><path d="M820 608 V662 H310 V742" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="110" y="706" font-size="21" fill="#64748b" font-weight="400">Image work</text><path d="M990 608 V742" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="1008" y="681" font-size="19" fill="#64748b" font-weight="400">Text and</text><text x="1008" y="711" font-size="19" fill="#64748b" font-weight="400">row state</text><path d="M578 835 H642" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="83" y="1000" font-size="22" fill="#334155" font-weight="400">For each measured operation: owner, execution context, waits, and retained resources.</text><text x="83" y="1030" font-size="22" fill="#334155" font-weight="400">Trace cold launch and scrolling separately. Do not invent timing values.</text><rect x="50" y="1120" width="1100" height="145" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="1160" font-size="24" fill="#ffffff" font-weight="700">Test the smallest change supported by the trace</text><text x="72" y="1198" font-size="21" fill="#ffffff" font-weight="400">For example: show text before images, or downsample during decoding.</text><text x="72" y="1228" font-size="21" fill="#ffffff" font-weight="400">Keep ownership and correctness checks while changing execution.</text><text x="50" y="1310" font-size="20" fill="#475569" font-weight="400">Selected dependencies shown. Heavy storage and image work must not block input or rendering.</text></g></svg>