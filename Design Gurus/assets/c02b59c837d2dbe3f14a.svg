<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Microservices run continuously on capacity you manage; serverless functions are started by a trigger, run, and go away">
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
  <defs>
    <marker id="mc5-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="mc5-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="mc5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="470" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Microservices: always running</text>

  <rect x="640" y="76" width="580" height="470" rx="14" fill="#FFFBEB" fill-opacity="0.35" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Serverless: started by a trigger</text>

  
  <line x1="290" y1="164" x2="140" y2="196" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc5-blue)"/>
  <line x1="310" y1="164" x2="310" y2="196" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc5-blue)"/>
  <line x1="330" y1="164" x2="480" y2="196" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc5-blue)"/>
  <g filter="url(#mc5-soft)">
    <rect x="110" y="106" width="400" height="58" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="60" y="200" width="150" height="86" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="235" y="200" width="150" height="86" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="410" y="200" width="150" height="86" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="310" y="142" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Incoming traffic</text>
  <text x="135" y="234" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Catalog</text>
  <text x="135" y="262" font-size="20" fill="#64748B" text-anchor="middle">3 instances</text>
  <text x="310" y="234" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Checkout</text>
  <text x="310" y="262" font-size="20" fill="#64748B" text-anchor="middle">20 instances</text>
  <text x="485" y="234" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Payments</text>
  <text x="485" y="262" font-size="20" fill="#64748B" text-anchor="middle">6 instances</text>

  <rect x="60" y="310" width="500" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="342" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Capacity you provision and operate</text>
  <text x="310" y="370" font-size="20" fill="#64748B" text-anchor="middle">containers, orchestration, scaling rules</text>

  <text x="310" y="428" font-size="20" fill="#64748B" text-anchor="middle">Warm all the time, so no cold starts</text>
  <text x="310" y="462" font-size="20" fill="#64748B" text-anchor="middle">and long jobs and connections are fine</text>
  <text x="310" y="506" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">You pay for the capacity, busy or idle</text>

  
  <g filter="url(#mc5-soft)">
    <rect x="670" y="106" width="230" height="58" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="785" y="142" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A file is uploaded</text>

  <line x1="900" y1="135" x2="965" y2="135" stroke="#D97706" stroke-width="2.5" marker-end="url(#mc5-amber)"/>
  <text x="932" y="99" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">trigger</text>

  <g filter="url(#mc5-soft)">
    <rect x="969" y="106" width="220" height="58" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1079" y="142" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Function starts</text>

  <line x1="1079" y1="164" x2="1079" y2="196" stroke="#D97706" stroke-width="2" marker-end="url(#mc5-amber)"/>
  <g filter="url(#mc5-soft)">
    <rect x="960" y="200" width="240" height="86" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1080" y="234" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Runs for 2 seconds</text>
  <text x="1080" y="262" font-size="20" fill="#64748B" text-anchor="middle">resizes the image</text>

  <line x1="1079" y1="286" x2="1079" y2="318" stroke="#D97706" stroke-width="2" marker-end="url(#mc5-amber)"/>
  <rect x="960" y="322" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1080" y="360" font-size="20" fill="#64748B" text-anchor="middle">Gone again</text>

  <rect x="670" y="200" width="240" height="186" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="790" y="252" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">No servers of</text>
  <text x="790" y="280" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">your own</text>
  <text x="790" y="322" font-size="20" fill="#64748B" text-anchor="middle">the provider runs</text>
  <text x="790" y="350" font-size="20" fill="#64748B" text-anchor="middle">as many copies as</text>
  <text x="790" y="378" font-size="20" fill="#64748B" text-anchor="middle">the events need</text>

  <text x="930" y="428" font-size="20" fill="#64748B" text-anchor="middle">A cold start on the first request after idle,</text>
  <text x="930" y="462" font-size="20" fill="#64748B" text-anchor="middle">and hard limits on runtime and memory</text>
  <text x="930" y="506" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">You pay per run, and nothing when idle</text>

  
  <text x="620" y="622" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Most systems use both: steady traffic on services, event-shaped work on functions.</text>
</svg>