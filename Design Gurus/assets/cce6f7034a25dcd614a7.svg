<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="stretch-title stretch-desc">
<title id="stretch-title">How far Postgres stretches</title>
<desc id="stretch-desc">pgvector, declarative partitioning with BRIN indexes, the TimescaleDB extension, materialized views and unlogged tables each defer a separate system by years. The discipline that makes it work is writing down in advance the measured threshold at which you would revisit.</desc>
<defs>
<marker id="stretch-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="stretch-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="stretch-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="stretch-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="674" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">How far Postgres stretches</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Postgres reaches further than most engineers assume.</text>
<rect x="40" y="596" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="596" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="290" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="185" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">pgvector</text>
<path d="M336 146H370" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M336 146H370" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="380" y="118" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="400" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for embedding search</text>
<path d="M786 146H820" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M786 146H820" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="830" y="118" width="370" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1015" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">defers a vector database</text>
<rect x="40" y="186" width="290" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="185" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Partitioning with BRIN</text>
<path d="M336 214H370" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M336 214H370" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="380" y="186" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="400" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for time-ordered data</text>
<path d="M786 214H820" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M786 214H820" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="830" y="186" width="370" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1015" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">defers a time-series store</text>
<rect x="40" y="254" width="290" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="185" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">TimescaleDB extension</text>
<path d="M336 282H370" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M336 282H370" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="380" y="254" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="400" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for time-series features</text>
<path d="M786 282H820" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M786 282H820" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="830" y="254" width="370" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1015" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">defers a separate system</text>
<rect x="40" y="322" width="290" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="185" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Materialized views</text>
<path d="M336 350H370" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M336 350H370" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="380" y="322" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="400" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for expensive read paths</text>
<path d="M786 350H820" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M786 350H820" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="830" y="322" width="370" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1015" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">defers a columnar store</text>
<rect x="40" y="390" width="290" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="185" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">UNLOGGED tables</text>
<path d="M336 418H370" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M336 418H370" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="380" y="390" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="400" y="424" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for crash-disposable data</text>
<path d="M786 418H820" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M786 418H820" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stretch-marker-slate)"/>
<rect x="830" y="390" width="370" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1015" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">defers a separate cache tier</text>
<rect x="40" y="470" width="1160" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="470" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="500" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">What makes this work is writing the threshold down in advance</text><text x="64" y="526" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">"We revisit search when p99 latency passes 200 ms at 10x the current document count."</text><text x="64" y="552" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Then the decision is triggered by a measurement, not by whoever is most enthusiastic in the meeting.</text>
<text x="66" y="630" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Each of these keeps the feature inside a database you already know how to back up, upgrade and staff.</text>
</svg>