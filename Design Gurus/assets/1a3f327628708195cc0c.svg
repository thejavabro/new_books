<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="534" viewBox="0 0 1240 534" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="How one slow dependency takes down a whole site. The payment API is slow rather than down, so every order service thread waits on it, the web frontend then waits on the order service and fills its own threads, and users see an error page even though only one service is at fault">
  <defs>
    <marker id="cb1-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="cb1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cb1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cb1-k1"><rect x="72" y="112" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="cb1-k2"><rect x="357" y="112" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="cb1-k3"><rect x="642" y="112" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="cb1-k4"><rect x="927" y="112" width="240" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="534" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="290" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">One slow dependency, and every caller above it fills up waiting</text>

  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M312,157 L353,157" marker-end="url(#cb1-pk)"/>
    <path d="M597,157 L638,157" marker-end="url(#cb1-pk)"/>
    <path d="M882,157 L923,157" marker-end="url(#cb1-pk)"/>
  </g>

  <g filter="url(#cb1-soft)">
    <rect x="72" y="112" width="240" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#cb1-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Users</text>
  <text x="192" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">see a spinner</text>
  <text x="192" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">then an error page</text>
  <text x="192" y="273" font-size="15.5" text-anchor="middle" fill="#94A3B8">the whole site looks down</text>

  <g filter="url(#cb1-soft)">
    <rect x="357" y="112" width="240" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="357" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#cb1-k2)"/>
  </g>
  <circle cx="395" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(384.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="421" y="164" font-size="18.5" font-weight="600" fill="#111827">Web Frontend</text>
  <text x="477" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">waits on the order call</text>
  <text x="477" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">its own threads fill up</text>
  <text x="477" y="273" font-size="15.5" text-anchor="middle" fill="#94A3B8">so no page renders at all</text>

  <g filter="url(#cb1-soft)">
    <rect x="642" y="112" width="240" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="642" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#cb1-k3)"/>
  </g>
  <circle cx="680" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(669.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="706" y="164" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="762" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">waits on the payment call</text>
  <text x="762" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">all 200 threads blocked</text>
  <text x="762" y="273" font-size="15.5" text-anchor="middle" fill="#94A3B8">even browsing requests stall</text>

  <g filter="url(#cb1-lift)">
    <rect x="927" y="112" width="240" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="927" y="112" width="9" height="90" fill="#DB2777" clip-path="url(#cb1-k4)"/>
  </g>
  <circle cx="965" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(954.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="991" y="164" font-size="18.5" font-weight="600" fill="#111827">Payment API</text>
  <text x="1047" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">slow, not down</text>
  <text x="1047" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">answers in 30 seconds</text>
  <text x="1047" y="273" font-size="15.5" text-anchor="middle" fill="#94A3B8">the only real fault is here</text>

  <rect x="40" y="366" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="390" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="412" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Why it spreads</text>
  <text x="288" y="412" font-size="15.5" fill="#475569">a waiting call holds a thread, and a service whose threads are all held cannot answer anything, healthy or not</text>

  <rect x="64" y="434" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="456" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Slow beats down</text>
  <text x="288" y="456" font-size="15.5" fill="#475569">a service that fails instantly frees the thread, so a slow dependency does more damage than a dead one</text>
</svg>