<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The points and the value each one contributes">
<defs>
<filter id="me-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="708" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which pair of points, no more than 4 apart, gives the largest total?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The total is the two y values plus the distance between the x values</text>
<rect x="40" y="106" width="1160" height="456" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The points are already sorted by x, which is what makes the rewrite possible</text>
<text x="256" y="228" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">points</text>
<rect x="278" y="190" width="156" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="356" y="226.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">0, 0</text>
<text x="356" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">y minus x is 0</text>
<rect x="454" y="190" width="156" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="532" y="226.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">2, 1</text>
<text x="532" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">y minus x is -1</text>
<rect x="630" y="190" width="156" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="708" y="226.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">3, 3</text>
<text x="708" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">y minus x is 0</text>
<rect x="806" y="190" width="156" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="884" y="226.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">7, 10</text>
<text x="884" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">y minus x is 3</text>
<text x="520" y="476" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">best earlier points</text>
<text x="548" y="475" font-size="18" fill="#475569">nothing queued yet</text>
<text x="620" y="304" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">For an earlier point i and a later point j, the total is (y minus x) at i plus (y plus x) at j</text>
<text x="620" y="334" text-anchor="middle" font-size="18" fill="#475569">So each later point only needs the largest (y minus x) still within reach behind it</text>
<rect x="40" y="584" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="624" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The two halves of the total depend on one point each</text>
<text x="620" y="656" text-anchor="middle" font-size="18.5" fill="#475569">That is what turns a search over pairs into a running best over a window</text>
</svg>