<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flow: run three boundary tests in order, the one-sentence test, the arrow-counting test, and the lockstep test; failing any test means reworking the boundary, passing all three means the boundary is worth defending">
  <defs>
    <marker id="m02-l02-boundary-tests-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m02-l02-boundary-tests-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m02-l02-boundary-tests-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m02-l02-boundary-tests-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  
  <rect x="180" y="130" width="560" height="550" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="202" y="168" font-size="20" font-weight="600" fill="#334155">The three tests, in order</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M460,120 L460,200" stroke="#475569" marker-end="url(#m02-l02-boundary-tests-sl)"/>
    <path d="M460,320 L460,380" stroke="#059669" marker-end="url(#m02-l02-boundary-tests-em)"/>
    <path d="M460,500 L460,560" stroke="#059669" marker-end="url(#m02-l02-boundary-tests-em)"/>
    <path d="M460,660 L460,720" stroke="#059669" stroke-width="3" marker-end="url(#m02-l02-boundary-tests-em)"/>
    <path d="M710,260 L850,260" stroke="#DC2626" marker-end="url(#m02-l02-boundary-tests-red)"/>
    <path d="M710,440 L850,440" stroke="#DC2626" marker-end="url(#m02-l02-boundary-tests-red)"/>
    <path d="M710,610 L850,610" stroke="#DC2626" marker-end="url(#m02-l02-boundary-tests-red)"/>
  </g>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="504" y="357" fill="#065F46">Yes</text>
    <text x="524" y="537" fill="#065F46">One or two</text>
    <text x="504" y="697" fill="#065F46">Yes</text>
    <text x="780" y="248" fill="#B91C1C">No</text>
    <text x="780" y="428" fill="#B91C1C">Five or more</text>
    <text x="780" y="598" fill="#B91C1C">No</text>
  </g>

  
  <g filter="url(#m02-l02-boundary-tests-soft)">
    <rect x="330" y="50" width="260" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="460" y="92" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Proposed boundary</text>

  
  <g filter="url(#m02-l02-boundary-tests-soft)">
    <rect x="210" y="200" width="500" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="460" y="232" text-anchor="middle" font-size="20" fill="#64748B">Test 1: the one-sentence test</text>
  <text x="460" y="266" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Can you state its job in one</text>
  <text x="460" y="296" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">sentence without the word "and"?</text>

  
  <g filter="url(#m02-l02-boundary-tests-soft)">
    <rect x="210" y="380" width="500" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="460" y="412" text-anchor="middle" font-size="20" fill="#64748B">Test 2: the arrow-counting test</text>
  <text x="460" y="446" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">How many synchronous calls</text>
  <text x="460" y="476" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">per common operation?</text>

  
  <g filter="url(#m02-l02-boundary-tests-soft)">
    <rect x="210" y="560" width="500" height="100" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="460" y="592" text-anchor="middle" font-size="20" fill="#64748B">Test 3: the lockstep test</text>
  <text x="460" y="628" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Can it deploy alone?</text>

  
  <g filter="url(#m02-l02-boundary-tests-soft)">
    <rect x="850" y="215" width="340" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1020" y="267" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Split it further or drop it</text>

  <g filter="url(#m02-l02-boundary-tests-soft)">
    <rect x="850" y="395" width="340" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1020" y="433" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rethink: the boundary</text>
  <text x="1020" y="463" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">fights the domain</text>

  <g filter="url(#m02-l02-boundary-tests-soft)">
    <rect x="850" y="565" width="340" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1020" y="603" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Lockstep: the boundary</text>
  <text x="1020" y="633" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">is not real</text>

  
  <g filter="url(#m02-l02-boundary-tests-soft)">
    <rect x="290" y="720" width="340" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="460" y="763" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Defend the boundary</text>
  <text x="460" y="793" text-anchor="middle" font-size="20" fill="#64748B">it passed all three tests</text>

  
  <g stroke-width="4">
    <line x1="40" y1="875" x2="74" y2="875" stroke="#059669"/>
    <line x1="640" y1="875" x2="674" y2="875" stroke="#DC2626"/>
  </g>
  <text x="84" y="882" font-size="20" fill="#475569">Pass: continue to the next test</text>
  <text x="684" y="882" font-size="20" fill="#475569">Fail: rework the boundary</text>
</svg>