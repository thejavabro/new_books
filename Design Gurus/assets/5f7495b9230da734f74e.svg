<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1260" viewBox="0 0 1240 1260" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four upload stages: create the session, put numbered parts each with a checksum, read the session after an interruption to see that parts one and two arrived, then post the file completion where the whole file checksum is verified. Downloads leave from the created file through a short lived signed location straight to storage.">
  <defs>
    <marker id="p43-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p43-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p43-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p43-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p43-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p43-k1"><rect x="76" y="153" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p43-k2"><rect x="560" y="147" width="604" height="48" rx="10"/></clipPath>
    <clipPath id="p43-k3"><rect x="76" y="369" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p43-k4"><rect x="560" y="313" width="604" height="48" rx="10"/></clipPath>
    <clipPath id="p43-k5"><rect x="560" y="375" width="604" height="48" rx="10"/></clipPath>
    <clipPath id="p43-k6"><rect x="560" y="437" width="604" height="48" rx="10"/></clipPath>
    <clipPath id="p43-k7"><rect x="76" y="585" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p43-k8"><rect x="560" y="579" width="604" height="48" rx="10"/></clipPath>
    <clipPath id="p43-k9"><rect x="76" y="751" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p43-k10"><rect x="560" y="745" width="604" height="48" rx="10"/></clipPath>
    <clipPath id="p43-k11"><rect x="126" y="954" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p43-k12"><rect x="495" y="954" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1260" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">One file, many bounded parts</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">four stages, in order</text>

  
  <rect x="40" y="126" width="1160" height="144" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="292" width="1160" height="244" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="558" width="1160" height="144" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="724" width="1160" height="144" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="898" width="1160" height="192" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="928" font-size="16.5" font-weight="600" fill="#475569">The download path</text>

  
  <g fill="none" stroke-width="2">
    <path d="M276,243 V369" stroke="#2563EB" marker-end="url(#p43-bm)"/>
    <path d="M276,459 V585" stroke="#2563EB" marker-end="url(#p43-bm)"/>
    <path d="M276,675 V751" stroke="#D97706" marker-end="url(#p43-am)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M276,841 V954" stroke="#059669" marker-end="url(#p43-em)"/>
  </g>

  
  <g filter="url(#p43-soft)">
    <rect x="76" y="153" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="153" width="6" height="90" fill="#2563EB" clip-path="url(#p43-k1)"/>
  </g>
  <circle cx="114" cy="198" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,187.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="205" font-size="18.5" font-weight="600" fill="#111827">1. Create the session</text>

  <g filter="url(#p43-soft)">
    <rect x="560" y="147" width="604" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="560" y="147" width="6" height="48" fill="#2563EB" clip-path="url(#p43-k2)"/>
  </g>
  <circle cx="594" cy="171" r="4.5" fill="#2563EB"/>
  <text x="618" y="178" font-size="18.5" font-weight="600" fill="#111827">POST /upload-sessions</text>
  <text x="862" y="220" font-size="15.5" text-anchor="middle" fill="#6B7280">name, size, checksum</text>
  <text x="862" y="243" font-size="15.5" text-anchor="middle" fill="#94A3B8">201 with part_size_bytes, maximum_parts and expiry</text>

  
  <g filter="url(#p43-soft)">
    <rect x="76" y="369" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="369" width="6" height="90" fill="#2563EB" clip-path="url(#p43-k3)"/>
  </g>
  <circle cx="114" cy="414" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,403.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="421" font-size="18.5" font-weight="600" fill="#111827">2. Send numbered parts</text>

  <g filter="url(#p43-soft)">
    <rect x="560" y="313" width="604" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="560" y="313" width="6" height="48" fill="#2563EB" clip-path="url(#p43-k4)"/>
  </g>
  <circle cx="594" cy="337" r="4.5" fill="#2563EB"/>
  <text x="618" y="344" font-size="18.5" font-weight="600" fill="#111827">PUT .../parts/1</text>

  <g filter="url(#p43-soft)">
    <rect x="560" y="375" width="604" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="560" y="375" width="6" height="48" fill="#2563EB" clip-path="url(#p43-k5)"/>
  </g>
  <circle cx="594" cy="399" r="4.5" fill="#2563EB"/>
  <text x="618" y="406" font-size="18.5" font-weight="600" fill="#111827">PUT .../parts/2</text>

  <g filter="url(#p43-soft)">
    <rect x="560" y="437" width="604" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="560" y="437" width="6" height="48" fill="#2563EB" clip-path="url(#p43-k6)"/>
  </g>
  <circle cx="594" cy="461" r="4.5" fill="#2563EB"/>
  <text x="618" y="468" font-size="18.5" font-weight="600" fill="#111827">PUT .../parts/3</text>
  <text x="862" y="510" font-size="15.5" text-anchor="middle" fill="#6B7280">one checksum per part</text>

  
  <g filter="url(#p43-soft)">
    <rect x="76" y="585" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="585" width="6" height="90" fill="#D97706" clip-path="url(#p43-k7)"/>
  </g>
  <circle cx="114" cy="630" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,619.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="637" font-size="18.5" font-weight="600" fill="#111827">3. Read after a drop</text>

  <g filter="url(#p43-soft)">
    <rect x="560" y="579" width="604" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="560" y="579" width="6" height="48" fill="#D97706" clip-path="url(#p43-k8)"/>
  </g>
  <circle cx="594" cy="603" r="4.5" fill="#D97706"/>
  <text x="618" y="610" font-size="18.5" font-weight="600" fill="#111827">GET /upload-sessions/{id}</text>
  <text x="862" y="652" font-size="15.5" text-anchor="middle" fill="#6B7280">uploaded_parts: 1, 2</text>
  <text x="862" y="675" font-size="15.5" text-anchor="middle" fill="#94A3B8">send only part 3 onward</text>

  
  <g filter="url(#p43-soft)">
    <rect x="76" y="751" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="751" width="6" height="90" fill="#059669" clip-path="url(#p43-k9)"/>
  </g>
  <circle cx="114" cy="796" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,785.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="803" font-size="18.5" font-weight="600" fill="#111827">4. Complete the file</text>

  <g filter="url(#p43-soft)">
    <rect x="560" y="745" width="604" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="560" y="745" width="6" height="48" fill="#059669" clip-path="url(#p43-k10)"/>
  </g>
  <circle cx="594" cy="769" r="4.5" fill="#059669"/>
  <text x="618" y="776" font-size="18.5" font-weight="600" fill="#111827">POST /files</text>
  <text x="862" y="818" font-size="15.5" text-anchor="middle" fill="#6B7280">whole-file checksum</text>
  <text x="862" y="841" font-size="15.5" text-anchor="middle" fill="#94A3B8">201 with the File resource</text>

  
  <g fill="none" stroke-width="2">
    <path d="M426,999 H495" stroke="#059669" marker-end="url(#p43-em)"/>
    <path d="M795,999 H864" stroke="#059669" marker-end="url(#p43-em)"/>
  </g>

  <g filter="url(#p43-lift)">
    <rect x="126" y="954" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="126" y="954" width="9" height="90" fill="#059669" clip-path="url(#p43-k11)"/>
  </g>
  <circle cx="164" cy="999" r="18" fill="#FFFFFF"/>
  <g transform="translate(153.56,988.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="190" y="1006" font-size="18.5" font-weight="600" fill="#111827">File</text>

  <g filter="url(#p43-soft)">
    <rect x="495" y="954" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="495" y="954" width="6" height="90" fill="#059669" clip-path="url(#p43-k12)"/>
  </g>
  <circle cx="533" cy="999" r="18" fill="#FFFFFF"/>
  <g transform="translate(522.56,988.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="559" y="1006" font-size="18.5" font-weight="600" fill="#111827">DownloadLocation</text>
  <text x="645" y="1069" font-size="15.5" text-anchor="middle" fill="#6B7280">15 minutes, one file, GET</text>

  <g stroke="#64748B" stroke-width="1.5">
    <path d="M864,970 L864,1028 A150,16 0 0 0 1164,1028 L1164,970" fill="#E2E8F0"/>
    <ellipse cx="1014" cy="970" rx="150" ry="16" fill="#FFFFFF"/>
  </g>
  <text x="1014" y="1012" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Storage</text>
  <text x="1014" y="1069" font-size="15.5" text-anchor="middle" fill="#6B7280">with byte ranges</text>

  
  <rect x="40" y="1120" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1162" text-anchor="middle" font-size="16" fill="#475569">Check integrity twice: once per part on arrival, once for the assembled file.</text>
  <text x="620" y="1190" text-anchor="middle" font-size="16" fill="#475569">The unit of retry is one part, never the whole file.</text>
</svg>