<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Kubernetes control loop: a declared desired state of three replicas of an image and an observed actual state of two running pods both feed a controller, the controller finds the gap of three desired versus two actual and starts one replacement pod, and that correction moves the actual state back to three.">
  <defs>
    <marker id="m06-l01-desired-state-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m06-l01-desired-state-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l01-desired-state-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m06-l01-desired-state-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m06-l01-desired-state-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <rect x="50" y="80" width="1130" height="470" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="120" font-size="20" font-weight="600" fill="#334155">The control loop: it never stops</text>
  <text x="1160" y="120" text-anchor="end" font-size="20" fill="#64748B">you declare it, controllers make reality match</text>

  <g filter="url(#m06-l01-desired-state-soft)">
    <rect x="80" y="180" width="280" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="220" y="215" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Desired state</text>
  <text x="220" y="247" text-anchor="middle" font-size="20" fill="#64748B">three replicas</text>
  <text x="220" y="279" text-anchor="middle" font-size="20" fill="#64748B">of this image</text>
  <g filter="url(#m06-l01-desired-state-soft)">
    <rect x="470" y="180" width="290" height="120" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="615" y="231" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Controller compares</text>
  <text x="615" y="263" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">desired with actual</text>
  <g filter="url(#m06-l01-desired-state-soft)">
    <rect x="860" y="180" width="300" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1010" y="215" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Start one</text>
  <text x="1010" y="247" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">replacement pod</text>
  <text x="1010" y="279" text-anchor="middle" font-size="20" fill="#64748B">self-healing</text>
  <g filter="url(#m06-l01-desired-state-soft)">
    <rect x="470" y="400" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="615" y="451" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Actual state</text>
  <text x="615" y="483" text-anchor="middle" font-size="20" fill="#64748B">two pods running</text>
  <g filter="url(#m06-l01-desired-state-soft)">
    <rect x="80" y="400" width="340" height="120" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="250" y="435" text-anchor="middle" font-size="20" fill="#475569">Every gap becomes an action:</text>
  <text x="250" y="467" text-anchor="middle" font-size="20" fill="#475569">an instance crashes, and a</text>
  <text x="250" y="499" text-anchor="middle" font-size="20" fill="#475569">replacement starts.</text>

  <g fill="none" stroke-width="2.5">
    <path d="M360,240 L462,240" stroke="#7C3AED" stroke-width="2" marker-end="url(#m06-l01-desired-state-vi)"/>
    <path d="M615,392 L615,312" stroke="#475569" stroke-width="2" marker-end="url(#m06-l01-desired-state-sl)"/>
    <path d="M760,240 L852,240" stroke="#DC2626" marker-end="url(#m06-l01-desired-state-rd)"/>
    <path d="M1010,300 L1010,440 L772,440" stroke="#059669" marker-end="url(#m06-l01-desired-state-em)"/>
  </g>

  <text x="411" y="160" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">what you declared</text>
  <text x="806" y="160" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">gap: 3 desired, 2 actual</text>
  <text x="632" y="358" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">what the cluster</text>
  <text x="632" y="384" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">actually reports</text>
  <text x="790" y="420" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one pod starts</text>

  <line x1="60" y1="600" x2="96" y2="600" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="607" font-size="20" fill="#475569">Declared: the state you record</text>
  <line x1="60" y1="640" x2="96" y2="640" stroke="#475569" stroke-width="4"/>
  <text x="108" y="647" font-size="20" fill="#475569">Observed: what is running right now</text>
  <line x1="60" y1="680" x2="96" y2="680" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="687" font-size="20" fill="#475569">The gap between them</text>
  <line x1="60" y1="720" x2="96" y2="720" stroke="#059669" stroke-width="4"/>
  <text x="108" y="727" font-size="20" fill="#475569">The correction the loop applies</text>
</svg>