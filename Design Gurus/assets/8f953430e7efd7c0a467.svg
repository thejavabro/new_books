<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="decides-title decides-desc">
<title id="decides-title">What a partition key decides</title>
<desc id="decides-desc">The key chooses the node, so it sets the load distribution, what a single request can return, what can be transactionally atomic, and where the throughput ceiling sits. It is also the hardest thing in the model to change.</desc>
<defs>
<marker id="decides-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="decides-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="decides-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="decides-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="800" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What a partition key decides</text>
<text x="40" y="86" font-size="21" fill="#4A5568">In a distributed store, the partition key is not a field.</text>
<rect x="40" y="722" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="722" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#6040A8" text-anchor="start">The partition key</text>
<rect x="40" y="168" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Where the data is stored</text>
<path d="M526 196H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 196H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decides-marker-slate)"/>
<rect x="570" y="168" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">key distribution is load distribution</text>
<rect x="40" y="236" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What one request returns</text>
<path d="M526 264H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 264H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decides-marker-slate)"/>
<rect x="570" y="236" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">anything wanted together must share a key</text>
<rect x="40" y="304" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What can be atomic</text>
<path d="M526 332H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 332H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decides-marker-slate)"/>
<rect x="570" y="304" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cheap within a partition, expensive across</text>
<rect x="40" y="372" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Where the ceiling is</text>
<path d="M526 400H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 400H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decides-marker-slate)"/>
<rect x="570" y="372" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="406" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">limits apply per partition, not per table</text>
<rect x="40" y="462" width="1160" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="462" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="498" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Changing it moves every item to a different node,</text><text x="64" y="527" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">which means writing the data again into a new table and cutting over.</text><text x="64" y="556" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">That is a project rather than a migration.</text>
<rect x="40" y="610" width="1160" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="610" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="64" y="644.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Everything else in the model can be revised later.</text><text x="64" y="673.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The partition key is the decision you live with.</text>
<text x="66" y="756" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An interviewer asking about data modeling is very often really asking about this.</text>
</svg>