<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three columns, each holding where load arrives above what the design does about it. Ingest: one celebrity post becomes millions of notifications, and the queue absorbs it, with depth growing on purpose and draining afterwards. Delivery: external providers cap the rate rather than our own capacity, so workers are scaled per topic against each channel and class backlog. Storage: billions of history rows are sharded by user for reads and partitioned by time so old data can be dropped in one operation.">
  <defs>
    <filter id="ntfscale-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ntfscale-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ntfscale-k1"><rect x="65" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ntfscale-k2"><rect x="65" y="360" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ntfscale-k3"><rect x="460" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ntfscale-k4"><rect x="460" y="360" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ntfscale-k5"><rect x="855" y="165" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="ntfscale-k6"><rect x="855" y="360" width="320" height="90" rx="12"/></clipPath>
    <marker id="ntfscale-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ntfscale-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ntfscale-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three places the load lands, three different answers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">About 150 million a day is steady work. A fan-out event turns one publish into tens of thousands a second.</text>

  <rect x="40" y="110" width="370" height="420" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#5B21B6">Ingest</text>
  <rect x="435" y="110" width="370" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="459" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Delivery</text>
  <rect x="830" y="110" width="370" height="420" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="854" y="140" font-size="19.5" font-weight="600" fill="#047857">Storage</text>

  <g fill="none" stroke-width="2">
    <path d="M225 300 V 354" stroke="#7C3AED" marker-end="url(#ntfscale-m-violet)"/>
    <path d="M620 300 V 354" stroke="#2563EB" marker-end="url(#ntfscale-m-blue)"/>
    <path d="M1015 300 V 354" stroke="#059669" marker-end="url(#ntfscale-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ntfscale-soft)">
    <rect x="65" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="65" y="165" width="6" height="90" fill="#64748B" clip-path="url(#ntfscale-k1)"/>
  </g>
  <circle cx="103" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="129" y="217" font-size="21.5" font-weight="600" fill="#111827">One post, millions</text>
  <text x="225" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">a celebrity fan-out</text>
  <g filter="url(#ntfscale-lift)">
    <rect x="65" y="360" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="65" y="360" width="9" height="90" fill="#7C3AED" clip-path="url(#ntfscale-k2)"/>
  </g>
  <circle cx="103" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,394.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="129" y="412" font-size="21.5" font-weight="600" fill="#111827">The queue absorbs it</text>
  <text x="225" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">depth grows on purpose,</text>
  <text x="225" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">and has to drain after</text>
  <g filter="url(#ntfscale-soft)">
    <rect x="460" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="460" y="165" width="6" height="90" fill="#64748B" clip-path="url(#ntfscale-k3)"/>
  </g>
  <circle cx="498" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="524" y="217" font-size="21.5" font-weight="600" fill="#111827">Providers cap us</text>
  <text x="620" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">their rate, not ours</text>
  <g filter="url(#ntfscale-lift)">
    <rect x="460" y="360" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="460" y="360" width="9" height="90" fill="#2563EB" clip-path="url(#ntfscale-k4)"/>
  </g>
  <circle cx="498" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="524" y="412" font-size="21.5" font-weight="600" fill="#111827">Workers per topic</text>
  <text x="620" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">scale each channel and</text>
  <text x="620" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">class on its own backlog</text>
  <g filter="url(#ntfscale-soft)">
    <rect x="855" y="165" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="855" y="165" width="6" height="90" fill="#64748B" clip-path="url(#ntfscale-k5)"/>
  </g>
  <circle cx="893" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="919" y="217" font-size="21.5" font-weight="600" fill="#111827">Billions of rows</text>
  <text x="1015" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">history, kept for a while</text>
  <g filter="url(#ntfscale-lift)">
    <rect x="855" y="360" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="855" y="360" width="9" height="90" fill="#059669" clip-path="url(#ntfscale-k6)"/>
  </g>
  <circle cx="893" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="919" y="412" font-size="21.5" font-weight="600" fill="#111827">Shard and expire</text>
  <text x="1015" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">by user for reads,</text>
  <text x="1015" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">by time so old data drops</text>

  <rect x="40" y="570" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="595" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Backlog is normal</text>
  <text x="323" y="620" font-size="18.5" fill="#475569">Depth growing during a burst is the queue working. Depth growing after it is not.</text>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Not our ceiling</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">Delivery rate is set by Apple, Google and the gateways, so we scale to their limit.</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Two partitions</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">By user so a feed is one read, by time so dropping old data is one operation.</text>
</svg>