<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-label="After a write, a strongly consistent read waits until every replica agrees and always returns the new value. An eventually consistent read answers immediately and may briefly return the old value.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="560" fill="#FFFFFF"/>
  <rect x="40" y="48" width="1160" height="190" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="48" width="9" height="190" rx="4" fill="#059669"/>
  <text x="74" y="88" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Strong consistency</text>
  <rect x="330" y="110" width="210" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="435" y="140" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Write x = 5</text>
  <text x="435" y="168" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">to the primary</text>
  <line x1="544" y1="148" x2="604" y2="148" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-grn)"/>
  <rect x="610" y="110" width="210" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="715" y="140" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Wait</text>
  <text x="715" y="168" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">replicas confirm</text>
  <line x1="824" y1="148" x2="884" y2="148" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-grn)"/>
  <rect x="890" y="110" width="210" height="76" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="995" y="140" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Read x</text>
  <text x="995" y="168" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">returns 5</text>
  <text x="74" y="216" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Always correct. Every write pays the waiting time, and a slow replica slows everyone.</text>
  <rect x="40" y="268" width="1160" height="190" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <rect x="40" y="268" width="9" height="190" rx="4" fill="#D97706"/>
  <text x="74" y="308" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Eventual consistency</text>
  <rect x="330" y="330" width="210" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="435" y="360" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Write x = 5</text>
  <text x="435" y="388" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">acknowledged now</text>
  <line x1="544" y1="368" x2="604" y2="368" stroke="#D97706" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="610" y="330" width="210" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="715" y="360" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Read x</text>
  <text x="715" y="388" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">may return 4</text>
  <line x1="824" y1="368" x2="884" y2="368" stroke="#D97706" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="890" y="330" width="210" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="995" y="360" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Read x again</text>
  <text x="995" y="388" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">now returns 5</text>
  <text x="74" y="436" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Fast, and briefly wrong. The window is usually milliseconds.</text>
  <rect x="40" y="476" width="1160" height="68" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="517" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">This is rarely one answer for the whole system. Account balances need strong. A view counter does not.</text>
</svg>