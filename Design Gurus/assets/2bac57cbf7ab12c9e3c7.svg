<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1306" viewBox="0 0 1560 1306" role="img" aria-label="The full architecture. Clients reach a load balancer and an API gateway, which routes writes to the shortening service and reads to the redirect service. The shortening service takes keys from the key generation service, which is backed by a pool of pre-generated keys and a standby. Both services read and write a partitioned, replicated URL database. The redirect service is fronted by a cache and emits click events to a queue, which consumers batch into an analytics database served by an analytics API. A cleanup service removes expired links.">
