<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A producer such as the order service publishes OrderPlaced events keyed by order_id to the orders topic, which has three partitions. Consumer group A, the notification service, and consumer group B, the analytics service, each read the whole topic; inside each group every partition is assigned to exactly one consumer, and the group keeps one committed offset per partition">
