<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The replacement for two-phase commit. The order service commits locally and publishes an order placed message, the payment service commits its own local charge, and then either the sequence is done or the payment fails and a cancel the order message drives a compensating local commit back at the order service.">
  <defs>
    <marker id="m05-l02-local-commits-chain-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l02-local-commits-chain-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l02-local-commits-chain-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l02-local-commits-chain-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <rect x="50" y="90" width="1140" height="250" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="130" font-size="20" font-weight="600" fill="#065F46">Happy path: local transactions linked by messages</text>
  <text x="1170" y="130" text-anchor="end" font-size="20" fill="#64748B">no cross-machine locks</text>
  <g filter="url(#m05-l02-local-commits-chain-soft)">
    <rect x="60" y="190" width="270" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="195" y="230" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order service</text>
  <text x="195" y="262" text-anchor="middle" font-size="20" fill="#64748B">local commit,</text>
  <text x="195" y="294" text-anchor="middle" font-size="20" fill="#64748B">order placed</text>
  <g filter="url(#m05-l02-local-commits-chain-soft)">
    <rect x="370" y="190" width="230" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="485" y="230" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order placed</text>
  <text x="485" y="262" text-anchor="middle" font-size="20" fill="#64748B">message,</text>
  <text x="485" y="294" text-anchor="middle" font-size="20" fill="#64748B">async handoff</text>
  <g filter="url(#m05-l02-local-commits-chain-soft)">
    <rect x="640" y="190" width="270" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="775" y="230" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment service</text>
  <text x="775" y="262" text-anchor="middle" font-size="20" fill="#64748B">local commit,</text>
  <text x="775" y="294" text-anchor="middle" font-size="20" fill="#64748B">charge the card</text>
  <g filter="url(#m05-l02-local-commits-chain-soft)">
    <rect x="950" y="190" width="230" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1065" y="230" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment</text>
  <text x="1065" y="262" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">succeeds</text>
  <text x="1065" y="294" text-anchor="middle" font-size="20" fill="#64748B">sequence done</text>

  <text x="450" y="382" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Between steps it is eventually consistent, then it converges.</text>

  <rect x="50" y="410" width="1140" height="250" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="450" font-size="20" font-weight="600" fill="#B91C1C">Failure path: compensate, do not roll back</text>
  <text x="1170" y="450" text-anchor="end" font-size="20" fill="#64748B">compensation, not rollback</text>
  <g filter="url(#m05-l02-local-commits-chain-soft)">
    <rect x="60" y="510" width="270" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="195" y="550" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order service</text>
  <text x="195" y="582" text-anchor="middle" font-size="20" fill="#64748B">local commit,</text>
  <text x="195" y="614" text-anchor="middle" font-size="20" fill="#64748B">order cancelled</text>
  <g filter="url(#m05-l02-local-commits-chain-soft)">
    <rect x="370" y="510" width="230" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="485" y="550" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cancel the</text>
  <text x="485" y="582" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">order</text>
  <text x="485" y="614" text-anchor="middle" font-size="20" fill="#64748B">compensating</text>
  <g filter="url(#m05-l02-local-commits-chain-soft)">
    <rect x="640" y="510" width="250" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="765" y="582" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment fails</text>

  <text x="1180" y="545" text-anchor="end" font-size="20" font-weight="600" fill="#B91C1C">Nothing is held open</text>
  <text x="1180" y="578" text-anchor="end" font-size="20" fill="#64748B">no coordinator, and no</text>
  <text x="1180" y="608" text-anchor="end" font-size="20" fill="#64748B">participant left in doubt</text>

  <g fill="none" stroke-width="2.5">
    <path d="M330,255 L362,255" stroke="#D97706" marker-end="url(#m05-l02-local-commits-chain-ab)"/>
    <path d="M600,255 L632,255" stroke="#D97706" marker-end="url(#m05-l02-local-commits-chain-ab)"/>
    <path d="M910,255 L942,255" stroke="#059669" marker-end="url(#m05-l02-local-commits-chain-em)"/>
    <path d="M775,320 L775,502" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m05-l02-local-commits-chain-rd)"/>
    <path d="M640,575 L608,575" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m05-l02-local-commits-chain-rd)"/>
    <path d="M370,575 L338,575" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m05-l02-local-commits-chain-rd)"/>
  </g>

  <text x="346" y="172" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>
  <text x="616" y="172" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">deliver</text>
  <text x="620" y="492" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>
  <text x="350" y="492" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">deliver</text>

  <line x1="60" y1="700" x2="96" y2="700" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="707" font-size="20" fill="#475569">Message handoff: each step publishes, the next step reacts</text>
  <line x1="60" y1="740" x2="96" y2="740" stroke="#059669" stroke-width="4"/>
  <text x="108" y="747" font-size="20" fill="#475569">Success: the sequence is done</text>
  <line x1="60" y1="780" x2="96" y2="780" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="787" font-size="20" fill="#475569">Failure path: compensation, not rollback</text>
</svg>