<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="964" viewBox="0 0 1240 964" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A top down decision tree. The first question asks whether the client must send frequent messages on the same live channel; yes leads to WebSockets. No asks whether every gateway on the path allows a long-lived streaming response; yes leads to SSE and no leads to long polling. Ordinary polling sits beside the tree for cases where a published delay is acceptable.">
  <defs>
    <marker id="ph-vm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="ph-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="ph-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="ph-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ph-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ph-k1"><rect x="100" y="100" width="560" height="112" rx="12"/></clipPath>
    <clipPath id="ph-k2"><rect x="100" y="272" width="560" height="112" rx="12"/></clipPath>
    <clipPath id="ph-k3"><rect x="800" y="111" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ph-k4"><rect x="800" y="283" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ph-k5"><rect x="800" y="418" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ph-k6"><rect x="450" y="622" width="340" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="964" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="496" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Choosing live delivery by direction</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">two questions, three outcomes</text>

  
  <g fill="none" stroke-width="2">
    <path d="M660,156 H800" stroke="#7C3AED" marker-end="url(#ph-vm)"/>
    <path d="M380,212 V272" stroke="#64748B" marker-end="url(#ph-sl)"/>
    <path d="M660,328 H800" stroke="#059669" stroke-width="2.5" marker-end="url(#ph-em)"/>
    <path d="M380,384 V451 Q380,463 392,463 H800" stroke="#64748B" marker-end="url(#ph-sl)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="730" y="148" fill="#5B21B6">Yes</text>
    <text x="730" y="320" fill="#047857">Yes</text>
    <text x="408" y="248" fill="#475569">No</text>
    <text x="620" y="453" fill="#475569">No</text>
  </g>

  
  <g filter="url(#ph-soft)">
    <rect x="100" y="100" width="560" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="100" y="100" width="6" height="112" fill="#64748B" clip-path="url(#ph-k1)"/>
  </g>
  <circle cx="138" cy="156" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,145.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="164" y="149" font-size="18.5" font-weight="600" fill="#111827">Does the client need to send frequent</text>
  <text x="164" y="177" font-size="18.5" font-weight="600" fill="#111827">messages on the same live channel?</text>

  
  <g filter="url(#ph-soft)">
    <rect x="800" y="111" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="800" y="111" width="6" height="90" fill="#7C3AED" clip-path="url(#ph-k3)"/>
  </g>
  <circle cx="838" cy="156" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,145.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="864" y="163" font-size="18.5" font-weight="600" fill="#111827">WebSockets</text>

  
  <g filter="url(#ph-soft)">
    <rect x="100" y="272" width="560" height="112" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="100" y="272" width="6" height="112" fill="#64748B" clip-path="url(#ph-k2)"/>
  </g>
  <circle cx="138" cy="328" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,317.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="164" y="321" font-size="18.5" font-weight="600" fill="#111827">Can every gateway on the path allow</text>
  <text x="164" y="349" font-size="18.5" font-weight="600" fill="#111827">a long-lived streaming response?</text>

  
  <g filter="url(#ph-lift)">
    <rect x="800" y="283" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="800" y="283" width="9" height="90" fill="#059669" clip-path="url(#ph-k4)"/>
  </g>
  <circle cx="838" cy="328" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,317.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="864" y="335" font-size="18.5" font-weight="600" fill="#111827">SSE</text>

  
  <g filter="url(#ph-soft)">
    <rect x="800" y="418" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="800" y="418" width="6" height="90" fill="#D97706" clip-path="url(#ph-k5)"/>
  </g>
  <circle cx="838" cy="463" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,452.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="864" y="470" font-size="18.5" font-weight="600" fill="#111827">Long polling</text>

  
  <rect x="40" y="570" width="1160" height="216" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="600" font-size="16.5" font-weight="600" fill="#475569">Beside the tree, not inside it</text>

  <g filter="url(#ph-soft)">
    <rect x="450" y="622" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="622" width="6" height="90" fill="#64748B" clip-path="url(#ph-k6)"/>
  </g>
  <circle cx="488" cy="667" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,656.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="514" y="674" font-size="18.5" font-weight="600" fill="#111827">Ordinary polling</text>
  <text x="620" y="737" font-size="15.5" text-anchor="middle" fill="#6B7280">Use it when a published delay is acceptable.</text>
  <text x="620" y="760" font-size="15.5" text-anchor="middle" fill="#94A3B8">It is the simplest option to operate.</text>

  
  <rect x="40" y="820" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="862" text-anchor="middle" font-size="16" fill="#475569">SSE is not a smaller WebSocket. It is a smaller contract for a smaller direction requirement.</text>
  <text x="620" y="892" text-anchor="middle" font-size="16" fill="#475569">Ask who must send after the connection is open, not how real time it must feel.</text>
</svg>