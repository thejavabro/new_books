<text x="1097" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8">11</text>
<text x="620" y="290" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">Moving a number to the front never shifts anything, it just claims the next reserved slot</text>
<text x="620" y="318" text-anchor="middle" font-size="18" fill="#475569">so 5 spare slots at the left are enough for all 5 queries</text>
<rect x="40" y="510" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="550" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The position of a number is how many filled slots sit before it</text>
<text x="620" y="582" text-anchor="middle" font-size="18.5" fill="#475569">Once the position is a count of filled slots, no list ever has to be rebuilt</text>
</svg>