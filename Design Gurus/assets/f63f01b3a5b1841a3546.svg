<rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Where does each of [4, 3, 2, 7, 5] sit before it is moved to the front?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The list starts as 1 to 7, and every queried number jumps to the front</text>
<rect x="40" y="106" width="1160" height="386" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">12 slots: 5 empty ones reserved in front, then the list itself</text>
<text x="324" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">queries</text>
