<text x="753" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="753" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8">7</text>
<rect x="799" y="388" width="80" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
