<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A primary key uniquely identifies each row in its table, and a foreign key in another table points back at it">
