  <path d="M 1104 268 V 316 H 150 V 268" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#db3-violet)"/>

  <text x="150" y="366" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Primary key</text>
  <text x="150" y="396" font-size="20" fill="#475569" text-anchor="middle">unique per row</text>
  <text x="1104" y="366" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Foreign key</text>
  <text x="1104" y="396" font-size="20" fill="#475569" text-anchor="middle">points at that key</text>

  <text x="620" y="366" font-size="20" fill="#475569" text-anchor="middle">Referential integrity means this arrow</text>
  <text x="620" y="396" font-size="20" fill="#475569" text-anchor="middle">can never point at a row that is not there</text>
</svg>