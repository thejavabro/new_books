  <text x="150" y="126" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">customer_id</text>
  <text x="362" y="126" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">name</text>
  <text x="150" y="184" font-size="20" fill="#1E3A8A" text-anchor="middle">c-001</text>
  <text x="362" y="184" font-size="20" fill="#334155" text-anchor="middle">John Doe</text>
  <text x="150" y="242" font-size="20" fill="#1E3A8A" text-anchor="middle">c-002</text>
  <text x="362" y="242" font-size="20" fill="#334155" text-anchor="middle">Jane Smith</text>

  <text x="790" y="126" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">order_id</text>
  <text x="954" y="126" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">product</text>
  <text x="1104" y="126" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">customer_id</text>
  <text x="790" y="184" font-size="20" fill="#065F46" text-anchor="middle">o-1001</text>
  <text x="954" y="184" font-size="20" fill="#334155" text-anchor="middle">Laptop</text>
  <text x="1104" y="184" font-size="20" fill="#5B21B6" text-anchor="middle">c-001</text>
