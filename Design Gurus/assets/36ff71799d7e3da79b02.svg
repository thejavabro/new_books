    <rect x="884" y="92" width="140" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="1028" y="92" width="152" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="700" y="150" width="180" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
