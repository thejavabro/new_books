    </marker>
    <marker id="evdb3-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="evdb3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="evdb3-k1"><rect x="520" y="36" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="evdb3-k2"><rect x="170" y="256" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="evdb3-k3"><rect x="170" y="421" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="evdb3-k4"><rect x="170" y="586" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="evdb3-k5"><rect x="770" y="256" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="evdb3-k6"><rect x="770" y="421" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="evdb3-k7"><rect x="770" y="586" width="300" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="936" fill="#FFFFFF"/>
  <rect x="40" y="196" width="560" height="584" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
  <text x="64" y="226" font-size="16.5" font-weight="600" fill="#BE185D">Filter after the search</text>
  <rect x="640" y="196" width="560" height="584" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="664" y="226" font-size="16.5" font-weight="600" fill="#047857">Filter during the search</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M620,163 V169 Q620,181 608,181 H332 Q320,181 320,193 V256" marker-end="url(#evdb3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M620,163 V169 Q620,181 632,181 H908 Q920,181 920,193 V256" marker-end="url(#evdb3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M320,383 V421" marker-end="url(#evdb3-mslate)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M320,548 V586" marker-end="url(#evdb3-mrose)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M920,383 V421" marker-end="url(#evdb3-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M920,548 V586" marker-end="url(#evdb3-memerald)"/></g>
