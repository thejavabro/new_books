  <circle cx="558" cy="81" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,70.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="584" y="88" font-size="18.5" font-weight="600" fill="#111827">One search</text>
  <text x="620" y="151" font-size="15.5" text-anchor="middle" fill="#6B7280">nearest chunks where team = payments</text>
  <g filter="url(#evdb3-soft)">
    <rect x="170" y="256" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="170" y="256" width="6" height="90" fill="#64748B" clip-path="url(#evdb3-k2)"/>
  </g>
  <circle cx="208" cy="301" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,290.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="234" y="308" font-size="18.5" font-weight="600" fill="#111827">ANN search</text>
  <text x="320" y="371" font-size="15.5" text-anchor="middle" fill="#6B7280">100 nearest chunks, any team</text>
  <g filter="url(#evdb3-soft)">
    <rect x="170" y="421" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
