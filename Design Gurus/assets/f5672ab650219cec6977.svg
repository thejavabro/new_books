  <text x="834" y="308" font-size="18.5" font-weight="600" fill="#111827">Filtered HNSW</text>
  <text x="920" y="371" font-size="15.5" text-anchor="middle" fill="#6B7280">checks the filter while it walks the graph</text>
  <g filter="url(#evdb3-soft)">
    <rect x="770" y="421" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="770" y="421" width="6" height="90" fill="#7C3AED" clip-path="url(#evdb3-k6)"/>
  </g>
  <circle cx="808" cy="466" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,455.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="834" y="473" font-size="18.5" font-weight="600" fill="#111827">Keeps searching</text>
  <text x="920" y="536" font-size="15.5" text-anchor="middle" fill="#6B7280">until enough chunks pass</text>
  <g filter="url(#evdb3-soft)">
    <rect x="770" y="586" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="770" y="586" width="6" height="90" fill="#059669" clip-path="url(#evdb3-k7)"/>
  </g>
  <circle cx="808" cy="631" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,620.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="834" y="638" font-size="18.5" font-weight="600" fill="#111827">Result</text>
  <text x="920" y="701" font-size="15.5" text-anchor="middle" fill="#6B7280">the nearest permitted chunks</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FDF2F8" stroke-width="7"><text x="334" y="568" fill="#BE185D">about 1 of 100 survives</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#ECFDF5" stroke-width="7"><text x="934" y="403" fill="#5B21B6">failing chunks are never returned</text></g>
  <text x="320" y="748" font-size="15.5" text-anchor="middle" fill="#6B7280">the best payments chunks were never reached</text>
  <rect x="40" y="820" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="865" text-anchor="middle" font-size="16" fill="#475569">Filtering during the search keeps the true nearest permitted chunks in reach.</text>
</svg>