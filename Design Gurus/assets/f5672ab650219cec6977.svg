<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="936" viewBox="0 0 1240 936" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Filtering after the search can discard every permitted result, while filtering during the search keeps looking until it finds enough">
  <defs>
    <marker id="evdb3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
