  <text x="234" y="638" font-size="18.5" font-weight="600" fill="#111827">Result</text>
  <text x="320" y="701" font-size="15.5" text-anchor="middle" fill="#6B7280">about 1 chunk, often none</text>
  <g filter="url(#evdb3-soft)">
    <rect x="770" y="256" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
