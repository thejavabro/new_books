  <text x="234" y="473" font-size="18.5" font-weight="600" fill="#111827">Filter: team = payments</text>
  <text x="320" y="536" font-size="15.5" text-anchor="middle" fill="#6B7280">only 1% of chunks match</text>
  <g filter="url(#evdb3-soft)">
    <rect x="170" y="586" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
