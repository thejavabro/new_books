<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Self-registration, where the service registers itself: servers A, B and C each register with the service registry, and the broker discovers services from the registry. Third-party registration, where a separate agent handles registration: a registration agent watches servers A, B and C and registers them with the service registry on their behalf, and the broker discovers services from the registry">
