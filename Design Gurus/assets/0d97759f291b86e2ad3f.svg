<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="370" viewBox="0 0 1240 370" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Timeline of heartbeats arriving on schedule, then going missing; when the silence outlasts the timeout window, the server is declared dead">
  <rect x="0" y="0" width="1240" height="370" fill="#FFFFFF"/>
  <defs>
    <marker id="hb2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="hb2-slateL" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#475569"/></marker>
  </defs>

  
  <rect x="580" y="40" width="400" height="180" rx="12" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="780" y="65" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">timeout window</text>
  <text x="780" y="91" font-size="20" fill="#92400E" text-anchor="middle">how long silence is tolerated</text>

  
  <line x1="90" y1="200" x2="1180" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#hb2-slate)"/>
  <text x="1160" y="238" font-size="20" fill="#475569" text-anchor="middle">time</text>

  
  <line x1="120" y1="150" x2="120" y2="200" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="260" y1="150" x2="260" y2="200" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="400" y1="150" x2="400" y2="200" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="540" y1="150" x2="540" y2="200" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <text x="490" y="238" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">last heartbeat</text>

  
  <line x1="268" y1="125" x2="392" y2="125" stroke="#64748B" stroke-width="1.5" marker-start="url(#hb2-slateL)" marker-end="url(#hb2-slate)"/>
  <text x="330" y="100" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">heartbeat interval</text>

  
  <text x="330" y="40" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Heartbeats arrive on schedule</text>
  <text x="330" y="68" font-size="20" fill="#64748B" text-anchor="middle">the server is considered alive</text>

  
  <line x1="640" y1="145" x2="640" y2="200" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="631" y1="121" x2="649" y2="139" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="631" y1="139" x2="649" y2="121" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="760" y1="145" x2="760" y2="200" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="751" y1="121" x2="769" y2="139" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="751" y1="139" x2="769" y2="121" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="880" y1="145" x2="880" y2="200" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="871" y1="121" x2="889" y2="139" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="871" y1="139" x2="889" y2="121" stroke="#DC2626" stroke-width="2.5"/>

  
  <text x="760" y="238" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">after a few misses: suspected</text>

  
  <line x1="980" y1="30" x2="980" y2="230" stroke="#DC2626" stroke-width="2.5"/>
  <circle cx="980" cy="200" r="6" fill="#DC2626"/>
  <text x="1105" y="110" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">declared dead</text>
  <text x="1105" y="140" font-size="20" fill="#B91C1C" text-anchor="middle">stop routing traffic,</text>
  <text x="1105" y="167" font-size="20" fill="#B91C1C" text-anchor="middle">start a replacement</text>

  
  <line x1="210" y1="320" x2="238" y2="320" stroke="#3B82F6" stroke-width="3"/>
  <text x="248" y="327" font-size="20" fill="#475569">heartbeat received</text>
  <line x1="488" y1="320" x2="516" y2="320" stroke="#DC2626" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="526" y="327" font-size="20" fill="#475569">expected heartbeat, missed</text>
  <rect x="849" y="310" width="28" height="20" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="887" y="327" font-size="20" fill="#475569">timeout window</text>
</svg>