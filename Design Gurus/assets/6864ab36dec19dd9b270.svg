<text x="620" y="508" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">After squaring, the largest value sits at one of the two ends, never in the middle</text>
<text x="620" y="540" text-anchor="middle" font-size="18.5" fill="#475569">So compare the two ends, take the bigger square, and fill the answer from the back</text>
