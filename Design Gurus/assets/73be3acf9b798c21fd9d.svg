<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="648" viewBox="0 0 1240 648" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The string aab before any cut is made">
<defs>
<filter id="su-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="648" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Into how many different pieces can "aab" be cut?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The pieces have to join back into the string, and no two of them may be the same</text>
<rect x="40" y="106" width="1160" height="396" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">A cut is chosen at each position, then the rest of the string is cut the same way</text>
<text x="442" y="210" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">string</text>
<rect x="464" y="172" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="512" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">a</text>
<text x="512" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="572" y="172" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">a</text>
<text x="620" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="680" y="172" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="728" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">b</text>
<text x="728" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<text x="533" y="338" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">pieces taken</text>
<text x="561" y="337" font-size="18" fill="#475569">nothing taken yet</text>
<text x="620" y="412" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">Every possible first piece is tried, then every possible second piece, and so on</text>
<text x="620" y="442" text-anchor="middle" font-size="18" fill="#475569">A piece that has already been used is refused before the search goes any deeper</text>
<rect x="40" y="524" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="564" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The refusal is what keeps the search small</text>
<text x="620" y="596" text-anchor="middle" font-size="18.5" fill="#475569">A repeated piece can never lead to a valid split, so that branch is dropped at once</text>
</svg>