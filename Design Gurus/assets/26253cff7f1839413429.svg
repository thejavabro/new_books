<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="524" viewBox="0 0 1240 524" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In the CAP theorem availability is a property that either holds or does not hold: every working machine gives an answer. In the Key Characteristics lesson availability is a measured percentage of the promised time, such as 99.9 percent.">
  <rect x="0" y="0" width="1240" height="524" fill="#FFFFFF"/>
  <defs>
    <marker id="cp2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cp2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cp2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cp2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="cp2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="cp2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="cp2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="cp2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="cp2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The word availability means two different things</text>
  <g filter="url(#cp2-soft)"><rect x="334" y="56" width="436" height="40" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="552" y="84" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">In the CAP theorem</text>
  <g filter="url(#cp2-soft)"><rect x="780" y="56" width="436" height="40" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="998" y="84" font-size="21" font-weight="700" fill="#0F766E" text-anchor="middle">In Key Characteristics</text>
  <rect x="24" y="106" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="155" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">What it is</text>
  <g filter="url(#cp2-soft)"><rect x="334" y="106" width="436" height="84" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="552" y="141" font-size="19" fill="#0F172A" text-anchor="middle">A property that either holds</text>
  <text x="552" y="167" font-size="19" fill="#0F172A" text-anchor="middle">or does not hold</text>
  <g filter="url(#cp2-soft)"><rect x="780" y="106" width="436" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="998" y="141" font-size="19" fill="#0F172A" text-anchor="middle">A number you measure</text>
  <text x="998" y="167" font-size="19" fill="#0F172A" text-anchor="middle">over a period of time</text>
  <rect x="24" y="200" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="249" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">The question it asks</text>
  <g filter="url(#cp2-soft)"><rect x="334" y="200" width="436" height="84" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="552" y="235" font-size="19" fill="#0F172A" text-anchor="middle">Did every working machine</text>
  <text x="552" y="261" font-size="19" fill="#0F172A" text-anchor="middle">give an answer?</text>
  <g filter="url(#cp2-soft)"><rect x="780" y="200" width="436" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="998" y="235" font-size="19" fill="#0F172A" text-anchor="middle">What share of the promised</text>
  <text x="998" y="261" font-size="19" fill="#0F172A" text-anchor="middle">time could we answer?</text>
  <rect x="24" y="294" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="343" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">The answer looks like</text>
  <g filter="url(#cp2-soft)"><rect x="334" y="294" width="436" height="84" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="552" y="343" font-size="19" fill="#0F172A" text-anchor="middle">yes, or no</text>
  <g filter="url(#cp2-soft)"><rect x="780" y="294" width="436" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="998" y="343" font-size="19" fill="#0F172A" text-anchor="middle">99.9 percent</text>
  <rect x="24" y="388" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="437" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">When you use it</text>
  <g filter="url(#cp2-soft)"><rect x="334" y="388" width="436" height="84" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="552" y="437" font-size="19" fill="#0F172A" text-anchor="middle">While the network is broken</text>
  <g filter="url(#cp2-soft)"><rect x="780" y="388" width="436" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="998" y="437" font-size="19" fill="#0F172A" text-anchor="middle">In a monthly report</text>
  <text x="620" y="512" font-size="19" fill="#64748B" text-anchor="middle">Both meanings are common. Say which one you mean before you use the word.</text>
</svg>