    <filter id="p1w-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1w-k1"><rect x="76" y="174" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p1w-k2"><rect x="644" y="174" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p1w-k3"><rect x="76" y="383" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p1w-k4"><rect x="644" y="383" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p1w-k5"><rect x="360" y="520" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p1w-k6"><rect x="76" y="729" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p1w-k7"><rect x="644" y="729" width="520" height="90" rx="12"/></clipPath>
