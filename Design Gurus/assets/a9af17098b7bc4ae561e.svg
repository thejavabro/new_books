    <rect x="76" y="174" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p1w-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">What is being addressed?</text>
  <text x="336" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">Resources and product vocabulary, not action-filled URLs</text>

  <g filter="url(#p1w-soft)">
    <rect x="644" y="174" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="644" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p1w-k2)"/>
  </g>
  <circle cx="682" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="708" y="226" font-size="18.5" font-weight="600" fill="#111827">How is it addressed?</text>
  <text x="904" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">Predictable collection and member URLs</text>

  
  <rect x="40" y="335" width="1160" height="322" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="365" font-size="16.5" font-weight="600" fill="#047857">What a call returns</text>
  <text x="1176" y="365" text-anchor="end" font-size="15.5" fill="#6B7280">three questions</text>

  <g filter="url(#p1w-soft)">
    <rect x="76" y="383" width="520" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="383" width="6" height="90" fill="#059669" clip-path="url(#p1w-k3)"/>
  </g>
  <circle cx="114" cy="428" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,417.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="435" font-size="18.5" font-weight="600" fill="#111827">What does success mean?</text>
  <text x="336" y="498" text-anchor="middle" font-size="15.5" fill="#6B7280">A published status, body, and lasting state</text>

  <g filter="url(#p1w-soft)">
    <rect x="644" y="383" width="520" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="644" y="383" width="6" height="90" fill="#059669" clip-path="url(#p1w-k4)"/>
  </g>
  <circle cx="682" cy="428" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,417.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="708" y="435" font-size="18.5" font-weight="600" fill="#111827">What does invalid input return?</text>
  <text x="904" y="498" text-anchor="middle" font-size="15.5" fill="#6B7280">400 with the course error object</text>

  <g filter="url(#p1w-soft)">
    <rect x="360" y="520" width="520" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="360" y="520" width="6" height="90" fill="#059669" clip-path="url(#p1w-k5)"/>
  </g>
  <circle cx="398" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,554.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="424" y="572" font-size="18.5" font-weight="600" fill="#111827">How are private resources hidden?</text>
  <text x="620" y="635" text-anchor="middle" font-size="15.5" fill="#6B7280">404, rather than confirming another tenant's resource</text>

  
  <rect x="40" y="681" width="1160" height="185" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="711" font-size="16.5" font-weight="600" fill="#5B21B6">Lists and repeated calls</text>
  <text x="1176" y="711" text-anchor="end" font-size="15.5" fill="#6B7280">two questions</text>

  <g filter="url(#p1w-soft)">
    <rect x="76" y="729" width="520" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="729" width="6" height="90" fill="#7C3AED" clip-path="url(#p1w-k6)"/>
  </g>
  <circle cx="114" cy="774" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,763.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="781" font-size="18.5" font-weight="600" fill="#111827">How are lists paged?</text>
  <text x="336" y="844" text-anchor="middle" font-size="15.5" fill="#6B7280">An opaque cursor over a stable order</text>

  <g filter="url(#p1w-soft)">
    <rect x="644" y="729" width="520" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="644" y="729" width="6" height="90" fill="#7C3AED" clip-path="url(#p1w-k7)"/>
  </g>
  <circle cx="682" cy="774" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,763.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="708" y="781" font-size="18.5" font-weight="600" fill="#111827">How is a repeated create made safe?</text>
  <text x="904" y="844" text-anchor="middle" font-size="15.5" fill="#6B7280">An idempotency key, with its result retained for 24 hours</text>

  
  <rect x="40" y="890" width="1160" height="185" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="920" font-size="16.5" font-weight="600" fill="#B45309">Load and time</text>
  <text x="1176" y="920" text-anchor="end" font-size="15.5" fill="#6B7280">two questions</text>

  <g filter="url(#p1w-soft)">
    <rect x="76" y="938" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="938" width="6" height="90" fill="#D97706" clip-path="url(#p1w-k8)"/>
  </g>
  <circle cx="114" cy="983" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,972.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="990" font-size="18.5" font-weight="600" fill="#111827">How is overload reported?</text>
  <text x="336" y="1053" text-anchor="middle" font-size="15.5" fill="#6B7280">429 with Retry-After and named limit information</text>

  <g filter="url(#p1w-soft)">
    <rect x="644" y="938" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="644" y="938" width="6" height="90" fill="#D97706" clip-path="url(#p1w-k9)"/>
  </g>
  <circle cx="682" cy="983" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,972.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="708" y="990" font-size="18.5" font-weight="600" fill="#111827">How long may the call take?</text>
  <text x="904" y="1053" text-anchor="middle" font-size="15.5" fill="#6B7280">A published and enforced server deadline</text>

  
  <rect x="40" y="1104" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1149" text-anchor="middle" font-size="16" fill="#475569">It makes ambiguity more expensive, because the work can be slow, metered, and billed.</text>
</svg>