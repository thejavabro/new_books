    <clipPath id="p1w-k9"><rect x="644" y="938" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p1w-kc"><rect x="670" y="66" width="18" height="14" rx="4"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1220" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The model does not excuse an ambiguous contract</text>
  <rect x="670" y="66" width="18" height="14" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <rect x="670" y="66" width="4" height="14" fill="#2563EB" clip-path="url(#p1w-kc)"/>
  <text x="696" y="77" font-size="15.5" fill="#6B7280">the caller still asks</text>

  
  <rect x="40" y="126" width="1160" height="185" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">The shape of the API</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two questions</text>

