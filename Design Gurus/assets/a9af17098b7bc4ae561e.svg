<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1220" viewBox="0 0 1240 1220" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Nine ordinary API questions an AI API must still answer, each with the course rule that still applies: resources and product vocabulary, predictable URLs, a published success meaning, 400 for invalid input, private 404, opaque cursors, a 24-hour idempotency key, 429 with Retry-After, and an enforced server deadline.">
