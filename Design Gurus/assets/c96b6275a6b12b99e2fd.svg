<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="616" viewBox="0 0 1240 616" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The life of a rebuild lock: acquired atomically, held while the value is recomputed, released on success, and expired automatically by its TTL if the holder crashes">
  <rect x="0" y="0" width="1240" height="616" fill="#FFFFFF"/>
  <defs>
    <marker id="ca8-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="ca8-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ca8-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="ca8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The life of one rebuild lock</text>

  
  <line x1="352" y1="196" x2="450" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#ca8-slate)"/>
  <line x1="762" y1="196" x2="860" y2="196" stroke="#059669" stroke-width="2" marker-end="url(#ca8-emerald)"/>
  <text x="806" y="172" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">done</text>

  <g filter="url(#ca8-soft)">
    <rect x="80" y="150" width="272" height="92" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="450" y="150" width="312" height="92" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="860" y="150" width="272" height="92" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="216" y="184" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Acquired</text>
  <text x="216" y="216" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">SETNX key</text>

  <text x="606" y="184" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Held</text>
  <text x="606" y="216" font-size="20" fill="#92400E" text-anchor="middle">the value is recomputed</text>

  <text x="996" y="184" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Released</text>
  <text x="996" y="216" font-size="20" fill="#065F46" text-anchor="middle">waiters read the new value</text>

  
  <path d="M606 246 L606 340" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#ca8-red)"/>
  <text x="622" y="298" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">holder crashes</text>

  <g filter="url(#ca8-soft)">
    <rect x="404" y="348" width="404" height="92" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="606" y="382" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Expired by its TTL</text>
  <text x="606" y="414" font-size="20" fill="#B91C1C" text-anchor="middle">the next request can acquire it</text>

  <path d="M404 394 L216 394 L216 250" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ca8-emerald)"/>
  <text x="228" y="330" font-size="20" fill="#065F46">the next request acquires it</text>

  
  <rect x="80" y="474" width="1080" height="112" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="506" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Two rules keep this safe</text>
  <text x="620" y="538" font-size="20" fill="#475569" text-anchor="middle">Always set a TTL, so a crashed holder cannot deadlock the key forever.</text>
  <text x="620" y="566" font-size="20" fill="#475569" text-anchor="middle">Lock per key, never globally, so unrelated entries still rebuild in parallel.</text>
</svg>