<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="MongoDB pauses writes while a new primary is elected which makes it CP, while Cassandra has no primary and every node keeps accepting writes which makes it AP">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="cp8-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="cp8-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="cp8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="1200" height="220" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="78" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">MongoDB: one primary takes every write, so losing it means a pause</text>

  <line x1="60" y1="212" x2="1180" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#cp8-slate)"/>
  <text x="1120" y="242" font-size="20" fill="#475569" text-anchor="middle">time</text>

  <g filter="url(#cp8-soft)">
    <rect x="60" y="110" width="380" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="450" y="110" width="300" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="760" y="110" width="380" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="250" y="144" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Primary is healthy</text>
  <text x="250" y="172" font-size="20" fill="#059669" text-anchor="middle">writes accepted</text>
  <text x="600" y="144" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Primary is lost</text>
  <text x="600" y="172" font-size="20" fill="#DC2626" text-anchor="middle">election, writes paused</text>
  <text x="950" y="144" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">New primary elected</text>
  <text x="950" y="172" font-size="20" fill="#059669" text-anchor="middle">writes accepted again</text>

  <rect x="20" y="290" width="1200" height="230" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="328" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Cassandra: no primary, so a partition pauses nothing</text>

  <line x1="547" y1="410" x2="583" y2="410" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="657" y1="410" x2="693" y2="410" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M602,394 L638,426 M638,394 L602,426" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="446" x2="185" y2="410" stroke="#059669" stroke-width="2.5" marker-end="url(#cp8-emerald)"/>
  <line x1="395" y1="446" x2="395" y2="410" stroke="#059669" stroke-width="2.5" marker-end="url(#cp8-emerald)"/>
  <line x1="845" y1="446" x2="845" y2="410" stroke="#059669" stroke-width="2.5" marker-end="url(#cp8-emerald)"/>
  <line x1="1055" y1="446" x2="1055" y2="410" stroke="#059669" stroke-width="2.5" marker-end="url(#cp8-emerald)"/>

  <g filter="url(#cp8-soft)">
    <rect x="95" y="360" width="180" height="62" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="305" y="360" width="180" height="62" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="755" y="360" width="180" height="62" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="965" y="360" width="180" height="62" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="185" y="399" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>
  <text x="395" y="399" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>
  <text x="845" y="399" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>
  <text x="1055" y="399" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>
  <text x="290" y="480" font-size="20" fill="#065F46" text-anchor="middle">writes keep landing here</text>
  <text x="950" y="480" font-size="20" fill="#065F46" text-anchor="middle">and here, reconciled later</text>
</svg>