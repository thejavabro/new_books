<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="decay-title decay-desc">
<title id="decay-title">What decays between drills</title>
<desc id="decay-desc">Permissions, secrets, images, capacity, a hidden single-region dependency, configuration drift and the people who wrote the runbook. Knowing the list makes a first drill much more productive.</desc>
<defs>
<marker id="decay-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="decay-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="decay-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="decay-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="740" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What decays between drills</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Knowing the list makes a first drill much more productive.</text>
<rect x="40" y="662" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="662" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="390" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="235" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Permissions</text>
<path d="M436 146H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 146H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decay-marker-slate)"/>
<rect x="480" y="118" width="720" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a role granted in the primary and never in the secondary</text>
<rect x="40" y="180" width="390" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="235" y="214" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Secrets</text>
<path d="M436 208H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 208H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decay-marker-slate)"/>
<rect x="480" y="180" width="720" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="214" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">created in one region's store, or rotated in one place only</text>
<rect x="40" y="242" width="390" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="235" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Images and artifacts</text>
<path d="M436 270H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 270H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decay-marker-slate)"/>
<rect x="480" y="242" width="720" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="276" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the tag that exists in one registry and was never copied</text>
<rect x="40" y="304" width="390" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="235" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Capacity</text>
<path d="M436 332H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 332H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decay-marker-slate)"/>
<rect x="480" y="304" width="720" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="325.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the second region has never run at full load,</text><text x="500" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so nothing has confirmed it is there</text>
<rect x="40" y="366" width="390" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="235" y="400" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A hidden single-region dependency</text>
<path d="M436 394H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 394H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decay-marker-slate)"/>
<rect x="480" y="366" width="720" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="400" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the one service or third party that only exists in the primary</text>
<rect x="40" y="428" width="390" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="235" y="462" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Configuration drift</text>
<path d="M436 456H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 456H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decay-marker-slate)"/>
<rect x="480" y="428" width="720" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="462" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">months of small changes applied to the primary and not mirrored</text>
<rect x="40" y="490" width="390" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="235" y="524" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">People</text>
<path d="M436 518H470" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M436 518H470" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decay-marker-slate)"/>
<rect x="480" y="490" width="720" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="500" y="511.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the runbook author changed teams,</text><text x="500" y="536.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and what was obvious to them is unwritten</text>
<rect x="40" y="564" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="564" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="593" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Every item is a question you can answer today without an incident.</text><text x="64" y="619" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">That is the entire argument for drilling.</text>
<text x="66" y="696" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Specific things rot, and you can go looking for them.</text>
</svg>