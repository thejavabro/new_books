<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A timeline of working periods separated by short broken periods. MTBF is the average working time before a failure. MTTR is the average repair time. Availability equals MTBF divided by MTBF plus MTTR.">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="kd7-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="kd7-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="kd7-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="kd7-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="kd7-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="kd7-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="kd7-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="kd7-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Availability is what reliability and manageability produce together</text>
  <g filter="url(#kd7-soft)"><rect x="60" y="84" width="400" height="66" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="260" y="126" font-size="20" fill="#0F172A" text-anchor="middle">working</text>
  <g filter="url(#kd7-soft)"><rect x="460" y="84" width="90" height="66" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="505" y="126" font-size="20" fill="#B91C1C" text-anchor="middle">broken</text>
  <g filter="url(#kd7-soft)"><rect x="550" y="84" width="340" height="66" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="720" y="126" font-size="20" fill="#0F172A" text-anchor="middle">working</text>
  <g filter="url(#kd7-soft)"><rect x="890" y="84" width="70" height="66" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="925" y="126" font-size="20" fill="#B91C1C" text-anchor="middle">broken</text>
  <g filter="url(#kd7-soft)"><rect x="960" y="84" width="150" height="66" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1035" y="126" font-size="20" fill="#0F172A" text-anchor="middle">working</text>
  <text x="1180" y="126" font-size="18" fill="#64748B" text-anchor="end">time</text>
  <path d="M60 164 v10 H460 v-10" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="260" y="202" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">MTBF</text>
  <text x="260" y="228" font-size="18" fill="#64748B" text-anchor="middle">average time between failures</text>
  <path d="M460 164 v10 H550 v-10" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="505" y="202" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle">MTTR</text>
  <text x="505" y="228" font-size="18" fill="#64748B" text-anchor="middle">average repair time</text>
  <rect x="340" y="300" width="560" height="96" rx="11" fill="#EEF2FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="620" y="344" font-size="26" font-weight="700" fill="#0F172A" text-anchor="end">Availability =</text>
  <text x="760" y="328" font-size="24" font-weight="700" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">MTBF</text>
  <path d="M674 340 H846" fill="none" stroke="#0F172A" stroke-width="2.4"/>
  <text x="760" y="374" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">MTBF + MTTR</text>
  <g filter="url(#kd7-soft)"><rect x="60" y="300" width="250" height="96" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="185" y="336" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">Break less often</text>
  <text x="185" y="366" font-size="19" fill="#64748B" text-anchor="middle">reliability work</text>
  <line x1="316" y1="348" x2="334" y2="348" stroke="#059669" stroke-width="2.2" marker-end="url(#kd7-e)"/>
  <g filter="url(#kd7-soft)"><rect x="930" y="300" width="250" height="96" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1055" y="336" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">Repair faster</text>
  <text x="1055" y="366" font-size="19" fill="#64748B" text-anchor="middle">manageability work</text>
  <line x1="924" y1="348" x2="906" y2="348" stroke="#DC2626" stroke-width="2.2" marker-end="url(#kd7-r)"/>
  <text x="185" y="416" font-size="18" fill="#64748B" text-anchor="middle">redundancy, testing,</text>
  <text x="185" y="440" font-size="18" fill="#64748B" text-anchor="middle">better hardware</text>
  <text x="1055" y="416" font-size="18" fill="#64748B" text-anchor="middle">automatic failover, alerts,</text>
  <text x="1055" y="440" font-size="18" fill="#64748B" text-anchor="middle">a tested rollback plan</text>
  <rect x="60" y="476" width="1120" height="112" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="510" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Repairing faster is usually cheaper, and it changes the number more than people expect.</text>
  <text x="340" y="546" font-size="19" fill="#64748B" text-anchor="middle">breaks every month, repairs itself in 10 seconds</text>
  <text x="340" y="574" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99.9996% available</text>
  <text x="900" y="546" font-size="19" fill="#64748B" text-anchor="middle">breaks once a year, one day of manual repair</text>
  <text x="900" y="574" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99.7% available</text>
  <path d="M620 526 V588" fill="none" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="6 5"/>
</svg>