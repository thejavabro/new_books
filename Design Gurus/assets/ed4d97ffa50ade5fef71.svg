<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A DDoS attack: a botnet of compromised machines floods the target from many directions, while a protection layer drops attack traffic and lets real users through">
  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>
  <defs>
    <marker id="se8-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="se8-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se8-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="se8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="40" y="70" width="340" height="520" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="210" y="96" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Botnet: machines</text>
  <text x="210" y="123" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the attacker controls</text>

  
  <path d="M350,182 C400,260 480,285 530,290" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#se8-red)"/>
  <path d="M350,276 C420,276 465,313 530,317" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#se8-red)"/>
  <path d="M350,370 C420,370 470,340 530,344" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#se8-red)"/>
  <path d="M350,464 C420,464 470,367 530,371" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#se8-red)"/>
  <text x="455" y="178" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">flood of</text>
  <text x="455" y="205" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fake traffic</text>

  <path d="M350,670 C400,500 470,410 530,398" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#se8-blue)"/>
  <text x="455" y="648" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">real requests</text>

  <line x1="818" y1="345" x2="952" y2="345" stroke="#059669" stroke-width="2.5" marker-end="url(#se8-emerald)"/>
  <text x="885" y="294" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">clean</text>
  <text x="885" y="321" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">traffic only</text>

  <line x1="670" y1="420" x2="670" y2="510" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se8-red)"/>

  
  <g filter="url(#se8-soft)">
    <rect x="70" y="149" width="280" height="66" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="70" y="243" width="280" height="66" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="70" y="337" width="280" height="66" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="70" y="431" width="280" height="66" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="210" y="188" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Compromised PC</text>
  <text x="210" y="282" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Compromised server</text>
  <text x="210" y="376" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Hacked IoT camera</text>
  <text x="210" y="470" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Hacked home router</text>
  <text x="210" y="559" font-size="20" fill="#64748B" text-anchor="middle">and thousands more devices</text>

  
  <g filter="url(#se8-soft)">
    <rect x="70" y="634" width="280" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="210" y="666" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Real users</text>
  <text x="210" y="691" font-size="20" fill="#64748B" text-anchor="middle">legitimate traffic</text>

  
  <g filter="url(#se8-soft)">
    <rect x="530" y="270" width="280" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="670" y="308" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DDoS protection layer</text>
  <text x="670" y="338" font-size="20" fill="#64748B" text-anchor="middle">firewalls, scrubbing,</text>
  <text x="670" y="365" font-size="20" fill="#64748B" text-anchor="middle">rate limits,</text>
  <text x="670" y="392" font-size="20" fill="#64748B" text-anchor="middle">traffic analysis</text>

  
  <g filter="url(#se8-soft)">
    <rect x="520" y="510" width="300" height="76" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="670" y="542" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Attack traffic dropped</text>
  <text x="670" y="567" font-size="20" fill="#64748B" text-anchor="middle">never reaches the server</text>

  
  <g filter="url(#se8-soft)">
    <rect x="960" y="285" width="240" height="120" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1080" y="323" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Target server</text>
  <text x="1080" y="353" font-size="20" fill="#64748B" text-anchor="middle">stays online</text>
  <text x="1080" y="380" font-size="20" fill="#64748B" text-anchor="middle">for real users</text>

  
  <line x1="60" y1="766" x2="88" y2="766" stroke="#DC2626" stroke-width="3"/>
  <text x="98" y="773" font-size="20" fill="#475569">attack traffic</text>
  <line x1="300" y1="766" x2="328" y2="766" stroke="#3B82F6" stroke-width="3"/>
  <text x="338" y="773" font-size="20" fill="#475569">real user traffic</text>
  <line x1="596" y1="766" x2="624" y2="766" stroke="#059669" stroke-width="3"/>
  <text x="634" y="773" font-size="20" fill="#475569">clean, filtered traffic</text>
</svg>