<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1670" viewBox="0 0 1240 1670" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence from quote to charge: the rider app asks Pricing for a quote and gets an id, a multiplier and a 120 second expiry; the rider requests a ride with that quote id; Trips validates the quote and pins the multiplier, authorizes the quoted estimate with Payments, adds the request to the Matching batch window, gets a driver assigned and pushes that to the rider; the trip starts, Trips re-authorizes if the meter passes the hold, sends the trace id to Fares on trip end, Fares waits for a complete trace capped at 60 seconds and returns the final fare, then Trips captures the metered amount and the rider gets a receipt.">
  <defs>
    <marker id="m07-l04-quote-to-charge-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l04-quote-to-charge-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l04-quote-to-charge-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l04-quote-to-charge-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1670" fill="#FFFFFF"/>

  <rect x="40" y="250" width="1160" height="160" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="440" width="1160" height="330" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="800" width="1160" height="450" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="130" y1="195" x2="130" y2="1330"/>
    <line x1="330" y1="195" x2="330" y2="1330"/>
    <line x1="530" y1="195" x2="530" y2="1330"/>
    <line x1="730" y1="195" x2="730" y2="1330"/>
    <line x1="930" y1="195" x2="930" y2="1330"/>
    <line x1="1130" y1="195" x2="1130" y2="1330"/>
  </g>

  <rect x="1124" y="640" width="12" height="580" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>

  <g fill="none" stroke-width="2.5">
    <path d="M136,330 L324,330" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-quote-to-charge-bl)"/>
    <path d="M324,385 L136,385" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-quote-to-charge-em)"/>
    <path d="M136,520 L524,520" stroke="#3B82F6" marker-end="url(#m07-l04-quote-to-charge-bl)"/>
    <path d="M536,560 H596 Q608,560 608,574 V586 Q608,600 596,600 H540" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-quote-to-charge-bl)"/>
    <path d="M536,640 L1120,640" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-quote-to-charge-bl)"/>
    <path d="M536,690 L724,690" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-quote-to-charge-ab)"/>
    <path d="M724,740 L536,740" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-quote-to-charge-em)"/>
    <path d="M524,880 L136,880" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m07-l04-quote-to-charge-em)"/>
    <path d="M536,920 H596 Q608,920 608,934 V946 Q608,960 596,960 H540" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-quote-to-charge-bl)"/>
    <path d="M536,1000 L1120,1000" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-quote-to-charge-bl)"/>
    <path d="M536,1050 L924,1050" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-quote-to-charge-ab)"/>
    <path d="M936,1090 H996 Q1008,1090 1008,1104 V1116 Q1008,1130 996,1130 H940" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l04-quote-to-charge-bl)"/>
    <path d="M924,1170 L536,1170" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m07-l04-quote-to-charge-em)"/>
    <path d="M536,1220 L1120,1220" stroke="#3B82F6" marker-end="url(#m07-l04-quote-to-charge-bl)"/>
    <path d="M1124,1300 L136,1300" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-quote-to-charge-em)"/>
  </g>

  <text x="60" y="290" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Before the ride: the quote is a contract</text>
  <text x="1180" y="290" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">about 3,000 lookups a second, on a 50 ms budget</text>
  <text x="60" y="480" font-size="20" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The rider commits to a multiplier, not to an amount</text>
  <text x="1180" y="480" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the matcher waits on purpose</text>
  <text x="60" y="840" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The meter runs, then the amount is derived and taken</text>
  <text x="1180" y="840" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the fare comes from the GPS trace</text>

  <text x="230" y="318" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. quote this pickup and drop</text>
  <text x="230" y="373" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. quote id, multiplier, 120s</text>
  <text x="330" y="508" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. request ride with quote id</text>
  <text x="614" y="586" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. validate the quote, pin the multiplier</text>
  <text x="830" y="628" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. authorize the quoted estimate</text>
  <text x="630" y="678" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. add to the next batch window</text>
  <text x="630" y="728" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">7. driver assigned</text>
  <text x="330" y="868" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">8. assigned, the driver is on the way</text>
  <text x="614" y="946" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">9. started, the rider is in the car</text>
  <text x="830" y="988" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">10. re-authorize if the meter passes the hold</text>
  <text x="730" y="1038" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">11. trip ended, here is the trace id</text>
  <text x="900" y="1116" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">12. wait for a complete trace, capped at 60s</text>
  <text x="730" y="1158" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">13. final fare</text>
  <text x="830" y="1208" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">14. capture the metered amount</text>
  <text x="630" y="1288" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">15. receipt, or a payment problem</text>
  <text x="1110" y="610" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">funds held, not taken</text>

  <g filter="url(#m07-l04-quote-to-charge-soft)">
    <rect x="40" y="60" width="180" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="130" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rider app</text>
  <text x="130" y="148" text-anchor="middle" font-size="20" fill="#64748B">commits, waits</text>
  <g filter="url(#m07-l04-quote-to-charge-soft)">
    <rect x="240" y="60" width="180" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="330" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pricing</text>
  <text x="330" y="148" text-anchor="middle" font-size="20" fill="#64748B">surge per zone</text>
  <g filter="url(#m07-l04-quote-to-charge-soft)">
    <rect x="440" y="60" width="180" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="530" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Trips</text>
  <text x="530" y="148" text-anchor="middle" font-size="20" fill="#64748B">the state machine</text>
  <g filter="url(#m07-l04-quote-to-charge-soft)">
    <rect x="640" y="60" width="180" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="730" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Matching</text>
  <text x="730" y="148" text-anchor="middle" font-size="20" fill="#64748B">a batch window</text>
  <g filter="url(#m07-l04-quote-to-charge-soft)">
    <rect x="840" y="60" width="180" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="930" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fares</text>
  <text x="930" y="148" text-anchor="middle" font-size="20" fill="#64748B">reads the trace</text>
  <g filter="url(#m07-l04-quote-to-charge-soft)">
    <rect x="1040" y="60" width="180" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1130" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="1130" y="148" text-anchor="middle" font-size="20" fill="#64748B">holds, then takes</text>

  <rect x="40" y="1370" width="1160" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="1418" text-anchor="middle" font-size="20" fill="#065F46">Authorize means the funds are held but not taken. Capture means they are taken.</text>
  <text x="620" y="1456" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The final amount does not exist until the trace is complete.</text>

  <line x1="60" y1="1550" x2="96" y2="1550" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1557" font-size="20" fill="#475569">A synchronous call: the caller is waiting</text>
  <line x1="60" y1="1590" x2="96" y2="1590" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1597" font-size="20" fill="#475569">An async handoff: nothing waits on it</text>
  <line x1="60" y1="1630" x2="96" y2="1630" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1637" font-size="20" fill="#475569">A reply, or a push coming back</text>
</svg>