<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" style="background-color:#ffffff">
<defs>
<marker id="fcb" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
<marker id="fcd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="60" width="220" height="60" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="60" width="220" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="140" y="79" text-anchor="middle" font-weight="bold">Checkout</text>
<text x="42" y="108" font-size="11.5" fill="#414d60">knows only OrderFacade</text>

<rect x="320" y="48" width="280" height="86" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="320" y="48" width="280" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="460" y="67" text-anchor="middle" font-weight="bold">OrderFacade</text>
<text x="332" y="96">+ placeOrder(sku, qty, cents, email)</text>
<text x="332" y="118" font-size="11" fill="#2f7a55">returns an order id, or nothing</text>

<rect x="700" y="30" width="240" height="38" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="820" y="54" text-anchor="middle" fill="#414d60">InventoryService</text>
<rect x="700" y="86" width="240" height="38" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="820" y="110" text-anchor="middle" fill="#414d60">PaymentGateway</text>
<rect x="700" y="142" width="240" height="38" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="820" y="166" text-anchor="middle" fill="#414d60">ShippingService</text>
<rect x="700" y="198" width="240" height="38" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="820" y="222" text-anchor="middle" fill="#414d60">EmailService</text>

<path d="M 250 90 L 315 90" stroke="#000000" fill="none" marker-end="url(#fcb)"/>

<path d="M 604 70 L 650 70 L 650 49 L 695 49" stroke="#000000" fill="none" marker-start="url(#fcd)" marker-end="url(#fcb)"/>
<path d="M 604 86 L 665 86 L 665 105 L 695 105" stroke="#000000" fill="none" marker-start="url(#fcd)" marker-end="url(#fcb)"/>
<path d="M 604 102 L 665 102 L 665 161 L 695 161" stroke="#000000" fill="none" marker-start="url(#fcd)" marker-end="url(#fcb)"/>
<path d="M 604 118 L 650 118 L 650 217 L 695 217" stroke="#000000" fill="none" marker-start="url(#fcd)" marker-end="url(#fcb)"/>

<text x="700" y="270" font-size="11.5" fill="#6b7789">the subsystem: four capable services,</text>
<text x="700" y="286" font-size="11.5" fill="#6b7789">none of them wrong, none of them hidden</text>

<rect x="30" y="300" width="620" height="112" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="326" font-size="12.5" fill="#414d60">The facade holds the four services and calls them in order. It adds no behaviour of its own.</text>
<text x="52" y="350" font-size="12.5" fill="#414d60">Checkout depends on one class instead of four, and on none of their types.</text>
<text x="52" y="378" font-size="12.5" fill="#b4322c">Two things to keep out of it: business rules, which belong in the services, and</text>
<text x="52" y="396" font-size="12.5" fill="#b4322c">subsystem types in its signature, which would couple callers straight back again.</text>
</g>
</svg>