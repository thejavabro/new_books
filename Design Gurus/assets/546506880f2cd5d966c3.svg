<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="632" viewBox="0 0 1240 632" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="whyask-title whyask-desc">
<title id="whyask-title">Tie the question to a decision</title>
<desc id="whyask-desc">A question asked with its reason attached gets a more useful answer and reads as experience. A bare question returns a vague answer and moves nothing. Three categories of question reliably waste the clock.</desc>
<defs>
<marker id="whyask-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="whyask-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="whyask-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="whyask-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="632" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Tie the question to a decision</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The test is to connect the question to a decision before you ask it.</text>
<rect x="40" y="554" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="554" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Without the reason</text>
<rect x="40" y="168" width="480" height="70" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="209" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"How big are the files?"</text>
<path d="M526 203H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 203H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#whyask-marker-red)"/>
<rect x="570" y="168" width="630" height="70" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="196.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"Some are large."</text><text x="590" y="221.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Nothing has moved.</text>
<text x="40" y="282" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">With the reason attached</text>
<rect x="40" y="300" width="480" height="96" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="327" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"How big is the largest file?</text><text x="280" y="354" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Above roughly ten megabytes I would</text><text x="280" y="381" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">move uploads off the request path."</text>
<path d="M526 348H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 348H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#whyask-marker-green)"/>
<rect x="570" y="300" width="630" height="96" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="341.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A real number, because the interviewer</text><text x="590" y="366.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">now knows which answer matters</text>
<text x="40" y="440" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Questions that spend time and return nothing</text>
<rect x="40" y="458" width="372" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="226" y="485.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Anything about</text><text x="226" y="512.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">technology preferences</text>
<rect x="434" y="458" width="372" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="485.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Anything you could</text><text x="620" y="512.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reasonably assume and state</text>
<rect x="828" y="458" width="372" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="485.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Anything you would design the</text><text x="1014" y="512.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">same way whatever the answer</text>
<text x="66" y="588" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The first time a question arrives with its reason attached, the interviewer notices.</text>
</svg>