<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="the two strings">
<defs>
<filter id="bk-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Compare from the right, skipping what is deleted</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">read both strings from the right, so a backspace is known before the character it deletes</text>
<rect x="40" y="100" width="1160" height="90" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="128" font-size="19.5" font-weight="600" fill="#1D4ED8">str1 = "xy#z"</text>
<rect x="420" y="148" width="72" height="52" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="456" y="181.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">x</text>
<rect x="504" y="148" width="72" height="52" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="540" y="181.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">y</text>
<rect x="588" y="148" width="72" height="52" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="624" y="181.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">#</text>
<rect x="672" y="148" width="72" height="52" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="708" y="181.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">z</text>
<rect x="40" y="206" width="1160" height="90" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="234" font-size="19.5" font-weight="600" fill="#1D4ED8">str2 = "xzz#"</text>
<rect x="420" y="254" width="72" height="52" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="456" y="287.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">x</text>
<rect x="504" y="254" width="72" height="52" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="540" y="287.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">z</text>
<rect x="588" y="254" width="72" height="52" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="624" y="287.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">z</text>
<rect x="672" y="254" width="72" height="52" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="708" y="287.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">#</text>
<rect x="40" y="360" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="390" font-size="19.5" font-weight="600" fill="#047857">matched so far, reading from the right</text>
<rect x="110" y="408" width="340" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="280" y="440.5" text-anchor="middle" font-size="18" fill="#94A3B8">nothing compared yet</text>
<rect x="40" y="500" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="540" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">a # deletes the character before it</text>
<text x="620" y="572" text-anchor="middle" font-size="18.5" fill="#475569">reading right to left means the # is seen first, so nothing has to be undone</text>
</svg>