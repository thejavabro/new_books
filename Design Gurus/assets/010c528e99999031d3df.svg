<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Copies can be kept in agreement by updating all copies in one transaction, by publishing events that consumers use to update each copy, by change data capture from the database change log, by rebuilding copies on a schedule, or by accepting stale data on purpose.">
  <defs>
    <filter id="nvd4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nvd4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nvd4-k1"><rect x="40" y="140" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="nvd4-k2"><rect x="276" y="140" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="nvd4-k3"><rect x="512" y="140" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="nvd4-k4"><rect x="748" y="140" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="nvd4-k5"><rect x="984" y="140" width="216" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Five ways to keep copies in agreement</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">If you denormalize, you must choose one of these.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nvd4-soft)">
    <rect x="40" y="140" width="216" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#nvd4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Transaction</text>
  <text x="148" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">all copies,</text>
  <text x="148" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">in one step</text>
  <g filter="url(#nvd4-lift)">
    <rect x="276" y="140" width="216" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="276" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#nvd4-k2)"/>
  </g>
  <circle cx="314" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(303.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="340" y="192" font-size="21.5" font-weight="600" fill="#111827">Events</text>
  <text x="384" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">consumers update</text>
  <text x="384" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">each copy</text>
  <g filter="url(#nvd4-soft)">
    <rect x="512" y="140" width="216" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="512" y="140" width="6" height="90" fill="#059669" clip-path="url(#nvd4-k3)"/>
  </g>
  <circle cx="550" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(539.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="576" y="192" font-size="21.5" font-weight="600" fill="#111827">Change log</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">CDC reads the</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">database log</text>
  <g filter="url(#nvd4-soft)">
    <rect x="748" y="140" width="216" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="748" y="140" width="6" height="90" fill="#D97706" clip-path="url(#nvd4-k4)"/>
  </g>
  <circle cx="786" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(775.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
  <text x="812" y="192" font-size="21.5" font-weight="600" fill="#111827">Rebuild</text>
  <text x="856" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">recalculate on</text>
  <text x="856" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">a schedule</text>
  <g filter="url(#nvd4-soft)">
    <rect x="984" y="140" width="216" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="984" y="140" width="6" height="90" fill="#64748B" clip-path="url(#nvd4-k5)"/>
  </g>
  <circle cx="1022" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(1011.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="1048" y="192" font-size="21.5" font-weight="600" fill="#111827">Accept delay</text>
  <text x="1092" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">stale on purpose,</text>
  <text x="1092" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">and say so</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Transaction</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">always correct, but only when one transaction can reach every copy</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Events and CDC</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">the common choice at scale; copies are eventually consistent</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Rebuild</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">slow to fix problems, but it repairs drift that nobody noticed</text>
</svg>