<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="714" viewBox="0 0 1240 714" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="version-title version-desc">
<title id="version-title">The version you will actually do</title>
<desc id="version-desc">A structured hour over a design you already have, done by the engineers who built it, producing a short list of changes rather than a document nobody reads.</desc>
<defs>
<marker id="version-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="version-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="version-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="version-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="714" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The version you will actually do</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A structured hour over a design you already have, done by the engineers who built it.</text>
<rect x="40" y="636" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="636" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="60" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="60" rx="2.5" fill="#AC8BE8"/><text x="64" y="154" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A design review where the reviewer is assumed to be hostile</text>
<circle cx="60" cy="232" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="239" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="202" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="238" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">At design time</text>
<path d="M566 232H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 232H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#version-marker-slate)"/>
<rect x="610" y="202" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="225.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">when changing the answer is cheap. Found later,</text><text x="630" y="250.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the same issue is a migration</text>
<circle cx="60" cy="300" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="307" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="270" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="306" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scoped to one change</text>
<path d="M566 300H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 300H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#version-marker-slate)"/>
<rect x="610" y="270" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="293.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"The new file upload feature" is a threat model;</text><text x="630" y="318.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"our architecture" is a project</text>
<circle cx="60" cy="368" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="375" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="338" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="374" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Produces specific changes</text>
<path d="M566 368H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 368H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#version-marker-slate)"/>
<rect x="610" y="338" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="361.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a handful of tickets. If it is a risk register,</text><text x="630" y="386.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the session did not work</text>
<text x="40" y="440" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The four questions, before any framework</text>
<rect x="40" y="458" width="261" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="170.5" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What are we building?</text>
<path d="M307 486H363" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M307 486H363" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#version-marker-slate)"/>
<rect x="369" y="458" width="227" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="482.5" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What can go wrong?</text>
<path d="M602 486H658" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M602 486H658" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#version-marker-slate)"/>
<rect x="664" y="458" width="205" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="766.5" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What will we do?</text>
<path d="M875 486H931" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M875 486H931" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#version-marker-slate)"/>
<rect x="937" y="458" width="261" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1067.5" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Did we do a good job?</text>
<rect x="40" y="540" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="568" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The first requirement is a picture</text><text x="64" y="594" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Most of the value comes from drawing it honestly, before anybody applies a framework.</text>
<text x="66" y="670" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The person who built it knows which parts the design depends on, and the diagram does not record that.</text>
</svg>