<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1300" viewBox="0 0 1240 1300" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three generations. Generation 1, centralized index such as Napster: a central index server tracks which files each peer has and is a single point of failure, while files move directly between peers. Generation 2, unstructured P2P such as Gnutella: peers flood search requests to neighbors with no central index. Generation 3, structured P2P such as BitTorrent and IPFS: peers form a ring that is itself the distributed hash table, mapping each piece of data to a specific peer with logarithmic lookups">
