  <text x="396" y="1082" font-size="21.5" font-weight="600" fill="#111827"></text>
  <text x="64" y="1104" font-size="18.5" fill="#6B7280">The ring is the distributed</text>
  <text x="64" y="1130" font-size="18.5" fill="#6B7280">hash table (DHT), spread</text>
  <text x="64" y="1156" font-size="18.5" fill="#6B7280">across all peers</text>
  <text x="64" y="178" font-size="18.5" fill="#6B7280">Early P2P, for example Napster</text>
  <text x="64" y="548" font-size="18.5" fill="#6B7280">Decentralized, for example Gnutella</text>
  <text x="64" y="938" font-size="18.5" fill="#6B7280">DHT-based, for example BitTorrent, IPFS</text>
  <text x="766" y="236" font-size="18.5" fill="#1F2937">A central server keeps track of what</text>
  <text x="766" y="262" font-size="18.5" fill="#1F2937">files each peer has</text>
  <text x="766" y="306" font-size="18.5" fill="#1F2937">Peers query the server to find content</text>
  <text x="766" y="350" font-size="18.5" fill="#1F2937">Data is transferred directly between peers</text>
  <text x="766" y="394" font-size="18.5" fill="#1F2937">The server is a single point of failure</text>
  <text x="766" y="586" font-size="18.5" fill="#1F2937">No central server or index</text>
  <text x="766" y="630" font-size="18.5" fill="#1F2937">Peers discover content by flooding search</text>
  <text x="766" y="656" font-size="18.5" fill="#1F2937">requests to neighbors</text>
  <text x="766" y="700" font-size="18.5" fill="#1F2937">Works for small to medium networks</text>
  <text x="766" y="744" font-size="18.5" fill="#1F2937">Search can be slow and generates high</text>
  <text x="766" y="770" font-size="18.5" fill="#1F2937">network traffic</text>
  <text x="766" y="966" font-size="18.5" fill="#1F2937">Peers are organized in a structured overlay</text>
  <text x="766" y="992" font-size="18.5" fill="#1F2937">(for example, consistent hashing)</text>
  <text x="766" y="1036" font-size="18.5" fill="#1F2937">Each piece of data is mapped to a specific peer</text>
  <text x="766" y="1080" font-size="18.5" fill="#1F2937">Lookups are efficient (O(log N))</text>
  <text x="766" y="1124" font-size="18.5" fill="#1F2937">Scales to very large networks</text>
  <text x="766" y="1168" font-size="18.5" fill="#1F2937">Used in modern P2P systems like BitTorrent,</text>
  <text x="766" y="1194" font-size="18.5" fill="#1F2937">IPFS, and for peer discovery in some blockchains</text>

