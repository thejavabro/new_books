  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three generations of peer-to-peer architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">P2P moved from a central index, to flooding with no center, to structured distributed hash tables.</text>

