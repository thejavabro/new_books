<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Everyone free at once, between the busy blocks">
<defs>
<filter id="fr-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Everyone free at once, between the busy blocks</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">merge everyone into one busy list, then read off the gaps</text>
<rect x="40" y="100" width="1160" height="280" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="130" font-size="19.5" font-weight="600" fill="#475569">each person on their own row</text>
<line x1="116" y1="340" x2="1164" y2="340" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="130" y1="335" x2="130" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="130" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<line x1="243.33333333333331" y1="335" x2="243.33333333333331" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="243.33333333333331" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<line x1="356.66666666666663" y1="335" x2="356.66666666666663" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="356.66666666666663" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<line x1="470" y1="335" x2="470" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="470" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<line x1="583.3333333333333" y1="335" x2="583.3333333333333" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="583.3333333333333" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<line x1="696.6666666666667" y1="335" x2="696.6666666666667" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="696.6666666666667" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<line x1="810" y1="335" x2="810" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="810" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">6</text>
<line x1="923.3333333333334" y1="335" x2="923.3333333333334" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
