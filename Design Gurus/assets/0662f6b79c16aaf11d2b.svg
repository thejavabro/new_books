<line x1="1036.6666666666665" y1="335" x2="1036.6666666666665" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1036.6666666666665" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">8</text>
<line x1="1150" y1="335" x2="1150" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1150" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">9</text>
<rect x="243.33333333333331" y="156" width="226.66666666666669" height="34" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="356.66666666666663" y="179.5" text-anchor="middle" font-size="18" font-weight="600" fill="#1D4ED8">1, 3</text>
<rect x="696.6666666666667" y="156" width="113.33333333333326" height="34" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="753.3333333333334" y="179.5" text-anchor="middle" font-size="18" font-weight="600" fill="#1D4ED8">5, 6</text>
<rect x="356.66666666666663" y="202" width="113.33333333333337" height="34" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/>
<text x="413.3333333333333" y="225.5" text-anchor="middle" font-size="18" font-weight="600" fill="#5B21B6">2, 3</text>
<rect x="810" y="202" width="226.66666666666652" height="34" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/>
<text x="923.3333333333333" y="225.5" text-anchor="middle" font-size="18" font-weight="600" fill="#5B21B6">6, 8</text>
<rect x="40" y="400" width="1160" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="430" font-size="19.5" font-weight="600" fill="#475569">the result so far</text>
<rect x="110" y="446" width="320" height="50" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="270" y="477.5" text-anchor="middle" font-size="18" fill="#94A3B8">nothing yet</text>
<rect x="40" y="536" width="1160" height="78" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="576" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">free time for everyone is the gap between merged busy blocks</text>
<text x="620" y="608" text-anchor="middle" font-size="18.5" fill="#475569">so the two schedules are treated as one pile of intervals</text>
</svg>