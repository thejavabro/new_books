<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A window of exactly 3, slid along the array">
<defs>
<filter id="sm-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">A window of exactly 3, slid along the array</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">slide the window by adding what joins and subtracting what leaves</text>
<rect x="40" y="100" width="1160" height="240" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="130" font-size="19.5" font-weight="600" fill="#475569">the array, window size 3</text>
<rect x="309" y="142" width="92" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="355" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="355" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="415" y="142" width="92" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="461" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="461" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="521" y="142" width="92" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="567" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="567" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="627" y="142" width="92" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="673" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="673" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="733" y="142" width="92" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="779" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="779" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="839" y="142" width="92" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="885" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="885" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<rect x="40" y="360" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="390" font-size="19.5" font-weight="600" fill="#475569">the running sum and the best seen</text>
<rect x="110" y="408" width="300" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="260" y="440.5" text-anchor="middle" font-size="18" fill="#94A3B8">nothing yet</text>
<rect x="40" y="500" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="540" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">the window never changes size</text>
<text x="620" y="572" text-anchor="middle" font-size="18.5" fill="#475569">so each slide is one subtraction and one addition, not a fresh sum</text>
</svg>