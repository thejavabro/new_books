<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels: in a monolith the order module calls the user module with a direct in-memory function call, with no serialization, network overhead, timeouts or retries between modules; in microservices the order service calls the user service over HTTP, with higher latency, serialization and extra failure modes">
  <defs>
    <filter id="msa1i-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="msa1i-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="msa1i-k1"><rect x="170" y="285" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="msa1i-k2"><rect x="170" y="455" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="msa1i-k3"><rect x="770" y="285" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="msa1i-k4"><rect x="770" y="455" width="300" height="90" rx="12"/></clipPath>
    <marker id="msa1i-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="870" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">In-process calls vs. network calls</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">In a monolith, modules call each other in memory; in microservices, services call each other over the network.</text>

  <rect x="40" y="125" width="560" height="698" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#1D4ED8">In-process calls (monolith)</text>
  <rect x="640" y="125" width="560" height="698" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="155" font-size="19.5" font-weight="600" fill="#BE185D">Network calls (microservices)</text>
  <rect x="64" y="205" width="512" height="364" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="235" font-size="19.5" font-weight="600" fill="#1D4ED8">Monolithic application</text>

  <g fill="none" stroke-width="2">
    <path d="M320,375 V455" stroke="#2563EB" marker-end="url(#msa1i-m-blue)"/>
    <path d="M920,375 V455" stroke="#2563EB" marker-end="url(#msa1i-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="334" y="409" fill="#1D4ED8" text-anchor="start">direct function call</text>
    <text x="334" y="433" fill="#1D4ED8" text-anchor="start">in memory</text>
    <text x="934" y="409" fill="#1D4ED8" text-anchor="start">HTTP request</text>
    <text x="934" y="433" fill="#1D4ED8" text-anchor="start">over the network</text>
  </g>

  <g filter="url(#msa1i-soft)">
    <rect x="170" y="285" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="170" y="285" width="6" height="90" fill="#059669" clip-path="url(#msa1i-k1)"/>
  </g>
  <circle cx="208" cy="330" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,319.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="234" y="337" font-size="21.5" font-weight="600" fill="#111827">Order module</text>
  <g filter="url(#msa1i-soft)">
    <rect x="170" y="455" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="170" y="455" width="6" height="90" fill="#2563EB" clip-path="url(#msa1i-k2)"/>
  </g>
  <circle cx="208" cy="500" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,489.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="234" y="507" font-size="21.5" font-weight="600" fill="#111827">User module</text>
  <g filter="url(#msa1i-soft)">
    <rect x="770" y="285" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="770" y="285" width="6" height="90" fill="#059669" clip-path="url(#msa1i-k3)"/>
  </g>
  <circle cx="808" cy="330" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,319.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="834" y="337" font-size="21.5" font-weight="600" fill="#111827">Order service</text>
  <g filter="url(#msa1i-soft)">
    <rect x="770" y="455" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="770" y="455" width="6" height="90" fill="#2563EB" clip-path="url(#msa1i-k4)"/>
  </g>
  <circle cx="808" cy="500" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,489.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="834" y="507" font-size="21.5" font-weight="600" fill="#111827">User service</text>
  <rect x="64" y="593" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,604) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="621.5" font-size="18.5" fill="#1F2937">Direct function calls in the same process</text>
  <rect x="64" y="647" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,658) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="675.5" font-size="18.5" fill="#1F2937">Very low latency (nanoseconds)</text>
  <rect x="64" y="701" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,712) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="729.5" font-size="18.5" fill="#1F2937">No serialization or network overhead</text>
  <rect x="64" y="755" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,766) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="783.5" font-size="18.5" fill="#1F2937">No timeouts or retries between modules</text>
  <rect x="664" y="593" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,604) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="621.5" font-size="18.5" fill="#1F2937">HTTP request over the network</text>
  <rect x="664" y="647" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,658) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="675.5" font-size="18.5" fill="#1F2937">Higher latency (milliseconds)</text>
  <rect x="664" y="701" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,712) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="729.5" font-size="18.5" fill="#1F2937">Serialization and deserialization required</text>
  <rect x="664" y="755" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,766) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="783.5" font-size="18.5" fill="#1F2937">Additional failure modes (timeouts, retries, and so on)</text>




</svg>