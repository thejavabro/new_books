  <text x="64" y="478" font-size="18.5" fill="#6B7280">Both peers learn their own public IP and port using STUN, exchange them through a</text>
  <text x="64" y="504" font-size="18.5" fill="#6B7280">signaling server, then send packets to each other to create a hole in the NATs.</text>
  <text x="64" y="998" font-size="18.5" fill="#6B7280">If direct connection cannot be established, peers relay traffic through a TURN server.</text>




