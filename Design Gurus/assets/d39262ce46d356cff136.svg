<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1370" viewBox="0 0 1240 1370" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three NAT traversal techniques. STUN: Peer A asks, through its NAT, a STUN server what its public IP and port are, and the server answers through the NAT with 203.0.113.5:62000. Hole punching: both peers learn their own public address from the STUN server, exchange the addresses through a signaling server, and their NATs send simultaneous packets to each other to create a hole. TURN: when a direct connection cannot be established, both peers send data to a TURN server, which relays it between them">
