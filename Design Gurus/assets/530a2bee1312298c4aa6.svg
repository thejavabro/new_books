<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="994" viewBox="0 0 1240 994" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Why live delivery is at least once. The server sends an event, the caller processes it, the connection drops before the caller records the id, so the caller reconnects one event behind and the server replays the event it already applied. The duplicate is necessary because omitting it could lose the event.">
  <defs>
    <marker id="pg-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="pg-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pg-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pg-k1"><rect x="76" y="176" width="588" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k2"><rect x="76" y="312" width="588" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k3"><rect x="76" y="448" width="588" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k4"><rect x="76" y="584" width="588" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k5"><rect x="76" y="720" width="588" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k6"><rect x="820" y="176" width="344" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k7"><rect x="820" y="312" width="344" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k8"><rect x="820" y="448" width="344" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k9"><rect x="820" y="584" width="344" height="90" rx="12"/></clipPath>
    <clipPath id="pg-k10"><rect x="820" y="720" width="344" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="994" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The duplicate is not a bug. It is part of the contract.</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">five steps, in order</text>

  
  <rect x="40" y="122" width="660" height="724" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="152" font-size="16.5" font-weight="600" fill="#1D4ED8">What happens</text>

  <rect x="784" y="122" width="416" height="724" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="808" y="152" font-size="16.5" font-weight="600" fill="#047857">What the receiver must do</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M370,266 V312" marker-end="url(#pg-sl)"/>
    <path d="M370,402 V448" marker-end="url(#pg-sl)"/>
    <path d="M370,538 V584" marker-end="url(#pg-sl)"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2.5">
    <path d="M370,674 V720" marker-end="url(#pg-sl)"/>
  </g>

  
  <g filter="url(#pg-soft)">
    <rect x="76" y="176" width="588" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="176" width="6" height="90" fill="#2563EB" clip-path="url(#pg-k1)"/>
  </g>
  <circle cx="114" cy="221" r="18" fill="#FFFFFF"/>
  <text x="114" y="227.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#2563EB">1</text>
  <text x="140" y="228" font-size="18.5" font-weight="600" fill="#111827">The server sends evt_91P</text>

  <g filter="url(#pg-soft)">
    <rect x="820" y="176" width="344" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="176" width="6" height="90" fill="#64748B" clip-path="url(#pg-k6)"/>
  </g>
  <circle cx="858" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,210.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="884" y="228" font-size="18.5" font-weight="600" fill="#111827">Nothing yet</text>

  
  <g filter="url(#pg-soft)">
    <rect x="76" y="312" width="588" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="312" width="6" height="90" fill="#2563EB" clip-path="url(#pg-k2)"/>
  </g>
  <circle cx="114" cy="357" r="18" fill="#FFFFFF"/>
  <text x="114" y="363.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#2563EB">2</text>
  <text x="140" y="364" font-size="18.5" font-weight="600" fill="#111827">The caller processes it</text>

  <g filter="url(#pg-soft)">
    <rect x="820" y="312" width="344" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="820" y="312" width="6" height="90" fill="#059669" clip-path="url(#pg-k7)"/>
  </g>
  <circle cx="858" cy="357" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,346.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="884" y="364" font-size="18.5" font-weight="600" fill="#111827">Apply it, then store the id</text>

  
  <g filter="url(#pg-soft)">
    <rect x="76" y="448" width="588" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="448" width="6" height="90" fill="#DB2777" clip-path="url(#pg-k3)"/>
  </g>
  <circle cx="114" cy="493" r="18" fill="#FFFFFF"/>
  <text x="114" y="499.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#DB2777">3</text>
  <text x="140" y="500" font-size="18.5" font-weight="600" fill="#111827">The connection drops before the caller records the id</text>

  <g filter="url(#pg-soft)">
    <rect x="820" y="448" width="344" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="448" width="6" height="90" fill="#64748B" clip-path="url(#pg-k8)"/>
  </g>
  <circle cx="858" cy="493" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,482.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="884" y="500" font-size="18.5" font-weight="600" fill="#111827">The id was never written</text>

  
  <g filter="url(#pg-soft)">
    <rect x="76" y="584" width="588" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="584" width="6" height="90" fill="#2563EB" clip-path="url(#pg-k4)"/>
  </g>
  <circle cx="114" cy="629" r="18" fill="#FFFFFF"/>
  <text x="114" y="635.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#2563EB">4</text>
  <text x="140" y="636" font-size="18.5" font-weight="600" fill="#111827">The caller reconnects from evt_81M, one event behind</text>

  <g filter="url(#pg-soft)">
    <rect x="820" y="584" width="344" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="820" y="584" width="6" height="90" fill="#059669" clip-path="url(#pg-k9)"/>
  </g>
  <circle cx="858" cy="629" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,618.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="884" y="636" font-size="18.5" font-weight="600" fill="#111827">Send Last-Event-ID</text>

  
  <g filter="url(#pg-lift)">
    <rect x="76" y="720" width="588" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="720" width="9" height="90" fill="#2563EB" clip-path="url(#pg-k5)"/>
  </g>
  <circle cx="114" cy="765" r="18" fill="#FFFFFF"/>
  <text x="114" y="771.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#2563EB">5</text>
  <text x="140" y="772" font-size="18.5" font-weight="600" fill="#111827">The server sends evt_91P again</text>

  <g filter="url(#pg-lift)">
    <rect x="820" y="720" width="344" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="820" y="720" width="9" height="90" fill="#059669" clip-path="url(#pg-k10)"/>
  </g>
  <circle cx="858" cy="765" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,754.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="884" y="772" font-size="18.5" font-weight="600" fill="#111827">Recognize the id, and skip it</text>

  
  <rect x="40" y="878" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="923" text-anchor="middle" font-size="16" fill="#475569">Record the event id with the state change, or make repeated application safe.</text>
</svg>