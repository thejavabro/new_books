<text x="250" y="336" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Student file</text>

<g stroke="#2563EB" stroke-width="1.5">
<path d="M530,275 L530,359 A90,16 0 0 0 710,359 L710,275" fill="#DBEAFE"/>
<ellipse cx="620" cy="275" rx="90" ry="16" fill="#EFF6FF"/>
</g>
<text x="620" y="336" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Student file</text>

<g stroke="#2563EB" stroke-width="1.5">
<path d="M900,275 L900,359 A90,16 0 0 0 1080,359 L1080,275" fill="#DBEAFE"/>
<ellipse cx="990" cy="275" rx="90" ry="16" fill="#EFF6FF"/>
</g>
<text x="990" y="336" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Student file</text>

<rect x="116" y="396" width="268" height="70" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="250" y="424" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">address: 14 MG Road</text>
<text x="250" y="449" text-anchor="middle" font-size="15.5" fill="#475569">updated today</text>

<rect x="486" y="396" width="268" height="70" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="620" y="424" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">address: 7 Park Lane</text>
<text x="620" y="449" text-anchor="middle" font-size="15.5" fill="#475569">nobody updated this copy</text>

<rect x="856" y="396" width="268" height="70" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="990" y="424" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">address: 7 Park Lane</text>
<text x="990" y="449" text-anchor="middle" font-size="15.5" fill="#475569">nobody updated this copy</text>

<rect x="40" y="534" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="560" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="164" y="582" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">one copy updated</text>
<text x="288" y="582" font-size="15.5" fill="#475569">a clerk changed the address in the admissions file</text>
<rect x="64" y="604" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="164" y="626" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">two copies stale</text>
<text x="288" y="626" font-size="15.5" fill="#475569">the library and the examination office were never told</text>
</svg>