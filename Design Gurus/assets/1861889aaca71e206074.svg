<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three offices each keep their own student file, so one address change reaches one copy and leaves two copies stale">
<defs>
<filter id="rdb02-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<marker id="rdb02-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<clipPath id="rdb02-k1"><rect x="116" y="92" width="268" height="90" rx="12"/></clipPath>
<clipPath id="rdb02-k2"><rect x="486" y="92" width="268" height="90" rx="12"/></clipPath>
<clipPath id="rdb02-k3"><rect x="856" y="92" width="268" height="90" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="702" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="460" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Three offices, three sets of files, one student stored three times</text>

<g fill="none" stroke="#2563EB" stroke-width="2">
<path d="M250,228 L250,259" marker-end="url(#rdb02-mblue)"/>
<path d="M620,228 L620,259" marker-end="url(#rdb02-mblue)"/>
<path d="M990,228 L990,259" marker-end="url(#rdb02-mblue)"/>
</g>

<g filter="url(#rdb02-soft)">
<rect x="116" y="92" width="268" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="116" y="92" width="6" height="90" fill="#2563EB" clip-path="url(#rdb02-k1)"/>
</g>
<circle cx="154" cy="137" r="18" fill="#FFFFFF"/>
<g transform="translate(143.56,126.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="180" y="144" font-size="18.5" font-weight="600" fill="#111827">Admissions Office</text>
<text x="250" y="207" font-size="15.5" text-anchor="middle" fill="#6B7280">keeps a CSV file</text>

<g filter="url(#rdb02-soft)">
<rect x="486" y="92" width="268" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="486" y="92" width="6" height="90" fill="#2563EB" clip-path="url(#rdb02-k2)"/>
</g>
<circle cx="524" cy="137" r="18" fill="#FFFFFF"/>
<g transform="translate(513.56,126.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
<text x="550" y="144" font-size="18.5" font-weight="600" fill="#111827">Library</text>
<text x="620" y="207" font-size="15.5" text-anchor="middle" fill="#6B7280">keeps a binary file</text>

<g filter="url(#rdb02-soft)">
<rect x="856" y="92" width="268" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="856" y="92" width="6" height="90" fill="#2563EB" clip-path="url(#rdb02-k3)"/>
</g>
<circle cx="894" cy="137" r="18" fill="#FFFFFF"/>
<g transform="translate(883.56,126.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="920" y="144" font-size="18.5" font-weight="600" fill="#111827">Examination Office</text>
<text x="990" y="207" font-size="15.5" text-anchor="middle" fill="#6B7280">keeps a text file</text>

<g stroke="#2563EB" stroke-width="1.5">
<path d="M160,275 L160,359 A90,16 0 0 0 340,359 L340,275" fill="#DBEAFE"/>
<ellipse cx="250" cy="275" rx="90" ry="16" fill="#EFF6FF"/>
