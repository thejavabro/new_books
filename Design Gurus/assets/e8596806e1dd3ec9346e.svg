<rect x="40" y="554" width="1160" height="78" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="554" width="5" height="78" rx="2.5" fill="#39D5AA"/><text x="64" y="584.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Not "A is cheaper", but "A is cheaper above about a hundred million</text><text x="64" y="613.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">requests a month, and we are at three hundred million."</text>
<rect x="40" y="650" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="650" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="683" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">$284 a month is about $3,400 a year, a few days of one engineer</text><text x="64" y="709" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so cold starts and operating cost should decide this, not the bill.</text>
