<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="834" viewBox="0 0 1240 834" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cross-title cross-desc">
<title id="cross-title">The crossover is the real answer</title>
<desc id="cross-desc">A linear per-request curve against a curve with a floor and steps. Below about a hundred million requests a month the functions are cheaper, and above it the fleet is.</desc>
