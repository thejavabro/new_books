  <g transform="translate(367.56,410.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="404" y="428" font-size="18.5" font-weight="600" fill="#111827">Meeting record</text>
  <text x="620" y="491" font-size="15.5" text-anchor="middle" fill="#6B7280">the data spine: attendees, shares, consent, retention</text>
  <text x="620" y="514" font-size="15.5" text-anchor="middle" fill="#6B7280">points to the audio, transcript, summary, action items, and index entries</text>
