  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Real-time lane: about 1 to 2 seconds</text>
  <rect x="40" y="620" width="560" height="235" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="650" font-size="16.5" font-weight="600" fill="#B45309">Async lane: within 10 minutes</text>
  <rect x="640" y="620" width="560" height="235" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="664" y="650" font-size="16.5" font-weight="600" fill="#1D4ED8">Archive lane: about 2 seconds to first words</text>
