  <text x="728" y="732" font-size="18.5" font-weight="600" fill="#111827">Question</text>
  <text x="749" y="795" font-size="15.5" text-anchor="middle" fill="#6B7280">asked weeks later</text>
  <g filter="url(#c8mtg1-soft)">
    <rect x="905" y="680" width="270" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
