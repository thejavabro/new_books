  <text x="128" y="732" font-size="18.5" font-weight="600" fill="#111827">Summary queue</text>
  <text x="179" y="795" font-size="15.5" text-anchor="middle" fill="#6B7280">absorbs the comb</text>
  <g filter="url(#c8mtg1-soft)">
