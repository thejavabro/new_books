  <text x="969" y="732" font-size="18.5" font-weight="600" fill="#111827">Answer with citations</text>
  <text x="1040" y="795" font-size="15.5" text-anchor="middle" fill="#6B7280">hybrid retrieval, permission filter,</text>
  <text x="1040" y="818" font-size="15.5" text-anchor="middle" fill="#6B7280">frontier model</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="634" y="316" fill="#1D4ED8">audio and live transcript</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="180" y="394" fill="#B45309">meeting ended</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="304" y="563" fill="#B45309">summary and action items</text></g>
