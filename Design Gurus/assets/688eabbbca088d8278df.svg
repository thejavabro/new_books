  <rect x="40" y="895" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="940" text-anchor="middle" font-size="16" fill="#475569">No lane calls another lane directly. Each one reads from and writes to the meeting record.</text>
