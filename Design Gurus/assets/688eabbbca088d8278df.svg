<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1011" viewBox="0 0 1240 1011" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three lanes with different time limits, live captions, the post-call summary, and archive questions, all read from and write to one meeting record">
