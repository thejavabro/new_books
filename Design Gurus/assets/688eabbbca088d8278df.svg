  <text x="949" y="168" font-size="18.5" font-weight="600" fill="#111827">Live captions</text>
  <text x="990" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">shown while people speak</text>
  <g filter="url(#c8mtg1-soft)">
