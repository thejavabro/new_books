    <clipPath id="c8mtg1-k5"><rect x="64" y="680" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="c8mtg1-k6"><rect x="331" y="680" width="246" height="90" rx="12"/></clipPath>
    <clipPath id="c8mtg1-k7"><rect x="664" y="680" width="170" height="90" rx="12"/></clipPath>
