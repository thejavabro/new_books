  <text x="209" y="168" font-size="18.5" font-weight="600" fill="#111827">Consent gate</text>
  <text x="250" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">no consent, no recording</text>
  <g filter="url(#c8mtg1-lift)">
    <rect x="510" y="116" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
