<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="How the 45 minutes of a system design interview should be spent, against a common way it goes wrong where requirements and high-level design consume the time and the deep dive never happens.">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="tm-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="tm-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="tm-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B45309"/></marker>
    <marker id="tm-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="tm-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Where the 45 minutes goes</text>
  <text x="60" y="116" font-size="20" font-weight="600" fill="#065F46" text-anchor="start">How it should go</text>
  <rect x="60.0" y="130" width="124.4" height="66" rx="6" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.5"/>
  <text x="122.22222222222223" y="170" font-size="20" fill="#059669" text-anchor="middle">5 min</text>
  <line x1="122.2" y1="197" x2="122.2" y2="210" stroke="#059669" stroke-width="1.5"/>
  <text x="122.22222222222223" y="230" font-size="20" font-weight="600" fill="#059669" text-anchor="middle">Requirements</text>
  <rect x="184.4" y="130" width="373.3" height="66" rx="6" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.5"/>
  <text x="371.1111111111111" y="160" font-size="20" font-weight="600" fill="#059669" text-anchor="middle">High-level design</text>
  <text x="371.1111111111111" y="184" font-size="20" fill="#059669" text-anchor="middle">15 min</text>
  <rect x="557.8" y="130" width="373.3" height="66" rx="6" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.5"/>
  <text x="744.4444444444445" y="160" font-size="20" font-weight="600" fill="#059669" text-anchor="middle">Deep dive</text>
  <text x="744.4444444444445" y="184" font-size="20" fill="#059669" text-anchor="middle">15 min</text>
  <rect x="931.1" y="130" width="124.4" height="66" rx="6" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.5"/>
  <text x="993.3333333333333" y="160" font-size="20" font-weight="600" fill="#059669" text-anchor="middle">Bottlenecks</text>
  <text x="993.3333333333333" y="184" font-size="20" fill="#059669" text-anchor="middle">5 min</text>
  <rect x="1055.6" y="130" width="124.4" height="66" rx="6" fill="#94A3B8" fill-opacity="0.25" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1117.7777777777776" y="160" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">Questions</text>
  <text x="1117.7777777777776" y="184" font-size="20" fill="#94A3B8" text-anchor="middle">5 min</text>
  <text x="60" y="262" font-size="20" fill="#64748B" text-anchor="start">the deep dive is where most of the signal is</text>
  <text x="60" y="316" font-size="20" font-weight="600" fill="#B45309" text-anchor="start">A common way it goes wrong</text>
  <rect x="60.0" y="330" width="348.4" height="66" rx="6" fill="#B45309" fill-opacity="0.25" stroke="#B45309" stroke-width="1.5"/>
  <text x="234.22222222222223" y="360" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">Requirements</text>
  <text x="234.22222222222223" y="384" font-size="20" fill="#B45309" text-anchor="middle">14 min</text>
  <rect x="408.4" y="330" width="547.6" height="66" rx="6" fill="#B45309" fill-opacity="0.25" stroke="#B45309" stroke-width="1.5"/>
  <text x="682.2222222222222" y="360" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">High-level design</text>
  <text x="682.2222222222222" y="384" font-size="20" fill="#B45309" text-anchor="middle">22 min</text>
  <rect x="956.0" y="330" width="149.3" height="66" rx="6" fill="#B91C1C" fill-opacity="0.25" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="1030.6666666666667" y="360" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Deep dive</text>
  <text x="1030.6666666666667" y="384" font-size="20" fill="#B91C1C" text-anchor="middle">6 min</text>
  <rect x="1105.3" y="330" width="74.7" height="66" rx="6" fill="#94A3B8" fill-opacity="0.25" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="956.0" y1="322" x2="956.0" y2="404" stroke="#B91C1C" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="60" y="436" font-size="20" fill="#64748B" text-anchor="start">thorough on requirements, rushed on the part being assessed, and no time to name the bottlenecks</text>
  <rect x="60" y="470" width="1120" height="62" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="508" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Say the plan out loud at the start, then watch the clock. Running out of time is not recoverable.</text>
</svg>