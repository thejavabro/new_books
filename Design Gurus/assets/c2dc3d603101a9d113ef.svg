<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Side by side: authentication verifies identity once at login, then authorization checks permissions on every protected request">
  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
  <defs>
    <marker id="se4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="se4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="se4-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="se4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="70" width="560" height="450" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="300" y="100" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Authentication: who are you?</text>

  <rect x="650" y="70" width="570" height="450" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="935" y="100" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Authorization: what can you do?</text>

  
  <line x1="300" y1="214" x2="300" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#se4-slate)"/>
  <line x1="300" y1="348" x2="300" y2="398" stroke="#475569" stroke-width="2" marker-end="url(#se4-slate)"/>
  <line x1="935" y1="214" x2="935" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#se4-slate)"/>
  <path d="M935,348 C905,348 860,360 815,398" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#se4-emerald)"/>
  <path d="M935,348 C965,348 1010,360 1055,398" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#se4-red)"/>

  <line x1="580" y1="306" x2="650" y2="306" stroke="#475569" stroke-width="2.5" marker-end="url(#se4-slate)"/>
  <text x="615" y="282" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">then</text>

  
  <g filter="url(#se4-soft)">
    <rect x="120" y="130" width="360" height="84" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="120" y="264" width="360" height="84" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="120" y="398" width="360" height="84" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="300" y="162" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User signs in</text>
  <text x="300" y="190" font-size="20" fill="#64748B" text-anchor="middle">claims an identity</text>
  <text x="300" y="296" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Proof is checked</text>
  <text x="300" y="324" font-size="20" fill="#64748B" text-anchor="middle">password, OTP, or fingerprint</text>
  <text x="300" y="430" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Identity confirmed</text>
  <text x="300" y="458" font-size="20" fill="#64748B" text-anchor="middle">a session or token is issued</text>

  
  <g filter="url(#se4-soft)">
    <rect x="765" y="130" width="340" height="84" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="765" y="264" width="340" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="715" y="398" width="200" height="84" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="955" y="398" width="200" height="84" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="935" y="162" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User requests an action</text>
  <text x="935" y="190" font-size="20" fill="#64748B" text-anchor="middle">open a file, delete a report</text>
  <text x="935" y="296" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Permissions are checked</text>
  <text x="935" y="324" font-size="20" fill="#64748B" text-anchor="middle">roles, ACLs</text>
  <text x="815" y="430" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Allowed</text>
  <text x="815" y="458" font-size="20" fill="#64748B" text-anchor="middle">role permits it</text>
  <text x="1055" y="430" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Denied</text>
  <text x="1055" y="458" font-size="20" fill="#64748B" text-anchor="middle">role does not</text>

  
  <text x="300" y="554" font-size="20" fill="#64748B" text-anchor="middle">happens once, at the start of a session</text>
  <text x="935" y="554" font-size="20" fill="#64748B" text-anchor="middle">happens again on every protected request</text>
</svg>