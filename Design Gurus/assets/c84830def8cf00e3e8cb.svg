  <circle cx="788" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/><path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="814" y="162" font-size="18.5" font-weight="600" fill="#111827">PayCalculator</text>

  <text x="920" y="230" font-size="15.5" text-anchor="middle" fill="#94A3B8">operations owns this</text>
  <g filter="url(#act-soft)">
    <rect x="750" y="240" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="750" y="240" width="6" height="90" fill="#7C3AED" clip-path="url(#act-b2)"/>
  </g>
  <circle cx="788" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,274.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="814" y="292" font-size="18.5" font-weight="600" fill="#111827">HoursReport</text>

  <text x="920" y="360" font-size="15.5" text-anchor="middle" fill="#94A3B8">the database team owns this</text>
  <g filter="url(#act-soft)">
    <rect x="750" y="370" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="750" y="370" width="6" height="90" fill="#2563EB" clip-path="url(#act-b3)"/>
  </g>
  <circle cx="788" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,404.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="814" y="422" font-size="18.5" font-weight="600" fill="#111827">EmployeeRepository</text>

  
  <rect x="40" y="570" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="594" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="616" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Count the groups</text>
  <text x="288" y="616" font-size="15.5" fill="#475569">a reason to change comes from a person, so three groups means three responsibilities</text>
  <rect x="64" y="638" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="660" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Cut along the ask</text>
  <text x="288" y="660" font-size="15.5" fill="#475569">split so that each class answers to one group, never by counting methods or lines</text>
</svg>