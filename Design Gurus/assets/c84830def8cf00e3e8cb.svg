  <circle cx="430" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(419.56,274.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="456" y="292" font-size="18.5" font-weight="600" fill="#111827">Employee</text>
  <text x="485" y="355" font-size="15.5" text-anchor="middle" fill="#BE185D">three reasons to change</text>

  
  <rect x="640" y="40" width="560" height="500" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#047857">Split by actor: one group each</text>

  <text x="920" y="100" font-size="15.5" text-anchor="middle" fill="#94A3B8">finance owns this</text>
  <g filter="url(#act-soft)">
    <rect x="750" y="110" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
