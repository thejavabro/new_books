    <clipPath id="act-b2"><rect x="750" y="240" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="act-b3"><rect x="750" y="370" width="340" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="500" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One class, three groups who can change it</text>

