<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three groups can each demand a change to one Employee class, and splitting by actor gives each group a class of its own">
  <defs>
