<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Forty backend servers with changing IP addresses send their outbound calls to an egress proxy with one fixed IP address. The proxy logs and limits the calls, then forwards them to a partner API that accepts only approved addresses.">
  <defs>
    <filter id="pvr4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pvr4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="pvr4-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pvr4-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pvr4-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    <marker id="pvr4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A forward proxy for your own backend</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">When your service is the client, an egress proxy controls its outbound calls.</text>



  <g fill="none" stroke-width="2">
    <path d="M404,185 H450" stroke="#64748B" marker-end="url(#pvr4-m-slate)"/>
    <path d="M790,185 H836" stroke="#64748B" marker-end="url(#pvr4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#pvr4-soft)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="90" fill="#64748B" clip-path="url(#pvr4-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">40 backend servers</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">IP addresses change</text>
  <g filter="url(#pvr4-lift)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="450" y="140" width="9" height="90" fill="#D97706" clip-path="url(#pvr4-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">Egress proxy</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">one fixed IP address</text>
  <g filter="url(#pvr4-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#pvr4-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">Partner API</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">allows approved IPs only</text>

  <rect x="40" y="310" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="335" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="360" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Log</text>
  <text x="323" y="360" font-size="18.5" fill="#475569">one record of every outbound call, for debugging and auditing</text>
  <rect x="64" y="385" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="410" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Limit</text>
  <text x="323" y="410" font-size="18.5" fill="#475569">keep the total call rate under the partner's limit</text>
  <rect x="64" y="435" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="460" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Crawlers</text>
  <text x="323" y="460" font-size="18.5" fill="#475569">can rotate outbound addresses, so one blocked address does not stop the work</text>
</svg>