<text x="883" y="246" font-size="18.5" font-weight="600" fill="#111827">Removed = length minus kept</text>
<text x="883" y="276" font-size="18.5" font-weight="400" fill="#475569"></text>
<text x="883" y="306" font-size="18.5" font-weight="400" fill="#475569">The string is 6 long, so</text>
<text x="883" y="336" font-size="18.5" font-weight="400" fill="#475569">the answer is 6 minus the</text>
<text x="883" y="366" font-size="18.5" font-weight="400" fill="#475569">longest palindrome that can</text>
<text x="883" y="396" font-size="18.5" font-weight="400" fill="#475569">be kept from it.</text>
<text x="883" y="426" font-size="18.5" font-weight="400" fill="#475569"></text>
<text x="883" y="456" font-size="18.5" font-weight="400" fill="#475569">The kept characters do not</text>
<text x="883" y="486" font-size="18.5" font-weight="400" fill="#475569">have to sit next to each</text>
<text x="883" y="516" font-size="18.5" font-weight="400" fill="#475569">other, only in order.</text>
<rect x="40" y="670" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="710" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Removing the fewest characters is the same as keeping the most</text>
<text x="620" y="742" text-anchor="middle" font-size="18.5" fill="#475569">So the table measures what can be kept, and the answer is what is left over</text>
</svg>