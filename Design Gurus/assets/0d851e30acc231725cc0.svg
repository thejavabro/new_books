<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many characters must be removed from "abdbca" to leave a palindrome?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Whatever is kept has to read the same both ways, so the fewest removals means the longest such kept part</text>
