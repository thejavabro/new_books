<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two circuit breaker settings and what goes wrong at each extreme: a failure threshold that is too low or too high, and an open timeout that is too short or too long">
  <defs>
    <clipPath id="cb3-k1"><rect x="72" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cb3-k2"><rect x="455" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cb3-k3"><rect x="838" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cb3-k4"><rect x="72" y="390" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cb3-k5"><rect x="455" y="390" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cb3-k6"><rect x="838" y="390" width="330" height="90" rx="12"/></clipPath>
    <filter id="cb3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cb3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Failure threshold: how many failures before the circuit opens</text>
  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#5B21B6">Open timeout: how long the circuit stays open before a trial call</text>
  <g filter="url(#cb3-soft)">
    <rect x="72" y="104" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="104" width="6" height="90" fill="#DB2777" clip-path="url(#cb3-k1)"/>
  </g>
  <circle cx="110" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,138.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="136" y="156" font-size="18.5" font-weight="600" fill="#111827">Too Low</text>
  <text x="237" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">the circuit trips on a</text>
  <text x="237" y="242" font-size="15.5" text-anchor="middle" fill="#94A3B8">single passing glitch</text>
  <g filter="url(#cb3-lift)">
    <rect x="455" y="104" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="455" y="104" width="9" height="90" fill="#059669" clip-path="url(#cb3-k2)"/>
  </g>
  <circle cx="493" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,138.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="519" y="156" font-size="18.5" font-weight="600" fill="#111827">About Right</text>
  <text x="620" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">trips on a real problem,</text>
  <text x="620" y="242" font-size="15.5" text-anchor="middle" fill="#94A3B8">ignores brief noise</text>
  <g filter="url(#cb3-soft)">
    <rect x="838" y="104" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="838" y="104" width="6" height="90" fill="#DB2777" clip-path="url(#cb3-k3)"/>
  </g>
  <circle cx="876" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,138.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="902" y="156" font-size="18.5" font-weight="600" fill="#111827">Too High</text>
  <text x="1003" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">many calls fail before</text>
  <text x="1003" y="242" font-size="15.5" text-anchor="middle" fill="#94A3B8">anything protects them</text>
  <g filter="url(#cb3-soft)">
    <rect x="72" y="390" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="390" width="6" height="90" fill="#DB2777" clip-path="url(#cb3-k4)"/>
  </g>
  <circle cx="110" cy="435" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,424.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="136" y="442" font-size="18.5" font-weight="600" fill="#111827">Too Short</text>
  <text x="237" y="505" font-size="15.5" text-anchor="middle" fill="#6B7280">it tests before recovery,</text>
  <text x="237" y="528" font-size="15.5" text-anchor="middle" fill="#94A3B8">so it flaps open again</text>
  <g filter="url(#cb3-lift)">
    <rect x="455" y="390" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="455" y="390" width="9" height="90" fill="#059669" clip-path="url(#cb3-k5)"/>
  </g>
  <circle cx="493" cy="435" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,424.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="519" y="442" font-size="18.5" font-weight="600" fill="#111827">About Right</text>
  <text x="620" y="505" font-size="15.5" text-anchor="middle" fill="#6B7280">roughly the time the</text>
  <text x="620" y="528" font-size="15.5" text-anchor="middle" fill="#94A3B8">service needs to recover</text>
  <g filter="url(#cb3-soft)">
    <rect x="838" y="390" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="838" y="390" width="6" height="90" fill="#DB2777" clip-path="url(#cb3-k6)"/>
  </g>
  <circle cx="876" cy="435" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,424.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="902" y="442" font-size="18.5" font-weight="600" fill="#111827">Too Long</text>
  <text x="1003" y="505" font-size="15.5" text-anchor="middle" fill="#6B7280">calls stay refused after</text>
  <text x="1003" y="528" font-size="15.5" text-anchor="middle" fill="#94A3B8">the service is healthy</text>
  <rect x="40" y="614" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="638" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="660" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">How to find it</text>
  <text x="288" y="660" font-size="15.5" fill="#475569">watch how often the breaker opens, how long it stays open, and how trial calls end</text>
</svg>