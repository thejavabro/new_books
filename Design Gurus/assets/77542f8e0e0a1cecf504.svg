<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="616" viewBox="0 0 1240 616" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A service writes to its database and publishes an event separately; when the publish fails after the commit succeeds, the two systems permanently disagree">
  <rect x="0" y="0" width="1240" height="616" fill="#FFFFFF"/>
  <defs>
    <marker id="dp1-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dp1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="dp1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two writes, two systems, no shared transaction</text>

  
  <path d="M334 262 L470 190" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#dp1-emerald)"/>
  <text x="402" y="196" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">1. commit</text>

  <path d="M334 306 L470 388" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#dp1-red)"/>
  <text x="402" y="392" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">2. publish</text>

  
  <g filter="url(#dp1-soft)">
    <rect x="90" y="240" width="244" height="88" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="212" y="274" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Order Service</text>
  <text x="212" y="304" font-size="20" fill="#64748B" text-anchor="middle">places an order</text>

  <g filter="url(#dp1-soft)">
    <path d="M474 156 a118 18 0 0 1 236 0 v58 a118 18 0 0 1 -236 0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="592" cy="156" rx="118" ry="18" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="592" y="192" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Database</text>
  <text x="592" y="220" font-size="20" fill="#065F46" text-anchor="middle">order saved</text>

  <g filter="url(#dp1-soft)">
    <rect x="474" y="360" width="236" height="88" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="592" y="394" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Message broker</text>
  <text x="592" y="424" font-size="20" fill="#B91C1C" text-anchor="middle">publish fails</text>

  <line x1="714" y1="190" x2="820" y2="190" stroke="#059669" stroke-width="2" marker-end="url(#dp1-emerald)"/>
  <g filter="url(#dp1-soft)">
    <rect x="824" y="154" width="290" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="824" y="368" width="290" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="969" y="186" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The order exists</text>
  <text x="969" y="212" font-size="20" fill="#065F46" text-anchor="middle">customer was charged</text>
  <text x="969" y="400" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Nobody was told</text>
  <text x="969" y="426" font-size="20" fill="#B91C1C" text-anchor="middle">no stock reserved, no shipment</text>

  
  <rect x="90" y="496" width="1024" height="96" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="602" y="528" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Retrying the publish does not fix it either.</text>
  <text x="602" y="558" font-size="20" fill="#475569" text-anchor="middle">If the service crashes between the two steps, there is nothing left to retry from,</text>
  <text x="602" y="584" font-size="20" fill="#475569" text-anchor="middle">and a distributed transaction across a database and a broker is rarely available.</text>
</svg>