<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Non-functional requirements for a likes counter: targets of read under 20 milliseconds, write under 100 milliseconds at p95, and billions of events; and accepted trade-offs of eventual consistency, availability under partition, and durability once acknowledged">
  <defs>
    <filter id="ytnf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytnf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytnf-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytnf-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytnf-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytnf-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytnf-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytnf-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">YouTube Likes Counter: non-functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">How well it has to work. The top row is what the design must hit, the bottom row is what it gives up on purpose.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Targets the design must hit</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#B45309">Trade-offs accepted on purpose</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ytnf-lift)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="80" y="175" width="9" height="90" fill="#059669" clip-path="url(#ytnf-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Read under 20 ms</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">runs on every video view</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">the hottest path in the system</text>
  <g filter="url(#ytnf-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#ytnf-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Write under 100 ms</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">at p95, so the click</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">feels instant</text>
  <g filter="url(#ytnf-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#ytnf-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Billions of events</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">scaled by sharding,</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">not by bigger servers</text>
  <g filter="url(#ytnf-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#ytnf-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Eventual consistency</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">counts converge in time,</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">they are not exact every moment</text>
  <g filter="url(#ytnf-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#059669" clip-path="url(#ytnf-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Stay up in a partition</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">serve a slightly stale count</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">rather than an error</text>
  <g filter="url(#ytnf-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#64748B" clip-path="url(#ytnf-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Never lose a write</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">buffered in memory, then</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">written to durable storage</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">p95</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">95 of every 100 requests finish inside the target; the slowest 5 may be worse, and that is accepted</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">AP</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">in CAP terms this system picks availability over consistency, because a stale like count is harmless</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Converge</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">replicas can disagree for a moment, and given enough time they all reach the same count</text>
</svg>