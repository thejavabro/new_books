<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In message queues, Kafka consumers pull at their own speed, which gives backpressure. In monitoring, Prometheus pulls metrics on a schedule, while short jobs push. For client updates, polling pulls, while WebSockets and webhooks push. In caches, filling on a miss is pull, and writing on every change is push.">
  <defs>
    <filter id="pvp3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pvp3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="pvp3-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="pvp3-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="pvp3-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="pvp3-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The same choice in other systems</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Push and pull is a general pattern, not only a feed technique.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#pvp3-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#pvp3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Queues</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">Kafka consumers</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">pull at their pace</text>
  <g filter="url(#pvp3-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#pvp3-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Monitoring</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">Prometheus pulls,</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">short jobs push</text>
  <g filter="url(#pvp3-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#D97706" clip-path="url(#pvp3-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Client updates</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">polling pulls,</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">webhooks push</text>
  <g filter="url(#pvp3-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#pvp3-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Caches</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fill on a miss: pull</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">write on change: push</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Backpressure</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">a slow receiver asks for less, and the queue holds the rest</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Pull</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">a failed scheduled request shows that a service is down</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Push</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">delivers data immediately, even from jobs that end quickly</text>
</svg>