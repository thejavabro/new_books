<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="session-title session-desc">
<title id="session-title">The session is the interesting one</title>
<desc id="session-desc">A session is a lease renewed by heartbeats, and keys tied to it vanish when it lapses. That gives leader election for free, and creates an unbounded window in which a process still believes it holds a lock it has lost.</desc>
<defs>
<marker id="session-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="session-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="session-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="session-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="750" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The session is the interesting one</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A session is a lease the client renews with heartbeats.</text>
<rect x="40" y="672" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="672" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">What the session buys you</text>
<rect x="40" y="168" width="400" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">create the key, win the election</text>
<path d="M446 196H484" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 196H484" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#session-marker-green)"/>
<rect x="490" y="168" width="280" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="630" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">heartbeat to hold it</text>
<path d="M776 196H814" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M776 196H814" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#session-marker-green)"/>
<rect x="820" y="168" width="380" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1010" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">stop, and it vanishes</text>
<text x="620" y="248" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">No health check, no external monitor, no human</text>
<text x="40" y="288" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">And the gap it creates</text>
<rect x="40" y="306" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="340" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the store deletes your key</text>
<rect x="640" y="306" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="340" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">your process is still running</text>
<path d="M320 366V394" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M320 366V394" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#session-marker-red)"/>
<path d="M920 366V394" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 366V394" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#session-marker-red)"/>
<rect x="40" y="400" width="1160" height="58" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="400" width="5" height="58" rx="2.5" fill="#F28B9D"/><text x="64" y="435" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">an unbounded window where the cluster has a new leader and the old one does not know</text>
<rect x="40" y="476" width="1160" height="78" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="476" width="5" height="78" rx="2.5" fill="#F3CF6A"/><text x="64" y="506.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A session usually expires because you were paused, partitioned or overloaded.</text><text x="64" y="535.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The heartbeat is the first thing to suffer, so the store decides you are dead when you are busiest.</text>
<rect x="40" y="572" width="1160" height="74" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="572" width="5" height="74" rx="2.5" fill="#AC8BE8"/><text x="64" y="601.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">On watches</text><text x="64" y="628.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Treat a watch as a hint that something changed, then read the current state.</text>
<text x="66" y="706" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Never reconstruct state from the event stream. A watch tells you to look, not what you missed.</text>
</svg>