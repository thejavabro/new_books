  <text x="718" y="592" font-size="21.5" font-weight="600" fill="#111827">DNS lookups</text>

  <rect x="40" y="680" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">TCP cost</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">some delay, from the handshake, acknowledgements, and resends</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">UDP cost</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">some loss, which the application accepts or handles itself</text>
  <rect x="64" y="805" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="830" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Both</text>
  <text x="323" y="830" font-size="18.5" fill="#475569">QUIC, under HTTP/3, runs on UDP and adds its own reliability</text>
</svg>