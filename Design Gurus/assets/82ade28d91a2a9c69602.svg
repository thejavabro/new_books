<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="TCP, where a missing piece breaks the result: web pages, email, file downloads, and database queries. UDP, where fresh data matters more than complete data: video calls, online games, live streams, and DNS lookups.">
