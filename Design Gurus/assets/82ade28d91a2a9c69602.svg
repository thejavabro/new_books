  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Which applications use TCP and which use UDP</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Ask: if one piece is missing, does the result break, or only glitch?</text>

  <rect x="40" y="120" width="570" height="530" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">TCP: a missing piece breaks it</text>
  <rect x="630" y="120" width="570" height="530" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#B45309">UDP: fresh data matters most</text>

  <g fill="none" stroke-width="2">

  </g>

