<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="814" viewBox="0 0 1240 814" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The first batch decision is not a status code. It is whether the items form one unit of meaning. A money transfer must be all-or-nothing because applying one side destroys or creates money. Notification deliveries are independent, so partial success keeps the valid ones.">
  <defs>
    <filter id="xl11unitori-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl11unitori-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl11unitori-k1"><rect x="84" y="218" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl11unitori-k2"><rect x="84" y="400" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl11unitori-k3"><rect x="84" y="464" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl11unitori-k4"><rect x="84" y="528" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl11unitori-k5"><rect x="84" y="592" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl11unitori-k6"><rect x="684" y="218" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl11unitori-k7"><rect x="684" y="400" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl11unitori-k8"><rect x="684" y="464" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl11unitori-k9"><rect x="684" y="528" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl11unitori-k10"><rect x="684" y="592" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="814" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="84" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">Ask the meaning question before the status question</text>
  <text x="64" y="99" font-size="15.5" fill="#6B7280">If one item cannot be applied, is it still correct for the others to remain applied?</text>

  
  <rect x="40" y="144" width="556" height="530" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="84" y="174" font-size="16.5" font-weight="600" fill="#4338CA">No: one unit of meaning</text>
  <text x="84" y="196" font-size="15.5" fill="#6B7280">All-or-nothing</text>

  <g filter="url(#xl11unitori-lift)">
    <rect x="84" y="218" width="472" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="84" y="218" width="9" height="90" fill="#4F46E5" clip-path="url(#xl11unitori-k1)"/>
  </g>
  <circle cx="122" cy="263" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,252.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="148" y="270" font-size="18.5" font-weight="600" fill="#111827">A money transfer</text>
  <text x="320" y="333" font-size="15.5" text-anchor="middle" fill="#6B7280">decrease account A by 5,000</text>
  <text x="320" y="356" font-size="15.5" text-anchor="middle" fill="#94A3B8">increase account B by 5,000</text>

  <g filter="url(#xl11unitori-soft)">
    <rect x="84" y="400" width="472" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="400" width="6" height="48" fill="#4F46E5" clip-path="url(#xl11unitori-k2)"/>
  </g>
  <circle cx="118" cy="424" r="4.5" fill="#4F46E5"/>
  <text x="142" y="431" font-size="18.5" font-weight="600" fill="#111827">Validate every item first.</text>

  <g filter="url(#xl11unitori-soft)">
    <rect x="84" y="464" width="472" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="464" width="6" height="48" fill="#4F46E5" clip-path="url(#xl11unitori-k3)"/>
  </g>
  <circle cx="118" cy="488" r="4.5" fill="#4F46E5"/>
  <text x="142" y="495" font-size="18.5" font-weight="600" fill="#111827">Apply none if any item fails.</text>

  <g filter="url(#xl11unitori-soft)">
    <rect x="84" y="528" width="472" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="528" width="6" height="48" fill="#4F46E5" clip-path="url(#xl11unitori-k4)"/>
  </g>
  <circle cx="118" cy="552" r="4.5" fill="#4F46E5"/>
  <text x="142" y="559" font-size="18.5" font-weight="600" fill="#111827">Return one request-level error.</text>

  <g filter="url(#xl11unitori-soft)">
    <rect x="84" y="592" width="472" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="592" width="6" height="48" fill="#4F46E5" clip-path="url(#xl11unitori-k5)"/>
  </g>
  <circle cx="118" cy="616" r="4.5" fill="#4F46E5"/>
  <text x="142" y="623" font-size="18.5" font-weight="600" fill="#111827">Promise no partial state remains.</text>

  
  <rect x="644" y="144" width="556" height="530" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="174" font-size="16.5" font-weight="600" fill="#047857">Yes: independent items</text>
  <text x="684" y="196" font-size="15.5" fill="#6B7280">Partial success</text>

  <g filter="url(#xl11unitori-lift)">
    <rect x="684" y="218" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="218" width="9" height="90" fill="#059669" clip-path="url(#xl11unitori-k6)"/>
  </g>
  <circle cx="722" cy="263" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,252.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="748" y="270" font-size="18.5" font-weight="600" fill="#111827">Notification deliveries</text>
  <text x="920" y="333" font-size="15.5" text-anchor="middle" fill="#6B7280">deliver to usr_42Q</text>
  <text x="920" y="356" font-size="15.5" text-anchor="middle" fill="#94A3B8">deliver to usr_91P</text>

  <g filter="url(#xl11unitori-soft)">
    <rect x="684" y="400" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="400" width="6" height="48" fill="#059669" clip-path="url(#xl11unitori-k7)"/>
  </g>
  <circle cx="718" cy="424" r="4.5" fill="#059669"/>
  <text x="742" y="431" font-size="18.5" font-weight="600" fill="#111827">Validate the outer request.</text>

  <g filter="url(#xl11unitori-soft)">
    <rect x="684" y="464" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="464" width="6" height="48" fill="#059669" clip-path="url(#xl11unitori-k8)"/>
  </g>
  <circle cx="718" cy="488" r="4.5" fill="#059669"/>
  <text x="742" y="495" font-size="18.5" font-weight="600" fill="#111827">Report one result per item.</text>

  <g filter="url(#xl11unitori-soft)">
    <rect x="684" y="528" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="528" width="6" height="48" fill="#059669" clip-path="url(#xl11unitori-k9)"/>
  </g>
  <circle cx="718" cy="552" r="4.5" fill="#059669"/>
  <text x="742" y="559" font-size="18.5" font-weight="600" fill="#111827">A 200 does not mean all succeeded.</text>

  <g filter="url(#xl11unitori-soft)">
    <rect x="684" y="592" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="592" width="6" height="48" fill="#059669" clip-path="url(#xl11unitori-k10)"/>
  </g>
  <circle cx="718" cy="616" r="4.5" fill="#059669"/>
  <text x="742" y="623" font-size="18.5" font-weight="600" fill="#111827">The caller retries only failures.</text>

  
  <rect x="40" y="698" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="743" text-anchor="middle" font-size="16" fill="#475569">Partial success is not the safe default. For money movement it is incorrectness, not resilience.</text>
</svg>