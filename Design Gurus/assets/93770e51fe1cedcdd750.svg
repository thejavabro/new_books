<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="846" viewBox="0 0 1240 846" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A bare array reaches a wall when pagination is added, leaving only bad options: break callers, split metadata into a header, or invent a second operation. An envelope beginning with items safely gains next_cursor and then one optional metadata field, because old callers ignore fields they do not recognize.">
  <defs>
    <marker id="xl05envelop-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="xl05envelop-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="xl05envelop-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl05envelop-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl05envelop-k1"><rect x="84" y="198" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl05envelop-k2"><rect x="84" y="366" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl05envelop-k3"><rect x="84" y="534" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl05envelop-k4"><rect x="684" y="198" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl05envelop-k5"><rect x="684" y="366" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl05envelop-k6"><rect x="684" y="534" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="846" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Why the envelope survives change</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the same list response as later versions arrive</text>

  
  <rect x="40" y="126" width="556" height="580" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="84" y="156" font-size="16.5" font-weight="600" fill="#BE185D">A bare array</text>
  <text x="84" y="178" font-size="15.5" fill="#6B7280">there is no top level left to extend</text>

  <g fill="none" stroke-width="2">
    <path d="M320,330 V366" stroke="#DB2777" marker-end="url(#xl05envelop-pm)"/>
    <path d="M320,498 V534" stroke="#DB2777" marker-end="url(#xl05envelop-pm)"/>
  </g>

  <g filter="url(#xl05envelop-soft)">
    <rect x="84" y="198" width="472" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="198" width="6" height="90" fill="#64748B" clip-path="url(#xl05envelop-k1)"/>
  </g>
  <circle cx="122" cy="243" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,232.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="148" y="250" font-size="18.5" font-weight="600" fill="#111827">Version 1: [ ... ]</text>
  <text x="320" y="313" font-size="15.5" text-anchor="middle" fill="#6B7280">the whole body is a bare list of items</text>

  <g filter="url(#xl05envelop-soft)">
    <rect x="84" y="366" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="366" width="6" height="90" fill="#DB2777" clip-path="url(#xl05envelop-k2)"/>
  </g>
  <circle cx="122" cy="411" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,400.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="148" y="418" font-size="18.5" font-weight="600" fill="#111827">Version 2: add paging</text>
  <text x="320" y="481" font-size="15.5" text-anchor="middle" fill="#6B7280">there is nowhere to put a cursor</text>

  <g filter="url(#xl05envelop-lift)">
    <rect x="84" y="534" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="534" width="9" height="90" fill="#DB2777" clip-path="url(#xl05envelop-k3)"/>
  </g>
  <circle cx="122" cy="579" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,568.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="148" y="586" font-size="18.5" font-weight="600" fill="#111827">Changing the body needs care</text>
  <text x="320" y="649" font-size="15.5" text-anchor="middle" fill="#6B7280">change the body, use headers, or add another operation</text>
  <text x="320" y="672" font-size="15.5" text-anchor="middle" fill="#94A3B8">each option has different costs</text>

  
  <rect x="644" y="126" width="556" height="580" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="156" font-size="16.5" font-weight="600" fill="#047857">An envelope</text>
  <text x="684" y="178" font-size="15.5" fill="#6B7280">the top level is an object, so it has room</text>

  <g fill="none" stroke-width="2">
    <path d="M920,330 V366" stroke="#059669" marker-end="url(#xl05envelop-em)"/>
    <path d="M920,498 V534" stroke="#059669" marker-end="url(#xl05envelop-em)"/>
  </g>

  <g filter="url(#xl05envelop-soft)">
    <rect x="684" y="198" width="472" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="198" width="6" height="90" fill="#64748B" clip-path="url(#xl05envelop-k4)"/>
  </g>
  <circle cx="722" cy="243" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,232.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="748" y="250" font-size="18.5" font-weight="600" fill="#111827">Version 1: { items }</text>
  <text x="920" y="313" font-size="15.5" text-anchor="middle" fill="#6B7280">the body is an object with an items field</text>

  <g filter="url(#xl05envelop-soft)">
    <rect x="684" y="366" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="366" width="6" height="90" fill="#059669" clip-path="url(#xl05envelop-k5)"/>
  </g>
  <circle cx="722" cy="411" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,400.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="748" y="418" font-size="18.5" font-weight="600" fill="#111827">Version 2: add next_cursor</text>
  <text x="920" y="481" font-size="15.5" text-anchor="middle" fill="#6B7280">the cursor is one more field beside items</text>

  <g filter="url(#xl05envelop-lift)">
    <rect x="684" y="534" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="534" width="9" height="90" fill="#059669" clip-path="url(#xl05envelop-k6)"/>
  </g>
  <circle cx="722" cy="579" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,568.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="748" y="586" font-size="18.5" font-weight="600" fill="#111827">Version 3: add one metadata field</text>
  <text x="920" y="649" font-size="15.5" text-anchor="middle" fill="#6B7280">old callers ignore fields they do not know</text>
  <text x="920" y="672" font-size="15.5" text-anchor="middle" fill="#94A3B8">existing fields and behavior must stay compatible</text>

  
  <rect x="40" y="730" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="775" text-anchor="middle" font-size="16" fill="#475569">An envelope provides space for metadata without changing the top-level response type.</text>
</svg>