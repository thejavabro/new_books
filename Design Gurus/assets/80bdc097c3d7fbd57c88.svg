<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="card-title card-desc">
<title id="card-title">Cardinality is the whole tension</title>
<desc id="card-desc">High cardinality is what makes a system debuggable and what makes observability expensive, and those are the same statement. The resolution depends on where the data is held.</desc>
<defs>
<marker id="card-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="card-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="card-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="card-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Cardinality is the whole tension</text>
<text x="40" y="86" font-size="21" fill="#4A5568">One idea explains most arguments about observability tooling and most of its cost.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="56" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="56" rx="2.5" fill="#AC8BE8"/><text x="64" y="152" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Cardinality: the number of distinct values a field can take</text>
<rect x="40" y="192" width="560" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">region: about five values</text>
<rect x="640" y="192" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">customer_id: millions</text>
<rect x="40" y="268" width="560" height="172" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 268H46A6 6 0 0 0 40 274V434A6 6 0 0 0 46 440H54Z" fill="#5EC9EC"/><text x="70" y="304" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Metrics</text>
<text x="72" y="340" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">series = the product of label values</text>
<text x="72" y="368" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">one extra high-cardinality label on</text>
<text x="72" y="396" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a 5-label metric makes millions</text>
<text x="72" y="424" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">keep metrics low cardinality</text>
<rect x="640" y="268" width="560" height="172" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 268H646A6 6 0 0 0 640 274V434A6 6 0 0 0 646 440H654Z" fill="#39D5AA"/><text x="670" y="304" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Logs and traces</text>
<text x="672" y="340" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">each record stands alone, so it</text>
<text x="672" y="368" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">creates no persistent series</text>
<text x="672" y="396" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">high cardinality is natural here</text>
<text x="672" y="424" font-size="19" font-weight="700" fill="#169B77" text-anchor="start">this is where identifiers belong</text>
<rect x="40" y="460" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="460" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="493.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Metrics tell you that something is wrong and roughly where.</text><text x="64" y="522.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Logs and traces tell you which ones, and only they can.</text>
<rect x="40" y="564" width="1160" height="102" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="564" width="5" height="102" rx="2.5" fill="#F28B9D"/><text x="64" y="595" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The failure mode</text><text x="64" y="621" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Reaching for a metric to answer a "which ones" question, needing a high-cardinality</text><text x="64" y="647" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">label, and adding it. The bill arrives a month later and the capability was misplaced.</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The questions that matter during an incident are almost always "which specific ones?"</text>
</svg>