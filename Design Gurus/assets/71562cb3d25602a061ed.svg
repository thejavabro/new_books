<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="666" viewBox="0 0 1240 666" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="costs-title costs-desc">
<title id="costs-title">Two lists, paid at different times</title>
<desc id="costs-desc">A monolith has real costs that grow with size, and splitting has a different set that arrive immediately. Making the case honestly means naming both, because an argument that pretends a monolith is free loses at once.</desc>
<defs>
<marker id="costs-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="costs-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="costs-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="costs-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="666" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two lists, paid at different times</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Making the case honestly means naming both.</text>
<rect x="40" y="588" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="588" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="326" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V438A6 6 0 0 0 46 444H54Z" fill="#F3CF6A"/><text x="70" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">What a monolith costs</text>
<text x="70" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">gradually, as it grows</text>
<rect x="72" y="196" width="500" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">build and test time grows</text>
<rect x="72" y="244" width="500" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="272" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deploys couple teams</text>
<rect x="72" y="292" width="500" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="320" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one leak takes down the process</text>
<rect x="72" y="340" width="500" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="368" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">scaling is all or nothing</text>
<rect x="72" y="388" width="500" height="44" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a bad dependency is everyone's</text>
<rect x="640" y="118" width="560" height="326" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V438A6 6 0 0 0 646 444H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">What distribution costs</text>
<text x="670" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">from the first day, in full</text>
<rect x="672" y="196" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every call can now fail</text>
<rect x="672" y="244" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="272" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">transactions become sagas</text>
<rect x="672" y="292" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="320" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a stack trace becomes tracing</text>
<rect x="672" y="340" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="368" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one deploy becomes many</text>
<rect x="672" y="388" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">on-call multiplies</text>
<rect x="40" y="468" width="560" height="94" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="468" width="5" height="94" rx="2.5" fill="#5EC9EC"/><text x="64" y="495" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Complexity is not removed by splitting.</text><text x="64" y="521" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">It moves from inside a process, where the compiler</text><text x="64" y="547" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">helps, to between processes, where nothing does.</text>
<rect x="640" y="468" width="560" height="94" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="468" width="5" height="94" rx="2.5" fill="#AC8BE8"/><text x="664" y="495" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">It is an argument about timing,</text><text x="664" y="521" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">because the right-hand list is paid from day one</text><text x="664" y="547" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and most of the benefits arrive much later.</text>
<text x="66" y="622" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">None of this is an argument against services.</text>
</svg>