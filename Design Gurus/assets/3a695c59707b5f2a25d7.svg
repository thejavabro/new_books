<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1102" viewBox="0 0 1240 1102" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The metric stack for an agent: task success rate at the bottom, then trajectory quality, then safety metrics in both directions, then online metrics on live traffic">
  <defs>
    <marker id="ec1-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="ec1-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="ec1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ec1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ec1-k1"><rect x="390" y="136" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="ec1-k2"><rect x="390" y="396" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="ec1-k3"><rect x="390" y="596" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="ec1-k4"><rect x="390" y="796" width="460" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="1102" fill="#FFFFFF"/>
  <rect x="200" y="56" width="840" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="224" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Only on live traffic</text>
  <rect x="200" y="316" width="840" height="630" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="224" y="346" font-size="16.5" font-weight="600" fill="#B45309">First measured in the sandbox</text>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M390,641 H352 Q340,641 340,653 V829 Q340,841 352,841 H390" marker-end="url(#ec1-mamber)"/></g>
  <g filter="url(#ec1-soft)">
    <rect x="390" y="136" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="390" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#ec1-k1)"/>
  </g>
  <circle cx="428" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="390" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Level 4</text>
  <text x="454" y="188" font-size="18.5" font-weight="600" fill="#111827">Online metrics</text>
  <text x="620" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">completion without takeover, cost per completed task, action rates</text>
  <g filter="url(#ec1-soft)">
    <rect x="390" y="396" width="460" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="390" y="396" width="6" height="90" fill="#7C3AED" clip-path="url(#ec1-k2)"/>
  </g>
  <circle cx="428" cy="441" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,430.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="390" y="384" font-size="15.5" font-weight="600" fill="#6B7280">Level 3</text>
  <text x="454" y="448" font-size="18.5" font-weight="600" fill="#111827">Safety metrics</text>
  <text x="620" y="511" font-size="15.5" text-anchor="middle" fill="#6B7280">correct refusals and the false-block rate, in both directions</text>
  <g filter="url(#ec1-soft)">
    <rect x="390" y="596" width="460" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="390" y="596" width="6" height="90" fill="#4F46E5" clip-path="url(#ec1-k3)"/>
  </g>
  <circle cx="428" cy="641" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,630.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="390" y="584" font-size="15.5" font-weight="600" fill="#6B7280">Level 2</text>
  <text x="454" y="648" font-size="18.5" font-weight="600" fill="#111827">Trajectory quality</text>
  <text x="620" y="711" font-size="15.5" text-anchor="middle" fill="#6B7280">steps to completion, wrong-tool rate, recovery rate</text>
  <g filter="url(#ec1-lift)">
    <rect x="390" y="796" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="390" y="796" width="9" height="90" fill="#059669" clip-path="url(#ec1-k4)"/>
  </g>
  <circle cx="428" cy="841" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,830.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="390" y="784" font-size="15.5" font-weight="600" fill="#6B7280">Level 1</text>
  <text x="454" y="848" font-size="18.5" font-weight="600" fill="#111827">Task success rate</text>
  <text x="620" y="911" font-size="15.5" text-anchor="middle" fill="#6B7280">did the agent achieve the goal? the headline number</text>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="330" y="746" fill="#B45309">gets worse first</text></g>
  <g fill="none" stroke="#64748B" stroke-width="1.5"><path d="M1072,946 V58" marker-end="url(#ec1-mslate)"/></g>
  <text x="1084" y="914" font-size="15.5" fill="#6B7280">read it from</text>
  <text x="1084" y="937" font-size="15.5" fill="#6B7280">the bottom up</text>
  <rect x="40" y="986" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1031" text-anchor="middle" font-size="16" fill="#475569">Always read completion without takeover next to cost per completed task.</text>
</svg>