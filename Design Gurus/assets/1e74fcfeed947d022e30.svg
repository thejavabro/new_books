<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Expand-contract as a lifecycle for renaming a field: the state starts with the old field only, the producer adds the new field so both are populated, four consumer teams migrate on their own schedules, measured usage of the old field reads zero, and only then is the old field removed after the announced deprecation date.">
  <defs>
    <marker id="m06-l07-field-migration-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l07-field-migration-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m06-l07-field-migration-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m06-l07-field-migration-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="950" fill="#FFFFFF"/>

  <g filter="url(#m06-l07-field-migration-soft)">
    <rect x="90" y="230" width="280" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Old field only</text>
  <text x="230" y="313" text-anchor="middle" font-size="20" fill="#64748B">read by four teams</text>
  <g filter="url(#m06-l07-field-migration-soft)">
    <rect x="490" y="230" width="300" height="120" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="640" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Both fields populated</text>
  <text x="640" y="313" text-anchor="middle" font-size="20" fill="#64748B">the producer writes both</text>
  <g filter="url(#m06-l07-field-migration-soft)">
    <rect x="890" y="230" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1035" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consumers migrated</text>
  <text x="1035" y="313" text-anchor="middle" font-size="20" fill="#64748B">all four teams done</text>
  <g filter="url(#m06-l07-field-migration-soft)">
    <rect x="890" y="440" width="290" height="120" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1035" y="491" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Old field unused</text>
  <text x="1035" y="523" text-anchor="middle" font-size="20" fill="#64748B">nothing reads it now</text>
  <g filter="url(#m06-l07-field-migration-soft)">
    <rect x="490" y="440" width="300" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="640" y="491" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Old field removed</text>
  <text x="640" y="523" text-anchor="middle" font-size="20" fill="#64748B">the contract phase is done</text>
  <g filter="url(#m06-l07-field-migration-soft)">
    <rect x="60" y="440" width="380" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="250" y="491" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The expand window: both</text>
  <text x="250" y="523" text-anchor="middle" font-size="20" fill="#64748B">fields exist, nobody coordinates</text>

  <g fill="none" stroke-width="2.5">
    <path d="M73,290 L82,290" stroke="#475569" stroke-width="2" marker-end="url(#m06-l07-field-migration-sl)"/>
    <path d="M370,290 L482,290" stroke="#7C3AED" marker-end="url(#m06-l07-field-migration-vi)"/>
    <path d="M790,290 L882,290" stroke="#475569" stroke-width="2" marker-end="url(#m06-l07-field-migration-sl)"/>
    <path d="M1035,350 L1035,432" stroke="#059669" marker-end="url(#m06-l07-field-migration-em)"/>
    <path d="M890,500 L798,500" stroke="#7C3AED" marker-end="url(#m06-l07-field-migration-vi)"/>
  </g>

  <circle cx="60" cy="290" r="12" fill="#475569"/>

  <text x="426" y="190" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the producer adds</text>
  <text x="426" y="218" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the new field</text>
  <text x="836" y="190" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">four teams migrate</text>
  <text x="836" y="218" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on their own schedules</text>
  <text x="1015" y="392" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">measured usage of the old</text>
  <text x="1015" y="420" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">field reads zero</text>
  <text x="844" y="600" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">after the announced deprecation date</text>

  <rect x="60" y="640" width="1120" height="190" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="90" y="686" font-size="20" font-weight="600" fill="#5B21B6">The guardrail at every step: contract tests</text>
  <text x="90" y="728" font-size="20" fill="#0F172A">Each consumer keeps contract tests inside the producer's CI.</text>
  <text x="90" y="764" font-size="20" fill="#0F172A">The producer's build fails, instead of a consumer's runtime.</text>
  <text x="90" y="800" font-size="20" fill="#0F172A">Usage of the old field is measured before anything is deleted.</text>

  <line x1="60" y1="870" x2="96" y2="870" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="877" font-size="20" fill="#475569">What the producer does: add first, remove last</text>
  <line x1="60" y1="910" x2="96" y2="910" stroke="#059669" stroke-width="4"/>
  <text x="108" y="917" font-size="20" fill="#475569">The gate on removal: measured to zero, not assumed</text>
</svg>