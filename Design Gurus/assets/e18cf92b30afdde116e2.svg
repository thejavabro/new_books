<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1313" viewBox="0 0 1240 1313" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four stages of a resumable upload. Create the session metadata, put numbered parts each with its own checksum, read the session after a disconnect to see that parts one and two already arrived, then post the file completion where the whole file checksum is verified. Only the missing part is sent again.">
  <defs>
    <marker id="pr-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="pr-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="pr-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="pr-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pr-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pr-k1"><rect x="400" y="184" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="pr-k2"><rect x="160" y="410" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="pr-k3"><rect x="480" y="410" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="pr-k4"><rect x="800" y="410" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="pr-k5"><rect x="400" y="611" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="pr-k6"><rect x="320" y="789" width="600" height="90" rx="12"/></clipPath>
    <clipPath id="pr-k7"><rect x="400" y="971" width="440" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1313" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Resuming an upload from what already arrived</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">four stages, in order</text>

  
  <rect x="40" y="136" width="1160" height="182" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="166" font-size="16.5" font-weight="600" fill="#1D4ED8">1. Create the session</text>
  <text x="1176" y="166" text-anchor="end" font-size="15.5" fill="#6B7280">201 with part_size_bytes and maximum_parts</text>

  <rect x="40" y="362" width="1160" height="157" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="392" font-size="16.5" font-weight="600" fill="#1D4ED8">2. Send numbered parts</text>
  <text x="1176" y="392" text-anchor="end" font-size="15.5" fill="#6B7280">one checksum per part</text>

  <rect x="40" y="563" width="1160" height="182" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="593" font-size="16.5" font-weight="600" fill="#B45309">3. Read after a drop</text>
  <text x="1176" y="593" text-anchor="end" font-size="15.5" fill="#6B7280">resume is a read, not a guess</text>

  <rect x="40" y="923" width="1160" height="182" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="953" font-size="16.5" font-weight="600" fill="#047857">4. Complete the file</text>
  <text x="1176" y="953" text-anchor="end" font-size="15.5" fill="#6B7280">201 with the File resource</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,318 V362" stroke="#2563EB" marker-end="url(#pr-bl)"/>
    <path d="M620,519 V563" stroke="#D97706" marker-end="url(#pr-am)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,745 V789" stroke="#D97706" marker-end="url(#pr-am)"/>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M620,879 V923" stroke="#059669" marker-end="url(#pr-em)"/>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M900,789 V500" stroke="#D97706" marker-end="url(#pr-am)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="916" y="546" fill="#B45309">resend part 3</text>
  </g>

  
  <g filter="url(#pr-soft)">
    <rect x="400" y="184" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="400" y="184" width="6" height="90" fill="#2563EB" clip-path="url(#pr-k1)"/>
  </g>
  <circle cx="438" cy="229" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,218.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="464" y="236" font-size="18.5" font-weight="600" fill="#111827">POST /upload-sessions</text>
  <text x="620" y="299" text-anchor="middle" font-size="15.5" fill="#6B7280">file name, size, whole-file checksum</text>

  
  <g filter="url(#pr-soft)">
    <rect x="160" y="410" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="160" y="410" width="6" height="90" fill="#2563EB" clip-path="url(#pr-k2)"/>
  </g>
  <circle cx="198" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(187.56,444.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="224" y="462" font-size="18.5" font-weight="600" fill="#111827">PUT .../parts/1</text>

  <g filter="url(#pr-soft)">
    <rect x="480" y="410" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="480" y="410" width="6" height="90" fill="#2563EB" clip-path="url(#pr-k3)"/>
  </g>
  <circle cx="518" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,444.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="544" y="462" font-size="18.5" font-weight="600" fill="#111827">PUT .../parts/2</text>

  <g filter="url(#pr-soft)">
    <rect x="800" y="410" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="800" y="410" width="6" height="90" fill="#D97706" clip-path="url(#pr-k4)"/>
  </g>
  <circle cx="838" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,444.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="864" y="462" font-size="18.5" font-weight="600" fill="#111827">PUT .../parts/3</text>

  
  <g filter="url(#pr-soft)">
    <rect x="400" y="611" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="400" y="611" width="6" height="90" fill="#D97706" clip-path="url(#pr-k5)"/>
  </g>
  <circle cx="438" cy="656" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,645.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="464" y="663" font-size="18.5" font-weight="600" fill="#111827">GET /upload-sessions/{id}</text>
  <text x="620" y="726" text-anchor="middle" font-size="15.5" fill="#6B7280">uploaded_parts: 1, 2</text>

  
  <g filter="url(#pr-lift)">
    <rect x="320" y="789" width="600" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="320" y="789" width="9" height="90" fill="#D97706" clip-path="url(#pr-k6)"/>
  </g>
  <circle cx="358" cy="834" r="18" fill="#FFFFFF"/>
  <g transform="translate(347.56,823.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="384" y="841" font-size="18.5" font-weight="600" fill="#111827">Parts 1 and 2 are kept. Only part 3 is sent again.</text>

  
  <g filter="url(#pr-soft)">
    <rect x="400" y="971" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="400" y="971" width="6" height="90" fill="#059669" clip-path="url(#pr-k7)"/>
  </g>
  <circle cx="438" cy="1016" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,1005.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="464" y="1023" font-size="18.5" font-weight="600" fill="#111827">POST /files</text>
  <text x="620" y="1086" text-anchor="middle" font-size="15.5" fill="#6B7280">whole-file checksum verified</text>

  
  <rect x="40" y="1145" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1187" text-anchor="middle" font-size="16" fill="#475569">The file is the logical operation. One bounded part is the unit of retry.</text>
  <text x="620" y="1215" text-anchor="middle" font-size="16" fill="#475569">Check integrity twice: once for each part on arrival, once for the assembled file.</text>
  <text x="620" y="1243" text-anchor="middle" font-size="16" fill="#475569">A part may be correct while the assembled file is not.</text>
</svg>