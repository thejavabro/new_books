<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before the scan begins">
<defs>
<filter id="pt-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="674" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Is there a smaller number, then a larger one, then a middle one?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array is [9, 11, 8, 9, 10, 7, 9], and the three have to appear in that order left to right</text>
<rect x="40" y="106" width="1160" height="420" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The scan runs right to left, so everything to the right of a number is already known</text>
<text x="206" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<rect x="228" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="278" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<text x="278" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="342" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="392" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">11</text>
<text x="392" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="456" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="506" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<text x="506" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="570" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<text x="620" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="684" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="734" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="734" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="798" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="848" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="848" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<rect x="912" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="962" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<text x="962" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">6</text>
<text x="548" y="302" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">stack</text>
<text x="576" y="301" font-size="18" fill="#475569">the stack is empty</text>
<text x="548" y="426" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">candidates</text>
<text x="576" y="425" font-size="18" fill="#475569">no candidates yet</text>
<rect x="40" y="548" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="588" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The stack holds numbers waiting to be the largest of the three</text>
<text x="620" y="620" text-anchor="middle" font-size="18.5" fill="#475569">The candidates row holds numbers that already have a larger one to their left</text>
</svg>