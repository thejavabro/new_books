  <g transform="translate(495.56,208.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="532" y="226" font-size="18.5" font-weight="600" fill="#111827">Conversation</text>
  <text x="608" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">+ draft_text, is_open</text>

  
  <g filter="url(#p3q-soft)">
    <rect x="468" y="324" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="468" y="324" width="6" height="90" fill="#059669" clip-path="url(#p3q-k5)"/>
  </g>
  <circle cx="506" cy="369" r="18" fill="#FFFFFF"/>
  <g transform="translate(495.56,358.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="532" y="376" font-size="18.5" font-weight="600" fill="#111827">Message</text>
  <text x="608" y="439" font-size="15.5" text-anchor="middle" fill="#6B7280">+ delivery_state, local_id</text>

  
  <g filter="url(#p3q-soft)">
    <rect x="468" y="474" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="468" y="474" width="6" height="90" fill="#059669" clip-path="url(#p3q-k6)"/>
  </g>
  <circle cx="506" cy="519" r="18" fill="#FFFFFF"/>
  <g transform="translate(495.56,508.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="532" y="526" font-size="18.5" font-weight="600" fill="#111827">Receipt</text>
  <text x="608" y="589" font-size="15.5" text-anchor="middle" fill="#6B7280">+ pending target</text>

  
  <g filter="url(#p3q-lift)">
