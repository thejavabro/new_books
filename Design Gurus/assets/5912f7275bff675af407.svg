    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="148" y="376" font-size="18.5" font-weight="600" fill="#111827">Message</text>
  <text x="224" y="439" font-size="15.5" text-anchor="middle" fill="#6B7280">sequence, text</text>

  
  <g filter="url(#p3q-soft)">
    <rect x="84" y="474" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="474" width="6" height="90" fill="#2563EB" clip-path="url(#p3q-k3)"/>
  </g>
  <circle cx="122" cy="519" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,508.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="148" y="526" font-size="18.5" font-weight="600" fill="#111827">Receipt</text>
  <text x="224" y="589" font-size="15.5" text-anchor="middle" fill="#6B7280">read_through_sequence</text>

  
  <g filter="url(#p3q-soft)">
    <rect x="468" y="174" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="468" y="174" width="6" height="90" fill="#059669" clip-path="url(#p3q-k4)"/>
