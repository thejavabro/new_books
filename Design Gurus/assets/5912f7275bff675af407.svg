<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The server entities conversation, message and receipt map one to one onto client-local copies that keep the same field names. The client adds its own state: draft text, delivery state, a pending change queue carrying idempotency keys, and a sync state holding the position and last event id. None of those client fields is ever sent as a server resource field.">
  <defs>
    <marker id="p3q-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p3q-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3q-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3q-k1"><rect x="84" y="174" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p3q-k2"><rect x="84" y="324" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p3q-k3"><rect x="84" y="474" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p3q-k4"><rect x="468" y="174" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p3q-k5"><rect x="468" y="324" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p3q-k6"><rect x="468" y="474" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p3q-k7"><rect x="852" y="174" width="304" height="90" rx="12"/></clipPath>
    <clipPath id="p3q-k8"><rect x="852" y="324" width="304" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="762" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The same vocabulary, plus clearly local state</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each server entity has one client copy with the same name</text>

  
  <rect x="44" y="126" width="360" height="486" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="68" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Server resources</text>

  
  <rect x="428" y="126" width="360" height="486" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="452" y="156" font-size="16.5" font-weight="600" fill="#047857">Client-local copies</text>

  
  <rect x="812" y="126" width="384" height="486" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="836" y="156" font-size="16.5" font-weight="600" fill="#B45309">Client only</text>

  
  <g fill="none" stroke-width="2">
    <path d="M364,219 H468" stroke="#64748B" marker-end="url(#p3q-sl)"/>
    <path d="M364,369 H468" stroke="#64748B" marker-end="url(#p3q-sl)"/>
    <path d="M364,519 H468" stroke="#64748B" marker-end="url(#p3q-sl)"/>
  </g>

  
  <g filter="url(#p3q-soft)">
