    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="916" y="226" font-size="18.5" font-weight="600" fill="#111827">PendingChange</text>
  <text x="1004" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">idempotency_key</text>

  
  <g filter="url(#p3q-lift)">
    <rect x="852" y="324" width="304" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="852" y="324" width="9" height="90" fill="#D97706" clip-path="url(#p3q-k8)"/>
  </g>
  <circle cx="890" cy="369" r="18" fill="#FFFFFF"/>
  <g transform="translate(879.56,358.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="916" y="376" font-size="18.5" font-weight="600" fill="#111827">SyncState</text>
  <text x="1004" y="439" font-size="15.5" text-anchor="middle" fill="#6B7280">position</text>
  <text x="1004" y="462" font-size="15.5" text-anchor="middle" fill="#94A3B8">last_event_id</text>

  
  <rect x="852" y="528" width="304" height="58" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="1004" y="563" font-size="15.5" font-weight="600" text-anchor="middle" fill="#B45309">Never sent as server fields</text>

  
  <rect x="40" y="646" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="691" text-anchor="middle" font-size="16" fill="#475569">A pending message becomes authoritative only when the server returns its id and sequence.</text>
</svg>