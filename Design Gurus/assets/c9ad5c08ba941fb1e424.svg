<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Synchronous: the primary saves the write, the replica saves it too, then the client hears saved, so a crash loses nothing. Asynchronous: the primary saves the write and the client hears saved at once, the copy to the replica comes later, so a crash before the copy loses the write.">
  <defs>
    <filter id="ft2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ft2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ft2-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ft2-k2"><rect x="64" y="315" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ft2-k3"><rect x="64" y="450" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ft2-k4"><rect x="654" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ft2-k5"><rect x="654" y="315" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ft2-k6"><rect x="654" y="450" width="522" height="90" rx="12"/></clipPath>
    <marker id="ft2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Why fault tolerance loses no data</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The difference is when the client hears "saved".</text>

  <rect x="40" y="120" width="570" height="510" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Synchronous: wait for a copy</text>
  <rect x="630" y="120" width="570" height="510" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#047857">Asynchronous: confirm first</text>

  <g fill="none" stroke-width="2">
    <path d="M325,270 V315" stroke="#64748B" marker-end="url(#ft2-m-slate)"/>
    <path d="M915,270 V315" stroke="#64748B" marker-end="url(#ft2-m-slate)"/>
    <path d="M325,405 V450" stroke="#64748B" marker-end="url(#ft2-m-slate)"/>
    <path d="M915,405 V450" stroke="#64748B" marker-end="url(#ft2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ft2-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#ft2-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">1. Primary saves the write</text>
  <g filter="url(#ft2-soft)">
    <rect x="64" y="315" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="315" width="6" height="90" fill="#2563EB" clip-path="url(#ft2-k2)"/>
  </g>
  <circle cx="102" cy="360" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,349.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="128" y="367" font-size="21.5" font-weight="600" fill="#111827">2. Replica saves it too</text>
  <g filter="url(#ft2-soft)">
    <rect x="64" y="450" width="522" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="450" width="6" height="90" fill="#7C3AED" clip-path="url(#ft2-k3)"/>
  </g>
  <circle cx="102" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,484.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="128" y="502" font-size="21.5" font-weight="600" fill="#111827">3. Client hears "saved"</text>
  <text x="325" y="569" font-size="18.5" text-anchor="middle" fill="#6B7280">a crash now loses nothing</text>
  <g filter="url(#ft2-soft)">
    <rect x="654" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#ft2-k4)"/>
  </g>
  <circle cx="692" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="718" y="232" font-size="21.5" font-weight="600" fill="#111827">1. Primary saves the write</text>
  <g filter="url(#ft2-soft)">
    <rect x="654" y="315" width="522" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="654" y="315" width="6" height="90" fill="#059669" clip-path="url(#ft2-k5)"/>
  </g>
  <circle cx="692" cy="360" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,349.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="718" y="367" font-size="21.5" font-weight="600" fill="#111827">2. Client hears "saved"</text>
  <g filter="url(#ft2-soft)">
    <rect x="654" y="450" width="522" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="654" y="450" width="6" height="90" fill="#DB2777" clip-path="url(#ft2-k6)"/>
  </g>
  <circle cx="692" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,484.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="718" y="502" font-size="21.5" font-weight="600" fill="#111827">3. Replica copies it later</text>
  <text x="915" y="569" font-size="18.5" text-anchor="middle" fill="#6B7280">a crash before this loses the write</text>

  <rect x="40" y="660" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="685" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="710" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Synchronous</text>
  <text x="323" y="710" font-size="18.5" fill="#475569">no confirmed write is lost, but every write waits for another machine</text>
  <rect x="64" y="735" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="760" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Asynchronous</text>
  <text x="323" y="760" font-size="18.5" fill="#475569">faster writes, but the newest writes can be lost in a crash</text>
</svg>