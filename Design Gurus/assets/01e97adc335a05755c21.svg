<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="768" viewBox="0 0 1240 768" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A server session keeps the state in a shared store and looks it up on every request, while a JWT carries the state in the token itself and only needs a signature check">
  <rect x="0" y="0" width="1240" height="768" fill="#FFFFFF"/>
  <defs>
    <marker id="se1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se1-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="se1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same logged-in request, and where the truth about it lives</text>

  
  <rect x="40" y="76" width="1160" height="272" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#1E40AF">Server session: the token is only a pointer</text>

  <text x="365" y="164" font-size="20" fill="#1E40AF" text-anchor="middle">cookie: sid=8f2c</text>
  <line x1="274" y1="186" x2="452" y2="186" stroke="#3B82F6" stroke-width="2" marker-end="url(#se1-blue)"/>
  <text x="795" y="164" font-size="20" fill="#1E40AF" text-anchor="middle">look up sid</text>
  <line x1="704" y1="186" x2="882" y2="186" stroke="#3B82F6" stroke-width="2" marker-end="url(#se1-blue)"/>

  <g filter="url(#se1-soft)">
    <rect x="70" y="150" width="200" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="150" width="240" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="890" y="150" width="240" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="170" y="192" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Browser</text>
  <text x="580" y="192" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Any app server</text>
  <text x="1010" y="182" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Session store</text>
  <text x="1010" y="208" font-size="20" fill="#5B21B6" text-anchor="middle">user 42, role admin</text>

  <text x="70" y="266" font-size="20" font-weight="600" fill="#475569">Per request</text>
  <text x="70" y="296" font-size="20" fill="#0F172A">One network hop to the store, so the state is always current.</text>
  <text x="70" y="326" font-size="20" fill="#B91C1C">The store is now something you must scale and keep up.</text>

  
  <rect x="40" y="368" width="1160" height="272" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="402" font-size="20" font-weight="600" fill="#5B21B6">JWT: the token carries the claims and a signature</text>

  <text x="365" y="456" font-size="20" fill="#5B21B6" text-anchor="middle">token with claims</text>
  <line x1="274" y1="478" x2="452" y2="478" stroke="#7C3AED" stroke-width="2" marker-end="url(#se1-violet)"/>

  <g filter="url(#se1-soft)">
    <rect x="70" y="442" width="200" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="442" width="240" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="170" y="484" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Browser</text>
  <text x="580" y="474" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Any app server</text>
  <text x="580" y="500" font-size="20" fill="#5B21B6" text-anchor="middle">verifies the signature</text>

  <rect x="890" y="442" width="240" height="72" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="1010" y="474" font-size="20" fill="#94A3B8" text-anchor="middle">no store to call</text>
  <text x="1010" y="500" font-size="20" fill="#94A3B8" text-anchor="middle">and none to scale</text>

  <text x="70" y="558" font-size="20" font-weight="600" fill="#475569">Per request</text>
  <text x="70" y="588" font-size="20" fill="#0F172A">A signature check in memory, so it scales out with no shared state.</text>
  <text x="70" y="618" font-size="20" fill="#B91C1C">The claims are as old as the token, and cannot be changed mid-life.</text>

  
  <rect x="40" y="676" width="1160" height="80" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="710" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">You are choosing where the state lives: in a store you must run, or inside the token itself.</text>
  <text x="620" y="740" font-size="20" fill="#334155" text-anchor="middle">Everything else about this decision follows from that one choice.</text>
</svg>