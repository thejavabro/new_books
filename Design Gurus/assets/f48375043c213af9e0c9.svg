<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="608" viewBox="0 0 1240 608" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A 99.5 percent monthly SLO gives 216 minutes of error budget, and a single 120 minute outage spends more than half of it, which changes what the team is allowed to release">
  <rect x="0" y="0" width="1240" height="608" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One outage, and what is left to spend for the rest of the month</text>

  <text x="140" y="98" font-size="20" fill="#334155">SLO 99.5% over a 30 day month, so 0.5% of 43,200 minutes</text>
  <text x="140" y="150" font-size="20" font-weight="600" fill="#0F172A">Monthly error budget: 216 minutes</text>

  <rect x="140" y="180" width="533" height="70" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="406" y="222" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">120 minutes spent</text>

  <rect x="673" y="180" width="427" height="70" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="886" y="222" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">96 minutes left</text>

  <text x="406" y="284" font-size="20" fill="#B91C1C" text-anchor="middle">one bug, one afternoon</text>
  <text x="886" y="284" font-size="20" fill="#065F46" text-anchor="middle">for the whole rest of the month</text>

  
  <rect x="140" y="330" width="300" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="290" y="368" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">under half spent</text>
  <text x="290" y="398" font-size="20" fill="#065F46" text-anchor="middle">ship normally</text>

  <rect x="470" y="330" width="300" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="3"/>
  <text x="620" y="368" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">half or more spent</text>
  <text x="620" y="398" font-size="20" fill="#92400E" text-anchor="middle">risky releases wait</text>

  <rect x="800" y="330" width="300" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="950" y="368" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">budget exhausted</text>
  <text x="950" y="398" font-size="20" fill="#B91C1C" text-anchor="middle">reliability work only</text>

  <text x="620" y="462" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">you are here</text>

  
  <rect x="50" y="486" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="522" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One 120 minute outage spent more than half the month's budget in a single afternoon.</text>
  <text x="620" y="552" font-size="20" fill="#334155" text-anchor="middle">The budget is not a target to hit. It is a balance that decides how much risk you can still take.</text>
</svg>