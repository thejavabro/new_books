<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="912" viewBox="0 0 1240 912" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="path-title path-desc">
<title id="path-title">The path, which is the exercise</title>
<desc id="path-desc">A correct target with no sequence is the most common weak answer. Four properties are what make this sequence a zero-downtime plan.</desc>
<defs>
<marker id="path-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="path-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="path-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="path-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="912" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The path, which is the exercise</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A correct target with no sequence is the most common weak answer.</text>
<rect x="40" y="834" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="834" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="145" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="152" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="436" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="308" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Make the application region-aware</text>
<path d="M532 145H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M532 145H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#path-marker-slate)"/>
<rect x="576" y="118" width="624" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="138.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no infrastructure change, reversible, a</text><text x="596" y="163.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no-op while both point at the same place</text>
<circle cx="60" cy="207" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="214" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="180" width="436" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="308" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Stand up the European read path</text>
<path d="M532 207H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M532 207H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#path-marker-slate)"/>
<rect x="576" y="180" width="624" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="200.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no traffic on it yet. Verify replication</text><text x="596" y="225.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">lag before anything depends on it</text>
<circle cx="60" cy="269" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="276" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="242" width="436" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="308" y="275" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Move internal and employee traffic</text>
<path d="M532 269H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M532 269H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#path-marker-slate)"/>
<rect x="576" y="242" width="624" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="275" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">real traffic, small blast radius, and the first honest test</text>
<circle cx="60" cy="331" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="338" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="304" width="436" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="308" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Move a small share of European reads</text>
<path d="M532 331H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M532 331H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#path-marker-slate)"/>
<rect x="576" y="304" width="624" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="337" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a percentage dial that can go back down. Watch staleness here</text>
<circle cx="60" cy="393" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="400" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="366" width="436" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="308" y="399" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Move all European reads</text>
<path d="M532 393H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M532 393H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#path-marker-slate)"/>
<rect x="576" y="366" width="624" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="399" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the latency win lands at this step and not before</text>
<circle cx="60" cy="455" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="462" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="90" y="428" width="436" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="308" y="461" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Rehearse the failover, in production</text>
<path d="M532 455H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M532 455H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#path-marker-slate)"/>
<rect x="576" y="428" width="624" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="448.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the prospect requirement becomes a</text><text x="596" y="473.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">measured number rather than an aspiration</text>
<circle cx="60" cy="517" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="524" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<rect x="90" y="490" width="436" height="54" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="308" y="523" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Document the objective, as measured</text>
<path d="M532 517H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M532 517H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#path-marker-slate)"/>
<rect x="576" y="490" width="624" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="523" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with the figure the rehearsal produced</text>
<text x="40" y="584" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What makes this a plan rather than a wish</text>
<rect x="40" y="602" width="560" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="635" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Every step is independently reversible</text>
<rect x="640" y="602" width="560" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="635" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Nothing in it is a cutover</text>
<rect x="40" y="662" width="560" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="695" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The riskiest step is rehearsed</text>
<rect x="640" y="662" width="560" height="54" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="920" y="695" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The application change goes first and alone</text>
<rect x="40" y="734" width="1160" height="74" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="734" width="5" height="74" rx="2.5" fill="#F3CF6A"/><text x="64" y="764" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Step four has the detail most answers skip</text><text x="64" y="790" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A write then an immediate read from a lagging replica shows the user their own change missing.</text>
<text x="66" y="868" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Route the session to the primary after a write, or route read-after-write paths there permanently.</text>
</svg>