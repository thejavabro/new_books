<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="hypothesis-title hypothesis-desc">
<title id="hypothesis-title">The hypothesis is the part that matters</title>
<desc id="hypothesis-desc">The difference between an experiment and breaking something is a sentence written beforehand that names the failure, names the expectation, gives numbers, and can be wrong.</desc>
<defs>
<marker id="hypothesis-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="hypothesis-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="hypothesis-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="hypothesis-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="860" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The hypothesis is the part that matters</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The difference between an experiment and breaking something is a sentence written beforehand.</text>
<rect x="40" y="782" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="782" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#5EC9EC"/><text x="64" y="150.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">If the recommendation service is made to take 10 seconds, the product page will</text><text x="64" y="177.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">still render within 500 ms, using the cached fallback, and the error rate will not change.</text>
<rect x="40" y="218" width="284" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="182" y="252" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">names the failure</text>
<rect x="332" y="218" width="284" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="474" y="252" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">names the expectation</text>
<rect x="624" y="218" width="284" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="766" y="252" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">gives checkable numbers</text>
<rect x="916" y="218" width="284" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1058" y="252" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">can be wrong</text>
<rect x="40" y="294" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="294" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="333" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Without it, whatever happens gets interpreted as what was supposed to happen</text>
<text x="40" y="398" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The five ways it is usually wrong</text>
<circle cx="60" cy="439" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="446" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="416" width="1110" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="110" y="445" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">The timeout was longer than anybody thought, or did not exist on that call</text>
<circle cx="60" cy="491" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="498" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="468" width="1110" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="110" y="497" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">The fallback had a dependency on the thing that failed</text>
<circle cx="60" cy="543" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="550" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="520" width="1110" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="110" y="549" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">The cache was empty, because the fallback had never actually run</text>
<circle cx="60" cy="595" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="602" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="572" width="1110" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="110" y="601" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Something unrelated broke, revealing a dependency nobody had drawn</text>
<circle cx="60" cy="647" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="654" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="624" width="1110" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="110" y="653" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">The alert did not fire, which is a finding worth as much</text>
<rect x="40" y="690" width="1160" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="690" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="64" y="729" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The most valuable outcome is the hypothesis being wrong.</text>
<text x="66" y="816" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Running it in business hours tells you whether the system would have told you.</text>
</svg>