<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Car promises start, stop and refuel to every caller, but ElectricCar inherits refuel and cannot honour it, and adding recharge does not remove it">
  <defs>
    <filter id="lec-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lec-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="lec-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="lec-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="lec-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <clipPath id="lec-car"><rect x="170" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="lec-m1"><rect x="70" y="270" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="lec-m2"><rect x="245" y="270" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="lec-m3"><rect x="420" y="270" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="lec-ev"><rect x="770" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="lec-bad"><rect x="670" y="270" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="lec-new"><rect x="940" y="270" width="230" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="400" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">What Car promises to every caller</text>

  <g fill="none" stroke-width="2">
    <path d="M245,200 V220 Q245,232 233,232 H157 Q145,232 145,244 V264" stroke="#64748B" marker-end="url(#lec-sl)"/>
    <path d="M320,200 V264" stroke="#64748B" marker-end="url(#lec-sl)"/>
    <path d="M395,200 V220 Q395,232 407,232 H483 Q495,232 495,244 V264" stroke="#64748B" marker-end="url(#lec-sl)"/>
  </g>

  <g filter="url(#lec-lift)">
    <rect x="170" y="110" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="170" y="110" width="9" height="90" fill="#64748B" clip-path="url(#lec-car)"/>
  </g>
  <circle cx="210" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(199.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 16l1.5-5.5h14l1.5 5.5v3.5h-17z"/><circle cx="8" cy="19.5" r="1.6"/><circle cx="16" cy="19.5" r="1.6"/>
  </g>
  <text x="236" y="162" font-size="18.5" font-weight="600" fill="#111827">Car</text>

  <g filter="url(#lec-soft)">
    <rect x="70" y="270" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="270" width="6" height="90" fill="#64748B" clip-path="url(#lec-m1)"/>
  </g>
  <circle cx="108" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,304.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 4.5C7 4.5 7.5 9 5 12c2.5 3 2 7.5 4.5 7.5M14.5 4.5c2.5 0 2 4.5 4.5 7.5-2.5 3-2 7.5-4.5 7.5"/>
  </g>
  <text x="134" y="322" font-size="18.5" font-weight="600" fill="#111827">start()</text>

  <g filter="url(#lec-soft)">
    <rect x="245" y="270" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="245" y="270" width="6" height="90" fill="#64748B" clip-path="url(#lec-m2)"/>
  </g>
  <circle cx="283" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(272.56,304.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 4.5C7 4.5 7.5 9 5 12c2.5 3 2 7.5 4.5 7.5M14.5 4.5c2.5 0 2 4.5 4.5 7.5-2.5 3-2 7.5-4.5 7.5"/>
  </g>
  <text x="309" y="322" font-size="18.5" font-weight="600" fill="#111827">stop()</text>

  <g filter="url(#lec-soft)">
    <rect x="420" y="270" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="420" y="270" width="6" height="90" fill="#64748B" clip-path="url(#lec-m3)"/>
  </g>
  <circle cx="458" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,304.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 4.5C7 4.5 7.5 9 5 12c2.5 3 2 7.5 4.5 7.5M14.5 4.5c2.5 0 2 4.5 4.5 7.5-2.5 3-2 7.5-4.5 7.5"/>
  </g>
  <text x="484" y="322" font-size="18.5" font-weight="600" fill="#111827">refuel()</text>
  <text x="320" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">three methods any caller may call</text>
  <text x="320" y="408" font-size="15.5" text-anchor="middle" fill="#475569">on a Car, or on anything that is a Car</text>

  
  <rect x="640" y="40" width="560" height="400" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#BE185D">What ElectricCar is left holding</text>

  <g fill="none" stroke-width="2.5">
    <path d="M850,200 V220 Q850,232 838,232 H797 Q785,232 785,244 V264" stroke="#DB2777" marker-end="url(#lec-pk)"/>
    <path d="M990,200 V220 Q990,232 1002,232 H1043 Q1055,232 1055,244 V264" stroke="#059669" marker-end="url(#lec-em)"/>
  </g>

  <g filter="url(#lec-lift)">
    <rect x="770" y="110" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="770" y="110" width="9" height="90" fill="#DB2777" clip-path="url(#lec-ev)"/>
  </g>
  <circle cx="810" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(799.56,144.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 16l1.5-5.5h14l1.5 5.5v3.5h-17z"/><circle cx="8" cy="19.5" r="1.6"/><circle cx="16" cy="19.5" r="1.6"/>
  </g>
  <text x="836" y="162" font-size="18.5" font-weight="600" fill="#111827">ElectricCar</text>

  <g filter="url(#lec-lift)">
    <rect x="670" y="270" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="670" y="270" width="9" height="90" fill="#DB2777" clip-path="url(#lec-bad)"/>
  </g>
  <circle cx="710" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(699.56,304.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="736" y="322" font-size="18.5" font-weight="600" fill="#111827">refuel()</text>
  <text x="785" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">inherited, but unusable</text>
  <text x="785" y="408" font-size="15.5" text-anchor="middle" fill="#BE185D">it fails at run time</text>

  <g filter="url(#lec-soft)">
    <rect x="940" y="270" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="940" y="270" width="6" height="90" fill="#059669" clip-path="url(#lec-new)"/>
  </g>
  <circle cx="978" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2.5L5.5 13.5h5.5l-1 8 7.5-11h-5.5z"/>
  </g>
  <text x="1004" y="322" font-size="18.5" font-weight="600" fill="#111827">recharge()</text>
  <text x="1055" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">added by the subclass</text>
  <text x="1055" y="408" font-size="15.5" text-anchor="middle" fill="#BE185D">but refuel is still there</text>

  
  <rect x="40" y="470" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="494" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="516" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">What is promised</text>
  <text x="288" y="516" font-size="15.5" fill="#475569">code that holds a Car must keep working when it is handed an ElectricCar instead</text>
  <rect x="64" y="538" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="560" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Where it breaks</text>
  <text x="288" y="560" font-size="15.5" fill="#475569">the subclass cannot honour refuel, and adding recharge does not remove what it inherited</text>
</svg>