<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="490" viewBox="0 0 1240 490" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The gateway limiter protects everything behind it, a service limiter guards one expensive endpoint, and the client limiter only saves wasted round trips">
  <rect x="0" y="0" width="1240" height="490" fill="#FFFFFF"/>
  <defs>
    <marker id="rl11-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="rl11-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="240" y1="240" x2="325" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#rl11-slate)"/>
  <line x1="610" y1="240" x2="715" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#rl11-slate)"/>
  <line x1="610" y1="240" x2="715" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#rl11-slate)"/>
  <line x1="610" y1="240" x2="715" y2="375" stroke="#475569" stroke-width="2" marker-end="url(#rl11-slate)"/>

  <g filter="url(#rl11-soft)">
    <rect x="40" y="190" width="200" height="100" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <rect x="330" y="170" width="280" height="140" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
    <rect x="720" y="70" width="300" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="720" y="200" width="300" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="720" y="330" width="300" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>

  <text x="140" y="228" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="140" y="262" font-size="20" fill="#64748B" text-anchor="middle">paces itself</text>

  <text x="470" y="222" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">API Gateway</text>
  <text x="470" y="258" font-size="20" fill="#B45309" text-anchor="middle">the general limit</text>
  <text x="470" y="290" font-size="20" fill="#B45309" text-anchor="middle">lives here</text>

  <text x="870" y="118" font-size="20" fill="#1E3A8A" text-anchor="middle">Service A</text>
  <text x="870" y="248" font-size="20" fill="#1E3A8A" text-anchor="middle">Service B</text>
  <text x="870" y="372" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Reporting service</text>
  <text x="870" y="404" font-size="20" fill="#B45309" text-anchor="middle">own limit: 10 a minute</text>

  <text x="620" y="465" font-size="20" fill="#475569" text-anchor="middle">The general limit belongs at the edge, and a service adds its own only when its work is expensive</text>
</svg>