<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="814" viewBox="0 0 1240 814" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="gap-title gap-desc">
<title id="gap-title">When the pivot lands on a gap</title>
<desc id="gap-desc">The moment that feels most dangerous and is the easiest to handle well, because what is being assessed is whether you know which question to ask.</desc>
<defs>
<marker id="gap-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="gap-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="gap-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="gap-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="814" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">When the pivot lands on a gap</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The moment that feels most dangerous and is the easiest to handle well.</text>
<rect x="40" y="736" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="736" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="88" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="88" rx="2.5" fill="#F28B9D"/><text x="64" y="155" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The failure is not the gap. The failure is pretending.</text><text x="64" y="181" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A confident wrong answer makes everything else you said less trustworthy.</text>
<circle cx="60" cy="260" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="267" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="230" width="428" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="266" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say what you do know</text>
<path d="M526 260H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 260H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gap-marker-slate)"/>
<rect x="570" y="230" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="253.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">precisely and without padding. The boundary of</text><text x="590" y="278.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">your knowledge is information</text>
<circle cx="60" cy="332" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="339" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="302" width="428" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reason from principles</text>
<path d="M526 332H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 332H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gap-marker-slate)"/>
<rect x="570" y="302" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="325.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if you do not know how this system handles a partition,</text><text x="590" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you know what any system must choose between</text>
<circle cx="60" cy="404" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="411" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="374" width="428" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="410" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say what you would check</text>
<path d="M526 404H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 404H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gap-marker-slate)"/>
<rect x="570" y="374" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="397.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"I would look at whether it acknowledges before</text><text x="590" y="422.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">or after the handler returns"</text>
<circle cx="60" cy="476" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="483" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="446" width="428" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="306" y="482" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Offer the adjacent thing</text>
<path d="M526 476H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 476H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gap-marker-slate)"/>
<rect x="570" y="446" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="469.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if you have operated something comparable,</text><text x="590" y="494.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the transfer is real</text>
<rect x="40" y="530" width="1160" height="76" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="560.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"I have not operated that specific system. Here is how I would reason about it,</text><text x="620" y="587.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and here is what I would want to verify."</text>
<rect x="40" y="630" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="630" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="662" font-size="21" font-weight="700" fill="#6040A8" text-anchor="start">Said once and briefly, it costs very little.</text><text x="64" y="690" font-size="21" font-weight="700" fill="#6040A8" text-anchor="start">Said with hedging and apology, it costs a lot.</text>
<text x="66" y="770" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Why not X is usually a request for the comparison, not a challenge. Give X its fair case.</text>
</svg>