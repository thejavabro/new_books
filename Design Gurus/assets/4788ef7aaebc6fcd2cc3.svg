<text x="318" y="182" fill="#1D4ED8">Rectangle</text>
<text x="318" y="254" fill="#1D4ED8">Double rectangle</text>
<text x="318" y="326" fill="#5B21B6">Ellipse</text>
<text x="318" y="398" fill="#5B21B6">Underlined ellipse</text>
<text x="318" y="470" fill="#5B21B6">Double ellipse</text>
<text x="318" y="542" fill="#5B21B6">Dashed ellipse</text>
<text x="318" y="614" fill="#5B21B6">Ellipse with children</text>
<text x="318" y="686" fill="#047857">Diamond</text>
<text x="318" y="758" fill="#047857">Double diamond</text>
<text x="318" y="830" fill="#B45309">Double line</text>
</g>
<g font-size="15.5" fill="#94A3B8">
<text x="318" y="204">entity</text>
<text x="318" y="276">weak entity</text>
<text x="318" y="348">attribute</text>
<text x="318" y="420">key attribute</text>
<text x="318" y="492">multivalued attribute</text>
<text x="318" y="564">derived attribute</text>
<text x="318" y="636">composite attribute</text>
<text x="318" y="708">relationship</text>
<text x="318" y="780">identifying relationship</text>
<text x="318" y="852">total participation</text>
</g>

<g font-size="15.5" fill="#111827">
<text x="578" y="176">A thing you keep data about, like Student.</text>
<text x="578" y="248">Cannot be identified on its own. It needs an owner entity.</text>
<text x="578" y="320">One fact about an entity, like a name or a price.</text>
<text x="578" y="392">Identifies one instance and never repeats.</text>
<text x="578" y="464">Several values for one instance, like three phone numbers.</text>
<text x="578" y="536">Calculated from other attributes, like age from a birth date.</text>
<text x="578" y="608">Splits into smaller parts, like an address into city and street.</text>
<text x="578" y="680">A link between entities, labelled with a verb.</text>
<text x="578" y="752">Joins a weak entity to the owner that identifies it.</text>
<text x="578" y="824">Every instance must take part in the relationship.</text>
</g>
<g font-size="15.5" fill="#6B7280">
<text x="578" y="200">Becomes a table.</text>
<text x="578" y="272">Becomes a table with a composite primary key.</text>
<text x="578" y="344">Becomes one column.</text>
<text x="578" y="416">Becomes the primary key.</text>
<text x="578" y="488">Becomes a separate table, never a column.</text>
<text x="578" y="560">Usually becomes no column at all.</text>
<text x="578" y="632">Becomes one column per part.</text>
<text x="578" y="704">Becomes a foreign key, or a join table if many to many.</text>
<text x="578" y="776">Becomes the foreign key inside the composite primary key.</text>
<text x="578" y="848">Becomes NOT NULL on the foreign key.</text>
</g>

<rect x="40" y="918" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="956" font-size="16" fill="#475569">The two most confused: a double ellipse is multivalued, a dashed ellipse is derived. They are not the same thing.</text>
</svg>