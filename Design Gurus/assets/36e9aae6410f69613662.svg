<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="556" viewBox="0 0 1240 556" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Cassandra, DynamoDB and MongoDB each expose a setting that picks lower latency or more consistency for a single operation, so one application can use both at the same time.">
  <rect x="0" y="0" width="1240" height="556" fill="#FFFFFF"/>
  <defs>
    <marker id="pc4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="pc4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="pc4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="pc4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="pc4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="pc4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="pc4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="pc4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="pc4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The else half is a setting you choose per operation</text>
  <g filter="url(#pc4-soft)"><rect x="334" y="56" width="436" height="40" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="552" y="84" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Lower latency (EL)</text>
  <g filter="url(#pc4-soft)"><rect x="780" y="56" width="436" height="40" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="998" y="84" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">More consistency (EC)</text>
  <rect x="24" y="106" width="300" height="92" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="159" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Cassandra</text>
  <g filter="url(#pc4-soft)"><rect x="334" y="106" width="436" height="92" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="552" y="145" font-size="19" fill="#0F172A" text-anchor="middle">consistency level ONE:</text>
  <text x="552" y="171" font-size="19" fill="#0F172A" text-anchor="middle">ask one replica</text>
  <g filter="url(#pc4-soft)"><rect x="780" y="106" width="436" height="92" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="998" y="145" font-size="19" fill="#0F172A" text-anchor="middle">consistency level QUORUM:</text>
  <text x="998" y="171" font-size="19" fill="#0F172A" text-anchor="middle">ask a majority</text>
  <rect x="24" y="208" width="300" height="92" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="261" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">DynamoDB</text>
  <g filter="url(#pc4-soft)"><rect x="334" y="208" width="436" height="92" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="552" y="247" font-size="19" fill="#0F172A" text-anchor="middle">eventually consistent read:</text>
  <text x="552" y="273" font-size="19" fill="#0F172A" text-anchor="middle">the default, and cheaper</text>
  <g filter="url(#pc4-soft)"><rect x="780" y="208" width="436" height="92" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="998" y="247" font-size="19" fill="#0F172A" text-anchor="middle">strongly consistent read:</text>
  <text x="998" y="273" font-size="19" fill="#0F172A" text-anchor="middle">slower, and costs more</text>
  <rect x="24" y="310" width="300" height="92" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="363" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">MongoDB</text>
  <g filter="url(#pc4-soft)"><rect x="334" y="310" width="436" height="92" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="552" y="349" font-size="19" fill="#0F172A" text-anchor="middle">write concern 1, and</text>
  <text x="552" y="375" font-size="19" fill="#0F172A" text-anchor="middle">read from a secondary</text>
  <g filter="url(#pc4-soft)"><rect x="780" y="310" width="436" height="92" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="998" y="349" font-size="19" fill="#0F172A" text-anchor="middle">write concern majority,</text>
  <text x="998" y="375" font-size="19" fill="#0F172A" text-anchor="middle">and read from the primary</text>
  <rect x="24" y="412" width="300" height="92" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="465" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">What the user gets</text>
  <g filter="url(#pc4-soft)"><rect x="334" y="412" width="436" height="92" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="552" y="451" font-size="19" fill="#0F172A" text-anchor="middle">a fast answer that may</text>
  <text x="552" y="477" font-size="19" fill="#0F172A" text-anchor="middle">be a little out of date</text>
  <g filter="url(#pc4-soft)"><rect x="780" y="412" width="436" height="92" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="998" y="451" font-size="19" fill="#0F172A" text-anchor="middle">a slower answer that is</text>
  <text x="998" y="477" font-size="19" fill="#0F172A" text-anchor="middle">always up to date</text>
  <text x="620" y="544" font-size="19" fill="#64748B" text-anchor="middle">One application usually uses both. Session data can be EL while payment records are EC.</text>
</svg>