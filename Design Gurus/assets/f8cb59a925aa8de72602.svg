<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="656" viewBox="0 0 1240 656" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="anomalies-title anomalies-desc">
<title id="anomalies-title">What users actually report</title>
<desc id="anomalies-desc">Four caching anomalies: a write that does not appear, a value that moves backwards between refreshes, two entities cached at different moments that disagree, and an aggregate that does not match the list beneath it.</desc>
<defs>
<marker id="anomalies-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="anomalies-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="anomalies-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="anomalies-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="656" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What users actually report</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Serving an old value is the obvious failure and it is rarely the one that generates complaints.</text>
<rect x="40" y="578" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="578" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="40" y="118" width="480" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Read-your-writes</text>
<path d="M526 150H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 150H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#anomalies-marker-slate)"/>
<rect x="570" y="118" width="630" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="590" y="143" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the user edits, and the next page shows the old value</text>
<text x="590" y="169" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reported as data loss, not as staleness</text>
<rect x="40" y="194" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Monotonic reads</text>
<path d="M526 226H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 226H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#anomalies-marker-slate)"/>
<rect x="570" y="194" width="630" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="590" y="219" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">refresh shows the new value, refresh again shows the old</text>
<text x="590" y="245" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">two cache nodes holding different versions</text>
<rect x="40" y="270" width="480" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cross-entity</text>
<path d="M526 302H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 302H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#anomalies-marker-slate)"/>
<rect x="570" y="270" width="630" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="590" y="295" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">header and line items cached at different moments</text>
<text x="590" y="321" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a total that does not equal the sum of its lines</text>
<rect x="40" y="346" width="480" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Aggregate and parts</text>
<path d="M526 378H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 378H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#anomalies-marker-slate)"/>
<rect x="570" y="346" width="630" height="64" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="590" y="371" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the count says 1,204 and the list has 1,198 rows</text>
<text x="590" y="397" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dismissed as a rounding problem for months</text>
<rect x="40" y="434" width="1160" height="118" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="118" rx="2.5" fill="#39D5AA"/><text x="64" y="472" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A single stale value is usually tolerable.</text><text x="64" y="499" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">A SET of values cached independently is where caching becomes visible to users,</text><text x="64" y="526" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">because they see a combination no single moment ever produced.</text>
<text x="66" y="612" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">None of these are reported as caching problems. They are reported as the system being broken.</text>
</svg>