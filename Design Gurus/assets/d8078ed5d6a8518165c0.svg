<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two ways to enforce the same limit: hard throttling rejects the excess request, soft throttling delays it and serves it late">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="rl2-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rl2-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="rl2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="350" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="80" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Hard throttling</text>

  <rect x="640" y="40" width="580" height="350" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="80" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Soft throttling</text>

  <line x1="200" y1="166" x2="200" y2="180" stroke="#DC2626" stroke-width="2"/>
  <line x1="310" y1="166" x2="310" y2="180" stroke="#DC2626" stroke-width="2"/>
  <line x1="420" y1="166" x2="420" y2="180" stroke="#DC2626" stroke-width="2"/>
  <line x1="200" y1="180" x2="420" y2="180" stroke="#DC2626" stroke-width="2"/>
  <line x1="310" y1="180" x2="310" y2="191" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rl2-red)"/>

  <line x1="820" y1="166" x2="820" y2="180" stroke="#D97706" stroke-width="2"/>
  <line x1="930" y1="166" x2="930" y2="180" stroke="#D97706" stroke-width="2"/>
  <line x1="1040" y1="166" x2="1040" y2="180" stroke="#D97706" stroke-width="2"/>
  <line x1="820" y1="180" x2="1040" y2="180" stroke="#D97706" stroke-width="2"/>
  <line x1="930" y1="180" x2="930" y2="185" stroke="#D97706" stroke-width="2.5" marker-end="url(#rl2-amber)"/>
  <line x1="930" y1="260" x2="930" y2="291" stroke="#D97706" stroke-width="2.5" marker-end="url(#rl2-amber)"/>

  <g filter="url(#rl2-soft)">
    <rect x="155" y="110" width="90" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="265" y="110" width="90" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="375" y="110" width="90" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="130" y="196" width="360" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

    <rect x="775" y="110" width="90" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="885" y="110" width="90" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="995" y="110" width="90" height="56" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="780" y="190" width="300" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="750" y="296" width="360" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <rect x="800" y="205" width="80" height="40" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.2"/>
  <rect x="890" y="205" width="80" height="40" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.2"/>
  <rect x="980" y="205" width="80" height="40" rx="6" fill="#FDE68A" stroke="#B45309" stroke-width="1.2"/>

  <text x="200" y="146" font-size="20" fill="#0F172A" text-anchor="middle">6</text>
  <text x="310" y="146" font-size="20" fill="#0F172A" text-anchor="middle">7</text>
  <text x="420" y="146" font-size="20" fill="#0F172A" text-anchor="middle">8</text>
  <text x="310" y="238" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">429 straight away</text>
  <text x="310" y="305" font-size="20" fill="#7F1D1D" text-anchor="middle">Nothing is queued</text>
  <text x="310" y="340" font-size="20" fill="#7F1D1D" text-anchor="middle">The client retries later</text>

  <text x="820" y="146" font-size="20" fill="#0F172A" text-anchor="middle">6</text>
  <text x="930" y="146" font-size="20" fill="#0F172A" text-anchor="middle">7</text>
  <text x="1040" y="146" font-size="20" fill="#0F172A" text-anchor="middle">8</text>
  <text x="840" y="232" font-size="20" fill="#0F172A" text-anchor="middle">6</text>
  <text x="930" y="232" font-size="20" fill="#0F172A" text-anchor="middle">7</text>
  <text x="1020" y="232" font-size="20" fill="#0F172A" text-anchor="middle">8</text>
  <text x="930" y="334" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">served 2 seconds late</text>

  <text x="620" y="440" font-size="20" fill="#475569" text-anchor="middle">Both enforce the same limit, one by refusing the request and one by delaying it</text>
</svg>