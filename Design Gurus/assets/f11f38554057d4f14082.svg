<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1234" viewBox="0 0 1240 1234" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five common resource-modeling mistakes, each shown with the consequence it produces for the caller and the repair that removes it.">
  <defs>
    <filter id="xl02mistake-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="xl02mistake-k1"><rect x="76" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="xl02mistake-k2"><rect x="76" y="342" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="xl02mistake-k3"><rect x="76" y="538" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="xl02mistake-k4"><rect x="76" y="734" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="xl02mistake-k5"><rect x="76" y="930" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1234" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Five modeling mistakes, and the repair for each</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M700,66 L711,77 M711,66 L700,77"/>
  </g>
  <text x="723" y="77" font-size="15.5" fill="#6B7280">the cost to the caller</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M930,71 L934.5,75.5 L942,65.5"/>
  </g>
  <text x="956" y="77" font-size="15.5" fill="#6B7280">the repair that removes it</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#xl02mistake-soft)">
    <rect x="76" y="146" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#DB2777" clip-path="url(#xl02mistake-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">One resource per database table</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,251 L89,262 M89,251 L78,262"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">The caller rebuilds one concept from several calls, and learns storage.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,282 L82.5,286.5 L90,276.5"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Model the thing the caller uses. The server may combine or split storage.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#xl02mistake-soft)">
    <rect x="76" y="342" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#DB2777" clip-path="url(#xl02mistake-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">Every noun becomes a resource</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,447 L89,458 M89,447 L78,458"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">The API gains ids, URLs, permissions, and lists that no caller job needs.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,478 L82.5,482.5 L90,472.5"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Apply the independent-id test. Keep descriptive values as fields.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#xl02mistake-soft)">
    <rect x="76" y="538" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#DB2777" clip-path="url(#xl02mistake-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">Every behavior becomes a new verb</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,643 L89,654 M89,643 L78,654"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">Nothing is guessable, and retry rules are invented one at a time.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,674 L82.5,678.5 L90,668.5"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">Try a state change, then a result resource, before a verb endpoint.</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#xl02mistake-soft)">
    <rect x="76" y="734" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#DB2777" clip-path="url(#xl02mistake-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">A real lifecycle hidden inside a field</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,839 L89,850 M89,839 L78,850"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">A refund or an upload cannot be tracked, cancelled, or failed on its own.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,870 L82.5,874.5 L90,864.5"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Give the concept its own resource and identifier.</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#xl02mistake-soft)">
    <rect x="76" y="930" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#DB2777" clip-path="url(#xl02mistake-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">Modeling future possibilities</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1035 L89,1046 M89,1035 L78,1046"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">Interview minutes are spent on resources that no stated requirement uses.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1066 L82.5,1070.5 L90,1060.5"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">Name the first-version scope. Add a resource when a caller job earns it.</text>

  
  <rect x="40" y="1118" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1163" text-anchor="middle" font-size="16" fill="#475569">Four of the five come from one habit: publishing what the server stores, not what the caller does.</text>
</svg>