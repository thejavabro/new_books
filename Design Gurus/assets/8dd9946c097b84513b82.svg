<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="662" viewBox="0 0 1240 662" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four reading-list jobs on the left, merged in the center into one SavedArticle resource and its collection, and expanded on the right into five one-line operations grouped around slash saved-articles. Several caller verbs become one resource vocabulary plus a fixed set of HTTP methods.">
  <defs>
    <marker id="xl01jobstor-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="xl01jobstor-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="xl01jobstor-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl01jobstor-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl01jobstor-k1"><rect x="68" y="222" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="xl01jobstor-k2"><rect x="68" y="286" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="xl01jobstor-k3"><rect x="68" y="350" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="xl01jobstor-k4"><rect x="68" y="414" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="xl01jobstor-kc"><rect x="445" y="297" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="xl01jobstor-k5"><rect x="760" y="190" width="416" height="48" rx="10"/></clipPath>
    <clipPath id="xl01jobstor-k6"><rect x="760" y="254" width="416" height="48" rx="10"/></clipPath>
    <clipPath id="xl01jobstor-k7"><rect x="760" y="318" width="416" height="48" rx="10"/></clipPath>
    <clipPath id="xl01jobstor-k8"><rect x="760" y="382" width="416" height="48" rx="10"/></clipPath>
    <clipPath id="xl01jobstor-k9"><rect x="760" y="446" width="416" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="662" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Turning jobs into a REST surface</text>

  
  <rect x="40" y="126" width="332" height="396" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Caller jobs</text>

  <rect x="736" y="126" width="464" height="396" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="760" y="156" font-size="16.5" font-weight="600" fill="#047857">One-line operations</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M372,342 H444" stroke="#2563EB" marker-end="url(#xl01jobstor-bm)"/>
    <path d="M695,342 H735" stroke="#059669" marker-end="url(#xl01jobstor-em)"/>
  </g>

  
  <g filter="url(#xl01jobstor-soft)">
    <rect x="68" y="222" width="280" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="222" width="6" height="48" fill="#2563EB" clip-path="url(#xl01jobstor-k1)"/>
  </g>
  <circle cx="102" cy="246" r="4.5" fill="#2563EB"/>
  <text x="126" y="253" font-size="18.5" font-weight="600" fill="#111827">Save an article</text>

  <g filter="url(#xl01jobstor-soft)">
    <rect x="68" y="286" width="280" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="286" width="6" height="48" fill="#2563EB" clip-path="url(#xl01jobstor-k2)"/>
  </g>
  <circle cx="102" cy="310" r="4.5" fill="#2563EB"/>
  <text x="126" y="317" font-size="18.5" font-weight="600" fill="#111827">List saved articles</text>

  <g filter="url(#xl01jobstor-soft)">
    <rect x="68" y="350" width="280" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="350" width="6" height="48" fill="#2563EB" clip-path="url(#xl01jobstor-k3)"/>
  </g>
  <circle cx="102" cy="374" r="4.5" fill="#2563EB"/>
  <text x="126" y="381" font-size="18.5" font-weight="600" fill="#111827">Mark one finished</text>

  <g filter="url(#xl01jobstor-soft)">
    <rect x="68" y="414" width="280" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="68" y="414" width="6" height="48" fill="#2563EB" clip-path="url(#xl01jobstor-k4)"/>
  </g>
  <circle cx="102" cy="438" r="4.5" fill="#2563EB"/>
  <text x="126" y="445" font-size="18.5" font-weight="600" fill="#111827">Remove one</text>

  
  <g filter="url(#xl01jobstor-lift)">
    <rect x="445" y="297" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="445" y="297" width="9" height="90" fill="#2563EB" clip-path="url(#xl01jobstor-kc)"/>
  </g>
  <circle cx="483" cy="342" r="18" fill="#FFFFFF"/>
  <g transform="translate(472.56,331.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="509" y="349" font-size="18.5" font-weight="600" fill="#111827">SavedArticle</text>
  <text x="570" y="412" font-size="15.5" text-anchor="middle" fill="#6B7280">one resource</text>
  <text x="570" y="435" font-size="15.5" text-anchor="middle" fill="#94A3B8">and its collection</text>

  
  <g filter="url(#xl01jobstor-soft)">
    <rect x="760" y="190" width="416" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="760" y="190" width="6" height="48" fill="#059669" clip-path="url(#xl01jobstor-k5)"/>
  </g>
  <circle cx="794" cy="214" r="4.5" fill="#059669"/>
  <text x="818" y="221" font-size="18.5" font-weight="600" fill="#111827">POST /saved-articles</text>

  <g filter="url(#xl01jobstor-soft)">
    <rect x="760" y="254" width="416" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="760" y="254" width="6" height="48" fill="#059669" clip-path="url(#xl01jobstor-k6)"/>
  </g>
  <circle cx="794" cy="278" r="4.5" fill="#059669"/>
  <text x="818" y="285" font-size="18.5" font-weight="600" fill="#111827">GET /saved-articles/{saved_article_id}</text>

  <g filter="url(#xl01jobstor-soft)">
    <rect x="760" y="318" width="416" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="760" y="318" width="6" height="48" fill="#059669" clip-path="url(#xl01jobstor-k7)"/>
  </g>
  <circle cx="794" cy="342" r="4.5" fill="#059669"/>
  <text x="818" y="349" font-size="18.5" font-weight="600" fill="#111827">GET /saved-articles</text>

  <g filter="url(#xl01jobstor-soft)">
    <rect x="760" y="382" width="416" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="760" y="382" width="6" height="48" fill="#059669" clip-path="url(#xl01jobstor-k8)"/>
  </g>
  <circle cx="794" cy="406" r="4.5" fill="#059669"/>
  <text x="818" y="413" font-size="18.5" font-weight="600" fill="#111827">PATCH /saved-articles/{saved_article_id}</text>

  <g filter="url(#xl01jobstor-soft)">
    <rect x="760" y="446" width="416" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="760" y="446" width="6" height="48" fill="#059669" clip-path="url(#xl01jobstor-k9)"/>
  </g>
  <circle cx="794" cy="470" r="4.5" fill="#059669"/>
  <text x="818" y="477" font-size="18.5" font-weight="600" fill="#111827">DELETE /saved-articles/{saved_article_id}</text>

  
  <rect x="40" y="546" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="591" text-anchor="middle" font-size="16" fill="#475569">Several caller verbs, one resource vocabulary and a fixed set of methods.</text>
</svg>