<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="662" viewBox="0 0 1240 662" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Alice keeps reading version one of a price at one hundred dollars while Bob writes and commits version two at one hundred and twenty, because Alice&#39;s snapshot was fixed when her transaction began">
  <rect x="0" y="0" width="1240" height="662" fill="#FFFFFF"/>
  <defs>
    <marker id="db7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two transactions on one price, and neither one waits</text>

  <line x1="740" y1="215" x2="740" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>

  <text x="120" y="187" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Bob</text>
  <text x="120" y="287" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Alice</text>

  
  <rect x="350" y="150" width="140" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="420" y="187" font-size="20" fill="#92400E" text-anchor="middle">starts</text>

  <rect x="510" y="150" width="140" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="580" y="176" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">writes $120</text>
  <text x="580" y="200" font-size="20" fill="#92400E" text-anchor="middle">as version 2</text>

  <rect x="670" y="150" width="140" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="740" y="187" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">COMMIT</text>

  
  <rect x="190" y="250" width="140" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="260" y="276" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">starts</text>
  <text x="260" y="300" font-size="20" fill="#1E40AF" text-anchor="middle">reads $100</text>

  <rect x="510" y="250" width="140" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="580" y="276" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">reads again</text>
  <text x="580" y="300" font-size="20" fill="#1E40AF" text-anchor="middle">$100</text>

  <rect x="830" y="250" width="140" height="60" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="900" y="276" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">reads again</text>
  <text x="900" y="300" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">still $100</text>

  <line x1="190" y1="340" x2="1170" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#db7-slate)"/>
  <text x="754" y="372" font-size="20" font-weight="600" fill="#334155">Bob commits</text>

  
  <rect x="190" y="400" width="550" height="40" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="465" y="427" font-size="20" fill="#5B21B6" text-anchor="middle">version 1: $100, visible until the commit</text>

  <rect x="740" y="460" width="420" height="40" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="950" y="487" font-size="20" fill="#5B21B6" text-anchor="middle">version 2: $120, visible after</text>

  
  <rect x="40" y="540" width="1160" height="92" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="620" y="576" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Bob's write never blocked Alice's read, and Alice never saw a half finished price.</text>
  <text x="620" y="606" font-size="20" fill="#5B21B6" text-anchor="middle">Her snapshot was fixed when her transaction began, so the old version stays alive until nobody needs it.</text>
</svg>