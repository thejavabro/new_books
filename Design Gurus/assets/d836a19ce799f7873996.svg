<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="546" viewBox="0 0 1240 546" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before the scan">
<defs>
<filter id="dk-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="546" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many subarrays of [3, 1, 2, -2, 5, -1] have a sum divisible by 3?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Two running sums with the same remainder mean the part between them divides exactly by 3</text>
<rect x="40" y="106" width="1160" height="296" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">remainders seen starts with 0 already recorded once</text>
<text x="280" y="210" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">array</text>
<rect x="302" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="350" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="350" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="410" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="458" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="458" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="518" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="566" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="566" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="626" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="674" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-2</text>
<text x="674" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="734" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="782" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="782" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="842" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="890" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-1</text>
<text x="890" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<text x="540" y="326" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">remainders seen</text>
<rect x="562" y="288" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="325.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="620" y="370" text-anchor="middle" font-size="15.5" fill="#94A3B8">seen 1x</text>
<rect x="40" y="416" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="456" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Record remainders after dividing by 3, not the running sums themselves</text>
<text x="620" y="488" text-anchor="middle" font-size="18.5" fill="#475569">Remainder 0 starts recorded once, for a subarray that begins at position 0</text>
</svg>