<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two answers to where the truth lives: event driven keeps the truth in each service table and treats events as discardable notifications, while event sourcing keeps the truth in a permanent append only event log and derives current state by replay.">
  <defs>
    <marker id="m05-l07-driven-vs-sourced-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l07-driven-vs-sourced-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l07-driven-vs-sourced-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m05-l07-driven-vs-sourced-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1030" fill="#FFFFFF"/>

  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <rect x="420" y="40" width="400" height="110" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="620" y="86" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Where does the truth live?</text>
  <text x="620" y="118" text-anchor="middle" font-size="20" fill="#64748B">the line that gets blurred most</text>

  <rect x="50" y="200" width="560" height="520" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="240" font-size="20" font-weight="600" fill="#92400E">Event driven</text>
  <text x="590" y="240" text-anchor="end" font-size="20" fill="#64748B">how services talk</text>
  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <rect x="70" y="280" width="520" height="110" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="330" y="326" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Truth is each service table</text>
  <text x="330" y="358" text-anchor="middle" font-size="20" fill="#64748B">each service keeps state in its own database</text>
  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <rect x="70" y="430" width="520" height="130" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="330" y="470" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Events are notifications,</text>
  <text x="330" y="502" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">safe to discard</text>
  <text x="330" y="534" text-anchor="middle" font-size="20" fill="#64748B">handled once, then thrown away</text>
  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <path d="M70,610 L70,690 A125,20 0 0 0 320,690 L320,610" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="195" cy="610" rx="125" ry="20" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="195" y="642" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service table</text>
  <text x="195" y="672" text-anchor="middle" font-size="20" fill="#64748B">source of truth</text>
  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <rect x="360" y="600" width="230" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="475" y="641" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order placed</text>
  <text x="475" y="673" text-anchor="middle" font-size="20" fill="#64748B">discard after use</text>

  <rect x="630" y="200" width="550" height="520" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="650" y="240" font-size="20" font-weight="600" fill="#5B21B6">Event sourced</text>
  <text x="1160" y="240" text-anchor="end" font-size="20" fill="#64748B">where the truth is stored</text>
  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <rect x="650" y="280" width="520" height="110" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="910" y="326" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Truth is the event log</text>
  <text x="910" y="358" text-anchor="middle" font-size="20" fill="#64748B">the events are the database, state is a cache</text>
  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <rect x="650" y="430" width="520" height="130" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="910" y="470" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Events are permanent,</text>
  <text x="910" y="502" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">state is derived by replay</text>
  <text x="910" y="534" text-anchor="middle" font-size="20" fill="#64748B">the log itself is the audit trail</text>
  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <path d="M650,610 L650,690 A125,20 0 0 0 900,690 L900,610" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="775" cy="610" rx="125" ry="20" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="775" y="642" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Event log</text>
  <text x="775" y="672" text-anchor="middle" font-size="20" fill="#64748B">append only</text>
  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <rect x="940" y="600" width="230" height="100" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1055" y="641" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Current state</text>
  <text x="1055" y="673" text-anchor="middle" font-size="20" fill="#64748B">derived, a cache</text>

  <g fill="none" stroke-width="2.5">
    <path d="M540,150 C460,190 330,200 330,272" stroke="#475569" marker-end="url(#m05-l07-driven-vs-sourced-sl)"/>
    <path d="M700,150 C780,190 910,200 910,272" stroke="#475569" marker-end="url(#m05-l07-driven-vs-sourced-sl)"/>
    <path d="M330,390 L330,422" stroke="#475569" stroke-width="2" marker-end="url(#m05-l07-driven-vs-sourced-sl)"/>
    <path d="M910,390 L910,422" stroke="#475569" stroke-width="2" marker-end="url(#m05-l07-driven-vs-sourced-sl)"/>
    <path d="M330,560 L330,582" stroke="#475569" stroke-width="2" marker-end="url(#m05-l07-driven-vs-sourced-sl)"/>
    <path d="M910,560 L910,582" stroke="#475569" stroke-width="2" marker-end="url(#m05-l07-driven-vs-sourced-sl)"/>
    <path d="M320,650 L352,650" stroke="#D97706" marker-end="url(#m05-l07-driven-vs-sourced-ab)"/>
    <path d="M900,650 L932,650" stroke="#7C3AED" marker-end="url(#m05-l07-driven-vs-sourced-vi)"/>
  </g>

  <text x="336" y="578" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>
  <text x="916" y="578" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replay</text>

  <g filter="url(#m05-l07-driven-vs-sourced-soft)">
    <rect x="60" y="760" width="1120" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="806" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The common mistake: "we publish events, so we are event-sourced"</text>
  <text x="620" y="838" text-anchor="middle" font-size="20" fill="#64748B">if state lives in tables and the events are discarded, you are not event-sourced</text>

  <line x1="60" y1="910" x2="96" y2="910" stroke="#475569" stroke-width="4"/>
  <text x="108" y="917" font-size="20" fill="#475569">Current state kept in a table</text>
  <line x1="60" y1="950" x2="96" y2="950" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="957" font-size="20" fill="#475569">Events as notifications, and transient</text>
  <line x1="60" y1="990" x2="96" y2="990" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="997" font-size="20" fill="#475569">The event log as the permanent record</text>
</svg>