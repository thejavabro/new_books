<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1236" viewBox="0 0 1240 1236" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated LinkedIn connections architecture: saga based accept across shards, cached adjacency reads, batch status checks and anti entropy repair">
  <defs>
    <filter id="li-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="li-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="li-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="li-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="li-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="li-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1236" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">LinkedIn connections: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Tiny write volume, enormous read volume, and a bidirectional edge that lives on two shards</text>

  <rect x="24" y="96" width="1192" height="360" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Accept · the two halves of the edge live on different shards</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#li-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">PUT</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#li-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">commit</text>
  <path d="M620,232 L620,300" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#li-amber)"/>
  <text x="638" y="274" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">then publish</text>
  <path d="M784,342 L876,342" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#li-amber)"/>
  <text x="830" y="330" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">apply</text>
  <g filter="url(#li-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,171 L880,217 A160,15 0 0 0 1200,217 L1200,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="171" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M460,319 L460,365 A160,15 0 0 0 780,365 L780,319" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="620" cy="319" rx="160" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <path d="M880,319 L880,365 A160,15 0 0 0 1200,365 L1200,319" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="319" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User B</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">clicks accept</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Connection Service</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">local commit only</text>
  <text x="1040" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shard B</text>
  <text x="1040" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">B to A, ACCEPTED</text>
  <text x="620" y="353" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="620" y="410" font-size="20" fill="#92400E" text-anchor="middle">saga, not 2PC</text>
  <text x="1040" y="353" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shard A</text>
  <text x="1040" y="410" font-size="20" fill="#5B21B6" text-anchor="middle">A to B, by a worker</text>

  <rect x="24" y="486" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="518" font-size="20" font-weight="600" fill="#1E40AF">2. My network (read path) · 3.5 million reads a second</text>
  <path d="M264,584 L349,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#li-blue)"/>
  <text x="307" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <path d="M577,584 L662,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#li-blue)"/>
  <text x="620" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">ZRANGE</text>
  <path d="M890,584 L975,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#li-blue)"/>
  <text x="933" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>
  <g filter="url(#li-soft)">
    <rect x="40" y="546" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="546" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M666,561 L666,607 A110,15 0 0 0 886,607 L886,561" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="561" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M979,561 L979,607 A110,15 0 0 0 1199,607 L1199,561" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="561" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Member</text>
  <text x="150" y="606" font-size="20" fill="#64748B" text-anchor="middle">opens network</text>
  <text x="463" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Connection Service</text>
  <text x="463" y="606" font-size="20" fill="#64748B" text-anchor="middle">cache aside</text>
  <text x="776" y="595" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis ZSET</text>
  <text x="776" y="652" font-size="20" fill="#065F46" text-anchor="middle">scored by time</text>
  <text x="1089" y="595" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Sharded SQL</text>
  <text x="1089" y="652" font-size="20" fill="#5B21B6" text-anchor="middle">single shard query</text>

  <rect x="24" y="728" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="760" font-size="20" font-weight="600" fill="#475569">3. Status check · every feed item and search result asks "do I know them?"</text>
  <path d="M364,826 L456,826" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#li-blue)"/>
  <text x="410" y="814" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">ids</text>
  <path d="M784,826 L876,826" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#li-blue)"/>
  <text x="830" y="814" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pipeline</text>
  <g filter="url(#li-soft)">
    <rect x="40" y="788" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="788" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M880,803 L880,849 A160,15 0 0 0 1200,849 L1200,803" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1040" cy="803" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="200" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Search page</text>
  <text x="200" y="848" font-size="20" fill="#64748B" text-anchor="middle">20 people</text>
  <text x="620" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Batch API</text>
  <text x="620" y="848" font-size="20" fill="#64748B" text-anchor="middle">one round trip</text>
  <text x="1040" y="837" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis pipeline</text>
  <text x="1040" y="894" font-size="20" fill="#065F46" text-anchor="middle">ZSCORE per pair, O(1)</text>

  <rect x="24" y="970" width="1192" height="166" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="1002" font-size="20" font-weight="600" fill="#92400E">4. Keeping it honest · double writes drift, so a job repairs them</text>
  <path d="M364,1068 L456,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#li-amber)"/>
  <text x="410" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">retry</text>
  <path d="M784,1068 L876,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#li-amber)"/>
  <text x="830" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">next step</text>
  <g filter="url(#li-soft)">
    <rect x="40" y="1030" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="460" y="1030" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="880" y="1030" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DLQ</text>
  <text x="200" y="1090" font-size="20" fill="#64748B" text-anchor="middle">poison messages</text>
  <text x="620" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Nightly repair</text>
  <text x="620" y="1090" font-size="20" fill="#64748B" text-anchor="middle">A to B implies B to A</text>
  <text x="1040" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Graph service</text>
  <text x="1040" y="1090" font-size="20" fill="#64748B" text-anchor="middle">for 2nd degree</text>
  <line x1="44" y1="1196" x2="72" y2="1196" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1203" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1196" x2="344.576" y2="1196" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1203" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1187" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1203" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1187" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1203" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1187" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1203" font-size="20" fill="#475569">core service</text>
</svg>