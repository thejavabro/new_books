<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1454" viewBox="0 0 1240 1454" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Where this chapter changes each of the six interview steps. Protocol choices are usually made in step three, after the operation list exists. Their failure behavior belongs in step five, and their price in step six.">
  <defs>
    <filter id="p1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1-k1"><rect x="76" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1-k2"><rect x="76" y="342" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1-k3"><rect x="76" y="538" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1-k4"><rect x="76" y="734" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1-k5"><rect x="76" y="930" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1-k6"><rect x="76" y="1126" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1454" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The six steps do not change. What fills them does.</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <path d="M700,62 a5,5 0 0 1 9.2,2.9 c0,3.3 -4.6,4 -4.6,6.9"/>
  </g>
  <circle cx="704.6" cy="75.6" r="1.4" fill="#64748B"/>
  <text x="723" y="77" font-size="15.5" fill="#6B7280">the question it asks</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round">
    <path d="M930,71 h12 M936,65 v12"/>
  </g>
  <text x="956" y="77" font-size="15.5" fill="#6B7280">what this chapter adds</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <g filter="url(#p1-soft)">
    <rect x="76" y="146" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p1-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">1. Consumers and jobs</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <path d="M78.5,248 a5,5 0 0 1 9.2,2.9 c0,3.3 -4.6,4 -4.6,6.9"/>
  </g>
  <circle cx="83.1" cy="261.6" r="1.4" fill="#64748B"/>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">Who calls, from where, and on what network?</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,282 h12 M84,276 v12"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">A browser, mobile app, partner, and internal service may each earn a different mechanism</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <g filter="url(#p1-soft)">
    <rect x="76" y="342" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#2563EB" clip-path="url(#p1-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">2. Resources</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <path d="M78.5,444 a5,5 0 0 1 9.2,2.9 c0,3.3 -4.6,4 -4.6,6.9"/>
  </g>
  <circle cx="83.1" cy="457.6" r="1.4" fill="#64748B"/>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">Which things have identity and lifecycle?</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,478 h12 M84,472 v12"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Jobs, webhook registrations, upload sessions, and devices become resources</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <g filter="url(#p1-lift)">
    <rect x="76" y="538" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="538" width="9" height="90" fill="#2563EB" clip-path="url(#p1-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">3. Operations</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <path d="M78.5,640 a5,5 0 0 1 9.2,2.9 c0,3.3 -4.6,4 -4.6,6.9"/>
  </g>
  <circle cx="83.1" cy="653.6" r="1.4" fill="#64748B"/>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">What must each caller do?</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,674 h12 M84,668 v12"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">Choose REST, gRPC, or GraphQL only after the caller and the operation are known</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <g filter="url(#p1-soft)">
    <rect x="76" y="734" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#2563EB" clip-path="url(#p1-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">4. One operation in full</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <path d="M78.5,836 a5,5 0 0 1 9.2,2.9 c0,3.3 -4.6,4 -4.6,6.9"/>
  </g>
  <circle cx="83.1" cy="849.6" r="1.4" fill="#64748B"/>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">What exactly crosses the boundary?</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,870 h12 M84,864 v12"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">A schema, stream events, a status resource, signatures, limits, terminal behavior</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <g filter="url(#p1-soft)">
    <rect x="76" y="930" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#2563EB" clip-path="url(#p1-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">5. Hard parts</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <path d="M78.5,1032 a5,5 0 0 1 9.2,2.9 c0,3.3 -4.6,4 -4.6,6.9"/>
  </g>
  <circle cx="83.1" cy="1045.6" r="1.4" fill="#64748B"/>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">What happens on failure or delay?</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1066 h12 M84,1060 v12"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">Reconnection, at-least-once delivery, deadlines, query budgets, resumable transfer</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <g filter="url(#p1-soft)">
    <rect x="76" y="1126" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#2563EB" clip-path="url(#p1-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">6. Trade-offs</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <path d="M78.5,1228 a5,5 0 0 1 9.2,2.9 c0,3.3 -4.6,4 -4.6,6.9"/>
  </g>
  <circle cx="83.1" cy="1241.6" r="1.4" fill="#64748B"/>
  <text x="104" y="1242" font-size="15.5" fill="#6B7280">Why this, and what does it cost?</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1262 h12 M84,1256 v12"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">Name the trigger that removed the default, and the cost accepted</text>

  
  <rect x="40" y="1314" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1356" text-anchor="middle" font-size="16" fill="#475569">A protocol is usually chosen in step 3, once the operation list exists. Its failure behavior belongs in step 5, and its price in step 6.</text>
  <text x="620" y="1384" text-anchor="middle" font-size="16" fill="#475569">Choosing GraphQL in the first minute picks a mechanism before the callers are known.</text>
</svg>