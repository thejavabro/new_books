<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="722" viewBox="0 0 1240 722" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three rows compare fan-out. Push copies each post to every inbox when it is written, so opening the app reads one inbox. Pull stores the post once and reads every followed account when the app opens. The hybrid pushes ordinary accounts and pulls very large accounts, then merges the two lists.">
  <defs>
    <marker id="fdrk3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="fdrk3-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="fdrk3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="fdrk3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="fdrk3-k1"><rect x="205" y="116" width="390" height="90" rx="12"/></clipPath>
    <clipPath id="fdrk3-k2"><rect x="775" y="116" width="390" height="90" rx="12"/></clipPath>
    <clipPath id="fdrk3-k3"><rect x="205" y="266" width="390" height="90" rx="12"/></clipPath>
    <clipPath id="fdrk3-k4"><rect x="775" y="266" width="390" height="90" rx="12"/></clipPath>
    <clipPath id="fdrk3-k5"><rect x="205" y="416" width="390" height="90" rx="12"/></clipPath>
    <clipPath id="fdrk3-k6"><rect x="775" y="416" width="390" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="722" fill="#FFFFFF"/>
  <rect x="170" y="56" width="480" height="510" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="194" y="86" font-size="16.5" font-weight="600" fill="#B45309">When a post is written</text>
  <rect x="720" y="56" width="480" height="510" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="744" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">When the app opens</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M595,161 H775" marker-end="url(#fdrk3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M595,311 H775" marker-end="url(#fdrk3-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M595,461 H775" marker-end="url(#fdrk3-memerald)"/></g>
  <text x="40" y="168" font-size="18.5" font-weight="700" fill="#111827">Push</text>
  <g filter="url(#fdrk3-soft)">
    <rect x="205" y="116" width="390" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="205" y="116" width="6" height="90" fill="#D97706" clip-path="url(#fdrk3-k1)"/>
  </g>
  <circle cx="243" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(232.56,150.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="269" y="168" font-size="18.5" font-weight="600" fill="#111827">Copy to every inbox</text>
  <text x="400" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">one write per follower</text>
  <g filter="url(#fdrk3-soft)">
    <rect x="775" y="116" width="390" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="775" y="116" width="6" height="90" fill="#2563EB" clip-path="url(#fdrk3-k2)"/>
  </g>
  <circle cx="813" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(802.56,150.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="839" y="168" font-size="18.5" font-weight="600" fill="#111827">Read one inbox</text>
  <text x="970" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">opening the app is fast</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="685" y="151" fill="#475569">inbox ready</text></g>
  <text x="40" y="318" font-size="18.5" font-weight="700" fill="#111827">Pull</text>
  <g filter="url(#fdrk3-soft)">
    <rect x="205" y="266" width="390" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="205" y="266" width="6" height="90" fill="#D97706" clip-path="url(#fdrk3-k3)"/>
  </g>
  <circle cx="243" cy="311" r="18" fill="#FFFFFF"/>
  <g transform="translate(232.56,300.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="269" y="318" font-size="18.5" font-weight="600" fill="#111827">Store the post once</text>
  <text x="400" y="381" font-size="15.5" text-anchor="middle" fill="#6B7280">writing a post is cheap</text>
  <g filter="url(#fdrk3-soft)">
    <rect x="775" y="266" width="390" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="775" y="266" width="6" height="90" fill="#2563EB" clip-path="url(#fdrk3-k4)"/>
  </g>
  <circle cx="813" cy="311" r="18" fill="#FFFFFF"/>
  <g transform="translate(802.56,300.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="839" y="318" font-size="18.5" font-weight="600" fill="#111827">Read every followed account</text>
  <text x="970" y="381" font-size="15.5" text-anchor="middle" fill="#6B7280">slow for heavy readers</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="685" y="301" fill="#475569">fetched at open</text></g>
  <text x="40" y="468" font-size="18.5" font-weight="700" fill="#111827">Hybrid</text>
  <g filter="url(#fdrk3-lift)">
    <rect x="205" y="416" width="390" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="205" y="416" width="9" height="90" fill="#D97706" clip-path="url(#fdrk3-k5)"/>
  </g>
  <circle cx="243" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(232.56,450.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="269" y="468" font-size="18.5" font-weight="600" fill="#111827">Push ordinary accounts</text>
  <text x="400" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">into inboxes</text>
  <g filter="url(#fdrk3-lift)">
    <rect x="775" y="416" width="390" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="775" y="416" width="9" height="90" fill="#2563EB" clip-path="url(#fdrk3-k6)"/>
  </g>
  <circle cx="813" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(802.56,450.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="839" y="468" font-size="18.5" font-weight="600" fill="#111827">Pull very large accounts</text>
  <text x="970" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">then merge the two lists</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="685" y="451" fill="#047857">merged at open</text></g>
  <rect x="40" y="606" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="651" text-anchor="middle" font-size="16" fill="#475569">Push breaks for very large accounts, and pull breaks for heavy readers. The hybrid avoids both weaknesses.</text>
</svg>