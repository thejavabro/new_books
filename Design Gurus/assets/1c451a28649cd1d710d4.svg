<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The starting bottles">
<defs>
<filter id="wb-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">15 full bottles, and 4 empties buy 1 more. How many can be drunk?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Drinking turns a full bottle into an empty one, and empties can be traded back</text>
<rect x="40" y="106" width="1160" height="468" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Three numbers are the whole state: full, empty, and the running total drunk</text>
<rect x="178" y="220" width="268" height="110" rx="14" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="312" y="254" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">full bottles</text>
<text x="312" y="304" text-anchor="middle" font-size="34" font-weight="600" fill="#1D4ED8">15</text>
<rect x="486" y="220" width="268" height="110" rx="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5"/>
<text x="620" y="254" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">empty bottles</text>
<text x="620" y="304" text-anchor="middle" font-size="34" font-weight="600" fill="#475569">0</text>
<rect x="794" y="220" width="268" height="110" rx="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5"/>
<text x="928" y="254" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">drunk in total</text>
<text x="928" y="304" text-anchor="middle" font-size="34" font-weight="600" fill="#475569">0</text>
<rect x="270" y="368" width="700" height="54" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="402.02" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">nothing drunk yet</text>
<text x="620" y="512" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">The trap is that a bottle received in a trade also becomes empty once it is drunk</text>
<rect x="40" y="586" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="626" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Simulate the rounds rather than looking for a formula</text>
<text x="620" y="658" text-anchor="middle" font-size="18.5" fill="#475569">Each round drinks everything full, then trades as many empties as it can</text>
</svg>