<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Choreography: service A publishes event 1 to an event bus, service B consumes it and publishes event 2, and service C consumes event 2, with no coordinator; decentralized control, services publish and listen to events, loose coupling, more complex to trace and manage. Orchestration: an orchestrator controls the flow to services A, B and C; centralized control, the orchestrator coordinates the flow, clear execution order, the orchestrator is coupled to every service">
