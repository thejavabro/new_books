  <rect x="0" y="0" width="1240" height="750" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Choreography vs. orchestration: architecture compared</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">In choreography, services react to events; in orchestration, one orchestrator controls the flow.</text>

