<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="940" viewBox="0 0 1300 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The assembled front door: 40,000 requests per second arrive, 24,000 end at the CDN edge, 16,000 reach the twelve gateway instances, then the three BFFs and the partner API product, then the thirty services behind their sidecars">
  <rect x="0" y="0" width="1300" height="940" fill="#FFFFFF"/>
  <defs>
    <marker id="s" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
  </defs>

  
  <rect x="330" y="40" width="920" height="80" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="790" y="76" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">Web, iOS and Android, TV, 200 partner integrations</text>
  <text x="790" y="104" font-size="20" fill="#334155" text-anchor="middle">40,000 requests per second at peak, spread across the world</text>

  <line x1="790" y1="120" x2="790" y2="168" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  
  <rect x="330" y="170" width="920" height="118" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="354" y="206" font-size="22" font-weight="700" fill="#065F46">CDN edge, one in Sydney</text>
  <text x="354" y="238" font-size="20" fill="#334155">Ends here: fingerprinted assets, plus catalog browse at s-maxage=60.</text>
  <text x="354" y="268" font-size="20" fill="#334155">Only accelerates here: TLS terminates over 15 ms, not 200. Authenticated: never cached.</text>

  <text x="40" y="212" font-size="20" font-weight="700" fill="#065F46">24,000 per second</text>
  <text x="40" y="240" font-size="20" fill="#334155">end here and never</text>
  <text x="40" y="268" font-size="20" fill="#334155">cross the ocean</text>

  <line x1="790" y1="288" x2="790" y2="336" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="812" y="320" font-size="20" font-weight="700" fill="#475569">16,000 per second continue</text>

  
  <rect x="330" y="338" width="920" height="118" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="354" y="374" font-size="22" font-weight="700" fill="#5B21B6">API gateway, 12 instances behind the load balancer</text>
  <text x="354" y="406" font-size="20" fill="#334155">AuthN once with revocation. Token buckets per API key, counters in Redis. Size caps.</text>
  <text x="354" y="436" font-size="20" fill="#334155">Request ID created at first sight. Paths routed, topology kept private.</text>

  <text x="40" y="392" font-size="20" font-weight="700" fill="#5B21B6">No domain words</text>
  <text x="40" y="420" font-size="20" fill="#334155">live here: authZ and</text>
  <text x="40" y="448" font-size="20" fill="#334155">shaping sit below</text>

  
  <path d="M790,456 L790,486 L437,486 L437,506" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M790,456 L790,486 L672,486 L672,506" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M790,456 L790,486 L907,486 L907,506" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M790,456 L790,486 L1142,486 L1142,506" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  
  <rect x="330" y="508" width="215" height="112" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="437" y="546" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Web BFF</text>
  <text x="437" y="576" font-size="20" fill="#334155" text-anchor="middle">owned by the</text>
  <text x="437" y="602" font-size="20" fill="#334155" text-anchor="middle">web team</text>

  <rect x="565" y="508" width="215" height="112" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="672" y="546" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Mobile BFF</text>
  <text x="672" y="576" font-size="20" fill="#334155" text-anchor="middle">six calls x 5 ms,</text>
  <text x="672" y="602" font-size="20" fill="#334155" text-anchor="middle">one ocean crossing</text>

  <rect x="800" y="508" width="215" height="112" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="907" y="546" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">TV BFF</text>
  <text x="907" y="576" font-size="20" fill="#334155" text-anchor="middle">a different</text>
  <text x="907" y="602" font-size="20" fill="#334155" text-anchor="middle">experience</text>

  <rect x="1035" y="508" width="215" height="112" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="1142" y="546" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Partner API</text>
  <text x="1142" y="576" font-size="20" fill="#334155" text-anchor="middle">a product, not a BFF:</text>
  <text x="1142" y="602" font-size="20" fill="#334155" text-anchor="middle">cursors, /v2, Sunset</text>

  <text x="40" y="546" font-size="20" font-weight="700" fill="#1E3A8A">Shaping lives here,</text>
  <text x="40" y="574" font-size="20" fill="#334155">one per experience,</text>
  <text x="40" y="602" font-size="20" fill="#334155">zero domain logic</text>

  <path d="M437,620 L437,650 L790,650 L790,678" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M672,620 L672,650" fill="none" stroke="#475569" stroke-width="2.5"/>
  <path d="M907,620 L907,650" fill="none" stroke="#475569" stroke-width="2.5"/>
  <path d="M1142,620 L1142,650 L790,650" fill="none" stroke="#475569" stroke-width="2.5"/>

  
  <rect x="330" y="680" width="920" height="118" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
  <text x="354" y="716" font-size="22" font-weight="700" fill="#0F172A">About 30 services, 3 languages, each with a sidecar</text>
  <text x="354" y="748" font-size="20" fill="#334155">Sidecars carry mutual TLS and uniform timeouts and retries, on templated static config.</text>
  <text x="354" y="778" font-size="20" fill="#334155">The mesh control plane waits for a platform team that has not been hired yet.</text>

  <text x="40" y="734" font-size="20" font-weight="700" fill="#334155">East-west traffic</text>
  <text x="40" y="762" font-size="20" fill="#334155">never detours back</text>
  <text x="40" y="790" font-size="20" fill="#334155">through the gateway</text>

  
  <text x="40" y="864" font-size="20" font-weight="700" fill="#0F172A">Each layer answers one question, and the cheapest request is the one answered highest up: 24,000 per second</text>
  <text x="40" y="894" font-size="20" font-weight="700" fill="#0F172A">never reach a server you own, and of the 16,000 that do, the buggy partner's 3,900 are refused at the entrance</text>
  <text x="40" y="924" font-size="20" font-weight="700" fill="#0F172A">in 0.1 ms each.</text>
</svg>