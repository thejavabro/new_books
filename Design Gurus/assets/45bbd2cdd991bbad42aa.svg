<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Choose how an outcome survives interruption</title><desc id="desc">Temporary messages can have a short UI lifetime, while purchase outcomes must be stored so the UI can recover them after interruption.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="800" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Choose how an outcome survives interruption</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">The required lifetime determines the delivery mechanism.</tspan></text><rect x="300" y="155" width="600" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="322" y="197" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="322" dy="0">An operation produces a result</tspan></text><text x="322" y="245" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="322" dy="0">What must the user recover later?</tspan></text><path d="M600 312 V340 H305 V370" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 340 H895 V370" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="375" width="510" height="220" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="417" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Temporary information</tspan></text><text x="72" y="465" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">A small UI message</tspan><tspan x="72" dy="32">May be view-lifetime only</tspan></text><rect x="640" y="375" width="510" height="220" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="662" y="417" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="662" dy="0">Important outcome</tspan></text><text x="662" y="465" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="662" dy="0">Confirmed purchase data</tspan><tspan x="662" dy="32">Persist and reconstruct the UI</tspan></text><rect x="50" y="650" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="696" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">A one-time event alone is not durable purchase confirmation.</tspan></text></g></svg>