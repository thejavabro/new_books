<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="618" viewBox="0 0 1240 618" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="fixes-title fixes-desc">
<title id="fixes-title">Four ways to stop the same lost update</title>
<desc id="fixes-desc">The same read-modify-write race fixed four ways: letting the database do the arithmetic in one statement, locking the row until commit, writing only if a version column still matches, or enforcing the rule with a unique constraint. Each costs something different.</desc>
<defs>
<marker id="fixes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="fixes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="fixes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="fixes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="618" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four ways to stop the same lost update</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The race is in the application, not in the SQL.</text>
<rect x="40" y="540" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="540" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="149" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The race: read seats = 10, calculate 9, write 9</text><text x="64" y="175" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">run twice at the same time, one booking disappears</text>
<rect x="40" y="214" width="275" height="300" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 214H46A6 6 0 0 0 40 220V508A6 6 0 0 0 46 514H54Z" fill="#39D5AA"/>
<circle cx="177.5" cy="248" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="177.5" y="256" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="177.5" y="292" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Single statement</text>
<rect x="56" y="308" width="243" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="76" y="331" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">SET seats = seats - 1</text><text x="76" y="356" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the database does</text><text x="76" y="381" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the arithmetic</text>
<rect x="56" y="404" width="243" height="42" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="177.5" y="432" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Costs nothing</text>
<text x="177.5" y="474" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">only when the new value</text><text x="177.5" y="498" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">is a function of the old</text>
<rect x="335" y="214" width="275" height="300" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M349 214H341A6 6 0 0 0 335 220V508A6 6 0 0 0 341 514H349Z" fill="#5EC9EC"/>
<circle cx="472.5" cy="248" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="472.5" y="256" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="472.5" y="292" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">SELECT FOR UPDATE</text>
<rect x="351" y="308" width="243" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="371" y="343.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">lock the row on read,</text><text x="371" y="368.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">hold it until commit</text>
<rect x="351" y="404" width="243" height="42" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="472.5" y="432" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Costs contention</text>
<text x="472.5" y="474" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">other writers to</text><text x="472.5" y="498" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">that row wait</text>
<rect x="630" y="214" width="275" height="300" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M644 214H636A6 6 0 0 0 630 220V508A6 6 0 0 0 636 514H644Z" fill="#AC8BE8"/>
<circle cx="767.5" cy="248" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="767.5" y="256" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="767.5" y="292" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Optimistic locking</text>
<rect x="646" y="308" width="243" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="666" y="331" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">WHERE id = ?</text><text x="666" y="356" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">AND version = ?</text><text x="666" y="381" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">retry on 0 rows</text>
<rect x="646" y="404" width="243" height="42" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="767.5" y="432" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Costs retries</text>
<text x="767.5" y="474" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">wasted work when</text><text x="767.5" y="498" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">contention is high</text>
<rect x="925" y="214" width="275" height="300" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M939 214H931A6 6 0 0 0 925 220V508A6 6 0 0 0 931 514H939Z" fill="#F3CF6A"/>
<circle cx="1062.5" cy="248" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1062.5" y="256" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1062.5" y="292" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Unique constraint</text>
<rect x="941" y="308" width="243" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="961" y="331" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">one booking per seat,</text><text x="961" y="356" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the insert simply</text><text x="961" y="381" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">fails</text>
<rect x="941" y="404" width="243" height="42" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1062.5" y="432" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Costs a schema change</text>
<text x="1062.5" y="474" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">holds at any</text><text x="1062.5" y="498" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">isolation level</text>
<text x="66" y="573" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Check the two ends of this row first. Neither one asks the application to hold anything between a read and a write.</text>
</svg>