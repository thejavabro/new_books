<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pagetest-title pagetest-desc">
<title id="pagetest-title">What is allowed to wake somebody</title>
<desc id="pagetest-desc">Urgent, actionable and user-visible, all three together. Alerting on symptoms rather than causes catches failures nobody predicted and stays quiet when nothing is wrong.</desc>
<defs>
<marker id="pagetest-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pagetest-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pagetest-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pagetest-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="796" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What is allowed to wake somebody</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A page is a claim on a person's attention, at any hour, with an implicit promise that it was worth it.</text>
<rect x="40" y="718" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="718" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="164" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V276A6 6 0 0 0 46 282H54Z" fill="#5EC9EC"/>
<circle cx="226" cy="158" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="226" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="226" y="210" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Urgent</text>
<text x="226" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">it requires action now rather than</text><text x="226" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">tomorrow</text>
<rect x="434" y="118" width="372" height="164" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V276A6 6 0 0 0 440 282H448Z" fill="#39D5AA"/>
<circle cx="620" cy="158" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="620" y="210" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Actionable</text>
<text x="620" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">there is something a human can do</text>
<rect x="828" y="118" width="372" height="164" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V276A6 6 0 0 0 834 282H842Z" fill="#F28B9D"/>
<circle cx="1014" cy="158" r="21" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1014" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1014" y="210" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">User-visible</text>
<text x="1014" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">somebody using the product is</text><text x="1014" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">affected, or is about to be</text>
<text x="620" y="316" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">all three, together. Failing any one disqualifies it, and most alerts fail the third</text>
<text x="40" y="356" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Sort every alert you have today into three piles</text>
<rect x="40" y="374" width="372" height="56" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="56" y="409" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Page</text><text x="396" y="409" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">the short list</text>
<rect x="434" y="374" width="372" height="56" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="450" y="409" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Ticket</text><text x="790" y="409" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">real, but not now</text>
<rect x="828" y="374" width="372" height="56" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="844" y="409" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Delete</text><text x="1184" y="409" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">usually the largest pile</text>
<rect x="40" y="454" width="560" height="158" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 454H46A6 6 0 0 0 40 460V606A6 6 0 0 0 46 612H54Z" fill="#39D5AA"/><text x="70" y="490" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Alert on symptoms</text>
<rect x="72" y="506" width="496" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="531.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">errors rising, latency past the</text><text x="92" y="556.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">threshold, the queue not draining</text>
<text x="320" y="594" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">catches failures you did not predict</text>
<rect x="640" y="454" width="560" height="158" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 454H646A6 6 0 0 0 640 460V606A6 6 0 0 0 646 612H654Z" fill="#F28B9D"/><text x="670" y="490" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Not on causes</text>
<rect x="672" y="506" width="496" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="531.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">high CPU, a full disk,</text><text x="692" y="556.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a pod restarting</text>
<text x="920" y="594" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">fires while every request succeeds</text>
<rect x="40" y="636" width="1160" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="670" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">The exception: a cause that predicts an unavoidable symptom with lead time, which is a ticket</text>
<text x="66" y="752" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A system can run hot, restart pods and fill disks while serving every request correctly.</text>
</svg>