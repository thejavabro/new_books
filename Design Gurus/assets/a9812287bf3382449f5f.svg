<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" role="img" aria-label="The Netflix recommendations database schema. A relational half holds Users, Content, WatchHistory and Ratings, joined by user_id and content_id, and is the source of truth and the training signal. A NoSQL half holds Recommendations partitioned by user_id, ItemSimilarity partitioned by item_id and Trending partitioned by region, each storing a ranked list of content ids. Offline jobs read the relational half and write the NoSQL half, and the serving path reads only the NoSQL half.">
