  <text x="620" y="812" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One key, one ranked list. Every read on the serving path is a single lookup.</text>

  <rect x="40" y="850" width="1160" height="150" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="620" y="890" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Why the answer is stored rather than computed</text>
  <text x="620" y="930" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Ranking a catalogue for one user is model work, and it cannot happen while a page loads.</text>
  <text x="620" y="960" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The jobs run hours earlier, so the request path reads a row that was already decided.</text>
</svg>