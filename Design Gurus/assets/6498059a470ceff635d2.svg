<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. In active-active both servers receive half of the traffic from the load balancer. In active-passive server A receives all the traffic and server B receives none and watches.">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="rr2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rr2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rr2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rr2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rr2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rr2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rr2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rr2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two ways to run the spare</text>
  <rect x="30" y="66" width="580" height="336" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="320" y="106" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">Active-active</text>
  <g filter="url(#rr2-soft)"><rect x="228" y="130" width="184" height="54" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="320" y="164" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">load balancer</text>
  <line x1="278" y1="188" x2="190" y2="244" stroke="#059669" stroke-width="2.2" marker-end="url(#rr2-e)"/>
  <line x1="362" y1="188" x2="450" y2="244" stroke="#059669" stroke-width="2.2" marker-end="url(#rr2-e)"/>
  <g filter="url(#rr2-soft)"><rect x="100" y="248" width="180" height="80" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="190" y="282" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">server A</text>
  <text x="190" y="310" font-size="18" fill="#64748B" text-anchor="middle">50% of the traffic</text>
  <g filter="url(#rr2-soft)"><rect x="360" y="248" width="180" height="80" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="450" y="282" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">server B</text>
  <text x="450" y="310" font-size="18" fill="#64748B" text-anchor="middle">50% of the traffic</text>
  <text x="320" y="360" font-size="19" fill="#0F172A" text-anchor="middle">Both machines work. No failover delay.</text>
  <text x="320" y="388" font-size="19" font-weight="600" fill="#B45309" text-anchor="middle">Each one must be able to carry 100% alone.</text>
  <rect x="630" y="66" width="580" height="336" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="920" y="106" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">Active-passive</text>
  <g filter="url(#rr2-soft)"><rect x="828" y="130" width="184" height="54" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="920" y="164" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">load balancer</text>
  <line x1="878" y1="188" x2="790" y2="244" stroke="#059669" stroke-width="2.2" marker-end="url(#rr2-e)"/>
  <line x1="962" y1="188" x2="1050" y2="244" stroke="#CBD5E1" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#rr2-g)"/>
  <g filter="url(#rr2-soft)"><rect x="700" y="248" width="180" height="80" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="790" y="282" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">server A</text>
  <text x="790" y="310" font-size="18" fill="#64748B" text-anchor="middle">all the traffic</text>
  <g filter="url(#rr2-soft)"><rect x="960" y="248" width="180" height="80" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5"/></g>
  <text x="1050" y="282" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">server B</text>
  <text x="1050" y="310" font-size="18" fill="#64748B" text-anchor="middle">no traffic, watching</text>
  <text x="920" y="360" font-size="19" fill="#0F172A" text-anchor="middle">Only one machine works at a time.</text>
  <text x="920" y="388" font-size="19" font-weight="600" fill="#B45309" text-anchor="middle">A failover takes seconds. Some requests fail.</text>
  <text x="620" y="448" font-size="19" fill="#64748B" text-anchor="middle">Active-passive is the only choice for a part that cannot have two owners, such as the writer.</text>
</svg>