<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" style="background-color:#ffffff">
<defs>
<marker id="stc" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="std" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="ste" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="50" width="290" height="106" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="50" width="290" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="175" y="69" text-anchor="middle" font-weight="bold">Subscription  (context)</text>
<text x="42" y="96">- state : SubscriptionState</text>
<text x="42" y="118">+ pay(), missPayment(), cancel()</text>
<text x="42" y="138">+ setState(SubscriptionState)</text>
<text x="42" y="152" font-size="10.5" fill="#414d60">every method is one line: delegate</text>

<rect x="520" y="50" width="330" height="106" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="50" width="330" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="685" y="69" text-anchor="middle" font-weight="bold">&#171;interface&#187; SubscriptionState</text>
<text x="532" y="96">+ name() : String</text>
<text x="532" y="116">+ pay(Subscription)</text>
<text x="532" y="136">+ missPayment(Subscription)</text>
<text x="532" y="152">+ cancel(Subscription)</text>

<rect x="30" y="252" width="180" height="42" fill="#ffffff" stroke="#c3cfe0"/>
<text x="120" y="278" text-anchor="middle" font-size="11.5">Trialing</text>
<rect x="230" y="252" width="180" height="42" fill="#ffffff" stroke="#c3cfe0"/>
<text x="320" y="278" text-anchor="middle" font-size="11.5">Active</text>
<rect x="430" y="252" width="180" height="42" fill="#ffffff" stroke="#c3cfe0"/>
<text x="520" y="278" text-anchor="middle" font-size="11.5">PastDue</text>
<rect x="630" y="252" width="180" height="42" fill="#ffffff" stroke="#c3cfe0"/>
<text x="720" y="278" text-anchor="middle" font-size="11.5">Cancelled</text>

<path d="M 120 252 L 120 200 L 685 200 L 685 156" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#stc)"/>
<path d="M 320 252 L 320 200" stroke="#000000" fill="none" stroke-dasharray="5 4"/>
<path d="M 520 252 L 520 200" stroke="#000000" fill="none" stroke-dasharray="5 4"/>
<path d="M 720 252 L 720 200 L 685 200" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<path d="M 324 100 L 515 100" stroke="#000000" fill="none" marker-start="url(#std)" marker-end="url(#ste)"/>
<text x="350" y="92" font-size="11" fill="#414d60">holds exactly one, and swaps it</text>

<text x="341" y="122" font-size="11" fill="#b4322c">and each state calls setState() back</text>

<rect x="30" y="322" width="900" height="62" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="346" font-size="12.5" fill="#414d60">Every state class implements every action, even if only to refuse it. That is what removes the conditional and what makes the class count grow.</text>
<text x="52" y="368" font-size="12.5" fill="#b4322c">Keep business logic out of these classes. A state decides what is allowed and what comes next; refunding money belongs in the context or a service.</text>
</g>
</svg>