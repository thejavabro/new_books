<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One key set at four levels of scope: a default, then per environment, per service and per instance, with the most specific value winning. The same build then runs in three countries with only the values differing">
  <defs>
    <marker id="cf6-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="cf6-k1"><rect x="72" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf6-k2"><rect x="358" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf6-k3"><rect x="644" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf6-k4"><rect x="930" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf6-k5"><rect x="72" y="418" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf6-k6"><rect x="455" y="418" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf6-k7"><rect x="838" y="418" width="330" height="90" rx="12"/></clipPath>
    <filter id="cf6-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cf6-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="270" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">Where a value can be set, least specific first</text>
  <rect x="40" y="350" width="1160" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="380" font-size="16.5" font-weight="600" fill="#1D4ED8">The same build in three countries</text>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M308,157 H350" marker-end="url(#cf6-mslate)"/>
    <path d="M594,157 H636" marker-end="url(#cf6-mslate)"/>
    <path d="M880,157 H922" marker-end="url(#cf6-mslate)"/>
  </g>
  <g filter="url(#cf6-soft)">
    <rect x="72" y="112" width="236" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#64748B" clip-path="url(#cf6-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">The Default</text>
  <text x="190" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">one value shared by every</text>
  <text x="190" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">service in every environment</text>
  <g filter="url(#cf6-soft)">
    <rect x="358" y="112" width="236" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="358" y="112" width="6" height="90" fill="#64748B" clip-path="url(#cf6-k2)"/>
  </g>
  <circle cx="396" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(385.56,146.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="422" y="164" font-size="18.5" font-weight="600" fill="#111827">Environment</text>
  <text x="476" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">one value for production,</text>
  <text x="476" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">another one for test</text>
  <g filter="url(#cf6-soft)">
    <rect x="644" y="112" width="236" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="644" y="112" width="6" height="90" fill="#64748B" clip-path="url(#cf6-k3)"/>
  </g>
  <circle cx="682" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,146.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="708" y="164" font-size="18.5" font-weight="600" fill="#111827">The Service</text>
  <text x="762" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the order service overrides</text>
  <text x="762" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">what everyone else uses</text>
  <g filter="url(#cf6-soft)">
    <rect x="930" y="112" width="236" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="930" y="112" width="6" height="90" fill="#64748B" clip-path="url(#cf6-k4)"/>
  </g>
  <circle cx="968" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,146.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="994" y="164" font-size="18.5" font-weight="600" fill="#111827">One Instance</text>
  <text x="1048" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">a single machine is given a</text>
  <text x="1048" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">value its peers do not have</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="288" fill="#475569">the most specific value wins</text>
  </g>
  <g filter="url(#cf6-soft)">
    <rect x="72" y="418" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="418" width="6" height="90" fill="#2563EB" clip-path="url(#cf6-k5)"/>
  </g>
  <circle cx="110" cy="463" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,452.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="136" y="470" font-size="18.5" font-weight="600" fill="#111827">United States</text>
  <text x="237" y="533" font-size="15.5" text-anchor="middle" fill="#6B7280">currency USD, prices shown</text>
  <text x="237" y="556" font-size="15.5" text-anchor="middle" fill="#94A3B8">before tax is added</text>
  <g filter="url(#cf6-soft)">
    <rect x="455" y="418" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="455" y="418" width="6" height="90" fill="#2563EB" clip-path="url(#cf6-k6)"/>
  </g>
  <circle cx="493" cy="463" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,452.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="519" y="470" font-size="18.5" font-weight="600" fill="#111827">Germany</text>
  <text x="620" y="533" font-size="15.5" text-anchor="middle" fill="#6B7280">currency EUR, prices shown</text>
  <text x="620" y="556" font-size="15.5" text-anchor="middle" fill="#94A3B8">with tax already included</text>
  <g filter="url(#cf6-soft)">
    <rect x="838" y="418" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="838" y="418" width="6" height="90" fill="#2563EB" clip-path="url(#cf6-k7)"/>
  </g>
  <circle cx="876" cy="463" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,452.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="902" y="470" font-size="18.5" font-weight="600" fill="#111827">Japan</text>
  <text x="1003" y="533" font-size="15.5" text-anchor="middle" fill="#6B7280">currency JPY, written with</text>
  <text x="1003" y="556" font-size="15.5" text-anchor="middle" fill="#94A3B8">no decimal places at all</text>
  <rect x="40" y="632" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="656" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="678" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">One artifact</text>
  <text x="288" y="678" font-size="15.5" fill="#475569">the same application runs in every country, and only the values it reads are different</text>
  <rect x="64" y="700" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="722" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">One key, many scopes</text>
  <text x="288" y="722" font-size="15.5" fill="#475569">a default that most services accept, overridden only where a country or a service needs something else</text>
</svg>