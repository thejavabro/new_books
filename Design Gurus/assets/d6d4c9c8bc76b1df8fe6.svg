<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="768" viewBox="0 0 1240 768" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With a partition key every event for one order lands on the same partition and the consumer sees them in order; without a key the broker round-robins them across partitions and the order is lost">
  <rect x="0" y="0" width="1240" height="768" fill="#FFFFFF"/>
  <defs>
    <marker id="ms5-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ms5-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three events about one order, routed two different ways</text>

  
  <rect x="40" y="88" width="1160" height="252" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="122" font-size="20" font-weight="600" fill="#065F46">With a partition key: every event for order-77 goes to the same partition</text>

  <text x="365" y="148" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">key = order-77</text>
  <line x1="274" y1="170" x2="452" y2="208" stroke="#059669" stroke-width="2" marker-end="url(#ms5-emerald)"/>
  <line x1="274" y1="220" x2="452" y2="220" stroke="#059669" stroke-width="2" marker-end="url(#ms5-emerald)"/>
  <line x1="274" y1="270" x2="452" y2="232" stroke="#059669" stroke-width="2" marker-end="url(#ms5-emerald)"/>
  <line x1="704" y1="220" x2="812" y2="220" stroke="#059669" stroke-width="2" marker-end="url(#ms5-emerald)"/>

  <rect x="70" y="150" width="200" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="170" y="177" font-size="20" fill="#0F172A" text-anchor="middle">1  created</text>
  <rect x="70" y="200" width="200" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="170" y="227" font-size="20" fill="#0F172A" text-anchor="middle">2  paid</text>
  <rect x="70" y="250" width="200" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="170" y="277" font-size="20" fill="#0F172A" text-anchor="middle">3  shipped</text>

  <rect x="460" y="150" width="240" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="580" y="177" font-size="20" fill="#94A3B8" text-anchor="middle">P0: empty</text>
  <rect x="460" y="200" width="240" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="580" y="227" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">P1: 1, 2, 3</text>
  <rect x="460" y="250" width="240" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="580" y="277" font-size="20" fill="#94A3B8" text-anchor="middle">P2: empty</text>

  <rect x="820" y="170" width="340" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="990" y="210" font-size="20" fill="#065F46" text-anchor="middle">created, then paid, then shipped</text>
  <text x="990" y="244" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">order preserved</text>

  
  <rect x="40" y="360" width="1160" height="252" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="394" font-size="20" font-weight="600" fill="#B91C1C">Without a key: the broker round-robins and the order is gone</text>

  <text x="365" y="420" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">no key</text>
  <line x1="274" y1="442" x2="452" y2="442" stroke="#DC2626" stroke-width="2" marker-end="url(#ms5-red)"/>
  <line x1="274" y1="492" x2="452" y2="492" stroke="#DC2626" stroke-width="2" marker-end="url(#ms5-red)"/>
  <line x1="274" y1="542" x2="452" y2="542" stroke="#DC2626" stroke-width="2" marker-end="url(#ms5-red)"/>
  <line x1="704" y1="442" x2="812" y2="478" stroke="#DC2626" stroke-width="2" marker-end="url(#ms5-red)"/>
  <line x1="704" y1="492" x2="812" y2="492" stroke="#DC2626" stroke-width="2" marker-end="url(#ms5-red)"/>
  <line x1="704" y1="542" x2="812" y2="506" stroke="#DC2626" stroke-width="2" marker-end="url(#ms5-red)"/>

  <rect x="70" y="422" width="200" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="170" y="449" font-size="20" fill="#0F172A" text-anchor="middle">1  created</text>
  <rect x="70" y="472" width="200" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="170" y="499" font-size="20" fill="#0F172A" text-anchor="middle">2  paid</text>
  <rect x="70" y="522" width="200" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="170" y="549" font-size="20" fill="#0F172A" text-anchor="middle">3  shipped</text>

  <rect x="460" y="422" width="240" height="40" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="580" y="449" font-size="20" fill="#B91C1C" text-anchor="middle">P0: 1 created</text>
  <rect x="460" y="472" width="240" height="40" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="580" y="499" font-size="20" fill="#B91C1C" text-anchor="middle">P1: 2 paid</text>
  <rect x="460" y="522" width="240" height="40" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="580" y="549" font-size="20" fill="#B91C1C" text-anchor="middle">P2: 3 shipped</text>

  <rect x="820" y="442" width="340" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="990" y="482" font-size="20" fill="#B91C1C" text-anchor="middle">paid, then shipped, then created</text>
  <text x="990" y="516" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">order lost</text>

  
  <rect x="40" y="646" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="682" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A partition is the only thing that has an order. Everything above it is a guess.</text>
  <text x="620" y="712" font-size="20" fill="#334155" text-anchor="middle">The key chooses the partition, so the key is what decides which events stay in order.</text>
</svg>