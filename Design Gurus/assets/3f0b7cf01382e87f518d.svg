<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four principles of object oriented programming">
  <defs>
    <marker id="oobp-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oobp-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oobp-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oobp-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oobp-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oobp-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oobp-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oobp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oobp-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oobp-a0"><rect x="44" y="78" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oobp-b0"><rect x="570" y="78" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oobp-a1"><rect x="44" y="166" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oobp-b1"><rect x="570" y="166" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oobp-a2"><rect x="44" y="254" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oobp-b2"><rect x="570" y="254" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oobp-a3"><rect x="44" y="342" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oobp-b3"><rect x="570" y="342" width="626" height="64" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <text x="44" y="56" font-size="16.5" fill="#6B7280" font-weight="600">The principle</text>
  <text x="570" y="56" font-size="16.5" fill="#6B7280" font-weight="600">The question it answers</text>
  <g filter="url(#oobp-soft)">
    <rect x="44" y="78" width="470" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="44" y="78" width="6" height="64" fill="#2563EB" clip-path="url(#oobp-a0)"/>
  </g>
  <circle cx="82" cy="110.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="116.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">1</text>
  <text x="112" y="116.5" font-size="18.5" font-weight="600" fill="#111827">Encapsulation</text>
  <g filter="url(#oobp-soft)">
    <rect x="570" y="78" width="626" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="570" y="78" width="6" height="64" fill="#2563EB" clip-path="url(#oobp-b0)"/>
  </g>
  <text x="592" y="116.5" font-size="18.5" font-weight="600" fill="#111827">who is allowed to change this data?</text>
  <path d="M514,110 L570,110" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#oobp-arrow-blue)"/>
  <g filter="url(#oobp-soft)">
    <rect x="44" y="166" width="470" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="44" y="166" width="6" height="64" fill="#7C3AED" clip-path="url(#oobp-a1)"/>
  </g>
  <circle cx="82" cy="198.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="204.5" font-size="17" font-weight="700" text-anchor="middle" fill="#7C3AED">2</text>
  <text x="112" y="204.5" font-size="18.5" font-weight="600" fill="#111827">Abstraction</text>
  <g filter="url(#oobp-soft)">
    <rect x="570" y="166" width="626" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="570" y="166" width="6" height="64" fill="#7C3AED" clip-path="url(#oobp-b1)"/>
  </g>
  <text x="592" y="204.5" font-size="18.5" font-weight="600" fill="#111827">what does a caller actually need to know?</text>
  <path d="M514,198 L570,198" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#oobp-arrow-violet)"/>
  <g filter="url(#oobp-soft)">
    <rect x="44" y="254" width="470" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="44" y="254" width="6" height="64" fill="#059669" clip-path="url(#oobp-a2)"/>
  </g>
  <circle cx="82" cy="286.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="292.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">3</text>
  <text x="112" y="292.5" font-size="18.5" font-weight="600" fill="#111827">Inheritance</text>
  <g filter="url(#oobp-soft)">
    <rect x="570" y="254" width="626" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="570" y="254" width="6" height="64" fill="#059669" clip-path="url(#oobp-b2)"/>
  </g>
  <text x="592" y="292.5" font-size="18.5" font-weight="600" fill="#111827">what do these two types already share?</text>
  <path d="M514,286 L570,286" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oobp-arrow-emerald)"/>
  <g filter="url(#oobp-soft)">
    <rect x="44" y="342" width="470" height="64" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="44" y="342" width="6" height="64" fill="#D97706" clip-path="url(#oobp-a3)"/>
  </g>
  <circle cx="82" cy="374.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="380.5" font-size="17" font-weight="700" text-anchor="middle" fill="#D97706">4</text>
  <text x="112" y="380.5" font-size="18.5" font-weight="600" fill="#111827">Polymorphism</text>
  <g filter="url(#oobp-soft)">
    <rect x="570" y="342" width="626" height="64" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="570" y="342" width="6" height="64" fill="#D97706" clip-path="url(#oobp-b3)"/>
  </g>
  <text x="592" y="380.5" font-size="18.5" font-weight="600" fill="#111827">one call, so why do the answers differ?</text>
  <path d="M514,374 L570,374" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#oobp-arrow-amber)"/>
  <text x="620" y="452" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">Encapsulation and abstraction protect a class. Inheritance and polymorphism let it grow.</text>
</svg>