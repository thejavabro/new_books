<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Seven AI options for a food-delivery company in three family columns, predictive, generative, and agentic, with the support assistant picked">
  <defs>
    <filter id="c1scm-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c1scm-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c1scm-k1"><rect x="65" y="120" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="c1scm-k2"><rect x="65" y="290" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="c1scm-k3"><rect x="65" y="460" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="c1scm-k4"><rect x="460" y="120" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="c1scm-k5"><rect x="460" y="290" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="c1scm-k6"><rect x="460" y="460" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="c1scm-k7"><rect x="855" y="120" width="320" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>
  <rect x="40" y="30" width="370" height="610" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="60" font-size="16.5" font-weight="600" fill="#1D4ED8">Predictive: outputs a number or a label</text>
  <rect x="435" y="30" width="370" height="610" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="459" y="60" font-size="16.5" font-weight="600" fill="#6D28D9">Generative: outputs content</text>
  <rect x="830" y="30" width="370" height="610" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="854" y="60" font-size="16.5" font-weight="600" fill="#B45309">Agentic: takes actions</text>
  <rect x="65" y="86" width="175" height="24" rx="12" fill="#DBEAFE"/>
  <text x="152.5" y="102.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1D4ED8">strongest predictive pick</text>
  <g filter="url(#c1scm-soft)">
    <rect x="65" y="120" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="65" y="120" width="6" height="90" fill="#2563EB" clip-path="url(#c1scm-k1)"/>
  </g>
  <circle cx="103" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="129" y="172" font-size="18.5" font-weight="600" fill="#111827">Delivery-time prediction</text>
