  <g filter="url(#c1scm-soft)">
    <rect x="65" y="290" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="65" y="290" width="6" height="90" fill="#2563EB" clip-path="url(#c1scm-k2)"/>
  </g>
  <circle cx="103" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,324.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="129" y="330.5" font-size="18.5" font-weight="600" fill="#111827">Restaurant</text>
