    <rect x="65" y="460" width="6" height="90" fill="#2563EB" clip-path="url(#c1scm-k3)"/>
  </g>
  <circle cx="103" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,494.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="129" y="512" font-size="18.5" font-weight="600" fill="#111827">Promotion abuse detection</text>
