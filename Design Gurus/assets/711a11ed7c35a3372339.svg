    <rect x="460" y="290" width="6" height="90" fill="#7C3AED" clip-path="url(#c1scm-k5)"/>
  </g>
  <circle cx="498" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,324.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="524" y="342" font-size="18.5" font-weight="600" fill="#111827">Dish descriptions</text>
  <text x="620" y="405" font-size="15.5" text-anchor="middle" fill="#6B7280">short text for menu items</text>
  <g filter="url(#c1scm-soft)">
    <rect x="460" y="460" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="460" y="460" width="6" height="90" fill="#7C3AED" clip-path="url(#c1scm-k6)"/>
  </g>
  <circle cx="498" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,494.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="524" y="512" font-size="18.5" font-weight="600" fill="#111827">Review summaries</text>
  <text x="620" y="575" font-size="15.5" text-anchor="middle" fill="#6B7280">a summary for each restaurant</text>
  <rect x="855" y="86" width="156" height="24" rx="12" fill="#FEE2E2"/>
  <text x="933" y="102.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#B91C1C">weakest opening pick</text>
  <g filter="url(#c1scm-soft)">
    <rect x="855" y="120" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="855" y="120" width="6" height="90" fill="#D97706" clip-path="url(#c1scm-k7)"/>
  </g>
  <circle cx="893" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,154.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="919" y="172" font-size="18.5" font-weight="600" fill="#111827">Ordering assistant</text>
  <text x="1015" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">places orders and pays for them</text>
  <rect x="40" y="670" width="1160" height="60" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="705.5" text-anchor="middle" font-size="15.5" fill="#374151">List the options by family in about 30 seconds, then pick one and say why.</text>
