  <text x="492" y="102.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#047857">picked</text>
  <g filter="url(#c1scm-lift)">
    <rect x="460" y="120" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="460" y="120" width="9" height="90" fill="#7C3AED" clip-path="url(#c1scm-k4)"/>
  </g>
  <circle cx="498" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,154.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="524" y="172" font-size="18.5" font-weight="600" fill="#111827">Support assistant</text>
