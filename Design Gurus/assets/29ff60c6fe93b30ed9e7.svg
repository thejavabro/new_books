<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="970" viewBox="0 0 1240 970" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of two-phase commit. A coordinator sends prepare to the orders database and the payments database, both vote yes and hold locks, then the coordinator crashes before sending a verdict, leaving both participants in doubt with locks held while every other transaction on those rows queues.">
  <defs>
    <marker id="m05-l02-two-phase-commit-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l02-two-phase-commit-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l02-two-phase-commit-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l02-two-phase-commit-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="970" fill="#FFFFFF"/>

  <rect x="90" y="180" width="1090" height="300" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="470" y="610" width="710" height="200" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="250" y1="145" x2="250" y2="585"/>
    <line x1="640" y1="145" x2="640" y2="600"/>
    <line x1="1030" y1="145" x2="1030" y2="600"/>
  </g>

  <text x="110" y="220" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Phase 1: prepare, collect every vote</text>
  <text x="1160" y="220" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">each participant votes, then holds locks</text>
  <text x="110" y="510" font-size="20" font-weight="600" fill="#B91C1C">Phase 2: commit or abort, never sent</text>
  <text x="110" y="542" font-size="20" fill="#64748B">no verdict ever arrives</text>

  <g fill="none" stroke-width="2.5">
    <path d="M256,290 L634,290" stroke="#3B82F6" marker-end="url(#m05-l02-two-phase-commit-bl)"/>
    <path d="M256,350 L1024,350" stroke="#3B82F6" marker-end="url(#m05-l02-two-phase-commit-bl)"/>
    <path d="M634,415 L258,415" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m05-l02-two-phase-commit-em)"/>
    <path d="M1024,455 L258,455" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m05-l02-two-phase-commit-em)"/>
  </g>

  <rect x="633" y="420" width="14" height="180" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="1023" y="460" width="14" height="140" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <g fill="none" stroke="#DC2626" stroke-width="2">
    <path d="M640,600 L640,624" marker-end="url(#m05-l02-two-phase-commit-rd)"/>
    <path d="M1030,600 L1030,624" marker-end="url(#m05-l02-two-phase-commit-rd)"/>
  </g>

  <g stroke="#DC2626" stroke-width="3.5" stroke-linecap="round">
    <line x1="235" y1="585" x2="265" y2="615"/>
    <line x1="265" y1="585" x2="235" y2="615"/>
  </g>

  <text x="445" y="278" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">prepare?</text>
  <text x="830" y="338" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">prepare?</text>
  <text x="445" y="403" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">yes (locks held)</text>
  <text x="830" y="443" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">yes (locks held)</text>
  <text x="660" y="500" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">locks held</text>
  <text x="1050" y="540" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">locks held</text>

  <g filter="url(#m05-l02-two-phase-commit-soft)">
    <rect x="100" y="650" width="300" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="250" y="696" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Coordinator crashes here</text>
  <text x="250" y="728" text-anchor="middle" font-size="20" fill="#64748B">no verdict is ever sent</text>

  <text x="825" y="662" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">In doubt: cannot commit, cannot roll back</text>
  <text x="825" y="700" text-anchor="middle" font-size="20" fill="#64748B">maybe someone voted no, maybe everyone voted yes</text>
  <text x="825" y="738" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">Locks held. Everything on those rows queues.</text>
  <text x="825" y="786" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the locks stay held until the coordinator comes back</text>

  <g filter="url(#m05-l02-two-phase-commit-soft)">
    <rect x="120" y="50" width="260" height="95" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="250" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Coordinator</text>
  <text x="250" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">drives one transaction</text>
  <g filter="url(#m05-l02-two-phase-commit-soft)">
    <rect x="520" y="50" width="240" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="640" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders DB</text>
  <text x="640" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">participant</text>
  <g filter="url(#m05-l02-two-phase-commit-soft)">
    <rect x="910" y="50" width="240" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1030" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments DB</text>
  <text x="1030" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">participant</text>

  <line x1="60" y1="850" x2="96" y2="850" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="857" font-size="20" fill="#475569">Prepare request: the coordinator waits for votes</text>
  <line x1="60" y1="890" x2="96" y2="890" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="897" font-size="20" fill="#475569">Vote reply: yes, and the locks stay held</text>
  <line x1="60" y1="930" x2="96" y2="930" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="937" font-size="20" fill="#475569">Locks held, no verdict, and other transactions queue</text>
</svg>