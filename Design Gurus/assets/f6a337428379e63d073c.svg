<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="698" viewBox="0 0 1240 698" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three quorum settings on three replicas compared on consistency, fault tolerance and when to use each: W equals R equals one, W equals R equals two, and W equals three with R equals one">
  <rect x="0" y="0" width="1240" height="698" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same three replicas, three ways to set R and W</text>

  
  <rect x="50" y="88" width="360" height="452" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FEF2F2"/>
  <text x="230" y="122" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">W = 1, R = 1</text>
  <rect x="70" y="164" width="320" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="230" y="193" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">1 + 1 = 2, not &gt; 3</text>
  <text x="70" y="248" font-size="20" font-weight="600" fill="#475569">Consistency</text>
  <text x="70" y="278" font-size="20" fill="#0F172A">A read can land on a node</text>
  <text x="70" y="304" font-size="20" fill="#0F172A">that never got the write.</text>
  <text x="70" y="344" font-size="20" font-weight="600" fill="#475569">Fault tolerance</text>
  <text x="70" y="374" font-size="20" fill="#0F172A">Highest. One live node is</text>
  <text x="70" y="400" font-size="20" fill="#0F172A">enough for either operation.</text>
  <text x="70" y="440" font-size="20" font-weight="600" fill="#475569">Use it when</text>
  <text x="70" y="470" font-size="20" fill="#0F172A">Staleness is harmless and</text>
  <text x="70" y="496" font-size="20" fill="#0F172A">latency matters most.</text>

  
  <rect x="440" y="88" width="360" height="452" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <path d="M440 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#ECFDF5"/>
  <text x="620" y="122" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">W = 2, R = 2</text>
  <rect x="460" y="164" width="320" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="193" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">2 + 2 = 4, greater than 3</text>
  <text x="460" y="248" font-size="20" font-weight="600" fill="#475569">Consistency</text>
  <text x="460" y="278" font-size="20" fill="#0F172A">The sets always overlap, so</text>
  <text x="460" y="304" font-size="20" fill="#0F172A">the read sees the write.</text>
  <text x="460" y="344" font-size="20" font-weight="600" fill="#475569">Fault tolerance</text>
  <text x="460" y="374" font-size="20" fill="#0F172A">One node can be down and</text>
  <text x="460" y="400" font-size="20" fill="#0F172A">both still succeed.</text>
  <text x="460" y="440" font-size="20" font-weight="600" fill="#475569">Use it when</text>
  <text x="460" y="470" font-size="20" fill="#0F172A">You want strong reads without</text>
  <text x="460" y="496" font-size="20" fill="#0F172A">giving up all availability.</text>

  
  <rect x="830" y="88" width="360" height="452" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M830 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FFFBEB"/>
  <text x="1010" y="122" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">W = 3, R = 1</text>
  <rect x="850" y="164" width="320" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1010" y="193" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">3 + 1 = 4, greater than 3</text>
  <text x="850" y="248" font-size="20" font-weight="600" fill="#475569">Consistency</text>
  <text x="850" y="278" font-size="20" fill="#0F172A">Strong, and reads are as</text>
  <text x="850" y="304" font-size="20" fill="#0F172A">cheap as they can be.</text>
  <text x="850" y="344" font-size="20" font-weight="600" fill="#475569">Fault tolerance</text>
  <text x="850" y="374" font-size="20" font-weight="600" fill="#B91C1C">None on writes. One node</text>
  <text x="850" y="400" font-size="20" font-weight="600" fill="#B91C1C">down and every write fails.</text>
  <text x="850" y="440" font-size="20" font-weight="600" fill="#475569">Use it when</text>
  <text x="850" y="470" font-size="20" fill="#0F172A">Reads vastly outnumber writes</text>
  <text x="850" y="496" font-size="20" fill="#0F172A">and you accept that risk.</text>

  
  <rect x="50" y="576" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="612" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">R + W &gt; N is not a switch you turn on. It is arithmetic you satisfy by choosing R and W.</text>
  <text x="620" y="642" font-size="20" fill="#334155" text-anchor="middle">Every point on that line trades write availability against read freshness.</text>
</svg>