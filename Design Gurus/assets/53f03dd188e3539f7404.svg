<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="490" viewBox="0 0 1240 490" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Machine A sends a request to machine B and gets no answer. Three different causes produce exactly the same silence: B has crashed, B is alive but slow, or the network between them is broken.">
  <rect x="0" y="0" width="1240" height="490" fill="#FFFFFF"/>
  <defs>
    <marker id="hb1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="hb1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="hb1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="hb1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="hb1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="hb1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="hb1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="hb1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="hb1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Silence has three causes, and they all look the same</text>
  <g filter="url(#hb1-soft)"><rect x="90" y="92" width="230" height="86" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="205" y="128" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Machine A</text>
  <text x="205" y="156" font-size="18" fill="#64748B" text-anchor="middle">is waiting</text>
  <path d="M324,150 L568,150" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 5"/>
  <path d="M632,150 L876,150" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 5"/>
  <path d="M592,142 L608,158 M608,142 L592,158" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="112" font-size="19" font-weight="600" fill="#B91C1C" text-anchor="middle">no answer</text>
  <g filter="url(#hb1-soft)"><rect x="890" y="92" width="230" height="86" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="1005" y="128" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Machine B</text>
  <text x="1005" y="156" font-size="18" fill="#64748B" text-anchor="middle">silent</text>
  <g filter="url(#hb1-soft)"><rect x="24" y="216" width="370" height="186" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/></g>
  <text x="209" y="256" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">B has crashed</text>
  <text x="209" y="296" font-size="19" fill="#0F172A" text-anchor="middle">The process is gone.</text>
  <text x="209" y="326" font-size="19" fill="#0F172A" text-anchor="middle">Nothing will answer</text>
  <text x="209" y="356" font-size="19" fill="#0F172A" text-anchor="middle">until it is restarted.</text>
  <g filter="url(#hb1-soft)"><rect x="434" y="216" width="370" height="186" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="619" y="256" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">B is only slow</text>
  <text x="619" y="296" font-size="19" fill="#0F172A" text-anchor="middle">It is alive and busy.</text>
  <text x="619" y="326" font-size="19" fill="#0F172A" text-anchor="middle">A long pause can make</text>
  <text x="619" y="356" font-size="19" fill="#0F172A" text-anchor="middle">it miss a few messages.</text>
  <g filter="url(#hb1-soft)"><rect x="844" y="216" width="370" height="186" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="1029" y="256" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">The network is broken</text>
  <text x="1029" y="296" font-size="19" fill="#0F172A" text-anchor="middle">B is healthy and working.</text>
  <text x="1029" y="326" font-size="19" fill="#0F172A" text-anchor="middle">The messages between</text>
  <text x="1029" y="356" font-size="19" fill="#0F172A" text-anchor="middle">A and B do not arrive.</text>
  <text x="620" y="448" font-size="19" fill="#64748B" text-anchor="middle">A heartbeat does not remove this doubt. It only puts a time limit on it.</text>
</svg>