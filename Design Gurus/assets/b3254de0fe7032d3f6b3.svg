<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="constraints-title constraints-desc">
<title id="constraints-title">The constraints that bind</title>
<desc id="constraints-desc">Five constraints decide whether a design is right rather than merely correct: team size, timeline, operational capacity, budget, and the system that already exists. None of them appears on an architecture diagram.</desc>
<defs>
<marker id="constraints-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="constraints-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="constraints-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="constraints-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="762" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The constraints that bind</text>
<text x="40" y="86" font-size="21" fill="#4A5568">None of them appears on an architecture diagram.</text>
<rect x="40" y="684" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="684" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Five constraints do most of the work</text>
<circle cx="60" cy="198" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="205" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="168" width="428" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="204" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Team size</text>
<path d="M526 198H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 198H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#constraints-marker-slate)"/>
<rect x="570" y="168" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="191.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every system needs somebody who can debug it</text><text x="590" y="216.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">at an inconvenient hour</text>
<circle cx="60" cy="270" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="277" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="240" width="428" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Timeline</text>
<path d="M526 270H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 270H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#constraints-marker-slate)"/>
<rect x="570" y="240" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="276" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a three-quarter design is wrong for a product due this quarter</text>
<circle cx="60" cy="342" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="349" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="312" width="428" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="348" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Operational capacity</text>
<path d="M526 342H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 342H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#constraints-marker-slate)"/>
<rect x="570" y="312" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="348" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not how many engineers, but how much attention they have spare</text>
<circle cx="60" cy="414" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="421" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="384" width="428" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="306" y="420" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Budget</text>
<path d="M526 414H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 414H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#constraints-marker-slate)"/>
<rect x="570" y="384" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="407.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">infrastructure spend and the cost of engineer time,</text><text x="590" y="432.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">weighed not assumed</text>
<circle cx="60" cy="486" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="493" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="92" y="456" width="428" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="306" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The system that already exists</text>
<path d="M526 486H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 486H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#constraints-marker-slate)"/>
<rect x="570" y="456" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="479.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">competing against leaving a working thing alone,</text><text x="590" y="504.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is cheap and safe</text>
<rect x="40" y="540" width="1160" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="576" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A design presented without its constraints</text><text x="64" y="605" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">is being presented as though it were free.</text><text x="64" y="634" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Name at least two of them out loud before you propose an architecture.</text>
<text x="66" y="718" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Proportionality is whether the design is the right size for this problem, this team and this year.</text>
</svg>