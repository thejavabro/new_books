<path d="M620,520 V554" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#rdb08-mdown)"/>

<rect x="40" y="554" width="1160" height="352" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="584" font-size="16.5" font-weight="600" fill="#4338CA">Physical: how one DBMS stores it. Exact types, keys and indexes, rewritten if you change product.</text>
<rect x="100" y="604" width="1040" height="272" rx="12" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<g font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">
<text x="128" y="636">CREATE TABLE Loan (</text>
<text x="152" y="660">loan_id    BIGINT NOT NULL AUTO_INCREMENT,</text>
<text x="152" y="684">member_id  BIGINT NOT NULL,</text>
<text x="152" y="708">copy_id    BIGINT NOT NULL,</text>
<text x="152" y="732">issue_date DATE   NOT NULL,</text>
<text x="152" y="756">due_date   DATE   NOT NULL,</text>
<text x="152" y="780">PRIMARY KEY (loan_id),</text>
<text x="152" y="804">FOREIGN KEY (member_id) REFERENCES Member(member_id),</text>
<text x="152" y="828">INDEX idx_loan_member (member_id)</text>
<text x="128" y="852">);</text>
</g>

<rect x="40" y="940" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="978" font-size="16" fill="#475569">Same data, three drawings. Change the database product and only the bottom one is rewritten.</text>
</svg>