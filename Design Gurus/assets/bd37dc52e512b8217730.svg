<rect x="40" y="250" width="1160" height="270" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="64" y="280" font-size="16.5" font-weight="600" fill="#1D4ED8">Logical: which facts we keep. Attributes, keys and general types, with no product chosen yet.</text>
