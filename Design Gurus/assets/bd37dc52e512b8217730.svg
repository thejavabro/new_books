<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1044" viewBox="0 0 1240 1044" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same library data drawn three times, as a conceptual model, a logical model, and a physical model">
<defs>
<marker id="rdb08-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
