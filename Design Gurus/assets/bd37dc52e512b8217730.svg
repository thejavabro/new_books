<rect x="0" y="0" width="1240" height="1044" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="176" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Conceptual: what things exist. Reviewed with the librarian, in her own words.</text>
