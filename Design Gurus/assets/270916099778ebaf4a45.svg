<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram for one idempotency key. It starts unseen, a crash before the commit leaves it unseen so a retry is safe, the work and the key commit together to reach recorded, a duplicate then returns the stored result, and once the retry window passes the record expires.">
  <defs>
    <marker id="m04-l04-idempotency-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m04-l04-idempotency-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l04-idempotency-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m04-l04-idempotency-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <rect x="50" y="110" width="1140" height="380" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="150" font-size="20" font-weight="600" fill="#334155">Lifecycle of one idempotency key</text>
  <text x="1170" y="150" text-anchor="end" font-size="20" fill="#64748B">one key, reused across every retry</text>

  <g fill="none" stroke-width="2.5">
    <path d="M108,355 L137,355" stroke="#475569" marker-end="url(#m04-l04-idempotency-states-sl)"/>
    <path d="M435,355 L477,355" stroke="#059669" marker-end="url(#m04-l04-idempotency-states-em)"/>
    <path d="M775,355 L812,355" stroke="#475569" marker-end="url(#m04-l04-idempotency-states-sl)"/>
    <path d="M1120,355 L1149,355" stroke="#475569" marker-end="url(#m04-l04-idempotency-states-sl)"/>
    <path d="M200,300 C200,252 380,252 380,296" stroke="#DC2626" stroke-width="2" marker-end="url(#m04-l04-idempotency-states-rd)"/>
    <path d="M560,410 C560,468 700,468 700,414" stroke="#059669" stroke-width="2" marker-end="url(#m04-l04-idempotency-states-em)"/>
  </g>

  <text x="290" y="202" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">crash before commit,</text>
  <text x="290" y="228" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">so a retry is safe</text>
  <text x="485" y="254" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">work and key</text>
  <text x="485" y="280" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">commit together</text>
  <text x="800" y="254" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">retry window passes</text>
  <text x="800" y="280" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">(hours to days)</text>
  <text x="718" y="462" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a duplicate returns the stored result</text>

  <circle cx="95" cy="355" r="13" fill="#475569"/>
  <text x="95" y="404" text-anchor="middle" font-size="20" fill="#64748B">start</text>
  <circle cx="1160" cy="355" r="13" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="1160" cy="355" r="7" fill="#475569"/>
  <text x="1160" y="404" text-anchor="middle" font-size="20" fill="#64748B">end</text>

  <g filter="url(#m04-l04-idempotency-states-soft)">
    <rect x="145" y="300" width="290" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="290" y="346" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Unseen</text>
  <text x="290" y="378" text-anchor="middle" font-size="20" fill="#64748B">no record for this key yet</text>
  <g filter="url(#m04-l04-idempotency-states-soft)">
    <rect x="485" y="300" width="290" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="630" y="346" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Recorded</text>
  <text x="630" y="378" text-anchor="middle" font-size="20" fill="#64748B">key stored with its result</text>
  <g filter="url(#m04-l04-idempotency-states-soft)">
    <rect x="820" y="300" width="300" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="970" y="346" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Expired</text>
  <text x="970" y="378" text-anchor="middle" font-size="20" fill="#64748B">dropped, not archived</text>

  <rect x="200" y="540" width="840" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="587" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">The key record and the effect commit in one transaction, so there is</text>
  <text x="620" y="617" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">no state where the work happened but the key is missing.</text>

  <line x1="60" y1="700" x2="96" y2="700" stroke="#475569" stroke-width="4"/>
  <text x="108" y="707" font-size="20" fill="#475569">Key lifecycle: created, then ages out</text>
  <line x1="60" y1="740" x2="96" y2="740" stroke="#059669" stroke-width="4"/>
  <text x="108" y="747" font-size="20" fill="#475569">Safe: atomic commit, and the duplicate is short-circuited</text>
  <line x1="60" y1="780" x2="96" y2="780" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="787" font-size="20" fill="#475569">Crash before the commit: a retry is safe</text>
</svg>