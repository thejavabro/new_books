<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The words with no keys worked out yet">
<defs>
<filter id="ga-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Group the words that are rearrangements of each other</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Comparing every pair would be slow, so give each word a key instead</text>
<rect x="40" y="106" width="1160" height="508" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Two words are anagrams exactly when their letters, sorted, are the same string</text>
<text x="226" y="250" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the words</text>
<rect x="250" y="212" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="316" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">abc</text>
<rect x="402" y="212" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="468" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">cab</text>
<rect x="554" y="212" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">bca</text>
<rect x="706" y="212" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="772" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">xyz</text>
<rect x="858" y="212" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="924" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">zxy</text>
<text x="226" y="368" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">letters sorted</text>
<rect x="250" y="330" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="316" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="402" y="330" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="468" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="554" y="330" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="706" y="330" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="772" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="858" y="330" width="132" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="924" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="226" y="464" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">groups</text>
<text x="256" y="464" font-size="18" fill="#475569">no groups yet</text>
<text x="620" y="552" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">The key throws away the order of the letters, which is the only thing anagrams disagree about</text>
<rect x="40" y="626" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="666" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Sorting a word turns "is it an anagram of" into "is it equal to"</text>
<text x="620" y="698" text-anchor="middle" font-size="18.5" fill="#475569">Equality can be looked up in one step, while comparing every pair cannot</text>
</svg>