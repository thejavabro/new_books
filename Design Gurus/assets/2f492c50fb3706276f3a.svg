<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" role="img" aria-label="Without a queue the user waits for the slow work. With a queue the service answers immediately and workers do the slow work afterwards, which also lets a traffic burst pile up in the queue instead of taking the system down.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="600" fill="#FFFFFF"/>
  <text x="40" y="48" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Without a queue</text>
  <rect x="60" y="95" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="137" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Client</text>
  <rect x="345" y="95" width="250" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="470" y="137" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Upload service</text>
  <rect x="720" y="95" width="320" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="137" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Encode the video</text>
  <line x1="240" y1="130" x2="344" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="595" y1="130" x2="719" y2="130" stroke="#DC2626" stroke-width="2" marker-end="url(#ar-red)"/>
  <path d="M880 166 C 880 216, 150 216, 150 172" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#ar-red)"/>
  <text x="515" y="238" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the user waits about 40 seconds for a response</text>
  <line x1="40" y1="272" x2="1200" y2="272" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="40" y="322" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">With a queue</text>
  <rect x="60" y="369" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="411" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Client</text>
  <rect x="345" y="369" width="250" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="470" y="411" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Upload service</text>
  <line x1="240" y1="390" x2="344" y2="390" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <path d="M344 420 L 240 420" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <text x="292" y="452" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">answers now</text>
  <rect x="620" y="372" width="250" height="64" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <rect x="636" y="388" width="34" height="32" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="680" y="388" width="34" height="32" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="724" y="388" width="34" height="32" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="768" y="388" width="34" height="32" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="812" y="388" width="34" height="32" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="745" y="356" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Queue</text>
  <line x1="595" y1="404" x2="606" y2="404" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <rect x="940" y="313" width="240" height="54" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1060" y="347" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Worker</text>
  <path d="M870 404 C 920 404, 920 340, 936 340" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ar-grn)"/>
  <rect x="940" y="377" width="240" height="54" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1060" y="411" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Worker</text>
  <path d="M870 404 C 920 404, 920 404, 936 404" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ar-grn)"/>
  <rect x="940" y="441" width="240" height="54" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1060" y="475" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Worker</text>
  <path d="M870 404 C 920 404, 920 468, 936 468" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ar-grn)"/>
  <rect x="40" y="524" width="1160" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="562" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A burst waits in the queue and is processed later. Without a queue, the same burst takes the system down.</text>
</svg>