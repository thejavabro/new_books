<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="writes-title writes-desc">
<title id="writes-title">The difficulty is always writes</title>
<desc id="writes-desc">Four approaches to multi-region writes. A single write region is simple and leaves distant writes slow, home-region partitioning removes conflicts, resolution is costly, and cross-region consensus pays the round trip every time.</desc>
<defs>
<marker id="writes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="writes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="writes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="writes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The difficulty is always writes</text>
<text x="40" y="86" font-size="21" fill="#4A5568">There are four approaches and they are not equally good.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="64" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="64" rx="2.5" fill="#39D5AA"/><text x="64" y="156" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Reads across regions are solved. Writes are where every design gets hard.</text>
<circle cx="60" cy="244" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="251" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="206" width="420" height="76" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="300" y="236.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One write region,</text><text x="300" y="263.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">replicas everywhere</text>
<path d="M516 244H550" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M516 244H550" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-slate)"/>
<rect x="560" y="206" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="580" y="237.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">simple and correct, often called active-active when it is not,</text><text x="580" y="262.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and distant users still pay the round trip</text>
<circle cx="60" cy="332" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="339" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="294" width="420" height="76" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="300" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Partition by home region</text>
<path d="M516 332H550" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M516 332H550" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-slate)"/>
<rect x="560" y="294" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="580" y="325.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">each record has one region allowed to write it, so conflicts</text><text x="580" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cannot arise and reads stay local</text>
<circle cx="60" cy="420" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="427" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="382" width="420" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="300" y="426" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Multi-master with resolution</text>
<path d="M516 420H550" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M516 420H550" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-slate)"/>
<rect x="560" y="382" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="580" y="413.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">last-write-wins discards data and trusts clocks; mergeable</text><text x="580" y="438.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">types are limited; application resolution is a lot of code</text>
<circle cx="60" cy="508" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="515" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="470" width="420" height="76" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="300" y="514" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Consensus across regions</text>
<path d="M516 508H550" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M516 508H550" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-slate)"/>
<rect x="560" y="470" width="640" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="580" y="501.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">correct, and every write pays the cross-region round trip.</text><text x="580" y="526.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The latency is not negotiable</text>
<rect x="40" y="570" width="1160" height="96" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="570" width="5" height="96" rx="2.5" fill="#AC8BE8"/><text x="64" y="611" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A write needs either one authority or a rule for resolving disagreement.</text><text x="64" y="637" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The second row removes the disagreement rather than resolving it.</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A replica near the user solves reads, and replication lag is the only consequence.</text>
</svg>