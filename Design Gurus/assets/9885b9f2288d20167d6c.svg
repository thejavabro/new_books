<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Activation timing depends on the feature</title><desc id="desc">Activation timing depends on the feature. One global rule is rarely enough for every flag. The backend must enforce restrictions that cannot depend on an offline client.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Activation timing depends on the feature</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">One global rule is rarely enough for every flag.</tspan></text><rect x="50" y="165" width="1100" height="96" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="75" y="204" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Ordinary UI change</tspan></text><text x="475" y="204" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Apply at a safe screen or launch boundary.</tspan></text><rect x="50" y="280" width="1100" height="96" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="75" y="319" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Operation-specific choice</tspan></text><text x="475" y="319" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Keep the chosen version for the operation when</tspan><tspan x="475" dy="32">required.</tspan></text><rect x="50" y="395" width="1100" height="96" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="75" y="434" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Emergency restriction</tspan></text><text x="475" y="434" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Block new actions quickly; preserve safe recovery.</tspan></text><rect x="50" y="525" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="571" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">The backend must enforce restrictions that cannot depend on an offline client.</tspan></text></g></svg>