<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="642" viewBox="0 0 1240 642" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="writes-title writes-desc">
<title id="writes-title">Three ways to write</title>
<desc id="writes-desc">Write-through updates cache and store synchronously. Write-behind updates the cache first and the store afterwards, making the cache briefly authoritative. Write-around skips the cache entirely, which avoids the dual write for the value itself.</desc>
<defs>
<marker id="writes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="writes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="writes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="writes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="642" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three ways to write</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The second family writes to the cache as part of the write path.</text>
<rect x="40" y="564" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="564" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="1160" height="96" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V208A6 6 0 0 0 46 214H54Z" fill="#5EC9EC"/>
<text x="70" y="160" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Write-through</text>
<text x="70" y="188" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">both, synchronously</text>
<rect x="300" y="138" width="96" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="348" y="172" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">writer</text>
<path d="M402 166H436" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M402 166H436" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-slate)"/>
<rect x="440" y="138" width="96" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="488" y="172" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cache</text>
<path d="M542 166H576" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M542 166H576" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-slate)"/>
<rect x="580" y="138" width="150" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="655" y="172" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">store</text>
<text x="760" y="160" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">a read after a write sees it</text>
<text x="760" y="188" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">pays both latencies, needs both available</text>
<rect x="40" y="226" width="1160" height="96" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 226H46A6 6 0 0 0 40 232V316A6 6 0 0 0 46 322H54Z" fill="#F3CF6A"/>
<text x="70" y="268" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Write-behind</text>
<text x="70" y="296" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cache now, store after</text>
<rect x="300" y="246" width="96" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="348" y="280" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">writer</text>
<path d="M402 274H436" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M402 274H436" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-slate)"/>
<rect x="440" y="246" width="96" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="488" y="280" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cache</text>
<path d="M542 274H576" fill="none" stroke="#91642E" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M542 274H576" fill="none" stroke="#91642E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-amber)"/>
<rect x="580" y="246" width="150" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="655" y="280" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">store later</text>
<text x="760" y="268" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">writes are fast</text>
<text x="760" y="296" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">a cache failure loses acknowledged writes</text>
<rect x="40" y="334" width="1160" height="96" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 334H46A6 6 0 0 0 40 340V424A6 6 0 0 0 46 430H54Z" fill="#39D5AA"/>
<text x="70" y="376" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Write-around</text>
<text x="70" y="404" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">store only</text>
<rect x="300" y="354" width="96" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="348" y="388" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">writer</text>
<path d="M402 382H436" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M402 382H436" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#writes-marker-slate)"/>
<rect x="440" y="354" width="96" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="488" y="388" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">store</text>
<text x="760" y="376" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">nothing cached until read</text>
<text x="760" y="404" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">the first read after a write always misses</text>
<rect x="40" y="454" width="1160" height="84" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="454" width="5" height="84" rx="2.5" fill="#F28B9D"/><text x="64" y="487.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Write-through and write-behind write to two systems, which is a dual write.</text><text x="64" y="516.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Write-around avoids that for the value, and still has to remove whatever is cached.</text>
<text x="66" y="598" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Write-behind is a durability decision disguised as a caching decision.</text>
</svg>