<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="838" viewBox="0 0 1240 838" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="trace-title trace-desc">
<title id="trace-title">Where did the time go</title>
<desc id="trace-desc">A trace answers the question logs are worst at. The engineering decision is sampling, because the valuable traces are rare by definition.</desc>
<defs>
<marker id="trace-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="trace-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="trace-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="trace-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="838" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where did the time go</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A request took 4 seconds, and every service individually looked fine.</text>
<rect x="40" y="760" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="760" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="312" y="145" font-size="19" font-weight="400" fill="#080C50" text-anchor="end">gateway</text>
<rect x="332.0" y="124" width="860.0" height="30" rx="5" fill="#159BEF"/>
<text x="312" y="193" font-size="19" font-weight="400" fill="#080C50" text-anchor="end">api</text>
<rect x="366.4" y="172" width="808.4" height="30" rx="5" fill="#159BEF"/>
<text x="312" y="241" font-size="19" font-weight="400" fill="#080C50" text-anchor="end">service A</text>
<rect x="400.8" y="220" width="154.8" height="30" rx="5" fill="#06AC80"/>
<text x="312" y="289" font-size="19" font-weight="400" fill="#080C50" text-anchor="end">service B, waiting on a lock</text>
<rect x="572.8" y="268" width="602.0" height="30" rx="5" fill="#F25461"/>
<text x="312" y="337" font-size="19" font-weight="400" fill="#080C50" text-anchor="end">database</text>
<rect x="590.0" y="316" width="68.8" height="30" rx="5" fill="#06AC80"/>
<text x="620" y="378" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the database was fast. Service B held the time, waiting on a lock</text>
<rect x="40" y="402" width="560" height="152" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 402H46A6 6 0 0 0 40 408V548A6 6 0 0 0 46 554H54Z" fill="#5EC9EC"/><text x="70" y="438" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Head sampling</text>
<text x="72" y="474" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">decides at the start, by probability</text>
<text x="72" y="502" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">simple, cheap, propagates cleanly</text>
<text x="72" y="534" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">discards the rare slow requests</text>
<rect x="640" y="402" width="560" height="152" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 402H646A6 6 0 0 0 640 408V548A6 6 0 0 0 646 554H654Z" fill="#F3CF6A"/><text x="670" y="438" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Tail sampling</text>
<text x="672" y="474" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">decides after the request finishes</text>
<text x="672" y="502" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">keeps everything slow or errored</text>
<text x="672" y="534" font-size="19" font-weight="700" fill="#91642E" text-anchor="start">buffers every span until it decides</text>
<rect x="40" y="576" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="576" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="613" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The usual answer: a low baseline head sample, plus keep every error and every slow trace.</text>
<rect x="40" y="660" width="1160" height="74" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="690" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">OpenTelemetry maturity is uneven: tracing, baggage and logging are stable, metrics are stable</text><text x="620" y="716" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">in the API and protocol with SDK support varying, and profiling is still in development</text>
<text x="66" y="794" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Plan around the parts that are stable and treat the rest as a direction.</text>
</svg>