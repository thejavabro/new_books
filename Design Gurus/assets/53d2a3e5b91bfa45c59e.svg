<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two bands comparing storage models: a conventional account row stores balance 70 and a read returns that column, while an event sourced log stores Opened(0), Deposited(100), Withdrew(30) as append-only events and replaying them derives the balance 70.">
  <defs>
    <marker id="m05-l07-row-vs-log-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l07-row-vs-log-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l07-row-vs-log-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m05-l07-row-vs-log-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <rect x="60" y="80" width="1120" height="250" rx="14" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="120" font-size="20" font-weight="600" fill="#334155">Conventional row</text>
  <text x="1160" y="120" text-anchor="end" font-size="20" fill="#64748B">the row stores the answer</text>
  <g filter="url(#m05-l07-row-vs-log-soft)">
    <path d="M90,190 L90,280 A150,20 0 0 0 390,280 L390,190" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="240" cy="190" rx="150" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="227" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">balance: 70</text>
  <text x="240" y="257" text-anchor="middle" font-size="20" fill="#64748B">the current state</text>
  <g filter="url(#m05-l07-row-vs-log-soft)">
    <rect x="470" y="180" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="610" y="226" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Read the column</text>
  <text x="610" y="258" text-anchor="middle" font-size="20" fill="#64748B">one lookup, no replay</text>
  <g filter="url(#m05-l07-row-vs-log-soft)">
    <rect x="790" y="180" width="390" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="985" y="226" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Truth is the current state</text>
  <text x="985" y="258" text-anchor="middle" font-size="20" fill="#64748B">no record of how it got there</text>

  <rect x="60" y="380" width="1120" height="250" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="420" font-size="20" font-weight="600" fill="#92400E">Event sourced log: append only</text>
  <text x="1160" y="420" text-anchor="end" font-size="20" fill="#64748B">the log stores how the answer came to be</text>
  <g filter="url(#m05-l07-row-vs-log-soft)">
    <rect x="70" y="480" width="250" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="195" y="531" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Opened(0)</text>
  <text x="195" y="563" text-anchor="middle" font-size="20" fill="#64748B">account created</text>
  <g filter="url(#m05-l07-row-vs-log-soft)">
    <rect x="350" y="480" width="250" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="475" y="531" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Deposited(100)</text>
  <text x="475" y="563" text-anchor="middle" font-size="20" fill="#64748B">money in</text>
  <g filter="url(#m05-l07-row-vs-log-soft)">
    <rect x="630" y="480" width="250" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="755" y="531" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Withdrew(30)</text>
  <text x="755" y="563" text-anchor="middle" font-size="20" fill="#64748B">money out</text>
  <g filter="url(#m05-l07-row-vs-log-soft)">
    <rect x="910" y="480" width="250" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1035" y="531" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Replay gives 70</text>
  <text x="1035" y="563" text-anchor="middle" font-size="20" fill="#64748B">0 + 100 - 30 = 70</text>

  <g fill="none" stroke-width="2.5">
    <path d="M390,235 L462,235" stroke="#475569" stroke-width="2" marker-end="url(#m05-l07-row-vs-log-sl)"/>
    <path d="M320,540 L342,540" stroke="#D97706" marker-end="url(#m05-l07-row-vs-log-ab)"/>
    <path d="M600,540 L622,540" stroke="#D97706" marker-end="url(#m05-l07-row-vs-log-ab)"/>
    <path d="M880,540 L902,540" stroke="#059669" marker-end="url(#m05-l07-row-vs-log-em)"/>
  </g>

  <text x="426" y="158" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">SELECT balance</text>
  <text x="891" y="460" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replay in order</text>

  <line x1="60" y1="690" x2="96" y2="690" stroke="#475569" stroke-width="4"/>
  <text x="108" y="697" font-size="20" fill="#475569">One lookup on the stored column</text>
  <line x1="60" y1="730" x2="96" y2="730" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="737" font-size="20" fill="#475569">Append-only events: the source of truth</text>
  <line x1="60" y1="770" x2="96" y2="770" stroke="#059669" stroke-width="4"/>
  <text x="108" y="777" font-size="20" fill="#475569">Derived state: replay the events in order</text>
</svg>