<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The safe path for one line of code: merge behind CI with contract tests green, build a new image, send a few percent of traffic to a canary, then an automated gate compares metrics against the stable fleet. Clean metrics promote in stages until the full fleet runs the new version. A regression triggers an automatic rollback. A risky change ships dark, with a feature flag that turns it on, or off to undo, separately from the deploy.">
  <defs>
    <marker id="m06-l07-deploy-pipeline-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l07-deploy-pipeline-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m06-l07-deploy-pipeline-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l07-deploy-pipeline-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m06-l07-deploy-pipeline-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m06-l07-deploy-pipeline-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1120" fill="#FFFFFF"/>

  <rect x="40" y="100" width="1160" height="620" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="145" font-size="20" font-weight="600" fill="#334155">One change, from merge to the full fleet</text>
  <text x="60" y="178" font-size="20" fill="#64748B">blast radius: a slice of one service's traffic, for a few minutes</text>

  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="60" y="230" width="250" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="185" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Merge behind CI</text>
  <text x="185" y="313" text-anchor="middle" font-size="20" fill="#64748B">contract tests green</text>
  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="370" y="230" width="250" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="495" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Build new image</text>
  <text x="495" y="313" text-anchor="middle" font-size="20" fill="#64748B">what actually ships</text>
  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="680" y="230" width="250" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="805" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Canary</text>
  <text x="805" y="313" text-anchor="middle" font-size="20" fill="#64748B">a few percent of traffic</text>
  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <path d="M1065,200 L1180,290 L1065,380 L950,290 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="1065" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Metrics clean vs</text>
  <text x="1065" y="313" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the stable fleet?</text>

  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="60" y="450" width="390" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="255" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Old and new run side by side</text>
  <text x="255" y="533" text-anchor="middle" font-size="20" fill="#64748B">for the length of the roll</text>
  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="520" y="450" width="300" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="670" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Automatic rollback</text>
  <text x="670" y="533" text-anchor="middle" font-size="20" fill="#64748B">a regression triggers it</text>
  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="890" y="450" width="290" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1035" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Promote in stages</text>
  <text x="1035" y="533" text-anchor="middle" font-size="20" fill="#64748B">wider slices, watched</text>

  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="60" y="600" width="760" height="100" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="440" y="657" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">An automated comparison, not a human watching a graph</text>
  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="890" y="600" width="290" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1035" y="657" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Full fleet on the new version</text>

  <g fill="none" stroke-width="2.5">
    <path d="M310,290 L362,290" stroke="#475569" stroke-width="2" marker-end="url(#m06-l07-deploy-pipeline-sl)"/>
    <path d="M620,290 L672,290" stroke="#7C3AED" stroke-width="2" marker-end="url(#m06-l07-deploy-pipeline-vi)"/>
    <path d="M930,290 L942,290" stroke="#3B82F6" marker-end="url(#m06-l07-deploy-pipeline-bl)"/>
    <path d="M1065,380 L1065,442" stroke="#059669" marker-end="url(#m06-l07-deploy-pipeline-em)"/>
    <path d="M1020,325 L1020,410 L670,410 L670,442" stroke="#DC2626" marker-end="url(#m06-l07-deploy-pipeline-rd)"/>
    <path d="M1035,570 L1035,592" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l07-deploy-pipeline-bl)"/>
    <path d="M620,720 L620,752" stroke="#475569" stroke-width="2" marker-end="url(#m06-l07-deploy-pipeline-sl)"/>
  </g>

  <text x="1085" y="420" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="880" y="400" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="595" y="745" text-anchor="end" font-size="20" fill="#64748B">if the change is at all risky</text>

  <rect x="40" y="760" width="1160" height="200" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="805" font-size="20" font-weight="600" fill="#334155">A risky change: shipping it and turning it on are separate steps</text>
  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="190" y="840" width="380" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="380" y="897" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shipped dark: switched off</text>
  <g filter="url(#m06-l07-deploy-pipeline-soft)">
    <rect x="670" y="840" width="380" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="860" y="897" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A flag flip turns it on</text>
  <path d="M570,890 L662,890" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#m06-l07-deploy-pipeline-em)"/>

  <line x1="60" y1="1000" x2="96" y2="1000" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1007" font-size="20" fill="#475569">The change moving forward, one gated step at a time</text>
  <line x1="60" y1="1040" x2="96" y2="1040" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1047" font-size="20" fill="#475569">Clean metrics: promote, or turn the flag on</text>
  <line x1="60" y1="1080" x2="96" y2="1080" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1087" font-size="20" fill="#475569">A regression: undo automatically, no human in the loop</text>
</svg>