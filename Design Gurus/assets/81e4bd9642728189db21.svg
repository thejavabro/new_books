<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Incoming requests are split into two bounded pools inside one caller service: a Payments pool of 30 threads whose healthy service keeps checkout working, and a Recommendations pool of 10 threads whose hanging service can strand at most 10 threads and no more.">
  <defs>
    <marker id="m04-l05-bulkheads-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l05-bulkheads-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l05-bulkheads-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m04-l05-bulkheads-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <rect x="300" y="110" width="880" height="200" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="320" y="150" font-size="20" font-weight="600" fill="#065F46">Payments compartment</text>
  <text x="1160" y="150" text-anchor="end" font-size="20" fill="#64748B">healthy, and unaffected by its neighbor</text>

  <rect x="300" y="390" width="880" height="200" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="320" y="430" font-size="20" font-weight="600" fill="#B91C1C">Recommendations compartment</text>
  <text x="1160" y="430" text-anchor="end" font-size="20" fill="#64748B">a silent hang, with no errors to count</text>

  <text x="620" y="356" text-anchor="middle" font-size="20" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The bulkhead: separate pools, so a hang cannot cross</text>

  <g fill="none" stroke-width="2.5">
    <path d="M280,325 C312,325 300,250 314,250" stroke="#3B82F6" marker-end="url(#m04-l05-bulkheads-bl)"/>
    <path d="M280,375 C312,375 300,530 314,530" stroke="#3B82F6" marker-end="url(#m04-l05-bulkheads-bl)"/>
    <path d="M570,250 L632,250" stroke="#3B82F6" marker-end="url(#m04-l05-bulkheads-bl)"/>
    <path d="M940,250 L992,250" stroke="#059669" marker-end="url(#m04-l05-bulkheads-em)"/>
    <path d="M570,530 L632,530" stroke="#DC2626" marker-end="url(#m04-l05-bulkheads-rd)"/>
    <path d="M940,530 L992,530" stroke="#DC2626" marker-end="url(#m04-l05-bulkheads-rd)"/>
  </g>

  <text x="605" y="182" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">normal calls</text>
  <text x="970" y="182" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fast replies</text>
  <text x="605" y="462" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">calls hang</text>
  <text x="970" y="462" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">damage capped</text>

  <g filter="url(#m04-l05-bulkheads-soft)">
    <rect x="60" y="300" width="220" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="170" y="341" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Incoming</text>
  <text x="170" y="373" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">requests</text>

  <g filter="url(#m04-l05-bulkheads-soft)">
    <rect x="320" y="200" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="445" y="241" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments pool</text>
  <text x="445" y="273" text-anchor="middle" font-size="20" fill="#1E40AF">30 threads</text>
  <g filter="url(#m04-l05-bulkheads-soft)">
    <rect x="640" y="200" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="790" y="241" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments service</text>
  <text x="790" y="273" text-anchor="middle" font-size="20" fill="#64748B">healthy</text>
  <g filter="url(#m04-l05-bulkheads-soft)">
    <rect x="1000" y="200" width="180" height="100" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1090" y="241" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="1090" y="273" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">keeps working</text>

  <g filter="url(#m04-l05-bulkheads-soft)">
    <rect x="320" y="480" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="445" y="521" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Recommendations</text>
  <text x="445" y="553" text-anchor="middle" font-size="20" fill="#1E40AF">pool: 10 threads</text>
  <g filter="url(#m04-l05-bulkheads-soft)">
    <rect x="640" y="480" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="790" y="521" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Recommendations service</text>
  <text x="790" y="553" text-anchor="middle" font-size="20" fill="#64748B">hanging, no error to count</text>
  <g filter="url(#m04-l05-bulkheads-soft)">
    <rect x="1000" y="480" width="180" height="100" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1090" y="521" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">At most 10</text>
  <text x="1090" y="553" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">threads stuck</text>

  <line x1="60" y1="640" x2="96" y2="640" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="647" font-size="20" fill="#475569">Live requests into a bounded pool</text>
  <line x1="60" y1="680" x2="96" y2="680" stroke="#059669" stroke-width="4"/>
  <text x="108" y="687" font-size="20" fill="#475569">The healthy compartment keeps serving</text>
  <line x1="60" y1="720" x2="96" y2="720" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="727" font-size="20" fill="#475569">Hung calls, contained to one pool</text>
</svg>