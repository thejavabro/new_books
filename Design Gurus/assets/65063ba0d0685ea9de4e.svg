<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="IP hash load balancing hashes each client&#39;s IP address, so John always reaches Server 3 and Sarah always reaches Server 1.">
  <defs>
    <marker id="lb05-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="lb05-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="lb05-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lb05-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lb05-k1"><rect x="70" y="130" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="lb05-k2"><rect x="70" y="330" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="lb05-k3"><rect x="510" y="235" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="lb05-k4"><rect x="950" y="80" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="lb05-k5"><rect x="950" y="235" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="lb05-k6"><rect x="950" y="390" width="180" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="620" y="42" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">5. IP Hash</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M240,175 H363 Q375,175 375,187 V250 Q375,262 387,262 H510" marker-end="url(#lb05-bl)"/>
    <path d="M240,375 H363 Q375,375 375,363 V310 Q375,298 387,298 H510" marker-end="url(#lb05-bl)"/>
  </g>
  <g fill="none" stroke="#059669">
    <path d="M730,262 H828 Q840,262 840,250 V137 Q840,125 852,125 H950" stroke-width="2" marker-end="url(#lb05-em)"/>
    <path d="M730,298 H828 Q840,298 840,310 V423 Q840,435 852,435 H950" stroke-width="2" marker-end="url(#lb05-em)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="762" y="195" fill="#047857">hash(IP) % 3 = 0</text>
    <text x="762" y="382" fill="#047857">hash(IP) % 3 = 2</text>
  </g>

  
  <g filter="url(#lb05-soft)">
    <rect x="70" y="130" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#lb05-k1)"/>
  </g>
  <circle cx="108" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="134" y="182" font-size="18.5" font-weight="600" fill="#111827">John</text>
  <g filter="url(#lb05-soft)">
    <rect x="70" y="330" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#lb05-k2)"/>
  </g>
  <circle cx="108" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="134" y="382" font-size="18.5" font-weight="600" fill="#111827">Sarah</text>
  <g filter="url(#lb05-lift)">
    <rect x="510" y="235" width="220" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="510" y="235" width="9" height="90" fill="#64748B" clip-path="url(#lb05-k3)"/>
  </g>
  <circle cx="548" cy="280" r="18" fill="#FFFFFF"/>
  <g transform="translate(537.56,269.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="574" y="287" font-size="18.5" font-weight="600" fill="#111827">Load Balancer</text>
  <g filter="url(#lb05-soft)">
    <rect x="950" y="80" width="180" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="950" y="80" width="6" height="90" fill="#2563EB" clip-path="url(#lb05-k4)"/>
  </g>
  <circle cx="988" cy="125" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,114.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3.5" width="18" height="7.5" rx="1.5"/><rect x="3" y="13" width="18" height="7.5" rx="1.5"/><path d="M6.5 7.25h3M6.5 16.75h3M17 7.25h.01M17 16.75h.01"/>
  </g>
  <text x="1014" y="132" font-size="18.5" font-weight="600" fill="#111827">Server 1</text>
  <g filter="url(#lb05-soft)">
    <rect x="950" y="235" width="180" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="950" y="235" width="6" height="90" fill="#2563EB" clip-path="url(#lb05-k5)"/>
  </g>
  <circle cx="988" cy="280" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,269.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3.5" width="18" height="7.5" rx="1.5"/><rect x="3" y="13" width="18" height="7.5" rx="1.5"/><path d="M6.5 7.25h3M6.5 16.75h3M17 7.25h.01M17 16.75h.01"/>
  </g>
  <text x="1014" y="287" font-size="18.5" font-weight="600" fill="#111827">Server 2</text>
  <g filter="url(#lb05-soft)">
    <rect x="950" y="390" width="180" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="950" y="390" width="6" height="90" fill="#2563EB" clip-path="url(#lb05-k6)"/>
  </g>
  <circle cx="988" cy="435" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,424.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3.5" width="18" height="7.5" rx="1.5"/><rect x="3" y="13" width="18" height="7.5" rx="1.5"/><path d="M6.5 7.25h3M6.5 16.75h3M17 7.25h.01M17 16.75h.01"/>
  </g>
  <text x="1014" y="442" font-size="18.5" font-weight="600" fill="#111827">Server 3</text>

  
  <text x="155" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">192.168.1.10</text>
  <text x="155" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">10.0.4.77</text>
  <text x="620" y="350" font-size="15.5" text-anchor="middle" fill="#6B7280">the same client always lands on the same server</text>
</svg>