<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Left, targeted refactor of placing an order: about 7 engineer-days, the defects stop after about 1 week. Gains: fixes findings 1 to 5, Reorder ships as a 7-line route, one revert rolls it back, a later extraction stays possible. Cost: Dispatch still reads the orders table, recorded in ADR 0032. Right, rewrite of Orders as a separate service: 100 to 120 engineer-days, the defects stay for 10 to 12 weeks. Costs: about 350 to 420 more refunded sold-out orders, Reorder misses its 4-week date, each reservation needs a saga, and structure and behavior change at once. Gain: Orders can be released on its own.">
