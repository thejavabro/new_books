<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="628" viewBox="0 0 1240 628" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Ten minutes split into six segments whose widths match the minutes each step gets: one, one, one and a half, four, one and a half, and one. The four minute segment for one operation in full is by far the widest. Breadth is cut first: extra consumers, exhaustive operation lists and secondary hard parts.">
  <defs>
    <filter id="p3x-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3x-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3x-k1"><rect x="64" y="204" width="105" height="90" rx="12"/></clipPath>
    <clipPath id="p3x-k2"><rect x="181" y="204" width="105" height="90" rx="12"/></clipPath>
    <clipPath id="p3x-k3"><rect x="298" y="204" width="158" height="90" rx="12"/></clipPath>
    <clipPath id="p3x-k4"><rect x="468" y="204" width="421" height="90" rx="12"/></clipPath>
    <clipPath id="p3x-k5"><rect x="901" y="204" width="158" height="90" rx="12"/></clipPath>
    <clipPath id="p3x-k6"><rect x="1071" y="204" width="105" height="90" rx="12"/></clipPath>
    <clipPath id="p3x-k7"><rect x="64" y="420" width="357" height="48" rx="10"/></clipPath>
    <clipPath id="p3x-k8"><rect x="441" y="420" width="357" height="48" rx="10"/></clipPath>
    <clipPath id="p3x-k9"><rect x="818" y="420" width="358" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="628" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Ten minutes, still six steps</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each segment is as wide as the minutes it gets</text>

  
  <rect x="40" y="126" width="1160" height="216" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">How the ten minutes split</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">one operation in full takes four of the ten</text>

  
  <text x="116.5" y="190" text-anchor="middle" font-size="15.5" fill="#94A3B8">Step 1</text>
  <g filter="url(#p3x-soft)">
    <rect x="64" y="204" width="105" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="204" width="6" height="90" fill="#64748B" clip-path="url(#p3x-k1)"/>
  </g>
  <circle cx="116.5" cy="236" r="17" fill="#FFFFFF"/>
  <g transform="translate(107.14,226.64) scale(0.78)" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="116.5" y="279" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">1 min</text>
  <text x="116.5" y="319" text-anchor="middle" font-size="15.5" fill="#6B7280">consumer</text>

  
  <text x="233.5" y="190" text-anchor="middle" font-size="15.5" fill="#94A3B8">Step 2</text>
  <g filter="url(#p3x-soft)">
    <rect x="181" y="204" width="105" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="181" y="204" width="6" height="90" fill="#64748B" clip-path="url(#p3x-k2)"/>
  </g>
  <circle cx="233.5" cy="236" r="17" fill="#FFFFFF"/>
  <g transform="translate(224.14,226.64) scale(0.78)" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="233.5" y="279" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">1 min</text>
  <text x="233.5" y="319" text-anchor="middle" font-size="15.5" fill="#6B7280">resource</text>

  
  <text x="377" y="190" text-anchor="middle" font-size="15.5" fill="#94A3B8">Step 3</text>
  <g filter="url(#p3x-soft)">
    <rect x="298" y="204" width="158" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="298" y="204" width="6" height="90" fill="#64748B" clip-path="url(#p3x-k3)"/>
  </g>
  <circle cx="377" cy="236" r="17" fill="#FFFFFF"/>
  <g transform="translate(367.64,226.64) scale(0.78)" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="377" y="279" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">1.5 min</text>
  <text x="377" y="319" text-anchor="middle" font-size="15.5" fill="#6B7280">operations</text>

  
  <text x="678.5" y="190" text-anchor="middle" font-size="15.5" fill="#94A3B8">Step 4</text>
  <g filter="url(#p3x-lift)">
    <rect x="468" y="204" width="421" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="468" y="204" width="9" height="90" fill="#2563EB" clip-path="url(#p3x-k4)"/>
  </g>
  <circle cx="678.5" cy="236" r="17" fill="#FFFFFF"/>
  <g transform="translate(669.14,226.64) scale(0.78)" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="678.5" y="279" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">4 min</text>
  <text x="678.5" y="319" text-anchor="middle" font-size="15.5" fill="#6B7280">one operation in full</text>

  
  <text x="980" y="190" text-anchor="middle" font-size="15.5" fill="#94A3B8">Step 5</text>
  <g filter="url(#p3x-soft)">
    <rect x="901" y="204" width="158" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="901" y="204" width="6" height="90" fill="#D97706" clip-path="url(#p3x-k5)"/>
  </g>
  <circle cx="980" cy="236" r="17" fill="#FFFFFF"/>
  <g transform="translate(970.64,226.64) scale(0.78)" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="980" y="279" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">1.5 min</text>
  <text x="980" y="319" text-anchor="middle" font-size="15.5" fill="#6B7280">hard part</text>

  
  <text x="1123.5" y="190" text-anchor="middle" font-size="15.5" fill="#94A3B8">Step 6</text>
  <g filter="url(#p3x-soft)">
    <rect x="1071" y="204" width="105" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1071" y="204" width="6" height="90" fill="#059669" clip-path="url(#p3x-k6)"/>
  </g>
  <circle cx="1123.5" cy="236" r="17" fill="#FFFFFF"/>
  <g transform="translate(1114.14,226.64) scale(0.78)" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="1123.5" y="279" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">1 min</text>
  <text x="1123.5" y="319" text-anchor="middle" font-size="15.5" fill="#6B7280">trade-off</text>

  
  <rect x="40" y="366" width="1160" height="122" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="396" font-size="16.5" font-weight="600" fill="#BE185D">Cut breadth first</text>
  <text x="1176" y="396" text-anchor="end" font-size="15.5" fill="#6B7280">three things to drop</text>

  <g filter="url(#p3x-soft)">
    <rect x="64" y="420" width="357" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="420" width="6" height="48" fill="#DB2777" clip-path="url(#p3x-k7)"/>
  </g>
  <circle cx="98" cy="444" r="4.5" fill="#DB2777"/>
  <text x="122" y="451" font-size="18.5" font-weight="600" fill="#111827">extra consumers</text>

  <g filter="url(#p3x-soft)">
    <rect x="441" y="420" width="357" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="441" y="420" width="6" height="48" fill="#DB2777" clip-path="url(#p3x-k8)"/>
  </g>
  <circle cx="475" cy="444" r="4.5" fill="#DB2777"/>
  <text x="499" y="451" font-size="18.5" font-weight="600" fill="#111827">exhaustive operation lists</text>

  <g filter="url(#p3x-soft)">
    <rect x="818" y="420" width="358" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="818" y="420" width="6" height="48" fill="#DB2777" clip-path="url(#p3x-k9)"/>
  </g>
  <circle cx="852" cy="444" r="4.5" fill="#DB2777"/>
  <text x="876" y="451" font-size="18.5" font-weight="600" fill="#111827">secondary hard parts</text>

  
  <rect x="40" y="512" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="557" text-anchor="middle" font-size="16" fill="#475569">Never cut one complete operation, and never cut the cost of the choice.</text>
</svg>