<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One artifact running in three environments. The same tested build is promoted unchanged, and each environment supplies its own database, log level and payment settings at startup">
  <defs>
    <marker id="cf2-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="cf2-k1"><rect x="72" y="280" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf2-k2"><rect x="560" y="110" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="cf2-k3"><rect x="560" y="270" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="cf2-k4"><rect x="560" y="430" width="560" height="90" rx="12"/></clipPath>
    <filter id="cf2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cf2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <rect x="40" y="44" width="430" height="556" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#5B21B6">Built once</text>
  <rect x="510" y="44" width="690" height="556" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="534" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Run in every environment</text>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M402,325 H470 Q482,325 482,313 V167 Q482,155 494,155 H552" marker-end="url(#cf2-mviolet)"/>
    <path d="M402,325 H552" marker-end="url(#cf2-mviolet)"/>
    <path d="M402,325 H470 Q482,325 482,337 V463 Q482,475 494,475 H552" marker-end="url(#cf2-mviolet)"/>
  </g>
  <g filter="url(#cf2-lift)">
    <rect x="72" y="280" width="330" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="72" y="280" width="9" height="90" fill="#7C3AED" clip-path="url(#cf2-k1)"/>
  </g>
  <circle cx="110" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,314.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="136" y="332" font-size="18.5" font-weight="600" fill="#111827">One Tested Artifact</text>
  <text x="237" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">one build, one test run,</text>
  <text x="237" y="418" font-size="15.5" text-anchor="middle" fill="#94A3B8">promoted without changing,</text>
  <text x="237" y="441" font-size="15.5" text-anchor="middle" fill="#94A3B8">carrying none of the values</text>
  <g filter="url(#cf2-soft)">
    <rect x="560" y="110" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="560" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#cf2-k2)"/>
  </g>
  <circle cx="598" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(587.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="624" y="162" font-size="18.5" font-weight="600" fill="#111827">Development</text>
  <text x="840" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">database points at the local copy</text>
  <text x="840" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">log level DEBUG, payments in test mode</text>
  <g filter="url(#cf2-soft)">
    <rect x="560" y="270" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="560" y="270" width="6" height="90" fill="#2563EB" clip-path="url(#cf2-k3)"/>
  </g>
  <circle cx="598" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(587.56,304.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="624" y="322" font-size="18.5" font-weight="600" fill="#111827">Staging</text>
  <text x="840" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">database points at the staging copy</text>
  <text x="840" y="408" font-size="15.5" text-anchor="middle" fill="#94A3B8">log level INFO, payments in test mode</text>
  <g filter="url(#cf2-soft)">
    <rect x="560" y="430" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="560" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#cf2-k4)"/>
  </g>
  <circle cx="598" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(587.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="624" y="482" font-size="18.5" font-weight="600" fill="#111827">Production</text>
  <text x="840" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">database points at the live copy</text>
  <text x="840" y="568" font-size="15.5" text-anchor="middle" fill="#94A3B8">log level WARN, payments taking real money</text>
  <rect x="40" y="632" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="656" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="678" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">What stays the same</text>
  <text x="288" y="678" font-size="15.5" fill="#475569">the artifact: the build that passed the tests is the one that reaches production</text>
  <rect x="64" y="700" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="722" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">What changes</text>
  <text x="288" y="722" font-size="15.5" fill="#475569">only the values, supplied at startup, so no environment needs a build of its own</text>
</svg>