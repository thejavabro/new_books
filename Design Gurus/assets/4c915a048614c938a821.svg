<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The business logic layer holds OrderRepositoryInterface and calls down to save or find an order; the data access layer holds PostgresOrderRepository, which implements that interface, returns the order, and queries and saves to the database, which returns data">
