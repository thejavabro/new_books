<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two servers whose clocks differ by a few hundred milliseconds stamp events so that the later event carries the earlier timestamp, and sorting by timestamp reverses what really happened">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>
  <defs>
    <marker id="id6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two servers, 400 ms apart, and an order that reverses itself</text>

  <text x="250" y="120" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">what really happened</text>

  <rect x="90" y="150" width="320" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="250" y="192" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">1. order placed</text>
  <line x1="250" y1="224" x2="250" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#id6-slate)"/>
  <rect x="90" y="272" width="320" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="250" y="314" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">2. order paid</text>

  <text x="820" y="120" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">what the timestamps say</text>

  <rect x="580" y="150" width="480" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="700" y="192" font-size="20" fill="#1E40AF" text-anchor="middle">server A</text>
  <text x="920" y="192" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">10:00:02.500</text>
  <rect x="580" y="272" width="480" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="700" y="314" font-size="20" fill="#B91C1C" text-anchor="middle">server B</text>
  <text x="920" y="314" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">10:00:02.100</text>

  <text x="1090" y="192" font-size="20" fill="#64748B">later</text>
  <text x="1090" y="314" font-size="20" font-weight="600" fill="#B91C1C">earlier</text>

  <rect x="50" y="386" width="1140" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="428" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Sort by timestamp and the payment appears to happen before the order it paid for.</text>

  <rect x="50" y="486" width="1140" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="520" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">NTP keeps clocks close, not identical. A few hundred milliseconds of skew is normal,</text>
  <text x="620" y="550" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">and events can be closer together than the skew.</text>

  <rect x="50" y="596" width="1140" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">If the order matters, carry it in the data: a sequence number, a version, or a causal reference.</text>
</svg>