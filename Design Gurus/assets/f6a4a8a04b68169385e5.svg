<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="588" viewBox="0 0 1240 588" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two internal hosts using the same private port share one public IP address, kept apart by the different source ports the NAT router assigns to each">
  <rect x="0" y="0" width="1240" height="588" fill="#FFFFFF"/>
  <defs>
    <marker id="nw4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="nw4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two machines, one public address, and the port that keeps them apart</text>

  <line x1="294" y1="170" x2="372" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#nw4-slate)"/>
  <line x1="294" y1="270" x2="372" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#nw4-slate)"/>
  <line x1="764" y1="220" x2="842" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#nw4-slate)"/>

  <g filter="url(#nw4-soft)">
    <rect x="50" y="140" width="240" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="50" y="240" width="240" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="380" y="120" width="380" height="200" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="850" y="150" width="300" height="140" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>

  <text x="170" y="177" font-size="20" fill="#334155" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">192.168.1.10:5001</text>
  <text x="170" y="277" font-size="20" fill="#334155" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">192.168.1.11:5001</text>

  <text x="570" y="160" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">NAT router</text>
  <text x="570" y="192" font-size="20" fill="#5B21B6" text-anchor="middle">public IP 203.0.113.7</text>
  <text x="570" y="240" font-size="20" fill="#5B21B6" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">.10:5001 -&gt; :40001</text>
  <text x="570" y="276" font-size="20" fill="#5B21B6" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">.11:5001 -&gt; :40002</text>

  <text x="1000" y="188" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">The server sees only</text>
  <text x="1000" y="226" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">203.0.113.7:40001</text>
  <text x="1000" y="262" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">203.0.113.7:40002</text>

  <rect x="50" y="366" width="1140" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="620" y="408" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">A reply to port 40002 means host .11, and only the NAT table knows that.</text>

  
  <rect x="50" y="466" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="502" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Both hosts picked the same private port. The router made them distinguishable, not the hosts.</text>
  <text x="620" y="532" font-size="20" fill="#334155" text-anchor="middle">This is also why an outside machine cannot start a connection inward: there is no mapping yet.</text>
</svg>