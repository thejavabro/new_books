<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="586" viewBox="0 0 1240 586" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A comparison of layer 4 and layer 7 load balancers. Layer 4 reads only the IP address and port. Layer 7 reads the path, headers and cookies, so it can route on the content of the request.">
  <rect x="0" y="0" width="1240" height="586" fill="#FFFFFF"/>
  <defs>
    <marker id="lb4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lb4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lb4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lb4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lb4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lb4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lb4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lb4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two kinds of load balancer</text>
  <g filter="url(#lb4-soft)"><rect x="400" y="56" width="400" height="40" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="600" y="84" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">Layer 4</text>
  <g filter="url(#lb4-soft)"><rect x="816" y="56" width="400" height="40" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="1016" y="84" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">Layer 7</text>
  <rect x="24" y="106" width="360" height="86" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="156" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">What it reads</text>
  <g filter="url(#lb4-soft)"><rect x="400" y="106" width="400" height="86" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="600" y="156" font-size="19" fill="#0F172A" text-anchor="middle">The IP address and the port</text>
  <g filter="url(#lb4-soft)"><rect x="816" y="106" width="400" height="86" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="1016" y="156" font-size="19" fill="#0F172A" text-anchor="middle">The path, the headers, the cookies</text>
  <rect x="24" y="202" width="360" height="86" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="252" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Does it read the request?</text>
  <g filter="url(#lb4-soft)"><rect x="400" y="202" width="400" height="86" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="600" y="252" font-size="19" fill="#0F172A" text-anchor="middle">No</text>
  <g filter="url(#lb4-soft)"><rect x="816" y="202" width="400" height="86" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="1016" y="252" font-size="19" fill="#0F172A" text-anchor="middle">Yes</text>
  <rect x="24" y="298" width="360" height="86" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="332" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Can it send /api and /images</text>
  <text x="48" y="360" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">to different servers?</text>
  <g filter="url(#lb4-soft)"><rect x="400" y="298" width="400" height="86" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="600" y="348" font-size="19" fill="#0F172A" text-anchor="middle">No</text>
  <g filter="url(#lb4-soft)"><rect x="816" y="298" width="400" height="86" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="1016" y="348" font-size="19" fill="#0F172A" text-anchor="middle">Yes</text>
  <rect x="24" y="394" width="360" height="86" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="444" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Speed</text>
  <g filter="url(#lb4-soft)"><rect x="400" y="394" width="400" height="86" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="600" y="444" font-size="19" fill="#0F172A" text-anchor="middle">Faster, it reads less</text>
  <g filter="url(#lb4-soft)"><rect x="816" y="394" width="400" height="86" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="1016" y="444" font-size="19" fill="#0F172A" text-anchor="middle">A little slower, it reads more</text>
  <rect x="24" y="490" width="360" height="86" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="540" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Where you meet it</text>
  <g filter="url(#lb4-soft)"><rect x="400" y="490" width="400" height="86" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="600" y="540" font-size="19" fill="#0F172A" text-anchor="middle">Any traffic, not only web</text>
  <g filter="url(#lb4-soft)"><rect x="816" y="490" width="400" height="86" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="1016" y="540" font-size="19" fill="#0F172A" text-anchor="middle">Most web systems today</text>
</svg>