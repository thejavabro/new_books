<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1134" viewBox="0 0 1240 1134" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated ad click aggregator architecture: fast redirect ingestion, Flink windowed aggregation, dashboard reads and the nightly batch correction">
  <defs>
    <filter id="ac-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="ac-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ac-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ac-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ac-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ac-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1134" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Ad click aggregator: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Redirect in under 20ms, aggregate in memory, and reconcile the numbers overnight</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Ingestion · the user is waiting, so nothing slow happens here</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ac-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <path d="M577,194 L662,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ac-amber)"/>
  <text x="620" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">async</text>
  <path d="M577,194 L975,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#ac-blue)"/>
  <text x="776" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">redirect</text>
  <g filter="url(#ac-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="979" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">clicks a banner</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ingestion</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">checks the HMAC</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="776" y="262" font-size="20" fill="#92400E" text-anchor="middle">keyed by ad id</text>
  <text x="1089" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Advertiser</text>
  <text x="1089" y="216" font-size="20" fill="#64748B" text-anchor="middle">302, never 301</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#92400E">2. Aggregation · 10,000 events become one number</text>
  <path d="M264,436 L349,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ac-amber)"/>
  <text x="307" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consume</text>
  <path d="M577,436 L662,436" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ac-emerald)"/>
  <text x="620" y="424" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">seen?</text>
  <path d="M890,436 L975,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ac-amber)"/>
  <text x="933" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">flush</text>
  <g filter="url(#ac-soft)">
    <path d="M40,413 L40,459 A110,15 0 0 0 260,459 L260,413" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="150" cy="413" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="353" y="398" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M666,413 L666,459 A110,15 0 0 0 886,459 L886,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="413" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M979,413 L979,459 A110,15 0 0 0 1199,459 L1199,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="413" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="150" y="504" font-size="20" fill="#92400E" text-anchor="middle">same ad, same task</text>
  <text x="463" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Flink</text>
  <text x="463" y="458" font-size="20" fill="#64748B" text-anchor="middle">1 minute windows</text>
  <text x="776" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Dedup set</text>
  <text x="776" y="504" font-size="20" fill="#065F46" text-anchor="middle">in the window only</text>
  <text x="1089" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cassandra</text>
  <text x="1089" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">ad id, then minute</text>

  <rect x="24" y="580" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#1E40AF">3. Dashboard · a day is 1,440 rows, read sequentially</text>
  <path d="M364,678 L456,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ac-blue)"/>
  <text x="410" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">query</text>
  <path d="M784,678 L876,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ac-blue)"/>
  <text x="830" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>
  <g filter="url(#ac-soft)">
    <rect x="40" y="640" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M460,655 L460,701 A160,15 0 0 0 780,701 L780,655" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="655" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M880,655 L880,701 A160,15 0 0 0 1200,701 L1200,655" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="655" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Advertiser</text>
  <text x="200" y="700" font-size="20" fill="#64748B" text-anchor="middle">opens the report</text>
  <text x="620" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis</text>
  <text x="620" y="746" font-size="20" fill="#065F46" text-anchor="middle">30s hot, 24h cold</text>
  <text x="1040" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cassandra</text>
  <text x="1040" y="746" font-size="20" fill="#5B21B6" text-anchor="middle">a range scan, no seek</text>

  <rect x="24" y="822" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="854" font-size="20" font-weight="600" fill="#92400E">4. Billing accuracy · streaming is fast, batch is right</text>
  <path d="M364,920 L456,920" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ac-amber)"/>
  <text x="410" y="908" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replay</text>
  <path d="M784,920 L876,920" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ac-amber)"/>
  <text x="830" y="908" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">overwrite</text>
  <g filter="url(#ac-soft)">
    <path d="M40,897 L40,943 A160,15 0 0 0 360,943 L360,897" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="200" cy="897" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="460" y="882" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M880,897 L880,943 A160,15 0 0 0 1200,943 L1200,897" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="897" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3 raw log</text>
  <text x="200" y="988" font-size="20" fill="#5B21B6" text-anchor="middle">Parquet, replayable</text>
  <text x="620" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Nightly Spark</text>
  <text x="620" y="942" font-size="20" fill="#64748B" text-anchor="middle">recomputes exactly</text>
  <text x="1040" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Corrected</text>
  <text x="1040" y="988" font-size="20" fill="#5B21B6" text-anchor="middle">overwrites the counters</text>
  <line x1="44" y1="1094" x2="72" y2="1094" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1101" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1094" x2="344.576" y2="1094" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1101" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1085" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1101" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1085" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1101" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1085" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1101" font-size="20" fill="#475569">core service</text>
</svg>