<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five steps of an object oriented design answer">
  <defs>
    <marker id="oodi1-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oodi1-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oodi1-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oodi1-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oodi1-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oodi1-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oodi1-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oodi1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oodi1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oodi1-a0"><rect x="64" y="86" width="540" height="84" rx="12"/></clipPath>
    <clipPath id="oodi1-a1"><rect x="636" y="86" width="540" height="84" rx="12"/></clipPath>
    <clipPath id="oodi1-b0"><rect x="64" y="310" width="336" height="84" rx="12"/></clipPath>
    <clipPath id="oodi1-b1"><rect x="452" y="310" width="336" height="84" rx="12"/></clipPath>
    <clipPath id="oodi1-b2"><rect x="840" y="310" width="336" height="84" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <rect x="34" y="62" width="1172" height="178" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="52" y="50" font-size="16.5" font-weight="600" fill="#475569">Understand the question</text>
  <rect x="34" y="286" width="1172" height="178" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="52" y="274" font-size="16.5" font-weight="600" fill="#1D4ED8">Build the model</text>
  <g filter="url(#oodi1-soft)">
    <rect x="64" y="86" width="540" height="84" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="86" width="6" height="84" fill="#64748B" clip-path="url(#oodi1-a0)"/>
  </g>
  <circle cx="102" cy="128.0" r="18" fill="#FFFFFF"/>
  <text x="102" y="134.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">1</text>
  <text x="132" y="134.5" font-size="18.5" font-weight="600" fill="#111827">Clarify the requirements</text>
  <text x="334" y="196" text-anchor="middle" font-size="15.5" fill="#6B7280">a written list of 8 to 12 lines</text>
  <text x="334" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">5 to 8 min</text>
  <g filter="url(#oodi1-soft)">
    <rect x="636" y="86" width="540" height="84" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="636" y="86" width="6" height="84" fill="#64748B" clip-path="url(#oodi1-a1)"/>
  </g>
  <circle cx="674" cy="128.0" r="18" fill="#FFFFFF"/>
  <text x="674" y="134.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">2</text>
  <text x="704" y="134.5" font-size="18.5" font-weight="600" fill="#111827">Find actors and use cases</text>
  <text x="906" y="196" text-anchor="middle" font-size="15.5" fill="#6B7280">who uses it, and what they do</text>
  <text x="906" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">3 to 5 min</text>
  <g filter="url(#oodi1-soft)">
    <rect x="64" y="310" width="336" height="84" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="310" width="6" height="84" fill="#2563EB" clip-path="url(#oodi1-b0)"/>
  </g>
  <circle cx="102" cy="352.0" r="18" fill="#FFFFFF"/>
  <text x="102" y="358.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">3</text>
  <text x="132" y="358.5" font-size="18.5" font-weight="600" fill="#111827">Find the classes</text>
  <text x="232" y="420" text-anchor="middle" font-size="15.5" fill="#6B7280">one responsibility each</text>
  <text x="232" y="444" text-anchor="middle" font-size="15.5" fill="#94A3B8">8 to 10 min</text>
  <g filter="url(#oodi1-soft)">
    <rect x="452" y="310" width="336" height="84" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="452" y="310" width="6" height="84" fill="#7C3AED" clip-path="url(#oodi1-b1)"/>
  </g>
  <circle cx="490" cy="352.0" r="18" fill="#FFFFFF"/>
  <text x="490" y="358.5" font-size="17" font-weight="700" text-anchor="middle" fill="#7C3AED">4</text>
  <text x="520" y="358.5" font-size="18.5" font-weight="600" fill="#111827">Connect the classes</text>
  <text x="620" y="420" text-anchor="middle" font-size="15.5" fill="#6B7280">relationships and multiplicity</text>
  <text x="620" y="444" text-anchor="middle" font-size="15.5" fill="#94A3B8">8 to 10 min</text>
  <g filter="url(#oodi1-soft)">
    <rect x="840" y="310" width="336" height="84" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="840" y="310" width="6" height="84" fill="#059669" clip-path="url(#oodi1-b2)"/>
  </g>
  <circle cx="878" cy="352.0" r="18" fill="#FFFFFF"/>
  <text x="878" y="358.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">5</text>
  <text x="908" y="358.5" font-size="18.5" font-weight="600" fill="#111827">Write the code</text>
  <text x="1008" y="420" text-anchor="middle" font-size="15.5" fill="#6B7280">two or three main flows</text>
  <text x="1008" y="444" text-anchor="middle" font-size="15.5" fill="#94A3B8">12 to 15 min</text>
  <path d="M604,128 L636,128" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi1-arrow-slate)"/>
  <path d="M1176,128 H1196 Q1212,128 1212,144 V256 Q1212,272 1196,272 H248 Q232,272 232,288 V310" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi1-arrow-slate)"/>
  <path d="M400,352 L452,352" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#oodi1-arrow-blue)"/>
  <path d="M788,352 L840,352" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#oodi1-arrow-violet)"/>
  <rect x="64" y="494" width="1112" height="112" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="86" y="511" width="148" height="24" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <text x="160" y="528" font-size="14" font-weight="600" text-anchor="middle" fill="#475569">before any class</text>
  <text x="244.4" y="528" font-size="15.5" fill="#6B7280">about a quarter of the hour goes here, before a class is named</text>
  <rect x="86" y="543" width="132" height="24" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="152" y="560" font-size="14" font-weight="600" text-anchor="middle" fill="#047857">not everything</text>
  <text x="227.60000000000002" y="560" font-size="15.5" fill="#6B7280">two or three flows written properly beats twelve classes written shallowly</text>
</svg>