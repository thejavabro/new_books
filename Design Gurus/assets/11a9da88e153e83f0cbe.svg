<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1310" viewBox="0 0 1240 1310" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One logical request delivered twice across three participants: merchant server, idempotency record, and payment. Attempt A with key K creates one payment, but its response is lost. Attempt B carries the same key and returns the same stored status, Location and body. No second payment is created.">
  <defs>
    <marker id="p12-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p12-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p12-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p12-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p12-k1"><rect x="80" y="96" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p12-k2"><rect x="450" y="96" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p12-k3"><rect x="820" y="96" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p12-k4"><rect x="320" y="332" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p12-k5"><rect x="320" y="462" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p12-k6"><rect x="320" y="592" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p12-k7"><rect x="320" y="804" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p12-k8"><rect x="320" y="934" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p12-k9"><rect x="320" y="1064" width="600" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1310" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="200" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One logical request, several deliveries</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">three participants</text>

  
  <g filter="url(#p12-soft)">
    <rect x="80" y="96" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="96" width="6" height="90" fill="#2563EB" clip-path="url(#p12-k1)"/>
  </g>
  <circle cx="118" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,130.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="144" y="148" font-size="18.5" font-weight="600" fill="#111827">Merchant server</text>
  <text x="250" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">sends attempt A, then retries</text>

  
  <g filter="url(#p12-soft)">
    <rect x="450" y="96" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="96" width="6" height="90" fill="#7C3AED" clip-path="url(#p12-k2)"/>
  </g>
  <circle cx="488" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,130.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="514" y="148" font-size="18.5" font-weight="600" fill="#111827">Idempotency record</text>
  <text x="620" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">key + request fingerprint + stored response</text>

  
  <g filter="url(#p12-soft)">
    <rect x="820" y="96" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="820" y="96" width="6" height="90" fill="#059669" clip-path="url(#p12-k3)"/>
  </g>
  <circle cx="858" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,130.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="884" y="148" font-size="18.5" font-weight="600" fill="#111827">Payment</text>
  <text x="990" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">created once, never twice</text>

  
  <rect x="40" y="272" width="1160" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="302" font-size="16.5" font-weight="600" fill="#475569">Attempt A, the first delivery of key K</text>
  <text x="1176" y="302" text-anchor="end" font-size="15.5" fill="#6B7280">steps 1 to 3</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,420 V462" stroke="#64748B" marker-end="url(#p12-sl)"/>
    <path d="M620,550 V592" stroke="#64748B" marker-end="url(#p12-sl)"/>
  </g>

  
  <g filter="url(#p12-soft)">
    <rect x="320" y="332" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="332" width="6" height="48" fill="#2563EB" clip-path="url(#p12-k4)"/>
  </g>
  <circle cx="354" cy="356" r="4.5" fill="#2563EB"/>
  <text x="378" y="363" font-size="18.5" font-weight="600" fill="#111827">attempt A, key K</text>
  <text x="620" y="404" font-size="15.5" text-anchor="middle" fill="#6B7280">Merchant server to Idempotency record</text>

  
  <g filter="url(#p12-soft)">
    <rect x="320" y="462" width="600" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="320" y="462" width="6" height="48" fill="#059669" clip-path="url(#p12-k5)"/>
  </g>
  <circle cx="354" cy="486" r="4.5" fill="#059669"/>
  <text x="378" y="493" font-size="18.5" font-weight="600" fill="#111827">create once</text>
  <text x="620" y="534" font-size="15.5" text-anchor="middle" fill="#6B7280">Idempotency record to Payment, one payment exists from here on</text>

  
  <g filter="url(#p12-lift)">
    <rect x="320" y="592" width="600" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="320" y="592" width="9" height="48" fill="#DB2777" clip-path="url(#p12-k6)"/>
  </g>
  <circle cx="354" cy="616" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,607) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="378" y="623" font-size="18.5" font-weight="600" fill="#111827">201 + Location + body</text>
  <text x="620" y="664" font-size="15.5" text-anchor="middle" fill="#6B7280">Idempotency record to Merchant server</text>
  <text x="620" y="687" font-size="15.5" text-anchor="middle" fill="#94A3B8">response lost, the merchant server never sees it</text>

  
  <rect x="40" y="744" width="1160" height="417" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="774" font-size="16.5" font-weight="600" fill="#475569">Attempt B, the same key K arrives again</text>
  <text x="1176" y="774" text-anchor="end" font-size="15.5" fill="#6B7280">steps 4 and 5, then the outcome</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,892 V934" stroke="#64748B" marker-end="url(#p12-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,1022 V1064" stroke="#059669" marker-end="url(#p12-em)"/>
  </g>

  
  <g filter="url(#p12-soft)">
    <rect x="320" y="804" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="804" width="6" height="48" fill="#2563EB" clip-path="url(#p12-k7)"/>
  </g>
  <circle cx="354" cy="828" r="4.5" fill="#2563EB"/>
  <text x="378" y="835" font-size="18.5" font-weight="600" fill="#111827">attempt B, same key K</text>
  <text x="620" y="876" font-size="15.5" text-anchor="middle" fill="#6B7280">Merchant server to Idempotency record</text>

  
  <g filter="url(#p12-soft)">
    <rect x="320" y="934" width="600" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="320" y="934" width="6" height="48" fill="#059669" clip-path="url(#p12-k8)"/>
  </g>
  <circle cx="354" cy="958" r="4.5" fill="#059669"/>
  <text x="378" y="965" font-size="18.5" font-weight="600" fill="#111827">the same 201 + Location + body</text>
  <text x="620" y="1006" font-size="15.5" text-anchor="middle" fill="#6B7280">Idempotency record to Merchant server, from the stored response</text>

  
  <g filter="url(#p12-lift)">
    <rect x="320" y="1064" width="600" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="320" y="1064" width="9" height="48" fill="#059669" clip-path="url(#p12-k9)"/>
  </g>
  <circle cx="354" cy="1088" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,1079) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="378" y="1095" font-size="18.5" font-weight="600" fill="#111827">no second payment</text>
  <text x="620" y="1136" font-size="15.5" text-anchor="middle" fill="#6B7280">the payment created in attempt A is still the only one</text>

  
  <rect x="40" y="1193" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1238" text-anchor="middle" font-size="16" fill="#475569">The key is delivery identity. The server assigns resource identity once.</text>
</svg>