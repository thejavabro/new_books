<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="background-color:#ffffff">
<defs>
<marker id="fwb" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
<marker id="fwd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="50" width="250" height="92" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="50" width="250" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="155" y="69" text-anchor="middle" font-weight="bold">Marker  (context)</text>
<text x="42" y="98">- lat, lon : double</text>
<text x="42" y="118">- style : MarkerStyle</text>
<text x="42" y="136" font-size="11" fill="#414d60">one per marker, small</text>

<rect x="360" y="50" width="270" height="92" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="360" y="50" width="270" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="495" y="69" text-anchor="middle" font-weight="bold">MarkerStyleFactory</text>
<text x="372" y="98">- pool : Map&lt;String, MarkerStyle&gt;</text>
<text x="372" y="118">+ get(icon, colour, size) : MarkerStyle</text>
<text x="372" y="136" font-size="11" fill="#414d60">the only way to obtain one</text>

<rect x="360" y="228" width="270" height="112" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="360" y="228" width="270" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="495" y="247" text-anchor="middle" font-weight="bold">MarkerStyle  (flyweight)</text>
<text x="372" y="276">- icon, colour, sizePx   {final}</text>
<text x="372" y="298">+ draw(lat, lon)</text>
<text x="372" y="320" font-size="11" fill="#2f7a55">immutable, and shared by every marker</text>

<path d="M 284 96 L 355 96" stroke="#000000" fill="none" marker-end="url(#fwb)"/>
<text x="283" y="88" font-size="11" fill="#414d60">asks for a style</text>

<path d="M 495 146 L 495 224" stroke="#000000" fill="none" marker-start="url(#fwd)" marker-end="url(#fwb)"/>
<text x="506" y="190" font-size="11" fill="#414d60">pools and returns</text>

<path d="M 155 146 L 155 284 L 355 284" stroke="#000000" fill="none" marker-start="url(#fwd)" marker-end="url(#fwb)"/>
<text x="168" y="276" font-size="11" fill="#414d60">holds a reference to one</text>

<text x="660" y="252" font-size="12" fill="#2f7a55">Extrinsic state, the position,</text>
<text x="660" y="270" font-size="12" fill="#2f7a55">is passed into draw() and</text>
<text x="660" y="288" font-size="12" fill="#2f7a55">never stored here.</text>
<text x="660" y="316" font-size="12" fill="#b4322c">Store it, and sharing becomes</text>
<text x="660" y="334" font-size="12" fill="#b4322c">impossible.</text>

<rect x="30" y="362" width="900" height="42" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="388" font-size="12.5" fill="#414d60">The factory exists so nobody can construct a MarkerStyle directly. Without that, two identical styles can be created and the sharing quietly stops.</text>
</g>
</svg>