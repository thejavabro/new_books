<path d="M240,207 H294" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#rdb14-mem)"/>
<text x="234" y="212" text-anchor="end" font-size="15.5" font-weight="600" fill="#047857">tuple, one row</text>

