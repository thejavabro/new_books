<rect x="40" y="406" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="432" width="210" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="169" y="454" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">relation</text>
<text x="298" y="454" font-size="15.5" fill="#475569">the whole table, named Student. A relation is a set of tuples.</text>
<rect x="64" y="476" width="210" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="169" y="498" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">attribute</text>
<text x="298" y="498" font-size="15.5" fill="#475569">one named column, such as branch. Everyday word: field.</text>
<rect x="64" y="520" width="210" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="169" y="542" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">tuple</text>
<text x="298" y="542" font-size="15.5" fill="#475569">one row, holding one value for every attribute. Everyday word: record.</text>
<rect x="64" y="564" width="210" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="169" y="586" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">domain</text>
<text x="298" y="586" font-size="15.5" fill="#475569">the set of values a column may hold. For cgpa, a number from 0.0 to 10.0.</text>
<rect x="64" y="608" width="210" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="169" y="630" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">degree, cardinality</text>
<text x="298" y="630" font-size="15.5" fill="#475569">degree is the column count and never changes. Cardinality is the row count, and changes all day.</text>
</svg>