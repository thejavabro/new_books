<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An alert shows checkout errors at 6 percent. The dashboard shows errors started at 14:00 and only checkout is affected. Traces show payment service timeouts of 5 seconds. Logs show the connection pool was exhausted after a 13:58 release. The fix is a rollback, and errors drop to 0.2 percent.">
  <defs>
    <filter id="mo4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mo4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mo4-k1"><rect x="40" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="mo4-k2"><rect x="281" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="mo4-k3"><rect x="522" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="mo4-k4"><rect x="763" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="mo4-k5"><rect x="1004" y="140" width="196" height="90" rx="12"/></clipPath>
    <marker id="mo4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Finding the cause of a checkout failure</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each signal answers the next question, from "is something wrong?" to "why?".</text>



  <g fill="none" stroke-width="2">
    <path d="M236,185 H281" stroke="#64748B" marker-end="url(#mo4-m-slate)"/>
    <path d="M477,185 H522" stroke="#64748B" marker-end="url(#mo4-m-slate)"/>
    <path d="M718,185 H763" stroke="#64748B" marker-end="url(#mo4-m-slate)"/>
    <path d="M959,185 H1004" stroke="#64748B" marker-end="url(#mo4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#mo4-soft)">
    <rect x="40" y="140" width="196" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#mo4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Alert</text>
  <text x="138" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">checkout errors 6%</text>
  <text x="138" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">normally 0.2%</text>
  <g filter="url(#mo4-soft)">
    <rect x="281" y="140" width="196" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="281" y="140" width="6" height="90" fill="#64748B" clip-path="url(#mo4-k2)"/>
  </g>
  <circle cx="319" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(308.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="345" y="192" font-size="21.5" font-weight="600" fill="#111827">Dashboard</text>
  <text x="379" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">started at 14:00</text>
  <text x="379" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">only checkout</text>
  <g filter="url(#mo4-soft)">
    <rect x="522" y="140" width="196" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="522" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#mo4-k3)"/>
  </g>
  <circle cx="560" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(549.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="586" y="192" font-size="21.5" font-weight="600" fill="#111827">Traces</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">payment service</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">times out at 5 s</text>
  <g filter="url(#mo4-soft)">
    <rect x="763" y="140" width="196" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="763" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#mo4-k4)"/>
  </g>
  <circle cx="801" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(790.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="827" y="192" font-size="21.5" font-weight="600" fill="#111827">Logs</text>
  <text x="861" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">pool exhausted</text>
  <text x="861" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">after a 13:58 release</text>
  <g filter="url(#mo4-lift)">
    <rect x="1004" y="140" width="196" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="1004" y="140" width="9" height="90" fill="#059669" clip-path="url(#mo4-k5)"/>
  </g>
  <circle cx="1042" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(1031.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1068" y="192" font-size="21.5" font-weight="600" fill="#111827">Fix</text>
  <text x="1102" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">roll back</text>
  <text x="1102" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">errors back to 0.2%</text>

  <rect x="40" y="330" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Monitoring</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">the alert and the dashboard show that something is wrong</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Observability</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">the traces and the logs show why, without writing new code</text>
</svg>