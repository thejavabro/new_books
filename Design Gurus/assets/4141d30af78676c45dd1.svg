<rect x="456" y="96" width="120" height="44" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<text x="516" y="124" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Course</text>
<g stroke="#059669" stroke-width="1.5" fill="none">
<path d="M184,118 H270"/><path d="M370,118 H456"/><path d="M320,144 V172"/>
</g>
<text x="222" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">M</text>
<text x="418" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">N</text>
<ellipse cx="320" cy="192" rx="48" ry="20" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<text x="320" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">grade</text>
<path d="M320,222 V256" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#rdb11-mem)"/>
<text x="64" y="294" font-size="16.5" font-weight="600" fill="#111827">Enrolment</text>
<g stroke="#6EE7B7" stroke-width="1.2">
<rect x="64" y="306" width="170" height="38" fill="#D1FAE5"/>
<rect x="234" y="306" width="170" height="38" fill="#D1FAE5"/>
<rect x="404" y="306" width="170" height="38" fill="#A7F3D0"/>
<rect x="64" y="344" width="170" height="38" fill="#FFFFFF"/>
<rect x="234" y="344" width="170" height="38" fill="#FFFFFF"/>
<rect x="404" y="344" width="170" height="38" fill="#ECFDF5"/>
</g>
<g font-size="14.5" font-weight="600" fill="#047857">
<text x="78" y="331">student_id</text>
<text x="248" y="331">course_id</text>
<text x="418" y="331">grade</text>
</g>
<g font-size="14.5" fill="#111827">
<text x="78" y="369">4021</text>
<text x="248" y="369">CS101</text>
<text x="418" y="369">A</text>
</g>
<text x="320" y="412" text-anchor="middle" font-size="15.5" fill="#6B7280">the grade needs both keys, so it lives here</text>

<rect x="640" y="40" width="560" height="400" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="664" y="70" font-size="16.5" font-weight="600" fill="#5B21B6">One-to-many: it goes on the many side</text>
<rect x="664" y="96" width="120" height="44" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="724" y="124" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Employee</text>
<path d="M870,118 L920,92 L970,118 L920,144 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
