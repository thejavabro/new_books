<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="578" viewBox="0 0 1240 578" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A relationship attribute on a many to many link becomes a column in the join table, while on a one to many link it becomes a column on the many side">
<defs>
<marker id="rdb11-mem" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="rdb11-mvi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="578" fill="#FFFFFF"/>

<rect x="40" y="40" width="560" height="400" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#047857">Many-to-many: it goes in the join table</text>
<rect x="64" y="96" width="120" height="44" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
