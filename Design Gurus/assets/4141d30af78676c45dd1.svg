<g stroke="#7C3AED" stroke-width="1.5" fill="none">
<path d="M784,118 H870"/><path d="M970,118 H1056"/><path d="M920,144 V172"/>
</g>
<text x="822" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#5B21B6">N</text>
<text x="1018" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#5B21B6">1</text>
<ellipse cx="920" cy="192" rx="48" ry="20" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="920" y="198" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">position</text>
<path d="M920,222 V256" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#rdb11-mvi)"/>
<text x="664" y="294" font-size="16.5" font-weight="600" fill="#111827">Employee</text>
<g stroke="#C4B5FD" stroke-width="1.2">
<rect x="664" y="306" width="170" height="38" fill="#EDE9FE"/>
<rect x="834" y="306" width="170" height="38" fill="#EDE9FE"/>
<rect x="1004" y="306" width="170" height="38" fill="#DDD6FE"/>
<rect x="664" y="344" width="170" height="38" fill="#FFFFFF"/>
<rect x="834" y="344" width="170" height="38" fill="#FFFFFF"/>
<rect x="1004" y="344" width="170" height="38" fill="#F5F3FF"/>
</g>
<g font-size="14.5" font-weight="600" fill="#5B21B6">
<text x="678" y="331">employee_id</text>
<text x="848" y="331">department_id</text>
<text x="1018" y="331">position</text>
</g>
<g font-size="14.5" fill="#111827">
<text x="678" y="369">7</text>
<text x="848" y="369">D3</text>
<text x="1018" y="369">Manager</text>
</g>
<text x="920" y="412" text-anchor="middle" font-size="15.5" fill="#6B7280">one department each, so it fits beside the foreign key</text>

<rect x="40" y="474" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="512" font-size="16" fill="#475569">The rule in one line: a relationship attribute goes wherever the relationship itself went.</text>
</svg>