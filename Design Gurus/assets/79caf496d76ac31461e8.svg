<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="545" viewBox="0 0 1240 545" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six jobs an API gateway takes off the services: routing, aggregation, authentication, load balancing, caching, and protocol translation">
  <defs>
    <clipPath id="ag2-k1"><rect x="72" y="104" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="ag2-k2"><rect x="446" y="104" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="ag2-k3"><rect x="820" y="104" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="ag2-k4"><rect x="72" y="264" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="ag2-k5"><rect x="446" y="264" width="348" height="76" rx="12"/></clipPath>
    <clipPath id="ag2-k6"><rect x="820" y="264" width="348" height="76" rx="12"/></clipPath>
    <filter id="ag2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ag2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="545" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="360" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">What the gateway handles once, so no service repeats it</text>
  <g filter="url(#ag2-soft)">
    <rect x="72" y="104" width="348" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="104" width="6" height="76" fill="#2563EB" clip-path="url(#ag2-k1)"/>
  </g>
  <circle cx="110" cy="142" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,131.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="136" y="149" font-size="18.5" font-weight="600" fill="#111827">Routing</text>
  <text x="246" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">sends each request to the service that owns it</text>
  <g filter="url(#ag2-soft)">
    <rect x="446" y="104" width="348" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="446" y="104" width="6" height="76" fill="#2563EB" clip-path="url(#ag2-k2)"/>
  </g>
  <circle cx="484" cy="142" r="18" fill="#FFFFFF"/>
  <g transform="translate(473.56,131.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="510" y="149" font-size="18.5" font-weight="600" fill="#111827">Aggregation</text>
  <text x="620" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">calls several services, returns one response</text>
  <g filter="url(#ag2-soft)">
    <rect x="820" y="104" width="348" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="820" y="104" width="6" height="76" fill="#2563EB" clip-path="url(#ag2-k3)"/>
  </g>
  <circle cx="858" cy="142" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,131.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
  </g>
  <text x="884" y="149" font-size="18.5" font-weight="600" fill="#111827">Authentication</text>
  <text x="994" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">checks the caller once, passes identity on</text>
  <g filter="url(#ag2-soft)">
    <rect x="72" y="264" width="348" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="264" width="6" height="76" fill="#2563EB" clip-path="url(#ag2-k4)"/>
  </g>
  <circle cx="110" cy="302" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,291.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/><path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="136" y="309" font-size="18.5" font-weight="600" fill="#111827">Load Balancing</text>
  <text x="246" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">spreads requests across service instances</text>
  <g filter="url(#ag2-soft)">
    <rect x="446" y="264" width="348" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="446" y="264" width="6" height="76" fill="#2563EB" clip-path="url(#ag2-k5)"/>
  </g>
  <circle cx="484" cy="302" r="18" fill="#FFFFFF"/>
  <g transform="translate(473.56,291.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="510" y="309" font-size="18.5" font-weight="600" fill="#111827">Caching</text>
  <text x="620" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">answers repeat requests without a service call</text>
  <g filter="url(#ag2-soft)">
    <rect x="820" y="264" width="348" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="820" y="264" width="6" height="76" fill="#2563EB" clip-path="url(#ag2-k6)"/>
  </g>
  <circle cx="858" cy="302" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,291.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="884" y="309" font-size="18.5" font-weight="600" fill="#111827">Translation</text>
  <text x="994" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">converts between what the client and the service speak</text>
  <rect x="40" y="440" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="464" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="486" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">The trade</text>
  <text x="288" y="486" font-size="15.5" fill="#475569">each job here is work the services no longer repeat, and one more job that can slow the gateway down or make it fail</text>
</svg>