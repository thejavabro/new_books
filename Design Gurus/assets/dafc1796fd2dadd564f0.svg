<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="574" viewBox="0 0 1240 574" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="refresh-title refresh-desc">
<title id="refresh-title">Three ways to refresh before expiry</title>
<desc id="refresh-desc">Probabilistic early expiration lets each read refresh early with a probability that rises toward expiry. Serving stale while revalidating never blocks a reader. Scheduled refresh keeps a known hot set warm on a timer. Each charges a different party.</desc>
<defs>
<marker id="refresh-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="refresh-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="refresh-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="refresh-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="574" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three ways to refresh before expiry</text>
<text x="40" y="86" font-size="21" fill="#4A5568">These three differ in who pays.</text>
<rect x="40" y="496" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="496" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="352" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V464A6 6 0 0 0 46 470H54Z" fill="#5EC9EC"/>
<circle cx="92" cy="160" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="92" y="168" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="124" y="168" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Probabilistic</text>
<text x="124" y="194" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">early expiration</text>
<rect x="64" y="212" width="324" height="90" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="84" y="238" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">each read may refresh</text><text x="84" y="263" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">early, with probability</text><text x="84" y="288" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">rising toward expiry</text>
<text x="226" y="330" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">who pays</text>
<rect x="64" y="342" width="324" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="373" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A few unlucky readers</text>
<text x="226" y="422" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">no lock, no job, no hot-key list</text>
<rect x="434" y="118" width="372" height="352" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V464A6 6 0 0 0 440 470H448Z" fill="#F3CF6A"/>
<circle cx="486" cy="160" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="486" y="168" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="518" y="168" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Serve stale</text>
<text x="518" y="194" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">while revalidating</text>
<rect x="458" y="212" width="324" height="90" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="478" y="238" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">keep serving the old</text><text x="478" y="263" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">value while one request</text><text x="478" y="288" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">refreshes behind it</text>
<text x="620" y="330" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">who pays</text>
<rect x="458" y="342" width="324" height="50" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="373" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Correctness</text>
<text x="620" y="422" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a product decision, not a</text><text x="620" y="447" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">technical one</text>
<rect x="828" y="118" width="372" height="352" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V464A6 6 0 0 0 834 470H842Z" fill="#39D5AA"/>
<circle cx="880" cy="160" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="880" y="168" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="912" y="168" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Scheduled</text>
<text x="912" y="194" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">refresh</text>
<rect x="852" y="212" width="324" height="90" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="872" y="238" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">refresh the known hot</text><text x="872" y="263" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">keys on a timer, whether</text><text x="872" y="288" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">or not anyone reads</text>
<text x="1014" y="330" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">who pays</text>
<rect x="852" y="342" width="324" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="373" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A background job</text>
<text x="1014" y="422" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">needs a hot-key list that stays</text><text x="1014" y="447" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">current</text>
<text x="66" y="528" font-size="18" font-weight="400" fill="#080C50" text-anchor="start">All three prevent the miss rather than managing it, which is why they compose with coalescing instead of replacing it.</text>
</svg>