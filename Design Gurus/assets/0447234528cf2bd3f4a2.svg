<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="694" viewBox="0 0 1240 694" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The ratings before any middle is fixed">
<defs>
<filter id="ct-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="694" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many teams of three from [3, 6, 2, 8, 1, 5] rise or fall in order?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The three have to keep their positions, and their ratings must either all rise or all fall</text>
<rect x="40" y="106" width="1160" height="442" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Trying every triple would mean checking every combination of three positions</text>
<text x="210" y="228" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">ratings</text>
<rect x="232" y="190" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="290" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="290" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="364" y="190" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="422" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="422" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="496" y="190" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="554" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="554" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="628" y="190" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="686" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<text x="686" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="760" y="190" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="818" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="818" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="892" y="190" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="950" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="950" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<text x="620" y="330" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">Fix the middle soldier, and the other two become two independent counts</text>
<text x="620" y="360" text-anchor="middle" font-size="18" fill="#475569">A rising team needs a smaller one before and a bigger one after, and a falling team the reverse</text>
<rect x="40" y="570" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="610" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">For one middle, the number of teams is a product of two counts</text>
<text x="620" y="642" text-anchor="middle" font-size="18.5" fill="#475569">So the whole answer is a sum over the possible middles, not a search over triples</text>
</svg>