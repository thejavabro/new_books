<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1720" viewBox="0 0 1240 1720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="C4 container view. Learners and instructors use the web application, a TypeScript and React single-page application, over HTTPS. The web application calls the API application, a Python container holding nine modules, with JSON over HTTPS, watches video from the video service, uploads videos to it with the upload links the API requests, and downloads certificate PDFs from object storage through signed links. The API application reads and writes PostgreSQL with SQL, requests upload links from the video service, which sends status webhooks back, and creates checkouts at the payment provider, which sends payment webhooks back. The worker, a Python container built from the same image, claims jobs from PostgreSQL and reads and writes it, checks pending payments with the payment provider, sends email through the email service and stores certificate PDFs in object storage.">
