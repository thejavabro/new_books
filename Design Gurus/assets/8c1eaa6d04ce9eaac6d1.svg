<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="908" viewBox="0 0 1240 908" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="For one harm category, two policy thresholds and a borderline check map the model score to auto-allow, reduce or age-gate, human review, or auto-remove">
  <defs>
    <marker id="hcdal-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="hcdal-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="hcdal-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="hcdal-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="hcdal-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="hcdal-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="hcdal-k1"><rect x="303" y="116" width="254" height="90" rx="12"/></clipPath>
    <clipPath id="hcdal-k2"><rect x="881.5" y="116" width="251" height="90" rx="12"/></clipPath>
    <clipPath id="hcdal-k3"><rect x="104" y="350" width="258" height="90" rx="12"/></clipPath>
    <clipPath id="hcdal-k4"><rect x="491" y="350" width="258" height="90" rx="12"/></clipPath>
    <clipPath id="hcdal-k5"><rect x="878" y="350" width="258" height="90" rx="12"/></clipPath>
    <clipPath id="hcdal-k6"><rect x="104" y="570" width="258" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="908" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="696" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Action ladder: one harm category</text>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M303,161 H245 Q233,161 233,173 V350" marker-end="url(#hcdal-memerald)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M430,243 V272 Q430,284 442,284 H608 Q620,284 620,296 V350" marker-end="url(#hcdal-mviolet)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M557,161 H801.5 Q813.5,161 813.5,173 V383 Q813.5,395 825.5,395 H878" marker-end="url(#hcdal-mpink)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M1007,243 V350" marker-end="url(#hcdal-mpink)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M233,477 V570" marker-end="url(#hcdal-mamber)"/></g>
  <g filter="url(#hcdal-lift)">
    <rect x="303" y="116" width="254" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="303" y="116" width="9" height="90" fill="#2563EB" clip-path="url(#hcdal-k1)"/>
  </g>
  <circle cx="341" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(330.56,150.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="367" y="168" font-size="18.5" font-weight="600" fill="#111827">Heavy model score</text>
  <text x="430" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">from 0 to 1</text>
  <g filter="url(#hcdal-soft)">
    <rect x="881.5" y="116" width="251" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="881.5" y="116" width="6" height="90" fill="#4F46E5" clip-path="url(#hcdal-k2)"/>
  </g>
  <circle cx="919.5" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(909.06,150.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="945.5" y="168" font-size="18.5" font-weight="600" fill="#111827">Strong hash match</text>
  <text x="1007" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">known harmful media</text>
  <g filter="url(#hcdal-soft)">
    <rect x="104" y="350" width="258" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="104" y="350" width="6" height="90" fill="#059669" clip-path="url(#hcdal-k3)"/>
  </g>
  <circle cx="142" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(131.56,384.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="168" y="402" font-size="18.5" font-weight="600" fill="#111827">Auto-allow</text>
  <text x="233" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">normal distribution</text>
  <g filter="url(#hcdal-soft)">
    <rect x="491" y="350" width="258" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="491" y="350" width="6" height="90" fill="#7C3AED" clip-path="url(#hcdal-k4)"/>
  </g>
  <circle cx="529" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(518.56,384.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></g>
  <text x="555" y="402" font-size="18.5" font-weight="600" fill="#111827">Human review</text>
  <text x="620" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">a reviewer decides</text>
  <g filter="url(#hcdal-soft)">
    <rect x="878" y="350" width="258" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="878" y="350" width="6" height="90" fill="#DB2777" clip-path="url(#hcdal-k5)"/>
  </g>
  <circle cx="916" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(905.56,384.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="942" y="402" font-size="18.5" font-weight="600" fill="#111827">Auto-remove</text>
  <text x="1007" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">the evidence is very strong</text>
  <g filter="url(#hcdal-soft)">
    <rect x="104" y="570" width="258" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="104" y="570" width="6" height="90" fill="#D97706" clip-path="url(#hcdal-k6)"/>
  </g>
  <circle cx="142" cy="615" r="18" fill="#FFFFFF"/>
  <g transform="translate(131.56,604.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="168" y="622" font-size="18.5" font-weight="600" fill="#111827">Reduce or age-gate</text>
  <text x="233" y="685" font-size="15.5" text-anchor="middle" fill="#6B7280">lawful but awful</text>
  <text x="233" y="708" font-size="15.5" text-anchor="middle" fill="#94A3B8">stays up, limited reach</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="233" y="318" fill="#047857">below the low threshold</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="525" y="276" fill="#5B21B6">between the thresholds</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="813.5" y="318" fill="#BE185D">above the high threshold</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="1007" y="290" fill="#BE185D">acted on at once</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="233" y="529" fill="#B45309">borderline score high</text></g>
  <rect x="491" y="570" width="645" height="90" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="813.5" y="609" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">Thresholds set with Trust and Safety and Legal</text>
  <text x="813.5" y="634" text-anchor="middle" font-size="16" fill="#475569">per harm category and per region</text>
  <rect x="40" y="792" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="837" text-anchor="middle" font-size="16" fill="#475569">Thresholds are policy, not statistics.</text>
</svg>