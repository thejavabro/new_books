<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="836" viewBox="0 0 1240 836" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rebalance-title rebalance-desc">
<title id="rebalance-title">The rebalance loop</title>
<desc id="rebalance-desc">A batch that takes longer than the poll interval gets the consumer declared dead, the partition reassigned, and the same work restarted by a consumer that is equally slow. The group spends more time rebalancing than consuming.</desc>
<defs>
<marker id="rebalance-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="rebalance-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="rebalance-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="rebalance-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="836" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The rebalance loop</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The most common self-inflicted outage in a Kafka consumer is a rebalance loop.</text>
<rect x="40" y="758" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="758" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="1020" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="600" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A batch takes longer than max.poll.interval.ms, because a dependency slowed down</text>
<circle cx="60" cy="214" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="1020" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="600" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The coordinator declares the consumer dead and triggers a rebalance</text>
<circle cx="60" cy="282" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="1020" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="600" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The partition is reassigned, and the uncommitted batch starts again</text>
<circle cx="60" cy="350" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="1020" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="600" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The new owner is talking to the same slow dependency, so it also exceeds the interval</text>
<path d="M1116 350C1176 350 1176 146 1118 146" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1116 350C1176 350 1176 146 1118 146" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rebalance-marker-red)"/>
<rect x="1118" y="229" width="82" height="38" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1159" y="255" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">repeat</text>
<rect x="40" y="402" width="560" height="80" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="402" width="5" height="80" rx="2.5" fill="#F28B9D"/><text x="64" y="435" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Throughput collapses to near zero</text><text x="64" y="461" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">while every consumer appears to run.</text>
<rect x="640" y="402" width="560" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="402" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="664" y="435" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Default max.poll.interval.ms</text><text x="664" y="461" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">is five minutes. It is a deadline.</text>
<text x="40" y="522" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three fixes, cheapest first</text>
<rect x="40" y="540" width="430" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="255" y="574" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reduce max.poll.records</text>
<path d="M476 568H510" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M476 568H510" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rebalance-marker-slate)"/>
<rect x="520" y="540" width="680" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="540" y="574" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">smaller batches fit the deadline; usually enough on its own</text>
<rect x="40" y="608" width="430" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="255" y="642" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Raise the interval deliberately</text>
<path d="M476 636H510" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M476 636H510" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rebalance-marker-slate)"/>
<rect x="520" y="608" width="680" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="540" y="642" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">accepting that a genuinely dead consumer takes longer to detect</text>
<rect x="40" y="676" width="430" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="255" y="710" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Separate proof of life from progress</text>
<path d="M476 704H510" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M476 704H510" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rebalance-marker-slate)"/>
<rect x="520" y="676" width="680" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="540" y="710" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">process on a worker pool and use pause and resume on the partitions</text>
<text x="66" y="792" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The cooperative sticky assignor gives incremental rebalancing without changing protocol.</text>
</svg>