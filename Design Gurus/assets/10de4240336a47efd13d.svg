    <marker id="m07c-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="m07c-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The four core components of event-driven architecture</text>


  <rect x="40" y="110" width="290" height="514" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Producer</text>
  <rect x="56" y="370" width="258" height="236" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="80" y="400" font-size="19.5" font-weight="600" fill="#1D4ED8">Examples</text>
  <rect x="420" y="110" width="340" height="514" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="444" y="140" font-size="19.5" font-weight="600" fill="#5B21B6">2. Event channel</text>
  <rect x="436" y="430" width="308" height="162" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="460" y="460" font-size="19.5" font-weight="600" fill="#5B21B6">Responsibilities</text>
  <rect x="880" y="110" width="320" height="610" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="904" y="140" font-size="19.5" font-weight="600" fill="#047857">3. Consumers</text>

  <g fill="none" stroke-width="2">
    <path d="M306,295 H444" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m07c-m-blue)"/>
    <path d="M736,295 H838 Q850,295 850,283 V272 Q850,260 862,260 H896" stroke="#7C3AED" marker-end="url(#m07c-m-violet)"/>
    <path d="M736,295 H838 Q850,295 850,307 V368 Q850,380 862,380 H896" stroke="#7C3AED" marker-end="url(#m07c-m-violet)"/>
    <path d="M736,295 H838 Q850,295 850,307 V488 Q850,500 862,500 H896" stroke="#7C3AED" marker-end="url(#m07c-m-violet)"/>
    <path d="M736,295 H838 Q850,295 850,307 V608 Q850,620 862,620 H896" stroke="#7C3AED" marker-end="url(#m07c-m-violet)"/>
    <path d="M190,624 V793 Q190,805 202,805 H405" stroke="#D97706" stroke-dasharray="7 6" marker-end="url(#m07c-m-amber)"/>
    <path d="M1040,720 V793 Q1040,805 1028,805 H775" stroke="#D97706" stroke-dasharray="7 6" marker-end="url(#m07c-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="375" y="258" fill="#1D4ED8">Publish</text>
    <text x="375" y="280" fill="#1D4ED8">event</text>
    <text x="805" y="330" fill="#5B21B6">Deliver</text>
    <text x="805" y="352" fill="#5B21B6">events</text>
    <text x="300" y="793" fill="#B45309">validates against</text>
    <text x="905" y="793" fill="#B45309">validates against</text>
  </g>

  <g filter="url(#m07c-soft)">
    <rect x="64" y="250" width="242" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="250" width="6" height="90" fill="#2563EB" clip-path="url(#m07c-k1)"/>
  </g>
  <circle cx="102" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,284.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="128" y="302" font-size="21.5" font-weight="600" fill="#111827">Order service</text>
  <g filter="url(#m07c-lift)">
    <rect x="444" y="250" width="292" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="444" y="250" width="9" height="90" fill="#7C3AED" clip-path="url(#m07c-k2)"/>
  </g>
  <circle cx="482" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(471.56,284.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="508" y="302" font-size="21.5" font-weight="600" fill="#111827">Event broker</text>
  <text x="590" y="369" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, Kafka, RabbitMQ)</text>
  <g filter="url(#m07c-soft)">
    <rect x="896" y="225" width="288" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="896" y="225" width="6" height="70" fill="#059669" clip-path="url(#m07c-k3)"/>
  </g>
  <circle cx="934" cy="260" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,249.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="960" y="267" font-size="20" font-weight="600" fill="#111827">Inventory service</text>
  <text x="1040" y="324" font-size="18.5" text-anchor="middle" fill="#6B7280">Reserves stock</text>
  <g filter="url(#m07c-soft)">
    <rect x="896" y="345" width="288" height="70" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="896" y="345" width="6" height="70" fill="#D97706" clip-path="url(#m07c-k4)"/>
  </g>
  <circle cx="934" cy="380" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,369.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="960" y="387" font-size="20" font-weight="600" fill="#111827">Payment service</text>
  <text x="1040" y="444" font-size="18.5" text-anchor="middle" fill="#6B7280">Processes payment</text>
  <g filter="url(#m07c-soft)">
    <rect x="896" y="465" width="288" height="70" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="896" y="465" width="6" height="70" fill="#4F46E5" clip-path="url(#m07c-k5)"/>
  </g>
  <circle cx="934" cy="500" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,489.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="960" y="507" font-size="20" font-weight="600" fill="#111827">Notification service</text>
  <text x="1040" y="564" font-size="18.5" text-anchor="middle" fill="#6B7280">Sends confirmation email</text>
  <g filter="url(#m07c-soft)">
    <rect x="896" y="585" width="288" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="896" y="585" width="6" height="70" fill="#2563EB" clip-path="url(#m07c-k6)"/>
  </g>
  <circle cx="934" cy="620" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,609.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="960" y="627" font-size="20" font-weight="600" fill="#111827">Analytics service</text>
  <text x="1040" y="684" font-size="18.5" text-anchor="middle" fill="#6B7280">Tracks events for analytics</text>
  <g filter="url(#m07c-soft)">
    <rect x="405" y="760" width="370" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="405" y="760" width="6" height="90" fill="#D97706" clip-path="url(#m07c-k7)"/>
  </g>
  <circle cx="443" cy="805" r="18" fill="#FFFFFF"/>
  <g transform="translate(432.56,794.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="469" y="812" font-size="21.5" font-weight="600" fill="#111827">4. Event schema / registry</text>
  <text x="590" y="879" font-size="18.5" text-anchor="middle" fill="#6B7280">Defines the structure of events and manages schema versions</text>
  <text x="590" y="906" font-size="18.5" text-anchor="middle" fill="#94A3B8">(for example, Avro, JSON Schema)</text>
  <text x="64" y="172" font-size="18.5" fill="#475569">Creates and publishes</text>
  <text x="64" y="199" font-size="18.5" fill="#475569">events when something</text>
  <text x="64" y="226" font-size="18.5" fill="#475569">happens.</text>
  <text x="100" y="432" font-size="18.5" fill="#1F2937">OrderPlaced</text>
  <text x="100" y="457" font-size="18.5" fill="#94A3B8">from Order service</text>
  <text x="100" y="497" font-size="18.5" fill="#1F2937">PaymentProcessed</text>
  <text x="100" y="522" font-size="18.5" fill="#94A3B8">from Payment service</text>
  <text x="100" y="562" font-size="18.5" fill="#1F2937">InventoryReserved</text>
  <text x="100" y="587" font-size="18.5" fill="#94A3B8">from Inventory service</text>
  <text x="444" y="172" font-size="18.5" fill="#475569">Receives events, stores</text>
  <text x="444" y="199" font-size="18.5" fill="#475569">them, and delivers them</text>
  <text x="444" y="226" font-size="18.5" fill="#475569">to interested consumers.</text>
  <text x="482" y="494" font-size="18.5" fill="#1F2937">Stores events</text>
  <text x="482" y="529" font-size="18.5" fill="#1F2937">Handles fan-out to consumers</text>
  <text x="482" y="564" font-size="18.5" fill="#1F2937">Ensures durability and delivery</text>
  <text x="904" y="172" font-size="18.5" fill="#475569">Subscribe to relevant events</text>
  <text x="904" y="199" font-size="18.5" fill="#475569">and react independently.</text>

  <circle cx="84" cy="426" r="6" fill="#2563EB"/>
  <circle cx="84" cy="491" r="6" fill="#2563EB"/>
  <circle cx="84" cy="556" r="6" fill="#2563EB"/>
  <circle cx="464" cy="488" r="6" fill="#7C3AED"/>
