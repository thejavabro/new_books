<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The producer, such as the order service, publishes events to the event channel, an event broker such as Kafka or RabbitMQ, which stores them and delivers them to consumers: the inventory, payment, notification and analytics services. An event schema registry defines the structure of events and their versions, and the producer and consumers validate events against it">
