    <clipPath id="m07c-k2"><rect x="444" y="250" width="292" height="90" rx="12"/></clipPath>
    <clipPath id="m07c-k3"><rect x="896" y="225" width="288" height="70" rx="12"/></clipPath>
    <clipPath id="m07c-k4"><rect x="896" y="345" width="288" height="70" rx="12"/></clipPath>
