<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for a likes counter, grouped into the write path (like and dislike, undo and toggle, idempotent writes) and the read path (fetch counts and the current user state, and read your own write)">
  <defs>
    <filter id="ytfr-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytfr-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytfr-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytfr-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytfr-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytfr-k4"><rect x="80" y="430" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="ytfr-k5"><rect x="640" y="430" width="520" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">YouTube Likes Counter: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the system has to do. Split by the two paths it serves, because they carry very different load.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Write path: what one reaction does</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">Read path: what the page asks for</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ytfr-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#ytfr-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6-6 6 6"/><path d="M6 14l6 6 6-6"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Like and dislike</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">on a video or a comment</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">one active state per item</text>
  <g filter="url(#ytfr-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#D97706" clip-path="url(#ytfr-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Undo and toggle</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a toggle moves two counters</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">one down and one up</text>
  <g filter="url(#ytfr-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#DB2777" clip-path="url(#ytfr-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Idempotent writes</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a retried event must not</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">inflate the count</text>
  <g filter="url(#ytfr-lift)">
    <rect x="80" y="430" width="520" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="80" y="430" width="9" height="90" fill="#7C3AED" clip-path="url(#ytfr-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Counts and my own state</text>
  <text x="340" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">totals for the item, plus whether this user already reacted</text>
  <g filter="url(#ytfr-soft)">
    <rect x="640" y="430" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="640" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#ytfr-k5)"/>
  </g>
  <circle cx="678" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="704" y="482" font-size="21.5" font-weight="600" fill="#111827">Read my own write</text>
  <text x="900" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">the actor sees their change at once, other viewers can lag</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">One active state</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">a user holds Like, Dislike or None for an item, never two at once</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Toggle</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">switching Like to Dislike decrements one counter and increments the other, so one click is two updates</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Read your own write</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">the person who acted sees it immediately; everyone else can wait for the count to catch up</text>
</svg>