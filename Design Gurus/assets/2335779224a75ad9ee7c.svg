<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Clients send requests to the messaging grid of the virtualized middleware, made of a messaging grid, a data grid, a processing grid and a deployment manager; the messaging grid routes them to processing units 1, 2 through N, each holding application logic and an in-memory data grid; the processing units send changes to the data pump, a durable pump queue that feeds data writers, which persist the changes to the database, the durable storage; data readers load data from the database back into the processing units">
