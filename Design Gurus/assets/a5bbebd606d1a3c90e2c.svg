<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="982" viewBox="0 0 1240 982" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three ways a caller can learn that asynchronous work finished: polling, the default, which needs nothing from the consumer, Server-Sent Events for an open first-party screen, and a signed webhook for a partner server. Each row lists what the mechanism fits, what it needs, and what it costs. All three refer back to the same status resource.">
  <defs>
    <filter id="pm-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pm-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pm-k1"><rect x="76" y="181" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pm-k2"><rect x="76" y="405" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pm-k3"><rect x="76" y="615" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="982" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three delivery paths, one lifecycle</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one row per mechanism</text>

  
  <rect x="40" y="126" width="1160" height="200" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#pm-lift)">
    <rect x="76" y="181" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="181" width="9" height="90" fill="#2563EB" clip-path="url(#pm-k1)"/>
  </g>
  <circle cx="114" cy="226" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,215.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="233" font-size="18.5" font-weight="600" fill="#111827">Polling</text>
  <text x="226" y="296" text-anchor="middle" font-size="15.5" fill="#6B7280">the default</text>

  <rect x="420" y="166" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="520" y="188" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Fits</text>
  <text x="644" y="188" font-size="15.5" fill="#475569">Every caller</text>

  <rect x="420" y="210" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="520" y="232" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">What it needs</text>
  <text x="644" y="232" font-size="15.5" fill="#475569">Nothing beyond a read and Retry-After</text>

  <rect x="420" y="254" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="520" y="276" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">What it costs</text>
  <text x="644" y="276" font-size="15.5" fill="#475569">Repeated calls</text>

  
  <rect x="40" y="350" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#pm-soft)">
    <rect x="76" y="405" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="405" width="6" height="90" fill="#2563EB" clip-path="url(#pm-k2)"/>
  </g>
  <circle cx="114" cy="450" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,439.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="457" font-size="18.5" font-weight="600" fill="#111827">SSE</text>

  <rect x="420" y="390" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="520" y="412" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Fits</text>
  <text x="644" y="412" font-size="15.5" fill="#475569">An open first-party screen</text>

  <rect x="420" y="434" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="520" y="456" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">What it needs</text>
  <text x="644" y="456" font-size="15.5" fill="#475569">Event ids, the resume buffer, resync_required</text>

  <rect x="420" y="478" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="520" y="500" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">What it costs</text>
  <text x="644" y="500" font-size="15.5" fill="#475569">A stateful connection</text>

  
  <rect x="40" y="560" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#pm-soft)">
    <rect x="76" y="615" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="615" width="6" height="90" fill="#2563EB" clip-path="url(#pm-k3)"/>
  </g>
  <circle cx="114" cy="660" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,649.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="667" font-size="18.5" font-weight="600" fill="#111827">Webhook</text>

  <rect x="420" y="600" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="520" y="622" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Fits</text>
  <text x="644" y="622" font-size="15.5" fill="#475569">A partner server</text>

  <rect x="420" y="644" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="520" y="666" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">What it needs</text>
  <text x="644" y="666" font-size="15.5" fill="#475569">Registration, signing, retries, order</text>

  <rect x="420" y="688" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="520" y="710" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">What it costs</text>
  <text x="644" y="710" font-size="15.5" fill="#475569">An outbound contract</text>

  
  <rect x="40" y="778" width="1160" height="64" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="620" y="818" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">The caller can always fall back to GET on the job. The status resource is authoritative.</text>

  
  <rect x="40" y="866" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="911" text-anchor="middle" font-size="16" fill="#475569">Polling, SSE, and webhooks must not invent different status names or result meanings.</text>
</svg>