<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="676" viewBox="0 0 1240 676" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="How long each kind of training label takes to arrive">
  <defs>

    <filter id="m2l1d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l1d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m2l1d-k1"><rect x="50" y="130" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1d-k2"><rect x="50" y="270" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1d-k3"><rect x="50" y="410" width="245" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="676" fill="#FFFFFF"/>
  <g stroke="#94A3B8" stroke-width="1.5" fill="none"><path d="M320,90 H1200"/><path d="M400,84 V96"/><path d="M556,84 V96"/><path d="M712,84 V96"/><path d="M868,84 V96"/><path d="M1024,84 V96"/><path d="M1180,84 V96"/></g>
  <rect x="320" y="162" width="80" height="26" rx="13" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="320" y="302" width="860" height="26" rx="13" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="320" y="442" width="548" height="26" rx="13" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="400" y="70" font-size="15.5" text-anchor="middle" fill="#64748B">seconds</text>
  <text x="556" y="70" font-size="15.5" text-anchor="middle" fill="#64748B">minutes</text>
  <text x="712" y="70" font-size="15.5" text-anchor="middle" fill="#64748B">an hour</text>
  <text x="868" y="70" font-size="15.5" text-anchor="middle" fill="#64748B">a day</text>
  <text x="1024" y="70" font-size="15.5" text-anchor="middle" fill="#64748B">a week</text>
  <text x="1180" y="70" font-size="15.5" text-anchor="middle" fill="#64748B">six weeks</text>
  <g filter="url(#m2l1d-soft)">
    <rect x="50" y="130" width="245" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#m2l1d-k1)"/>
  </g>
  <circle cx="88" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="114" y="182" font-size="18.5" font-weight="600" fill="#111827">Behavior</text>
  <text x="172.5" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">clicks, skips, saves</text>
  <text x="416" y="181" font-size="15.5" font-weight="600" fill="#1D4ED8">fast, indirect, and biased</text>
  <g filter="url(#m2l1d-soft)">
    <rect x="50" y="270" width="245" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="50" y="270" width="6" height="90" fill="#D97706" clip-path="url(#m2l1d-k2)"/>
  </g>
  <circle cx="88" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,304.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="322" font-size="18.5" font-weight="600" fill="#111827">Natural outcomes</text>
  <text x="172.5" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">the outcome itself</text>
  <g filter="url(#m2l1d-soft)">
    <rect x="50" y="410" width="245" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="50" y="410" width="6" height="90" fill="#7C3AED" clip-path="url(#m2l1d-k3)"/>
  </g>
  <circle cx="88" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,444.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="114" y="462" font-size="18.5" font-weight="600" fill="#111827">Human annotation</text>
  <text x="172.5" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">guidelines and reviewers</text>
  <text x="884" y="461" font-size="15.5" font-weight="600" fill="#5B21B6">hours to days, and paid</text>
  <circle cx="712" cy="315" r="6" fill="#D97706"/>
  <text x="712" y="352" font-size="15.5" font-weight="600" text-anchor="middle" fill="#B45309">delivery, about an hour</text>
  <text x="1180" y="352" text-anchor="end" font-size="15.5" font-weight="600" fill="#B45309">chargeback, six weeks</text>
  <rect x="40" y="560" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="605" text-anchor="middle" font-size="16" fill="#475569">Label delay determines data maturity. Retraining can run more often using newly matured examples.</text>
</svg>