  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#5B21B6">Kafka topics, one per kind of event</text>
  <rect x="40" y="650" width="1160" height="220" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="680" font-size="19.5" font-weight="600" fill="#4338CA">Consumers, each doing the slow work</text>
  <rect x="40" y="920" width="1160" height="260" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="950" font-size="19.5" font-weight="600" fill="#475569">Where each consumer writes</text>

