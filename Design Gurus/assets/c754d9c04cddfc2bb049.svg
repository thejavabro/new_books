  <text x="1061" y="1141" font-size="18.5" text-anchor="middle" fill="#94A3B8">aggregated offline</text>

  <rect x="40" y="1220" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1245" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1270" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Published, not called</text>
  <text x="323" y="1270" font-size="18.5" fill="#475569">the service returns as soon as the event is on the log, so the user is not kept waiting</text>
  <rect x="64" y="1295" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1320" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">One topic per event</text>
  <text x="323" y="1320" font-size="18.5" fill="#475569">a consumer subscribes to what it needs and replays from the log after it falls over</text>
  <rect x="64" y="1345" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1370" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Off the write path</text>
  <text x="323" y="1370" font-size="18.5" fill="#475569">a slow spam or moderation check can never block a post from being accepted</text>
  <rect x="64" y="1395" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="1420" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Eventually consistent</text>
  <text x="323" y="1420" font-size="18.5" fill="#475569">these stores lag the source of truth by seconds, which is fine for search and counts</text>
