  <rect x="0" y="0" width="1240" height="1490" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Reddit detailed design: the event pipeline</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What happens after the write returns. Services publish, Kafka fans out, and each consumer does slow work off the request path.</text>

  <rect x="40" y="130" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Services that publish, then return</text>
