<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="792" viewBox="0 0 1240 792" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One successful write with three read-your-writes options. Returning the updated body helps only the response in hand. Routing the same caller&#39;s next read to the main copy helps that caller. A freshness token is the only one that carries the write point to another caller.">
  <defs>
    <marker id="p1l-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p1l-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p1l-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p1l-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1l-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1l-k1"><rect x="64" y="286" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p1l-k2"><rect x="676" y="110" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p1l-k3"><rect x="676" y="286" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p1l-k4"><rect x="676" y="462" width="500" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="792" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="592" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Three read-your-writes choices</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">each option reaches further than the one above</text>

  
  <g fill="none" stroke-width="2">
    <path d="M404,305 H516 Q528,305 528,293 V167 Q528,155 540,155 H676" stroke="#2563EB" marker-end="url(#p1l-bm)"/>
    <path d="M404,331 H676" stroke="#D97706" marker-end="url(#p1l-am)"/>
    <path d="M404,357 H516 Q528,357 528,369 V495 Q528,507 540,507 H676" stroke="#059669" stroke-width="2.5" marker-end="url(#p1l-em)"/>
  </g>

  
  <g filter="url(#p1l-soft)">
    <rect x="64" y="286" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="286" width="6" height="90" fill="#64748B" clip-path="url(#p1l-k1)"/>
  </g>
  <circle cx="102" cy="331" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,320.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="128" y="338" font-size="18.5" font-weight="600" fill="#111827">One successful write</text>

  
  <g filter="url(#p1l-soft)">
    <rect x="676" y="110" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="676" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#p1l-k2)"/>
  </g>
  <circle cx="714" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="740" y="162" font-size="18.5" font-weight="600" fill="#111827">Return the updated body</text>
  <text x="926" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">Scope: this response only</text>
  <text x="926" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">Cost: helps only the caller that received it</text>

  
  <g filter="url(#p1l-soft)">
    <rect x="676" y="286" width="500" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="676" y="286" width="6" height="90" fill="#D97706" clip-path="url(#p1l-k3)"/>
  </g>
  <circle cx="714" cy="331" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,320.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="740" y="338" font-size="18.5" font-weight="600" fill="#111827">Route the next read to the main copy</text>
  <text x="926" y="401" font-size="15.5" text-anchor="middle" fill="#6B7280">Scope: the same caller</text>
  <text x="926" y="424" font-size="15.5" text-anchor="middle" fill="#94A3B8">Cost: main-copy load and higher latency</text>

  
  <g filter="url(#p1l-lift)">
    <rect x="676" y="462" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="676" y="462" width="9" height="90" fill="#059669" clip-path="url(#p1l-k4)"/>
  </g>
  <circle cx="714" cy="507" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,496.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="740" y="514" font-size="18.5" font-weight="600" fill="#111827">Return a freshness token</text>
  <text x="926" y="577" font-size="15.5" text-anchor="middle" fill="#6B7280">Scope: any caller you pass it to</text>
  <text x="926" y="600" font-size="15.5" text-anchor="middle" fill="#94A3B8">Cost: a promise that is hard to remove later</text>

  
  <rect x="40" y="656" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="696" text-anchor="middle" font-size="16" fill="#475569">Take them in order. Add a freshness token only when another caller must observe the write.</text>
  <text x="620" y="724" text-anchor="middle" font-size="16" fill="#475569">If the promised freshness cannot be served in time, return 503 rather than stale success.</text>
</svg>