<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="758" viewBox="0 0 1240 758" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="past-title past-desc">
<title id="past-title">Past "use a vault"</title>
<desc id="past-desc">The questions that remain after the vault is in place are the ones that decide what a compromise costs: scope, lifetime, blast radius and detection.</desc>
<defs>
<marker id="past-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="past-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="past-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="past-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="758" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Past "use a vault"</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The questions that remain after the vault is in place are the ones that decide what a compromise costs.</text>
<rect x="40" y="680" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="680" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">In a manager rather than in the repository. Necessary, and the beginning of the subject</text>
<circle cx="60" cy="218" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="225" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="190" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scope</text>
<path d="M536 218H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 218H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#past-marker-slate)"/>
<rect x="580" y="190" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="224" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how much does this one secret unlock?</text>
<circle cx="60" cy="286" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="293" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="258" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="292" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Lifetime</text>
<path d="M536 286H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 286H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#past-marker-slate)"/>
<rect x="580" y="258" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="292" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how long is it valid, and what if it is never rotated?</text>
<circle cx="60" cy="354" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="361" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="326" width="440" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="360" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Blast radius</text>
<path d="M536 354H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 354H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#past-marker-slate)"/>
<rect x="580" y="326" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="360" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if it leaks, what must you do, and how long does that take?</text>
<circle cx="60" cy="422" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="429" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="394" width="440" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="428" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Detection</text>
<path d="M536 422H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 422H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#past-marker-slate)"/>
<rect x="580" y="394" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="428" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">would you know it had leaked?</text>
<rect x="40" y="474" width="1160" height="86" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="474" width="5" height="86" rx="2.5" fill="#F28B9D"/><text x="64" y="508.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Every secret in a manager, each granting full access, never rotated</text><text x="64" y="537.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">is a team that has solved storage and nothing else.</text>
<rect x="40" y="584" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="584" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="625" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A secret is a blast radius with a password attached.</text>
<text x="66" y="714" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Secrets are an access-control problem, not a storage problem.</text>
</svg>