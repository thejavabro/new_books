  <text x="333" y="1230" font-size="18.5" fill="#475569">run by another company</text>
  <text x="64" y="1280" font-size="18.5" fill="#475569">Arrows inside the band are function calls. The heavier border marks Orders, the module that handles Place order.</text>
  <text x="64" y="1303" font-size="18.5" fill="#475569">Intended rule: each component uses only its own tables; Dispatch still reads and writes the Orders tables directly.</text>
