<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1350" viewBox="0 0 1240 1350" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="C4 component view of the backend application container. The Customer app places orders through Orders and the Restaurant app accepts orders through Orders, both over JSON and HTTPS; the Courier app accepts jobs through Dispatch. Orders checks the login token with Accounts, checks prices with Menu, charges the order through Payments and sends order updates through Notifications. Payments creates charges with the external payment provider, and Notifications sends messages through the external push and SMS services, both over HTTPS. Each component also reads and writes its own tables in the PostgreSQL container over SQL, drawn as one arrow from the backend boundary to PostgreSQL. Dispatch also reads and writes the Orders tables directly over SQL, the known exception to that rule, drawn as its own arrow from Dispatch to PostgreSQL.">
