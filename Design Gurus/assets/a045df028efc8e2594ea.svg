<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="667" viewBox="0 0 1240 667" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A registered model climbs from shadow to a sticky canary to full traffic, and any rollback trigger repoints serving at the previous version">
  <defs>
    <marker id="c2svro-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c2svro-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="c2svro-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2svro-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2svro-k1"><rect x="60" y="136" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="c2svro-k2"><rect x="445" y="136" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c2svro-k3"><rect x="705" y="136" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c2svro-k4"><rect x="965" y="136" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c2svro-k5"><rect x="810" y="386" width="250" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="667" fill="#FFFFFF"/>
  <rect x="40" y="56" width="330" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline: before any user</text>
  <rect x="410" y="56" width="790" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="434" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: live traffic</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M350,181 H445" marker-end="url(#c2svro-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M645,181 H705" marker-end="url(#c2svro-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M905,181 H965" marker-end="url(#c2svro-mslate)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M805,263 V300 Q805,312 817,312 H923 Q935,312 935,324 V386" marker-end="url(#c2svro-mpink)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M1065,263 V300 Q1065,312 1053,312 H947 Q935,312 935,324 V386" marker-end="url(#c2svro-mpink)"/></g>
  <g filter="url(#c2svro-soft)">
    <rect x="60" y="136" width="290" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="60" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c2svro-k1)"/>
  </g>
  <circle cx="98" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="60" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 1</text>
  <text x="124" y="188" font-size="18.5" font-weight="600" fill="#111827">Offline evaluation</text>
  <text x="205" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">already passed, so it is in the registry</text>
  <g filter="url(#c2svro-soft)">
    <rect x="445" y="136" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="445" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#c2svro-k2)"/>
  </g>
  <circle cx="483" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(472.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="445" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 2</text>
  <text x="509" y="188" font-size="18.5" font-weight="600" fill="#111827">Shadow</text>
  <text x="545" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">logged, never shown to users</text>
  <g filter="url(#c2svro-soft)">
    <rect x="705" y="136" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="705" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#c2svro-k3)"/>
  </g>
  <circle cx="743" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(732.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="705" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 3</text>
  <text x="769" y="188" font-size="18.5" font-weight="600" fill="#111827">Canary</text>
  <text x="805" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">1% of users, sticky by user</text>
  <g filter="url(#c2svro-soft)">
    <rect x="965" y="136" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="965" y="136" width="6" height="90" fill="#059669" clip-path="url(#c2svro-k4)"/>
  </g>
  <circle cx="1003" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(992.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="965" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 4</text>
  <text x="1029" y="188" font-size="18.5" font-weight="600" fill="#111827">Ramp up</text>
  <text x="1065" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">5%, 25%, 50%, then 100%</text>
  <g filter="url(#c2svro-soft)">
    <rect x="810" y="386" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="810" y="386" width="6" height="90" fill="#7C3AED" clip-path="url(#c2svro-k5)"/>
  </g>
  <circle cx="848" cy="431" r="18" fill="#FFFFFF"/>
  <g transform="translate(837.56,420.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="874" y="438" font-size="18.5" font-weight="600" fill="#111827">Previous version</text>
  <text x="935" y="501" font-size="15.5" text-anchor="middle" fill="#6B7280">kept loaded and warm</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="949" y="357" fill="#BE185D">rollback trigger fires</text></g>
  <rect x="40" y="551" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="596" text-anchor="middle" font-size="16" fill="#475569">Example trigger: roll back if checkout conversion drops 2% or p99 exceeds 100 ms.</text>
</svg>