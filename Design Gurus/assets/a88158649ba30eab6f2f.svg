<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="764" viewBox="0 0 1240 764" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="askdecide-title askdecide-desc">
<title id="askdecide-title">When to ask and when to decide</title>
<desc id="askdecide-desc">Ask when the answer would change the design. Decide out loud when it would not, because the question costs time and returns nothing. When the answer matters and is not forthcoming, decide anyway and say which way you went and why.</desc>
<defs>
<marker id="askdecide-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="askdecide-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="askdecide-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="askdecide-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="764" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">When to ask and when to decide</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Ask when the answer would change your design. Decide, out loud, when it would not.</text>
<rect x="40" y="686" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="686" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="380" y="118" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Would the answer change your design?</text>
<path d="M520 180V212" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M520 180V212" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#askdecide-marker-slate)"/>
<path d="M720 180V212" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M720 180V212" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#askdecide-marker-slate)"/>
<text x="500" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">no</text>
<text x="740" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">yes</text>
<rect x="40" y="218" width="560" height="178" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 218H46A6 6 0 0 0 40 224V390A6 6 0 0 0 46 396H54Z" fill="#5EC9EC"/><text x="70" y="254" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Decide, out loud</text>
<rect x="64" y="274" width="512" height="96" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="84" y="303" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"I am going to assume a relational database here,</text><text x="84" y="328" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">because the access pattern is relational.</text><text x="84" y="353" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The choice of engine does not change the design."</text>
<rect x="640" y="218" width="560" height="178" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 218H646A6 6 0 0 0 640 224V390A6 6 0 0 0 646 396H654Z" fill="#39D5AA"/><text x="670" y="254" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Ask</text>
<rect x="664" y="274" width="512" height="96" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="684" y="303" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"How stale can this be? If it is seconds</text><text x="684" y="328" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">I will cache it. If it has to be current</text><text x="684" y="353" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">I need a different approach."</text>
<rect x="40" y="416" width="1160" height="112" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="416" width="5" height="112" rx="2.5" fill="#F3CF6A"/><text x="64" y="451" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">It matters, and the interviewer will not supply it</text><text x="64" y="478" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">"You have not given me a number, so I am assuming the larger one,</text><text x="64" y="505" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">because designing for the smaller one and being wrong is the more expensive mistake."</text>
<rect x="40" y="548" width="1160" height="112" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="548" width="5" height="112" rx="2.5" fill="#F28B9D"/><text x="64" y="581" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The behavior to avoid: asking a question, getting a vague answer,</text><text x="64" y="610" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">and proceeding as though it were precise.</text><text x="64" y="639" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">It is what happens on real projects when a requirement was never settled.</text>
<text x="66" y="720" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Interviewers remember a vague answer treated as a precise one.</text>
</svg>