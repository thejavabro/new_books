<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="652" viewBox="0 0 1240 652" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="TCP plus TLS needs two round trips before any application data flows, QUIC combines them into one, and a resumed QUIC connection sends data immediately with zero round trips">
  <rect x="0" y="0" width="1240" height="652" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">How long before the first byte of your data can move</text>

  <text x="340" y="112" font-size="20" fill="#64748B" text-anchor="middle">0</text>
  <text x="540" y="112" font-size="20" fill="#64748B" text-anchor="middle">1 RTT</text>
  <text x="740" y="112" font-size="20" fill="#64748B" text-anchor="middle">2 RTT</text>
  <line x1="340" y1="122" x2="340" y2="490" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="540" y1="122" x2="540" y2="490" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="740" y1="122" x2="740" y2="490" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="320" y="186" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">TCP + TLS 1.3</text>
  <rect x="340" y="150" width="200" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="440" y="186" font-size="20" fill="#1E40AF" text-anchor="middle">TCP handshake</text>
  <rect x="540" y="150" width="200" height="60" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="640" y="186" font-size="20" fill="#92400E" text-anchor="middle">TLS handshake</text>
  <rect x="740" y="150" width="380" height="60" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="930" y="186" font-size="20" fill="#065F46" text-anchor="middle">application data</text>
  <text x="1140" y="186" font-size="20" font-weight="600" fill="#B91C1C">2 RTT</text>

  <text x="320" y="316" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">QUIC, new connection</text>
  <rect x="340" y="280" width="200" height="60" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="440" y="316" font-size="20" fill="#5B21B6" text-anchor="middle">handshake + keys</text>
  <rect x="540" y="280" width="580" height="60" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="830" y="316" font-size="20" fill="#065F46" text-anchor="middle">application data</text>
  <text x="1140" y="316" font-size="20" font-weight="600" fill="#92400E">1 RTT</text>

  <text x="320" y="446" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">QUIC, resumed</text>
  <rect x="340" y="410" width="780" height="60" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="730" y="446" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">application data, sent with the very first packet</text>
  <text x="1140" y="446" font-size="20" font-weight="600" fill="#065F46">0 RTT</text>

  
  <rect x="50" y="530" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="566" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">QUIC did not make the network faster. It removed a round trip by merging two handshakes into one.</text>
  <text x="620" y="596" font-size="20" fill="#334155" text-anchor="middle">On a 100 ms link that is 200 ms saved before anything useful has been sent.</text>
</svg>