  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">N-tier architecture on AWS: a real cloud deployment</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each tier runs on a managed AWS service, from the CDN down to the data stores.</text>

