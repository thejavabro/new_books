<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1480" viewBox="0 0 1240 1480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A web browser and a mobile app, the presentation tier, reach Amazon CloudFront in the delivery tier; CloudFront forwards to the Application Load Balancer in front of the application tier; the load balancer spreads requests across an Auto Scaling group of EC2 application servers; the application servers use Amazon RDS (PostgreSQL or MySQL) as the database, Amazon ElastiCache (Redis) as the cache, Amazon OpenSearch for search and Amazon S3 for object storage">
