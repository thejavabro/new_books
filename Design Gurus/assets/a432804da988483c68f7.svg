<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1650" viewBox="0 0 1240 1650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven trade-offs of the inference API, each with the reason for it and the cost accepted: SSE rather than WebSockets, a 200 with no durable response collection, a required maximum output, no partial-generation resume, idempotency result retention, separate batch capacity, and permanent structured outputs.">
  <defs>
    <filter id="p2f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2f-k1"><rect x="76" y="146" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p2f-k2"><rect x="76" y="342" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p2f-k3"><rect x="76" y="538" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p2f-k4"><rect x="76" y="734" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p2f-k5"><rect x="76" y="930" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p2f-k6"><rect x="76" y="1126" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p2f-k7"><rect x="76" y="1322" width="460" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1650" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Seven choices, seven costs named aloud</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M770,66 L777,71.5 L770,77"/>
  </g>
  <text x="792" y="77" font-size="15.5" fill="#6B7280">Because</text>
  <g fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M927.5,64 L935,77 L920,77 Z"/>
    <path d="M927.5,69 L927.5,72.5"/>
  </g>
  <text x="950" y="77" font-size="15.5" fill="#6B7280">Cost accepted</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2f-soft)">
    <rect x="76" y="146" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p2f-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">SSE, not WebSockets</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,251 L86,256.5 L79,262"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">The model sends; the browser only receives.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83.5,275 L91,288 L76,288 Z"/>
    <path d="M83.5,280 L83.5,283.5"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Frequent two-way interaction would need separate requests.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2f-soft)">
    <rect x="76" y="342" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#059669" clip-path="url(#p2f-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">200, and no durable response</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,447 L86,452.5 L79,458"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">The result is returned in this request.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83.5,471 L91,484 L76,484 Z"/>
    <path d="M83.5,476 L83.5,479.5"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">A product wanting history creates its own message resources.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2f-soft)">
    <rect x="76" y="538" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p2f-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">A required maximum output</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,643 L86,648.5 L79,654"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">Token, spend, and deadline admission need a worst case.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83.5,667 L91,680 L76,680 Z"/>
    <path d="M83.5,672 L83.5,675.5"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">Conservative reservation, and refusal on an inflated bound.</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2f-soft)">
    <rect x="76" y="734" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#059669" clip-path="url(#p2f-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">No partial-generation resume</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,839 L86,844.5 L79,850"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">The service keeps no hidden worker state.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83.5,863 L91,876 L76,876 Z"/>
    <path d="M83.5,868 L83.5,871.5"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Repeated work and a new charge after a broken stream.</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2f-soft)">
    <rect x="76" y="930" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#059669" clip-path="url(#p2f-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">24-hour idempotency retention</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,1035 L86,1040.5 L79,1046"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">A network retry must not become a second charge.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83.5,1059 L91,1072 L76,1072 Z"/>
    <path d="M83.5,1064 L83.5,1067.5"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">Storage and coordination cost for the retained results.</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2f-soft)">
    <rect x="76" y="1126" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#059669" clip-path="url(#p2f-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">Separate batch capacity</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,1231 L86,1236.5 L79,1242"/>
  </g>
  <text x="104" y="1242" font-size="15.5" fill="#6B7280">A cheap backlog must not consume the chat latency budget.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83.5,1255 L91,1268 L76,1268 Z"/>
    <path d="M83.5,1260 L83.5,1263.5"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">Less flexible utilization between the two pools.</text>

  
  <rect x="40" y="1302" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2f-soft)">
    <rect x="76" y="1322" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1322" width="6" height="90" fill="#059669" clip-path="url(#p2f-k7)"/>
  </g>
  <circle cx="114" cy="1367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1356.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="1374" font-size="18.5" font-weight="600" fill="#111827">Permanent schemas and descriptions</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,1427 L86,1432.5 L79,1438"/>
  </g>
  <text x="104" y="1438" font-size="15.5" fill="#6B7280">Agents need parseable control flow.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M83.5,1451 L91,1464 L76,1464 Z"/>
    <path d="M83.5,1456 L83.5,1459.5"/>
  </g>
  <text x="104" y="1464" font-size="15.5" fill="#6B7280">Description meaning becomes a compatibility commitment.</text>

  
  <rect x="40" y="1510" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1552" text-anchor="middle" font-size="16" fill="#475569">Each row holds one choice, the reason for it, and the cost the design accepts in return.</text>
  <text x="620" y="1580" text-anchor="middle" font-size="16" fill="#475569">The cost is stated, not hidden. Naming it is what turns a choice into a defended trade-off.</text>
</svg>