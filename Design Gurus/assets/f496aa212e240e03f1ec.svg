<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A Bloom filter in front of the cache and database rejects keys that definitely do not exist, so only plausible lookups reach the cache and the database">
  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>
  <defs>
    <marker id="ca6-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ca6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="ca6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The filter answers first, so most bad lookups never reach the cache or the database</text>

  
  <line x1="234" y1="226" x2="292" y2="226" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca6-blue)"/>
  <line x1="544" y1="226" x2="692" y2="226" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca6-blue)"/>
  <text x="618" y="202" font-size="20" fill="#1E40AF" text-anchor="middle">maybe present</text>
  <line x1="884" y1="226" x2="992" y2="226" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca6-blue)"/>
  <text x="938" y="202" font-size="20" fill="#1E40AF" text-anchor="middle">on miss</text>

  <path d="M420 278 L420 400 L612 400" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ca6-emerald)"/>
  <text x="436" y="348" font-size="20" fill="#065F46">definitely not present</text>

  
  <g filter="url(#ca6-soft)">
    <rect x="60" y="190" width="174" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="292" y="174" width="252" height="104" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="700" y="190" width="184" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="620" y="364" width="330" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="147" y="234" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Request</text>
  <text x="418" y="210" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bloom filter</text>
  <text x="418" y="240" font-size="20" fill="#92400E" text-anchor="middle">holds every valid key,</text>
  <text x="418" y="264" font-size="20" fill="#92400E" text-anchor="middle">in a few megabytes</text>
  <text x="792" y="234" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cache</text>
  <text x="785" y="396" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">return not found</text>
  <text x="785" y="422" font-size="20" fill="#065F46" text-anchor="middle">no cache read, no query</text>

  <g filter="url(#ca6-soft)">
    <path d="M992 208 a94 16 0 0 1 188 0 v52 a94 16 0 0 1 -188 0 z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1086" cy="208" rx="94" ry="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1086" y="244" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Database</text>

  
  <rect x="80" y="466" width="1080" height="90" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="500" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">This is the fix for cache penetration.</text>
  <text x="620" y="532" font-size="20" fill="#475569" text-anchor="middle">An attacker guessing random IDs is stopped at the filter, so the database never sees the flood.</text>
</svg>