<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Environment variables, a key management service and a secrets vault compared on where the secret lives, who can read it, how rotation works and what is auditable">
  <rect x="0" y="0" width="1240" height="708" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three ways to hold a database password, and what each one gives up</text>

  
  <rect x="50" y="88" width="360" height="462" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FEF2F2"/>
  <text x="230" y="122" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Environment variables</text>
  <text x="70" y="180" font-size="20" font-weight="600" fill="#475569">Where it lives</text>
  <text x="70" y="210" font-size="20" fill="#0F172A">In the process, and in the</text>
  <text x="70" y="236" font-size="20" fill="#0F172A">deploy config that set it.</text>
  <text x="70" y="286" font-size="20" font-weight="600" fill="#475569">Who can read it</text>
  <text x="70" y="316" font-size="20" fill="#0F172A">Anything in the container,</text>
  <text x="70" y="342" font-size="20" fill="#0F172A">plus every crash dump.</text>
  <text x="70" y="392" font-size="20" font-weight="600" fill="#475569">Rotation</text>
  <text x="70" y="422" font-size="20" fill="#B91C1C">Redeploy everything that</text>
  <text x="70" y="448" font-size="20" fill="#B91C1C">uses it.</text>
  <text x="70" y="498" font-size="20" font-weight="600" fill="#475569">Audit trail</text>
  <text x="70" y="528" font-size="20" fill="#B91C1C">None.</text>

  
  <rect x="440" y="88" width="360" height="462" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M440 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FFFBEB"/>
  <text x="620" y="122" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Key management service</text>
  <text x="460" y="180" font-size="20" font-weight="600" fill="#475569">Where it lives</text>
  <text x="460" y="210" font-size="20" fill="#0F172A">Encrypted at rest, with the</text>
  <text x="460" y="236" font-size="20" fill="#0F172A">key held by the provider.</text>
  <text x="460" y="286" font-size="20" font-weight="600" fill="#475569">Who can read it</text>
  <text x="460" y="316" font-size="20" fill="#0F172A">Whoever holds an IAM role</text>
  <text x="460" y="342" font-size="20" fill="#0F172A">allowed to decrypt.</text>
  <text x="460" y="392" font-size="20" font-weight="600" fill="#475569">Rotation</text>
  <text x="460" y="422" font-size="20" fill="#92400E">Rotate the key easily, the</text>
  <text x="460" y="448" font-size="20" fill="#92400E">secret itself by hand.</text>
  <text x="460" y="498" font-size="20" font-weight="600" fill="#475569">Audit trail</text>
  <text x="460" y="528" font-size="20" fill="#065F46">Every decrypt call is logged.</text>

  
  <rect x="830" y="88" width="360" height="462" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <path d="M830 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#ECFDF5"/>
  <text x="1010" y="122" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Secrets vault</text>
  <text x="850" y="180" font-size="20" font-weight="600" fill="#475569">Where it lives</text>
  <text x="850" y="210" font-size="20" fill="#0F172A">In the vault, and often it is</text>
  <text x="850" y="236" font-size="20" fill="#0F172A">minted only when asked.</text>
  <text x="850" y="286" font-size="20" font-weight="600" fill="#475569">Who can read it</text>
  <text x="850" y="316" font-size="20" fill="#0F172A">An authenticated workload,</text>
  <text x="850" y="342" font-size="20" fill="#0F172A">under a policy, for a while.</text>
  <text x="850" y="392" font-size="20" font-weight="600" fill="#475569">Rotation</text>
  <text x="850" y="422" font-size="20" fill="#065F46">Automatic. Short leases</text>
  <text x="850" y="448" font-size="20" fill="#065F46">expire on their own.</text>
  <text x="850" y="498" font-size="20" font-weight="600" fill="#475569">Audit trail</text>
  <text x="850" y="528" font-size="20" fill="#065F46">Every issue and renewal.</text>

  
  <rect x="50" y="586" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="622" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The real question is not where the secret is stored. It is how fast you can change it.</text>
  <text x="620" y="652" font-size="20" fill="#334155" text-anchor="middle">A secret you cannot rotate in an afternoon is a secret you cannot respond to a leak with.</text>
</svg>