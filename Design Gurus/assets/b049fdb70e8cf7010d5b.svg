<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The checkout saga under test: one coordinator issues four numbered commands to Orders, Inventory, Payments and Fulfillment, each service owning its private database plus an outbox, and the three places the design can break (crash after commit, card declined, ambiguous timeout) are marked where they land.">
  <defs>
    <marker id="m05-l08-saga-coordinator-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l08-saga-coordinator-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l08-saga-coordinator-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="m05-l08-saga-coordinator-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l08-saga-coordinator-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="980" fill="#FFFFFF"/>

  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <rect x="420" y="50" width="400" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="90" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Saga coordinator</text>
  <text x="620" y="122" text-anchor="middle" font-size="20" fill="#64748B">a saga table, or a workflow engine</text>
  <text x="620" y="154" text-anchor="middle" font-size="20" fill="#64748B">the riskiest step goes last</text>
  <text x="1180" y="215" text-anchor="end" font-size="20" fill="#1E40AF">commands, in order</text>

  <rect x="48" y="250" width="1144" height="320" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <rect x="70" y="320" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="195" y="355" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Orders</text>
  <text x="195" y="387" text-anchor="middle" font-size="20" fill="#64748B">status: pending_inventory</text>
  <text x="195" y="419" text-anchor="middle" font-size="20" fill="#64748B">undo: mark cancelled</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <rect x="360" y="320" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="485" y="355" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Inventory</text>
  <text x="485" y="387" text-anchor="middle" font-size="20" fill="#64748B">upsert on the order ID</text>
  <text x="485" y="419" text-anchor="middle" font-size="20" fill="#64748B">undo: release</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <rect x="650" y="320" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="775" y="355" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3. Payments</text>
  <text x="775" y="387" text-anchor="middle" font-size="20" fill="#64748B">idempotent keyed charge</text>
  <text x="775" y="419" text-anchor="middle" font-size="20" fill="#64748B">undo: refund</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <rect x="930" y="320" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1055" y="355" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">4. Fulfillment</text>
  <text x="1055" y="387" text-anchor="middle" font-size="20" fill="#64748B">the final step,</text>
  <text x="1055" y="419" text-anchor="middle" font-size="20" fill="#64748B">nothing to undo</text>

  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <path d="M90,490 L90,540 A105,20 0 0 0 300,540 L300,490" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="195" cy="490" rx="105" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="195" y="522" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">DB + outbox</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <path d="M380,490 L380,540 A105,20 0 0 0 590,540 L590,490" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="485" cy="490" rx="105" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="485" y="522" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">DB + outbox</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <path d="M670,490 L670,540 A105,20 0 0 0 880,540 L880,490" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="775" cy="490" rx="105" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="775" y="522" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">DB + outbox</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <path d="M950,490 L950,540 A105,20 0 0 0 1160,540 L1160,490" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="1055" cy="490" rx="105" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1055" y="522" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">own DB</text>

  <rect x="48" y="610" width="1144" height="200" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="68" y="650" font-size="20" font-weight="600" fill="#B91C1C">Three places it can break, and each resolves cleanly</text>
  <text x="1172" y="650" text-anchor="end" font-size="20" fill="#64748B">every handler is idempotent</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <rect x="68" y="690" width="355" height="110" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="245.5" y="736" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Break 1: crash after commit</text>
  <text x="245.5" y="768" text-anchor="middle" font-size="20" fill="#64748B">the outbox replays it</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <rect x="443" y="690" width="355" height="110" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620.5" y="736" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Break 2: card declined</text>
  <text x="620.5" y="768" text-anchor="middle" font-size="20" fill="#64748B">release, then cancel</text>
  <g filter="url(#m05-l08-saga-coordinator-soft)">
    <rect x="818" y="690" width="355" height="110" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="995.5" y="736" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Break 3: ambiguous timeout</text>
  <text x="995.5" y="768" text-anchor="middle" font-size="20" fill="#64748B">same key, charged once</text>

  <g fill="none" stroke-width="2.5">
    <path d="M500,180 C420,210 195,230 195,312" stroke="#3B82F6" stroke-width="2" marker-end="url(#m05-l08-saga-coordinator-bl)"/>
    <path d="M570,180 C540,215 485,250 485,312" stroke="#3B82F6" stroke-width="2" marker-end="url(#m05-l08-saga-coordinator-bl)"/>
    <path d="M670,180 C700,215 775,250 775,312" stroke="#3B82F6" stroke-width="2" marker-end="url(#m05-l08-saga-coordinator-bl)"/>
    <path d="M740,180 C820,210 1055,230 1055,312" stroke="#3B82F6" stroke-width="2" marker-end="url(#m05-l08-saga-coordinator-bl)"/>
    <path d="M195,440 L195,462" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l08-saga-coordinator-ab)"/>
    <path d="M485,440 L485,462" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l08-saga-coordinator-ab)"/>
    <path d="M775,440 L775,462" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l08-saga-coordinator-ab)"/>
    <path d="M1055,440 L1055,462" stroke="#64748B" stroke-width="2" marker-end="url(#m05-l08-saga-coordinator-sl)"/>
    <path d="M245,682 C245,640 195,610 195,572" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m05-l08-saga-coordinator-rd)"/>
    <path d="M620,682 C620,640 520,606 490,574" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m05-l08-saga-coordinator-rd)"/>
    <path d="M995,682 C995,640 820,606 782,574" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m05-l08-saga-coordinator-rd)"/>
  </g>

  <line x1="60" y1="860" x2="96" y2="860" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="867" font-size="20" fill="#475569">Command: the coordinator calls a step and waits</text>
  <line x1="60" y1="900" x2="96" y2="900" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="907" font-size="20" fill="#475569">Outbox seam: the row and its event commit together</text>
  <line x1="60" y1="940" x2="96" y2="940" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="947" font-size="20" fill="#475569">Where each of the three breaks lands</text>
</svg>