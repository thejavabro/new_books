<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="712" viewBox="0 0 1240 712" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array, its total and the rule a valid piece has to satisfy">
<defs>
<filter id="sa-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="712" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Can [1, 5, 3, 5, 6] be split into two groups with the same average?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The 5 numbers add up to 20, so the average of the whole array is 4</text>
<rect x="40" y="106" width="1160" height="460" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">A group of k numbers works only if it sums to 4 times k</text>
<rect x="298" y="194" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="356" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="356" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="430" y="194" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="488" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="488" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="562" y="194" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="620" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="694" y="194" width="116" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="752" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="752" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="826" y="194" width="116" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="884" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="884" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<path d="M686,176 L686,272" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="488" y="168" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">left half</text>
<text x="818" y="168" text-anchor="middle" font-size="17.5" font-weight="600" fill="#5B21B6">right half</text>
<text x="276" y="232" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<text x="539" y="338" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">left pieces</text>
<text x="567" y="337" font-size="18" fill="#475569">not listed yet</text>
<text x="539" y="478" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">right pieces</text>
<text x="567" y="477" font-size="18" fill="#475569">not listed yet</text>
<text x="620" y="408" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">If both groups share an average, that average has to be 4, the average of everything</text>
<rect x="40" y="588" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="628" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">So a group of size k must sum to exactly 4k</text>
<text x="620" y="660" text-anchor="middle" font-size="18.5" fill="#475569">That one rule turns a question about averages into a question about sums and sizes</text>
</svg>