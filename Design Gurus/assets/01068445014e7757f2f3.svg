<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A workspace contains projects, a project contains tasks, and a task contains comments. Users relate to workspaces through a membership, which owns role, status and joined at, so the relationship is itself an entity. A separate many to one line runs from a task assignee to the user.">
