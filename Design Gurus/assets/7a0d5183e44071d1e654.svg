<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flow for putting a message broker on an edge: if the caller needs the answer now, call the service directly; if not, a broker earns its cost only when there are many readers, real spikes, or a consumer allowed to fail alone, otherwise a direct call or a function call is enough.">
  <defs>
    <marker id="m03-l03-broker-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m03-l03-broker-decision-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l03-broker-decision-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m03-l03-broker-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="910" fill="#FFFFFF"/>

  <g fill="none">
    <path d="M420,200 L420,214" stroke="#475569" stroke-width="2.5" marker-end="url(#m03-l03-broker-decision-sl)"/>
    <path d="M420,420 L420,484" stroke="#475569" stroke-width="2.5" marker-end="url(#m03-l03-broker-decision-sl)"/>
    <path d="M668,308 C712,290 720,238 754,232" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l03-broker-decision-bl)"/>
    <path d="M666,588 C712,572 720,478 754,466" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l03-broker-decision-bl)"/>
    <path d="M666,614 C712,632 720,694 754,700" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l03-broker-decision-ab)"/>
  </g>

  <g filter="url(#m03-l03-broker-decision-soft)">
    <rect x="170" y="70" width="500" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="420" y="112" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Should this edge go through a broker?</text>
  <text x="420" y="146" text-anchor="middle" font-size="20" fill="#64748B">brokers cost new infrastructure,</text>
  <text x="420" y="178" text-anchor="middle" font-size="20" fill="#64748B">added latency, and stale reads</text>

  <g filter="url(#m03-l03-broker-decision-soft)">
    <path d="M420,220 L670,320 L420,420 L170,320 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="420" y="312" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Does the caller need</text>
  <text x="420" y="342" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the answer now?</text>

  <g filter="url(#m03-l03-broker-decision-soft)">
    <path d="M420,488 L670,600 L420,712 L170,600 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="420" y="578" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Many readers, real spikes,</text>
  <text x="420" y="608" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">or a consumer allowed</text>
  <text x="420" y="638" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">to fail alone?</text>

  <g filter="url(#m03-l03-broker-decision-soft)">
    <rect x="758" y="152" width="442" height="160" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="979" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">No broker.</text>
  <text x="979" y="226" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Call the service directly.</text>
  <text x="979" y="262" text-anchor="middle" font-size="20" fill="#64748B">query paths, and the commands</text>
  <text x="979" y="292" text-anchor="middle" font-size="20" fill="#64748B">the user must know about now</text>

  <g filter="url(#m03-l03-broker-decision-soft)">
    <rect x="758" y="386" width="442" height="160" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="979" y="430" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">No broker. A direct call or</text>
  <text x="979" y="460" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">a function call is enough.</text>
  <text x="979" y="496" text-anchor="middle" font-size="20" fill="#64748B">small systems, with no fan-out</text>
  <text x="979" y="526" text-anchor="middle" font-size="20" fill="#64748B">and no real spikes</text>

  <g filter="url(#m03-l03-broker-decision-soft)">
    <rect x="758" y="620" width="442" height="160" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="979" y="678" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The broker earns its cost here.</text>
  <text x="979" y="716" text-anchor="middle" font-size="20" fill="#64748B">durability, time decoupling,</text>
  <text x="979" y="746" text-anchor="middle" font-size="20" fill="#64748B">load leveling, redelivery</text>

  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="712" y="264" fill="#1E40AF">Yes</text>
    <text x="452" y="462" fill="#475569">No</text>
    <text x="710" y="516" fill="#1E40AF">No</text>
    <text x="710" y="666" fill="#92400E">Yes</text>
  </g>

  <line x1="50" y1="830" x2="86" y2="830" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="837" font-size="20" fill="#475569">No broker: a direct synchronous call is the right answer</text>
  <line x1="50" y1="870" x2="86" y2="870" stroke="#D97706" stroke-width="4"/>
  <text x="98" y="877" font-size="20" fill="#475569">Broker justified: fan-out, real spikes, or independent failure</text>
</svg>