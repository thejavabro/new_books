<text x="139" y="511" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">A[1][2] = 6</text>
<text x="238" y="511" font-size="18.5" fill="#475569">row 1, column 2, so the value is 6.</text>
<text x="64" y="538" font-size="18.5" fill="#475569">Both indices start at 0, so a 3 by 3 matrix uses rows 0 to 2 and columns 0 to 2.</text>
