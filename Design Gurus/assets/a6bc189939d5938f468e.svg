<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="HDFS example: the NameNode keeps the block map while DataNodes store blocks B1 and B2 three times each, with a replication pipeline and heartbeats">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="df4-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="df4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="df4-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="df4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="df4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M310,296 C400,296 440,150 560,105" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#df4-blue)"/>
  <text x="400" y="195" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">where are the blocks of file.txt?</text>

  <path d="M175,332 L175,438" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#df4-emerald)"/>
  <path d="M230,332 C320,360 420,400 470,438" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#df4-emerald)"/>
  <text x="300" y="390" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read and write blocks directly</text>

  <path d="M295,496 L345,496" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#df4-amber)"/>
  <path d="M595,496 L645,496" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#df4-amber)"/>
  <path d="M895,496 L945,496" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#df4-amber)"/>
  <text x="620" y="595" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replication pipeline: every block is copied to three DataNodes</text>

  <path d="M770,440 L770,160" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#df4-slate)"/>
  <text x="840" y="300" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">heartbeats and block reports</text>

  
  <rect x="60" y="60" width="440" height="80" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="280" y="91" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">file.txt is split into two blocks:</text>
  <text x="280" y="119" font-size="20" fill="#64748B" text-anchor="middle">B1 and B2, each stored three times</text>

  
  <g filter="url(#df4-soft)">
    <rect x="560" y="50" width="380" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="750" y="80" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">NameNode</text>
  <text x="750" y="108" font-size="20" fill="#64748B" text-anchor="middle">metadata server for the cluster</text>
  <text x="750" y="135" font-size="20" fill="#64748B" text-anchor="middle">block map: B1 -&gt; DN1, DN2, DN3</text>

  
  <g filter="url(#df4-soft)">
    <rect x="70" y="260" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="190" y="290" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">HDFS Client</text>
  <text x="190" y="318" font-size="20" fill="#64748B" text-anchor="middle">application</text>

  
  <g filter="url(#df4-soft)">
    <rect x="45" y="440" width="250" height="115" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="345" y="440" width="250" height="115" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="645" y="440" width="250" height="115" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="945" y="440" width="250" height="115" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="170" y="470" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DataNode 1</text>
  <rect x="140" y="496" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="170" y="521" font-size="20" fill="#5B21B6" text-anchor="middle">B1</text>

  <text x="470" y="470" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DataNode 2</text>
  <rect x="402" y="496" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="478" y="496" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="432" y="521" font-size="20" fill="#5B21B6" text-anchor="middle">B1</text>
  <text x="508" y="521" font-size="20" fill="#5B21B6" text-anchor="middle">B2</text>

  <text x="770" y="470" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DataNode 3</text>
  <rect x="702" y="496" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="778" y="496" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="732" y="521" font-size="20" fill="#5B21B6" text-anchor="middle">B1</text>
  <text x="808" y="521" font-size="20" fill="#5B21B6" text-anchor="middle">B2</text>

  <text x="1070" y="470" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DataNode 4</text>
  <rect x="1040" y="496" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1070" y="521" font-size="20" fill="#5B21B6" text-anchor="middle">B2</text>

  
  <line x1="165" y1="660" x2="193" y2="660" stroke="#3B82F6" stroke-width="3"/>
  <text x="203" y="667" font-size="20" fill="#475569">metadata lookup</text>
  <line x1="408" y1="660" x2="436" y2="660" stroke="#059669" stroke-width="3"/>
  <text x="446" y="667" font-size="20" fill="#475569">block reads and writes</text>
  <line x1="733" y1="660" x2="761" y2="660" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="771" y="667" font-size="20" fill="#475569">replication</text>
  <line x1="934" y1="660" x2="962" y2="660" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="972" y="667" font-size="20" fill="#475569">heartbeats</text>
</svg>