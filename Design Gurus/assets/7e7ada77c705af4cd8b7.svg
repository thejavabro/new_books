<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Why hardcoded service addresses stop working. The order service holds a list of three addresses in its config. One of those machines has crashed and the client keeps calling it, and a new instance started this morning that the config does not know about, so it receives no traffic. With a registry the client asks for the current healthy list instead of holding one">
  <defs>
    <marker id="sd1-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="sd1-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="sd1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sd1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sd1-kc"><rect x="460" y="100" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="sd1-k1"><rect x="72" y="320" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="sd1-k2"><rect x="480" y="320" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="sd1-k3"><rect x="888" y="320" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="sd1-b1"><rect x="72" y="618" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sd1-b2"><rect x="455" y="618" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sd1-b3"><rect x="838" y="618" width="330" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1000" fill="#FFFFFF"/>

  
  <rect x="40" y="44" width="1160" height="470" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">Hardcoded addresses: the client holds the list, and the list goes stale</text>

  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M620,190 L620,248 Q620,260 608,260 L224,260 Q212,260 212,272 L212,316" marker-end="url(#sd1-pk)"/>
    <path d="M620,190 L620,316" marker-end="url(#sd1-pk)"/>
  </g>

  <g filter="url(#sd1-lift)">
    <rect x="460" y="100" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="460" y="100" width="9" height="90" fill="#DB2777" clip-path="url(#sd1-kc)"/>
  </g>
  <circle cx="498" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,134.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="524" y="152" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">config: 10.0.0.1, 10.0.0.2</text>
  </g>

  <g filter="url(#sd1-soft)">
    <rect x="72" y="320" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="320" width="6" height="90" fill="#059669" clip-path="url(#sd1-k1)"/>
  </g>
  <circle cx="110" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,354.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="136" y="372" font-size="18.5" font-weight="600" fill="#111827">10.0.0.1</text>
  <text x="212" y="435" font-size="15.5" text-anchor="middle" fill="#6B7280">healthy</text>
  <text x="212" y="458" font-size="15.5" text-anchor="middle" fill="#94A3B8">still serving traffic</text>

  <g filter="url(#sd1-soft)">
    <rect x="480" y="320" width="280" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="480" y="320" width="6" height="90" fill="#DB2777" clip-path="url(#sd1-k2)"/>
  </g>
  <circle cx="518" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,354.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="544" y="372" font-size="18.5" font-weight="600" fill="#111827">10.0.0.2</text>
  <text x="620" y="435" font-size="15.5" text-anchor="middle" fill="#6B7280">crashed an hour ago</text>
  <text x="620" y="458" font-size="15.5" text-anchor="middle" fill="#94A3B8">the client still calls it</text>

  <g filter="url(#sd1-soft)">
    <rect x="888" y="320" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="888" y="320" width="6" height="90" fill="#64748B" clip-path="url(#sd1-k3)"/>
  </g>
  <circle cx="926" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(915.56,354.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8 12h8"/>
  </g>
  <text x="952" y="372" font-size="18.5" font-weight="600" fill="#111827">10.0.0.9</text>
  <text x="1028" y="435" font-size="15.5" text-anchor="middle" fill="#6B7280">started this morning</text>
  <text x="1028" y="458" font-size="15.5" text-anchor="middle" fill="#94A3B8">no arrow: the config has never heard of it</text>

  
  <rect x="40" y="550" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="580" font-size="16.5" font-weight="600" fill="#047857">With a registry: the client asks for the current list instead of holding one</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M402,663 L451,663" marker-end="url(#sd1-em)"/>
    <path d="M785,663 L834,663" marker-end="url(#sd1-em)"/>
  </g>

  <g filter="url(#sd1-soft)">
    <rect x="72" y="618" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="618" width="6" height="90" fill="#059669" clip-path="url(#sd1-b1)"/>
  </g>
  <circle cx="110" cy="663" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,652.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="670" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="237" y="733" font-size="15.5" text-anchor="middle" fill="#6B7280">holds no addresses</text>
  <text x="237" y="756" font-size="15.5" text-anchor="middle" fill="#94A3B8">asks by service name</text>

  <g filter="url(#sd1-lift)">
    <rect x="455" y="618" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="455" y="618" width="9" height="90" fill="#059669" clip-path="url(#sd1-b2)"/>
  </g>
  <circle cx="493" cy="663" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,652.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="519" y="670" font-size="18.5" font-weight="600" fill="#111827">Service Registry</text>
  <text x="620" y="733" font-size="15.5" text-anchor="middle" fill="#6B7280">knows who is alive right now</text>
  <text x="620" y="756" font-size="15.5" text-anchor="middle" fill="#94A3B8">updated as instances come and go</text>

  <g filter="url(#sd1-soft)">
    <rect x="838" y="618" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="838" y="618" width="6" height="90" fill="#059669" clip-path="url(#sd1-b3)"/>
  </g>
  <circle cx="876" cy="663" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,652.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="902" y="670" font-size="18.5" font-weight="600" fill="#111827">Healthy Instances</text>
  <text x="1003" y="733" font-size="15.5" text-anchor="middle" fill="#6B7280">10.0.0.1 and 10.0.0.9</text>
  <text x="1003" y="756" font-size="15.5" text-anchor="middle" fill="#94A3B8">the dead one is not returned</text>

  
  <rect x="40" y="832" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="856" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="878" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Why it breaks</text>
  <text x="288" y="878" font-size="15.5" fill="#475569">instances start, stop and move, so any list written down by hand is wrong shortly after you write it</text>

  <rect x="64" y="900" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="922" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">What changes</text>
  <text x="288" y="922" font-size="15.5" fill="#475569">the client looks up a name at call time, so scaling up or losing a machine needs no client change</text>
</svg>