<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six NoSQL types, each with the shape of data it stores and what it is used for">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <filter id="db4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="60" y="66" font-size="20" font-weight="700" fill="#334155">Six types, six different shapes of data</text>

  <g filter="url(#db4-soft)">
    <rect x="60" y="94" width="300" height="66" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="174" width="300" height="66" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="60" y="254" width="300" height="66" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="334" width="300" height="66" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="60" y="414" width="300" height="66" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="60" y="494" width="300" height="52" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <text x="210" y="134" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Key-value</text>
  <text x="210" y="214" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">In-memory key-value</text>
  <text x="210" y="294" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Document</text>
  <text x="210" y="374" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Wide-column</text>
  <text x="210" y="454" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">Graph</text>
  <text x="210" y="527" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Time series</text>

  <text x="400" y="126" font-size="20" fill="#0F172A">A unique key, and the value beside it</text>
  <text x="400" y="154" font-size="20" fill="#475569">sessions, preferences, recommendations</text>

  <text x="400" y="206" font-size="20" fill="#0F172A">The same, held in RAM instead of on disk</text>
  <text x="400" y="234" font-size="20" fill="#475569">Redis, Memcached, Amazon Elasticache</text>

  <text x="400" y="286" font-size="20" fill="#0F172A">Documents in JSON, BSON, XML or YAML</text>
  <text x="400" y="314" font-size="20" fill="#475569">user profiles, product catalogs, content</text>

  <text x="400" y="366" font-size="20" fill="#0F172A">Tables without a strict column format</text>
  <text x="400" y="394" font-size="20" fill="#475569">telemetry, analytics, messaging</text>

  <text x="400" y="446" font-size="20" fill="#0F172A">Nodes are values, edges are relationships</text>
  <text x="400" y="474" font-size="20" fill="#475569">social graphs, recommendations, fraud</text>

  <text x="400" y="527" font-size="20" fill="#0F172A">Streams ordered by time, not by value</text>
</svg>