<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ranges-title ranges-desc">
<title id="ranges-title">Estimate in ranges, not points</title>
<desc id="ranges-desc">Three inputs each uncertain by a factor of two produce a result spanning a factor of sixty-four. If the whole range falls on one side of the decision threshold you are finished; if it straddles the threshold you have found the input worth measuring.</desc>
<defs>
<marker id="ranges-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ranges-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ranges-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ranges-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="762" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Estimate in ranges, not points</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Suppose three inputs are each uncertain by a factor of two in either direction.</text>
<rect x="40" y="684" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="684" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="140" y="118" width="280" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Users</text>
<text x="280" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">half to double</text>
<text x="450" y="153" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">x</text>
<rect x="480" y="118" width="280" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Requests each</text>
<text x="620" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">half to double</text>
<text x="790" y="153" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">x</text>
<rect x="820" y="118" width="280" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="960" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Bytes each</text>
<text x="960" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">half to double</text>
<path d="M620 212V244" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 212V244" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ranges-marker-slate)"/>
<rect x="40" y="250" width="1160" height="78" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="250" width="5" height="78" rx="2.5" fill="#F28B9D"/><text x="64" y="282" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The product spans a factor of sixty-four</text><text x="64" y="308" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">eight times too low to eight times too high</text>
<text x="40" y="364" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">So compare the RANGE against the threshold</text>
<rect x="40" y="382" width="560" height="178" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 382H46A6 6 0 0 0 40 388V554A6 6 0 0 0 46 560H54Z" fill="#39D5AA"/><text x="70" y="418" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Range falls on one side</text>
<rect x="72" y="438" width="320" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="72" y="438" width="144.0" height="34" rx="10" fill="#06AC80"/><path d="M472.0 429V481" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="472" y="504" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">threshold</text>
<text x="320" y="540" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">Decide, and say that you are finished</text>
<rect x="640" y="382" width="560" height="178" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 382H646A6 6 0 0 0 640 388V554A6 6 0 0 0 646 560H654Z" fill="#F3CF6A"/><text x="670" y="418" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Range straddles it</text>
<rect x="672" y="438" width="456" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="672" y="438" width="456.0" height="34" rx="10" fill="#E8BC60"/><path d="M900.0 429V481" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="900" y="504" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">threshold</text>
<text x="920" y="540" font-size="20" font-weight="700" fill="#91642E" text-anchor="middle">Name the one input worth measuring</text>
<rect x="40" y="580" width="1160" height="78" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="580" width="5" height="78" rx="2.5" fill="#AC8BE8"/><text x="64" y="610.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">You are not trying to find the right number.</text><text x="64" y="639.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">You are finding out whether you already know enough to decide.</text>
<text x="66" y="718" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The most valuable output of an estimate is often the name of the one measurement that would settle it.</text>
</svg>