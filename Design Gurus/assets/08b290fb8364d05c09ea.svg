<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pipeline-title pipeline-desc">
<title id="pipeline-title">What the pipeline actually is</title>
<desc id="pipeline-desc">Usually drawn as two boxes, which is why most of these systems disappoint. The quality of the answer is decided almost entirely by the stages before the model.</desc>
<defs>
<marker id="pipeline-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pipeline-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pipeline-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pipeline-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="740" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the pipeline actually is</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The quality of the answer is decided almost entirely by the stages before the model.</text>
<rect x="40" y="662" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="662" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="142" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Ingest side</text>
<rect x="40" y="156" width="248" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="164" y="190" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ingest</text>
<path d="M296 184H336" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M296 184H336" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="344" y="156" width="248" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="468" y="190" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">chunk</text>
<path d="M600 184H640" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M600 184H640" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="648" y="156" width="248" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="772" y="190" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">embed</text>
<path d="M904 184H944" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M904 184H944" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="952" y="156" width="248" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1076" y="190" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">index</text>
<text x="40" y="246" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Query side, where the quality is decided</text>
<rect x="40" y="262" width="196" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="138" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">rewrite</text>
<path d="M244 290H273" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M244 290H273" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="281" y="262" width="196" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="379" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">retrieve</text>
<path d="M485 290H514" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M485 290H514" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="522" y="262" width="196" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">rerank</text>
<path d="M726 290H755" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M726 290H755" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="763" y="262" width="196" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="861" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">assemble</text>
<path d="M967 290H996" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M967 290H996" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="1004" y="262" width="196" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1102" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">generate</text>
<rect x="40" y="338" width="1160" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="338" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="374" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The model is not the part you are designing</text><text x="64" y="400" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It is a fixed component that turns a context window into prose.</text><text x="64" y="426" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">What you control is what goes into that window.</text>
<rect x="40" y="468" width="1160" height="90" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="468" width="5" height="90" rx="2.5" fill="#F28B9D"/><text x="64" y="506" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">If the right passage is not in the context, no prompting recovers it.</text><text x="64" y="532" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Retrieval failure is the dominant failure mode and it is invisible in the output.</text>
<rect x="40" y="578" width="1160" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="612" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A product with a quality metric, not a feature with a status</text>
<text x="66" y="696" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A search and ranking problem, which systems people already know how to reason about.</text>
</svg>