<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same event stream cut three ways: tumbling windows that do not overlap, sliding windows that do, and session windows that end after a gap of silence">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>
  <defs>
    <marker id="ms7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One endless stream, three ways to cut it into something you can compute on</text>

  <text x="140" y="90" font-size="20" font-weight="600" fill="#475569">One event stream</text>
  <line x1="140" y1="118" x2="1180" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#ms7-slate)"/>
  <circle cx="174" cy="118" r="9" fill="#475569"/>
  <circle cx="242" cy="118" r="9" fill="#475569"/>
  <circle cx="276" cy="118" r="9" fill="#475569"/>
  <circle cx="378" cy="118" r="9" fill="#475569"/>
  <circle cx="412" cy="118" r="9" fill="#475569"/>
  <circle cx="548" cy="118" r="9" fill="#475569"/>
  <circle cx="582" cy="118" r="9" fill="#475569"/>
  <circle cx="888" cy="118" r="9" fill="#475569"/>
  <circle cx="922" cy="118" r="9" fill="#475569"/>
  <circle cx="1024" cy="118" r="9" fill="#475569"/>

  <text x="140" y="148" font-size="20" fill="#64748B" text-anchor="middle">0</text>
  <text x="310" y="148" font-size="20" fill="#64748B" text-anchor="middle">5</text>
  <text x="480" y="148" font-size="20" fill="#64748B" text-anchor="middle">10</text>
  <text x="650" y="148" font-size="20" fill="#64748B" text-anchor="middle">15</text>
  <text x="820" y="148" font-size="20" fill="#64748B" text-anchor="middle">20</text>
  <text x="990" y="148" font-size="20" fill="#64748B" text-anchor="middle">25</text>
  <text x="1160" y="148" font-size="20" fill="#64748B" text-anchor="middle">30 min</text>

  
  <text x="140" y="196" font-size="20" font-weight="600" fill="#1E40AF">Tumbling: fixed 5 minute blocks, no overlap</text>
  <rect x="143" y="210" width="164" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="225" y="242" font-size="20" fill="#1E40AF" text-anchor="middle">0-5</text>
  <rect x="313" y="210" width="164" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="395" y="242" font-size="20" fill="#1E40AF" text-anchor="middle">5-10</text>
  <rect x="483" y="210" width="164" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="565" y="242" font-size="20" fill="#1E40AF" text-anchor="middle">10-15</text>
  <rect x="653" y="210" width="164" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="735" y="242" font-size="20" fill="#1E40AF" text-anchor="middle">15-20</text>
  <rect x="823" y="210" width="164" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="905" y="242" font-size="20" fill="#1E40AF" text-anchor="middle">20-25</text>
  <rect x="993" y="210" width="164" height="50" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1075" y="242" font-size="20" fill="#1E40AF" text-anchor="middle">25-30</text>

  
  <text x="140" y="298" font-size="20" font-weight="600" fill="#92400E">Sliding: 10 minute windows starting every 5 minutes</text>
  <rect x="143" y="312" width="334" height="46" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="310" y="341" font-size="20" fill="#92400E" text-anchor="middle">0-10</text>
  <rect x="483" y="312" width="334" height="46" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="650" y="341" font-size="20" fill="#92400E" text-anchor="middle">10-20</text>
  <rect x="823" y="312" width="334" height="46" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="990" y="341" font-size="20" fill="#92400E" text-anchor="middle">20-30</text>
  <rect x="313" y="364" width="334" height="46" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="480" y="393" font-size="20" fill="#92400E" text-anchor="middle">5-15</text>
  <rect x="653" y="364" width="334" height="46" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="820" y="393" font-size="20" fill="#92400E" text-anchor="middle">15-25</text>

  
  <text x="140" y="448" font-size="20" font-weight="600" fill="#5B21B6">Session: a new window after 5 minutes of silence</text>
  <rect x="160" y="462" width="440" height="50" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="380" y="494" font-size="20" fill="#5B21B6" text-anchor="middle">session 1</text>
  <text x="735" y="494" font-size="20" fill="#64748B" text-anchor="middle">silence closes it</text>
  <rect x="870" y="462" width="175" height="50" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="957" y="494" font-size="20" fill="#5B21B6" text-anchor="middle">session 2</text>

  
  <rect x="50" y="546" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="582" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">All three answer one question: how do you cut an endless stream into finite pieces?</text>
  <text x="620" y="612" font-size="20" fill="#334155" text-anchor="middle">Tumbling for periodic reports, sliding for moving averages, session for one user's visit.</text>
</svg>