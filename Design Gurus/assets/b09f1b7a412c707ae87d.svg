<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Requests 1, 2 and 3 each take one of three semaphore slots and use the database. Request 4 waits for a free slot and enters when one is released.">
  <defs>
    <filter id="cc3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cc3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cc3-k1"><rect x="40" y="130" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cc3-k2"><rect x="343" y="130" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cc3-k3"><rect x="646" y="130" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cc3-k4"><rect x="949" y="130" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cc3-k5"><rect x="40" y="330" width="860" height="90" rx="12"/></clipPath>
    <marker id="cc3-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cc3-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="910" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A semaphore limits how many can enter</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three database connections, four requests. The fourth request waits for a free slot.</text>



  <g fill="none" stroke-width="2">
    <path d="M165,220 V330" stroke="#059669" marker-end="url(#cc3-m-emerald)"/>
    <path d="M468,220 V330" stroke="#059669" marker-end="url(#cc3-m-emerald)"/>
    <path d="M771,220 V330" stroke="#059669" marker-end="url(#cc3-m-emerald)"/>
    <path d="M470,420 V504" stroke="#2563EB" marker-end="url(#cc3-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="215" y="282" fill="#047857">slot 1</text>
    <text x="518" y="282" fill="#047857">slot 2</text>
    <text x="821" y="282" fill="#047857">slot 3</text>
  </g>

  <g filter="url(#cc3-soft)">
    <rect x="40" y="130" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#059669" clip-path="url(#cc3-k1)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">Request 1</text>
  <g filter="url(#cc3-soft)">
    <rect x="343" y="130" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="343" y="130" width="6" height="90" fill="#059669" clip-path="url(#cc3-k2)"/>
  </g>
  <circle cx="381" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="407" y="182" font-size="21.5" font-weight="600" fill="#111827">Request 2</text>
  <g filter="url(#cc3-soft)">
    <rect x="646" y="130" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="646" y="130" width="6" height="90" fill="#059669" clip-path="url(#cc3-k3)"/>
  </g>
  <circle cx="684" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="710" y="182" font-size="21.5" font-weight="600" fill="#111827">Request 3</text>
  <g filter="url(#cc3-soft)">
    <rect x="949" y="130" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="949" y="130" width="6" height="90" fill="#DB2777" clip-path="url(#cc3-k4)"/>
  </g>
  <circle cx="987" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,164.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="1013" y="182" font-size="21.5" font-weight="600" fill="#111827">Request 4</text>
  <text x="1074" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">waits for a free slot</text>
  <text x="1074" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">enters when one is released</text>
  <g filter="url(#cc3-lift)">
    <rect x="40" y="330" width="860" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="40" y="330" width="9" height="90" fill="#2563EB" clip-path="url(#cc3-k5)"/>
  </g>
  <circle cx="78" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="104" y="382" font-size="21.5" font-weight="600" fill="#111827">Semaphore with 3 slots</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M320,520 L320,594 A150,16 0 0 0 620,594 L620,520" fill="#E0E7FF"/>
    <ellipse cx="470" cy="520" rx="150" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="470" y="572" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="470" y="644" font-size="18.5" text-anchor="middle" fill="#6B7280">3 connections at a time</text>

  <rect x="40" y="680" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Has a slot</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">may use a database connection now</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Waiting</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">sleeps until another request releases its slot</text>
  <rect x="64" y="805" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="830" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">One slot</text>
  <text x="323" y="830" font-size="18.5" fill="#475569">a semaphore with a single slot works like a mutex</text>
</svg>