<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1254" viewBox="0 0 1240 1254" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated API gateway architecture: control plane and data plane separation, middleware chain, shared rate limit counters and resilience patterns">
  <defs>
    <filter id="ag-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="ag-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ag-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ag-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ag-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ag-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1254" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">API gateway: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Config in RAM, a middleware chain on the hot path, and one shared counter</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#92400E">1. Control plane · config is pushed, never queried per request</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ag-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ag-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">save</text>
  <path d="M890,194 L975,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ag-amber)"/>
  <text x="933" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">notify</text>
  <g filter="url(#ag-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Developer</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">adds a route</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Admin API</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">the only writer</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Config DB</text>
  <text x="776" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">small and relational</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Pub/Sub</text>
  <text x="1089" y="262" font-size="20" fill="#92400E" text-anchor="middle">every node subscribes</text>

  <rect x="24" y="338" width="1192" height="332" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#1E40AF">2. Data plane · the middleware chain, in order, on every request</text>
  <path d="M364,436 L456,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ag-blue)"/>
  <text x="410" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">TLS</text>
  <path d="M784,436 L876,436" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#ag-blue)"/>
  <text x="830" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">proxy</text>
  <path d="M620,474 L620,514" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ag-emerald)"/>
  <text x="638" y="502" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">match</text>
  <path d="M1040,474 L1040,514" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ag-blue)"/>
  <text x="1058" y="502" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">where?</text>
  <g filter="url(#ag-soft)">
    <rect x="40" y="398" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="398" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M460,533 L460,579 A160,15 0 0 0 780,579 L780,533" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="533" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="518" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="200" y="458" font-size="20" fill="#64748B" text-anchor="middle">12,000 QPS</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Gateway node</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">stateless, RAM only</text>
  <text x="1040" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Backend</text>
  <text x="1040" y="458" font-size="20" fill="#64748B" text-anchor="middle">plain HTTP inside</text>
  <text x="620" y="567" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Route trie</text>
  <text x="620" y="624" font-size="20" fill="#065F46" text-anchor="middle">in local RAM, O(1)</text>
  <text x="1040" y="552" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Service registry</text>
  <text x="1040" y="578" font-size="20" fill="#64748B" text-anchor="middle">Consul or K8s DNS</text>

  <rect x="24" y="700" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="732" font-size="20" font-weight="600" fill="#475569">3. The one thing that cannot be local · the rate limit counter</text>
  <path d="M364,798 L456,798" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ag-blue)"/>
  <text x="410" y="786" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">incr</text>
  <path d="M784,798 L876,798" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ag-blue)"/>
  <text x="830" y="786" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">over</text>
  <g filter="url(#ag-soft)">
    <rect x="40" y="760" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M460,775 L460,821 A160,15 0 0 0 780,821 L780,775" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="775" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="760" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="794" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Gateway node</text>
  <text x="200" y="820" font-size="20" fill="#64748B" text-anchor="middle">any node, same user</text>
  <text x="620" y="809" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis cluster</text>
  <text x="620" y="866" font-size="20" fill="#065F46" text-anchor="middle">shared atomic counter</text>
  <text x="1040" y="794" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">429</text>
  <text x="1040" y="820" font-size="20" fill="#64748B" text-anchor="middle">backend never knows</text>

  <rect x="24" y="942" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="974" font-size="20" font-weight="600" fill="#475569">4. Protecting the backends · fail fast, and never proxy a large file</text>
  <path d="M364,1040 L456,1040" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ag-blue)"/>
  <text x="410" y="1028" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">strict</text>
  <path d="M784,1040 L876,1040" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ag-blue)"/>
  <text x="830" y="1028" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">big files</text>
  <g filter="url(#ag-soft)">
    <rect x="40" y="1002" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="1002" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M880,1017 L880,1063 A160,15 0 0 0 1200,1063 L1200,1017" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="1017" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="1036" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Circuit breaker</text>
  <text x="200" y="1062" font-size="20" fill="#64748B" text-anchor="middle">5 fails, 30s open</text>
  <text x="620" y="1036" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Timeouts</text>
  <text x="620" y="1062" font-size="20" fill="#64748B" text-anchor="middle">never hang forever</text>
  <text x="1040" y="1051" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Presigned S3</text>
  <text x="1040" y="1108" font-size="20" fill="#5B21B6" text-anchor="middle">uploads bypass us</text>
  <line x1="44" y1="1214" x2="72" y2="1214" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1221" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1214" x2="344.576" y2="1214" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1221" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1205" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1221" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1205" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1221" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1205" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1221" font-size="20" fill="#475569">core service</text>
</svg>