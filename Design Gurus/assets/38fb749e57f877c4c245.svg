<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Request-reply over messaging: a request travels through a request queue to the replier, and the reply comes back through a reply queue, matched by a correlation ID">
  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>
  <defs>
    <marker id="dm5-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="dm5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M195,220 C195,140 350,96 486,96" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm5-amber)"/>
  <text x="340" y="172" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. request, correlation ID 42,</text>
  <text x="340" y="200" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">plus a reply-to address</text>

  <path d="M754,96 C900,96 1045,96 1045,220" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm5-amber)"/>
  <text x="900" y="186" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. replier picks up the request</text>

  <path d="M1045,296 C1045,436 900,436 754,436" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm5-amber)"/>
  <text x="900" y="326" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. reply, correlation ID 42</text>

  <path d="M486,436 C340,436 195,436 195,296" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm5-amber)"/>
  <text x="340" y="326" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. requester matches ID 42</text>

  
  <g filter="url(#dm5-soft)">
    <rect x="490" y="60" width="260" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="490" y="400" width="260" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="620" y="90" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Request queue</text>
  <text x="620" y="118" font-size="20" fill="#64748B" text-anchor="middle">holds pending requests</text>
  <text x="620" y="430" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Reply queue</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">holds finished replies</text>

  
  <g filter="url(#dm5-soft)">
    <rect x="60" y="220" width="270" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="910" y="220" width="270" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="195" y="250" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Requester</text>
  <text x="195" y="278" font-size="20" fill="#64748B" text-anchor="middle">e.g., web service</text>
  <text x="1045" y="250" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replier</text>
  <text x="1045" y="278" font-size="20" fill="#64748B" text-anchor="middle">e.g., reporting service</text>

  
  <rect x="295" y="512" width="650" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="543" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The requester keeps working while it waits.</text>
  <text x="620" y="571" font-size="20" fill="#64748B" text-anchor="middle">A timeout handles the case where the reply never arrives.</text>
</svg>