<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="the four ways two intervals can sit">
<defs>
<filter id="eb-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">With a starting no later than b, there are four cases</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">sorting by start time is what reduces the possibilities to these four</text>
<rect x="40" y="100" width="1160" height="320" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="116" y="162" text-anchor="end" font-size="19" font-weight="600" fill="#475569">1</text>
<rect x="150" y="128" width="123" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="211.5" y="146" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="334.5" y="158" width="102.5" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="385.75" y="176" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="162" font-size="18" fill="#475569">a and b do not overlap at all</text>
<text x="116" y="226" text-anchor="end" font-size="19" font-weight="600" fill="#475569">2</text>
<rect x="150" y="192" width="164" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="232" y="210" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="252.5" y="222" width="164" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="334.5" y="240" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="226" font-size="18" fill="#B45309">b starts inside a and ends after it</text>
<text x="116" y="290" text-anchor="end" font-size="19" font-weight="600" fill="#475569">3</text>
<rect x="150" y="256" width="205" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="252.5" y="274" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="182.8" y="286" width="110.69999999999999" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="238.15" y="304" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="290" font-size="18" fill="#B45309">b sits entirely inside a</text>
<text x="116" y="354" text-anchor="end" font-size="19" font-weight="600" fill="#475569">4</text>
<rect x="150" y="320" width="143.5" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="221.75" y="338" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="150" y="350" width="246" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="273" y="368" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="354" font-size="18" fill="#B45309">a and b start together, and b runs longer</text>
</svg>