<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four ways message ordering breaks: multiple partitions, parallel consumers, repartitioning, and retries after a failure, each with the fix that restores it">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Four ways the order you thought you had disappears</text>

  
  <rect x="50" y="88" width="560" height="200" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#FFFBEB"/>
  <text x="330" y="122" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Multiple partitions</text>
  <text x="70" y="180" font-size="20" fill="#0F172A">Each partition keeps its own order. Across</text>
  <text x="70" y="210" font-size="20" fill="#0F172A">partitions there is none, so a fast one overtakes a slow one.</text>
  <text x="70" y="256" font-size="20" font-weight="600" fill="#065F46">Fix: key everything that must stay ordered together.</text>

  
  <rect x="630" y="88" width="560" height="200" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M630 100 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#FFFBEB"/>
  <text x="910" y="122" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Parallel consumers</text>
  <text x="650" y="180" font-size="20" fill="#0F172A">Two workers take message 1 and message 2. The</text>
  <text x="650" y="210" font-size="20" fill="#0F172A">second finishes first, so the effects land out of order.</text>
  <text x="650" y="256" font-size="20" font-weight="600" fill="#065F46">Fix: one consumer per partition, as Kafka enforces.</text>

  
  <rect x="50" y="310" width="560" height="200" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M50 322 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#F5F3FF"/>
  <text x="330" y="344" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Repartitioning</text>
  <text x="70" y="402" font-size="20" fill="#0F172A">Adding partitions rehashes the keys, so a key's new</text>
  <text x="70" y="432" font-size="20" fill="#0F172A">events land somewhere its old events never did.</text>
  <text x="70" y="478" font-size="20" font-weight="600" fill="#065F46">Fix: choose the partition count up front.</text>

  
  <rect x="630" y="310" width="560" height="200" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M630 322 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#FEF2F2"/>
  <text x="910" y="344" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Retries and redelivery</text>
  <text x="650" y="402" font-size="20" fill="#0F172A">A failed message is resent behind the ones that were</text>
  <text x="650" y="432" font-size="20" fill="#0F172A">after it, so the consumer sees 1, 3, 4, then 2.</text>
  <text x="650" y="478" font-size="20" font-weight="600" fill="#065F46">Fix: let the consumer tolerate out-of-order arrival.</text>

  
  <rect x="50" y="546" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="582" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ordering is never global. It holds inside one partition, read by one consumer, and nowhere else.</text>
  <text x="620" y="612" font-size="20" fill="#334155" text-anchor="middle">Design for the scope you actually have, and put a sequence number in the payload if you must verify it.</text>
</svg>