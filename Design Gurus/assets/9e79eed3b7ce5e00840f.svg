<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A webhook endpoint must verify the signature so fake events are rejected, respond quickly by storing the event and returning 200, be idempotent by checking the event ID, and plan for missed events by fetching past events regularly.">
  <defs>
    <filter id="plw4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="plw4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="plw4-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="plw4-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="plw4-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="plw4-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The four duties of a webhook endpoint</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The URL is public, and the provider retries when it does not get a quick 200.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#plw4-lift)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="40" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#plw4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Verify</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">check the signature,</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">reject fakes</text>
  <g filter="url(#plw4-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#plw4-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Respond fast</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">store the event,</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">return 200</text>
  <g filter="url(#plw4-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#D97706" clip-path="url(#plw4-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Be idempotent</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">check the event ID</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">before acting</text>
  <g filter="url(#plw4-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#plw4-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Catch misses</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fetch past events</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">regularly</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Signature</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">made with a secret key that only the provider and the receiver know</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Slow work</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">goes to a queue, so the response stays fast</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Retries</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">mean duplicate events will arrive</text>
</svg>