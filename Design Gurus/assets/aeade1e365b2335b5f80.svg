<rect x="40" y="490" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="530" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">In sorted order, take the numbers two at a time and keep the first of each pair</text>
<text x="620" y="562" text-anchor="middle" font-size="18.5" fill="#475569">Pairing a number with anything further away only wastes the larger one</text>
</svg>