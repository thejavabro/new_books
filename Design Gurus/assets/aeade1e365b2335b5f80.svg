<rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Pair the numbers so the smaller of each pair adds up to as much as possible</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The numbers are [1, 1, 1, 1, 2, 2], and sorted order settles it: pair each with its neighbour</text>
<rect x="40" y="106" width="1160" height="366" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One count per distinct value, already in order</text>
