<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1075" viewBox="0 0 1240 1075" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Yelp data model: Places and Reviews tables in the database on disk, and the in-memory QuadTree index whose leaf entries keep only the LocationID and the coordinates of each place">
<defs>
<filter id="yp1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="yp1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="yp1-mbl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="yp1-mem" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="yp1-mind" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<clipPath id="yp1-k1"><rect x="90" y="115" width="470" height="286" rx="12"/></clipPath>
<clipPath id="yp1-k2"><rect x="760" y="115" width="430" height="214" rx="12"/></clipPath>
<clipPath id="yp1-k3"><rect x="90" y="595" width="400" height="178" rx="12"/></clipPath>
<clipPath id="yp1-k4"><rect x="690" y="595" width="470" height="214" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="1075" fill="#FFFFFF"/>
<rect x="40" y="50" width="1160" height="430" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="64" y="80" font-size="16.5" font-weight="600" fill="#475569">Database, the full records on disk</text><rect x="40" y="530" width="1160" height="345" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><text x="64" y="560" font-size="16.5" font-weight="600" fill="#1D4ED8">Search index, in QuadTree server memory</text><path d="M 560,189 H 757" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#yp1-mem)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="172" fill="#047857">one place, many reviews</text></g><path d="M 690,741 H 493" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#yp1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="590" y="724" fill="#4338CA">up to 500 entries per leaf</text></g><path d="M 460,595 V 404" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#yp1-mbl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="460" y="496" fill="#1D4ED8">LocationID points</text><text x="460" y="518" fill="#1D4ED8">to the full row</text></g><g filter="url(#yp1-soft)">
<rect x="90" y="115" width="470" height="286" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="90" y="115" width="6" height="286" fill="#2563EB" clip-path="url(#yp1-k1)"/>
</g>
<circle cx="128" cy="143" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,132.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></g>
<text x="154" y="150" font-size="18.5" font-weight="600" fill="#111827">Places (one row per place)</text><text x="114" y="196" font-size="15.5" fill="#111827">LocationID</text><text x="536" y="196" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes, primary key</text><line x1="104" y1="207" x2="546" y2="207" stroke="#93C5FD" stroke-width="1"/><text x="114" y="232" font-size="15.5" fill="#111827">Name</text><text x="536" y="232" font-size="15.5" text-anchor="end" fill="#6B7280">256 bytes</text><line x1="104" y1="243" x2="546" y2="243" stroke="#93C5FD" stroke-width="1"/><text x="114" y="268" font-size="15.5" fill="#111827">Latitude</text><text x="536" y="268" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><line x1="104" y1="279" x2="546" y2="279" stroke="#93C5FD" stroke-width="1"/><text x="114" y="304" font-size="15.5" fill="#111827">Longitude</text><text x="536" y="304" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><line x1="104" y1="315" x2="546" y2="315" stroke="#93C5FD" stroke-width="1"/><text x="114" y="340" font-size="15.5" fill="#111827">Description</text><text x="536" y="340" font-size="15.5" text-anchor="end" fill="#6B7280">512 bytes</text><line x1="104" y1="351" x2="546" y2="351" stroke="#93C5FD" stroke-width="1"/><text x="114" y="376" font-size="15.5" fill="#111827">Category</text><text x="536" y="376" font-size="15.5" text-anchor="end" fill="#6B7280">1 byte</text><text x="325" y="426" font-size="15.5" text-anchor="middle" fill="#6B7280">793 bytes per row</text><text x="325" y="449" font-size="15.5" text-anchor="middle" fill="#94A3B8">about 400 GB for 500M places</text><g filter="url(#yp1-soft)">
<rect x="760" y="115" width="430" height="214" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<rect x="760" y="115" width="6" height="214" fill="#059669" clip-path="url(#yp1-k2)"/>
</g>
<circle cx="798" cy="143" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,132.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.6 6 .6-4.5 4.1 1.3 5.9-5.3-3.1-5.3 3.1 1.3-5.9L5.5 9.2l6-.6z"/></g>
<text x="824" y="150" font-size="18.5" font-weight="600" fill="#111827">Reviews (many rows per place)</text><text x="784" y="196" font-size="15.5" fill="#111827">LocationID</text><text x="1166" y="196" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes, the key</text><line x1="774" y1="207" x2="1176" y2="207" stroke="#6EE7B7" stroke-width="1"/><text x="784" y="232" font-size="15.5" fill="#111827">ReviewID</text><text x="1166" y="232" font-size="15.5" text-anchor="end" fill="#6B7280">4 bytes</text><line x1="774" y1="243" x2="1176" y2="243" stroke="#6EE7B7" stroke-width="1"/><text x="784" y="268" font-size="15.5" fill="#111827">ReviewText</text><text x="1166" y="268" font-size="15.5" text-anchor="end" fill="#6B7280">512 bytes</text><line x1="774" y1="279" x2="1176" y2="279" stroke="#6EE7B7" stroke-width="1"/><text x="784" y="304" font-size="15.5" fill="#111827">Rating</text><text x="1166" y="304" font-size="15.5" text-anchor="end" fill="#6B7280">1 byte, stars out of ten</text><text x="975" y="354" font-size="15.5" text-anchor="middle" fill="#6B7280">photos go in a similar separate table</text><g filter="url(#yp1-soft)">
<rect x="90" y="595" width="400" height="178" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="90" y="595" width="6" height="178" fill="#7C3AED" clip-path="url(#yp1-k3)"/>
</g>
<circle cx="128" cy="623" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,612.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
<text x="154" y="630" font-size="18.5" font-weight="600" fill="#111827">Place entry (in a leaf)</text><text x="114" y="676" font-size="15.5" fill="#111827">LocationID</text><text x="466" y="676" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><line x1="104" y1="687" x2="476" y2="687" stroke="#C4B5FD" stroke-width="1"/><text x="114" y="712" font-size="15.5" fill="#111827">Latitude</text><text x="466" y="712" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><line x1="104" y1="723" x2="476" y2="723" stroke="#C4B5FD" stroke-width="1"/><text x="114" y="748" font-size="15.5" fill="#111827">Longitude</text><text x="466" y="748" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><text x="290" y="798" font-size="15.5" text-anchor="middle" fill="#6B7280">24 bytes per place; 12 GB for 500M places</text><g filter="url(#yp1-lift)">
<rect x="690" y="595" width="470" height="214" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
<rect x="690" y="595" width="9" height="214" fill="#4F46E5" clip-path="url(#yp1-k4)"/>
</g>
<circle cx="728" cy="623" r="18" fill="#FFFFFF"/>
<g transform="translate(717.56,612.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
<text x="754" y="630" font-size="18.5" font-weight="600" fill="#111827">QuadTree node (one per map square)</text><text x="714" y="676" font-size="15.5" fill="#111827">Square</text><text x="1136" y="676" font-size="15.5" text-anchor="end" fill="#6B7280">the part of the map it covers</text><line x1="704" y1="687" x2="1146" y2="687" stroke="#A5B4FC" stroke-width="1"/><text x="714" y="712" font-size="15.5" fill="#111827">Children</text><text x="1136" y="712" font-size="15.5" text-anchor="end" fill="#6B7280">4 pointers, 8 bytes each</text><line x1="704" y1="723" x2="1146" y2="723" stroke="#A5B4FC" stroke-width="1"/><text x="714" y="748" font-size="15.5" fill="#111827">Places</text><text x="1136" y="748" font-size="15.5" text-anchor="end" fill="#6B7280">up to 500, leaf nodes only</text><line x1="704" y1="759" x2="1146" y2="759" stroke="#A5B4FC" stroke-width="1"/><text x="714" y="784" font-size="15.5" fill="#111827">Neighbors</text><text x="1136" y="784" font-size="15.5" text-anchor="end" fill="#6B7280">linked leaves, parent pointer</text><text x="925" y="834" font-size="15.5" text-anchor="middle" fill="#6B7280">step 6 builds and partitions this tree</text><rect x="40" y="905" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="931" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="953" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Tiny index records</text><text x="288" y="953" font-size="15.5" fill="#475569">memory keeps only the LocationID and coordinates, 24 bytes per place, about 12 GB for 500 million places</text><rect x="64" y="975" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/><text x="164" y="997" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Room to grow</text><text x="288" y="997" font-size="15.5" fill="#475569">LocationID gets 8 bytes instead of 4 because places roughly double in about four years</text>
</svg>