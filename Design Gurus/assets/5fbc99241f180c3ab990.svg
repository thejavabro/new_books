<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="694" viewBox="0 0 1240 694" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The people sorted shortest first, and an empty queue">
<defs>
<filter id="qb-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="694" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Each person knows only how many at least as tall stand in front of them</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The heights are 5, 5, 6, 6, 7, 7 once sorted shortest first</text>
<rect x="40" y="106" width="1160" height="442" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Placing the shortest person first is what makes their count final</text>
<text x="170" y="228" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">shortest first</text>
<rect x="192" y="190" width="140" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="262" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="262" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">1 in front</text>
<rect x="348" y="190" width="140" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="418" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="418" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">0 in front</text>
<rect x="504" y="190" width="140" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="574" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="574" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">2 in front</text>
<rect x="660" y="190" width="140" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="730" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="730" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">0 in front</text>
<rect x="816" y="190" width="140" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="886" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="886" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">1 in front</text>
<rect x="972" y="190" width="140" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="1042" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="1042" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">0 in front</text>
<text x="138" y="480" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the queue</text>
<rect x="160" y="442" width="140" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="230" y="479.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="230" y="524" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot 0</text>
<rect x="316" y="442" width="140" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="386" y="479.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="386" y="524" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot 1</text>
<rect x="472" y="442" width="140" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="542" y="479.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="542" y="524" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot 2</text>
<rect x="628" y="442" width="140" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="698" y="479.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="698" y="524" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot 3</text>
<rect x="784" y="442" width="140" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="854" y="479.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="854" y="524" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot 4</text>
<rect x="940" y="442" width="140" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1010" y="479.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="1010" y="524" text-anchor="middle" font-size="15.5" fill="#94A3B8">slot 5</text>
<text x="620" y="330" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">A person already placed is never disturbed by someone taller arriving later</text>
<text x="620" y="360" text-anchor="middle" font-size="18" fill="#475569">So the shortest person can be placed straight into the slot their own count names</text>
<rect x="40" y="570" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="610" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Nobody shorter is ever added afterwards, so a placed count stays correct</text>
<text x="620" y="642" text-anchor="middle" font-size="18.5" fill="#475569">Among equal heights, the one with more people in front is placed first for the same reason</text>
</svg>