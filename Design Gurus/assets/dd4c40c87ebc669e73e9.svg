<rect x="596" y="416" width="220" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="706" y="444" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reclaimed 0 rows</text>
<rect x="909" y="416" width="220" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1019" y="444" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reclaimed 0 rows</text>
<rect x="40" y="484" width="1160" height="76" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="484" width="5" height="76" rx="2.5" fill="#F3CF6A"/><text x="64" y="513.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Vacuum cannot remove a version any running transaction might still need.</text><text x="64" y="542.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">One open transaction holds that horizon for EVERY table in the database.</text>
<text x="66" y="619" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A session that only ran BEGIN holds no snapshot yet. The one that hurts has run at least one query and then stopped.</text>
</svg>