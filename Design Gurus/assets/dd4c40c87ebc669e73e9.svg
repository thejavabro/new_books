<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="vacuum-title vacuum-desc">
<title id="vacuum-title">One open transaction stops vacuum</title>
<desc id="vacuum-desc">A transaction that ran one query and was then left open for six hours while ordinary update traffic continues. It holds its snapshot, so dead row versions accumulate, every vacuum run reclaims nothing, and the table bloats although application traffic never changed.</desc>
<defs>
<marker id="vacuum-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="vacuum-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="vacuum-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="vacuum-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="664" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">One open transaction stops vacuum</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A forgotten analytics query holds a transaction open for six hours.</text>
