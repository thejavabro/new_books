<rect x="913" y="178" width="86" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="956" y="207" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">UPDATE</text>
