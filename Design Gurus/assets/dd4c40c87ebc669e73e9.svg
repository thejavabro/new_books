<text x="1176" y="148" font-size="20" font-weight="400" fill="#A83147" text-anchor="end">idle in transaction, holding its snapshot, never committing</text>
<text x="204" y="187" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">Application</text>
<text x="204" y="210" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">traffic</text>
<text x="204" y="233" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">(unchanged)</text>
