  <text x="912" y="267" font-size="18.5" font-weight="600" fill="#111827">Presentation layer</text>
  <text x="1012" y="334" font-size="18.5" text-anchor="middle" fill="#6B7280">(Controller)</text>
  <g filter="url(#m02j-soft)">
    <rect x="848" y="375" width="328" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="848" y="375" width="6" height="90" fill="#059669" clip-path="url(#m02j-k8)"/>
