  <circle cx="886" cy="420" r="18" fill="#FFFFFF"/>
  <g transform="translate(875.56,409.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="912" y="427" font-size="18.5" font-weight="600" fill="#111827">Business logic layer</text>
  <text x="1012" y="494" font-size="18.5" text-anchor="middle" fill="#6B7280">(Service)</text>
  <g filter="url(#m02j-soft)">
    <rect x="848" y="535" width="328" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="848" y="535" width="6" height="90" fill="#7C3AED" clip-path="url(#m02j-k9)"/>
  </g>
  <circle cx="886" cy="580" r="18" fill="#FFFFFF"/>
  <g transform="translate(875.56,569.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="912" y="587" font-size="18.5" font-weight="600" fill="#111827">Data access layer</text>
  <text x="1012" y="654" font-size="18.5" text-anchor="middle" fill="#6B7280">(Repository)</text>
  <text x="114" y="160" font-size="19.5" font-weight="600" fill="#111827">Controller talking to</text>
  <text x="114" y="186" font-size="19.5" font-weight="600" fill="#111827">the database directly</text>
  <text x="76" y="729" font-size="18" fill="#475569">The presentation layer should not</text>
  <text x="76" y="754" font-size="18" fill="#475569">access the database directly. It</text>
  <text x="76" y="779" font-size="18" fill="#475569">should go through the business</text>
  <text x="76" y="804" font-size="18" fill="#475569">logic layer.</text>
  <text x="506" y="160" font-size="19.5" font-weight="600" fill="#111827">Repository applying</text>
  <text x="506" y="186" font-size="19.5" font-weight="600" fill="#111827">business rules</text>
  <text x="468" y="729" font-size="18" fill="#475569">The data access layer should not</text>
  <text x="468" y="754" font-size="18" fill="#475569">contain business rules. Rules such</text>
  <text x="468" y="779" font-size="18" fill="#475569">as which orders can be canceled</text>
  <text x="468" y="804" font-size="18" fill="#475569">belong in the business layer.</text>
  <text x="898" y="160" font-size="19.5" font-weight="600" fill="#111827">Business service</text>
  <text x="898" y="186" font-size="19.5" font-weight="600" fill="#111827">knowing about JSON</text>
  <text x="860" y="729" font-size="18" fill="#475569">The business layer should not</text>
  <text x="860" y="754" font-size="18" fill="#475569">accept or return JSON. It should</text>
  <text x="860" y="779" font-size="18" fill="#475569">work with domain objects, so a CLI</text>
  <text x="860" y="804" font-size="18" fill="#475569">or background job can call it too.</text>

