  <text x="128" y="587" font-size="18.5" font-weight="600" fill="#111827">Data access layer</text>
  <text x="228" y="654" font-size="18.5" text-anchor="middle" fill="#6B7280">(ORM session)</text>
  <g filter="url(#m02j-soft)">
    <rect x="456" y="215" width="328" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="456" y="215" width="6" height="90" fill="#2563EB" clip-path="url(#m02j-k4)"/>
  </g>
  <circle cx="494" cy="260" r="18" fill="#FFFFFF"/>
  <g transform="translate(483.56,249.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="520" y="267" font-size="18.5" font-weight="600" fill="#111827">Presentation layer</text>
  <text x="620" y="334" font-size="18.5" text-anchor="middle" fill="#6B7280">(Controller)</text>
  <g filter="url(#m02j-soft)">
    <rect x="456" y="375" width="328" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
