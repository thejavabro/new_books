  <text x="534" y="639" font-size="18.5" font-weight="600" fill="#111827">Business rule: under $10k</text>
  <g filter="url(#m02j-soft)">
    <rect x="848" y="215" width="328" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
