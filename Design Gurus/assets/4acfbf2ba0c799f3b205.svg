<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="High-level design of the photo hosting system: a client uploads photos through a write path that stores the photo file in object storage and its metadata in the metadata database, and views or searches photos through a read path that reads metadata first and then fetches the photo file.">
  <defs>
    <marker id="ig02-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="ig02-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>

    <filter id="ig02-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="ig02-k1"><rect x="60" y="220" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="ig02-k2"><rect x="440" y="100" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="ig02-k3"><rect x="440" y="340" width="276" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>

  
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M230,245 H318 Q330,245 330,233 V157 Q330,145 342,145 H440" marker-end="url(#ig02-pk)"/>
    <path d="M716,145 H940" marker-end="url(#ig02-pk)"/>
    <path d="M716,170 H848 Q860,170 860,182 V368 Q860,380 872,380 H940" marker-end="url(#ig02-pk)"/>
  </g>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M230,285 H318 Q330,285 330,297 V373 Q330,385 342,385 H440" marker-end="url(#ig02-bl)"/>
    <path d="M716,410 H940" marker-end="url(#ig02-bl)"/>
    <path d="M716,355 H888 Q900,355 900,343 V180 Q900,168 912,168 H940" marker-end="url(#ig02-bl)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="274" y="237" fill="#BE185D">upload</text>
    <text x="290" y="307" fill="#1D4ED8">view / search</text>
    <text x="828" y="137" fill="#BE185D">photo file</text>
    <text x="782" y="194" fill="#BE185D">photo metadata</text>
    <text x="828" y="433" fill="#1D4ED8">1. read metadata</text>
    <text x="790" y="347" fill="#1D4ED8">2. fetch photo</text>
  </g>

  
  <g filter="url(#ig02-soft)">
    <rect x="60" y="220" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="220" width="6" height="90" fill="#2563EB" clip-path="url(#ig02-k1)"/>
  </g>
  <circle cx="98" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,254.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="124" y="272" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#ig02-soft)">
    <rect x="440" y="100" width="276" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="440" y="100" width="6" height="90" fill="#DB2777" clip-path="url(#ig02-k2)"/>
  </g>
  <circle cx="478" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,134.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"/>
    <path d="M6 11l6-6 6 6"/>
    <path d="M4.5 21h15"/>
  </g>
  <text x="504" y="152" font-size="18.5" font-weight="600" fill="#111827">Upload Photo</text>
  <text x="578" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">write path</text>

  
  <g filter="url(#ig02-soft)">
    <rect x="440" y="340" width="276" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="340" width="6" height="90" fill="#2563EB" clip-path="url(#ig02-k3)"/>
  </g>
  <circle cx="478" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,374.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="504" y="392" font-size="18.5" font-weight="600" fill="#111827">View / Search Photo</text>
  <text x="578" y="455" font-size="15.5" text-anchor="middle" fill="#6B7280">read path</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M940,100 L940,174 A105,16 0 0 0 1150,174 L1150,100" fill="#FEF3C7"/>
    <ellipse cx="1045" cy="100" rx="105" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1045" y="152" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Object Storage</text>
  <text x="1045" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">photo files, 200 KB each</text>
  <text x="1045" y="238" font-size="15.5" text-anchor="middle" fill="#94A3B8">written once</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M940,345 L940,414 A105,16 0 0 0 1150,414 L1150,345" fill="#EDE9FE"/>
    <ellipse cx="1045" cy="345" rx="105" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1045" y="395" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Metadata DB</text>
  <text x="1045" y="455" font-size="15.5" text-anchor="middle" fill="#6B7280">User, Photo, UserFollow rows</text>

  
  <rect x="40" y="502" width="1160" height="80" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="536" text-anchor="middle" font-size="16" fill="#475569">An upload writes the photo file to object storage and the photo's metadata to the database.</text>
  <text x="620" y="562" text-anchor="middle" font-size="16" fill="#475569">A view or search reads metadata first, then fetches the photo file.</text>
</svg>