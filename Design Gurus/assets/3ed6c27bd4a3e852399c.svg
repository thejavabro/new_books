<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated typeahead architecture: in memory trie serving, offline aggregation pipeline, atomic zero downtime index swap and trending merge">
  <defs>
    <filter id="ta-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="ta-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ta-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ta-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ta-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ta-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Typeahead: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">A 3 GB trie replicated everywhere, answers precomputed into the nodes, and no database on the read path</text>

  <rect x="24" y="96" width="1192" height="166" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Serving · 116,000 QPS, and not one database call</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ta-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">prefix</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ta-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">random</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#ta-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">O(1)</text>
  <g filter="url(#ta-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="666" y="156" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="979" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Search box</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">every keystroke</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Load balancer</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">any server will do</text>
  <text x="776" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Trie in RAM</text>
  <text x="776" y="216" font-size="20" fill="#64748B" text-anchor="middle">full copy, 3 GB</text>
  <text x="1089" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Top 5</text>
  <text x="1089" y="216" font-size="20" fill="#64748B" text-anchor="middle">read, not computed</text>

  <rect x="24" y="292" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="324" font-size="20" font-weight="600" fill="#475569">2. The trick · the answer is stored inside every node at build time</text>
  <path d="M364,390 L456,390" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ta-blue)"/>
  <text x="410" y="378" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>
  <path d="M784,390 L876,390" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ta-blue)"/>
  <text x="830" y="378" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">return</text>
  <g filter="url(#ta-soft)">
    <path d="M40,367 L40,413 A160,15 0 0 0 360,413 L360,367" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="200" cy="367" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M460,367 L460,413 A160,15 0 0 0 780,413 L780,367" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="367" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="352" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="401" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node a-m-a</text>
  <text x="200" y="458" font-size="20" fill="#065F46" text-anchor="middle">walk 3 characters</text>
  <text x="620" y="401" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Top-K list</text>
  <text x="620" y="458" font-size="20" fill="#065F46" text-anchor="middle">precomputed, in the node</text>
  <text x="1040" y="386" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">No subtree scan</text>
  <text x="1040" y="412" font-size="20" fill="#64748B" text-anchor="middle">memory buys time</text>

  <rect x="24" y="534" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="566" font-size="20" font-weight="600" fill="#92400E">3. Learning what is popular · hours behind, and that is fine</text>
  <path d="M264,632 L349,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ta-amber)"/>
  <text x="307" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">log</text>
  <path d="M577,632 L662,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ta-amber)"/>
  <text x="620" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>
  <path d="M890,632 L975,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ta-amber)"/>
  <text x="933" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">commit</text>
  <g filter="url(#ta-soft)">
    <rect x="40" y="594" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M353,609 L353,655 A110,15 0 0 0 573,655 L573,609" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="609" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="594" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,609 L979,655 A110,15 0 0 0 1199,655 L1199,609" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="609" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Search logs</text>
  <text x="150" y="654" font-size="20" fill="#64748B" text-anchor="middle">sampled 1 in 100</text>
  <text x="463" y="643" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="463" y="700" font-size="20" fill="#92400E" text-anchor="middle">absorbs the spikes</text>
  <text x="776" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Aggregators</text>
  <text x="776" y="654" font-size="20" fill="#64748B" text-anchor="middle">counts per term</text>
  <text x="1089" y="643" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Counts DB</text>
  <text x="1089" y="700" font-size="20" fill="#5B21B6" text-anchor="middle">top 100 million terms</text>

  <rect x="24" y="776" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="808" font-size="20" font-weight="600" fill="#475569">4. Swapping the index · never take a server out of rotation</text>
  <path d="M364,874 L456,874" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ta-amber)"/>
  <text x="410" y="862" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>
  <path d="M784,874 L876,874" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ta-amber)"/>
  <text x="830" y="862" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fetch</text>
  <g filter="url(#ta-soft)">
    <rect x="40" y="836" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M460,851 L460,897 A160,15 0 0 0 780,897 L780,851" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="620" cy="851" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="880" y="836" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="200" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Trie builder</text>
  <text x="200" y="896" font-size="20" fill="#64748B" text-anchor="middle">daily, from scratch</text>
  <text x="620" y="885" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3 snapshot</text>
  <text x="620" y="942" font-size="20" fill="#5B21B6" text-anchor="middle">versioned, rollbackable</text>
  <text x="1040" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Atomic swap</text>
  <text x="1040" y="896" font-size="20" fill="#64748B" text-anchor="middle">load side B, flip</text>
  <line x1="44" y1="1048" x2="72" y2="1048" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1055" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1048" x2="344.576" y2="1048" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1055" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1039" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1055" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1039" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1055" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1039" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1055" font-size="20" fill="#475569">core service</text>
</svg>