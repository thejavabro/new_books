<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="876" viewBox="0 0 1240 876" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three costs a GraphQL answer must design rather than mention: the server losing control of query shape, N+1 internal work behind one client request, and weaker shared caching because many shapes use one endpoint.">
  <defs>
    <filter id="pd-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="pd-k0"><rect x="64" y="97" width="36" height="24" rx="7"/></clipPath>
    <clipPath id="pd-k1"><rect x="76" y="180" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="pd-k2"><rect x="76" y="376" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="pd-k3"><rect x="76" y="572" width="500" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="876" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">One request in. Three costs to design.</text>

  <rect x="64" y="97" width="36" height="24" rx="7" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <rect x="64" y="97" width="6" height="24" fill="#DB2777" clip-path="url(#pd-k0)"/>
  <text x="112" y="115" font-size="15.5" fill="#6B7280">the cost</text>

  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M200,104 L211,115 M211,104 L200,115"/>
  </g>
  <text x="227" y="116" font-size="15.5" fill="#6B7280">what goes wrong</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M392,109 L396.5,113.5 L404,103.5"/>
  </g>
  <text x="420" y="116" font-size="15.5" fill="#6B7280">what the contract must publish</text>

  
  <rect x="40" y="160" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#pd-soft)">
    <rect x="76" y="180" width="500" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#pd-k1)"/>
  </g>
  <circle cx="114" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="232" font-size="18.5" font-weight="600" fill="#111827">The server loses control of query shape</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,285 L89,296 M89,285 L78,296"/>
  </g>
  <text x="104" y="296" font-size="15.5" fill="#6B7280">Every field is valid, but the combination is not reasonable.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,316 L82.5,320.5 L90,310.5"/>
  </g>
  <text x="104" y="322" font-size="15.5" fill="#6B7280">Maximum depth, a cost score per field, a budget per caller, and persisted production queries.</text>

  
  <rect x="40" y="356" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#pd-soft)">
    <rect x="76" y="376" width="500" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="376" width="6" height="90" fill="#DB2777" clip-path="url(#pd-k2)"/>
  </g>
  <circle cx="114" cy="421" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,410.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="428" font-size="18.5" font-weight="600" fill="#111827">N plus one internal work</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,481 L89,492 M89,481 L78,492"/>
  </g>
  <text x="104" y="492" font-size="15.5" fill="#6B7280">One list of twenty orders becomes twenty more customer calls.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,512 L82.5,516.5 L90,506.5"/>
  </g>
  <text x="104" y="518" font-size="15.5" fill="#6B7280">Batch relationship loads within one request, and cache them for that request only.</text>

  
  <rect x="40" y="552" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#pd-soft)">
    <rect x="76" y="572" width="500" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="572" width="6" height="90" fill="#DB2777" clip-path="url(#pd-k3)"/>
  </g>
  <circle cx="114" cy="617" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,606.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="624" font-size="18.5" font-weight="600" fill="#111827">Shared caching gets harder</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,677 L89,688 M89,677 L78,688"/>
  </g>
  <text x="104" y="688" font-size="15.5" fill="#6B7280">Many different shapes arrive at one endpoint, usually by POST.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,708 L82.5,712.5 L90,702.5"/>
  </g>
  <text x="104" y="714" font-size="15.5" fill="#6B7280">Persisted-operation identities, application or resolver caches, explicit invalidation.</text>

  
  <rect x="40" y="760" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="805" text-anchor="middle" font-size="16" fill="#475569">Explain these controls when proposing GraphQL.</text>
</svg>