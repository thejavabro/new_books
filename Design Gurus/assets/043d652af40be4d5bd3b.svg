<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" style="background-color:#ffffff">
<defs>
<marker id="da" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="40" y="40" width="330" height="76" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="40" width="330" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="205" y="59" text-anchor="middle" font-weight="bold">Client</text>
<text x="52" y="88" font-family="monospace" font-size="11.5">new Builder(url).method(..).build()</text>
<text x="52" y="108" font-size="11.5" fill="#414d60">holds a builder, then a finished request</text>

<rect x="520" y="40" width="400" height="188" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="40" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="720" y="59" text-anchor="middle" font-weight="bold">HttpRequest.Builder</text>
<text x="532" y="88">- url, method, headers, body : the same fields</text>
<text x="532" y="108">- timeoutSeconds, retries, followRedirects</text>
<line x1="520" y1="122" x2="920" y2="122" stroke="#6c8ebf"/>
<text x="532" y="144">+ method(String) : Builder</text>
<text x="532" y="164">+ header(String, String) : Builder</text>
<text x="532" y="184">+ timeoutSeconds(int) : Builder</text>
<text x="532" y="204">+ build() : HttpRequest</text>
<text x="600" y="222" font-size="11" fill="#b4322c">the only method that does not return a Builder</text>

<rect x="520" y="278" width="400" height="140" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="278" width="400" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="720" y="297" text-anchor="middle" font-weight="bold">HttpRequest</text>
<text x="532" y="326">- url, method, headers, body   {final}</text>
<text x="532" y="346">- timeoutSeconds, retries, followRedirects   {final}</text>
<line x1="520" y1="360" x2="920" y2="360" stroke="#6c8ebf"/>
<text x="532" y="382">- HttpRequest(Builder)</text>
<text x="532" y="402">+ describe()</text>

<path d="M 370 78 L 515 78" stroke="#000000" fill="none" marker-end="url(#da)"/>
<text x="392" y="70" font-size="11.5" fill="#414d60">builds with</text>

<path d="M 720 228 L 720 273" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#da)"/>
<text x="732" y="256" font-size="11.5" fill="#414d60">build() creates</text>

<path d="M 515 348 L 300 348 L 300 122" stroke="#000000" fill="none" marker-end="url(#da)"/>
<text x="312" y="340" font-size="11.5" fill="#414d60">returned to the client</text>

<rect x="40" y="160" width="220" height="100" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="58" y="184" font-size="12" fill="#414d60">The private constructor</text>
<text x="58" y="204" font-size="12" fill="#414d60">is what stops anyone</text>
<text x="58" y="224" font-size="12" fill="#414d60">building a half-filled</text>
<text x="58" y="244" font-size="12" fill="#414d60">HttpRequest directly.</text>

<rect x="40" y="428" width="880" height="56" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="60" y="452" font-size="12.5" fill="#414d60">The builder declares the same fields as the product. That duplication is the pattern&#39;s main cost: adding a field means touching two classes.</text>
<text x="60" y="472" font-size="12.5" fill="#414d60">What you buy with it is a product whose fields can all be final, and one place where rules spanning several fields are checked.</text>
</g>
</svg>