<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-label="A content delivery network. On a cache hit the nearest edge server answers and the origin never hears about the request. On a miss the edge fetches from the origin once, keeps a copy, and every later user is served from that copy.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="500" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Cache hit: the common case</text>
  <rect x="50" y="83" width="180" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="118" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">User</text>
  <text x="140" y="143" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">in Singapore</text>
  <rect x="340" y="83" width="260" height="74" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="470" y="118" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Edge server</text>
  <text x="470" y="143" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">nearby, has the file</text>
  <rect x="820" y="83" width="260" height="74" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="950" y="118" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Origin</text>
  <text x="950" y="143" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">your servers</text>
  <line x1="232" y1="106" x2="338" y2="106" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <text x="285" y="96" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">request</text>
  <line x1="338" y1="140" x2="232" y2="140" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <text x="285" y="168" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the file, fast</text>
  <text x="710" y="112" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">never contacted</text>
  <line x1="600" y1="120" x2="818" y2="120" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M702 131 l16 16 M718 131 l-16 16" fill="none" stroke="#CBD5E1" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="40" y1="228" x2="1200" y2="228" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="40" y="286" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Cache miss: only the first time</text>
  <rect x="50" y="323" width="180" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="358" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">User</text>
  <text x="140" y="383" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">in Singapore</text>
  <rect x="340" y="323" width="260" height="74" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="470" y="358" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Edge server</text>
  <text x="470" y="383" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">does not have it yet</text>
  <rect x="820" y="323" width="260" height="74" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="950" y="358" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Origin</text>
  <text x="950" y="383" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">your servers</text>
  <line x1="232" y1="346" x2="338" y2="346" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <text x="285" y="336" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1</text>
  <line x1="600" y1="346" x2="818" y2="346" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <text x="709" y="336" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2  fetch once</text>
  <line x1="818" y1="380" x2="600" y2="380" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <text x="709" y="408" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">3  store a copy</text>
  <line x1="338" y1="380" x2="232" y2="380" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <text x="285" y="408" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">4</text>
  <text x="620" y="452" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">From here on, every user in the region is a cache hit.</text>
</svg>