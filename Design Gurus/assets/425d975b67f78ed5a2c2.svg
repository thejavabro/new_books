<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="874" viewBox="0 0 1240 874" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="observe-title observe-desc">
<title id="observe-title">Observing a non-deterministic system</title>
<desc id="observe-desc">The control flow was chosen at runtime and is not in any code you can read, so the recorded run is the only record that explains it.</desc>
<defs>
<marker id="observe-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="observe-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="observe-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="observe-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="874" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Observing a non-deterministic system</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The control flow was chosen at runtime and is not in any code you can read.</text>
<rect x="40" y="796" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="796" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="58" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="58" rx="2.5" fill="#AC8BE8"/><text x="64" y="153" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The run is the trace, and each step is a span</text>
<rect x="40" y="192" width="1160" height="136" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 192H46A6 6 0 0 0 40 198V322A6 6 0 0 0 46 328H54Z" fill="#5EC9EC"/><text x="70" y="228" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">for every step, record</text>
<text x="72" y="266" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what the model was given, and what it decided</text><text x="72" y="292" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which tool with which arguments, and what came back</text><text x="72" y="318" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how long it took</text>
<rect x="40" y="348" width="372" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="380" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">debugging a failure</text>
<rect x="434" y="348" width="372" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="380" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">auditing an action</text>
<rect x="828" y="348" width="372" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1014" y="380" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">building an evaluation set</text>
<rect x="40" y="420" width="420" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="250" y="455" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Task completion, not output quality</text>
<path d="M466 449H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 449H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#observe-marker-slate)"/>
<rect x="510" y="420" width="690" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="455" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">did the run achieve the goal, by a check somebody wrote</text>
<rect x="40" y="486" width="420" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="250" y="521" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The path, not only the outcome</text>
<path d="M466 515H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 515H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#observe-marker-slate)"/>
<rect x="510" y="486" width="690" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="521" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a right answer in twenty steps is a problem that has not surfaced</text>
<rect x="40" y="552" width="420" height="58" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="250" y="587" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep every failure</text>
<path d="M466 581H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 581H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#observe-marker-slate)"/>
<rect x="510" y="552" width="690" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="587" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the cases here are more valuable, because they are harder to imagine</text>
<rect x="40" y="618" width="420" height="58" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="250" y="653" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Expect non-determinism</text>
<path d="M466 647H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 647H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#observe-marker-slate)"/>
<rect x="510" y="618" width="690" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="640.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the same input produces different paths,</text><text x="530" y="665.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so run the set several times</text>
<rect x="40" y="698" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="698" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="725.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">When somebody asks why the agent did a thing, the answer comes from a record</text><text x="64" y="754.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">and the record has to exist before the question is asked.</text>
<text x="66" y="830" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Not an optional nicety. It serves debugging, auditing and evaluation at once.</text>
</svg>