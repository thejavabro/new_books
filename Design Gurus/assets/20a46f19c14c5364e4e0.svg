<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="948" viewBox="0 0 1240 948" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A weak error body says only invalid request, so the developer cannot tell which field is wrong, whether it is missing or malformed, what value is allowed, whether retrying helps, or how code should recognize the failure later. A strong error carries a stable code to branch on, a human message, the field at fault, the provided and maximum values, and a request id the API team can trace. The code is part of the contract; the message may change.">
  <defs>
    <filter id="yl06erroran-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl06erroran-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl06erroran-kw"><rect x="80" y="180" width="424" height="90" rx="12"/></clipPath>
    <clipPath id="yl06erroran-kl1"><rect x="80" y="320" width="424" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kl2"><rect x="80" y="391" width="424" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kl3"><rect x="80" y="462" width="424" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kl4"><rect x="80" y="533" width="424" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kl5"><rect x="80" y="604" width="424" height="48" rx="10"/></clipPath>

    <clipPath id="yl06erroran-kr1"><rect x="608" y="180" width="552" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kr2"><rect x="608" y="262" width="552" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kr3"><rect x="608" y="344" width="552" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kr4"><rect x="608" y="426" width="552" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kr5"><rect x="608" y="508" width="552" height="48" rx="10"/></clipPath>
    <clipPath id="yl06erroran-kr6"><rect x="608" y="590" width="552" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="948" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">What a usable error carries</text>

  
  <rect x="40" y="126" width="500" height="600" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="80" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Weak</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="80" y="180" width="424" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#yl06erroran-kw)"/>
  </g>
  <circle cx="118" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="144" y="232" font-size="18.5" font-weight="600" fill="#111827">{ "error": "Invalid request" }</text>

  <text x="80" y="306" font-size="15.5" font-weight="600" fill="#BE185D">The developer cannot tell</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="80" y="320" width="424" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="320" width="6" height="48" fill="#DB2777" clip-path="url(#yl06erroran-kl1)"/>
  </g>
  <circle cx="114" cy="344" r="4.5" fill="#DB2777"/>
  <text x="138" y="351" font-size="18.5" font-weight="600" fill="#111827">which field is wrong</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="80" y="391" width="424" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="391" width="6" height="48" fill="#DB2777" clip-path="url(#yl06erroran-kl2)"/>
  </g>
  <circle cx="114" cy="415" r="4.5" fill="#DB2777"/>
  <text x="138" y="422" font-size="18.5" font-weight="600" fill="#111827">whether it is missing or malformed</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="80" y="462" width="424" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="462" width="6" height="48" fill="#DB2777" clip-path="url(#yl06erroran-kl3)"/>
  </g>
  <circle cx="114" cy="486" r="4.5" fill="#DB2777"/>
  <text x="138" y="493" font-size="18.5" font-weight="600" fill="#111827">what value is allowed</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="80" y="533" width="424" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="533" width="6" height="48" fill="#DB2777" clip-path="url(#yl06erroran-kl4)"/>
  </g>
  <circle cx="114" cy="557" r="4.5" fill="#DB2777"/>
  <text x="138" y="564" font-size="18.5" font-weight="600" fill="#111827">whether retrying helps</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="80" y="604" width="424" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="604" width="6" height="48" fill="#DB2777" clip-path="url(#yl06erroran-kl5)"/>
  </g>
  <circle cx="114" cy="628" r="4.5" fill="#DB2777"/>
  <text x="138" y="635" font-size="18.5" font-weight="600" fill="#111827">how code should recognize it later</text>

  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M80,681 L91,692 M91,681 L80,692"/>
  </g>
  <text x="106" y="692" font-size="15.5" font-weight="600" fill="#BE185D">Read the docs, add logs, ask the team</text>

  
  <rect x="572" y="126" width="628" height="600" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="608" y="156" font-size="16.5" font-weight="600" fill="#047857">Strong</text>

  <g filter="url(#yl06erroran-lift)">
    <rect x="608" y="180" width="552" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="608" y="180" width="9" height="48" fill="#059669" clip-path="url(#yl06erroran-kr1)"/>
  </g>
  <circle cx="642" cy="204" r="15" fill="#FFFFFF"/>
  <g transform="translate(633,195) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="666" y="211" font-size="18.5" font-weight="600" fill="#111827">code</text>
  <text x="808" y="211" font-size="18.5" font-weight="600" fill="#047857">"page_size_too_large"</text>
  <text x="884" y="248" text-anchor="middle" font-size="15.5" fill="#6B7280">software branches on this</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="608" y="262" width="552" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="608" y="262" width="6" height="48" fill="#059669" clip-path="url(#yl06erroran-kr2)"/>
  </g>
  <circle cx="642" cy="286" r="4.5" fill="#059669"/>
  <text x="666" y="293" font-size="18.5" font-weight="600" fill="#111827">message</text>
  <text x="808" y="293" font-size="18.5" font-weight="600" fill="#047857">"...exceeds the maximum of 100."</text>
  <text x="884" y="330" text-anchor="middle" font-size="15.5" fill="#6B7280">a developer reads this</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="608" y="344" width="552" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="608" y="344" width="6" height="48" fill="#059669" clip-path="url(#yl06erroran-kr3)"/>
  </g>
  <circle cx="642" cy="368" r="4.5" fill="#059669"/>
  <text x="666" y="375" font-size="18.5" font-weight="600" fill="#111827">field</text>
  <text x="808" y="375" font-size="18.5" font-weight="600" fill="#047857">"limit"</text>
  <text x="884" y="412" text-anchor="middle" font-size="15.5" fill="#6B7280">the input that must change</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="608" y="426" width="552" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="608" y="426" width="6" height="48" fill="#059669" clip-path="url(#yl06erroran-kr4)"/>
  </g>
  <circle cx="642" cy="450" r="4.5" fill="#059669"/>
  <text x="666" y="457" font-size="18.5" font-weight="600" fill="#111827">provided</text>
  <text x="808" y="457" font-size="18.5" font-weight="600" fill="#047857">250</text>
  <text x="884" y="494" text-anchor="middle" font-size="15.5" fill="#6B7280">what the caller sent</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="608" y="508" width="552" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="608" y="508" width="6" height="48" fill="#059669" clip-path="url(#yl06erroran-kr5)"/>
  </g>
  <circle cx="642" cy="532" r="4.5" fill="#059669"/>
  <text x="666" y="539" font-size="18.5" font-weight="600" fill="#111827">maximum</text>
  <text x="808" y="539" font-size="18.5" font-weight="600" fill="#047857">100</text>
  <text x="884" y="576" text-anchor="middle" font-size="15.5" fill="#6B7280">what the contract allows</text>

  <g filter="url(#yl06erroran-soft)">
    <rect x="608" y="590" width="552" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="608" y="590" width="6" height="48" fill="#059669" clip-path="url(#yl06erroran-kr6)"/>
  </g>
  <circle cx="642" cy="614" r="4.5" fill="#059669"/>
  <text x="666" y="621" font-size="18.5" font-weight="600" fill="#111827">request_id</text>
  <text x="808" y="621" font-size="18.5" font-weight="600" fill="#047857">"req_4c81"</text>
  <text x="884" y="658" text-anchor="middle" font-size="15.5" fill="#6B7280">the API team can trace it</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M608,686 L612.5,690.5 L620,680.5"/>
  </g>
  <text x="636" y="692" font-size="15.5" font-weight="600" fill="#047857">The request can be fixed without a conversation</text>

  
  <rect x="40" y="756" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="798" text-anchor="middle" font-size="16" fill="#475569">An error should help the client choose the next action.</text>
  <text x="620" y="826" text-anchor="middle" font-size="16" fill="#475569">The stable code is part of the contract. The human message may change.</text>
  <text x="620" y="854" text-anchor="middle" font-size="16" fill="#475569">Branch on error.code, never on the words inside the message.</text>
  <text x="620" y="882" text-anchor="middle" font-size="16" fill="#475569">Useful does not mean unrestricted: no stack traces, database names, or secrets.</text>
</svg>