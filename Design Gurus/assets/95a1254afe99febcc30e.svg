<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1490" viewBox="0 0 1240 1490" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Flowchart: a send request passes three layers of deduplication, an idempotency key check at ingestion, an idempotent consumer check keyed on the notification ID at every stage, and a send log check keyed on notification ID plus channel, each one dropping the repeat, before the send record commits and the provider call opens the one uncovered window where a crash risks a single duplicate.">
  <defs>
    <marker id="m07-l09-dedup-path-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l09-dedup-path-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l09-dedup-path-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l09-dedup-path-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l09-dedup-path-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1490" fill="#FFFFFF"/>

  <g filter="url(#m07-l09-dedup-path-soft)">
    <rect x="250" y="60" width="340" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="420" y="122" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A send request arrives</text>
  <g filter="url(#m07-l09-dedup-path-soft)">
    <rect x="700" y="60" width="480" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="940" y="106" text-anchor="middle" font-size="20" fill="#334155">Three layers catch the repeats,</text>
  <text x="940" y="138" text-anchor="middle" font-size="20" fill="#334155">and one honest window stays open</text>

  <g filter="url(#m07-l09-dedup-path-soft)">
    <path d="M420,200 L620,290 L420,380 L220,290 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="420" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The idempotency key</text>
  <text x="420" y="313" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">seen before?</text>
  <g filter="url(#m07-l09-dedup-path-soft)">
    <path d="M420,595 L620,690 L420,785 L220,690 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="420" y="681" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">This notification id</text>
  <text x="420" y="713" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">handled at this stage?</text>
  <g filter="url(#m07-l09-dedup-path-soft)">
    <path d="M420,905 L620,1000 L420,1095 L220,1000 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="420" y="991" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The send log has this</text>
  <text x="420" y="1023" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">id plus channel?</text>

  <g filter="url(#m07-l09-dedup-path-soft)">
    <rect x="760" y="230" width="380" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="950" y="297" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Drop it: already queued</text>
  <g filter="url(#m07-l09-dedup-path-soft)">
    <rect x="760" y="630" width="380" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="950" y="697" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Skip it: already handled</text>
  <g filter="url(#m07-l09-dedup-path-soft)">
    <rect x="760" y="940" width="380" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="950" y="1007" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Skip it: already sent</text>

  <g filter="url(#m07-l09-dedup-path-soft)">
    <rect x="250" y="450" width="340" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="420" y="512" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Enqueue the work</text>
  <g filter="url(#m07-l09-dedup-path-soft)">
    <rect x="180" y="1180" width="420" height="120" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="390" y="1231" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Commit the send record,</text>
  <text x="390" y="1263" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">then call the provider</text>
  <g filter="url(#m07-l09-dedup-path-soft)">
    <rect x="700" y="1180" width="480" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="940" y="1231" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The uncovered window: a crash</text>
  <text x="940" y="1263" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">here risks one duplicate</text>

  <g fill="none" stroke-width="2.5">
    <path d="M420,170 L420,192" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l09-dedup-path-bl)"/>
    <path d="M620,290 L752,290" stroke="#059669" stroke-width="2" marker-end="url(#m07-l09-dedup-path-em)"/>
    <path d="M420,380 L420,442" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l09-dedup-path-bl)"/>
    <path d="M420,560 L420,587" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l09-dedup-path-ab)"/>
    <path d="M620,690 L752,690" stroke="#059669" stroke-width="2" marker-end="url(#m07-l09-dedup-path-em)"/>
    <path d="M420,785 L420,897" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l09-dedup-path-ab)"/>
    <path d="M620,1000 L752,1000" stroke="#059669" stroke-width="2" marker-end="url(#m07-l09-dedup-path-em)"/>
    <path d="M420,1095 L420,1172" stroke="#D97706" marker-end="url(#m07-l09-dedup-path-ab)"/>
    <path d="M600,1240 L692,1240" stroke="#DC2626" marker-end="url(#m07-l09-dedup-path-rd)"/>
  </g>

  <text x="60" y="275" font-size="20" font-weight="600" fill="#1E3A8A">Layer 1</text>
  <text x="60" y="307" font-size="20" fill="#1E3A8A">at ingestion</text>
  <text x="60" y="675" font-size="20" font-weight="600" fill="#92400E">Layer 2</text>
  <text x="60" y="707" font-size="20" fill="#92400E">every stage</text>
  <text x="60" y="985" font-size="20" font-weight="600" fill="#92400E">Layer 3</text>
  <text x="60" y="1017" font-size="20" fill="#92400E">the send log</text>

  <text x="686" y="265" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="686" y="665" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="686" y="975" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="440" y="418" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No: the first time</text>
  <text x="440" y="845" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="440" y="1145" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="646" y="1165" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">dual write</text>

  <line x1="60" y1="1330" x2="96" y2="1330" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1337" font-size="20" fill="#475569">The synchronous ingestion path, with the caller waiting</text>
  <line x1="60" y1="1370" x2="96" y2="1370" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="1377" font-size="20" fill="#475569">The async pipeline, with a queue between the stages</text>
  <line x1="60" y1="1410" x2="96" y2="1410" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1417" font-size="20" fill="#475569">A dedup catch: nothing is sent twice</text>
  <line x1="60" y1="1450" x2="96" y2="1450" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1457" font-size="20" fill="#475569">The window no layer covers</text>
</svg>