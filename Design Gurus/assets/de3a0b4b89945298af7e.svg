<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rls-title rls-desc">
<title id="rls-title">The policy that is silently inactive</title>
<desc id="rls-desc">Row-level security is a genuinely stronger guarantee than application filtering, and it has one default that can make it do nothing at all.</desc>
<defs>
<marker id="rls-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="rls-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="rls-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="rls-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="800" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The policy that is silently inactive</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Row-level security is a genuinely stronger guarantee than application filtering.</text>
<rect x="40" y="722" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="722" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="80" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="150.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Application-only filtering</text><text x="320" y="177.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">works until one query does not</text>
<rect x="640" y="118" width="560" height="80" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="150.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Database-enforced</text><text x="920" y="177.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a missing clause cannot cross tenants</text>
<rect x="40" y="218" width="1160" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="218" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="244" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">By default the table owner bypasses row-level security entirely</text><text x="64" y="270" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Superusers and roles with the bypass attribute always bypass it. The table owner</text><text x="64" y="296" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">normally bypasses it too, unless the table is altered to force it.</text><text x="64" y="322" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">Nothing errors. The tests passed. The protection is not there.</text>
<text x="40" y="374" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">So the configuration has three parts, and all three are required</text>
<circle cx="60" cy="417" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="424" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="392" width="1110" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="114" y="423" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Enable row-level security on the table</text>
<circle cx="60" cy="475" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="482" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="450" width="1110" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="114" y="481" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Force it, so the owner is subject to it too</text>
<circle cx="60" cy="533" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="540" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="508" width="1110" height="50" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="114" y="539" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Run as a role that is neither owner nor bypassing</text>
<rect x="40" y="588" width="560" height="106" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="588" width="5" height="106" rx="2.5" fill="#5EC9EC"/><text x="64" y="621" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Set tenant context in one place</text><text x="64" y="647" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">from the authenticated identity,</text><text x="64" y="673" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">never from a request parameter</text>
<rect x="640" y="588" width="560" height="106" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="588" width="5" height="106" rx="2.5" fill="#39D5AA"/><text x="664" y="621" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Test the negative case</text><text x="664" y="647" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">that a tenant cannot see another's</text><text x="664" y="673" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">data, for every endpoint</text>
<text x="66" y="756" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A tenant identifier taken from a request parameter is the oldest cross-tenant bug there is.</text>
</svg>