<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1361" viewBox="0 0 1240 1361" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Deprecation is a process, not a release: run dual support first, so the old contract still answers while the new contract is already live; document the alternative; announce and say why, with every notice carrying advance notice, a named replacement, and a date; set a migration deadline; and only then remove.">
  <defs>
    <marker id="yl06depreca-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="yl06depreca-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="yl06depreca-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="yl06depreca-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="yl06depreca-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl06depreca-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl06depreca-k1"><rect x="340" y="100" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl06depreca-k2"><rect x="340" y="421" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl06depreca-k3"><rect x="340" y="586" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl06depreca-k4"><rect x="340" y="907" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl06depreca-k5"><rect x="340" y="1072" width="560" height="90" rx="12"/></clipPath>

    <clipPath id="yl06depreca-r1"><rect x="144" y="311" width="466" height="48" rx="10"/></clipPath>
    <clipPath id="yl06depreca-r2"><rect x="630" y="311" width="466" height="48" rx="10"/></clipPath>
    <clipPath id="yl06depreca-r3"><rect x="144" y="797" width="304" height="48" rx="10"/></clipPath>
    <clipPath id="yl06depreca-r4"><rect x="468" y="797" width="304" height="48" rx="10"/></clipPath>
    <clipPath id="yl06depreca-r5"><rect x="792" y="797" width="304" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1361" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="1177" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Deprecation is a process, not a release</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">five steps, in order</text>

  
  <rect x="120" y="265" width="1000" height="118" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="144" y="295" font-size="16.5" font-weight="600" fill="#047857">Both contracts answer at the same time</text>

  
  <rect x="120" y="751" width="1000" height="118" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="144" y="781" font-size="16.5" font-weight="600" fill="#B45309">Every notice carries</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,230 V265" stroke="#059669" marker-end="url(#yl06depreca-em)"/>
    <path d="M620,383 V421" stroke="#64748B" marker-end="url(#yl06depreca-sl)"/>
    <path d="M620,551 V586" stroke="#64748B" marker-end="url(#yl06depreca-sl)"/>
    <path d="M620,716 V751" stroke="#D97706" marker-end="url(#yl06depreca-am)"/>
    <path d="M620,869 V907" stroke="#64748B" marker-end="url(#yl06depreca-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,1037 V1072" stroke="#DB2777" marker-end="url(#yl06depreca-pk)"/>
  </g>

  
  <g filter="url(#yl06depreca-soft)">
    <rect x="340" y="100" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#yl06depreca-k1)"/>
  </g>
  <circle cx="378" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="404" y="152" font-size="18.5" font-weight="600" fill="#111827">Dual support</text>
  <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">Add the new field and keep returning the old one.</text>

  
  <g filter="url(#yl06depreca-soft)">
    <rect x="144" y="311" width="466" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="144" y="311" width="6" height="48" fill="#059669" clip-path="url(#yl06depreca-r1)"/>
  </g>
  <circle cx="178" cy="335" r="4.5" fill="#059669"/>
  <text x="202" y="342" font-size="18.5" font-weight="600" fill="#111827">Old contract, still answering</text>

  <g filter="url(#yl06depreca-soft)">
    <rect x="630" y="311" width="466" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="630" y="311" width="6" height="48" fill="#059669" clip-path="url(#yl06depreca-r2)"/>
  </g>
  <circle cx="664" cy="335" r="4.5" fill="#059669"/>
  <text x="688" y="342" font-size="18.5" font-weight="600" fill="#111827">New contract, already live</text>

  
  <g filter="url(#yl06depreca-soft)">
    <rect x="340" y="421" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="421" width="6" height="90" fill="#2563EB" clip-path="url(#yl06depreca-k2)"/>
  </g>
  <circle cx="378" cy="466" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,455.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="404" y="473" font-size="18.5" font-weight="600" fill="#111827">Document the alternative</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#6B7280">Name the replacement callers move to.</text>

  
  <g filter="url(#yl06depreca-soft)">
    <rect x="340" y="586" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="586" width="6" height="90" fill="#2563EB" clip-path="url(#yl06depreca-k3)"/>
  </g>
  <circle cx="378" cy="631" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,620.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="404" y="638" font-size="18.5" font-weight="600" fill="#111827">Announce</text>
  <text x="620" y="701" font-size="15.5" text-anchor="middle" fill="#6B7280">Tell callers what is going away, and why.</text>

  
  <g filter="url(#yl06depreca-soft)">
    <rect x="144" y="797" width="304" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="144" y="797" width="6" height="48" fill="#D97706" clip-path="url(#yl06depreca-r3)"/>
  </g>
  <circle cx="178" cy="821" r="4.5" fill="#D97706"/>
  <text x="202" y="828" font-size="18.5" font-weight="600" fill="#111827">Advance notice</text>

  <g filter="url(#yl06depreca-soft)">
    <rect x="468" y="797" width="304" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="468" y="797" width="6" height="48" fill="#D97706" clip-path="url(#yl06depreca-r4)"/>
  </g>
  <circle cx="502" cy="821" r="4.5" fill="#D97706"/>
  <text x="526" y="828" font-size="18.5" font-weight="600" fill="#111827">A named replacement</text>

  <g filter="url(#yl06depreca-soft)">
    <rect x="792" y="797" width="304" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="792" y="797" width="6" height="48" fill="#D97706" clip-path="url(#yl06depreca-r5)"/>
  </g>
  <circle cx="826" cy="821" r="4.5" fill="#D97706"/>
  <text x="850" y="828" font-size="18.5" font-weight="600" fill="#111827">A date for the move</text>

  
  <g filter="url(#yl06depreca-soft)">
    <rect x="340" y="907" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="907" width="6" height="90" fill="#2563EB" clip-path="url(#yl06depreca-k4)"/>
  </g>
  <circle cx="378" cy="952" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,941.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="404" y="959" font-size="18.5" font-weight="600" fill="#111827">Migration deadline</text>
  <text x="620" y="1022" font-size="15.5" text-anchor="middle" fill="#6B7280">The date by which the move must be finished.</text>

  
  <g filter="url(#yl06depreca-lift)">
    <rect x="340" y="1072" width="560" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="340" y="1072" width="9" height="90" fill="#DB2777" clip-path="url(#yl06depreca-k5)"/>
  </g>
  <circle cx="378" cy="1117" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,1106.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="404" y="1124" font-size="18.5" font-weight="600" fill="#111827">Remove</text>
  <text x="620" y="1187" font-size="15.5" text-anchor="middle" fill="#6B7280">Only now does the old contract stop answering.</text>

  
  <rect x="40" y="1245" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1290" text-anchor="middle" font-size="16" fill="#475569">Removal is the last step of the process, not the first action of a release.</text>
</svg>