    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="848" font-size="18.5" font-weight="600" fill="#111827">Deep operation</text>
  <text x="78" y="912" font-size="15.5" fill="#6B7280">Authorization, request, success, failures, retry behavior, and limits</text>

  
  <rect x="40" y="962" width="1160" height="458" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="992" font-size="16.5" font-weight="600" fill="#047857">Judgment and trade-offs</text>
