  <text x="78" y="426" font-size="15.5" fill="#6B7280">A sentence that explicitly excludes adjacent systems</text>

  
  <rect x="40" y="476" width="1160" height="458" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="506" font-size="16.5" font-weight="600" fill="#5B21B6">The design itself</text>
  <text x="1176" y="506" text-anchor="end" font-size="15.5" fill="#6B7280">three checks</text>

