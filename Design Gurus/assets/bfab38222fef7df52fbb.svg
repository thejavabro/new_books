  </g>
  <circle cx="114" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
