    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="140" y="1334" font-size="18.5" font-weight="600" fill="#111827">Trade-off</text>
  <text x="78" y="1398" font-size="15.5" fill="#6B7280">Every major choice has an accepted cost</text>

  
  <rect x="40" y="1448" width="1160" height="88" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1499" text-anchor="middle" font-size="16" fill="#475569">Choose one missing item for the next attempt. Practicing every weakness at once stays unfocused.</text>
