  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">Caller</text>
  <text x="78" y="290" font-size="15.5" fill="#6B7280">At least one named consumer, one job, and one constraint</text>

  <g filter="url(#p2k-soft)">
    <rect x="76" y="310" width="268" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
