    <clipPath id="p2k-k8"><rect x="76" y="1282" width="268" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1576" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Score only what actually appeared in the answer</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">eight checks, each with the evidence to look for</text>

  
  <rect x="40" y="126" width="1160" height="322" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Framing the problem</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two checks</text>

