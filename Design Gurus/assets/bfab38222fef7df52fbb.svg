<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1576" viewBox="0 0 1240 1576" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A review sheet for scoring a practice attempt on evidence rather than intelligence: caller, scope, model, operations, deep operation, pressure, consistency, and trade-off, each with the evidence to look for.">
  <defs>
    <filter id="p2k-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2k-k1"><rect x="76" y="174" width="268" height="90" rx="12"/></clipPath>
    <clipPath id="p2k-k2"><rect x="76" y="310" width="268" height="90" rx="12"/></clipPath>
