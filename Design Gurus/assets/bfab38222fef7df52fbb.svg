  <circle cx="114" cy="1055" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1044.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
