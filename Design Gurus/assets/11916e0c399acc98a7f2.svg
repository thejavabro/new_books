<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Each container in the pod has its own CPU and memory limit and its own failure boundary, so a busy or crashing sidecar cannot take the application with it">
  <defs>
    <clipPath id="sc2-k1"><rect x="72" y="104" width="348" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-k2"><rect x="446" y="104" width="348" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-k3"><rect x="820" y="104" width="348" height="90" rx="12"/></clipPath>
    <filter id="sc2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sc2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="440" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="256" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#5B21B6">Separate limits, separate failure boundaries</text>
  <g filter="url(#sc2-soft)">
    <rect x="72" y="104" width="348" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="72" y="104" width="6" height="90" fill="#7C3AED" clip-path="url(#sc2-k1)"/>
  </g>
  <circle cx="110" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,138.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="136" y="156" font-size="18.5" font-weight="600" fill="#111827">Own CPU and Memory</text>
  <text x="246" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">a logging sidecar cannot</text>
  <text x="246" y="242" font-size="15.5" text-anchor="middle" fill="#94A3B8">starve the application</text>
  <g filter="url(#sc2-soft)">
    <rect x="446" y="104" width="348" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="446" y="104" width="6" height="90" fill="#7C3AED" clip-path="url(#sc2-k2)"/>
  </g>
  <circle cx="484" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(473.56,138.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="510" y="156" font-size="18.5" font-weight="600" fill="#111827">Own Failure Boundary</text>
  <text x="620" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">a crash in the sidecar does</text>
  <text x="620" y="242" font-size="15.5" text-anchor="middle" fill="#94A3B8">not stop the service</text>
  <g filter="url(#sc2-soft)">
    <rect x="820" y="104" width="348" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="820" y="104" width="6" height="90" fill="#7C3AED" clip-path="url(#sc2-k3)"/>
  </g>
  <circle cx="858" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,138.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="884" y="156" font-size="18.5" font-weight="600" fill="#111827">Own Image and Version</text>
  <text x="994" y="219" font-size="15.5" text-anchor="middle" fill="#6B7280">each one is patched and</text>
  <text x="994" y="242" font-size="15.5" text-anchor="middle" fill="#94A3B8">upgraded on its own</text>
  <rect x="40" y="336" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="360" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="382" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">The exception</text>
  <text x="288" y="382" font-size="15.5" fill="#475569">a proxy sidecar is different: if it dies the service is unreachable, because its traffic goes through it</text>
</svg>