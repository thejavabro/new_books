<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="means-title means-desc">
<title id="means-title">A principle, not a product category</title>
<desc id="means-desc">The standards definition is narrow and worth stating precisely, because the vendor version is much larger than the idea.</desc>
<defs>
<marker id="means-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="means-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="means-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="means-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="668" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A principle, not a product category</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Zero trust is sold as a product category and is a design principle.</text>
<rect x="40" y="590" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="590" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="76" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="76" rx="2.5" fill="#5EC9EC"/><text x="64" y="149" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">No implicit trust granted based solely on physical or network location,</text><text x="64" y="175" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">with authentication and authorization performed before a session is established.</text>
<rect x="40" y="212" width="1160" height="76" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="212" width="5" height="76" rx="2.5" fill="#AC8BE8"/><text x="64" y="256" font-size="26" font-weight="700" fill="#6040A8" text-anchor="start">Being on the network is not a credential.</text>
<text x="40" y="332" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And everything else follows from that</text>
<rect x="40" y="350" width="372" height="76" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="380.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every request needs an</text><text x="226" y="407.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">identity</text>
<rect x="434" y="350" width="372" height="76" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="380.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every service</text><text x="620" y="407.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">authenticates its callers</text>
<rect x="828" y="350" width="372" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="380.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the perimeter stops being</text><text x="1014" y="407.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what keeps you safe</text>
<rect x="40" y="452" width="1160" height="112" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="452" width="5" height="112" rx="2.5" fill="#F28B9D"/><text x="64" y="488" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Why it matters at small scale is not compliance</text><text x="64" y="514" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The perimeter model fails completely rather than partially. One compromised</text><text x="64" y="540" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">machine and an attacker is inside a network where everything trusts everything.</text>
<text x="66" y="624" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The perimeter model has an unbounded blast radius by design.</text>
</svg>