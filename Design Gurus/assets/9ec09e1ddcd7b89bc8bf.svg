<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four properties that are genuinely different for model-backed operations: the answer arrives one piece at a time, requests differ enormously in cost, usage and spending become part of the contract, and a model may choose the operation from its description.">
  <defs>
    <filter id="p1x-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1x-ks"><rect x="64" y="99" width="22" height="15" rx="4"/></clipPath>
    <clipPath id="p1x-k1"><rect x="76" y="176" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1x-k2"><rect x="76" y="376" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1x-k3"><rect x="76" y="576" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1x-k4"><rect x="76" y="776" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1080" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="92" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="76" font-size="16.5" font-weight="600" fill="#475569">Four things that are genuinely different</text>

  <rect x="64" y="99" width="22" height="15" rx="4" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <rect x="64" y="99" width="4" height="15" fill="#DB2777" clip-path="url(#p1x-ks)"/>
  <text x="96" y="110" font-size="15.5" fill="#6B7280">the card names what changes</text>

  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340,105.5 L352,105.5"/>
    <path d="M347.5,101 L352,105.5 L347.5,110"/>
  </g>
  <text x="366" y="110" font-size="15.5" fill="#6B7280">why it matters</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M510,106 L514.5,110.5 L522,100.5"/>
  </g>
  <text x="536" y="110" font-size="15.5" fill="#6B7280">what the contract must add</text>

  
  <rect x="40" y="156" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1x-soft)">
    <rect x="76" y="176" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="176" width="6" height="90" fill="#DB2777" clip-path="url(#p1x-k1)"/>
  </g>
  <circle cx="114" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,210.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="228" font-size="18.5" font-weight="600" fill="#111827">Output arrives one piece at a time</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,286.5 L90,286.5"/>
    <path d="M85.5,282 L90,286.5 L85.5,291"/>
  </g>
  <text x="104" y="292" font-size="15.5" fill="#6B7280">The first useful words are ready long before the body is complete.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,312 L82.5,316.5 L90,306.5"/>
  </g>
  <text x="104" y="318" font-size="15.5" fill="#6B7280">A typed event vocabulary, one terminal event, and a mid-stream failure rule.</text>

  
  <rect x="40" y="356" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1x-soft)">
    <rect x="76" y="376" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="376" width="6" height="90" fill="#DB2777" clip-path="url(#p1x-k2)"/>
  </g>
  <circle cx="114" cy="421" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,410.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="140" y="428" font-size="18.5" font-weight="600" fill="#111827">Requests differ enormously in cost</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,486.5 L90,486.5"/>
    <path d="M85.5,482 L90,486.5 L85.5,491"/>
  </g>
  <text x="104" y="492" font-size="15.5" fill="#6B7280">30 input tokens and 80,000 input tokens are both "one request".</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,512 L82.5,516.5 L90,506.5"/>
  </g>
  <text x="104" y="518" font-size="15.5" fill="#6B7280">Token limits beside request limits, plus a concurrency limit for streams.</text>

  
  <rect x="40" y="556" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1x-soft)">
    <rect x="76" y="576" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="576" width="6" height="90" fill="#DB2777" clip-path="url(#p1x-k3)"/>
  </g>
  <circle cx="114" cy="621" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,610.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="628" font-size="18.5" font-weight="600" fill="#111827">Usage and spending are visible</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,686.5 L90,686.5"/>
    <path d="M85.5,682 L90,686.5 L85.5,691"/>
  </g>
  <text x="104" y="692" font-size="15.5" fill="#6B7280">The amount of work can determine the caller's bill.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,712 L82.5,716.5 L90,706.5"/>
  </g>
  <text x="104" y="718" font-size="15.5" fill="#6B7280">A metered unit, separate input and output counts, a price id, and a spend cap.</text>

  
  <rect x="40" y="756" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1x-soft)">
    <rect x="76" y="776" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="776" width="6" height="90" fill="#DB2777" clip-path="url(#p1x-k4)"/>
  </g>
  <circle cx="114" cy="821" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,810.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="828" font-size="18.5" font-weight="600" fill="#111827">A model may choose the operation</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,886.5 L90,886.5"/>
    <path d="M85.5,882 L90,886.5 L85.5,891"/>
  </g>
  <text x="104" y="892" font-size="15.5" fill="#6B7280">An agent rereads names and descriptions for every task.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,912 L82.5,916.5 L90,906.5"/>
  </g>
  <text x="104" y="918" font-size="15.5" fill="#6B7280">Distinct descriptions, actionable errors, dry runs, and narrow scopes.</text>

  
  <rect x="40" y="964" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1009" text-anchor="middle" font-size="16" fill="#475569">These extend Steps 4 and 5. They do not replace the six-step method.</text>
</svg>