<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Users reach load balancer 1, which spreads traffic across web servers. Web servers reach load balancer 2, which spreads traffic across application and cache servers. Those reach load balancer 3, which spreads read traffic across database servers.">
  <defs>
    <filter id="ld4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ld4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ld4-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ld4-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ld4-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ld4-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ld4-k5"><rect x="40" y="360" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ld4-k6"><rect x="343" y="360" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ld4-k7"><rect x="646" y="360" width="250" height="90" rx="12"/></clipPath>
    <marker id="ld4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Load balancers at each layer</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A load balancer in front of every tier lets each tier grow and survive failures on its own.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#ld4-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#ld4-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#ld4-m-slate)"/>
    <path d="M1199,185 H1210 Q1225,185 1225,200 V305 Q1225,320 1210,320 H180 Q165,320 165,335 V360" stroke="#64748B" marker-end="url(#ld4-m-slate)"/>
    <path d="M290,405 H343" stroke="#64748B" marker-end="url(#ld4-m-slate)"/>
    <path d="M593,405 H646" stroke="#64748B" marker-end="url(#ld4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ld4-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ld4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Users</text>
  <g filter="url(#ld4-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ld4-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">LB 1</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">in front of the</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">web servers</text>
  <g filter="url(#ld4-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#059669" clip-path="url(#ld4-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Web servers</text>
  <g filter="url(#ld4-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ld4-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">LB 2</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">in front of the</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">app layer</text>
  <g filter="url(#ld4-soft)">
    <rect x="40" y="360" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="360" width="6" height="90" fill="#059669" clip-path="url(#ld4-k5)"/>
  </g>
  <circle cx="78" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="104" y="412" font-size="21.5" font-weight="600" fill="#111827">App servers</text>
  <text x="165" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">and cache servers</text>
  <g filter="url(#ld4-soft)">
    <rect x="343" y="360" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="360" width="6" height="90" fill="#2563EB" clip-path="url(#ld4-k6)"/>
  </g>
  <circle cx="381" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="407" y="412" font-size="21.5" font-weight="600" fill="#111827">LB 3</text>
  <text x="468" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">in front of the</text>
  <text x="468" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">databases</text>
  <g filter="url(#ld4-soft)">
    <rect x="646" y="360" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="646" y="360" width="6" height="90" fill="#4F46E5" clip-path="url(#ld4-k7)"/>
  </g>
  <circle cx="684" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,394.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="710" y="412" font-size="21.5" font-weight="600" fill="#111827">Databases</text>
  <text x="771" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">read replicas</text>

  <rect x="40" y="560" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="585" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="610" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Load balancer</text>
  <text x="323" y="610" font-size="18.5" fill="#475569">one at each layer keeps every tier scalable and redundant</text>
  <rect x="64" y="635" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="660" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Databases</text>
  <text x="323" y="660" font-size="18.5" fill="#475569">a load balancer here usually spreads reads across replicas</text>
</svg>