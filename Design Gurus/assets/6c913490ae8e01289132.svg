  <rect x="70" y="232" width="230" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="185" y="264" font-size="20" fill="#1E40AF" text-anchor="middle">Load balancing</text>
  <rect x="70" y="294" width="230" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="185" y="326" font-size="20" fill="#1E40AF" text-anchor="middle">API basics</text>
  <rect x="70" y="356" width="230" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="185" y="388" font-size="20" fill="#1E40AF" text-anchor="middle">Caching</text>

  
  <rect x="340" y="88" width="270" height="412" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M340 100 a12 12 0 0 1 12 -12 h246 a12 12 0 0 1 12 12 v46 h-270 z" fill="#F5F3FF"/>
  <text x="475" y="122" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Storing the</text>
  <text x="475" y="144" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">data</text>
  <rect x="360" y="170" width="230" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="475" y="202" font-size="20" fill="#5B21B6" text-anchor="middle">Databases</text>
  <rect x="360" y="232" width="230" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="475" y="264" font-size="20" fill="#5B21B6" text-anchor="middle">Sharding</text>
  <rect x="360" y="294" width="230" height="52" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="475" y="326" font-size="20" fill="#5B21B6" text-anchor="middle">Storage</text>

  
  <rect x="630" y="88" width="270" height="412" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M630 100 a12 12 0 0 1 12 -12 h246 a12 12 0 0 1 12 12 v46 h-270 z" fill="#FFFBEB"/>
  <text x="765" y="122" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Moving the</text>
  <text x="765" y="144" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">data</text>
  <rect x="650" y="170" width="230" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="765" y="202" font-size="20" fill="#92400E" text-anchor="middle">Messaging</text>
  <rect x="650" y="232" width="230" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="765" y="264" font-size="20" fill="#92400E" text-anchor="middle">Consistency</text>
  <rect x="650" y="294" width="230" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="765" y="326" font-size="20" fill="#92400E" text-anchor="middle">Design patterns</text>

  
  <rect x="920" y="88" width="270" height="412" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <path d="M920 100 a12 12 0 0 1 12 -12 h246 a12 12 0 0 1 12 12 v46 h-270 z" fill="#ECFDF5"/>
  <text x="1055" y="122" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Running the</text>
  <text x="1055" y="144" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">system</text>
  <rect x="940" y="170" width="230" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="202" font-size="20" fill="#065F46" text-anchor="middle">Scalability</text>
  <rect x="940" y="232" width="230" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="264" font-size="20" fill="#065F46" text-anchor="middle">Observability</text>
  <rect x="940" y="294" width="230" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="326" font-size="20" fill="#065F46" text-anchor="middle">Security</text>
  <rect x="940" y="356" width="230" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="388" font-size="20" fill="#065F46" text-anchor="middle">Reliability</text>
  <rect x="940" y="418" width="230" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="450" font-size="20" fill="#065F46" text-anchor="middle">Time and IDs</text>

  <rect x="50" y="530" width="1140" height="112" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="568" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The chapters stand alone, so you can read them in any order.</text>
  <text x="620" y="600" font-size="20" fill="#334155" text-anchor="middle">Read left to right and they follow one request instead: how it reaches you, where its data</text>
  <text x="620" y="626" font-size="20" fill="#334155" text-anchor="middle">lives, how that data travels, and what it takes to keep the whole thing up.</text>
</svg>