  <text x="185" y="144" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">request</text>
  <rect x="70" y="170" width="230" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
