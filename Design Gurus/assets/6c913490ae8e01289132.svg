<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The fifteen technical chapters grouped into four arcs: serving the request, storing the data, moving the data between systems, and running the whole thing in production">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Fifteen chapters, following one request from arrival to aftermath</text>

  
  <rect x="50" y="88" width="270" height="412" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h246 a12 12 0 0 1 12 12 v46 h-270 z" fill="#EFF6FF"/>
