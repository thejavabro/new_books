<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="764" viewBox="0 0 1240 764" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Example 1: five servers, an undirected network with its critical connections marked">
<defs>
<filter id="cc1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="764" fill="#FFFFFF"/>
<rect x="40" y="40" width="382" height="490.2" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Example 1: five servers</text>
<text x="64" y="96" font-size="15.5" fill="#6B7280">Links are two-way</text>
<g fill="none" stroke-linecap="round">
<path d="M 136.0 152.0 L 326.0 152.0" stroke="#DB2777" stroke-width="3.2"/>
<path d="M 326.0 152.0 L 326.0 327.0" stroke="#DB2777" stroke-width="3.2"/>
<path d="M 326.0 327.0 L 136.0 327.0" stroke="#64748B" stroke-width="2.4"/>
<path d="M 136.0 327.0 L 231.0 458.2" stroke="#64748B" stroke-width="2.4"/>
<path d="M 326.0 327.0 L 231.0 458.2" stroke="#64748B" stroke-width="2.4"/>
</g>
<g filter="url(#cc1-soft)"><circle cx="136.0" cy="152.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="136.0" y="160.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">0</text>
<g filter="url(#cc1-soft)"><circle cx="326.0" cy="152.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="326.0" y="160.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">1</text>
<g filter="url(#cc1-soft)"><circle cx="326.0" cy="327.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="326.0" y="335.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">2</text>
<g filter="url(#cc1-soft)"><circle cx="136.0" cy="327.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="136.0" y="335.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">3</text>
<g filter="url(#cc1-soft)"><circle cx="231.0" cy="458.2" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="231.0" y="466.2" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">4</text>
<rect x="462" y="40" width="738" height="312.0" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="486" y="80.0" font-size="16.5" font-weight="600" fill="#475569">Connections</text>
<text x="486" y="106.0" font-size="15.5" fill="#475569">[[0, 1], [1, 2], [2, 3], [3, 4], [2, 4]]</text>
<text x="486" y="154.0" font-size="16.5" font-weight="600" fill="#BE185D">Critical connections</text>
<text x="486" y="180.0" font-size="15.5" fill="#475569">[[1, 2], [0, 1]]</text>
<text x="486" y="220.0" font-size="15.5" fill="#6B7280">Servers 2, 3 and 4 sit on a cycle, so any one of those three links can be cut and</text>
<text x="486" y="246.0" font-size="15.5" fill="#6B7280">every server still reaches every other. Cutting 0 to 1 strands server 0. Cutting</text>
<text x="486" y="272.0" font-size="15.5" fill="#6B7280">1 to 2 splits the network in two.</text>
<rect x="40" y="562.2" width="1160" height="162" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="584.2" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="164" y="606.2" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Critical</text>
<line x1="288" y1="601.2" x2="348" y2="601.2" stroke="#DB2777" stroke-width="3.2" stroke-linecap="round"/>
<text x="372" y="606.2" font-size="15.5" fill="#475569">cutting this link leaves some server unable to reach some other server</text>
<rect x="64" y="628.2" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="164" y="650.2" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Ordinary link</text>
<line x1="288" y1="645.2" x2="348" y2="645.2" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
<text x="372" y="650.2" font-size="15.5" fill="#475569">a way around it exists, so the network survives losing it</text>
<text x="64" y="702.2" font-size="15.5" fill="#6B7280">The network is undirected: every line is a two-way connection, which is why none of them carries an arrowhead.</text>
</svg>