<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1110" viewBox="0 0 1240 1110" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of one order placement: the client calls the API gateway over REST, the gateway calls Checkout over gRPC, Checkout reserves stock and charges the card synchronously, then publishes one fat order placed event to the broker and confirms the order back to the user, after which Fulfillment and Notifications consume the event independently.">
  <defs>
    <marker id="m03-l07-order-flow-sequence-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l07-order-flow-sequence-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m03-l07-order-flow-sequence-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m03-l07-order-flow-sequence-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1110" fill="#FFFFFF"/>

  <rect x="30" y="160" width="1180" height="380" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="30" y="560" width="1180" height="230" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="30" y="810" width="1180" height="180" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="95" y1="134" x2="95" y2="1000"/>
    <line x1="245" y1="134" x2="245" y2="1000"/>
    <line x1="395" y1="134" x2="395" y2="1000"/>
    <line x1="545" y1="134" x2="545" y2="1000"/>
    <line x1="695" y1="134" x2="695" y2="1000"/>
    <line x1="845" y1="134" x2="845" y2="1000"/>
    <line x1="995" y1="134" x2="995" y2="1000"/>
    <line x1="1145" y1="134" x2="1145" y2="1000"/>
  </g>

  <g font-size="20" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="48" y="198" fill="#1E3A8A">Critical path (edges 1 to 4): someone is waiting, so every edge is synchronous</text>
    <text x="48" y="598" fill="#334155">The pivot (edge 5): payment succeeded, the order is a fact, the user gets an answer</text>
    <text x="48" y="848" fill="#92400E">After the fact (edges 6 and 7): independent consumers, and none of them delay the user</text>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M95,250 L239,250" stroke="#3B82F6" marker-end="url(#m03-l07-order-flow-sequence-bl)"/>
    <path d="M245,310 L389,310" stroke="#3B82F6" marker-end="url(#m03-l07-order-flow-sequence-bl)"/>
    <path d="M395,370 L539,370" stroke="#3B82F6" marker-end="url(#m03-l07-order-flow-sequence-bl)"/>
    <path d="M545,420 L401,420" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m03-l07-order-flow-sequence-em)"/>
    <path d="M395,470 L689,470" stroke="#3B82F6" marker-end="url(#m03-l07-order-flow-sequence-bl)"/>
    <path d="M695,520 L401,520" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m03-l07-order-flow-sequence-em)"/>
    <path d="M395,670 L839,670" stroke="#D97706" marker-end="url(#m03-l07-order-flow-sequence-ab)"/>
    <path d="M395,720 L251,720" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m03-l07-order-flow-sequence-em)"/>
    <path d="M245,766 L101,766" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m03-l07-order-flow-sequence-em)"/>
    <path d="M845,910 L989,910" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m03-l07-order-flow-sequence-ab)"/>
    <path d="M845,960 L1139,960" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m03-l07-order-flow-sequence-ab)"/>
  </g>

  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="23" y="40" width="144" height="94" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="95" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Client</text>
  <text x="95" y="113" text-anchor="middle" font-size="20" fill="#64748B">user is waiting</text>
  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="173" y="40" width="144" height="94" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="245" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">API Gateway</text>
  <text x="245" y="113" text-anchor="middle" font-size="20" fill="#64748B">auth, rate limit</text>
  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="323" y="40" width="144" height="94" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="395" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="395" y="113" text-anchor="middle" font-size="20" fill="#64748B">owns the order</text>
  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="473" y="40" width="144" height="94" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="545" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="545" y="113" text-anchor="middle" font-size="20" fill="#64748B">15 min hold</text>
  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="623" y="40" width="144" height="94" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="695" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="695" y="113" text-anchor="middle" font-size="20" fill="#64748B">card network</text>
  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="773" y="40" width="144" height="94" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="845" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="845" y="113" text-anchor="middle" font-size="20" fill="#64748B">pub/sub topic</text>
  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="923" y="40" width="144" height="94" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="995" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="995" y="113" text-anchor="middle" font-size="20" fill="#64748B">own pace</text>
  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="1073" y="40" width="144" height="94" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1145" y="83" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="1145" y="113" text-anchor="middle" font-size="20" fill="#64748B">own pace</text>

  <g filter="url(#m03-l07-order-flow-sequence-soft)">
    <rect x="900" y="270" width="290" height="176" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1045" y="312" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Deliberately absent</text>
  <g text-anchor="middle" font-size="20" fill="#475569">
    <text x="1045" y="350">no sync call to Fulfillment</text>
    <text x="1045" y="382">or Notifications. They react</text>
    <text x="1045" y="414">to a fact that does not wait.</text>
  </g>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="167" y="236" fill="#1E40AF">1. place order (REST)</text>
    <text x="317" y="296" fill="#1E40AF">2. place order (gRPC)</text>
    <text x="467" y="356" fill="#1E40AF">3. reserve stock</text>
    <text x="473" y="406" fill="#065F46">reserved</text>
    <text x="542" y="456" fill="#1E40AF">4. charge card, idempotency key</text>
    <text x="548" y="506" fill="#065F46">charged</text>
    <text x="617" y="654" fill="#92400E">5. publish order placed (fat event, via outbox)</text>
    <text x="323" y="706" fill="#065F46">order confirmed</text>
    <text x="173" y="752" fill="#065F46">order 4711 confirmed</text>
    <text x="917" y="896" fill="#92400E">6. start fulfillment</text>
    <text x="992" y="946" fill="#92400E">7. send confirmation</text>
  </g>

  <g stroke-width="4" fill="none">
    <line x1="50" y1="1032" x2="86" y2="1032" stroke="#3B82F6"/>
    <line x1="470" y1="1032" x2="506" y2="1032" stroke="#059669" stroke-dasharray="6 5"/>
    <line x1="50" y1="1072" x2="86" y2="1072" stroke="#D97706"/>
    <line x1="470" y1="1072" x2="506" y2="1072" stroke="#D97706" stroke-dasharray="6 5"/>
  </g>
  <g font-size="20" fill="#475569">
    <text x="98" y="1039">Synchronous call: the caller waits</text>
    <text x="518" y="1039">Reply to the waiting caller</text>
    <text x="98" y="1079">Publish: hand it over and move on</text>
    <text x="518" y="1079">Async consume, at the consumer's pace</text>
  </g>
</svg>