<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In chain replication writes enter at the head and travel down the chain, and reads are served from the tail because it has seen every preceding write">
  <rect x="0" y="0" width="1240" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="rr7-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr7-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rr7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="190" y1="130" x2="190" y2="166" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr7-blue)"/>
  <line x1="1030" y1="166" x2="1030" y2="130" stroke="#059669" stroke-width="2.5" marker-end="url(#rr7-emerald)"/>
  <line x1="300" y1="210" x2="354" y2="210" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr7-blue)"/>
  <line x1="580" y1="210" x2="634" y2="210" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr7-blue)"/>
  <line x1="860" y1="210" x2="914" y2="210" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr7-blue)"/>

  <text x="190" y="112" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">writes enter here</text>
  <text x="1030" y="112" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">reads are served here</text>

  <g filter="url(#rr7-soft)">
    <rect x="80" y="170" width="220" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="360" y="170" width="220" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="640" y="170" width="220" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="920" y="170" width="220" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>

  <text x="190" y="204" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Head</text>
  <text x="190" y="232" font-size="20" fill="#64748B" text-anchor="middle">hop 1</text>
  <text x="470" y="204" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>
  <text x="470" y="232" font-size="20" fill="#64748B" text-anchor="middle">hop 2</text>
  <text x="750" y="204" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>
  <text x="750" y="232" font-size="20" fill="#64748B" text-anchor="middle">hop 3</text>
  <text x="1030" y="204" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Tail</text>
  <text x="1030" y="232" font-size="20" fill="#64748B" text-anchor="middle">hop 4</text>

  <text x="620" y="330" font-size="20" fill="#475569" text-anchor="middle">The tail has seen every preceding write in order, so a read there cannot miss one.</text>
  <text x="620" y="366" font-size="20" fill="#475569" text-anchor="middle">Every node you add to the chain adds one more hop to the latency of every write.</text>
</svg>