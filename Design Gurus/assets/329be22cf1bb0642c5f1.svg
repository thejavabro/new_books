<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="746" viewBox="0 0 1240 746" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A payment references one payment method and may have many refunds, and both send final outcomes through a webhook registration. Payment and refund each begin pending and end at succeeded or failed. Refund status is tracked separately, so a refunded payment stays succeeded.">
