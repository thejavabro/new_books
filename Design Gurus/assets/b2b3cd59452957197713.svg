<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two lists of value and weight pairs, and an empty ordered map">
<defs>
<filter id="mi-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="674" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How do two lists of value and weight pairs merge into one sorted list?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A value in both lists keeps one entry, and its weights are added together</text>
<rect x="40" y="106" width="1160" height="420" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The number in each cell is the value, and the weight is written under it</text>
<text x="472" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">items1</text>
<rect x="494" y="160" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="553" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="553" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">weight 2</text>
<rect x="628" y="160" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="687" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="687" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">weight 3</text>
<text x="405" y="302" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">items2</text>
<rect x="427" y="264" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="486" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="486" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">weight 1</text>
<rect x="561" y="264" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="620" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">weight 3</text>
<rect x="695" y="264" width="118" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="754" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="754" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">weight 4</text>
<text x="539" y="426" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">ordered map</text>
<text x="567" y="425" font-size="18" fill="#475569">the map is empty</text>
<text x="620" y="500" text-anchor="middle" font-size="18" fill="#475569">Every pair from both lists goes through this one map</text>
<rect x="40" y="548" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="588" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The map stays sorted by value at all times, so no sorting step is needed at the end</text>
<text x="620" y="620" text-anchor="middle" font-size="18.5" fill="#475569">That is the whole reason for an ordered map rather than a plain one</text>
</svg>