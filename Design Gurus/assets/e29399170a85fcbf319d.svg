<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="start-title start-desc">
<title id="start-title">Start where it is cheapest</title>
<desc id="start-desc">The progression goes from no risk to some risk, and most of the findings arrive long before the risky part. Unannounced injection sits past all of it and is reasonable to never reach.</desc>
<defs>
<marker id="start-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="start-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="start-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="start-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="860" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Start where it is cheapest</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The progression goes from no risk to some risk, and most of the findings arrive long before the risky part.</text>
<rect x="40" y="782" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="782" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="1115" y="118" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">risk</text>
<circle cx="60" cy="164" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="171" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="132" width="320" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="250" y="170" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A laptop</text>
<path d="M416 164H450" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M416 164H450" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#start-marker-slate)"/>
<rect x="460" y="132" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="480" y="157.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">point a service at a dependency that is absent or slow</text><text x="480" y="182.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">finds missing timeouts, the most common defect</text>
<rect x="1040" y="151" width="150" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1040" y="151" width="15.0" height="26" rx="10" fill="#06AC80"/>
<circle cx="60" cy="236" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="243" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="204" width="320" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="250" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Staging, made slow</text>
<path d="M416 236H450" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M416 236H450" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#start-marker-slate)"/>
<rect x="460" y="204" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="480" y="229.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">slow is worse and more realistic than down</text><text x="480" y="254.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">most teams have tested down and not slow</text>
<rect x="1040" y="223" width="150" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1040" y="223" width="45.0" height="26" rx="10" fill="#159BEF"/>
<circle cx="60" cy="308" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="315" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="276" width="320" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="250" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Production, smallest scope</text>
<path d="M416 308H450" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M416 308H450" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#start-marker-slate)"/>
<rect x="460" y="276" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="480" y="301.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one instance, one dependency, business hours</text><text x="480" y="326.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">everybody watching, revert ready</text>
<rect x="1040" y="295" width="150" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1040" y="295" width="90.0" height="26" rx="10" fill="#E8BC60"/>
<circle cx="60" cy="380" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="387" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="348" width="320" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="250" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Larger scope, announced</text>
<path d="M416 380H450" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M416 380H450" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#start-marker-slate)"/>
<rect x="460" y="348" width="560" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="480" y="373.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a zone, a dependency, a cell</text><text x="480" y="398.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the drill shape from the multi-region module</text>
<rect x="1040" y="367" width="150" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1040" y="367" width="135.0" height="26" rx="10" fill="#F25461"/>
<rect x="40" y="432" width="1160" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="432" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="471" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Why slow is worse than down</text><text x="64" y="497" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Connection refused fails fast and the system usually copes. A dependency taking</text><text x="64" y="523" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">30 seconds consumes connections, fills queues, and takes everything with it.</text>
<text x="40" y="588" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Five experiments worth running first</text>
<rect x="40" y="606" width="560" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="635" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">make one dependency slow</text>
<rect x="640" y="606" width="560" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="635" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">kill one instance</text>
<rect x="40" y="658" width="560" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="687" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">fill a queue</text>
<rect x="640" y="658" width="560" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="920" y="687" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">expire a credential in staging</text>
<rect x="40" y="710" width="560" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="739" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">turn on your own degraded mode</text>
<text x="66" y="816" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An afternoon on a laptop finds the defect that causes total outages.</text>
</svg>