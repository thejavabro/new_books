    <clipPath id="m09j-k8"><rect x="353" y="750" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="m09j-k9"><rect x="642" y="750" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="m09j-k10"><rect x="931" y="750" width="245" height="90" rx="12"/></clipPath>
    <marker id="m09j-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m09j-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="m09j-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m09j-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="930" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Dynamic plugin discovery and loading</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The core finds plugin files in a directory at runtime, loads them, and registers and initializes each plugin.</text>

  <rect x="40" y="120" width="500" height="280" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Discover plugins</text>
  <rect x="680" y="120" width="520" height="280" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="704" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">2. Plugin directory</text>
  <rect x="40" y="440" width="1160" height="150" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="470" font-size="19.5" font-weight="600" fill="#047857">3. Load plugin files</text>
  <rect x="40" y="650" width="1160" height="245" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="680" font-size="19.5" font-weight="600" fill="#475569">4. Register and initialize</text>

  <g fill="none" stroke-width="2">
    <path d="M324,285 H704" stroke="#2563EB" marker-end="url(#m09j-m-blue)"/>
    <path d="M704,325 H324" stroke="#7C3AED" marker-end="url(#m09j-m-violet)"/>
