    <rect x="64" y="750" width="245" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="750" width="6" height="90" fill="#2563EB" clip-path="url(#m09j-k7)"/>
  </g>
  <circle cx="102" cy="795" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,784.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="128" y="802" font-size="21.5" font-weight="600" fill="#111827">Read metadata</text>
  <text x="186.5" y="869" font-size="18.5" text-anchor="middle" fill="#6B7280">get_metadata()</text>
  <g filter="url(#m09j-soft)">
    <rect x="353" y="750" width="245" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="353" y="750" width="6" height="90" fill="#D97706" clip-path="url(#m09j-k8)"/>
  </g>
  <circle cx="391" cy="795" r="18" fill="#FFFFFF"/>
  <g transform="translate(380.56,784.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="417" y="802" font-size="21.5" font-weight="600" fill="#111827">Validate</text>
  <text x="475.5" y="869" font-size="18.5" text-anchor="middle" fill="#6B7280">check core version</text>
  <g filter="url(#m09j-soft)">
    <rect x="642" y="750" width="245" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="642" y="750" width="6" height="90" fill="#7C3AED" clip-path="url(#m09j-k9)"/>
  </g>
  <circle cx="680" cy="795" r="18" fill="#FFFFFF"/>
  <g transform="translate(669.56,784.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="706" y="802" font-size="21.5" font-weight="600" fill="#111827">Initialize</text>
  <text x="764.5" y="869" font-size="18.5" text-anchor="middle" fill="#6B7280">call initialize()</text>
  <g filter="url(#m09j-soft)">
    <rect x="931" y="750" width="245" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="931" y="750" width="6" height="90" fill="#059669" clip-path="url(#m09j-k10)"/>
  </g>
  <circle cx="969" cy="795" r="18" fill="#FFFFFF"/>
  <g transform="translate(958.56,784.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="995" y="802" font-size="21.5" font-weight="600" fill="#111827">Plugin ready</text>
  <text x="1053.5" y="869" font-size="18.5" text-anchor="middle" fill="#6B7280">handle requests</text>
  <text x="64" y="182" font-size="18.5" fill="#6B7280">Core scans the plugin directory at runtime.</text>
  <text x="704" y="182" font-size="18.5" fill="#6B7280">Holds the plugin .py files.</text>
  <text x="64" y="502" font-size="18.5" fill="#6B7280">Core runs each file and collects the Plugin subclasses it defines.</text>
  <text x="64" y="712" font-size="18.5" fill="#6B7280">The registry checks each plugin, registers it and calls initialize().</text>




</svg>