  <text x="768" y="299.25" font-size="21.5" font-weight="600" fill="#111827">Plugin</text>
  <text x="768" y="324.75" font-size="21.5" font-weight="600" fill="#111827">directory</text>
  <g filter="url(#m09j-soft)">
    <rect x="920" y="210" width="256" height="48" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="920" y="210" width="6" height="48" fill="#64748B" clip-path="url(#m09j-k3)"/>
  </g>
  <text x="940" y="241" font-size="18.5" font-weight="600" fill="#111827">stripe_plugin.py</text>
  <g filter="url(#m09j-soft)">
    <rect x="920" y="268" width="256" height="48" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="920" y="268" width="6" height="48" fill="#64748B" clip-path="url(#m09j-k4)"/>
  </g>
  <text x="940" y="299" font-size="18.5" font-weight="600" fill="#111827">paypal_plugin.py</text>
  <g filter="url(#m09j-soft)">
    <rect x="920" y="326" width="256" height="48" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="920" y="326" width="6" height="48" fill="#64748B" clip-path="url(#m09j-k5)"/>
  </g>
  <text x="940" y="357" font-size="18.5" font-weight="600" fill="#111827">razorpay_plugin.py</text>
  <g filter="url(#m09j-soft)">
    <rect x="880" y="475" width="296" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="880" y="475" width="6" height="90" fill="#7C3AED" clip-path="url(#m09j-k6)"/>
  </g>
  <circle cx="918" cy="520" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,509.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="944" y="527" font-size="21.5" font-weight="600" fill="#111827">stripe_plugin.py</text>
