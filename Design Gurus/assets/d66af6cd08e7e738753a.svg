<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four stages: the core system scans the plugin directory at runtime and gets back the plugin files; the directory holds the plugin Python files, for Stripe, PayPal and Razorpay; the core loads each file, such as stripe_plugin.py, and collects the Plugin subclasses it defines; the registry then reads each plugin metadata, validates it against the core version, calls initialize, and the plugin is ready to handle requests">
  <defs>
    <filter id="m09j-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m09j-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m09j-k1"><rect x="64" y="260" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="m09j-k2"><rect x="704" y="260" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="m09j-k3"><rect x="920" y="210" width="256" height="48" rx="12"/></clipPath>
    <clipPath id="m09j-k4"><rect x="920" y="268" width="256" height="48" rx="12"/></clipPath>
