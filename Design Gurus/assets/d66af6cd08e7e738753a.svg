    <path d="M887,795 H931" stroke="#64748B" marker-end="url(#m09j-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="610" y="246" fill="#1D4ED8">List plugin</text>
    <text x="610" y="270" fill="#1D4ED8">files</text>
    <text x="610" y="352" fill="#5B21B6">Return .py</text>
    <text x="610" y="376" fill="#5B21B6">plugin files</text>
    <text x="1014" y="627" fill="#047857" text-anchor="end">Register plugin classes</text>
  </g>

