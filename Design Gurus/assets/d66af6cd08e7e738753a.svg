  <circle cx="102" cy="305" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,294.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="128" y="299.25" font-size="21.5" font-weight="600" fill="#111827">Core system</text>
  <text x="128" y="324.75" font-size="21.5" font-weight="600" fill="#111827">(microkernel)</text>
  <g filter="url(#m09j-soft)">
    <rect x="704" y="260" width="190" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
