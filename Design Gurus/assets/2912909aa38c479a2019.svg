<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A clustered index stores the rows themselves in key order; a non-clustered index stores keys with pointers, and the rows stay where they are">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="ix4-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix4-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="ix4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="530" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Clustered index: the index is the table</text>

  <rect x="640" y="76" width="580" height="530" rx="14" fill="#F5F3FF" fill-opacity="0.4" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Non-clustered index: keys plus pointers</text>

  
  <line x1="300" y1="186" x2="300" y2="222" stroke="#3B82F6" stroke-width="2" marker-end="url(#ix4-blue)"/>

  
  <g filter="url(#ix4-soft)">
    <rect x="130" y="122" width="340" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="300" y="161" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Index on CustomerID</text>
  <text x="310" y="256" font-size="20" fill="#64748B" text-anchor="middle">leaf level holds the rows themselves</text>

  <g filter="url(#ix4-soft)">
    <rect x="60" y="274" width="500" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="354" width="500" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="434" width="500" height="64" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="86" y="313" font-size="20" font-weight="600" fill="#0F172A">101</text>
  <text x="160" y="313" font-size="20" fill="#334155">Chen, Berlin, active</text>
  <text x="86" y="393" font-size="20" font-weight="600" fill="#0F172A">102</text>
  <text x="160" y="393" font-size="20" fill="#334155">Lovelace, Lagos, active</text>
  <text x="86" y="473" font-size="20" font-weight="600" fill="#0F172A">103</text>
  <text x="160" y="473" font-size="20" fill="#334155">Okafor, Lima, paused</text>

  <text x="310" y="544" font-size="20" fill="#64748B" text-anchor="middle">One per table, since rows can only</text>
  <text x="310" y="572" font-size="20" fill="#64748B" text-anchor="middle">be laid out one way</text>

  
  <path d="M745,206 C745,280 930,300 930,362" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ix4-violet)"/>
  <path d="M930,206 C930,280 1115,300 1115,362" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ix4-violet)"/>
  <path d="M1115,206 C1115,290 745,290 745,362" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ix4-violet)"/>

  
  <text x="930" y="118" font-size="20" fill="#64748B" text-anchor="middle">Index on LastName, sorted</text>
  <g filter="url(#ix4-soft)">
    <rect x="665" y="142" width="160" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="850" y="142" width="160" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="1035" y="142" width="160" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="745" y="181" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Chen</text>
  <text x="930" y="181" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Lovelace</text>
  <text x="1115" y="181" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Okafor</text>

  <g filter="url(#ix4-soft)">
    <rect x="665" y="366" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="850" y="366" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="1035" y="366" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="745" y="398" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">row 1</text>
  <text x="745" y="426" font-size="20" fill="#64748B" text-anchor="middle">Okafor</text>
  <text x="930" y="398" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">row 2</text>
  <text x="930" y="426" font-size="20" fill="#64748B" text-anchor="middle">Chen</text>
  <text x="1115" y="398" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">row 3</text>
  <text x="1115" y="426" font-size="20" fill="#64748B" text-anchor="middle">Lovelace</text>

  <text x="930" y="484" font-size="20" fill="#64748B" text-anchor="middle">Table rows stay in insertion order</text>
  <text x="930" y="544" font-size="20" fill="#64748B" text-anchor="middle">Many per table, and each lookup pays</text>
  <text x="930" y="572" font-size="20" fill="#64748B" text-anchor="middle">one extra hop to reach the row</text>

  
  <text x="620" y="660" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A table has at most one clustered index, and as many non-clustered indexes as its queries justify.</text>
</svg>