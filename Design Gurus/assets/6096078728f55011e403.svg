<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="composed-title composed-desc">
<title id="composed-title">One call site, all four</title>
<desc id="composed-desc">The four patterns composed at a single call site, with the two composition rules that are where this most often goes wrong.</desc>
<defs>
<marker id="composed-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="composed-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="composed-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="composed-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="800" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">One call site, all four</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Put together, a single call site looks like this.</text>
<rect x="40" y="722" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="722" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="302" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V414A6 6 0 0 0 46 420H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">call payment-service:</text>
<text x="100" y="194" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">bulkhead</text>
<text x="300" y="194" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">max 40 concurrent, else fail fast</text>
<text x="100" y="228" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">deadline</text>
<text x="300" y="228" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">remaining time from the caller, else fail now</text>
<text x="100" y="262" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">timeout</text>
<text x="300" y="262" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">2 s, derived from p99 plus headroom</text>
<text x="100" y="296" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">breaker</text>
<text x="300" y="296" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">open if failures exceed the threshold over a window</text>
<text x="100" y="330" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">retry</text>
<text x="300" y="330" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">idempotency key, 1 retry, backoff with jitter</text>
<text x="300" y="364" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">only on timeout or connection error, only within budget</text>
<text x="100" y="398" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">fallback</text>
<text x="300" y="398" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cached last-known status, or a clear degraded response</text>
<rect x="40" y="440" width="1160" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="474" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Six mechanisms on one call, covering nearly every failure mode a dependency can produce</text>
<rect x="40" y="516" width="560" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="516" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="64" y="546" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Retries multiply with timeouts</text><text x="64" y="572" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the 2 s timeout plus one retry is a 4 s worst case,</text><text x="64" y="598" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which must still fit the caller's budget</text>
<rect x="640" y="516" width="560" height="100" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="516" width="5" height="100" rx="2.5" fill="#F3CF6A"/><text x="664" y="546" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The breaker and retry must agree</text><text x="664" y="572" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">retrying into an open breaker is pointless, and</text><text x="664" y="598" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">double-counting a failure trips it twice as fast</text>
<rect x="40" y="636" width="1160" height="58" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="636" width="5" height="58" rx="2.5" fill="#AC8BE8"/><text x="64" y="671" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">Most services have less than this, because each piece was added after a different incident.</text>
<text x="66" y="756" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Teams set each value in isolation and discover the product during an incident.</text>
</svg>