<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The circuit breaker&#39;s three states. Closed while calls flow and failures are counted over a rolling window, open once the failure rate crosses the threshold so every call is rejected in about 1 ms, and half-open after the cooldown when a few probe calls test for recovery, closing on success and re-opening on failure.">
  <defs>
    <marker id="m04-l05-breaker-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l05-breaker-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l05-breaker-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m04-l05-breaker-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <g fill="none">
    <path d="M400,385 L437,385" stroke="#DC2626" stroke-width="2.5" marker-end="url(#m04-l05-breaker-states-rd)"/>
    <path d="M795,368 L832,368" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m04-l05-breaker-states-sl)"/>
    <path d="M832,402 L803,402" stroke="#DC2626" stroke-width="2" marker-end="url(#m04-l05-breaker-states-rd)"/>
    <path d="M1015,322 V210 Q1015,190 995,190 H245 Q225,190 225,210 V318" stroke="#059669" stroke-width="2.5" marker-end="url(#m04-l05-breaker-states-em)"/>
  </g>

  <text x="620" y="176" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">probe calls succeed</text>
  <text x="422" y="262" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">failure rate crosses</text>
  <text x="422" y="288" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the threshold</text>
  <text x="817" y="262" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">cooldown expires</text>
  <text x="817" y="288" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">(say 30 s)</text>
  <text x="817" y="480" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">probe calls fail</text>

  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="225" y1="440" x2="225" y2="530"/>
    <line x1="620" y1="440" x2="620" y2="530"/>
    <line x1="1015" y1="440" x2="1015" y2="530"/>
  </g>

  <g filter="url(#m04-l05-breaker-states-soft)">
    <rect x="50" y="330" width="350" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="225" y="376" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Closed</text>
  <text x="225" y="408" text-anchor="middle" font-size="20" fill="#64748B">normal: calls flow through</text>
  <g filter="url(#m04-l05-breaker-states-soft)">
    <rect x="445" y="330" width="350" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="620" y="376" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Open</text>
  <text x="620" y="408" text-anchor="middle" font-size="20" fill="#64748B">tripped: nothing gets out</text>
  <g filter="url(#m04-l05-breaker-states-soft)">
    <rect x="840" y="330" width="350" height="110" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="1015" y="376" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Half-open</text>
  <text x="1015" y="408" text-anchor="middle" font-size="20" fill="#64748B">probing: a trickle allowed</text>

  <g filter="url(#m04-l05-breaker-states-soft)">
    <rect x="50" y="530" width="350" height="110" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  </g>
  <text x="225" y="576" text-anchor="middle" font-size="20" fill="#1E40AF">Calls flow, failures counted</text>
  <text x="225" y="608" text-anchor="middle" font-size="20" fill="#1E40AF">over a rolling window</text>
  <g filter="url(#m04-l05-breaker-states-soft)">
    <rect x="445" y="530" width="350" height="110" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
  </g>
  <text x="620" y="576" text-anchor="middle" font-size="20" fill="#B91C1C">Every call rejected instantly,</text>
  <text x="620" y="608" text-anchor="middle" font-size="20" fill="#B91C1C">in about 1 ms, nothing goes out</text>
  <g filter="url(#m04-l05-breaker-states-soft)">
    <rect x="840" y="530" width="350" height="110" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="1015" y="576" text-anchor="middle" font-size="20" fill="#475569">A few trial calls probe</text>
  <text x="1015" y="608" text-anchor="middle" font-size="20" fill="#475569">for recovery, not full traffic</text>

  <line x1="60" y1="690" x2="96" y2="690" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="697" font-size="20" fill="#475569">Failure transition: the breaker trips or re-opens</text>
  <line x1="60" y1="730" x2="96" y2="730" stroke="#059669" stroke-width="4"/>
  <text x="108" y="737" font-size="20" fill="#475569">Recovery transition: the probes pass, so traffic flows again</text>
  <line x1="60" y1="770" x2="96" y2="770" stroke="#475569" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="777" font-size="20" fill="#475569">Timer driven, with no call involved</text>
</svg>