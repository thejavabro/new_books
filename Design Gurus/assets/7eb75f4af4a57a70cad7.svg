<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="782" viewBox="0 0 1240 782" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Adding a fifth behavior, issuing a refund, to two API contracts: a contract made of invented names where the new endpoint name has to be argued about, and a contract made of nouns and methods where the refund is a sub-resource of an order">
  <defs>
    <filter id="c2rv-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2rv-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="c2rv-k1"><rect x="84" y="198" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k2"><rect x="84" y="262" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k3"><rect x="84" y="326" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k4"><rect x="84" y="390" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k5"><rect x="84" y="466" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k6"><rect x="684" y="198" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k7"><rect x="684" y="262" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k8"><rect x="684" y="326" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k9"><rect x="684" y="390" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="c2rv-k10"><rect x="684" y="466" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="782" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Adding the fifth behavior to each contract</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the fifth behavior is issuing a refund</text>

  
  <rect x="44" y="126" width="552" height="516" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="84" y="162" font-size="16.5" font-weight="600" fill="#BE185D">A contract made of invented names</text>
  <text x="84" y="184" font-size="15.5" fill="#6B7280">every behavior needs a new word</text>

  <g filter="url(#c2rv-soft)">
    <rect x="84" y="198" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="198" width="6" height="48" fill="#DB2777" clip-path="url(#c2rv-k1)"/>
  </g>
  <circle cx="118" cy="222" r="4.5" fill="#DB2777"/>
  <text x="142" y="229" font-size="18.5" font-weight="600" fill="#111827">POST /createOrder</text>

  <g filter="url(#c2rv-soft)">
    <rect x="84" y="262" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="262" width="6" height="48" fill="#DB2777" clip-path="url(#c2rv-k2)"/>
  </g>
  <circle cx="118" cy="286" r="4.5" fill="#DB2777"/>
  <text x="142" y="293" font-size="18.5" font-weight="600" fill="#111827">POST /cancelOrder</text>

  <g filter="url(#c2rv-soft)">
    <rect x="84" y="326" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="326" width="6" height="48" fill="#DB2777" clip-path="url(#c2rv-k3)"/>
  </g>
  <circle cx="118" cy="350" r="4.5" fill="#DB2777"/>
  <text x="142" y="357" font-size="18.5" font-weight="600" fill="#111827">GET /getOrderDetails</text>

  <g filter="url(#c2rv-soft)">
    <rect x="84" y="390" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="390" width="6" height="48" fill="#DB2777" clip-path="url(#c2rv-k4)"/>
  </g>
  <circle cx="118" cy="414" r="4.5" fill="#DB2777"/>
  <text x="142" y="421" font-size="18.5" font-weight="600" fill="#111827">GET /listCustomerOrders</text>

  <g filter="url(#c2rv-lift)">
    <rect x="84" y="466" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="466" width="9" height="48" fill="#DB2777" clip-path="url(#c2rv-k5)"/>
  </g>
  <circle cx="118" cy="490" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,481) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="142" y="497" font-size="18.5" font-weight="600" fill="#111827">POST /issueRefund ?</text>

  <text x="84" y="556" font-size="15.5" font-weight="600" fill="#BE185D">Two problems it raises</text>
  <circle cx="92" cy="581" r="3.5" fill="#DB2777"/>
  <text x="106" y="586" font-size="15.5" fill="#6B7280">Is it issueRefund, refundOrder, or createRefund?</text>
  <circle cx="92" cy="611" r="3.5" fill="#DB2777"/>
  <text x="106" y="616" font-size="15.5" fill="#6B7280">Camel case or hyphens? And which method?</text>

  
  <rect x="644" y="126" width="552" height="516" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="162" font-size="16.5" font-weight="600" fill="#047857">A contract made of nouns and methods</text>
  <text x="684" y="184" font-size="15.5" fill="#6B7280">the grammar was learned on the first call</text>

  <g filter="url(#c2rv-soft)">
    <rect x="684" y="198" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="198" width="6" height="48" fill="#059669" clip-path="url(#c2rv-k6)"/>
  </g>
  <circle cx="718" cy="222" r="4.5" fill="#059669"/>
  <text x="742" y="229" font-size="18.5" font-weight="600" fill="#111827">POST /orders</text>

  <g filter="url(#c2rv-soft)">
    <rect x="684" y="262" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="262" width="6" height="48" fill="#059669" clip-path="url(#c2rv-k7)"/>
  </g>
  <circle cx="718" cy="286" r="4.5" fill="#059669"/>
  <text x="742" y="293" font-size="18.5" font-weight="600" fill="#111827">PATCH /orders/ord_7M2K</text>

  <g filter="url(#c2rv-soft)">
    <rect x="684" y="326" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="326" width="6" height="48" fill="#059669" clip-path="url(#c2rv-k8)"/>
  </g>
  <circle cx="718" cy="350" r="4.5" fill="#059669"/>
  <text x="742" y="357" font-size="18.5" font-weight="600" fill="#111827">GET /orders/ord_7M2K</text>

  <g filter="url(#c2rv-soft)">
    <rect x="684" y="390" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="390" width="6" height="48" fill="#059669" clip-path="url(#c2rv-k9)"/>
  </g>
  <circle cx="718" cy="414" r="4.5" fill="#059669"/>
  <text x="742" y="421" font-size="18.5" font-weight="600" fill="#111827">GET /orders?customer_id=...</text>

  <g filter="url(#c2rv-lift)">
    <rect x="684" y="466" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="466" width="9" height="48" fill="#059669" clip-path="url(#c2rv-k10)"/>
  </g>
  <circle cx="718" cy="490" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,481) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="742" y="497" font-size="18.5" font-weight="600" fill="#111827">POST /orders/ord_7M2K/refunds</text>

  <text x="684" y="556" font-size="15.5" font-weight="600" fill="#047857">Two things that settle it</text>
  <circle cx="692" cy="581" r="3.5" fill="#059669"/>
  <text x="706" y="586" font-size="15.5" fill="#6B7280">A refund has its own id, so it is a sub-resource.</text>
  <circle cx="692" cy="611" r="3.5" fill="#059669"/>
  <text x="706" y="616" font-size="15.5" fill="#6B7280">The method and the fields carry the rest.</text>

  
  <rect x="40" y="666" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="711" text-anchor="middle" font-size="16" fill="#475569">A consistent resource model lets you focus on operation behavior.</text>
</svg>