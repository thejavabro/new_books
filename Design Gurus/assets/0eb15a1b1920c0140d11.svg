<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="threeparts-title threeparts-desc">
<title id="threeparts-title">Three parts, and the hard ones are not the mechanism</title>
<desc id="threeparts-desc">Detect, decide and redirect. Detection and the decision are judgments made with incomplete information about a partially working system, and the recovery time people quote is usually the redirect alone.</desc>
<defs>
<marker id="threeparts-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="threeparts-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="threeparts-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="threeparts-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="762" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three parts, and the hard ones are not the mechanism</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Detection and the decision are where failovers go wrong.</text>
<rect x="40" y="684" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="684" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="350" height="140" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V252A6 6 0 0 0 46 258H54Z" fill="#5EC9EC"/>
<circle cx="215" cy="158" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="215" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="215" y="212" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Detect</text>
<text x="215" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">something notices</text>
<path d="M398 188H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M398 188H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threeparts-marker-slate)"/>
<rect x="445" y="118" width="350" height="140" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M459 118H451A6 6 0 0 0 445 124V252A6 6 0 0 0 451 258H459Z" fill="#F3CF6A"/>
<circle cx="620" cy="158" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="620" y="212" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Decide</text>
<text x="620" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">something concludes</text>
<path d="M803 188H845" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M803 188H845" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threeparts-marker-slate)"/>
<rect x="850" y="118" width="350" height="140" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M864 118H856A6 6 0 0 0 850 124V252A6 6 0 0 0 856 258H864Z" fill="#39D5AA"/>
<circle cx="1025" cy="158" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1025" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1025" y="212" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Redirect</text>
<text x="1025" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">traffic moves</text>
<rect x="40" y="274" width="1160" height="96" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="274" width="5" height="96" rx="2.5" fill="#AC8BE8"/><text x="64" y="313.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Your real recovery time is detect plus decide plus redirect.</text><text x="64" y="342.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Redirect is the engineering part, and it is the easy part</text>
<text x="40" y="406" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A worked example of the arithmetic</text>
<rect x="40" y="422" width="350" height="68" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="215" y="448.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">two minutes of</text><text x="215" y="475.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">failed checks</text>
<text x="419" y="464" font-size="26" font-weight="700" fill="#4A5568" text-anchor="middle">+</text>
<rect x="445" y="422" width="350" height="68" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="448.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">five minutes for</text><text x="620" y="475.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a human to decide</text>
<text x="824" y="464" font-size="26" font-weight="700" fill="#4A5568" text-anchor="middle">+</text>
<rect x="850" y="422" width="350" height="68" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1025" y="448.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ninety seconds</text><text x="1025" y="475.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">to propagate</text>
<rect x="40" y="506" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="506" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="532.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">eight and a half minutes</text><text x="64" y="561.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the number people quote is ninety seconds</text>
<rect x="40" y="592" width="1160" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="592" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="64" y="631" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Writing the three numbers down separately is the first useful thing to do with a plan.</text>
<text x="66" y="718" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Almost all the attention goes to the third part.</text>
</svg>