<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="816" viewBox="0 0 1240 816" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A collection of subsets doubling once for each element of the input"><rect x="0" y="0" width="1240" height="816" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="512" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Every element doubles the collection, giving 2 to the power 3 = 8 subsets</text>
<circle cx="70" cy="169" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="176" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">1</text>
<text x="104" y="177" text-anchor="start" font-size="19.5" font-weight="600" fill="#4338CA">start</text>
<rect x="210" y="138" width="116" height="62" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="268" y="177" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">[]</text>
<text x="210" y="226" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">one empty subset, nothing has been added yet</text>
<circle cx="70" cy="279" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="286" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">2</text>
<text x="104" y="287" text-anchor="start" font-size="19.5" font-weight="600" fill="#4338CA">add 1</text>
<rect x="210" y="248" width="116" height="62" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="268" y="287" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">[]</text>
<rect x="334" y="248" width="116" height="62" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="392" y="287" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">[1]</text>
<text x="210" y="336" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">the list doubles to 2, copy [] and append 1</text>
<circle cx="70" cy="389" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="396" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">3</text>
<text x="104" y="397" text-anchor="start" font-size="19.5" font-weight="600" fill="#4338CA">add 5</text>
<rect x="210" y="358" width="116" height="62" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="268" y="397" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">[]</text>
<rect x="334" y="358" width="116" height="62" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="392" y="397" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">[1]</text>
<rect x="458" y="358" width="116" height="62" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="516" y="397" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">[5]</text>
<rect x="582" y="358" width="116" height="62" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="640" y="397" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">[1,5]</text>
<text x="210" y="446" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">the list doubles to 4, copy both and append 5</text>
<circle cx="70" cy="499" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="506" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">4</text>
<text x="104" y="507" text-anchor="start" font-size="19.5" font-weight="600" fill="#4338CA">add 3</text>
<rect x="210" y="468" width="116" height="62" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="268" y="507" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">[]</text>
<rect x="334" y="468" width="116" height="62" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="392" y="507" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">[1]</text>
<rect x="458" y="468" width="116" height="62" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="516" y="507" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">[5]</text>
<rect x="582" y="468" width="116" height="62" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="640" y="507" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">[1,5]</text>
<rect x="706" y="468" width="116" height="62" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="764" y="507" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">[3]</text>
<rect x="830" y="468" width="116" height="62" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="888" y="507" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">[1,3]</text>
<rect x="954" y="468" width="116" height="62" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="1012" y="507" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">[5,3]</text>
<rect x="1078" y="468" width="116" height="62" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="1136" y="507" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">[1,5,3]</text>
<text x="210" y="556" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">the list doubles to 8, copy all four and append 3</text>
<rect x="40" y="600" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="622" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="648" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">already there</text>
<text x="348" y="648" font-size="19.5" fill="#475569">a subset that existed before this element</text>
<rect x="64" y="670" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="696" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">newly copied</text>
<text x="348" y="696" font-size="19.5" fill="#475569">the same subset with the new element appended</text>
<rect x="64" y="718" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="744" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the rule</text>
<text x="348" y="744" font-size="19.5" fill="#475569">copy every existing subset, never edit one in place</text>
</svg>