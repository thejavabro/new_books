<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="834" viewBox="0 0 1240 834" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="defer-title defer-desc">
<title id="defer-title">What is not worth doing yet</title>
<desc id="defer-desc">Several things reliably fail at small scale and are worth deferring deliberately rather than by accident, because a system nobody can operate is not a control.</desc>
<defs>
<marker id="defer-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="defer-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="defer-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="defer-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="834" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What is not worth doing yet</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Several things reliably fail at small scale and are worth deferring deliberately rather than by accident.</text>
<rect x="40" y="756" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="756" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Full microsegmentation</text>
<path d="M526 150H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 150H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#defer-marker-slate)"/>
<rect x="570" y="118" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a large ongoing cost that buys little when service</text><text x="590" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">identity already exists</text>
<rect x="40" y="194" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Continuous risk scoring</text>
<path d="M526 226H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 226H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#defer-marker-slate)"/>
<rect x="570" y="194" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">needs signal volume and a team to tune it, or it produces</text><text x="590" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">unpredictable failures</text>
<rect x="40" y="270" width="480" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A product per acronym letter</text>
<path d="M526 302H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 302H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#defer-marker-slate)"/>
<rect x="570" y="270" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the integration burden exceeds the benefit without</text><text x="590" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">somebody whose job it is</text>
<rect x="40" y="346" width="480" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Eliminating the perimeter entirely</text>
<path d="M526 378H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 378H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#defer-marker-slate)"/>
<rect x="570" y="346" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the principle says network position is not sufficient, not</text><text x="590" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that it is worthless</text>
<rect x="40" y="436" width="1160" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="436" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="466" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The decision rule that keeps this proportionate</text><text x="64" y="492" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Ask what a specific control would have prevented, from incidents you have had</text><text x="64" y="518" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">or plausibly could have. Vague ones are on the diagram because it came with the product.</text>
<rect x="40" y="562" width="1160" height="76" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="562" width="5" height="76" rx="2.5" fill="#AC8BE8"/><text x="64" y="593" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Write down what you deferred, and why</text><text x="64" y="619" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It distinguishes a decision from an oversight, exactly as accepting a risk does.</text>
<rect x="40" y="664" width="1160" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="664" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="64" y="703" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The failure is adopting a large architecture and configuring a fraction of it.</text>
<text x="66" y="790" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Defense in depth is still worth having.</text>
</svg>