<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="916" viewBox="0 0 1240 916" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shape-title shape-desc">
<title id="shape-title">Deliberately ordinary</title>
<desc id="shape-desc">The shape is unremarkable, and the ordinariness is the answer. Each of the five decisions is stated with the alternative it was chosen against.</desc>
<defs>
<marker id="shape-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shape-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shape-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shape-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="916" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Deliberately ordinary</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The shape is unremarkable, and the ordinariness is the answer.</text>
<rect x="40" y="838" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="838" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="300" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one web application</text>
<path d="M190 178V200" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M190 178V200" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="40" y="206" width="300" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="240" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one relational database</text>
<rect x="40" y="274" width="300" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="60" y="294.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">primary and a replica,</text><text x="60" y="319.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the tested restore target</text>
<path d="M346 146H410" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M410 146V282" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M410 146H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M410 146H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<path d="M410 214H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M410 214H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<path d="M410 282H474" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M410 282H474" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="480" y="118" width="340" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="650" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a worker and one queue</text>
<rect x="480" y="186" width="340" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="650" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">object storage for files</text>
<rect x="480" y="254" width="340" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="650" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a payment provider</text>
<rect x="840" y="254" width="360" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="860" y="275.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which moves money and</text><text x="860" y="300.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is never the ledger</text>
<text x="40" y="362" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Five decisions, each with its alternative</text>
<rect x="40" y="380" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One application, not services</text>
<path d="M526 410H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 410H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="380" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="403.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the service boundary should follow a team boundary,</text><text x="590" y="428.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and there are no team boundaries yet</text>
<rect x="40" y="448" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="484" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One relational database</text>
<path d="M526 478H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 478H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="448" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="471.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">transactions for the money path, and a query planner</text><text x="590" y="496.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that removes most of the early search problem</text>
<rect x="40" y="516" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="552" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Managed everything</text>
<path d="M526 546H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 546H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="516" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="539.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the scarce resource is the five engineers, and the</text><text x="590" y="564.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">price difference is a few thousand a month</text>
<rect x="40" y="584" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="620" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Search in the database until it cannot</text>
<path d="M526 614H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 614H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="584" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="607.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a second datastore brings the synchronization</text><text x="590" y="632.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">problem permanently</text>
<rect x="40" y="652" width="480" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="688" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A provider, and your own ledger</text>
<path d="M526 682H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 682H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="652" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="675.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the one place in this design where the simple</text><text x="590" y="700.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">answer is wrong</text>
<rect x="40" y="742" width="1160" height="70" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="769.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Deliberately absent: no sharding, no multi-region, no service mesh,</text><text x="620" y="796.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no event bus, no caching layer, no warehouse</text>
<text x="66" y="872" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Each omission has a trigger rather than a date.</text>
</svg>