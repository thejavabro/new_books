<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1228" viewBox="0 0 1240 1228" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two workable designs for a very large upload: an API-managed upload session with numbered parts, used when the API must handle the bytes, and short-lived signed storage locations, used when it does not. In both, an interrupted transfer resumes from what was already accepted.">
  <defs>
    <filter id="pp-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pp-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pp-k1"><rect x="84" y="174" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k2"><rect x="84" y="342" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k3"><rect x="84" y="487" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k4"><rect x="84" y="632" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k5"><rect x="84" y="777" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k6"><rect x="84" y="922" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k7"><rect x="684" y="174" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k8"><rect x="684" y="342" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k9"><rect x="684" y="487" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k10"><rect x="684" y="632" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k11"><rect x="684" y="777" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pp-k12"><rect x="684" y="922" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1228" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Two designs. The question is whether the API must see the bytes.</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one question decides, six ways they differ</text>

  
  <rect x="40" y="126" width="556" height="937" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Upload session through the API</text>

  
  <g filter="url(#pp-lift)">
    <rect x="84" y="174" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="84" y="174" width="9" height="90" fill="#2563EB" clip-path="url(#pp-k1)"/>
  </g>
  <circle cx="122" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="148" y="226" font-size="18.5" font-weight="600" fill="#111827">Use it when</text>
  <text x="320" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">The API must inspect or transform bytes,</text>
  <text x="320" y="312" text-anchor="middle" font-size="15.5" fill="#6B7280">or policy forbids direct storage access</text>

  
  <g filter="url(#pp-soft)">
    <rect x="84" y="342" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="342" width="6" height="90" fill="#2563EB" clip-path="url(#pp-k2)"/>
  </g>
  <circle cx="122" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="148" y="394" font-size="18.5" font-weight="600" fill="#111827">Who carries the bytes</text>
  <text x="320" y="457" text-anchor="middle" font-size="15.5" fill="#6B7280">The API server</text>

  
  <g filter="url(#pp-soft)">
    <rect x="84" y="487" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="487" width="6" height="90" fill="#2563EB" clip-path="url(#pp-k3)"/>
  </g>
  <circle cx="122" cy="532" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,521.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="148" y="539" font-size="18.5" font-weight="600" fill="#111827">The transfer unit</text>
  <text x="320" y="602" text-anchor="middle" font-size="15.5" fill="#6B7280">PUT to /upload-sessions/{id}/parts/{n}</text>

  
  <g filter="url(#pp-soft)">
    <rect x="84" y="632" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="632" width="6" height="90" fill="#2563EB" clip-path="url(#pp-k4)"/>
  </g>
  <circle cx="122" cy="677" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,666.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="148" y="684" font-size="18.5" font-weight="600" fill="#111827">Resume</text>
  <text x="320" y="747" text-anchor="middle" font-size="15.5" fill="#6B7280">Read the session; it lists accepted parts</text>

  
  <g filter="url(#pp-soft)">
    <rect x="84" y="777" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="777" width="6" height="90" fill="#2563EB" clip-path="url(#pp-k5)"/>
  </g>
  <circle cx="122" cy="822" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,811.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="148" y="829" font-size="18.5" font-weight="600" fill="#111827">What the API still owns</text>
  <text x="320" y="892" text-anchor="middle" font-size="15.5" fill="#6B7280">Everything</text>

  
  <g filter="url(#pp-soft)">
    <rect x="84" y="922" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="922" width="6" height="90" fill="#2563EB" clip-path="url(#pp-k6)"/>
  </g>
  <circle cx="122" cy="967" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,956.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="148" y="974" font-size="18.5" font-weight="600" fill="#111827">The cost</text>
  <text x="320" y="1037" text-anchor="middle" font-size="15.5" fill="#6B7280">API network and connection capacity</text>

  
  <rect x="644" y="126" width="556" height="937" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#047857">Direct signed storage locations</text>

  
  <g filter="url(#pp-lift)">
    <rect x="684" y="174" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="174" width="9" height="90" fill="#059669" clip-path="url(#pp-k7)"/>
  </g>
  <circle cx="722" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,208.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="748" y="226" font-size="18.5" font-weight="600" fill="#111827">Use it when</text>
  <text x="920" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">The API does not need to see the bytes at all</text>

  
  <g filter="url(#pp-soft)">
    <rect x="684" y="342" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="342" width="6" height="90" fill="#059669" clip-path="url(#pp-k8)"/>
  </g>
  <circle cx="722" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="748" y="394" font-size="18.5" font-weight="600" fill="#111827">Who carries the bytes</text>
  <text x="920" y="457" text-anchor="middle" font-size="15.5" fill="#6B7280">Storage, over the shortest path</text>

  
  <g filter="url(#pp-soft)">
    <rect x="684" y="487" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="487" width="6" height="90" fill="#059669" clip-path="url(#pp-k9)"/>
  </g>
  <circle cx="722" cy="532" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,521.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="748" y="539" font-size="18.5" font-weight="600" fill="#111827">The transfer unit</text>
  <text x="920" y="602" text-anchor="middle" font-size="15.5" fill="#6B7280">PUT to one short-lived signed URL per part</text>

  
  <g filter="url(#pp-soft)">
    <rect x="684" y="632" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="632" width="6" height="90" fill="#059669" clip-path="url(#pp-k10)"/>
  </g>
  <circle cx="722" cy="677" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,666.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="748" y="684" font-size="18.5" font-weight="600" fill="#111827">Resume</text>
  <text x="920" y="747" text-anchor="middle" font-size="15.5" fill="#6B7280">Read the location; request new URLs only for missing parts</text>

  
  <g filter="url(#pp-soft)">
    <rect x="684" y="777" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="777" width="6" height="90" fill="#059669" clip-path="url(#pp-k11)"/>
  </g>
  <circle cx="722" cy="822" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,811.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="748" y="829" font-size="18.5" font-weight="600" fill="#111827">What the API still owns</text>
  <text x="920" y="892" text-anchor="middle" font-size="15.5" fill="#6B7280">Authorization, quota, limits, metadata, completion, cleanup</text>

  
  <g filter="url(#pp-soft)">
    <rect x="684" y="922" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="922" width="6" height="90" fill="#059669" clip-path="url(#pp-k12)"/>
  </g>
  <circle cx="722" cy="967" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,956.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="748" y="974" font-size="18.5" font-weight="600" fill="#111827">The cost</text>
  <text x="920" y="1037" text-anchor="middle" font-size="15.5" fill="#6B7280">A second transfer boundary and a short-lived credential</text>

  
  <rect x="40" y="1095" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1137" text-anchor="middle" font-size="16" fill="#475569">Both finish the same way: create the File only after both checksum levels verify.</text>
  <text x="620" y="1165" text-anchor="middle" font-size="16" fill="#475569">In both, an interrupted transfer resumes from what was already accepted.</text>
</svg>