<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Course map: the eight modules as one chain, from Module 1 The Big Decision through Module 8 Rapid Review, each arrow labelled with the question that module opened, plus a feedback loop from Module 8 back to Module 1 because the last module drills all of them back.">
  <defs>
    <marker id="m08-l04-course-map-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m08-l04-course-map-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m08-l04-course-map-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="960" fill="#FFFFFF"/>

  <g filter="url(#m08-l04-course-map-soft)">
    <rect x="60" y="180" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="190" y="241" text-anchor="middle" font-size="20" fill="#64748B">MODULE 1</text>
  <text x="190" y="273" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The Big Decision</text>
  <g filter="url(#m08-l04-course-map-soft)">
    <rect x="360" y="180" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="490" y="241" text-anchor="middle" font-size="20" fill="#64748B">MODULE 2</text>
  <text x="490" y="273" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service Boundaries</text>
  <g filter="url(#m08-l04-course-map-soft)">
    <rect x="660" y="180" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="790" y="225" text-anchor="middle" font-size="20" fill="#64748B">MODULE 3</text>
  <text x="790" y="257" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">How They</text>
  <text x="790" y="289" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Communicate</text>
  <g filter="url(#m08-l04-course-map-soft)">
    <rect x="960" y="180" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1090" y="225" text-anchor="middle" font-size="20" fill="#64748B">MODULE 4</text>
  <text x="1090" y="257" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Resilience and</text>
  <text x="1090" y="289" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Failure Handling</text>
  <g filter="url(#m08-l04-course-map-soft)">
    <rect x="960" y="520" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1090" y="565" text-anchor="middle" font-size="20" fill="#64748B">MODULE 5</text>
  <text x="1090" y="597" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Data and</text>
  <text x="1090" y="629" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consistency</text>
  <g filter="url(#m08-l04-course-map-soft)">
    <rect x="660" y="520" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="790" y="565" text-anchor="middle" font-size="20" fill="#64748B">MODULE 6</text>
  <text x="790" y="597" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Running</text>
  <text x="790" y="629" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Microservices</text>
  <g filter="url(#m08-l04-course-map-soft)">
    <rect x="360" y="520" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="490" y="581" text-anchor="middle" font-size="20" fill="#64748B">MODULE 7</text>
  <text x="490" y="613" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Case Studies</text>
  <g filter="url(#m08-l04-course-map-soft)">
    <rect x="60" y="520" width="260" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="190" y="581" text-anchor="middle" font-size="20" fill="#065F46">MODULE 8</text>
  <text x="190" y="613" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rapid Review</text>

  <g fill="none" stroke-width="2.5">
    <path d="M320,250 L352,250" stroke="#475569" stroke-width="2" marker-end="url(#m08-l04-course-map-sl)"/>
    <path d="M620,250 L652,250" stroke="#475569" stroke-width="2" marker-end="url(#m08-l04-course-map-sl)"/>
    <path d="M920,250 L952,250" stroke="#475569" stroke-width="2" marker-end="url(#m08-l04-course-map-sl)"/>
    <path d="M1090,320 L1090,512" stroke="#475569" stroke-width="2" marker-end="url(#m08-l04-course-map-sl)"/>
    <path d="M952,590 L928,590" stroke="#475569" stroke-width="2" marker-end="url(#m08-l04-course-map-sl)"/>
    <path d="M652,590 L628,590" stroke="#475569" stroke-width="2" marker-end="url(#m08-l04-course-map-sl)"/>
    <path d="M352,590 L328,590" stroke="#475569" stroke-width="2" marker-end="url(#m08-l04-course-map-sl)"/>
    <path d="M190,512 L190,328" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m08-l04-course-map-em)"/>
  </g>

  <text x="336" y="150" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">split or not</text>
  <text x="636" y="150" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">where the lines go</text>
  <text x="936" y="150" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">how services talk</text>
  <text x="1070" y="420" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">what breaks the talking</text>
  <text x="936" y="700" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">data across services</text>
  <text x="636" y="700" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">living with it in production</text>
  <text x="336" y="700" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">all of it, questioned</text>
  <text x="215" y="420" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the last module drills</text>
  <text x="215" y="448" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">every one of them back</text>

  <rect x="60" y="760" width="1120" height="100" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="620" y="818" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Patterns are what you talk about. Judgment is what makes the difference.</text>

  <line x1="60" y1="900" x2="96" y2="900" stroke="#475569" stroke-width="4"/>
  <text x="108" y="907" font-size="20" fill="#475569">Each module opens the question the next one answers</text>
  <line x1="60" y1="940" x2="96" y2="940" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="947" font-size="20" fill="#475569">The last module drills all eight back</text>
</svg>