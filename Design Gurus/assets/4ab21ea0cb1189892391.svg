<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Offset, cursor and keyset pagination compared by the query each issues, the cost at page fifty thousand, whether it can jump to an arbitrary page, and when to reach for it">
  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same list of a million posts, paged three different ways</text>

  
  <rect x="50" y="88" width="360" height="528" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FFFBEB"/>
  <text x="230" y="122" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Offset</text>

  <text x="70" y="170" font-size="20" font-weight="600" fill="#475569">The query</text>
  <text x="70" y="200" font-size="20" fill="#0F172A" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">ORDER BY id DESC</text>
  <text x="70" y="226" font-size="20" fill="#0F172A" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">LIMIT 20 OFFSET 999980</text>
  <line x1="70" y1="246" x2="390" y2="246" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="70" y="276" font-size="20" font-weight="600" fill="#475569">At page 50,000 the cost is</text>
  <text x="70" y="306" font-size="20" fill="#0F172A">The database walks 999,980</text>
  <text x="70" y="332" font-size="20" fill="#0F172A">rows and throws them away.</text>
  <text x="70" y="358" font-size="20" font-weight="600" fill="#B91C1C">Deep pages crawl.</text>
  <line x1="70" y1="378" x2="390" y2="378" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="70" y="408" font-size="20" font-weight="600" fill="#475569">Jump straight to page 700?</text>
  <rect x="70" y="420" width="76" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="108" y="447" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Yes</text>
  <text x="160" y="447" font-size="20" fill="#065F46">any page, instantly</text>
  <line x1="70" y1="480" x2="390" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="70" y="510" font-size="20" font-weight="600" fill="#475569">Reach for it when</text>
  <text x="70" y="540" font-size="20" fill="#0F172A">The list is small and the</text>
  <text x="70" y="566" font-size="20" fill="#0F172A">reader needs page numbers</text>
  <text x="70" y="592" font-size="20" fill="#0F172A">and a total count.</text>

  
  <rect x="440" y="88" width="360" height="528" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M440 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#EFF6FF"/>
  <text x="620" y="122" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Cursor</text>

  <text x="460" y="170" font-size="20" font-weight="600" fill="#475569">The query</text>
  <text x="460" y="200" font-size="20" fill="#0F172A" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">WHERE (created_at, id)</text>
  <text x="460" y="226" font-size="20" fill="#0F172A" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">  &lt; decoded cursor</text>
  <line x1="460" y1="246" x2="780" y2="246" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="460" y="276" font-size="20" font-weight="600" fill="#475569">At page 50,000 the cost is</text>
  <text x="460" y="306" font-size="20" fill="#0F172A">Same cost as page 1. The</text>
  <text x="460" y="332" font-size="20" fill="#0F172A">index seeks straight to</text>
  <text x="460" y="358" font-size="20" fill="#0F172A">the token's position.</text>
  <line x1="460" y1="378" x2="780" y2="378" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="460" y="408" font-size="20" font-weight="600" fill="#475569">Jump straight to page 700?</text>
  <rect x="460" y="420" width="76" height="40" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="498" y="447" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">No</text>
  <text x="550" y="447" font-size="20" fill="#B91C1C">sequential only</text>
  <line x1="460" y1="480" x2="780" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="460" y="510" font-size="20" font-weight="600" fill="#475569">Reach for it when</text>
  <text x="460" y="540" font-size="20" fill="#0F172A">The feed changes under the</text>
  <text x="460" y="566" font-size="20" fill="#0F172A">reader, and the token must</text>
  <text x="460" y="592" font-size="20" fill="#0F172A">stay opaque to clients.</text>

  
  <rect x="830" y="88" width="360" height="528" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M830 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#F5F3FF"/>
  <text x="1010" y="122" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Keyset</text>

  <text x="850" y="170" font-size="20" font-weight="600" fill="#475569">The query</text>
  <text x="850" y="200" font-size="20" fill="#0F172A" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">WHERE id &lt; last_seen_id</text>
  <text x="850" y="226" font-size="20" fill="#0F172A" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">ORDER BY id DESC LIMIT 20</text>
  <line x1="850" y1="246" x2="1170" y2="246" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="850" y="276" font-size="20" font-weight="600" fill="#475569">At page 50,000 the cost is</text>
  <text x="850" y="306" font-size="20" fill="#0F172A">Same cost as page 1. It is</text>
  <text x="850" y="332" font-size="20" fill="#0F172A">cursor pagination with the</text>
  <text x="850" y="358" font-size="20" fill="#0F172A">key left in plain sight.</text>
  <line x1="850" y1="378" x2="1170" y2="378" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="850" y="408" font-size="20" font-weight="600" fill="#475569">Jump straight to page 700?</text>
  <rect x="850" y="420" width="76" height="40" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="888" y="447" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">No</text>
  <text x="940" y="447" font-size="20" fill="#B91C1C">sequential only</text>
  <line x1="850" y1="480" x2="1170" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="850" y="510" font-size="20" font-weight="600" fill="#475569">Reach for it when</text>
  <text x="850" y="540" font-size="20" fill="#0F172A">You own both ends and want</text>
  <text x="850" y="566" font-size="20" fill="#0F172A">the fastest scan over a</text>
  <text x="850" y="592" font-size="20" fill="#0F172A">sorted, indexed key.</text>

  
  <rect x="50" y="646" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="682" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cursor and keyset are the same idea. Cursor hides the key in a token, keyset puts it in the query.</text>
  <text x="620" y="712" font-size="20" fill="#334155" text-anchor="middle">You are trading the ability to jump to a page for a query cost that stops growing.</text>
</svg>