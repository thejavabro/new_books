<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="XOR of the whole array">
<defs>
<filter id="ts-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Two numbers appear once, and every other number appears twice</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array is [1, 4, 2, 1, 3, 5, 6, 2, 3, 5], and XORing all of it leaves 2, the two answers XORed together</text>
<rect x="40" y="106" width="1160" height="478" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The pairs cancel, so what is left is the XOR of the two numbers wanted</text>
<text x="527" y="226" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">XOR of all</text>
<rect x="549" y="186" width="62" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="580" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="619" y="186" width="62" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="650" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="689" y="186" width="62" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="720" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="777" y="226" font-size="21.5" font-weight="600" fill="#5B21B6">= 2</text>
<text x="527" y="318" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569"></text>
<text x="620" y="318" text-anchor="middle" font-size="18" fill="#475569">that is 4 XOR 6, but the two are still tangled together</text>
<text x="527" y="410" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569"></text>
<text x="620" y="410" text-anchor="middle" font-size="18" fill="#475569">a single running value cannot separate them on its own</text>
<text x="527" y="502" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569"></text>
<text x="620" y="502" text-anchor="middle" font-size="18" fill="#475569">so the array has to be split into two groups first</text>
<rect x="40" y="606" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="646" text-anchor="middle" font-size="21.5" font-weight="600" fill="#5B21B6">One running value gives their XOR, not the numbers themselves</text>
<text x="620" y="678" text-anchor="middle" font-size="18.5" fill="#475569">The next step is finding a bit that tells the two of them apart</text>
</svg>