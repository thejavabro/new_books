<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="678" viewBox="0 0 1240 678" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An NTP correction moves the wall clock backwards mid-request so the measured duration comes out negative, while the monotonic clock only ever moves forward and reports the true elapsed time">
  <rect x="0" y="0" width="1240" height="678" fill="#FFFFFF"/>
  <defs>
    <marker id="id5-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Timing one request while NTP corrects the clock underneath you</text>

  <line x1="440" y1="100" x2="440" y2="440" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="440" y="90" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">NTP steps the clock back 3 s</text>

  
  <rect x="40" y="122" width="1160" height="176" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="156" font-size="20" font-weight="600" fill="#B91C1C">Wall clock: what a human calendar says</text>

  <rect x="120" y="180" width="240" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="240" y="212" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">start 10:00:05</text>
  <rect x="700" y="180" width="240" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="820" y="212" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">end 10:00:03</text>

  <text x="780" y="272" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">end minus start = minus 2 seconds, for a request that took time</text>

  
  <rect x="40" y="318" width="1160" height="176" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="352" font-size="20" font-weight="600" fill="#065F46">Monotonic clock: only ever goes up</text>

  <rect x="120" y="376" width="240" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="240" y="408" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">start 84210.11</text>
  <rect x="700" y="376" width="240" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="820" y="408" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">end 84211.09</text>

  <text x="780" y="468" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">end minus start = 0.98 seconds, which is what happened</text>

  <line x1="120" y1="512" x2="1150" y2="512" stroke="#475569" stroke-width="2" marker-end="url(#id5-slate)"/>

  <rect x="50" y="546" width="1140" height="112" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="584" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Use the wall clock to say when something happened. Use the monotonic clock to say how long it took.</text>
  <text x="620" y="616" font-size="20" fill="#334155" text-anchor="middle">Subtracting two wall-clock readings is the bug: nothing promises the second one is larger,</text>
  <text x="620" y="642" font-size="20" fill="#334155" text-anchor="middle">and timeouts built that way can fire instantly or never.</text>
</svg>