<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="694" viewBox="0 0 1240 694" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="numbers-title numbers-desc">
<title id="numbers-title">The numbers worth asking for</title>
<desc id="numbers-desc">Six non-functional figures are worth gathering in the opening: scale as an order of magnitude, the read to write ratio, latency expectation, consistency tolerance, availability and the response to missing it, and the size of the largest single item.</desc>
<defs>
<marker id="numbers-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="numbers-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="numbers-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="numbers-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="694" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The numbers worth asking for</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The small set of numbers and qualities that will eliminate options later.</text>
<rect x="40" y="616" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="616" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V284A6 6 0 0 0 46 290H54Z" fill="#5EC9EC"/>
<circle cx="226" cy="158" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="226" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="226" y="210" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Scale</text>
<text x="226" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">as an order of magnitude, not a</text><text x="226" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">precise figure</text>
<rect x="434" y="118" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V284A6 6 0 0 0 440 290H448Z" fill="#39D5AA"/>
<circle cx="620" cy="158" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="620" y="210" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Read to write ratio</text>
<text x="620" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">decides whether caching and</text><text x="620" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">replicas help at all</text>
<rect x="828" y="118" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V284A6 6 0 0 0 834 290H842Z" fill="#F3CF6A"/>
<circle cx="1014" cy="158" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1014" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1014" y="210" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Latency expectation</text>
<text x="1014" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">what the user is waiting for, and</text><text x="1014" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">how long is acceptable</text>
<rect x="40" y="314" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 314H46A6 6 0 0 0 40 320V480A6 6 0 0 0 46 486H54Z" fill="#AC8BE8"/>
<circle cx="226" cy="354" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="226" y="362" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="226" y="406" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Consistency tolerance</text>
<text x="226" y="440" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">how stale can this be, measured in</text><text x="226" y="465" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">seconds</text>
<rect x="434" y="314" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 314H440A6 6 0 0 0 434 320V480A6 6 0 0 0 440 486H448Z" fill="#F28B9D"/>
<circle cx="620" cy="354" r="21" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="362" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="620" y="406" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Availability</text>
<text x="620" y="440" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">and what the product does when it</text><text x="620" y="465" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">is missed</text>
<rect x="828" y="314" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 314H834A6 6 0 0 0 828 320V480A6 6 0 0 0 834 486H842Z" fill="#5EC9EC"/>
<circle cx="1014" cy="354" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1014" y="362" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="1014" y="406" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Largest single item</text>
<text x="1014" y="440" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the size that decides request-path</text><text x="1014" y="465" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">or not</text>
<rect x="40" y="510" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="510" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="543" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Most interviews need three or four of these, not all six.</text><text x="64" y="569" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Consistency tolerance eliminates more architecture than any other, and is asked least often.</text>
<text x="66" y="650" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Ask for a number only when you can say which decision it changes.</text>
</svg>