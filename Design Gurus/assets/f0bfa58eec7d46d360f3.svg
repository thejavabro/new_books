<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="792" viewBox="0 0 1240 792" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="decision-title decision-desc">
<title id="decision-title">A default, plus its trigger</title>
<desc id="decision-desc">The answer that reads as experience is neither monolith nor microservices. It is one deployable unit with a named condition that would change the decision, and the honest costs of both options stated out loud.</desc>
<defs>
<marker id="decision-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="decision-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="decision-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="decision-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="792" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A default, plus its trigger</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The answer that reads as experience is neither monolith nor microservices.</text>
<rect x="40" y="714" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="714" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="90" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="90" rx="2.5" fill="#39D5AA"/><text x="64" y="154.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">One deployable unit, internally modular, until a specific trigger appears.</text><text x="64" y="183.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Then split the part the trigger points at, and only that part.</text>
<text x="40" y="250" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three things to say out loud</text>
<circle cx="60" cy="296" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="303" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="268" width="470" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="302" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name what the monolith costs</text>
<path d="M566 296H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 296H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decision-marker-slate)"/>
<rect x="610" y="268" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="302" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so it is clear you are choosing rather than defaulting</text>
<circle cx="60" cy="364" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="336" width="470" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name what distribution costs now</text>
<path d="M566 364H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 364H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decision-marker-slate)"/>
<rect x="610" y="336" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="370" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is the part most arguments skip entirely</text>
<circle cx="60" cy="432" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="439" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="404" width="470" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="438" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name the trigger</text>
<path d="M566 432H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 432H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#decision-marker-slate)"/>
<rect x="610" y="404" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="438" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the condition that would change the decision</text>
<rect x="40" y="484" width="560" height="94" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="484" width="5" height="94" rx="2.5" fill="#39D5AA"/><text x="64" y="511" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A decision</text><text x="64" y="537" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"When two teams are blocking</text><text x="64" y="563" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">each other on deploys"</text>
<rect x="640" y="484" width="560" height="94" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="484" width="5" height="94" rx="2.5" fill="#F28B9D"/><text x="664" y="511" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Not a decision</text><text x="664" y="537" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"When we get bigger"</text><text x="664" y="563" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Nothing can be observed to happen.</text>
<rect x="40" y="602" width="1160" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="602" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="64" y="637.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The judgment failure is treating this as a side you are on.</text><text x="64" y="664.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Being for or against microservices in general replaces a decision with a position.</text>
<text x="66" y="748" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Interviewers hear a position substituting for analysis immediately.</text>
</svg>