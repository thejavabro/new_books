<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1282" viewBox="0 0 1240 1282" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated S3 architecture: metadata plane and data plane, chain replicated writes, multipart uploads, erasure coding and garbage collection">
  <defs>
    <filter id="s3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="s3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="s3-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="s3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="s3-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="s3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1282" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Amazon S3: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Metadata separated from bytes, chain replication for durability, and the compactor that reclaims space</text>

  <rect x="24" y="96" width="1192" height="360" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Write · the metadata pointer is only committed once the bytes are safe</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#s3-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">PUT</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#s3-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pipeline</text>
  <path d="M620,232 L620,300" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#s3-blue)"/>
  <text x="638" y="274" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">commit last</text>
  <g filter="url(#s3-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,171 L880,217 A160,15 0 0 0 1200,217 L1200,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="171" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M460,319 L460,365 A160,15 0 0 0 780,365 L780,319" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="620" cy="319" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">streams the file</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Service</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">never buffers it</text>
  <text x="1040" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Data nodes</text>
  <text x="1040" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">chain of 3, then ack</text>
  <text x="620" y="353" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Metadata store</text>
  <text x="620" y="410" font-size="20" fill="#5B21B6" text-anchor="middle">bucket and key to volume</text>

  <rect x="24" y="486" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="518" font-size="20" font-weight="600" fill="#1E40AF">2. Read · find it, then stream it, and repair silently on bit rot</text>
  <path d="M264,584 L349,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#s3-blue)"/>
  <text x="307" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <path d="M577,584 L662,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#s3-blue)"/>
  <text x="620" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">where?</text>
  <path d="M890,584 L975,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#s3-blue)"/>
  <text x="933" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">seek</text>
  <g filter="url(#s3-soft)">
    <rect x="40" y="546" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M353,561 L353,607 A110,15 0 0 0 573,607 L573,561" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="463" cy="561" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="666" y="546" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M979,561 L979,607 A110,15 0 0 0 1199,607 L1199,561" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="561" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="606" font-size="20" fill="#64748B" text-anchor="middle">1 million reads/s</text>
  <text x="463" y="595" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Metadata cache</text>
  <text x="463" y="652" font-size="20" fill="#065F46" text-anchor="middle">in front of the store</text>
  <text x="776" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node picker</text>
  <text x="776" y="606" font-size="20" fill="#64748B" text-anchor="middle">nearest and idle</text>
  <text x="1089" y="595" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Data node</text>
  <text x="1089" y="652" font-size="20" fill="#5B21B6" text-anchor="middle">checksum on every read</text>

  <rect x="24" y="728" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="760" font-size="20" font-weight="600" fill="#475569">3. Large files · 50 GB in one stream is too fragile, so parts are independent</text>
  <path d="M364,826 L456,826" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#s3-blue)"/>
  <text x="410" y="814" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">split</text>
  <path d="M784,826 L876,826" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#s3-blue)"/>
  <text x="830" y="814" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">complete</text>
  <g filter="url(#s3-soft)">
    <rect x="40" y="788" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="788" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M880,803 L880,849 A160,15 0 0 0 1200,849 L1200,803" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="803" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="200" y="848" font-size="20" fill="#64748B" text-anchor="middle">splits locally</text>
  <text x="620" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Parts in parallel</text>
  <text x="620" y="848" font-size="20" fill="#64748B" text-anchor="middle">retry just one</text>
  <text x="1040" y="837" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Manifest</text>
  <text x="1040" y="894" font-size="20" fill="#5B21B6" text-anchor="middle">a playlist, no copying</text>

  <rect x="24" y="970" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="1002" font-size="20" font-weight="600" fill="#92400E">4. Space and durability · 11 nines without paying 200% overhead</text>
  <path d="M264,1068 L349,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#s3-amber)"/>
  <text x="307" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">later</text>
  <path d="M577,1068 L662,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#s3-amber)"/>
  <text x="620" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">rewrite</text>
  <path d="M890,1068 L975,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#s3-amber)"/>
  <text x="933" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">repair</text>
  <g filter="url(#s3-soft)">
    <rect x="40" y="1030" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="1030" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="1030" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,1045 L979,1091 A110,15 0 0 0 1199,1091 L1199,1045" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="1045" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Delete</text>
  <text x="150" y="1090" font-size="20" fill="#64748B" text-anchor="middle">metadata only</text>
  <text x="463" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Compactor</text>
  <text x="463" y="1090" font-size="20" fill="#64748B" text-anchor="middle">when 40% is waste</text>
  <text x="776" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Scrubber</text>
  <text x="776" y="1090" font-size="20" fill="#64748B" text-anchor="middle">rebuilds from parity</text>
  <text x="1089" y="1079" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Erasure coding</text>
  <text x="1089" y="1136" font-size="20" fill="#5B21B6" text-anchor="middle">6 plus 3, 50% overhead</text>
  <line x1="44" y1="1242" x2="72" y2="1242" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1249" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1242" x2="344.576" y2="1242" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1249" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1233" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1249" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1233" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1249" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1233" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1249" font-size="20" fill="#475569">core service</text>
</svg>