<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="732" viewBox="0 0 1240 732" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A prompt change passes the golden set offline, then a canary online, and any case where the two disagree is added back to the golden set">
  <defs>
    <marker id="c4ev3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c4ev3-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="c4ev3-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6D28D9"/>
    </marker>
    <filter id="c4ev3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c4ev3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c4ev3-k1"><rect x="98" y="136" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev3-k2"><rect x="485" y="136" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev3-k3"><rect x="868" y="136" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev3-k4"><rect x="868" y="426" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev3-k5"><rect x="485" y="426" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev3-k6"><rect x="98" y="426" width="270" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="732" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline: before any user sees it</text>
  <rect x="40" y="346" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="376" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: real users</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M368,181 H485" marker-end="url(#c4ev3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M755,181 H868" marker-end="url(#c4ev3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M868,471 H755" marker-end="url(#c4ev3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M485,471 H368" marker-end="url(#c4ev3-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M1148,226 V426" marker-end="url(#c4ev3-memerald)"/></g>
  <g fill="none" stroke="#6D28D9" stroke-width="2"><path d="M328,426 V334 Q328,322 340,322 H707 Q719,322 719,310 V226" marker-end="url(#c4ev3-mviolet)"/></g>
  <g filter="url(#c4ev3-soft)">
    <rect x="98" y="136" width="270" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="98" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c4ev3-k1)"/>
  </g>
  <circle cx="136" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(125.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="98" y="124" font-size="15.5" font-weight="600" fill="#6B7280">proposed</text>
  <text x="162" y="188" font-size="18.5" font-weight="600" fill="#111827">Prompt change</text>
  <text x="233" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">shorter, warmer answers</text>
  <g filter="url(#c4ev3-lift)">
    <rect x="485" y="136" width="270" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="485" y="136" width="9" height="90" fill="#D97706" clip-path="url(#c4ev3-k2)"/>
  </g>
  <circle cx="523" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(512.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="485" y="124" font-size="15.5" font-weight="600" fill="#6B7280">every change</text>
  <text x="549" y="188" font-size="18.5" font-weight="600" fill="#111827">Golden set run</text>
  <text x="620" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a few hundred cases</text>
  <g filter="url(#c4ev3-soft)">
    <rect x="868" y="136" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="868" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c4ev3-k3)"/>
  </g>
  <circle cx="906" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(895.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="868" y="124" font-size="15.5" font-weight="600" fill="#6B7280">against the current version</text>
  <text x="932" y="188" font-size="18.5" font-weight="600" fill="#111827">Compare scores</text>
  <text x="1018" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a regression blocks the change</text>
  <g filter="url(#c4ev3-soft)">
    <rect x="868" y="426" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="868" y="426" width="6" height="90" fill="#2563EB" clip-path="url(#c4ev3-k4)"/>
  </g>
  <circle cx="906" cy="471" r="18" fill="#FFFFFF"/>
  <g transform="translate(895.56,460.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="868" y="414" font-size="15.5" font-weight="600" fill="#6B7280">5% of traffic</text>
  <text x="932" y="478" font-size="18.5" font-weight="600" fill="#111827">Canary</text>
  <text x="1018" y="541" font-size="15.5" text-anchor="middle" fill="#6B7280">watched closely during rollout</text>
  <g filter="url(#c4ev3-soft)">
    <rect x="485" y="426" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="485" y="426" width="6" height="90" fill="#2563EB" clip-path="url(#c4ev3-k5)"/>
  </g>
  <circle cx="523" cy="471" r="18" fill="#FFFFFF"/>
  <g transform="translate(512.56,460.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="485" y="414" font-size="15.5" font-weight="600" fill="#6B7280">real users</text>
  <text x="549" y="478" font-size="18.5" font-weight="600" fill="#111827">Online signals</text>
  <text x="620" y="541" font-size="15.5" text-anchor="middle" fill="#6B7280">regenerations, repeat contacts</text>
  <g filter="url(#c4ev3-soft)">
    <rect x="98" y="426" width="270" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="98" y="426" width="6" height="90" fill="#7C3AED" clip-path="url(#c4ev3-k6)"/>
  </g>
  <circle cx="136" cy="471" r="18" fill="#FFFFFF"/>
  <g transform="translate(125.56,460.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="98" y="414" font-size="15.5" font-weight="600" fill="#6B7280">disagreement</text>
  <text x="162" y="478" font-size="18.5" font-weight="600" fill="#111827">Online wins</text>
  <text x="233" y="541" font-size="15.5" text-anchor="middle" fill="#6B7280">not promoted</text>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1136" y="327" fill="#047857">passes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="523.5" y="313" fill="#5B21B6">a new test case</text></g>
  <rect x="40" y="616" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="661" text-anchor="middle" font-size="16" fill="#475569">When offline and online disagree, online wins, and the golden set gains a new test case.</text>
</svg>