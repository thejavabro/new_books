<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="718" viewBox="0 0 1240 718" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="options-title options-desc">
<title id="options-title">The options, in order</title>
<desc id="options-desc">Use the database you already run, then coordination already inside a platform you run, then a managed offering, then operate a quorum yourself. The ordering is the point, because each step costs more than the one above.</desc>
<defs>
<marker id="options-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="options-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="options-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="options-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="718" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The options, in order</text>
<text x="40" y="86" font-size="21" fill="#4A5568">When a design needs coordination, these are the choices in the order a senior engineer should consider them.</text>
<rect x="40" y="640" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="640" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<circle cx="60" cy="162" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="169" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="88" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="168" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do not add one</text>
<path d="M536 162H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 162H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#options-marker-slate)"/>
<rect x="580" y="118" width="620" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="143" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A unique constraint gives exclusion. A transaction gives</text><text x="600" y="168" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">atomicity. A row with an owner and an expiry is a lease.</text><text x="600" y="193" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Postgres advisory locks give named locks.</text>
<circle cx="60" cy="262" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="269" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="218" width="440" height="88" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="268" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Use what a platform already runs</text>
<path d="M536 262H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 262H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#options-marker-slate)"/>
<rect x="580" y="218" width="620" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="243" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">On Kubernetes the control plane already operates etcd. A</text><text x="600" y="268" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Lease object and the standard leader election client give</text><text x="600" y="293" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you the guarantee without a quorum to run.</text>
<circle cx="60" cy="362" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="369" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="318" width="440" height="88" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="368" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A managed offering</text>
<path d="M536 362H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 362H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#options-marker-slate)"/>
<rect x="580" y="318" width="620" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="343" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Availability becomes somebody else's problem. Latency and</text><text x="600" y="368" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">lock-in become yours, and the request path crosses a</text><text x="600" y="393" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">boundary it did not before.</text>
<circle cx="60" cy="462" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="469" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="418" width="440" height="88" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="468" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Run it yourself</text>
<path d="M536 462H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 462H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#options-marker-slate)"/>
<rect x="580" y="418" width="620" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="443" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Correct when coordination is central to the product and a</text><text x="600" y="468" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">team will own quorum sizing, upgrades and restore drills.</text><text x="600" y="493" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Chosen more often than it is right.</text>
<rect x="40" y="530" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="530" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="563.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Each step down costs more operationally than the one above it,</text><text x="64" y="592.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">so the question is always what the step above cannot do.</text>
<text x="66" y="674" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Most requirements that sound like coordination are satisfied by a unique constraint.</text>
</svg>