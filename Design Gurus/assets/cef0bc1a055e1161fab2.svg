<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The eight caller-facing failure statuses used by this course, each with the condition that produces it and the action the caller should take next: 400, 401, 403, 404, 409, 410, 412, and 429.">
  <defs>
    <filter id="xl07callere-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl07callere-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl07callere-k1"><rect x="120" y="174" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl07callere-k2"><rect x="700" y="174" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl07callere-k3"><rect x="120" y="406" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl07callere-k4"><rect x="700" y="406" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl07callere-k5"><rect x="120" y="638" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl07callere-k6"><rect x="700" y="638" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl07callere-k7"><rect x="120" y="870" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl07callere-k8"><rect x="700" y="870" width="420" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1170" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Eight refusals, and what the caller does after each one</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">line one is the condition, line two is what the caller does next</text>

  
  <rect x="40" y="126" width="1160" height="208" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">What the caller sent does not hold</text>

  
  <g filter="url(#xl07callere-soft)">
    <rect x="120" y="174" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="120" y="174" width="6" height="90" fill="#D97706" clip-path="url(#xl07callere-k1)"/>
  </g>
  <circle cx="158" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(147.56,208.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="184" y="226" font-size="18.5" font-weight="600" fill="#111827">400 Bad Request</text>
  <text x="330" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">Input is malformed, missing, or breaks a field rule</text>
  <text x="330" y="312" font-size="15.5" text-anchor="middle" fill="#94A3B8">Correct it. Do not retry unchanged.</text>

  
  <g filter="url(#xl07callere-soft)">
    <rect x="700" y="174" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="700" y="174" width="6" height="90" fill="#D97706" clip-path="url(#xl07callere-k2)"/>
  </g>
  <circle cx="738" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,208.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="764" y="226" font-size="18.5" font-weight="600" fill="#111827">412 Precondition Failed</text>
  <text x="910" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">A condition such as If-Match is no longer true</text>
  <text x="910" y="312" font-size="15.5" text-anchor="middle" fill="#94A3B8">Reread, reapply, and resend.</text>

  
  <rect x="40" y="358" width="1160" height="208" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="388" font-size="16.5" font-weight="600" fill="#475569">The caller is not allowed through</text>

  
  <g filter="url(#xl07callere-soft)">
    <rect x="120" y="406" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="120" y="406" width="6" height="90" fill="#D97706" clip-path="url(#xl07callere-k3)"/>
  </g>
  <circle cx="158" cy="451" r="18" fill="#FFFFFF"/>
  <g transform="translate(147.56,440.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="184" y="458" font-size="18.5" font-weight="600" fill="#111827">401 Unauthorized</text>
  <text x="330" y="521" font-size="15.5" text-anchor="middle" fill="#6B7280">A valid credential is missing, expired, or invalid</text>
  <text x="330" y="544" font-size="15.5" text-anchor="middle" fill="#94A3B8">Obtain or refresh a credential.</text>

  
  <g filter="url(#xl07callere-soft)">
    <rect x="700" y="406" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="700" y="406" width="6" height="90" fill="#D97706" clip-path="url(#xl07callere-k4)"/>
  </g>
  <circle cx="738" cy="451" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,440.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="764" y="458" font-size="18.5" font-weight="600" fill="#111827">403 Forbidden</text>
  <text x="910" y="521" font-size="15.5" text-anchor="middle" fill="#6B7280">The identity is known, but not allowed to do this</text>
  <text x="910" y="544" font-size="15.5" text-anchor="middle" fill="#94A3B8">Use an authorized identity, or stop.</text>

  
  <rect x="40" y="590" width="1160" height="208" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="620" font-size="16.5" font-weight="600" fill="#475569">The target is not there</text>

  
  <g filter="url(#xl07callere-soft)">
    <rect x="120" y="638" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="120" y="638" width="6" height="90" fill="#D97706" clip-path="url(#xl07callere-k5)"/>
  </g>
  <circle cx="158" cy="683" r="18" fill="#FFFFFF"/>
  <g transform="translate(147.56,672.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="184" y="690" font-size="18.5" font-weight="600" fill="#111827">404 Not Found</text>
  <text x="330" y="753" font-size="15.5" text-anchor="middle" fill="#6B7280">The resource does not exist, or is deliberately hidden</text>
  <text x="330" y="776" font-size="15.5" text-anchor="middle" fill="#94A3B8">Correct the id, or stop.</text>

  
  <g filter="url(#xl07callere-soft)">
    <rect x="700" y="638" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="700" y="638" width="6" height="90" fill="#D97706" clip-path="url(#xl07callere-k6)"/>
  </g>
  <circle cx="738" cy="683" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,672.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="764" y="690" font-size="18.5" font-weight="600" fill="#111827">410 Gone</text>
  <text x="910" y="753" font-size="15.5" text-anchor="middle" fill="#6B7280">It existed, and was deliberately removed for good</text>
  <text x="910" y="776" font-size="15.5" text-anchor="middle" fill="#94A3B8">Stop using the reference.</text>

  
  <rect x="40" y="822" width="1160" height="208" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="852" font-size="16.5" font-weight="600" fill="#475569">The current state or the rate says no</text>

  
  <g filter="url(#xl07callere-soft)">
    <rect x="120" y="870" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="120" y="870" width="6" height="90" fill="#D97706" clip-path="url(#xl07callere-k7)"/>
  </g>
  <circle cx="158" cy="915" r="18" fill="#FFFFFF"/>
  <g transform="translate(147.56,904.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="184" y="922" font-size="18.5" font-weight="600" fill="#111827">409 Conflict</text>
  <text x="330" y="985" font-size="15.5" text-anchor="middle" fill="#6B7280">Valid input conflicts with the current state</text>
  <text x="330" y="1008" font-size="15.5" text-anchor="middle" fill="#94A3B8">Reconcile state, or change the action.</text>

  
  <g filter="url(#xl07callere-soft)">
    <rect x="700" y="870" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="700" y="870" width="6" height="90" fill="#D97706" clip-path="url(#xl07callere-k8)"/>
  </g>
  <circle cx="738" cy="915" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,904.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="764" y="922" font-size="18.5" font-weight="600" fill="#111827">429 Too Many Requests</text>
  <text x="910" y="985" font-size="15.5" text-anchor="middle" fill="#6B7280">A published rate limit was reached</text>
  <text x="910" y="1008" font-size="15.5" text-anchor="middle" fill="#94A3B8">Wait for the Retry-After period.</text>

  
  <rect x="40" y="1054" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1099" text-anchor="middle" font-size="16" fill="#475569">The status names the class of failure. Only the body can name the exact condition behind it.</text>
</svg>