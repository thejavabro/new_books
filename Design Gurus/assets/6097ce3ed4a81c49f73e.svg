<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1126" viewBox="0 0 1240 1126" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Data writers, write-behind: a processing unit with application logic and an in-memory data grid sends changes as write events to the data pump queue; data writers take them and write them to the database asynchronously, idempotently and in order per key. Data readers: data readers read data from the database and load it into the in-memory data grid of a processing unit, which also holds application logic, at initial load and recovery only">
  <defs>
    <filter id="m14g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m14g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m14g-k1"><rect x="80" y="246" width="258" height="56" rx="12"/></clipPath>
    <clipPath id="m14g-k2"><rect x="80" y="314" width="258" height="56" rx="12"/></clipPath>
    <clipPath id="m14g-k3"><rect x="530" y="251" width="190" height="80" rx="12"/></clipPath>
    <clipPath id="m14g-k4"><rect x="770" y="251" width="220" height="80" rx="12"/></clipPath>
    <clipPath id="m14g-k5"><rect x="300" y="756" width="230" height="80" rx="12"/></clipPath>
    <clipPath id="m14g-k6"><rect x="796" y="836" width="308" height="56" rx="12"/></clipPath>
    <clipPath id="m14g-k7"><rect x="796" y="768" width="308" height="56" rx="12"/></clipPath>
    <marker id="m14g-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1126" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Data writers vs. data readers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Writers move changes from the grid to the database; readers load the grid from the database.</text>

  <rect x="40" y="110" width="1160" height="482" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Data writers (write-behind)</text>
  <rect x="40" y="622" width="1160" height="474" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="652" font-size="19.5" font-weight="600" fill="#047857">Data readers (load and recovery)</text>
  <rect x="64" y="196" width="290" height="190" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="226" font-size="19.5" font-weight="600" fill="#1D4ED8">Processing unit</text>
  <rect x="780" y="718" width="340" height="190" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="804" y="748" font-size="19.5" font-weight="600" fill="#1D4ED8">Processing unit</text>

  <g fill="none" stroke-width="2">
    <path d="M354,291 H530" stroke="#D97706" marker-end="url(#m14g-m-amber)"/>
    <path d="M720,291 H770" stroke="#D97706" marker-end="url(#m14g-m-amber)"/>
    <path d="M990,291 H1028" stroke="#D97706" marker-end="url(#m14g-m-amber)"/>
    <path d="M232,796 H300" stroke="#D97706" marker-end="url(#m14g-m-amber)"/>
    <path d="M530,796 H758 V864 H796" stroke="#D97706" marker-end="url(#m14g-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="442" y="255" fill="#B45309">Changes</text>
    <text x="655" y="782" fill="#B45309">Load data</text>
  </g>

  <g filter="url(#m14g-soft)">
    <rect x="80" y="246" width="258" height="56" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="246" width="6" height="56" fill="#7C3AED" clip-path="url(#m14g-k1)"/>
  </g>
  <text x="100" y="281" font-size="18.5" font-weight="600" fill="#111827">Application logic</text>
  <g filter="url(#m14g-soft)">
    <rect x="80" y="314" width="258" height="56" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="314" width="6" height="56" fill="#059669" clip-path="url(#m14g-k2)"/>
  </g>
  <text x="100" y="349" font-size="18.5" font-weight="600" fill="#111827">In-memory data grid</text>
  <g filter="url(#m14g-soft)">
    <rect x="530" y="251" width="190" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="530" y="251" width="6" height="80" fill="#D97706" clip-path="url(#m14g-k3)"/>
  </g>
  <circle cx="568" cy="291" r="18" fill="#FFFFFF"/>
  <g transform="translate(557.56,280.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="594" y="285.25" font-size="21.5" font-weight="600" fill="#111827">Pump</text>
  <text x="594" y="310.75" font-size="21.5" font-weight="600" fill="#111827">queue</text>
  <g filter="url(#m14g-soft)">
    <rect x="770" y="251" width="220" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="770" y="251" width="6" height="80" fill="#D97706" clip-path="url(#m14g-k4)"/>
  </g>
  <circle cx="808" cy="291" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,280.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="834" y="298" font-size="21.5" font-weight="600" fill="#111827">Data writers</text>
  <g filter="url(#m14g-soft)">
    <rect x="300" y="756" width="230" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="300" y="756" width="6" height="80" fill="#D97706" clip-path="url(#m14g-k5)"/>
  </g>
  <circle cx="338" cy="796" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,785.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="364" y="803" font-size="21.5" font-weight="600" fill="#111827">Data readers</text>
  <g filter="url(#m14g-soft)">
    <rect x="796" y="768" width="308" height="56" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="796" y="768" width="6" height="56" fill="#7C3AED" clip-path="url(#m14g-k7)"/>
  </g>
  <text x="816" y="803" font-size="18.5" font-weight="600" fill="#111827">Application logic</text>
  <g filter="url(#m14g-soft)">
    <rect x="796" y="836" width="308" height="56" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="796" y="836" width="6" height="56" fill="#059669" clip-path="url(#m14g-k6)"/>
  </g>
  <text x="816" y="871" font-size="18.5" font-weight="600" fill="#111827">In-memory data grid</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M1028,239 L1028,335 A68,16 0 0 0 1164,335 L1164,239" fill="#DBEAFE"/>
    <ellipse cx="1096" cy="239" rx="68" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1096" y="302" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="1096" y="385" font-size="18.5" text-anchor="middle" fill="#6B7280">(durable storage)</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M72,744 L72,840 A80,16 0 0 0 232,840 L232,744" fill="#DBEAFE"/>
    <ellipse cx="152" cy="744" rx="80" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="152" y="807" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="152" y="890" font-size="18.5" text-anchor="middle" fill="#6B7280">(durable storage)</text>
  <text x="64" y="168" font-size="18.5" fill="#475569">Take changes from the in-memory data grid and persist them to the database asynchronously.</text>
  <text x="64" y="680" font-size="18.5" fill="#475569">Load data from the database into the in-memory data grid at startup and recovery.</text>

  <text x="442" y="278" text-anchor="middle" font-size="17" fill="#475569">(write events)</text>
  <rect x="64" y="414" width="150" height="36" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="139" y="438.5" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">Key points</text>
  <rect x="64" y="462" width="1112" height="106" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="88" cy="488" r="4" fill="#2563EB"/>
  <text x="104" y="494" font-size="18.5" fill="#1F2937">Collects changes from the in-memory data grid.</text>
  <circle cx="88" cy="518" r="4" fill="#2563EB"/>
  <text x="104" y="524" font-size="18.5" fill="#1F2937">Writes to the database asynchronously.</text>
  <circle cx="88" cy="548" r="4" fill="#2563EB"/>
  <text x="104" y="554" font-size="18.5" fill="#1F2937">Idempotent and ordered per key (version check).</text>
  <rect x="64" y="918" width="150" height="36" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="139" y="942.5" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">Key points</text>
  <rect x="64" y="966" width="1112" height="106" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="88" cy="992" r="4" fill="#059669"/>
  <text x="104" y="998" font-size="18.5" fill="#1F2937">Reads data from the database.</text>
  <circle cx="88" cy="1022" r="4" fill="#059669"/>
  <text x="104" y="1028" font-size="18.5" fill="#1F2937">Loads it into the in-memory data grid.</text>
  <circle cx="88" cy="1052" r="4" fill="#059669"/>
  <text x="104" y="1058" font-size="18.5" fill="#1F2937">Initial load and recovery only.</text>


</svg>