<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="triggers-title triggers-desc">
<title id="triggers-title">The triggers that are real</title>
<desc id="triggers-desc">A signed recovery objective, genuine localization, a measured latency problem, a regulator, or your own recorded history of region events. Each can be checked rather than argued about.</desc>
<defs>
<marker id="triggers-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="triggers-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="triggers-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="triggers-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The triggers that are real</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Multi-region becomes correct when something specific is true.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="147" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="154" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="58" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="153" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A signed recovery objective</text>
<path d="M536 147H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 147H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="580" y="118" width="620" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="140.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that a single region demonstrably cannot meet;</text><text x="600" y="165.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a contract with a number</text>
<circle cx="60" cy="215" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="222" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="440" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="221" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Hard data localization</text>
<path d="M536 215H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 215H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="580" y="186" width="620" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="208.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for a market you are in, established as localization</text><text x="600" y="233.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than transfer restriction</text>
<circle cx="60" cy="283" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="290" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="440" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="289" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A measured latency problem</text>
<path d="M536 283H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 283H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="580" y="254" width="620" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="276.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">after confirming a content delivery network and read</text><text x="600" y="301.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">replicas do not solve it</text>
<circle cx="60" cy="351" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="358" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="440" height="58" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="357" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A regulator requiring resilience</text>
<path d="M536 351H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 351H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="580" y="322" width="620" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="357" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which exists in some sectors</text>
<circle cx="60" cy="419" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="426" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="390" width="440" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="425" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Your own history</text>
<path d="M536 419H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 419H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="580" y="390" width="620" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="412.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">region-level events that affected you, more than once,</text><text x="600" y="437.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with the cost recorded</text>
<text x="40" y="490" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">And what is deliberately not on that list</text>
<rect x="40" y="508" width="275" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="177.5" y="543" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">growth</text>
<rect x="335" y="508" width="275" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="472.5" y="543" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">maturity</text>
<rect x="630" y="508" width="275" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="767.5" y="529.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a competitor's</text><text x="767.5" y="556.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">architecture</text>
<rect x="925" y="508" width="275" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1062.5" y="529.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">an expectation of</text><text x="1062.5" y="556.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">needing it later</text>
<rect x="40" y="588" width="1160" height="78" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="588" width="5" height="78" rx="2.5" fill="#39D5AA"/><text x="64" y="619.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Those are predictions rather than triggers.</text><text x="64" y="646.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Name what would have to be true, and build it when it becomes true.</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Growth and maturity are not on the list, and the same answer applies as in the evolution module.</text>
</svg>