<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ascost-title ascost-desc">
<title id="ascost-title">What autoscaling costs</title>
<desc id="ascost-desc">Capacity arrives several minutes late, scaling down is the dangerous direction, and there is a floor set by whatever is stateful. The savings are smaller than people expect.</desc>
<defs>
<marker id="ascost-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ascost-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ascost-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ascost-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="708" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What autoscaling costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Autoscaling is not free, and the costs are operational rather than financial.</text>
<rect x="40" y="630" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="630" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="155" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Capacity arrives late: start, join, warm caches, open pools, pass health checks</text>
<circle cx="60" cy="226" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="196" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scale on a leading signal</text>
<path d="M566 226H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 226H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ascost-marker-slate)"/>
<rect x="610" y="196" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">queue depth or request rate, so the decision</text><text x="630" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">happens before the pressure is visible</text>
<circle cx="60" cy="296" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="303" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="266" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="302" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep a floor for the sudden part</text>
<path d="M566 296H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 296H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ascost-marker-slate)"/>
<rect x="610" y="266" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="289.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the scaler handles the gradual rise; the floor</text><text x="630" y="314.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">covers the sudden part</text>
<circle cx="60" cy="366" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="373" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="336" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="372" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Pre-warm for known events</text>
<path d="M566 366H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 366H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ascost-marker-slate)"/>
<rect x="610" y="336" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="359.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a scheduled scale-up beats a reactive one and</text><text x="630" y="384.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">costs very little</text>
<rect x="40" y="414" width="560" height="110" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="414" width="5" height="110" rx="2.5" fill="#AC8BE8"/><text x="64" y="436" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Down is the dangerous direction</text><text x="64" y="462" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">scale down slower than up</text><text x="64" y="488" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">require the signal to persist</text><text x="64" y="514" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">drain rather than terminate</text>
<rect x="640" y="414" width="560" height="110" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="414" width="5" height="110" rx="2.5" fill="#F28B9D"/><text x="664" y="436" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The floor you cannot scale below</text><text x="664" y="462" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">database connection limits</text><text x="664" y="488" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">partition counts in messaging</text><text x="664" y="514" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">anything of a fixed size</text>
<rect x="40" y="542" width="1160" height="62" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="542" width="5" height="62" rx="2.5" fill="#F3CF6A"/><text x="64" y="579" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">Scaling a stateless tier into a stateful bottleneck turns a capacity problem into an outage.</text>
<text x="66" y="664" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A scaling event that finishes after the incident it was meant to prevent has saved money and nothing else.</text>
</svg>