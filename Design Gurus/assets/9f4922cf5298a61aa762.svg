<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A network partition splits a cluster into two groups that still work internally but cannot reach each other">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <filter id="cp5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="40" y="60" width="470" height="300" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="275" y="96" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Group A: still talking</text>

  <rect x="730" y="60" width="470" height="300" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="965" y="96" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Group B: still talking</text>

  
  <line x1="160" y1="161" x2="390" y2="161" stroke="#059669" stroke-width="2"/>
  <line x1="160" y1="161" x2="275" y2="291" stroke="#059669" stroke-width="2"/>
  <line x1="390" y1="161" x2="275" y2="291" stroke="#059669" stroke-width="2"/>
  <line x1="850" y1="161" x2="1080" y2="161" stroke="#059669" stroke-width="2"/>
  <line x1="850" y1="161" x2="965" y2="291" stroke="#059669" stroke-width="2"/>
  <line x1="1080" y1="161" x2="965" y2="291" stroke="#059669" stroke-width="2"/>

  
  <line x1="510" y1="210" x2="586" y2="210" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="654" y1="210" x2="730" y2="210" stroke="#94A3B8" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M604,194 L636,226 M636,194 L604,226" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="164" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">link is down</text>
  <text x="620" y="272" font-size="20" fill="#B91C1C" text-anchor="middle">no messages</text>
  <text x="620" y="300" font-size="20" fill="#B91C1C" text-anchor="middle">cross this line</text>

  <g filter="url(#cp5-soft)">
    <rect x="75" y="130" width="170" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="305" y="130" width="170" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="190" y="260" width="170" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="765" y="130" width="170" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="995" y="130" width="170" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="880" y="260" width="170" height="62" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="160" y="169" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 1</text>
  <text x="390" y="169" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 2</text>
  <text x="275" y="299" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 3</text>
  <text x="850" y="169" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 4</text>
  <text x="1080" y="169" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 5</text>
  <text x="965" y="299" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 6</text>

  <text x="620" y="420" font-size="20" fill="#475569" text-anchor="middle">Every node is healthy. Every node has its data. They simply cannot reach the other side,</text>
  <text x="620" y="452" font-size="20" fill="#475569" text-anchor="middle">and neither side can tell whether the other crashed or is merely unreachable.</text>
</svg>