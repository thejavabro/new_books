<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Laptops at 10.0.0.5, 10.0.0.6, and 10.0.0.7 send requests to a forward proxy at 198.51.100.7. The proxy sends the requests to news.example.com, which sees only the proxy address.">
  <defs>
    <filter id="pr2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pr2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="pr2-k1"><rect x="40" y="140" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="pr2-k2"><rect x="40" y="290" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="pr2-k3"><rect x="40" y="440" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="pr2-k4"><rect x="470" y="290" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="pr2-k5"><rect x="900" y="290" width="300" height="90" rx="12"/></clipPath>
    <marker id="pr2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="pr2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A forward proxy hides the clients</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three laptops browse through one proxy. The website sees only the proxy's address.</text>



  <g fill="none" stroke-width="2">
    <path d="M300,185 H400 Q415,185 415,200 V300 Q415,315 430,315 H470" stroke="#64748B" marker-end="url(#pr2-m-slate)"/>
    <path d="M300,335 H470" stroke="#64748B" marker-end="url(#pr2-m-slate)"/>
    <path d="M300,485 H400 Q415,485 415,470 V370 Q415,355 430,355 H470" stroke="#64748B" marker-end="url(#pr2-m-slate)"/>
    <path d="M730,335 H900" stroke="#2563EB" marker-end="url(#pr2-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="815" y="323" fill="#1D4ED8">from the proxy</text>
  </g>

  <g filter="url(#pr2-soft)">
    <rect x="40" y="140" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#pr2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Laptop A</text>
  <text x="170" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">10.0.0.5</text>
  <g filter="url(#pr2-soft)">
    <rect x="40" y="290" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#pr2-k2)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">Laptop B</text>
  <text x="170" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">10.0.0.6</text>
  <g filter="url(#pr2-soft)">
    <rect x="40" y="440" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="440" width="6" height="90" fill="#64748B" clip-path="url(#pr2-k3)"/>
  </g>
  <circle cx="78" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,474.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="492" font-size="21.5" font-weight="600" fill="#111827">Laptop C</text>
  <text x="170" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">10.0.0.7</text>
  <g filter="url(#pr2-lift)">
    <rect x="470" y="290" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="470" y="290" width="9" height="90" fill="#2563EB" clip-path="url(#pr2-k4)"/>
  </g>
  <circle cx="508" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,324.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="534" y="342" font-size="21.5" font-weight="600" fill="#111827">Forward proxy</text>
  <text x="600" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">198.51.100.7</text>
  <g filter="url(#pr2-soft)">
    <rect x="900" y="290" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="900" y="290" width="6" height="90" fill="#7C3AED" clip-path="url(#pr2-k5)"/>
  </g>
  <circle cx="938" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,324.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="964" y="342" font-size="21.5" font-weight="600" fill="#111827">news.example.com</text>
  <text x="1050" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">sees only the proxy's address</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Hides clients</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">the website sees one proxy address, not each device</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Also does</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">caching, filtering, logging, and changing requests</text>
</svg>