<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same five values inserted in two orders: a skewed chain of height 4 next to a balanced tree of height 2">
<defs>
<marker id="bstheight-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="bstheight-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="bstheight-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="bstheight-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="bstheight-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="bstheight-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="bstheight-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="bstheight-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="bstheight-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>
<text x="620" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Same five values, two heights</text>
<text x="620" y="90" text-anchor="middle" font-size="19" fill="#475569">Search, insert and delete all cost O(h), and h depends on the order the values arrived in, not on how many there are</text>
<rect x="40" y="125" width="560" height="710" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="64" y="155" font-size="19.5" font-weight="600" fill="#BE185D">Skewed: inserted as 1, 2, 3, 4, 5</text>
<rect x="640" y="125" width="560" height="710" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="664" y="155" font-size="19.5" font-weight="600" fill="#1D4ED8">Balanced: inserted as 3, 1, 5, 2, 4</text>
<line x1="120" y1="255" x2="200" y2="351" stroke="#DB2777" stroke-width="2.4"/>
<line x1="200" y1="351" x2="280" y2="447" stroke="#DB2777" stroke-width="2.4"/>
<line x1="280" y1="447" x2="360" y2="543" stroke="#DB2777" stroke-width="2.4"/>
<line x1="360" y1="543" x2="440" y2="639" stroke="#DB2777" stroke-width="2.4"/>
<line x1="120" y1="255" x2="200" y2="351" stroke="#DB2777" stroke-width="3.4"/>
<line x1="200" y1="351" x2="280" y2="447" stroke="#DB2777" stroke-width="3.4"/>
<line x1="280" y1="447" x2="360" y2="543" stroke="#DB2777" stroke-width="3.4"/>
<line x1="360" y1="543" x2="440" y2="639" stroke="#DB2777" stroke-width="3.4"/>
<circle cx="120" cy="255" r="30" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
<text x="120" y="263" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<circle cx="200" cy="351" r="30" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
<text x="200" y="359" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<circle cx="280" cy="447" r="30" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
<text x="280" y="455" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<circle cx="360" cy="543" r="30" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
<text x="360" y="551" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<circle cx="440" cy="639" r="30" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
<text x="440" y="647" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<circle cx="440" cy="639" r="37" fill="none" stroke="#DB2777" stroke-width="3"/>
<text x="120" y="209" text-anchor="middle" font-size="17" font-weight="600" fill="#BE185D">start</text>
<text x="440" y="703" text-anchor="middle" font-size="17" font-weight="600" fill="#BE185D">found after 5 compares</text>
<line x1="800" y1="351" x2="720" y2="447" stroke="#64748B" stroke-width="2.4"/>
<line x1="800" y1="351" x2="880" y2="447" stroke="#64748B" stroke-width="2.4"/>
<line x1="960" y1="255" x2="800" y2="351" stroke="#64748B" stroke-width="2.4"/>
<line x1="960" y1="255" x2="1040" y2="351" stroke="#2563EB" stroke-width="2.4"/>
<line x1="960" y1="255" x2="1040" y2="351" stroke="#2563EB" stroke-width="3.4"/>
<circle cx="720" cy="447" r="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="720" y="455" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<circle cx="800" cy="351" r="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="800" y="359" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<circle cx="880" cy="447" r="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="880" y="455" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<circle cx="960" cy="255" r="30" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="960" y="263" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<circle cx="1040" cy="351" r="30" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="1040" y="359" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<circle cx="1040" cy="351" r="37" fill="none" stroke="#2563EB" stroke-width="3"/>
<text x="960" y="209" text-anchor="middle" font-size="17" font-weight="600" fill="#1D4ED8">start</text>
<text x="1040" y="415" text-anchor="middle" font-size="17" font-weight="600" fill="#1D4ED8">found after 2 compares</text>
<text x="320" y="783" text-anchor="middle" font-size="18.5" fill="#6B7280">Height 4. Every value went right, so the tree is a chain.</text>
<text x="320" y="811" text-anchor="middle" font-size="18.5" fill="#6B7280">A search walks all five nodes: O(n).</text>
<text x="920" y="783" text-anchor="middle" font-size="18.5" fill="#6B7280">Height 2. Each level holds about twice the one above.</text>
<text x="920" y="811" text-anchor="middle" font-size="18.5" fill="#6B7280">A search walks at most three nodes: O(log n).</text>
</svg>