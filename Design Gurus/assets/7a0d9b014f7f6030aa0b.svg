    <text x="171" y="449" fill="#1D4ED8" text-anchor="end">credit</text>
    <text x="461" y="425" fill="#1D4ED8" text-anchor="end">3. Verify</text>
    <text x="461" y="449" fill="#1D4ED8" text-anchor="end">income</text>
    <text x="751" y="425" fill="#1D4ED8" text-anchor="end">4. Assess</text>
    <text x="751" y="449" fill="#1D4ED8" text-anchor="end">risk</text>
    <text x="1041" y="425" fill="#1D4ED8" text-anchor="end">5. Send</text>
    <text x="1041" y="449" fill="#1D4ED8" text-anchor="end">notification</text>
    <text x="234" y="918" fill="#1D4ED8" text-anchor="start">1. Application</text>
    <text x="234" y="942" fill="#1D4ED8" text-anchor="start">submitted (event)</text>
    <text x="556" y="918" fill="#1D4ED8" text-anchor="end">2. React to</text>
    <text x="556" y="942" fill="#1D4ED8" text-anchor="end">application</text>
    <text x="556" y="966" fill="#1D4ED8" text-anchor="end">submitted</text>
    <text x="644" y="918" fill="#1D4ED8" text-anchor="start">3. Credit check</text>
    <text x="644" y="942" fill="#1D4ED8" text-anchor="start">passed (event)</text>
    <text x="936" y="918" fill="#1D4ED8" text-anchor="end">4. React to</text>
