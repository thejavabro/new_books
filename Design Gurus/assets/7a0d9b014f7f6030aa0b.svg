    <text x="176" y="1196" fill="#1D4ED8" text-anchor="end">verified</text>
    <text x="264" y="1148" fill="#1D4ED8" text-anchor="start">7. Risk scored</text>
    <text x="264" y="1172" fill="#1D4ED8" text-anchor="start">(event)</text>
    <text x="556" y="1148" fill="#1D4ED8" text-anchor="end">8. React to</text>
    <text x="556" y="1172" fill="#1D4ED8" text-anchor="end">risk scored</text>
    <text x="644" y="1148" fill="#1D4ED8" text-anchor="start">9. Loan approved</text>
    <text x="644" y="1172" fill="#1D4ED8" text-anchor="start">(event)</text>
    <text x="966" y="1148" fill="#1D4ED8" text-anchor="end">10. React to</text>
    <text x="966" y="1172" fill="#1D4ED8" text-anchor="end">loan approved</text>
