<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1400" viewBox="0 0 1240 1400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Orchestration: a client submits a loan request to the loan approval orchestrator, which calls the credit service to check credit, the income service to verify income, the risk service to assess risk, and the notification service to send a notification. Choreography: the client publishes an application submitted event to the event bus; the credit service reacts and publishes credit check passed; the income service reacts and publishes income verified; the risk service reacts and publishes risk scored; the loan decision service reacts and publishes loan approved; the notification service reacts">
