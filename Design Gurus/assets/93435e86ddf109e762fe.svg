<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1094" viewBox="0 0 1240 1094" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A partial update needs three distinct meanings and this course gives each one its own representation: a field left out means unchanged, a field with a value means set, and an explicit null means clear, but only where the contract says the field is nullable.">
  <defs>
    <filter id="xl05threest-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl05threest-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <marker id="xl05threest-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="xl05threest-me" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="xl05threest-ma" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>

    <clipPath id="xl05threest-k1"><rect x="80" y="197" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="xl05threest-k2"><rect x="640" y="176" width="480" height="90" rx="12"/></clipPath>
    <clipPath id="xl05threest-k3"><rect x="80" y="421" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="xl05threest-k4"><rect x="640" y="400" width="480" height="90" rx="12"/></clipPath>
    <clipPath id="xl05threest-k5"><rect x="80" y="645" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="xl05threest-k6"><rect x="640" y="624" width="480" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1094" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="80" y="77" font-size="16.5" font-weight="600" fill="#475569">A patch needs three meanings, so it needs three representations</text>
  <text x="1160" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the patch body, then what the server does</text>

  
  <rect x="40" y="126" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="80" y="158" font-size="16.5" font-weight="600" fill="#1D4ED8">Field absent</text>

  <g filter="url(#xl05threest-soft)">
    <rect x="80" y="197" width="500" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="197" width="6" height="48" fill="#2563EB" clip-path="url(#xl05threest-k1)"/>
  </g>
  <circle cx="114" cy="221" r="4.5" fill="#2563EB"/>
  <text x="138" y="228" font-size="18.5" font-weight="600" fill="#111827">{ "shipping_address_id": "adr_9K3" }</text>

  <g fill="none" stroke-width="2">
    <path d="M586,221 H636" stroke="#2563EB" marker-end="url(#xl05threest-mb)"/>
  </g>

  <g filter="url(#xl05threest-soft)">
    <rect x="640" y="176" width="480" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="640" y="176" width="6" height="90" fill="#2563EB" clip-path="url(#xl05threest-k2)"/>
  </g>
  <circle cx="678" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,210.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="704" y="228" font-size="18.5" font-weight="600" fill="#111827">Leave delivery_note unchanged.</text>
  <text x="880" y="291" font-size="15.5" text-anchor="middle" fill="#6B7280">Every field that is not sent keeps its value.</text>

  
  <rect x="40" y="350" width="1160" height="200" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="80" y="382" font-size="16.5" font-weight="600" fill="#047857">A value</text>

  <g filter="url(#xl05threest-soft)">
    <rect x="80" y="421" width="500" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="421" width="6" height="48" fill="#059669" clip-path="url(#xl05threest-k3)"/>
  </g>
  <circle cx="114" cy="445" r="4.5" fill="#059669"/>
  <text x="138" y="452" font-size="18.5" font-weight="600" fill="#111827">{ "delivery_note": "Call at the lobby." }</text>

  <g fill="none" stroke-width="2">
    <path d="M586,445 H636" stroke="#059669" marker-end="url(#xl05threest-me)"/>
  </g>

  <g filter="url(#xl05threest-soft)">
    <rect x="640" y="400" width="480" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="640" y="400" width="6" height="90" fill="#059669" clip-path="url(#xl05threest-k4)"/>
  </g>
  <circle cx="678" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,434.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="704" y="452" font-size="18.5" font-weight="600" fill="#111827">Set the field to that value.</text>
  <text x="880" y="515" font-size="15.5" text-anchor="middle" fill="#6B7280">The field becomes that string.</text>

  
  <rect x="40" y="574" width="1160" height="200" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="80" y="606" font-size="16.5" font-weight="600" fill="#B45309">Explicit null</text>

  <g filter="url(#xl05threest-soft)">
    <rect x="80" y="645" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="645" width="6" height="48" fill="#D97706" clip-path="url(#xl05threest-k5)"/>
  </g>
  <circle cx="114" cy="669" r="4.5" fill="#D97706"/>
  <text x="138" y="676" font-size="18.5" font-weight="600" fill="#111827">{ "delivery_note": null }</text>

  <g fill="none" stroke-width="2.5">
    <path d="M586,669 H636" stroke="#D97706" marker-end="url(#xl05threest-ma)"/>
  </g>

  <g filter="url(#xl05threest-lift)">
    <rect x="640" y="624" width="480" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="640" y="624" width="9" height="90" fill="#D97706" clip-path="url(#xl05threest-k6)"/>
  </g>
  <circle cx="678" cy="669" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,658.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="704" y="676" font-size="18.5" font-weight="600" fill="#111827">Clear it, but only if nullable.</text>
  <text x="880" y="739" font-size="15.5" text-anchor="middle" fill="#6B7280">Null on a non-nullable field: 400.</text>

  
  <rect x="40" y="798" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="80" y="830" font-size="16.5" font-weight="600" fill="#475569">In a response the rule mirrors it</text>
  <circle cx="88" cy="857" r="3.5" fill="#64748B"/>
  <text x="102" y="862" font-size="15.5" fill="#6B7280">A null means the field belongs to this shape but has no value now.</text>
  <circle cx="88" cy="887" r="3.5" fill="#64748B"/>
  <text x="102" y="892" font-size="15.5" fill="#6B7280">Omission is reserved for a field that is not part of that response shape at all.</text>

  
  <rect x="40" y="950" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="992" text-anchor="middle" font-size="16" fill="#475569">If absence and null both meant clear, the caller could not say leave it alone.</text>
  <text x="620" y="1022" text-anchor="middle" font-size="16" fill="#475569">Generated clients treat absence and null differently, so the contract must separate them too.</text>
</svg>