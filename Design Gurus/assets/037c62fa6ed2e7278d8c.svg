<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A read-only model resource serves many responses and many batches. One response produces one usage record and one batch produces many. Conversation storage and file storage sit outside the inference boundary as reused services.">
  <defs>
    <marker id="p2g-vm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="p2g-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p2g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2g-k1"><rect x="500" y="100" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="p2g-k2"><rect x="190" y="300" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="p2g-k3"><rect x="810" y="300" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="p2g-k4"><rect x="500" y="480" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="p2g-k5"><rect x="200" y="700" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p2g-k6"><rect x="660" y="700" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="960" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="584" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The inference resource model</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#94A3B8">everything here sits inside the inference boundary</text>

  
  <g fill="none" stroke-width="2">
    <path d="M500,145 H322 Q310,145 310,157 V300" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#p2g-vm)"/>
    <path d="M740,145 H918 Q930,145 930,157 V300" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#p2g-vm)"/>
    <path d="M310,390 V513 Q310,525 322,525 H500" stroke="#059669" marker-end="url(#p2g-em)"/>
    <path d="M930,390 V513 Q930,525 918,525 H740" stroke="#059669" marker-end="url(#p2g-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="310" y="208" fill="#5B21B6">model_id</text>
    <text x="310" y="236" fill="#5B21B6">one to many</text>
    <text x="930" y="208" fill="#5B21B6">model_id</text>
    <text x="930" y="236" fill="#5B21B6">one to many</text>
    <text x="310" y="443" fill="#047857">one to one</text>
    <text x="930" y="443" fill="#047857">one to many</text>
  </g>

  
  <g filter="url(#p2g-lift)">
    <rect x="500" y="100" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="500" y="100" width="9" height="90" fill="#7C3AED" clip-path="url(#p2g-k1)"/>
  </g>
  <circle cx="538" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,134.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="564" y="152" font-size="18.5" font-weight="600" fill="#111827">Model</text>
  <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">read-only</text>

  
  <g filter="url(#p2g-soft)">
    <rect x="190" y="300" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="190" y="300" width="6" height="90" fill="#2563EB" clip-path="url(#p2g-k2)"/>
  </g>
  <circle cx="228" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,334.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="254" y="352" font-size="18.5" font-weight="600" fill="#111827">Response</text>

  
  <g filter="url(#p2g-soft)">
    <rect x="810" y="300" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="810" y="300" width="6" height="90" fill="#D97706" clip-path="url(#p2g-k3)"/>
  </g>
  <circle cx="848" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(837.56,334.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="874" y="352" font-size="18.5" font-weight="600" fill="#111827">Batch</text>

  
  <g filter="url(#p2g-lift)">
    <rect x="500" y="480" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="500" y="480" width="9" height="90" fill="#059669" clip-path="url(#p2g-k4)"/>
  </g>
  <circle cx="538" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,514.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="564" y="532" font-size="18.5" font-weight="600" fill="#111827">UsageRecord</text>
  <text x="620" y="595" font-size="15.5" text-anchor="middle" fill="#6B7280">both links use source_type + source_id</text>

  
  <rect x="40" y="652" width="1160" height="168" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="682" font-size="16.5" font-weight="600" fill="#475569">Reused services, outside this boundary</text>

  <g filter="url(#p2g-soft)">
    <rect x="200" y="700" width="380" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="200" y="700" width="6" height="90" fill="#64748B" clip-path="url(#p2g-k5)"/>
  </g>
  <circle cx="238" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,734.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="264" y="752" font-size="18.5" font-weight="600" fill="#111827">Conversation storage</text>

  <g filter="url(#p2g-soft)">
    <rect x="660" y="700" width="380" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="660" y="700" width="6" height="90" fill="#64748B" clip-path="url(#p2g-k6)"/>
  </g>
  <circle cx="698" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,734.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="724" y="752" font-size="18.5" font-weight="600" fill="#111827">File storage</text>

  
  <rect x="40" y="844" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="889" text-anchor="middle" font-size="16" fill="#475569">A new model becomes another member of /models, not another endpoint.</text>
</svg>