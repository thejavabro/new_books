<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="280" viewBox="0 0 1240 280" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A fixed window counter trace: three requests in one minute are allowed, a fourth is rejected, and a request after the minute reset is allowed again.">
  <rect x="0" y="0" width="1240" height="280" fill="#FFFFFF"/>

  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="80" y="56" fill="#475569">limit: 3 requests per minute</text>
    <text x="620" y="84" text-anchor="middle" fill="#475569">03:01, count resets</text>
  </g>

  
  <line x1="620" y1="95" x2="620" y2="212" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5"/>

  
  <g stroke="#64748B" stroke-width="2">
    <line x1="80" y1="200" x2="1160" y2="200"/>
    <line x1="120" y1="192" x2="120" y2="208"/>
    <line x1="1120" y1="192" x2="1120" y2="208"/>
  </g>
  <g font-size="15.5" text-anchor="middle" fill="#6B7280">
    <text x="120" y="235">03:00</text>
    <text x="1120" y="235">03:02</text>
    <text x="203" y="235">03:00:10</text>
    <text x="328" y="235">03:00:25</text>
    <text x="453" y="235">03:00:40</text>
    <text x="553" y="235">03:00:52</text>
    <text x="703" y="235">03:01:10</text>
  </g>

  
  <g fill="#059669">
    <circle cx="203" cy="200" r="13"/>
    <circle cx="328" cy="200" r="13"/>
    <circle cx="453" cy="200" r="13"/>
    <circle cx="703" cy="200" r="13"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M197,200 l4.5,4.5 l8,-9"/>
    <path d="M322,200 l4.5,4.5 l8,-9"/>
    <path d="M447,200 l4.5,4.5 l8,-9"/>
    <path d="M697,200 l4.5,4.5 l8,-9"/>
  </g>

  
  <circle cx="553" cy="200" r="13" fill="#DB2777"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <path d="M548,195 l10,10 M558,195 l-10,10"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="203" y="170" fill="#047857">Count 1</text>
    <text x="328" y="170" fill="#047857">Count 2</text>
    <text x="453" y="170" fill="#047857">Count 3</text>
    <text x="538" y="120" fill="#BE185D">Count = 3 already</text>
    <text x="538" y="142" fill="#BE185D">reject</text>
    <text x="703" y="170" fill="#047857">Count 1</text>
  </g>
</svg>