<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Load balancer fronting six servers: health checks remove the failing one, least-connections sends the next request to the server holding the fewest, and a server being replaced is drained first">
  <rect x="0" y="0" width="1300" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="s" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="r" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#DC2626"/>
    </marker>
    <marker id="g" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  
  <rect x="40" y="268" width="220" height="84" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="150" y="304" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Clients</text>
  <text x="150" y="332" font-size="20" fill="#334155" text-anchor="middle">one address</text>
  <line x1="260" y1="310" x2="332" y2="310" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  
  <rect x="340" y="196" width="300" height="228" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
  <text x="490" y="238" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">Load balancer</text>
  <text x="362" y="278" font-size="20" fill="#334155">health checks every 2 s</text>
  <text x="362" y="312" font-size="20" fill="#334155">least-connections</text>
  <text x="362" y="346" font-size="20" fill="#334155">drains before replacing</text>
  <text x="362" y="380" font-size="20" fill="#334155">one address, N servers</text>
  <circle cx="352" cy="272" r="4" fill="#475569"/>
  <circle cx="352" cy="306" r="4" fill="#475569"/>
  <circle cx="352" cy="340" r="4" fill="#475569"/>
  <circle cx="352" cy="374" r="4" fill="#475569"/>

  
  <path d="M640,310 L710,310 L710,128 L782,128" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M640,310 L710,310 L710,196 L782,196" fill="none" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#s)"/>
  <path d="M640,310 L710,310 L710,264 L782,264" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#g)"/>
  <path d="M640,310 L710,310 L710,332 L782,332" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <path d="M640,310 L710,310 L710,400 L782,400" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <path d="M640,310 L710,310 L710,468 L782,468" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  
  <rect x="790" y="100" width="460" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="812" y="135" font-size="20" font-weight="700" fill="#0F172A">Server 1</text>
  <text x="946" y="135" font-size="20" fill="#065F46">serving</text>
  <text x="1230" y="135" font-size="20" fill="#334155" text-anchor="end">41 in flight</text>

  <rect x="790" y="168" width="460" height="56" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="812" y="203" font-size="20" font-weight="700" fill="#0F172A">Server 2</text>
  <text x="946" y="203" font-size="20" font-weight="700" fill="#92400E">draining for deploy</text>
  <text x="1230" y="203" font-size="20" fill="#334155" text-anchor="end">6 finishing</text>

  <rect x="790" y="236" width="460" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
  <text x="812" y="271" font-size="20" font-weight="700" fill="#0F172A">Server 3</text>
  <text x="946" y="271" font-size="20" font-weight="700" fill="#065F46">next request</text>
  <text x="1230" y="271" font-size="20" font-weight="700" fill="#065F46" text-anchor="end">38 in flight</text>

  <rect x="790" y="304" width="460" height="56" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="812" y="339" font-size="20" font-weight="700" fill="#0F172A">Server 4</text>
  <text x="946" y="339" font-size="20" font-weight="700" fill="#991B1B">removed: 3 failed probes</text>

  <rect x="790" y="372" width="460" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="812" y="407" font-size="20" font-weight="700" fill="#0F172A">Server 5</text>
  <text x="946" y="407" font-size="20" fill="#065F46">serving</text>
  <text x="1230" y="407" font-size="20" fill="#334155" text-anchor="end">44 in flight</text>

  <rect x="790" y="440" width="460" height="56" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="812" y="475" font-size="20" font-weight="700" fill="#0F172A">Server 6</text>
  <text x="946" y="475" font-size="20" fill="#065F46">serving</text>
  <text x="1230" y="475" font-size="20" fill="#334155" text-anchor="end">39 in flight</text>

  
  <text x="40" y="558" font-size="20" font-weight="700" fill="#0F172A">The next request goes to the server holding the fewest, so a slow server is fed less without anyone</text>
  <text x="40" y="588" font-size="20" font-weight="700" fill="#0F172A">deciding to do that. Round-robin would keep sending Server 4 its full share.</text>
</svg>