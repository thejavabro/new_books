<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="questions-title questions-desc">
<title id="questions-title">Six questions, and a seventh</title>
<desc id="questions-desc">Six questions change the design. A seventh changes whether the project should happen in this shape at all.</desc>
<defs>
<marker id="questions-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="questions-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="questions-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="questions-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="720" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Six questions, and a seventh</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A seventh changes whether the project should happen in this shape at all.</text>
<rect x="40" y="642" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="642" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="330" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Which operations are latency-sensitive?</text>
<path d="M576 146H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 146H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="620" y="118" width="580" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="139.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if complaints are about page loads,</text><text x="640" y="164.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">read-local serving solves it</text>
<circle cx="60" cy="210" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="217" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="182" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="330" y="216" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The recovery objective, as two numbers</text>
<path d="M576 210H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 210H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="620" y="182" width="580" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="203.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how much data may be lost, and</text><text x="640" y="228.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how long recovery may take</text>
<circle cx="60" cy="274" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="281" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="246" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="330" y="280" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The current bill, by component</text>
<path d="M576 274H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 274H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="620" y="246" width="580" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="267.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a ceiling cannot be checked without</text><text x="640" y="292.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the number it is relative to</text>
<circle cx="60" cy="338" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="345" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="310" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="330" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Which data is regulated?</text>
<path d="M576 338H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 338H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="620" y="310" width="580" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="344" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">residency obligations override architectural preference</text>
<circle cx="60" cy="402" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="409" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="374" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="330" y="408" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Is any operation globally ordered?</text>
<path d="M576 402H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 402H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="620" y="374" width="580" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="395.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">ledger sequence, invoice numbering. This</text><text x="640" y="420.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">decides whether active-active exists</text>
<circle cx="60" cy="466" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="473" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="90" y="438" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="330" y="472" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How much write traffic, and from where?</text>
<path d="M576 466H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 466H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#questions-marker-slate)"/>
<rect x="620" y="438" width="580" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="459.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if European writes are a tenth of</text><text x="640" y="484.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the volume, latency matters less</text>
<rect x="40" y="512" width="1160" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="512" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="544" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The seventh question, which changes the outcome most</text><text x="64" y="570" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Would the prospect accept a documented recovery objective in a second region rather than active serving?</text><text x="64" y="596" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A warm standby meeting a thirty minute objective satisfies many contracts at a fraction of the cost.</text>
<text x="66" y="676" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Establish what the requirement actually is before paying for the most expensive reading of it.</text>
</svg>