<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-label="When data is stored, a short fingerprint of it is stored alongside. When it is read back the fingerprint is recomputed and compared, so corrupt data produces an error or a fetch from another replica rather than a wrong answer.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="540" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Writing</text>
  <rect x="50" y="87" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="129" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Data</text>
  <rect x="350" y="87" width="260" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="480" y="120" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Hash it</text>
  <text x="480" y="145" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">SHA-256</text>
  <line x1="252" y1="122" x2="348" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="612" y1="122" x2="726" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="736" y="84" width="464" height="76" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="968" y="122" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Store the data and its checksum</text>
  <line x1="40" y1="196" x2="1200" y2="196" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="40" y="240" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reading</text>
  <rect x="50" y="282" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="160" y="327" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Read it back</text>
  <rect x="370" y="282" width="260" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="500" y="318" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Hash it again</text>
  <text x="500" y="343" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">and compare</text>
  <line x1="272" y1="320" x2="368" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="880" y="254" width="320" height="76" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <path d="M906 284 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1060" y="300" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Same: return the data</text>
  <path d="M632 300 C 760 300, 760 292, 872 292" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <rect x="880" y="350" width="320" height="76" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M906 381 l16 16 M922 381 l-16 16" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-linecap="round"/>
  <text x="1060" y="396" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Different: it is corrupt</text>
  <path d="M632 342 C 760 342, 760 388, 872 388" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#ar-red)"/>
  <rect x="40" y="452" width="1160" height="68" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="493" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">On a mismatch the client fetches the same data from another replica, so corrupt data is never returned as if it were correct.</text>
</svg>