<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="724" viewBox="0 0 1240 724" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="different-title different-desc">
<title id="different-title">Not like the chapter exercises</title>
<desc id="different-desc">Four properties separate a capstone from a chapter exercise, and they change how the exercise should be worked.</desc>
<defs>
<marker id="different-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="different-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="different-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="different-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="724" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Not like the chapter exercises</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Each is deliberately under-specified, end to end, and has no single correct answer.</text>
<rect x="40" y="646" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="646" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="150" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="118" width="428" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The requirements are incomplete</text>
<path d="M526 150H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 150H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#different-marker-slate)"/>
<rect x="570" y="118" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">completing them is part of the exercise</text><text x="590" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than a prerequisite for it</text>
<circle cx="60" cy="226" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="194" width="428" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Several designs pass</text>
<path d="M526 226H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 226H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#different-marker-slate)"/>
<rect x="570" y="194" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">two engineers can reach different architectures and both</text><text x="590" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">be right. The reasoning separates them, not the diagram</text>
<circle cx="60" cy="302" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="270" width="428" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The constraints conflict</text>
<path d="M526 302H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 302H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#different-marker-slate)"/>
<rect x="570" y="270" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">zero downtime against a cost ceiling, speed against</text><text x="590" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">safety, a small team against a large surface</text>
<circle cx="60" cy="378" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="385" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="346" width="428" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="306" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Nothing is scoped to one subject</text>
<path d="M526 378H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 378H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#different-marker-slate)"/>
<rect x="570" y="346" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a good answer touches data, failure, cost and operations,</text><text x="590" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because that is what end to end means</text>
<rect x="40" y="434" width="1160" height="90" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="90" rx="2.5" fill="#39D5AA"/><text x="64" y="472" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">An exercise with one right answer tests knowledge</text><text x="64" y="498" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">An exercise with several tests judgment, which is the thing being hired for.</text>
<rect x="40" y="548" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="548" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="576" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Write your answer down before reading the discussion.</text><text x="64" y="602" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Reading first produces agreement, which teaches nothing</text>
<text x="66" y="680" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Thirty minutes of your own work produces a comparison worth having.</text>
</svg>