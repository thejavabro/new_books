<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="706" viewBox="0 0 1240 706" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What each kind of attribute in the employee ER diagram became in the tables: the composite split into columns, the multivalued attribute became its own table, and the derived attributes got no column">
<rect x="0" y="0" width="1240" height="706" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="380" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The same design as tables. Notice what happened to each kind of attribute.</text>

<text x="70" y="108" font-size="16.5" font-weight="600" fill="#111827">Employee</text>
<rect x="70" y="120" width="440" height="270" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="70" y="120" width="440" height="36" rx="10" fill="#DBEAFE"/>
<rect x="70" y="146" width="440" height="10" fill="#DBEAFE"/>
<text x="88" y="145" font-size="14.5" font-weight="600" fill="#1D4ED8">column</text>
<text x="330" y="145" font-size="14.5" font-weight="600" fill="#1D4ED8">came from</text>
<g font-size="14.5" fill="#111827">
<text x="88" y="181">employee_id</text>
<text x="88" y="207">first_name</text>
<text x="88" y="233">middle_initial</text>
<text x="88" y="259">last_name</text>
<text x="88" y="285">birthdate</text>
<text x="88" y="311">gender</text>
<text x="88" y="337">address</text>
<text x="88" y="363">payroll_id</text>
</g>
<g font-size="14" fill="#6B7280">
<text x="330" y="181">key attribute</text>
<text x="330" y="233">Full_Name, split in three</text>
<text x="330" y="285">simple attribute</text>
<text x="330" y="311">simple attribute</text>
<text x="330" y="337">simple attribute</text>
<text x="330" y="363">the 1:1 relationship</text>
</g>
<path d="M300,196 H310 V246 H300" fill="none" stroke="#7C3AED" stroke-width="1.5"/>

<text x="546" y="108" font-size="16.5" font-weight="600" fill="#111827">EmployeeContact</text>
<rect x="546" y="120" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="546" y="120" width="300" height="36" rx="10" fill="#EDE9FE"/>
<rect x="546" y="146" width="300" height="10" fill="#EDE9FE"/>
<text x="564" y="145" font-size="14.5" font-weight="600" fill="#5B21B6">column</text>
<g font-size="14.5" fill="#111827">
<text x="564" y="181">employee_id</text>
<text x="564" y="207">contact_number</text>
</g>
<text x="564" y="240" font-size="14" fill="#6B7280">the multivalued attribute,</text>
<text x="564" y="256" font-size="14" fill="#6B7280">given a table of its own</text>

<text x="546" y="296" font-size="16.5" font-weight="600" fill="#111827">Payroll</text>
<rect x="546" y="308" width="300" height="82" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<g font-size="14.5" fill="#111827">
<text x="564" y="334">payroll_id</text>
<text x="564" y="360">monthly_salary, cash_advance</text>
<text x="564" y="382">tax</text>
</g>

<rect x="882" y="120" width="294" height="270" rx="10" fill="#FEF2F2" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="900" y="150" font-size="15.5" font-weight="600" fill="#BE185D">Columns that do not exist</text>
<text x="900" y="186" font-size="14.5" font-weight="600" fill="#111827">age</text>
<text x="900" y="208" font-size="14" fill="#6B7280">derived from birthdate</text>
<text x="900" y="244" font-size="14.5" font-weight="600" fill="#111827">net_pay</text>
<text x="900" y="266" font-size="14" fill="#6B7280">derived from salary, advance</text>
<text x="900" y="284" font-size="14" fill="#6B7280">and tax</text>
<text x="900" y="320" font-size="14.5" font-weight="600" fill="#111827">contact_number</text>
<text x="900" y="342" font-size="14" fill="#6B7280">multivalued, so it could not</text>
<text x="900" y="360" font-size="14" fill="#6B7280">be a column at all</text>

<rect x="40" y="454" width="1160" height="216" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="480" width="230" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="179" y="502" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">composite attribute</text>
<text x="318" y="502" font-size="15.5" fill="#475569">Full_Name became three columns, one per part</text>
<rect x="64" y="524" width="230" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="179" y="546" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">multivalued attribute</text>
<text x="318" y="546" font-size="15.5" fill="#475569">Contact_Number became its own table, because a cell holds one value</text>
<rect x="64" y="568" width="230" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="179" y="590" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">derived attribute</text>
<text x="318" y="590" font-size="15.5" fill="#475569">Age and Net_Pay became no column, and are calculated when read</text>
<rect x="64" y="612" width="230" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="179" y="634" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">one-to-one link</text>
<text x="318" y="634" font-size="15.5" fill="#475569">payroll_id on Employee, with a UNIQUE constraint to keep it one each way</text>
</svg>