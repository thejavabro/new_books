  </g>
  <text x="1020" y="1164.5" font-size="17" font-weight="600" fill="#111827">Product</text>
  <text x="1020" y="1185.5" font-size="17" font-weight="600" fill="#111827">service</text>
  <g filter="url(#m05h-soft)">
    <rect x="1000" y="1210" width="176" height="58" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1000" y="1210" width="6" height="58" fill="#059669" clip-path="url(#m05h-k13)"/>
  </g>
  <text x="1020" y="1234.5" font-size="17" font-weight="600" fill="#111827">Review</text>
  <text x="1020" y="1255.5" font-size="17" font-weight="600" fill="#111827">service</text>
  <g filter="url(#m05h-soft)">
    <rect x="1000" y="1280" width="176" height="58" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="1000" y="1280" width="6" height="58" fill="#D97706" clip-path="url(#m05h-k14)"/>
  </g>
  <text x="1020" y="1304.5" font-size="17" font-weight="600" fill="#111827">Recommendation</text>
  <text x="1020" y="1325.5" font-size="17" font-weight="600" fill="#111827">service</text>
  <text x="64" y="182" font-size="18.5" fill="#374151">Stop waiting for a slow service.</text>
  <text x="64" y="220" font-size="18.5" font-weight="600" fill="#1D4ED8">Fail fast instead of waiting indefinitely.</text>
  <text x="64" y="352" font-size="18.5" fill="#374151">Retry idempotent calls after transient failures,</text>
  <text x="64" y="376" font-size="18.5" fill="#374151">with doubling delays plus jitter.</text>
  <text x="64" y="414" font-size="18.5" font-weight="600" fill="#047857">Helps with transient failures</text>
  <text x="64" y="438" font-size="18.5" font-weight="600" fill="#047857">without overwhelming the service.</text>
  <text x="64" y="587" font-size="18.5" fill="#374151">Stop sending requests when a service</text>
  <text x="64" y="611" font-size="18.5" fill="#374151">is failing.</text>
  <text x="64" y="649" font-size="18.5" font-weight="600" fill="#5B21B6">Prevents cascading failures when</text>
  <text x="64" y="673" font-size="18.5" font-weight="600" fill="#5B21B6">a service is unhealthy.</text>
  <text x="64" y="892" font-size="18.5" fill="#374151">Provide a safe alternative when</text>
  <text x="64" y="916" font-size="18.5" fill="#374151">a service fails.</text>
  <text x="64" y="954" font-size="18.5" font-weight="600" fill="#B45309">Keeps the system functional with</text>
  <text x="64" y="978" font-size="18.5" font-weight="600" fill="#B45309">degraded functionality.</text>
  <text x="64" y="1157" font-size="18.5" fill="#374151">Separate thread pools per dependency, so one</text>
  <text x="64" y="1181" font-size="18.5" fill="#374151">slow service cannot exhaust the rest.</text>
  <text x="64" y="1219" font-size="18.5" font-weight="600" fill="#BE185D">Limits how far a failure spreads.</text>

