  <rect x="0" y="0" width="1240" height="1400" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Microservices fault tolerance: five patterns</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every call gets a timeout; retries, circuit breakers, fallbacks and bulkheads are added where needed.</text>

  <rect x="40" y="120" width="1160" height="150" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Timeouts</text>
  <rect x="40" y="290" width="1160" height="215" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="320" font-size="19.5" font-weight="600" fill="#047857">2. Retries with backoff</text>
  <rect x="40" y="525" width="1160" height="285" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="555" font-size="19.5" font-weight="600" fill="#5B21B6">3. Circuit breaker</text>
  <rect x="40" y="830" width="1160" height="245" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="860" font-size="19.5" font-weight="600" fill="#B45309">4. Fallback</text>
  <rect x="40" y="1095" width="1160" height="265" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="1125" font-size="19.5" font-weight="600" fill="#BE185D">5. Bulkhead isolation</text>
  <rect x="790" y="1140" width="170" height="58" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="814" y="1170" font-size="19.5" font-weight="600" fill="#5B21B6">Pool</text>
  <rect x="790" y="1210" width="170" height="58" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="814" y="1240" font-size="19.5" font-weight="600" fill="#047857">Pool</text>
  <rect x="790" y="1280" width="170" height="58" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="814" y="1310" font-size="19.5" font-weight="600" fill="#B45309">Pool</text>

