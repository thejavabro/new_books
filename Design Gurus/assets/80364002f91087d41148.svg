  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="830" y="200" fill="#1D4ED8">Timeout after 2s</text>
    <text x="830" y="330" fill="#047857">1st retry (0.5s)</text>
    <text x="830" y="488" fill="#047857">2nd retry (1s)</text>
    <text x="1000" y="587" fill="#BE185D">Failure rate</text>
    <text x="1000" y="610" fill="#BE185D">exceeds threshold</text>
    <text x="845" y="783" fill="#B45309">After cooldown time</text>
    <text x="845" y="716" fill="#BE185D">Test requests fail</text>
    <text x="830" y="440" fill="#BE185D">Call fails</text>
    <text x="588" y="650" fill="#047857" text-anchor="end">Successful</text>
    <text x="588" y="673" fill="#047857" text-anchor="end">requests</text>
    <text x="830" y="882" fill="#BE185D">Service B</text>
    <text x="830" y="905" fill="#BE185D">unavailable</text>
  </g>

