  </g>
  <text x="720" y="1016.5" font-size="17" font-weight="600" fill="#111827">Fallback response</text>
  <text x="720" y="1037.5" font-size="17" font-weight="600" fill="#111827">(cached data or default)</text>
  <g filter="url(#m05h-soft)">
    <rect x="520" y="1212" width="200" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="520" y="1212" width="6" height="64" fill="#2563EB" clip-path="url(#m05h-k11)"/>
  </g>
  <text x="540" y="1251" font-size="21.5" font-weight="600" fill="#111827">Service A</text>
  <g filter="url(#m05h-soft)">
