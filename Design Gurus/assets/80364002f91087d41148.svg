  </g>
  <text x="720" y="601.5" font-size="17" font-weight="600" fill="#111827">Closed</text>
  <text x="720" y="622.5" font-size="17" font-weight="600" fill="#111827">(normal traffic)</text>
  <g filter="url(#m05h-soft)">
    <rect x="500" y="700" width="200" height="70" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
