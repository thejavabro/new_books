  </g>
  <text x="520" y="731.5" font-size="17" font-weight="600" fill="#111827">Half-open</text>
  <text x="520" y="752.5" font-size="17" font-weight="600" fill="#111827">(test requests)</text>
  <g filter="url(#m05h-soft)">
    <rect x="990" y="700" width="186" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="990" y="700" width="6" height="70" fill="#DB2777" clip-path="url(#m05h-k7)"/>
  </g>
  <text x="1010" y="731.5" font-size="17" font-weight="600" fill="#111827">Open</text>
  <text x="1010" y="752.5" font-size="17" font-weight="600" fill="#111827">(fast fail)</text>
  <g filter="url(#m05h-soft)">
    <rect x="520" y="890" width="200" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="520" y="890" width="6" height="64" fill="#2563EB" clip-path="url(#m05h-k8)"/>
  </g>
  <text x="540" y="929" font-size="21.5" font-weight="600" fill="#111827">Service A</text>
  <g filter="url(#m05h-soft)">
