<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1400" viewBox="0 0 1240 1400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five fault tolerance patterns. Every call gets a timeout; the other four are added where needed. Timeouts: service A stops waiting for service B after 2 seconds, so it fails fast instead of waiting indefinitely. Retries with backoff: the first call fails, and service A retries the idempotent call to service B after 0.5 seconds and again after 1 second, with jitter added to each delay, which helps with transient failures without overwhelming the service. Circuit breaker: closed moves to open when the failure rate exceeds a threshold, open moves to half-open after the cooldown time, half-open returns to closed on successful requests or to open when the test requests fail, which prevents cascading failures. Fallback: when service B is unavailable, service A uses a fallback response of cached data or a default, keeping the system functional with degraded functionality. Bulkhead isolation: service A keeps a separate thread pool for each dependency, one each for the product, review and recommendation services it calls, so one slow service cannot exhaust the rest, which limits how far a failure spreads">
