<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="672" viewBox="0 0 1240 672" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rewrite-title rewrite-desc">
<title id="rewrite-title">Why the rewrite fails</title>
<desc id="rewrite-desc">The old system keeps changing while the replacement is built, the real requirements exist only in code nobody can read for intent, and there is no intermediate state in which the work is worth anything.</desc>
<defs>
<marker id="rewrite-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="rewrite-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="rewrite-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="rewrite-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="672" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why the rewrite fails</text>
<text x="40" y="86" font-size="21" fill="#4A5568">This fails often enough that the pattern is worth understanding rather than just avoiding.</text>
<rect x="40" y="594" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="594" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="162" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="169" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="124" width="470" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="168" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The old system keeps changing</text>
<path d="M566 162H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 162H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rewrite-marker-slate)"/>
<rect x="610" y="124" width="590" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="155.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it is serving customers for the whole rebuild, so the</text><text x="630" y="180.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">replacement aims at something that moves</text>
<circle cx="60" cy="254" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="261" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="216" width="470" height="76" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="246.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The requirements exist only</text><text x="325" y="273.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">in the old code</text>
<path d="M566 254H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 254H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rewrite-marker-slate)"/>
<rect x="610" y="216" width="590" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="247.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">conditionals hold decisions nobody wrote down;</text><text x="630" y="272.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the code says what, never why</text>
<circle cx="60" cy="346" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="353" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="308" width="470" height="76" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="352" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">There is no safe intermediate state</text>
<path d="M566 346H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 346H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rewrite-marker-slate)"/>
<rect x="610" y="308" width="590" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="339.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the project is worth nothing until the switch,</text><text x="630" y="364.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so all the risk lands in one moment</text>
<rect x="40" y="424" width="1160" height="130" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="424" width="5" height="130" rx="2.5" fill="#F28B9D"/><text x="64" y="468" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The third is the structural problem</text><text x="64" y="495" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A long project with no intermediate value cannot be stopped, cannot be rolled back,</text><text x="64" y="522" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">and cannot be partially delivered, which means every pressure on it makes it worse.</text>
<text x="66" y="628" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Three reasons, and they compound.</text>
</svg>