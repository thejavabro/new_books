<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A games console is extended by a racing wheel, a motion controller and a headset through one standard port, without any change to the console itself">
  <defs>
    <filter id="oca-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="oca-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="oca-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oca-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <clipPath id="oca-core"><rect x="110" y="250" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="oca-port"><rect x="550" y="250" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="oca-a1"><rect x="880" y="110" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="oca-a2"><rect x="880" y="250" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="oca-a3"><rect x="880" y="390" width="280" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <rect x="40" y="40" width="1160" height="470" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">New accessories arrive without the console being opened</text>

  <g fill="none" stroke-width="2.5">
    <path d="M410,295 H534" stroke="#D97706" marker-end="url(#oca-am)"/>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M770,295 H794 Q806,295 806,283 V167 Q806,155 818,155 H872" stroke="#059669" marker-end="url(#oca-em)"/>
    <path d="M770,295 H872" stroke="#059669" marker-end="url(#oca-em)"/>
    <path d="M770,295 H794 Q806,295 806,307 V423 Q806,435 818,435 H872" stroke="#059669" marker-end="url(#oca-em)"/>
  </g>

  <g filter="url(#oca-lift)">
    <rect x="110" y="250" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="110" y="250" width="9" height="90" fill="#2563EB" clip-path="url(#oca-core)"/>
  </g>
  <circle cx="150" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(139.56,284.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 12h3M8.5 10.5v3"/><circle cx="16" cy="11" r="1"/><circle cx="18.5" cy="14" r="1"/>
  </g>
  <text x="176" y="302" font-size="18.5" font-weight="600" fill="#111827">Game console</text>
  <text x="260" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">the core stays sealed</text>
  <text x="260" y="388" font-size="15.5" text-anchor="middle" fill="#1D4ED8">closed for modification</text>

  <g filter="url(#oca-soft)">
    <rect x="550" y="250" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="550" y="250" width="6" height="90" fill="#D97706" clip-path="url(#oca-port)"/>
  </g>
  <circle cx="588" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(577.56,284.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 14.5l5-5"/><path d="M7 12l-2 2a3.5 3.5 0 0 0 5 5l2-2"/><path d="M17 12l2-2a3.5 3.5 0 0 0-5-5l-2 2"/>
  </g>
  <text x="614" y="302" font-size="18.5" font-weight="600" fill="#111827">Standard port</text>
  <text x="660" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">one agreed connection</text>
  <text x="660" y="388" font-size="15.5" text-anchor="middle" fill="#B45309">in code this is an interface</text>

  <g filter="url(#oca-soft)">
    <rect x="880" y="110" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="110" width="6" height="90" fill="#059669" clip-path="url(#oca-a1)"/>
  </g>
  <circle cx="918" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,144.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M4.5 16l5-3M19.5 16l-5-3"/>
  </g>
  <text x="944" y="162" font-size="18.5" font-weight="600" fill="#111827">Racing wheel</text>

  <g filter="url(#oca-soft)">
    <rect x="880" y="250" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="250" width="6" height="90" fill="#059669" clip-path="url(#oca-a2)"/>
  </g>
  <circle cx="918" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,284.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="2" width="8" height="20" rx="4"/><path d="M12 6.5v4"/>
  </g>
  <text x="944" y="302" font-size="18.5" font-weight="600" fill="#111827">Motion controller</text>

  <g filter="url(#oca-soft)">
    <rect x="880" y="390" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="390" width="6" height="90" fill="#059669" clip-path="url(#oca-a3)"/>
  </g>
  <circle cx="918" cy="435" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,424.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="7" width="20" height="10" rx="4"/><path d="M12 12l-1.6 3.4M12 12l1.6 3.4"/>
  </g>
  <text x="944" y="442" font-size="18.5" font-weight="600" fill="#111827">VR headset</text>

  
  <rect x="40" y="540" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="564" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="586" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Closed for modification</text>
  <text x="288" y="586" font-size="15.5" fill="#475569">nothing inside the console is rewritten when a new accessory appears</text>
  <rect x="64" y="608" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="630" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Open for extension</text>
  <text x="288" y="630" font-size="15.5" fill="#475569">each new behaviour is a separate part that plugs into a connection the core already offers</text>
</svg>