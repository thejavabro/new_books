<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="734" viewBox="0 0 1240 734" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A thread goes from New to Runnable, takes turns between Runnable and Running, leaves Running to wait as Blocked, Waiting, or Timed waiting, always returns from a wait to Runnable, and ends as Terminated">
  <defs>
    <filter id="l04ts-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="l04ts-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="l04ts-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="l04ts-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="l04ts-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="l04ts-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <clipPath id="l04ts-k1"><rect x="40" y="84" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="l04ts-k2"><rect x="366" y="84" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="l04ts-k3"><rect x="692" y="84" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="l04ts-k4"><rect x="1018" y="84" width="182" height="90" rx="12"/></clipPath>
    <clipPath id="l04ts-k5"><rect x="209" y="438" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="l04ts-k6"><rect x="509" y="438" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="l04ts-k7"><rect x="809" y="438" width="210" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="734" fill="#FFFFFF"/>

  
  <rect x="70" y="304" width="1088" height="284" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="94" y="334" font-size="20" font-weight="600" fill="#475569">Three ways to wait</text>

  
  <g fill="none" stroke-width="2">
    <path d="M210,129 H366" stroke="#64748B" marker-end="url(#l04ts-sl)"/>
    <path d="M536,114 H692" stroke="#2563EB" marker-end="url(#l04ts-bl)"/>
    <path d="M692,144 H536" stroke="#7C3AED" marker-end="url(#l04ts-vi)"/>
    <path d="M862,129 H1018" stroke="#64748B" marker-end="url(#l04ts-sl)"/>
    <path d="M727,174 V240 Q727,252 715,252 H361 Q349,252 349,264 V438" stroke="#DB2777" marker-end="url(#l04ts-pk)"/>
    <path d="M777,174 V264 Q777,276 765,276 H661 Q649,276 649,288 V438" stroke="#DB2777" marker-end="url(#l04ts-pk)"/>
    <path d="M827,174 V192 Q827,204 839,204 H937 Q949,204 949,216 V438" stroke="#DB2777" marker-end="url(#l04ts-pk)"/>
    <path d="M279,438 V216 Q279,204 291,204 H389 Q401,204 401,192 V174" stroke="#7C3AED" marker-end="url(#l04ts-vi)"/>
    <path d="M579,438 V288 Q579,276 567,276 H463 Q451,276 451,264 V174" stroke="#7C3AED" marker-end="url(#l04ts-vi)"/>
    <path d="M879,438 V240 Q879,228 867,228 H513 Q501,228 501,216 V174" stroke="#7C3AED" marker-end="url(#l04ts-vi)"/>
  </g>
  <g font-size="20" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="288" y="119" fill="#475569">start()</text>
    <text x="614" y="74" fill="#1D4ED8">scheduler gives</text>
    <text x="614" y="102" fill="#1D4ED8">it a core</text>
    <text x="614" y="170" fill="#5B21B6">time slice ends</text>
    <text x="940" y="119" fill="#475569">work is done</text>
  </g>
  <g font-size="20" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="269" y="386" fill="#5B21B6">gets the lock</text>
    <text x="569" y="358" fill="#5B21B6">notified, or the</text>
    <text x="569" y="386" fill="#5B21B6">joined thread ends</text>
    <text x="869" y="386" fill="#5B21B6">time is up</text>
  </g>
  <g font-size="20" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="359" y="418" fill="#BE185D">asks for a held lock</text>
    <text x="659" y="418" fill="#BE185D">wait() or join()</text>
    <text x="959" y="418" fill="#BE185D">sleep(20 ms)</text>
  </g>

  
  <g filter="url(#l04ts-soft)">
    <rect x="40" y="84" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="84" width="6" height="90" fill="#64748B" clip-path="url(#l04ts-k1)"/>
  </g>
  <circle cx="78" cy="129" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,118.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
  </g>
  <text x="104" y="136" font-size="20" font-weight="600" fill="#111827">New</text>
  <text x="125" y="46" font-size="20" text-anchor="middle" fill="#6B7280">created, not started</text>

  <g filter="url(#l04ts-soft)">
    <rect x="366" y="84" width="170" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="366" y="84" width="6" height="90" fill="#7C3AED" clip-path="url(#l04ts-k2)"/>
  </g>
  <circle cx="404" cy="129" r="18" fill="#FFFFFF"/>
  <g transform="translate(393.56,118.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="430" y="136" font-size="20" font-weight="600" fill="#111827">Runnable</text>
  <text x="451" y="46" font-size="20" text-anchor="middle" fill="#6B7280">ready, needs a free core</text>

  <g filter="url(#l04ts-lift)">
    <rect x="692" y="84" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="692" y="84" width="9" height="90" fill="#2563EB" clip-path="url(#l04ts-k3)"/>
  </g>
  <circle cx="730" cy="129" r="18" fill="#FFFFFF"/>
  <g transform="translate(719.56,118.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="756" y="136" font-size="20" font-weight="600" fill="#111827">Running</text>
  <text x="777" y="46" font-size="20" text-anchor="middle" fill="#6B7280">on a core right now</text>

  <g filter="url(#l04ts-soft)">
    <rect x="1018" y="84" width="182" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="1018" y="84" width="6" height="90" fill="#64748B" clip-path="url(#l04ts-k4)"/>
  </g>
  <circle cx="1056" cy="129" r="18" fill="#FFFFFF"/>
  <g transform="translate(1045.56,118.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="1082" y="136" font-size="20" font-weight="600" fill="#111827">Terminated</text>
  <text x="1109" y="46" font-size="20" text-anchor="middle" fill="#6B7280">never runs again</text>

  <g filter="url(#l04ts-soft)">
    <rect x="209" y="438" width="210" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="209" y="438" width="6" height="90" fill="#DB2777" clip-path="url(#l04ts-k5)"/>
  </g>
  <circle cx="247" cy="483" r="18" fill="#FFFFFF"/>
  <g transform="translate(236.56,472.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>
  </g>
  <text x="273" y="490" font-size="20" font-weight="600" fill="#111827">Blocked</text>
  <text x="314" y="558" font-size="20" text-anchor="middle" fill="#6B7280">wants a lock another thread holds</text>

  <g filter="url(#l04ts-soft)">
    <rect x="509" y="438" width="210" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="509" y="438" width="6" height="90" fill="#DB2777" clip-path="url(#l04ts-k6)"/>
  </g>
  <circle cx="547" cy="483" r="18" fill="#FFFFFF"/>
  <g transform="translate(536.56,472.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>
  </g>
  <text x="573" y="490" font-size="20" font-weight="600" fill="#111827">Waiting</text>
  <text x="614" y="558" font-size="20" text-anchor="middle" fill="#6B7280">waits for another thread</text>

  <g filter="url(#l04ts-soft)">
    <rect x="809" y="438" width="210" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="809" y="438" width="6" height="90" fill="#DB2777" clip-path="url(#l04ts-k7)"/>
  </g>
  <circle cx="847" cy="483" r="18" fill="#FFFFFF"/>
  <g transform="translate(836.56,472.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V10M10 2.5h4M12 2.5v3.5M18 6.5l1.5-1.5"/>
  </g>
  <text x="873" y="490" font-size="20" font-weight="600" fill="#111827">Timed waiting</text>
  <text x="914" y="558" font-size="20" text-anchor="middle" fill="#6B7280">waits up to a time limit</text>

  
  <rect x="40" y="618" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="663" text-anchor="middle" font-size="20" fill="#475569">Every arrow out of a waiting state goes back to Runnable, because a thread that stops waiting still needs a core.</text>
</svg>