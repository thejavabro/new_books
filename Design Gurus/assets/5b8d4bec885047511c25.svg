<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="726" viewBox="0 0 1240 726" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On one 80 GB GPU, a 13B model at 16-bit needs about 26 GB and fits; a 70B model at 16-bit needs about 140 GB and needs 2 to 4 GPUs; the 70B model at 8-bit needs about 70 GB and fits with little room left. The 13B model leaves about 54 GB for the KV cache, which at about 2 GB per active request holds about 27 requests at once">
  <defs>
    <marker id="c4env3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c4env3-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="c4env3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="c4env3-k1"><rect x="90" y="136" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c4env3-k2"><rect x="470" y="136" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c4env3-k3"><rect x="850" y="136" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c4env3-k4"><rect x="90" y="420" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c4env3-k5"><rect x="580" y="420" width="300" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="726" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Weights first: one GPU has 80 GB</text>
  <rect x="40" y="340" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="370" font-size="16.5" font-weight="600" fill="#B45309">Then the KV cache:</text>
  <text x="64" y="392" font-size="16.5" font-weight="600" fill="#B45309">the per-request working memory</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M390,465 H580" marker-end="url(#c4env3-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M345,226 V420" marker-end="url(#c4env3-memerald)"/></g>
  <g filter="url(#c4env3-soft)">
    <rect x="90" y="136" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="90" y="136" width="6" height="90" fill="#059669" clip-path="url(#c4env3-k1)"/>
  </g>
  <circle cx="128" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="90" y="124" font-size="15.5" font-weight="600" fill="#6B7280">16-bit: 2 bytes per parameter</text>
  <text x="154" y="188" font-size="18.5" font-weight="600" fill="#111827">13B model</text>
  <text x="240" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 26 GB: fits one GPU</text>
  <g filter="url(#c4env3-soft)">
    <rect x="470" y="136" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="470" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c4env3-k2)"/>
  </g>
  <circle cx="508" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="470" y="124" font-size="15.5" font-weight="600" fill="#6B7280">16-bit: 2 bytes per parameter</text>
  <text x="534" y="188" font-size="18.5" font-weight="600" fill="#111827">70B model</text>
  <text x="620" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 140 GB: needs 2 to 4 GPUs</text>
  <g filter="url(#c4env3-soft)">
    <rect x="850" y="136" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="850" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c4env3-k3)"/>
  </g>
  <circle cx="888" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="850" y="124" font-size="15.5" font-weight="600" fill="#6B7280">8-bit: 1 byte per parameter</text>
  <text x="914" y="188" font-size="18.5" font-weight="600" fill="#111827">70B model at 8-bit</text>
  <text x="1000" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 70 GB: fits, little room left</text>
  <g filter="url(#c4env3-soft)">
    <rect x="90" y="420" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="90" y="420" width="6" height="90" fill="#4F46E5" clip-path="url(#c4env3-k4)"/>
  </g>
  <circle cx="128" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,454.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="154" y="472" font-size="18.5" font-weight="600" fill="#111827">KV cache</text>
  <text x="240" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">about 2 GB per active request, assumed</text>
  <g filter="url(#c4env3-soft)">
    <rect x="580" y="420" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="580" y="420" width="6" height="90" fill="#2563EB" clip-path="url(#c4env3-k5)"/>
  </g>
  <circle cx="618" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(607.56,454.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="644" y="472" font-size="18.5" font-weight="600" fill="#111827">About 27 requests at once</text>
  <text x="730" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">for the 13B model</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="485" y="451" fill="#4338CA">54 GB divided by 2 GB</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="357" y="318" fill="#047857">about 54 GB left</text></g>
  <rect x="40" y="610" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="655" text-anchor="middle" font-size="16" fill="#475569">The KV cache usually caps how many requests one GPU can serve at once, more than raw compute does.</text>
</svg>