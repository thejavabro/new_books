<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="798" viewBox="0 0 1240 798" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="race-title race-desc">
<title id="race-title">The race that corrupts rows</title>
<desc id="race-desc">A backfill that reads, computes and writes back can overwrite a value the application wrote in between. Guarding on the new column being null fixes it, and doing the transformation inside the statement removes the window entirely.</desc>
<defs>
<marker id="race-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="race-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="race-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="race-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="798" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The race that corrupts rows</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The backfill overwrote fresher data with a stale computation.</text>
<rect x="40" y="720" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="720" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Dual writing is on, and the row still ends up wrong</text>
<circle cx="60" cy="196" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="203" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="168" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the backfill reads row 5</text>
<path d="M536 196H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 196H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#race-marker-slate)"/>
<rect x="580" y="168" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">amount_cents = 100</text>
<circle cx="60" cy="264" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="271" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="236" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the application updates row 5</text>
<path d="M536 264H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 264H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#race-marker-slate)"/>
<rect x="580" y="236" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">amount_cents = 250, amount = 2.50</text>
<circle cx="60" cy="332" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="339" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="304" width="440" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the backfill writes what it read</text>
<path d="M536 332H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 332H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#race-marker-slate)"/>
<rect x="580" y="304" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">amount = 1.00</text>
<rect x="40" y="376" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="376" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="413" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Dual writing worked correctly the whole time. Nothing logged an error.</text>
<text x="40" y="472" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Defense one: guard the write</text>
<rect x="40" y="490" width="560" height="112" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="490" width="5" height="112" rx="2.5" fill="#5EC9EC"/><text x="64" y="526" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">AND amount IS NULL</text><text x="64" y="552" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">dual writing fills it for every row the</text><text x="64" y="578" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">app touches, so the backfill skips them</text>
<text x="640" y="472" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Defense two: no read at all</text>
<rect x="640" y="490" width="560" height="112" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="490" width="5" height="112" rx="2.5" fill="#39D5AA"/><text x="664" y="526" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">SET amount = amount_cents / 100.0</text><text x="664" y="552" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">read and write in one statement,</text><text x="664" y="578" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">so there is no window to race in</text>
<rect x="40" y="618" width="1160" height="76" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="618" width="5" height="76" rx="2.5" fill="#AC8BE8"/><text x="64" y="649" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Removing the read-modify-write cycle removes the race</text><text x="64" y="675" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">rather than guarding against it, which is why it is the stronger of the two.</text>
<text x="66" y="754" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Combine both and the backfill is correct even running twice, concurrently, under live writes.</text>
</svg>