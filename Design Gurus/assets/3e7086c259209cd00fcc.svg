  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Testing hexagonal architecture without a database</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every arrow is a dependency: the test calls the real use case, and both adapters implement the OrderRepository port.</text>

