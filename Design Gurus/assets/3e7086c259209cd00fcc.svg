  <g transform="translate(691.56,664.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="728" y="682" font-size="21.5" font-weight="600" fill="#111827">PostgresOrderRepository</text>
  <text x="924" y="749" font-size="18.5" text-anchor="middle" fill="#6B7280">(implements OrderRepository)</text>

  <rect x="64" y="196" width="452" height="228" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="84" y="236" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15.5" fill="#1F2937">def test_create_order_succeeds_with_valid_data():</text>
  <text x="118.4" y="263" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15.5" fill="#1F2937">repo = InMemoryOrderRepository()</text>
  <text x="118.4" y="290" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15.5" fill="#1F2937">use_cases = OrderUseCasesImpl(</text>
  <text x="152.8" y="317" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15.5" fill="#1F2937">order_repository=repo, ...)</text>
  <text x="118.4" y="344" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15.5" fill="#1F2937">result = use_cases.create_order(command)</text>
  <text x="118.4" y="371" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15.5" fill="#1F2937">order = repo.find_by_id(result.order_id)</text>
  <text x="118.4" y="398" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15.5" fill="#1F2937">assert order.status == OrderStatus.CONFIRMED</text>

  <path d="M40,800 H76" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="88" y="806" font-size="18.5" fill="#6B7280">Dashed arrow: implements the port, but is not wired in this test.</text>
</svg>