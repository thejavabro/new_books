<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Estimation runs in three steps: write down the assumptions, do the arithmetic with round numbers, then read what the result implies for the design">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="be1-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="be1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="400" y1="205" x2="443" y2="205" stroke="#475569" stroke-width="2.5" marker-end="url(#be1-slate)"/>
  <line x1="790" y1="205" x2="833" y2="205" stroke="#475569" stroke-width="2.5" marker-end="url(#be1-slate)"/>

  <g filter="url(#be1-soft)">
    <rect x="60" y="110" width="340" height="190" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
    <rect x="450" y="110" width="340" height="190" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
    <rect x="840" y="110" width="340" height="190" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  </g>

  <text x="230" y="152" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">1. Assumptions</text>
  <text x="230" y="200" font-size="20" fill="#334155" text-anchor="middle">100 million users</text>
  <text x="230" y="235" font-size="20" fill="#334155" text-anchor="middle">10 percent post daily</text>
  <text x="230" y="270" font-size="20" fill="#334155" text-anchor="middle">500 KB a photo</text>

  <text x="620" y="152" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">2. Arithmetic</text>
  <text x="620" y="200" font-size="20" fill="#334155" text-anchor="middle">10 million writes a day</text>
  <text x="620" y="235" font-size="20" fill="#334155" text-anchor="middle">100 writes a second</text>
  <text x="620" y="270" font-size="20" fill="#334155" text-anchor="middle">5 TB a day</text>

  <text x="1010" y="152" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">3. What it implies</text>
  <text x="1010" y="200" font-size="20" fill="#334155" text-anchor="middle">Read heavy</text>
  <text x="1010" y="235" font-size="20" fill="#334155" text-anchor="middle">Needs a cache and a CDN</text>
  <text x="1010" y="270" font-size="20" fill="#334155" text-anchor="middle">Object storage</text>

  <text x="620" y="375" font-size="20" fill="#475569" text-anchor="middle">The third step is the one that matters: a number with no design consequence is just arithmetic</text>
</svg>