  <rect x="644" y="448" width="556" height="248" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="668" y="478" font-size="16.5" font-weight="600" fill="#B45309">Who writes, who reads</text>
  <text x="1176" y="478" text-anchor="end" font-size="15.5" fill="#6B7280">on RideLocation</text>

  <g filter="url(#p40-soft)">
    <rect x="680" y="502" width="484" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="680" y="502" width="6" height="48" fill="#D97706" clip-path="url(#p40-k13)"/>
  </g>
  <circle cx="714" cy="526" r="4.5" fill="#D97706"/>
  <text x="738" y="533" font-size="18.5" font-weight="600" fill="#111827">Driver: PUT every few seconds</text>

  <g filter="url(#p40-soft)">
    <rect x="680" y="564" width="484" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="680" y="564" width="6" height="48" fill="#D97706" clip-path="url(#p40-k14)"/>
  </g>
  <circle cx="714" cy="588" r="4.5" fill="#D97706"/>
  <text x="738" y="595" font-size="18.5" font-weight="600" fill="#111827">Rider: positions on the same stream</text>

  <g filter="url(#p40-soft)">
    <rect x="680" y="626" width="484" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
