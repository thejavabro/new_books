    <clipPath id="p40-k7"><rect x="680" y="180" width="484" height="48" rx="10"/></clipPath>
    <clipPath id="p40-k8"><rect x="680" y="242" width="484" height="48" rx="10"/></clipPath>
    <clipPath id="p40-k9"><rect x="680" y="304" width="484" height="48" rx="10"/></clipPath>
    <clipPath id="p40-k10"><rect x="76" y="502" width="484" height="48" rx="10"/></clipPath>
    <clipPath id="p40-k11"><rect x="76" y="564" width="484" height="48" rx="10"/></clipPath>
    <clipPath id="p40-k12"><rect x="76" y="626" width="484" height="48" rx="10"/></clipPath>
