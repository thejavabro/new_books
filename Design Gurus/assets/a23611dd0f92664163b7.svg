  </g>
  <circle cx="714" cy="650" r="4.5" fill="#DB2777"/>
  <text x="738" y="657" font-size="18.5" font-weight="600" fill="#111827">Partner: not included</text>

  
  <rect x="40" y="728" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="773" text-anchor="middle" font-size="16" fill="#475569">Location is separate because its write rate, ordering, authorization, caching and lifetime all differ from the ride.</text>
