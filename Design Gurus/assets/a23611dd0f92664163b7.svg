<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="844" viewBox="0 0 1240 844" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The durable ride carries a six state lifecycle and changes rarely. Ride location is a separate resource replaced every few seconds. Each side lists who writes and who reads it, and the partner receives only final ride outcomes, never live positions.">
  <defs>
    <filter id="p40-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p40-lift" x="-14%" y="-16%" width="128%" height="145%">
