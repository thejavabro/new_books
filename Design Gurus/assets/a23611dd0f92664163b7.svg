  <g filter="url(#p40-soft)">
    <rect x="76" y="626" width="484" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="626" width="6" height="48" fill="#2563EB" clip-path="url(#p40-k12)"/>
  </g>
  <circle cx="110" cy="650" r="4.5" fill="#2563EB"/>
