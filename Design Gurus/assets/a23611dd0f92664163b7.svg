  <text x="738" y="211" font-size="18.5" font-weight="600" fill="#111827">sequence 841</text>

  <g filter="url(#p40-soft)">
    <rect x="680" y="242" width="484" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="680" y="242" width="6" height="48" fill="#D97706" clip-path="url(#p40-k8)"/>
  </g>
  <circle cx="714" cy="266" r="4.5" fill="#D97706"/>
  <text x="738" y="273" font-size="18.5" font-weight="600" fill="#111827">A lower sequence returns 409</text>

  <g filter="url(#p40-soft)">
    <rect x="680" y="304" width="484" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="680" y="304" width="6" height="48" fill="#D97706" clip-path="url(#p40-k9)"/>
  </g>
  <circle cx="714" cy="328" r="4.5" fill="#D97706"/>
  <text x="738" y="335" font-size="18.5" font-weight="600" fill="#111827">No public route history</text>

  <text x="922" y="382" text-anchor="middle" font-size="15.5" fill="#6B7280">replaced every few seconds</text>

  
  <rect x="40" y="448" width="556" height="248" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="478" font-size="16.5" font-weight="600" fill="#1D4ED8">Who writes, who reads</text>
  <text x="572" y="478" text-anchor="end" font-size="15.5" fill="#6B7280">on Ride</text>

