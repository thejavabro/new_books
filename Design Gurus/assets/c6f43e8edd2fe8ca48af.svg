<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Read repair, hinted handoff and anti-entropy compared by what triggers each one, what it does, and the blind spot each one leaves for the others to cover">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three repair mechanisms, and which one fires when</text>

  
  <rect x="50" y="88" width="360" height="402" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#EFF6FF"/>
  <text x="230" y="122" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Read repair</text>
  <text x="70" y="180" font-size="20" font-weight="600" fill="#475569">Fires when</text>
  <text x="70" y="210" font-size="20" fill="#0F172A">A read finds replicas that</text>
  <text x="70" y="236" font-size="20" fill="#0F172A">disagree.</text>
  <text x="70" y="286" font-size="20" font-weight="600" fill="#475569">What it does</text>
  <text x="70" y="316" font-size="20" fill="#0F172A">Returns the newest value and</text>
  <text x="70" y="342" font-size="20" fill="#0F172A">writes it back to the stale one.</text>
  <text x="70" y="392" font-size="20" font-weight="600" fill="#475569">Blind spot</text>
  <text x="70" y="422" font-size="20" fill="#B91C1C">Only fixes data somebody</text>
  <text x="70" y="448" font-size="20" fill="#B91C1C">actually reads.</text>

  
  <rect x="440" y="88" width="360" height="402" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M440 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FFFBEB"/>
  <text x="620" y="122" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Hinted handoff</text>
  <text x="460" y="180" font-size="20" font-weight="600" fill="#475569">Fires when</text>
  <text x="460" y="210" font-size="20" fill="#0F172A">A write targets a node that</text>
  <text x="460" y="236" font-size="20" fill="#0F172A">is currently down.</text>
  <text x="460" y="286" font-size="20" font-weight="600" fill="#475569">What it does</text>
  <text x="460" y="316" font-size="20" fill="#0F172A">A peer stores the write as a</text>
  <text x="460" y="342" font-size="20" fill="#0F172A">hint and replays it on return.</text>
  <text x="460" y="392" font-size="20" font-weight="600" fill="#475569">Blind spot</text>
  <text x="460" y="422" font-size="20" fill="#B91C1C">Hints expire, and the peer</text>
  <text x="460" y="448" font-size="20" fill="#B91C1C">can fail while holding them.</text>

  
  <rect x="830" y="88" width="360" height="402" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M830 100 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#F5F3FF"/>
  <text x="1010" y="122" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Anti-entropy</text>
  <text x="850" y="180" font-size="20" font-weight="600" fill="#475569">Fires when</text>
  <text x="850" y="210" font-size="20" fill="#0F172A">On a schedule, in the</text>
  <text x="850" y="236" font-size="20" fill="#0F172A">background.</text>
  <text x="850" y="286" font-size="20" font-weight="600" fill="#475569">What it does</text>
  <text x="850" y="316" font-size="20" fill="#0F172A">Compares Merkle trees between</text>
  <text x="850" y="342" font-size="20" fill="#0F172A">replicas and syncs differences.</text>
  <text x="850" y="392" font-size="20" font-weight="600" fill="#475569">Blind spot</text>
  <text x="850" y="422" font-size="20" fill="#B91C1C">Costs CPU and network, so it</text>
  <text x="850" y="448" font-size="20" fill="#B91C1C">runs infrequently.</text>

  
  <rect x="50" y="546" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="582" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read repair fixes what is read, hinted handoff fixes what was written during a blip, anti-entropy fixes the rest.</text>
  <text x="620" y="612" font-size="20" fill="#334155" text-anchor="middle">Eventual consistency is not automatic. These three are the machinery that makes it eventual.</text>
</svg>