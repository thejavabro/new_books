<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Inside the Netflix offline path: the Kafka event stream and the nightly batch pipeline feed four consumers, event processing, trending, nearline processing and item similarity, and all four write into the recommendation data store the serving path reads">
  <defs>
    <filter id="nfx2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nfx2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nfx2-k1"><rect x="180" y="170" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="nfx2-k2"><rect x="680" y="170" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="nfx2-k3"><rect x="64" y="490" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nfx2-k4"><rect x="351" y="490" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nfx2-k5"><rect x="638" y="490" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nfx2-k6"><rect x="925" y="490" width="250" height="90" rx="12"/></clipPath>
    <marker id="nfx2-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1180" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Netflix recommendations: inside the offline path</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The detail the high level design leaves out. Two sources feed four consumers that run at four different speeds, and all four write the same store.</text>

  <rect x="40" y="430" width="1160" height="256" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="460" font-size="19.5" font-weight="600" fill="#5B21B6">Four consumers, four different latencies</text>

  <g fill="none" stroke-width="2">
    <path d="M370,306 V424" stroke="#7C3AED" marker-end="url(#nfx2-m-violet)"/>
    <path d="M870,306 V424" stroke="#7C3AED" marker-end="url(#nfx2-m-violet)"/>
    <path d="M620,686 V794" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#nfx2-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="460" y="386" fill="#5B21B6">consume</text>
    <text x="960" y="386" fill="#5B21B6">consume</text>
    <text x="760" y="748" fill="#5B21B6">all four write here</text>
  </g>

  <g filter="url(#nfx2-soft)">
    <rect x="180" y="170" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="180" y="170" width="6" height="90" fill="#7C3AED" clip-path="url(#nfx2-k1)"/>
  </g>
  <circle cx="218" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,204.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="244" y="222" font-size="21.5" font-weight="600" fill="#111827">Event stream</text>
  <text x="370" y="289" font-size="18.5" text-anchor="middle" fill="#6B7280">Kafka, every play and pause</text>
  <g filter="url(#nfx2-soft)">
    <rect x="680" y="170" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="680" y="170" width="6" height="90" fill="#7C3AED" clip-path="url(#nfx2-k2)"/>
  </g>
  <circle cx="718" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,204.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="744" y="222" font-size="21.5" font-weight="600" fill="#111827">Batch pipeline</text>
  <text x="870" y="289" font-size="18.5" text-anchor="middle" fill="#6B7280">Spark and ML, nightly</text>
  <g filter="url(#nfx2-soft)">
    <rect x="64" y="490" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="490" width="6" height="90" fill="#2563EB" clip-path="url(#nfx2-k3)"/>
  </g>
  <circle cx="102" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,524.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="128" y="542" font-size="21.5" font-weight="600" fill="#111827">Event processing</text>
  <text x="189" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">seconds behind</text>
  <g filter="url(#nfx2-soft)">
    <rect x="351" y="490" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="351" y="490" width="6" height="90" fill="#D97706" clip-path="url(#nfx2-k4)"/>
  </g>
  <circle cx="389" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(378.56,524.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="415" y="542" font-size="21.5" font-weight="600" fill="#111827">Trending</text>
  <text x="476" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">what is hot now</text>
  <g filter="url(#nfx2-soft)">
    <rect x="638" y="490" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="638" y="490" width="6" height="90" fill="#059669" clip-path="url(#nfx2-k5)"/>
  </g>
  <circle cx="676" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(665.56,524.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="702" y="542" font-size="21.5" font-weight="600" fill="#111827">Nearline</text>
  <text x="763" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">minutes behind</text>
  <g filter="url(#nfx2-soft)">
    <rect x="925" y="490" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="925" y="490" width="6" height="90" fill="#4F46E5" clip-path="url(#nfx2-k6)"/>
  </g>
  <circle cx="963" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(952.56,524.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="989" y="542" font-size="21.5" font-weight="600" fill="#111827">Item similarity</text>
  <text x="1050" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">what is like what</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M420,800 L420,874 A200,16 0 0 0 820,874 L820,800" fill="#EDE9FE"/>
    <ellipse cx="620" cy="800" rx="200" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="620" y="852" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Recommendation store</text>
  <text x="620" y="924" font-size="18.5" text-anchor="middle" fill="#6B7280">one precomputed row set per user</text>
  <text x="620" y="951" font-size="18.5" text-anchor="middle" fill="#94A3B8">read directly by the serving path</text>

  <rect x="40" y="1000" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1025" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1050" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">One store, four writers</text>
  <text x="323" y="1050" font-size="18.5" fill="#475569">the serving path reads one place, and never has to know which job filled it</text>
  <rect x="64" y="1075" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1100" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Latency is the axis</text>
  <text x="323" y="1100" font-size="18.5" fill="#475569">trending in seconds, similarity overnight, and the reader cannot tell the difference</text>
</svg>