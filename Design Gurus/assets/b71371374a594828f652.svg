    <rect x="470" y="452" width="6" height="90" fill="#D97706" clip-path="url(#c6tfm-k5)"/>
  </g>
  <circle cx="508" cy="497" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,486.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="470" y="440" font-size="15.5" font-weight="600" fill="#6B7280">with headroom and a warm pool</text>
  <text x="534" y="504" font-size="18.5" font-weight="600" fill="#111827">Real fleet</text>
  <text x="620" y="567" font-size="15.5" text-anchor="middle" fill="#6B7280">about 400 to 450 GPUs on average</text>
  <g filter="url(#c6tfm-soft)">
    <rect x="890" y="452" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
