  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Size: from images to busy GPUs</text>
  <rect x="40" y="372" width="1160" height="264" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="402" font-size="16.5" font-weight="600" fill="#B45309">Step 4: price at $2 to $4 per GPU-hour</text>
