  <text x="950" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 3</text>
  <text x="1014" y="188" font-size="18.5" font-weight="600" fill="#111827">The peak</text>
  <text x="1060" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 500 busy GPUs, or more</text>
