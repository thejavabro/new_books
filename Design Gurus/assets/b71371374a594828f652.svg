  </g>
  <circle cx="928" cy="497" r="18" fill="#FFFFFF"/>
  <g transform="translate(917.56,486.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="954" y="492.5" font-size="18.5" font-weight="600" fill="#111827">Roughly $20,000</text>
  <text x="954" y="515.5" font-size="18.5" font-weight="600" fill="#111827">to $45,000 a day</text>
  <text x="1030" y="567" font-size="15.5" text-anchor="middle" fill="#6B7280">for the fleet you pay for</text>
