<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="792" viewBox="0 0 1240 792" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="2 million images a day is about 23 per second, rounded to 25; at 10 GPU-seconds each, about 250 GPUs are busy on average and about 500 or more at peak. At $2 to $4 per GPU-hour, 250 fully busy GPUs would cost $12,000 to $24,000 a day; the real fleet of about 400 to 450 GPUs on average costs roughly $20,000 to $45,000 a day. Every idle GPU-second is money spent for nothing.">
