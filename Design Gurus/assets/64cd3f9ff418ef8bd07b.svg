<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The heights and their counts">
<defs>
<filter id="hc-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many students in [10, 6, 8, 5, 9] are out of order?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Comparing against the sorted order, without ever running a sort</text>
<rect x="40" y="106" width="1160" height="366" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One count per distinct height, and the counts are already in order</text>
<text x="330" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">as they stand</text>
<rect x="352" y="160" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="400" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="400" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="462" y="160" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="510" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="510" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="572" y="160" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<text x="620" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="682" y="160" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="730" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="730" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="792" y="160" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="840" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<text x="840" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<text x="330" y="302" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">counts</text>
<rect x="352" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="400" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="400" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1 left</text>
<rect x="462" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="510" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="510" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1 left</text>
<rect x="572" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<text x="620" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1 left</text>
<rect x="682" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="730" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<text x="730" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1 left</text>
<rect x="792" y="264" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="840" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="840" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1 left</text>
<text x="330" y="406" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">should be</text>
<rect x="352" y="368" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="400" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="462" y="368" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="510" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="572" y="368" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="682" y="368" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="730" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="792" y="368" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="840" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="40" y="490" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="530" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Counting each height puts them in order for free, because the height IS the position</text>
<text x="620" y="562" text-anchor="middle" font-size="18.5" fill="#475569">Walking the counts from smallest upward produces the sorted order one value at a time</text>
</svg>