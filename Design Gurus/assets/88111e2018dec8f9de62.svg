<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The web crawler data model: the URL frontier queue on disk, the URL checksum store, the document checksum store, and the datastore holding downloaded pages">
<defs>
<filter id="wc1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="wc1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="wc1-mbl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="wc1-mind" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="wc1-mvio" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<clipPath id="wc1-k1"><rect x="70" y="50" width="470" height="178" rx="12"/></clipPath>
<clipPath id="wc1-k2"><rect x="760" y="50" width="400" height="178" rx="12"/></clipPath>
<clipPath id="wc1-k3"><rect x="760" y="360" width="400" height="178" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
<path d="M 540,124 H 757" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#wc1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="88" fill="#4338CA">every queued URL has</text><text x="650" y="110" fill="#4338CA">its checksum here</text></g><path d="M 305,228 V 381" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#wc1-mbl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="305" y="295" fill="#1D4ED8">downloads to at most</text><text x="305" y="317" fill="#1D4ED8">one stored page</text></g><path d="M 433,434 H 757" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#wc1-mvio)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="595" y="398" fill="#5B21B6">one checksum per distinct page</text><text x="595" y="420" fill="#5B21B6">many URLs can lead to one page</text></g><g filter="url(#wc1-lift)">
<rect x="70" y="50" width="470" height="178" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="70" y="50" width="9" height="178" fill="#2563EB" clip-path="url(#wc1-k1)"/>
</g>
<circle cx="108" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,67.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="134" y="85" font-size="18.5" font-weight="600" fill="#111827">URL frontier (the waiting list)</text><text x="94" y="131" font-size="15.5" fill="#111827">URL</text><text x="516" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">plain text, hundreds of bytes</text><line x1="84" y1="142" x2="526" y2="142" stroke="#93C5FD" stroke-width="1"/><text x="94" y="167" font-size="15.5" fill="#111827">(order)</text><text x="516" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">first in, first out</text><line x1="84" y1="178" x2="526" y2="178" stroke="#93C5FD" stroke-width="1"/><text x="94" y="203" font-size="15.5" fill="#111827">(size)</text><text x="516" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">hundreds of millions, on disk</text><g filter="url(#wc1-soft)">
<rect x="760" y="50" width="400" height="178" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="760" y="50" width="6" height="178" fill="#4F46E5" clip-path="url(#wc1-k2)"/>
</g>
<circle cx="798" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,67.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
<text x="824" y="85" font-size="18.5" font-weight="600" fill="#111827">URL store (URLs already seen)</text><text x="784" y="131" font-size="15.5" fill="#111827">URLChecksum</text><text x="1136" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes, the key</text><line x1="774" y1="142" x2="1146" y2="142" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="167" font-size="15.5" fill="#111827">(one entry per URL seen)</text><text x="1136" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">120 GB total</text><line x1="774" y1="178" x2="1146" y2="178" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="203" font-size="15.5" fill="#111827">(where)</text><text x="1136" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">database + memory cache</text><g filter="url(#wc1-soft)">
<rect x="760" y="360" width="400" height="178" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="760" y="360" width="6" height="178" fill="#7C3AED" clip-path="url(#wc1-k3)"/>
</g>
<circle cx="798" cy="388" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,377.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
<text x="824" y="395" font-size="18.5" font-weight="600" fill="#111827">Document checksum store</text><text x="784" y="441" font-size="15.5" fill="#111827">DocChecksum</text><text x="1136" y="441" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes (64 bits), the key</text><line x1="774" y1="452" x2="1146" y2="452" stroke="#C4B5FD" stroke-width="1"/><text x="784" y="477" font-size="15.5" fill="#111827">(one entry per distinct page)</text><text x="1136" y="477" font-size="15.5" text-anchor="end" fill="#6B7280">120 GB total</text><line x1="774" y1="488" x2="1146" y2="488" stroke="#C4B5FD" stroke-width="1"/><text x="784" y="513" font-size="15.5" fill="#111827">(where)</text><text x="1136" y="513" font-size="15.5" text-anchor="end" fill="#6B7280">database; fits in memory</text><g stroke="#64748B" stroke-width="1.5">
<path d="M 130,400 L 130,494 A 150,16 0 0 0 430,494 L 430,400" fill="#E2E8F0"/>
<ellipse cx="280" cy="400" rx="150" ry="16" fill="#F8FAFC"/>
</g>
<text x="280" y="469" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Datastore</text><text x="280" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">one record per stored page: contents + metadata</text><text x="280" y="558" font-size="15.5" text-anchor="middle" fill="#94A3B8">100KB average page; 2.14 PB total from step 2</text><rect x="40" y="600" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="626" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="648" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Checksums, not URLs</text><text x="288" y="648" font-size="15.5" fill="#475569">a checksum is always 8 bytes, so 15 billion entries stay small and predictable</text><rect x="64" y="670" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/><text x="164" y="692" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Split by hostname</text><text x="288" y="692" font-size="15.5" fill="#475569">step 6 assigns each hostname to one server, which keeps all three small sets for its URLs</text>
</svg>