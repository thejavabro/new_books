<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="548" viewBox="0 0 1240 548" role="img" aria-label="Latency as ratios rather than values: memory is about a hundred thousand times faster than a disk seek, an SSD read is about a hundred times faster than a seek, and a round trip across an ocean is about 150 milliseconds no matter what you do.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="548" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="40" width="8" height="62" rx="4" fill="#059669"/>
  <text x="72" y="78" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Main memory read</text>
  <rect x="470" y="58" width="452" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="470" y="58" width="8" height="26" rx="7" fill="#059669" opacity="0.85"/>
  <text x="948" y="78" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">100 ns</text>
  <text x="1184" y="78" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">baseline</text>
  <rect x="40" y="114" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="114" width="8" height="62" rx="4" fill="#059669"/>
  <text x="72" y="152" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">SSD read, 4 KB</text>
  <rect x="470" y="132" width="452" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="470" y="132" width="232" height="26" rx="7" fill="#059669" opacity="0.85"/>
  <text x="948" y="152" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">150 µs</text>
  <text x="1184" y="152" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1.5K times</text>
  <rect x="40" y="188" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <rect x="40" y="188" width="8" height="62" rx="4" fill="#D97706"/>
  <text x="72" y="226" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Round trip in a data centre</text>
  <rect x="470" y="206" width="452" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="470" y="206" width="271" height="26" rx="7" fill="#D97706" opacity="0.85"/>
  <text x="948" y="226" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">500 µs</text>
  <text x="1184" y="226" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">5K times</text>
  <rect x="40" y="262" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <rect x="40" y="262" width="8" height="62" rx="4" fill="#D97706"/>
  <text x="72" y="300" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Disk seek</text>
  <rect x="470" y="280" width="452" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="470" y="280" width="366" height="26" rx="7" fill="#D97706" opacity="0.85"/>
  <text x="948" y="300" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">10 ms</text>
  <text x="1184" y="300" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">100K times</text>
  <rect x="40" y="336" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="40" y="336" width="8" height="62" rx="4" fill="#DC2626"/>
  <text x="72" y="374" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Round trip across an ocean</text>
  <rect x="470" y="354" width="452" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="470" y="354" width="452" height="26" rx="7" fill="#DC2626" opacity="0.85"/>
  <text x="948" y="374" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">150 ms</text>
  <text x="1184" y="374" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1.5M times</text>
  <rect x="40" y="430" width="1160" height="46" rx="10" fill="none" stroke="none" stroke-width="1.5"/>
  <text x="620" y="464" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The bars are logarithmic. Each step is a different order of magnitude, which is the only thing worth remembering.</text>
  <rect x="40" y="486" width="1160" height="46" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="516" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Memory beats a disk seek by about a hundred thousand times. That gap is why caching exists.</text>
</svg>