<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every index jumps by the value it holds">
<defs>
<filter id="fx-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Every index jumps by the value it holds</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">each value says how far to jump, and the array wraps around</text>
<rect x="40" y="100" width="1160" height="300" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="130" font-size="19.5" font-weight="600" fill="#475569">the array, and where each index jumps to</text>
<rect x="298" y="138" width="92" height="56" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="344" y="173.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="344" y="216" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="436" y="138" width="92" height="56" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="482" y="173.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="482" y="216" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="574" y="138" width="92" height="56" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="620" y="173.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-1</text>
<text x="620" y="216" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="712" y="138" width="92" height="56" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="758" y="173.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="758" y="216" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="850" y="138" width="92" height="56" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="896" y="173.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="896" y="216" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<path d="M335,260 L353,260 L344,246 Z" fill="#D97706"/>
<text x="344" y="284" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">start</text>
<rect x="40" y="420" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="450" font-size="19.5" font-weight="600" fill="#475569">the indices visited</text>
<rect x="110" y="468" width="68" height="52" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="144" y="501.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="40" y="560" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="600" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">all jumps must go the same way</text>
<text x="620" y="632" text-anchor="middle" font-size="18.5" fill="#475569">a cycle that mixes forward and backward jumps does not count, and neither does one of length 1</text>
</svg>