  <text x="394" y="812" font-size="18.5" fill="#374151">Hybrid kernel, not a microkernel. Device drivers, file systems</text>
  <text x="394" y="838" font-size="18.5" fill="#374151">and network services load as modules that run in kernel mode.</text>
  <text x="394" y="908" font-size="18.5" fill="#374151">True microkernel. A real-time operating system used in cars,</text>
  <text x="394" y="934" font-size="18.5" fill="#374151">industrial systems, and embedded devices.</text>
  <text x="394" y="1004" font-size="18.5" fill="#374151">Hybrid kernel built around the Mach microkernel.</text>
  <text x="394" y="1030" font-size="18.5" fill="#374151">Loadable kernel extensions run inside the kernel.</text>
  <text x="394" y="1100" font-size="18.5" fill="#374151">Not a kernel. A multi-process browser with separate processes</text>
  <text x="394" y="1126" font-size="18.5" fill="#374151">for rendering and networking, and extensions as plugins.</text>




