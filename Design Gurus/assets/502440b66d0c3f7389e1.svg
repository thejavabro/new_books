<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1210" viewBox="0 0 1240 1210" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Top: file system, network stack, device driver and user interface servers run as separate user-space processes and send IPC messages to the microkernel core, which runs on the hardware: CPU, memory, storage and network. Bottom: Windows NT is a hybrid kernel, not a microkernel, whose drivers and file systems load as modules in kernel mode; QNX is a true microkernel used as a real-time operating system in cars, industrial systems and embedded devices; macOS XNU is a hybrid kernel built around the Mach microkernel, whose loadable kernel extensions run inside the kernel; Chrome is a multi-process browser, not a kernel, that runs extensions as plugins">
