<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1520" viewBox="0 0 1240 1520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The life of one money movement: intent moves to pending when the provider is called with the key; a timeout or missing webhook moves it to unknown, and a status query answer moves it back to pending; pending moves to held when authorized, to posted when no hold is needed, or to failed when the provider declines; held moves to posted on capture or to expired when the hold deadline passes; posted moves to settled when matched in the settlement file, and settled can move to reversed when a chargeback is appended later.">
  <defs>
    <marker id="m07-l06-payment-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l06-payment-states-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l06-payment-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l06-payment-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l06-payment-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1520" fill="#FFFFFF"/>

  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="60" y="60" width="340" height="200" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="230" y="87" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Nothing moves before</text>
  <text x="230" y="119" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">it is written</text>
  <text x="230" y="151" text-anchor="middle" font-size="20" fill="#475569">The intent row and its key</text>
  <text x="230" y="183" text-anchor="middle" font-size="20" fill="#475569">commit before the call goes</text>
  <text x="230" y="215" text-anchor="middle" font-size="20" fill="#475569">out, so a crash still leaves a</text>
  <text x="230" y="247" text-anchor="middle" font-size="20" fill="#475569">row the sweeper can resolve.</text>

  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="60" y="350" width="260" height="130" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="190" y="406" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">intent</text>
  <text x="190" y="438" text-anchor="middle" font-size="20" fill="#64748B">written first</text>
  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="400" y="350" width="300" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="550" y="406" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">pending</text>
  <text x="550" y="438" text-anchor="middle" font-size="20" fill="#64748B">the call is out</text>
  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="780" y="350" width="300" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="930" y="406" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">unknown</text>
  <text x="930" y="438" text-anchor="middle" font-size="20" fill="#64748B">nobody knows yet</text>
  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="60" y="600" width="280" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="200" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">failed</text>
  <text x="200" y="688" text-anchor="middle" font-size="20" fill="#64748B">no money moved</text>
  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="400" y="600" width="300" height="130" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="550" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">held</text>
  <text x="550" y="688" text-anchor="middle" font-size="20" fill="#64748B">funds are reserved</text>
  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="780" y="600" width="300" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="930" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">expired</text>
  <text x="930" y="688" text-anchor="middle" font-size="20" fill="#64748B">the hold lapsed</text>
  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="400" y="850" width="300" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="550" y="906" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">posted</text>
  <text x="550" y="938" text-anchor="middle" font-size="20" fill="#64748B">entries appended</text>
  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="780" y="850" width="300" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="930" y="906" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">settled</text>
  <text x="930" y="938" text-anchor="middle" font-size="20" fill="#64748B">matched to the file</text>
  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="780" y="1100" width="300" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="930" y="1156" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">reversed</text>
  <text x="930" y="1188" text-anchor="middle" font-size="20" fill="#64748B">a later chargeback</text>

  <g fill="none" stroke-width="2.5">
    <path d="M190,300 L190,342" stroke="#475569" stroke-width="2" marker-end="url(#m07-l06-payment-states-sl)"/>
    <path d="M320,415 L392,415" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payment-states-bl)"/>
    <path d="M700,390 L772,390" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l06-payment-states-rd)"/>
    <path d="M780,445 L708,445" stroke="#059669" stroke-width="2" marker-end="url(#m07-l06-payment-states-em)"/>
    <path d="M550,480 L550,592" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payment-states-bl)"/>
    <path d="M430,480 C400,520 220,545 200,592" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l06-payment-states-rd)"/>
    <path d="M700,665 L772,665" stroke="#475569" stroke-width="2" marker-end="url(#m07-l06-payment-states-sl)"/>
    <path d="M660,480 L740,530 L740,800 L620,800 L620,842" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l06-payment-states-bl)"/>
    <path d="M550,730 L550,842" stroke="#059669" marker-end="url(#m07-l06-payment-states-em)"/>
    <path d="M700,915 L772,915" stroke="#059669" marker-end="url(#m07-l06-payment-states-em)"/>
    <path d="M930,980 L930,1092" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l06-payment-states-rd)"/>
  </g>

  <circle cx="190" cy="290" r="12" fill="#475569"/>

  <text x="356" y="325" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">called with the key</text>
  <text x="736" y="300" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a timeout, or no webhook</text>
  <text x="736" y="332" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the status query answers</text>
  <text x="570" y="520" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">authorized, funds reserved</text>
  <text x="736" y="570" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the hold deadline passes</text>
  <text x="240" y="552" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the provider declines</text>
  <text x="735" y="760" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no hold needed</text>
  <text x="560" y="790" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">captured</text>
  <text x="736" y="825" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">matched in settlement</text>
  <text x="950" y="1040" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a chargeback, weeks later</text>

  <g filter="url(#m07-l06-payment-states-soft)">
    <rect x="60" y="1100" width="650" height="190" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="385" y="1154" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Unknown is a state with an owner</text>
  <text x="385" y="1186" text-anchor="middle" font-size="20" fill="#475569">A sweeper scans every movement still pending past its</text>
  <text x="385" y="1218" text-anchor="middle" font-size="20" fill="#475569">deadline and resolves it with a status query. Total value</text>
  <text x="385" y="1250" text-anchor="middle" font-size="20" fill="#475569">in flight is a number on a dashboard, not an incident.</text>

  <line x1="60" y1="1360" x2="96" y2="1360" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1367" font-size="20" fill="#475569">The legal forward transition</text>
  <line x1="60" y1="1400" x2="96" y2="1400" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1407" font-size="20" fill="#475569">A timeout or a decline: the money is in doubt</text>
  <line x1="60" y1="1440" x2="96" y2="1440" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1447" font-size="20" fill="#475569">Recovery, and a confirmed outcome</text>
  <line x1="60" y1="1480" x2="96" y2="1480" stroke="#475569" stroke-width="4"/>
  <text x="108" y="1487" font-size="20" fill="#475569">The hold lapses, with no money moved</text>
</svg>