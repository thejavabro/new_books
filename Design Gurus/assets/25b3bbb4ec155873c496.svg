<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" role="img" aria-label="The data model. The URL table is keyed by the short key and holds the original URL, timestamps, the owner and a visibility flag. The User table holds account records. Click events go to a separate analytics store, never as a counter column on the URL row.">
