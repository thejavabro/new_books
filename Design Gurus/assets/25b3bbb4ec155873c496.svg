  <rect x="640" y="480" width="460" height="178" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="880" y="518" font-size="21" font-weight="700" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Why clicks are not a column</text>
  <text x="880" y="556" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A viral link would turn one row</text>
  <text x="880" y="583" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">into a write hotspot.</text>
  <text x="880" y="610" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Every redirect would wait on</text>
  <text x="880" y="637" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a database update.</text>
