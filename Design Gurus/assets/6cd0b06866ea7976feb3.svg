<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="644" viewBox="0 0 1240 644" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two strings before counting starts">
<defs>
<filter id="an-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="644" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Is "silent" an anagram of "listen"?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The lengths match, so one pass can settle it: add for every letter of s, subtract for every letter of t</text>
<rect x="40" y="106" width="1160" height="262" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One loop reads both strings at the same index</text>
<text x="384" y="212" text-anchor="end" font-size="18.5" font-weight="600" fill="#047857">s</text>
<rect x="402" y="176" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="435" y="212.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">l</text>
<rect x="476" y="176" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="509" y="212.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">i</text>
<rect x="550" y="176" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="583" y="212.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">s</text>
<rect x="624" y="176" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="657" y="212.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">t</text>
<rect x="698" y="176" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="731" y="212.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">e</text>
<rect x="772" y="176" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="805" y="212.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">n</text>
<text x="384" y="294" text-anchor="end" font-size="18.5" font-weight="600" fill="#BE185D">t</text>
<rect x="402" y="258" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="435" y="294.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">s</text>
<text x="435" y="338" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="476" y="258" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="509" y="294.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">i</text>
<text x="509" y="338" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="550" y="258" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="583" y="294.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">l</text>
<text x="583" y="338" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="624" y="258" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="657" y="294.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">e</text>
<text x="657" y="338" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="698" y="258" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="731" y="294.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">n</text>
<text x="731" y="338" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="772" y="258" width="66" height="58" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="805" y="294.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">t</text>
<text x="805" y="338" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<text x="620" y="392" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">running tally: one count per letter, plus one for s, minus one for t</text>
<text x="620" y="458" text-anchor="middle" font-size="19" fill="#94A3B8">empty</text>
<rect x="40" y="514" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="554" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The tally starts empty</text>
<text x="620" y="586" text-anchor="middle" font-size="18.5" fill="#475569">If the two strings use exactly the same letters, every count must end at zero</text>
</svg>