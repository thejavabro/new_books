<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of passing a final assessment. 1, the browser submits the final answers to the API application. 2, in one transaction the API stores the passed attempt, a pending certificate and a render job in PostgreSQL. 3, the API answers that the learner passed, in about 150 ms. 4, the worker claims the render job. 5, the worker renders the PDF in about 3 seconds. 6, the worker stores the PDF in object storage. 7, the worker marks the certificate ready and adds an email job. 8, the worker claims the email job. 9, the worker sends the certificate email through the email service. 10, the browser downloads the PDF from object storage through the signed link that the API returned.">
