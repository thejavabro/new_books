  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="218" y="251" fill="#1D4ED8">1. submit final answers</text>
    <text x="414" y="296" fill="#1D4ED8">2. one transaction:</text>
    <text x="414" y="319" fill="#1D4ED8">attempt, certificate, job</text>
    <text x="218" y="387" fill="#1D4ED8">3. passed, 150 ms</text>
    <text x="610" y="455" fill="#B45309">4. claim render job</text>
    <text x="770" y="542" fill="#B45309" text-anchor="start">5. render PDF, about 3 s</text>
    <text x="806" y="591" fill="#B45309">6. store PDF</text>
    <text x="610" y="659" fill="#B45309">7. ready, email job</text>
    <text x="610" y="727" fill="#B45309">8. claim email job</text>
    <text x="904" y="795" fill="#B45309">9. send certificate email</text>
    <text x="512" y="863" fill="#1D4ED8">10. download PDF, signed link</text>
  </g>

