<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A timeline from 0 to 12 seconds with three lanes. The Place Order request inserts the order in 40 ms and then waits on the provider. The Customer app shows a spinner. At 10 seconds our timeout fires, the order is rolled back and the app shows an error. The provider keeps processing and completes the charge at 11.3 seconds, so the customer is charged for an order that no longer exists.">
  <defs>
    <filter id="md01a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md01a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md01a-k1"><rect x="40" y="180" width="350" height="56" rx="12"/></clipPath>
    <clipPath id="md01a-k2"><rect x="40" y="270" width="350" height="56" rx="12"/></clipPath>
    <clipPath id="md01a-k3"><rect x="40" y="360" width="350" height="56" rx="12"/></clipPath>
    <clipPath id="md01a-k4"><rect x="220" y="540" width="800" height="70" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The trace of an order charged without being saved</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One failed order from the 22-minute slow period, with the provider's record of the same charge.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#md01a-soft)">
    <rect x="40" y="180" width="350" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="180" width="6" height="56" fill="#2563EB" clip-path="url(#md01a-k1)"/>
  </g>
  <circle cx="78" cy="208" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,197.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="104" y="215" font-size="18.5" font-weight="600" fill="#111827">Place Order request</text>
  <g filter="url(#md01a-soft)">
    <rect x="40" y="270" width="350" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="270" width="6" height="56" fill="#64748B" clip-path="url(#md01a-k2)"/>
  </g>
  <circle cx="78" cy="298" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,287.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="305" font-size="18.5" font-weight="600" fill="#111827">Customer app</text>
  <g filter="url(#md01a-soft)">
    <rect x="40" y="360" width="350" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="40" y="360" width="6" height="56" fill="#4F46E5" clip-path="url(#md01a-k3)"/>
  </g>
  <circle cx="78" cy="388" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,377.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="104" y="395" font-size="18.5" font-weight="600" fill="#111827">Payment provider</text>
  <g filter="url(#md01a-lift)">
    <rect x="220" y="540" width="800" height="70" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="220" y="540" width="9" height="70" fill="#DB2777" clip-path="url(#md01a-k4)"/>
  </g>
  <circle cx="258" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(247.56,564.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/></g>
  <text x="284" y="582" font-size="21.5" font-weight="600" fill="#111827">Result: the customer is charged, but no order exists</text>
  <text x="420" y="156" font-size="17" text-anchor="middle" fill="#6B7280">0 s</text>
  <text x="546.7" y="156" font-size="17" text-anchor="middle" fill="#6B7280">2 s</text>
  <text x="673.3" y="156" font-size="17" text-anchor="middle" fill="#6B7280">4 s</text>
  <text x="800" y="156" font-size="17" text-anchor="middle" fill="#6B7280">6 s</text>
  <text x="926.7" y="156" font-size="17" text-anchor="middle" fill="#6B7280">8 s</text>
  <text x="1053.3" y="156" font-size="17" text-anchor="middle" fill="#6B7280">10 s</text>
  <text x="1180" y="156" font-size="17" text-anchor="middle" fill="#6B7280">12 s</text>
  <text x="1041.3" y="462" font-size="18.5" font-weight="600" text-anchor="end" fill="#BE185D">10 s: our timeout fires and the order is rolled back</text>
  <text x="1123.7" y="498" font-size="18.5" font-weight="600" text-anchor="end" fill="#047857">11.3 s: the provider completes the charge</text>

  <line x1="420" y1="166" x2="420" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="546.7" y1="166" x2="546.7" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="673.3" y1="166" x2="673.3" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="800" y1="166" x2="800" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="926.7" y1="166" x2="926.7" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1053.3" y1="166" x2="1053.3" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1180" y1="166" x2="1180" y2="430" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="420" y="194" width="2.5" height="28" rx="4" fill="#2563EB"/>
  <rect x="422.5" y="194" width="630.8" height="28" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="436.5" y="214" font-size="18.5" font-weight="600" fill="#1D4ED8">Insert order (40 ms), then wait on the provider</text>
  <rect x="420" y="284" width="633.3" height="28" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="434" y="304" font-size="18.5" font-weight="600" fill="#475569">Spinner</text>
  <rect x="1053.3" y="284" width="126.7" height="28" rx="4" fill="#DB2777"/>
  <text x="1067.3" y="304" font-size="18.5" font-weight="600" fill="#FFFFFF">Error</text>
  <rect x="422.5" y="374" width="713.2" height="28" rx="4" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="436.5" y="394" font-size="18.5" font-weight="600" fill="#4338CA">Processing the charge</text>
  <rect x="1135.7" y="374" width="44.3" height="28" rx="4" fill="#059669"/>
  <line x1="1053.3" y1="170" x2="1053.3" y2="440" stroke="#DB2777" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="1135.7" y1="364" x2="1135.7" y2="478" stroke="#059669" stroke-width="2" stroke-dasharray="7 6"/>


</svg>