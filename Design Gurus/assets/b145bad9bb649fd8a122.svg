<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="732" viewBox="0 0 1240 732" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="roles-title roles-desc">
<title id="roles-title">Coordination is the bottleneck</title>
<desc id="roles-desc">Six competent engineers all investigating with nobody deciding is slower than two with defined roles. The commander deciding rather than debugging is the counterintuitive part.</desc>
<defs>
<marker id="roles-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="roles-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="roles-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="roles-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="732" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Coordination is the bottleneck</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Six competent engineers all investigating with nobody deciding is slower than two with defined roles.</text>
<rect x="40" y="654" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="654" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="330" height="76" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="205" y="162" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Incident commander</text>
<rect x="380" y="118" width="330" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="400" y="162" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">decides, and does not debug</text>
<rect x="740" y="118" width="460" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="760" y="149.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the moment they start investigating,</text><text x="760" y="174.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">nobody is tracking the overall state</text>
<rect x="40" y="206" width="330" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="205" y="250" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Communications lead</text>
<rect x="380" y="206" width="330" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="400" y="237.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">updates everybody outside,</text><text x="400" y="262.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">at a fixed interval</text>
<rect x="740" y="206" width="460" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="760" y="237.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so the people fixing it are not</text><text x="760" y="262.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">also answering questions</text>
<rect x="40" y="294" width="330" height="76" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="205" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Operations and responders</text>
<rect x="380" y="294" width="330" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="400" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">make the changes</text>
<rect x="740" y="294" width="460" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="760" y="325.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and say what they are about to do</text><text x="760" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">before doing it</text>
<rect x="40" y="390" width="1160" height="112" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="390" width="5" height="112" rx="2.5" fill="#F28B9D"/><text x="64" y="426" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Changes are announced before they are made</text><text x="64" y="452" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Most incidents made worse by the response were made worse by two simultaneous</text><text x="64" y="478" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">uncoordinated fixes, where afterward nobody could say which caused what.</text>
<rect x="40" y="522" width="560" height="106" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="522" width="5" height="106" rx="2.5" fill="#39D5AA"/><text x="64" y="555" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A timestamped log, kept live</text><text x="64" y="581" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how the review gets facts instead</text><text x="64" y="607" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">of recollections</text>
<rect x="640" y="522" width="560" height="106" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="522" width="5" height="106" rx="2.5" fill="#5EC9EC"/><text x="664" y="555" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Severity levels answer one thing</text><text x="664" y="581" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">who gets woken and who gets told.</text><text x="664" y="607" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Beyond that it is classification</text>
<text x="66" y="688" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Nobody remembers the order afterward, which is why the log has to be kept during.</text>
</svg>