<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="484" viewBox="0 0 1240 484" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Availability written as a percentage, and the same number written as allowed downtime per year, per month and per day. 99 percent allows 3.65 days a year. 99.999 percent allows 5.3 minutes a year.">
  <rect x="0" y="0" width="1240" height="484" fill="#FFFFFF"/>
  <defs>
    <marker id="kd3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="kd3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="kd3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="kd3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="kd3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="kd3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="kd3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="kd3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same number, written as a percentage and as downtime</text>
  <text x="66" y="76" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">AVAILABILITY</text>
  <text x="370" y="76" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">DOWNTIME PER YEAR</text>
  <text x="670" y="76" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">PER MONTH</text>
  <text x="940" y="76" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">PER DAY</text>
  <path d="M40 88 H1200" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
  <g filter="url(#kd3-soft)"><rect x="40" y="100" width="1160" height="72" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <rect x="40" y="100" width="9" height="72" rx="4" fill="#DC2626"/>
  <text x="66" y="143" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99%</text>
  <text x="370" y="143" font-size="20" fill="#0F172A" text-anchor="start">3.65 days</text>
  <text x="670" y="143" font-size="20" fill="#0F172A" text-anchor="start">7.2 hours</text>
  <text x="940" y="143" font-size="20" fill="#0F172A" text-anchor="start">14.4 minutes</text>
  <g filter="url(#kd3-soft)"><rect x="40" y="184" width="1160" height="72" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <rect x="40" y="184" width="9" height="72" rx="4" fill="#D97706"/>
  <text x="66" y="227" font-size="22" font-weight="700" fill="#B45309" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99.9%</text>
  <text x="370" y="227" font-size="20" fill="#0F172A" text-anchor="start">8.8 hours</text>
  <text x="670" y="227" font-size="20" fill="#0F172A" text-anchor="start">43.8 minutes</text>
  <text x="940" y="227" font-size="20" fill="#0F172A" text-anchor="start">1.4 minutes</text>
  <g filter="url(#kd3-soft)"><rect x="40" y="268" width="1160" height="72" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <rect x="40" y="268" width="9" height="72" rx="4" fill="#059669"/>
  <text x="66" y="311" font-size="22" font-weight="700" fill="#065F46" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99.99%</text>
  <text x="370" y="311" font-size="20" fill="#0F172A" text-anchor="start">52.6 minutes</text>
  <text x="670" y="311" font-size="20" fill="#0F172A" text-anchor="start">4.4 minutes</text>
  <text x="940" y="311" font-size="20" fill="#0F172A" text-anchor="start">8.6 seconds</text>
  <g filter="url(#kd3-soft)"><rect x="40" y="352" width="1160" height="72" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <rect x="40" y="352" width="9" height="72" rx="4" fill="#0D9488"/>
  <text x="66" y="395" font-size="22" font-weight="700" fill="#0F766E" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99.999%</text>
  <text x="370" y="395" font-size="20" fill="#0F172A" text-anchor="start">5.3 minutes</text>
  <text x="670" y="395" font-size="20" fill="#0F172A" text-anchor="start">26 seconds</text>
  <text x="940" y="395" font-size="20" fill="#0F172A" text-anchor="start">0.9 seconds</text>
  <text x="620" y="466" font-size="20" fill="#64748B" text-anchor="middle">Every extra nine divides the downtime by ten.</text>
</svg>