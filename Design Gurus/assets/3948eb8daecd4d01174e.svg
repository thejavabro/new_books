<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three layers protect an irreversible agent operation: a dry run reports the effect without changing state, explicit confirmation prevents an omitted field from being read as consent, and a preview id ties that confirmation to the exact effect the caller reviewed.">
  <defs>
    <marker id="p24-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p24-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p24-k1"><rect x="410" y="100" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p24-k2"><rect x="410" y="290" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p24-k3"><rect x="410" y="480" width="420" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="796" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="610" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Three layers before an irreversible change</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">three layers, in order</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,250 V290" marker-end="url(#p24-sl)"/>
    <path d="M620,440 V480" marker-end="url(#p24-sl)"/>
  </g>

  
  <g filter="url(#p24-soft)">
    <rect x="410" y="100" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="410" y="100" width="6" height="90" fill="#D97706" clip-path="url(#p24-k1)"/>
  </g>
  <circle cx="448" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(437.56,134.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="474" y="152" font-size="18.5" font-weight="600" fill="#111827">1. Dry run</text>
  <text x="620" y="215" text-anchor="middle" font-size="15.5" fill="#6B7280">Reports the effect, and whether it is allowed.</text>
  <text x="620" y="238" text-anchor="middle" font-size="15.5" fill="#94A3B8">Changes no state at all.</text>

  
  <g filter="url(#p24-soft)">
    <rect x="410" y="290" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="410" y="290" width="6" height="90" fill="#D97706" clip-path="url(#p24-k2)"/>
  </g>
  <circle cx="448" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(437.56,324.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="474" y="342" font-size="18.5" font-weight="600" fill="#111827">2. Explicit confirmation</text>
  <text x="620" y="405" text-anchor="middle" font-size="15.5" fill="#6B7280">An omitted field is never read as consent.</text>
  <text x="620" y="428" text-anchor="middle" font-size="15.5" fill="#94A3B8">The caller must send confirmed: true.</text>

  
  <g filter="url(#p24-soft)">
    <rect x="410" y="480" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="410" y="480" width="6" height="90" fill="#D97706" clip-path="url(#p24-k3)"/>
  </g>
  <circle cx="448" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(437.56,514.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="474" y="532" font-size="18.5" font-weight="600" fill="#111827">3. Preview identity</text>
  <text x="620" y="595" text-anchor="middle" font-size="15.5" fill="#6B7280">Ties confirmation to the exact reviewed effect.</text>
  <text x="620" y="618" text-anchor="middle" font-size="15.5" fill="#94A3B8">Checked for tenant, fingerprint, and expiry.</text>

  
  <rect x="40" y="684" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="729" text-anchor="middle" font-size="16" fill="#475569">A model inventing the boolean is not consent. The server checks that the preview is still current.</text>
</svg>