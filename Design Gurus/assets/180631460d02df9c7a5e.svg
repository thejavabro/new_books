<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="638" viewBox="0 0 1240 638" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="QUIC tracks each stream separately, so a lost packet stalls only the stream it belonged to while the other streams keep being delivered">
  <rect x="0" y="0" width="1240" height="638" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same lost packet, on QUIC instead of TCP</text>

  <line x1="620" y1="110" x2="620" y2="430" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="620" y="100" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">a packet is lost here</text>

  <text x="230" y="182" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="end">stream A</text>
  <rect x="260" y="150" width="150" height="56" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="420" y="150" width="150" height="56" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="670" y="150" width="150" height="56" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="830" y="150" width="150" height="56" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1000" y="186" font-size="20" font-weight="600" fill="#065F46">delivered</text>

  <text x="230" y="292" font-size="20" font-weight="600" fill="#92400E" text-anchor="end">stream B</text>
  <rect x="260" y="260" width="150" height="56" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="420" y="260" width="150" height="56" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="480" y1="276" x2="510" y2="300" stroke="#DC2626" stroke-width="3"/>
  <line x1="510" y1="276" x2="480" y2="300" stroke="#DC2626" stroke-width="3"/>
  <rect x="670" y="260" width="150" height="56" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="830" y="260" width="150" height="56" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1000" y="296" font-size="20" font-weight="600" fill="#B91C1C">waits</text>

  <text x="230" y="402" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="end">stream C</text>
  <rect x="260" y="370" width="150" height="56" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="420" y="370" width="150" height="56" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="670" y="370" width="150" height="56" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="830" y="370" width="150" height="56" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1000" y="406" font-size="20" font-weight="600" fill="#065F46">delivered</text>

  <rect x="50" y="466" width="1140" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="508" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Only stream B waits for the retransmit. A and C never find out it happened.</text>

  
  <rect x="50" y="556" width="1140" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="594" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">This is the reason HTTP/3 left TCP: independent streams need a transport that tracks them independently.</text>
</svg>