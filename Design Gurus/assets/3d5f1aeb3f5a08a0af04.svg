<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="718" viewBox="0 0 1240 718" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two replicas compare Merkle trees from the root down: the roots differ, the left subtree hashes match and are skipped, and the search narrows to the single key that is actually out of sync">
  <rect x="0" y="0" width="1240" height="718" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Finding the one key that differs without reading either data set</text>

  
  <rect x="50" y="100" width="560" height="330" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="330" y="134" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica A</text>

  <line x1="330" y1="208" x2="190" y2="260" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="330" y1="208" x2="470" y2="260" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="190" y1="308" x2="150" y2="360" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="190" y1="308" x2="270" y2="360" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="470" y1="308" x2="390" y2="360" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="470" y1="308" x2="510" y2="360" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="275" y="160" width="110" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="330" y="191" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">9f</text>
  <rect x="135" y="260" width="110" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="190" y="291" font-size="20" fill="#334155" text-anchor="middle">3c</text>
  <rect x="415" y="260" width="110" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="470" y="291" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">7e</text>
  <rect x="95" y="360" width="110" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="150" y="391" font-size="20" fill="#334155" text-anchor="middle">k1: a1</text>
  <rect x="215" y="360" width="110" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="270" y="391" font-size="20" fill="#334155" text-anchor="middle">k2: b2</text>
  <rect x="335" y="360" width="110" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="390" y="391" font-size="20" fill="#334155" text-anchor="middle">k3: c3</text>
  <rect x="455" y="360" width="110" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="510" y="391" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">k4: d4</text>

  
  <rect x="630" y="100" width="560" height="330" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="910" y="134" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica B</text>

  <line x1="910" y1="208" x2="770" y2="260" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="910" y1="208" x2="1050" y2="260" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="770" y1="308" x2="730" y2="360" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="770" y1="308" x2="850" y2="360" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="1050" y1="308" x2="970" y2="360" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="1050" y1="308" x2="1090" y2="360" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="855" y="160" width="110" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="910" y="191" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">2b</text>
  <rect x="715" y="260" width="110" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="770" y="291" font-size="20" fill="#334155" text-anchor="middle">3c</text>
  <rect x="995" y="260" width="110" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="1050" y="291" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">55</text>
  <rect x="675" y="360" width="110" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="730" y="391" font-size="20" fill="#334155" text-anchor="middle">k1: a1</text>
  <rect x="795" y="360" width="110" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="850" y="391" font-size="20" fill="#334155" text-anchor="middle">k2: b2</text>
  <rect x="915" y="360" width="110" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="970" y="391" font-size="20" fill="#334155" text-anchor="middle">k3: c3</text>
  <rect x="1035" y="360" width="110" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="1090" y="391" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">k4: f8</text>

  
  <rect x="50" y="450" width="1140" height="110" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="80" y="484" font-size="20" fill="#5B21B6">1.  The roots differ (9f against 2b), so something is out of sync.</text>
  <text x="80" y="514" font-size="20" fill="#5B21B6">2.  The left subtree hashes match (3c), so half the keys are skipped entirely.</text>
  <text x="80" y="544" font-size="20" font-weight="600" fill="#5B21B6">3.  The right subtree differs, and at the leaves only k4 is wrong.</text>

  
  <rect x="50" y="596" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="632" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The point is what never gets sent. Matching subtrees are skipped whole, so one bad key costs a few hashes.</text>
  <text x="620" y="662" font-size="20" fill="#334155" text-anchor="middle">That is what makes background repair affordable across a large data set.</text>
</svg>