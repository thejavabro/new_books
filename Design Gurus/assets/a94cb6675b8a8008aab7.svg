<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="684" viewBox="0 0 1240 684" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="proportion-title proportion-desc">
<title id="proportion-title">Two checks against over-engineering</title>
<desc id="proportion-desc">Ask what the smallest design meeting the requirements is, and what would have to be true for a given component to be necessary. A premature component can still be mentioned, as a trigger rather than a box.</desc>
<defs>
<marker id="proportion-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="proportion-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="proportion-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="proportion-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="684" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two checks against over-engineering</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Two checks make it visible, and both take seconds.</text>
<rect x="40" y="606" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="606" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V276A6 6 0 0 0 46 282H54Z" fill="#5EC9EC"/>
<circle cx="94" cy="172" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="94" y="180" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="128" y="164" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">What is the smallest design</text><text x="128" y="192" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">that meets the requirements?</text>
<text x="128" y="228" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Start there. Add only what a</text><text x="128" y="253" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stated requirement forces you to add.</text>
<rect x="640" y="118" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V276A6 6 0 0 0 646 282H654Z" fill="#39D5AA"/>
<circle cx="694" cy="172" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="694" y="180" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="728" y="164" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">What would have to be true</text><text x="728" y="192" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">for this component to be necessary?</text>
<text x="728" y="228" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">If the answer is a condition this</text><text x="728" y="253" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">problem does not meet, remove it.</text>
<text x="40" y="324" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The honest way to raise something premature</text>
<rect x="40" y="342" width="1160" height="118" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="342" width="5" height="118" rx="2.5" fill="#AC8BE8"/><text x="64" y="378" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">"I would not build this now. I would build it when writes pass this number,</text><text x="64" y="407" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">which at current growth is about a year away."</text><text x="64" y="436" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Shows you know the technique and know when it applies.</text>
<text x="40" y="502" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Both of the alternatives score worse</text>
<rect x="40" y="520" width="560" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="556" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Building it: a judgment failure</text>
<rect x="640" y="520" width="560" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="542.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Omitting it silently: cannot be told</text><text x="920" y="569.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">apart from not knowing it</text>
<text x="66" y="640" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Over-engineering is a judgment mistake, which is why knowledge does not correct it.</text>
</svg>