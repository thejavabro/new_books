<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four steps for scaling a database: one database handles reads and writes, a cache answers repeated reads, read replicas serve reads while the primary takes writes, and sharding splits the data by key.">
  <defs>
    <filter id="sc3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sc3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sc3-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sc3-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sc3-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sc3-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="sc3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Scaling a database, one step at a time</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each step handles more load, and each step is harder to build and run.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#sc3-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#sc3-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#sc3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#sc3-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#sc3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">One database</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">reads and writes</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">limit: one machine</text>
  <g filter="url(#sc3-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#D97706" clip-path="url(#sc3-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Add a cache</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">answers repeated reads</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">less load on the database</text>
  <g filter="url(#sc3-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#sc3-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Read replicas</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">copies serve reads</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">primary takes writes</text>
  <g filter="url(#sc3-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#sc3-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Sharding</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">data split by key</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">each shard takes writes</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Too many reads</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">add a cache first, then read replicas</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Too many writes</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">split the data into shards</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Simplest first</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">each step adds more work, so stop at the first step that solves the problem</text>
</svg>