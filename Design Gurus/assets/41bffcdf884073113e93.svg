<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One withdraw command: replay the history, check the rule against the replayed balance, emit MoneyWithdrawn, and append it with an expected version">
  <defs>
    <marker id="es4-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="es4-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="es4-k1"><rect x="72" y="140" width="240" height="70" rx="12"/></clipPath>
    <clipPath id="es4-k2"><rect x="372" y="140" width="240" height="70" rx="12"/></clipPath>
    <clipPath id="es4-k3"><rect x="672" y="140" width="240" height="70" rx="12"/></clipPath>
    <clipPath id="es4-k4"><rect x="972" y="140" width="240" height="70" rx="12"/></clipPath>
    <filter id="es4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="es4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>

  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M312,175 H364" marker-end="url(#es4-mblue)"/>
    <path d="M612,175 H664" marker-end="url(#es4-mblue)"/>
    <path d="M912,175 H964" marker-end="url(#es4-mblue)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M1092,230 V304" marker-end="url(#es4-memerald)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="1092" y="275" fill="#047857">append</text>
  </g>
  <g filter="url(#es4-soft)">
    <rect x="72" y="140" width="240" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="140" width="6" height="70" fill="#2563EB" clip-path="url(#es4-k1)"/>
  </g>
  <circle cx="110" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="182" font-size="18.5" font-weight="600" fill="#111827">withdraw(20)</text>
  <text x="192" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">the command arrives</text>
  <g filter="url(#es4-soft)">
    <rect x="372" y="140" width="240" height="70" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="372" y="140" width="6" height="70" fill="#7C3AED" clip-path="url(#es4-k2)"/>
  </g>
  <circle cx="410" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(399.56,164.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="436" y="182" font-size="18.5" font-weight="600" fill="#111827">Replay History</text>
  <text x="492" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">balance comes out at 60</text>
  <g filter="url(#es4-soft)">
    <rect x="672" y="140" width="240" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="672" y="140" width="6" height="70" fill="#64748B" clip-path="url(#es4-k3)"/>
  </g>
  <circle cx="710" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(699.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/><path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="736" y="182" font-size="18.5" font-weight="600" fill="#111827">Check the Rule</text>
  <text x="792" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">60 is enough, allow it</text>
  <g filter="url(#es4-lift)">
    <rect x="972" y="140" width="240" height="70" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="972" y="140" width="9" height="70" fill="#059669" clip-path="url(#es4-k4)"/>
  </g>
  <circle cx="1010" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(999.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="1036" y="182" font-size="18.5" font-weight="600" fill="#111827">MoneyWithdrawn</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 972,320 L 972,374 A 110,16 0 0 0 1192,374 L 1192,320" fill="#EDE9FE"/>
    <ellipse cx="1082" cy="320" rx="110" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1082" y="367" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Event Store</text>
  <rect x="40" y="430" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="454" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="476" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Commands</text>
  <text x="288" y="476" font-size="15.5" fill="#475569">validate against replayed state and emit a new event; apply only records</text>
  <rect x="64" y="498" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="520" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The result</text>
  <text x="288" y="520" font-size="15.5" fill="#475569">a new event is appended with an expected version; nothing is updated in place</text>
</svg>