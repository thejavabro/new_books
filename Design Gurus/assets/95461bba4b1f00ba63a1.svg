<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="621" viewBox="0 0 1240 621" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="fanout-title fanout-desc">
<title id="fanout-title">The fan-out does not finish in time</title>
<desc id="fanout-desc">Fifty million followers fanned out at ten thousand writes per second takes five thousand seconds, about eighty three minutes, for a single post, with the pipeline doing nothing else.</desc>
<defs>
<marker id="fanout-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="fanout-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="fanout-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="fanout-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="621" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The fan-out does not finish in time</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The post reaches the last follower an hour and a half after it was published.</text>
<rect x="40" y="543" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="543" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="72" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="72" rx="2.5" fill="#5EC9EC"/><text x="64" y="162" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">The proposal</text><text x="290" y="147.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">When a user posts, write that post into every follower feed, so reads stay cheap.</text><text x="290" y="174.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Fan-out on write, which is usually right.</text>
<text x="40" y="229" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The arithmetic</text>
<rect x="40" y="247" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="279" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">an account with 50,000,000 followers posts once</text>
<rect x="40" y="309" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="341" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">50,000,000 writes at 10,000 per second</text>
<rect x="40" y="371" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="403" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">= 5,000 seconds, about 83 minutes, for one post</text>
<rect x="890" y="247" width="310" height="176" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1045" y="326.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The last follower sees</text><text x="1045" y="355.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">it 83 minutes later</text>
<rect x="40" y="445" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="445" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="489" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What replaces it</text><text x="290" y="474.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Fan out on write for ordinary accounts, and merge the posts of the few very large</text><text x="290" y="501.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">accounts at read time. The arithmetic produced the hybrid.</text>
<text x="66" y="577" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">It does not rule out fan-out on write. It rules out one uniform policy, which forces a hybrid.</text>
</svg>