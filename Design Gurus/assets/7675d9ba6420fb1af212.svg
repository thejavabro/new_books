<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" style="background-color:#ffffff">
<g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">

<text x="30" y="28" font-size="13.5" font-weight="bold" fill="#b4322c">Every component knows the others</text>
<text x="520" y="28" font-size="13.5" font-weight="bold" fill="#2f7a55">Every component knows one thing</text>

<line x1="140" y1="88" x2="340" y2="88" stroke="#b4322c" stroke-width="1.2"/>
<line x1="140" y1="88" x2="140" y2="268" stroke="#b4322c" stroke-width="1.2"/>
<line x1="140" y1="88" x2="340" y2="268" stroke="#b4322c" stroke-width="1.2"/>
<line x1="340" y1="88" x2="140" y2="268" stroke="#b4322c" stroke-width="1.2"/>
<line x1="340" y1="88" x2="340" y2="268" stroke="#b4322c" stroke-width="1.2"/>
<line x1="140" y1="268" x2="340" y2="268" stroke="#b4322c" stroke-width="1.2"/>

<rect x="66" y="66" width="148" height="44" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="140" y="93" text-anchor="middle" font-size="11.5">CountrySelect</text>
<rect x="266" y="66" width="148" height="44" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="340" y="93" text-anchor="middle" font-size="11.5">MethodSelect</text>
<rect x="66" y="246" width="148" height="44" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="140" y="273" text-anchor="middle" font-size="11.5">PriceLabel</text>
<rect x="266" y="246" width="148" height="44" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="340" y="273" text-anchor="middle" font-size="11.5">SubmitButton</text>

<text x="66" y="326" font-size="12" fill="#b4322c">Four components, six connections.</text>
<text x="66" y="346" font-size="12" fill="#b4322c">Adding a fifth makes it ten.</text>
<text x="66" y="372" font-size="12" fill="#b4322c">Adding a promotion-code field means</text>
<text x="66" y="390" font-size="12" fill="#b4322c">editing four classes that already work.</text>
<text x="66" y="416" font-size="12" fill="#b4322c">None of them can be reused elsewhere,</text>
<text x="66" y="434" font-size="12" fill="#b4322c">because each drags the others along.</text>

<line x1="480" y1="50" x2="480" y2="440" stroke="#dbe2ed"/>

<line x1="630" y1="88" x2="720" y2="178" stroke="#2f7a55" stroke-width="1.2"/>
<line x1="830" y1="88" x2="720" y2="178" stroke="#2f7a55" stroke-width="1.2"/>
<line x1="630" y1="268" x2="720" y2="178" stroke="#2f7a55" stroke-width="1.2"/>
<line x1="830" y1="268" x2="720" y2="178" stroke="#2f7a55" stroke-width="1.2"/>

<rect x="556" y="66" width="148" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="630" y="93" text-anchor="middle" font-size="11.5">CountrySelect</text>
<rect x="756" y="66" width="148" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="830" y="93" text-anchor="middle" font-size="11.5">MethodSelect</text>
<rect x="556" y="246" width="148" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="630" y="273" text-anchor="middle" font-size="11.5">PriceLabel</text>
<rect x="756" y="246" width="148" height="44" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="830" y="273" text-anchor="middle" font-size="11.5">SubmitButton</text>

<rect x="626" y="154" width="188" height="48" rx="4" fill="#dcefe4" stroke="#2f7a55" stroke-width="2"/>
<text x="720" y="174" text-anchor="middle" font-weight="bold" font-size="12">ShippingFormMediator</text>
<text x="720" y="192" text-anchor="middle" font-size="10.5" fill="#2f7a55">holds every rule</text>

<text x="556" y="326" font-size="12" fill="#2f7a55">Four components, four connections.</text>
<text x="556" y="346" font-size="12" fill="#2f7a55">Adding a fifth makes it five.</text>
<text x="556" y="372" font-size="12" fill="#2f7a55">A promotion-code field is one new class</text>
<text x="556" y="390" font-size="12" fill="#2f7a55">plus a rule in the mediator.</text>
<text x="556" y="416" font-size="12" fill="#414d60">The cost: every rule now lives in one file,</text>
<text x="556" y="434" font-size="12" fill="#414d60">and that file only ever grows.</text>
</g>
</svg>