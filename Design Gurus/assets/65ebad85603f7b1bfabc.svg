<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="schema-title schema-desc">
<title id="schema-title">Compatibility decides who deploys first</title>
<desc id="schema-desc">Backward compatibility lets a new consumer read old data and requires consumers to upgrade first. Forward is the mirror. Full is both and the most constraining. No mode catches a change in what a field means.</desc>
<defs>
<marker id="schema-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="schema-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="schema-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="schema-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="762" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Compatibility decides who deploys first</text>
<text x="40" y="86" font-size="21" fill="#4A5568">An event schema is a contract with consumers you may not know about.</text>
<rect x="40" y="684" width="1160" height="52" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="684" width="5" height="52" rx="2.5" fill="#AC8BE8"/>
<rect x="40" y="118" width="372" height="276" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V388A6 6 0 0 0 46 394H54Z" fill="#39D5AA"/><text x="226" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="middle">Backward</text>
<text x="226" y="184" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">New schema reads old data</text>
<rect x="72" y="206" width="308" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="235" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">delete a field</text>
<rect x="72" y="260" width="308" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="289" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">add an optional field</text>
<rect x="72" y="324" width="308" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="355" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Consumers upgrade first</text>
<rect x="434" y="118" width="372" height="276" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V388A6 6 0 0 0 440 394H448Z" fill="#F3CF6A"/><text x="620" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="middle">Forward</text>
<text x="620" y="184" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Old schema reads new data</text>
<rect x="466" y="206" width="308" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="235" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">add a field</text>
<rect x="466" y="260" width="308" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="289" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">delete an optional field</text>
<rect x="466" y="324" width="308" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="355" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Producers upgrade first</text>
<rect x="828" y="118" width="372" height="276" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V388A6 6 0 0 0 834 394H842Z" fill="#AC8BE8"/><text x="1014" y="154" font-size="23" font-weight="700" fill="#6040A8" text-anchor="middle">Full</text>
<text x="1014" y="184" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Both directions at once</text>
<rect x="860" y="206" width="308" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1014" y="235" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">add optional fields</text>
<rect x="860" y="260" width="308" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1014" y="289" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">remove optional fields</text>
<rect x="860" y="324" width="308" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1014" y="355" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Either order</text>
<text x="226" y="422" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">the registry default</text>
<rect x="40" y="448" width="1160" height="80" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="448" width="5" height="80" rx="2.5" fill="#5EC9EC"/><text x="64" y="481" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">The choice is organizational, not technical.</text><text x="64" y="507" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Ask who deploys first in practice. A mode that fights your deployment order gets turned off.</text>
<rect x="40" y="552" width="1160" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="552" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="64" y="585" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The change no registry can catch</text><text x="64" y="611" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Reinterpreting amount from cents to dollars passes every compatibility check.</text><text x="64" y="637" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Registries check structure. Meaning needs a new field and a deprecation.</text>
<text x="66" y="718" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Pick the mode that matches how your organization actually deploys.</text>
</svg>