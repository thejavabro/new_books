<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="970" viewBox="0 0 1240 970" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A checkout request takes 2,300 ms. Inside it, the order service takes 40 ms, the payment service takes 2,200 ms with a card provider call of 2,150 ms, and the email service takes 30 ms.">
  <defs>
    <filter id="mo2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mo2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mo2-k1"><rect x="40" y="130" width="1160" height="90" rx="12"/></clipPath>
    <clipPath id="mo2-k2"><rect x="100" y="250" width="1100" height="90" rx="12"/></clipPath>
    <clipPath id="mo2-k3"><rect x="100" y="370" width="1100" height="90" rx="12"/></clipPath>
    <clipPath id="mo2-k4"><rect x="160" y="490" width="1040" height="90" rx="12"/></clipPath>
    <clipPath id="mo2-k5"><rect x="100" y="610" width="1100" height="90" rx="12"/></clipPath>
    <marker id="mo2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="mo2-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="970" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">One trace, made of spans</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every service records a timed span with the same trace ID. Indented spans run inside their parent.</text>



  <g fill="none" stroke-width="2">
    <path d="M70,220 V280 Q70,295 85,295 H100" stroke="#64748B" marker-end="url(#mo2-m-slate)"/>
    <path d="M70,220 V400 Q70,415 85,415 H100" stroke="#64748B" marker-end="url(#mo2-m-slate)"/>
    <path d="M70,220 V640 Q70,655 85,655 H100" stroke="#64748B" marker-end="url(#mo2-m-slate)"/>
    <path d="M130,460 V520 Q130,535 145,535 H160" stroke="#DB2777" marker-end="url(#mo2-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#mo2-soft)">
    <rect x="40" y="130" width="1160" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#64748B" clip-path="url(#mo2-k1)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">Checkout request: 2,300 ms</text>
  <g filter="url(#mo2-soft)">
    <rect x="100" y="250" width="1100" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="250" width="6" height="90" fill="#2563EB" clip-path="url(#mo2-k2)"/>
  </g>
  <circle cx="138" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,284.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="164" y="302" font-size="21.5" font-weight="600" fill="#111827">Order service: 40 ms</text>
  <g filter="url(#mo2-soft)">
    <rect x="100" y="370" width="1100" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="100" y="370" width="6" height="90" fill="#DB2777" clip-path="url(#mo2-k3)"/>
  </g>
  <circle cx="138" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,404.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="164" y="422" font-size="21.5" font-weight="600" fill="#111827">Payment service: 2,200 ms</text>
  <g filter="url(#mo2-lift)">
    <rect x="160" y="490" width="1040" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="160" y="490" width="9" height="90" fill="#DB2777" clip-path="url(#mo2-k4)"/>
  </g>
  <circle cx="198" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(187.56,524.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="224" y="542" font-size="21.5" font-weight="600" fill="#111827">Card provider call: 2,150 ms</text>
  <g filter="url(#mo2-soft)">
    <rect x="100" y="610" width="1100" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="100" y="610" width="6" height="90" fill="#059669" clip-path="url(#mo2-k5)"/>
  </g>
  <circle cx="138" cy="655" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,644.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="164" y="662" font-size="21.5" font-weight="600" fill="#111827">Email service: 30 ms</text>

  <rect x="40" y="740" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="765" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Span</text>
  <text x="323" y="790" font-size="18.5" fill="#475569">one timed step of work inside one service</text>
  <rect x="64" y="815" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="840" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Trace ID</text>
  <text x="323" y="840" font-size="18.5" fill="#475569">passed to every service, so all spans join into one trace</text>
  <rect x="64" y="865" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="890" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Slow span</text>
  <text x="323" y="890" font-size="18.5" fill="#475569">the card provider call takes 2,150 of the 2,300 ms</text>
</svg>