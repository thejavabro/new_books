<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three lists and the heap holding their first numbers">
<defs>
<filter id="nr-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="770" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the shortest range that reaches into all three lists?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The heap always holds exactly one number from each list, so every range it measures is valid</text>
<rect x="40" y="106" width="1160" height="518" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Violet is the smallest number in the heap, pink is the largest that has gone in</text>
<text x="434" y="218" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">list 1</text>
<rect x="456" y="180" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="506" y="217.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="570" y="180" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="217.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="684" y="180" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="734" y="217.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<text x="434" y="310" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">list 2</text>
<rect x="456" y="272" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="506" y="309.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="570" y="272" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="309.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">12</text>
<text x="434" y="402" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">list 3</text>
<rect x="456" y="364" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="506" y="401.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<rect x="570" y="364" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="401.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<rect x="684" y="364" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="734" y="401.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="310" y="524" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<rect x="332" y="486" width="132" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="398" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="398" y="568" text-anchor="middle" font-size="15.5" fill="#94A3B8">smallest, list 1</text>
<rect x="480" y="486" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="546" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="546" y="568" text-anchor="middle" font-size="15.5" fill="#94A3B8">list 2</text>
<rect x="628" y="486" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="694" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="694" y="568" text-anchor="middle" font-size="15.5" fill="#94A3B8">list 3</text>
<rect x="776" y="486" width="132" height="60" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="842" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="842" y="568" text-anchor="middle" font-size="15.5" fill="#94A3B8">largest put in</text>
<text x="620" y="602" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">The smallest and the largest in the heap bracket one number from every list</text>
<rect x="40" y="646" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="686" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">So every range the loop looks at already answers the question</text>
<text x="620" y="718" text-anchor="middle" font-size="18.5" fill="#475569">The loop is only choosing the shortest of them, never checking whether they are valid</text>
</svg>