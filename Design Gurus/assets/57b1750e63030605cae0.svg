<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="632" viewBox="0 0 1240 632" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Tighter recovery targets force a different architecture and a different bill, from nightly backups through to synchronous replication across regions">
  <rect x="0" y="0" width="1240" height="632" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Every tightening of the target buys a different architecture</text>

  <rect x="50" y="88" width="1140" height="52" fill="#F1F5F9"/>
  <text x="70" y="121" font-size="20" font-weight="600" fill="#334155">Target</text>
  <text x="500" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">What it forces you to run</text>
  <text x="980" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Cost</text>

  <text x="70" y="181" font-size="20" font-weight="600" fill="#065F46">RPO 24 h, RTO 24 h</text>
  <text x="500" y="181" font-size="20" fill="#334155" text-anchor="middle">a nightly backup to object storage</text>
  <text x="980" y="181" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">lowest</text>

  <text x="70" y="249" font-size="20" font-weight="600" fill="#1E40AF">RPO 1 h, RTO 4 h</text>
  <text x="500" y="249" font-size="20" fill="#334155" text-anchor="middle">hourly snapshots, restore runbook</text>
  <text x="980" y="249" font-size="20" fill="#334155" text-anchor="middle">low</text>

  <text x="70" y="317" font-size="20" font-weight="600" fill="#92400E">RPO 5 min, RTO 30 min</text>
  <text x="500" y="317" font-size="20" fill="#334155" text-anchor="middle">async replica, warm standby</text>
  <text x="980" y="317" font-size="20" fill="#92400E" text-anchor="middle">a second fleet, idle</text>

  <text x="70" y="385" font-size="20" font-weight="600" fill="#B91C1C">RPO 0, RTO near 0</text>
  <text x="500" y="385" font-size="20" fill="#334155" text-anchor="middle">sync replication, active-active</text>
  <text x="980" y="385" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">highest, and slower writes</text>

  <line x1="50" y1="88" x2="1190" y2="88" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="1190" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="50" y1="208" x2="1190" y2="208" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="276" x2="1190" y2="276" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="344" x2="1190" y2="344" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="412" x2="1190" y2="412" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="412" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="330" y1="88" x2="330" y2="412" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="800" y1="88" x2="800" y2="412" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1190" y1="88" x2="1190" y2="412" stroke="#CBD5E1" stroke-width="1.5"/>

  <rect x="50" y="442" width="1140" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="484" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">RPO 0 means a write is not done until a second site has it, so the target changes your write latency.</text>

  <rect x="50" y="540" width="1140" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="578" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ask what an hour of lost orders actually costs before promising a number nobody funded.</text>
</svg>