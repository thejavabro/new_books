<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Cases where caching a miss is safe, cases where it is not, and the TTL rule of thumb">
  <rect x="0" y="0" width="1240" height="708" fill="#FFFFFF"/>
  <defs>
    <filter id="ca2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Should you cache this miss?</text>

  
  <rect x="40" y="72" width="1160" height="220" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#065F46">Safe to cache the miss</text>

  <g filter="url(#ca2-soft)">
    <rect x="70" y="128" width="346" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="436" y="128" width="346" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="802" y="128" width="346" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="243" y="166" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A deleted page</text>
  <text x="243" y="202" font-size="20" fill="#475569" text-anchor="middle">Crawlers keep asking</text>
  <text x="243" y="230" font-size="20" fill="#475569" text-anchor="middle">for it for months.</text>

  <text x="609" y="166" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Random ID probing</text>
  <text x="609" y="202" font-size="20" fill="#475569" text-anchor="middle">A script guessing order</text>
  <text x="609" y="230" font-size="20" fill="#475569" text-anchor="middle">numbers one by one.</text>

  <text x="975" y="166" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">An expensive empty query</text>
  <text x="975" y="202" font-size="20" fill="#475569" text-anchor="middle">A wide search that scans</text>
  <text x="975" y="230" font-size="20" fill="#475569" text-anchor="middle">a lot and returns nothing.</text>

  
  <rect x="40" y="320" width="1160" height="220" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="354" font-size="20" font-weight="600" fill="#B91C1C">Do not cache the miss, or use a very short TTL</text>

  <g filter="url(#ca2-soft)">
    <rect x="70" y="376" width="346" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="436" y="376" width="346" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="802" y="376" width="346" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <text x="243" y="414" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A record about to exist</text>
  <text x="243" y="450" font-size="20" fill="#475569" text-anchor="middle">A signup that lands a</text>
  <text x="243" y="478" font-size="20" fill="#475569" text-anchor="middle">second from now.</text>

  <text x="609" y="414" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A timeout or 5xx</text>
  <text x="609" y="450" font-size="20" fill="#475569" text-anchor="middle">Retry instead. The data</text>
  <text x="609" y="478" font-size="20" fill="#475569" text-anchor="middle">is probably fine.</text>

  <text x="975" y="414" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Fast-changing data</text>
  <text x="975" y="450" font-size="20" fill="#475569" text-anchor="middle">Anything that can appear</text>
  <text x="975" y="478" font-size="20" fill="#475569" text-anchor="middle">at any moment.</text>

  
  <rect x="40" y="568" width="1160" height="108" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="604" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Keep negative TTLs short: seconds to a few minutes.</text>
  <text x="620" y="636" font-size="20" fill="#92400E" text-anchor="middle">CDNs commonly default to about 120 seconds for a 404.</text>
  <text x="620" y="664" font-size="20" fill="#92400E" text-anchor="middle">Whatever the TTL, evict the negative entry the moment the record is created.</text>
</svg>