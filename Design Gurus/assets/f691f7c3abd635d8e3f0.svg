<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="552" viewBox="0 0 1240 552" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On write, the data is passed through a hash function and the resulting checksum is stored next to it. On read, the checksum is calculated again from the bytes received and compared with the stored one. If the values match the data is returned, and if they differ the reader asks another machine for the same data.">
  <rect x="0" y="0" width="1240" height="552" fill="#FFFFFF"/>
  <defs>
    <marker id="ck1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ck1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ck1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ck1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ck1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ck1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ck1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ck1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ck1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Calculate on write, calculate again on read, then compare</text>
  <text x="24" y="84" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">ON WRITE</text>
  <g filter="url(#ck1-soft)"><rect x="24" y="100" width="210" height="78" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="129" y="146" font-size="20" fill="#0F172A" text-anchor="middle">the data</text>
  <line x1="238" y1="139" x2="300" y2="139" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ck1-s)"/>
  <g filter="url(#ck1-soft)"><rect x="306" y="100" width="230" height="78" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="421" y="146" font-size="20" font-weight="600" fill="#6D28D9" text-anchor="middle">hash function</text>
  <line x1="540" y1="139" x2="602" y2="139" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ck1-s)"/>
  <g filter="url(#ck1-soft)"><rect x="608" y="100" width="210" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="713" y="146" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">checksum</text>
  <line x1="822" y1="139" x2="884" y2="139" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ck1-s)"/>
  <g filter="url(#ck1-soft)"><rect x="890" y="100" width="326" height="78" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <text x="1053" y="133" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">saved side by side</text>
  <text x="1053" y="161" font-size="18" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">data + checksum</text>
  <path d="M24,214 L1216,214" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 6"/>
  <text x="24" y="250" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">ON READ</text>
  <g filter="url(#ck1-soft)"><rect x="24" y="266" width="210" height="78" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="129" y="312" font-size="20" fill="#0F172A" text-anchor="middle">bytes read</text>
  <line x1="238" y1="305" x2="300" y2="305" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ck1-s)"/>
  <g filter="url(#ck1-soft)"><rect x="306" y="266" width="230" height="78" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="421" y="312" font-size="20" font-weight="600" fill="#6D28D9" text-anchor="middle">hash function</text>
  <line x1="540" y1="305" x2="602" y2="305" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ck1-s)"/>
  <g filter="url(#ck1-soft)"><rect x="608" y="266" width="210" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="713" y="312" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">new checksum</text>
  <line x1="822" y1="305" x2="884" y2="305" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ck1-s)"/>
  <g filter="url(#ck1-soft)"><rect x="890" y="266" width="326" height="78" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="1053" y="299" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle">compare</text>
  <text x="1053" y="327" font-size="18" fill="#64748B" text-anchor="middle">with the stored checksum</text>
  <path d="M1053,350 L1053,376 M350,376 L1053,376" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="350" y1="376" x2="350" y2="402" stroke="#059669" stroke-width="2.2" marker-end="url(#ck1-e)"/>
  <line x1="890" y1="376" x2="890" y2="402" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ck1-r)"/>
  <g filter="url(#ck1-soft)"><rect x="140" y="408" width="420" height="100" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <path d="M181,450 L188,458 L200,442" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="220" y="458" font-size="20" font-weight="700" fill="#065F46" text-anchor="start">The values match</text>
  <text x="220" y="488" font-size="18" fill="#64748B" text-anchor="start">Return the data.</text>
  <g filter="url(#ck1-soft)"><rect x="680" y="408" width="420" height="100" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/></g>
  <path d="M722,442 L738,458 M738,442 L722,458" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="760" y="458" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="start">The values differ</text>
  <text x="760" y="488" font-size="18" fill="#64748B" text-anchor="start">Ask another machine.</text>
</svg>