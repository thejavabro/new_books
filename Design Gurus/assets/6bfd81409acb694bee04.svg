<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The string ababc before any swaps">
<defs>
<filter id="pd-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many neighbour swaps turn "ababc" into a palindrome?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Only neighbours may be swapped, so the cost of a move is the distance travelled</text>
<rect x="40" y="106" width="1160" height="386" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">A palindrome reads the same in both directions, so the ends have to match first</text>
<text x="276" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">string</text>
<rect x="298" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="356" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<text x="356" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="430" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="488" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">b</text>
<text x="488" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="562" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<text x="620" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="694" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="752" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">b</text>
<text x="752" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="826" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="884" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">c</text>
<text x="884" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<text x="620" y="294" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">Work from the outside in: settle the two ends, then forget them and repeat</text>
<text x="620" y="322" text-anchor="middle" font-size="18" fill="#475569">The character that matches the leftmost one is always taken from as far right as possible</text>
<rect x="40" y="510" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="550" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Taking the rightmost match is what keeps the total smallest</text>
<text x="620" y="582" text-anchor="middle" font-size="18.5" fill="#475569">Any nearer match would have to be moved again later, which costs more, not less</text>
</svg>