<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="stride-title stride-desc">
<title id="stride-title">Six categories, six properties</title>
<desc id="stride-desc">Each STRIDE category maps to a property you wanted. Walking the six against each component finds what free-form thinking misses.</desc>
<defs>
<marker id="stride-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="stride-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="stride-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="stride-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="772" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Six categories, six properties</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Each STRIDE category maps to a property you wanted.</text>
<rect x="40" y="694" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="694" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="1064" y="142" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the property it breaks</text>
<rect x="40" y="160" width="60" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="70" y="189" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">S</text>
<rect x="116" y="160" width="300" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="266" y="189" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Spoofing</text>
<rect x="432" y="160" width="480" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="452" y="189" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">pretending to be somebody else</text>
<rect x="928" y="160" width="272" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="189" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Authentication</text>
<rect x="40" y="214" width="60" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="70" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">T</text>
<rect x="116" y="214" width="300" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="266" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Tampering</text>
<rect x="432" y="214" width="480" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="452" y="243" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">modifying data or code</text>
<rect x="928" y="214" width="272" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Integrity</text>
<rect x="40" y="268" width="60" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="70" y="297" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">R</text>
<rect x="116" y="268" width="300" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="266" y="297" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Repudiation</text>
<rect x="432" y="268" width="480" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="452" y="297" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">denying having done something</text>
<rect x="928" y="268" width="272" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="297" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Non-repudiation</text>
<rect x="40" y="322" width="60" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="70" y="351" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">I</text>
<rect x="116" y="322" width="300" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="266" y="351" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Information disclosure</text>
<rect x="432" y="322" width="480" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="452" y="351" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">seeing what you should not</text>
<rect x="928" y="322" width="272" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="351" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Confidentiality</text>
<rect x="40" y="376" width="60" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="70" y="405" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">D</text>
<rect x="116" y="376" width="300" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="266" y="405" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Denial of service</text>
<rect x="432" y="376" width="480" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="452" y="405" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">making it unavailable</text>
<rect x="928" y="376" width="272" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="405" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Availability</text>
<rect x="40" y="430" width="60" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="70" y="459" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">E</text>
<rect x="116" y="430" width="300" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="266" y="459" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Elevation of privilege</text>
<rect x="432" y="430" width="480" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="452" y="459" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">doing what you are not allowed to</text>
<rect x="928" y="430" width="272" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="459" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Authorization</text>
<rect x="40" y="502" width="1160" height="72" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="502" width="5" height="72" rx="2.5" fill="#AC8BE8"/><text x="64" y="531" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The value is not the list of categories</text><text x="64" y="557" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Engineers reliably think of spoofing and disclosure, and reliably forget the other four.</text>
<rect x="40" y="598" width="1160" height="70" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="598" width="5" height="70" rx="2.5" fill="#5EC9EC"/><text x="64" y="626" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">For an upload feature: upload as another user, alter a file after scanning, deny uploading it,</text><text x="64" y="652" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">read somebody else's file, exhaust storage, get code to execute. Six questions, a few minutes</text>
<text x="66" y="728" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Some answers are "no, because". Some become tickets.</text>
</svg>