<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="758" viewBox="0 0 1240 758" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="order-title order-desc">
<title id="order-title">Ordering beats completeness</title>
<desc id="order-desc">At a small size an incomplete implementation done well is worth more than a complete one that is half-configured, so the sequence is ordered by value per unit of effort.</desc>
<defs>
<marker id="order-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="order-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="order-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="order-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="758" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Ordering beats completeness</text>
<text x="40" y="86" font-size="21" fill="#4A5568">At a small size the ordering matters more than the completeness.</text>
<rect x="40" y="680" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="680" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="820" y="138" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">value per unit of effort</text>
<circle cx="60" cy="180" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="187" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="148" width="300" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="172.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Identity with a second</text><text x="240" y="199.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">factor</text>
<rect x="416" y="148" width="396" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="436" y="173.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one provider, every system. Mostly a</text><text x="436" y="198.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">procurement decision</text>
<rect x="820" y="156" width="240" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="820" y="156" width="240.0" height="28" rx="10" fill="#06AC80"/>
<text x="820" y="206" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">most intrusions start with a credential</text>
<circle cx="60" cy="256" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="263" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="224" width="300" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="240" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Device posture, lightly</text>
<rect x="416" y="224" width="396" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="436" y="249.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">know which device, require a managed</text><text x="436" y="274.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one for the sensitive systems</text>
<rect x="820" y="232" width="240" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="820" y="232" width="144.0" height="28" rx="10" fill="#159BEF"/>
<text x="820" y="282" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">often included with the provider</text>
<circle cx="60" cy="332" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="339" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="300" width="300" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="240" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Remove the flat network</text>
<rect x="416" y="300" width="396" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="436" y="325.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stop treating inside the VPC as</text><text x="436" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">authorization</text>
<rect x="820" y="308" width="240" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="820" y="308" width="108.0" height="28" rx="10" fill="#E8BC60"/>
<text x="820" y="358" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">not full segmentation</text>
<circle cx="60" cy="408" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="415" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="376" width="300" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="240" y="414" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Service identity</text>
<rect x="416" y="376" width="396" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="436" y="401.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">issued by the platform rather than a</text><text x="436" y="426.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">shared secret or an allowlist</text>
<rect x="820" y="384" width="240" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="820" y="384" width="84.0" height="28" rx="10" fill="#7650D6"/>
<text x="820" y="434" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">workload identity pays off twice</text>
<rect x="40" y="462" width="1160" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="462" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="494" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The first one is first for an arithmetic reason</text><text x="64" y="520" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A second factor removes the large majority of credential-based attacks, and</text><text x="64" y="546" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">nothing else available for the same effort compares.</text>
<rect x="40" y="588" width="1160" height="66" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="588" width="5" height="66" rx="2.5" fill="#F3CF6A"/><text x="64" y="627" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Most organizations get the first two wrong before worrying about the fourth.</text>
<text x="66" y="714" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The highest-value security change available to most small companies is a procurement decision.</text>
</svg>