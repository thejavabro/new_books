<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Attempt A carries key K and its response is lost. Attempt B carries the same key. Both enter one idempotency record holding the request fingerprint, the terminal result and the usage id. Exactly one arrow leaves it for model execution and exactly one for the usage record, and the replay bypasses both.">
  <defs>
    <marker id="p2h-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p2h-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="p2h-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p2h-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p2h-sm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p2h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2h-k1"><rect x="64" y="218" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="p2h-k2"><rect x="536" y="190" width="328" height="48" rx="10"/></clipPath>
    <clipPath id="p2h-k3"><rect x="536" y="256" width="328" height="48" rx="10"/></clipPath>
    <clipPath id="p2h-k4"><rect x="536" y="322" width="328" height="48" rx="10"/></clipPath>
    <clipPath id="p2h-k5"><rect x="950" y="160" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="p2h-k6"><rect x="950" y="320" width="250" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="670" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">One logical inference, one charge</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one execution, one usage record</text>

  
  <rect x="500" y="136" width="400" height="254" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="524" y="166" font-size="16.5" font-weight="600" fill="#5B21B6">Idempotency record</text>

  
  <g fill="none" stroke-width="2">
    <path d="M274,224 H500" stroke="#2563EB" marker-end="url(#p2h-bm)"/>
    <path d="M500,263 H274" stroke="#DB2777" marker-end="url(#p2h-pm)"/>
    <path d="M274,302 H500" stroke="#2563EB" stroke-width="2.5" marker-end="url(#p2h-bm)"/>
    <path d="M900,205 H950" stroke="#D97706" marker-end="url(#p2h-am)"/>
    <path d="M900,365 H950" stroke="#059669" stroke-width="2.5" marker-end="url(#p2h-em)"/>
    <path d="M560,390 V458 Q560,470 548,470 H122 Q110,470 110,458 V308" stroke="#64748B" stroke-dasharray="6 5" marker-end="url(#p2h-sm)"/>
  </g>
  <path d="M304,255 L320,271 M320,255 L304,271" fill="none" stroke="#DB2777" stroke-width="3" stroke-linecap="round"/>

  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="387" y="212" fill="#1D4ED8">attempt A, key K</text>
    <text x="404" y="249" fill="#BE185D">response lost</text>
    <text x="387" y="291" fill="#1D4ED8">attempt B, same key K</text>
    <text x="335" y="496" fill="#475569">the replay returns the stored result and bypasses both</text>
  </g>

  
  <g filter="url(#p2h-soft)">
    <rect x="536" y="190" width="328" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="536" y="190" width="6" height="48" fill="#7C3AED" clip-path="url(#p2h-k2)"/>
  </g>
  <circle cx="570" cy="214" r="4.5" fill="#7C3AED"/>
  <text x="594" y="221" font-size="18.5" font-weight="600" fill="#111827">request fingerprint</text>

  <g filter="url(#p2h-soft)">
    <rect x="536" y="256" width="328" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="536" y="256" width="6" height="48" fill="#7C3AED" clip-path="url(#p2h-k3)"/>
  </g>
  <circle cx="570" cy="280" r="4.5" fill="#7C3AED"/>
  <text x="594" y="287" font-size="18.5" font-weight="600" fill="#111827">terminal result</text>

  <g filter="url(#p2h-soft)">
    <rect x="536" y="322" width="328" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="536" y="322" width="6" height="48" fill="#7C3AED" clip-path="url(#p2h-k4)"/>
  </g>
  <circle cx="570" cy="346" r="4.5" fill="#7C3AED"/>
  <text x="594" y="353" font-size="18.5" font-weight="600" fill="#111827">usage_id</text>

  <text x="700" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">written before work is accepted</text>

  
  <g filter="url(#p2h-soft)">
    <rect x="64" y="218" width="210" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="218" width="6" height="90" fill="#2563EB" clip-path="url(#p2h-k1)"/>
  </g>
  <circle cx="102" cy="263" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,252.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="128" y="270" font-size="18.5" font-weight="600" fill="#111827">Caller</text>
  <text x="169" y="333" font-size="15.5" text-anchor="middle" fill="#6B7280">retrying</text>

  
  <g filter="url(#p2h-soft)">
    <rect x="950" y="160" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="950" y="160" width="6" height="90" fill="#D97706" clip-path="url(#p2h-k5)"/>
  </g>
  <circle cx="988" cy="205" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,194.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="1014" y="212" font-size="18.5" font-weight="600" fill="#111827">Model execution</text>
  <text x="1075" y="275" font-size="15.5" text-anchor="middle" fill="#6B7280">runs exactly once</text>

  
  <g filter="url(#p2h-lift)">
    <rect x="950" y="320" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="950" y="320" width="9" height="90" fill="#059669" clip-path="url(#p2h-k6)"/>
  </g>
  <circle cx="988" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,354.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="1014" y="372" font-size="18.5" font-weight="600" fill="#111827">UsageRecord</text>
  <text x="1075" y="435" font-size="15.5" text-anchor="middle" fill="#6B7280">written exactly once</text>

  
  <rect x="40" y="530" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="572" text-anchor="middle" font-size="16" fill="#475569">Same key and body resolves uncertain delivery with no new charge.</text>
  <text x="620" y="600" text-anchor="middle" font-size="16" fill="#475569">A new key requests new generation and pays for it.</text>
</svg>