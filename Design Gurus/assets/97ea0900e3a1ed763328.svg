  <g fill="none" stroke="#059669" stroke-width="2"><path d="M952,498 H642 Q630,498 630,510 V668" marker-end="url(#mdr2-memerald)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M744,713 H976" marker-end="url(#mdr2-mamber)"/></g>
