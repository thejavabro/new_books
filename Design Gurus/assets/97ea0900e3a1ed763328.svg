  <circle cx="362" cy="237" r="18" fill="#FFFFFF"/>
  <g transform="translate(351.56,226.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="388" y="244" font-size="18.5" font-weight="600" fill="#111827">1. Retrain</text>
  <text x="404" y="307" font-size="15.5" text-anchor="middle" fill="#6B7280">on the chosen window</text>
  <g filter="url(#mdr2-soft)">
    <rect x="532" y="192" width="180" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="532" y="192" width="6" height="90" fill="#D97706" clip-path="url(#mdr2-k4)"/>
