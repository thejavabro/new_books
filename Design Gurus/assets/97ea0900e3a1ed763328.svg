    <rect x="64" y="116" width="6" height="90" fill="#64748B" clip-path="url(#mdr2-k1)"/>
  </g>
  <circle cx="102" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,150.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="128" y="168" font-size="18.5" font-weight="600" fill="#111827">Schedule</text>
  <text x="162" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">set by measured decay</text>
  <g filter="url(#mdr2-soft)">
    <rect x="64" y="268" width="196" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="268" width="6" height="90" fill="#64748B" clip-path="url(#mdr2-k2)"/>
