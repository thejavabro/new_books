<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="969" viewBox="0 0 1240 969" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A retrained model passes offline evaluation and shadow mode automatically, then waits for a human to approve the canary release">
  <defs>
    <marker id="mdr2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="mdr2-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="mdr2-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="mdr2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mdr2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mdr2-k1"><rect x="64" y="116" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="mdr2-k2"><rect x="64" y="268" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="mdr2-k3"><rect x="324" y="192" width="160" height="90" rx="12"/></clipPath>
    <clipPath id="mdr2-k4"><rect x="532" y="192" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="mdr2-k5"><rect x="952" y="192" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="mdr2-k6"><rect x="952" y="453" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="mdr2-k7"><rect x="516" y="668" width="228" height="90" rx="12"/></clipPath>
    <clipPath id="mdr2-k8"><rect x="976" y="668" width="200" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="969" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="357" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Automated: nothing users see changes</text>
  <rect x="40" y="608" width="1160" height="205" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="638" font-size="16.5" font-weight="600" fill="#1D4ED8">Real traffic</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M260,161 H280 Q292,161 292,173 V225 Q292,237 304,237 H324" marker-end="url(#mdr2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M260,313 H280 Q292,313 292,301 V249 Q292,237 304,237 H324" marker-end="url(#mdr2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M484,237 H532" marker-end="url(#mdr2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M712,237 H952" marker-end="url(#mdr2-mslate)"/></g>
