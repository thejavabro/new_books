  <circle cx="102" cy="313" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,302.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="128" y="320" font-size="18.5" font-weight="600" fill="#111827">Monitor alert</text>
  <text x="162" y="383" font-size="15.5" text-anchor="middle" fill="#6B7280">after the cause is confirmed</text>
