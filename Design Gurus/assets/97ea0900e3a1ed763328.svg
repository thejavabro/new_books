  <text x="596" y="232" font-size="18.5" font-weight="600" fill="#111827">2. Offline</text>
  <text x="596" y="255" font-size="18.5" font-weight="600" fill="#111827">evaluation</text>
  <text x="622" y="307" font-size="15.5" text-anchor="middle" fill="#6B7280">against the incumbent</text>
  <g filter="url(#mdr2-soft)">
    <rect x="952" y="192" width="224" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="952" y="192" width="6" height="90" fill="#7C3AED" clip-path="url(#mdr2-k5)"/>
  </g>
  <circle cx="990" cy="237" r="18" fill="#FFFFFF"/>
  <g transform="translate(979.56,226.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="1016" y="244" font-size="18.5" font-weight="600" fill="#111827">3. Shadow mode</text>
  <text x="1064" y="307" font-size="15.5" text-anchor="middle" fill="#6B7280">results logged, nobody sees them</text>
  <g filter="url(#mdr2-soft)">
    <rect x="952" y="453" width="224" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="952" y="453" width="6" height="90" fill="#059669" clip-path="url(#mdr2-k6)"/>
  </g>
  <circle cx="990" cy="498" r="18" fill="#FFFFFF"/>
  <g transform="translate(979.56,487.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1016" y="505" font-size="18.5" font-weight="600" fill="#111827">Human approval</text>
  <text x="1064" y="568" font-size="15.5" text-anchor="middle" fill="#6B7280">reviews the shadow results</text>
  <g filter="url(#mdr2-soft)">
    <rect x="516" y="668" width="228" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="516" y="668" width="6" height="90" fill="#2563EB" clip-path="url(#mdr2-k7)"/>
  </g>
  <circle cx="554" cy="713" r="18" fill="#FFFFFF"/>
  <g transform="translate(543.56,702.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="580" y="720" font-size="18.5" font-weight="600" fill="#111827">4. Canary release</text>
  <text x="630" y="783" font-size="15.5" text-anchor="middle" fill="#6B7280">a small share, then more</text>
  <g filter="url(#mdr2-soft)">
    <rect x="976" y="668" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="976" y="668" width="6" height="90" fill="#2563EB" clip-path="url(#mdr2-k8)"/>
  </g>
  <circle cx="1014" cy="713" r="18" fill="#FFFFFF"/>
  <g transform="translate(1003.56,702.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="1040" y="720" font-size="18.5" font-weight="600" fill="#111827">Incumbent</text>
  <text x="1076" y="783" font-size="15.5" text-anchor="middle" fill="#6B7280">serving users right now</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="832" y="203" fill="#475569">wins overall,</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="832" y="223" fill="#475569">loses in no important segment</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="797" y="484" fill="#047857">approves promotion</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="860" y="699" fill="#B45309">rollback metric gets worse</text></g>
  <rect x="40" y="853" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="898" text-anchor="middle" font-size="16" fill="#475569">Auto-retrain, human-promote: automation reaches shadow mode, and a human approves real traffic.</text>
</svg>