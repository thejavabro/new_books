    <rect x="324" y="192" width="160" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="324" y="192" width="6" height="90" fill="#D97706" clip-path="url(#mdr2-k3)"/>
