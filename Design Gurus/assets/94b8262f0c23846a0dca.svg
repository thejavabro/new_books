<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Disk corruption detection: a block is stored with its checksum, the checksum is recomputed on every read and compared, a match serves the data and a mismatch triggers a read from another replica">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="ck2-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ck2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="ck2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ck2-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="ck2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="280" y1="136" x2="474" y2="136" stroke="#3B82F6" stroke-width="2" marker-end="url(#ck2-blue)"/>
  <text x="380" y="116" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. hash the block</text>

  <line x1="750" y1="136" x2="954" y2="136" stroke="#3B82F6" stroke-width="2" marker-end="url(#ck2-blue)"/>
  <text x="852" y="85" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. store the block</text>
  <text x="852" y="112" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">+ its checksum</text>

  <line x1="1080" y1="215" x2="1080" y2="334" stroke="#3B82F6" stroke-width="2" marker-end="url(#ck2-blue)"/>
  <text x="1100" y="282" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. read the block</text>

  <path d="M 1005,205 C 950,255 800,290 706,336" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ck2-slate)"/>
  <text x="850" y="264" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">stored checksum</text>

  <line x1="934" y1="376" x2="766" y2="376" stroke="#3B82F6" stroke-width="2" marker-end="url(#ck2-blue)"/>

  <path d="M 560,412 C 480,450 380,470 280,502" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#ck2-emerald)"/>
  <text x="420" y="435" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">checksums match</text>

  <path d="M 680,412 C 730,450 780,470 805,502" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ck2-red)"/>
  <text x="760" y="448" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">checksums differ</text>

  
  <g filter="url(#ck2-soft)">
    <rect x="40" y="100" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="160" y="130" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Data block</text>
  <text x="160" y="158" font-size="20" fill="#64748B" text-anchor="middle">written by a client</text>

  <g filter="url(#ck2-soft)">
    <rect x="480" y="100" width="270" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="615" y="130" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Compute the checksum</text>
  <text x="615" y="158" font-size="20" fill="#64748B" text-anchor="middle">a short fixed-size value</text>

  
  <g filter="url(#ck2-soft)">
    <path d="M 960,100 L 960,195 A 120,16 0 0 0 1200,195 L 1200,100" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1080" cy="100" rx="120" ry="16" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1080" y="147" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Disk</text>
  <text x="1080" y="175" font-size="20" fill="#64748B" text-anchor="middle">block + checksum</text>

  <g filter="url(#ck2-soft)">
    <rect x="940" y="340" width="280" height="72" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1080" y="370" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Recompute the checksum</text>
  <text x="1080" y="398" font-size="20" fill="#64748B" text-anchor="middle">from the bytes on disk</text>

  <g filter="url(#ck2-soft)">
    <rect x="480" y="340" width="280" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="370" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Compare the checksums</text>
  <text x="620" y="398" font-size="20" fill="#64748B" text-anchor="middle">recomputed vs stored</text>

  <g filter="url(#ck2-soft)">
    <rect x="160" y="502" width="240" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="280" y="532" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Serve the data</text>
  <text x="280" y="560" font-size="20" fill="#64748B" text-anchor="middle">the block is intact</text>

  <g filter="url(#ck2-soft)">
    <rect x="655" y="502" width="300" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="805" y="532" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Block is corrupted</text>
  <text x="805" y="560" font-size="20" fill="#64748B" text-anchor="middle">read from another replica</text>

  
  <line x1="88" y1="630" x2="116" y2="630" stroke="#3B82F6" stroke-width="3"/>
  <text x="126" y="637" font-size="20" fill="#475569">data flow</text>
  <line x1="270" y1="630" x2="298" y2="630" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="308" y="637" font-size="20" fill="#475569">stored checksum</text>
  <line x1="523" y1="630" x2="551" y2="630" stroke="#059669" stroke-width="3"/>
  <text x="561" y="637" font-size="20" fill="#475569">match: data intact</text>
  <line x1="807" y1="630" x2="835" y2="630" stroke="#DC2626" stroke-width="3"/>
  <text x="845" y="637" font-size="20" fill="#475569">mismatch: corruption detected</text>
</svg>