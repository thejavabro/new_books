<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One public request costs one JSON parse at the gateway, which fans out to 20 internal calls, so every serialization cost is paid 20 times, and compact protobuf on those hops saves 20 times as much.">
  <defs>
    <marker id="m03-l02-serialization-cost-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l02-serialization-cost-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m03-l02-serialization-cost-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <g fill="none">
    <path d="M390,165 L504,165" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l02-serialization-cost-blue)"/>
    <path d="M750,165 L844,165" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l02-serialization-cost-blue)"/>
    <path d="M1015,220 V300 Q1015,316 999,316 H636 Q620,316 620,332 V364" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l02-serialization-cost-blue)"/>
    <path d="M620,500 V554" stroke="#059669" stroke-width="2.5" marker-end="url(#m03-l02-serialization-cost-em)"/>
  </g>

  <g filter="url(#m03-l02-serialization-cost-soft)">
    <rect x="50" y="110" width="340" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="220" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One public request,</text>
  <text x="220" y="180" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">one JSON parse</text>
  <text x="220" y="208" text-anchor="middle" font-size="20" fill="#64748B">parsed once at the boundary</text>

  <g filter="url(#m03-l02-serialization-cost-soft)">
    <rect x="510" y="110" width="240" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="630" y="161" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="630" y="191" text-anchor="middle" font-size="20" fill="#64748B">the public edge</text>

  
  <rect x="866" y="94" width="330" height="110" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.3"/>
  <rect x="858" y="102" width="330" height="110" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.3"/>
  <g filter="url(#m03-l02-serialization-cost-soft)">
    <rect x="850" y="110" width="330" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1015" y="152" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fans out to</text>
  <text x="1015" y="180" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">20 internal calls</text>
  <text x="1015" y="208" text-anchor="middle" font-size="20" fill="#64748B">one in, many out</text>

  <rect x="978" y="240" width="74" height="36" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="1015" y="266" text-anchor="middle" font-size="20" font-weight="700" fill="#1E40AF">&#215;20</text>

  <g filter="url(#m03-l02-serialization-cost-soft)">
    <rect x="190" y="364" width="860" height="136" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="410" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Every serialization cost is paid 20 times</text>
  <text x="620" y="446" text-anchor="middle" font-size="20" fill="#64748B">20 times the bytes, 20 times the parse work</text>
  <text x="620" y="480" text-anchor="middle" font-size="20" fill="#64748B">serialization is turning data into bytes and back again</text>

  <g filter="url(#m03-l02-serialization-cost-soft)">
    <rect x="190" y="554" width="860" height="136" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="620" y="600" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Compact protobuf on those hops saves 20 times as much</text>
  <text x="620" y="636" text-anchor="middle" font-size="20" fill="#64748B">smaller payloads on the high-volume paths</text>
  <text x="620" y="670" text-anchor="middle" font-size="20" fill="#64748B">at the single public hop, one JSON parse is noise</text>

  <g font-size="20" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="447" y="96" text-anchor="middle" fill="#1E40AF">one parse</text>
    <text x="800" y="96" text-anchor="middle" fill="#1E40AF">one request in</text>
    <text x="800" y="306" text-anchor="middle" fill="#1E40AF">serialize and deserialize on all 20 hops</text>
    <text x="648" y="534" fill="#065F46">20 times the saving</text>
  </g>

  <line x1="50" y1="740" x2="86" y2="740" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="747" font-size="20" fill="#475569">Synchronous request path: one in, 20 out</text>
  <line x1="50" y1="780" x2="86" y2="780" stroke="#059669" stroke-width="4"/>
  <text x="98" y="787" font-size="20" fill="#475569">The fix: compact protobuf where the multiplier is</text>
</svg>