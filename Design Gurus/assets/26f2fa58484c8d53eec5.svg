<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="888" viewBox="0 0 1240 888" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five forms of AI design question, each with a food-delivery example and the part of the design where most of the hour goes">
  <defs>
    <filter id="c1sf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="c1sf-k1"><rect x="40" y="90" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="c1sf-k2"><rect x="40" y="222" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="c1sf-k3"><rect x="40" y="354" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="c1sf-k4"><rect x="40" y="486" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="c1sf-k5"><rect x="40" y="618" width="360" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="888" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="16.5" font-weight="600" fill="#374151">The form</text>
  <text x="430" y="52" font-size="16.5" font-weight="600" fill="#374151">Example from the food-delivery company</text>
  <text x="850" y="52" font-size="16.5" font-weight="600" fill="#374151">Where most of the hour goes</text>
  <path d="M40,70 H1200" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <g filter="url(#c1sf-soft)">
    <rect x="40" y="90" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="90" width="6" height="90" fill="#2563EB" clip-path="url(#c1sf-k1)"/>
  </g>
  <circle cx="78" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="104" y="142" font-size="18.5" font-weight="600" fill="#111827">Form 1: A known ML product</text>
  <text x="220" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">and its feature pipeline</text>
  <rect x="430" y="90" width="390" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="450" y="140.5" font-size="15.5" font-style="italic" fill="#374151">"Design delivery-time prediction for our app."</text>
  <rect x="850" y="90" width="350" height="90" rx="12" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="870" y="129" font-size="16.5" fill="#111827">Data, labels, features,</text>
  <text x="870" y="153" font-size="16.5" fill="#111827">training, and evaluation</text>
  <g filter="url(#c1sf-soft)">
    <rect x="40" y="222" width="360" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="40" y="222" width="6" height="90" fill="#4F46E5" clip-path="url(#c1sf-k2)"/>
  </g>
  <circle cx="78" cy="267" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,256.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="274" font-size="18.5" font-weight="600" fill="#111827">Form 2: A GenAI product</text>
  <text x="220" y="337" font-size="15.5" text-anchor="middle" fill="#6B7280">that generates content</text>
  <rect x="430" y="222" width="390" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="450" y="272.5" font-size="15.5" font-style="italic" fill="#374151">"Design a support assistant that answers customers."</text>
  <rect x="850" y="222" width="350" height="90" rx="12" fill="#F8FAFC" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="870" y="261" font-size="16.5" fill="#111827">Retrieval, prompts,</text>
  <text x="870" y="285" font-size="16.5" fill="#111827">inference cost, and safety</text>
  <g filter="url(#c1sf-soft)">
    <rect x="40" y="354" width="360" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="354" width="6" height="90" fill="#64748B" clip-path="url(#c1sf-k3)"/>
  </g>
  <circle cx="78" cy="399" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,388.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="104" y="406" font-size="18.5" font-weight="600" fill="#111827">Form 3: Add AI to a system</text>
  <text x="220" y="469" font-size="15.5" text-anchor="middle" fill="#6B7280">that already works</text>
  <rect x="430" y="354" width="390" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="450" y="404.5" font-size="15.5" font-style="italic" fill="#374151">"Add AI to our support ticket system."</text>
  <rect x="850" y="354" width="350" height="90" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="870" y="393" font-size="16.5" fill="#111827">Judgment: where AI helps,</text>
  <text x="870" y="417" font-size="16.5" fill="#111827">and what ships first</text>
  <g filter="url(#c1sf-soft)">
    <rect x="40" y="486" width="360" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="486" width="6" height="90" fill="#D97706" clip-path="url(#c1sf-k4)"/>
  </g>
  <circle cx="78" cy="531" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,520.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="104" y="538" font-size="18.5" font-weight="600" fill="#111827">Form 4: An agent that acts</text>
  <text x="220" y="601" font-size="15.5" text-anchor="middle" fill="#6B7280">on a user's behalf</text>
  <rect x="430" y="486" width="390" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="450" y="536.5" font-size="15.5" font-style="italic" fill="#374151">"Let the assistant issue small refunds."</text>
  <rect x="850" y="486" width="350" height="90" rx="12" fill="#F8FAFC" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="870" y="525" font-size="16.5" fill="#111827">Control: tools, step limits,</text>
  <text x="870" y="549" font-size="16.5" fill="#111827">and approvals</text>
  <g filter="url(#c1sf-soft)">
    <rect x="40" y="618" width="360" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="618" width="6" height="90" fill="#64748B" clip-path="url(#c1sf-k5)"/>
  </g>
  <circle cx="78" cy="663" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,652.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="670" font-size="18.5" font-weight="600" fill="#111827">Form 5: Critique or scale</text>
  <text x="220" y="733" font-size="15.5" text-anchor="middle" fill="#6B7280">an existing AI design</text>
  <rect x="430" y="618" width="390" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="450" y="657" font-size="15.5" font-style="italic" fill="#374151">"Here is our assistant's design.</text>
  <text x="450" y="680" font-size="15.5" font-style="italic" fill="#374151">What is wrong with it?"</text>
  <rect x="850" y="618" width="350" height="90" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="870" y="657" font-size="16.5" fill="#111827">Finding problems, and</text>
  <text x="870" y="681" font-size="16.5" fill="#111827">ordering them by harm</text>
  <rect x="40" y="764" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="799" text-anchor="middle" font-size="15.5" fill="#374151">Forms 1, 2 and 4 line up with the predictive, generative and agentic families.</text>
  <text x="620" y="825" text-anchor="middle" font-size="15.5" fill="#374151">Forms 3 and 5 can hold a design from any family.</text>
</svg>