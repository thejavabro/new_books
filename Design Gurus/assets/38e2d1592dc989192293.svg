<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six questions that decide between SQL and NoSQL: the data model, scale, consistency, query complexity, performance and operations">
  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>
  <defs>
    <filter id="db5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="230" y="72" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Ask</text>
  <text x="640" y="72" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Points to SQL</text>
  <text x="990" y="72" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Points to NoSQL</text>

  <g filter="url(#db5-soft)">
    <rect x="60" y="96" width="340" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="60" y="172" width="340" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="60" y="248" width="340" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="60" y="324" width="340" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="60" y="400" width="340" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="60" y="476" width="340" height="52" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <text x="230" y="136" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">1 Data model</text>
  <text x="230" y="212" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">2 Scalability</text>
  <text x="230" y="288" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">3 Consistency</text>
  <text x="230" y="364" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">4 Query complexity</text>
  <text x="230" y="440" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">5 Performance</text>
  <text x="230" y="509" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">6 Operations</text>

  <text x="640" y="136" font-size="20" fill="#1E3A8A" text-anchor="middle">Structured, predictable</text>
  <text x="640" y="212" font-size="20" fill="#1E3A8A" text-anchor="middle">One server is enough</text>
  <text x="640" y="288" font-size="20" fill="#1E3A8A" text-anchor="middle">Must be strict</text>
  <text x="640" y="364" font-size="20" fill="#1E3A8A" text-anchor="middle">JOINs and aggregation</text>
  <text x="640" y="440" font-size="20" fill="#1E3A8A" text-anchor="middle">General-purpose is fine</text>
  <text x="640" y="509" font-size="20" fill="#1E3A8A" text-anchor="middle">Your team knows it</text>

  <text x="990" y="136" font-size="20" fill="#065F46" text-anchor="middle">Unstructured, evolving</text>
  <text x="990" y="212" font-size="20" fill="#065F46" text-anchor="middle">Beyond one server</text>
  <text x="990" y="288" font-size="20" fill="#065F46" text-anchor="middle">Availability matters more</text>
  <text x="990" y="364" font-size="20" fill="#065F46" text-anchor="middle">Lookups by the model</text>
  <text x="990" y="440" font-size="20" fill="#065F46" text-anchor="middle">One pattern must be fast</text>
  <text x="990" y="509" font-size="20" fill="#065F46" text-anchor="middle">You will learn to run it</text>
</svg>