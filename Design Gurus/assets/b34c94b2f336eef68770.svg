<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="738" viewBox="0 0 1240 738" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An attacker captures a validly signed request and sends it again unchanged; the signature still verifies, so the server executes the transfer a second time">
  <rect x="0" y="0" width="1240" height="738" fill="#FFFFFF"/>
  <defs>
    <marker id="se7-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se7-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="se7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The attacker never breaks the signature. They do not have to.</text>

  <line x1="200" y1="134" x2="200" y2="600" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="620" y1="134" x2="620" y2="600" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="1040" y1="134" x2="1040" y2="600" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g filter="url(#se7-soft)">
    <rect x="100" y="80" width="200" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="500" y="80" width="240" height="54" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect x="930" y="80" width="220" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="620" y="114" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Attacker on the wire</text>
  <text x="1040" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>

  <rect x="428" y="160" width="384" height="26" fill="#FFFFFF"/>
  <text x="620" y="180" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">POST /transfer  $500  sig=a91f</text>
  <line x1="204" y1="200" x2="1036" y2="200" stroke="#3B82F6" stroke-width="2" marker-end="url(#se7-blue)"/>

  <rect x="930" y="220" width="220" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1040" y="250" font-size="20" fill="#065F46" text-anchor="middle">signature valid</text>
  <text x="1040" y="276" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">$500 transferred</text>

  <rect x="490" y="320" width="260" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="620" y="350" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">copies the bytes</text>
  <text x="620" y="376" font-size="20" fill="#B91C1C" text-anchor="middle">exactly as they are</text>

  <text x="830" y="444" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">the same bytes again</text>
  <line x1="624" y1="464" x2="1036" y2="464" stroke="#DC2626" stroke-width="2" marker-end="url(#se7-red)"/>

  <rect x="930" y="484" width="220" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="1040" y="514" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">signature valid</text>
  <text x="1040" y="540" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">$500 transferred</text>

  <rect x="50" y="626" width="1140" height="92" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="662" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">A signature proves the message was not altered. It says nothing about whether it is the first copy.</text>
  <text x="620" y="692" font-size="20" fill="#B91C1C" text-anchor="middle">The fix is freshness: a nonce or a timestamp the server refuses to accept twice.</text>
</svg>