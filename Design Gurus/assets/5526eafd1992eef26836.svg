<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The reservation workflow: a reserve request either becomes a five minute hold tracked by ActiveReservationsService, or the user waits their turn in WaitingUsersService, or a full house returns 409 to the client.">
  <defs>
    <marker id="tm03-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="tm03-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="tm03-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="tm03-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="tm03-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="tm03-k1"><rect x="50" y="90" width="235" height="90" rx="12"/></clipPath>
    <clipPath id="tm03-k2"><rect x="360" y="90" width="307" height="90" rx="12"/></clipPath>
    <clipPath id="tm03-k3"><rect x="840" y="90" width="338" height="90" rx="12"/></clipPath>
    <clipPath id="tm03-k4"><rect x="402" y="330" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="tm03-k5"><rect x="871" y="330" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="tm03-k6"><rect x="386" y="540" width="255" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M285,135 L360,135" marker-end="url(#tm03-bl)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M667,135 L840,135" marker-end="url(#tm03-em)"/>
    <path d="M626,375 L871,375" marker-end="url(#tm03-em)"/>
    <path d="M1178,135 H1198 Q1210,135 1210,147 V363 Q1210,375 1198,375 H1147" marker-end="url(#tm03-em)"/>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M514,180 V330" marker-end="url(#tm03-pk)"/>
    <path d="M514,420 V540" marker-end="url(#tm03-pk)"/>
  </g>

  
  <g filter="url(#tm03-soft)">
    <rect x="50" y="90" width="235" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="90" width="6" height="90" fill="#2563EB" clip-path="url(#tm03-k1)"/>
  </g>
  <circle cx="88" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="114" y="142" font-size="18.5" font-weight="600" fill="#111827">Reserve request</text>

  
  <g filter="url(#tm03-soft)">
    <rect x="360" y="90" width="307" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="360" y="90" width="6" height="90" fill="#D97706" clip-path="url(#tm03-k2)"/>
  </g>
  <circle cx="398" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,124.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="424" y="142" font-size="18.5" font-weight="600" fill="#111827">Seats can be reserved?</text>

  
  <g filter="url(#tm03-lift)">
    <rect x="840" y="90" width="338" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="840" y="90" width="9" height="90" fill="#7C3AED" clip-path="url(#tm03-k3)"/>
  </g>
  <circle cx="878" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,124.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="904" y="142" font-size="18.5" font-weight="600" fill="#111827">ActiveReservationsService</text>
  <text x="1009" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">five-minute hold</text>
  <text x="1009" y="228" font-size="15.5" text-anchor="middle" fill="#94A3B8">Status Reserved plus Timestamp, no open lock</text>

  
  <g filter="url(#tm03-soft)">
    <rect x="402" y="330" width="224" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="402" y="330" width="6" height="90" fill="#D97706" clip-path="url(#tm03-k4)"/>
  </g>
  <circle cx="440" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(429.56,364.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="466" y="382" font-size="18.5" font-weight="600" fill="#111827">Wait for them?</text>

  
  <g filter="url(#tm03-soft)">
    <rect x="871" y="330" width="276" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="871" y="330" width="6" height="90" fill="#7C3AED" clip-path="url(#tm03-k5)"/>
  </g>
  <circle cx="909" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(898.56,364.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="935" y="382" font-size="18.5" font-weight="600" fill="#111827">WaitingUsersService</text>
  <text x="1009" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">longest waiter is served first</text>

  
  <g filter="url(#tm03-soft)">
    <rect x="386" y="540" width="255" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="386" y="540" width="6" height="90" fill="#64748B" clip-path="url(#tm03-k6)"/>
  </g>
  <circle cx="424" cy="585" r="18" fill="#FFFFFF"/>
  <g transform="translate(413.56,574.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="450" y="592" font-size="18.5" font-weight="600" fill="#111827">409 to the client</text>

  
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="753" y="127" text-anchor="middle" fill="#047857">yes: track the hold</text>
    <text x="530" y="262" fill="#BE185D">no: seats held by others</text>
    <text x="748" y="367" text-anchor="middle" fill="#047857">yes: first come, first served</text>
    <text x="530" y="487" fill="#BE185D">no: House Full</text>
    <text x="1196" y="262" text-anchor="end" fill="#047857">expiry frees seats,</text>
    <text x="1196" y="285" text-anchor="end" fill="#047857">notify the head</text>
  </g>

  
  <rect x="40" y="666" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="711" text-anchor="middle" font-size="16" fill="#475569">The hold is a status and a timestamp in the Booking table; fairness is the head of a Linked HashMap.</text>
</svg>