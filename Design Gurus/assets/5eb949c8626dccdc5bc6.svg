<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-label="Replication keeps copies of the same data on several machines. Writes go to the primary and flow to the replicas, reads can be spread across them, and a replica can be promoted if the primary dies. Synchronous copying costs latency, asynchronous copying risks stale reads.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="560" fill="#FFFFFF"/>
  <rect x="90" y="95" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="190" y="137" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Writes</text>
  <rect x="385" y="86" width="250" height="88" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="510" y="128" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Primary</text>
  <text x="510" y="153" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">takes every write</text>
  <line x1="292" y1="130" x2="382" y2="130" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <rect x="840" y="27" width="260" height="74" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="970" y="62" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Replica 1</text>
  <text x="970" y="87" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">serves reads</text>
  <path d="M638 120 C 750 120, 750 64, 838 64" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <rect x="840" y="131" width="260" height="74" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="970" y="166" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Replica 2</text>
  <text x="970" y="191" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">serves reads</text>
  <path d="M638 130 C 750 130, 750 168, 838 168" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <rect x="840" y="235" width="260" height="74" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="970" y="270" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Replica 3</text>
  <text x="970" y="295" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">serves reads</text>
  <path d="M638 140 C 750 140, 750 272, 838 272" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <text x="740" y="352" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the primary copies every write to each replica</text>
  <rect x="40" y="236" width="480" height="118" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="272" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">If the primary dies,</text>
  <text x="70" y="302" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a replica is promoted to take its place.</text>
  <text x="70" y="332" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">This is why replication buys availability.</text>
  <rect x="40" y="382" width="570" height="150" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="418" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Synchronous</text>
  <text x="70" y="450" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The write waits for the replicas to confirm.</text>
  <text x="70" y="480" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Costs latency on every write.</text>
  <text x="70" y="510" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Nothing is lost if the primary dies.</text>
  <rect x="630" y="382" width="570" height="150" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="660" y="418" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Asynchronous</text>
  <text x="660" y="450" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The write is acknowledged immediately.</text>
  <text x="660" y="480" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A replica can serve slightly stale data.</text>
  <text x="660" y="510" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A badly timed crash loses recent writes.</text>
</svg>