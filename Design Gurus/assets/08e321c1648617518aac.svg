<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1560" viewBox="0 0 1240 1560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of two buyers racing for seat 14A: both join the sale through the waiting room and are admitted with queue positions. Buyer A&#39;s hold triggers a conditional write that updates one row, so A holds the seat for two minutes. Buyer B&#39;s identical hold triggers the same conditional write, which updates zero rows, so B is told the seat is taken and offered nearby seats.">
  <defs>
    <marker id="m07-l05-seat-race-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l05-seat-race-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l05-seat-race-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l05-seat-race-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1560" fill="#FFFFFF"/>

  <rect x="40" y="250" width="1160" height="320" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="610" width="1160" height="280" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="930" width="1160" height="280" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="130" y1="195" x2="130" y2="1240"/>
    <line x1="350" y1="195" x2="350" y2="1240"/>
    <line x1="590" y1="195" x2="590" y2="1240"/>
    <line x1="850" y1="195" x2="850" y2="1240"/>
    <line x1="1100" y1="195" x2="1100" y2="1240"/>
  </g>

  <rect x="1094" y="750" width="12" height="50" rx="2" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <rect x="1094" y="1070" width="12" height="50" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>

  <g fill="none" stroke-width="2.5">
    <path d="M136,350 L584,350" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-seat-race-bl)"/>
    <path d="M584,410 L136,410" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l05-seat-race-bl)"/>
    <path d="M356,470 L584,470" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-seat-race-bl)"/>
    <path d="M584,530 L356,530" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l05-seat-race-bl)"/>
    <path d="M136,700 L844,700" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-seat-race-bl)"/>
    <path d="M856,750 L1090,750" stroke="#3B82F6" marker-end="url(#m07-l05-seat-race-bl)"/>
    <path d="M1090,800 L856,800" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m07-l05-seat-race-em)"/>
    <path d="M844,850 L136,850" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m07-l05-seat-race-em)"/>
    <path d="M356,1020 L844,1020" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-seat-race-bl)"/>
    <path d="M856,1070 L1090,1070" stroke="#3B82F6" marker-end="url(#m07-l05-seat-race-bl)"/>
    <path d="M1090,1120 L856,1120" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m07-l05-seat-race-rd)"/>
    <path d="M844,1170 L356,1170" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m07-l05-seat-race-rd)"/>
  </g>

  <text x="60" y="292" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Admission: the queue keeps its order</text>
  <text x="1180" y="292" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">about 1,000 buyers a second get through</text>
  <text x="60" y="652" font-size="20" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Buyer A's attempt: the write changes one row</text>
  <text x="1180" y="652" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one write, one row, settled</text>
  <text x="60" y="972" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Buyer B's attempt: the same write changes zero rows</text>
  <text x="1180" y="972" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no lock, no consensus round</text>

  <text x="360" y="338" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. join the sale</text>
  <text x="360" y="398" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. admitted, position 312</text>
  <text x="470" y="458" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. join the sale</text>
  <text x="470" y="518" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. admitted, position 313</text>
  <text x="490" y="688" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. hold seat 14A</text>
  <text x="975" y="738" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. conditional write</text>
  <text x="975" y="788" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">7. 1 row updated</text>
  <text x="490" y="838" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">8. held for 2 minutes</text>
  <text x="600" y="1008" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">9. hold seat 14A</text>
  <text x="975" y="1058" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">10. the same write</text>
  <text x="975" y="1108" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">11. 0 rows updated</text>
  <text x="600" y="1158" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">12. taken, here are nearby seats</text>

  <g filter="url(#m07-l05-seat-race-soft)">
    <rect x="30" y="60" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="130" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Buyer A</text>
  <text x="130" y="148" text-anchor="middle" font-size="20" fill="#64748B">clicks 14A first</text>
  <g filter="url(#m07-l05-seat-race-soft)">
    <rect x="250" y="60" width="200" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="350" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Buyer B</text>
  <text x="350" y="148" text-anchor="middle" font-size="20" fill="#64748B">clicks later</text>
  <g filter="url(#m07-l05-seat-race-soft)">
    <rect x="490" y="60" width="200" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="590" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Waiting room</text>
  <text x="590" y="148" text-anchor="middle" font-size="20" fill="#64748B">issues tokens</text>
  <g filter="url(#m07-l05-seat-race-soft)">
    <rect x="750" y="60" width="200" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="850" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Seat Inventory</text>
  <text x="850" y="148" text-anchor="middle" font-size="20" fill="#64748B">the only writer</text>
  <g filter="url(#m07-l05-seat-race-soft)">
    <rect x="1000" y="60" width="200" height="130" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="1100" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Seat 14A row</text>
  <text x="1100" y="148" text-anchor="middle" font-size="20" fill="#64748B">one row, one writer</text>

  <rect x="40" y="1270" width="1160" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="1318" text-anchor="middle" font-size="20" fill="#065F46">Two buyers, one seat, one row. The database serializes the two attempts.</text>
  <text x="620" y="1356" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1 row updated wins, 0 rows updated loses, and both answers arrive in milliseconds.</text>

  <line x1="60" y1="1440" x2="96" y2="1440" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1447" font-size="20" fill="#475569">A request the buyer is waiting on</text>
  <line x1="60" y1="1480" x2="96" y2="1480" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1487" font-size="20" fill="#475569">The reply: one row changed, the seat is yours</text>
  <line x1="60" y1="1520" x2="96" y2="1520" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1527" font-size="20" fill="#475569">The reply: zero rows changed, the seat was taken</text>
</svg>