<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In CQRS, commands go to a normalized write model and queries go to a denormalized read model kept in sync by a projection, which makes the read side eventually consistent">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="dp4-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="dp4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dp4-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="dp4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One system, two paths that never share a model</text>

  
  <line x1="290" y1="164" x2="386" y2="164" stroke="#3B82F6" stroke-width="2" marker-end="url(#dp4-blue)"/>
  <line x1="626" y1="164" x2="722" y2="164" stroke="#3B82F6" stroke-width="2" marker-end="url(#dp4-blue)"/>

  <g filter="url(#dp4-soft)">
    <rect x="80" y="128" width="210" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="390" y="112" width="236" height="104" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="185" y="172" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Commands</text>
  <text x="508" y="146" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Write model</text>
  <text x="508" y="176" font-size="20" fill="#1E40AF" text-anchor="middle">business rules,</text>
  <text x="508" y="202" font-size="20" fill="#1E40AF" text-anchor="middle">normalized, transactional</text>

  <g filter="url(#dp4-soft)">
    <path d="M726 130 a112 17 0 0 1 224 0 v52 a112 17 0 0 1 -224 0 z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <ellipse cx="838" cy="130" rx="112" ry="17" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="838" y="166" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Write store</text>

  
  <path d="M838 200 L838 268" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#dp4-amber)"/>
  <rect x="858" y="216" width="280" height="30" fill="#FFFFFF"/>
  <text x="856" y="238" font-size="20" font-weight="600" fill="#92400E">events, asynchronously</text>

  <g filter="url(#dp4-soft)">
    <rect x="700" y="276" width="276" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="838" y="308" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Projection</text>
  <text x="838" y="334" font-size="20" fill="#92400E" text-anchor="middle">rebuilds the read shape</text>

  <path d="M838 352 L838 414" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#dp4-amber)"/>

  
  <g filter="url(#dp4-soft)">
    <path d="M726 424 a112 17 0 0 1 224 0 v52 a112 17 0 0 1 -224 0 z" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="838" cy="424" rx="112" ry="17" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="838" y="460" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Read store</text>

  <line x1="722" y1="458" x2="630" y2="458" stroke="#059669" stroke-width="2" marker-end="url(#dp4-emerald)"/>
  <line x1="386" y1="458" x2="294" y2="458" stroke="#059669" stroke-width="2" marker-end="url(#dp4-emerald)"/>

  <g filter="url(#dp4-soft)">
    <rect x="390" y="406" width="236" height="104" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="80" y="422" width="210" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="508" y="440" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read model</text>
  <text x="508" y="470" font-size="20" fill="#065F46" text-anchor="middle">denormalized, no joins,</text>
  <text x="508" y="496" font-size="20" fill="#065F46" text-anchor="middle">indexed for the screen</text>
  <text x="185" y="466" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Queries</text>

  
  <rect x="80" y="546" width="1080" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="576" font-size="20" fill="#475569" text-anchor="middle">Each side scales and is modelled on its own terms. The price is the gap in the middle:</text>
  <text x="620" y="604" font-size="20" fill="#475569" text-anchor="middle">a query issued right after a command can still see the old value.</text>
</svg>