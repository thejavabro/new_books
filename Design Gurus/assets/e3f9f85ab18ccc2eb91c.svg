<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1390" viewBox="0 0 1240 1390" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of the dispatch race: Dispatch offers one order to two driver phones in parallel, both phones send accept to the single assignment row, the first accept commits and the driver is assigned, the second accept is rejected because the order is already taken.">
  <defs>
    <marker id="m07-l03-dispatch-race-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l03-dispatch-race-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l03-dispatch-race-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l03-dispatch-race-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1390" fill="#FFFFFF"/>

  <rect x="40" y="280" width="1160" height="220" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="540" width="1160" height="360" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="165" y1="215" x2="165" y2="910"/>
    <line x1="455" y1="215" x2="455" y2="910"/>
    <line x1="745" y1="215" x2="745" y2="910"/>
    <line x1="1050" y1="215" x2="1050" y2="910"/>
  </g>

  <rect x="1044" y="640" width="12" height="80" rx="2" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <rect x="1044" y="780" width="12" height="80" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>

  <g fill="none" stroke-width="2.5">
    <path d="M171,380 L449,380" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-dispatch-race-bl)"/>
    <path d="M171,450 L739,450" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-dispatch-race-bl)"/>
    <path d="M461,650 L1044,650" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-dispatch-race-bl)"/>
    <path d="M1044,710 L461,710" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m07-l03-dispatch-race-em)"/>
    <path d="M751,790 L1044,790" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-dispatch-race-bl)"/>
    <path d="M1044,850 L751,850" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m07-l03-dispatch-race-rd)"/>
  </g>

  <text x="60" y="320" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Offers fan out in parallel: nothing is locked yet</text>
  <text x="60" y="580" font-size="20" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Commitment is serialized: one row, one writer, the first accept wins</text>

  <text x="310" y="368" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. offer order</text>
  <text x="455" y="438" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. offer order</text>
  <text x="752" y="638" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. accept</text>
  <text x="752" y="698" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. committed and assigned</text>
  <text x="897" y="778" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. accept</text>
  <text x="897" y="838" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. rejected, already taken</text>

  <g filter="url(#m07-l03-dispatch-race-soft)">
    <rect x="40" y="60" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="165" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Dispatch</text>
  <text x="165" y="132" text-anchor="middle" font-size="20" fill="#64748B">matches orders</text>
  <text x="165" y="164" text-anchor="middle" font-size="20" fill="#64748B">to drivers</text>
  <g filter="url(#m07-l03-dispatch-race-soft)">
    <rect x="330" y="60" width="250" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="455" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Driver phone A</text>
  <text x="455" y="148" text-anchor="middle" font-size="20" fill="#64748B">taps accept first</text>
  <g filter="url(#m07-l03-dispatch-race-soft)">
    <rect x="620" y="60" width="250" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="745" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Driver phone B</text>
  <text x="745" y="132" text-anchor="middle" font-size="20" fill="#64748B">taps accept a</text>
  <text x="745" y="164" text-anchor="middle" font-size="20" fill="#64748B">moment later</text>
  <g filter="url(#m07-l03-dispatch-race-soft)">
    <rect x="910" y="60" width="280" height="130" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="1050" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Assignment row</text>
  <text x="1050" y="148" text-anchor="middle" font-size="20" fill="#64748B">one row, one writer</text>

  <g filter="url(#m07-l03-dispatch-race-soft)">
    <rect x="60" y="940" width="540" height="140" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="330" y="985" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fine by design</text>
  <text x="330" y="1017" text-anchor="middle" font-size="20" fill="#64748B">two dispatch instances can offer the</text>
  <text x="330" y="1049" text-anchor="middle" font-size="20" fill="#64748B">same order, because offers are cheap</text>
  <g filter="url(#m07-l03-dispatch-race-soft)">
    <rect x="640" y="940" width="540" height="140" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="910" y="985" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Dispatch is not in the commit path</text>
  <text x="910" y="1017" text-anchor="middle" font-size="20" fill="#64748B">it fans the offers out, then withdraws</text>
  <text x="910" y="1049" text-anchor="middle" font-size="20" fill="#64748B">the loser once the row has committed</text>

  <rect x="40" y="1120" width="1160" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="1165" text-anchor="middle" font-size="20" fill="#065F46">Offers are parallel and cheap. Commitment is serialized and singular.</text>
  <text x="620" y="1200" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One writer, one truth, however many phones raced.</text>

  <line x1="60" y1="1270" x2="96" y2="1270" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1277" font-size="20" fill="#475569">A live request: an offer sent, an accept attempted</text>
  <line x1="60" y1="1310" x2="96" y2="1310" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1317" font-size="20" fill="#475569">The reply that committed the local transaction</text>
  <line x1="60" y1="1350" x2="96" y2="1350" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1357" font-size="20" fill="#475569">The reply that refused: the row was already taken</text>
</svg>