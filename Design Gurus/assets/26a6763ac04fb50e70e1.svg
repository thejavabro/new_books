<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="714" viewBox="0 0 1240 714" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The difference between 412 and 409. A 412 says the condition the caller stated in If-Match is no longer true. A 409 says the input is valid but current product state refuses the action. One request can pass If-Match and still return 409.">
  <defs>
    <filter id="p1g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1g-k1"><rect x="76" y="146" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="p1g-k2"><rect x="76" y="380" width="180" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="714" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">412 and 409 answer different questions</text>

  
  <rect x="40" y="126" width="1160" height="210" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <g filter="url(#p1g-lift)">
    <rect x="76" y="146" width="180" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="76" y="146" width="9" height="90" fill="#D97706" clip-path="url(#p1g-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">412</text>

  <rect x="76" y="250" width="112" height="28" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="132" y="269" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">It means</text>
  <text x="212" y="269" font-size="15.5" fill="#6B7280">Your stated condition is stale</text>

  <rect x="76" y="290" width="112" height="28" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="132" y="309" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Examples</text>
  <text x="212" y="309" font-size="15.5" fill="#6B7280">The If-Match ETag no longer matches, so nothing was applied</text>

  
  <rect x="40" y="360" width="1160" height="210" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <g filter="url(#p1g-lift)">
    <rect x="76" y="380" width="180" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="76" y="380" width="9" height="90" fill="#DB2777" clip-path="url(#p1g-k2)"/>
  </g>
  <circle cx="114" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,414.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="432" font-size="18.5" font-weight="600" fill="#111827">409</text>

  <rect x="76" y="484" width="112" height="28" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="132" y="503" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">It means</text>
  <text x="212" y="503" font-size="15.5" fill="#6B7280">This action conflicts with current state</text>

  <rect x="76" y="524" width="112" height="28" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="132" y="543" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Examples</text>
  <text x="212" y="543" font-size="15.5" fill="#6B7280">Cancel a shipped order, refund above the remaining amount, confirm an expired hold</text>

  
  <rect x="40" y="598" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="643" text-anchor="middle" font-size="16" fill="#475569">A request can carry the current ETag and still return 409, such as cancelling a shipped order.</text>
</svg>