<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1510" viewBox="0 0 1240 1510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A network of five peers linked directly to each other. Advantages: scalable, as capacity grows with more peers; lower cost, using peer resources instead of central servers; high availability with no single point of failure and data replicated across peers; censorship resistance, with no central party to pressure. Limitations: variable performance that depends on which peers are online; hard discovery and search without a central index; data consistency, since global agreement needs slow consensus; security challenges from Sybil, eclipse and poisoning attacks; harder to manage, since unowned peers are hard to debug; and connectivity complexity from NAT traversal and relay fallback">
