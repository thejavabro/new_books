  <text x="728" y="1358" font-size="21.5" font-weight="600" fill="#111827">Connectivity complexity</text>
  <text x="320" y="665" font-size="18.5" text-anchor="middle" fill="#6B7280">Capacity grows as more peers</text>
  <text x="320" y="692" font-size="18.5" text-anchor="middle" fill="#6B7280">join the network.</text>
  <text x="320" y="815" font-size="18.5" text-anchor="middle" fill="#6B7280">Uses resources from peers</text>
  <text x="320" y="842" font-size="18.5" text-anchor="middle" fill="#6B7280">instead of central servers.</text>
  <text x="320" y="965" font-size="18.5" text-anchor="middle" fill="#6B7280">No single point of failure.</text>
  <text x="320" y="992" font-size="18.5" text-anchor="middle" fill="#6B7280">Data is replicated across peers.</text>
  <text x="320" y="1115" font-size="18.5" text-anchor="middle" fill="#6B7280">No central party to pressure into</text>
  <text x="320" y="1142" font-size="18.5" text-anchor="middle" fill="#6B7280">shutting the system down.</text>
  <text x="920" y="665" font-size="18.5" text-anchor="middle" fill="#6B7280">Depends on which peers are online</text>
  <text x="920" y="692" font-size="18.5" text-anchor="middle" fill="#6B7280">and how good their connections are.</text>
  <text x="920" y="815" font-size="18.5" text-anchor="middle" fill="#6B7280">Rich search, filtering, and ranking</text>
  <text x="920" y="842" font-size="18.5" text-anchor="middle" fill="#6B7280">are difficult without a central index.</text>
  <text x="920" y="965" font-size="18.5" text-anchor="middle" fill="#6B7280">Global agreement or transactions</text>
  <text x="920" y="992" font-size="18.5" text-anchor="middle" fill="#6B7280">need slow, costly consensus.</text>
  <text x="920" y="1115" font-size="18.5" text-anchor="middle" fill="#6B7280">More exposed to attacks such as</text>
  <text x="920" y="1142" font-size="18.5" text-anchor="middle" fill="#6B7280">Sybil, eclipse, and poisoning.</text>
  <text x="920" y="1265" font-size="18.5" text-anchor="middle" fill="#6B7280">Thousands of unowned peers are</text>
  <text x="920" y="1292" font-size="18.5" text-anchor="middle" fill="#6B7280">hard to debug and monitor.</text>
  <text x="920" y="1415" font-size="18.5" text-anchor="middle" fill="#6B7280">NAT traversal and relay fallback</text>
  <text x="920" y="1442" font-size="18.5" text-anchor="middle" fill="#6B7280">add engineering effort and cost.</text>

</svg>