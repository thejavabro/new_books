<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Step 1: a user requests tickets for a show, and the request carries the show id. Step 2: the messaging grid routes it to the processing unit that owns the show. Step 3: that unit decrements the seat count and records the reservation in its in-memory data grid atomically. Step 4: the new count and the reservation record are replicated synchronously to its backup unit before the response. Step 5: the user receives a confirmation without waiting for the database. Step 6, later: the unit puts the change on the data pump queue before responding, and the data writers write it to the database asynchronously">
  <defs>
    <filter id="m14h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m14h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m14h-k1"><rect x="56" y="270" width="178" height="80" rx="12"/></clipPath>
    <clipPath id="m14h-k2"><rect x="366" y="270" width="268" height="80" rx="12"/></clipPath>
    <clipPath id="m14h-k3"><rect x="740" y="275" width="180" height="70" rx="12"/></clipPath>
    <clipPath id="m14h-k4"><rect x="936" y="275" width="224" height="70" rx="12"/></clipPath>
    <clipPath id="m14h-k5"><rect x="64" y="600" width="156" height="80" rx="12"/></clipPath>
    <clipPath id="m14h-k6"><rect x="252" y="600" width="146" height="80" rx="12"/></clipPath>
    <clipPath id="m14h-k7"><rect x="655" y="622" width="200" height="56" rx="12"/></clipPath>
    <clipPath id="m14h-k8"><rect x="946" y="630" width="238" height="80" rx="12"/></clipPath>
    <marker id="m14h-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m14h-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m14h-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a ticket reservation flows through space-based architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The owning unit updates memory and its backup, answers the user, and persists to the database later.</text>

  <rect x="40" y="110" width="210" height="260" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Client request</text>
  <rect x="350" y="110" width="300" height="260" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="374" y="140" font-size="19.5" font-weight="600" fill="#5B21B6">2. Route to owner</text>
  <rect x="700" y="110" width="500" height="310" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="724" y="140" font-size="19.5" font-weight="600" fill="#047857">3. Process reservation</text>
  <rect x="724" y="225" width="452" height="136" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="748" y="255" font-size="19.5" font-weight="600" fill="#1D4ED8">Processing unit (for this show)</text>
  <rect x="40" y="480" width="540" height="270" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="510" font-size="19.5" font-weight="600" fill="#B45309">6. Later: asynchronous persistence</text>
  <rect x="610" y="480" width="290" height="270" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="634" y="510" font-size="19.5" font-weight="600" fill="#1D4ED8">4. Replicate to backup</text>
  <rect x="930" y="480" width="270" height="270" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="954" y="510" font-size="19.5" font-weight="600" fill="#1D4ED8">5. Fast response</text>

  <g fill="none" stroke-width="2">
    <path d="M234,310 H366" stroke="#2563EB" marker-end="url(#m14h-m-blue)"/>
    <path d="M634,310 H724" stroke="#2563EB" marker-end="url(#m14h-m-blue)"/>
    <path d="M755,420 V480" stroke="#2563EB" marker-end="url(#m14h-m-blue)"/>
    <path d="M1065,420 V480" stroke="#059669" marker-end="url(#m14h-m-emerald)"/>
    <path d="M700,400 H312 Q300,400 300,412 V480" stroke="#D97706" stroke-dasharray="7 6" marker-end="url(#m14h-m-amber)"/>
    <path d="M220,640 H252" stroke="#D97706" marker-end="url(#m14h-m-amber)"/>
    <path d="M398,640 H428" stroke="#D97706" marker-end="url(#m14h-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="300" y="278" fill="#1D4ED8">Request</text>
    <text x="300" y="300" fill="#1D4ED8">(show_id)</text>
    <text x="1079" y="444" fill="#047857" text-anchor="start">Success</text>
    <text x="1079" y="466" fill="#047857" text-anchor="start">(response)</text>
  </g>

  <g filter="url(#m14h-soft)">
    <rect x="56" y="270" width="178" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="56" y="270" width="6" height="80" fill="#2563EB" clip-path="url(#m14h-k1)"/>
  </g>
  <circle cx="94" cy="310" r="18" fill="#FFFFFF"/>
  <g transform="translate(83.56,299.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="120" y="317" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m14h-soft)">
    <rect x="366" y="270" width="268" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="366" y="270" width="6" height="80" fill="#2563EB" clip-path="url(#m14h-k2)"/>
  </g>
  <circle cx="404" cy="310" r="18" fill="#FFFFFF"/>
  <g transform="translate(393.56,299.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="430" y="304.25" font-size="21.5" font-weight="600" fill="#111827">Messaging</text>
  <text x="430" y="329.75" font-size="21.5" font-weight="600" fill="#111827">grid</text>
  <g filter="url(#m14h-soft)">
    <rect x="740" y="275" width="180" height="70" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="740" y="275" width="6" height="70" fill="#7C3AED" clip-path="url(#m14h-k3)"/>
  </g>
  <text x="760" y="305.75" font-size="18.5" font-weight="600" fill="#111827">Application</text>
  <text x="760" y="328.25" font-size="18.5" font-weight="600" fill="#111827">logic</text>
  <g filter="url(#m14h-soft)">
    <rect x="936" y="275" width="224" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="936" y="275" width="6" height="70" fill="#059669" clip-path="url(#m14h-k4)"/>
  </g>
  <text x="956" y="305.75" font-size="18.5" font-weight="600" fill="#111827">In-memory data grid</text>
  <text x="956" y="328.25" font-size="18.5" font-weight="600" fill="#111827">(seats, reservations)</text>
  <g filter="url(#m14h-soft)">
    <rect x="64" y="600" width="156" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="600" width="6" height="80" fill="#D97706" clip-path="url(#m14h-k5)"/>
  </g>
  <circle cx="102" cy="640" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,629.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="128" y="634.25" font-size="21.5" font-weight="600" fill="#111827">Pump</text>
  <text x="128" y="659.75" font-size="21.5" font-weight="600" fill="#111827">queue</text>
  <g filter="url(#m14h-soft)">
    <rect x="252" y="600" width="146" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="252" y="600" width="6" height="80" fill="#D97706" clip-path="url(#m14h-k6)"/>
  </g>
  <circle cx="290" cy="640" r="18" fill="#FFFFFF"/>
  <g transform="translate(279.56,629.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="316" y="634.25" font-size="21.5" font-weight="600" fill="#111827">Data</text>
  <text x="316" y="659.75" font-size="21.5" font-weight="600" fill="#111827">writers</text>
  <g filter="url(#m14h-soft)">
    <rect x="655" y="622" width="200" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="655" y="622" width="6" height="56" fill="#2563EB" clip-path="url(#m14h-k7)"/>
  </g>
  <circle cx="693" cy="650" r="18" fill="#FFFFFF"/>
  <g transform="translate(682.56,639.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="719" y="657" font-size="18.5" font-weight="600" fill="#111827">Backup unit</text>
  <g filter="url(#m14h-soft)">
    <rect x="946" y="630" width="238" height="80" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="946" y="630" width="6" height="80" fill="#059669" clip-path="url(#m14h-k8)"/>
  </g>
  <circle cx="984" cy="670" r="18" fill="#FFFFFF"/>
  <g transform="translate(973.56,659.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1010" y="677" font-size="21.5" font-weight="600" fill="#111827">Confirmation</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M428,592 L428,674 A56,16 0 0 0 540,674 L540,592" fill="#DBEAFE"/>
    <ellipse cx="484" cy="592" rx="56" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="484" y="648" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">Database</text>
  <text x="484" y="724" font-size="18.5" text-anchor="middle" fill="#6B7280">(durable storage)</text>
  <text x="64" y="168" font-size="18.5" fill="#475569">User requests</text>
  <text x="64" y="194" font-size="18.5" fill="#475569">tickets for a</text>
  <text x="64" y="220" font-size="18.5" fill="#475569">specific show.</text>
  <text x="374" y="168" font-size="18.5" fill="#475569">Messaging grid routes the</text>
  <text x="374" y="194" font-size="18.5" fill="#475569">request to the processing unit</text>
  <text x="374" y="220" font-size="18.5" fill="#475569">that owns this show's data.</text>
  <text x="724" y="168" font-size="18.5" fill="#475569">Processing unit decrements the count and records</text>
  <text x="724" y="194" font-size="18.5" fill="#475569">the reservation in memory atomically.</text>
  <text x="64" y="538" font-size="18.5" fill="#475569">The unit queues the change before responding;</text>
  <text x="64" y="564" font-size="18.5" fill="#475569">data writers write it to the database later.</text>
  <text x="634" y="538" font-size="18.5" fill="#475569">The change is replicated</text>
  <text x="634" y="564" font-size="18.5" fill="#475569">synchronously to its backup</text>
  <text x="634" y="590" font-size="18.5" fill="#475569">unit before the response.</text>
  <text x="954" y="538" font-size="18.5" fill="#475569">User receives confirmation</text>
  <text x="954" y="564" font-size="18.5" fill="#475569">without waiting for the</text>
  <text x="954" y="590" font-size="18.5" fill="#475569">database.</text>
  <text x="755" y="708" font-size="18.5" text-anchor="middle" fill="#6B7280">Replicate count and</text>
  <text x="755" y="731" font-size="18.5" text-anchor="middle" fill="#6B7280">reservation record</text>




</svg>