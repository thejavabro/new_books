<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1660" viewBox="0 0 1240 1660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Flash sale high level design: an API gateway routes to a booking service that publishes to a Kafka transaction queue, an order service consumes it, payment and inventory services own their own stores, inventory sits behind a cache, and a reserved transaction expiry handler releases stock that was never paid for">
  <defs>
    <filter id="fs1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="fs1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="fs1-k1"><rect x="40" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="fs1-k2"><rect x="400" y="150" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="fs1-k3"><rect x="960" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="fs1-k4"><rect x="340" y="380" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs1-k5"><rect x="760" y="380" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs1-k6"><rect x="64" y="680" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs1-k7"><rect x="440" y="680" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs1-k8"><rect x="816" y="680" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs1-k9"><rect x="340" y="1280" width="480" height="90" rx="12"/></clipPath>
    <marker id="fs1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="fs1-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="fs1-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="fs1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="fs1-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1660" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Flash sale: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A million people want a thousand items in the same second. Everything here exists to keep the stock count honest under that.</text>

  <rect x="40" y="620" width="1160" height="236" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="650" font-size="19.5" font-weight="600" fill="#1D4ED8">Services, each owning its own store</text>
  <rect x="100" y="900" width="1100" height="306" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="124" y="930" font-size="19.5" font-weight="600" fill="#475569">Stores</text>

  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#fs1-m-blue)"/>
    <path d="M1080,150 V132 Q1080,120 1068,120 H172 Q160,120 160,132 V144" stroke="#D97706" marker-end="url(#fs1-m-amber)"/>
    <path d="M510,312 V374" stroke="#2563EB" stroke-width="2.5" marker-end="url(#fs1-m-blue)"/>
    <path d="M680,425 H754" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#fs1-m-violet)"/>
    <path d="M930,515 V614" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#fs1-m-violet)"/>
    <path d="M240,856 V954" stroke="#64748B" stroke-width="2.5" marker-end="url(#fs1-m-slate)"/>
    <path d="M1060,1095 V1250 Q1060,1262 1048,1262 H832" stroke="#DB2777" marker-end="url(#fs1-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="336" y="183" fill="#1D4ED8">HTTPS</text>
    <text x="620" y="110" fill="#B45309">the sale page, cached hard</text>
    <text x="650" y="345" fill="#1D4ED8">one click, one message</text>
    <text x="717" y="404" fill="#5B21B6">buffer</text>
    <text x="1060" y="578" fill="#5B21B6">consumed in order</text>
    <text x="380" y="886" fill="#475569">reads and writes</text>
    <text x="980" y="1240" fill="#BE185D">reads expired reservations</text>
  </g>

  <g filter="url(#fs1-soft)">
    <rect x="40" y="150" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#fs1-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web and app</text>
  <g filter="url(#fs1-lift)">
    <rect x="400" y="150" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="400" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#fs1-k2)"/>
  </g>
  <circle cx="438" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="464" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="540" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">the first place to shed load</text>
  <g filter="url(#fs1-soft)">
    <rect x="960" y="150" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="960" y="150" width="6" height="90" fill="#D97706" clip-path="url(#fs1-k3)"/>
  </g>
  <circle cx="998" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(987.56,184.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="1024" y="202" font-size="21.5" font-weight="600" fill="#111827">CDN</text>
  <text x="1080" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">the sale page itself</text>
  <g filter="url(#fs1-soft)">
    <rect x="340" y="380" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="380" width="6" height="90" fill="#2563EB" clip-path="url(#fs1-k4)"/>
  </g>
  <circle cx="378" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,414.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="404" y="432" font-size="21.5" font-weight="600" fill="#111827">Booking service</text>
  <text x="510" y="499" font-size="18.5" text-anchor="middle" fill="#6B7280">takes the click, reserves stock</text>
  <g filter="url(#fs1-soft)">
    <rect x="760" y="380" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="760" y="380" width="6" height="90" fill="#7C3AED" clip-path="url(#fs1-k5)"/>
  </g>
  <circle cx="798" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,414.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="824" y="432" font-size="21.5" font-weight="600" fill="#111827">Transaction queue</text>
  <text x="930" y="499" font-size="18.5" text-anchor="middle" fill="#6B7280">Kafka, the buffer that saves you</text>
  <g filter="url(#fs1-soft)">
    <rect x="64" y="680" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="680" width="6" height="90" fill="#2563EB" clip-path="url(#fs1-k6)"/>
  </g>
  <circle cx="102" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,714.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="128" y="732" font-size="21.5" font-weight="600" fill="#111827">Order service</text>
  <text x="234" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">turns a reservation into an order</text>
  <g filter="url(#fs1-soft)">
    <rect x="440" y="680" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="680" width="6" height="90" fill="#2563EB" clip-path="url(#fs1-k7)"/>
  </g>
  <circle cx="478" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,714.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="504" y="732" font-size="21.5" font-weight="600" fill="#111827">Payment service</text>
  <text x="610" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">charges, or does not</text>
  <g filter="url(#fs1-soft)">
    <rect x="816" y="680" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="816" y="680" width="6" height="90" fill="#2563EB" clip-path="url(#fs1-k8)"/>
  </g>
  <circle cx="854" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(843.56,714.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="880" y="732" font-size="21.5" font-weight="600" fill="#111827">Inventory service</text>
  <text x="986" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">the one true stock count</text>
  <g filter="url(#fs1-lift)">
    <rect x="340" y="1280" width="480" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="340" y="1280" width="9" height="90" fill="#DB2777" clip-path="url(#fs1-k9)"/>
  </g>
  <circle cx="378" cy="1325" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,1314.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="404" y="1332" font-size="21.5" font-weight="600" fill="#111827">Reserved expiry handler</text>
  <text x="580" y="1399" font-size="18.5" text-anchor="middle" fill="#6B7280">releases stock nobody paid for</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M124,960 L124,1034 A116.5,16 0 0 0 357,1034 L357,960" fill="#E0E7FF"/>
    <ellipse cx="240.5" cy="960" rx="116.5" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="240.5" y="1012" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Orders</text>
  <text x="240.5" y="1084" font-size="18.5" text-anchor="middle" fill="#6B7280">one row per order</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M397,960 L397,1034 A116.5,16 0 0 0 630,1034 L630,960" fill="#D1FAE5"/>
    <ellipse cx="513.5" cy="960" rx="116.5" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="513.5" y="1012" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Payments</text>
  <text x="513.5" y="1084" font-size="18.5" text-anchor="middle" fill="#6B7280">one row per charge</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M670,960 L670,1034 A116.5,16 0 0 0 903,1034 L903,960" fill="#FEF3C7"/>
    <ellipse cx="786.5" cy="960" rx="116.5" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="786.5" y="1012" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Inventory</text>
  <text x="786.5" y="1084" font-size="18.5" text-anchor="middle" fill="#6B7280">stock, behind a cache</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M943,960 L943,1034 A116.5,16 0 0 0 1176,1034 L1176,960" fill="#E2E8F0"/>
    <ellipse cx="1059.5" cy="960" rx="116.5" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="1059.5" y="1012" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Reservations</text>
  <text x="1059.5" y="1084" font-size="18.5" text-anchor="middle" fill="#6B7280">one row per hold</text>

  <rect x="40" y="1420" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1445" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1470" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Reserve, then pay</text>
  <text x="323" y="1470" font-size="18.5" fill="#475569">stock is held the moment the click lands, and released if payment never arrives</text>
  <rect x="64" y="1495" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1520" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">The queue is the shock absorber</text>
  <text x="323" y="1520" font-size="18.5" fill="#475569">the sale opens, the queue grows, and nothing behind it ever sees the spike</text>
  <rect x="64" y="1545" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="1570" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">One counter, one owner</text>
  <text x="323" y="1570" font-size="18.5" fill="#475569">only the inventory service decrements stock, or you oversell within a second</text>
</svg>