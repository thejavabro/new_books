<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Retry and circuit breaker doing two different jobs on the same call path: the retry handles the brief failure, and the breaker stops the retries once the failure stops being brief">
  <defs>
    <marker id="rt4-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="rt4-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="rt4-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <clipPath id="rt4-k1"><rect x="72" y="130" width="258" height="72" rx="12"/></clipPath>
    <clipPath id="rt4-k2"><rect x="388" y="130" width="320" height="72" rx="12"/></clipPath>
    <clipPath id="rt4-k3"><rect x="776" y="130" width="320" height="72" rx="12"/></clipPath>
    <clipPath id="rt4-k4"><rect x="388" y="320" width="320" height="76" rx="12"/></clipPath>
    <clipPath id="rt4-k5"><rect x="776" y="320" width="320" height="76" rx="12"/></clipPath>
    <filter id="rt4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rt4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="610" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="230" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">Both sit on the same call, in this order</text>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M330,166 H388" marker-end="url(#rt4-mslate)"/>
    <path d="M718,166 H776" marker-end="url(#rt4-mslate)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M548,202 V314" marker-end="url(#rt4-memerald)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="652" y="264" fill="#047857">a few attempts</text>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M936,202 V314" marker-end="url(#rt4-mpink)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="1052" y="264" fill="#BE185D">then stop entirely</text>
  </g>
  <g filter="url(#rt4-soft)">
    <rect x="72" y="130" width="258" height="72" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="130" width="6" height="72" fill="#2563EB" clip-path="url(#rt4-k1)"/>
  </g>
  <circle cx="110" cy="166" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,155.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="173" font-size="18.5" font-weight="600" fill="#111827">The Caller</text>
  <g filter="url(#rt4-soft)">
    <rect x="388" y="130" width="320" height="72" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="388" y="130" width="6" height="72" fill="#059669" clip-path="url(#rt4-k2)"/>
  </g>
  <circle cx="426" cy="166" r="18" fill="#FFFFFF"/>
  <g transform="translate(415.56,155.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="452" y="173" font-size="18.5" font-weight="600" fill="#111827">Retry</text>
  <g filter="url(#rt4-soft)">
    <rect x="776" y="130" width="320" height="72" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="776" y="130" width="6" height="72" fill="#DB2777" clip-path="url(#rt4-k3)"/>
  </g>
  <circle cx="814" cy="166" r="18" fill="#FFFFFF"/>
  <g transform="translate(803.56,155.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="840" y="173" font-size="18.5" font-weight="600" fill="#111827">Circuit Breaker</text>
  <g filter="url(#rt4-soft)">
    <rect x="388" y="320" width="320" height="76" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="388" y="320" width="6" height="76" fill="#059669" clip-path="url(#rt4-k4)"/>
  </g>
  <circle cx="426" cy="358" r="18" fill="#FFFFFF"/>
  <g transform="translate(415.56,347.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="452" y="365" font-size="18.5" font-weight="600" fill="#111827">Handles a Brief Failure</text>
  <g filter="url(#rt4-soft)">
    <rect x="776" y="320" width="320" height="76" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="776" y="320" width="6" height="76" fill="#DB2777" clip-path="url(#rt4-k5)"/>
  </g>
  <circle cx="814" cy="358" r="18" fill="#FFFFFF"/>
  <g transform="translate(803.56,347.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="840" y="365" font-size="18.5" font-weight="600" fill="#111827">Handles a Real Outage</text>
  <rect x="40" y="440" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="464" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="486" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The retry</text>
  <text x="288" y="486" font-size="15.5" fill="#475569">assumes the cause passes, so it waits and tries again a small number of times</text>
  <rect x="64" y="508" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="530" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The breaker</text>
  <text x="288" y="530" font-size="15.5" fill="#475569">counts the failures that remain and stops the calls once retrying is only waste</text>
</svg>