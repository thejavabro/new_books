<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="mistakes-title mistakes-desc">
<title id="mistakes-title">The four expensive mistakes</title>
<desc id="mistakes-desc">Moving data that need not move, buying peak capacity permanently, letting observability scale with traffic without a cap, and choosing a managed service for a workload that does not need one. All four are design decisions rather than operational ones.</desc>
<defs>
<marker id="mistakes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="mistakes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="mistakes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="mistakes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="702" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The four expensive mistakes</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four patterns account for most of the surprise in a cloud bill.</text>
<rect x="40" y="624" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="624" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="560" height="176" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V288A6 6 0 0 0 46 294H54Z" fill="#F28B9D"/>
<circle cx="94" cy="172" r="21" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="94" y="180" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="128" y="180" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Moving data you need not move</text>
<text x="128" y="218" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cross-zone chatter, data pulled to a service</text><text x="128" y="243" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than processed where it sits, responses</text><text x="128" y="268" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">larger than the client uses</text>
<rect x="640" y="118" width="560" height="176" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V288A6 6 0 0 0 646 294H654Z" fill="#F3CF6A"/>
<circle cx="694" cy="172" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="694" y="180" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="728" y="180" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Buying peak capacity permanently</text>
<text x="728" y="218" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">peak at four times average with a fixed fleet</text><text x="728" y="243" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">leaves three quarters idle most of the time</text>
<rect x="40" y="314" width="560" height="176" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 314H46A6 6 0 0 0 40 320V484A6 6 0 0 0 46 490H54Z" fill="#AC8BE8"/>
<circle cx="94" cy="368" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="94" y="376" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="128" y="376" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Observability without a cap</text>
<text x="128" y="414" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the cost of logging every request grows exactly</text><text x="128" y="439" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">as fast as success does</text>
<rect x="640" y="314" width="560" height="176" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 314H646A6 6 0 0 0 640 320V484A6 6 0 0 0 646 490H654Z" fill="#5EC9EC"/>
<circle cx="694" cy="368" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="694" y="376" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="728" y="376" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">A managed service that is not needed</text>
<text x="728" y="414" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">worth the premium for your transactional</text><text x="728" y="439" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">database, harder to justify for a queue moving</text><text x="728" y="464" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a hundred messages an hour</text>
<rect x="40" y="514" width="1160" height="84" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="514" width="5" height="84" rx="2.5" fill="#39D5AA"/><text x="64" y="548.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">All four are architectural rather than operational.</text><text x="64" y="575.5" font-size="20" font-weight="400" fill="#169B77" text-anchor="start">They are visible in a design review and invisible in a code review, which is why they survive.</text>
<text x="66" y="658" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Transfer cost is proportional to bytes and to distance, and both are design choices.</text>
</svg>