    <marker id="rddk-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="902" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Reddit style platform: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Users make content, votes rank it, and what comes back is a feed, not a list.</text>

  <g fill="none" stroke-width="2">
    <path d="M230,335 H340" stroke="#2563EB" marker-end="url(#rddk-bl)"/>
    <path d="M230,365 H278 Q290,365 290,377 V513 Q290,525 302,525 H340" stroke="#2563EB" marker-end="url(#rddk-bl)"/>
    <path d="M555,310 V230" stroke="#D97706" marker-end="url(#rddk-am)"/>
    <path d="M580,335 H680" stroke="#7C3AED" marker-end="url(#rddk-vi)"/>
    <path d="M580,505 H680" stroke="#64748B" marker-end="url(#rddk-sl)"/>
    <path d="M680,545 H638 Q626,545 626,533 V392 Q626,380 614,380 H580" stroke="#64748B" marker-end="url(#rddk-sl)"/>
    <path d="M905,230 V310" stroke="#059669" marker-end="url(#rddk-em)"/>
    <path d="M1000,545 H988 Q976,545 976,557 V648 Q976,660 964,660 H32 Q20,660 20,648 V367 Q20,355 32,355 H40" stroke="#DB2777" stroke-width="2.5" marker-end="url(#rddk-pk)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="285" y="322" fill="#1D4ED8">creates</text>
    <text x="293" y="450" fill="#1D4ED8">replies</text>
    <text x="615" y="272" fill="#B45309">belongs to</text>
    <text x="630" y="322" fill="#5B21B6">ranked</text>
    <text x="630" y="492" fill="#475569">voted on</text>
    <text x="628" y="440" fill="#475569">sets score</text>
    <text x="978" y="272" fill="#047857">shapes the feed</text>
    <text x="560" y="652" fill="#BE185D">alerts on replies and new content</text>
  </g>

  
  <g filter="url(#rddk-lift)">
    <rect x="40" y="310" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="40" y="310" width="9" height="90" fill="#2563EB" clip-path="url(#rddk-k1)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="104" y="362" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="135" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">account and profile</text>
  <text x="135" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">creates, votes, follows</text>

  
  <g filter="url(#rddk-soft)">
    <rect x="340" y="140" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="340" y="140" width="6" height="90" fill="#D97706" clip-path="url(#rddk-k2)"/>
  </g>
  <circle cx="378" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="404" y="192" font-size="21.5" font-weight="600" fill="#111827">Subreddit</text>
  <text x="460" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">topic community</text>
  <text x="460" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">own rules, own mods</text>

  
  <g filter="url(#rddk-soft)">
    <rect x="340" y="310" width="240" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="340" y="310" width="6" height="90" fill="#4F46E5" clip-path="url(#rddk-k3)"/>
  </g>
  <circle cx="378" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,344.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="404" y="362" font-size="21.5" font-weight="600" fill="#111827">Post</text>
  <text x="460" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">text, image, link or video</text>
  <text x="460" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">title, author, time, score</text>

  
  <g filter="url(#rddk-soft)">
    <rect x="340" y="480" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="340" y="480" width="6" height="90" fill="#059669" clip-path="url(#rddk-k4)"/>
  </g>
  <circle cx="378" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,514.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="404" y="532" font-size="21.5" font-weight="600" fill="#111827">Comment</text>
  <text x="460" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">nested under a post</text>
  <text x="460" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">or under another comment</text>

  
  <g filter="url(#rddk-soft)">
    <rect x="680" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
