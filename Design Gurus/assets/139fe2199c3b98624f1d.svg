      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rddk-k1"><rect x="40" y="310" width="190" height="90" rx="12"/></clipPath>
