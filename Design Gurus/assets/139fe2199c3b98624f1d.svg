  </g>
  <circle cx="718" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="744" y="192" font-size="21.5" font-weight="600" fill="#111827">Subscriptions</text>
  <text x="805" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">your subscriptions</text>
  <text x="805" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">and users followed</text>

  
  <g filter="url(#rddk-soft)">
    <rect x="680" y="310" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="680" y="310" width="6" height="90" fill="#7C3AED" clip-path="url(#rddk-k6)"/>
  </g>
  <circle cx="718" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,344.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="744" y="362" font-size="21.5" font-weight="600" fill="#111827">Feed</text>
  <text x="830" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">personalized home page</text>
  <text x="830" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">ranked by score and age</text>

  
  <g filter="url(#rddk-soft)">
    <rect x="680" y="480" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="680" y="480" width="6" height="90" fill="#64748B" clip-path="url(#rddk-k7)"/>
  </g>
  <circle cx="718" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,514.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 10l6-6 6 6"/><path d="M6 14l6 6 6-6"/>
  </g>
  <text x="744" y="532" font-size="21.5" font-weight="600" fill="#111827">Vote</text>
  <text x="780" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">upvote or downvote</text>
  <text x="780" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">one per user per item</text>

  
  <g filter="url(#rddk-soft)">
    <rect x="1000" y="480" width="200" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="1000" y="480" width="6" height="90" fill="#DB2777" clip-path="url(#rddk-k8)"/>
  </g>
  <circle cx="1038" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,514.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="1064" y="532" font-size="21.5" font-weight="600" fill="#111827">Notification</text>
  <text x="1100" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">real time, in-app or push</text>
  <text x="1100" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">what brings the user back</text>

  
  <rect x="40" y="700" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="722" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="745" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Score</text>
  <text x="323" y="745" font-size="18.5" fill="#475569">votes minus downvotes, decayed by age, which is what ranking actually sorts on</text>

  <rect x="64" y="766" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="789" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Nested thread</text>
  <text x="323" y="789" font-size="18.5" fill="#475569">a comment points at a post or at a parent comment, so replies form a tree</text>

  <rect x="64" y="810" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="833" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Fan out</text>
  <text x="323" y="833" font-size="18.5" fill="#475569">a popular post reaches millions of feeds, which is the hard part of this design</text>
</svg>