<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities and flow for a Reddit style platform: a user creates posts inside a subreddit and comments on them, votes set the score, subscriptions and follows shape the ranked feed, and notifications bring the user back">
