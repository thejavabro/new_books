<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Capacity estimation for a reminder service: 10 million daily users, about 10 reminders each, and roughly one trigger a day per reminder; giving 100 million stored reminders, 100 million alerts a day, and about 1,157 a second on average with far larger peaks">
  <defs>
    <filter id="rmes-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rmes-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rmes-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rmes-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rmes-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rmes-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rmes-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rmes-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Reminder alert system: capacity estimation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A gentle average with a sharp shape, because people set reminders on the hour.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">What we assume</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">What follows from it</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#rmes-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#rmes-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">10M daily users</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">planning for tens of</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">millions over time</text>
  <g filter="url(#rmes-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#rmes-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">10 reminders each</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">an upper bound, since many</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">users have far fewer</text>
  <g filter="url(#rmes-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#64748B" clip-path="url(#rmes-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">One trigger a day</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">averaged across hourly,</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">daily and weekly rules</text>
  <g filter="url(#rmes-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#D97706" clip-path="url(#rmes-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">100M reminders</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">stored and scheduled at</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">any one time</text>
  <g filter="url(#rmes-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#059669" clip-path="url(#rmes-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">100M alerts a day</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">the order of magnitude</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">that matters, not the digit</text>
  <g filter="url(#rmes-lift)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="820" y="430" width="9" height="90" fill="#DB2777" clip-path="url(#rmes-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">1,157 a second</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">on average, with sharp</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">peaks on the hour</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Clustered</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">reminders are set at round times, so 9 AM in one region is a spike, not a share of the average</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Order of magnitude</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">the lesson lands on 10^8 a day, and pinning it tighter would not change a single design choice</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Design for the peak</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">a scheduler sized for 1,157 a second fails at 9 AM, which is the moment users actually judge it</text>
</svg>