<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Customer app calls list_items, Orders calls get_item and the Restaurant app calls mark_sold_out. These three operations form the interface of the Menu module. Behind them, hidden from every caller, sit the availability rules, a popular-items cache, the spreadsheet import code and 9 PostgreSQL tables.">
  <defs>
    <filter id="mf02b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mf02b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mf02b-k1"><rect x="40" y="220" width="250" height="56" rx="12"/></clipPath>
    <clipPath id="mf02b-k2"><rect x="40" y="300" width="250" height="56" rx="12"/></clipPath>
    <clipPath id="mf02b-k3"><rect x="40" y="380" width="250" height="56" rx="12"/></clipPath>
    <clipPath id="mf02b-k4"><rect x="374" y="220" width="290" height="56" rx="12"/></clipPath>
    <clipPath id="mf02b-k5"><rect x="374" y="300" width="290" height="56" rx="12"/></clipPath>
    <clipPath id="mf02b-k6"><rect x="374" y="380" width="290" height="56" rx="12"/></clipPath>
    <clipPath id="mf02b-k7"><rect x="738" y="220" width="250" height="56" rx="12"/></clipPath>
    <clipPath id="mf02b-k8"><rect x="738" y="300" width="250" height="56" rx="12"/></clipPath>
    <clipPath id="mf02b-k9"><rect x="738" y="380" width="250" height="56" rx="12"/></clipPath>
    <marker id="mf02b-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="mf02b-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A narrow interface in front of hidden internals</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Callers reach the Menu module through 3 operations; Menu&#39;s owners change everything behind them alone.</text>

  <rect x="330" y="120" width="870" height="360" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="354" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Menu module boundary</text>
  <rect x="354" y="170" width="330" height="290" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="378" y="200" font-size="19.5" font-weight="600" fill="#047857">Interface: 3 operations</text>
  <rect x="714" y="170" width="462" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="738" y="200" font-size="19.5" font-weight="600" fill="#475569">Hidden internals</text>

  <g fill="none" stroke-width="2">
    <path d="M290,248 H374" stroke="#2563EB" marker-end="url(#mf02b-m-blue)"/>
    <path d="M290,328 H374" stroke="#2563EB" marker-end="url(#mf02b-m-blue)"/>
    <path d="M290,408 H374" stroke="#2563EB" marker-end="url(#mf02b-m-blue)"/>
    <path d="M684,328 H714" stroke="#64748B" marker-end="url(#mf02b-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#mf02b-soft)">
    <rect x="40" y="220" width="250" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="40" y="220" width="6" height="56" fill="#4F46E5" clip-path="url(#mf02b-k1)"/>
  </g>
  <text x="60" y="255" font-size="18.5" font-weight="600" fill="#111827">Customer app</text>
  <g filter="url(#mf02b-soft)">
    <rect x="40" y="300" width="250" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="300" width="6" height="56" fill="#2563EB" clip-path="url(#mf02b-k2)"/>
  </g>
  <text x="60" y="335" font-size="18.5" font-weight="600" fill="#111827">Orders</text>
  <g filter="url(#mf02b-soft)">
    <rect x="40" y="380" width="250" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="40" y="380" width="6" height="56" fill="#4F46E5" clip-path="url(#mf02b-k3)"/>
  </g>
  <text x="60" y="415" font-size="18.5" font-weight="600" fill="#111827">Restaurant app</text>
  <g filter="url(#mf02b-soft)">
    <rect x="374" y="220" width="290" height="56" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="374" y="220" width="6" height="56" fill="#059669" clip-path="url(#mf02b-k4)"/>
  </g>
  <text x="394" y="255" font-size="18.5" font-weight="600" fill="#111827">list_items(restaurant_id)</text>
  <g filter="url(#mf02b-soft)">
    <rect x="374" y="300" width="290" height="56" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="374" y="300" width="6" height="56" fill="#059669" clip-path="url(#mf02b-k5)"/>
  </g>
  <text x="394" y="335" font-size="18.5" font-weight="600" fill="#111827">get_item(item_id)</text>
  <g filter="url(#mf02b-soft)">
    <rect x="374" y="380" width="290" height="56" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="374" y="380" width="6" height="56" fill="#059669" clip-path="url(#mf02b-k6)"/>
  </g>
  <text x="394" y="415" font-size="18.5" font-weight="600" fill="#111827">mark_sold_out(item_id)</text>
  <g filter="url(#mf02b-soft)">
    <rect x="738" y="220" width="250" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="738" y="220" width="6" height="56" fill="#64748B" clip-path="url(#mf02b-k7)"/>
  </g>
  <text x="758" y="255" font-size="18.5" font-weight="600" fill="#111827">Availability rules</text>
  <g filter="url(#mf02b-soft)">
    <rect x="738" y="300" width="250" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="738" y="300" width="6" height="56" fill="#64748B" clip-path="url(#mf02b-k8)"/>
  </g>
  <text x="758" y="335" font-size="18.5" font-weight="600" fill="#111827">Popular-items cache</text>
  <g filter="url(#mf02b-soft)">
    <rect x="738" y="380" width="250" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="738" y="380" width="6" height="56" fill="#64748B" clip-path="url(#mf02b-k9)"/>
  </g>
  <text x="758" y="415" font-size="18.5" font-weight="600" fill="#111827">Spreadsheet import</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M1012,262 L1012,356 A70,16 0 0 0 1152,356 L1152,262" fill="#DBEAFE"/>
    <ellipse cx="1082" cy="262" rx="70" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1082" y="311.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
  <text x="1082" y="336.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">tables</text>
  <text x="1082" y="406" font-size="18.5" text-anchor="middle" fill="#6B7280">PostgreSQL</text>



  <rect x="40" y="520" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="545" width="220" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="174" y="570" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Interface</text>
  <text x="313" y="570" font-size="18.5" fill="#475569">every caller may depend on it, so changing it needs the callers to agree</text>
  <rect x="64" y="595" width="220" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="174" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Hidden internals</text>
  <text x="313" y="620" font-size="18.5" fill="#475569">about 37 functions and 9 tables that Menu&#39;s owners change alone</text>
  <rect x="64" y="645" width="220" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="174" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Boundary</text>
  <text x="313" y="670" font-size="18.5" fill="#475569">no caller opens a connection to the Menu tables</text>
</svg>