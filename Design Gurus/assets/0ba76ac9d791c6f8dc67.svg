<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1240" viewBox="0 0 1240 1240" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The life of one message: Chat assigns a number and commits, giving the sequenced state; if the registry finds a live connection it becomes pushed, and if the recipient is offline it waits queued in the durable inbox until the recipient reconnects and catches up; a push with no ack is pushed again, a dropped push or closed connection returns to queued, a device ack makes it delivered, and the user opening the conversation makes it read.">
  <defs>
    <marker id="m07-l07-message-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l07-message-states-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l07-message-states-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l07-message-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l07-message-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l07-message-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1240" fill="#FFFFFF"/>

  <g filter="url(#m07-l07-message-states-soft)">
    <rect x="60" y="330" width="280" height="130" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="200" y="386" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">sequenced</text>
  <text x="200" y="418" text-anchor="middle" font-size="20" fill="#64748B">the number is assigned</text>
  <g filter="url(#m07-l07-message-states-soft)">
    <rect x="440" y="330" width="280" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="580" y="386" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">pushed</text>
  <text x="580" y="418" text-anchor="middle" font-size="20" fill="#64748B">sent over a live socket</text>
  <g filter="url(#m07-l07-message-states-soft)">
    <rect x="820" y="330" width="280" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="960" y="386" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">delivered</text>
  <text x="960" y="418" text-anchor="middle" font-size="20" fill="#64748B">the device acked it</text>
  <g filter="url(#m07-l07-message-states-soft)">
    <rect x="820" y="600" width="280" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="960" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">read</text>
  <text x="960" y="688" text-anchor="middle" font-size="20" fill="#64748B">the user opened it</text>
  <g filter="url(#m07-l07-message-states-soft)">
    <rect x="440" y="600" width="280" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="580" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">queued</text>
  <text x="580" y="688" text-anchor="middle" font-size="20" fill="#64748B">waiting in the inbox</text>

  <g fill="none" stroke-width="2.5">
    <path d="M200,290 L200,322" stroke="#475569" stroke-width="2" marker-end="url(#m07-l07-message-states-sl)"/>
    <path d="M340,395 L432,395" stroke="#3B82F6" marker-end="url(#m07-l07-message-states-bl)"/>
    <path d="M720,395 L812,395" stroke="#059669" stroke-width="2" marker-end="url(#m07-l07-message-states-em)"/>
    <path d="M960,460 L960,592" stroke="#059669" stroke-width="2" marker-end="url(#m07-l07-message-states-em)"/>
    <path d="M200,460 C200,545 380,565 432,620" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-message-states-ab)"/>
    <path d="M520,460 L520,592" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l07-message-states-rd)"/>
    <path d="M640,600 L640,468" stroke="#059669" stroke-width="2" marker-end="url(#m07-l07-message-states-em)"/>
    <path d="M480,322 L480,270 L620,270 L620,314" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-message-states-ab)"/>
  </g>

  <circle cx="200" cy="280" r="12" fill="#475569"/>

  <text x="60" y="240" font-size="20" fill="#64748B">Chat assigns the number</text>
  <text x="600" y="232" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">re-push after no ack, so the client dedupes</text>
  <text x="386" y="292" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the registry finds</text>
  <text x="386" y="320" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a live connection</text>
  <text x="766" y="306" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the device acks it</text>
  <text x="980" y="530" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the user opens it</text>
  <text x="240" y="545" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the recipient is offline</text>
  <text x="540" y="540" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the push is dropped</text>
  <text x="660" y="578" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reconnects and catches up</text>

  <g filter="url(#m07-l07-message-states-soft)">
    <rect x="60" y="830" width="360" height="180" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="240" y="879" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The inbox is written first</text>
  <text x="240" y="911" text-anchor="middle" font-size="20" fill="#475569">before any push, so an offline</text>
  <text x="240" y="943" text-anchor="middle" font-size="20" fill="#475569">or dropped recipient just waits</text>
  <text x="240" y="975" text-anchor="middle" font-size="20" fill="#475569">there until it reconnects.</text>
  <g filter="url(#m07-l07-message-states-soft)">
    <rect x="440" y="830" width="360" height="180" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="620" y="879" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Every failure is the same</text>
  <text x="620" y="911" text-anchor="middle" font-size="20" fill="#475569">A dropped push, a closed socket,</text>
  <text x="620" y="943" text-anchor="middle" font-size="20" fill="#475569">a dead node: the message is still</text>
  <text x="620" y="975" text-anchor="middle" font-size="20" fill="#475569">stored, so the client catches up.</text>
  <g filter="url(#m07-l07-message-states-soft)">
    <rect x="820" y="830" width="380" height="180" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="1010" y="879" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Bound the outbound buffer</text>
  <text x="1010" y="911" text-anchor="middle" font-size="20" fill="#475569">An unbounded one is how a single</text>
  <text x="1010" y="943" text-anchor="middle" font-size="20" fill="#475569">slow socket takes a node down. On</text>
  <text x="1010" y="975" text-anchor="middle" font-size="20" fill="#475569">overflow, drop and close.</text>

  <line x1="60" y1="1080" x2="96" y2="1080" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1087" font-size="20" fill="#475569">The live path: a registry hit, then the push</text>
  <line x1="60" y1="1120" x2="96" y2="1120" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1127" font-size="20" fill="#475569">Success and recovery: acked, read, caught up</text>
  <line x1="60" y1="1160" x2="96" y2="1160" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1167" font-size="20" fill="#475569">Offline, or the same message pushed again</text>
  <line x1="60" y1="1200" x2="96" y2="1200" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1207" font-size="20" fill="#475569">The push did not land</text>
</svg>