<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for an email service: send and receive over SMTP with attachments and spam filtering; and group messages into threads, search them quickly, and keep every device in sync">
  <defs>
    <filter id="gmlf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="gmlf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="gmlf-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gmlf-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gmlf-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gmlf-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gmlf-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="gmlf-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Email service: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the system has to do. Split into moving mail, and making a mailbox usable once the mail is there.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Moving mail in and out</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">Making a mailbox usable</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#gmlf-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#64748B" clip-path="url(#gmlf-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Send and receive</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">SMTP out, IMAP, POP3</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">and web clients in</text>
  <g filter="url(#gmlf-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#D97706" clip-path="url(#gmlf-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Attachments</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">about 25 MB out, more in,</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">stored apart from the body</text>
  <g filter="url(#gmlf-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#DB2777" clip-path="url(#gmlf-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Spam filtering</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">checked on the way in,</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">without adding delay</text>
  <g filter="url(#gmlf-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#4F46E5" clip-path="url(#gmlf-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Threading</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">replies grouped into one</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">conversation view</text>
  <g filter="url(#gmlf-lift)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="450" y="430" width="9" height="90" fill="#059669" clip-path="url(#gmlf-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Search</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">by keyword, sender or date,</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">as fast as a web search</text>
  <g filter="url(#gmlf-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#gmlf-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Real-time sync</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">read it on one device and</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">it is read on all of them</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Thread</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">messages sharing a conversation id, which is why every reply has to carry a reference to the original</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Index</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">search cannot scan mailboxes on demand, so subjects, bodies and metadata are indexed as mail arrives</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Attachment store</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">kept out of the message body so a large file does not slow down every read of that mailbox</text>
</svg>