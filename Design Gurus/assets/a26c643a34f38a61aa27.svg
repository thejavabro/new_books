<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for a news aggregator: continuously ingest from thousands of sources, normalise and deduplicate, and categorise and tag; then let users subscribe, pull a personalised feed, and receive a push when something matches">
  <defs>
    <filter id="nwsf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nwsf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nwsf-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsf-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsf-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsf-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsf-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwsf-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">News aggregator: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the system has to do. Split into getting articles in, and getting the right ones to a reader.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Getting articles in</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#5B21B6">Getting them to a reader</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nwsf-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#64748B" clip-path="url(#nwsf-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Continuous ingest</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">RSS, APIs and crawlers,</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">running all the time</text>
  <g filter="url(#nwsf-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#D97706" clip-path="url(#nwsf-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Normalise and dedupe</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">one shape for every source,</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">and the same story once</text>
  <g filter="url(#nwsf-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#059669" clip-path="url(#nwsf-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Categorise and tag</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">topics, plus the people</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">and organisations named</text>
  <g filter="url(#nwsf-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#nwsf-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Subscriptions</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">follow a source, a topic</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">or a named entity</text>
  <g filter="url(#nwsf-lift)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="450" y="430" width="9" height="90" fill="#4F46E5" clip-path="url(#nwsf-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Feed on demand</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">open the app and see</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">a personalised list</text>
  <g filter="url(#nwsf-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#nwsf-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Push when it matters</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a notification when a</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">subscription gets a story</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Deduplication</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">the same story is filed by many outlets, so a feed that does not dedupe reads as broken</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Entity tagging</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">reads names out of the article text so a reader can follow one person rather than a whole section</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Snippets only</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">a headline, a summary and a link out; a legal constraint as much as a design one</text>
</svg>