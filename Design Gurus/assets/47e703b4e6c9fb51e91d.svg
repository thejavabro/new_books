<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="622" viewBox="0 0 1240 622" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A token bucket refills at a steady rate and holds spare tokens up to its capacity, so a short burst is absorbed and only the sustained excess is rejected">
  <rect x="0" y="0" width="1240" height="622" fill="#FFFFFF"/>
  <defs>
    <marker id="ap6-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ap6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ap6-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ap6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The token bucket: a steady limit that still forgives a spike</text>

  
  <rect x="40" y="76" width="520" height="396" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#5B21B6">How the bucket works</text>

  <text x="300" y="150" font-size="20" fill="#92400E" text-anchor="middle">refill: 10 tokens per second</text>
  <line x1="300" y1="160" x2="300" y2="194" stroke="#D97706" stroke-width="2" marker-end="url(#ap6-amber)"/>

  <rect x="190" y="200" width="220" height="140" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="300" y="238" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Token bucket</text>
  <text x="300" y="272" font-size="20" fill="#5B21B6" text-anchor="middle">capacity 20</text>
  <text x="300" y="310" font-size="20" fill="#5B21B6" text-anchor="middle">1 token per request</text>

  <path d="M240 344 L184 380" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ap6-emerald)"/>
  <path d="M360 344 L416 380" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#ap6-red)"/>

  <rect x="64" y="386" width="228" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="178" y="414" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">a token is there</text>
  <text x="178" y="440" font-size="20" fill="#065F46" text-anchor="middle">the request is served</text>

  <rect x="308" y="386" width="228" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="422" y="414" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the bucket is empty</text>
  <text x="422" y="440" font-size="20" fill="#B91C1C" text-anchor="middle">429 Too Many Requests</text>

  
  <rect x="580" y="76" width="620" height="396" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="604" y="110" font-size="20" font-weight="600" fill="#1E40AF">A burst against a full bucket</text>
  <text x="604" y="140" font-size="20" fill="#334155">tokens in the bucket over time</text>

  <rect x="900" y="180" width="260" height="150" fill="#FEF2F2"/>

  <line x1="636" y1="170" x2="636" y2="350" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="640" y1="350" x2="1180" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#ap6-slate)"/>
  <line x1="640" y1="330" x2="1160" y2="330" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>

  <path d="M640 180 H900 V330 H1160" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
  <line x1="900" y1="180" x2="900" y2="330" stroke="#DC2626" stroke-width="2.5"/>

  <text x="628" y="186" font-size="20" fill="#64748B" text-anchor="end">20</text>
  <text x="628" y="336" font-size="20" fill="#64748B" text-anchor="end">0</text>

  <text x="768" y="166" font-size="20" fill="#1E40AF" text-anchor="middle">idle: the bucket fills</text>
  <text x="908" y="166" font-size="20" font-weight="600" fill="#B91C1C">burst of 30 requests</text>

  <text x="1030" y="222" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the bucket is empty</text>
  <text x="1030" y="250" font-size="20" fill="#B91C1C" text-anchor="middle">from here only 10</text>
  <text x="1030" y="278" font-size="20" fill="#B91C1C" text-anchor="middle">per second pass</text>
  <text x="1030" y="306" font-size="20" fill="#B91C1C" text-anchor="middle">the rest get 429</text>

  <text x="640" y="378" font-size="20" fill="#64748B" text-anchor="middle">0s</text>
  <text x="770" y="378" font-size="20" fill="#64748B" text-anchor="middle">1s</text>
  <text x="900" y="378" font-size="20" fill="#64748B" text-anchor="middle">2s</text>
  <text x="1030" y="378" font-size="20" fill="#64748B" text-anchor="middle">3s</text>
  <text x="1160" y="378" font-size="20" fill="#64748B" text-anchor="middle">4s</text>

  <text x="890" y="424" font-size="20" fill="#334155" text-anchor="middle">Steady traffic below 10 per second never dips into the reserve.</text>
  <text x="890" y="452" font-size="20" fill="#334155" text-anchor="middle">The bucket is there to forgive the spike.</text>

  
  <rect x="40" y="500" width="1160" height="92" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="620" y="536" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">A bucket says yes to a short spike and no to a sustained one.</text>
  <text x="620" y="566" font-size="20" fill="#5B21B6" text-anchor="middle">The refill rate is the real limit. The capacity only decides how big a spike you forgive.</text>
</svg>