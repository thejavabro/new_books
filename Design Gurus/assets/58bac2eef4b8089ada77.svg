  <g transform="translate(107.56,814.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/></g>
  <text x="144" y="832" font-size="21.5" font-weight="600" fill="#111827">Placing an order: 99.64% available</text>
  <text x="620" y="899" font-size="18.5" text-anchor="middle" fill="#6B7280">about 31.5 hours per year in which orders fail, against 8.76 hours for a 99.9% target</text>
  <text x="620" y="926" font-size="18.5" text-anchor="middle" fill="#94A3B8">assumes each part fails independently of the others</text>
  <text x="80" y="150" font-size="18.5" font-weight="600" fill="#475569">Part the order needs</text>
  <text x="700" y="150" font-size="18.5" font-weight="600" text-anchor="middle" fill="#475569">On its own</text>
  <text x="1000" y="150" font-size="18.5" font-weight="600" text-anchor="middle" fill="#475569">Chain so far</text>
  <text x="700" y="218" font-size="24" font-weight="700" text-anchor="middle" fill="#111827">99.99%</text>
  <text x="700" y="334" font-size="24" font-weight="700" text-anchor="middle" fill="#111827">99.9%</text>
  <text x="700" y="450" font-size="24" font-weight="700" text-anchor="middle" fill="#111827">99.95%</text>
  <text x="700" y="566" font-size="24" font-weight="700" text-anchor="middle" fill="#111827">99.9%</text>
  <text x="700" y="682" font-size="24" font-weight="700" text-anchor="middle" fill="#111827">99.9%</text>




