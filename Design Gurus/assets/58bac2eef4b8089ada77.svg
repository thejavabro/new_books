  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Availability of a chain of dependent parts</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">When an order needs every part to be up, their availabilities multiply (illustrative figures).</text>



