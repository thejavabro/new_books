<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Placing an order needs the load balancer at 99.99 percent, Orders at 99.9 percent, the PostgreSQL database at 99.95 percent, Payments at 99.9 percent and the payment provider at 99.9 percent; multiplied in order the chain falls to 99.89, 99.84, 99.74 and finally 99.64 percent, about 31.5 hours per year in which orders fail">
