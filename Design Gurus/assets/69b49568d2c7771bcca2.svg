<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The first request misses and is pulled from the origin, later requests are served from the edge cache, and after the TTL expires the next request pulls again">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="cd9-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cd9-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cd9-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="cd9-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="386" height="390" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="213" y="78" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">First request</text>

  <rect x="426" y="40" width="386" height="390" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="619" y="78" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Later requests</text>

  <rect x="832" y="40" width="386" height="390" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1025" y="78" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">After the TTL expires</text>

  <line x1="213" y1="164" x2="213" y2="194" stroke="#D97706" stroke-width="2.5" marker-end="url(#cd9-amber)"/>
  <line x1="213" y1="272" x2="213" y2="302" stroke="#D97706" stroke-width="2.5" marker-end="url(#cd9-amber)"/>
  <line x1="619" y1="164" x2="619" y2="194" stroke="#059669" stroke-width="2.5" marker-end="url(#cd9-emerald)"/>
  <line x1="1025" y1="164" x2="1025" y2="194" stroke="#DC2626" stroke-width="2.5" marker-end="url(#cd9-red)"/>
  <line x1="1025" y1="272" x2="1025" y2="302" stroke="#DC2626" stroke-width="2.5" marker-end="url(#cd9-red)"/>

  <g filter="url(#cd9-soft)">
    <rect x="113" y="105" width="200" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="83" y="198" width="260" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="113" y="306" width="200" height="56" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

    <rect x="519" y="105" width="200" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="489" y="198" width="260" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

    <rect x="925" y="105" width="200" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="895" y="198" width="260" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="925" y="306" width="200" height="56" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>

  <text x="213" y="140" font-size="20" fill="#0F172A" text-anchor="middle">User</text>
  <text x="213" y="230" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Edge server</text>
  <text x="213" y="256" font-size="20" fill="#B45309" text-anchor="middle">cache is empty</text>
  <text x="213" y="341" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Origin server</text>
  <text x="213" y="406" font-size="20" fill="#475569" text-anchor="middle">Pulled from the origin once</text>

  <text x="619" y="140" font-size="20" fill="#0F172A" text-anchor="middle">User</text>
  <text x="619" y="230" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Edge server</text>
  <text x="619" y="256" font-size="20" fill="#059669" text-anchor="middle">copy is cached</text>
  <text x="619" y="341" font-size="20" fill="#94A3B8" text-anchor="middle">Origin not contacted</text>
  <text x="619" y="406" font-size="20" fill="#475569" text-anchor="middle">Served straight from the edge</text>

  <text x="1025" y="140" font-size="20" fill="#0F172A" text-anchor="middle">User</text>
  <text x="1025" y="230" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">Edge server</text>
  <text x="1025" y="256" font-size="20" fill="#DC2626" text-anchor="middle">copy is stale</text>
  <text x="1025" y="341" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Origin server</text>
  <text x="1025" y="406" font-size="20" fill="#475569" text-anchor="middle">Pulled again to refresh it</text>
</svg>