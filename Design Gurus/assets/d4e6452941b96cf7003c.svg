<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A WebSocket starts as an HTTP handshake, then becomes one persistent full-duplex channel where both sides send messages at any time">
  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>
  <defs>
    <marker id="rt4-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rt4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rt4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="240" y1="112" x2="240" y2="706" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1000" y1="112" x2="1000" y2="706" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <rect x="120" y="134" width="1000" height="204" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="140" y="168" font-size="20" font-weight="600" fill="#334155" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Handshake (plain HTTP)</text>

  <line x1="248" y1="252" x2="990" y2="252" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt4-blue)"/>
  <text x="620" y="228" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">HTTP request: please upgrade to WebSocket</text>

  <line x1="992" y1="309" x2="250" y2="309" stroke="#059669" stroke-width="2" marker-end="url(#rt4-emerald)"/>
  <text x="620" y="285" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">101 Switching Protocols: upgrade accepted</text>

  
  <rect x="120" y="378" width="1000" height="412" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="140" y="412" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">One open connection: full duplex, both directions, stays open</text>

  <line x1="248" y1="482" x2="990" y2="482" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rt4-blue)"/>
  <text x="620" y="458" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Client sends a message, anytime</text>

  <line x1="992" y1="552" x2="250" y2="552" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rt4-blue)"/>
  <text x="620" y="528" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Server pushes a message, without being asked</text>

  <line x1="248" y1="622" x2="990" y2="622" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rt4-blue)"/>
  <text x="620" y="598" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Client replies instantly</text>

  <line x1="992" y1="692" x2="250" y2="692" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rt4-blue)"/>
  <text x="620" y="668" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Server pushes again</text>

  <text x="620" y="734" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No new connections. No repeated headers.</text>
  <text x="620" y="760" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The channel stays open until one side closes it.</text>

  
  <g filter="url(#rt4-soft)">
    <rect x="120" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="880" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="240" y="98" font-size="20" fill="#64748B" text-anchor="middle">can send anytime</text>
  <text x="1000" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="1000" y="98" font-size="20" fill="#64748B" text-anchor="middle">can push anytime</text>
</svg>