<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1322" viewBox="0 0 1240 1322" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six hard parts of the news feed screen and the decision each one forces: a ranking is not a stable sort, a new post arriving during scroll, viewer context that must not be stored on Post, an optimistic reaction, a post becoming unavailable inside a frozen order, and prefetch respecting expiry.">
  <defs>
    <filter id="p3k-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3k-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3k-kl"><rect x="620" y="59" width="24" height="22" rx="6"/></clipPath>
    <clipPath id="p3k-k1"><rect x="76" y="146" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3k-k2"><rect x="76" y="320" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3k-k3"><rect x="76" y="494" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3k-k4"><rect x="76" y="668" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3k-k5"><rect x="76" y="842" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3k-k6"><rect x="76" y="1016" width="460" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1322" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Feed: six hard parts, six decisions</text>
  <rect x="620" y="59" width="24" height="22" rx="6" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <rect x="620" y="59" width="5" height="22" fill="#DB2777" clip-path="url(#p3k-kl)"/>
  <text x="656" y="77" font-size="15.5" fill="#6B7280">the hard part</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800,71 L804.5,75.5 L812,65.5"/>
  </g>
  <text x="826" y="77" font-size="15.5" fill="#6B7280">the decision it forces</text>

  
  <rect x="40" y="126" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3k-lift)">
    <rect x="76" y="146" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="76" y="146" width="9" height="90" fill="#DB2777" clip-path="url(#p3k-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">A ranking is not a stable sort</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,262 L82.5,266.5 L90,256.5"/>
  </g>
  <text x="104" y="268" font-size="15.5" fill="#6B7280">Freeze the ranked order into a Feed snapshot with a published lifetime.</text>

  
  <rect x="40" y="300" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3k-soft)">
    <rect x="76" y="320" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="320" width="6" height="90" fill="#DB2777" clip-path="url(#p3k-k2)"/>
  </g>
  <circle cx="114" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,354.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="372" font-size="18.5" font-weight="600" fill="#111827">A new post arrives during scroll</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,436 L82.5,440.5 L90,430.5"/>
  </g>
  <text x="104" y="442" font-size="15.5" fill="#6B7280">Return a new-post count, and never inject a row into an older traversal.</text>

  
  <rect x="40" y="474" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3k-soft)">
    <rect x="76" y="494" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="494" width="6" height="90" fill="#DB2777" clip-path="url(#p3k-k3)"/>
  </g>
  <circle cx="114" cy="539" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,528.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="140" y="546" font-size="18.5" font-weight="600" fill="#111827">Viewer context is not stored on Post</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,610 L82.5,614.5 L90,604.5"/>
  </g>
  <text x="104" y="616" font-size="15.5" fill="#6B7280">The viewer reaction travels beside the post, not inside the shared resource.</text>

  
  <rect x="40" y="648" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3k-soft)">
    <rect x="76" y="668" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="668" width="6" height="90" fill="#DB2777" clip-path="url(#p3k-k4)"/>
  </g>
  <circle cx="114" cy="713" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,702.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="720" font-size="18.5" font-weight="600" fill="#111827">An optimistic reaction</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,784 L82.5,788.5 L90,778.5"/>
  </g>
  <text x="104" y="790" font-size="15.5" fill="#6B7280">PUT makes the write idempotent, so a repeated tap leaves one reaction.</text>

  
  <rect x="40" y="822" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3k-soft)">
    <rect x="76" y="842" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="842" width="6" height="90" fill="#DB2777" clip-path="url(#p3k-k5)"/>
  </g>
  <circle cx="114" cy="887" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,876.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="894" font-size="18.5" font-weight="600" fill="#111827">A post becomes unavailable</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,958 L82.5,962.5 L90,952.5"/>
  </g>
  <text x="104" y="964" font-size="15.5" fill="#6B7280">The frozen order keeps its position, and the item is returned as unavailable.</text>

  
  <rect x="40" y="996" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3k-soft)">
    <rect x="76" y="1016" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1016" width="6" height="90" fill="#DB2777" clip-path="url(#p3k-k6)"/>
  </g>
  <circle cx="114" cy="1061" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1050.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="1068" font-size="18.5" font-weight="600" fill="#111827">Prefetch must respect expiry</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1132 L82.5,1136.5 L90,1126.5"/>
  </g>
  <text x="104" y="1138" font-size="15.5" fill="#6B7280">A prefetched page from an expired snapshot is discarded, not displayed.</text>

  
  <rect x="40" y="1182" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1224" text-anchor="middle" font-size="16" fill="#475569">Four of the six follow from one move: freeze the ranked order into a snapshot with a published lifetime.</text>
  <text x="620" y="1252" text-anchor="middle" font-size="16" fill="#475569">The other two keep the viewer's own reaction correct: carried beside the post, and safe to repeat.</text>
</svg>