<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="moments-title moments-desc">
<title id="moments-title">Written before, or written during</title>
<desc id="moments-desc">A runbook is written either by the person who built the thing while they still remember, or by whoever is awake during the outage. The difference decides whether it is any good.</desc>
<defs>
<marker id="moments-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="moments-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="moments-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="moments-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="710" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Written before, or written during</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A runbook is written at one of two moments, and the difference decides whether it is any good.</text>
<rect x="40" y="632" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="632" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="186" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V298A6 6 0 0 0 46 304H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Written before</text>
<rect x="72" y="174" width="500" height="110" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="197.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">by the person who built it</text><text x="92" y="222.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">while they still remember which</text><text x="92" y="247.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">failure modes are real</text><text x="92" y="272.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">takes an hour, and is boring</text>
<rect x="640" y="118" width="560" height="186" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V298A6 6 0 0 0 646 304H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Written during</text>
<rect x="672" y="174" width="500" height="110" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="197.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">by whoever is awake</text><text x="692" y="222.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reconstructing from a dashboard</text><text x="692" y="247.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">nobody has opened in six months</text><text x="692" y="272.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">takes the length of the outage</text>
<rect x="40" y="324" width="1160" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="324" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="360" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The second is what usually happens, and the reason is structural</text><text x="64" y="386" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Nothing ships. The work pays off on a day nobody can schedule, and the person</text><text x="64" y="412" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">who does it is rarely the person who benefits.</text>
<rect x="40" y="452" width="1160" height="84" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="452" width="5" height="84" rx="2.5" fill="#39D5AA"/><text x="64" y="487" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">One question, answered before launch:</text><text x="64" y="513" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">when this breaks at 3 am, what does the responder do first?</text>
<rect x="40" y="552" width="1160" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="585" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">If nobody can answer, the service is not finished, regardless of what the tests say</text>
<text x="66" y="666" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">It is the part of the design used only when the design has failed, which is why it never gets written.</text>
</svg>