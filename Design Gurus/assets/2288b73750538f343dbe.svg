  <circle cx="1018" cy="770" r="18" fill="#FFFFFF"/>
  <g transform="translate(1007.56,759.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="1044" y="764.25" font-size="21.5" font-weight="600" fill="#111827">Notification</text>
  <text x="1044" y="789.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
  <text x="1090" y="844" font-size="18.5" text-anchor="middle" fill="#6B7280">sends the confirmation</text>
  <text x="464" y="186" font-size="18.5" fill="#6B7280">(for example,</text>
  <text x="464" y="211" font-size="18.5" fill="#6B7280">Order saga service)</text>
  <text x="464" y="246" font-size="18.5" fill="#4338CA">saves saga state before</text>
  <text x="464" y="271" font-size="18.5" fill="#4338CA">each command</text>

  <circle cx="240" cy="508" r="13" fill="#2563EB"/>
  <text x="240" y="513.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">1</text>
