    <clipPath id="m07k-k9"><rect x="980" y="505" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="m07k-k10"><rect x="980" y="725" width="220" height="90" rx="12"/></clipPath>
    <marker id="m07k-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m07k-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Orchestration: centralized order fulfillment</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One orchestrator sends a command to each service in turn and waits for its reply event.</text>

  <rect x="440" y="120" width="320" height="700" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="464" y="150" font-size="19.5" font-weight="600" fill="#4338CA">Orchestrator</text>

