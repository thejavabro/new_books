    <rect x="464" y="522" width="272" height="56" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="464" y="522" width="6" height="56" fill="#D97706" clip-path="url(#m07k-k4)"/>
  </g>
  <text x="484" y="557" font-size="18.5" font-weight="600" fill="#111827">Process payment</text>
  <g filter="url(#m07k-soft)">
    <rect x="464" y="742" width="272" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="464" y="742" width="6" height="56" fill="#2563EB" clip-path="url(#m07k-k5)"/>
  </g>
  <text x="484" y="777" font-size="18.5" font-weight="600" fill="#111827">Send confirmation</text>
  <g filter="url(#m07k-soft)">
    <rect x="770" y="368" width="200" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="770" y="368" width="6" height="70" fill="#059669" clip-path="url(#m07k-k6)"/>
  </g>
  <text x="790" y="399.5" font-size="17" font-weight="600" fill="#111827">InventoryReserved</text>
  <text x="790" y="420.5" font-size="17" font-weight="600" fill="#111827">order_id: 123</text>
  <g filter="url(#m07k-soft)">
    <rect x="770" y="588" width="200" height="70" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="770" y="588" width="6" height="70" fill="#D97706" clip-path="url(#m07k-k7)"/>
  </g>
  <text x="790" y="619.5" font-size="17" font-weight="600" fill="#111827">PaymentProcessed</text>
  <text x="790" y="640.5" font-size="17" font-weight="600" fill="#111827">order_id: 123</text>
