    <path d="M760,770 H978" stroke="#2563EB" marker-end="url(#m07k-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="258" y="514" fill="#1D4ED8" text-anchor="start">OrderPlaced event</text>
    <text x="227" y="539" fill="#1D4ED8" text-anchor="start">starts the saga</text>
    <text x="792" y="274" fill="#1D4ED8" text-anchor="start">Reserve inventory</text>
    <text x="774" y="299" fill="#1D4ED8" text-anchor="start">command via broker</text>
    <text x="792" y="494" fill="#1D4ED8" text-anchor="start">Process payment</text>
    <text x="774" y="519" fill="#1D4ED8" text-anchor="start">command via broker</text>
    <text x="792" y="734" fill="#1D4ED8" text-anchor="start">Send confirmation</text>
    <text x="774" y="759" fill="#1D4ED8" text-anchor="start">command via broker</text>
