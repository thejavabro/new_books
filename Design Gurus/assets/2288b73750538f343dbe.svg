    <filter id="m07k-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m07k-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m07k-k1"><rect x="40" y="505" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="m07k-k2"><rect x="230" y="573" width="200" height="70" rx="12"/></clipPath>
    <clipPath id="m07k-k3"><rect x="464" y="302" width="272" height="56" rx="12"/></clipPath>
    <clipPath id="m07k-k4"><rect x="464" y="522" width="272" height="56" rx="12"/></clipPath>
