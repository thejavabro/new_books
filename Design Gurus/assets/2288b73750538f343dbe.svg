  <text x="1044" y="324.25" font-size="21.5" font-weight="600" fill="#111827">Inventory</text>
  <text x="1044" y="349.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
  <text x="1090" y="404" font-size="18.5" text-anchor="middle" fill="#6B7280">reserves inventory</text>
  <g filter="url(#m07k-soft)">
    <rect x="980" y="505" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
