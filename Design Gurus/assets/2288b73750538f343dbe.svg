<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Step 1: the order service, which creates the order, publishes OrderPlaced, which starts the saga in the orchestrator, for example an order saga service, which saves saga state before each command. Its steps are reserve inventory, process payment and send confirmation. Step 2: it sends a reserve inventory command through the broker to the inventory service, which replies with InventoryReserved. Step 3: it sends a process payment command through the broker to the payment service, which replies with PaymentProcessed. Step 4: it sends a send confirmation command through the broker to the notification service">
