  <circle cx="1018" cy="550" r="18" fill="#FFFFFF"/>
  <g transform="translate(1007.56,539.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="1044" y="544.25" font-size="21.5" font-weight="600" fill="#111827">Payment</text>
  <text x="1044" y="569.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
  <text x="1090" y="624" font-size="18.5" text-anchor="middle" fill="#6B7280">processes payment</text>
  <g filter="url(#m07k-soft)">
    <rect x="980" y="725" width="220" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
