  <g transform="translate(257.56,597.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="294" y="604.5" font-size="17" font-weight="600" fill="#111827">OrderPlaced</text>
  <text x="294" y="625.5" font-size="17" font-weight="600" fill="#111827">order_id: 123</text>
