  <text x="104" y="544.25" font-size="21.5" font-weight="600" fill="#111827">Order</text>
  <text x="104" y="569.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
  <text x="130" y="624" font-size="18.5" text-anchor="middle" fill="#6B7280">creates the order</text>
  <g filter="url(#m07k-soft)">
    <rect x="230" y="573" width="200" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="230" y="573" width="6" height="70" fill="#64748B" clip-path="url(#m07k-k2)"/>
