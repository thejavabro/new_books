<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="696" viewBox="0 0 1240 696" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Labels come from natural outcomes, user behavior, and human annotation, and each source has its own cost, delay, and weakness">
  <defs>
    <marker id="c2tdls-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c2tdls-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="c2tdls-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="c2tdls-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="c2tdls-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2tdls-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2tdls-k1"><rect x="80" y="56" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2tdls-k2"><rect x="470" y="56" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2tdls-k3"><rect x="860" y="56" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2tdls-k4"><rect x="305" y="386" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="c2tdls-k5"><rect x="685" y="386" width="250" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="696" fill="#FFFFFF"/>
  <rect x="40" y="326" width="1160" height="214" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="356" font-size="16.5" font-weight="600" fill="#B45309">Offline: building the training set</text>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M230,212 V294 Q230,306 242,306 H353 Q365,306 365,318 V386" marker-end="url(#c2tdls-memerald)"/></g>
  <g fill="none" stroke="#2563EB" stroke-width="2"><path d="M620,212 V274 Q620,286 608,286 H442 Q430,286 430,298 V386" marker-end="url(#c2tdls-mblue)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M1010,212 V294 Q1010,306 998,306 H507 Q495,306 495,318 V386" marker-end="url(#c2tdls-mviolet)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M555,431 H685" marker-end="url(#c2tdls-mslate)"/></g>
  <g filter="url(#c2tdls-soft)">
    <rect x="80" y="56" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="56" width="6" height="90" fill="#059669" clip-path="url(#c2tdls-k1)"/>
  </g>
  <circle cx="118" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,90.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="144" y="108" font-size="18.5" font-weight="600" fill="#111827">Natural outcomes</text>
  <text x="230" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">delivery time, confirmed chargeback</text>
  <text x="230" y="194" font-size="15.5" text-anchor="middle" fill="#94A3B8">free, minutes to weeks</text>
  <g filter="url(#c2tdls-soft)">
    <rect x="470" y="56" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="56" width="6" height="90" fill="#2563EB" clip-path="url(#c2tdls-k2)"/>
  </g>
  <circle cx="508" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,90.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="534" y="108" font-size="18.5" font-weight="600" fill="#111827">User behavior</text>
  <text x="620" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">order, menu open, scroll past</text>
  <text x="620" y="194" font-size="15.5" text-anchor="middle" fill="#94A3B8">free, seconds</text>
  <g filter="url(#c2tdls-soft)">
    <rect x="860" y="56" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="860" y="56" width="6" height="90" fill="#7C3AED" clip-path="url(#c2tdls-k3)"/>
  </g>
  <circle cx="898" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,90.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="924" y="108" font-size="18.5" font-weight="600" fill="#111827">Human annotation</text>
  <text x="1010" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">a reviewer marks a review as abusive</text>
  <text x="1010" y="194" font-size="15.5" text-anchor="middle" fill="#94A3B8">cents to dollars per label, hours to days</text>
  <g filter="url(#c2tdls-soft)">
    <rect x="305" y="386" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="305" y="386" width="6" height="90" fill="#D97706" clip-path="url(#c2tdls-k4)"/>
  </g>
  <circle cx="343" cy="431" r="18" fill="#FFFFFF"/>
  <g transform="translate(332.56,420.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="369" y="438" font-size="18.5" font-weight="600" fill="#111827">Point-in-time join</text>
  <text x="430" y="501" font-size="15.5" text-anchor="middle" fill="#6B7280">features as they were at prediction time</text>
  <g filter="url(#c2tdls-soft)">
    <rect x="685" y="386" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="685" y="386" width="6" height="90" fill="#D97706" clip-path="url(#c2tdls-k5)"/>
  </g>
  <circle cx="723" cy="431" r="18" fill="#FFFFFF"/>
  <g transform="translate(712.56,420.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="749" y="438" font-size="18.5" font-weight="600" fill="#111827">Training examples</text>
  <text x="810" y="501" font-size="15.5" text-anchor="middle" fill="#6B7280">features paired with a label</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="242" y="250" fill="#047857">late, and sometimes never observed</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="632" y="240" fill="#1D4ED8">noisy, and biased toward</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="632" y="260" fill="#1D4ED8">what was shown</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1022" y="240" fill="#5B21B6">costly, and inconsistent</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1022" y="260" fill="#5B21B6">without clear guidelines</text></g>
  <rect x="40" y="580" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="625" text-anchor="middle" font-size="16" fill="#475569">Every label has a source, a cost, a delay, and its own kind of error.</text>
</svg>