<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="734" viewBox="0 0 1240 734" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="denorm-title denorm-desc">
<title id="denorm-title">What denormalization actually costs</title>
<desc id="denorm-desc">Duplication is not the price. The price is that a fact now exists in two places, one of them is authoritative, and something has to repair the other when it drifts.</desc>
<defs>
<marker id="denorm-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="denorm-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="denorm-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="denorm-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="734" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What denormalization actually costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The cost is that a fact now exists in two places and something has to keep them in agreement.</text>
<rect x="40" y="656" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="656" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two questions that have to be answered</text>
<rect x="40" y="168" width="560" height="86" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="168" width="5" height="86" rx="2.5" fill="#5EC9EC"/><text x="64" y="204" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Which copy is authoritative?</text><text x="64" y="230" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">If you cannot say, the design is not finished</text>
<rect x="640" y="168" width="560" height="86" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="168" width="5" height="86" rx="2.5" fill="#5EC9EC"/><text x="664" y="204" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">How does a derived copy get fixed?</text><text x="664" y="230" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Not if. When.</text>
<text x="40" y="294" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three mechanisms, with different costs</text>
<rect x="40" y="312" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="348" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write both in one transaction</text>
<path d="M526 342H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 342H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#denorm-marker-slate)"/>
<rect x="570" y="312" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="348" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">only inside a single store, and every write gets slower</text>
<rect x="40" y="384" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="420" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Derive it asynchronously</text>
<path d="M526 414H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 414H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#denorm-marker-slate)"/>
<rect x="570" y="384" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="407.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the copy lags, and you now need</text><text x="590" y="432.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">publication and idempotence machinery</text>
<rect x="40" y="456" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Recompute on read</text>
<path d="M526 486H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 486H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#denorm-marker-slate)"/>
<rect x="570" y="456" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="492" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is a join, performed by your application, usually worse</text>
<rect x="40" y="542" width="1160" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="542" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="64" y="578" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">And a fourth thing: how you detect a divergence none of them prevented.</text><text x="64" y="604" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A reconciliation job is dull work, and it is the difference between degrading visibly and degrading silently.</text>
<text x="66" y="690" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">"We denormalize for read performance" is a slogan. Naming the authority makes it a design.</text>
</svg>