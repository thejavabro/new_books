<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">One message can belong to several mailboxes</title><desc id="desc">One message can belong to several mailboxes. Keep one content record and separate membership records. A partial local mailbox is not a complete copy of all provider content.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="800" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">One message can belong to several mailboxes</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Keep one content record and separate membership records.</tspan></text><rect x="300" y="160" width="600" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="322" y="202" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="322" dy="0">Message M42 in account A</tspan></text><text x="322" y="250" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="322" dy="0">Details are local; body parts have explicit</tspan><tspan x="322" dy="32">download state.</tspan></text><path d="M600 318 V345 H223 V375" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="380" width="346" height="220" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="422" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Inbox</tspan></text><text x="72" y="470" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Membership for M42</tspan><tspan x="72" dy="32">No second body copy</tspan></text><path d="M600 318 V345 H600 V375" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="427" y="380" width="346" height="220" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="449" y="422" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="449" dy="0">Important label</tspan></text><text x="449" y="470" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="449" dy="0">Membership for M42</tspan><tspan x="449" dy="32">No second body copy</tspan></text><path d="M600 318 V345 H977 V375" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="804" y="380" width="346" height="220" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="826" y="422" font-size="25" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="826" dy="0">Offline body cache</tspan></text><text x="826" y="470" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="826" dy="0">Only downloaded parts are</tspan><tspan x="826" dy="32">readable without a</tspan><tspan x="826" dy="32">connection.</tspan></text><rect x="50" y="650" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="696" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">A partial local mailbox is not a complete copy of all provider content.</tspan></text></g></svg>