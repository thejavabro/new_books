<svg xmlns="http://www.w3.org/2000/svg" width="814" height="357" viewBox="5 -8 814 357" font-family="Helvetica, Arial, sans-serif">
<rect x="5" y="-8" width="814" height="357" fill="#ffffff"/>
<text x="13" y="12" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#666666">Abstraction: Bank calls three operations and knows nothing behind them</text>
<path d="M 330 76 L 460 76" fill="none" stroke="#000000" stroke-width="1"/>
<path d="M 460 76 L 449 80 L 449 72 Z" fill="#000000"/>
<rect x="33" y="43" width="300" height="154" fill="#000000" opacity="0.14" rx="1"/>
<rect x="30" y="40" width="300" height="154" fill="#f8fcf7" stroke="#82b366" stroke-width="1"/>
<rect x="30" y="40" width="300" height="26" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="180" y="57" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Bank</text>
<text x="38" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">- name: string</text>
<text x="38" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">- accounts: list</text>
<line x1="30" y1="112" x2="330" y2="112" stroke="#82b366" stroke-width="1"/>
<text x="38" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ get_name(): string</text>
<text x="38" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ add()</text>
<text x="38" y="166" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ find(): Account</text>
<text x="38" y="184" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ transfer(): string</text>
<rect x="463" y="43" width="330" height="226" fill="#000000" opacity="0.14" rx="1"/>
<rect x="460" y="40" width="330" height="226" fill="#f8fcf7" stroke="#82b366" stroke-width="1"/>
<rect x="460" y="40" width="330" height="26" fill="#d5e8d4" stroke="#82b366" stroke-width="1"/>
<text x="625" y="57" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#000000" text-anchor="middle">Account</text>
<text x="468" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">- account_id: string</text>
<text x="468" y="102" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">- owner: string</text>
<text x="468" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">- balance_cents: int</text>
<line x1="460" y1="130" x2="790" y2="130" stroke="#82b366" stroke-width="1"/>
<text x="468" y="148" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ get_account_id(): string</text>
<text x="468" y="166" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ get_owner(): string</text>
<text x="468" y="184" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ get_balance_cents(): int</text>
<text x="468" y="202" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ deposit(): string</text>
<text x="468" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ withdraw(): string</text>
<text x="468" y="238" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ monthly_update(): string</text>
<text x="468" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">+ label(): string</text>
<rect x="377" y="56" width="12.9" height="16" fill="#ffffff" opacity="0.85"/>
<text x="380" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">*</text>
<text x="30" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">Of the seven operations on Account, Bank calls three:</text>
<text x="30" y="272" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">get_account_id, withdraw and deposit.</text>
<text x="30" y="294" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">It never names balance_cents, it never learns how a balance is stored,</text>
<text x="30" y="316" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#666666">and it never learns which kind of account it is holding.</text>
</svg>