<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1396" viewBox="0 0 1240 1396" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Strong consistency: a client writes to a processing unit, the owner, which writes its own copy (unit 1) and one backup (unit 2) in the in-memory data grid embedded in the processing units synchronously before acknowledging; reads at the owner return the latest value, and other units hold no copy of the partition. Eventual consistency: the owner (unit 1) and one backup (unit 2) are written first and the write is acknowledged, then the other copies of a replicated cache (unit 3) converge later, and the data pump updates the database later, so a read at another copy or at the database can return an older value for a short time">
