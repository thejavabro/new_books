  <text x="149" y="932" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="64" y="814" font-size="18.5" fill="#475569">The owner (Unit 1) and one backup (Unit 2) are written first. In a replicated cache, the other copies (Unit 3) converge later.</text>

  <rect x="64" y="542" width="1112" height="150" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="88" y="578" font-size="19.5" font-weight="600" fill="#1D4ED8">Key points</text>
  <circle cx="96" cy="606" r="4" fill="#2563EB"/>
  <text x="112" y="612" font-size="18.5" fill="#1F2937">Write is acknowledged only after the owner and one backup hold it.</text>
  <circle cx="96" cy="636" r="4" fill="#2563EB"/>
  <text x="112" y="642" font-size="18.5" fill="#1F2937">Reads at the owner return the latest value.</text>
  <circle cx="96" cy="666" r="4" fill="#2563EB"/>
  <text x="112" y="672" font-size="18.5" fill="#1F2937">One synchronous hop to the backup is the cost; other units hold no copy of this partition.</text>
  <rect x="64" y="1180" width="1112" height="150" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="88" y="1216" font-size="19.5" font-weight="600" fill="#047857">Key points</text>
  <circle cx="96" cy="1244" r="4" fill="#059669"/>
  <text x="112" y="1250" font-size="18.5" fill="#1F2937">Write is acknowledged after the owner and one backup hold it.</text>
  <circle cx="96" cy="1274" r="4" fill="#059669"/>
  <text x="112" y="1280" font-size="18.5" fill="#1F2937">The other copies of a replicated cache converge later, in the background.</text>
  <circle cx="96" cy="1304" r="4" fill="#059669"/>
  <text x="112" y="1310" font-size="18.5" fill="#1F2937">A read at another copy or at the database can return an older value for a short time.</text>


