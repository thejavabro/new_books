  <text x="64" y="176" font-size="18.5" fill="#475569">The owner writes its own copy (Unit 1) and one backup (Unit 2) synchronously before it acknowledges the write.</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M74,884 L74,950 A75,14 0 0 0 224,950 L224,884" fill="#DBEAFE"/>
    <ellipse cx="149" cy="884" rx="75" ry="14" fill="#EFF6FF"/>
