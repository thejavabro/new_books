  <rect x="0" y="0" width="1240" height="1396" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Strong vs. eventual consistency in space-based architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Strong consistency: the owner writes to one backup before acknowledging. Eventual consistency: the other copies converge later.</text>

