<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The latency numbers to memorize">
  <rect x="0" y="0" width="1240" height="770" fill="#FFFFFF"/>

  <text x="620" y="46" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">The latency numbers to memorize</text>
  <rect x="90" y="106" width="620" height="61" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="400" y="143" font-size="21" fill="#334155" text-anchor="middle">Read from memory</text>
  <rect x="750" y="106" width="300" height="61" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="900" y="143" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">100 ns</text>
  <rect x="90" y="198" width="620" height="61" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="400" y="235" font-size="21" fill="#334155" text-anchor="middle">Read from a fast SSD</text>
  <rect x="750" y="198" width="300" height="61" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="900" y="235" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">100 us</text>
  <rect x="90" y="290" width="620" height="61" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="400" y="327" font-size="21" fill="#334155" text-anchor="middle">A call inside a datacenter</text>
  <rect x="750" y="290" width="300" height="61" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="900" y="327" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">1 ms</text>
  <rect x="90" y="382" width="620" height="61" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="400" y="419" font-size="21" fill="#334155" text-anchor="middle">A simple database query</text>
  <rect x="750" y="382" width="300" height="61" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="900" y="419" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">10 ms</text>
  <rect x="90" y="474" width="620" height="61" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="400" y="511" font-size="21" fill="#334155" text-anchor="middle">A slow query, or a disk seek</text>
  <rect x="750" y="474" width="300" height="61" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="900" y="511" font-size="21" font-weight="700" fill="#92400E" text-anchor="middle">10 to 100 ms</text>
  <rect x="90" y="566" width="620" height="61" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="400" y="603" font-size="21" fill="#334155" text-anchor="middle">A round trip between regions</text>
  <rect x="750" y="566" width="300" height="61" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="900" y="603" font-size="21" font-weight="700" fill="#991B1B" text-anchor="middle">100 ms</text>
  <text x="620" y="681" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Each step is roughly 10x to 1,000x slower than the one above it.</text>
  <text x="620" y="717" font-size="20" fill="#475569" text-anchor="middle">Users stop calling it instant at about 200 ms.</text>
</svg>