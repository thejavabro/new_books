<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two fault tolerance mechanisms. Retry with failover, only for idempotent requests: the client sends a request to the broker, the request to a server with a temporary failure fails, and the broker retries it on a different, healthy server. Circuit breaker, inside the broker: the broker detects failures and its circuit breaker opens, the broker stops routing requests to the failing server for a while and routes them to a healthy server, or fails them fast if none exists, and after a cooldown the broker sends a trial request to the failing server in the half-open state">
  <defs>
    <filter id="m12j-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m12j-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m12j-k1"><rect x="64" y="250" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="m12j-k2"><rect x="340" y="200" width="200" height="190" rx="12"/></clipPath>
    <clipPath id="m12j-k3"><rect x="780" y="200" width="396" height="90" rx="12"/></clipPath>
    <clipPath id="m12j-k4"><rect x="780" y="300" width="396" height="90" rx="12"/></clipPath>
    <clipPath id="m12j-k9"><rect x="64" y="630" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="m12j-k10"><rect x="340" y="520" width="300" height="220" rx="12"/></clipPath>
    <clipPath id="m12j-k11"><rect x="360" y="585" width="260" height="80" rx="12"/></clipPath>
    <clipPath id="m12j-k12"><rect x="860" y="630" width="316" height="90" rx="12"/></clipPath>
    <clipPath id="m12j-k13"><rect x="860" y="520" width="316" height="90" rx="12"/></clipPath>
    <marker id="m12j-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m12j-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="m12j-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m12j-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="m12j-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Broker fault tolerance: retry with failover and circuit breaker</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The broker retries idempotent requests on another healthy instance and stops routing to a failing one.</text>

  <rect x="40" y="120" width="1160" height="300" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Retry with failover</text>
  <rect x="40" y="440" width="1160" height="390" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="470" font-size="19.5" font-weight="600" fill="#B45309">Circuit breaker</text>

  <g fill="none" stroke-width="2">
    <path d="M244,295 H340" stroke="#2563EB" marker-end="url(#m12j-m-blue)"/>
    <path d="M540,245 H780" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#m12j-m-pink)"/>
    <path d="M540,345 H780" stroke="#059669" marker-end="url(#m12j-m-emerald)"/>
    <path d="M244,675 H340" stroke="#2563EB" marker-end="url(#m12j-m-blue)"/>
    <path d="M640,565 H860" stroke="#059669" marker-end="url(#m12j-m-emerald)"/>
    <path d="M640,675 H760" stroke="#DB2777"/>
    <path d="M440,740 V770 H1018 V720" stroke="#64748B" stroke-dasharray="7 6" marker-end="url(#m12j-m-slate)"/>
  </g>

  <g filter="url(#m12j-soft)">
    <rect x="64" y="250" width="180" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="250" width="6" height="90" fill="#64748B" clip-path="url(#m12j-k1)"/>
  </g>
  <circle cx="102" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,284.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="302" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m12j-lift)">
    <rect x="340" y="200" width="200" height="190" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="340" y="200" width="9" height="190" fill="#7C3AED" clip-path="url(#m12j-k2)"/>
  </g>
  <circle cx="378" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,284.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="404" y="302" font-size="21.5" font-weight="600" fill="#111827">Broker</text>
  <g filter="url(#m12j-soft)">
    <rect x="780" y="200" width="396" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="780" y="200" width="6" height="90" fill="#DB2777" clip-path="url(#m12j-k3)"/>
  </g>
  <circle cx="818" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,234.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="844" y="252" font-size="21.5" font-weight="600" fill="#111827">Server (temporary failure)</text>
  <g filter="url(#m12j-soft)">
    <rect x="780" y="300" width="396" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="780" y="300" width="6" height="90" fill="#059669" clip-path="url(#m12j-k4)"/>
  </g>
  <circle cx="818" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,334.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="844" y="352" font-size="21.5" font-weight="600" fill="#111827">Server (healthy)</text>
  <g filter="url(#m12j-soft)">
    <rect x="64" y="630" width="180" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="630" width="6" height="90" fill="#64748B" clip-path="url(#m12j-k9)"/>
  </g>
  <circle cx="102" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,664.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="682" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m12j-lift)">
    <rect x="340" y="520" width="300" height="220" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="340" y="520" width="9" height="220" fill="#7C3AED" clip-path="url(#m12j-k10)"/>
  </g>
  <circle cx="378" cy="555" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,544.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="404" y="562" font-size="21.5" font-weight="600" fill="#111827">Broker</text>
  <g filter="url(#m12j-soft)">
    <rect x="360" y="585" width="260" height="80" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="360" y="585" width="6" height="80" fill="#D97706" clip-path="url(#m12j-k11)"/>
  </g>
  <circle cx="398" cy="625" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,614.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="424" y="619.25" font-size="21.5" font-weight="600" fill="#111827">Circuit breaker</text>
  <text x="424" y="644.75" font-size="21.5" font-weight="600" fill="#111827">(open)</text>
  <g filter="url(#m12j-soft)">
    <rect x="860" y="520" width="316" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="520" width="6" height="90" fill="#059669" clip-path="url(#m12j-k13)"/>
  </g>
  <circle cx="898" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,554.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="924" y="572" font-size="21.5" font-weight="600" fill="#111827">Server (healthy)</text>
  <g filter="url(#m12j-soft)">
    <rect x="860" y="630" width="316" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="860" y="630" width="6" height="90" fill="#DB2777" clip-path="url(#m12j-k12)"/>
  </g>
  <circle cx="898" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,664.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="924" y="682" font-size="21.5" font-weight="600" fill="#111827">Server (failing)</text>
  <text x="64" y="178" font-size="18.5" fill="#475569">(Only for idempotent requests: retry on a different, healthy server)</text>
  <text x="64" y="498" font-size="18.5" fill="#475569">(Stop routing to a failing server; send requests to a healthy one, or fail fast if none exists)</text>

  <circle cx="580" cy="220" r="14" fill="#DB2777"/>
  <text x="580" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
  <text x="604" y="226.5" font-size="18.5" font-weight="600" fill="#BE185D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Request fails</text>
  <circle cx="580" cy="320" r="14" fill="#059669"/>
  <text x="580" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
  <text x="604" y="326.5" font-size="18.5" font-weight="600" fill="#047857" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Retry request</text>
  <text x="750" y="553" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Reroute</text>
  <g stroke="#DB2777" stroke-width="4" stroke-linecap="round"><path d="M760,665 L780,685 M780,665 L760,685"/></g>
  <circle cx="380" cy="702" r="14" fill="#D97706"/>
  <text x="380" y="708" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
  <text x="404" y="708.5" font-size="18.5" font-weight="600" fill="#B45309" paint-order="stroke" stroke="#EDE9FE" stroke-width="5">Detect failures</text>
  <circle cx="668" cy="712" r="14" fill="#D97706"/>
  <text x="668" y="718" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
  <text x="692" y="718.5" font-size="18.5" font-weight="600" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Stop routing</text>
  <text x="692" y="743.5" font-size="18.5" font-weight="600" fill="#B45309" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">for a while</text>
  <circle cx="560" cy="802" r="14" fill="#059669"/>
  <text x="560" y="808" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
  <text x="584" y="808.5" font-size="18.5" font-weight="600" fill="#047857" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">After a cooldown, send a trial request (half-open)</text>


</svg>