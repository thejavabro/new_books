<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="678" viewBox="0 0 1240 678" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two arrays, both sorted downward">
<defs>
<filter id="kp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="678" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which 3 pairs, one number from each array, have the largest sums?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Both arrays fall as you read them, so the first pair tried is already the largest of all</text>
<rect x="40" y="106" width="1160" height="426" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Every pair takes one number from each array, and there are nine of them in all</text>
<text x="434" y="218" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">first array</text>
<rect x="456" y="180" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="506" y="217.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<rect x="570" y="180" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="217.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<rect x="684" y="180" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="734" y="217.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="434" y="310" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">second array</text>
<rect x="456" y="272" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="506" y="309.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<rect x="570" y="272" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="309.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="684" y="272" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="734" y="309.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="523" y="432" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">best pairs kept</text>
<text x="551" y="431" font-size="18" fill="#475569">no pairs kept yet</text>
<text x="620" y="510" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">The arrays falling is what lets whole runs of pairs be skipped without being tried</text>
<rect x="40" y="554" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="594" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Only the best 3 pairs are kept, so the store never grows</text>
<text x="620" y="626" text-anchor="middle" font-size="18.5" fill="#475569">And a pair too small to enter that store means every later pair in its row is too</text>
</svg>