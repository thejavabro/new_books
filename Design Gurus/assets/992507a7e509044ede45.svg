<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Binary search narrowing a sorted array to find the first value at or above twelve"><rect x="0" y="0" width="1240" height="850" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="498" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Looking for the ceiling of 12 in a sorted array</text>
<circle cx="70" cy="175" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="182" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">1</text>
<rect x="104" y="140" width="74" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="141" y="183" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="141" y="126" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">start</text>
<rect x="190" y="140" width="74" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="227" y="183" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">3</text>
<rect x="276" y="140" width="74" height="70" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="313" y="183" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">8</text>
<rect x="362" y="140" width="74" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="399" y="183" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">10</text>
<rect x="448" y="140" width="74" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="485" y="183" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">15</text>
<text x="485" y="126" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">end</text>
<text x="620" y="168" font-size="22.5" font-weight="600" fill="#111827">mid is 8, below 12</text>
<text x="620" y="198" font-size="19.5" fill="#6B7280">the answer is to the right, so start becomes 3</text>
<circle cx="70" cy="283" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="290" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">2</text>
<rect x="104" y="248" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="141" y="291" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">1</text>
<rect x="190" y="248" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="227" y="291" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">3</text>
<rect x="276" y="248" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="313" y="291" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">8</text>
<rect x="362" y="248" width="74" height="70" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="399" y="291" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">10</text>
<text x="399" y="234" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">start</text>
<rect x="448" y="248" width="74" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="485" y="291" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">15</text>
<text x="485" y="234" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">end</text>
<text x="620" y="276" font-size="22.5" font-weight="600" fill="#111827">mid is 10, below 12</text>
<text x="620" y="306" font-size="19.5" fill="#6B7280">still to the right, so start becomes 4</text>
<circle cx="70" cy="391" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="398" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">3</text>
<rect x="104" y="356" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="141" y="399" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">1</text>
<rect x="190" y="356" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="227" y="399" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">3</text>
<rect x="276" y="356" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="313" y="399" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">8</text>
<rect x="362" y="356" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="399" y="399" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">10</text>
<rect x="448" y="356" width="74" height="70" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="485" y="399" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">15</text>
<text x="485" y="342" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">start = end</text>
<text x="620" y="384" font-size="22.5" font-weight="600" fill="#111827">mid is 15, above 12</text>
<text x="620" y="414" font-size="19.5" fill="#6B7280">end becomes 3, and the pointers cross</text>
<circle cx="70" cy="499" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="506" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">4</text>
<rect x="104" y="464" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="141" y="507" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">1</text>
<rect x="190" y="464" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="227" y="507" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">3</text>
<rect x="276" y="464" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="313" y="507" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">8</text>
<rect x="362" y="464" width="74" height="70" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="399" y="507" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">10</text>
<rect x="448" y="464" width="74" height="70" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="485" y="507" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">15</text>
<text x="485" y="450" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">start</text>
<text x="620" y="492" font-size="22.5" font-weight="600" fill="#111827">start is now index 4</text>
<text x="620" y="522" font-size="19.5" fill="#6B7280">so the ceiling of 12 is 15</text>
<rect x="40" y="586" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="608" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="634" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">still in range</text>
<text x="348" y="634" font-size="19.5" fill="#475569">the part of the array that could hold the answer</text>
<rect x="64" y="656" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="682" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the middle</text>
<text x="348" y="682" font-size="19.5" fill="#475569">the element compared against the target this round</text>
<rect x="64" y="704" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="730" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">the ceiling</text>
<text x="348" y="730" font-size="19.5" fill="#475569">the first value at or above 12</text>
<rect x="64" y="752" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="778" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">ruled out</text>
<text x="348" y="778" font-size="19.5" fill="#475569">removed by a comparison, and never looked at again</text>
</svg>