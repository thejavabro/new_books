<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1260" viewBox="0 0 1240 1260" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. A client asks the payment service to charge a card, the service authorizes with the card network and the network approves, then the reply is lost and the client times out with the outcome unknown, so the client retries the same charge, the service authorizes again, the network approves again, and the customer has paid twice.">
  <defs>
    <marker id="m04-l04-duplicate-charge-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l04-duplicate-charge-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l04-duplicate-charge-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m04-l04-duplicate-charge-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1260" fill="#FFFFFF"/>

  <rect x="30" y="170" width="1180" height="260" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="30" y="460" width="1180" height="190" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="30" y="680" width="1180" height="310" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="220" y1="140" x2="220" y2="990"/>
    <line x1="620" y1="140" x2="620" y2="990"/>
    <line x1="1020" y1="140" x2="1020" y2="990"/>
  </g>

  <text x="48" y="208" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Attempt 1: the card is authorized, the charge is real</text>
  <text x="1190" y="208" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">nothing here goes wrong</text>
  <text x="48" y="498" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The reply is lost, the client times out</text>
  <text x="48" y="718" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Attempt 2: an honest retry that nothing can tell is a repeat</text>
  <text x="1190" y="718" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no idempotency key to recognize it</text>

  <g fill="none" stroke-width="2.5">
    <path d="M220,280 L618,280" stroke="#3B82F6" marker-end="url(#m04-l04-duplicate-charge-bl)"/>
    <path d="M620,345 L1018,345" stroke="#3B82F6" marker-end="url(#m04-l04-duplicate-charge-bl)"/>
    <path d="M1020,405 L622,405" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m04-l04-duplicate-charge-em)"/>
    <path d="M614,565 L446,565" stroke="#DC2626" stroke-dasharray="6 5"/>
    <path d="M220,805 L618,805" stroke="#3B82F6" marker-end="url(#m04-l04-duplicate-charge-bl)"/>
    <path d="M620,865 L1018,865" stroke="#3B82F6" marker-end="url(#m04-l04-duplicate-charge-bl)"/>
    <path d="M1020,945 L622,945" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m04-l04-duplicate-charge-rd)"/>
  </g>
  <g stroke="#DC2626" stroke-width="3" fill="none">
    <path d="M427,557 L443,573"/>
    <path d="M443,557 L427,573"/>
  </g>

  <text x="420" y="266" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. Charge the card</text>
  <text x="820" y="331" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. Authorize</text>
  <text x="820" y="391" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. Approved</text>
  <text x="530" y="548" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reply never arrives</text>
  <text x="420" y="791" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. Retry the same charge</text>
  <text x="820" y="851" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. Authorize</text>
  <text x="820" y="905" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. Approved again</text>
  <text x="820" y="931" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a second real charge</text>

  <g filter="url(#m04-l04-duplicate-charge-soft)">
    <rect x="70" y="530" width="300" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="220" y="571" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Client times out</text>
  <text x="220" y="603" text-anchor="middle" font-size="20" fill="#64748B">the outcome is unknown</text>
  <g filter="url(#m04-l04-duplicate-charge-soft)">
    <rect x="660" y="510" width="440" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="880" y="550" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A timeout is not an answer</text>
  <text x="880" y="582" text-anchor="middle" font-size="20" fill="#64748B">You gave up waiting, so you</text>
  <text x="880" y="614" text-anchor="middle" font-size="20" fill="#64748B">cannot tell whether it happened.</text>

  <g filter="url(#m04-l04-duplicate-charge-soft)">
    <rect x="60" y="1010" width="520" height="100" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="320" y="1051" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One click, two charges</text>
  <text x="320" y="1083" text-anchor="middle" font-size="20" fill="#64748B">The duplicate is not a bug, it is the contract.</text>
  <g filter="url(#m04-l04-duplicate-charge-soft)">
    <rect x="800" y="1010" width="380" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="990" y="1051" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The customer paid twice</text>
  <text x="990" y="1083" text-anchor="middle" font-size="20" fill="#64748B">two authorizations, one intent</text>

  <g filter="url(#m04-l04-duplicate-charge-soft)">
    <rect x="90" y="50" width="260" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="220" y="86" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Client</text>
  <text x="220" y="118" text-anchor="middle" font-size="20" fill="#64748B">clicks Pay once</text>
  <g filter="url(#m04-l04-duplicate-charge-soft)">
    <rect x="470" y="50" width="300" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="86" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment service</text>
  <text x="620" y="118" text-anchor="middle" font-size="20" fill="#64748B">charging is not idempotent</text>
  <g filter="url(#m04-l04-duplicate-charge-soft)">
    <rect x="880" y="50" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1020" y="86" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Card network</text>
  <text x="1020" y="118" text-anchor="middle" font-size="20" fill="#64748B">external authorization</text>

  <line x1="60" y1="1150" x2="96" y2="1150" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1157" font-size="20" fill="#475569">Synchronous request: the caller waits</text>
  <line x1="60" y1="1190" x2="96" y2="1190" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1197" font-size="20" fill="#475569">Reply from the card network</text>
  <line x1="60" y1="1230" x2="96" y2="1230" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1237" font-size="20" fill="#475569">Lost reply, and the duplicate charge that follows</text>
</svg>