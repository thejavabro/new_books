<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1226" viewBox="0 0 1240 1226" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The eleven named failures of creating a payment, each with its status, stable code, condition, and caller action, grouped into what the caller can repair, what identity and permission block, and what timing and state block. They span invalid amounts and currencies, idempotency misuse, authentication, scope, quota, an unknown payment method, a reference conflict, an in-progress duplicate, a rate limit, and a service that cannot durably create.">
  <defs>
    <filter id="p1s-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1s-k1"><rect x="84" y="174" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k2"><rect x="656" y="174" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k3"><rect x="84" y="300" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k4"><rect x="656" y="300" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k5"><rect x="84" y="494" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k6"><rect x="656" y="494" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k7"><rect x="84" y="620" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k8"><rect x="84" y="814" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k9"><rect x="656" y="814" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k10"><rect x="84" y="940" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p1s-k11"><rect x="656" y="940" width="500" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1226" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Eleven named failures for one money operation</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M560,66 L571,77 M571,66 L560,77"/>
  </g>
  <text x="583" y="77" font-size="15.5" fill="#6B7280">the condition that produces it</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M856,71 L860.5,75.5 L868,65.5"/>
  </g>
  <text x="882" y="77" font-size="15.5" fill="#6B7280">the action the caller takes next</text>

  
  <rect x="40" y="126" width="1160" height="296" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">The caller can repair the request itself</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four failures</text>

  <g filter="url(#p1s-soft)">
    <rect x="84" y="174" width="500" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p1s-k1)"/>
  </g>
  <circle cx="118" cy="198" r="4.5" fill="#DB2777"/>
  <text x="142" y="205" font-size="18.5" font-weight="600" fill="#BE185D">400</text>
  <text x="184" y="205" font-size="18.5" font-weight="600" fill="#111827">invalid_amount</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,237 L97,248 M97,237 L86,248"/>
  </g>
  <text x="110" y="248" font-size="15.5" fill="#6B7280">Missing, non-integer, or below 1 in the smallest unit</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,268 L90.5,272.5 L98,262.5"/>
  </g>
  <text x="110" y="274" font-size="15.5" fill="#6B7280">correct the field</text>

  <g filter="url(#p1s-soft)">
    <rect x="656" y="174" width="500" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="656" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p1s-k2)"/>
  </g>
  <circle cx="690" cy="198" r="4.5" fill="#DB2777"/>
  <text x="714" y="205" font-size="18.5" font-weight="600" fill="#BE185D">400</text>
  <text x="756" y="205" font-size="18.5" font-weight="600" fill="#111827">unsupported_currency</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M658,237 L669,248 M669,237 L658,248"/>
  </g>
  <text x="682" y="248" font-size="15.5" fill="#6B7280">The currency is not supported</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M658,268 L662.5,272.5 L670,262.5"/>
  </g>
  <text x="682" y="274" font-size="15.5" fill="#6B7280">choose an allowed value</text>

  <g filter="url(#p1s-soft)">
    <rect x="84" y="300" width="500" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="300" width="6" height="48" fill="#DB2777" clip-path="url(#p1s-k3)"/>
  </g>
  <circle cx="118" cy="324" r="4.5" fill="#DB2777"/>
  <text x="142" y="331" font-size="18.5" font-weight="600" fill="#BE185D">400</text>
  <text x="184" y="331" font-size="18.5" font-weight="600" fill="#111827">idempotency_key_reused</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,363 L97,374 M97,363 L86,374"/>
  </g>
  <text x="110" y="374" font-size="15.5" fill="#6B7280">The same key names a different body</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,394 L90.5,398.5 L98,388.5"/>
  </g>
  <text x="110" y="400" font-size="15.5" fill="#6B7280">correct the key usage</text>

  <g filter="url(#p1s-soft)">
    <rect x="656" y="300" width="500" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="656" y="300" width="6" height="48" fill="#DB2777" clip-path="url(#p1s-k4)"/>
  </g>
  <circle cx="690" cy="324" r="4.5" fill="#DB2777"/>
  <text x="714" y="331" font-size="18.5" font-weight="600" fill="#BE185D">404</text>
  <text x="756" y="331" font-size="18.5" font-weight="600" fill="#111827">payment_method_not_found</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M658,363 L669,374 M669,363 L658,374"/>
  </g>
  <text x="682" y="374" font-size="15.5" fill="#6B7280">Absent, or owned by another merchant</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M658,394 L662.5,398.5 L670,388.5"/>
  </g>
  <text x="682" y="400" font-size="15.5" fill="#6B7280">correct the payment method reference</text>

  
  <rect x="40" y="446" width="1160" height="296" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="476" font-size="16.5" font-weight="600" fill="#B45309">Identity and permission, where a retry changes nothing</text>
  <text x="1176" y="476" text-anchor="end" font-size="15.5" fill="#6B7280">three failures</text>

  <g filter="url(#p1s-soft)">
    <rect x="84" y="494" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="84" y="494" width="6" height="48" fill="#D97706" clip-path="url(#p1s-k5)"/>
  </g>
  <circle cx="118" cy="518" r="4.5" fill="#D97706"/>
  <text x="142" y="525" font-size="18.5" font-weight="600" fill="#B45309">401</text>
  <text x="184" y="525" font-size="18.5" font-weight="600" fill="#111827">authentication_required</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,557 L97,568 M97,557 L86,568"/>
  </g>
  <text x="110" y="568" font-size="15.5" fill="#6B7280">Credential missing, invalid, or withdrawn</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,588 L90.5,592.5 L98,582.5"/>
  </g>
  <text x="110" y="594" font-size="15.5" fill="#6B7280">authenticate</text>

  <g filter="url(#p1s-soft)">
    <rect x="656" y="494" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="656" y="494" width="6" height="48" fill="#D97706" clip-path="url(#p1s-k6)"/>
  </g>
  <circle cx="690" cy="518" r="4.5" fill="#D97706"/>
  <text x="714" y="525" font-size="18.5" font-weight="600" fill="#B45309">403</text>
  <text x="756" y="525" font-size="18.5" font-weight="600" fill="#111827">insufficient_scope</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M658,557 L669,568 M669,557 L658,568"/>
  </g>
  <text x="682" y="568" font-size="15.5" fill="#6B7280">The credential lacks payments:create</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M658,588 L662.5,592.5 L670,582.5"/>
  </g>
  <text x="682" y="594" font-size="15.5" fill="#6B7280">obtain the scope, or stop</text>

  <g filter="url(#p1s-soft)">
    <rect x="84" y="620" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="84" y="620" width="6" height="48" fill="#D97706" clip-path="url(#p1s-k7)"/>
  </g>
  <circle cx="118" cy="644" r="4.5" fill="#D97706"/>
  <text x="142" y="651" font-size="18.5" font-weight="600" fill="#B45309">403</text>
  <text x="184" y="651" font-size="18.5" font-weight="600" fill="#111827">quota_exceeded</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,683 L97,694 M97,683 L86,694"/>
  </g>
  <text x="110" y="694" font-size="15.5" fill="#6B7280">The merchant is over its plan allowance</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,714 L90.5,718.5 L98,708.5"/>
  </g>
  <text x="110" y="720" font-size="15.5" fill="#6B7280">change plan or permission</text>

  
  <rect x="40" y="766" width="1160" height="296" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="796" font-size="16.5" font-weight="600" fill="#4338CA">Timing and state, where waiting or a new value is the answer</text>
  <text x="1176" y="796" text-anchor="end" font-size="15.5" fill="#6B7280">four failures</text>

  <g filter="url(#p1s-soft)">
    <rect x="84" y="814" width="500" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="814" width="6" height="48" fill="#4F46E5" clip-path="url(#p1s-k8)"/>
  </g>
  <circle cx="118" cy="838" r="4.5" fill="#4F46E5"/>
  <text x="142" y="845" font-size="18.5" font-weight="600" fill="#4338CA">409</text>
  <text x="184" y="845" font-size="18.5" font-weight="600" fill="#111827">merchant_reference_conflict</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,877 L97,888 M97,877 L86,888"/>
  </g>
  <text x="110" y="888" font-size="15.5" fill="#6B7280">That reference already names a payment</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,908 L90.5,912.5 L98,902.5"/>
  </g>
  <text x="110" y="914" font-size="15.5" fill="#6B7280">read it, or choose a new one</text>

  <g filter="url(#p1s-soft)">
    <rect x="656" y="814" width="500" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="656" y="814" width="6" height="48" fill="#4F46E5" clip-path="url(#p1s-k9)"/>
  </g>
  <circle cx="690" cy="838" r="4.5" fill="#4F46E5"/>
  <text x="714" y="845" font-size="18.5" font-weight="600" fill="#4338CA">409</text>
  <text x="756" y="845" font-size="18.5" font-weight="600" fill="#111827">idempotency_request_in_progress</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M658,877 L669,888 M669,877 L658,888"/>
  </g>
  <text x="682" y="888" font-size="15.5" fill="#6B7280">The same key and body are still running</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M658,908 L662.5,912.5 L670,902.5"/>
  </g>
  <text x="682" y="914" font-size="15.5" fill="#6B7280">wait for Retry-After</text>

  <g filter="url(#p1s-soft)">
    <rect x="84" y="940" width="500" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="940" width="6" height="48" fill="#4F46E5" clip-path="url(#p1s-k10)"/>
  </g>
  <circle cx="118" cy="964" r="4.5" fill="#4F46E5"/>
  <text x="142" y="971" font-size="18.5" font-weight="600" fill="#4338CA">429</text>
  <text x="184" y="971" font-size="18.5" font-weight="600" fill="#111827">rate_limit_exceeded</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,1003 L97,1014 M97,1003 L86,1014"/>
  </g>
  <text x="110" y="1014" font-size="15.5" fill="#6B7280">The payment-create bucket is empty</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,1034 L90.5,1038.5 L98,1028.5"/>
  </g>
  <text x="110" y="1040" font-size="15.5" fill="#6B7280">wait for Retry-After</text>

  <g filter="url(#p1s-soft)">
    <rect x="656" y="940" width="500" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="656" y="940" width="6" height="48" fill="#4F46E5" clip-path="url(#p1s-k11)"/>
  </g>
  <circle cx="690" cy="964" r="4.5" fill="#4F46E5"/>
  <text x="714" y="971" font-size="18.5" font-weight="600" fill="#4338CA">503</text>
  <text x="756" y="971" font-size="18.5" font-weight="600" fill="#111827">payment_service_unavailable</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M658,1003 L669,1014 M669,1003 L658,1014"/>
  </g>
  <text x="682" y="1014" font-size="15.5" fill="#6B7280">Cannot durably create a payment now</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M658,1034 L662.5,1038.5 L670,1028.5"/>
  </g>
  <text x="682" y="1040" font-size="15.5" fill="#6B7280">retry with the same key</text>

  
  <rect x="40" y="1086" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1128" text-anchor="middle" font-size="16" fill="#475569">Every failure names what the caller should do next, and the eleven fall into three groups.</text>
  <text x="620" y="1156" text-anchor="middle" font-size="16" fill="#475569">A declined card is not one of them: it returns 201 with a failed payment, because the answer was no.</text>
</svg>