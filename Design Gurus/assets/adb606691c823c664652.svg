<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="744" viewBox="0 0 1240 744" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="poison-title poison-desc">
<title id="poison-title">Poison messages and the retry topology</title>
<desc id="poison-desc">Retrying a permanently failing record in place blocks the partition, because offsets commit in order. Transient and permanent failures need opposite responses, and a dead letter topic has an ordering cost of its own.</desc>
<defs>
<marker id="poison-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="poison-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="poison-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="poison-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="744" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Poison messages and the retry topology</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A poison message is one that will never be processed successfully.</text>
<rect x="40" y="666" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="666" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Why one bad record stops a partition</text>
<rect x="40" y="168" width="180" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="130" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ok</text><rect x="236" y="168" width="180" height="56" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="326" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ok</text><rect x="432" y="168" width="180" height="56" rx="7" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="522" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">poison</text><rect x="628" y="168" width="180" height="56" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="718" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">waiting</text><rect x="824" y="168" width="180" height="56" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="914" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">waiting</text><rect x="1020" y="168" width="180" height="56" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1110" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">waiting</text>
<text x="620" y="256" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Offsets commit in order, so the consumer cannot move past a record it has not completed</text>
<rect x="40" y="284" width="560" height="106" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="284" width="5" height="106" rx="2.5" fill="#F3CF6A"/><text x="64" y="317" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Transient</text><text x="64" y="343" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Caused by something outside the message: a timeout,</text><text x="64" y="369" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a 503, a lock conflict. Retrying is correct.</text>
<rect x="640" y="284" width="560" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="284" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="664" y="317" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Permanent</text><text x="664" y="343" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Caused by the message itself: it will not deserialize,</text><text x="664" y="369" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">it references nothing. Retrying never succeeds.</text>
<text x="40" y="432" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The standard topology</text>
<rect x="40" y="450" width="340" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="210" y="472.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a few in-place retries</text><text x="210" y="499.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">with backoff</text>
<path d="M386 480H420" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M386 480H420" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#poison-marker-slate)"/>
<rect x="430" y="450" width="300" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="580" y="486" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">still failing</text>
<path d="M736 480H770" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M736 480H770" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#poison-marker-slate)"/>
<rect x="780" y="450" width="420" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="990" y="472.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">dead letter topic, so the</text><text x="990" y="499.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">partition can advance</text>
<rect x="40" y="534" width="560" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="534" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="64" y="567" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A dead letter topic nobody reads</text><text x="64" y="593" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">is a data loss mechanism with a reassuring name.</text><text x="64" y="619" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It needs an owner, an alert, and a replay path.</text>
<rect x="640" y="534" width="560" height="106" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="534" width="5" height="106" rx="2.5" fill="#F3CF6A"/><text x="664" y="567" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Parking a record breaks ordering</text><text x="664" y="593" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">for its key. Where state depends on sequence,</text><text x="664" y="619" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">stop and page somebody. Decide this per topic.</text>
<text x="66" y="700" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Retrying a permanent failure forever is the most common cause of a stuck partition.</text>
</svg>