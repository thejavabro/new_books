<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1660" viewBox="0 0 1240 1660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The trip state machine: requested moves to matched when a driver accepts, then to started and ended; ended becomes fare_pending while the trace completes, then fare_final, then charged when the capture succeeds or outstanding when it declines, with a retry that clears it; requested can exit to no_drivers or cancelled_free, matched can exit to cancelled_free or cancelled_fee, cancelled_fee is charged, and both no_drivers and cancelled_free release the authorization into hold_voided.">
  <defs>
    <marker id="m07-l04-trip-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l04-trip-states-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l04-trip-states-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l04-trip-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l04-trip-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l04-trip-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1660" fill="#FFFFFF"/>

  <text x="60" y="80" font-size="20" fill="#64748B">the rider requests, and the quote is validated and pinned</text>
  <circle cx="175" cy="115" r="12" fill="#475569"/>
  <path d="M175,130 L175,192" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#m07-l04-trip-states-sl)"/>

  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="50" y="200" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="175" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">requested</text>
  <text x="175" y="283" text-anchor="middle" font-size="20" fill="#64748B">multiplier pinned</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="340" y="200" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="465" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">matched</text>
  <text x="465" y="283" text-anchor="middle" font-size="20" fill="#64748B">driver committed</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="630" y="200" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="755" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">started</text>
  <text x="755" y="283" text-anchor="middle" font-size="20" fill="#64748B">the meter is running</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="920" y="200" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1045" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">ended</text>
  <text x="1045" y="283" text-anchor="middle" font-size="20" fill="#64748B">the trace is flushing</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="50" y="430" width="250" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="175" y="481" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">no_drivers</text>
  <text x="175" y="513" text-anchor="middle" font-size="20" fill="#64748B">the search expired</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="340" y="430" width="280" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="480" y="481" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">cancelled_free</text>
  <text x="480" y="513" text-anchor="middle" font-size="20" fill="#64748B">no fee</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="680" y="430" width="280" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="820" y="481" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">cancelled_fee</text>
  <text x="820" y="513" text-anchor="middle" font-size="20" fill="#64748B">the fee goes to the driver</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="980" y="430" width="250" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1105" y="481" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">fare_pending</text>
  <text x="1105" y="513" text-anchor="middle" font-size="20" fill="#64748B">waiting on the trace</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="980" y="660" width="250" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1105" y="711" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">fare_final</text>
  <text x="1105" y="743" text-anchor="middle" font-size="20" fill="#64748B">the amount exists</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="680" y="900" width="280" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="820" y="951" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">charged</text>
  <text x="820" y="983" text-anchor="middle" font-size="20" fill="#64748B">the funds are taken</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="980" y="1090" width="250" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1105" y="1141" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">outstanding</text>
  <text x="1105" y="1173" text-anchor="middle" font-size="20" fill="#64748B">retried on a schedule</text>
  <g filter="url(#m07-l04-trip-states-soft)">
    <rect x="50" y="900" width="280" height="120" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="190" y="951" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">hold_voided</text>
  <text x="190" y="983" text-anchor="middle" font-size="20" fill="#64748B">the hold is released</text>

  <g fill="none" stroke-width="2.5">
    <path d="M300,260 L332,260" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-trip-states-bl)"/>
    <path d="M590,260 L622,260" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-trip-states-bl)"/>
    <path d="M880,260 L912,260" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-trip-states-bl)"/>
    <path d="M120,320 L120,422" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l04-trip-states-rd)"/>
    <path d="M230,320 C230,380 420,375 420,422" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l04-trip-states-rd)"/>
    <path d="M480,320 L480,422" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l04-trip-states-rd)"/>
    <path d="M560,320 C620,360 760,378 790,422" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l04-trip-states-rd)"/>
    <path d="M1045,320 L1045,422" stroke="#D97706" marker-end="url(#m07-l04-trip-states-ab)"/>
    <path d="M1105,550 L1105,652" stroke="#D97706" marker-end="url(#m07-l04-trip-states-ab)"/>
    <path d="M1030,780 C1000,840 860,852 830,892" stroke="#059669" marker-end="url(#m07-l04-trip-states-em)"/>
    <path d="M1105,780 L1105,1082" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l04-trip-states-rd)"/>
    <path d="M980,1150 L860,1150 L860,1030" stroke="#059669" stroke-width="2" marker-end="url(#m07-l04-trip-states-em)"/>
    <path d="M820,550 L820,892" stroke="#059669" stroke-width="2" marker-end="url(#m07-l04-trip-states-em)"/>
    <path d="M120,550 L120,892" stroke="#475569" stroke-width="2" marker-end="url(#m07-l04-trip-states-sl)"/>
    <path d="M420,550 C420,700 220,760 200,892" stroke="#475569" stroke-width="2" marker-end="url(#m07-l04-trip-states-sl)"/>
    <path d="M672,960 L560,960 L560,1128" stroke="#475569" stroke-width="2" marker-end="url(#m07-l04-trip-states-sl)"/>
    <path d="M190,1020 L190,1150 L536,1150" stroke="#475569" stroke-width="2" marker-end="url(#m07-l04-trip-states-sl)"/>
  </g>

  <circle cx="560" cy="1150" r="16" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="560" cy="1150" r="8" fill="#475569"/>
  <text x="592" y="1158" font-size="20" fill="#64748B">the trip is closed</text>

  <text x="316" y="150" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the driver</text>
  <text x="316" y="178" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">accepts</text>
  <text x="606" y="164" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the rider is in the car</text>
  <text x="896" y="150" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the driver</text>
  <text x="896" y="178" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">ends the trip</text>
  <text x="140" y="370" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">nobody accepts</text>
  <text x="330" y="402" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the rider cancels</text>
  <text x="700" y="402" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">after the grace window</text>
  <text x="1025" y="370" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the trip is over</text>
  <text x="1085" y="610" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the fare is computed</text>
  <text x="880" y="870" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the capture succeeds</text>
  <text x="1085" y="830" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the capture declines</text>
  <text x="960" y="1100" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the retry succeeds</text>
  <text x="700" y="830" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the fee is charged</text>
  <text x="140" y="700" font-size="20" fill="#64748B">release the hold</text>

  <rect x="60" y="1260" width="540" height="180" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="90" y="1306" font-size="20" font-weight="600" fill="#334155">A decline is a receivable, not a rollback</text>
  <text x="90" y="1348" font-size="20" fill="#475569">You cannot repossess a ride, so the fare</text>
  <text x="90" y="1384" font-size="20" fill="#475569">stays final and the balance is retried.</text>
  <text x="90" y="1420" font-size="20" fill="#475569">The driver is paid from the ledger either way.</text>
  <rect x="640" y="1260" width="540" height="180" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="670" y="1306" font-size="20" font-weight="600" fill="#334155">Cancellation is business logic in Trips</text>
  <text x="670" y="1348" font-size="20" fill="#475569">Free before the driver commits. After a</text>
  <text x="670" y="1384" font-size="20" fill="#475569">match plus a two-minute grace window a</text>
  <text x="670" y="1420" font-size="20" fill="#475569">fee applies, most of it going to the driver.</text>

  <line x1="60" y1="1490" x2="96" y2="1490" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1497" font-size="20" fill="#475569">The forward path along the trip</text>
  <line x1="60" y1="1530" x2="96" y2="1530" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="1537" font-size="20" fill="#475569">The fare being derived from the trace</text>
  <line x1="60" y1="1570" x2="96" y2="1570" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1577" font-size="20" fill="#475569">A cancellation, or a capture that declines</text>
  <line x1="60" y1="1610" x2="96" y2="1610" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1617" font-size="20" fill="#475569">Money captured</text>
</svg>