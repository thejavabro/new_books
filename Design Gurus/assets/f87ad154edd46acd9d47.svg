<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="846" viewBox="0 0 1240 846" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same list read twice while a new item arrives at the top. With an offset, the second request skips a shifted number of positions, so one already-seen row appears again. With a cursor, the boundary stays attached to the last returned created_at and id pair, so every row appears once.">
  <defs>
    <marker id="xl08offsetv-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="xl08offsetv-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="xl08offsetv-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl08offsetv-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl08offsetv-k1"><rect x="110" y="88" width="470" height="90" rx="12"/></clipPath>
    <clipPath id="xl08offsetv-k2"><rect x="660" y="88" width="470" height="90" rx="12"/></clipPath>
    <clipPath id="xl08offsetv-k3"><rect x="84" y="292" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl08offsetv-k4"><rect x="84" y="462" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl08offsetv-k5"><rect x="684" y="292" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl08offsetv-k6"><rect x="684" y="462" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="846" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="162" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Offset against cursor, during an insertion</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">the same list, read twice</text>

  <g filter="url(#xl08offsetv-soft)">
    <rect x="110" y="88" width="470" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="110" y="88" width="6" height="90" fill="#64748B" clip-path="url(#xl08offsetv-k1)"/>
  </g>
  <circle cx="148" cy="133" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,122.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="174" y="140" font-size="18.5" font-weight="600" fill="#111827">Page 1 returned A, B, C</text>

  <g filter="url(#xl08offsetv-soft)">
    <rect x="660" y="88" width="470" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="660" y="88" width="6" height="90" fill="#64748B" clip-path="url(#xl08offsetv-k2)"/>
  </g>
  <circle cx="698" cy="133" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,122.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="724" y="140" font-size="18.5" font-weight="600" fill="#111827">Then a new item N arrives on top</text>

  
  <rect x="44" y="236" width="552" height="442" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="84" y="272" font-size="16.5" font-weight="600" fill="#BE185D">Offset paging</text>

  <g fill="none" stroke-width="2">
    <path d="M320,382 V462" stroke="#DB2777" marker-end="url(#xl08offsetv-pm)"/>
  </g>

  <g filter="url(#xl08offsetv-soft)">
    <rect x="84" y="292" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="292" width="6" height="90" fill="#DB2777" clip-path="url(#xl08offsetv-k3)"/>
  </g>
  <circle cx="122" cy="337" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,326.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="148" y="344" font-size="18.5" font-weight="600" fill="#111827">Page 2 asks for offset=3</text>

  <g filter="url(#xl08offsetv-lift)">
    <rect x="84" y="462" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="462" width="9" height="90" fill="#DB2777" clip-path="url(#xl08offsetv-k4)"/>
  </g>
  <circle cx="122" cy="507" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,496.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="148" y="514" font-size="18.5" font-weight="600" fill="#111827">C appears a second time</text>

  <text x="84" y="592" font-size="15.5" font-weight="600" fill="#BE185D">Why the row repeats</text>
  <circle cx="92" cy="617" r="3.5" fill="#DB2777"/>
  <text x="106" y="622" font-size="15.5" fill="#6B7280">The list shifted, so offset=3 skips N, A, and B.</text>
  <circle cx="92" cy="647" r="3.5" fill="#DB2777"/>
  <text x="106" y="652" font-size="15.5" fill="#6B7280">An offset counts positions, and the positions moved.</text>

  
  <rect x="644" y="236" width="552" height="442" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="272" font-size="16.5" font-weight="600" fill="#047857">Cursor paging</text>

  <g fill="none" stroke-width="2">
    <path d="M920,382 V462" stroke="#059669" marker-end="url(#xl08offsetv-em)"/>
  </g>

  <g filter="url(#xl08offsetv-soft)">
    <rect x="684" y="292" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="292" width="6" height="90" fill="#059669" clip-path="url(#xl08offsetv-k5)"/>
  </g>
  <circle cx="722" cy="337" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,326.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="748" y="344" font-size="18.5" font-weight="600" fill="#111827">Page 2 continues after C</text>

  <g filter="url(#xl08offsetv-lift)">
    <rect x="684" y="462" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="462" width="9" height="90" fill="#059669" clip-path="url(#xl08offsetv-k6)"/>
  </g>
  <circle cx="722" cy="507" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,496.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="748" y="514" font-size="18.5" font-weight="600" fill="#111827">Existing rows do not shift in this example</text>

  <text x="684" y="592" font-size="15.5" font-weight="600" fill="#047857">Why the boundary holds</text>
  <circle cx="692" cy="617" r="3.5" fill="#059669"/>
  <text x="706" y="622" font-size="15.5" fill="#6B7280">The cursor holds the created_at and id of C.</text>
  <circle cx="692" cy="647" r="3.5" fill="#059669"/>
  <text x="706" y="652" font-size="15.5" fill="#6B7280">The next page starts at the row right after C.</text>

  
  <rect x="40" y="702" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="745" text-anchor="middle" font-size="16" fill="#475569">An offset names a position in a list that moves.</text>
  <text x="620" y="776" text-anchor="middle" font-size="16" fill="#475569">An immutable sort-key boundary avoids this offset shift.</text>
</svg>