<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="readstages-title readstages-desc">
<title id="readstages-title">Moving reads in stages</title>
<desc id="readstages-desc">Four stages rather than one switch. Reading both and returning the old value exercises the new path under real load with real data, and logs the differences instead of serving them.</desc>
<defs>
<marker id="readstages-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="readstages-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="readstages-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="readstages-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Moving reads in stages</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Switching reads is not one step either, and splitting it buys a stage where you learn without risk.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="150" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Read old, return old</text>
<path d="M536 150H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 150H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readstages-marker-slate)"/>
<rect x="580" y="118" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="156" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the starting state</text>
<circle cx="60" cy="226" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="194" width="440" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Read both, compare, return old</text>
<path d="M536 226H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 226H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readstages-marker-slate)"/>
<rect x="580" y="194" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the new path is exercised by every real request,</text><text x="600" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and a difference is logged rather than served</text>
<circle cx="60" cy="302" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="270" width="440" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Read new, return new</text>
<path d="M536 302H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 302H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readstages-marker-slate)"/>
<rect x="580" y="270" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="308" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a small percentage first, then wider</text>
<circle cx="60" cy="378" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="385" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="346" width="440" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Read new only</text>
<path d="M536 378H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 378H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readstages-marker-slate)"/>
<rect x="580" y="346" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="384" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the old read path is removed</text>
<rect x="40" y="436" width="1160" height="122" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="436" width="5" height="122" rx="2.5" fill="#39D5AA"/><text x="64" y="464" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Stage two is the one that gets skipped and the one that finds things</text><text x="64" y="490" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A comparison job samples rows. Stage two exercises the exact code path, with the</text><text x="64" y="516" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">exact query shapes, under the exact concurrency of production.</text><text x="64" y="542" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A missing index or a plan that degrades at scale surfaces here rather than after.</text>
<rect x="40" y="582" width="1160" height="84" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="582" width="5" height="84" rx="2.5" fill="#F3CF6A"/><text x="64" y="617" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">And it costs something honest</text><text x="64" y="643" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Every read does twice the work, which is why it is a stage rather than an arrangement.</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Sample the traffic if the volume makes doubling the reads expensive, and say what percentage you used.</text>
</svg>