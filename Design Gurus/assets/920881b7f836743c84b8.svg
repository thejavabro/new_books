<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="726" viewBox="0 0 1240 726" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ratchet-title ratchet-desc">
<title id="ratchet-title">How alert channels die</title>
<desc id="ratchet-desc">Alerts are added one at a time in response to incidents and never removed, producing a system where the signal exists and cannot be found.</desc>
<defs>
<marker id="ratchet-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ratchet-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ratchet-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ratchet-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="726" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">How alert channels die</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Alerts are added one at a time in response to incidents and never removed.</text>
<rect x="40" y="648" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="648" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="880" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="530" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An incident happens</text>
<circle cx="60" cy="214" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="880" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="530" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Somebody adds an alert</text>
<circle cx="60" cy="282" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="880" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="530" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It fires on a condition more common than the incident</text>
<circle cx="60" cy="350" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="880" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="530" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Nobody deletes it</text>
<path d="M976 350H1032V146H982" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M976 350H1032V146H982" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ratchet-marker-slate)"/>
<text x="1046" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">repeat for</text><text x="1046" y="268" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">three years</text>
<rect x="40" y="402" width="1160" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="402" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="64" y="435" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The cost is not irritation</text><text x="64" y="461" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The real alert arrives in a stream the team has already learned to discount,</text><text x="64" y="487" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which is how an outage lasts forty minutes instead of four.</text>
<rect x="40" y="528" width="560" height="94" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="528" width="5" height="94" rx="2.5" fill="#AC8BE8"/><text x="64" y="567.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">So it is a design failure,</text><text x="64" y="594.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">not a discipline failure.</text>
<rect x="640" y="528" width="560" height="94" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="528" width="5" height="94" rx="2.5" fill="#39D5AA"/><text x="664" y="567.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">The fix is a rule applied to every alert</text><text x="664" y="594.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">that exists today, not only to new ones.</text>
<text x="66" y="682" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An alert nobody acts on is worse than no alert, because it trains the team to not act.</text>
</svg>