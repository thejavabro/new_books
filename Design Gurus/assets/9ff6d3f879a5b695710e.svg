<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Redundancy in the Instagram design: replicated upload and read services, three copies of every photo in object storage, and an active-passive primary and standby pair.">
  <defs>
    <marker id="ig04-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="ig04-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="ig04-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ig04-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ig04-k1"><rect x="270" y="95" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="ig04-k2"><rect x="700" y="95" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="ig04-k3"><rect x="315" y="540" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="ig04-k4"><rect x="645" y="540" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="195" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">Services run as replicas</text>

  <rect x="40" y="265" width="1160" height="190" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="295" font-size="16.5" font-weight="600" fill="#B45309">Every photo has copies</text>

  <rect x="40" y="485" width="1160" height="195" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="515" font-size="16.5" font-weight="600" fill="#5B21B6">Active-passive for singletons</text>

  
  <g fill="none" stroke-width="2">
    <path d="M400,380 L530,380" stroke="#D97706" marker-end="url(#ig04-am)"/>
    <path d="M710,380 L840,380" stroke="#D97706" marker-end="url(#ig04-am)"/>
    <path d="M515,585 L645,585" stroke="#DB2777" marker-end="url(#ig04-pk)"/>
  </g>

  
  <g filter="url(#ig04-soft)">
    <rect x="270" y="95" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="270" y="95" width="6" height="90" fill="#2563EB" clip-path="url(#ig04-k1)"/>
  </g>
  <circle cx="308" cy="140" r="18" fill="#FFFFFF"/>
  <g transform="translate(297.56,129.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 17V5M7 10l5-5 5 5"/>
    <path d="M4 21h16"/>
  </g>
  <text x="334" y="147" font-size="18.5" font-weight="600" fill="#111827">Upload Service x N</text>

  <g filter="url(#ig04-soft)">
    <rect x="700" y="95" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="700" y="95" width="6" height="90" fill="#2563EB" clip-path="url(#ig04-k2)"/>
  </g>
  <circle cx="738" cy="140" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,129.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="764" y="147" font-size="18.5" font-weight="600" fill="#111827">Read Service x N</text>

  <text x="620" y="212" font-size="15.5" text-anchor="middle" fill="#6B7280">any instance can die; the rest keep serving</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M220,330 L220,412 A90,16 0 0 0 400,412 L400,330" fill="#FEF3C7"/>
    <ellipse cx="310" cy="330" rx="90" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="310" y="387" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Object Storage</text>

  <g stroke="#D97706" stroke-width="1.5">
    <path d="M530,330 L530,412 A90,16 0 0 0 710,412 L710,330" fill="#FEF3C7"/>
    <ellipse cx="620" cy="330" rx="90" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="620" y="387" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Copy 2</text>

  <g stroke="#D97706" stroke-width="1.5">
    <path d="M840,330 L840,412 A90,16 0 0 0 1020,412 L1020,330" fill="#FEF3C7"/>
    <ellipse cx="930" cy="330" rx="90" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="930" y="387" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Copy 3</text>

  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="465" y="372" fill="#B45309">replicate</text>
    <text x="775" y="372" fill="#B45309">replicate</text>
  </g>

  
  <g filter="url(#ig04-lift)">
    <rect x="315" y="540" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="315" y="540" width="9" height="90" fill="#7C3AED" clip-path="url(#ig04-k3)"/>
  </g>
  <circle cx="353" cy="585" r="18" fill="#FFFFFF"/>
  <g transform="translate(342.56,574.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="379" y="592" font-size="18.5" font-weight="600" fill="#111827">Primary</text>

  <g filter="url(#ig04-soft)">
    <rect x="645" y="540" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="645" y="540" width="6" height="90" fill="#64748B" clip-path="url(#ig04-k4)"/>
  </g>
  <circle cx="683" cy="585" r="18" fill="#FFFFFF"/>
  <g transform="translate(672.56,574.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5v14M15 5v14"/>
  </g>
  <text x="709" y="592" font-size="18.5" font-weight="600" fill="#111827">Secondary (standby)</text>

  <text x="785" y="655" font-size="15.5" text-anchor="middle" fill="#6B7280">serves no traffic while the primary is healthy</text>

  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="580" y="577" fill="#BE185D">failover</text>
  </g>

  
  <rect x="40" y="710" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="755" text-anchor="middle" font-size="16" fill="#475569">Redundancy removes the single point of failure: replicas for services, copies for files, and a standby that takes over when a primary fails.</text>
</svg>