<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="888" viewBox="0 0 1240 888" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The paging loop a caller actually writes: send the first request with no cursor, process the items, repeat the returned cursor exactly, send the next request, and loop back to processing while next_cursor is not null, stopping only when next_cursor is null. The caller never infers the end from a short page.">
  <defs>
    <marker id="xl08pagingl-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="xl08pagingl-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="xl08pagingl-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl08pagingl-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl08pagingl-k1"><rect x="320" y="100" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="xl08pagingl-k2"><rect x="320" y="230" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="xl08pagingl-k3"><rect x="320" y="360" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="xl08pagingl-k4"><rect x="320" y="490" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="xl08pagingl-k5"><rect x="320" y="620" width="600" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="888" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="684" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The loop the caller writes, and the two fields it needs</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">five steps, in order</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,188 V230" stroke="#64748B" marker-end="url(#xl08pagingl-sl)"/>
    <path d="M620,318 V360" stroke="#64748B" marker-end="url(#xl08pagingl-sl)"/>
    <path d="M620,448 V490" stroke="#64748B" marker-end="url(#xl08pagingl-sl)"/>
    <path d="M920,514 H1148 Q1160,514 1160,502 V266 Q1160,254 1148,254 H920" stroke="#64748B" marker-end="url(#xl08pagingl-sl)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="1128" y="384" fill="#475569" transform="rotate(-90 1128 384)">repeat while next_cursor is not null</text>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,578 V620" stroke="#D97706" marker-end="url(#xl08pagingl-am)"/>
  </g>

  
  <g filter="url(#xl08pagingl-soft)">
    <rect x="320" y="100" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="100" width="6" height="48" fill="#2563EB" clip-path="url(#xl08pagingl-k1)"/>
  </g>
  <circle cx="354" cy="124" r="4.5" fill="#2563EB"/>
  <text x="378" y="131" font-size="18.5" font-weight="600" fill="#111827">GET /orders?limit=20</text>
  <text x="620" y="172" font-size="15.5" text-anchor="middle" fill="#6B7280">The first request carries no cursor at all.</text>

  
  <g filter="url(#xl08pagingl-soft)">
    <rect x="320" y="230" width="600" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="320" y="230" width="6" height="48" fill="#059669" clip-path="url(#xl08pagingl-k2)"/>
  </g>
  <circle cx="354" cy="254" r="4.5" fill="#059669"/>
  <text x="378" y="261" font-size="18.5" font-weight="600" fill="#111827">process(response.items)</text>
  <text x="620" y="302" font-size="15.5" text-anchor="middle" fill="#6B7280">The page arrives in an envelope, never as a bare array.</text>

  
  <g filter="url(#xl08pagingl-soft)">
    <rect x="320" y="360" width="600" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="320" y="360" width="6" height="48" fill="#64748B" clip-path="url(#xl08pagingl-k3)"/>
  </g>
  <circle cx="354" cy="384" r="4.5" fill="#64748B"/>
  <text x="378" y="391" font-size="18.5" font-weight="600" fill="#111827">cursor = response.next_cursor</text>
  <text x="620" y="432" font-size="15.5" text-anchor="middle" fill="#6B7280">Store it and repeat it exactly. Never parse or build one.</text>

  
  <g filter="url(#xl08pagingl-soft)">
    <rect x="320" y="490" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="490" width="6" height="48" fill="#2563EB" clip-path="url(#xl08pagingl-k4)"/>
  </g>
  <circle cx="354" cy="514" r="4.5" fill="#2563EB"/>
  <text x="378" y="521" font-size="18.5" font-weight="600" fill="#111827">GET /orders?limit=20&amp;cursor=...</text>
  <text x="620" y="562" font-size="15.5" text-anchor="middle" fill="#6B7280">The same query parameters, plus the cursor just returned.</text>

  
  <g filter="url(#xl08pagingl-lift)">
    <rect x="320" y="620" width="600" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="320" y="620" width="9" height="48" fill="#D97706" clip-path="url(#xl08pagingl-k5)"/>
  </g>
  <circle cx="354" cy="644" r="15" fill="#FFFFFF"/>
  <g transform="translate(345,635) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="378" y="651" font-size="18.5" font-weight="600" fill="#111827">stop when next_cursor is null</text>
  <text x="620" y="692" font-size="15.5" text-anchor="middle" fill="#6B7280">The only end signal. A short page does not mean the end.</text>

  
  <rect x="40" y="748" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="790" text-anchor="middle" font-size="16" fill="#475569">Why not stop at a short page? The server may return fewer items because of an internal limit or a permission check,</text>
  <text x="620" y="818" text-anchor="middle" font-size="16" fill="#475569">and still hold a later cursor. next_cursor is the contract; the item count is not.</text>
</svg>