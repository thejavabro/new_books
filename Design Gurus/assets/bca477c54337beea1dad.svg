<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" style="background-color:#ffffff">
<defs>
<marker id="obc" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="obd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="obe" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="50" width="290" height="96" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="50" width="290" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="175" y="69" text-anchor="middle" font-weight="bold">BuildPipeline  (subject)</text>
<text x="42" y="96">- listeners : List&lt;BuildListener&gt;</text>
<text x="42" y="116">+ addListener(), removeListener()</text>
<text x="42" y="136">+ finish(buildNumber, result)</text>

<rect x="500" y="50" width="290" height="70" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="500" y="50" width="290" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="645" y="69" text-anchor="middle" font-weight="bold">&#171;interface&#187; BuildListener</text>
<text x="512" y="96">+ onBuildFinished(number, result)</text>

<rect x="20" y="234" width="200" height="44" fill="#ffffff" stroke="#c3cfe0"/>
<text x="120" y="261" text-anchor="middle" font-size="11.5">SlackNotifier</text>
<rect x="240" y="234" width="200" height="44" fill="#ffffff" stroke="#c3cfe0"/>
<text x="340" y="261" text-anchor="middle" font-size="11.5">DashboardUpdater</text>
<rect x="460" y="234" width="200" height="44" fill="#ffffff" stroke="#c3cfe0"/>
<text x="560" y="261" text-anchor="middle" font-size="11.5">MetricsRecorder</text>
<rect x="680" y="234" width="200" height="44" fill="#ffffff" stroke="#c3cfe0"/>
<text x="780" y="261" text-anchor="middle" font-size="11.5">DeployTrigger</text>

<path d="M 120 234 L 120 180 L 645 180 L 645 120" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#obc)"/>
<path d="M 340 234 L 340 180" stroke="#000000" fill="none" stroke-dasharray="5 4"/>
<path d="M 560 234 L 560 180" stroke="#000000" fill="none" stroke-dasharray="5 4"/>
<path d="M 780 234 L 780 180 L 645 180" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<path d="M 324 84 L 495 84" stroke="#000000" fill="none" marker-start="url(#obd)" marker-end="url(#obe)"/>
<text x="341" y="76" font-size="11" fill="#414d60">holds many, knows nothing else</text>

<rect x="30" y="304" width="900" height="82" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="328" font-size="12.5" fill="#414d60">The subject depends on one interface. It does not import Slack, and it cannot be made to care how many listeners there are.</text>
<text x="52" y="350" font-size="12.5" fill="#414d60">Every arrow points one way. No listener talks back to the pipeline, which is what stops a notification triggering another notification.</text>
<text x="52" y="374" font-size="12.5" fill="#b4322c">finish() iterates over a COPY of the list, and catches per listener, or one bad subscriber breaks the ones after it.</text>
</g>
</svg>