<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="776" viewBox="0 0 1240 776" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="where-title where-desc">
<title id="where-title">Where the request comes from</title>
<desc id="where-desc">A second region arrives attached to something else: an outage, a customer question, a compliance checkbox or an interest. Identifying which gives you the real question to ask.</desc>
<defs>
<marker id="where-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="where-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="where-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="where-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="776" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where the request comes from</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A second region is almost never requested as a design decision.</text>
<rect x="40" y="698" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="698" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An outage happened</text>
<path d="M526 146H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 146H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#where-marker-slate)"/>
<rect x="570" y="118" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">emotional and badly timed, which does not make it wrong</text>
<rect x="40" y="186" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A customer asked</text>
<path d="M526 214H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 214H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#where-marker-slate)"/>
<rect x="570" y="186" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sometimes a contract, more often a questionnaire item</text>
<rect x="40" y="254" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A compliance checkbox</text>
<path d="M526 282H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 282H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#where-marker-slate)"/>
<rect x="570" y="254" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">worth establishing what the requirement actually says</text>
<rect x="40" y="322" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An engineer wants to build it</text>
<path d="M526 350H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 350H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#where-marker-slate)"/>
<rect x="570" y="322" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">legitimate as an interest and not as a requirement</text>
<rect x="40" y="398" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="398" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="439" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What failed, and would a second region have prevented it?</text>
<text x="40" y="506" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Because most incidents that prompt this were</text>
<rect x="40" y="524" width="275" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="177.5" y="559" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a bad deploy</text>
<rect x="335" y="524" width="275" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="472.5" y="559" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a dependency outage</text>
<rect x="630" y="524" width="275" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="767.5" y="559" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a certificate expiry</text>
<rect x="925" y="524" width="275" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1062.5" y="545.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a change nobody</text><text x="1062.5" y="572.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reviewed</text>
<rect x="40" y="606" width="1160" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="606" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="64" y="645" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">A second region prevents none of those, and doubles the surface they can happen on.</text>
<text x="66" y="732" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Only two of the four can become requirements, and only after one question is answered.</text>
</svg>