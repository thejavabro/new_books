  <text x="569" y="475" font-size="18.5" font-weight="600" fill="#111827">App server</text>
  <g filter="url(#m14a-soft)">
    <rect x="780" y="348" width="180" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="780" y="348" width="6" height="80" fill="#2563EB" clip-path="url(#m14a-k8)"/>
  </g>
  <circle cx="818" cy="388" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,377.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="844" y="382.25" font-size="21.5" font-weight="600" fill="#111827">Redis</text>
  <text x="844" y="407.75" font-size="21.5" font-weight="600" fill="#111827">cache</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M1030,338 L1030,432 A70,16 0 0 0 1170,432 L1170,338" fill="#DBEAFE"/>
    <ellipse cx="1100" cy="338" rx="70" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1100" y="400" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="64" y="172" font-size="18.5" fill="#475569">Traffic spikes to</text>
  <text x="64" y="198" font-size="18.5" fill="#475569">hundreds of</text>
  <text x="64" y="224" font-size="18.5" fill="#475569">thousands of users.</text>
  <text x="284" y="172" font-size="18.5" fill="#475569">Distributes requests</text>
  <text x="284" y="198" font-size="18.5" fill="#475569">across application</text>
  <text x="284" y="224" font-size="18.5" fill="#475569">servers.</text>
  <text x="514" y="172" font-size="18.5" fill="#475569">Scale horizontally.</text>
  <text x="514" y="198" font-size="18.5" fill="#475569">Easy to add more</text>
  <text x="514" y="224" font-size="18.5" fill="#475569">servers during spikes.</text>
  <text x="784" y="172" font-size="18.5" fill="#475569">Handles most read</text>
  <text x="784" y="198" font-size="18.5" fill="#475569">traffic and reduces</text>
  <text x="784" y="224" font-size="18.5" fill="#475569">load on the database.</text>
  <text x="1024" y="172" font-size="18.5" fill="#475569">Still a single</text>
  <text x="1024" y="198" font-size="18.5" fill="#475569">logical store for</text>
  <text x="1024" y="224" font-size="18.5" fill="#475569">all writes (and</text>
  <text x="1024" y="250" font-size="18.5" fill="#475569">some reads).</text>

  <circle cx="140" cy="520" r="3.2" fill="#64748B"/>
  <circle cx="140" cy="532" r="3.2" fill="#64748B"/>
  <circle cx="140" cy="544" r="3.2" fill="#64748B"/>
