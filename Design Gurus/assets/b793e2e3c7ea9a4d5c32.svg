  <rect x="0" y="0" width="1240" height="952" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Why traditional scaling hits a database bottleneck</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Application servers scale out easily, but every write still goes to one database.</text>

  <rect x="40" y="110" width="200" height="456" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Many users</text>
  <rect x="260" y="110" width="210" height="456" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="284" y="140" font-size="19.5" font-weight="600" fill="#047857">Load balancer</text>
  <rect x="490" y="110" width="250" height="456" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="514" y="140" font-size="19.5" font-weight="600" fill="#5B21B6">Application servers</text>
  <rect x="760" y="110" width="220" height="456" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="784" y="140" font-size="19.5" font-weight="600" fill="#B45309">Cache</text>
  <rect x="1000" y="110" width="200" height="456" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="1024" y="140" font-size="19.5" font-weight="600" fill="#BE185D">Database</text>

