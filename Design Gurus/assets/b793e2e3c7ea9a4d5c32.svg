<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="952" viewBox="0 0 1240 952" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Many users send traffic to a load balancer, which spreads it across three application servers; the servers read from a Redis cache, but every write goes directly from the servers to the single database, which becomes the bottleneck through connection limits, lock contention and write throughput">
