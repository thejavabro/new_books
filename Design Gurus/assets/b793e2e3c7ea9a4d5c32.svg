  <text x="339" y="382.25" font-size="21.5" font-weight="600" fill="#111827">Load</text>
  <text x="339" y="407.75" font-size="21.5" font-weight="600" fill="#111827">balancer</text>
  <g filter="url(#m14a-soft)">
    <rect x="505" y="276" width="220" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
