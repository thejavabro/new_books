  <circle cx="615" cy="532" r="3.2" fill="#64748B"/>
  <circle cx="615" cy="544" r="3.2" fill="#64748B"/>
  <circle cx="1166" cy="436" r="17" fill="#DB2777" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1166" y="444" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">!</text>
  <rect x="40" y="606" width="1160" height="312" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="630" width="210" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="169" y="655" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Many users</text>
  <text x="303" y="655" font-size="18.5" fill="#475569">Traffic can spike from hundreds to hundreds of thousands of users very quickly.</text>
  <rect x="64" y="680" width="210" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="169" y="705" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Load balancer</text>
  <text x="303" y="705" font-size="18.5" fill="#475569">The load balancer distributes requests across many application servers.</text>
  <rect x="64" y="730" width="210" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="169" y="755" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Application servers</text>
  <text x="303" y="755" font-size="18.5" fill="#475569">Application servers scale easily. You can add more servers in minutes.</text>
  <rect x="64" y="780" width="210" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="169" y="805" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Cache</text>
  <text x="303" y="805" font-size="18.5" fill="#475569">Caching helps with reads but does not solve write-heavy workloads like inventory, orders, or bids.</text>
  <rect x="64" y="830" width="210" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="169" y="855" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Database</text>
  <text x="303" y="855" font-size="18.5" fill="#475569">All writes still go to the database, which becomes a bottleneck due to</text>
  <text x="303" y="881" font-size="18.5" fill="#475569">connection limits, lock contention, and write throughput.</text>


</svg>