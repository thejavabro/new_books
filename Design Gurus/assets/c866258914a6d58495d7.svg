<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1220" viewBox="0 0 1240 1220" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="C4-style component view after the refactor. Inside the backend application container, three Flask routes in app.py, POST /orders, POST /admin/orders and POST /orders/&lt;id&gt;/reorder, call PlaceOrder, a Python class in the Orders module. PlaceOrder uses order_rules, the only copy of the ordering rules, and calls Menu, Orders (the order repository), Payments, Dispatch and Notifications. The reorder route also reads the past order from Orders before it calls PlaceOrder. In the PostgreSQL container, each module reads and writes only its own tables. One dashed pink line remains: Dispatch reads the orders table, left for later in ADR 0032.">
