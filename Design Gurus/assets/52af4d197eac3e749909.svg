<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="802" viewBox="0 0 1240 802" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cardinality-title cardinality-desc">
<title id="cardinality-title">Cardinality multiplies</title>
<desc id="cardinality-desc">The number of series is the product of the distinct values of every label, so adding one dimension multiplies the working set by its cardinality. Volume is a storage cost; cardinality is an index cost paid continuously.</desc>
<defs>
<marker id="cardinality-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="cardinality-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="cardinality-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="cardinality-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="802" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Cardinality multiplies</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The number of series is the product of the distinct values of every label.</text>
<rect x="40" y="724" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="724" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="88" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="88" rx="2.5" fill="#39D5AA"/><text x="620" y="154.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="middle">Comfortable</text><text x="620" y="181.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">service (20)  x  endpoint (50)  x  status (8)  x  region (4)  =  32,000 series</text>
<path d="M620 218V268" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 218V268" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cardinality-marker-red)"/>
<text x="644" y="249" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">add one label</text>
<rect x="40" y="280" width="1160" height="88" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="280" width="5" height="88" rx="2.5" fill="#F28B9D"/><text x="620" y="316.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="middle">Not comfortable</text><text x="620" y="343.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">...  x  customer_id (5,000)  =  160,000,000 series</text>
<rect x="40" y="390" width="1160" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="423" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The data per series did not change, and nothing in the write path warns you</text>
<text x="40" y="480" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The labels that do this are all unbounded</text>
<rect x="40" y="498" width="372" height="80" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="531" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">user, customer, session,</text><text x="226" y="557" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">request and trace ids</text>
<rect x="434" y="498" width="372" height="80" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="531" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">emails, full URLs with query</text><text x="620" y="557" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">strings, raw error messages</text>
<rect x="828" y="498" width="372" height="80" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="531" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">anything containing</text><text x="1014" y="557" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">a timestamp</text>
<rect x="40" y="604" width="1160" height="92" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="604" width="5" height="92" rx="2.5" fill="#AC8BE8"/><text x="64" y="642.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The test, before adding any dimension</text><text x="64" y="669.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">How many distinct values can this ever take, times the current series count?</text>
<text x="66" y="758" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">If the answer is unbounded, it belongs in a log or a trace rather than in a label.</text>
</svg>