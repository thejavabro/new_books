<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1086" viewBox="0 0 1240 1086" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The API validates the prompt and runs the prompt gate before enqueue; a blocked prompt stops there and costs zero GPU time. Jobs that pass enter a paid, free, or batch queue. The scheduler sends them to long-lived workers with a warm pool beside them. A first crash returns the job to its queue, and a second crash sends it to the dead-letter queue. Finished images go to the image gate, and only images that pass reach the user&#39;s gallery.">
