  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,493 L89,504 M89,493 L78,504"/>
  </g>
  <text x="104" y="504" font-size="15.5" fill="#6B7280">Pickup or destination is outside the published area</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,524 L82.5,528.5 L90,518.5"/>
  </g>
  <text x="104" y="530" font-size="15.5" fill="#6B7280">Choose supported points</text>

  <g filter="url(#p3y-soft)">
    <rect x="76" y="558" width="640" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="558" width="6" height="48" fill="#DB2777" clip-path="url(#p3y-k4)"/>
  </g>
  <circle cx="110" cy="582" r="4.5" fill="#DB2777"/>
  <text x="134" y="589" font-size="18.5" font-weight="600" fill="#111827">idempotency_key_reused</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,621 L89,632 M89,621 L78,632"/>
  </g>
  <text x="104" y="632" font-size="15.5" fill="#6B7280">The key names a different request body</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,652 L82.5,656.5 L90,646.5"/>
  </g>
  <text x="104" y="658" font-size="15.5" fill="#6B7280">Fix the caller bug or use a new key for new work</text>

  
  <rect x="40" y="700" width="1160" height="166" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="730" font-size="16.5" font-weight="600" fill="#BE185D">401 Unauthorized</text>
  <text x="1176" y="730" text-anchor="end" font-size="15.5" fill="#6B7280">one failure</text>

  <g filter="url(#p3y-soft)">
    <rect x="76" y="748" width="640" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="748" width="6" height="48" fill="#DB2777" clip-path="url(#p3y-k5)"/>
  </g>
  <circle cx="110" cy="772" r="4.5" fill="#DB2777"/>
  <text x="134" y="779" font-size="18.5" font-weight="600" fill="#111827">authentication_required</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,811 L89,822 M89,811 L78,822"/>
  </g>
  <text x="104" y="822" font-size="15.5" fill="#6B7280">Credential is absent or invalid</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,842 L82.5,846.5 L90,836.5"/>
  </g>
  <text x="104" y="848" font-size="15.5" fill="#6B7280">Authenticate</text>

  
  <rect x="40" y="890" width="1160" height="166" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="920" font-size="16.5" font-weight="600" fill="#BE185D">403 Forbidden</text>
  <text x="1176" y="920" text-anchor="end" font-size="15.5" fill="#6B7280">one failure</text>

  <g filter="url(#p3y-soft)">
    <rect x="76" y="938" width="640" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="938" width="6" height="48" fill="#DB2777" clip-path="url(#p3y-k6)"/>
  </g>
  <circle cx="110" cy="962" r="4.5" fill="#DB2777"/>
  <text x="134" y="969" font-size="18.5" font-weight="600" fill="#111827">insufficient_scope</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
