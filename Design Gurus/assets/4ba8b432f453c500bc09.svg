<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1728" viewBox="0 0 1240 1728" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The named failures of creating a ride, each with its status, stable code, condition, and the action the caller should take next.">
  <defs>
    <filter id="p3y-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3y-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3y-k1"><rect x="76" y="174" width="640" height="48" rx="10"/></clipPath>
    <clipPath id="p3y-k2"><rect x="76" y="302" width="640" height="48" rx="10"/></clipPath>
    <clipPath id="p3y-k3"><rect x="76" y="430" width="640" height="48" rx="10"/></clipPath>
    <clipPath id="p3y-k4"><rect x="76" y="558" width="640" height="48" rx="10"/></clipPath>
    <clipPath id="p3y-k5"><rect x="76" y="748" width="640" height="48" rx="10"/></clipPath>
    <clipPath id="p3y-k6"><rect x="76" y="938" width="640" height="48" rx="10"/></clipPath>
    <clipPath id="p3y-k7"><rect x="76" y="1128" width="640" height="48" rx="10"/></clipPath>
    <clipPath id="p3y-k8"><rect x="76" y="1256" width="640" height="48" rx="10"/></clipPath>
    <clipPath id="p3y-k9"><rect x="76" y="1446" width="640" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1728" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Named failures for one ride create</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M470,66 L481,77 M481,66 L470,77"/>
  </g>
  <text x="496" y="77" font-size="15.5" fill="#6B7280">the condition that produced it</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M800,71 L804.5,75.5 L812,65.5"/>
  </g>
  <text x="826" y="77" font-size="15.5" fill="#6B7280">the action the caller takes next</text>

  
  <rect x="40" y="126" width="1160" height="550" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">400 Bad Request</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four failures</text>

  <g filter="url(#p3y-soft)">
    <rect x="76" y="174" width="640" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p3y-k1)"/>
  </g>
  <circle cx="110" cy="198" r="4.5" fill="#DB2777"/>
  <text x="134" y="205" font-size="18.5" font-weight="600" fill="#111827">invalid_request</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,237 L89,248 M89,237 L78,248"/>
  </g>
  <text x="104" y="248" font-size="15.5" fill="#6B7280">JSON is malformed or a required field is absent</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,268 L82.5,272.5 L90,262.5"/>
  </g>
  <text x="104" y="274" font-size="15.5" fill="#6B7280">Correct the request</text>

  <g filter="url(#p3y-soft)">
    <rect x="76" y="302" width="640" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="302" width="6" height="48" fill="#DB2777" clip-path="url(#p3y-k2)"/>
  </g>
  <circle cx="110" cy="326" r="4.5" fill="#DB2777"/>
  <text x="134" y="333" font-size="18.5" font-weight="600" fill="#111827">invalid_coordinate</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,365 L89,376 M89,365 L78,376"/>
  </g>
  <text x="104" y="376" font-size="15.5" fill="#6B7280">Latitude or longitude is outside its valid range</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,396 L82.5,400.5 L90,390.5"/>
