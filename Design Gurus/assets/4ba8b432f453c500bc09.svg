  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1032 L82.5,1036.5 L90,1026.5"/>
  </g>
  <text x="104" y="1038" font-size="15.5" fill="#6B7280">Obtain the correct authority</text>

  
  <rect x="40" y="1080" width="1160" height="294" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="1110" font-size="16.5" font-weight="600" fill="#BE185D">409 Conflict</text>
  <text x="1176" y="1110" text-anchor="end" font-size="15.5" fill="#6B7280">two failures</text>

  <g filter="url(#p3y-lift)">
    <rect x="76" y="1128" width="640" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="76" y="1128" width="9" height="48" fill="#DB2777" clip-path="url(#p3y-k7)"/>
  </g>
  <circle cx="110" cy="1152" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,1143) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="134" y="1159" font-size="18.5" font-weight="600" fill="#111827">active_ride_exists</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1191 L89,1202 M89,1191 L78,1202"/>
  </g>
  <text x="104" y="1202" font-size="15.5" fill="#6B7280">The rider already has an active ride under the one-active-ride rule</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1222 L82.5,1226.5 L90,1216.5"/>
  </g>
  <text x="104" y="1228" font-size="15.5" fill="#6B7280">Use or cancel the existing ride</text>

  <g filter="url(#p3y-soft)">
    <rect x="76" y="1256" width="640" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1256" width="6" height="48" fill="#DB2777" clip-path="url(#p3y-k8)"/>
  </g>
  <circle cx="110" cy="1280" r="4.5" fill="#DB2777"/>
  <text x="134" y="1287" font-size="18.5" font-weight="600" fill="#111827">idempotency_request_in_progress</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1319 L89,1330 M89,1319 L78,1330"/>
  </g>
  <text x="104" y="1330" font-size="15.5" fill="#6B7280">The same logical create is still executing</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1350 L82.5,1354.5 L90,1344.5"/>
  </g>
  <text x="104" y="1356" font-size="15.5" fill="#6B7280">Wait for Retry-After and retry unchanged</text>

  
  <rect x="40" y="1398" width="1160" height="166" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="1428" font-size="16.5" font-weight="600" fill="#BE185D">429 Too Many Requests</text>
  <text x="1176" y="1428" text-anchor="end" font-size="15.5" fill="#6B7280">one failure</text>

  <g filter="url(#p3y-soft)">
    <rect x="76" y="1446" width="640" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1446" width="6" height="48" fill="#DB2777" clip-path="url(#p3y-k9)"/>
  </g>
  <circle cx="110" cy="1470" r="4.5" fill="#DB2777"/>
  <text x="134" y="1477" font-size="18.5" font-weight="600" fill="#111827">rate_limit_exceeded</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1509 L89,1520 M89,1509 L78,1520"/>
  </g>
  <text x="104" y="1520" font-size="15.5" fill="#6B7280">Caller exceeded the time-based ride-create limit</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1540 L82.5,1544.5 L90,1534.5"/>
  </g>
  <text x="104" y="1546" font-size="15.5" fill="#6B7280">Wait for Retry-After</text>

  
  <rect x="40" y="1588" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1630" text-anchor="middle" font-size="16" fill="#475569">Every failure of creating a ride names its status, its stable code, the condition that produced it, and the action the caller takes next.</text>
  <text x="620" y="1658" text-anchor="middle" font-size="16" fill="#475569">Nine named failures across five status codes. The code is the part a caller reads in software; the status only sets the class.</text>
</svg>