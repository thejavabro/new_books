<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="450" viewBox="0 0 1240 450" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A query that gives the partition key goes to one machine. A query without it must ask every machine and combine the answers, which is called a scatter-gather query.">
  <rect x="0" y="0" width="1240" height="450" fill="#FFFFFF"/>
  <defs>
    <marker id="dp3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="dp3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dp3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="dp3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="dp3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="dp3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="dp3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="dp3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="dp3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A query without the partition key has to ask everyone</text>
  <rect x="24" y="70" width="588" height="340" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="106" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">With the partition key</text>
  <g filter="url(#dp3-soft)"><rect x="118" y="132" width="400" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="318" y="168" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">WHERE user_id = 42</text>
  <line x1="318" y1="192" x2="318" y2="244" stroke="#059669" stroke-width="2.2" marker-end="url(#dp3-e)"/>
  <g filter="url(#dp3-soft)"><rect x="84" y="250" width="130" height="58" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="149" y="286" font-size="18" fill="#64748B" text-anchor="middle">machine 1</text>
  <g filter="url(#dp3-soft)"><rect x="240" y="250" width="130" height="58" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <text x="305" y="286" font-size="18" fill="#065F46" text-anchor="middle">machine 2</text>
  <g filter="url(#dp3-soft)"><rect x="396" y="250" width="130" height="58" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="461" y="286" font-size="18" fill="#64748B" text-anchor="middle">machine 3</text>
  <text x="318" y="356" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One machine answers.</text>
  <text x="318" y="384" font-size="19" fill="#64748B" text-anchor="middle">It stays fast as you add machines.</text>
  <rect x="628" y="70" width="588" height="340" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="106" font-size="22" font-weight="600" fill="#B91C1C" text-anchor="middle">Without the partition key</text>
  <g filter="url(#dp3-soft)"><rect x="722" y="132" width="400" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="922" y="168" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">WHERE email = ...</text>
  <line x1="922" y1="192" x2="753" y2="244" stroke="#DC2626" stroke-width="2.2" marker-end="url(#dp3-r)"/>
  <g filter="url(#dp3-soft)"><rect x="688" y="250" width="130" height="58" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="753" y="286" font-size="18" fill="#B91C1C" text-anchor="middle">machine 1</text>
  <line x1="922" y1="192" x2="909" y2="244" stroke="#DC2626" stroke-width="2.2" marker-end="url(#dp3-r)"/>
  <g filter="url(#dp3-soft)"><rect x="844" y="250" width="130" height="58" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="909" y="286" font-size="18" fill="#B91C1C" text-anchor="middle">machine 2</text>
  <line x1="922" y1="192" x2="1065" y2="244" stroke="#DC2626" stroke-width="2.2" marker-end="url(#dp3-r)"/>
  <g filter="url(#dp3-soft)"><rect x="1000" y="250" width="130" height="58" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1065" y="286" font-size="18" fill="#B91C1C" text-anchor="middle">machine 3</text>
  <text x="922" y="356" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Every machine answers, then the results are combined.</text>
  <text x="922" y="384" font-size="19" fill="#64748B" text-anchor="middle">It waits for the slowest one, and gets worse as you add machines.</text>
</svg>