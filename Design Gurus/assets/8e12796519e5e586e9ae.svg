<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of one message&#39;s lifecycle. It starts queued, a consumer picks it up, and it either finishes with an ack or fails and enters retrying with backoff. Once the attempt limit of three to five deliveries is reached it moves to the dead letter queue, from which it is either replayed to the main queue after the fix or discarded deliberately with a record.">
  <defs>
    <marker id="m04-l06-message-lifecycle-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m04-l06-message-lifecycle-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l06-message-lifecycle-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l06-message-lifecycle-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m04-l06-message-lifecycle-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="860" fill="#FFFFFF"/>

  <rect x="40" y="110" width="1160" height="580" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="150" font-size="20" font-weight="600" fill="#334155">Lifecycle of one message</text>
  <text x="1180" y="150" text-anchor="end" font-size="20" fill="#64748B">the broker redelivers until it gets an ack</text>

  <g fill="none" stroke-width="2.5">
    <path d="M143,305 L172,305" stroke="#475569" stroke-width="2" marker-end="url(#m04-l06-message-lifecycle-sl)"/>
    <path d="M460,305 L512,305" stroke="#D97706" marker-end="url(#m04-l06-message-lifecycle-ab)"/>
    <path d="M810,305 L842,305" stroke="#059669" marker-end="url(#m04-l06-message-lifecycle-em)"/>
    <path d="M1140,305 L1157,305" stroke="#475569" stroke-width="2" marker-end="url(#m04-l06-message-lifecycle-sl)"/>
    <path d="M620,360 L620,472" stroke="#DC2626" stroke-width="2" marker-end="url(#m04-l06-message-lifecycle-rd)"/>
    <path d="M700,472 L700,360" stroke="#D97706" stroke-width="2" marker-end="url(#m04-l06-message-lifecycle-ab)"/>
    <path d="M520,535 L468,535" stroke="#DC2626" marker-end="url(#m04-l06-message-lifecycle-rd)"/>
    <path d="M320,480 L320,368" stroke="#059669" marker-end="url(#m04-l06-message-lifecycle-em)"/>
    <path d="M180,535 L151,535" stroke="#DC2626" stroke-width="2" marker-end="url(#m04-l06-message-lifecycle-rd)"/>
  </g>

  <text x="486" y="230" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consumer picks it up</text>
  <text x="826" y="230" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">success, ack sent</text>
  <text x="634" y="396" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">error, no ack</text>
  <text x="714" y="452" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">try again after backoff</text>
  <text x="332" y="410" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replay after the fix</text>
  <text x="332" y="436" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">(the redrive button)</text>
  <text x="490" y="626" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">attempt limit reached</text>
  <text x="490" y="652" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">(3 to 5 deliveries)</text>
  <text x="128" y="582" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">discarded</text>
  <text x="128" y="608" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">with a record</text>

  <circle cx="130" cy="305" r="13" fill="#475569"/>
  <text x="130" y="352" text-anchor="middle" font-size="20" fill="#64748B">start</text>
  <circle cx="1170" cy="305" r="13" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="1170" cy="305" r="7" fill="#475569"/>
  <text x="1170" y="352" text-anchor="middle" font-size="20" fill="#64748B">end</text>
  <circle cx="128" cy="535" r="13" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="128" cy="535" r="7" fill="#475569"/>

  <g filter="url(#m04-l06-message-lifecycle-soft)">
    <rect x="180" y="250" width="280" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="320" y="296" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Queued</text>
  <text x="320" y="328" text-anchor="middle" font-size="20" fill="#64748B">waiting in the main queue</text>
  <g filter="url(#m04-l06-message-lifecycle-soft)">
    <rect x="520" y="250" width="290" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="665" y="296" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Processing</text>
  <text x="665" y="328" text-anchor="middle" font-size="20" fill="#64748B">the consumer has it</text>
  <g filter="url(#m04-l06-message-lifecycle-soft)">
    <rect x="850" y="250" width="290" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="995" y="296" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Done</text>
  <text x="995" y="328" text-anchor="middle" font-size="20" fill="#64748B">ack sent, broker deletes it</text>
  <g filter="url(#m04-l06-message-lifecycle-soft)">
    <rect x="520" y="480" width="290" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="665" y="526" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Retrying</text>
  <text x="665" y="558" text-anchor="middle" font-size="20" fill="#64748B">waiting out the backoff</text>
  <g filter="url(#m04-l06-message-lifecycle-soft)">
    <rect x="180" y="480" width="280" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="320" y="526" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Dead letter queue</text>
  <text x="320" y="558" text-anchor="middle" font-size="20" fill="#64748B">parked, and not lost</text>

  <line x1="60" y1="740" x2="96" y2="740" stroke="#059669" stroke-width="4"/>
  <text x="108" y="747" font-size="20" fill="#475569">The message finishes, or comes back after a fix</text>
  <line x1="60" y1="780" x2="96" y2="780" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="787" font-size="20" fill="#475569">Failure path: no ack, then the attempt limit</text>
  <line x1="60" y1="820" x2="96" y2="820" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="827" font-size="20" fill="#475569">Another delivery attempt begins</text>
</svg>