<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="646" viewBox="0 0 1240 646" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The product architecture round adds two deliverables to the ordinary API answer: a data model of entities, fields, and relationships, and a screen call plan counting the blocking round trips one important screen needs.">
  <defs>
    <filter id="p35-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p35-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p35-k1"><rect x="76" y="146" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p35-k2"><rect x="76" y="342" width="360" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="646" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Two deliverables the ordinary round does not ask for</text>
  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round">
    <path d="M640,66 h13 M640,71.5 h13 M640,77 h9"/>
  </g>
  <text x="666" y="77" font-size="15.5" fill="#6B7280">what it contains</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M846,71.5 h13 M854.5,67 L859,71.5 L854.5,76"/>
  </g>
  <text x="872" y="77" font-size="15.5" fill="#6B7280">why it is an API decision</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p35-lift)">
    <rect x="76" y="146" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="146" width="9" height="90" fill="#2563EB" clip-path="url(#p35-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">The data model</text>
  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round">
    <path d="M78,251 h13 M78,256.5 h13 M78,262 h9"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">Entities, their fields, and their relationships</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,282.5 h13 M86.5,278 L91,282.5 L86.5,287"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Relationship shape decides sub-collections, id fields, and whether a join becomes its own resource</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p35-lift)">
    <rect x="76" y="342" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="342" width="9" height="90" fill="#2563EB" clip-path="url(#p35-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">The screen call plan</text>
  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round">
    <path d="M78,447 h13 M78,452.5 h13 M78,458 h9"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">The blocking round trips one important screen needs</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,478.5 h13 M86.5,474 L91,478.5 L86.5,483"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Call count is written into the contract, so a faster server cannot remove it later</text>

  
  <rect x="40" y="530" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="575" text-anchor="middle" font-size="16" fill="#475569">Both belong inside the existing six steps: Step 2 owns the model, and Step 4 owns the caller experience.</text>
</svg>