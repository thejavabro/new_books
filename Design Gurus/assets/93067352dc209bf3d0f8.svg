<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Closed moves to open after too many failures. Open moves to half-open after 30 seconds. Half-open moves to closed when test calls succeed, or back to open when a test call fails.">
  <defs>
    <filter id="re3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="re3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="re3-k1"><rect x="40" y="200" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="re3-k2"><rect x="900" y="200" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="re3-k3"><rect x="470" y="480" width="300" height="90" rx="12"/></clipPath>
    <marker id="re3-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="re3-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="re3-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The three states of a circuit breaker</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The breaker stops calls to a failing dependency, then tests it before trusting it again.</text>



  <g fill="none" stroke-width="2">
    <path d="M340,245 H900" stroke="#DB2777" marker-end="url(#re3-m-pink)"/>
    <path d="M960,290 V490 Q960,505 945,505 H770" stroke="#D97706" marker-end="url(#re3-m-amber)"/>
    <path d="M770,550 H1125 Q1140,550 1140,535 V290" stroke="#DB2777" marker-end="url(#re3-m-pink)"/>
    <path d="M470,525 H205 Q190,525 190,510 V290" stroke="#059669" marker-end="url(#re3-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="233" fill="#BE185D">too many failures</text>
    <text x="880" y="400" fill="#B45309">after 30 seconds</text>
    <text x="960" y="580" fill="#BE185D">a test call fails</text>
    <text x="330" y="513" fill="#047857">test calls succeed</text>
  </g>

  <g filter="url(#re3-soft)">
    <rect x="40" y="200" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="200" width="6" height="90" fill="#059669" clip-path="url(#re3-k1)"/>
  </g>
  <circle cx="78" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,234.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="252" font-size="21.5" font-weight="600" fill="#111827">Closed</text>
  <g filter="url(#re3-lift)">
    <rect x="900" y="200" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="900" y="200" width="9" height="90" fill="#DB2777" clip-path="url(#re3-k2)"/>
  </g>
  <circle cx="938" cy="245" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,234.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="964" y="252" font-size="21.5" font-weight="600" fill="#111827">Open</text>
  <g filter="url(#re3-soft)">
    <rect x="470" y="480" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="470" y="480" width="6" height="90" fill="#D97706" clip-path="url(#re3-k3)"/>
  </g>
  <circle cx="508" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,514.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="534" y="532" font-size="21.5" font-weight="600" fill="#111827">Half-open</text>

  <rect x="40" y="640" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="665" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="690" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Closed</text>
  <text x="323" y="690" font-size="18.5" fill="#475569">calls go through normally, and the breaker counts failures</text>
  <rect x="64" y="715" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Open</text>
  <text x="323" y="740" font-size="18.5" fill="#475569">calls fail at once, without contacting the dependency</text>
  <rect x="64" y="765" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Half-open</text>
  <text x="323" y="790" font-size="18.5" fill="#475569">a few test calls go through to check whether it has recovered</text>
</svg>