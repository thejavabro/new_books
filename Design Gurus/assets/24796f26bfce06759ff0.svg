<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1626" viewBox="0 0 1240 1626" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven trade-offs of the news feed screen answer, each with what it gives and the cost accepted: a read-only derived Feed, one composed feed response, a ten-minute ranking snapshot, 410 feed_expired, a new-post count, the viewer reaction beside Post, and keeping the general resources separate.">
  <defs>
    <filter id="p3l-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3l-k1"><rect x="76" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3l-k2"><rect x="76" y="342" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3l-k3"><rect x="76" y="538" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3l-k4"><rect x="76" y="734" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3l-k5"><rect x="76" y="930" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3l-k6"><rect x="76" y="1126" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p3l-k7"><rect x="76" y="1322" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1626" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Feed: seven choices, seven costs</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700,71 L704.5,75.5 L712,65.5"/>
  </g>
  <text x="726" y="77" font-size="15.5" fill="#6B7280">what it gives</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M900,66 L911,77 M911,66 L900,77"/>
  </g>
  <text x="926" y="77" font-size="15.5" fill="#6B7280">cost accepted</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1176" y="198" text-anchor="end" font-size="15.5" fill="#94A3B8">choice 1 of 7</text>
  <g filter="url(#p3l-soft)">
    <rect x="76" y="146" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p3l-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">A read-only derived Feed</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,252 L82.5,256.5 L90,246.5"/>
  </g>
  <text x="104" y="258" font-size="15.5" fill="#6B7280">One bounded call replaces client-side fan-in.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,277 L89,288 M89,277 L78,288"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Server complexity and a published freshness delay.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1176" y="394" text-anchor="end" font-size="15.5" fill="#94A3B8">choice 2 of 7</text>
  <g filter="url(#p3l-soft)">
    <rect x="76" y="342" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#059669" clip-path="url(#p3l-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">One composed feed response</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,448 L82.5,452.5 L90,442.5"/>
  </g>
  <text x="104" y="454" font-size="15.5" fill="#6B7280">The screen paints from one round trip.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,473 L89,484 M89,473 L78,484"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">A response coupled to one important first-party view.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1176" y="590" text-anchor="end" font-size="15.5" fill="#94A3B8">choice 3 of 7</text>
  <g filter="url(#p3l-soft)">
    <rect x="76" y="538" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p3l-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">A ten-minute ranking snapshot</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,644 L82.5,648.5 L90,638.5"/>
  </g>
  <text x="104" y="650" font-size="15.5" fill="#6B7280">Paging stays stable while the person scrolls.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,669 L89,680 M89,669 L78,680"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">The order can be up to ten minutes old.</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1176" y="786" text-anchor="end" font-size="15.5" fill="#94A3B8">choice 4 of 7</text>
  <g filter="url(#p3l-soft)">
    <rect x="76" y="734" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#059669" clip-path="url(#p3l-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">410 feed_expired</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,840 L82.5,844.5 L90,834.5"/>
  </g>
  <text x="104" y="846" font-size="15.5" fill="#6B7280">The client can tell late apart from wrong.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,865 L89,876 M89,865 L78,876"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Retaining expired snapshot ids as part of the contract.</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1176" y="982" text-anchor="end" font-size="15.5" fill="#94A3B8">choice 5 of 7</text>
  <g filter="url(#p3l-soft)">
    <rect x="76" y="930" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#059669" clip-path="url(#p3l-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">A new-post count, not insertion</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1036 L82.5,1040.5 L90,1030.5"/>
  </g>
  <text x="104" y="1042" font-size="15.5" fill="#6B7280">Older pages never skip or repeat rows.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1061 L89,1072 M89,1061 L78,1072"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">The person must pull to refresh to see the new posts.</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1176" y="1178" text-anchor="end" font-size="15.5" fill="#94A3B8">choice 6 of 7</text>
  <g filter="url(#p3l-soft)">
    <rect x="76" y="1126" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#059669" clip-path="url(#p3l-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">Viewer reaction beside Post</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1232 L82.5,1236.5 L90,1226.5"/>
  </g>
  <text x="104" y="1238" font-size="15.5" fill="#6B7280">Post stays shareable and cacheable across viewers.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1257 L89,1268 M89,1257 L78,1268"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">One more field the composed response must assemble.</text>

  
  <rect x="40" y="1302" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1176" y="1374" text-anchor="end" font-size="15.5" fill="#94A3B8">choice 7 of 7</text>
  <g filter="url(#p3l-soft)">
    <rect x="76" y="1322" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1322" width="6" height="90" fill="#059669" clip-path="url(#p3l-k7)"/>
  </g>
  <circle cx="114" cy="1367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1356.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="1374" font-size="18.5" font-weight="600" fill="#111827">General resources stay separate</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1428 L82.5,1432.5 L90,1422.5"/>
  </g>
  <text x="104" y="1434" font-size="15.5" fill="#6B7280">Partners and other screens keep an ordinary contract.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1453 L89,1464 M89,1453 L78,1464"/>
  </g>
  <text x="104" y="1464" font-size="15.5" fill="#6B7280">Two surfaces to maintain over the same data.</text>

  
  <rect x="40" y="1510" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1555" text-anchor="middle" font-size="16" fill="#475569">The cost proves that the alternative was actually considered.</text>
</svg>