<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="required-title required-desc">
<title id="required-title">Where consensus is genuinely required</title>
<desc id="required-desc">Leader election, cluster membership, consistent configuration, correctness locks and atomic cross-partition commitment. Each is a small decision where two different answers corrupts something rather than merely annoying somebody.</desc>
<defs>
<marker id="required-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="required-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="required-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="required-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where consensus is genuinely required</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Consensus earns its cost in a short list of places.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="146" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The list is short enough to memorize</text>
<circle cx="60" cy="188" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="195" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="164" width="1110" height="48" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="645" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Leader election and failover</text>
<circle cx="60" cy="244" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="251" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="220" width="1110" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="645" y="250" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cluster membership, where disagreement makes two overlapping majorities</text>
<circle cx="60" cy="300" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="307" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="276" width="1110" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="645" y="306" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Configuration that must be consistent across every node</text>
<circle cx="60" cy="356" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="363" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="332" width="1110" height="48" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="645" y="362" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Distributed locks where correctness depends on mutual exclusion</text>
<circle cx="60" cy="412" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="419" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="388" width="1110" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="645" y="418" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Atomic commitment across partitions that share no transaction</text>
<rect x="40" y="460" width="1160" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="460" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="64" y="490" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What they have in common</text><text x="64" y="516" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">They are decisions, they are small, and two different answers</text><text x="64" y="542" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">is a correctness failure rather than an inconvenience.</text>
<rect x="40" y="584" width="1160" height="82" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="584" width="5" height="82" rx="2.5" fill="#39D5AA"/><text x="64" y="616.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The test, in one question</text><text x="64" y="645.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What breaks if two nodes disagree about this for ten seconds?</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">If disagreement would merely be annoying, you do not need consensus.</text>
</svg>