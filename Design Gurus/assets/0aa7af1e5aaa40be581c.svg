<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four Kubernetes nouns: a caller only ever talks to the Service, one stable address that load-balances across healthy pods, while the Deployment records the image and replica count and creates or replaces the ephemeral pods, and the Horizontal Pod Autoscaler changes that replica count from CPU or request rate.">
  <defs>
    <marker id="m06-l01-kubernetes-nouns-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l01-kubernetes-nouns-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m06-l01-kubernetes-nouns-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m06-l01-kubernetes-nouns-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="50" y="100" width="700" height="200" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="140" font-size="20" font-weight="600" fill="#1E3A8A">The traffic path</text>
  <text x="730" y="140" text-anchor="end" font-size="20" fill="#64748B">one address, any pods</text>
  <g filter="url(#m06-l01-kubernetes-nouns-soft)">
    <rect x="70" y="180" width="220" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="180" y="221" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Caller</text>
  <text x="180" y="253" text-anchor="middle" font-size="20" fill="#64748B">a service or client</text>
  <g filter="url(#m06-l01-kubernetes-nouns-soft)">
    <rect x="400" y="180" width="330" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="565" y="221" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service</text>
  <text x="565" y="253" text-anchor="middle" font-size="20" fill="#64748B">one stable address</text>

  <rect x="50" y="400" width="700" height="200" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="440" font-size="20" font-weight="600" fill="#92400E">Control loops</text>
  <text x="730" y="440" text-anchor="end" font-size="20" fill="#64748B">desired state in, reality corrected</text>
  <g filter="url(#m06-l01-kubernetes-nouns-soft)">
    <rect x="70" y="480" width="280" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="210" y="521" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Autoscaler</text>
  <text x="210" y="553" text-anchor="middle" font-size="20" fill="#64748B">watches CPU or rate</text>
  <g filter="url(#m06-l01-kubernetes-nouns-soft)">
    <rect x="400" y="480" width="330" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="565" y="521" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Deployment</text>
  <text x="565" y="553" text-anchor="middle" font-size="20" fill="#64748B">image + replica count</text>

  <rect x="820" y="100" width="360" height="500" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="840" y="140" font-size="20" font-weight="600" fill="#334155">Pods: ephemeral by design</text>
  <g filter="url(#m06-l01-kubernetes-nouns-soft)">
    <rect x="850" y="190" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1000" y="231" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pod</text>
  <text x="1000" y="263" text-anchor="middle" font-size="20" fill="#64748B">own IP, replaceable</text>
  <g filter="url(#m06-l01-kubernetes-nouns-soft)">
    <rect x="850" y="450" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1000" y="491" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pod</text>
  <text x="1000" y="523" text-anchor="middle" font-size="20" fill="#64748B">own IP, replaceable</text>
  <text x="1000" y="350" text-anchor="middle" font-size="20" fill="#64748B">Pods die and are replaced,</text>
  <text x="1000" y="382" text-anchor="middle" font-size="20" fill="#64748B">always at new addresses.</text>

  <g fill="none" stroke-width="2.5">
    <path d="M290,230 L392,230" stroke="#3B82F6" marker-end="url(#m06-l01-kubernetes-nouns-bl)"/>
    <path d="M730,215 L842,215" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l01-kubernetes-nouns-bl)"/>
    <path d="M730,255 C790,255 800,500 842,500" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l01-kubernetes-nouns-bl)"/>
    <path d="M350,530 L392,530" stroke="#D97706" stroke-width="2" marker-end="url(#m06-l01-kubernetes-nouns-ab)"/>
    <path d="M730,505 C790,505 800,240 842,240" stroke="#7C3AED" stroke-width="2" marker-end="url(#m06-l01-kubernetes-nouns-vi)"/>
    <path d="M730,545 L842,545" stroke="#7C3AED" stroke-width="2" marker-end="url(#m06-l01-kubernetes-nouns-vi)"/>
  </g>

  <text x="341" y="165" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">every call goes here</text>
  <text x="786" y="172" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">routes to a healthy pod</text>
  <text x="371" y="468" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">changes the count</text>
  <text x="920" y="578" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">creates and replaces</text>

  <line x1="60" y1="660" x2="96" y2="660" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="667" font-size="20" fill="#475569">Live request path: callers only ever reach the Service</text>
  <line x1="60" y1="700" x2="96" y2="700" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="707" font-size="20" fill="#475569">The Deployment creates and replaces pods</text>
  <line x1="60" y1="740" x2="96" y2="740" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="747" font-size="20" fill="#475569">The autoscaler changes the replica count</text>
</svg>