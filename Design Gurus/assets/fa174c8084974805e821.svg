<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1172" viewBox="0 0 1240 1172" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Rows for the five migration stages. Stage 1, weeks 1 to 3, refactor inside the monolith: turn a flag off for grants by job or calls over HTTP; seconds, queued jobs still run. Stage 2, week 4, deploy without traffic: stop the Billing tasks; minutes, nothing to undo. Stage 3, weeks 4 to 5, route by path: set the routing weight to 0; seconds, no data lost, because both write the same tables, until Billing leaves the api image. Stage 4, week 5, move the billing lane: the api worker claims it again; seconds, no data lost, until Billing leaves the api image. Stage 5, week 7, remove Billing from the api image: redeploy the last api image and route back; about 10 minutes, while the schema matches. A dashed line marks the rollback limit: the provider switch, or the first contract step in the billing schema. After the provider switch in week 8, when only the new webhook format is sent, the only way is to fix forward through the Billing pipeline, about 45 minutes. A note below: completed charges, sent emails and access a learner has used are never rolled back at any stage; they are repaired with a refund, a correction email or a revoked enrollment.">
