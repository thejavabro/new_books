  <text x="1060" y="665" font-size="18.5" text-anchor="middle" fill="#6B7280">until Billing leaves the api image</text>
  <g filter="url(#md07d-soft)">
    <rect x="40" y="690" width="400" height="76" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="690" width="6" height="76" fill="#7C3AED" clip-path="url(#md07d-k13)"/>
