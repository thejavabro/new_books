  <text x="620" y="1710" text-anchor="middle" font-size="16" fill="#475569">Every failure carries a status, a stable code the caller can match on, and the condition that produces it.</text>
  <text x="620" y="1738" text-anchor="middle" font-size="16" fill="#475569">The caller action is part of the contract: correct the request, get permission, or wait and retry.</text>
