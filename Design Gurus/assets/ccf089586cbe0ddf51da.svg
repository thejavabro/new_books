<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The string with only the base marker on the stack">
<defs>
<filter id="lp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the longest well formed run in ")()())"?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The stack holds a marker for the last place a run was broken, plus any open brackets</text>
<rect x="40" y="106" width="1160" height="488" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">It starts holding a base marker just before the string, which is what makes the arithmetic work</text>
<text x="246" y="250" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the string</text>
<rect x="270" y="212" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="326" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">)</text>
<text x="326" y="294" text-anchor="middle" font-size="15.5" fill="#94A3B8">at 0</text>
<rect x="398" y="212" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="454" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">(</text>
<text x="454" y="294" text-anchor="middle" font-size="15.5" fill="#94A3B8">at 1</text>
<rect x="526" y="212" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="582" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">)</text>
<text x="582" y="294" text-anchor="middle" font-size="15.5" fill="#94A3B8">at 2</text>
<rect x="654" y="212" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="710" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">(</text>
<text x="710" y="294" text-anchor="middle" font-size="15.5" fill="#94A3B8">at 3</text>
<rect x="782" y="212" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="838" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">)</text>
<text x="838" y="294" text-anchor="middle" font-size="15.5" fill="#94A3B8">at 4</text>
<rect x="910" y="212" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="966" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">)</text>
<text x="966" y="294" text-anchor="middle" font-size="15.5" fill="#94A3B8">at 5</text>
<text x="246" y="382" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">positions held</text>
<rect x="270" y="344" width="112" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="326" y="381.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">base</text>
<text x="326" y="332" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">top</text>
<rect x="460" y="438" width="320" height="48" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="469" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">longest so far: 0</text>
<text x="620" y="528" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">A run is measured from the position just before it, so there has to be something to measure from</text>
<rect x="40" y="606" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="646" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The stack top is always the last position that broke a run</text>
<text x="620" y="678" text-anchor="middle" font-size="18.5" fill="#475569">So the run ending here is simply the current position minus that top</text>
</svg>