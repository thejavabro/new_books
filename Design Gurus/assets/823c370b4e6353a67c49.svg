<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="646" viewBox="0 0 1240 646" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four Cache-Control decisions and what each one promises: max-age states how long a copy may be reused without checking, private permits caller-local reuse only, public permits shared reuse, and no-store forbids storage entirely.">
  <defs>
    <filter id="p1m-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1m-k1"><rect x="76" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1m-k2"><rect x="676" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1m-k3"><rect x="76" y="342" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1m-k4"><rect x="676" y="342" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="646" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Lifetime and visibility are one decision, not two</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760,65 L767,71.5 L760,78"/>
  </g>
  <text x="782" y="77" font-size="15.5" fill="#6B7280">It promises</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M960,71 L964.5,75.5 L972,65.5"/>
  </g>
  <text x="986" y="77" font-size="15.5" fill="#6B7280">Use it for</text>

  
  <rect x="40" y="126" width="560" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1m-soft)">
    <rect x="76" y="146" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p1m-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">max-age=30</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78.5,251 L85.5,257.5 L78.5,264"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">Reuse for 30 seconds without revalidating</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,282 L82.5,286.5 L90,276.5"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Anything whose staleness window you can name</text>

  
  <rect x="640" y="126" width="560" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1m-soft)">
    <rect x="676" y="146" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="676" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p1m-k2)"/>
  </g>
  <circle cx="714" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="740" y="198" font-size="18.5" font-weight="600" fill="#111827">private</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M678.5,251 L685.5,257.5 L678.5,264"/>
  </g>
  <text x="704" y="262" font-size="15.5" fill="#6B7280">Only a caller-specific cache may store it</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M678,282 L682.5,286.5 L690,276.5"/>
  </g>
  <text x="704" y="288" font-size="15.5" fill="#6B7280">Any response that depends on who is calling</text>

  
  <rect x="40" y="322" width="560" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1m-soft)">
    <rect x="76" y="342" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#2563EB" clip-path="url(#p1m-k3)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12h18"/>
    <ellipse cx="12" cy="12" rx="4.6" ry="9"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">public</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78.5,447 L85.5,453.5 L78.5,460"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">Shared caches may reuse it for other callers</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,478 L82.5,482.5 L90,472.5"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Only caller-independent, non-private representations</text>

  
  <rect x="640" y="322" width="560" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1m-soft)">
    <rect x="676" y="342" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="676" y="342" width="6" height="90" fill="#2563EB" clip-path="url(#p1m-k4)"/>
  </g>
  <circle cx="714" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(703.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="740" y="394" font-size="18.5" font-weight="600" fill="#111827">no-store</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M678.5,447 L685.5,453.5 L678.5,460"/>
  </g>
  <text x="704" y="458" font-size="15.5" fill="#6B7280">It must not be stored for later reuse at all</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M678,478 L682.5,482.5 L690,472.5"/>
  </g>
  <text x="704" y="484" font-size="15.5" fill="#6B7280">Money, permissions, and anything that must change now</text>

  
  <rect x="40" y="530" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="575" text-anchor="middle" font-size="16" fill="#475569">max-age=3600 without deciding public or private leaves the dangerous question unanswered.</text>
</svg>