<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An available system answers from whatever data it holds, while a system that refuses rather than risk stale data is not available in the CAP sense">
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="cp4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="cp4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cp4-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="cp4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="400" rx="14" fill="#ECFDF5" fill-opacity="0.45" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="76" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Available: it answers</text>

  <rect x="640" y="40" width="580" height="400" rx="14" fill="#FEF2F2" fill-opacity="0.45" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="76" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Not available: it refuses</text>

  
  <line x1="270" y1="150" x2="326" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#cp4-slate)"/>
  <line x1="310" y1="240" x2="310" y2="284" stroke="#059669" stroke-width="2.5" marker-end="url(#cp4-emerald)"/>
  <line x1="890" y1="150" x2="946" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#cp4-slate)"/>
  <line x1="930" y1="240" x2="930" y2="284" stroke="#DC2626" stroke-width="2.5" marker-end="url(#cp4-red)"/>

  <g filter="url(#cp4-soft)">
    <rect x="60" y="110" width="210" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="335" y="110" width="225" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="680" y="110" width="210" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="955" y="110" width="225" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="165" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Request</text>
  <text x="447" y="150" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node is up</text>
  <text x="447" y="178" font-size="20" fill="#64748B" text-anchor="middle">its copy is a few</text>
  <text x="447" y="206" font-size="20" fill="#64748B" text-anchor="middle">seconds behind</text>

  <text x="785" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Request</text>
  <text x="1067" y="150" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node is up</text>
  <text x="1067" y="178" font-size="20" fill="#64748B" text-anchor="middle">but cannot confirm</text>
  <text x="1067" y="206" font-size="20" fill="#64748B" text-anchor="middle">its copy is current</text>

  <g filter="url(#cp4-soft)">
    <rect x="70" y="290" width="480" height="86" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="690" y="290" width="480" height="86" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="310" y="326" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Returns the data it has</text>
  <text x="310" y="354" font-size="20" fill="#059669" text-anchor="middle">possibly stale, but an answer</text>
  <text x="930" y="326" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Returns an error</text>
  <text x="930" y="354" font-size="20" fill="#DC2626" text-anchor="middle">correct, but no answer</text>

  <text x="310" y="480" font-size="20" fill="#475569" text-anchor="middle">This is what CAP means by available.</text>
  <text x="930" y="480" font-size="20" fill="#475569" text-anchor="middle">Silence counts as unavailable, even when it is the safer choice.</text>
</svg>