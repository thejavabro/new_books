<text x="483" y="212" text-anchor="middle" font-size="15.5" fill="#94A3B8">i=3</text>
<rect x="544" y="130" width="90" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="589" y="167.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="589" y="212" text-anchor="middle" font-size="15.5" fill="#94A3B8">i=4</text>
<rect x="650" y="130" width="90" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="695" y="167.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="695" y="212" text-anchor="middle" font-size="15.5" fill="#94A3B8">i=5</text>
