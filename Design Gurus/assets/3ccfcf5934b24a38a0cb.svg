<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The cost of each step">
<defs>
<filter id="mc-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
<text x="620" y="50" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">cost = [5, 10, 5, 15, 10, 5, 20]</text>
<text x="90" y="167" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">cost</text>
