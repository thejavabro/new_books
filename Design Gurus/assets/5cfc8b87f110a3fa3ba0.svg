<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="the array and the three pointers">
<defs>
<filter id="dn-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Three regions, held apart by three pointers</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">everything before low is 0, everything after high is 2, and the middle is still unknown</text>
<rect x="40" y="100" width="1160" height="240" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="130" font-size="19.5" font-weight="600" fill="#475569">the array</text>
<rect x="391" y="142" width="82" height="56" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="432" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="432" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="485" y="142" width="82" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="526" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="526" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="579" y="142" width="82" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="620" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="673" y="142" width="82" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="714" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="714" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="767" y="142" width="82" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="808" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="808" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<path d="M423,252 L441,252 L432,238 Z" fill="#059669"/>
<text x="432" y="276" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">low</text>
<path d="M423,304 L441,304 L432,290 Z" fill="#D97706"/>
<text x="432" y="328" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">i</text>
<path d="M799,252 L817,252 L808,238 Z" fill="#7C3AED"/>
<text x="808" y="276" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">high</text>
<rect x="40" y="360" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="390" font-size="19.5" font-weight="600" fill="#475569">what each region means</text>
<rect x="110" y="408" width="300" height="52" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2"/>
<text x="260" y="440.48" text-anchor="middle" font-size="18" font-weight="600" fill="#047857">before low: all 0s</text>
<rect x="470" y="408" width="300" height="52" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="620" y="440.48" text-anchor="middle" font-size="18" font-weight="600" fill="#1D4ED8">low to high: unknown</text>
<rect x="830" y="408" width="310" height="52" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/>
<text x="985" y="440.48" text-anchor="middle" font-size="18" font-weight="600" fill="#5B21B6">after high: all 2s</text>
<rect x="40" y="500" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="540" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">low = 0, high = 4, i = 0</text>
<text x="620" y="572" text-anchor="middle" font-size="18.5" fill="#475569">the middle region shrinks until nothing is left unknown</text>
</svg>