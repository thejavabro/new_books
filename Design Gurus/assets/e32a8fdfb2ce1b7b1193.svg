<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="ETag and Last-Modified compared, and the one second precision trap where two writes inside the same second leave Last-Modified unchanged so the client keeps a stale copy">
  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="ap4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="ap4-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two validators for the same job, and the case where only one of them works</text>

  
  <rect x="310" y="88" width="440" height="52" fill="#F5F3FF"/>
  <rect x="750" y="88" width="440" height="52" fill="#F1F5F9"/>
  <text x="530" y="121" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">ETag</text>
  <text x="970" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Last-Modified</text>

  <text x="70" y="173" font-size="20" font-weight="600" fill="#475569">What it is</text>
  <text x="330" y="173" font-size="20" fill="#0F172A">a fingerprint of the bytes</text>
  <text x="770" y="173" font-size="20" fill="#0F172A">the time the file last changed</text>

  <text x="70" y="225" font-size="20" font-weight="600" fill="#475569">The client sends</text>
  <text x="330" y="225" font-size="20" fill="#0F172A" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">If-None-Match: "abc123"</text>
  <text x="770" y="225" font-size="20" fill="#0F172A" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">If-Modified-Since: &lt;date&gt;</text>

  <text x="70" y="277" font-size="20" font-weight="600" fill="#475569">Precision</text>
  <text x="330" y="277" font-size="20" fill="#0F172A">exact, byte for byte</text>
  <text x="770" y="277" font-size="20" fill="#0F172A">one second, no finer</text>

  <text x="70" y="329" font-size="20" font-weight="600" fill="#475569">Misses a change when</text>
  <text x="330" y="329" font-size="20" fill="#065F46">never, for a strong tag</text>
  <text x="770" y="329" font-size="20" font-weight="600" fill="#B91C1C">two writes land in one second</text>

  <line x1="50" y1="88" x2="1190" y2="88" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="1190" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="50" y1="192" x2="1190" y2="192" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="244" x2="1190" y2="244" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="296" x2="1190" y2="296" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="348" x2="1190" y2="348" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="348" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="310" y1="88" x2="310" y2="348" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="750" y1="88" x2="750" y2="348" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="1190" y1="88" x2="1190" y2="348" stroke="#CBD5E1" stroke-width="1.5"/>

  
  <text x="620" y="398" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The one second trap: two writes inside the same second</text>

  <rect x="220" y="428" width="180" height="48" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="310" y="458" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">write v2</text>
  <rect x="620" y="428" width="180" height="48" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="710" y="458" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">write v3</text>

  <line x1="310" y1="478" x2="310" y2="494" stroke="#7C3AED" stroke-width="2" marker-end="url(#ap4-violet)"/>
  <line x1="710" y1="478" x2="710" y2="494" stroke="#7C3AED" stroke-width="2" marker-end="url(#ap4-violet)"/>

  <line x1="110" y1="510" x2="1160" y2="510" stroke="#475569" stroke-width="2" marker-end="url(#ap4-slate)"/>
  <line x1="310" y1="498" x2="310" y2="522" stroke="#475569" stroke-width="2"/>
  <line x1="710" y1="498" x2="710" y2="522" stroke="#475569" stroke-width="2"/>

  <text x="310" y="552" font-size="20" fill="#334155" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">12:00:03.100</text>
  <text x="710" y="552" font-size="20" fill="#334155" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">12:00:03.700</text>

  <text x="310" y="582" font-size="20" fill="#5B21B6" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">ETag "a1"</text>
  <text x="710" y="582" font-size="20" fill="#5B21B6" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">ETag "b2"</text>

  <text x="310" y="610" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">Last-Modified 12:00:03</text>
  <text x="710" y="610" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">Last-Modified 12:00:03</text>

  <path d="M177 640 V628 H843 V640" fill="none" stroke="#DC2626" stroke-width="2"/>
  <text x="510" y="668" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">identical, so this validator cannot tell the versions apart</text>

  
  <rect x="50" y="694" width="560" height="104" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="330" y="728" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">The client sends If-Modified-Since: 12:00:03</text>
  <text x="330" y="754" font-size="20" fill="#B91C1C" text-anchor="middle">The server sees no later change and returns 304.</text>
  <text x="330" y="780" font-size="20" fill="#B91C1C" text-anchor="middle">The reader is stuck on v2, forever.</text>

  <rect x="630" y="694" width="560" height="104" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="910" y="728" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The client sends If-None-Match: "a1"</text>
  <text x="910" y="754" font-size="20" fill="#065F46" text-anchor="middle">a1 does not match b2, so the server returns v3.</text>
  <text x="910" y="780" font-size="20" fill="#065F46" text-anchor="middle">The reader is correct.</text>

  
  <rect x="50" y="828" width="1140" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="860" font-size="20" fill="#0F172A" text-anchor="middle">Last-Modified is a weak validator. Keep it as a fallback, and prefer an ETag wherever the server can compute one.</text>
</svg>