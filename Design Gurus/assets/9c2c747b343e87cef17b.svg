<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="878" viewBox="0 0 1240 878" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The broker linked to two panels. Advantages: location transparency, services move and scale without clients knowing; centralized cross-cutting concerns, authentication and logging handled in one place; dynamic load distribution, routing adjusts to server health and load; fault isolation, keeps many server failures away from clients; interoperability, translates between protocols and data formats. Limitations: single point of failure, broker failure stops all communication; performance bottleneck, broker throughput limits the entire system; added latency, an extra hop for request and response; complexity with one-way calls, callbacks and correlation IDs are hard to debug; retries can run a request twice, only idempotent requests are safe to retry">
  <defs>
    <filter id="m12o-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m12o-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m12o-k1"><rect x="535" y="116" width="170" height="90" rx="12"/></clipPath>
    <marker id="m12o-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m12o-s-slate" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="878" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Broker architecture: advantages vs. limitations</text>


  <rect x="40" y="270" width="570" height="578" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="300" font-size="19.5" font-weight="600" fill="#047857">Advantages</text>
  <rect x="630" y="270" width="570" height="578" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="654" y="300" font-size="19.5" font-weight="600" fill="#BE185D">Limitations</text>

  <g fill="none" stroke-width="2">
    <path d="M535,161 H325 V270" stroke="#64748B" marker-end="url(#m12o-m-slate)"/>
    <path d="M705,161 H915 V270" stroke="#64748B" marker-end="url(#m12o-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m12o-lift)">
    <rect x="535" y="116" width="170" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="535" y="116" width="9" height="90" fill="#7C3AED" clip-path="url(#m12o-k1)"/>
  </g>
  <circle cx="573" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(562.56,150.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="599" y="168" font-size="21.5" font-weight="600" fill="#111827">Broker</text>

  <rect x="64" y="330" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="102" cy="367" r="21" fill="#D1FAE5"/>
  <g transform="translate(91.56,356.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="138" y="361" font-size="19.5" font-weight="600" fill="#111827">Location transparency</text>
  <text x="138" y="387" font-size="18.5" fill="#4B5563">Services move and scale without clients knowing</text>
  <rect x="64" y="414" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="102" cy="451" r="21" fill="#D1FAE5"/>
  <g transform="translate(91.56,440.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="138" y="445" font-size="19.5" font-weight="600" fill="#111827">Centralized cross-cutting concerns</text>
  <text x="138" y="471" font-size="18.5" fill="#4B5563">Authentication and logging handled in one place</text>
  <rect x="64" y="498" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="102" cy="535" r="21" fill="#D1FAE5"/>
  <g transform="translate(91.56,524.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="138" y="529" font-size="19.5" font-weight="600" fill="#111827">Dynamic load distribution</text>
  <text x="138" y="555" font-size="18.5" fill="#4B5563">Routing adjusts to server health and load</text>
  <rect x="64" y="582" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="102" cy="619" r="21" fill="#D1FAE5"/>
  <g transform="translate(91.56,608.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="138" y="613" font-size="19.5" font-weight="600" fill="#111827">Fault isolation</text>
  <text x="138" y="639" font-size="18.5" fill="#4B5563">Keeps many server failures away from clients</text>
  <rect x="64" y="666" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="102" cy="703" r="21" fill="#D1FAE5"/>
  <g transform="translate(91.56,692.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="138" y="697" font-size="19.5" font-weight="600" fill="#111827">Interoperability</text>
  <text x="138" y="723" font-size="18.5" fill="#4B5563">Translates between protocols and data formats</text>
  <rect x="654" y="330" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <circle cx="692" cy="367" r="21" fill="#FCE7F3"/>
  <g transform="translate(681.56,356.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="728" y="361" font-size="19.5" font-weight="600" fill="#111827">Single point of failure</text>
  <text x="728" y="387" font-size="18.5" fill="#4B5563">Broker failure stops all communication</text>
  <rect x="654" y="414" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <circle cx="692" cy="451" r="21" fill="#FCE7F3"/>
  <g transform="translate(681.56,440.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="728" y="445" font-size="19.5" font-weight="600" fill="#111827">Performance bottleneck</text>
  <text x="728" y="471" font-size="18.5" fill="#4B5563">Broker throughput limits the entire system</text>
  <rect x="654" y="498" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <circle cx="692" cy="535" r="21" fill="#FCE7F3"/>
  <g transform="translate(681.56,524.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="728" y="529" font-size="19.5" font-weight="600" fill="#111827">Added latency</text>
  <text x="728" y="555" font-size="18.5" fill="#4B5563">Extra hop for request and response</text>
  <rect x="654" y="582" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <circle cx="692" cy="619" r="21" fill="#FCE7F3"/>
  <g transform="translate(681.56,608.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="728" y="613" font-size="19.5" font-weight="600" fill="#111827">Complexity with one-way calls</text>
  <text x="728" y="639" font-size="18.5" fill="#4B5563">Callbacks and correlation IDs are hard to debug</text>
  <rect x="654" y="666" width="522" height="74" rx="12" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <circle cx="692" cy="703" r="21" fill="#FCE7F3"/>
  <g transform="translate(681.56,692.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/></g>
  <text x="728" y="697" font-size="19.5" font-weight="600" fill="#111827">Retries can run a request twice</text>
  <text x="728" y="723" font-size="18.5" fill="#4B5563">Only idempotent requests are safe to retry</text>


</svg>