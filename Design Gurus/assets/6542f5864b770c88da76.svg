<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="756" viewBox="0 0 1240 756" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="bucketing-title bucketing-desc">
<title id="bucketing-title">The monotonic key, and bucketing</title>
<desc id="bucketing-desc">A bare timestamp sends every write at any instant to the same partition. Combining the series identity with a coarse time bucket spreads writes, and the bucket width is sized against partition guidance and query fan-out.</desc>
<defs>
<marker id="bucketing-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="bucketing-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="bucketing-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="bucketing-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="756" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The monotonic key, and bucketing</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Using the timestamp as the partition key is the classic mistake.</text>
<rect x="40" y="678" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="678" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="560" height="196" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V308A6 6 0 0 0 46 314H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Timestamp as the partition key</text>
<rect x="72" y="168" width="496" height="118" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="107.0" y="264.0" width="40" height="14" rx="5" fill="#06AC80"/>
<rect x="162.0" y="264.0" width="40" height="14" rx="5" fill="#06AC80"/>
<rect x="217.0" y="264.0" width="40" height="14" rx="5" fill="#06AC80"/>
<rect x="272.0" y="264.0" width="40" height="14" rx="5" fill="#06AC80"/>
<rect x="327.0" y="264.0" width="40" height="14" rx="5" fill="#06AC80"/>
<rect x="382.0" y="264.0" width="40" height="14" rx="5" fill="#06AC80"/>
<rect x="437.0" y="264.0" width="40" height="14" rx="5" fill="#06AC80"/>
<rect x="492.0" y="186.0" width="40" height="92" rx="5" fill="#F25461"/>
<rect x="640" y="118" width="560" height="196" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V308A6 6 0 0 0 646 314H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Series plus a time bucket</text>
<rect x="672" y="168" width="496" height="118" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="707.0" y="232.0" width="40" height="46" rx="5" fill="#06AC80"/>
<rect x="762.0" y="232.0" width="40" height="46" rx="5" fill="#06AC80"/>
<rect x="817.0" y="232.0" width="40" height="46" rx="5" fill="#06AC80"/>
<rect x="872.0" y="232.0" width="40" height="46" rx="5" fill="#06AC80"/>
<rect x="927.0" y="232.0" width="40" height="46" rx="5" fill="#06AC80"/>
<rect x="982.0" y="232.0" width="40" height="46" rx="5" fill="#06AC80"/>
<rect x="1037.0" y="232.0" width="40" height="46" rx="5" fill="#06AC80"/>
<rect x="1092.0" y="232.0" width="40" height="46" rx="5" fill="#06AC80"/>
<rect x="150" y="334" width="940" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="170" y="365" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">partition key = series_id + "#" + hour_bucket</text><text x="170" y="391" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">sort key      = exact timestamp</text>
<text x="40" y="444" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The bucket width is squeezed from both sides</text>
<rect x="40" y="462" width="560" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="486.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Too wide: the partition grows without bound</text><text x="320" y="513.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and every read of it gets expensive</text>
<rect x="640" y="462" width="560" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="486.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Too narrow: a one-week range at one-minute</text><text x="920" y="513.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">buckets is ten thousand requests</text>
<rect x="40" y="550" width="1160" height="100" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="550" width="5" height="100" rx="2.5" fill="#5EC9EC"/><text x="64" y="580" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Write rate per series x bucket width x row size, kept inside the partition guidance.</text><text x="64" y="606" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Then check the common query range spans a handful of buckets.</text><text x="64" y="632" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">If both cannot hold at once, the series is too hot and needs splitting.</text>
<text x="66" y="712" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The sizing is a short calculation of exactly the kind the estimation module describes.</text>
</svg>