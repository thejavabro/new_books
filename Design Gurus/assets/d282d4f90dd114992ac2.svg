    <clipPath id="px-p5"><rect x="440" y="740" width="724" height="90" rx="12"/></clipPath>
    <clipPath id="px-p6"><rect x="440" y="882" width="724" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1228" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The component is not the promise</text>
