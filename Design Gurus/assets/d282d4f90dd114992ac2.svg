  <g transform="translate(467.56,774.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="504" y="792" font-size="18.5" font-weight="600" fill="#111827">A Cache-Control freshness promise the caller can plan around</text>

  
  <rect x="40" y="862" width="1160" height="126" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
