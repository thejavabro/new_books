  <text x="504" y="934" font-size="18.5" font-weight="600" fill="#111827">A bounded failure and retry contract</text>

  
  <rect x="40" y="1016" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1061" text-anchor="middle" font-size="16" fill="#475569">A caller cannot see the database topology. It can see only requests and responses.</text>

  
  <rect x="40" y="1112" width="1160" height="76" rx="14" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="620" y="1157" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">Mention the mechanism only after the observable rule is clear.</text>
