<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1228" viewBox="0 0 1240 1228" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six internal mechanisms and the caller-visible promise each one supports. The component may support the answer, but only the promise tells the caller what happens: an idempotency record becomes a 24-hour replay guarantee, a token bucket becomes a published rate and 429 behavior, and a replica becomes a defined read-your-writes rule.">
