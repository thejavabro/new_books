<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="715" viewBox="0 0 1240 715" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Driving or inbound adapters (web and REST for HTTP requests, CLI for the command line, and a queue consumer for events from a queue) call the driving or inbound port, the OrderUseCases interface, drawn as three cards for its create_order, get_order and cancel_order methods, beside the domain hexagon of entities, business rules and use cases. Driven or outbound adapters (a database adapter for PostgreSQL or MongoDB, a payment adapter for Stripe or PayPal, and a notification adapter for email, SMS or Slack) implement the driven or outbound ports, order repository, payment gateway and notification service. Every arrow is a dependency and points toward the domain, which owns both port columns">
