<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A JWT is three dot-separated parts: a header naming the algorithm, a payload of claims about the user, and a signature sealing the first two">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="se6-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se6-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="se6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="se6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="260" y1="168" x2="225" y2="254" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se6-blue)"/>
  <line x1="605" y1="168" x2="613" y2="254" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se6-violet)"/>
  <line x1="965" y1="168" x2="1005" y2="254" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se6-emerald)"/>

  
  <text x="260" y="86" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Header</text>
  <text x="605" y="86" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Payload</text>
  <text x="965" y="86" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Signature</text>

  <g filter="url(#se6-soft)">
    <rect x="130" y="100" width="260" height="68" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="440" y="100" width="330" height="68" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="820" y="100" width="290" height="68" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="260" y="142" font-size="20" font-family="Consolas, monospace" fill="#1E40AF" text-anchor="middle">eyJhbGciOiJIUzI1NiJ9</text>
  <text x="415" y="146" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">.</text>
  <text x="605" y="142" font-size="20" font-family="Consolas, monospace" fill="#5B21B6" text-anchor="middle">eyJ1c2VySWQiOiI0MiIsInJv...</text>
  <text x="795" y="146" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">.</text>
  <text x="965" y="142" font-size="20" font-family="Consolas, monospace" fill="#065F46" text-anchor="middle">SflKxwRJSMeKKF2QT4fw...</text>

  
  <rect x="40" y="260" width="350" height="164" rx="12" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="300" font-size="20" font-family="Consolas, monospace" fill="#0F172A">{ "alg": "HS256",</text>
  <text x="72" y="328" font-size="20" font-family="Consolas, monospace" fill="#0F172A">  "typ": "JWT" }</text>
  <text x="215" y="392" font-size="20" fill="#64748B" text-anchor="middle">which signing algorithm is used</text>

  <rect x="425" y="260" width="380" height="190" rx="12" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="457" y="300" font-size="20" font-family="Consolas, monospace" fill="#0F172A">{ "userId": "42",</text>
  <text x="457" y="328" font-size="20" font-family="Consolas, monospace" fill="#0F172A">  "role": "admin",</text>
  <text x="457" y="356" font-size="20" font-family="Consolas, monospace" fill="#0F172A">  "exp": &lt;expiry&gt; }</text>
  <text x="615" y="418" font-size="20" fill="#64748B" text-anchor="middle">claims: statements about the user</text>

  <rect x="840" y="260" width="360" height="190" rx="12" fill="#ECFDF5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="872" y="300" font-size="20" font-family="Consolas, monospace" fill="#0F172A">HMACSHA256(</text>
  <text x="872" y="328" font-size="20" font-family="Consolas, monospace" fill="#0F172A">  header + payload,</text>
  <text x="872" y="356" font-size="20" font-family="Consolas, monospace" fill="#0F172A">  secret key )</text>
  <text x="1020" y="418" font-size="20" fill="#64748B" text-anchor="middle">a seal over the first two parts</text>

  
  <rect x="140" y="500" width="960" height="94" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="536" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Change even one character of the header or the payload,</text>
  <text x="620" y="568" font-size="20" fill="#64748B" text-anchor="middle">and the signature no longer matches: the server rejects the token.</text>
</svg>