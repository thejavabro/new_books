<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" style="background-color:#ffffff">
<defs>
<marker id="sa" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="sd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="28" font-size="12.5" font-weight="bold" fill="#414d60">Abstraction: what the message is</text>
<text x="560" y="28" font-size="12.5" font-weight="bold" fill="#414d60">Implementation: how it goes out</text>

<rect x="30" y="44" width="270" height="82" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="44" width="270" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="165" y="63" text-anchor="middle" font-weight="bold" font-style="italic">Notification</text>
<text x="42" y="92"># channel : Channel</text>
<text x="42" y="114">+ send()</text>

<rect x="660" y="44" width="290" height="62" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="660" y="44" width="290" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="805" y="63" text-anchor="middle" font-weight="bold">&#171;interface&#187; Channel</text>
<text x="672" y="92">+ deliver(title, body)</text>

<rect x="20" y="250" width="230" height="54" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="20" y="250" width="230" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="135" y="269" text-anchor="middle" font-weight="bold">AlertNotification</text>
<text x="32" y="296" font-size="11.5">+ send()</text>

<rect x="270" y="250" width="230" height="54" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="270" y="250" width="230" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="385" y="269" text-anchor="middle" font-weight="bold">ReminderNotification</text>
<text x="282" y="296" font-size="11.5">+ send()</text>

<rect x="620" y="250" width="160" height="44" fill="#dcefe4" stroke="#2f7a55"/>
<text x="700" y="277" text-anchor="middle" font-weight="bold">EmailChannel</text>

<rect x="800" y="250" width="160" height="44" fill="#dcefe4" stroke="#2f7a55"/>
<text x="880" y="277" text-anchor="middle" font-weight="bold">SmsChannel</text>

<path d="M 135 250 L 135 200 L 165 200 L 165 126" stroke="#000000" fill="none" marker-end="url(#sa)"/>
<path d="M 385 250 L 385 200 L 165 200" stroke="#000000" fill="none"/>

<path d="M 700 250 L 700 190 L 805 190 L 805 106" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#sa)"/>
<path d="M 880 250 L 880 190 L 805 190" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<path d="M 304 85 L 655 85" stroke="#000000" fill="none" stroke-width="1.5" marker-start="url(#sd)"/>
<text x="420" y="77" font-size="12" font-weight="bold" fill="#b4322c">the bridge</text>
<text x="360" y="126" font-size="11.5" fill="#414d60">one reference, held once in the base class and used by every subclass</text>

<rect x="20" y="346" width="940" height="66" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="42" y="372" font-size="12.5" fill="#414d60">Both sides grow without touching each other. Adding PushChannel is one class on the right, and no notification type changes.</text>
<text x="42" y="394" font-size="12.5" fill="#414d60">The abstraction never names a concrete channel, and no channel knows what a notification is.</text>
</g>
</svg>