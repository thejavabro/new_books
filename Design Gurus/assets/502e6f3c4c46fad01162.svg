<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flow for an unreachable check service. Convenience checks fail open, so fraud scoring being down means the order is accepted and flagged for review, while checks that protect security or money fail closed, so auth being down means nobody gets in.">
  <defs>
    <marker id="m04-l07-fail-open-or-closed-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l07-fail-open-or-closed-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l07-fail-open-or-closed-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m04-l07-fail-open-or-closed-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="910" fill="#FFFFFF"/>

  <g filter="url(#m04-l07-fail-open-or-closed-soft)">
    <rect x="60" y="290" width="330" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="225" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A check service</text>
  <text x="225" y="362" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">is unreachable</text>
  <text x="225" y="394" text-anchor="middle" font-size="20" fill="#64748B">timed out, or the breaker is open</text>
  <g filter="url(#m04-l07-fail-open-or-closed-soft)">
    <path d="M680,260 L930,355 L680,450 L430,355 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="680" y="362" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">What does the check protect?</text>
  <text x="680" y="392" text-anchor="middle" font-size="20" fill="#64748B">allow the action, or refuse it?</text>

  <g filter="url(#m04-l07-fail-open-or-closed-soft)">
    <rect x="460" y="100" width="280" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="600" y="146" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fail open</text>
  <text x="600" y="178" text-anchor="middle" font-size="20" fill="#64748B">allow the action</text>
  <g filter="url(#m04-l07-fail-open-or-closed-soft)">
    <rect x="780" y="100" width="400" height="110" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="980" y="146" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fraud scoring is down,</text>
  <text x="980" y="178" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">so accept and flag it</text>
  <g filter="url(#m04-l07-fail-open-or-closed-soft)">
    <rect x="460" y="520" width="280" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="600" y="566" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fail closed</text>
  <text x="600" y="598" text-anchor="middle" font-size="20" fill="#64748B">refuse the action</text>
  <g filter="url(#m04-l07-fail-open-or-closed-soft)">
    <rect x="780" y="520" width="400" height="110" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="980" y="566" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Auth is down,</text>
  <text x="980" y="598" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">so nobody gets in</text>

  <g fill="none" stroke-width="2.5">
    <path d="M390,355 L428,355" stroke="#475569" stroke-width="2" marker-end="url(#m04-l07-fail-open-or-closed-sl)"/>
    <path d="M680,262 L680,218" stroke="#059669" marker-end="url(#m04-l07-fail-open-or-closed-em)"/>
    <path d="M680,450 L680,512" stroke="#DC2626" marker-end="url(#m04-l07-fail-open-or-closed-rd)"/>
    <path d="M740,155 L772,155" stroke="#059669" stroke-width="2" marker-end="url(#m04-l07-fail-open-or-closed-em)"/>
    <path d="M740,575 L772,575" stroke="#DC2626" stroke-width="2" marker-end="url(#m04-l07-fail-open-or-closed-rd)"/>
  </g>

  <text x="700" y="245" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Convenience</text>
  <text x="700" y="490" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Security or money</text>

  <g filter="url(#m04-l07-fail-open-or-closed-soft)">
    <rect x="60" y="680" width="1120" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="731" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Getting this backwards is the costly mistake</text>
  <text x="620" y="763" text-anchor="middle" font-size="20" fill="#64748B">"The permissions service was down so we allowed the request" is the sentence never to say</text>

  <line x1="60" y1="830" x2="96" y2="830" stroke="#059669" stroke-width="4"/>
  <text x="108" y="837" font-size="20" fill="#475569">Fail open: allow the action, since the check was a convenience</text>
  <line x1="60" y1="870" x2="96" y2="870" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="877" font-size="20" fill="#475569">Fail closed: refuse the action, since the check guards money or access</text>
</svg>