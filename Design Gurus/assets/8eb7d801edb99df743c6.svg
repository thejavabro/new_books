<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="High-level design of a messenger where User A sends a message to the chat server, which acknowledges the sender, stores the message in the message database, and delivers it to User B.">
  <defs>
    <marker id="fm02-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="fm02-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="fm02-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="fm02-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="fm02-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="fm02-k1"><rect x="70" y="80" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="fm02-k2"><rect x="70" y="340" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="fm02-k3"><rect x="520" y="210" width="196" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="610" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2">
    <path d="M240,125 H578 Q590,125 590,137 V210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#fm02-bl)"/>
    <path d="M520,233 H167 Q155,233 155,221 V170" stroke="#059669" marker-end="url(#fm02-em)"/>
    <path d="M520,277 H167 Q155,277 155,289 V340" stroke="#059669" marker-end="url(#fm02-em)"/>
    <path d="M716,255 H940" stroke="#D97706" marker-end="url(#fm02-am)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="410" y="117" fill="#1D4ED8">send message</text>
    <text x="330" y="225" fill="#047857">acknowledge</text>
    <text x="330" y="269" fill="#047857">deliver</text>
    <text x="828" y="247" fill="#B45309">store</text>
  </g>

  
  <g filter="url(#fm02-soft)">
    <rect x="70" y="80" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="80" width="6" height="90" fill="#2563EB" clip-path="url(#fm02-k1)"/>
  </g>
  <circle cx="108" cy="125" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,114.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="134" y="132" font-size="18.5" font-weight="600" fill="#111827">User A</text>

  
  <g filter="url(#fm02-soft)">
    <rect x="70" y="340" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="340" width="6" height="90" fill="#2563EB" clip-path="url(#fm02-k2)"/>
  </g>
  <circle cx="108" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,374.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="134" y="392" font-size="18.5" font-weight="600" fill="#111827">User B</text>

  
  <g filter="url(#fm02-lift)">
    <rect x="520" y="210" width="196" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="520" y="210" width="9" height="90" fill="#7C3AED" clip-path="url(#fm02-k3)"/>
  </g>
  <circle cx="558" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,244.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="584" y="262" font-size="18.5" font-weight="600" fill="#111827">Chat Server</text>
  <text x="618" y="325" font-size="15.5" text-anchor="middle" fill="#6B7280">holds one open connection per active user</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M940,210 L940,294 A100,16 0 0 0 1140,294 L1140,210" fill="#FEF3C7"/>
    <ellipse cx="1040" cy="210" rx="100" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1040" y="268" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Message Database</text>
  <text x="1040" y="335" font-size="15.5" text-anchor="middle" fill="#6B7280">chat history, stored permanently</text>

  
  <rect x="40" y="470" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="510" text-anchor="middle" font-size="16" fill="#475569">A sender hands the message to the chat server. The server acknowledges the sender, stores the message,</text>
  <text x="620" y="536" text-anchor="middle" font-size="16" fill="#475569">and delivers it to the receiver on that user's open connection.</text>
</svg>