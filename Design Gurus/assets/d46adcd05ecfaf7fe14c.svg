<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="914" viewBox="0 0 1240 914" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Seven candidate nouns from the order requirements tested against one question: does a caller need to refer to this noun by its own id and act on it independently? Only Order and Refund become resources.">
  <defs>
    <filter id="xl02nountes-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl02nountes-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl02nountes-k1"><rect x="150" y="204" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl02nountes-k2"><rect x="710" y="204" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl02nountes-k3"><rect x="104" y="444" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="xl02nountes-k4"><rect x="460" y="444" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="xl02nountes-k5"><rect x="816" y="444" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="xl02nountes-k6"><rect x="282" y="612" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="xl02nountes-k7"><rect x="638" y="612" width="320" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="914" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="86" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Seven candidate nouns, two resources</text>
  <text x="64" y="104" font-size="15.5" fill="#6B7280">The test: does a caller need to refer to this noun by its own id, and act on it independently?</text>

  
  <rect x="40" y="150" width="1160" height="216" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="186" font-size="16.5" font-weight="600" fill="#047857">Passes the test</text>

  
  <g filter="url(#xl02nountes-lift)">
    <rect x="150" y="204" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="150" y="204" width="9" height="90" fill="#059669" clip-path="url(#xl02nountes-k1)"/>
  </g>
  <circle cx="188" cy="249" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,238.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="214" y="256" font-size="18.5" font-weight="600" fill="#111827">Order</text>
  <text x="340" y="319" font-size="15.5" text-anchor="middle" fill="#6B7280">Yes. Created, read, and cancelled by its own id.</text>
  <text x="340" y="342" font-size="15.5" text-anchor="middle" fill="#94A3B8">Resource</text>

  
  <g filter="url(#xl02nountes-lift)">
    <rect x="710" y="204" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="710" y="204" width="9" height="90" fill="#059669" clip-path="url(#xl02nountes-k2)"/>
  </g>
  <circle cx="748" cy="249" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,238.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="774" y="256" font-size="18.5" font-weight="600" fill="#111827">Refund</text>
  <text x="900" y="319" font-size="15.5" text-anchor="middle" fill="#6B7280">Yes. Issued, then tracked later by its own id.</text>
  <text x="900" y="342" font-size="15.5" text-anchor="middle" fill="#94A3B8">Resource</text>

  
  <rect x="40" y="390" width="1160" height="384" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="426" font-size="16.5" font-weight="600" fill="#475569">Does not pass the test</text>

  
  <g filter="url(#xl02nountes-soft)">
    <rect x="104" y="444" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="104" y="444" width="6" height="90" fill="#64748B" clip-path="url(#xl02nountes-k3)"/>
  </g>
  <circle cx="142" cy="489" r="18" fill="#FFFFFF"/>
  <g transform="translate(131.56,478.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="168" y="496" font-size="18.5" font-weight="600" fill="#111827">Product</text>
  <text x="264" y="559" font-size="15.5" text-anchor="middle" fill="#6B7280">This scope needs only the purchased snapshot.</text>
  <text x="264" y="582" font-size="15.5" text-anchor="middle" fill="#94A3B8">Embedded order-line fields</text>

  
  <g filter="url(#xl02nountes-soft)">
    <rect x="460" y="444" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="460" y="444" width="6" height="90" fill="#64748B" clip-path="url(#xl02nountes-k4)"/>
  </g>
  <circle cx="498" cy="489" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,478.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="524" y="496" font-size="18.5" font-weight="600" fill="#111827">Delivery status</text>
  <text x="620" y="559" font-size="15.5" text-anchor="middle" fill="#6B7280">No. It describes the order.</text>
  <text x="620" y="582" font-size="15.5" text-anchor="middle" fill="#94A3B8">Field on Order</text>

  
  <g filter="url(#xl02nountes-soft)">
    <rect x="816" y="444" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="816" y="444" width="6" height="90" fill="#64748B" clip-path="url(#xl02nountes-k5)"/>
  </g>
  <circle cx="854" cy="489" r="18" fill="#FFFFFF"/>
  <g transform="translate(843.56,478.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="880" y="496" font-size="18.5" font-weight="600" fill="#111827">Shopper</text>
  <text x="976" y="559" font-size="15.5" text-anchor="middle" fill="#6B7280">Authentication already identifies this caller.</text>
  <text x="976" y="582" font-size="15.5" text-anchor="middle" fill="#94A3B8">Not a resource here</text>

  
  <g filter="url(#xl02nountes-soft)">
    <rect x="282" y="612" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="282" y="612" width="6" height="90" fill="#64748B" clip-path="url(#xl02nountes-k6)"/>
  </g>
  <circle cx="320" cy="657" r="18" fill="#FFFFFF"/>
  <g transform="translate(309.56,646.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="346" y="664" font-size="18.5" font-weight="600" fill="#111827">Support agent</text>
  <text x="442" y="727" font-size="15.5" text-anchor="middle" fill="#6B7280">An actor, not the object of the operations.</text>
  <text x="442" y="750" font-size="15.5" text-anchor="middle" fill="#94A3B8">Not a resource here</text>

  
  <g filter="url(#xl02nountes-soft)">
    <rect x="638" y="612" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="638" y="612" width="6" height="90" fill="#64748B" clip-path="url(#xl02nountes-k7)"/>
  </g>
  <circle cx="676" cy="657" r="18" fill="#FFFFFF"/>
  <g transform="translate(665.56,646.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="702" y="664" font-size="18.5" font-weight="600" fill="#111827">Finance service</text>
  <text x="798" y="727" font-size="15.5" text-anchor="middle" fill="#6B7280">A caller.</text>
  <text x="798" y="750" font-size="15.5" text-anchor="middle" fill="#94A3B8">Not a resource</text>

  
  <rect x="40" y="798" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="843" text-anchor="middle" font-size="16" fill="#475569">A small model tied to real jobs is stronger than a long list of possible nouns.</text>
</svg>