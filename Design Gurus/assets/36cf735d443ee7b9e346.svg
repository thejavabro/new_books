<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="516" viewBox="0 0 1240 516" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A table comparing one, two and three copies. Only three copies survive one failure and still leave two copies, and only three machines still have a majority after one failure.">
  <rect x="0" y="0" width="1240" height="516" fill="#FFFFFF"/>
  <defs>
    <marker id="rr5-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr5-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rr5-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rr5-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rr5-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rr5-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rr5-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rr5-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rr5-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">How many copies to keep</text>
  <g filter="url(#rr5-soft)"><rect x="414" y="56" width="260" height="40" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="544" y="84" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">1 copy</text>
  <g filter="url(#rr5-soft)"><rect x="684" y="56" width="260" height="40" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="814" y="84" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">2 copies</text>
  <g filter="url(#rr5-soft)"><rect x="954" y="56" width="260" height="40" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1084" y="84" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">3 copies</text>
  <rect x="24" y="106" width="380" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="154" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Survives one machine failure</text>
  <g filter="url(#rr5-soft)"><rect x="414" y="106" width="260" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="544" y="154" font-size="19" fill="#0F172A" text-anchor="middle">No</text>
  <g filter="url(#rr5-soft)"><rect x="684" y="106" width="260" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="814" y="154" font-size="19" fill="#0F172A" text-anchor="middle">Yes</text>
  <g filter="url(#rr5-soft)"><rect x="954" y="106" width="260" height="82" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1084" y="154" font-size="19" fill="#0F172A" text-anchor="middle">Yes</text>
  <rect x="24" y="198" width="380" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="246" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">After one failure you still have</text>
  <g filter="url(#rr5-soft)"><rect x="414" y="198" width="260" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="544" y="246" font-size="19" fill="#0F172A" text-anchor="middle">nothing</text>
  <g filter="url(#rr5-soft)"><rect x="684" y="198" width="260" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="814" y="232" font-size="19" fill="#0F172A" text-anchor="middle">one copy,</text>
  <text x="814" y="258" font-size="19" fill="#0F172A" text-anchor="middle">no protection left</text>
  <g filter="url(#rr5-soft)"><rect x="954" y="198" width="260" height="82" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1084" y="246" font-size="19" fill="#0F172A" text-anchor="middle">two copies</text>
  <rect x="24" y="290" width="380" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="338" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Majority left after one failure?</text>
  <g filter="url(#rr5-soft)"><rect x="414" y="290" width="260" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="544" y="338" font-size="19" fill="#0F172A" text-anchor="middle">No</text>
  <g filter="url(#rr5-soft)"><rect x="684" y="290" width="260" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="814" y="338" font-size="19" fill="#0F172A" text-anchor="middle">No</text>
  <g filter="url(#rr5-soft)"><rect x="954" y="290" width="260" height="82" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1084" y="338" font-size="19" fill="#0F172A" text-anchor="middle">Yes, two of three</text>
  <rect x="24" y="382" width="380" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="430" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Storage for 10 TB of data</text>
  <g filter="url(#rr5-soft)"><rect x="414" y="382" width="260" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="544" y="430" font-size="19" fill="#0F172A" text-anchor="middle">10 TB</text>
  <g filter="url(#rr5-soft)"><rect x="684" y="382" width="260" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="814" y="430" font-size="19" fill="#0F172A" text-anchor="middle">20 TB</text>
  <g filter="url(#rr5-soft)"><rect x="954" y="382" width="260" height="82" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1084" y="430" font-size="19" fill="#0F172A" text-anchor="middle">30 TB</text>
  <text x="620" y="504" font-size="19" fill="#64748B" text-anchor="middle">Three is the normal choice. More than three is used for data that is read very often or is very costly to lose.</text>
</svg>