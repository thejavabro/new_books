<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="714" viewBox="0 0 1240 714" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Twitter resource model. User is on the left and Tweet is on the right, with Like as the many-to-many relationship drawn between them. User publishes many tweets. Follow is the many-to-many relationship from User back to User. Tweet has a self-reference through reply_to_tweet_id. HomeTimeline is a read-only derived collection holding references to many tweets.">
  <defs>
    <marker id="xl12twitter-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="xl12twitter-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="xl12twitter-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="xl12twitter-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="xl12twitter-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl12twitter-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl12twitter-k1"><rect x="100" y="184" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="xl12twitter-k2"><rect x="470" y="184" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="xl12twitter-k3"><rect x="840" y="184" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="xl12twitter-k4"><rect x="100" y="394" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="xl12twitter-k5"><rect x="840" y="394" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="714" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="534" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Five caller-facing resources</text>

  
  <g fill="none" stroke-width="2">
    <path d="M400,229 H470" stroke="#D97706" marker-end="url(#xl12twitter-am)"/>
    <path d="M770,229 H840" stroke="#D97706" marker-end="url(#xl12twitter-am)"/>
    <path d="M170,274 V394" stroke="#059669" marker-end="url(#xl12twitter-em)"/>
    <path d="M330,394 V274" stroke="#059669" marker-end="url(#xl12twitter-em)"/>
    <path d="M990,394 V274" stroke="#7C3AED" marker-end="url(#xl12twitter-vi)"/>
    <path d="M250,184 V128 Q250,116 262,116 H808 Q820,116 820,128 V198 Q820,210 832,210 H840" stroke="#2563EB" marker-end="url(#xl12twitter-bl)"/>
    <path d="M900,184 C880,94 1100,94 1080,184" stroke="#2563EB" stroke-width="2.5" marker-end="url(#xl12twitter-bl)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="990" y="108" fill="#1D4ED8">reply_to_tweet_id</text>
    <text x="535" y="106" fill="#1D4ED8">publishes many tweets</text>
    <text x="990" y="339" fill="#5B21B6">many tweets</text>
  </g>

  
  <g filter="url(#xl12twitter-lift)">
    <rect x="100" y="184" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="100" y="184" width="9" height="90" fill="#4F46E5" clip-path="url(#xl12twitter-k1)"/>
  </g>
  <circle cx="138" cy="229" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,218.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="164" y="236" font-size="18.5" font-weight="600" fill="#111827">User</text>

  
  <g filter="url(#xl12twitter-soft)">
    <rect x="470" y="184" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="470" y="184" width="6" height="90" fill="#D97706" clip-path="url(#xl12twitter-k2)"/>
  </g>
  <circle cx="508" cy="229" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,218.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20.5C6.5 16.6 3.5 13.4 3.5 9.9 3.5 7.2 5.6 5.2 8.2 5.2 9.8 5.2 11.2 6 12 7.3 12.8 6 14.2 5.2 15.8 5.2 18.4 5.2 20.5 7.2 20.5 9.9 20.5 13.4 17.5 16.6 12 20.5Z"/>
  </g>
  <text x="534" y="236" font-size="18.5" font-weight="600" fill="#111827">Like</text>
  <text x="620" y="299" font-size="15.5" text-anchor="middle" fill="#6B7280">many to many, user and tweet</text>
  <text x="620" y="322" font-size="15.5" text-anchor="middle" fill="#94A3B8">a user can like many tweets</text>

  
  <g filter="url(#xl12twitter-lift)">
    <rect x="840" y="184" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="840" y="184" width="9" height="90" fill="#2563EB" clip-path="url(#xl12twitter-k3)"/>
  </g>
  <circle cx="878" cy="229" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,218.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="904" y="236" font-size="18.5" font-weight="600" fill="#111827">Tweet</text>

  
  <g filter="url(#xl12twitter-soft)">
    <rect x="100" y="394" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="100" y="394" width="6" height="90" fill="#059669" clip-path="url(#xl12twitter-k4)"/>
  </g>
  <circle cx="138" cy="439" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,428.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="164" y="446" font-size="18.5" font-weight="600" fill="#111827">Follow</text>
  <text x="250" y="509" font-size="15.5" text-anchor="middle" fill="#6B7280">many to many, user to user</text>
  <text x="250" y="532" font-size="15.5" text-anchor="middle" fill="#94A3B8">a user can follow many users</text>

  
  <g filter="url(#xl12twitter-soft)">
    <rect x="840" y="394" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="840" y="394" width="6" height="90" fill="#7C3AED" clip-path="url(#xl12twitter-k5)"/>
  </g>
  <circle cx="878" cy="439" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,428.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="904" y="446" font-size="18.5" font-weight="600" fill="#111827">HomeTimeline</text>
  <text x="990" y="509" font-size="15.5" text-anchor="middle" fill="#6B7280">read-only derived collection</text>
  <text x="990" y="532" font-size="15.5" text-anchor="middle" fill="#94A3B8">it holds references to many tweets</text>

  
  <rect x="40" y="598" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="643" text-anchor="middle" font-size="16" fill="#475569">Counts are derived. Callers never write them.</text>
</svg>