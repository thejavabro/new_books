<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Without aggregation the client makes three calls and stitches the results together, and with it the gateway makes them and returns one response">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="ag4-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ag4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="ag4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="390" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="80" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Without aggregation</text>

  <rect x="640" y="40" width="580" height="390" rx="14" fill="#ECFDF5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="80" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">With aggregation</text>

  <line x1="216" y1="160" x2="336" y2="160" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ag4-red)"/>
  <line x1="216" y1="240" x2="336" y2="240" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ag4-red)"/>
  <line x1="216" y1="320" x2="336" y2="320" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ag4-red)"/>

  <line x1="836" y1="240" x2="896" y2="240" stroke="#059669" stroke-width="2.5" marker-end="url(#ag4-emerald)"/>
  <line x1="1046" y1="216" x2="1106" y2="160" stroke="#059669" stroke-width="2.5" marker-end="url(#ag4-emerald)"/>
  <line x1="1046" y1="240" x2="1106" y2="240" stroke="#059669" stroke-width="2.5" marker-end="url(#ag4-emerald)"/>
  <line x1="1046" y1="264" x2="1106" y2="320" stroke="#059669" stroke-width="2.5" marker-end="url(#ag4-emerald)"/>

  <g filter="url(#ag4-soft)">
    <rect x="50" y="200" width="166" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="342" y="132" width="216" height="56" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="342" y="212" width="216" height="56" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="342" y="292" width="216" height="56" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

    <rect x="670" y="200" width="166" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="902" y="196" width="144" height="88" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="1112" y="132" width="96" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="1112" y="212" width="96" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="1112" y="292" width="96" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="133" y="247" font-size="20" fill="#0F172A" text-anchor="middle">Mobile app</text>
  <text x="450" y="167" font-size="20" fill="#991B1B" text-anchor="middle">User service</text>
  <text x="450" y="247" font-size="20" fill="#991B1B" text-anchor="middle">Order service</text>
  <text x="450" y="327" font-size="20" fill="#991B1B" text-anchor="middle">Recommendations</text>

  <text x="753" y="247" font-size="20" fill="#0F172A" text-anchor="middle">Mobile app</text>
  <text x="974" y="234" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Gateway</text>
  <text x="974" y="262" font-size="20" fill="#7C3AED" text-anchor="middle">combines</text>
  <text x="1160" y="167" font-size="20" fill="#065F46" text-anchor="middle">User</text>
  <text x="1160" y="247" font-size="20" fill="#065F46" text-anchor="middle">Order</text>
  <text x="1160" y="327" font-size="20" fill="#065F46" text-anchor="middle">Recs</text>

  <text x="310" y="392" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Three calls, and the client stitches them</text>
  <text x="930" y="392" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">One call, and one unified response</text>
</svg>