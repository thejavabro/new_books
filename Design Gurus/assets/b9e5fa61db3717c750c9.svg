<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="938" viewBox="0 0 1240 938" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three read anomalies as two-transaction timelines: a dirty read of an uncommitted change that is rolled back, a non-repeatable read where the same row changes, and a phantom read where a new row appears in the same query">
  <rect x="0" y="0" width="1240" height="938" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The three anomalies that isolation levels exist to forbid</text>

  
  <rect x="40" y="76" width="1160" height="224" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#B91C1C">Dirty read: T1 reads a change that is later rolled back</text>

  <text x="100" y="177" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">T1</text>
  <text x="100" y="249" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">T2</text>

  <rect x="415" y="140" width="230" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="530" y="166" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">reads $150</text>
  <text x="530" y="190" font-size="20" fill="#B91C1C" text-anchor="middle">the dirty read</text>

  <rect x="165" y="212" width="230" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="280" y="238" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">writes $150</text>
  <text x="280" y="262" font-size="20" fill="#92400E" text-anchor="middle">not committed yet</text>

  <rect x="665" y="212" width="230" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="780" y="238" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">ROLLBACK</text>
  <text x="780" y="262" font-size="20" fill="#B91C1C" text-anchor="middle">the $150 is gone</text>

  <rect x="925" y="140" width="230" height="132" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1040" y="180" font-size="20" fill="#B91C1C" text-anchor="middle">T1 acted on a</text>
  <text x="1040" y="206" font-size="20" fill="#B91C1C" text-anchor="middle">value that never</text>
  <text x="1040" y="232" font-size="20" fill="#B91C1C" text-anchor="middle">officially existed</text>

  
  <rect x="40" y="320" width="1160" height="224" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="354" font-size="20" font-weight="600" fill="#92400E">Non-repeatable read: the same row, read twice, two answers</text>

  <text x="100" y="421" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">T1</text>
  <text x="100" y="493" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">T2</text>

  <rect x="165" y="384" width="230" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="280" y="410" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">reads balance</text>
  <text x="280" y="434" font-size="20" fill="#1E40AF" text-anchor="middle">$100</text>

  <rect x="665" y="384" width="230" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="780" y="410" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">reads it again</text>
  <text x="780" y="434" font-size="20" fill="#B91C1C" text-anchor="middle">$150</text>

  <rect x="415" y="456" width="230" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="530" y="482" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">sets $150</text>
  <text x="530" y="506" font-size="20" fill="#92400E" text-anchor="middle">and commits</text>

  <rect x="925" y="384" width="230" height="132" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1040" y="424" font-size="20" fill="#B91C1C" text-anchor="middle">The same row</text>
  <text x="1040" y="450" font-size="20" fill="#B91C1C" text-anchor="middle">changed under</text>
  <text x="1040" y="476" font-size="20" fill="#B91C1C" text-anchor="middle">one transaction</text>

  
  <rect x="40" y="564" width="1160" height="224" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="598" font-size="20" font-weight="600" fill="#5B21B6">Phantom read: the same query, run twice, a new row appears</text>

  <text x="100" y="665" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">T1</text>
  <text x="100" y="737" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">T2</text>

  <rect x="165" y="628" width="230" height="60" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="280" y="654" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">counts Electronics</text>
  <text x="280" y="678" font-size="20" fill="#1E40AF" text-anchor="middle">5 rows</text>

  <rect x="665" y="628" width="230" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="780" y="654" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">counts again</text>
  <text x="780" y="678" font-size="20" fill="#B91C1C" text-anchor="middle">6 rows</text>

  <rect x="415" y="700" width="230" height="60" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="530" y="726" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">inserts a 6th</text>
  <text x="530" y="750" font-size="20" fill="#92400E" text-anchor="middle">and commits</text>

  <rect x="925" y="628" width="230" height="132" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1040" y="668" font-size="20" fill="#B91C1C" text-anchor="middle">A row appeared</text>
  <text x="1040" y="694" font-size="20" fill="#B91C1C" text-anchor="middle">inside a single</text>
  <text x="1040" y="720" font-size="20" fill="#B91C1C" text-anchor="middle">transaction</text>

  
  <rect x="40" y="816" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="852" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Each isolation level is defined by which of these three it forbids.</text>
  <text x="620" y="882" font-size="20" fill="#334155" text-anchor="middle">None of them is a bug. Each is behaviour the database is allowed to have at that level.</text>
</svg>