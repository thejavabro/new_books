  <g transform="translate(91.56,692.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a5 5 0 0 1 3.5 4.8V20"/></g>
  <text x="128" y="710" font-size="21.5" font-weight="600" fill="#111827">New or experimental projects</text>
  <g filter="url(#m15p-soft)">
    <rect x="64" y="824" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="824" width="6" height="70" fill="#059669" clip-path="url(#m15p-k5)"/>
  </g>
  <circle cx="102" cy="859" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,848.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="128" y="866" font-size="21.5" font-weight="600" fill="#111827">APIs with variable or low traffic</text>
  <g filter="url(#m15p-soft)">
    <rect x="664" y="200" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="200" width="6" height="70" fill="#DB2777" clip-path="url(#m15p-k6)"/>
  </g>
  <circle cx="702" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,224.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="728" y="242" font-size="21.5" font-weight="600" fill="#111827">Long-running or heavy compute jobs</text>
  <g filter="url(#m15p-soft)">
    <rect x="664" y="356" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="356" width="6" height="70" fill="#DB2777" clip-path="url(#m15p-k7)"/>
  </g>
  <circle cx="702" cy="391" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,380.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="728" y="398" font-size="21.5" font-weight="600" fill="#111827">Stateful applications</text>
  <g filter="url(#m15p-soft)">
    <rect x="664" y="512" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="512" width="6" height="70" fill="#DB2777" clip-path="url(#m15p-k8)"/>
  </g>
  <circle cx="702" cy="547" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,536.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="728" y="554" font-size="21.5" font-weight="600" fill="#111827">Strict latency requirements</text>
  <g filter="url(#m15p-soft)">
    <rect x="664" y="668" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="668" width="6" height="70" fill="#DB2777" clip-path="url(#m15p-k9)"/>
  </g>
  <circle cx="702" cy="703" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,692.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="728" y="710" font-size="21.5" font-weight="600" fill="#111827">Steady, high-throughput services</text>
  <g filter="url(#m15p-soft)">
    <rect x="664" y="824" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="824" width="6" height="70" fill="#DB2777" clip-path="url(#m15p-k10)"/>
  </g>
  <circle cx="702" cy="859" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,848.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="728" y="866" font-size="21.5" font-weight="600" fill="#111827">Strict portability requirements</text>
  <g filter="url(#m15p-soft)">
    <rect x="64" y="980" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="980" width="6" height="70" fill="#059669" clip-path="url(#m15p-k11)"/>
  </g>
  <circle cx="102" cy="1015" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,1004.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="1022" font-size="21.5" font-weight="600" fill="#111827">Integration between managed services</text>
  <text x="320" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">Handle events like file uploads, queue messages,</text>
  <text x="320" y="326" font-size="18.5" text-anchor="middle" fill="#6B7280">or webhooks.</text>
  <text x="320" y="455" font-size="18.5" text-anchor="middle" fill="#6B7280">Good for workloads with spiky</text>
  <text x="320" y="482" font-size="18.5" text-anchor="middle" fill="#6B7280">or seasonal traffic.</text>
  <text x="320" y="611" font-size="18.5" text-anchor="middle" fill="#6B7280">Background jobs, data processing, or scheduled</text>
  <text x="320" y="638" font-size="18.5" text-anchor="middle" fill="#6B7280">tasks that complete quickly.</text>
  <text x="320" y="767" font-size="18.5" text-anchor="middle" fill="#6B7280">Start quickly without managing</text>
  <text x="320" y="794" font-size="18.5" text-anchor="middle" fill="#6B7280">infrastructure.</text>
  <text x="320" y="923" font-size="18.5" text-anchor="middle" fill="#6B7280">APIs whose traffic is low or changes a lot,</text>
  <text x="320" y="950" font-size="18.5" text-anchor="middle" fill="#6B7280">so idle time costs nothing.</text>
  <text x="320" y="1079" font-size="18.5" text-anchor="middle" fill="#6B7280">Custom logic that connects one managed</text>
  <text x="320" y="1106" font-size="18.5" text-anchor="middle" fill="#6B7280">service to another.</text>
  <text x="920" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">Jobs that need more time or memory</text>
  <text x="920" y="326" font-size="18.5" text-anchor="middle" fill="#6B7280">than the execution limits allow.</text>
  <text x="920" y="455" font-size="18.5" text-anchor="middle" fill="#6B7280">Applications that need in-memory state</text>
  <text x="920" y="482" font-size="18.5" text-anchor="middle" fill="#6B7280">or persistent connections.</text>
  <text x="920" y="611" font-size="18.5" text-anchor="middle" fill="#6B7280">Latency-critical paths that cannot tolerate cold</text>
  <text x="920" y="638" font-size="18.5" text-anchor="middle" fill="#6B7280">starts without paying for provisioned concurrency.</text>
  <text x="920" y="767" font-size="18.5" text-anchor="middle" fill="#6B7280">Provisioned capacity is cheaper when</text>
  <text x="920" y="794" font-size="18.5" text-anchor="middle" fill="#6B7280">load is high and constant.</text>
  <text x="920" y="923" font-size="18.5" text-anchor="middle" fill="#6B7280">Systems whose portability needs outweigh</text>
  <text x="920" y="950" font-size="18.5" text-anchor="middle" fill="#6B7280">the operational savings.</text>




</svg>