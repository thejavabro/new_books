<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1176" viewBox="0 0 1240 1176" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Good fit for serverless: event-driven workloads, variable or unpredictable traffic, short-lived tasks, new or experimental projects, APIs with variable or low traffic, and integration logic between managed services. Not ideal for serverless: long-running or heavy compute jobs beyond the execution limits, stateful applications, strict latency requirements unless you pay for provisioned concurrency, steady high-throughput services where provisioned capacity is cheaper, and systems with strict portability requirements">
