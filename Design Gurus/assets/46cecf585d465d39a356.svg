  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When to use serverless architecture</text>


  <rect x="40" y="120" width="560" height="1016" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Good fit for serverless</text>
