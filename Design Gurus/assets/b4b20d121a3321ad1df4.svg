<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Input data of a defined type flows into a filter, which applies a single, well-defined transformation and produces output data of a defined type">
  <defs>
    <filter id="m08b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m08b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m08b-k1"><rect x="64" y="180" width="292" height="90" rx="12"/></clipPath>
    <clipPath id="m08b-k2"><rect x="474" y="180" width="292" height="90" rx="12"/></clipPath>
    <clipPath id="m08b-k3"><rect x="884" y="180" width="292" height="90" rx="12"/></clipPath>
    <marker id="m08b-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="400" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Anatomy of a filter: input, transformation, output</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A filter reads input of a defined type, applies one operation, and writes output of a defined type.</text>

  <rect x="40" y="120" width="340" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Input</text>
  <rect x="450" y="120" width="340" height="240" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="474" y="150" font-size="19.5" font-weight="600" fill="#4338CA">Filter</text>
  <rect x="860" y="120" width="340" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="884" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Output</text>

  <g fill="none" stroke-width="2">
    <path d="M356,225 H474" stroke="#64748B" marker-end="url(#m08b-m-slate)"/>
    <path d="M766,225 H884" stroke="#64748B" marker-end="url(#m08b-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m08b-soft)">
    <rect x="64" y="180" width="292" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#m08b-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Input data</text>
  <text x="210" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">defined type</text>
  <g filter="url(#m08b-lift)">
    <rect x="474" y="180" width="292" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="474" y="180" width="9" height="90" fill="#4F46E5" clip-path="url(#m08b-k2)"/>
  </g>
  <circle cx="512" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(501.56,214.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="538" y="232" font-size="21.5" font-weight="600" fill="#111827">Transformation</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">apply a single,</text>
  <text x="620" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">well-defined operation</text>
  <g filter="url(#m08b-soft)">
    <rect x="884" y="180" width="292" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="884" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#m08b-k3)"/>
  </g>
  <circle cx="922" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(911.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="948" y="232" font-size="21.5" font-weight="600" fill="#111827">Output data</text>
  <text x="1030" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">defined type</text>




</svg>