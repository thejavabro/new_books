<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="798" viewBox="0 0 1240 798" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cols-title cols-desc">
<title id="cols-title">The two columns</title>
<desc id="cols-desc">The container fleet costs about $326 a month and the functions about $610, at three hundred million requests with a peak four times the mean.</desc>
<defs>
<marker id="cols-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="cols-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="cols-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="cols-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="798" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The two columns</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The container fleet costs about $326 a month and the functions about $610.</text>
<rect x="40" y="720" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="720" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="78" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="60" y="150.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">mean = 300M / 2.6M seconds = 116 req/sec, so peak = 463 req/sec</text><text x="60" y="175.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">463 / 150 = 3.1, so 4, plus one for failure = 5, rounded to 6 over three zones</text>
<rect x="40" y="210" width="560" height="310" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 210H46A6 6 0 0 0 40 216V514A6 6 0 0 0 46 520H54Z" fill="#5EC9EC"/><text x="70" y="246" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">A: container fleet</text>
<rect x="64" y="268" width="512" height="40" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="82" y="295" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">committed baseline</text>
<text x="496" y="295" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">3 x $0.10 x 730 x 0.40</text>
<text x="558" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$88</text>
<rect x="64" y="314" width="512" height="40" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="82" y="341" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">on-demand variable</text>
<text x="496" y="341" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">1.5 x $0.10 x 730</text>
<text x="558" y="341" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$110</text>
<rect x="64" y="360" width="512" height="40" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="82" y="387" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">load balancer</text>
<text x="558" y="387" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$30</text>
<rect x="64" y="406" width="512" height="40" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="82" y="433" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">subnet gateways</text>
<text x="496" y="433" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">$0.045 x 730 x 3</text>
<text x="558" y="433" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$99</text>
<rect x="64" y="456" width="512" height="42" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="80" y="484" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">total</text><text x="560" y="484" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$326 / month</text>
<rect x="640" y="210" width="560" height="310" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 210H646A6 6 0 0 0 640 216V514A6 6 0 0 0 646 520H654Z" fill="#F3CF6A"/><text x="670" y="246" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">B: functions</text>
<rect x="664" y="268" width="512" height="40" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="682" y="295" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">function requests</text>
<text x="1096" y="295" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">300 x $0.20</text>
<text x="1158" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$60</text>
<rect x="664" y="314" width="512" height="40" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="682" y="341" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">function duration</text>
<text x="1096" y="341" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">15M GB-s x $0.0000167</text>
<text x="1158" y="341" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$250</text>
<rect x="664" y="360" width="512" height="40" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="682" y="387" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">API gateway, HTTP</text>
<text x="1096" y="387" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">300 x $1.00</text>
<text x="1158" y="387" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$300</text>
<rect x="664" y="406" width="512" height="40" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="682" y="433" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">nothing idle</text>
<text x="1158" y="433" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$0</text>
<rect x="664" y="456" width="512" height="42" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="680" y="484" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">total</text><text x="1160" y="484" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$610 / month</text>
<rect x="40" y="540" width="1160" height="58" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="58" rx="2.5" fill="#39D5AA"/><text x="64" y="575" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The container fleet is cheaper, by about $284 a month.</text>
<rect x="40" y="616" width="1160" height="78" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="616" width="5" height="78" rx="2.5" fill="#AC8BE8"/><text x="64" y="646.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The serverless pitch is that you stop paying for idle, and you do.</text><text x="64" y="675.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Idle was simply not where the money was.</text>
<text x="66" y="754" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The capacity arithmetic is the only assumption in column A doing real work.</text>
</svg>