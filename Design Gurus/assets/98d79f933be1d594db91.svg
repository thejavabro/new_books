      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cn2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cn2-k1"><rect x="470" y="130" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cn2-k2"><rect x="64" y="390" width="250" height="90" rx="12"/></clipPath>
