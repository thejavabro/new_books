<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The origin server holds the original content. A PoP in Paris and a PoP in Tokyo each hold two edge servers, which keep cached copies of the content close to the users in those regions.">
