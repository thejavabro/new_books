  <text x="718" y="442" font-size="21.5" font-weight="600" fill="#111827">Edge server 1</text>
  <text x="779" y="509" font-size="18.5" text-anchor="middle" fill="#6B7280">cached copies</text>
  <g filter="url(#cn2-soft)">
