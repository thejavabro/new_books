  <rect x="64" y="645" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Origin server</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">the website's own server, where the original content is stored</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">PoP</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">a data center where the CDN places a group of edge servers</text>
