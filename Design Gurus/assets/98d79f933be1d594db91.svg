  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Origin server, PoPs, and edge servers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A PoP is a place. It holds several edge servers with cached copies near users.</text>

  <rect x="40" y="320" width="570" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="350" font-size="19.5" font-weight="600" fill="#047857">PoP in Paris</text>
