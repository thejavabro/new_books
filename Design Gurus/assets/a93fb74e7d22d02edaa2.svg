<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1555" viewBox="0 0 1240 1555" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Input data flows into queue 1, which feeds the single worker of stage 1. It writes into queue 2, which feeds the single worker of stage 2. It writes into queue 3, which feeds workers 1 to 4 of stage 3, the stage that waits on I/O. They write into queue 4, which feeds the single worker of stage 4, and that worker writes the output data">
