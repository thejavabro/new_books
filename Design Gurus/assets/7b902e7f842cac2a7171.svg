<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="726" viewBox="0 0 1240 726" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="affordable-title affordable-desc">
<title id="affordable-title">The version that is affordable</title>
<desc id="affordable-desc">The underlying idea is much smaller than the reputation. It does not require randomness, a platform team, or production.</desc>
<defs>
<marker id="affordable-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="affordable-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="affordable-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="affordable-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="726" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The version that is affordable</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The underlying idea is much smaller than the reputation.</text>
<rect x="40" y="648" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="648" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="88" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="88" rx="2.5" fill="#AC8BE8"/><text x="64" y="153.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Every resilience mechanism you have is a hypothesis</text><text x="64" y="182.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">until somebody has observed it working.</text>
<rect x="40" y="226" width="284" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="182" y="260" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the timeout</text>
<rect x="332" y="226" width="284" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="474" y="260" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the fallback</text>
<rect x="624" y="226" width="284" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="766" y="260" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the retry budget</text>
<rect x="916" y="226" width="284" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1058" y="260" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the degraded mode</text>
<text x="620" y="312" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">each written against an imagined failure, and none has met a real one</text>
<rect x="40" y="332" width="1160" height="84" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="332" width="5" height="84" rx="2.5" fill="#39D5AA"/><text x="64" y="366.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">The comparison is not between injecting failure and having a stable system.</text><text x="64" y="393.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">It is between finding out on a Tuesday and finding out during an incident.</text>
<rect x="40" y="436" width="560" height="70" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="463.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A test asks whether the code does</text><text x="320" y="490.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what it was written to do</text>
<rect x="640" y="436" width="560" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="463.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">This asks whether the system does</text><text x="920" y="490.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what you believe it does</text>
<text x="40" y="544" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Four properties, none of which need a tool</text>
<rect x="40" y="562" width="284" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="182" y="598" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A hypothesis, before</text>
<rect x="332" y="562" width="284" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="474" y="598" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A small chosen failure</text>
<rect x="624" y="562" width="284" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="766" y="598" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An observation</text>
<rect x="916" y="562" width="284" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1058" y="598" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A way to stop</text>
<text x="66" y="682" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The second question is different from the first, and usually has a more surprising answer.</text>
</svg>