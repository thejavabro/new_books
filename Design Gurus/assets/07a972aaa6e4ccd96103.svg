<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="636" viewBox="0 0 1240 636" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three booking requests and an empty calendar">
<defs>
<filter id="cl-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="636" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which of these three bookings can the calendar accept?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A booking is refused only if it overlaps one already accepted, and touching ends do not overlap</text>
<rect x="40" y="106" width="1160" height="384" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The calendar is empty, and the three requests are handled in the order given</text>
<text x="349" y="206" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">requests</text>
<rect x="371" y="168" width="150" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="446" y="205.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10 to 20</text>
<text x="446" y="250" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="545" y="168" width="150" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="205.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">15 to 25</text>
<text x="620" y="250" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="719" y="168" width="150" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="794" y="205.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">20 to 30</text>
<text x="794" y="250" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<path d="M120,444 L1140,444" stroke="#CBD5E1" stroke-width="2"/>
<path d="M120,444 L120,452" stroke="#CBD5E1" stroke-width="2"/>
<text x="120" y="470" text-anchor="middle" font-size="16.5" fill="#475569">5</text>
<path d="M309,444 L309,452" stroke="#CBD5E1" stroke-width="2"/>
<text x="309" y="470" text-anchor="middle" font-size="16.5" fill="#475569">10</text>
<path d="M498,444 L498,452" stroke="#CBD5E1" stroke-width="2"/>
<text x="498" y="470" text-anchor="middle" font-size="16.5" fill="#475569">15</text>
<path d="M687,444 L687,452" stroke="#CBD5E1" stroke-width="2"/>
<text x="687" y="470" text-anchor="middle" font-size="16.5" fill="#475569">20</text>
<path d="M876,444 L876,452" stroke="#CBD5E1" stroke-width="2"/>
<text x="876" y="470" text-anchor="middle" font-size="16.5" fill="#475569">25</text>
<path d="M1064,444 L1064,452" stroke="#CBD5E1" stroke-width="2"/>
<text x="1064" y="470" text-anchor="middle" font-size="16.5" fill="#475569">30</text>
<text x="98" y="450" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">time</text>
<text x="98" y="349" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">booked</text>
<text x="126" y="349" font-size="18" fill="#475569">nothing booked yet</text>
<text x="620" y="288" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">The bookings are kept in order of start time, so only the two nearest neighbours can clash</text>
<rect x="40" y="512" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="552" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Everything that could clash with a new booking is next to it in the order</text>
<text x="620" y="584" text-anchor="middle" font-size="18.5" fill="#475569">That is why the check costs two comparisons instead of one per existing booking</text>
</svg>