<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four steps of object oriented analysis and design">
  <defs>
    <marker id="ooad-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ooad-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ooad-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ooad-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="ooad-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ooad-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="ooad-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="ooad-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="ooad-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="ooad-s0"><rect x="44" y="78" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="ooad-t0"><rect x="570" y="78" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="ooad-s1"><rect x="44" y="166" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="ooad-t1"><rect x="570" y="166" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="ooad-s2"><rect x="44" y="254" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="ooad-t2"><rect x="570" y="254" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="ooad-s3"><rect x="44" y="342" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="ooad-t3"><rect x="570" y="342" width="626" height="64" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <text x="44" y="56" font-size="16.5" fill="#6B7280" font-weight="600">The step</text>
  <text x="570" y="56" font-size="16.5" fill="#6B7280" font-weight="600">What exists when it is done</text>
  <g filter="url(#ooad-soft)">
    <rect x="44" y="78" width="470" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="78" width="6" height="64" fill="#64748B" clip-path="url(#ooad-s0)"/>
  </g>
  <circle cx="82" cy="110.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="116.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">1</text>
  <text x="112" y="116.5" font-size="18.5" font-weight="600" fill="#111827">Find the objects</text>
  <g filter="url(#ooad-soft)">
    <rect x="570" y="78" width="626" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="570" y="78" width="6" height="64" fill="#64748B" clip-path="url(#ooad-t0)"/>
  </g>
  <text x="592" y="116.5" font-size="18.5" font-weight="600" fill="#111827">a list of things that hold data or do work</text>
  <path d="M514,110 L570,110" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ooad-arrow-slate)"/>
  <g filter="url(#ooad-soft)">
    <rect x="44" y="166" width="470" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="44" y="166" width="6" height="64" fill="#2563EB" clip-path="url(#ooad-s1)"/>
  </g>
  <circle cx="82" cy="198.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="204.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">2</text>
  <text x="112" y="204.5" font-size="18.5" font-weight="600" fill="#111827">Define the relationships</text>
  <g filter="url(#ooad-soft)">
    <rect x="570" y="166" width="626" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="570" y="166" width="6" height="64" fill="#2563EB" clip-path="url(#ooad-t1)"/>
  </g>
  <text x="592" y="204.5" font-size="18.5" font-weight="600" fill="#111827">which object holds, owns or extends which</text>
  <path d="M514,198 L570,198" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ooad-arrow-blue)"/>
  <g filter="url(#ooad-soft)">
    <rect x="44" y="254" width="470" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="44" y="254" width="6" height="64" fill="#7C3AED" clip-path="url(#ooad-s2)"/>
  </g>
  <circle cx="82" cy="286.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="292.5" font-size="17" font-weight="700" text-anchor="middle" fill="#7C3AED">3</text>
  <text x="112" y="292.5" font-size="18.5" font-weight="600" fill="#111827">Establish each interface</text>
  <g filter="url(#ooad-soft)">
    <rect x="570" y="254" width="626" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="570" y="254" width="6" height="64" fill="#7C3AED" clip-path="url(#ooad-t2)"/>
  </g>
  <text x="592" y="292.5" font-size="18.5" font-weight="600" fill="#111827">the operations each object offers to others</text>
  <path d="M514,286 L570,286" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#ooad-arrow-violet)"/>
  <g filter="url(#ooad-soft)">
    <rect x="44" y="342" width="470" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="44" y="342" width="6" height="64" fill="#059669" clip-path="url(#ooad-s3)"/>
  </g>
  <circle cx="82" cy="374.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="380.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">4</text>
  <text x="112" y="380.5" font-size="18.5" font-weight="600" fill="#111827">Make the design</text>
  <g filter="url(#ooad-soft)">
    <rect x="570" y="342" width="626" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="570" y="342" width="6" height="64" fill="#059669" clip-path="url(#ooad-t3)"/>
  </g>
  <text x="592" y="380.5" font-size="18.5" font-weight="600" fill="#111827">a class diagram you can turn into code</text>
  <path d="M514,374 L570,374" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ooad-arrow-emerald)"/>
  <text x="620" y="470" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">Steps 1 and 2 are analysis: what the system is. Steps 3 and 4 are design: how it will work.</text>
</svg>