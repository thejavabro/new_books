<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The heap after all the pushes">
<defs>
<filter id="fq-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="590" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">After pushing 1, 2, 3, 2, 1, 2, 5, what do three pops return?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Each push records the value together with how many copies existed at that moment</text>
<rect x="40" y="106" width="1160" height="332" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Heap contents, most frequent first, and later pushes win a tie</text>
<text x="303" y="202" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">pushed</text>
<rect x="325" y="166" width="74" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="362" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="362" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">#0</text>
<rect x="411" y="166" width="74" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="448" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="448" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">#1</text>
<rect x="497" y="166" width="74" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="534" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="534" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">#2</text>
<rect x="583" y="166" width="74" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="620" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">#3</text>
<rect x="669" y="166" width="74" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="706" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="706" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">#4</text>
<rect x="755" y="166" width="74" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="792" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="792" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">#5</text>
<rect x="841" y="166" width="74" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="878" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="878" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">#6</text>
<text x="226" y="304" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<rect x="248" y="268" width="96" height="56" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="296" y="302.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">2</text>
<text x="296" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">3x, #5</text>
<rect x="356" y="268" width="96" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="404" y="302.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">1</text>
<text x="404" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">2x, #4</text>
<rect x="464" y="268" width="96" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="512" y="302.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">2</text>
<text x="512" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">2x, #3</text>
<rect x="572" y="268" width="96" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="302.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">5</text>
<text x="620" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1x, #6</text>
<rect x="680" y="268" width="96" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="728" y="302.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">3</text>
<text x="728" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1x, #2</text>
<rect x="788" y="268" width="96" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="836" y="302.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">2</text>
<text x="836" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1x, #1</text>
<rect x="896" y="268" width="96" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="944" y="302.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">1</text>
<text x="944" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">1x, #0</text>
<text x="460" y="406" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">popped</text>
<rect x="482" y="370" width="84" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="524" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="578" y="370" width="84" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="674" y="370" width="84" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="716" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="40" y="460" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="500" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Every push stores its own count, so the heap holds one entry per push</text>
<text x="620" y="532" text-anchor="middle" font-size="18.5" fill="#475569">That is what lets a pop find the most frequent value without recounting anything</text>
</svg>