<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A request reaches the edge server in Paris. If the content is cached, the edge server serves it immediately. If not, it fetches the content from the origin in New York, caches a copy, and serves it.">
  <defs>
    <filter id="cn3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cn3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cn3-k1"><rect x="40" y="290" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="cn3-k2"><rect x="470" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cn3-k3"><rect x="470" y="440" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cn3-k4"><rect x="900" y="440" width="300" height="90" rx="12"/></clipPath>
    <marker id="cn3-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cn3-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cn3-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How an edge server serves a request</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The first request in a region may go to the origin. Later requests are served from the cache.</text>



  <g fill="none" stroke-width="2">
    <path d="M320,315 H400 Q415,315 415,300 V200 Q415,185 430,185 H470" stroke="#059669" marker-end="url(#cn3-m-emerald)"/>
    <path d="M320,355 H400 Q415,355 415,370 V470 Q415,485 430,485 H470" stroke="#D97706" marker-end="url(#cn3-m-amber)"/>
    <path d="M770,485 H900" stroke="#2563EB" marker-end="url(#cn3-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="360" y="245" fill="#047857">cached</text>
    <text x="360" y="440" fill="#B45309">not cached</text>
  </g>

  <g filter="url(#cn3-soft)">
    <rect x="40" y="290" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#cn3-k1)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">Paris edge server</text>
  <g filter="url(#cn3-lift)">
    <rect x="470" y="140" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="470" y="140" width="9" height="90" fill="#059669" clip-path="url(#cn3-k2)"/>
  </g>
  <circle cx="508" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="534" y="192" font-size="21.5" font-weight="600" fill="#111827">Serve from cache</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fast, no trip to the origin</text>
  <g filter="url(#cn3-soft)">
    <rect x="470" y="440" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="470" y="440" width="6" height="90" fill="#D97706" clip-path="url(#cn3-k3)"/>
  </g>
  <circle cx="508" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,474.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="534" y="492" font-size="21.5" font-weight="600" fill="#111827">Fetch from origin</text>
  <text x="620" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">from New York</text>
  <g filter="url(#cn3-soft)">
    <rect x="900" y="440" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#cn3-k4)"/>
  </g>
  <circle cx="938" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="964" y="492" font-size="21.5" font-weight="600" fill="#111827">Cache and serve</text>
  <text x="1050" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">the next request is a hit</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Cache hit</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">the edge server already has the content, so it answers immediately</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Cache miss</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">the edge server fetches from the origin, then keeps a copy</text>
</svg>