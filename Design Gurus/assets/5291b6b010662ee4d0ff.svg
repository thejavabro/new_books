<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Event-driven: one publish fans out to every subscriber the moment it happens. Polling: each consumer asks on a timer, and most answers are empty">
  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>
  <defs>
    <marker id="mc8-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="mc8-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="mc8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="490" rx="14" fill="#FFFBEB" fill-opacity="0.35" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Event-driven: the source announces</text>

  <rect x="640" y="76" width="580" height="490" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Polling: each consumer checks</text>

  
  <line x1="310" y1="170" x2="310" y2="204" stroke="#D97706" stroke-width="2.5" marker-end="url(#mc8-amber)"/>
  <line x1="250" y1="288" x2="140" y2="346" stroke="#D97706" stroke-width="2" marker-end="url(#mc8-amber)"/>
  <line x1="310" y1="292" x2="310" y2="346" stroke="#D97706" stroke-width="2" marker-end="url(#mc8-amber)"/>
  <line x1="370" y1="288" x2="480" y2="346" stroke="#D97706" stroke-width="2" marker-end="url(#mc8-amber)"/>

  <g filter="url(#mc8-soft)">
    <rect x="120" y="110" width="380" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="150" y="208" width="320" height="84" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="60" y="350" width="160" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="230" y="350" width="160" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="400" y="350" width="160" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="310" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Order service publishes OrderPlaced</text>
  <text x="310" y="242" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Broker</text>
  <text x="310" y="272" font-size="20" fill="#92400E" text-anchor="middle">delivers to every subscriber</text>
  <text x="140" y="382" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Warehouse</text>
  <text x="140" y="410" font-size="20" fill="#64748B" text-anchor="middle">at once</text>
  <text x="310" y="382" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Email</text>
  <text x="310" y="410" font-size="20" fill="#64748B" text-anchor="middle">at once</text>
  <text x="480" y="382" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Analytics</text>
  <text x="480" y="410" font-size="20" fill="#64748B" text-anchor="middle">at once</text>

  <text x="310" y="474" font-size="20" fill="#64748B" text-anchor="middle">A fourth consumer subscribes without any</text>
  <text x="310" y="502" font-size="20" fill="#64748B" text-anchor="middle">change to the order service.</text>
  <text x="310" y="542" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Immediate and loosely coupled, with a broker to run</text>

  
  <line x1="750" y1="346" x2="870" y2="292" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc8-blue)"/>
  <line x1="930" y1="346" x2="930" y2="292" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc8-blue)"/>
  <line x1="1110" y1="346" x2="990" y2="292" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc8-blue)"/>

  <g filter="url(#mc8-soft)">
    <rect x="740" y="110" width="380" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="790" y="208" width="280" height="84" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="670" y="350" width="160" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="850" y="350" width="160" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="1030" y="350" width="160" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="930" y="148" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Order service just writes to its table</text>
  <text x="930" y="242" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Orders table</text>
  <text x="930" y="272" font-size="20" fill="#1E40AF" text-anchor="middle">answers whoever asks</text>
  <text x="750" y="382" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Warehouse</text>
  <text x="750" y="410" font-size="20" fill="#64748B" text-anchor="middle">every minute</text>
  <text x="930" y="382" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Email</text>
  <text x="930" y="410" font-size="20" fill="#64748B" text-anchor="middle">every minute</text>
  <text x="1110" y="382" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Analytics</text>
  <text x="1110" y="410" font-size="20" fill="#64748B" text-anchor="middle">every minute</text>

  <text x="930" y="474" font-size="20" fill="#64748B" text-anchor="middle">Most checks find nothing, and each new</text>
  <text x="930" y="502" font-size="20" fill="#64748B" text-anchor="middle">consumer adds load to the same table.</text>
  <text x="930" y="542" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Simple and predictable, and always a little late</text>

  
  <text x="620" y="642" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Size the answer to how fast you must react, how often things change, and how many consumers there are.</text>
</svg>