<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="notgiven-title notgiven-desc">
<title id="notgiven-title">What Raft does not give you</title>
<desc id="notgiven-desc">Not availability during a loss of quorum, not linearizable reads without extra work, not exactly-once client commands, and not throughput. The guarantees are easy to recite and their boundaries are where candidates separate.</desc>
<defs>
<marker id="notgiven-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="notgiven-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="notgiven-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="notgiven-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="690" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What Raft does not give you</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The guarantees are easy to recite and their boundaries are where candidates separate.</text>
<rect x="40" y="612" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="612" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V276A6 6 0 0 0 46 282H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Availability without a majority</text>
<rect x="72" y="174" width="496" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="199" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Lose a majority and writes stop until nodes</text><text x="92" y="224" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">return. That is the design, and anything</text><text x="92" y="249" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">depending on it inherits the choice.</text>
<rect x="640" y="118" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V276A6 6 0 0 0 646 282H654Z" fill="#F3CF6A"/><text x="670" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Correct reads for free</text>
<rect x="672" y="174" width="496" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="199" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A partitioned leader serves stale data. Reads</text><text x="692" y="224" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">need a quorum check or a deliberate clock</text><text x="692" y="249" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">assumption.</text>
<rect x="40" y="302" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 302H46A6 6 0 0 0 40 308V460A6 6 0 0 0 46 466H54Z" fill="#AC8BE8"/><text x="70" y="338" font-size="23" font-weight="700" fill="#6040A8" text-anchor="start">Exactly-once commands</text>
<rect x="72" y="358" width="496" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="383" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A client retry after a timeout can apply the</text><text x="92" y="408" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">command twice. Needs a client id, a sequence</text><text x="92" y="433" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">number and a dedup in the state machine.</text>
<rect x="640" y="302" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 302H646A6 6 0 0 0 640 308V460A6 6 0 0 0 646 466H654Z" fill="#5EC9EC"/><text x="670" y="338" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Throughput</text>
<rect x="672" y="358" width="496" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="383" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Every write is a majority round trip plus a</text><text x="692" y="408" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">durable write on each. It runs at the speed of</text><text x="692" y="433" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the slowest member of the fastest majority.</text>
<rect x="40" y="496" width="1160" height="90" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="496" width="5" height="90" rx="2.5" fill="#39D5AA"/><text x="64" y="532.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Raft gives you an agreed, ordered log across a majority.</text><text x="64" y="561.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Everything else is something you built on top, and its correctness is yours.</text>
<text x="66" y="646" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Attach the operational consequence to each guarantee, or the answer reads as recall.</text>
</svg>