<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="756" viewBox="0 0 1240 756" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="failures-title failures-desc">
<title id="failures-title">The failures that recur</title>
<desc id="failures-desc">Six predictable weaknesses across all three exercises. Knowing them in advance is worth more than any amount of technique.</desc>
<defs>
<marker id="failures-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="failures-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="failures-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="failures-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="756" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The failures that recur</text>
<text x="40" y="86" font-size="21" fill="#4A5568">These three exercises have been worked by enough people that the recurring failures are predictable.</text>
<rect x="40" y="678" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="678" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="510" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="295" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Designing the end state, skipping the path</text>
<path d="M556 148H580" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M556 148H580" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failures-marker-slate)"/>
<rect x="590" y="118" width="610" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">especially in the migration. The path is the hard part</text>
<rect x="40" y="188" width="510" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="295" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Treating the cost ceiling as decoration</text>
<path d="M556 218H580" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M556 218H580" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failures-marker-slate)"/>
<rect x="590" y="188" width="610" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="224" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the constraint is in the brief because it changes the answer</text>
<rect x="40" y="258" width="510" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="295" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Over-building for the team size</text>
<path d="M556 288H580" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M556 288H580" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failures-marker-slate)"/>
<rect x="590" y="258" width="610" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="281.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">five engineers is named for a reason. The most</text><text x="610" y="306.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">common wrong answer among strong candidates</text>
<rect x="40" y="328" width="510" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="295" y="364" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Exactness in the wrong place</text>
<path d="M556 358H580" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M556 358H580" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failures-marker-slate)"/>
<rect x="590" y="328" width="610" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="351.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">money needs it. The billing exercise is the one</text><text x="610" y="376.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">place the eventual-consistency instinct is wrong</text>
<rect x="40" y="398" width="510" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="295" y="434" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No statement of what breaks first</text>
<path d="M556 428H580" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M556 428H580" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failures-marker-slate)"/>
<rect x="590" y="398" width="610" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="421.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the clearest indicator that a design was</text><text x="610" y="446.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">drawn rather than analyzed</text>
<rect x="40" y="468" width="510" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="295" y="504" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A single answer per decision</text>
<path d="M556 498H580" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M556 498H580" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failures-marker-slate)"/>
<rect x="590" y="468" width="610" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="504" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most common and the easiest to fix</text>
<rect x="40" y="550" width="1160" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="550" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="580" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The last one is almost mechanical</text><text x="64" y="606" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Write the alternative next to each decision, with one clause on why you did not take it.</text><text x="64" y="632" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Doing that to an existing answer typically raises it a level with no new thinking required.</text>
<text x="66" y="712" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Which tells you how much of the score is presentation of thinking you already did.</text>
</svg>