<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1936" viewBox="0 0 1240 1936" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The failure decision cheat sheet: ten conditions grouped into three families and mapped to 400, 401, 403, private 404, 409, 410, 412, 429, a second 403 for exhausted capacity, and 5xx, each with the sentence that names the cost the caller accepts.">
