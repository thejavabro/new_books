    <clipPath id="p4a-s2"><rect x="896" y="319" width="268" height="90" rx="12"/></clipPath>
    <clipPath id="p4a-s3"><rect x="896" y="464" width="268" height="90" rx="12"/></clipPath>
    <clipPath id="p4a-s4"><rect x="896" y="609" width="268" height="90" rx="12"/></clipPath>
    <clipPath id="p4a-s5"><rect x="896" y="822" width="268" height="90" rx="12"/></clipPath>
    <clipPath id="p4a-s6"><rect x="896" y="967" width="268" height="90" rx="12"/></clipPath>
