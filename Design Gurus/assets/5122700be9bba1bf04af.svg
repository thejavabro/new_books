  </defs>

  <rect x="0" y="0" width="1240" height="1936" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Failure decision: one condition, one status, one sentence</text>
  <rect x="610" y="66" width="22" height="22" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <text x="642" y="77" font-size="15.5" fill="#6B7280">Condition</text>
  <rect x="742" y="66" width="22" height="22" rx="6" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.6"/>
  <text x="774" y="77" font-size="15.5" fill="#6B7280">Response</text>
  <text x="862" y="77" font-size="15.5" fill="#6B7280">"quoted gray line" is the interview sentence</text>

  
  <rect x="40" y="126" width="1160" height="624" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">Refused outright, before any state is touched</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#94A3B8">four conditions</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="174" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">Request cannot be parsed or violates input rules</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="174" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="174" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s1)"/>
  </g>
  <circle cx="928" cy="219" r="5" fill="#DB2777"/>
  <text x="952" y="226" font-size="18.5" font-weight="600" fill="#111827">400</text>
  <text x="104" y="289" font-size="15.5" fill="#6B7280">"Return 400; accept that the caller must correct the request before retrying."</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="319" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="319" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c2)"/>
  </g>
  <circle cx="114" cy="364" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,353.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="140" y="371" font-size="18.5" font-weight="600" fill="#111827">Authentication is missing or invalid</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="319" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="319" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s2)"/>
  </g>
  <circle cx="928" cy="364" r="5" fill="#DB2777"/>
  <text x="952" y="371" font-size="18.5" font-weight="600" fill="#111827">401</text>
  <text x="104" y="434" font-size="15.5" fill="#6B7280">"Return 401; accept a new authentication step before the operation can proceed."</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="464" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="464" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c3)"/>
  </g>
  <circle cx="114" cy="509" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,498.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="516" font-size="18.5" font-weight="600" fill="#111827">Caller is known but lacks authority</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="464" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="464" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s3)"/>
  </g>
  <circle cx="928" cy="509" r="5" fill="#DB2777"/>
  <text x="952" y="516" font-size="18.5" font-weight="600" fill="#111827">403</text>
  <text x="104" y="579" font-size="15.5" fill="#6B7280">"Return 403; accept that waiting or unchanged retry will not grant permission."</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="609" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="609" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c4)"/>
  </g>
  <circle cx="114" cy="654" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,643.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="661" font-size="18.5" font-weight="600" fill="#111827">Revealing existence would disclose another caller's private resource</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="609" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="609" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s4)"/>
  </g>
  <circle cx="928" cy="654" r="5" fill="#DB2777"/>
  <text x="952" y="661" font-size="18.5" font-weight="600" fill="#111827">private 404</text>
  <text x="104" y="724" font-size="15.5" fill="#6B7280">"Return private 404; accept less diagnostic detail in exchange for non-disclosure."</text>

  
  <rect x="40" y="774" width="1160" height="479" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="804" font-size="16.5" font-weight="600" fill="#475569">Blocked by the resource's current state</text>
  <text x="1176" y="804" text-anchor="end" font-size="15.5" fill="#94A3B8">three conditions</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="822" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="822" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c5)"/>
  </g>
  <circle cx="114" cy="867" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,856.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="874" font-size="18.5" font-weight="600" fill="#111827">Valid input conflicts with current product state</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="822" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="822" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s5)"/>
  </g>
  <circle cx="928" cy="867" r="5" fill="#DB2777"/>
  <text x="952" y="874" font-size="18.5" font-weight="600" fill="#111827">409</text>
  <text x="104" y="937" font-size="15.5" fill="#6B7280">"Return 409; accept a product-specific recovery such as choosing another slot or legal transition."</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="967" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="967" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c6)"/>
  </g>
  <circle cx="114" cy="1012" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1001.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="1019" font-size="18.5" font-weight="600" fill="#111827">A deliberately temporary resource passed its lifetime</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="967" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="967" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s6)"/>
  </g>
  <circle cx="928" cy="1012" r="5" fill="#DB2777"/>
  <text x="952" y="1019" font-size="18.5" font-weight="600" fill="#111827">410</text>
  <text x="104" y="1082" font-size="15.5" fill="#6B7280">"Return 410; accept that the caller must create a new temporary resource rather than resume."</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="1112" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1112" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c7)"/>
  </g>
  <circle cx="114" cy="1157" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="140" y="1164" font-size="18.5" font-weight="600" fill="#111827">If-Match or another explicit precondition is false</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="1112" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="1112" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s7)"/>
  </g>
  <circle cx="928" cy="1157" r="5" fill="#DB2777"/>
  <text x="952" y="1164" font-size="18.5" font-weight="600" fill="#111827">412</text>
  <text x="104" y="1227" font-size="15.5" fill="#6B7280">"Return 412; accept a read-refresh-decide round trip rather than silently losing work."</text>

  
  <rect x="40" y="1277" width="1160" height="479" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1307" font-size="16.5" font-weight="600" fill="#475569">Blocked by capacity, timing, or the service itself</text>
  <text x="1176" y="1307" text-anchor="end" font-size="15.5" fill="#94A3B8">three conditions</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="1325" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1325" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c8)"/>
  </g>
  <circle cx="114" cy="1370" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1359.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="1377" font-size="18.5" font-weight="600" fill="#111827">Waiting restores a time-based allowance</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="1325" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="1325" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s8)"/>
  </g>
  <circle cx="928" cy="1370" r="5" fill="#DB2777"/>
  <text x="952" y="1377" font-size="18.5" font-weight="600" fill="#111827">429</text>
  <text x="1030" y="1440" text-anchor="middle" font-size="15.5" fill="#94A3B8">with retry guidance</text>
  <text x="104" y="1440" font-size="15.5" fill="#6B7280">"Return 429; accept delayed completion while preserving the caller's ability to retry later."</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="1470" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1470" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c9)"/>
  </g>
  <circle cx="114" cy="1515" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1504.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="1522" font-size="18.5" font-weight="600" fill="#111827">Storage or spend capacity is exhausted and waiting does not help</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="1470" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="1470" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s9)"/>
  </g>
  <circle cx="928" cy="1515" r="5" fill="#DB2777"/>
  <text x="952" y="1522" font-size="18.5" font-weight="600" fill="#111827">403</text>
  <text x="1030" y="1585" text-anchor="middle" font-size="15.5" fill="#94A3B8">with measured details</text>
  <text x="104" y="1585" font-size="15.5" fill="#6B7280">"Return 403; accept that the caller must free capacity or change its entitlement."</text>

  
  <g filter="url(#p4a-soft)">
    <rect x="76" y="1615" width="790" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1615" width="6" height="90" fill="#D97706" clip-path="url(#p4a-c10)"/>
  </g>
  <circle cx="114" cy="1660" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1649.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="1667" font-size="18.5" font-weight="600" fill="#111827">Service is temporarily unavailable</text>
  <g filter="url(#p4a-soft)">
    <rect x="896" y="1615" width="268" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="1615" width="6" height="90" fill="#DB2777" clip-path="url(#p4a-s10)"/>
  </g>
  <circle cx="928" cy="1660" r="5" fill="#DB2777"/>
  <text x="952" y="1667" font-size="18.5" font-weight="600" fill="#111827">503</text>
  <text x="104" y="1730" font-size="15.5" fill="#6B7280">"Return 503; allow retries only when safe, with bounded attempts, backoff, and jitter."</text>

  
  <rect x="40" y="1796" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1838" text-anchor="middle" font-size="16" fill="#475569">One condition, one status, one sentence. Name the condition, choose the status, then say the sentence.</text>
  <text x="620" y="1866" text-anchor="middle" font-size="16" fill="#475569">The quoted line is what you say out loud: it names the cost the caller accepts for that status.</text>
</svg>