<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With one instance the service goes down when it fails, while a redundant second instance lets traffic fail over and keeps the service up">
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="rr1-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rr1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rr1-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rr1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="400" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="78" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">One instance</text>

  <rect x="640" y="40" width="580" height="400" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="78" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Two instances</text>

  <line x1="310" y1="190" x2="310" y2="244" stroke="#475569" stroke-width="2.5" marker-end="url(#rr1-slate)"/>
  <line x1="310" y1="320" x2="310" y2="344" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rr1-red)"/>
  <path d="M850,190 C850,218 790,216 790,244" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rr1-red)"/>
  <path d="M990,190 C990,218 1050,216 1050,244" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#rr1-emerald)"/>
  <line x1="1050" y1="320" x2="1050" y2="344" stroke="#059669" stroke-width="2.5" marker-end="url(#rr1-emerald)"/>

  <g filter="url(#rr1-soft)">
    <rect x="150" y="110" width="320" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="200" y="250" width="220" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="60" y="350" width="500" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

    <rect x="760" y="110" width="320" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="680" y="250" width="220" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="940" y="250" width="220" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="680" y="350" width="500" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="310" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Users</text>
  <path d="M212,262 L408,308 M408,262 L212,308" stroke="#DC2626" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
  <text x="310" y="292" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Service</text>
  <text x="310" y="392" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Nothing is left to serve the request</text>

  <text x="920" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Users</text>
  <path d="M692,262 L888,308 M888,262 L692,308" stroke="#DC2626" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5"/>
  <text x="790" y="292" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Instance A</text>
  <text x="1050" y="292" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Instance B</text>
  <text x="930" y="392" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Traffic fails over and users see nothing</text>

  <text x="620" y="486" font-size="20" fill="#475569" text-anchor="middle">The failure is identical in both cases. What differs is whether the system had somewhere else to go.</text>
</svg>