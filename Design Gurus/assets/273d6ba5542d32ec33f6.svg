<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="asym-title asym-desc">
<title id="asym-title">The question you cannot answer later</title>
<desc id="asym-desc">A dashboard can be added after an incident. A field on a log line cannot, because the requests are gone. That asymmetry is why debuggability belongs in the design.</desc>
<defs>
<marker id="asym-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="asym-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="asym-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="asym-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="708" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The question you cannot answer later</text>
<text x="40" y="86" font-size="21" fill="#4A5568">That asymmetry is why this belongs in the design rather than in a later ticket.</text>
<rect x="40" y="630" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="630" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="56" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="56" rx="2.5" fill="#AC8BE8"/><text x="64" y="152" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Which of these requests were slow, and what did they have in common?</text>
<rect x="40" y="190" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A dashboard</text>
<path d="M526 220H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 220H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asym-marker-green)"/>
<rect x="570" y="190" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">can be added after an incident</text><text x="590" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it will be useful next time</text>
<rect x="40" y="258" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A field on a log line</text>
<path d="M526 288H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 288H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asym-marker-red)"/>
<rect x="570" y="258" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="281.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cannot be added after</text><text x="590" y="306.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the requests are gone</text>
<rect x="40" y="326" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="362" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A trace across services</text>
<path d="M526 356H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 356H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#asym-marker-red)"/>
<rect x="570" y="326" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="349.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cannot be reconstructed</text><text x="590" y="374.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">nothing carried an identifier</text>
<rect x="40" y="404" width="1160" height="86" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="404" width="5" height="86" rx="2.5" fill="#5EC9EC"/><text x="64" y="438.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Monitoring tells you that something is wrong.</text><text x="64" y="467.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Debuggability lets you find out what, and it has to exist beforehand.</text>
<text x="40" y="526" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three decisions, cheap at design time and expensive to add later</text>
<rect x="40" y="544" width="372" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="580" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An identifier that travels</text>
<rect x="434" y="544" width="372" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="580" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Logs that are data</text>
<rect x="828" y="544" width="372" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="580" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Traces across boundaries</text>
<text x="66" y="664" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Debuggability is the property that a system answers questions nobody wrote down in advance.</text>
</svg>