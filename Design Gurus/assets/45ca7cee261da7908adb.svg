<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="808" viewBox="0 0 1240 808" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The job lifecycle as a state machine. Queued flows to running, and running branches to done, failed and cancelled. Queued can also move directly to cancelled, because queued work can be cancelled before it starts. The three final states carry a heavier border. Beside done sits result_url and expires_at, beside failed the stored error object, and beside cancelled the discarded partial output.">
  <defs>
    <marker id="po-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="po-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="po-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="po-sm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="po-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="po-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="po-k1"><rect x="80" y="290" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="po-k2"><rect x="400" y="290" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="po-k3"><rect x="810" y="120" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="po-k4"><rect x="810" y="290" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="po-k5"><rect x="810" y="460" width="340" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="808" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="600" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The job lifecycle</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">a heavier border marks a final state</text>

  
  <g fill="none" stroke-width="2">
    <path d="M310,335 H400" stroke="#D97706" marker-end="url(#po-am)"/>
    <path d="M630,315 H698 Q710,315 710,303 V177 Q710,165 722,165 H810" stroke="#059669" stroke-width="2.5" marker-end="url(#po-em)"/>
    <path d="M630,335 H810" stroke="#DB2777" marker-end="url(#po-pm)"/>
    <path d="M630,355 H698 Q710,355 710,367 V493 Q710,505 722,505 H810" stroke="#64748B" marker-end="url(#po-sm)"/>
    <path d="M195,380 V588 Q195,600 207,600 H858 Q870,600 870,588 V550" stroke="#64748B" marker-end="url(#po-sm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="500" y="590" fill="#475569">queued work can be cancelled before it starts</text>
  </g>

  
  <g filter="url(#po-soft)">
    <rect x="80" y="290" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="290" width="6" height="90" fill="#D97706" clip-path="url(#po-k1)"/>
  </g>
  <circle cx="118" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,324.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="144" y="342" font-size="18.5" font-weight="600" fill="#111827">queued</text>

  
  <g filter="url(#po-soft)">
    <rect x="400" y="290" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="400" y="290" width="6" height="90" fill="#D97706" clip-path="url(#po-k2)"/>
  </g>
  <circle cx="438" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,324.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="464" y="342" font-size="18.5" font-weight="600" fill="#111827">running</text>

  
  <g filter="url(#po-lift)">
    <rect x="810" y="120" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="810" y="120" width="9" height="90" fill="#059669" clip-path="url(#po-k3)"/>
  </g>
  <circle cx="848" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(837.56,154.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="874" y="172" font-size="18.5" font-weight="600" fill="#111827">done</text>
  <text x="980" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">result_url and expires_at</text>

  
  <g filter="url(#po-lift)">
    <rect x="810" y="290" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="810" y="290" width="9" height="90" fill="#DB2777" clip-path="url(#po-k4)"/>
  </g>
  <circle cx="848" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(837.56,324.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="874" y="342" font-size="18.5" font-weight="600" fill="#111827">failed</text>
  <text x="980" y="405" font-size="15.5" text-anchor="middle" fill="#6B7280">the stored error object</text>

  
  <g filter="url(#po-lift)">
    <rect x="810" y="460" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="810" y="460" width="9" height="90" fill="#64748B" clip-path="url(#po-k5)"/>
  </g>
  <circle cx="848" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(837.56,494.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M5.6 5.6l12.8 12.8"/>
  </g>
  <text x="874" y="512" font-size="18.5" font-weight="600" fill="#111827">cancelled</text>
  <text x="980" y="575" font-size="15.5" text-anchor="middle" fill="#6B7280">partial output discarded</text>

  
  <rect x="40" y="664" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="706" text-anchor="middle" font-size="16" fill="#475569">A heavier border marks a final state. The caller stops polling there.</text>
  <text x="620" y="736" text-anchor="middle" font-size="16" fill="#475569">A final state is never revisited. The job does not return to queued or running.</text>
</svg>