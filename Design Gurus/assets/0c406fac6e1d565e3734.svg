<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five parts of a stated trade-off in a row: the choice, the gain, the cost, the reason, and the alternative. Under each part, the same five parts applied to a real caching decision, ending with no cache for account balances.">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="to1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="to1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="to1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="to1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="to1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="to1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="to1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="to1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="to1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One sentence pattern, five parts</text>
  <g filter="url(#to1-soft)"><rect x="24" y="74" width="232" height="116" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="140" y="106" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">1. The choice</text>
  <text x="140" y="138" font-size="18" fill="#0F172A" text-anchor="middle">"I'll use X."</text>
  <line x1="254" y1="132" x2="266" y2="132" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#to1-s)"/>
  <line x1="140" y1="196" x2="140" y2="236" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#to1-b)"/>
  <g filter="url(#to1-soft)"><rect x="264" y="74" width="232" height="116" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="380" y="106" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">2. The gain</text>
  <text x="380" y="138" font-size="18" fill="#0F172A" text-anchor="middle">"That gives</text>
  <text x="380" y="164" font-size="18" fill="#0F172A" text-anchor="middle">us A."</text>
  <line x1="494" y1="132" x2="506" y2="132" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#to1-s)"/>
  <line x1="380" y1="196" x2="380" y2="236" stroke="#059669" stroke-width="2.2" marker-end="url(#to1-e)"/>
  <g filter="url(#to1-soft)"><rect x="504" y="74" width="232" height="116" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="620" y="106" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="middle">3. The cost</text>
  <text x="620" y="138" font-size="18" fill="#0F172A" text-anchor="middle">"It costs</text>
  <text x="620" y="164" font-size="18" fill="#0F172A" text-anchor="middle">us B."</text>
  <line x1="734" y1="132" x2="746" y2="132" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#to1-s)"/>
  <line x1="620" y1="196" x2="620" y2="236" stroke="#DC2626" stroke-width="2.2" marker-end="url(#to1-r)"/>
  <g filter="url(#to1-soft)"><rect x="744" y="74" width="232" height="116" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="860" y="106" font-size="19" font-weight="700" fill="#B45309" text-anchor="middle">4. The reason</text>
  <text x="860" y="138" font-size="18" fill="#0F172A" text-anchor="middle">"I accept B because</text>
  <text x="860" y="164" font-size="18" fill="#0F172A" text-anchor="middle">of requirement R."</text>
  <line x1="974" y1="132" x2="986" y2="132" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#to1-s)"/>
  <line x1="860" y1="196" x2="860" y2="236" stroke="#D97706" stroke-width="2.2" marker-end="url(#to1-a)"/>
  <g filter="url(#to1-soft)"><rect x="984" y="74" width="232" height="116" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="1100" y="106" font-size="19" font-weight="700" fill="#6D28D9" text-anchor="middle">5. The alternative</text>
  <text x="1100" y="138" font-size="18" fill="#0F172A" text-anchor="middle">"If R changed,</text>
  <text x="1100" y="164" font-size="18" fill="#0F172A" text-anchor="middle">I'd use Y."</text>
  <line x1="1100" y1="196" x2="1100" y2="236" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#to1-v)"/>
  <text x="620" y="262" font-size="18" fill="#64748B" text-anchor="middle">the same five parts, applied to a caching decision</text>
  <g filter="url(#to1-soft)"><rect x="24" y="284" width="232" height="100" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="38" y="300" width="9" height="68" rx="4" fill="#3B82F6"/>
  <text x="58" y="326" font-size="17" fill="#0F172A" text-anchor="start">a cache in front</text>
  <text x="58" y="352" font-size="17" fill="#0F172A" text-anchor="start">of the database</text>
  <g filter="url(#to1-soft)"><rect x="264" y="284" width="232" height="100" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="278" y="300" width="9" height="68" rx="4" fill="#059669"/>
  <text x="298" y="326" font-size="17" fill="#0F172A" text-anchor="start">most reads skip the</text>
  <text x="298" y="352" font-size="17" fill="#0F172A" text-anchor="start">database, reads are fast</text>
  <g filter="url(#to1-soft)"><rect x="504" y="284" width="232" height="100" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="518" y="300" width="9" height="68" rx="4" fill="#DC2626"/>
  <text x="538" y="326" font-size="17" fill="#0F172A" text-anchor="start">a window where a user</text>
  <text x="538" y="352" font-size="17" fill="#0F172A" text-anchor="start">can see stale data</text>
  <g filter="url(#to1-soft)"><rect x="744" y="284" width="232" height="100" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="758" y="300" width="9" height="68" rx="4" fill="#D97706"/>
  <text x="778" y="326" font-size="17" fill="#0F172A" text-anchor="start">the feed may be a</text>
  <text x="778" y="352" font-size="17" fill="#0F172A" text-anchor="start">few seconds behind</text>
  <g filter="url(#to1-soft)"><rect x="984" y="284" width="232" height="100" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="998" y="300" width="9" height="68" rx="4" fill="#7C3AED"/>
  <text x="1018" y="326" font-size="17" fill="#0F172A" text-anchor="start">for account balances,</text>
  <text x="1018" y="352" font-size="17" fill="#0F172A" text-anchor="start">no cache</text>
  <text x="620" y="430" font-size="19" fill="#0F172A" text-anchor="middle">Parts 4 and 5 carry the signal: they tie the decision to a requirement and prove you considered an option.</text>
  <text x="620" y="460" font-size="18" fill="#64748B" text-anchor="middle">Anyone can list a pro and a con. Parts 1 to 3 alone are a comparison, not a decision.</text>
</svg>