<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four assumptions to check when adding a model to a system.">
  <defs>

    <filter id="m1l2a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l2a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>


  <rect x="50" y="60" width="300" height="66" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="99" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">Correctness is binary</text>
  <text x="374" y="88" font-size="15.5" text-anchor="start" fill="#94A3B8">outputs may need several quality measurements</text>
  <text x="374" y="110" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">measure quality alongside service health</text>
  <rect x="50" y="146" width="300" height="66" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="185" text-anchor="middle" font-size="16.5" font-weight="600" fill="#5B21B6">The code is the behavior</text>
  <text x="374" y="174" font-size="15.5" text-anchor="start" fill="#94A3B8">changed data can affect a model without a code update</text>
  <text x="374" y="196" font-size="15.5" font-weight="600" text-anchor="start" fill="#5B21B6">investigate, evaluate updates, and release safely</text>
  <rect x="50" y="232" width="300" height="66" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="200" y="271" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">Compute is cheap</text>
  <text x="374" y="260" font-size="15.5" text-anchor="start" fill="#94A3B8">cost and latency depend on the model and workload</text>
  <text x="374" y="282" font-size="15.5" font-weight="600" text-anchor="start" fill="#B45309">evaluate caching, routing, and background work</text>
  <rect x="50" y="318" width="300" height="66" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="200" y="357" text-anchor="middle" font-size="16.5" font-weight="600" fill="#BE185D">Failures are loud</text>
  <text x="374" y="346" font-size="15.5" text-anchor="start" fill="#94A3B8">a wrong answer can arrive with HTTP 200 OK</text>
  <text x="374" y="368" font-size="15.5" font-weight="600" text-anchor="start" fill="#BE185D">output checks, fallbacks, and human review</text>
  <rect x="40" y="414" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="448" font-size="16" fill="#475569">Your existing system design knowledge also helps with AI services.</text>
  <rect x="64" y="474" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="496" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Still true</text>
  <text x="288" y="496" font-size="15.5" fill="#475569">choose standard system components where the requirements need them</text>
  <rect x="64" y="518" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="540" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">What is new</text>
  <text x="288" y="540" font-size="15.5" fill="#475569">explicit quality, feedback, inference cost, and model-output controls</text>
</svg>