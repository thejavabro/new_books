<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="906" viewBox="0 0 1240 906" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One response request produces a started event, then ordered delta events, then exactly one terminal event. Either response completed with a stop reason and usage, or response failed with an error, a partial output policy and usage. The two terminal events can never both occur for one response.">
  <defs>
    <marker id="p22-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p22-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p22-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p22-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p22-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p22-k1"><rect x="320" y="100" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p22-k2"><rect x="320" y="230" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p22-k3"><rect x="320" y="360" width="600" height="48" rx="10"/></clipPath>
    <clipPath id="p22-k4"><rect x="76" y="604" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p22-k5"><rect x="704" y="604" width="460" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="906" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="426" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One stream, exactly one terminal event</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">the ordered events, in the order they arrive</text>

  
  <rect x="40" y="538" width="1160" height="234" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="568" font-size="16.5" font-weight="600" fill="#475569">Exactly one of these ends the stream</text>
  <text x="1176" y="568" text-anchor="end" font-size="15.5" fill="#6B7280">the two can never both occur</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,188 V230" stroke="#2563EB" marker-end="url(#p22-bm)"/>
    <path d="M620,318 V360" stroke="#2563EB" marker-end="url(#p22-bm)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M420,408 V604" stroke="#059669" marker-end="url(#p22-em)"/>
    <path d="M820,408 V490 Q820,502 832,502 H922 Q934,502 934,514 V604" stroke="#DB2777" marker-end="url(#p22-pm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="364" y="490" fill="#047857">success</text>
    <text x="876" y="490" fill="#BE185D">failure</text>
  </g>

  
  <g filter="url(#p22-soft)">
    <rect x="320" y="100" width="600" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="320" y="100" width="6" height="48" fill="#64748B" clip-path="url(#p22-k1)"/>
  </g>
  <circle cx="354" cy="124" r="4.5" fill="#64748B"/>
  <text x="378" y="131" font-size="18.5" font-weight="600" fill="#111827">POST /responses</text>
  <text x="620" y="172" font-size="15.5" text-anchor="middle" fill="#6B7280">One request opens one response stream.</text>

  
  <g filter="url(#p22-soft)">
    <rect x="320" y="230" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="230" width="6" height="48" fill="#2563EB" clip-path="url(#p22-k2)"/>
  </g>
  <circle cx="354" cy="254" r="4.5" fill="#2563EB"/>
  <text x="378" y="261" font-size="18.5" font-weight="600" fill="#111827">response.started</text>
  <text x="620" y="302" font-size="15.5" text-anchor="middle" fill="#6B7280">The opening event, and it arrives once.</text>

  
  <g filter="url(#p22-soft)">
    <rect x="320" y="360" width="600" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="320" y="360" width="6" height="48" fill="#2563EB" clip-path="url(#p22-k3)"/>
  </g>
  <circle cx="354" cy="384" r="4.5" fill="#2563EB"/>
  <text x="378" y="391" font-size="18.5" font-weight="600" fill="#111827">response.output_text.delta</text>
  <text x="620" y="432" font-size="15.5" text-anchor="middle" fill="#6B7280">Ordered append instructions, and they may repeat.</text>

  
  <g filter="url(#p22-lift)">
    <rect x="76" y="604" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="76" y="604" width="9" height="90" fill="#059669" clip-path="url(#p22-k4)"/>
  </g>
  <circle cx="114" cy="649" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,638.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="656" font-size="18.5" font-weight="600" fill="#111827">response.completed</text>
  <text x="306" y="719" font-size="15.5" text-anchor="middle" fill="#6B7280">carries stop_reason and usage</text>
  <text x="306" y="742" font-size="15.5" text-anchor="middle" fill="#94A3B8">the output is usable</text>

  
  <g filter="url(#p22-lift)">
    <rect x="704" y="604" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="704" y="604" width="9" height="90" fill="#DB2777" clip-path="url(#p22-k5)"/>
  </g>
  <circle cx="742" cy="649" r="18" fill="#FFFFFF"/>
  <g transform="translate(731.56,638.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="768" y="656" font-size="18.5" font-weight="600" fill="#111827">response.failed</text>
  <text x="934" y="719" font-size="15.5" text-anchor="middle" fill="#6B7280">carries error, partial_output and usage</text>
  <text x="934" y="742" font-size="15.5" text-anchor="middle" fill="#94A3B8">the partial output is incomplete, and not valid JSON</text>

  
  <g fill="none" stroke="#DB2777" stroke-width="2.4">
    <path d="M536,649 H604"/>
    <path d="M636,649 H704"/>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="3" stroke-linecap="round">
    <path d="M612,641 L628,657"/>
    <path d="M628,641 L612,657"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="624" fill="#BE185D">never both</text>
  </g>

  
  <rect x="40" y="796" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="841" text-anchor="middle" font-size="16" fill="#475569">An end of file with no terminal event is an incomplete outcome, not a success.</text>
</svg>