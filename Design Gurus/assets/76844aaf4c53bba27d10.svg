<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="634" viewBox="0 0 1240 634" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="envelope-title envelope-desc">
<title id="envelope-title">The cost envelope, in four lines</title>
<desc id="envelope-desc">Name the dominant cost component with an order of magnitude, give the per-unit figure in business terms, compare it against revenue per unit, and say which assumption would change the answer.</desc>
<defs>
<marker id="envelope-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="envelope-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="envelope-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="envelope-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="634" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The cost envelope, in four lines</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four lines are enough.</text>
<rect x="40" y="556" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="556" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="118" width="428" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The dominant component</text>
<path d="M526 148H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 148H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#envelope-marker-slate)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="141.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"Egress dominates, at roughly two thousandths</text><text x="590" y="166.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">of a cent per request."</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="190" width="428" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The per-unit figure</text>
<path d="M526 220H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 220H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#envelope-marker-slate)"/>
<rect x="570" y="190" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="226" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"About forty cents per user per month."</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="262" width="428" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The comparison</text>
<path d="M526 292H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 292H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#envelope-marker-slate)"/>
<rect x="570" y="262" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="285.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"Against two dollars of revenue,</text><text x="590" y="310.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">so infrastructure is a fifth."</text>
<circle cx="60" cy="364" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="334" width="428" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="306" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What changes it</text>
<path d="M526 364H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 364H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#envelope-marker-slate)"/>
<rect x="570" y="334" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="357.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"If payload size doubles, a delivery network</text><text x="590" y="382.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">stops being optional."</text>
<rect x="40" y="418" width="1160" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="418" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="453" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The fourth line is the one that marks the difference.</text><text x="64" y="480" font-size="20" font-weight="400" fill="#6040A8" text-anchor="start">Anyone can produce a number. Saying which assumption it is sensitive to,</text><text x="64" y="507" font-size="20" font-weight="400" fill="#6040A8" text-anchor="start">and what you would do when it moves, is what makes it usable by somebody else.</text>
<text x="66" y="590" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Produce this alongside the performance envelope, at the same time and with as little ceremony.</text>
</svg>