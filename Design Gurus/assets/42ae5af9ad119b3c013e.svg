<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1454" viewBox="0 0 1240 1454" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The resource boundary cheat sheet: when a value stays a field, when it becomes a resource, when a relationship becomes its own entity, and the sentence to say for each choice.">
  <defs>
    <filter id="p48-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p48-k1"><rect x="76" y="146" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p48-k2"><rect x="76" y="342" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p48-k3"><rect x="76" y="538" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p48-k4"><rect x="76" y="734" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p48-k5"><rect x="76" y="930" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p48-k6"><rect x="76" y="1126" width="460" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1454" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Resource boundary: field, resource, or relationship entity</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600,65 L609,71 L600,77"/>
  </g>
  <text x="626" y="77" font-size="15.5" fill="#6B7280">the trigger you notice</text>
  <g transform="translate(837.5,60.9) scale(0.72)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="866" y="77" font-size="15.5" fill="#6B7280">the sentence to say</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p48-soft)">
    <rect x="76" y="146" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p48-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Keep it as a field</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,250 L88,256 L79,262"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">The value has no independent identity or caller lifecycle.</text>
  <g transform="translate(75.5,271.9) scale(0.72)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">"Choose a field; accept that callers cannot address or evolve it independently."</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p48-soft)">
    <rect x="76" y="342" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#059669" clip-path="url(#p48-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">Make it a resource</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,446 L88,452 L79,458"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">Callers create, read, change, or delete the thing by its own identity.</text>
  <g transform="translate(75.5,467.9) scale(0.72)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">"Choose a resource; accept another lifecycle, authorization rule, and operation surface."</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p48-soft)">
    <rect x="76" y="538" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p48-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">Make the relationship an entity or resource</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,642 L88,648 L79,654"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">A relationship carries fields such as role, position, expiry, or status.</text>
  <g transform="translate(75.5,663.9) scale(0.72)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">"Choose a relationship resource; accept another object so its own fields and concurrency stay correct."</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p48-soft)">
    <rect x="76" y="734" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#059669" clip-path="url(#p48-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">Publish a read-only derived resource</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,838 L88,844 L79,850"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">The caller asks for a computed collection such as a feed or evaluation set.</text>
  <g transform="translate(75.5,859.9) scale(0.72)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">"Choose a derived resource; accept that its stability and freshness promise must be published even if no row stores it."</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p48-soft)">
    <rect x="76" y="930" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#059669" clip-path="url(#p48-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">Separate it from the parent</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,1034 L88,1040 L79,1046"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">The result has a different duration from its parent, such as a quote or hold.</text>
  <g transform="translate(75.5,1055.9) scale(0.72)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">"Choose a short-lived resource; accept expiry, 410 or conflict behavior, and cleanup."</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p48-soft)">
    <rect x="76" y="1126" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#059669" clip-path="url(#p48-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">Keep it internal</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79,1230 L88,1236 L79,1242"/>
  </g>
  <text x="104" y="1242" font-size="15.5" fill="#6B7280">No caller ever identifies or acts on the internal concept.</text>
  <g transform="translate(75.5,1251.9) scale(0.72)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">"Choose no public resource; accept that internal implementation detail cannot be controlled directly by callers."</text>

  
  <rect x="40" y="1314" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1356" text-anchor="middle" font-size="16" fill="#475569">Every row names a trigger you notice, the boundary choice it implies, and the sentence to say for that choice.</text>
  <text x="620" y="1384" text-anchor="middle" font-size="16" fill="#475569">Each sentence has one shape: name the choice, then name the cost you accept for it.</text>
</svg>