<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="522" viewBox="0 0 1240 522" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The twelve modules">
  <rect x="0" y="0" width="1240" height="522" fill="#FFFFFF"/>

  <text x="620" y="46" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">The twelve modules</text>
  <rect x="24" y="100" width="286" height="68" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
  <text x="167" y="140" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">1. Thinking in Patterns</text>
  <rect x="326" y="100" width="286" height="68" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="469" y="140" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">2. Moving Data</text>
  <rect x="628" y="100" width="286" height="68" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="771" y="140" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">3. Storing Data</text>
  <rect x="930" y="100" width="286" height="68" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1073" y="140" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">4. Serving Data Fast</text>
  <rect x="24" y="208" width="286" height="68" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="167" y="248" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">5. Surviving Failure</text>
  <rect x="326" y="208" width="286" height="68" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="469" y="248" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">6. Growing Under Load</text>
  <rect x="628" y="208" width="286" height="68" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="771" y="248" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">7. Data Consistency</text>
  <rect x="930" y="208" width="286" height="68" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1073" y="248" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">8. The Entry Point</text>
  <rect x="24" y="316" width="286" height="68" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="167" y="356" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">9. Operating in Production</text>
  <rect x="326" y="316" width="286" height="68" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="469" y="356" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">10. Data-Intensive Systems</text>
  <rect x="628" y="316" width="286" height="68" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="771" y="356" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">11. AI-Era Systems</text>
  <rect x="930" y="316" width="286" height="68" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1073" y="356" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">12. Capstones</text>
  <text x="620" y="436" font-size="20" fill="#0F172A" text-anchor="middle">Module 1 is the foundation. Modules 2 to 6 answer the five design questions,</text>
  <text x="620" y="469" font-size="20" fill="#0F172A" text-anchor="middle">modules 7 to 9 refine the answers, and modules 10 to 12 apply them again.</text>
</svg>