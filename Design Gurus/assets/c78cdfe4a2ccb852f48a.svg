<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="636" viewBox="0 0 1240 636" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An auto-increment shard key sends every new write to the last shard, leaving the other shards idle">
  <rect x="0" y="0" width="1240" height="636" fill="#FFFFFF"/>
  <defs>
    <marker id="sh1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="sh1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Sharding by an auto-increment order id</text>

  <line x1="304" y1="330" x2="644" y2="466" stroke="#DC2626" stroke-width="2.5" marker-end="url(#sh1-red)"/>
  <rect x="336" y="368" width="290" height="30" fill="#FFFFFF"/>
  <text x="481" y="390" font-size="20" fill="#B91C1C" text-anchor="middle">every new order lands here</text>

  <g filter="url(#sh1-soft)">
    <rect x="80" y="290" width="224" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="192" y="324" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">New orders</text>
  <text x="192" y="352" font-size="20" fill="#64748B" text-anchor="middle">ids keep increasing</text>

  <g filter="url(#sh1-soft)">
    <rect x="648" y="128" width="472" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="648" y="216" width="472" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="648" y="304" width="472" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="648" y="430" width="472" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>

  <text x="676" y="158" font-size="20" font-weight="600" fill="#334155">Shard 1</text>
  <text x="676" y="186" font-size="20" fill="#64748B" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">ids 1 to 1M</text>
  <text x="1092" y="172" font-size="20" fill="#94A3B8" text-anchor="end">idle</text>

  <text x="676" y="246" font-size="20" font-weight="600" fill="#334155">Shard 2</text>
  <text x="676" y="274" font-size="20" fill="#64748B" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">ids 1M to 2M</text>
  <text x="1092" y="260" font-size="20" fill="#94A3B8" text-anchor="end">idle</text>

  <text x="676" y="334" font-size="20" font-weight="600" fill="#334155">Shard 3</text>
  <text x="676" y="362" font-size="20" fill="#64748B" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">ids 2M to 3M</text>
  <text x="1092" y="348" font-size="20" fill="#94A3B8" text-anchor="end">idle</text>

  <text x="676" y="464" font-size="20" font-weight="600" fill="#B91C1C">Shard 4</text>
  <text x="676" y="494" font-size="20" fill="#B91C1C" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">ids 3M and up</text>
  <text x="1092" y="478" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="end">100% of writes</text>

  <rect x="80" y="546" width="1080" height="66" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="576" font-size="20" fill="#475569" text-anchor="middle">Three shards hold cold data and take no writes. Timestamps behave exactly the same way.</text>
  <text x="620" y="602" font-size="20" fill="#475569" text-anchor="middle">Adding shard 5 does not fix it: shard 5 simply becomes the new hotspot.</text>
</svg>