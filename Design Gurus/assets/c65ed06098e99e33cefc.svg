<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The meetings sorted by start time, with no rooms open">
<defs>
<filter id="mr-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many rooms do these 7 meetings need?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Sorted by start time, so they are handled in the order they begin</text>
<rect x="40" y="106" width="1160" height="588" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Each room in use is remembered only by when it next becomes free</text>
<line x1="210" y1="436" x2="1150" y2="436" stroke="#CBD5E1" stroke-width="2"/>
<line x1="210" y1="432" x2="210" y2="442" stroke="#CBD5E1" stroke-width="2"/>
<text x="210" y="462" text-anchor="middle" font-size="16.5" fill="#475569">0</text>
<line x1="344.2857142857143" y1="432" x2="344.2857142857143" y2="442" stroke="#CBD5E1" stroke-width="2"/>
<text x="344.2857142857143" y="462" text-anchor="middle" font-size="16.5" fill="#475569">5</text>
<line x1="478.57142857142856" y1="432" x2="478.57142857142856" y2="442" stroke="#CBD5E1" stroke-width="2"/>
<text x="478.57142857142856" y="462" text-anchor="middle" font-size="16.5" fill="#475569">10</text>
<line x1="612.8571428571429" y1="432" x2="612.8571428571429" y2="442" stroke="#CBD5E1" stroke-width="2"/>
<text x="612.8571428571429" y="462" text-anchor="middle" font-size="16.5" fill="#475569">15</text>
<line x1="747.1428571428571" y1="432" x2="747.1428571428571" y2="442" stroke="#CBD5E1" stroke-width="2"/>
<text x="747.1428571428571" y="462" text-anchor="middle" font-size="16.5" fill="#475569">20</text>
<line x1="881.4285714285714" y1="432" x2="881.4285714285714" y2="442" stroke="#CBD5E1" stroke-width="2"/>
<text x="881.4285714285714" y="462" text-anchor="middle" font-size="16.5" fill="#475569">25</text>
<line x1="1015.7142857142857" y1="432" x2="1015.7142857142857" y2="442" stroke="#CBD5E1" stroke-width="2"/>
<text x="1015.7142857142857" y="462" text-anchor="middle" font-size="16.5" fill="#475569">30</text>
<line x1="1150" y1="432" x2="1150" y2="442" stroke="#CBD5E1" stroke-width="2"/>
<text x="1150" y="462" text-anchor="middle" font-size="16.5" fill="#475569">35</text>
<rect x="236.85714285714286" y="190" width="80.57142857142858" height="26" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="277.14285714285717" y="209" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">1 to 4</text>
<rect x="344.2857142857143" y="224" width="241.71428571428572" height="26" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="465.1428571428571" y="243" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">5 to 14</text>
<rect x="478.57142857142856" y="258" width="268.57142857142856" height="26" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="612.8571428571429" y="277" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">10 to 20</text>
<rect x="612.8571428571429" y="292" width="268.57142857142856" height="26" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="747.1428571428571" y="311" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">15 to 25</text>
<rect x="800.8571428571429" y="326" width="161.1428571428571" height="26" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="881.4285714285714" y="345" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">22 to 28</text>
<rect x="854.5714285714286" y="360" width="161.1428571428571" height="26" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="935.1428571428571" y="379" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">24 to 30</text>
<rect x="935.1428571428572" y="394" width="214.85714285714278" height="26" rx="7" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="1042.5714285714287" y="413" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">27 to 35</text>
<text x="186" y="508" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">rooms in use</text>
<text x="216" y="507" font-size="18" fill="#475569">no rooms open yet</text>
<text x="620" y="646" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">A room is worth remembering only by the time it frees up, not by which meeting is in it</text>
<rect x="40" y="702" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="742" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Handle the meetings in start order, and reuse the room that frees soonest</text>
<text x="620" y="774" text-anchor="middle" font-size="18.5" fill="#475569">How many rooms are open at the end is the answer, because they never close early</text>
</svg>