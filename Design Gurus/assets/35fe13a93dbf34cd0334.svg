<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Left, before: Orders imports Payments to charge a card, and Payments imports Orders to read the total and call mark_paid, so the two form a cycle; Payments calls the payment provider API. Right, after: the orders module holds OrderService and the PaymentGateway interface it owns; ProviderPaymentGateway in the payments module implements that interface and calls the payment provider API. Rows underneath list the problems of the cycle and the gains after the change.">
  <defs>
    <filter id="mf03c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mf03c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mf03c-k1"><rect x="190" y="240" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="mf03c-k2"><rect x="190" y="520" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="mf03c-k3"><rect x="190" y="740" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="mf03c-k4"><rect x="688" y="270" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="mf03c-k5"><rect x="952" y="270" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="mf03c-k6"><rect x="812" y="550" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="mf03c-k7"><rect x="852" y="740" width="260" height="90" rx="12"/></clipPath>
    <marker id="mf03c-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="mf03c-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="mf03c-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="mf03c-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1170" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Breaking a dependency cycle</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">On the right, the only import between the two modules points into the orders module.</text>

  <rect x="40" y="120" width="560" height="1010" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#BE185D">Before: a cycle</text>
  <rect x="640" y="120" width="560" height="1010" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#047857">After: an interface that Orders owns</text>
  <rect x="664" y="180" width="512" height="220" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="688" y="210" font-size="19.5" font-weight="600" fill="#1D4ED8">orders module</text>
  <rect x="664" y="470" width="512" height="190" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="688" y="500" font-size="19.5" font-weight="600" fill="#5B21B6">payments module</text>

  <g fill="none" stroke-width="2">
    <path d="M270,330 V520" stroke="#DB2777" stroke-width="2.5" marker-end="url(#mf03c-m-pink)"/>
    <path d="M370,520 V330" stroke="#DB2777" stroke-width="2.5" marker-end="url(#mf03c-m-pink)"/>
    <path d="M320,610 V740" stroke="#64748B" marker-end="url(#mf03c-m-slate)"/>
    <path d="M888,315 H952" stroke="#2563EB" stroke-width="2.5" marker-end="url(#mf03c-m-blue)"/>
    <path d="M1052,550 V360" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#mf03c-m-emerald)"/>
    <path d="M982,640 V740" stroke="#64748B" marker-end="url(#mf03c-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="258" y="432" fill="#BE185D" text-anchor="end">charges the card</text>
    <text x="382" y="420" fill="#BE185D" text-anchor="start">reads total,</text>
    <text x="382" y="444" fill="#BE185D" text-anchor="start">mark_paid()</text>
    <text x="332" y="682" fill="#475569" text-anchor="start">HTTPS</text>
    <text x="920" y="299" fill="#1D4ED8">calls</text>
    <text x="1064" y="440" fill="#047857" text-anchor="start">implements</text>
    <text x="994" y="698" fill="#475569" text-anchor="start">HTTPS</text>
  </g>

  <g filter="url(#mf03c-soft)">
    <rect x="190" y="240" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="190" y="240" width="6" height="90" fill="#2563EB" clip-path="url(#mf03c-k1)"/>
  </g>
  <circle cx="228" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,274.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="254" y="292" font-size="21.5" font-weight="600" fill="#111827">Orders</text>
  <g filter="url(#mf03c-soft)">
    <rect x="190" y="520" width="260" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="190" y="520" width="6" height="90" fill="#7C3AED" clip-path="url(#mf03c-k2)"/>
  </g>
  <circle cx="228" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,554.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="254" y="572" font-size="21.5" font-weight="600" fill="#111827">Payments</text>
  <g filter="url(#mf03c-soft)">
    <rect x="190" y="740" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="190" y="740" width="6" height="90" fill="#64748B" clip-path="url(#mf03c-k3)"/>
  </g>
  <circle cx="228" cy="785" r="18" fill="#FFFFFF"/>
  <g transform="translate(217.56,774.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h11a4 4 0 0 0 .6-7.95A6 6 0 0 0 7.1 9.1 4.75 4.75 0 0 0 7 18.5z"/></g>
  <text x="254" y="779.25" font-size="21.5" font-weight="600" fill="#111827">Payment</text>
  <text x="254" y="804.75" font-size="21.5" font-weight="600" fill="#111827">provider API</text>
  <g filter="url(#mf03c-soft)">
    <rect x="688" y="270" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="688" y="270" width="6" height="90" fill="#2563EB" clip-path="url(#mf03c-k4)"/>
  </g>
  <text x="708" y="322" font-size="20" font-weight="600" fill="#111827">OrderService</text>
  <g filter="url(#mf03c-lift)">
    <rect x="952" y="270" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="952" y="270" width="9" height="90" fill="#059669" clip-path="url(#mf03c-k5)"/>
  </g>
  <text x="972" y="310.5" font-size="19" font-weight="600" fill="#111827">PaymentGateway</text>
  <text x="972" y="333.5" font-size="19" font-weight="600" fill="#111827">(interface)</text>
  <g filter="url(#mf03c-soft)">
    <rect x="812" y="550" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="812" y="550" width="6" height="90" fill="#7C3AED" clip-path="url(#mf03c-k6)"/>
  </g>
  <text x="832" y="602" font-size="20" font-weight="600" fill="#111827">ProviderPaymentGateway</text>
  <g filter="url(#mf03c-soft)">
    <rect x="852" y="740" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="852" y="740" width="6" height="90" fill="#64748B" clip-path="url(#mf03c-k7)"/>
  </g>
  <circle cx="890" cy="785" r="18" fill="#FFFFFF"/>
  <g transform="translate(879.56,774.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h11a4 4 0 0 0 .6-7.95A6 6 0 0 0 7.1 9.1 4.75 4.75 0 0 0 7 18.5z"/></g>
  <text x="916" y="779.25" font-size="21.5" font-weight="600" fill="#111827">Payment</text>
  <text x="916" y="804.75" font-size="21.5" font-weight="600" fill="#111827">provider API</text>
  <rect x="64" y="900" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(78,911) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="928.5" font-size="18.5" fill="#1F2937">Neither part can be tested alone</text>
  <rect x="64" y="954" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(78,965) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="982.5" font-size="18.5" fill="#1F2937">A change in either can force the other</text>
  <rect x="64" y="1008" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(78,1019) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="1036.5" font-size="18.5" fill="#1F2937">Circular imports can fail at startup</text>
  <rect x="64" y="1062" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(78,1073) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="1090.5" font-size="18.5" fill="#1F2937">Splitting them into services is hard</text>
  <rect x="664" y="900" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,911) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="928.5" font-size="18.5" fill="#1F2937">Orders imports nothing from payments</text>
  <rect x="664" y="954" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,965) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="982.5" font-size="18.5" fill="#1F2937">Tests pass a fake PaymentGateway</text>
  <rect x="664" y="1008" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,1019) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="1036.5" font-size="18.5" fill="#1F2937">A new provider is a new class only</text>
  <rect x="664" y="1062" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,1073) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="1090.5" font-size="18.5" fill="#1F2937">No cycle between orders and payments</text>




</svg>