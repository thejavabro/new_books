<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="724" viewBox="0 0 1240 724" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A root to leaf path being followed while the remaining target is subtracted at each node"><rect x="0" y="0" width="1240" height="724" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="420" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Following one branch to a leaf, subtracting as you go</text>
<path d="M277.8,175.8 L222.2,240.2" stroke="#CBD5E1" stroke-width="2.5" fill="none"/>
<path d="M322.2,175.8 L377.8,240.2" stroke="#7C3AED" stroke-width="2.5" fill="none"/>
<path d="M182.4,295.1 L147.6,352.9" stroke="#CBD5E1" stroke-width="2.5" fill="none"/>
<path d="M384.4,296.2 L355.6,351.8" stroke="#7C3AED" stroke-width="2.5" fill="none"/>
<path d="M417.6,295.1 L452.4,352.9" stroke="#7C3AED" stroke-width="2.5" fill="none"/>
<circle cx="300" cy="150" r="34" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
<text x="300" y="158" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">12</text>
<circle cx="200" cy="266" r="34" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="200" y="274" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">7</text>
<circle cx="400" cy="266" r="34" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
<text x="400" y="274" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">1</text>
<circle cx="130" cy="382" r="34" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="130" y="390" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">4</text>
<circle cx="340" cy="382" r="34" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="340" y="390" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">10</text>
<circle cx="470" cy="382" r="34" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="470" y="390" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">5</text>
<text x="620" y="130" text-anchor="start" font-size="20.5" font-weight="600" fill="#4338CA">target S = 23</text>
<circle cx="636" cy="204" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="636" y="211" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">1</text>
<rect x="678" y="176" width="16" height="54" rx="6" fill="#7C3AED"/>
<text x="714" y="198" text-anchor="start" font-size="22.5" font-weight="600" fill="#111827">at 12, need 23</text>
<text x="714" y="228" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">subtract 12, so 11 is still needed</text>
<circle cx="636" cy="298" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="636" y="305" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">2</text>
<rect x="678" y="270" width="16" height="54" rx="6" fill="#7C3AED"/>
<text x="714" y="292" text-anchor="start" font-size="22.5" font-weight="600" fill="#111827">at 1, need 11</text>
<text x="714" y="322" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">subtract 1, so 10 is still needed</text>
<circle cx="636" cy="392" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="636" y="399" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">3</text>
<rect x="678" y="364" width="16" height="54" rx="6" fill="#059669"/>
<text x="714" y="386" text-anchor="start" font-size="22.5" font-weight="600" fill="#111827">at 10, need 10</text>
<text x="714" y="416" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">a leaf, and nothing is left to find</text>
<text x="620" y="460" text-anchor="start" font-size="19.5" font-weight="normal" fill="#94A3B8">the branch through 7 is explored too, and fails</text>
<rect x="40" y="508" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="530" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="556" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">on the current path</text>
<text x="348" y="556" font-size="19.5" fill="#475569">the recursion is standing on these nodes</text>
<rect x="64" y="578" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="604" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">the leaf that matches</text>
<text x="348" y="604" font-size="19.5" fill="#475569">nothing is left to subtract, so the answer is yes</text>
<rect x="64" y="626" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="652" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">not on this path</text>
<text x="348" y="652" font-size="19.5" fill="#475569">explored separately, on its own branch</text>
</svg>