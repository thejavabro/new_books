<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="958" viewBox="0 0 1240 958" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four ways a product data model legitimately differs from storage: one entity may use several storage structures, several entities may share one, a resource may be derived rather than stored, and a storage record may not be a resource at all.">
  <defs>
    <filter id="p39-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p39-k1"><rect x="76" y="146" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="p39-k2"><rect x="76" y="322" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="p39-k3"><rect x="76" y="498" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="p39-k4"><rect x="76" y="674" width="1088" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="958" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The model is not a copy of storage</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">four things that can be true, each with one example beneath it</text>

  
  <rect x="40" y="126" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p39-soft)">
    <rect x="76" y="146" width="1088" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#4F46E5" clip-path="url(#p39-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">One entity uses several storage structures</text>
  <text x="140" y="264" font-size="15.5" fill="#6B7280">A Task assembled from a row, a search index, and a counter</text>

  
  <rect x="40" y="302" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p39-soft)">
    <rect x="76" y="322" width="1088" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="322" width="6" height="90" fill="#4F46E5" clip-path="url(#p39-k2)"/>
  </g>
  <circle cx="114" cy="367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,356.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="374" font-size="18.5" font-weight="600" fill="#111827">Several entities share one storage structure</text>
  <text x="140" y="440" font-size="15.5" fill="#6B7280">A general relationship table holding follows, memberships, and permissions</text>

  
  <rect x="40" y="478" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p39-soft)">
    <rect x="76" y="498" width="1088" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="498" width="6" height="90" fill="#4F46E5" clip-path="url(#p39-k3)"/>
  </g>
  <circle cx="114" cy="543" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,532.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="140" y="550" font-size="18.5" font-weight="600" fill="#111827">A resource is derived rather than stored</text>
  <text x="140" y="616" font-size="15.5" fill="#6B7280">A feed or project overview computed for one viewer</text>

  
  <rect x="40" y="654" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p39-soft)">
    <rect x="76" y="674" width="1088" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="674" width="6" height="90" fill="#4F46E5" clip-path="url(#p39-k4)"/>
  </g>
  <circle cx="114" cy="719" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,708.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="726" font-size="18.5" font-weight="600" fill="#111827">A storage record is not a resource</text>
  <text x="140" y="792" font-size="15.5" fill="#6B7280">An audit row or fan-out record no caller ever addresses</text>

  
  <rect x="40" y="842" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="887" text-anchor="middle" font-size="16" fill="#475569">The interview repair: model what the caller acts on, then say which parts are derived.</text>
</svg>