<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="556" viewBox="0 0 1240 556" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The bitonic array before the search">
<defs>
<filter id="sb-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="556" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Find 4 in the bitonic array [1, 3, 8, 4, 3]</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array rises then falls, so it is not sorted and a plain binary search cannot be used</text>
<rect x="40" y="106" width="1160" height="294" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The whole array is still in range</text>
<rect x="348" y="198" width="544" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<rect x="356" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="404" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="404" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="464" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="512" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="512" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="572" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<text x="620" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="680" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="728" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="728" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="788" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="836" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="836" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<path d="M395,324 L413,324 L404,310 Z" fill="#4F46E5"/>
<text x="404" y="348" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">start</text>
<path d="M827,324 L845,324 L836,310 Z" fill="#DB2777"/>
<text x="836" y="348" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">end</text>
<rect x="40" y="426" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="466" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Find the peak first, which splits the array into two sorted halves</text>
<text x="620" y="498" text-anchor="middle" font-size="18.5" fill="#475569">One half rises and the other falls, so each can be searched on its own</text>
</svg>