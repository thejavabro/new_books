<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="734" viewBox="0 0 1240 734" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One shared backend returns the same payload to every client. The desktop browser can use all of it, but the mobile app needs four fields and receives forty, and the smart TV needs two fields plus artwork and receives forty fields without the artwork, so it has to make a second call">
  <defs>
    <marker id="bf1-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="bf1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bf1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bf1-kb"><rect x="460" y="110" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="bf1-k1"><rect x="72" y="316" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="bf1-k2"><rect x="480" y="316" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="bf1-k3"><rect x="888" y="316" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="734" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="490" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">One API for every client, so every client gets the same payload</text>

  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M620,200 L620,248 Q620,260 608,260 L224,260 Q212,260 212,272 L212,312" marker-end="url(#bf1-pk)"/>
    <path d="M620,200 L620,312" marker-end="url(#bf1-pk)"/>
    <path d="M620,200 L620,248 Q620,260 632,260 L1016,260 Q1028,260 1028,272 L1028,312" marker-end="url(#bf1-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="400" y="252" fill="#BE185D">the same 40 fields to all three</text>
  </g>

  <g filter="url(#bf1-lift)">
    <rect x="460" y="110" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="460" y="110" width="9" height="90" fill="#DB2777" clip-path="url(#bf1-kb)"/>
  </g>
  <circle cx="498" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,144.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="524" y="162" font-size="18.5" font-weight="600" fill="#111827">Shared Backend</text>
  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="6"><text x="620" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">one set of endpoints for everyone</text></g>

  
  <g filter="url(#bf1-soft)">
    <rect x="72" y="316" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="316" width="6" height="90" fill="#059669" clip-path="url(#bf1-k1)"/>
  </g>
  <circle cx="110" cy="361" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,350.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="136" y="368" font-size="18.5" font-weight="600" fill="#111827">Desktop Web</text>
  <text x="212" y="431" font-size="15.5" text-anchor="middle" fill="#6B7280">needs most of the record</text>
  <text x="212" y="454" font-size="15.5" text-anchor="middle" fill="#94A3B8">gets 40 fields</text>
  <text x="212" y="477" font-size="15.5" text-anchor="middle" fill="#94A3B8">this one is fine</text>

  <g filter="url(#bf1-soft)">
    <rect x="480" y="316" width="280" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="480" y="316" width="6" height="90" fill="#DB2777" clip-path="url(#bf1-k2)"/>
  </g>
  <circle cx="518" cy="361" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,350.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="2" width="12" height="20" rx="2"/>
    <path d="M10.5 18.5h3"/>
  </g>
  <text x="544" y="368" font-size="18.5" font-weight="600" fill="#111827">Mobile App</text>
  <text x="620" y="431" font-size="15.5" text-anchor="middle" fill="#6B7280">needs 4 fields</text>
  <text x="620" y="454" font-size="15.5" text-anchor="middle" fill="#94A3B8">gets 40 fields</text>
  <text x="620" y="477" font-size="15.5" text-anchor="middle" fill="#94A3B8">slow on a phone network</text>

  <g filter="url(#bf1-soft)">
    <rect x="888" y="316" width="280" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="888" y="316" width="6" height="90" fill="#DB2777" clip-path="url(#bf1-k3)"/>
  </g>
  <circle cx="926" cy="361" r="18" fill="#FFFFFF"/>
  <g transform="translate(915.56,350.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M7 21h10"/>
  </g>
  <text x="952" y="368" font-size="18.5" font-weight="600" fill="#111827">Smart TV</text>
  <text x="1028" y="431" font-size="15.5" text-anchor="middle" fill="#6B7280">needs 2 fields and artwork</text>
  <text x="1028" y="454" font-size="15.5" text-anchor="middle" fill="#94A3B8">gets 40 fields, no artwork</text>
  <text x="1028" y="477" font-size="15.5" text-anchor="middle" fill="#94A3B8">so it calls a second endpoint</text>

  
  <rect x="40" y="566" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="590" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="612" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Over-fetching</text>
  <text x="288" y="612" font-size="15.5" fill="#475569">the client downloads fields it will never show, which costs bandwidth, battery and load time</text>

  <rect x="64" y="634" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="656" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">What BFF changes</text>
  <text x="288" y="656" font-size="15.5" fill="#475569">each client gets its own backend, which returns exactly the shape that client renders and nothing else</text>
</svg>