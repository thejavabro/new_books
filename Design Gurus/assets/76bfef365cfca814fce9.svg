<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five principles applied in order to one checkout class, each step creating the situation the next one addresses">
  <defs>
    <filter id="cap-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cap-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="cap-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <clipPath id="cap-c1"><rect x="60" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cap-c2"><rect x="290" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cap-c3"><rect x="520" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cap-c4"><rect x="750" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cap-c5"><rect x="980" y="130" width="200" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <rect x="40" y="40" width="1160" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One checkout class, five steps, in this order</text>

  <g fill="none" stroke-width="2">
    <path d="M260,175 H282" stroke="#64748B" marker-end="url(#cap-sl)"/>
    <path d="M490,175 H512" stroke="#64748B" marker-end="url(#cap-sl)"/>
    <path d="M720,175 H742" stroke="#64748B" marker-end="url(#cap-sl)"/>
    <path d="M950,175 H972" stroke="#64748B" marker-end="url(#cap-sl)"/>
  </g>

  <text x="160" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">Step 1</text>
  <g filter="url(#cap-soft)">
    <rect x="60" y="130" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="130" width="6" height="90" fill="#64748B" clip-path="url(#cap-c1)"/>
  </g>
  <circle cx="98" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="124" y="182" font-size="18.5" font-weight="600" fill="#111827">SRP</text>
  <text x="160" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">split by actor</text>
  <text x="160" y="268" font-size="15.5" text-anchor="middle" fill="#94A3B8">one class becomes four</text>

  <text x="390" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">Step 2</text>
  <g filter="url(#cap-soft)">
    <rect x="290" y="130" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="290" y="130" width="6" height="90" fill="#64748B" clip-path="url(#cap-c2)"/>
  </g>
  <circle cx="328" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(317.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="354" y="182" font-size="18.5" font-weight="600" fill="#111827">OCP</text>
  <text x="390" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">one class per rule</text>
  <text x="390" y="268" font-size="15.5" text-anchor="middle" fill="#94A3B8">the branch becomes an interface</text>

  <text x="620" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">Step 3</text>
  <g filter="url(#cap-soft)">
    <rect x="520" y="130" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="520" y="130" width="6" height="90" fill="#64748B" clip-path="url(#cap-c3)"/>
  </g>
  <circle cx="558" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="584" y="182" font-size="18.5" font-weight="600" fill="#111827">LSP</text>
  <text x="620" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">every rule keeps the promise</text>
  <text x="620" y="268" font-size="15.5" text-anchor="middle" fill="#94A3B8">a total that is never negative</text>

  <text x="850" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">Step 4</text>
  <g filter="url(#cap-soft)">
    <rect x="750" y="130" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="750" y="130" width="6" height="90" fill="#64748B" clip-path="url(#cap-c4)"/>
  </g>
  <circle cx="788" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="814" y="182" font-size="18.5" font-weight="600" fill="#111827">ISP</text>
  <text x="850" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">narrow the role</text>
  <text x="850" y="268" font-size="15.5" text-anchor="middle" fill="#94A3B8">a save method, not a repository</text>

  <text x="1080" y="115" font-size="15.5" text-anchor="middle" fill="#047857">Step 5</text>
  <g filter="url(#cap-lift)">
    <rect x="980" y="130" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="980" y="130" width="9" height="90" fill="#059669" clip-path="url(#cap-c5)"/>
  </g>
  <circle cx="1020" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(1009.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="1046" y="182" font-size="18.5" font-weight="600" fill="#111827">DIP</text>
  <text x="1080" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">inject from outside</text>
  <text x="1080" y="268" font-size="15.5" text-anchor="middle" fill="#047857">the entry point now chooses</text>

  
  <rect x="40" y="360" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Why this order</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">each step creates the situation the next one addresses, so the sequence is not arbitrary</text>
  <rect x="64" y="428" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="450" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The proof</text>
  <text x="288" y="450" font-size="15.5" fill="#475569">the same Checkout class then runs against a real database and against a test, unchanged</text>
</svg>