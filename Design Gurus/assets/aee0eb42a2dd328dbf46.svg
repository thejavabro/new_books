<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Servers send periodic heartbeats to a monitoring server; one server goes silent, is declared dead, and client traffic is rerouted to the healthy servers">
  <rect x="0" y="0" width="1240" height="1020" fill="#FFFFFF"/>
  <defs>
    <marker id="hb1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="hb1-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="hb1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="340" y1="390" x2="520" y2="114" stroke="#3B82F6" stroke-width="2" marker-end="url(#hb1-blue)"/>
  <text x="400" y="252" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">heartbeat</text>
  <text x="400" y="280" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">every few seconds</text>

  <line x1="620" y1="390" x2="620" y2="114" stroke="#3B82F6" stroke-width="2" marker-end="url(#hb1-blue)"/>

  
  <line x1="900" y1="390" x2="780" y2="270" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="771" y1="261" x2="789" y2="279" stroke="#DC2626" stroke-width="3"/>
  <line x1="771" y1="279" x2="789" y2="261" stroke="#DC2626" stroke-width="3"/>
  <text x="955" y="250" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">heartbeats stopped</text>

  
  <line x1="620" y1="712" x2="620" y2="464" stroke="#059669" stroke-width="2" marker-end="url(#hb1-emerald)"/>
  <text x="578" y="589" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">traffic</text>

  <path d="M590,712 C520,620 420,530 340,466" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#hb1-emerald)"/>
  <text x="460" y="600" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">rerouted traffic</text>

  <line x1="650" y1="712" x2="830" y2="545" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="821" y1="536" x2="839" y2="554" stroke="#DC2626" stroke-width="3"/>
  <line x1="821" y1="554" x2="839" y2="536" stroke="#DC2626" stroke-width="3"/>
  <text x="905" y="620" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">traffic stopped</text>

  
  <g filter="url(#hb1-soft)">
    <rect x="410" y="40" width="420" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Monitoring Server</text>
  <text x="620" y="98" font-size="20" fill="#64748B" text-anchor="middle">tracks each server's last heartbeat</text>

  
  <g filter="url(#hb1-soft)">
    <rect x="210" y="392" width="260" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="490" y="392" width="260" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="770" y="392" width="260" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="340" y="422" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server 1</text>
  <text x="340" y="450" font-size="20" fill="#64748B" text-anchor="middle">healthy</text>
  <text x="620" y="422" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server 2</text>
  <text x="620" y="450" font-size="20" fill="#64748B" text-anchor="middle">healthy</text>
  <text x="900" y="422" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server 3</text>
  <text x="900" y="450" font-size="20" fill="#B91C1C" text-anchor="middle">suspected, then dead</text>

  
  <g filter="url(#hb1-soft)">
    <rect x="500" y="714" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="744" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Clients</text>
  <text x="620" y="772" font-size="20" fill="#64748B" text-anchor="middle">send requests</text>

  
  <rect x="310" y="826" width="620" height="106" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="857" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">No heartbeat from Server 3 within the timeout:</text>
  <text x="620" y="885" font-size="20" fill="#64748B" text-anchor="middle">the system marks it dead, stops routing to it,</text>
  <text x="620" y="912" font-size="20" fill="#64748B" text-anchor="middle">and starts a replacement.</text>

  
  <line x1="210" y1="972" x2="238" y2="972" stroke="#3B82F6" stroke-width="3"/>
  <text x="248" y="979" font-size="20" fill="#475569">heartbeat</text>
  <line x1="396" y1="972" x2="424" y2="972" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="434" y="979" font-size="20" fill="#475569">stopped (no heartbeat / no traffic)</text>
  <line x1="849" y1="972" x2="877" y2="972" stroke="#059669" stroke-width="3"/>
  <text x="887" y="979" font-size="20" fill="#475569">client traffic</text>
</svg>