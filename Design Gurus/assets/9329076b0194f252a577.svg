<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="718" viewBox="0 0 1240 718" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Active-active splits live traffic across both sites so losing one only removes capacity, while active-passive sends everything to the primary and the standby sits idle until a failover promotes it">
  <rect x="0" y="0" width="1240" height="718" fill="#FFFFFF"/>
  <defs>
    <marker id="rl3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rl3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Where the traffic goes today, and what happens when a site dies</text>

  
  <rect x="40" y="76" width="1160" height="270" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#065F46">Active-active: both sites serve live traffic</text>

  <rect x="70" y="160" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="170" y="202" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Traffic</text>
  <line x1="274" y1="180" x2="426" y2="162" stroke="#059669" stroke-width="2" marker-end="url(#rl3-emerald)"/>
  <line x1="274" y1="210" x2="426" y2="248" stroke="#059669" stroke-width="2" marker-end="url(#rl3-emerald)"/>

  <rect x="430" y="130" width="240" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="550" y="168" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Site A, 50%</text>
  <rect x="430" y="220" width="240" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="550" y="258" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Site B, 50%</text>

  <rect x="720" y="130" width="440" height="154" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="940" y="168" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">If Site B dies</text>
  <text x="940" y="204" font-size="20" fill="#065F46" text-anchor="middle">Site A already has traffic and keeps it.</text>
  <text x="940" y="236" font-size="20" fill="#065F46" text-anchor="middle">Nothing is promoted, nothing is started.</text>
  <text x="940" y="268" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">You lost capacity, not availability.</text>

  <text x="620" y="322" font-size="20" fill="#334155" text-anchor="middle">The cost is that both sites must stay consistent while both are taking writes.</text>

  
  <rect x="40" y="366" width="1160" height="270" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="400" font-size="20" font-weight="600" fill="#92400E">Active-passive: one site serves, the other waits</text>

  <rect x="70" y="450" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="170" y="492" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Traffic</text>
  <line x1="274" y1="470" x2="426" y2="452" stroke="#059669" stroke-width="2" marker-end="url(#rl3-emerald)"/>
  <line x1="274" y1="500" x2="426" y2="538" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#rl3-slate)"/>

  <rect x="430" y="420" width="240" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="550" y="458" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Primary, 100%</text>
  <rect x="430" y="510" width="240" height="64" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="550" y="548" font-size="20" fill="#94A3B8" text-anchor="middle">Standby, 0%</text>

  <rect x="720" y="420" width="440" height="154" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="940" y="458" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">If the primary dies</text>
  <text x="940" y="494" font-size="20" fill="#92400E" text-anchor="middle">Detect the failure, promote the standby,</text>
  <text x="940" y="526" font-size="20" fill="#92400E" text-anchor="middle">repoint traffic, warm the caches.</text>
  <text x="940" y="558" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">All of that takes real time.</text>

  <text x="620" y="612" font-size="20" fill="#334155" text-anchor="middle">The standby is simpler and cheaper to reason about, and it is idle every day it is not needed.</text>

  <rect x="40" y="660" width="1160" height="48" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="690" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A standby you never exercise is a guess. Active-active is tested by every request all day.</text>
</svg>