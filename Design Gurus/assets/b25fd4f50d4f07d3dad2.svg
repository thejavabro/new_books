<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="576" viewBox="0 0 1240 576" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same 70B model on two 80 GB GPUs: 16-bit weights leave about 20 GB for KV caches, 8-bit weights leave about 90 GB">
  <defs>
    <marker id="iegm-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="iegm-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="iegm-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="iegm-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="iegm-k1"><rect x="130" y="270" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="iegm-k2"><rect x="770" y="270" width="340" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="576" fill="#FFFFFF"/>
  <rect x="40" y="56" width="520" height="364" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">At 16 bits</text>
  <rect x="680" y="56" width="520" height="364" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="704" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">At 8 bits</text>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M520,178 H720" marker-end="url(#iegm-mviolet)"/></g>
  <text x="80" y="136" font-size="15.5" font-weight="600" fill="#6B7280">two 80 GB GPUs, 160 GB in total</text>
  <g filter="url(#iegm-soft)">
    <path d="M92,150 H465 V206 H92 A12,12 0 0 1 80,194 V162 A12,12 0 0 1 92,150 Z" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <path d="M465,150 H508 A12,12 0 0 1 520,162 V194 A12,12 0 0 1 508,206 H465 Z" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <text x="272.5" y="183" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">Weights, about 140 GB</text>
  <text x="492.5" y="230" font-size="15.5" font-weight="600" text-anchor="middle" fill="#6B7280">about 20 GB left</text>
  <text x="720" y="136" font-size="15.5" font-weight="600" fill="#6B7280">the same two GPUs</text>
  <g filter="url(#iegm-soft)">
    <path d="M732,150 H912.5 V206 H732 A12,12 0 0 1 720,194 V162 A12,12 0 0 1 732,150 Z" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <path d="M912.5,150 H1148 A12,12 0 0 1 1160,162 V194 A12,12 0 0 1 1148,206 H912.5 Z" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <text x="816.25" y="183" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">Weights, about 70 GB</text>
  <text x="1036.25" y="183" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">about 90 GB left</text>
  <g filter="url(#iegm-soft)">
    <rect x="130" y="270" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="130" y="270" width="6" height="90" fill="#059669" clip-path="url(#iegm-k1)"/>
  </g>
  <circle cx="168" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="194" y="322" font-size="18.5" font-weight="600" fill="#111827">KV caches and runtime buffers</text>
  <text x="300" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">only a few long conversations fit</text>
  <g filter="url(#iegm-soft)">
    <rect x="770" y="270" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="770" y="270" width="6" height="90" fill="#059669" clip-path="url(#iegm-k2)"/>
  </g>
  <circle cx="808" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="834" y="322" font-size="18.5" font-weight="600" fill="#111827">KV caches and runtime buffers</text>
  <text x="940" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">more requests fit in each batch</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="164" fill="#5B21B6">quantization</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="202" fill="#5B21B6">16 bits to 8 bits</text></g>
  <rect x="40" y="460" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="505" text-anchor="middle" font-size="16" fill="#475569">Concurrency is often capped by the memory left for KV caches, not by raw compute.</text>
</svg>