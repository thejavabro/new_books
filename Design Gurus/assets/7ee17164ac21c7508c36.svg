<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="926" viewBox="0 0 1240 926" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three audiences for the same product, and what each one costs to change. A private API is called by your own services, so callers are known and reachable and it evolves fastest. A partner API is called by named outside businesses, so changes need notice and a deadline. A public API is called by developers you will never meet, so some changes may never fully land.">
  <defs>
    <filter id="yapiaudienc-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yapiaudienc-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yapiaudienc-k1"><rect x="84" y="182" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="yapiaudienc-k2"><rect x="84" y="402" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="yapiaudienc-k3"><rect x="84" y="622" width="420" height="90" rx="12"/></clipPath>

    <clipPath id="yapiaudienc-r1"><rect x="540" y="188" width="616" height="48" rx="10"/></clipPath>
    <clipPath id="yapiaudienc-r2"><rect x="540" y="252" width="616" height="48" rx="10"/></clipPath>
    <clipPath id="yapiaudienc-r3"><rect x="540" y="408" width="616" height="48" rx="10"/></clipPath>
    <clipPath id="yapiaudienc-r4"><rect x="540" y="472" width="616" height="48" rx="10"/></clipPath>
    <clipPath id="yapiaudienc-r5"><rect x="540" y="628" width="616" height="48" rx="10"/></clipPath>
    <clipPath id="yapiaudienc-r6"><rect x="540" y="692" width="616" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="926" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The same product, three audiences</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">external clients can make changes harder to coordinate</text>

  
  <rect x="44" y="126" width="1152" height="196" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="68" y="156" font-size="16.5" font-weight="600" fill="#047857">Private</text>
  <text x="1172" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">Fastest to evolve</text>

  <g filter="url(#yapiaudienc-lift)">
    <rect x="84" y="182" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="84" y="182" width="9" height="90" fill="#059669" clip-path="url(#yapiaudienc-k1)"/>
  </g>
  <circle cx="122" cy="227" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,216.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="148" y="234" font-size="18.5" font-weight="600" fill="#111827">Your own services and teams</text>
  <text x="294" y="297" text-anchor="middle" font-size="15.5" fill="#6B7280">Inside one company</text>

  <g filter="url(#yapiaudienc-soft)">
    <rect x="540" y="188" width="616" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="540" y="188" width="6" height="48" fill="#059669" clip-path="url(#yapiaudienc-r1)"/>
  </g>
  <circle cx="574" cy="212" r="4.5" fill="#059669"/>
  <text x="598" y="219" font-size="18.5" font-weight="600" fill="#111827">Callers are known and reachable</text>

  <g filter="url(#yapiaudienc-soft)">
    <rect x="540" y="252" width="616" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="540" y="252" width="6" height="48" fill="#059669" clip-path="url(#yapiaudienc-r2)"/>
  </g>
  <circle cx="574" cy="276" r="4.5" fill="#059669"/>
  <text x="598" y="283" font-size="18.5" font-weight="600" fill="#111827">Changes need a release plan</text>

  
  <rect x="44" y="346" width="1152" height="196" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="68" y="376" font-size="16.5" font-weight="600" fill="#B45309">Partner</text>
  <text x="1172" y="376" text-anchor="end" font-size="15.5" fill="#6B7280">Slower to evolve</text>

  <g filter="url(#yapiaudienc-lift)">
    <rect x="84" y="402" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="84" y="402" width="9" height="90" fill="#D97706" clip-path="url(#yapiaudienc-k2)"/>
  </g>
  <circle cx="122" cy="447" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,436.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="148" y="454" font-size="18.5" font-weight="600" fill="#111827">Businesses under an agreement</text>
  <text x="294" y="517" text-anchor="middle" font-size="15.5" fill="#6B7280">Named outside companies</text>

  <g filter="url(#yapiaudienc-soft)">
    <rect x="540" y="408" width="616" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="540" y="408" width="6" height="48" fill="#D97706" clip-path="url(#yapiaudienc-r3)"/>
  </g>
  <circle cx="574" cy="432" r="4.5" fill="#D97706"/>
  <text x="598" y="439" font-size="18.5" font-weight="600" fill="#111827">Callers are known, not controlled</text>

  <g filter="url(#yapiaudienc-soft)">
    <rect x="540" y="472" width="616" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="540" y="472" width="6" height="48" fill="#D97706" clip-path="url(#yapiaudienc-r4)"/>
  </g>
  <circle cx="574" cy="496" r="4.5" fill="#D97706"/>
  <text x="598" y="503" font-size="18.5" font-weight="600" fill="#111827">Changes need notice and a deadline</text>

  
  <rect x="44" y="566" width="1152" height="196" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="68" y="596" font-size="16.5" font-weight="600" fill="#BE185D">Public</text>
  <text x="1172" y="596" text-anchor="end" font-size="15.5" fill="#6B7280">Hardest to evolve</text>

  <g filter="url(#yapiaudienc-lift)">
    <rect x="84" y="622" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="622" width="9" height="90" fill="#DB2777" clip-path="url(#yapiaudienc-k3)"/>
  </g>
  <circle cx="122" cy="667" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,656.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M3 12h18"/>
    <ellipse cx="12" cy="12" rx="4.2" ry="9"/>
  </g>
  <text x="148" y="674" font-size="18.5" font-weight="600" fill="#111827">Developers you never meet</text>
  <text x="294" y="737" text-anchor="middle" font-size="15.5" fill="#6B7280">Anyone who signs up</text>

  <g filter="url(#yapiaudienc-soft)">
    <rect x="540" y="628" width="616" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="540" y="628" width="6" height="48" fill="#DB2777" clip-path="url(#yapiaudienc-r5)"/>
  </g>
  <circle cx="574" cy="652" r="4.5" fill="#DB2777"/>
  <text x="598" y="659" font-size="18.5" font-weight="600" fill="#111827">Callers cannot all be reached</text>

  <g filter="url(#yapiaudienc-soft)">
    <rect x="540" y="692" width="616" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="540" y="692" width="6" height="48" fill="#DB2777" clip-path="url(#yapiaudienc-r6)"/>
  </g>
  <circle cx="574" cy="716" r="4.5" fill="#DB2777"/>
  <text x="598" y="723" font-size="18.5" font-weight="600" fill="#111827">Some clients may not update</text>

  
  <rect x="40" y="786" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="828" text-anchor="middle" font-size="16" fill="#475569">The API's audience affects the effort needed to introduce changes.</text>
  <text x="620" y="856" text-anchor="middle" font-size="16" fill="#475569">One service can publish all three, and the same operation may need a different contract in each.</text>
</svg>