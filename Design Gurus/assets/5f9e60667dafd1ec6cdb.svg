<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="586" viewBox="0 0 1240 586" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sequence-title sequence-desc">
<title id="sequence-title">The decision sequence</title>
<desc id="sequence-desc">Name the workload shape and what Postgres does badly with it, find the Postgres option and its measured threshold, price the second store in engineer time, and build the seam on the way in. Two common outcomes show what the sequence is protecting against.</desc>
<defs>
<marker id="sequence-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sequence-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sequence-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sequence-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="586" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The decision sequence</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Two common outcomes show what the sequence is protecting against.</text>
<rect x="40" y="508" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="508" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="257" height="190" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V302A6 6 0 0 0 46 308H54Z" fill="#5EC9EC"/>
<circle cx="168.5" cy="158" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="168.5" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="168.5" y="210" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">What shape is the</text><text x="168.5" y="235" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">workload, and what does</text><text x="168.5" y="260" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">Postgres do badly with</text><text x="168.5" y="285" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">that shape?</text>
<path d="M303 213H335" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M303 213H335" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="341" y="118" width="257" height="190" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M355 118H347A6 6 0 0 0 341 124V302A6 6 0 0 0 347 308H355Z" fill="#39D5AA"/>
<circle cx="469.5" cy="158" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="469.5" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="469.5" y="210" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">Which Postgres option</text><text x="469.5" y="235" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">addresses it, and at</text><text x="469.5" y="260" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">what measured threshold</text><text x="469.5" y="285" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">does it stop?</text>
<path d="M604 213H636" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M604 213H636" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="642" y="118" width="257" height="190" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M656 118H648A6 6 0 0 0 642 124V302A6 6 0 0 0 648 308H656Z" fill="#F3CF6A"/>
<circle cx="770.5" cy="158" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="770.5" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="770.5" y="210" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">What does the second</text><text x="770.5" y="235" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">store cost in</text><text x="770.5" y="260" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">engineer-time, including</text><text x="770.5" y="285" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">on-call and hiring?</text>
<path d="M905 213H937" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M905 213H937" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="943" y="118" width="257" height="190" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M957 118H949A6 6 0 0 0 943 124V302A6 6 0 0 0 949 308H957Z" fill="#AC8BE8"/>
<circle cx="1071.5" cy="158" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1071.5" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1071.5" y="210" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">If you still adopt it,</text><text x="1071.5" y="235" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">build the seam on the</text><text x="1071.5" y="260" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">way in, not later.</text>
<rect x="40" y="332" width="560" height="150" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="332" width="5" height="150" rx="2.5" fill="#F28B9D"/><text x="64" y="361" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The regret</text><text x="64" y="387" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A search cluster added for a</text><text x="64" y="413" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">documentation search box.</text><text x="64" y="439" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Two years of operating cost for a</text><text x="64" y="465" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">feature tsvector would have served.</text>
<rect x="640" y="332" width="560" height="150" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="332" width="5" height="150" rx="2.5" fill="#39D5AA"/><text x="664" y="361" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The one that worked</text><text x="664" y="387" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">pgvector enabled in the Postgres</text><text x="664" y="413" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">they already ran. Shipped in a week.</text><text x="664" y="439" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Two years later: still adequate,</text><text x="664" y="465" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">still one system to operate.</text>
<text x="66" y="541" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The difference between these two outcomes was not judgment about search engines. It was pricing the second system.</text>
</svg>