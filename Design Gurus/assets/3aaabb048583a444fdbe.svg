<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="844" viewBox="0 0 1240 844" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Eight binary indexed tree slots with the range each one covers, and the three slots that make up a prefix"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="844" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="540" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Slot i covers the last (i and minus i) elements, so a prefix is a few slots</text>
<rect x="200" y="170" width="108" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="254" y="211" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="254" y="160" text-anchor="middle" font-size="17.5" fill="#94A3B8">i &amp; -i = 1</text>
<rect x="320" y="170" width="108" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="374" y="211" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">2</text>
<text x="374" y="160" text-anchor="middle" font-size="17.5" fill="#94A3B8">i &amp; -i = 2</text>
<rect x="440" y="170" width="108" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="494" y="211" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">3</text>
<text x="494" y="160" text-anchor="middle" font-size="17.5" fill="#94A3B8">i &amp; -i = 1</text>
<rect x="560" y="170" width="108" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="614" y="211" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">4</text>
<text x="614" y="160" text-anchor="middle" font-size="17.5" fill="#94A3B8">i &amp; -i = 4</text>
<rect x="680" y="170" width="108" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="734" y="211" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">5</text>
<text x="734" y="160" text-anchor="middle" font-size="17.5" fill="#94A3B8">i &amp; -i = 1</text>
<rect x="800" y="170" width="108" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="854" y="211" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">6</text>
<text x="854" y="160" text-anchor="middle" font-size="17.5" fill="#94A3B8">i &amp; -i = 2</text>
<rect x="920" y="170" width="108" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="974" y="211" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">7</text>
<text x="974" y="160" text-anchor="middle" font-size="17.5" fill="#94A3B8">i &amp; -i = 1</text>
<rect x="1040" y="170" width="108" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="1094" y="211" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">8</text>
<text x="1094" y="160" text-anchor="middle" font-size="17.5" fill="#94A3B8">i &amp; -i = 8</text>
<text x="172" y="213" text-anchor="end" font-size="19.5" font-weight="600" fill="#475569">slot</text>
<text x="172" y="320" text-anchor="end" font-size="19.5" font-weight="600" fill="#1D4ED8">covers</text>
<rect x="206" y="288" width="96" height="24" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<rect x="206" y="316" width="216" height="24" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<rect x="446" y="288" width="96" height="24" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<rect x="206" y="344" width="456" height="24" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<rect x="686" y="288" width="96" height="24" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<rect x="686" y="316" width="216" height="24" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<rect x="926" y="288" width="96" height="24" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<rect x="206" y="372" width="936" height="24" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="200" y="440" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">prefix up to 7  =  slot 7  +  slot 6  +  slot 4</text>
<text x="200" y="476" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">7 drops its lowest bit to 6, then 6 drops to 4, then 4 drops to 0</text>
<text x="200" y="512" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">that is 3 lookups instead of 7, because 7 has 3 bits set</text>
<text x="200" y="566" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">an update walks the other way, adding the lowest bit each step</text>
<rect x="40" y="628" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="650" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="676" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">read for this prefix</text>
<text x="348" y="676" font-size="19.5" fill="#475569">slots 7, 6 and 4 together cover positions 1 to 7</text>
<rect x="64" y="698" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="724" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">not read</text>
<text x="348" y="724" font-size="19.5" fill="#475569">its range is already inside one of the slots above</text>
<rect x="64" y="746" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="772" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">the covered range</text>
<text x="348" y="772" font-size="19.5" fill="#475569">how many elements each slot sums, ending at itself</text>
</svg>