<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="816" viewBox="0 0 1240 816" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pause-title pause-desc">
<title id="pause-title">The pause that breaks every lock</title>
<desc id="pause-desc">A process that stops for longer than its lease resumes believing it still holds the lock, after the service has already granted it to somebody else. The failure happens entirely inside the client, so no lock service can prevent it.</desc>
<defs>
<marker id="pause-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pause-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pause-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pause-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="816" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The pause that breaks every lock</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The failure happens entirely inside the client, so no lock service can prevent it.</text>
<rect x="40" y="738" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="738" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<circle cx="60" cy="144" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="151" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="1110" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="645" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you acquire the lock, with a thirty second lease</text>
<circle cx="60" cy="206" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="213" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="180" width="1110" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="645" y="212" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you begin work</text>
<circle cx="60" cy="268" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="275" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="242" width="1110" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="645" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you stop: garbage collection, a page fault storm, a suspended VM, a partition</text>
<circle cx="60" cy="330" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="337" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="304" width="1110" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="645" y="336" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the lease expires, and the service hands the lock to another process</text>
<circle cx="60" cy="392" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="399" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="366" width="1110" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="645" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the other process begins the same work</text>
<circle cx="60" cy="454" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="461" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="90" y="428" width="1110" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="645" y="460" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you resume, with no knowledge that any time passed, and write</text>
<rect x="40" y="510" width="560" height="96" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="510" width="5" height="96" rx="2.5" fill="#AC8BE8"/><text x="64" y="538" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Nobody is at fault</text><text x="64" y="564" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The lock service did nothing wrong,</text><text x="64" y="590" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and no stronger protocol would help.</text>
<rect x="640" y="510" width="560" height="96" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="510" width="5" height="96" rx="2.5" fill="#F28B9D"/><text x="664" y="538" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The obvious repair fails</text><text x="664" y="564" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The pause can occur between the</text><text x="664" y="590" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">check and the write.</text>
<rect x="40" y="632" width="1160" height="80" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="632" width="5" height="80" rx="2.5" fill="#F3CF6A"/><text x="64" y="663.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Long heap pauses are routine, and a documented incident</text><text x="64" y="692.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">delayed packets by ninety seconds.</text>
<text x="66" y="772" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Safety that requires your process never stops for a minute relies on something nobody can promise.</text>
</svg>