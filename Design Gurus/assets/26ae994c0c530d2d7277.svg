<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="window-title window-desc">
<title id="window-title">The window where both versions run</title>
<desc id="window-desc">A schema change looks like one event and never is. Old and new code read the same data simultaneously, for a period set by the slowest thing being upgraded, and that is a constraint on the change itself.</desc>
<defs>
<marker id="window-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="window-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="window-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="window-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="736" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The window where both versions run</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A schema change looks like one event and never is.</text>
<rect x="40" y="658" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="658" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="300" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="156" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">old code</text>
<path d="M346 150H386" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 150H386" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#window-marker-slate)"/>
<rect x="396" y="112" width="448" height="76" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">both live, reading the same data</text>
<path d="M854 150H894" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M854 150H894" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#window-marker-green)"/>
<rect x="900" y="118" width="300" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1050" y="156" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">new code</text>
<rect x="40" y="212" width="1160" height="92" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="212" width="5" height="92" rx="2.5" fill="#AC8BE8"/><text x="64" y="249.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The change must be compatible with both, in both directions,</text><text x="64" y="278.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">for as long as both are running.</text>
<text x="40" y="362" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And that window is longer than people assume</text>
<rect x="40" y="380" width="560" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a rolling deploy across many instances</text>
<rect x="640" y="380" width="560" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a mobile client upgraded over weeks</text>
<rect x="40" y="452" width="560" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="488" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a consumer owned by another team</text>
<rect x="640" y="452" width="560" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="488" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a rollback three hours later</text>
<rect x="40" y="548" width="1160" height="84" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="548" width="5" height="84" rx="2.5" fill="#39D5AA"/><text x="64" y="581.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The whole subject in one rule</text><text x="64" y="610.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">No change may be required by the new code and fatal to the old.</text>
<text x="66" y="692" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Not a deployment detail. A design constraint on the change.</text>
</svg>