<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="GeoDNS answers the same hostname with a different IP per region, while anycast advertises one IP from every region and lets BGP pick the nearest">
  <rect x="0" y="0" width="1240" height="736" fill="#FFFFFF"/>
  <defs>
    <marker id="lb5-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lb5-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="lb5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two users type the same hostname and reach different data centres</text>

  
  <rect x="40" y="72" width="1160" height="300" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#1E40AF">GeoDNS: the answer differs by who is asking</text>

  <g filter="url(#lb5-soft)">
    <rect x="80" y="150" width="220" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="80" y="256" width="220" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="440" y="186" width="240" height="98" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="190" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User in Paris</text>
  <text x="190" y="296" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User in Tokyo</text>
  <text x="560" y="220" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">GeoDNS</text>
  <text x="560" y="250" font-size="20" fill="#1E40AF" text-anchor="middle">looks up the</text>
  <text x="560" y="274" font-size="20" fill="#1E40AF" text-anchor="middle">client's region</text>

  <line x1="304" y1="182" x2="436" y2="212" stroke="#3B82F6" stroke-width="2" marker-end="url(#lb5-blue)"/>
  <line x1="304" y1="288" x2="436" y2="258" stroke="#3B82F6" stroke-width="2" marker-end="url(#lb5-blue)"/>

  <line x1="684" y1="212" x2="800" y2="182" stroke="#3B82F6" stroke-width="2" marker-end="url(#lb5-blue)"/>
  <line x1="684" y1="258" x2="800" y2="288" stroke="#3B82F6" stroke-width="2" marker-end="url(#lb5-blue)"/>

  <g filter="url(#lb5-soft)">
    <rect x="804" y="150" width="330" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="804" y="256" width="330" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="828" y="190" font-size="20" fill="#065F46" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">203.0.113.9</text>
  <text x="1110" y="190" font-size="20" fill="#065F46" text-anchor="end">Frankfurt</text>
  <text x="828" y="296" font-size="20" fill="#065F46" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">198.51.100.4</text>
  <text x="1110" y="296" font-size="20" fill="#065F46" text-anchor="end">Singapore</text>

  <text x="620" y="350" font-size="20" fill="#475569" text-anchor="middle">Different IPs. You control the policy, but resolvers cache the answer for the whole TTL.</text>

  
  <rect x="40" y="400" width="1160" height="292" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="434" font-size="20" font-weight="600" fill="#5B21B6">Anycast: one IP advertised from everywhere</text>

  <g filter="url(#lb5-soft)">
    <rect x="80" y="478" width="220" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="80" y="584" width="220" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="440" y="514" width="240" height="98" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="190" y="518" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User in Paris</text>
  <text x="190" y="624" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User in Tokyo</text>
  <text x="560" y="548" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Same IP</text>
  <text x="560" y="578" font-size="20" fill="#5B21B6" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">192.0.2.1</text>
  <text x="560" y="602" font-size="20" fill="#5B21B6" text-anchor="middle">BGP decides</text>

  <line x1="304" y1="510" x2="436" y2="540" stroke="#7C3AED" stroke-width="2" marker-end="url(#lb5-violet)"/>
  <line x1="304" y1="616" x2="436" y2="586" stroke="#7C3AED" stroke-width="2" marker-end="url(#lb5-violet)"/>
  <line x1="684" y1="540" x2="800" y2="510" stroke="#7C3AED" stroke-width="2" marker-end="url(#lb5-violet)"/>
  <line x1="684" y1="586" x2="800" y2="616" stroke="#7C3AED" stroke-width="2" marker-end="url(#lb5-violet)"/>

  <g filter="url(#lb5-soft)">
    <rect x="804" y="478" width="330" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="804" y="584" width="330" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="969" y="518" font-size="20" fill="#065F46" text-anchor="middle">Frankfurt edge</text>
  <text x="969" y="624" font-size="20" fill="#065F46" text-anchor="middle">Singapore edge</text>

  <text x="620" y="670" font-size="20" fill="#475569" text-anchor="middle">One IP. The network picks the shortest path, but it cannot see server load, and you cannot steer per country.</text>
</svg>