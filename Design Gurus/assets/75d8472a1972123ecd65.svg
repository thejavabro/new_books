<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="858" viewBox="0 0 1240 858" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="thread-title thread-desc">
<title id="thread-title">Deep without losing the thread</title>
<desc id="thread-desc">The opening sentence is the thread everything attaches to, and coming back up is what distinguishes a candidate who went deep from one who got lost.</desc>
<defs>
<marker id="thread-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="thread-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="thread-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="thread-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="858" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Deep without losing the thread</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The opening sentence is the thread everything attaches to.</text>
<rect x="40" y="780" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="780" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="146.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Open with what the component is for:</text><text x="64" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"this queue exists so a slow downstream cannot reject an order"</text>
<text x="40" y="224" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Then go down one level at a time</text>
<rect x="40" y="242" width="300" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">mechanism</text>
<path d="M346 270H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 270H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#thread-marker-slate)"/>
<rect x="390" y="242" width="810" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="276" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">how it works, in a few sentences</text>
<rect x="40" y="310" width="300" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="190" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">decision</text>
<path d="M346 338H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 338H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#thread-marker-slate)"/>
<rect x="390" y="310" width="810" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="344" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the choice inside it, with the alternative</text>
<rect x="40" y="378" width="300" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="190" y="412" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">detail</text>
<path d="M346 406H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 406H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#thread-marker-slate)"/>
<rect x="390" y="378" width="810" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="412" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the specific value, and why that value</text>
<rect x="40" y="456" width="1160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="490" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Which lets the interviewer stop you at the level they wanted, with two more available</text>
<rect x="40" y="536" width="1160" height="124" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="536" width="5" height="124" rx="2.5" fill="#F3CF6A"/><text x="64" y="565" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Attach each detail to a consequence</text><text x="64" y="591" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"The visibility timeout is thirty seconds, which has to exceed the processing</text><text x="64" y="617" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">time, otherwise the message is redelivered while the first attempt runs,</text><text x="64" y="643" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which is why the handler is idempotent."</text>
<rect x="40" y="684" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="684" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="712" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Then come back up, in ten seconds</text><text x="64" y="738" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Connecting what you said to the property the design needed.</text>
<text x="66" y="814" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Keep the diagram visible and point at it when you return.</text>
</svg>