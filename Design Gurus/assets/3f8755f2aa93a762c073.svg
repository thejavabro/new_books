      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lfp-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lfp-k1"><rect x="56" y="136" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="lfp-k2"><rect x="268" y="136" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="lfp-k3"><rect x="490" y="136" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="lfp-k4"><rect x="712" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lfp-k5"><rect x="986" y="136" width="198" height="90" rx="12"/></clipPath>
    <clipPath id="lfp-k6"><rect x="245" y="380" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="lfp-k7"><rect x="712" y="380" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lfp-k8"><rect x="1004" y="380" width="180" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="718" fill="#FFFFFF"/>
