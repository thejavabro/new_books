  <circle cx="528" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="554" y="188" font-size="18.5" font-weight="600" fill="#111827">Cost controls</text>
  <text x="585" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">cache, precompute, or route</text>
