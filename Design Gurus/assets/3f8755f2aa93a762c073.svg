  <text x="120" y="176.5" font-size="18.5" font-weight="600" fill="#111827">Customer</text>
  <text x="120" y="199.5" font-size="18.5" font-weight="600" fill="#111827">request</text>
  <text x="146" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">through the usual gateway</text>
  <g filter="url(#lfp-soft)">
    <rect x="268" y="136" width="190" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="268" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#lfp-k2)"/>
