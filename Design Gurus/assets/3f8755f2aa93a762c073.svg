  <circle cx="306" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(295.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="332" y="188" font-size="18.5" font-weight="600" fill="#111827">Input checks</text>
  <text x="363" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">moderation and rate limits</text>
  <g filter="url(#lfp-soft)">
    <rect x="490" y="136" width="190" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="490" y="136" width="6" height="90" fill="#D97706" clip-path="url(#lfp-k3)"/>
