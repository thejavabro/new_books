  </g>
  <circle cx="1024" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(1013.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="1050" y="176.5" font-size="18.5" font-weight="600" fill="#111827">Output and</text>
  <text x="1050" y="199.5" font-size="18.5" font-weight="600" fill="#111827">action checks</text>
  <text x="1085" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">citations, action limits, fallbacks</text>
  <g filter="url(#lfp-soft)">
    <rect x="245" y="380" width="236" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="245" y="380" width="6" height="90" fill="#64748B" clip-path="url(#lfp-k6)"/>
  </g>
  <circle cx="283" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(272.56,414.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="309" y="420.5" font-size="18.5" font-weight="600" fill="#111827">Quality</text>
  <text x="309" y="443.5" font-size="18.5" font-weight="600" fill="#111827">measurement</text>
  <text x="363" y="495" font-size="15.5" text-anchor="middle" fill="#6B7280">scores outputs over time</text>
  <g filter="url(#lfp-soft)">
    <rect x="712" y="380" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="712" y="380" width="6" height="90" fill="#7C3AED" clip-path="url(#lfp-k7)"/>
  </g>
  <circle cx="750" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(739.56,414.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="776" y="432" font-size="18.5" font-weight="600" fill="#111827">Feedback loop</text>
  <text x="832" y="495" font-size="15.5" text-anchor="middle" fill="#6B7280">collect, retrain, evaluate, promote</text>
  <g filter="url(#lfp-soft)">
    <rect x="1004" y="380" width="180" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1004" y="380" width="6" height="90" fill="#059669" clip-path="url(#lfp-k8)"/>
  </g>
  <circle cx="1042" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(1031.56,414.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="1068" y="420.5" font-size="18.5" font-weight="600" fill="#111827">Logs and</text>
  <text x="1068" y="443.5" font-size="18.5" font-weight="600" fill="#111827">outcomes</text>
  <text x="1094" y="495" font-size="15.5" text-anchor="middle" fill="#6B7280">every answer and its real result</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1104" y="330" fill="#047857">logged</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="978" y="346" fill="#047857">fresh data</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="978" y="366" fill="#047857">with outcomes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="779" y="556" fill="#047857">outputs and outcomes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="596.5" y="391" fill="#475569">quality drop</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="596.5" y="411" fill="#475569">starts a retrain</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="718" y="330" fill="#5B21B6">next model version</text></g>
  <rect x="40" y="602" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="647" text-anchor="middle" font-size="16" fill="#475569">The classic parts stay. Quality measurement, the feedback loop, cost controls, and the safety checks are the four new pieces.</text>
</svg>