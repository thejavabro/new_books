<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="718" viewBox="0 0 1240 718" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The classic request path stays, with cost controls and safety checks on it, while logs feed quality measurement and a feedback loop that promotes the next model">
  <defs>
    <marker id="lfp-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="lfp-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#047857"/>
    </marker>
