  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M458,181 H490" marker-end="url(#lfp-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M680,181 H712" marker-end="url(#lfp-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M952,181 H986" marker-end="url(#lfp-mslate)"/></g>
  <g fill="none" stroke="#047857" stroke-width="2"><path d="M1094,263 V380" marker-end="url(#lfp-memerald)"/></g>
