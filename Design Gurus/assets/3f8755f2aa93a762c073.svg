  <text x="776" y="188" font-size="18.5" font-weight="600" fill="#111827">Model server</text>
  <text x="832" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a small model or an LLM</text>
  <g filter="url(#lfp-soft)">
    <rect x="986" y="136" width="198" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
