<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Instagram metadata schema: Photo keyed by a bigint PhotoID, User, and the UserFollow relationship table">
<defs>
<filter id="ig1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="ig1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="ig1-msl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="ig1-mind" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<clipPath id="ig1-k1"><rect x="70" y="50" width="470" height="286" rx="12"/></clipPath>
<clipPath id="ig1-k2"><rect x="760" y="50" width="400" height="286" rx="12"/></clipPath>
<clipPath id="ig1-k3"><rect x="760" y="420" width="400" height="142" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="710" fill="#FFFFFF"/>
<path d="M 540,160 H 638 Q 650,160 650,148 V 136 Q 650,124 662,124 H 757" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ig1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="182" fill="#475569">UserID links the photo</text><text x="650" y="204" fill="#475569">to the user who posted it</text></g><path d="M 960,420 V 339" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#ig1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="960" y="384" fill="#4338CA">both columns are UserIDs</text></g><g filter="url(#ig1-lift)">
<rect x="70" y="50" width="470" height="286" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="70" y="50" width="9" height="286" fill="#2563EB" clip-path="url(#ig1-k1)"/>
</g>
<circle cx="108" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,67.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="134" y="85" font-size="18.5" font-weight="600" fill="#111827">Photo (one row per photo)</text><text x="94" y="131" font-size="15.5" fill="#111827">PhotoID</text><text x="516" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">bigint, primary key</text><line x1="84" y1="142" x2="526" y2="142" stroke="#93C5FD" stroke-width="1"/><text x="94" y="167" font-size="15.5" fill="#111827">UserID</text><text x="516" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">int</text><line x1="84" y1="178" x2="526" y2="178" stroke="#93C5FD" stroke-width="1"/><text x="94" y="203" font-size="15.5" fill="#111827">PhotoPath</text><text x="516" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(256)</text><line x1="84" y1="214" x2="526" y2="214" stroke="#93C5FD" stroke-width="1"/><text x="94" y="239" font-size="15.5" fill="#111827">PhotoLatitude, PhotoLongitude</text><text x="516" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">int</text><line x1="84" y1="250" x2="526" y2="250" stroke="#93C5FD" stroke-width="1"/><text x="94" y="275" font-size="15.5" fill="#111827">UserLatitude, UserLongitude</text><text x="516" y="275" font-size="15.5" text-anchor="end" fill="#6B7280">int</text><line x1="84" y1="286" x2="526" y2="286" stroke="#93C5FD" stroke-width="1"/><text x="94" y="311" font-size="15.5" fill="#111827">CreationDate</text><text x="516" y="311" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g filter="url(#ig1-soft)">
<rect x="760" y="50" width="400" height="286" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="760" y="50" width="6" height="286" fill="#64748B" clip-path="url(#ig1-k2)"/>
</g>
<circle cx="798" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,67.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="824" y="85" font-size="18.5" font-weight="600" fill="#111827">User</text><text x="784" y="131" font-size="15.5" fill="#111827">UserID</text><text x="1136" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">int, primary key</text><line x1="774" y1="142" x2="1146" y2="142" stroke="#94A3B8" stroke-width="1"/><text x="784" y="167" font-size="15.5" fill="#111827">Name</text><text x="1136" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(20)</text><line x1="774" y1="178" x2="1146" y2="178" stroke="#94A3B8" stroke-width="1"/><text x="784" y="203" font-size="15.5" fill="#111827">Email</text><text x="1136" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(32)</text><line x1="774" y1="214" x2="1146" y2="214" stroke="#94A3B8" stroke-width="1"/><text x="784" y="239" font-size="15.5" fill="#111827">DateOfBirth</text><text x="1136" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><line x1="774" y1="250" x2="1146" y2="250" stroke="#94A3B8" stroke-width="1"/><text x="784" y="275" font-size="15.5" fill="#111827">CreationDate</text><text x="1136" y="275" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><line x1="774" y1="286" x2="1146" y2="286" stroke="#94A3B8" stroke-width="1"/><text x="784" y="311" font-size="15.5" fill="#111827">LastLogin</text><text x="1136" y="311" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g filter="url(#ig1-soft)">
<rect x="760" y="420" width="400" height="142" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="760" y="420" width="6" height="142" fill="#4F46E5" clip-path="url(#ig1-k3)"/>
</g>
<circle cx="798" cy="448" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,437.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
<text x="824" y="455" font-size="18.5" font-weight="600" fill="#111827">UserFollow</text><text x="784" y="501" font-size="15.5" fill="#111827">UserID1, UserID2</text><text x="1136" y="501" font-size="15.5" text-anchor="end" fill="#6B7280">int, composite key</text><line x1="774" y1="512" x2="1146" y2="512" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="537" font-size="15.5" fill="#111827">(follower, followee)</text><text x="1136" y="537" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes per row</text><rect x="40" y="590" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="616" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="638" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Why bigint?</text><text x="288" y="638" font-size="15.5" fill="#475569">a 32-bit int overflows at about 2.1 billion, and ten years of uploads is about 7.3 billion photos</text>
</svg>