<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="694" viewBox="0 0 1240 694" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The queries as they were asked">
<defs>
<filter id="rf-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="694" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How often does a given value appear inside a given stretch?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Three questions, each naming its own value and its own stretch of [2, 1, 2, 3, 2, 1, 3]</text>
<rect x="40" y="106" width="1160" height="442" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The stretches overlap, so counting each one separately repeats most of the work</text>
<text x="178" y="228" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<rect x="200" y="190" width="108" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="254" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="254" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="322" y="190" width="108" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="376" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="376" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="444" y="190" width="108" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="498" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="498" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="566" y="190" width="108" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<text x="620" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="688" y="190" width="108" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="742" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="742" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="810" y="190" width="108" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="864" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="864" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<rect x="932" y="190" width="108" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="986" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<text x="986" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">6</text>
<text x="314" y="338" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">queries, as asked</text>
<rect x="336" y="300" width="176" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="424" y="336.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">2 in 0 to 4</text>
<text x="424" y="382" text-anchor="middle" font-size="15.5" fill="#94A3B8">asked 1st</text>
<rect x="532" y="300" width="176" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="336.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">3 in 2 to 6</text>
<text x="620" y="382" text-anchor="middle" font-size="15.5" fill="#94A3B8">asked 2nd</text>
<rect x="728" y="300" width="176" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="816" y="336.65" text-anchor="middle" font-size="19" font-weight="600" fill="#111827">1 in 1 to 5</text>
<text x="816" y="382" text-anchor="middle" font-size="15.5" fill="#94A3B8">asked 3rd</text>
<text x="544" y="480" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">counts inside the window</text>
<text x="572" y="479" font-size="18" fill="#475569">nothing in the window yet</text>
<text x="620" y="412" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">One window with a running tally can answer all three, if it visits them in the right order</text>
<rect x="40" y="570" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="610" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Adding or removing one element changes exactly one count</text>
<text x="620" y="642" text-anchor="middle" font-size="18.5" fill="#475569">So moving the window by one position costs one update, not a fresh count</text>
</svg>