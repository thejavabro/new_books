<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1420" viewBox="0 0 1240 1420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Ride-hailing service map: rider and driver apps call one gateway, which reads quotes from Pricing on a 50ms synchronous budget and commits ride requests to Trips; Trips feeds the Matching batch window, publishes trip events to the trips topic consumed by Payouts, and calls Payments to authorize and capture; driver pings flow through a queue into the Location service, which feeds driver positions to Matching and the trip trace to Fares; Fares returns the final fare to Trips.">
  <defs>
    <marker id="m07-l04-ridehailing-architecture-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l04-ridehailing-architecture-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l04-ridehailing-architecture-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l04-ridehailing-architecture-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1420" fill="#FFFFFF"/>

  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="140" y="140" width="300" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="290" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rider app</text>
  <text x="290" y="223" text-anchor="middle" font-size="20" fill="#64748B">sees a price, requests a ride</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="800" y="140" width="300" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="950" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Driver app</text>
  <text x="950" y="223" text-anchor="middle" font-size="20" fill="#64748B">pings, accepts, drives</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="470" y="340" width="300" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="391" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="620" y="423" text-anchor="middle" font-size="20" fill="#64748B">one entry point per app</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <path d="M800,355 L800,455 A150,20 0 0 0 1100,455 L1100,355" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="950" cy="355" rx="150" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="950" y="397" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pings queue</text>
  <text x="950" y="427" text-anchor="middle" font-size="20" fill="#64748B">250,000 a second</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="60" y="560" width="340" height="160" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="230" y="615" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pricing: surge per zone</text>
  <text x="230" y="647" text-anchor="middle" font-size="20" fill="#64748B">quoted before the ride:</text>
  <text x="230" y="679" text-anchor="middle" font-size="20" fill="#64748B">an id, a multiplier, 120s</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="450" y="560" width="380" height="180" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="640" y="609" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Trips: the state machine</text>
  <text x="640" y="641" text-anchor="middle" font-size="20" fill="#64748B">requested, matched, started,</text>
  <text x="640" y="673" text-anchor="middle" font-size="20" fill="#64748B">ended, fare_final, charged</text>
  <text x="640" y="705" text-anchor="middle" font-size="20" fill="#64748B">the multiplier is pinned here</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="880" y="560" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1030" y="605" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Location service</text>
  <text x="1030" y="637" text-anchor="middle" font-size="20" fill="#64748B">one ping every 4 seconds,</text>
  <text x="1030" y="669" text-anchor="middle" font-size="20" fill="#64748B">a thousand times the rides</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <path d="M60,845 L60,945 A160,20 0 0 0 380,945 L380,845" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="220" cy="845" rx="160" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="220" y="887" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Trips topic</text>
  <text x="220" y="917" text-anchor="middle" font-size="20" fill="#64748B">one event per transition</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="430" y="830" width="340" height="160" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="600" y="885" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Matching</text>
  <text x="600" y="917" text-anchor="middle" font-size="20" fill="#64748B">a cell index, then a solve</text>
  <text x="600" y="949" text-anchor="middle" font-size="20" fill="#64748B">over a 1 to 2 second window</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="820" y="830" width="340" height="160" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="990" y="885" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fares: the metered fare</text>
  <text x="990" y="917" text-anchor="middle" font-size="20" fill="#64748B">computed from the GPS trace,</text>
  <text x="990" y="949" text-anchor="middle" font-size="20" fill="#64748B">off the request path</text>

  <rect x="40" y="1045" width="1160" height="210" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="1085" font-size="20" font-weight="600" fill="#334155">The money boundaries</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="200" y="1090" width="400" height="140" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="400" y="1135" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payouts: the driver ledger</text>
  <text x="400" y="1167" text-anchor="middle" font-size="20" fill="#64748B">append-only earnings, paid</text>
  <text x="400" y="1199" text-anchor="middle" font-size="20" fill="#64748B">even if the card declines</text>
  <g filter="url(#m07-l04-ridehailing-architecture-soft)">
    <rect x="680" y="1090" width="400" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="880" y="1135" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments: the rider charge</text>
  <text x="880" y="1167" text-anchor="middle" font-size="20" fill="#64748B">authorize at request time,</text>
  <text x="880" y="1199" text-anchor="middle" font-size="20" fill="#64748B">capture the metered amount</text>

  <g fill="none" stroke-width="2.5">
    <path d="M290,268 C290,300 560,300 560,332" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-ridehailing-architecture-bl)"/>
    <path d="M800,220 C700,220 690,300 700,332" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l04-ridehailing-architecture-bl)"/>
    <path d="M950,268 L950,327" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l04-ridehailing-architecture-ab)"/>
    <path d="M520,460 L520,538 L230,538 L230,544" stroke="#3B82F6" marker-end="url(#m07-l04-ridehailing-architecture-bl)"/>
    <path d="M640,460 L640,552" stroke="#3B82F6" marker-end="url(#m07-l04-ridehailing-architecture-bl)"/>
    <path d="M950,475 C950,510 1030,512 1030,552" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l04-ridehailing-architecture-ab)"/>
    <path d="M550,740 C550,790 220,780 220,817" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-ridehailing-architecture-ab)"/>
    <path d="M650,740 L650,822" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-ridehailing-architecture-ab)"/>
    <path d="M1030,700 L1030,822" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-ridehailing-architecture-ab)"/>
    <path d="M920,700 C900,760 720,772 700,822" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-ridehailing-architecture-ab)"/>
    <path d="M220,965 L220,1082" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l04-ridehailing-architecture-ab)"/>
    <path d="M790,740 L790,1082" stroke="#3B82F6" marker-end="url(#m07-l04-ridehailing-architecture-bl)"/>
    <path d="M900,990 L900,1020 L410,1020 L410,760 L470,760 L470,750" stroke="#059669" marker-end="url(#m07-l04-ridehailing-architecture-em)"/>
    <path d="M450,600 L420,600 L420,505 L40,505 L40,200 L132,200" stroke="#059669" marker-end="url(#m07-l04-ridehailing-architecture-em)"/>
  </g>

  <text x="970" y="300" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">location pings</text>
  <text x="375" y="526" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">quote: a 50 ms budget</text>
  <text x="660" y="510" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">ride request</text>
  <text x="300" y="772" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">trip events</text>
  <text x="670" y="790" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">into the batch</text>
  <text x="1050" y="770" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">trip trace</text>
  <text x="880" y="764" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">driver positions</text>
  <text x="240" y="1030" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fare events</text>
  <text x="770" y="1070" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">authorize and capture</text>
  <text x="620" y="1008" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">final fare</text>
  <text x="60" y="480" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">assignment push</text>

  <line x1="60" y1="1300" x2="96" y2="1300" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1307" font-size="20" fill="#475569">Synchronous: the caller waits, and the quote budget is 50 ms</text>
  <line x1="60" y1="1340" x2="96" y2="1340" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1347" font-size="20" fill="#475569">Queued pings, published events, batch windows: nothing waits</text>
  <line x1="60" y1="1380" x2="96" y2="1380" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1387" font-size="20" fill="#475569">Pushed back out, and the derived amount coming home</text>
</svg>