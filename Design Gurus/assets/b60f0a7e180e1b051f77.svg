<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="624" viewBox="0 0 1240 624" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Circular wait: the booking thread waits for the payments lock, held by the refund thread, which waits for the seats lock, held by the booking thread">
  <defs>
    <filter id="l09wc-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="l09wc-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="l09wc-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="l09wc-k1"><rect x="220" y="110" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="l09wc-k2"><rect x="770" y="110" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="l09wc-k3"><rect x="770" y="350" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="l09wc-k4"><rect x="220" y="350" width="250" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="624" fill="#FFFFFF"/>

  <rect x="140" y="40" width="960" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="164" y="70" font-size="20" font-weight="600" fill="#475569">Circular wait</text>

  <g fill="none" stroke-width="2">
    <path d="M470,155 H770" stroke="#DB2777" marker-end="url(#l09wc-pk)"/>
    <path d="M895,200 V350" stroke="#64748B" marker-end="url(#l09wc-sl)"/>
    <path d="M770,395 H470" stroke="#DB2777" marker-end="url(#l09wc-pk)"/>
    <path d="M345,350 V200" stroke="#64748B" marker-end="url(#l09wc-sl)"/>
  </g>

  <g font-size="20" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="141" text-anchor="middle" fill="#BE185D">waits for</text>
    <text x="909" y="282" fill="#475569">held by</text>
    <text x="620" y="425" text-anchor="middle" fill="#BE185D">waits for</text>
    <text x="331" y="282" text-anchor="end" fill="#475569">held by</text>
  </g>

  <g filter="url(#l09wc-soft)">
    <rect x="220" y="110" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="220" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#l09wc-k1)"/>
  </g>
  <circle cx="258" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(247.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="284" y="162" font-size="20" font-weight="600" fill="#111827">Booking thread</text>
  <g filter="url(#l09wc-soft)">
    <rect x="770" y="110" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="770" y="110" width="6" height="90" fill="#64748B" clip-path="url(#l09wc-k2)"/>
  </g>
  <circle cx="808" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>
  </g>
  <text x="834" y="162" font-size="20" font-weight="600" fill="#111827">Payments lock</text>
  <g filter="url(#l09wc-soft)">
    <rect x="770" y="350" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="770" y="350" width="6" height="90" fill="#7C3AED" clip-path="url(#l09wc-k3)"/>
  </g>
  <circle cx="808" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,384.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="834" y="402" font-size="20" font-weight="600" fill="#111827">Refund thread</text>
  <g filter="url(#l09wc-soft)">
    <rect x="220" y="350" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="220" y="350" width="6" height="90" fill="#64748B" clip-path="url(#l09wc-k4)"/>
  </g>
  <circle cx="258" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(247.56,384.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>
  </g>
  <text x="284" y="402" font-size="20" font-weight="600" fill="#111827">Seats lock</text>

  <rect x="40" y="514" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="559" text-anchor="middle" font-size="20" fill="#475569">Each thread waits for a lock that the other thread holds, so the loop never ends.</text>
</svg>