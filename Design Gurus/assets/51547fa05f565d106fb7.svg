<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Before and after of extracting image processing from a Rails monolith into an image service on GPU instances behind a job queue, so upload spikes no longer slow down checkout">
  <defs>
    <marker id="m01-l06-image-processing-split-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m01-l06-image-processing-split-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m01-l06-image-processing-split-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m01-l06-image-processing-split-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m01-l06-image-processing-split-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#FFFFFF"/>

  
  <rect x="40" y="70" width="560" height="520" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="108" font-size="20" font-weight="600" fill="#334155">Before: processing inside the monolith</text>

  <rect x="640" y="70" width="560" height="690" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="662" y="108" font-size="20" font-weight="600" fill="#334155">After: one targeted extraction</text>

  
  <g fill="none" stroke-width="2.5">
    
    <path d="M185,204 C185,228 240,226 240,250" stroke="#3B82F6" marker-end="url(#m01-l06-image-processing-split-blue)"/>
    <path d="M440,204 C440,228 360,226 360,250" stroke="#3B82F6" marker-end="url(#m01-l06-image-processing-split-blue)"/>
    <path d="M300,380 L300,470" stroke="#DC2626" stroke-width="3" marker-end="url(#m01-l06-image-processing-split-red)"/>
    
    <path d="M785,204 C785,228 840,226 840,250" stroke="#3B82F6" marker-end="url(#m01-l06-image-processing-split-blue)"/>
    <path d="M1040,204 C1040,228 960,226 960,250" stroke="#3B82F6" marker-end="url(#m01-l06-image-processing-split-blue)"/>
    <path d="M850,350 C850,392 795,388 795,430" stroke="#D97706" marker-end="url(#m01-l06-image-processing-split-amber)"/>
    <path d="M950,350 C950,392 1070,388 1070,430" stroke="#059669" stroke-width="3" marker-end="url(#m01-l06-image-processing-split-em)"/>
    <path d="M795,530 L795,600" stroke="#D97706" marker-end="url(#m01-l06-image-processing-split-amber)"/>
  </g>

  
  <g font-size="20" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="300" y="432" text-anchor="middle" fill="#B91C1C">spike eats shared compute</text>
    <text x="720" y="402" text-anchor="middle" fill="#92400E">enqueue job</text>
    <text x="815" y="572" fill="#92400E">image + job spec</text>
  </g>

  
  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="70" y="140" width="230" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="185" y="179" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Upload spike</text>

  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="350" y="140" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="440" y="179" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Buyer</text>

  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="100" y="250" width="400" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="300" y="292" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rails monolith</text>
  <text x="300" y="322" text-anchor="middle" font-size="20" fill="#64748B">with image processing inside</text>
  <text x="300" y="352" text-anchor="middle" font-size="20" fill="#64748B">80% of compute, needs GPU</text>

  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="140" y="470" width="320" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="300" y="512" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout slows down</text>

  
  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="670" y="140" width="230" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="785" y="179" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Upload spike</text>

  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="950" y="140" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1040" y="179" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Buyer</text>

  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="700" y="250" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="900" y="292" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rails monolith</text>
  <text x="900" y="322" text-anchor="middle" font-size="20" fill="#64748B">back on cheap CPU instances</text>

  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="670" y="430" width="250" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="795" y="472" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Job queue</text>
  <text x="795" y="502" text-anchor="middle" font-size="20" fill="#64748B">absorbs the spikes</text>

  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="940" y="430" width="260" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1070" y="472" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout stays fast</text>
  <text x="1070" y="502" text-anchor="middle" font-size="20" fill="#64748B">spikes never touch it</text>

  <g filter="url(#m01-l06-image-processing-split-soft)">
    <rect x="655" y="600" width="280" height="130" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="795" y="642" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Image service</text>
  <text x="795" y="672" text-anchor="middle" font-size="20" fill="#64748B">on GPU instances</text>
  <text x="795" y="702" text-anchor="middle" font-size="20" fill="#64748B">scales independently</text>

  
  <g stroke-width="4">
    <line x1="40" y1="815" x2="74" y2="815" stroke="#3B82F6"/>
    <line x1="350" y1="815" x2="384" y2="815" stroke="#D97706"/>
    <line x1="680" y1="815" x2="714" y2="815" stroke="#DC2626"/>
    <line x1="940" y1="815" x2="974" y2="815" stroke="#059669"/>
  </g>
  <text x="84" y="822" font-size="20" fill="#475569">Live request traffic</text>
  <text x="394" y="822" font-size="20" fill="#475569">Async job path (queue)</text>
  <text x="724" y="822" font-size="20" fill="#475569">Failure outcome</text>
  <text x="984" y="822" font-size="20" fill="#475569">Success outcome</text>
</svg>