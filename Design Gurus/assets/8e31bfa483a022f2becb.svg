<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1096" viewBox="0 0 1240 1096" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A comparison of API key, opaque token and signed token across caller, verification, ordinary lifetime, immediate withdrawal and main cost. The signed token needs no lookup per call, but that is exactly why it normally cannot be withdrawn before it expires.">
  <defs>
    <filter id="p1a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1a-k1"><rect x="64" y="122" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p1a-k2"><rect x="450" y="122" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p1a-k3"><rect x="836" y="122" width="340" height="90" rx="12"/></clipPath>

    <clipPath id="p1a-k4"><rect x="64" y="284" width="340" height="56" rx="11"/></clipPath>
