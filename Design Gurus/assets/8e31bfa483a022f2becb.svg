    <clipPath id="p1a-k6"><rect x="836" y="284" width="340" height="56" rx="11"/></clipPath>

    <clipPath id="p1a-k7"><rect x="64" y="426" width="340" height="56" rx="11"/></clipPath>
    <clipPath id="p1a-k8"><rect x="450" y="426" width="340" height="56" rx="11"/></clipPath>
    <clipPath id="p1a-k9"><rect x="836" y="426" width="340" height="56" rx="11"/></clipPath>

    <clipPath id="p1a-k10"><rect x="64" y="568" width="340" height="56" rx="11"/></clipPath>
    <clipPath id="p1a-k11"><rect x="450" y="568" width="340" height="56" rx="11"/></clipPath>
    <clipPath id="p1a-k12"><rect x="836" y="568" width="340" height="56" rx="11"/></clipPath>

    <clipPath id="p1a-k13"><rect x="64" y="710" width="340" height="56" rx="11"/></clipPath>
    <clipPath id="p1a-k14"><rect x="450" y="710" width="340" height="56" rx="11"/></clipPath>
    <clipPath id="p1a-k15"><rect x="836" y="710" width="340" height="56" rx="11"/></clipPath>

    <clipPath id="p1a-k16"><rect x="64" y="852" width="340" height="56" rx="11"/></clipPath>
    <clipPath id="p1a-k17"><rect x="450" y="852" width="340" height="56" rx="11"/></clipPath>
    <clipPath id="p1a-k18"><rect x="836" y="852" width="340" height="56" rx="11"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1096" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Choosing a credential</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">pink marks what the signed token costs you</text>

  
  <g filter="url(#p1a-soft)">
    <rect x="64" y="122" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="122" width="6" height="90" fill="#2563EB" clip-path="url(#p1a-k1)"/>
  </g>
  <circle cx="102" cy="167" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,156.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7.5" cy="16.5" r="4.5"/>
    <path d="M10.7 13.3L20.5 3.5"/>
    <path d="M14.8 9.2l3 3"/>
    <path d="M17.4 6.6l3 3"/>
  </g>
  <text x="128" y="174" font-size="18.5" font-weight="600" fill="#111827">API key</text>

  <g filter="url(#p1a-soft)">
    <rect x="450" y="122" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="122" width="6" height="90" fill="#D97706" clip-path="url(#p1a-k2)"/>
  </g>
  <circle cx="488" cy="167" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,156.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="514" y="174" font-size="18.5" font-weight="600" fill="#111827">Opaque token</text>

  <g filter="url(#p1a-soft)">
    <rect x="836" y="122" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="836" y="122" width="6" height="90" fill="#7C3AED" clip-path="url(#p1a-k3)"/>
  </g>
  <circle cx="874" cy="167" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,156.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="900" y="174" font-size="18.5" font-weight="600" fill="#111827">Signed token</text>

  
  <rect x="40" y="236" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="266" font-size="16.5" font-weight="600" fill="#475569">Caller</text>

  <g filter="url(#p1a-soft)">
    <rect x="64" y="284" width="340" height="56" rx="11" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="284" width="6" height="56" fill="#2563EB" clip-path="url(#p1a-k4)"/>
  </g>
  <circle cx="98" cy="312" r="4.5" fill="#2563EB"/>
  <text x="122" y="319" font-size="18.5" font-weight="600" fill="#111827">A server program</text>

  <g filter="url(#p1a-soft)">
    <rect x="450" y="284" width="340" height="56" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="284" width="6" height="56" fill="#D97706" clip-path="url(#p1a-k5)"/>
  </g>
  <circle cx="484" cy="312" r="4.5" fill="#D97706"/>
  <text x="508" y="319" font-size="18.5" font-weight="600" fill="#111827">A session or app</text>

  <g filter="url(#p1a-soft)">
    <rect x="836" y="284" width="340" height="56" rx="11" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="836" y="284" width="6" height="56" fill="#7C3AED" clip-path="url(#p1a-k6)"/>
  </g>
  <circle cx="870" cy="312" r="4.5" fill="#7C3AED"/>
  <text x="894" y="319" font-size="18.5" font-weight="600" fill="#111827">Many services</text>

  
  <rect x="40" y="378" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="408" font-size="16.5" font-weight="600" fill="#475569">Verification</text>

  <g filter="url(#p1a-soft)">
    <rect x="64" y="426" width="340" height="56" rx="11" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="426" width="6" height="56" fill="#2563EB" clip-path="url(#p1a-k7)"/>
  </g>
  <circle cx="98" cy="454" r="4.5" fill="#2563EB"/>
  <text x="122" y="461" font-size="18.5" font-weight="600" fill="#111827">Provider lookup</text>

  <g filter="url(#p1a-soft)">
    <rect x="450" y="426" width="340" height="56" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="426" width="6" height="56" fill="#D97706" clip-path="url(#p1a-k8)"/>
  </g>
  <circle cx="484" cy="454" r="4.5" fill="#D97706"/>
  <text x="508" y="461" font-size="18.5" font-weight="600" fill="#111827">Provider lookup</text>

  <g filter="url(#p1a-soft)">
    <rect x="836" y="426" width="340" height="56" rx="11" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="836" y="426" width="6" height="56" fill="#7C3AED" clip-path="url(#p1a-k9)"/>
  </g>
  <circle cx="870" cy="454" r="4.5" fill="#7C3AED"/>
  <text x="894" y="461" font-size="18.5" font-weight="600" fill="#111827">Local signature check</text>

  
  <rect x="40" y="520" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="550" font-size="16.5" font-weight="600" fill="#475569">Ordinary lifetime</text>

  <g filter="url(#p1a-soft)">
    <rect x="64" y="568" width="340" height="56" rx="11" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="568" width="6" height="56" fill="#2563EB" clip-path="url(#p1a-k10)"/>
  </g>
  <circle cx="98" cy="596" r="4.5" fill="#2563EB"/>
  <text x="122" y="603" font-size="18.5" font-weight="600" fill="#111827">Long</text>

  <g filter="url(#p1a-soft)">
    <rect x="450" y="568" width="340" height="56" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="568" width="6" height="56" fill="#D97706" clip-path="url(#p1a-k11)"/>
  </g>
  <circle cx="484" cy="596" r="4.5" fill="#D97706"/>
  <text x="508" y="603" font-size="18.5" font-weight="600" fill="#111827">Short</text>

  <g filter="url(#p1a-soft)">
    <rect x="836" y="568" width="340" height="56" rx="11" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="836" y="568" width="6" height="56" fill="#7C3AED" clip-path="url(#p1a-k12)"/>
  </g>
  <circle cx="870" cy="596" r="4.5" fill="#7C3AED"/>
  <text x="894" y="603" font-size="18.5" font-weight="600" fill="#111827">Short</text>

  
  <rect x="40" y="662" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="692" font-size="16.5" font-weight="600" fill="#475569">Withdraw early</text>

  <g filter="url(#p1a-soft)">
    <rect x="64" y="710" width="340" height="56" rx="11" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="710" width="6" height="56" fill="#2563EB" clip-path="url(#p1a-k13)"/>
  </g>
  <circle cx="98" cy="738" r="4.5" fill="#2563EB"/>
  <text x="122" y="745" font-size="18.5" font-weight="600" fill="#111827">Yes, mark revoked</text>

  <g filter="url(#p1a-soft)">
    <rect x="450" y="710" width="340" height="56" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="710" width="6" height="56" fill="#D97706" clip-path="url(#p1a-k14)"/>
  </g>
  <circle cx="484" cy="738" r="4.5" fill="#D97706"/>
  <text x="508" y="745" font-size="18.5" font-weight="600" fill="#111827">Yes, immediately</text>

  <g filter="url(#p1a-lift)">
    <rect x="836" y="710" width="340" height="56" rx="11" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="836" y="710" width="9" height="56" fill="#DB2777" clip-path="url(#p1a-k15)"/>
  </g>
  <circle cx="870" cy="738" r="4.5" fill="#DB2777"/>
  <text x="894" y="745" font-size="18.5" font-weight="600" fill="#111827">Not without a lookup</text>

  
  <rect x="40" y="804" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="834" font-size="16.5" font-weight="600" fill="#475569">Main cost</text>

  <g filter="url(#p1a-soft)">
    <rect x="64" y="852" width="340" height="56" rx="11" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="852" width="6" height="56" fill="#2563EB" clip-path="url(#p1a-k16)"/>
  </g>
  <circle cx="98" cy="880" r="4.5" fill="#2563EB"/>
  <text x="122" y="887" font-size="18.5" font-weight="600" fill="#111827">A long-lived secret</text>

  <g filter="url(#p1a-soft)">
    <rect x="450" y="852" width="340" height="56" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="852" width="6" height="56" fill="#D97706" clip-path="url(#p1a-k17)"/>
  </g>
  <circle cx="484" cy="880" r="4.5" fill="#D97706"/>
  <text x="508" y="887" font-size="18.5" font-weight="600" fill="#111827">A lookup per call</text>

  <g filter="url(#p1a-lift)">
    <rect x="836" y="852" width="340" height="56" rx="11" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="836" y="852" width="9" height="56" fill="#DB2777" clip-path="url(#p1a-k18)"/>
  </g>
  <circle cx="870" cy="880" r="4.5" fill="#DB2777"/>
  <text x="894" y="887" font-size="18.5" font-weight="600" fill="#111827">Hard to withdraw early</text>

  
  <rect x="40" y="956" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="998" text-anchor="middle" font-size="16" fill="#475569">The signed token avoids a lookup on every call.</text>
  <text x="620" y="1026" text-anchor="middle" font-size="16" fill="#475569">That is the same reason it cannot be withdrawn before it expires.</text>
</svg>