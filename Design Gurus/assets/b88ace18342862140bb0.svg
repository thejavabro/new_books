<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1550" viewBox="0 0 1240 1550" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Facebook Newsfeed data model: FeedItem, User, Entity, UserFollow, FeedMedia and Media tables in the relational database, blob storage for media files, and the per-user feed entry kept in memory">
