<text x="154" y="757" font-size="18.5" font-weight="600" fill="#111827">Media (one row per file)</text><text x="114" y="803" font-size="15.5" fill="#111827">MediaID</text><text x="526" y="803" font-size="15.5" text-anchor="end" fill="#6B7280">int, primary key</text><line x1="104" y1="814" x2="536" y2="814" stroke="#FCD34D" stroke-width="1"/><text x="114" y="839" font-size="15.5" fill="#111827">Type</text><text x="526" y="839" font-size="15.5" text-anchor="end" fill="#6B7280">smallint: photo or video</text><line x1="104" y1="850" x2="536" y2="850" stroke="#FCD34D" stroke-width="1"/><text x="114" y="875" font-size="15.5" fill="#111827">Path</text><text x="526" y="875" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(256), the file location</text><line x1="104" y1="886" x2="536" y2="886" stroke="#FCD34D" stroke-width="1"/><text x="114" y="911" font-size="15.5" fill="#111827">Description, Location, CreationDate</text><text x="526" y="911" font-size="15.5" text-anchor="end" fill="#6B7280">metadata</text><g filter="url(#fn1-soft)">
<rect x="720" y="115" width="440" height="250" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="720" y="115" width="6" height="250" fill="#64748B" clip-path="url(#fn1-k4)"/>
</g>
<circle cx="758" cy="143" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,132.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="784" y="150" font-size="18.5" font-weight="600" fill="#111827">User</text><text x="744" y="196" font-size="15.5" fill="#111827">UserID</text><text x="1136" y="196" font-size="15.5" text-anchor="end" fill="#6B7280">int, primary key</text><line x1="734" y1="207" x2="1146" y2="207" stroke="#94A3B8" stroke-width="1"/><text x="744" y="232" font-size="15.5" fill="#111827">Name</text><text x="1136" y="232" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(20)</text><line x1="734" y1="243" x2="1146" y2="243" stroke="#94A3B8" stroke-width="1"/><text x="744" y="268" font-size="15.5" fill="#111827">Email</text><text x="1136" y="268" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(32)</text><line x1="734" y1="279" x2="1146" y2="279" stroke="#94A3B8" stroke-width="1"/><text x="744" y="304" font-size="15.5" fill="#111827">DateOfBirth</text><text x="1136" y="304" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><line x1="734" y1="315" x2="1146" y2="315" stroke="#94A3B8" stroke-width="1"/><text x="744" y="340" font-size="15.5" fill="#111827">CreationDate, LastLogin</text><text x="1136" y="340" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g filter="url(#fn1-lift)">
<rect x="720" y="455" width="440" height="142" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
<rect x="720" y="455" width="9" height="142" fill="#4F46E5" clip-path="url(#fn1-k5)"/>
</g>
<circle cx="758" cy="483" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,472.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
<text x="784" y="490" font-size="18.5" font-weight="600" fill="#111827">UserFollow (one row per follow)</text><text x="744" y="536" font-size="15.5" fill="#111827">UserID, EntityOrFriendID</text><text x="1136" y="536" font-size="15.5" text-anchor="end" fill="#6B7280">int, composite key</text><line x1="734" y1="547" x2="1146" y2="547" stroke="#A5B4FC" stroke-width="1"/><text x="744" y="572" font-size="15.5" fill="#111827">Type</text><text x="1136" y="572" font-size="15.5" text-anchor="end" fill="#6B7280">tinyint: user or entity</text><g filter="url(#fn1-soft)">
<rect x="720" y="690" width="440" height="286" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="720" y="690" width="6" height="286" fill="#7C3AED" clip-path="url(#fn1-k6)"/>
</g>
<circle cx="758" cy="718" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,707.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
<text x="784" y="725" font-size="18.5" font-weight="600" fill="#111827">Entity (a page or a group)</text><text x="744" y="771" font-size="15.5" fill="#111827">EntityID</text><text x="1136" y="771" font-size="15.5" text-anchor="end" fill="#6B7280">int, primary key</text><line x1="734" y1="782" x2="1146" y2="782" stroke="#C4B5FD" stroke-width="1"/><text x="744" y="807" font-size="15.5" fill="#111827">Name</text><text x="1136" y="807" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(20)</text><line x1="734" y1="818" x2="1146" y2="818" stroke="#C4B5FD" stroke-width="1"/><text x="744" y="843" font-size="15.5" fill="#111827">Type</text><text x="1136" y="843" font-size="15.5" text-anchor="end" fill="#6B7280">tinyint: page or group</text><line x1="734" y1="854" x2="1146" y2="854" stroke="#C4B5FD" stroke-width="1"/><text x="744" y="879" font-size="15.5" fill="#111827">Description</text><text x="1136" y="879" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(512)</text><line x1="734" y1="890" x2="1146" y2="890" stroke="#C4B5FD" stroke-width="1"/><text x="744" y="915" font-size="15.5" fill="#111827">Category, Phone, Email</text><text x="1136" y="915" font-size="15.5" text-anchor="end" fill="#6B7280">profile fields</text><line x1="734" y1="926" x2="1146" y2="926" stroke="#C4B5FD" stroke-width="1"/><text x="744" y="951" font-size="15.5" fill="#111827">CreationDate</text><text x="1136" y="951" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g stroke="#64748B" stroke-width="1.5">
<path d="M 90,1075 L 90,1159 A 150,16 0 0 0 390,1159 L 390,1075" fill="#E2E8F0"/>
<ellipse cx="240" cy="1075" rx="150" ry="16" fill="#F8FAFC"/>
</g>
<text x="240" y="1139" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Blob storage</text><text x="240" y="1200" font-size="15.5" text-anchor="middle" fill="#6B7280">the photo and video bytes; a Media row keeps only the Path</text><g filter="url(#fn1-soft)">
<rect x="610" y="1120" width="540" height="178" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="610" y="1120" width="6" height="178" fill="#2563EB" clip-path="url(#fn1-k7)"/>
</g>
<circle cx="648" cy="1148" r="18" fill="#FFFFFF"/>
<g transform="translate(637.56,1137.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
<text x="674" y="1155" font-size="18.5" font-weight="600" fill="#111827">Feed hash table entry (one per user)</text><text x="634" y="1201" font-size="15.5" fill="#111827">UserID</text><text x="1126" y="1201" font-size="15.5" text-anchor="end" fill="#6B7280">the hash table key</text><line x1="624" y1="1212" x2="1136" y2="1212" stroke="#93C5FD" stroke-width="1"/><text x="634" y="1237" font-size="15.5" fill="#111827">feedItems</text><text x="1126" y="1237" font-size="15.5" text-anchor="end" fill="#6B7280">LinkedHashMap&lt;FeedItemID, FeedItem&gt;</text><line x1="624" y1="1248" x2="1136" y2="1248" stroke="#93C5FD" stroke-width="1"/><text x="634" y="1273" font-size="15.5" fill="#111827">lastGenerated</text><text x="1126" y="1273" font-size="15.5" text-anchor="end" fill="#6B7280">DateTime, generation resumes here</text><text x="880" y="1323" font-size="15.5" text-anchor="middle" fill="#6B7280">up to 500 items per user, about 500 KB of memory</text><rect x="40" y="1380" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="1406" width="200" height="32" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/><text x="164" y="1428" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">Two kinds of follow</text><text x="288" y="1428" font-size="15.5" fill="#475569">friendships and page or group follows share one table; the Type column says which kind each row is</text><rect x="64" y="1450" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="1472" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Derived, not a table</text><text x="288" y="1472" font-size="15.5" fill="#475569">the newsfeed generation service builds the per-user feed from these tables and keeps it in memory</text>
</svg>