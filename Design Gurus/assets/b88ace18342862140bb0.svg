<clipPath id="fn1-k4"><rect x="720" y="115" width="440" height="250" rx="12"/></clipPath>
<clipPath id="fn1-k5"><rect x="720" y="455" width="440" height="142" rx="12"/></clipPath>
<clipPath id="fn1-k6"><rect x="720" y="690" width="440" height="286" rx="12"/></clipPath>
