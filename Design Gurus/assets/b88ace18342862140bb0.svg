<text x="154" y="150" font-size="18.5" font-weight="600" fill="#111827">FeedItem (one row per post)</text><text x="114" y="196" font-size="15.5" fill="#111827">FeedItemID</text><text x="526" y="196" font-size="15.5" text-anchor="end" fill="#6B7280">int, primary key</text><line x1="104" y1="207" x2="536" y2="207" stroke="#93C5FD" stroke-width="1"/><text x="114" y="232" font-size="15.5" fill="#111827">UserID</text><text x="526" y="232" font-size="15.5" text-anchor="end" fill="#6B7280">int, the author</text><line x1="104" y1="243" x2="536" y2="243" stroke="#93C5FD" stroke-width="1"/><text x="114" y="268" font-size="15.5" fill="#111827">EntityID</text><text x="526" y="268" font-size="15.5" text-anchor="end" fill="#6B7280">int, optional</text><line x1="104" y1="279" x2="536" y2="279" stroke="#93C5FD" stroke-width="1"/><text x="114" y="304" font-size="15.5" fill="#111827">Contents</text><text x="526" y="304" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(256)</text><line x1="104" y1="315" x2="536" y2="315" stroke="#93C5FD" stroke-width="1"/><text x="114" y="340" font-size="15.5" fill="#111827">LocationLatitude, Longitude</text><text x="526" y="340" font-size="15.5" text-anchor="end" fill="#6B7280">int, optional</text><line x1="104" y1="351" x2="536" y2="351" stroke="#93C5FD" stroke-width="1"/><text x="114" y="376" font-size="15.5" fill="#111827">CreationDate</text><text x="526" y="376" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><line x1="104" y1="387" x2="536" y2="387" stroke="#93C5FD" stroke-width="1"/><text x="114" y="412" font-size="15.5" fill="#111827">NumLikes</text><text x="526" y="412" font-size="15.5" text-anchor="end" fill="#6B7280">int, a like counter</text><text x="320" y="462" font-size="15.5" text-anchor="middle" fill="#6B7280">about 1 KB per post: the text plus its metadata</text><g filter="url(#fn1-soft)">
<rect x="90" y="540" width="460" height="106" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="90" y="540" width="6" height="106" fill="#D97706" clip-path="url(#fn1-k2)"/>
</g>
<circle cx="128" cy="568" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,557.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
<text x="154" y="575" font-size="18.5" font-weight="600" fill="#111827">FeedMedia (links posts to media)</text><text x="114" y="621" font-size="15.5" fill="#111827">FeedItemID, MediaID</text><text x="526" y="621" font-size="15.5" text-anchor="end" fill="#6B7280">int, composite key</text><g filter="url(#fn1-soft)">
<rect x="90" y="722" width="460" height="214" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="90" y="722" width="6" height="214" fill="#D97706" clip-path="url(#fn1-k3)"/>
</g>
<circle cx="128" cy="750" r="18" fill="#FFFFFF"/>
