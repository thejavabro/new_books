<rect x="40" y="50" width="1160" height="955" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="64" y="80" font-size="16.5" font-weight="600" fill="#475569">Relational database tables</text><rect x="560" y="1055" width="640" height="288" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><text x="584" y="1085" font-size="16.5" font-weight="600" fill="#1D4ED8">Feed cache, in memory</text><path d="M 550,225 H 623 Q 635,225 635,213 V 201 Q 635,189 647,189 H 717" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#fn1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="635" y="150" fill="#475569">UserID points</text><text x="635" y="172" fill="#475569">to the author</text></g><path d="M 550,261 H 623 Q 635,261 635,273 V 752 Q 635,764 647,764 H 717" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#fn1-mvio)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="635" y="490" fill="#5B21B6">the page or group</text><text x="635" y="512" fill="#5B21B6">where it was posted</text></g><path d="M 940,455 V 368" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#fn1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="940" y="419" fill="#4338CA">UserID is the follower</text></g><path d="M 940,597 V 687" fill="none" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#fn1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="940" y="630" fill="#4338CA">EntityOrFriendID names who is followed,</text><text x="940" y="652" fill="#4338CA">Type says which kind</text></g><path d="M 120,540 V 440" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#fn1-mamb)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="305" y="510" fill="#B45309">FeedItemID names the post</text></g><path d="M 120,646 V 719" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#fn1-mamb)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="305" y="695" fill="#B45309">MediaID names the file</text></g><path d="M 320,936 V 1056" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#fn1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="420" y="1038" fill="#475569">Path points here</text></g><g filter="url(#fn1-soft)">
<rect x="90" y="115" width="460" height="322" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="90" y="115" width="6" height="322" fill="#2563EB" clip-path="url(#fn1-k1)"/>
</g>
