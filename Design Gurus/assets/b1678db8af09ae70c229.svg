<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="778" viewBox="0 0 1240 778" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="statemachine-title statemachine-desc">
<title id="statemachine-title">The consumer as a state machine</title>
<desc id="statemachine-desc">Modeling the entity lifecycle makes illegal transitions impossible by design, which handles duplicates and out-of-order delivery with one mechanism. A zero-row update carries three different meanings that need different handling.</desc>
<defs>
<marker id="statemachine-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="statemachine-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="statemachine-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="statemachine-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="778" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The consumer as a state machine</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Modeling the entity lifecycle makes illegal transitions impossible by design.</text>
<rect x="40" y="700" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="700" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="230" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="155" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">created</text>
<path d="M276 146H344" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M276 146H344" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#statemachine-marker-slate)"/>
<rect x="350" y="118" width="230" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="465" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">paid</text>
<path d="M586 146H654" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M586 146H654" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#statemachine-marker-slate)"/>
<rect x="660" y="118" width="230" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="775" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">shipped</text>
<path d="M896 146H964" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M896 146H964" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#statemachine-marker-slate)"/>
<rect x="970" y="118" width="230" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1085" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">delivered</text>
<rect x="40" y="198" width="1160" height="128" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 198H46A6 6 0 0 0 40 204V320A6 6 0 0 0 46 326H54Z" fill="#39D5AA"/><text x="70" y="234" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">A transition is legal only from specific prior states</text>
<rect x="70" y="254" width="1100" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="90" y="288" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">UPDATE orders SET status = 'shipped' WHERE id = :id AND status IN ('paid')</text>
<text x="40" y="368" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Zero rows updated is information, and it has three meanings</text>
<rect x="40" y="386" width="372" height="104" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 386H46A6 6 0 0 0 40 392V484A6 6 0 0 0 46 490H54Z" fill="#39D5AA"/>
<text x="226" y="430" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">A duplicate</text>
<text x="226" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">ignore it</text>
<rect x="434" y="386" width="372" height="104" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 386H440A6 6 0 0 0 434 392V484A6 6 0 0 0 440 490H448Z" fill="#F3CF6A"/>
<text x="620" y="430" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">A message that arrived early</text>
<text x="620" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">park it for later</text>
<rect x="828" y="386" width="372" height="104" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 386H834A6 6 0 0 0 828 392V484A6 6 0 0 0 834 490H842Z" fill="#F28B9D"/>
<text x="1014" y="430" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">A genuine inconsistency</text>
<text x="1014" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">raise it</text>
<rect x="40" y="510" width="1160" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="544" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Silently ignoring all three is the usual bug, and it hides real corruption</text>
<rect x="40" y="590" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="590" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="624.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Why this beats a dedup table</text><text x="64" y="651.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">An out-of-order paid arriving after shipped passes every dedup check, and still corrupts the order.</text>
<text x="66" y="734" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A dedup table solves duplicates only. Reordering passes straight through it.</text>
</svg>