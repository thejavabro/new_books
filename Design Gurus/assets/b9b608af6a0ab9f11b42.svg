<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Read replicas absorb read traffic and can be placed near users, but every write still funnels through the one leader">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="rr8-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rr8-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr8-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rr8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="250" y1="135" x2="322" y2="135" stroke="#475569" stroke-width="2.5" marker-end="url(#rr8-slate)"/>
  <line x1="560" y1="135" x2="692" y2="82" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr8-blue)"/>
  <line x1="560" y1="135" x2="692" y2="172" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr8-blue)"/>
  <line x1="560" y1="135" x2="692" y2="262" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr8-blue)"/>
  <line x1="1000" y1="160" x2="918" y2="90" stroke="#059669" stroke-width="2.5" marker-end="url(#rr8-emerald)"/>
  <line x1="1000" y1="172" x2="918" y2="172" stroke="#059669" stroke-width="2.5" marker-end="url(#rr8-emerald)"/>
  <line x1="1000" y1="188" x2="918" y2="254" stroke="#059669" stroke-width="2.5" marker-end="url(#rr8-emerald)"/>

  <g filter="url(#rr8-soft)">
    <rect x="50" y="100" width="200" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="330" y="90" width="230" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="700" y="50" width="210" height="64" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="700" y="140" width="210" height="64" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="700" y="230" width="210" height="64" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="1010" y="138" width="190" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="150" y="143" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Write traffic</text>
  <text x="445" y="128" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Leader</text>
  <text x="445" y="156" font-size="20" fill="#64748B" text-anchor="middle">the only writer</text>
  <text x="805" y="89" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read replica</text>
  <text x="805" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read replica</text>
  <text x="805" y="269" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read replica</text>
  <text x="1105" y="181" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Read traffic</text>

  <text x="445" y="228" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">every write funnels</text>
  <text x="445" y="256" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">through this one node</text>
  <text x="620" y="340" font-size="20" fill="#7C3AED" text-anchor="middle">replicas lag behind the leader, so a read here can be stale</text>

  <text x="620" y="410" font-size="20" fill="#475569" text-anchor="middle">Adding replicas scales reads out. It does nothing at all for write throughput,</text>
  <text x="620" y="442" font-size="20" fill="#475569" text-anchor="middle">because the leader is still the only node allowed to accept a write.</text>
</svg>