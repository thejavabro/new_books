<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="hidden-title hidden-desc">
<title id="hidden-title">The lines that actually swing it</title>
<desc id="hidden-desc">The API gateway is half of the functions column and its flavor swings the result harder than the architecture choice. The subnet gateways are thirty percent of the fleet column.</desc>
<defs>
<marker id="hidden-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="hidden-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="hidden-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="hidden-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="750" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The lines that actually swing it</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Two lines in those columns deserve more attention than the compute.</text>
<rect x="40" y="672" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="672" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="146" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The API gateway is half of column B, and the flavor is a free choice</text>
<rect x="40" y="164" width="560" height="78" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="195.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">HTTP, $1.00 / million</text><text x="320" y="222.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">gateway $300, column B total $610</text>
<rect x="640" y="164" width="560" height="78" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="195.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">REST, $3.50 / million</text><text x="920" y="222.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">gateway $1,050, column B total $1,360</text>
<rect x="40" y="260" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="260" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="291" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The gateway flavor changes the answer by more than the architecture does</text><text x="64" y="317" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The compute in B is $310 either way, so the smaller decision got the attention.</text>
<text x="40" y="374" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And the mirror image in column A</text>
<rect x="40" y="392" width="560" height="78" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="424" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Subnet gateways: $99 a month</text><text x="320" y="450" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">thirty percent of column A, before a single GB</text>
<rect x="640" y="392" width="560" height="78" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="424" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Private endpoints remove the per-GB part</text><text x="920" y="450" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">which the brief did not even give a volume for</text>
<rect x="40" y="488" width="1160" height="78" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="488" width="5" height="78" rx="2.5" fill="#AC8BE8"/><text x="64" y="518.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">If internal traffic is in the tens of terabytes, that omitted line</text><text x="64" y="547.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">is larger than the difference between the two architectures.</text>
<rect x="40" y="584" width="1160" height="62" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="621" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Both are invisible in a diagram that shows a box labeled compute.</text>
<text x="66" y="706" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Pricing the functions and forgetting what sits in front of them is how this gets answered backwards.</text>
</svg>