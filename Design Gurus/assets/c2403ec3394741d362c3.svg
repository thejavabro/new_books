<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="If everything is synchronous, the user waits while six services run in a chain. If the work is split, the user waits only for the card payment and the saved order, and one order placed message feeds the email, warehouse, recommendation, and analytics services later.">
  <defs>
    <filter id="sva1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sva1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sva1-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="sva1-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="sva1-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="sva1-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="sva1-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="sva1-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="sva1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">What the user waits for</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Placing an order has six jobs. Only two decide whether the order exists.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#BE185D">Everything synchronous</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#047857">Split by the question: is the result needed now?</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#sva1-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#sva1-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#sva1-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#sva1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#sva1-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#sva1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Place Order</text>
  <g filter="url(#sva1-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#sva1-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">6 calls in a chain</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">each one adds waiting</text>
  <g filter="url(#sva1-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#sva1-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">User waits for all</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">any failure fails the order</text>
  <g filter="url(#sva1-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#sva1-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">Place Order</text>
  <g filter="url(#sva1-lift)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="450" y="430" width="9" height="90" fill="#059669" clip-path="url(#sva1-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Card and order</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">synchronous, user waits</text>
  <g filter="url(#sva1-soft)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="836" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#sva1-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">1 message, 4 jobs</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">asynchronous, done later</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Synchronous</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">the result decides what happens next</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Asynchronous</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">email, warehouse, recommendations, and analytics are side effects</text>
</svg>