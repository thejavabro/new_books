  <text x="900" y="704" font-size="21.5" font-weight="600" fill="#111827">In-memory adapter</text>
  <text x="1010" y="768" font-size="18.5" text-anchor="middle" fill="#6B7280">implements PaymentGateway</text>
  <text x="394" y="180" font-size="18.5" fill="#475569">Defined by the domain</text>
  <text x="844" y="180" font-size="18.5" fill="#475569">Implement the interfaces</text>
  <text x="458" y="295.5" font-size="21.5" font-weight="600" fill="#111827">OrderRepository</text>
  <text x="458" y="321.5" font-size="18.5" fill="#475569">(interface)</text>
  <text x="458" y="598.5" font-size="21.5" font-weight="600" fill="#111827">PaymentGateway</text>
  <text x="458" y="624.5" font-size="18.5" fill="#475569">(interface)</text>

  <text x="458" y="357.5" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#1F2937">save(order)</text>
  <text x="458" y="384.5" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#1F2937">find_by_id(order_id)</text>
  <text x="458" y="660.5" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#1F2937">charge(order_id, ...)</text>
  <text x="458" y="687.5" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#1F2937">refund(transaction_id, ...)</text>

  <rect x="40" y="830" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="855" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="880" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Domain</text>
  <text x="323" y="880" font-size="18.5" fill="#475569">depends on abstractions (interfaces), not implementations</text>
  <rect x="64" y="905" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="930" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Adapters</text>
  <text x="323" y="930" font-size="18.5" fill="#475569">depend on the domain (interfaces defined by the domain)</text>
