  <text x="80" y="230" font-size="19.5" font-weight="600" fill="#4338CA">Business logic</text>
  <rect x="370" y="120" width="420" height="680" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="394" y="150" font-size="19.5" font-weight="600" fill="#475569">Ports (interfaces)</text>
  <rect x="820" y="120" width="380" height="680" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="844" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Adapters (infrastructure)</text>

