<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The domain, or application core, holds business logic made of entities, business rules and use cases, and the use cases depend on both interfaces. The ports, defined by the domain, are the OrderRepository interface with save and find_by_id and the PaymentGateway interface with charge and refund. The adapters implement the interfaces: a PostgreSQL adapter and an in-memory adapter implement OrderRepository, and a Stripe adapter and an in-memory adapter implement PaymentGateway. The domain depends on abstractions, not implementations, and the adapters depend on the domain">
