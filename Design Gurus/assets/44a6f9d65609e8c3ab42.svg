  <text x="900" y="269" font-size="21.5" font-weight="600" fill="#111827">PostgreSQL adapter</text>
  <text x="1010" y="333" font-size="18.5" text-anchor="middle" fill="#6B7280">implements OrderRepository</text>
  <g filter="url(#m10e-soft)">
    <rect x="836" y="365" width="348" height="84" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
