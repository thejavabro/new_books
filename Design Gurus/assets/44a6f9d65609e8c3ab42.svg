      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m10e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m10e-k1"><rect x="72" y="280" width="236" height="56" rx="12"/></clipPath>
    <clipPath id="m10e-k2"><rect x="72" y="346" width="236" height="56" rx="12"/></clipPath>
