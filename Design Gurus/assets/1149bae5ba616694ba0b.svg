<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="614" viewBox="0 0 1240 614" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="mvccver-title mvccver-desc">
<title id="mvccver-title">Row versions and snapshot visibility</title>
<desc id="mvccver-desc">One row exists as three versions, each carrying the transaction that created it and the transaction that replaced it. A transaction whose snapshot was taken at 150 reads the middle version, while one taken at 180 reads the current version. Only the oldest version is reclaimable.</desc>
<defs>
<marker id="mvccver-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="mvccver-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="mvccver-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="mvccver-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="614" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Row versions and snapshot visibility</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A snapshot is basically the set of transactions still running when it was taken.</text>
<rect x="40" y="536" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="536" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">One row, three versions in the table</text>
<rect x="40" y="168" width="660" height="238" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 168H46A6 6 0 0 0 40 174V400A6 6 0 0 0 46 406H54Z" fill="#5EC9EC"/>
<text x="112" y="198" font-size="19" font-weight="700" fill="#4A5568" text-anchor="middle">xmin</text>
<text x="204" y="198" font-size="19" font-weight="700" fill="#4A5568" text-anchor="middle">xmax</text>
<text x="346" y="198" font-size="19" font-weight="700" fill="#4A5568" text-anchor="middle">value</text>
<rect x="72" y="210" width="80" height="52" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="112" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">100</text>
<rect x="164" y="210" width="80" height="52" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="204" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">140</text>
<rect x="256" y="210" width="180" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="346" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">seats = 12</text>
<text x="454" y="243" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dead, reclaimable</text>
<rect x="72" y="272" width="80" height="52" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="112" y="305" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">140</text>
<rect x="164" y="272" width="80" height="52" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="204" y="305" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">170</text>
<rect x="256" y="272" width="180" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="346" y="304" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">seats = 11</text>
<text x="454" y="305" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dead, still needed</text>
<rect x="72" y="334" width="80" height="52" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="112" y="367" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">170</text>
<rect x="164" y="334" width="80" height="52" rx="7" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="204" y="367" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">null</text>
<rect x="256" y="334" width="180" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="346" y="366" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">seats = 10</text>
<text x="454" y="367" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">current</text>
<text x="760" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two readers, two snapshots</text>
<rect x="760" y="168" width="440" height="112" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M774 168H766A6 6 0 0 0 760 174V274A6 6 0 0 0 766 280H774Z" fill="#F3CF6A"/><text x="790" y="204" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Transaction A</text>
<text x="1176" y="204" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">snapshot taken at 150</text>
<rect x="790" y="222" width="380" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="980" y="251" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads seats = 11</text>
<rect x="760" y="294" width="440" height="112" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M774 294H766A6 6 0 0 0 760 300V400A6 6 0 0 0 766 406H774Z" fill="#39D5AA"/><text x="790" y="330" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Transaction B</text>
<text x="1176" y="330" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">snapshot taken at 180</text>
<rect x="790" y="348" width="380" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="980" y="377" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads seats = 10</text>
<path d="M706 298H730V245H750" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M706 298H730V245H750" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mvccver-marker-slate)"/>
<path d="M706 360H730V371H750" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M706 360H730V371H750" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mvccver-marker-slate)"/>
<rect x="40" y="430" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="430" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="461.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A version is visible when its xmin committed before the snapshot</text><text x="64" y="490.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">and its xmax has not committed in that snapshot.</text>
<text x="66" y="569" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Neither reader waited for a writer, and no writer waited for them. That is the whole point of keeping versions.</text>
</svg>