<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="752" viewBox="0 0 1240 752" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="scope-title scope-desc">
<title id="scope-title">Scope is the lever that matters most</title>
<desc id="scope-desc">Reducing what each credential can do requires no new infrastructure, and the strongest version removes the long-lived secret entirely.</desc>
<defs>
<marker id="scope-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="scope-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="scope-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="scope-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="752" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Scope is the lever that matters most</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three dimensions of scope are worth separating.</text>
<rect x="40" y="674" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="674" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="400" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="240" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Permission scope</text>
<path d="M446 148H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 148H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scope-marker-slate)"/>
<rect x="490" y="118" width="710" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which operations it allows, usually far broader than the service needs</text>
<rect x="40" y="190" width="400" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Resource scope</text>
<path d="M446 220H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 220H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scope-marker-slate)"/>
<rect x="490" y="190" width="710" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which objects: one bucket rather than all,</text><text x="510" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one table rather than the database</text>
<rect x="40" y="262" width="400" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="240" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Environment scope</text>
<path d="M446 292H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 292H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scope-marker-slate)"/>
<rect x="490" y="262" width="710" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a staging credential must not work in production</text>
<rect x="40" y="346" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="346" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="381" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The practical test, for every credential</text><text x="64" y="407" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"If this leaked, the attacker could do X to Y." If either is "everything", that is the finding.</text>
<rect x="40" y="454" width="560" height="96" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="454" width="5" height="96" rx="2.5" fill="#39D5AA"/><text x="64" y="482" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">One credential per service</text><text x="64" y="508" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">shared credentials make rotation impossible,</text><text x="64" y="534" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and destroy attribution in the audit log</text>
<rect x="640" y="454" width="560" height="96" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="454" width="5" height="96" rx="2.5" fill="#5EC9EC"/><text x="664" y="482" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Separate read from write</text><text x="664" y="508" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">close to free, and converts a large class of</text><text x="664" y="534" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">total compromises into partial ones</text>
<rect x="40" y="574" width="1160" height="74" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="574" width="5" height="74" rx="2.5" fill="#F3CF6A"/><text x="64" y="617" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The cheapest meaningful improvement, because it needs no new infrastructure.</text>
<text x="66" y="708" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The broad credential was what existed when somebody was in a hurry.</text>
</svg>