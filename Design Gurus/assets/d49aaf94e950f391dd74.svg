<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="TTL expiry waits for the clock, invalidation removes the copy early on purpose, and cache control headers carry the origin&#39;s instructions with the content">
  <rect x="0" y="0" width="1240" height="430" fill="#FFFFFF"/>
  <defs>
    <marker id="cd7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="cd7-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cd7-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="cd7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="386" height="350" rx="14" fill="#F1F5F9" fill-opacity="0.6" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="213" y="78" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">TTL expiry</text>

  <rect x="426" y="40" width="386" height="350" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="619" y="78" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Cache invalidation</text>

  <rect x="832" y="40" width="386" height="350" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1025" y="78" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Cache control headers</text>

  <line x1="213" y1="184" x2="213" y2="214" stroke="#475569" stroke-width="2.5" marker-end="url(#cd7-slate)"/>
  <line x1="619" y1="184" x2="619" y2="214" stroke="#D97706" stroke-width="2.5" marker-end="url(#cd7-amber)"/>
  <line x1="1025" y1="184" x2="1025" y2="214" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#cd7-violet)"/>

  <g filter="url(#cd7-soft)">
    <rect x="93" y="120" width="240" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="103" y="220" width="220" height="60" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

    <rect x="499" y="120" width="240" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="509" y="220" width="220" height="60" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>

    <rect x="905" y="120" width="240" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="915" y="220" width="220" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>

  <text x="213" y="157" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Cached with a TTL</text>
  <text x="213" y="257" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">Marked stale</text>
  <text x="213" y="326" font-size="20" fill="#475569" text-anchor="middle">The clock simply runs out</text>
  <text x="213" y="360" font-size="20" fill="#475569" text-anchor="middle">Next request refetches it</text>

  <text x="619" y="157" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Origin content changes</text>
  <text x="619" y="257" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Copy removed</text>
  <text x="619" y="326" font-size="20" fill="#475569" text-anchor="middle">Removed before the TTL ends</text>
  <text x="619" y="360" font-size="20" fill="#475569" text-anchor="middle">Because it must show now</text>

  <text x="1025" y="157" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Origin sends content</text>
  <text x="1025" y="257" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Headers attached</text>
  <text x="1025" y="326" font-size="20" fill="#475569" text-anchor="middle">Cacheable or not, and how long</text>
  <text x="1025" y="360" font-size="20" fill="#475569" text-anchor="middle">Instructions travel with it</text>
</svg>