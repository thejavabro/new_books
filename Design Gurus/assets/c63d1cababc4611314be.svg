<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">Keyset pagination keeps a position, not a row count</title><desc id="desc">Page one ends at C with ordering values (10:01, 7). Adding X before that position does not change the next-page boundary: D, E, and F still follow it. The unique ID distinguishes comments with the same time. These stable ordering values can be used even if C is later deleted; changing ranking values needs a separate policy.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1110" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Keyset pagination keeps a position, not a row count</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Example order: creation time descending, then unique numeric ID descending.</text><text x="70" y="177" font-size="25" fill="#2563eb" font-weight="700">Page 1 returns A, B, C</text><text x="670" y="177" font-size="25" fill="#2563eb" font-weight="700">Insert X, then request page 2</text><rect x="50" y="215" width="480" height="55" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="251" font-size="23" fill="#2563eb" font-weight="400">A     time 10:02     ID 9</text><rect x="50" y="281" width="480" height="55" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="317" font-size="23" fill="#2563eb" font-weight="400">B     time 10:01     ID 8</text><rect x="50" y="347" width="480" height="55" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="383" font-size="23" fill="#2563eb" font-weight="400">C     time 10:01     ID 7</text><rect x="50" y="413" width="480" height="55" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="72" y="449" font-size="23" fill="#475569" font-weight="400">D     time 10:01     ID 6</text><rect x="50" y="479" width="480" height="55" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="72" y="515" font-size="23" fill="#475569" font-weight="400">E     time 10:00     ID 5</text><rect x="50" y="545" width="480" height="55" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="72" y="581" font-size="23" fill="#475569" font-weight="400">F     time 09:59     ID 4</text><rect x="650" y="215" width="480" height="55" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="672" y="251" font-size="23" fill="#475569" font-weight="400">X     time 10:03     ID 10</text><rect x="650" y="281" width="480" height="55" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="672" y="317" font-size="23" fill="#475569" font-weight="400">A     time 10:02     ID 9</text><rect x="650" y="347" width="480" height="55" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="672" y="383" font-size="23" fill="#475569" font-weight="400">B     time 10:01     ID 8</text><rect x="650" y="413" width="480" height="55" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="672" y="449" font-size="23" fill="#475569" font-weight="400">C     time 10:01     ID 7</text><rect x="650" y="479" width="480" height="55" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="515" font-size="23" fill="#059669" font-weight="400">D     time 10:01     ID 6</text><rect x="650" y="545" width="480" height="55" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="581" font-size="23" fill="#059669" font-weight="400">E     time 10:00     ID 5</text><rect x="650" y="611" width="480" height="55" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="647" font-size="23" fill="#059669" font-weight="400">F     time 09:59     ID 4</text><path d="M50 408 H530" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/><path d="M650 474 H1130" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5"/><rect x="50" y="710" width="480" height="155" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="750" font-size="24" fill="#7c3aed" font-weight="700">Save the ordering values</text><text x="72" y="791" font-size="21" fill="#334155" font-weight="400">Last returned item: C</text><text x="72" y="822" font-size="21" fill="#334155" font-weight="400">Boundary: (10:01, 7)</text><rect x="650" y="740" width="480" height="125" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="780" font-size="24" fill="#059669" font-weight="700">Next page: D, E, F</text><text x="672" y="821" font-size="21" fill="#334155" font-weight="400">Continue after the saved pair.</text><path d="M538 785 H642" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="925" width="1080" height="140" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="965" font-size="24" fill="#ffffff" font-weight="700">The tie-breaker matters</text><text x="72" y="1006" font-size="21" fill="#ffffff" font-weight="400">C and D have the same creation time. Their unique IDs still give them a precise order.</text><text x="72" y="1037" font-size="21" fill="#ffffff" font-weight="400">This example assumes that the ordering values stay unchanged.</text></g></svg>