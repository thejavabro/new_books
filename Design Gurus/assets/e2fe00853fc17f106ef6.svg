<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Vertical scaling replaces one machine with a bigger machine. Horizontal scaling adds more machines behind a load balancer and shares the work between them.">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="kd2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="kd2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="kd2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="kd2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="kd2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="kd2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="kd2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="kd2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two ways to add resources</text>
  <rect x="24" y="62" width="588" height="470" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="6 5"/>
  <rect x="628" y="62" width="588" height="470" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="98" font-size="22" font-weight="600" fill="#1E40AF" text-anchor="middle">Vertical scaling: one bigger machine</text>
  <text x="922" y="98" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">Horizontal scaling: more machines</text>
  <rect x="105" y="181" width="110" height="70" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <line x1="117" y1="193" x2="203" y2="193" stroke="#3B82F6" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="117" y1="216" x2="203" y2="216" stroke="#3B82F6" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="117" y1="239" x2="203" y2="239" stroke="#3B82F6" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="160" y="276" font-size="18" fill="#64748B" text-anchor="middle">4 CPU, 16 GB</text>
  <line x1="232" y1="216" x2="300" y2="216" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#kd2-b)"/>
  <rect x="224.5" y="178" width="83" height="30" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="266" y="194" font-size="18" fill="#1E40AF" text-anchor="middle">replace</text>
  <rect x="330" y="141" width="180" height="150" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <line x1="342" y1="153" x2="498" y2="153" stroke="#3B82F6" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="342" y1="195" x2="498" y2="195" stroke="#3B82F6" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="342" y1="237" x2="498" y2="237" stroke="#3B82F6" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="342" y1="279" x2="498" y2="279" stroke="#3B82F6" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="420" y="316" font-size="18" fill="#64748B" text-anchor="middle">64 CPU, 512 GB</text>
  <rect x="60" y="350" width="516" height="158" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="90" y="386" font-size="20" fill="#0F172A" text-anchor="start">Your code does not change.</text>
  <text x="90" y="420" font-size="20" fill="#0F172A" text-anchor="start">The machine must restart, so there is downtime.</text>
  <text x="90" y="454" font-size="20" fill="#B91C1C" text-anchor="start">There is a largest machine you can buy,</text>
  <text x="90" y="484" font-size="20" fill="#B91C1C" text-anchor="start">and it is expensive.</text>
  <g filter="url(#kd2-soft)"><rect x="842" y="150" width="160" height="52" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="922" y="184" font-size="19" fill="#065F46" text-anchor="middle">load balancer</text>
  <line x1="922" y1="204" x2="712" y2="244" stroke="#059669" stroke-width="2.2" marker-end="url(#kd2-e)"/>
  <rect x="660" y="249" width="104" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <line x1="672" y1="261" x2="752" y2="261" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="672" y1="282" x2="752" y2="282" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="672" y1="303" x2="752" y2="303" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="712" y="334" font-size="18" fill="#64748B" text-anchor="middle">machine 1</text>
  <line x1="922" y1="204" x2="852" y2="244" stroke="#059669" stroke-width="2.2" marker-end="url(#kd2-e)"/>
  <rect x="800" y="249" width="104" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <line x1="812" y1="261" x2="892" y2="261" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="812" y1="282" x2="892" y2="282" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="812" y1="303" x2="892" y2="303" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="852" y="334" font-size="18" fill="#64748B" text-anchor="middle">machine 2</text>
  <line x1="922" y1="204" x2="992" y2="244" stroke="#059669" stroke-width="2.2" marker-end="url(#kd2-e)"/>
  <rect x="940" y="249" width="104" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <line x1="952" y1="261" x2="1032" y2="261" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="952" y1="282" x2="1032" y2="282" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="952" y1="303" x2="1032" y2="303" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="992" y="334" font-size="18" fill="#64748B" text-anchor="middle">machine 3</text>
  <line x1="922" y1="204" x2="1132" y2="244" stroke="#059669" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#kd2-e)"/>
  <rect x="1080" y="249" width="104" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <line x1="1092" y1="261" x2="1172" y2="261" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="1092" y1="282" x2="1172" y2="282" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <line x1="1092" y1="303" x2="1172" y2="303" stroke="#059669" stroke-width="2.4" opacity="0.55" stroke-linecap="round"/>
  <text x="1132" y="334" font-size="18" font-weight="600" fill="#065F46" text-anchor="middle">added today</text>
  <rect x="664" y="350" width="516" height="158" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="694" y="386" font-size="20" fill="#0F172A" text-anchor="start">You can keep adding machines.</text>
  <text x="694" y="420" font-size="20" fill="#0F172A" text-anchor="start">Your code must know where the data is,</text>
  <text x="694" y="454" font-size="20" fill="#0F172A" text-anchor="start">and it must keep working when one</text>
  <text x="694" y="484" font-size="20" fill="#0F172A" text-anchor="start">machine stops.</text>
</svg>