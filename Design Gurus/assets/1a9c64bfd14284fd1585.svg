  <text x="620" y="620" font-size="20" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A block is marked used the moment it leaves the pool, not when a key is finally assigned.</text>
  <text x="620" y="646" font-size="20" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">If a server dies holding 1,000 keys, we lose 1,000 keys out of trillions. That is a trade worth making.</text>
