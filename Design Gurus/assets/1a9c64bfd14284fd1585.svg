<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" role="img" aria-label="How the Key Generation Service hands out keys. A shortening server asks for a block. The service moves 1,000 keys from the unused pool to the used table before handing the block over, so two servers can never receive the same key. Each server then holds its own block in memory and spends it locally, one key per write. A standby service takes over if the key generation service fails.">
