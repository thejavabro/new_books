  <text x="843" y="82" font-size="18" font-weight="600" fill="#0E7490" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2. move 1,000 keys</text>
  <text x="843" y="108" font-size="18" font-weight="600" fill="#0E7490" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">unused to used</text>
