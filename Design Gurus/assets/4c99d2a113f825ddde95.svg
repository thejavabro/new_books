<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1260" viewBox="0 0 1240 1260" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Video upload and streaming architecture in three zones. Zone one, the write path: the creator client asks the Upload service for upload URLs, then sends the parts straight to object storage so no bytes pass through a service. Zone two, the pipeline: storage emits an upload complete event to the Pipeline orchestrator, which dispatches tasks onto queues that Transcode workers pull; workers read and write objects in storage and report step results as keys only, and the orchestrator tells Assets when a rendition is ready. Zone three, the read path: Assets feeds Playback, which serves a manifest to the CDN, and the CDN serves segments to viewers.">
  <defs>
    <marker id="m07-l08-upload-and-pipeline-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l08-upload-and-pipeline-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l08-upload-and-pipeline-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m07-l08-upload-and-pipeline-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1260" fill="#FFFFFF"/>

  <rect x="40" y="110" width="1160" height="270" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="152" font-size="20" font-weight="600" fill="#1E3A8A">Zone 1, the write path: not one byte enters your services</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <rect x="70" y="200" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="210" y="267" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Creator client</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <rect x="430" y="200" width="300" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="580" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Upload service</text>
  <text x="580" y="283" text-anchor="middle" font-size="20" fill="#64748B">it signs URLs</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <path d="M810,215 L810,315 A185,20 0 0 0 1180,315 L1180,215" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="995" cy="215" rx="185" ry="20" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="995" y="257" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Object storage</text>
  <text x="995" y="287" text-anchor="middle" font-size="20" fill="#64748B">it holds every byte</text>

  <rect x="40" y="440" width="1160" height="340" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="482" font-size="20" font-weight="600" fill="#92400E">Zone 2, the pipeline: every message carries object keys, never a payload</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <rect x="70" y="530" width="300" height="140" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="220" y="591" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pipeline orchestrator</text>
  <text x="220" y="623" text-anchor="middle" font-size="20" fill="#64748B">it owns the step graph</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <path d="M450,545 L450,645 A160,20 0 0 0 770,645 L770,545" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="610" cy="545" rx="160" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="610" y="602" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Task queues</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <rect x="850" y="530" width="330" height="140" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1015" y="591" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Transcode workers</text>
  <text x="1015" y="623" text-anchor="middle" font-size="20" fill="#64748B">scaled by backlog</text>

  <rect x="40" y="840" width="1160" height="240" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="882" font-size="20" font-weight="600" fill="#1E3A8A">Zone 3, the read path: one manifest call, and then the CDN</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <rect x="70" y="900" width="240" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="190" y="967" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Assets</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <rect x="380" y="900" width="280" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="520" y="951" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Playback</text>
  <text x="520" y="983" text-anchor="middle" font-size="20" fill="#64748B">manifests</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <rect x="730" y="900" width="190" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="825" y="967" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">CDN</text>
  <g filter="url(#m07-l08-upload-and-pipeline-soft)">
    <rect x="990" y="900" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1085" y="967" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Viewers</text>

  <g fill="none" stroke-width="2.5">
    <path d="M350,260 L422,260" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l08-upload-and-pipeline-bl)"/>
    <path d="M210,322 C300,372 600,378 802,340" stroke="#3B82F6" marker-end="url(#m07-l08-upload-and-pipeline-bl)"/>
    <path d="M860,340 L860,410 L220,410 L220,522" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l08-upload-and-pipeline-ab)"/>
    <path d="M370,595 L442,595" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-upload-and-pipeline-ab)"/>
    <path d="M770,595 L842,595" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-upload-and-pipeline-ab)"/>
    <path d="M1015,530 L1015,343" stroke="#7C3AED" stroke-width="2" marker-end="url(#m07-l08-upload-and-pipeline-vi)"/>
    <path d="M900,670 L900,720 L260,720 L260,682" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-upload-and-pipeline-ab)"/>
    <path d="M190,670 L190,892" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l08-upload-and-pipeline-ab)"/>
    <path d="M310,960 L372,960" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l08-upload-and-pipeline-bl)"/>
    <path d="M660,960 L722,960" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l08-upload-and-pipeline-bl)"/>
    <path d="M920,960 L982,960" stroke="#3B82F6" marker-end="url(#m07-l08-upload-and-pipeline-bl)"/>
  </g>

  <text x="386" y="180" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. ask for upload URLs</text>
  <text x="480" y="350" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. the parts go direct</text>
  <text x="540" y="398" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">upload complete event</text>
  <text x="406" y="515" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one task per step</text>
  <text x="806" y="515" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pulled by the fleet</text>
  <text x="1035" y="400" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reads and writes</text>
  <text x="1035" y="428" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">objects</text>
  <text x="575" y="710" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">step results, keys only</text>
  <text x="210" y="800" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">rendition ready</text>
  <text x="341" y="1055" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">asset state</text>
  <text x="691" y="1055" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">manifest</text>
  <text x="951" y="1055" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">segments</text>

  <line x1="60" y1="1140" x2="96" y2="1140" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1147" font-size="20" fill="#475569">A live call: the creator asks for URLs, the viewer pulls the stream</text>
  <line x1="60" y1="1180" x2="96" y2="1180" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1187" font-size="20" fill="#475569">Events and queued tasks: nobody waits</text>
  <line x1="60" y1="1220" x2="96" y2="1220" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="1227" font-size="20" fill="#475569">Objects read and written in storage</text>
</svg>