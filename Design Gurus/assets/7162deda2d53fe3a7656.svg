  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="648" y="294" fill="#1D4ED8">random sample</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="931.5" y="381" fill="#1D4ED8">human labels</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="417.5" y="381" fill="#475569">kept human-labeled</text></g>
