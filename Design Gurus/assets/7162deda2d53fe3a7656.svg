<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="661" viewBox="0 0 1240 661" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An LLM labels every review, and humans check a random sample, every uncertain or disagreeing case, and extra items from each risky group, which fill the audit slices">
