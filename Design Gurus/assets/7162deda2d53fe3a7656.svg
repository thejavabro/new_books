  <text x="214" y="402" font-size="18.5" font-weight="600" fill="#111827">Audit slices</text>
  <text x="240" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">random sample, each dialect, each adversarial pattern</text>
