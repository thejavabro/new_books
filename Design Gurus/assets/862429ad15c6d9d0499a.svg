<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="556" viewBox="0 0 1240 556" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="threesent-title threesent-desc">
<title id="threesent-title">What a proportionate design must say</title>
<desc id="threesent-desc">Three sentences carry a simple design: the constraint that shaped it, what you deliberately did not build together with the trigger that would change that, and what the choice costs you.</desc>
<defs>
<marker id="threesent-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="threesent-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="threesent-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="threesent-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="556" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What a proportionate design must say</text>
<text x="40" y="86" font-size="21" fill="#4A5568">It needs three sentences that an idealized design never has to supply.</text>
<rect x="40" y="478" width="1160" height="52" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="478" width="5" height="52" rx="2.5" fill="#AC8BE8"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="118" width="428" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The constraint that shaped it</text>
<path d="M526 148H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 148H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threesent-marker-slate)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="141.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"Five engineers with an on-call rotation,</text><text x="590" y="166.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">so I am keeping this to three systems."</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="190" width="428" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What you did not build, and the trigger</text>
<path d="M526 220H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 220H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threesent-marker-slate)"/>
<rect x="570" y="190" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="213.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"No separate search service until</text><text x="590" y="238.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the catalog passes a million rows."</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="262" width="428" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What this choice costs you</text>
<path d="M526 292H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 292H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#threesent-marker-slate)"/>
<rect x="570" y="262" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="285.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"This will not survive a tenfold traffic increase,</text><text x="590" y="310.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and here is the first thing that breaks."</text>
<rect x="40" y="346" width="1160" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="346" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="64" y="379" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The specific risk of designing proportionately</text><text x="64" y="405" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Without those three sentences, a simple design is exactly like an inexperienced one.</text><text x="64" y="431" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The interviewer cannot tell whether you chose it or defaulted to it.</text>
<text x="66" y="512" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Complexity is paid for every week afterwards, by whoever is on call.</text>
</svg>