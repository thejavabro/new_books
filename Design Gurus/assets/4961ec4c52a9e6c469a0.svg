  <circle cx="90" cy="1250" r="8" fill="#4F46E5"/>
  <text x="114" y="1256.5" font-size="18.5" fill="#1F2937">Better security, scalability, and flexibility.</text>
  <rect x="64" y="1282" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="90" cy="1304" r="8" fill="#4F46E5"/>
  <text x="114" y="1310.5" font-size="18.5" fill="#1F2937">The client never reaches the database directly.</text>


