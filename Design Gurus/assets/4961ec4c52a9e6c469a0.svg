<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1400" viewBox="0 0 1240 1400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Two-tier: three clients connect directly to one server tier that holds the data and the logic that does not run on the client; simple, suitable for small applications or internal tools, with limited security, scalability and flexibility. Three-tier: three clients connect to an application server, which reads and writes the database; better security, scalability and flexibility, and the client never reaches the database directly">
