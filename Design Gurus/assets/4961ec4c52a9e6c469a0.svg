  <text x="64" y="178" font-size="18.5" fill="#475569">Client connects directly to one server that holds the data and the logic that does not run on the client.</text>
  <text x="64" y="818" font-size="18.5" fill="#475569">Client connects to an application server, which accesses the database.</text>

