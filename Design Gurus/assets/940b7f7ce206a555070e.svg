<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Monolith with three modules sharing one database, versus microservices where each service runs in its own process, owns its own database, and calls other services over the network">
  <defs>
    <marker id="m01-l02-monolith-vs-microservices-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m01-l02-monolith-vs-microservices-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m01-l02-monolith-vs-microservices-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>

  
  <rect x="40" y="70" width="580" height="480" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="108" font-size="20" font-weight="600" fill="#334155">Monolith: one process, one database</text>

  <rect x="650" y="70" width="550" height="480" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="672" y="108" font-size="20" font-weight="600" fill="#334155">Microservices: own process, own data</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M280,188 C315,188 315,300 350,300" stroke="#475569" marker-end="url(#m01-l02-monolith-vs-microservices-sl)"/>
    <path d="M280,328 L350,328" stroke="#475569" marker-end="url(#m01-l02-monolith-vs-microservices-sl)"/>
    <path d="M280,468 C315,468 315,356 350,356" stroke="#475569" marker-end="url(#m01-l02-monolith-vs-microservices-sl)"/>
    <path d="M785,226 L785,286" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#m01-l02-monolith-vs-microservices-bl)"/>
    <path d="M785,366 L785,426" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#m01-l02-monolith-vs-microservices-bl)"/>
    <path d="M890,188 L980,188" stroke="#475569" marker-end="url(#m01-l02-monolith-vs-microservices-sl)"/>
    <path d="M890,328 L980,328" stroke="#475569" marker-end="url(#m01-l02-monolith-vs-microservices-sl)"/>
    <path d="M890,468 L980,468" stroke="#475569" marker-end="url(#m01-l02-monolith-vs-microservices-sl)"/>
  </g>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="785" y="263" fill="#1E40AF">network call</text>
    <text x="785" y="403" fill="#1E40AF">network call</text>
  </g>

  
  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <rect x="70" y="150" width="210" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="175" y="195" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders module</text>

  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <rect x="70" y="290" width="210" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="175" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments module</text>

  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <rect x="70" y="430" width="210" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="175" y="475" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory module</text>

  
  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <path d="M350,268 L350,388 A130,20 0 0 0 610,388 L610,268" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="480" cy="268" rx="130" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="480" y="325" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shared database</text>
  <text x="480" y="355" text-anchor="middle" font-size="20" fill="#64748B">all modules share it</text>

  
  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <rect x="680" y="150" width="210" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="785" y="195" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order service</text>

  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <rect x="680" y="290" width="210" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="785" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment service</text>

  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <rect x="680" y="430" width="210" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="785" y="475" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory service</text>

  
  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <path d="M980,164 L980,212 A95,15 0 0 0 1170,212 L1170,164" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="1075" cy="164" rx="95" ry="15" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1075" y="195" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders DB</text>

  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <path d="M980,304 L980,352 A95,15 0 0 0 1170,352 L1170,304" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="1075" cy="304" rx="95" ry="15" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1075" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments DB</text>

  <g filter="url(#m01-l02-monolith-vs-microservices-soft)">
    <path d="M980,444 L980,492 A95,15 0 0 0 1170,492 L1170,444" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="1075" cy="444" rx="95" ry="15" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1075" y="475" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory DB</text>

  
  <g stroke-width="4">
    <line x1="40" y1="598" x2="74" y2="598" stroke="#3B82F6" stroke-dasharray="6 5"/>
    <line x1="650" y1="598" x2="684" y2="598" stroke="#475569"/>
  </g>
  <text x="84" y="605" font-size="20" fill="#475569">Network call between services: can fail on its own</text>
  <text x="694" y="605" font-size="20" fill="#475569">Database read/write</text>
</svg>