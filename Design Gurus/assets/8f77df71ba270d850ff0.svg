<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="682" viewBox="0 0 1240 682" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="setup-title setup-desc">
<title id="setup-title">The claim being tested</title>
<desc id="setup-desc">A payments product running active-passive across two regions, with a documented fifteen minute recovery objective and a drill four months old.</desc>
<defs>
<marker id="setup-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="setup-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="setup-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="setup-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="682" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The claim being tested</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A payments product running active-passive across two regions.</text>
<rect x="40" y="604" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="604" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="246" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/>
<text x="70" y="164" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">RPO</text>
<text x="300" y="164" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">60 seconds</text>
<text x="620" y="164" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">asynchronous replication to the secondary</text>
<text x="70" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">RTO</text>
<text x="300" y="198" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">15 minutes</text>
<text x="620" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">documented, reviewed, approved</text>
<text x="70" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">last drill</text>
<text x="300" y="232" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">four months ago</text>
<text x="620" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">component failover, in staging</text>
<text x="70" y="266" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">on call</text>
<text x="300" y="266" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">one person</text>
<text x="620" y="266" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rotating weekly</text>
<text x="70" y="300" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">routing</text>
<text x="300" y="300" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">DNS, TTL 60 s</text>
<text x="70" y="334" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">secondary</text>
<text x="300" y="334" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">full capacity</text>
<text x="620" y="334" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">provisioned, serving no traffic</text>
<rect x="40" y="386" width="1160" height="98" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="386" width="5" height="98" rx="2.5" fill="#F28B9D"/><text x="64" y="415" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">At 02:14 the primary region begins failing. Not cleanly</text><text x="64" y="441" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The control plane is degraded, some instances are reachable and slow, and the</text><text x="64" y="467" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">managed database accepts connections and times out on writes.</text>
<rect x="40" y="506" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="506" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="534.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">The exercise is not to name the steps of a failover.</text><text x="64" y="561.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">It is to account for where the fifty-two minutes went.</text>
<text x="66" y="638" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Fifteen minutes on paper against an hour on the clock.</text>
</svg>