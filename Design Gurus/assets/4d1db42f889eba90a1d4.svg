<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On one call path a rate limiter caps volume, a circuit breaker stops calls to a failing dependency, and retry with backoff re-attempts transient errors, each triggered by something different">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="dp6-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="dp6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three guards on one call, each watching for something different</text>

  
  <line x1="234" y1="180" x2="292" y2="180" stroke="#3B82F6" stroke-width="2" marker-end="url(#dp6-blue)"/>
  <line x1="512" y1="180" x2="570" y2="180" stroke="#3B82F6" stroke-width="2" marker-end="url(#dp6-blue)"/>
  <line x1="790" y1="180" x2="848" y2="180" stroke="#3B82F6" stroke-width="2" marker-end="url(#dp6-blue)"/>
  <line x1="1068" y1="180" x2="1126" y2="180" stroke="#3B82F6" stroke-width="2" marker-end="url(#dp6-blue)"/>

  <g filter="url(#dp6-soft)">
    <rect x="60" y="144" width="174" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="296" y="144" width="216" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="574" y="144" width="216" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="852" y="144" width="216" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="147" y="188" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Caller</text>
  <text x="404" y="188" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Rate limiter</text>
  <text x="682" y="188" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Circuit breaker</text>
  <text x="960" y="188" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Retry + backoff</text>
  <text x="1160" y="176" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Down-</text>
  <text x="1160" y="202" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">stream</text>

  
  <g filter="url(#dp6-soft)">
    <rect x="70" y="278" width="346" height="200" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="436" y="278" width="346" height="200" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="802" y="278" width="346" height="200" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="243" y="314" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Rate limiting</text>
  <text x="243" y="352" font-size="20" fill="#475569" text-anchor="middle">Triggered by volume,</text>
  <text x="243" y="380" font-size="20" fill="#475569" text-anchor="middle">not by any failure.</text>
  <text x="243" y="418" font-size="20" fill="#475569" text-anchor="middle">Rejects the excess so</text>
  <text x="243" y="446" font-size="20" fill="#475569" text-anchor="middle">one caller cannot</text>
  <text x="243" y="466" font-size="20" fill="#475569" text-anchor="middle">starve the rest.</text>

  <text x="609" y="314" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Circuit breaker</text>
  <text x="609" y="352" font-size="20" fill="#475569" text-anchor="middle">Triggered by repeated</text>
  <text x="609" y="380" font-size="20" fill="#475569" text-anchor="middle">failures.</text>
  <text x="609" y="418" font-size="20" fill="#475569" text-anchor="middle">Assumes the fault will</text>
  <text x="609" y="446" font-size="20" fill="#475569" text-anchor="middle">last, so it stops trying</text>
  <text x="609" y="466" font-size="20" fill="#475569" text-anchor="middle">and fails fast.</text>

  <text x="975" y="314" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Retry with backoff</text>
  <text x="975" y="352" font-size="20" fill="#475569" text-anchor="middle">Triggered by a single</text>
  <text x="975" y="380" font-size="20" fill="#475569" text-anchor="middle">transient error.</text>
  <text x="975" y="418" font-size="20" fill="#475569" text-anchor="middle">Assumes the fault is</text>
  <text x="975" y="446" font-size="20" fill="#475569" text-anchor="middle">brief, so it waits and</text>
  <text x="975" y="466" font-size="20" fill="#475569" text-anchor="middle">tries again.</text>

  
  <rect x="70" y="520" width="1078" height="76" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="609" y="552" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Retry without a breaker is how a slow dependency becomes an outage.</text>
  <text x="609" y="580" font-size="20" fill="#B91C1C" text-anchor="middle">Every caller retrying a struggling service multiplies the load exactly when it can least absorb it.</text>

  <rect x="70" y="620" width="1078" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="609" y="648" font-size="20" fill="#334155" text-anchor="middle">Use all three together, and always add jitter so clients do not retry in lockstep.</text>
</svg>