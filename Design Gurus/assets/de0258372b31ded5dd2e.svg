<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven steps, and the question each one asks">
  <defs>

    <filter id="m1l4b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l4b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>


  <rect x="50" y="56" width="300" height="52" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">1. Frame the problem</text>
  <rect x="370" y="56" width="102" height="52" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="421" y="88" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1D4ED8">3 min</text>
  <text x="626" y="89" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">which family, which useful starting design, and what is excluded?</text>
  <rect x="50" y="122" width="300" height="52" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="200" y="154" text-anchor="middle" font-size="16" font-weight="600" fill="#4338CA">2. Define success</text>
  <rect x="370" y="122" width="130" height="52" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="435" y="154" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4338CA">5 min</text>
  <text x="626" y="155" font-size="15.5" font-weight="600" text-anchor="start" fill="#4338CA">what are the quality, latency, and cost numbers?</text>
  <rect x="50" y="188" width="300" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#5B21B6">3. Map the data</text>
  <rect x="370" y="188" width="130" height="52" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="435" y="220" text-anchor="middle" font-size="14.5" font-weight="600" fill="#5B21B6">5 min</text>
  <text x="626" y="221" font-size="15.5" font-weight="600" text-anchor="start" fill="#5B21B6">which sources and evaluation signals, and how fresh must they be?</text>
  <rect x="50" y="254" width="300" height="52" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="286" text-anchor="middle" font-size="16" font-weight="600" fill="#047857">4. Pick the model</text>
  <rect x="370" y="254" width="130" height="52" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="435" y="286" text-anchor="middle" font-size="14.5" font-weight="600" fill="#047857">5 min</text>
  <text x="626" y="287" font-size="15.5" font-weight="600" text-anchor="start" fill="#047857">what baseline fits, and what would justify an upgrade?</text>
  <rect x="50" y="320" width="300" height="52" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="200" y="352" text-anchor="middle" font-size="16" font-weight="600" fill="#B45309">5. Design the serving path</text>
  <rect x="370" y="320" width="228" height="52" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="484" y="352" text-anchor="middle" font-size="14.5" font-weight="600" fill="#B45309">12 min</text>
  <text x="626" y="353" font-size="15.5" font-weight="600" text-anchor="start" fill="#B45309">background or request-time work, caches, models, and fallbacks?</text>
  <rect x="50" y="386" width="300" height="52" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="200" y="418" text-anchor="middle" font-size="16" font-weight="600" fill="#BE185D">6. Keep it working</text>
  <rect x="370" y="386" width="172" height="52" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="456" y="418" text-anchor="middle" font-size="14.5" font-weight="600" fill="#BE185D">8 min</text>
  <text x="626" y="419" font-size="15.5" font-weight="600" text-anchor="start" fill="#BE185D">how are results evaluated and updates released safely?</text>
  <rect x="50" y="452" width="300" height="52" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="200" y="484" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">7. Count the costs</text>
  <rect x="370" y="452" width="130" height="52" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="435" y="484" text-anchor="middle" font-size="14.5" font-weight="600" fill="#475569">5 min</text>
  <text x="626" y="485" font-size="15.5" font-weight="600" text-anchor="start" fill="#475569">what could fail without an alert, and what is the estimated cost?</text>
  <rect x="40" y="524" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="569" text-anchor="middle" font-size="16" fill="#475569">43 minutes total, plus 2 minutes for questions. Adjust the emphasis to the task.</text>
</svg>