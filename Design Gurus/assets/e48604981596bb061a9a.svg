  <text x="484" y="914" font-size="18.5" font-weight="600" fill="#111827">Messaging</text>
  <text x="64" y="187" font-size="18.5" fill="#475569">Run your code on demand. You write the logic and the platform manages the infrastructure.</text>
  <text x="64" y="631" font-size="18.5" fill="#475569">Use fully managed backend services through APIs. You write no server code for these components.</text>
  <text x="750" y="703" font-size="18.5" fill="#6B7280">for example, Cognito, Auth0</text>
  <text x="750" y="773" font-size="18.5" fill="#6B7280">for example, DynamoDB, Firestore</text>
  <text x="750" y="843" font-size="18.5" fill="#6B7280">for example, S3</text>
  <text x="750" y="913" font-size="18.5" fill="#6B7280">for example, SQS, EventBridge</text>
  <text x="90" y="470" font-size="18.5" fill="#1F2937">You deploy small functions.</text>
  <text x="90" y="500" font-size="18.5" fill="#1F2937">Runs in response to events.</text>
  <text x="90" y="530" font-size="18.5" fill="#1F2937">Platform handles provisioning, scaling, and maintenance.</text>
  <text x="90" y="984" font-size="18.5" fill="#1F2937">Consume fully managed services via APIs.</text>
  <text x="90" y="1014" font-size="18.5" fill="#1F2937">No server code to write or maintain.</text>
  <text x="90" y="1044" font-size="18.5" fill="#1F2937">Services scale and bill based on their own usage.</text>

