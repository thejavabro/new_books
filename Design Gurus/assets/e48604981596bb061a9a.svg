  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">FaaS vs. BaaS: the two models of serverless</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">FaaS runs your code on demand; BaaS replaces backend components with managed services.</text>

