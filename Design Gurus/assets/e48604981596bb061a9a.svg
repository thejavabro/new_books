<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1100" viewBox="0 0 1240 1100" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Functions as a Service: an event source such as an HTTP request, a file upload or a queue message triggers a function that you write; you deploy small functions that run in response to events, and the platform handles provisioning, scaling and maintenance. Backend as a Service: your application calls fully managed services through APIs, namely authentication such as Cognito or Auth0, a managed database such as DynamoDB or Firestore, object storage such as S3, and messaging such as SQS or EventBridge; you write no server code for them, and they scale and bill on their own usage">
