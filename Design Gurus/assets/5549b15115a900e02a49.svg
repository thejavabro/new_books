<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three intervals with both heaps full">
<defs>
<filter id="ni-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">For each interval, which one starts soonest at or after it ends?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The answer is an index, so every interval carries its original position with it</text>
<rect x="40" y="106" width="1160" height="568" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One row holds the intervals by end, the other holds the same intervals by start</text>
<line x1="300" y1="308" x2="1150" y2="308" stroke="#CBD5E1" stroke-width="2"/>
<line x1="300" y1="304" x2="300" y2="314" stroke="#CBD5E1" stroke-width="2"/>
<text x="300" y="334" text-anchor="middle" font-size="16.5" fill="#475569">1</text>
<line x1="441.66666666666663" y1="304" x2="441.66666666666663" y2="314" stroke="#CBD5E1" stroke-width="2"/>
<text x="441.66666666666663" y="334" text-anchor="middle" font-size="16.5" fill="#475569">2</text>
<line x1="583.3333333333333" y1="304" x2="583.3333333333333" y2="314" stroke="#CBD5E1" stroke-width="2"/>
<text x="583.3333333333333" y="334" text-anchor="middle" font-size="16.5" fill="#475569">3</text>
<line x1="725" y1="304" x2="725" y2="314" stroke="#CBD5E1" stroke-width="2"/>
<text x="725" y="334" text-anchor="middle" font-size="16.5" fill="#475569">4</text>
<line x1="866.6666666666666" y1="304" x2="866.6666666666666" y2="314" stroke="#CBD5E1" stroke-width="2"/>
<text x="866.6666666666666" y="334" text-anchor="middle" font-size="16.5" fill="#475569">5</text>
<line x1="1008.3333333333334" y1="304" x2="1008.3333333333334" y2="314" stroke="#CBD5E1" stroke-width="2"/>
<text x="1008.3333333333334" y="334" text-anchor="middle" font-size="16.5" fill="#475569">6</text>
<line x1="1150" y1="304" x2="1150" y2="314" stroke="#CBD5E1" stroke-width="2"/>
<text x="1150" y="334" text-anchor="middle" font-size="16.5" fill="#475569">7</text>
<rect x="441.66666666666663" y="176" width="141.66666666666663" height="30" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="512.5" y="197" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">interval 0</text>
<text x="276" y="197" text-anchor="end" font-size="16.5" fill="#475569">[2, 3]</text>
<rect x="583.3333333333333" y="218" width="141.66666666666674" height="30" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="654.1666666666666" y="239" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">interval 1</text>
<text x="276" y="239" text-anchor="end" font-size="16.5" fill="#475569">[3, 4]</text>
<rect x="866.6666666666666" y="260" width="141.66666666666674" height="30" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="937.5" y="281" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">interval 2</text>
<text x="276" y="281" text-anchor="end" font-size="16.5" fill="#475569">[5, 6]</text>
<text x="276" y="433" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">by end, largest first</text>
<rect x="300" y="392" width="132" height="66" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="366" y="432.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">end 6</text>
<text x="366" y="480" text-anchor="middle" font-size="15.5" fill="#94A3B8">interval 2</text>
<rect x="448" y="392" width="132" height="66" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="514" y="432.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">end 4</text>
<text x="514" y="480" text-anchor="middle" font-size="15.5" fill="#94A3B8">interval 1</text>
<rect x="596" y="392" width="132" height="66" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="662" y="432.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">end 3</text>
<text x="662" y="480" text-anchor="middle" font-size="15.5" fill="#94A3B8">interval 0</text>
<text x="366" y="380" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">front</text>
<text x="276" y="557" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">by start, largest first</text>
<rect x="300" y="516" width="132" height="66" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="366" y="556.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">start 5</text>
<text x="366" y="604" text-anchor="middle" font-size="15.5" fill="#94A3B8">interval 2</text>
<rect x="448" y="516" width="132" height="66" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="514" y="556.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">start 3</text>
<text x="514" y="604" text-anchor="middle" font-size="15.5" fill="#94A3B8">interval 1</text>
<rect x="596" y="516" width="132" height="66" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="662" y="556.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">start 2</text>
<text x="662" y="604" text-anchor="middle" font-size="15.5" fill="#94A3B8">interval 0</text>
<text x="366" y="504" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">front</text>
<text x="620" y="634" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Both rows are ordered largest first, so the largest end and the largest start are both in front</text>
<rect x="40" y="692" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="732" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Ends are handled largest first, so a qualifying start still qualifies later</text>
<text x="620" y="764" text-anchor="middle" font-size="18.5" fill="#475569">Only the smallest qualifying start is worth keeping, since it covers every later end too</text>
</svg>