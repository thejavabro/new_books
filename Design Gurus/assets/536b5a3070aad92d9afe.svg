<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="662" viewBox="0 0 1240 662" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two users edit different fields of the same record at the same time; last-write-wins keeps only the later write, so the earlier user&#39;s change is silently discarded">
  <rect x="0" y="0" width="1240" height="662" fill="#FFFFFF"/>
  <defs>
    <marker id="cr3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="cr3-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="cr3-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="cr3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two people edit different fields, and one edit disappears</text>

  <line x1="354" y1="228" x2="422" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#cr3-slate)"/>
  <line x1="354" y1="252" x2="422" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#cr3-slate)"/>
  <line x1="754" y1="195" x2="822" y2="222" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#cr3-red)"/>
  <line x1="754" y1="335" x2="822" y2="258" stroke="#D97706" stroke-width="2" marker-end="url(#cr3-amber)"/>

  <g filter="url(#cr3-soft)">
    <rect x="70" y="180" width="284" height="120" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="430" y="140" width="320" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect x="430" y="280" width="320" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="830" y="180" width="340" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>

  <text x="212" y="216" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Both read</text>
  <text x="212" y="250" font-size="20" fill="#334155" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">name: Sam</text>
  <text x="212" y="278" font-size="20" fill="#334155" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">city: Paris</text>

  <text x="590" y="176" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Alice at 12:00:01.100</text>
  <text x="590" y="206" font-size="20" fill="#0F172A" text-anchor="middle">sets city = Berlin</text>
  <text x="590" y="234" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">lost</text>

  <text x="590" y="316" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bob at 12:00:01.300</text>
  <text x="590" y="346" font-size="20" fill="#0F172A" text-anchor="middle">sets name = Samuel</text>
  <text x="590" y="374" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">wins, later timestamp</text>

  <text x="1000" y="216" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Stored after both writes</text>
  <text x="1000" y="250" font-size="20" fill="#334155" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">name: Samuel</text>
  <text x="1000" y="278" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">city: Paris</text>

  <rect x="50" y="430" width="1140" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="472" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Berlin never conflicted with Samuel. Last-write-wins threw it away anyway, and nobody was told.</text>

  
  <rect x="50" y="540" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="576" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Last-write-wins is not conflict resolution. It is conflict deletion, with a timestamp as the excuse.</text>
  <text x="620" y="606" font-size="20" fill="#334155" text-anchor="middle">It is cheap and it never blocks, which is exactly why people ship it and then lose data.</text>
</svg>