  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Centralized broker architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">All clients send requests to one central broker, which routes each request to a server and returns the response to the client.</text>



