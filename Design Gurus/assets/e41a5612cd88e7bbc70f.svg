<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The name www.example.com goes into DNS, which looks it up and returns the IP address 203.0.113.10 that the computer uses.">
  <defs>
    <filter id="ds1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ds1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ds1-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ds1-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ds1-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    <marker id="ds1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">What DNS does</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">People type names. Computers connect to IP addresses. DNS turns one into the other.</text>



  <g fill="none" stroke-width="2">
    <path d="M404,185 H450" stroke="#64748B" marker-end="url(#ds1-m-slate)"/>
    <path d="M790,185 H836" stroke="#64748B" marker-end="url(#ds1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ds1-soft)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ds1-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">www.example.com</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the name you type</text>
  <g filter="url(#ds1-lift)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="450" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#ds1-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">DNS</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">looks up the name</text>
  <g filter="url(#ds1-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ds1-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">203.0.113.10</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the address computers use</text>

  <rect x="40" y="340" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="365" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Like a phonebook</text>
  <text x="323" y="390" font-size="18.5" fill="#475569">look up a name, and get back the number you need</text>
  <rect x="64" y="415" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="440" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Port 53</text>
  <text x="323" y="440" font-size="18.5" fill="#475569">most DNS queries use UDP, which suits one small question and answer</text>
</svg>