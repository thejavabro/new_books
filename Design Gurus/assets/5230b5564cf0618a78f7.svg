<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="List useful options before choosing a feature.">
  <defs>

    <filter id="m1l5a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l5a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>
  <rect x="40" y="48" width="1160" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="78" font-size="16.5" font-weight="600" fill="#475569">One broad question, eight possible features</text>

  <text x="230" y="112" font-size="17" font-weight="700" text-anchor="middle" fill="#1D4ED8">Predictive</text>
  <rect x="70" y="128" width="320" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="230" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">Delivery-time prediction</text>
  <rect x="70" y="178" width="320" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="230" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">Recommendations</text>
  <rect x="70" y="228" width="320" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="230" y="255" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">Courier assignment</text>
  <rect x="70" y="278" width="320" height="42" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="230" y="305" text-anchor="middle" font-size="15" font-weight="600" fill="#1D4ED8">Refund fraud</text>
  <text x="610" y="112" font-size="17" font-weight="700" text-anchor="middle" fill="#5B21B6">Generative</text>
  <rect x="450" y="128" width="320" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="610" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#5B21B6">Support assistant</text>
  <rect x="450" y="178" width="320" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="610" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#5B21B6">Dish descriptions</text>
  <rect x="450" y="228" width="320" height="42" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="610" y="255" text-anchor="middle" font-size="15" font-weight="600" fill="#5B21B6">Review summaries</text>
  <text x="990" y="112" font-size="17" font-weight="700" text-anchor="middle" fill="#B45309">Agentic</text>
  <rect x="830" y="128" width="320" height="42" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="990" y="155" text-anchor="middle" font-size="15" font-weight="600" fill="#B45309">Ordering assistant</text>
  <rect x="40" y="362" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="396" font-size="16" fill="#475569">For an open question, briefly list the options before choosing one.</text>
  <rect x="64" y="422" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="444" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">List options briefly</text>
  <text x="288" y="444" font-size="15.5" fill="#475569">consider useful alternatives, not just the first idea</text>
  <rect x="64" y="466" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="488" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Then make a choice</text>
  <text x="288" y="488" font-size="15.5" fill="#475569">explain the benefit, available data, and main risks</text>
  <rect x="40" y="536" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="581" text-anchor="middle" font-size="16" fill="#475569">Choose a manageable feature and explain why it fits the requirements.</text>
</svg>