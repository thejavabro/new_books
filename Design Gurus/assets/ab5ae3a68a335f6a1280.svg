<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Requests join a fixed size queue and leave at a constant rate, so the outflow is smooth no matter how uneven the arrivals are">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="rl4-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rl4-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rl4-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="rl4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="200" y1="120" x2="1180" y2="120" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="240" cy="120" r="10" fill="#3B82F6"/>
  <circle cx="272" cy="120" r="10" fill="#3B82F6"/>
  <circle cx="304" cy="120" r="10" fill="#3B82F6"/>
  <circle cx="336" cy="120" r="10" fill="#3B82F6"/>
  <circle cx="900" cy="120" r="10" fill="#3B82F6"/>
  <circle cx="932" cy="120" r="10" fill="#3B82F6"/>
  <circle cx="964" cy="120" r="10" fill="#3B82F6"/>
  <text x="120" y="127" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">In</text>
  <text x="700" y="88" font-size="20" fill="#475569" text-anchor="middle">arrivals cluster, then go quiet, then cluster again</text>

  <line x1="620" y1="140" x2="620" y2="176" stroke="#3B82F6" stroke-width="3" marker-end="url(#rl4-blue)"/>
  <line x1="620" y1="292" x2="620" y2="334" stroke="#059669" stroke-width="3" marker-end="url(#rl4-green)"/>
  <line x1="800" y1="235" x2="845" y2="235" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rl4-red)"/>

  <g filter="url(#rl4-soft)">
    <rect x="440" y="180" width="360" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="850" y="195" width="310" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <text x="620" y="222" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Fixed size queue</text>
  <text x="620" y="256" font-size="20" fill="#3B82F6" text-anchor="middle">drains at a constant rate</text>
  <text x="1005" y="243" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">queue full, rejected</text>

  <line x1="200" y1="380" x2="1180" y2="380" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="240" cy="380" r="10" fill="#059669"/>
  <circle cx="340" cy="380" r="10" fill="#059669"/>
  <circle cx="440" cy="380" r="10" fill="#059669"/>
  <circle cx="540" cy="380" r="10" fill="#059669"/>
  <circle cx="640" cy="380" r="10" fill="#059669"/>
  <circle cx="740" cy="380" r="10" fill="#059669"/>
  <circle cx="840" cy="380" r="10" fill="#059669"/>
  <circle cx="940" cy="380" r="10" fill="#059669"/>
  <text x="120" y="387" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Out</text>

  <text x="620" y="440" font-size="20" fill="#475569" text-anchor="middle">Whatever shape the arrivals have, the output leaves at a constant rate</text>
</svg>