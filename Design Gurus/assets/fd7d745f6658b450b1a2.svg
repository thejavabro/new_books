<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="792" viewBox="0 0 1240 792" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three classes of failure a sync queue must distinguish before it advances: retryable without changing intent, requires catch-up or conflict handling, and never retry unchanged.">
  <defs>
    <filter id="p3h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3h-k1"><rect x="76" y="196" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3h-k2"><rect x="76" y="362" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3h-k3"><rect x="76" y="528" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3h-k4"><rect x="400" y="217" width="460" height="48" rx="10"/></clipPath>
    <clipPath id="p3h-k5"><rect x="400" y="383" width="460" height="48" rx="10"/></clipPath>
    <clipPath id="p3h-k6"><rect x="400" y="549" width="460" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="792" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="106" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">Classify the failure before advancing the queue</text>
  <text x="1176" y="74" text-anchor="end" font-size="15.5" fill="#94A3B8">three classes</text>
  <path d="M64,96 H1176" stroke="#E2E8F0" stroke-width="1.5" fill="none"/>
  <text x="76" y="126" font-size="15.5" font-weight="600" fill="#64748B">Class</text>
  <text x="400" y="126" font-size="15.5" font-weight="600" fill="#64748B">Which failures</text>
  <text x="888" y="126" font-size="15.5" font-weight="600" fill="#64748B">What the client does</text>

  
  <rect x="40" y="166" width="1160" height="150" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <g filter="url(#p3h-soft)">
    <rect x="76" y="196" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="196" width="6" height="90" fill="#059669" clip-path="url(#p3h-k1)"/>
  </g>
  <circle cx="114" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,230.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="248" font-size="18.5" font-weight="600" fill="#111827">Retryable, unchanged</text>

  <g filter="url(#p3h-soft)">
    <rect x="400" y="217" width="460" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="400" y="217" width="6" height="48" fill="#059669" clip-path="url(#p3h-k4)"/>
  </g>
  <circle cx="434" cy="241" r="4.5" fill="#059669"/>
  <text x="458" y="248" font-size="18.5" font-weight="600" fill="#111827">timeout, some 5xx, 429, 503</text>

  <text x="888" y="234" font-size="15.5" fill="#6B7280">Same body, same key, growing delays,</text>
  <text x="888" y="257" font-size="15.5" fill="#6B7280">at most four attempts</text>

  
  <rect x="40" y="332" width="1160" height="150" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <g filter="url(#p3h-soft)">
    <rect x="76" y="362" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="362" width="6" height="90" fill="#D97706" clip-path="url(#p3h-k2)"/>
  </g>
  <circle cx="114" cy="407" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,396.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="414" font-size="18.5" font-weight="600" fill="#111827">Needs catch-up first</text>

  <g filter="url(#p3h-soft)">
    <rect x="400" y="383" width="460" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="400" y="383" width="6" height="48" fill="#D97706" clip-path="url(#p3h-k5)"/>
  </g>
  <circle cx="434" cy="407" r="4.5" fill="#D97706"/>
  <text x="458" y="414" font-size="18.5" font-weight="600" fill="#111827">409 resync_required, 412</text>

  <text x="888" y="400" font-size="15.5" fill="#6B7280">Stop, catch up or resolve the</text>
  <text x="888" y="423" font-size="15.5" fill="#6B7280">conflict, then send new logical work</text>

  
  <rect x="40" y="498" width="1160" height="150" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <g filter="url(#p3h-soft)">
    <rect x="76" y="528" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="528" width="6" height="90" fill="#DB2777" clip-path="url(#p3h-k3)"/>
  </g>
  <circle cx="114" cy="573" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,562.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="580" font-size="18.5" font-weight="600" fill="#111827">Never retry unchanged</text>

  <g filter="url(#p3h-soft)">
    <rect x="400" y="549" width="460" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="400" y="549" width="6" height="48" fill="#DB2777" clip-path="url(#p3h-k6)"/>
  </g>
  <circle cx="434" cy="573" r="4.5" fill="#DB2777"/>
  <text x="458" y="580" font-size="18.5" font-weight="600" fill="#111827">400, 401, 403, private 404, bare 409</text>

  <text x="888" y="566" font-size="15.5" fill="#6B7280">Change something first; waiting</text>
  <text x="888" y="589" font-size="15.5" fill="#6B7280">alone will not help</text>

  
  <rect x="40" y="676" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="721" text-anchor="middle" font-size="16" fill="#475569">Later changes in the same dependency scope stay pending until the first failure is resolved.</text>
</svg>