<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="854" viewBox="0 0 1240 854" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The published lifecycle of a usage record: the response reports immediate counts and an estimated cost, the durable record becomes visible within five minutes, and it becomes final within twenty-four hours, at which point it may be used for invoicing.">
  <defs>
    <marker id="p26-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p26-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p26-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p26-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p26-k1"><rect x="245" y="184" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p26-k2"><rect x="715" y="184" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p26-k3"><rect x="245" y="374" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p26-k4"><rect x="715" y="374" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="p26-k5"><rect x="245" y="564" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p26-k6"><rect x="715" y="564" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="854" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">"Usage is eventually consistent" does not say when to stop waiting</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">three moments, in order</text>

  
  <rect x="40" y="126" width="1160" height="582" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">Moment</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">The final marker, and what it allows</text>

  
  <g fill="none" stroke-width="2">
    <path d="M645,229 H715" stroke="#64748B" marker-end="url(#p26-sl)"/>
    <path d="M645,419 H715" stroke="#64748B" marker-end="url(#p26-sl)"/>
    <path d="M445,322 V374" stroke="#64748B" marker-end="url(#p26-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M645,609 H715" stroke="#059669" marker-end="url(#p26-em)"/>
    <path d="M445,512 V564" stroke="#059669" marker-end="url(#p26-em)"/>
  </g>

  
  <g filter="url(#p26-soft)">
    <rect x="245" y="184" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="245" y="184" width="6" height="90" fill="#2563EB" clip-path="url(#p26-k1)"/>
  </g>
  <circle cx="283" cy="229" r="18" fill="#FFFFFF"/>
  <g transform="translate(272.56,218.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="309" y="236" font-size="18.5" font-weight="600" fill="#111827">With the response</text>

  <g filter="url(#p26-soft)">
    <rect x="715" y="184" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="715" y="184" width="6" height="90" fill="#D97706" clip-path="url(#p26-k2)"/>
  </g>
  <circle cx="753" cy="229" r="18" fill="#FFFFFF"/>
  <g transform="translate(742.56,218.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="779" y="236" font-size="18.5" font-weight="600" fill="#111827">final: false</text>

  <text x="620" y="299" text-anchor="middle" font-size="15.5" fill="#6B7280">Show the estimated cost under the price accepted at admission</text>

  
  <g filter="url(#p26-soft)">
    <rect x="245" y="374" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="245" y="374" width="6" height="90" fill="#2563EB" clip-path="url(#p26-k3)"/>
  </g>
  <circle cx="283" cy="419" r="18" fill="#FFFFFF"/>
  <g transform="translate(272.56,408.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="309" y="426" font-size="18.5" font-weight="600" fill="#111827">Within 5 minutes</text>

  <g filter="url(#p26-soft)">
    <rect x="715" y="374" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="715" y="374" width="6" height="90" fill="#D97706" clip-path="url(#p26-k4)"/>
  </g>
  <circle cx="753" cy="419" r="18" fill="#FFFFFF"/>
  <g transform="translate(742.56,408.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="779" y="426" font-size="18.5" font-weight="600" fill="#111827">final: false</text>

  <text x="620" y="489" text-anchor="middle" font-size="15.5" fill="#6B7280">The durable record is visible in /usage and may power a dashboard</text>

  
  <g filter="url(#p26-soft)">
    <rect x="245" y="564" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="245" y="564" width="6" height="90" fill="#2563EB" clip-path="url(#p26-k5)"/>
  </g>
  <circle cx="283" cy="609" r="18" fill="#FFFFFF"/>
  <g transform="translate(272.56,598.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="309" y="616" font-size="18.5" font-weight="600" fill="#111827">Within 24 hours</text>

  <g filter="url(#p26-lift)">
    <rect x="715" y="564" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="715" y="564" width="9" height="90" fill="#059669" clip-path="url(#p26-k6)"/>
  </g>
  <circle cx="753" cy="609" r="18" fill="#FFFFFF"/>
  <g transform="translate(742.56,598.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="779" y="616" font-size="18.5" font-weight="600" fill="#111827">final: true</text>

  <text x="620" y="679" text-anchor="middle" font-size="15.5" fill="#6B7280">finalized_at is set; an invoice or accounting export may use it</text>

  
  <rect x="40" y="738" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="783" text-anchor="middle" font-size="16" fill="#475569">If reconciliation changes a record, add an adjustment rather than silently rewriting a final one.</text>
</svg>