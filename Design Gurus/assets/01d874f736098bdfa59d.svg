<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="herd-title herd-desc">
<title id="herd-title">The pooler as a bulkhead</title>
<desc id="herd-desc">Without a pooler a slow database causes timeouts, timeouts cause retries, and retries open more connections, which is a self-sustaining cascade. With a pooler the surge waits in a bounded queue with a timeout, so some requests wait and some fail fast while the database keeps running at its best rate.</desc>
<defs>
<marker id="herd-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="herd-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="herd-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="herd-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="664" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The pooler as a bulkhead</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The pooler is what stops all three, and it stops them the same way.</text>
<rect x="40" y="586" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="586" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="330" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V442A6 6 0 0 0 46 448H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Without a pooler</text>
<rect x="72" y="176" width="228" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="186" y="200.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the database</text><text x="186" y="227.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">slows down</text>
<rect x="72" y="268" width="228" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="186" y="306" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">clients time out</text>
<rect x="72" y="360" width="228" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="186" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">clients retry</text>
<rect x="340" y="360" width="228" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="454" y="384.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">retries open</text><text x="454" y="411.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">MORE connections</text>
<rect x="340" y="176" width="228" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="454" y="200.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the database slows</text><text x="454" y="227.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">down further</text>
<path d="M186 243V263" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M186 243V263" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#herd-marker-red)"/>
<path d="M186 335V355" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M186 335V355" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#herd-marker-red)"/>
<path d="M304 392H335" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M304 392H335" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#herd-marker-red)"/>
<path d="M548 357V245" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M548 357V245" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#herd-marker-red)"/>
<path d="M336 208H305" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M336 208H305" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#herd-marker-red)"/>
<text x="444" y="292" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">self-sustaining</text><text x="444" y="319" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">once it starts</text>
<rect x="640" y="118" width="560" height="330" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V442A6 6 0 0 0 646 448H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">With a pooler in front</text>
<rect x="672" y="176" width="130" height="140" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="737" y="238.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Demand</text><text x="737" y="265.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">surge</text>
<path d="M805 246H840" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M805 246H840" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#herd-marker-slate)"/>
<rect x="845" y="176" width="130" height="140" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="910" y="225" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Queue</text><text x="910" y="252" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">with a</text><text x="910" y="279" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">timeout</text>
<path d="M978 246H1013" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M978 246H1013" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#herd-marker-green)"/>
<rect x="1018" y="206" width="150" height="80" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1093" y="238.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Database</text><text x="1093" y="265.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">30 conns</text>
<rect x="672" y="344" width="496" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="672" y="344" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="696" y="376.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Some requests wait. Some fail fast.</text><text x="696" y="403.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">The database never leaves its best rate.</text>
<rect x="40" y="472" width="1160" height="88" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="472" width="5" height="88" rx="2.5" fill="#AC8BE8"/><text x="64" y="507.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Sharing connections is how a pooler saves memory.</text><text x="64" y="536.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Queueing with a timeout is how it saves the database during an incident.</text>
<text x="66" y="619" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A deploy, an expired cache entry and a retry storm are three different causes that arrive as the same thing.</text>
</svg>