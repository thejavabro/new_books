<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="852" viewBox="0 0 1240 852" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="smaller-title smaller-desc">
<title id="smaller-title">Designing the incident smaller</title>
<desc id="smaller-desc">Five design decisions that shrink an incident before it happens, each with a cost, and each working for failures nobody predicted.</desc>
<defs>
<marker id="smaller-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="smaller-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="smaller-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="smaller-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="852" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Designing the incident smaller</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Five design decisions that shrink an incident before it happens, each with a cost.</text>
<rect x="40" y="774" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="774" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A limit on how far it reaches</text>
<path d="M536 148H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 148H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#smaller-marker-slate)"/>
<rect x="576" y="118" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cells, shards or per-tenant partitioning,</text><text x="596" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so a bad deploy damages a fraction</text>
<circle cx="60" cy="214" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="184" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A way to turn things off</text>
<path d="M536 214H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 214H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#smaller-marker-slate)"/>
<rect x="576" y="184" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="207.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">flags are the fastest mitigation there is,</text><text x="596" y="232.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because they need no deploy</text>
<circle cx="60" cy="280" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="287" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="250" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="286" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Timeouts and limits</text>
<path d="M536 280H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 280H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#smaller-marker-slate)"/>
<rect x="576" y="250" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="273.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the default is to wait forever,</text><text x="596" y="298.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which makes one slow dependency total</text>
<circle cx="60" cy="346" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="353" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="316" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="352" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Designed degradation</text>
<path d="M536 346H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 346H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#smaller-marker-slate)"/>
<rect x="576" y="316" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="352" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">deciding in advance which features drop under pressure</text>
<circle cx="60" cy="412" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="419" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="382" width="440" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="418" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Deploys reversible in minutes</text>
<path d="M536 412H566" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 412H566" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#smaller-marker-slate)"/>
<rect x="576" y="382" width="624" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="596" y="405.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because undoing the last change is</text><text x="596" y="430.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the fastest fix for most incidents</text>
<rect x="40" y="462" width="1160" height="84" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="462" width="5" height="84" rx="2.5" fill="#39D5AA"/><text x="64" y="497" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Each converts a class of total outage into a partial one</text><text x="64" y="523" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is worth more than any improvement to response speed.</text>
<text x="40" y="582" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Every outage has a shape, set long before it happened</text>
<rect x="40" y="600" width="376" height="62" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="228" y="637" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How much it could affect</text>
<rect x="432" y="600" width="376" height="62" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="637" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How fast it could be seen</text>
<rect x="824" y="600" width="376" height="62" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1012" y="637" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How quickly it could be stopped</text>
<rect x="40" y="682" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="682" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="721" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">All three were decided at design time, often by somebody who did not realize it.</text>
<text x="66" y="808" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Process changes promise faster response. Design changes work for the failures you did not foresee.</text>
</svg>