<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Flowchart. The recommendation service goes down, the timeout fires at 800 ms, the breaker opens, and then one question is left: what does the user get? With no plan, an error page that only arrives faster. With a degradation plan, a page that renders without recommendations.">
  <defs>
    <marker id="m04-l07-degradation-path-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l07-degradation-path-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m04-l07-degradation-path-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <rect x="40" y="60" width="780" height="190" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="100" font-size="20" font-weight="600" fill="#B91C1C">The mechanisms all did their job</text>
  <text x="800" y="100" text-anchor="end" font-size="20" fill="#64748B">not one thread is wasted</text>

  <g filter="url(#m04-l07-degradation-path-soft)">
    <rect x="60" y="130" width="230" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="175" y="171" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Recommendation</text>
  <text x="175" y="203" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service goes down</text>
  <g filter="url(#m04-l07-degradation-path-soft)">
    <rect x="330" y="130" width="200" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="430" y="171" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Timeout fires</text>
  <text x="430" y="203" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">at 800 ms</text>
  <g filter="url(#m04-l07-degradation-path-soft)">
    <rect x="570" y="130" width="230" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="685" y="171" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Breaker opens</text>
  <text x="685" y="203" text-anchor="middle" font-size="20" fill="#64748B">calls stop for a while</text>

  <rect x="860" y="90" width="320" height="140" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="1020" y="130" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Graceful degradation</text>
  <text x="1020" y="165" text-anchor="middle" font-size="20" fill="#475569">give up capabilities in a</text>
  <text x="1020" y="195" text-anchor="middle" font-size="20" fill="#475569">chosen order, not all at once</text>

  <g filter="url(#m04-l07-degradation-path-soft)">
    <path d="M685,288 L985,380 L685,472 L385,380 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="685" y="387" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">What does the user get?</text>

  <g fill="none" stroke-width="2.5">
    <path d="M290,180 L322,180" stroke="#DC2626" marker-end="url(#m04-l07-degradation-path-rd)"/>
    <path d="M530,180 L562,180" stroke="#DC2626" marker-end="url(#m04-l07-degradation-path-rd)"/>
    <path d="M685,230 L685,282" stroke="#DC2626" marker-end="url(#m04-l07-degradation-path-rd)"/>
    <path d="M540,430 C460,470 380,490 330,552" stroke="#DC2626" marker-end="url(#m04-l07-degradation-path-rd)"/>
    <path d="M830,430 C900,470 890,490 920,552" stroke="#059669" marker-end="url(#m04-l07-degradation-path-em)"/>
  </g>

  <text x="390" y="498" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No plan</text>
  <text x="1010" y="498" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Degradation plan</text>

  <rect x="40" y="530" width="560" height="190" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="640" y="530" width="560" height="190" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g filter="url(#m04-l07-degradation-path-soft)">
    <rect x="60" y="560" width="520" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="320" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">An error page, only faster</text>
  <text x="320" y="643" text-anchor="middle" font-size="20" fill="#64748B">the machinery only delivered the failure sooner</text>
  <g filter="url(#m04-l07-degradation-path-soft)">
    <rect x="660" y="560" width="520" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="920" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The page renders without them</text>
  <text x="920" y="643" text-anchor="middle" font-size="20" fill="#64748B">the section is hidden, or filled from cache</text>
  <text x="60" y="706" font-size="20" font-weight="600" fill="#B91C1C">The outage reaches the user</text>
  <text x="1180" y="706" text-anchor="end" font-size="20" font-weight="600" fill="#065F46">The outage stays inside the system</text>

  <line x1="60" y1="790" x2="96" y2="790" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="797" font-size="20" fill="#475569">Failure path: detection fires, but the user still gets an error</text>
  <line x1="60" y1="830" x2="96" y2="830" stroke="#059669" stroke-width="4"/>
  <text x="108" y="837" font-size="20" fill="#475569">Degradation path: the page renders without the failed feature</text>
</svg>