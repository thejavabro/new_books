<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One fraud model at three thresholds: a higher threshold gains precision and loses recall, and the risk team picks the row">
  <defs>
    <marker id="c2oe2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c2oe2-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="c2oe2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2oe2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2oe2-k1"><rect x="80" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="c2oe2-k2"><rect x="380" y="136" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="c2oe2-k3"><rect x="660" y="136" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="c2oe2-k4"><rect x="940" y="136" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="c2oe2-k5"><rect x="612" y="480" width="326" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="796" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="294" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline: one day of payments, 2,000 of them fraud</text>
  <rect x="40" y="420" width="1160" height="222" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="450" font-size="16.5" font-weight="600" fill="#6D28D9">A policy decision, not a modeling one</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M300,181 H380" marker-end="url(#c2oe2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M420,302 H1130" marker-end="url(#c2oe2-mslate)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M775,338 V480" marker-end="url(#c2oe2-mviolet)"/></g>
  <g filter="url(#c2oe2-soft)">
    <rect x="80" y="136" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c2oe2-k1)"/>
  </g>
  <circle cx="118" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="144" y="188" font-size="18.5" font-weight="600" fill="#111827">Fraud model</text>
  <text x="190" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a score for each payment</text>
  <g filter="url(#c2oe2-soft)">
    <rect x="380" y="136" width="230" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="380" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#c2oe2-k2)"/>
  </g>
  <circle cx="418" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(407.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="380" y="124" font-size="15.5" font-weight="600" fill="#6B7280">high</text>
  <text x="444" y="188" font-size="18.5" font-weight="600" fill="#111827">Threshold 0.9</text>
  <text x="495" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">1,000 flagged, 900 fraud</text>
  <text x="495" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">precision 90%, recall 45%</text>
  <g filter="url(#c2oe2-lift)">
    <rect x="660" y="136" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="660" y="136" width="9" height="90" fill="#2563EB" clip-path="url(#c2oe2-k3)"/>
  </g>
  <circle cx="698" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="660" y="124" font-size="15.5" font-weight="600" fill="#6B7280">middle</text>
  <text x="724" y="188" font-size="18.5" font-weight="600" fill="#111827">Threshold 0.5</text>
  <text x="775" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">2,500 flagged, 1,500 fraud</text>
  <text x="775" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">precision 60%, recall 75%</text>
  <g filter="url(#c2oe2-soft)">
    <rect x="940" y="136" width="230" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="940" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#c2oe2-k4)"/>
  </g>
  <circle cx="978" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="940" y="124" font-size="15.5" font-weight="600" fill="#6B7280">low</text>
  <text x="1004" y="188" font-size="18.5" font-weight="600" fill="#111827">Threshold 0.2</text>
  <text x="1055" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">6,000 flagged, 1,800 fraud</text>
  <text x="1055" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">precision 30%, recall 90%</text>
  <g filter="url(#c2oe2-soft)">
    <rect x="612" y="480" width="326" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="612" y="480" width="6" height="90" fill="#7C3AED" clip-path="url(#c2oe2-k5)"/>
  </g>
  <circle cx="650" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(639.56,514.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="676" y="532" font-size="18.5" font-weight="600" fill="#111827">Risk team picks the row</text>
  <text x="775" y="595" font-size="15.5" text-anchor="middle" fill="#6B7280">weighs blocked good customers against missed fraud</text>
  <text x="775" y="617" font-size="15.5" text-anchor="middle" fill="#6B7280">and the cases the review team can handle</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="775" y="328" fill="#B45309">lower threshold: catches more fraud, blocks more good customers</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="789" y="392" fill="#5B21B6">show the tradeoff</text></g>
  <rect x="40" y="682" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="727" text-anchor="middle" font-size="16" fill="#475569">The model is the same in every row. Only the threshold changed.</text>
</svg>