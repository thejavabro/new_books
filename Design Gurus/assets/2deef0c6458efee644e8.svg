<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The YouTube data model: Video metadata with like, dislike, and view counters, Comment, User, and object storage holding the video and thumbnail files">
<defs>
<filter id="yt1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="yt1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="yt1-msl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="yt1-mind" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<clipPath id="yt1-k1"><rect x="70" y="50" width="470" height="286" rx="12"/></clipPath>
<clipPath id="yt1-k2"><rect x="760" y="50" width="400" height="250" rx="12"/></clipPath>
<clipPath id="yt1-k3"><rect x="760" y="400" width="400" height="214" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="870" fill="#FFFFFF"/>
<path d="M 760,160 H 662 Q 650,160 650,148 V 136 Q 650,124 638,124 H 543" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#yt1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="200" fill="#4338CA">every comment belongs</text><text x="650" y="222" fill="#4338CA">to one video</text></g><path d="M 540,268 H 638 Q 650,268 650,280 V 462 Q 650,474 662,474 H 757" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#yt1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="360" fill="#475569">one user uploads</text><text x="650" y="382" fill="#475569">many videos</text></g><path d="M 1080,300 V 397" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#yt1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="1080" y="355" fill="#4338CA">UserID names the author</text></g><path d="M 170,336 V 481" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#yt1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="320" y="435" fill="#475569">the row keeps the file path</text></g><g filter="url(#yt1-lift)">
<rect x="70" y="50" width="470" height="286" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="70" y="50" width="9" height="286" fill="#2563EB" clip-path="url(#yt1-k1)"/>
</g>
<circle cx="108" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,67.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M10 9l5 3-5 3z"/></g>
<text x="134" y="85" font-size="18.5" font-weight="600" fill="#111827">Video (one row per video)</text><text x="94" y="131" font-size="15.5" fill="#111827">VideoID</text><text x="516" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">primary key</text><line x1="84" y1="142" x2="526" y2="142" stroke="#93C5FD" stroke-width="1"/><text x="94" y="167" font-size="15.5" fill="#111827">Title, Description</text><text x="516" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">text</text><line x1="84" y1="178" x2="526" y2="178" stroke="#93C5FD" stroke-width="1"/><text x="94" y="203" font-size="15.5" fill="#111827">Size</text><text x="516" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">bytes</text><line x1="84" y1="214" x2="526" y2="214" stroke="#93C5FD" stroke-width="1"/><text x="94" y="239" font-size="15.5" fill="#111827">Thumbnail</text><text x="516" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">path to thumbnail files</text><line x1="84" y1="250" x2="526" y2="250" stroke="#93C5FD" stroke-width="1"/><text x="94" y="275" font-size="15.5" fill="#111827">Uploader/User</text><text x="516" y="275" font-size="15.5" text-anchor="end" fill="#6B7280">UserID of the uploader</text><line x1="84" y1="286" x2="526" y2="286" stroke="#93C5FD" stroke-width="1"/><text x="94" y="311" font-size="15.5" fill="#111827">Likes, Dislikes, Views</text><text x="516" y="311" font-size="15.5" text-anchor="end" fill="#6B7280">totals, keep changing</text><text x="305" y="361" font-size="15.5" text-anchor="middle" fill="#6B7280">230 new rows arrive every second</text><g filter="url(#yt1-soft)">
<rect x="760" y="50" width="400" height="250" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="760" y="50" width="6" height="250" fill="#4F46E5" clip-path="url(#yt1-k2)"/>
</g>
<circle cx="798" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,67.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
<text x="824" y="85" font-size="18.5" font-weight="600" fill="#111827">Comment</text><text x="784" y="131" font-size="15.5" fill="#111827">CommentID</text><text x="1136" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">primary key</text><line x1="774" y1="142" x2="1146" y2="142" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="167" font-size="15.5" fill="#111827">VideoID</text><text x="1136" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">the video it belongs to</text><line x1="774" y1="178" x2="1146" y2="178" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="203" font-size="15.5" fill="#111827">UserID</text><text x="1136" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">the author</text><line x1="774" y1="214" x2="1146" y2="214" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="239" font-size="15.5" fill="#111827">Comment</text><text x="1136" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">text</text><line x1="774" y1="250" x2="1146" y2="250" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="275" font-size="15.5" fill="#111827">TimeOfCreation</text><text x="1136" y="275" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><text x="960" y="325" font-size="15.5" text-anchor="middle" fill="#6B7280">five fields and nothing else</text><g filter="url(#yt1-soft)">
<rect x="760" y="400" width="400" height="214" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="760" y="400" width="6" height="214" fill="#64748B" clip-path="url(#yt1-k3)"/>
</g>
<circle cx="798" cy="428" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,417.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="824" y="435" font-size="18.5" font-weight="600" fill="#111827">User</text><text x="784" y="481" font-size="15.5" fill="#111827">UserID</text><text x="1136" y="481" font-size="15.5" text-anchor="end" fill="#6B7280">primary key</text><line x1="774" y1="492" x2="1146" y2="492" stroke="#94A3B8" stroke-width="1"/><text x="784" y="517" font-size="15.5" fill="#111827">Name, Email</text><text x="1136" y="517" font-size="15.5" text-anchor="end" fill="#6B7280">text</text><line x1="774" y1="528" x2="1146" y2="528" stroke="#94A3B8" stroke-width="1"/><text x="784" y="553" font-size="15.5" fill="#111827">Address, Age</text><text x="1136" y="553" font-size="15.5" text-anchor="end" fill="#6B7280">profile fields</text><line x1="774" y1="564" x2="1146" y2="564" stroke="#94A3B8" stroke-width="1"/><text x="784" y="589" font-size="15.5" fill="#111827">Registration details</text><text x="1136" y="589" font-size="15.5" text-anchor="end" fill="#6B7280">signup data</text><text x="960" y="639" font-size="15.5" text-anchor="middle" fill="#6B7280">grows only when someone registers</text><g stroke="#64748B" stroke-width="1.5">
<path d="M 130,500 L 130,604 A 150,16 0 0 0 430,604 L 430,500" fill="#E2E8F0"/>
<ellipse cx="280" cy="500" rx="150" ry="16" fill="#F8FAFC"/>
</g>
<text x="280" y="574" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Object storage</text><text x="280" y="645" font-size="15.5" text-anchor="middle" fill="#6B7280">video and thumbnail files, written once</text><text x="280" y="668" font-size="15.5" text-anchor="middle" fill="#94A3B8">step 6 weighs HDFS as the alternative</text><rect x="40" y="700" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="726" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/><text x="164" y="748" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Files never in rows</text><text x="288" y="748" font-size="15.5" fill="#475569">video and thumbnail files go to a separate store; each Video row keeps only the file path</text><rect x="64" y="770" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="792" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Counters in the row</text><text x="288" y="792" font-size="15.5" fill="#475569">likes, dislikes, and views keep changing; every other Video column is written once</text>
</svg>