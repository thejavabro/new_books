<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1240" viewBox="0 0 1240 1240" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of a course purchase. 1, the browser posts to /checkout on the API application. 2, the API stores a pending checkout session in PostgreSQL. 3, the API asks the payment provider for a checkout page with an idempotency key. 4, the API returns the page address to the browser. 5, the learner pays on the provider&#39;s hosted page. 6, the provider sends a payment.succeeded webhook to the API. 7, in one transaction the API stores the event ID, marks the payment paid, grants access and adds an email job. 8, after the commit the API answers the provider with a success status. 9, the browser polls GET /checkout/{id} every 2 seconds. 10, the API answers that access exists. 11, the worker claims the email job from PostgreSQL. 12, the worker sends the receipt through the email service.">
