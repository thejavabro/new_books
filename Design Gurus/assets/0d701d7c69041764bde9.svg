  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="218" y="251" fill="#1D4ED8">1. POST /checkout</text>
    <text x="414" y="313" fill="#1D4ED8">2. pending session</text>
    <text x="610" y="375" fill="#1D4ED8">3. create checkout page, idempotency key</text>
    <text x="218" y="437" fill="#1D4ED8">4. page address</text>
    <text x="512" y="499" fill="#1D4ED8">5. learner pays on the hosted page</text>
    <text x="610" y="561" fill="#1D4ED8">6. webhook: payment.succeeded</text>
    <text x="414" y="600" fill="#1D4ED8">7. one transaction:</text>
    <text x="414" y="623" fill="#1D4ED8">event ID, paid, access, job</text>
    <text x="680" y="685" fill="#1D4ED8">8. success status, after commit</text>
    <text x="218" y="747" fill="#1D4ED8">9. poll GET /checkout/{id} every 2 s</text>
    <text x="218" y="809" fill="#1D4ED8">10. access granted</text>
    <text x="610" y="871" fill="#B45309">11. claim email job</text>
    <text x="904" y="933" fill="#B45309">12. send receipt</text>
  </g>

