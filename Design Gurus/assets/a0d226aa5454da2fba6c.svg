<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="758" viewBox="0 0 1240 758" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="growth-title growth-desc">
<title id="growth-title">Growth compounds, and comes in two kinds</title>
<desc id="growth-desc">Five percent monthly growth is about 1.8 times a year, ten percent about 3.1 times and twenty percent about 8.9 times. Growth that can be absorbed by adding instances is budgeted; growth that crosses an architectural threshold needs a date by which the work must already be finished.</desc>
<defs>
<marker id="growth-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="growth-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="growth-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="growth-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="758" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Growth compounds, and comes in two kinds</text>
<text x="40" y="86" font-size="21" fill="#4A5568">What matters is not the rate but which kind of growth you are facing.</text>
<rect x="40" y="680" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="680" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Monthly growth, compounded over a year</text>
<rect x="40" y="168" width="230" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="155" y="197" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">5% a month</text>
<rect x="296" y="174" width="700" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="296" y="174" width="140.0" height="34" rx="10" fill="#06AC80"/>
<text x="1022" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">1.8x a year</text>
<rect x="40" y="224" width="230" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="155" y="253" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">10% a month</text>
<rect x="296" y="230" width="700" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="296" y="230" width="241.1" height="34" rx="10" fill="#E8BC60"/>
<text x="1022" y="254" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">3.1x a year</text>
<rect x="40" y="280" width="230" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="155" y="309" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">20% a month</text>
<rect x="296" y="286" width="700" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="296" y="286" width="692.2" height="34" rx="10" fill="#F25461"/>
<text x="1022" y="310" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">8.9x a year</text>
<text x="620" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Monthly rates sound modest. Annual multipliers do not.</text>
<rect x="40" y="380" width="560" height="170" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 380H46A6 6 0 0 0 40 386V544A6 6 0 0 0 46 550H54Z" fill="#39D5AA"/><text x="70" y="416" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Growth you can absorb</text>
<text x="70" y="446" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">handled by adding instances</text><text x="70" y="472" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">behind the same design</text>
<rect x="70" y="490" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="519" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">plan it, budget it, move on</text>
<rect x="640" y="380" width="560" height="170" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 380H646A6 6 0 0 0 640 386V544A6 6 0 0 0 646 550H654Z" fill="#F28B9D"/><text x="670" y="416" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Growth that forces a redesign</text>
<text x="670" y="446" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">crosses an architectural threshold,</text><text x="670" y="472" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">so it needs a date attached</text>
<rect x="670" y="490" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="519" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the date the work must be FINISHED</text>
<rect x="40" y="574" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="574" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="606.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">"We cross the single-primary write limit in about seven months,</text><text x="64" y="633.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">and partitioning takes a quarter, so it starts within three."</text>
<text x="66" y="714" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Plan only as far ahead as you can actually act. Further than that is forecasting, not capacity planning.</text>
</svg>