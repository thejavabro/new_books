<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="932" viewBox="0 0 1240 932" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities for a payment platform: a customer pays a merchant, the platform acts as gateway and processor, fraud checks gate authorization, card data is replaced by a token, and card networks reach the issuing and acquiring banks">
  <defs>
    <filter id="payk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="payk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="payk-k1"><rect x="40" y="340" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="payk-k2"><rect x="300" y="340" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="payk-k3"><rect x="580" y="340" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="payk-k4"><rect x="580" y="160" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="payk-k5"><rect x="580" y="520" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="payk-k6"><rect x="940" y="340" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="payk-k7"><rect x="940" y="160" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="payk-k8"><rect x="940" y="520" width="260" height="90" rx="12"/></clipPath>
    <marker id="payk-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="payk-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="payk-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="payk-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="payk-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="payk-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="payk-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="932" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Payment system: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The money moves through four parties the platform does not own, which is why every step must be reversible.</text>



  <g fill="none" stroke-width="2">
    <path d="M230,365 H300" stroke="#2563EB" marker-end="url(#payk-m-blue)"/>
    <path d="M510,365 H580" stroke="#64748B" marker-end="url(#payk-m-slate)"/>
    <path d="M870,365 H940" stroke="#4F46E5" marker-end="url(#payk-m-indigo)"/>
    <path d="M845,340 V250" stroke="#DB2777" marker-end="url(#payk-m-pink)"/>
    <path d="M845,430 V520" stroke="#D97706" marker-end="url(#payk-m-amber)"/>
    <path d="M1175,340 V250" stroke="#7C3AED" marker-end="url(#payk-m-violet)"/>
    <path d="M1175,430 V520" stroke="#7C3AED" marker-end="url(#payk-m-violet)"/>
    <path d="M940,565 H928 Q916,565 916,577 V678 Q916,690 904,690 H497 Q485,690 485,678 V430" stroke="#059669" stroke-width="2.5" marker-end="url(#payk-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="265" y="352" fill="#1D4ED8">pays</text>
    <text x="545" y="352" fill="#475569">charge</text>
    <text x="903" y="336" fill="#4338CA">authorize</text>
    <text x="890" y="300" fill="#BE185D">scored</text>
    <text x="890" y="480" fill="#B45309">tokenized</text>
    <text x="300" y="682" fill="#047857">payout to the merchant, minus fees</text>
  </g>

  <g filter="url(#payk-soft)">
    <rect x="40" y="340" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="340" width="6" height="90" fill="#2563EB" clip-path="url(#payk-k1)"/>
  </g>
  <circle cx="78" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,374.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="392" font-size="21.5" font-weight="600" fill="#111827">Customer</text>
  <text x="135" y="459" font-size="18.5" text-anchor="middle" fill="#6B7280">provides a card</text>
  <text x="135" y="486" font-size="18.5" text-anchor="middle" fill="#94A3B8">or another method</text>
  <g filter="url(#payk-soft)">
    <rect x="300" y="340" width="210" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="300" y="340" width="6" height="90" fill="#64748B" clip-path="url(#payk-k2)"/>
  </g>
  <circle cx="338" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,374.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="364" y="392" font-size="21.5" font-weight="600" fill="#111827">Merchant</text>
  <text x="405" y="459" font-size="18.5" text-anchor="middle" fill="#6B7280">calls the API</text>
  <g filter="url(#payk-lift)">
    <rect x="580" y="340" width="290" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="580" y="340" width="9" height="90" fill="#4F46E5" clip-path="url(#payk-k3)"/>
  </g>
  <circle cx="618" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(607.56,374.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="644" y="392" font-size="21.5" font-weight="600" fill="#111827">Payment Platform</text>
  <text x="725" y="459" font-size="18.5" text-anchor="middle" fill="#6B7280">gateway plus processor</text>
  <g filter="url(#payk-soft)">
    <rect x="580" y="160" width="290" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="580" y="160" width="6" height="90" fill="#DB2777" clip-path="url(#payk-k4)"/>
  </g>
  <circle cx="618" cy="205" r="18" fill="#FFFFFF"/>
  <g transform="translate(607.56,194.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="644" y="212" font-size="21.5" font-weight="600" fill="#111827">Fraud Detection</text>
  <text x="725" y="279" font-size="18.5" text-anchor="middle" fill="#6B7280">scored before authorizing</text>
  <text x="725" y="306" font-size="18.5" text-anchor="middle" fill="#94A3B8">decline or hold for review</text>
  <g filter="url(#payk-soft)">
    <rect x="580" y="520" width="290" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="580" y="520" width="6" height="90" fill="#D97706" clip-path="url(#payk-k5)"/>
  </g>
  <circle cx="618" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(607.56,554.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="644" y="572" font-size="21.5" font-weight="600" fill="#111827">Payment Token</text>
  <text x="725" y="639" font-size="18.5" text-anchor="middle" fill="#6B7280">stands in for the card</text>
  <text x="725" y="666" font-size="18.5" text-anchor="middle" fill="#94A3B8">raw numbers are never stored</text>
  <g filter="url(#payk-soft)">
    <rect x="940" y="340" width="260" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="940" y="340" width="6" height="90" fill="#7C3AED" clip-path="url(#payk-k6)"/>
  </g>
  <circle cx="978" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,374.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="1004" y="392" font-size="21.5" font-weight="600" fill="#111827">Card Network</text>
  <text x="1070" y="459" font-size="18.5" text-anchor="middle" fill="#6B7280">Visa, Mastercard, Amex</text>
  <g filter="url(#payk-soft)">
    <rect x="940" y="160" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="940" y="160" width="6" height="90" fill="#059669" clip-path="url(#payk-k7)"/>
  </g>
  <circle cx="978" cy="205" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,194.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1004" y="212" font-size="21.5" font-weight="600" fill="#111827">Issuing Bank</text>
  <text x="1070" y="279" font-size="18.5" text-anchor="middle" fill="#6B7280">the customer bank</text>
  <text x="1070" y="306" font-size="18.5" text-anchor="middle" fill="#94A3B8">approves or declines</text>
  <g filter="url(#payk-soft)">
    <rect x="940" y="520" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="940" y="520" width="6" height="90" fill="#059669" clip-path="url(#payk-k8)"/>
  </g>
  <circle cx="978" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,554.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="1004" y="572" font-size="21.5" font-weight="600" fill="#111827">Acquiring Bank</text>
  <text x="1070" y="639" font-size="18.5" text-anchor="middle" fill="#6B7280">the merchant bank</text>
  <text x="1070" y="666" font-size="18.5" text-anchor="middle" fill="#94A3B8">receives the settlement</text>

  <rect x="40" y="730" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Authorization</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">the bank holds the funds but has not moved them; capture is a separate later step</text>
  <rect x="64" y="805" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="830" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Chargeback</text>
  <text x="323" y="830" font-size="18.5" fill="#475569">the customer disputes through their own bank, funds are pulled back, and the merchant must answer</text>
  <rect x="64" y="855" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="880" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Refund</text>
  <text x="323" y="880" font-size="18.5" fill="#475569">a reverse transaction the merchant starts, which is not the same thing as a chargeback</text>
</svg>