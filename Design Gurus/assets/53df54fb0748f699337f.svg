<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="545" viewBox="0 0 1240 545" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One shared backend serving a web client, a mobile client and a TV client, each of which needs a different amount of data in a different shape">
  <defs>
    <marker id="bff1-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <clipPath id="bff1-k1"><rect x="460" y="104" width="320" height="78" rx="12"/></clipPath>
    <clipPath id="bff1-k2"><rect x="72" y="262" width="300" height="76" rx="12"/></clipPath>
    <clipPath id="bff1-k3"><rect x="470" y="262" width="300" height="76" rx="12"/></clipPath>
    <clipPath id="bff1-k4"><rect x="868" y="262" width="300" height="76" rx="12"/></clipPath>
    <filter id="bff1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bff1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="545" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="360" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">One backend, three clients that need different things</text>
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M222,262 V236 Q222,220 238,220 H604 Q620,220 620,204 V182" marker-end="url(#bff1-mpink)"/>
    <path d="M620,262 V182" marker-end="url(#bff1-mpink)"/>
    <path d="M1018,262 V236 Q1018,220 1002,220 H636 Q620,220 620,204 V182" marker-end="url(#bff1-mpink)"/>
  </g>
  <g filter="url(#bff1-lift)">
    <rect x="460" y="104" width="320" height="78" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="460" y="104" width="9" height="78" fill="#DB2777" clip-path="url(#bff1-k1)"/>
  </g>
  <circle cx="498" cy="143" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,132.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="524" y="150" font-size="18.5" font-weight="600" fill="#111827">One Shared Backend</text>
  <g filter="url(#bff1-soft)">
    <rect x="72" y="262" width="300" height="76" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="262" width="6" height="76" fill="#64748B" clip-path="url(#bff1-k2)"/>
  </g>
  <circle cx="110" cy="300" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,289.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="307" font-size="18.5" font-weight="600" fill="#111827">Web</text>
  <text x="222" y="363" font-size="15.5" text-anchor="middle" fill="#6B7280">a large screen, so it can show everything</text>
  <g filter="url(#bff1-soft)">
    <rect x="470" y="262" width="300" height="76" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="470" y="262" width="6" height="76" fill="#64748B" clip-path="url(#bff1-k3)"/>
  </g>
  <circle cx="508" cy="300" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,289.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="534" y="307" font-size="18.5" font-weight="600" fill="#111827">Mobile</text>
  <text x="620" y="363" font-size="15.5" text-anchor="middle" fill="#6B7280">a small screen on a slow network</text>
  <g filter="url(#bff1-soft)">
    <rect x="868" y="262" width="300" height="76" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="868" y="262" width="6" height="76" fill="#64748B" clip-path="url(#bff1-k4)"/>
  </g>
  <circle cx="906" cy="300" r="18" fill="#FFFFFF"/>
  <g transform="translate(895.56,289.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="932" y="307" font-size="18.5" font-weight="600" fill="#111827">TV</text>
  <text x="1018" y="363" font-size="15.5" text-anchor="middle" fill="#6B7280">few fields, but large artwork</text>
  <rect x="40" y="440" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="464" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="486" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The squeeze</text>
  <text x="288" y="486" font-size="15.5" fill="#475569">one response shape must suit all three, so every client gets fields it will not use</text>
</svg>