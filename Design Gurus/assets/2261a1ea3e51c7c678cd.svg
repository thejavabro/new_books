<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On a CDN cache miss, the request goes to the load balancer, which picks a healthy server, then the API gateway, which checks authentication and rate limits, then the app server. The app server checks the cache first and reads the database only if needed.">
  <defs>
    <filter id="tw2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="tw2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="tw2-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tw2-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tw2-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tw2-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="tw2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="tw2-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="tw2-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">What happens at the origin on a CDN miss</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The request passes several parts, and the app checks the cache before the database.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#tw2-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#tw2-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#tw2-m-slate)"/>
    <path d="M1000,230 V290 Q1000,305 985,305 H786 Q771,305 771,320 V364" stroke="#D97706" marker-end="url(#tw2-m-amber)"/>
    <path d="M1110,230 V364" stroke="#4F46E5" marker-end="url(#tw2-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="880" y="297" fill="#B45309">1. check first</text>
    <text x="1160" y="320" fill="#4338CA">2. if needed</text>
  </g>

  <g filter="url(#tw2-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#D97706" clip-path="url(#tw2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">CDN edge</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">cache miss</text>
  <g filter="url(#tw2-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#tw2-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">picks a healthy server</text>
  <g filter="url(#tw2-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#tw2-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">API gateway</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">checks auth and limits</text>
  <g filter="url(#tw2-lift)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="949" y="140" width="9" height="90" fill="#2563EB" clip-path="url(#tw2-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">App server</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M646,380 L646,454 A125,16 0 0 0 896,454 L896,380" fill="#FEF3C7"/>
    <ellipse cx="771" cy="380" rx="125" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="771" y="432" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Cache</text>
  <text x="771" y="504" font-size="18.5" text-anchor="middle" fill="#6B7280">fast, in memory</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M949,380 L949,454 A125,16 0 0 0 1199,454 L1199,380" fill="#E0E7FF"/>
    <ellipse cx="1074" cy="380" rx="125" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="1074" y="432" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="1074" y="504" font-size="18.5" text-anchor="middle" fill="#6B7280">only on a cache miss</text>

  <rect x="40" y="560" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="585" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="610" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">CDN miss</text>
  <text x="323" y="610" font-size="18.5" fill="#475569">only requests the edge server cannot answer reach the origin</text>
  <rect x="64" y="635" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="660" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">On the way back</text>
  <text x="323" y="660" font-size="18.5" fill="#475569">the CDN can store a copy, so the next nearby user gets a hit</text>
</svg>