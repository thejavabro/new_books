<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="790" viewBox="0 0 1300 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two-phase commit: the coordinator asks each shard directly, collects a binding yes from each, records the decision in its own log, then orders both to commit">
  <rect x="0" y="0" width="1300" height="790" fill="#FFFFFF"/>
  <defs>
    <marker id="s" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <marker id="g" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  
  <rect x="70" y="28" width="300" height="66" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="220" y="69" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">Coordinator</text>

  <rect x="500" y="28" width="300" height="66" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="650" y="60" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">Shard 2</text>
  <text x="650" y="84" font-size="19" fill="#334155" text-anchor="middle">subtract $50</text>

  <rect x="930" y="28" width="300" height="66" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="1080" y="60" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">Shard 5</text>
  <text x="1080" y="84" font-size="19" fill="#334155" text-anchor="middle">add $50</text>

  
  <line x1="220" y1="94" x2="220" y2="712" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="650" y1="94" x2="650" y2="712" stroke="#059669" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="1080" y1="94" x2="1080" y2="712" stroke="#3B82F6" stroke-width="2" stroke-dasharray="7 6"/>

  
  <rect x="60" y="122" width="1180" height="38" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="650" y="149" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Phase 1: prepare</text>

  <text x="435" y="196" font-size="20" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">prepare: can you commit?</text>
  <line x1="220" y1="208" x2="642" y2="208" stroke="#334155" stroke-width="2.5" marker-end="url(#s)"/>

  <text x="650" y="246" font-size="20" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">prepare: can you commit?</text>
  <line x1="220" y1="258" x2="1072" y2="258" stroke="#334155" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="470" y="288" width="770" height="72" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="855" y="317" font-size="20" fill="#334155" text-anchor="middle">Each shard does the work, writes a PREPARED record to its</text>
  <text x="855" y="345" font-size="20" fill="#334155" text-anchor="middle">write-ahead log, and holds its locks.</text>

  <text x="435" y="398" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">YES: a binding promise</text>
  <line x1="642" y1="410" x2="228" y2="410" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#g)"/>

  <text x="650" y="448" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">YES: a binding promise</text>
  <line x1="1072" y1="460" x2="228" y2="460" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#g)"/>

  
  <rect x="60" y="490" width="410" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="265" y="519" font-size="20" fill="#334155" text-anchor="middle">The coordinator writes COMMIT to</text>
  <text x="265" y="547" font-size="20" fill="#334155" text-anchor="middle">its own log. That entry is the decision.</text>

  
  <rect x="60" y="586" width="1180" height="38" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="650" y="613" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Phase 2: commit</text>

  <text x="435" y="654" font-size="20" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">commit</text>
  <line x1="220" y1="666" x2="642" y2="666" stroke="#334155" stroke-width="2.5" marker-end="url(#s)"/>

  <text x="650" y="694" font-size="20" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">commit</text>
  <line x1="220" y1="706" x2="1072" y2="706" stroke="#334155" stroke-width="2.5" marker-end="url(#s)"/>

  
  <text x="60" y="762" font-size="20" font-weight="700" fill="#0F172A">The coordinator talks to every shard directly. Shards never ask each other, which is why the coordinator's silence freezes them all.</text>
</svg>