<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1268" viewBox="0 0 1240 1268" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six-part interview move for a screen call plan: name the screen, list what it shows, count the current calls, name the failure, choose one bounded fix, and price it.">
  <defs>
    <marker id="p3d-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p3d-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="p3d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3d-k1"><rect x="360" y="100" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p3d-k2"><rect x="360" y="275" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p3d-k3"><rect x="360" y="450" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p3d-k4"><rect x="360" y="625" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p3d-k5"><rect x="360" y="800" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p3d-k6"><rect x="360" y="975" width="520" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1268" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="1080" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Six moves, in this order</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">for one screen call plan</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,231 V275" stroke="#64748B" marker-end="url(#p3d-sl)"/>
    <path d="M620,406 V450" stroke="#64748B" marker-end="url(#p3d-sl)"/>
    <path d="M620,581 V625" stroke="#64748B" marker-end="url(#p3d-sl)"/>
    <path d="M620,756 V800" stroke="#64748B" marker-end="url(#p3d-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,931 V975" stroke="#D97706" marker-end="url(#p3d-am)"/>
  </g>

  
  <g filter="url(#p3d-soft)">
    <rect x="360" y="100" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="360" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#p3d-k1)"/>
  </g>
  <circle cx="398" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="424" y="152" font-size="18.5" font-weight="600" fill="#111827">1. Name the screen</text>
  <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">One important, stable, latency-sensitive view.</text>

  
  <g filter="url(#p3d-soft)">
    <rect x="360" y="275" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="360" y="275" width="6" height="90" fill="#2563EB" clip-path="url(#p3d-k2)"/>
  </g>
  <circle cx="398" cy="320" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,309.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="424" y="327" font-size="18.5" font-weight="600" fill="#111827">2. List what it shows</text>
  <text x="620" y="390" font-size="15.5" text-anchor="middle" fill="#6B7280">Every field the first paint actually needs.</text>

  
  <g filter="url(#p3d-soft)">
    <rect x="360" y="450" width="520" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="360" y="450" width="6" height="90" fill="#64748B" clip-path="url(#p3d-k3)"/>
  </g>
  <circle cx="398" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,484.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="424" y="502" font-size="18.5" font-weight="600" fill="#111827">3. Count the current calls</text>
  <text x="620" y="565" font-size="15.5" text-anchor="middle" fill="#6B7280">Blocking round trips, not total requests.</text>

  
  <g filter="url(#p3d-soft)">
    <rect x="360" y="625" width="520" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="360" y="625" width="6" height="90" fill="#DB2777" clip-path="url(#p3d-k4)"/>
  </g>
  <circle cx="398" cy="670" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,659.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="424" y="677" font-size="18.5" font-weight="600" fill="#111827">4. Name the failure</text>
  <text x="620" y="740" font-size="15.5" text-anchor="middle" fill="#6B7280">Over-fetching, the API-level N+1, or neither.</text>

  
  <g filter="url(#p3d-soft)">
    <rect x="360" y="800" width="520" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="360" y="800" width="6" height="90" fill="#059669" clip-path="url(#p3d-k5)"/>
  </g>
  <circle cx="398" cy="845" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,834.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="424" y="852" font-size="18.5" font-weight="600" fill="#111827">5. Choose one bounded fix</text>
  <text x="620" y="915" font-size="15.5" text-anchor="middle" fill="#6B7280">Embed, include, a screen operation, or GraphQL.</text>

  
  <g filter="url(#p3d-lift)">
    <rect x="360" y="975" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="360" y="975" width="9" height="90" fill="#D97706" clip-path="url(#p3d-k6)"/>
  </g>
  <circle cx="398" cy="1020" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,1009.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="424" y="1027" font-size="18.5" font-weight="600" fill="#111827">6. Price it</text>
  <text x="620" y="1090" font-size="15.5" text-anchor="middle" fill="#6B7280">Say the cost aloud, including who should not use this operation.</text>

  
  <rect x="40" y="1152" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1197" text-anchor="middle" font-size="16" fill="#475569">The six moves turn one named screen into a call count, a named failure, one bounded fix, and a stated cost.</text>
</svg>