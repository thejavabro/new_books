<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1650" viewBox="0 0 1240 1650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven trade-offs of the calendar API, each with what it gives and the cost accepted: one stored recurrence rule, a required 366-day range, computed occurrences, an exception per changed date, a split for this and later, a local start plus time zone name, and UTC occurrence output.">
  <defs>
    <filter id="p30-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p30-k1"><rect x="76" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p30-k2"><rect x="76" y="342" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p30-k3"><rect x="76" y="538" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p30-k4"><rect x="76" y="734" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p30-k5"><rect x="76" y="930" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p30-k6"><rect x="76" y="1126" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p30-k7"><rect x="76" y="1322" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1650" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Calendar: seven choices, seven costs</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760,71 L764.5,75.5 L772,65.5"/>
  </g>
  <text x="786" y="77" font-size="15.5" fill="#6B7280">what it gives</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M960,66 L971,77 M971,66 L960,77"/>
  </g>
  <text x="983" y="77" font-size="15.5" fill="#6B7280">cost accepted</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p30-soft)">
    <rect x="76" y="146" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p30-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">One stored recurrence rule</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,256 L82.5,260.5 L90,250.5"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">A series with no end can be represented at all.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,277 L89,288 M89,277 L78,288"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Bounded expansion work on every read.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p30-soft)">
    <rect x="76" y="342" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#059669" clip-path="url(#p30-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">A required 366-day range</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,452 L82.5,456.5 L90,446.5"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">A hard ceiling on computation and response size.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,473 L89,484 M89,473 L78,484"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Several calls for a client rendering more than a year.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p30-soft)">
    <rect x="76" y="538" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p30-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">Computed occurrences</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,648 L82.5,652.5 L90,642.5"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">A rule change affects future views without rewriting rows.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,669 L89,680 M89,669 L78,680"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">Occurrence identity needs the event id plus the original local start.</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p30-soft)">
    <rect x="76" y="734" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#059669" clip-path="url(#p30-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">An exception per changed date</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,844 L82.5,848.5 L90,838.5"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">Moving or cancelling one date does not alter the series.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,865 L89,876 M89,865 L78,876"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Applying a finite exception set during every expansion.</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p30-soft)">
    <rect x="76" y="930" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#059669" clip-path="url(#p30-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">A split for this and later</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1040 L82.5,1044.5 L90,1034.5"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">Past and future rules stay correct and independently editable.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1061 L89,1072 M89,1061 L78,1072"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">A new event id, and an all-or-nothing two-write batch.</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p30-soft)">
    <rect x="76" y="1126" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#059669" clip-path="url(#p30-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">Local start plus zone name</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1236 L82.5,1240.5 L90,1230.5"/>
  </g>
  <text x="104" y="1242" font-size="15.5" fill="#6B7280">Nine in the morning stays nine across offset changes.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1257 L89,1268 M89,1257 L78,1268"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">Publishing the behavior for ambiguous and missing local times.</text>

  
  <rect x="40" y="1302" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p30-soft)">
    <rect x="76" y="1322" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1322" width="6" height="90" fill="#059669" clip-path="url(#p30-k7)"/>
  </g>
  <circle cx="114" cy="1367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1356.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="1374" font-size="18.5" font-weight="600" fill="#111827">UTC occurrence output</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1432 L82.5,1436.5 L90,1426.5"/>
  </g>
  <text x="104" y="1438" font-size="15.5" fill="#6B7280">Every consumer receives an absolute instant.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1453 L89,1464 M89,1453 L78,1464"/>
  </g>
  <text x="104" y="1464" font-size="15.5" fill="#6B7280">Carrying original_start_local separately, for identity.</text>

  
  <rect x="40" y="1510" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1552" text-anchor="middle" font-size="16" fill="#475569">Each card is the design chosen, with what it gives above the cost accepted.</text>
  <text x="620" y="1580" text-anchor="middle" font-size="16" fill="#475569">The cost proves that the alternative was actually considered.</text>
</svg>