<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="714" viewBox="0 0 1240 714" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="amp-title amp-desc">
<title id="amp-title">The same workload through both engines</title>
<desc id="amp-desc">Ten thousand writes per second of one kilobyte rows is ten megabytes per second of logical writes. A B-tree at three times write amplification sends about thirty megabytes per second of mostly random input and output. An LSM tree under leveled compaction at ten times sends about one hundred megabytes per second, almost all of it sequential.</desc>
<defs>
<marker id="amp-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="amp-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="amp-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="amp-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="714" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The same workload through both engines</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Take 10,000 writes per second of 1 KB rows, which is 10 MB/s of logical writes.</text>
<rect x="40" y="636" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="636" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="420" y="118" width="400" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="142.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">10,000 writes/sec of 1 KB rows</text><text x="620" y="169.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">= 10 MB/s of logical writes</text>
<path d="M540 188L330 228" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M540 188L330 228" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amp-marker-slate)"/>
<path d="M700 188L910 228" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M700 188L910 228" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amp-marker-slate)"/>
<rect x="40" y="234" width="560" height="272" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 234H46A6 6 0 0 0 40 240V500A6 6 0 0 0 46 506H54Z" fill="#F3CF6A"/><text x="70" y="270" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">B-tree at 3x write amplification</text>
<text x="70" y="296" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Postgres, MySQL/InnoDB</text>
<rect x="72" y="312" width="496" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="72" y="312" width="148.8" height="34" rx="10" fill="#E8BC60"/>
<text x="320" y="384" font-size="26" font-weight="700" fill="#91642E" text-anchor="middle">30 MB/s to the device</text>
<rect x="140" y="404" width="360" height="50" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="435" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">mostly RANDOM I/O</text>
<text x="320" y="486" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">plus page splits and fragmentation</text>
<rect x="640" y="234" width="560" height="272" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 234H646A6 6 0 0 0 640 240V500A6 6 0 0 0 646 506H654Z" fill="#39D5AA"/><text x="670" y="270" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">LSM, leveled compaction, at 10x</text>
<text x="670" y="296" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Cassandra, ScyllaDB, RocksDB</text>
<rect x="672" y="312" width="496" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="672" y="312" width="496.0" height="34" rx="10" fill="#06AC80"/>
<text x="920" y="384" font-size="26" font-weight="700" fill="#169B77" text-anchor="middle">100 MB/s to the device</text>
<rect x="740" y="404" width="360" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="435" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">almost all SEQUENTIAL</text>
<text x="920" y="486" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">plus CPU for the merges</text>
<rect x="40" y="530" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="530" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="562.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">More bytes written does not mean more load on the device.</text><text x="64" y="589.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A modern SSD handles 100 MB/s sequential more easily than 30 MB/s random.</text>
<text x="66" y="670" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This is why the same request rate can be comfortable on an LSM engine and saturate a B-tree.</text>
</svg>