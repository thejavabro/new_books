<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for a flash sale: browse the sale, attempt a purchase, and see a queue position; with strict first come first served ordering, no overselling, and an order confirmed only after payment succeeds">
  <defs>
    <filter id="flsf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="flsf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="flsf-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="flsf-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="flsf-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="flsf-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="flsf-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="flsf-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Flash sale: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the system has to do. Split into what a buyer does, and what the system has to guarantee while they do it.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">What a buyer does</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#BE185D">What the system must guarantee</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#flsf-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#D97706" clip-path="url(#flsf-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Browse the sale</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">items, price and how much</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">stock is left</text>
  <g filter="url(#flsf-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#flsf-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Attempt a purchase</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">one quick action, under</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">very heavy load</text>
  <g filter="url(#flsf-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#flsf-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">See queue position</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">so waiting feels fair</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">rather than broken</text>
  <g filter="url(#flsf-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#059669" clip-path="url(#flsf-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">First come, first served</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">allocated in the exact order</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">requests arrived</text>
  <g filter="url(#flsf-lift)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="450" y="430" width="9" height="90" fill="#DB2777" clip-path="url(#flsf-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Never oversell</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">at zero stock every further</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">attempt must fail cleanly</text>
  <g filter="url(#flsf-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#64748B" clip-path="url(#flsf-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Paid, then confirmed</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">an order is only real once</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">payment has succeeded</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Oversell</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">two buyers taking the last unit. The whole design exists to make this impossible under extreme concurrency</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Queue</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">requests admitted in order rather than all at once, which turns a stampede into a line</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Global</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">buyers in every region hit the same limited stock, so the counter cannot simply be replicated per region</text>
</svg>