<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1390" viewBox="0 0 1240 1390" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="C4 deployment diagram for production. The Customer, Restaurant and Courier apps run on phones and tablets and call a managed load balancer over HTTPS in one cloud region. The load balancer forwards HTTP requests to the backend application, which runs in a Docker container on each of 6 web server virtual machines. The matching worker runs in a Docker container on each of 3 worker server virtual machines. Both use one managed PostgreSQL instance over SQL. The backend calls the external payment provider and the external push and SMS services over HTTPS.">
