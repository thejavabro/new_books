<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A request arrives. If a token is available, the request takes one token and passes immediately. If the bucket is empty, the request is rejected immediately with 429, and the client can retry later.">
  <defs>
    <filter id="tvl1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="tvl1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="tvl1-k1"><rect x="40" y="290" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="tvl1-k2"><rect x="470" y="140" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="tvl1-k3"><rect x="470" y="440" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="tvl1-k4"><rect x="900" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="tvl1-k5"><rect x="900" y="440" width="300" height="90" rx="12"/></clipPath>
    <marker id="tvl1-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="tvl1-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a token bucket handles each request</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Capacity: 5 tokens. Refill rate: 2 tokens per second.</text>



  <g fill="none" stroke-width="2">
    <path d="M320,315 H400 Q415,315 415,300 V200 Q415,185 430,185 H470" stroke="#059669" marker-end="url(#tvl1-m-emerald)"/>
    <path d="M320,355 H400 Q415,355 415,370 V470 Q415,485 430,485 H470" stroke="#DB2777" marker-end="url(#tvl1-m-pink)"/>
    <path d="M800,185 H900" stroke="#059669" marker-end="url(#tvl1-m-emerald)"/>
    <path d="M800,485 H900" stroke="#DB2777" marker-end="url(#tvl1-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#tvl1-soft)">
    <rect x="40" y="290" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#tvl1-k1)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">Request arrives</text>
  <g filter="url(#tvl1-lift)">
    <rect x="470" y="140" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="470" y="140" width="9" height="90" fill="#059669" clip-path="url(#tvl1-k2)"/>
  </g>
  <circle cx="508" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="534" y="192" font-size="21.5" font-weight="600" fill="#111827">Token available</text>
  <text x="635" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">take 1 token</text>
  <g filter="url(#tvl1-soft)">
    <rect x="470" y="440" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="470" y="440" width="6" height="90" fill="#DB2777" clip-path="url(#tvl1-k3)"/>
  </g>
  <circle cx="508" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,474.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="534" y="492" font-size="21.5" font-weight="600" fill="#111827">Bucket is empty</text>
  <text x="635" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">0 tokens left</text>
  <g filter="url(#tvl1-soft)">
    <rect x="900" y="140" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="900" y="140" width="6" height="90" fill="#059669" clip-path="url(#tvl1-k4)"/>
  </g>
  <circle cx="938" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="964" y="192" font-size="21.5" font-weight="600" fill="#111827">Request passes</text>
  <text x="1050" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">immediately</text>
  <g filter="url(#tvl1-soft)">
    <rect x="900" y="440" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="900" y="440" width="6" height="90" fill="#DB2777" clip-path="url(#tvl1-k5)"/>
  </g>
  <circle cx="938" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,474.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="964" y="492" font-size="21.5" font-weight="600" fill="#111827">Reject with 429</text>
  <text x="1050" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">client retries later</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Capacity</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">the largest burst allowed, collected while the client is idle</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Refill rate</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">the long-term rate, once the saved tokens are used up</text>
</svg>