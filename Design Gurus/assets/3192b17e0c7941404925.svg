<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1290" viewBox="0 0 1240 1290" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rows. Synchronous: the client places an order with the order service, which calls the inventory, payment, notification and analytics services in turn and waits for each response. Event-driven: the order service publishes an OrderPlaced event to an event broker such as Kafka; the inventory, notification and analytics services react to it, the inventory service publishes InventoryReserved, and the payment service reacts to that. In the synchronous row the order service answers the client only after step 5; in the event-driven row it answers right after publishing">
