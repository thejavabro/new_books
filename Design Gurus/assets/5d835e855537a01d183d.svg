<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A global index is partitioned by the indexed value, so a lookup goes to one index shard for the primary key and then to one data shard for the row">
  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
  <defs>
    <marker id="ix17-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="ix17-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="36" width="520" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="280" y="72" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">WHERE email = 'alice@example.com'</text>

  
  <path d="M170,92 L170,144" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix17-blue)"/>
  <path d="M170,260 C170,330 1100,296 1100,344" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix17-blue)"/>

  
  <text x="1220" y="132" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="end">Index shards, partitioned by email</text>
  <g filter="url(#ix17-soft)">
    <rect x="50" y="150" width="240" height="110" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
    <rect x="360" y="150" width="240" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="670" y="150" width="240" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="980" y="150" width="240" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="170" y="192" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">emails starting a to f</text>
  <text x="170" y="228" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">alice lives here</text>
  <text x="480" y="192" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">emails starting g to m</text>
  <text x="480" y="228" font-size="20" fill="#CBD5E1" text-anchor="middle">not asked</text>
  <text x="790" y="192" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">emails starting n to s</text>
  <text x="790" y="228" font-size="20" fill="#CBD5E1" text-anchor="middle">not asked</text>
  <text x="1100" y="192" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">emails starting t to z</text>
  <text x="1100" y="228" font-size="20" fill="#CBD5E1" text-anchor="middle">not asked</text>

  
  <text x="20" y="332" font-size="20" font-weight="600" fill="#1E3A8A">Data shards, partitioned by user id</text>
  <g filter="url(#ix17-soft)">
    <rect x="50" y="350" width="240" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="360" y="350" width="240" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="670" y="350" width="240" height="110" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="980" y="350" width="240" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  </g>
  <text x="170" y="392" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">Shard 1</text>
  <text x="170" y="428" font-size="20" fill="#CBD5E1" text-anchor="middle">not asked</text>
  <text x="480" y="392" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">Shard 2</text>
  <text x="480" y="428" font-size="20" fill="#CBD5E1" text-anchor="middle">not asked</text>
  <text x="790" y="392" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">Shard 3</text>
  <text x="790" y="428" font-size="20" fill="#CBD5E1" text-anchor="middle">not asked</text>
  <text x="1100" y="392" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shard 4</text>
  <text x="1100" y="428" font-size="20" font-weight="600" fill="#1D4ED8" text-anchor="middle">the row is here</text>

  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="196" y="124" font-size="20" fill="#1D4ED8">1. the email value picks one index shard</text>
    <text x="640" y="288" font-size="20" fill="#1D4ED8" text-anchor="middle">2. fetch the row</text>
  </g>

  <text x="620" y="516" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">No fan-out. Two targeted hops, and neither gets slower when you add shards.</text>

  <rect x="120" y="552" width="1000" height="116" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="588" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">The bill arrives on the write side.</text>
  <text x="620" y="620" font-size="20" fill="#334155" text-anchor="middle">Inserting a user on shard 4 has to add an index entry on a different machine. Doing that</text>
  <text x="620" y="648" font-size="20" fill="#334155" text-anchor="middle">asynchronously is what makes a global index eventually consistent.</text>

  <text x="620" y="716" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A global index buys read latency and pays for it in write complexity and staleness.</text>
</svg>