<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="778" viewBox="0 0 1240 778" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="brief-title brief-desc">
<title id="brief-title">Two architectures, same SLA</title>
<desc id="brief-desc">A container fleet and a set of functions, both meeting the same availability and latency target, with a given rate card so the comparison is self-contained.</desc>
<defs>
<marker id="brief-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="brief-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="brief-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="brief-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="778" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two architectures, same SLA</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A container fleet and a set of functions, both meeting the same availability and latency target.</text>
<rect x="40" y="700" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="700" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="72" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="72" rx="2.5" fill="#AC8BE8"/><text x="64" y="147" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">300 million requests a month, a daily cycle peaking at four times the mean</text><text x="64" y="173" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">8 KB responses, two database reads per request, stateless service</text>
<rect x="40" y="202" width="560" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SLA: 99.9% available, p99 under 200 ms</text>
<rect x="640" y="202" width="560" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Both designs meet it</text>
<rect x="40" y="270" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 270H46A6 6 0 0 0 40 276V428A6 6 0 0 0 46 434H54Z" fill="#5EC9EC"/><text x="70" y="306" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">A: a container fleet</text>
<rect x="72" y="326" width="496" height="94" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="354" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">three zones, autoscaled 3 to 6</text><text x="92" y="379" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">about 150 req/sec per instance</text><text x="92" y="404" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">private subnets, gateway per zone</text>
<rect x="640" y="270" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 270H646A6 6 0 0 0 640 276V428A6 6 0 0 0 646 434H654Z" fill="#F3CF6A"/><text x="670" y="306" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">B: functions</text>
<rect x="672" y="326" width="496" height="94" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="354" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one function per route</text><text x="692" y="379" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">about 100 ms at 512 MB</text><text x="692" y="404" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no instances, no gateway in the subnet</text>
<text x="40" y="470" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The rate card is given, so nothing needs looking up</text>
<rect x="40" y="488" width="560" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="516" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">instance</text><text x="584" y="516" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$0.10 / hour</text>
<rect x="640" y="488" width="560" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="656" y="516" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">committed instance</text><text x="1184" y="516" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">60% off, one year</text>
<rect x="40" y="536" width="560" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="564" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">load balancer</text><text x="584" y="564" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$30 / month</text>
<rect x="640" y="536" width="560" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="656" y="564" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">subnet gateway</text><text x="1184" y="564" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$0.045 / hour per zone</text>
<rect x="40" y="584" width="560" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="612" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">function requests</text><text x="584" y="612" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$0.20 / million</text>
<rect x="640" y="584" width="560" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="656" y="612" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">function duration</text><text x="1184" y="612" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$0.0000166667 / GB-s</text>
<rect x="40" y="632" width="560" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="660" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">API gateway, HTTP</text><text x="584" y="660" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$1.00 / million</text>
<rect x="640" y="632" width="560" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="656" y="660" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">API gateway, REST</text><text x="1184" y="660" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$3.50 / million</text>
<text x="66" y="734" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Pick the cheaper one, prove it with numbers, then say whether the number should decide it.</text>
</svg>