<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six kinds of software read the HTTP method and decide something from it: the caller SDK, the retry library, shared caches, proxies and gateways, browsers and developer tools, and observability systems. None of them read the documentation sentence.">
