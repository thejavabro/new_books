    <path d="M580,453 H520" marker-end="url(#xl03methodr-sl)"/>
    <path d="M580,613 H520" marker-end="url(#xl03methodr-sl)"/>
    <path d="M660,293 H720" marker-end="url(#xl03methodr-sl)"/>
    <path d="M660,453 H720" marker-end="url(#xl03methodr-sl)"/>
    <path d="M660,613 H720" marker-end="url(#xl03methodr-sl)"/>
  </g>

  
  <g filter="url(#xl03methodr-lift)">
    <rect x="490" y="88" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="490" y="88" width="9" height="90" fill="#64748B" clip-path="url(#xl03methodr-k0)"/>
