    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="164" y="300" font-size="18.5" font-weight="600" fill="#111827">Caller SDK</text>
  <text x="310" y="363" font-size="15.5" text-anchor="middle" fill="#6B7280">decides how to construct and expose the operation</text>

  
  <g filter="url(#xl03methodr-soft)">
    <rect x="720" y="248" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="720" y="248" width="6" height="90" fill="#D97706" clip-path="url(#xl03methodr-k2)"/>
