    <clipPath id="xl03methodr-k4"><rect x="720" y="408" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl03methodr-k5"><rect x="100" y="568" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl03methodr-k6"><rect x="720" y="568" width="420" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="870" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="690" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Software uses HTTP methods to interpret requests.</text>

  
