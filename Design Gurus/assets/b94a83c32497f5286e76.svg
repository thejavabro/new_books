  </g>
  <text x="554" y="140" font-size="18.5" font-weight="600" fill="#111827">POST /orders</text>

  
  <g filter="url(#xl03methodr-soft)">
    <rect x="100" y="248" width="420" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="248" width="6" height="90" fill="#2563EB" clip-path="url(#xl03methodr-k1)"/>
  </g>
  <circle cx="138" cy="293" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,282.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
