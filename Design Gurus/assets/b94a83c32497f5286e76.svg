  <circle cx="758" cy="293" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,282.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="784" y="300" font-size="18.5" font-weight="600" fill="#111827">Retry library</text>
  <text x="930" y="363" font-size="15.5" text-anchor="middle" fill="#6B7280">decides whether repeating after a timeout is safe</text>

  
  <g filter="url(#xl03methodr-soft)">
    <rect x="100" y="408" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="100" y="408" width="6" height="90" fill="#059669" clip-path="url(#xl03methodr-k3)"/>
  </g>
  <circle cx="138" cy="453" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,442.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="164" y="460" font-size="18.5" font-weight="600" fill="#111827">Shared cache</text>
  <text x="310" y="523" font-size="15.5" text-anchor="middle" fill="#6B7280">decides whether a response may be reused</text>

  
  <g filter="url(#xl03methodr-soft)">
    <rect x="720" y="408" width="420" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="720" y="408" width="6" height="90" fill="#64748B" clip-path="url(#xl03methodr-k4)"/>
  </g>
  <circle cx="758" cy="453" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,442.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="784" y="460" font-size="18.5" font-weight="600" fill="#111827">Proxy or gateway</text>
  <text x="930" y="523" font-size="15.5" text-anchor="middle" fill="#6B7280">decides how to route or protect the request</text>

  
  <g filter="url(#xl03methodr-soft)">
    <rect x="100" y="568" width="420" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="100" y="568" width="6" height="90" fill="#7C3AED" clip-path="url(#xl03methodr-k5)"/>
  </g>
  <circle cx="138" cy="613" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,602.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="164" y="620" font-size="18.5" font-weight="600" fill="#111827">Browser and dev tools</text>
  <text x="310" y="683" font-size="15.5" text-anchor="middle" fill="#6B7280">decides whether the operation reads or writes</text>

  
  <g filter="url(#xl03methodr-soft)">
    <rect x="720" y="568" width="420" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="720" y="568" width="6" height="90" fill="#4F46E5" clip-path="url(#xl03methodr-k6)"/>
  </g>
  <circle cx="758" cy="613" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,602.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="784" y="620" font-size="18.5" font-weight="600" fill="#111827">Observability system</text>
  <text x="930" y="683" font-size="15.5" text-anchor="middle" fill="#6B7280">decides how to group and interpret the traffic</text>

  
  <rect x="40" y="754" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="799" text-anchor="middle" font-size="16" fill="#475569">GET /cancelOrder is not harmless because the path says cancel. A prefetcher sees a safe read.</text>
