<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="silent-title silent-desc">
<title id="silent-title">The failures nobody sees</title>
<desc id="silent-desc">The dangerous failures in a billing pipeline are the quiet ones, and each has a specific control that makes it visible.</desc>
<defs>
<marker id="silent-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="silent-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="silent-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="silent-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="832" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The failures nobody sees</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The failure modes here are unusual because the dangerous ones are silent.</text>
<rect x="40" y="754" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="754" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="205" y="156" font-size="19" font-weight="700" fill="#8795A5" text-anchor="middle">the failure</text>
<text x="605" y="156" font-size="19" font-weight="700" fill="#8795A5" text-anchor="middle">what happens</text>
<text x="1020" y="156" font-size="19" font-weight="700" fill="#8795A5" text-anchor="middle">the control</text>
<rect x="40" y="172" width="330" height="84" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="205" y="206.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An input event is lost</text><text x="205" y="233.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">before the log</text>
<rect x="390" y="172" width="430" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="195" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the invoice is wrong and nothing detects</text><text x="410" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it, because the system never knew the</text><text x="410" y="245" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">event existed</text>
<rect x="840" y="172" width="360" height="84" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1020" y="206.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">count reconciled</text><text x="1020" y="233.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">against the source</text>
<rect x="40" y="264" width="330" height="84" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="205" y="298.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The charge succeeds,</text><text x="205" y="325.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the record fails</text>
<rect x="390" y="264" width="430" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="299.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the system believes they were not</text><text x="410" y="324.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">charged, so the next run charges again</text>
<rect x="840" y="264" width="360" height="84" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1020" y="298.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the idempotency key makes</text><text x="1020" y="325.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the second attempt harmless</text>
<rect x="40" y="356" width="330" height="84" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="205" y="390.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The charge times out,</text><text x="205" y="417.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">outcome unknown</text>
<rect x="390" y="356" width="430" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="391.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most common real case, and a blind</text><text x="410" y="416.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">retry is a coin flip</text>
<rect x="840" y="356" width="360" height="84" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1020" y="390.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">query the provider</text><text x="1020" y="417.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">by the stored key</text>
<rect x="40" y="448" width="330" height="84" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="205" y="482.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Rating is right,</text><text x="205" y="509.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the plan data is stale</text>
<rect x="390" y="448" width="430" height="84" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="483.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a plan change applied after the close</text><text x="410" y="508.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">alters an invoice already sent</text>
<rect x="840" y="448" width="360" height="84" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1020" y="482.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">plan changes are events</text><text x="1020" y="509.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">with effective dates</text>
<rect x="40" y="554" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="554" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="587" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Blast radius has a different accent here</text><text x="64" y="613" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The question is not how many customers a failure touches. It is whether it is detectable.</text>
<rect x="40" y="656" width="1160" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="684.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cost is not the constraint here. The pipeline is a few hundred a month,</text><text x="620" y="711.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and the discrepancy work is months of engineers</text>
<text x="66" y="788" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An undetectable billing error compounds every month.</text>
</svg>