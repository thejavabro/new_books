<text x="420" y="278" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">a</text>
<circle cx="560" cy="180" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="560" y="188" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">b</text>
<circle cx="700" cy="180" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<text x="700" y="188" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">l</text>
<circle cx="840" cy="180" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="840" y="188" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">e</text>
<circle cx="560" cy="360" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="560" y="368" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">t</text>
<circle cx="700" cy="360" r="30" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<text x="700" y="368" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">c</text>
<circle cx="840" cy="360" r="30" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="840" y="368" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">h</text>
<text x="140" y="330" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#94A3B8">root</text>
<text x="940" y="188" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">cab, cable</text>
<text x="940" y="368" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">cat, catch</text>
<text x="940" y="270" text-anchor="start" font-size="19.5" font-weight="600" fill="#5B21B6">typing "ca" lands here</text>
<text x="940" y="300" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">suggestions sit below</text>
<rect x="40" y="558" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="580" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="606" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">a prefix</text>
<text x="348" y="606" font-size="19.5" fill="#475569">a path from the root spells this much of a word</text>
<rect x="64" y="628" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="654" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">end of a word</text>
<text x="348" y="654" font-size="19.5" fill="#475569">the mark that separates a real word from a prefix</text>
<rect x="64" y="676" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="702" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">the root</text>
<text x="348" y="702" font-size="19.5" fill="#475569">holds no character, and every word starts here</text>
<rect x="64" y="724" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="750" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the saving</text>
<text x="348" y="750" font-size="19.5" fill="#475569">"ca" is stored once and shared by all four words</text>
</svg>