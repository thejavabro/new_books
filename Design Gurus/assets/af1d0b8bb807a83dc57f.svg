<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="822" viewBox="0 0 1240 822" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A trie storing four words that share prefixes, with the end of word marks shown"><rect x="0" y="0" width="1240" height="822" fill="#FFFFFF"/>
