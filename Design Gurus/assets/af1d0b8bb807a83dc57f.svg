<path d="M590.0,360.0 L670.0,360.0" stroke="#A5B4FC" stroke-width="2.2" fill="none"/>
<path d="M730.0,360.0 L810.0,360.0" stroke="#A5B4FC" stroke-width="2.2" fill="none"/>
<circle cx="140" cy="270" r="30" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
