<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="866" viewBox="0 0 1240 866" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three limits apply to every inference request and all three must be satisfied: a request bucket protecting admission overhead, a token bucket protecting model work, and a concurrency limit protecting occupied execution capacity.">
  <defs>
    <filter id="p29-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p29-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p29-k1"><rect x="76" y="172" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p29-k2"><rect x="784" y="193" width="380" height="48" rx="10"/></clipPath>
    <clipPath id="p29-k3"><rect x="76" y="364" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p29-k4"><rect x="784" y="385" width="380" height="48" rx="10"/></clipPath>
    <clipPath id="p29-k5"><rect x="76" y="556" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p29-k6"><rect x="784" y="577" width="380" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="866" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">One request is not one unit of inference work</text>
  <g transform="translate(980,63) scale(0.6)" fill="none" stroke="#059669" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="1006" y="77" font-size="15.5" fill="#6B7280">it protects against</text>

  
  <text x="76" y="134" font-size="15.5" font-weight="600" fill="#64748B">Limit</text>
  <text x="784" y="134" font-size="15.5" font-weight="600" fill="#64748B">Example capacity</text>

  
  <rect x="40" y="150" width="1160" height="176" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p29-soft)">
    <rect x="76" y="172" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="172" width="6" height="90" fill="#2563EB" clip-path="url(#p29-k1)"/>
  </g>
  <circle cx="114" cy="217" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,206.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="224" font-size="18.5" font-weight="600" fill="#111827">Request bucket</text>

  <g filter="url(#p29-soft)">
    <rect x="784" y="193" width="380" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="784" y="193" width="6" height="48" fill="#64748B" clip-path="url(#p29-k2)"/>
  </g>
  <circle cx="818" cy="217" r="4.5" fill="#64748B"/>
  <text x="842" y="224" font-size="18.5" font-weight="600" fill="#111827">60, refill 1 per second</text>

  <g transform="translate(78,287) scale(0.6)" fill="none" stroke="#059669" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="104" y="300" font-size="15.5" fill="#6B7280">Admission and request-handling overhead</text>

  
  <rect x="40" y="342" width="1160" height="176" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p29-soft)">
    <rect x="76" y="364" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="364" width="6" height="90" fill="#2563EB" clip-path="url(#p29-k3)"/>
  </g>
  <circle cx="114" cy="409" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,398.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="140" y="416" font-size="18.5" font-weight="600" fill="#111827">Token bucket</text>

  <g filter="url(#p29-soft)">
    <rect x="784" y="385" width="380" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="784" y="385" width="6" height="48" fill="#64748B" clip-path="url(#p29-k4)"/>
  </g>
  <circle cx="818" cy="409" r="4.5" fill="#64748B"/>
  <text x="842" y="416" font-size="18.5" font-weight="600" fill="#111827">240,000, refill 4,000 per second</text>

  <g transform="translate(78,479) scale(0.6)" fill="none" stroke="#059669" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="104" y="492" font-size="15.5" fill="#6B7280">Too much model work over time</text>

  
  <rect x="40" y="534" width="1160" height="176" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p29-lift)">
    <rect x="76" y="556" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="556" width="9" height="90" fill="#2563EB" clip-path="url(#p29-k5)"/>
  </g>
  <circle cx="114" cy="601" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,590.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="608" font-size="18.5" font-weight="600" fill="#111827">Concurrent responses</text>

  <g filter="url(#p29-soft)">
    <rect x="784" y="577" width="380" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="784" y="577" width="6" height="48" fill="#64748B" clip-path="url(#p29-k6)"/>
  </g>
  <circle cx="818" cy="601" r="4.5" fill="#64748B"/>
  <text x="842" y="608" font-size="18.5" font-weight="600" fill="#111827">4 active responses</text>

  <g transform="translate(78,671) scale(0.6)" fill="none" stroke="#059669" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="104" y="684" font-size="15.5" fill="#6B7280">Too much work held at the same time, by long streams</text>

  
  <rect x="40" y="726" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="768" text-anchor="middle" font-size="16" fill="#475569">Remaining request capacity does not excuse exhausted tokens, and neither excuses a full concurrency limit.</text>
  <text x="620" y="796" text-anchor="middle" font-size="16" fill="#475569">A caller making four requests a minute can still fill four slots if each stream lasts the whole minute.</text>
</svg>