<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same record in both formats: XML wraps every value in opening and closing tags, JSON writes key and value pairs with native types">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <filter id="mc2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="46" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The same record, written two ways</text>

  
  <rect x="20" y="76" width="580" height="380" rx="14" fill="#F5F3FF" fill-opacity="0.4" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="112" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">XML</text>

  <rect x="640" y="76" width="580" height="380" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="112" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">JSON</text>

  
  <g filter="url(#mc2-soft)">
    <rect x="50" y="130" width="520" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="74" y="166" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#5B21B6">&lt;person&gt;</text>
  <text x="98" y="196" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#334155">&lt;name&gt;John Doe&lt;/name&gt;</text>
  <text x="98" y="226" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#334155">&lt;age&gt;30&lt;/age&gt;</text>
  <text x="98" y="256" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#334155">&lt;city&gt;New York&lt;/city&gt;</text>
  <text x="74" y="286" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#5B21B6">&lt;/person&gt;</text>

  <text x="310" y="368" font-size="20" fill="#64748B" text-anchor="middle">every value sits between two tags</text>
  <text x="310" y="402" font-size="20" fill="#64748B" text-anchor="middle">age arrives as the text "30"</text>
  <text x="310" y="436" font-size="20" fill="#64748B" text-anchor="middle">schema, XPath and XSLT available</text>

  
  <g filter="url(#mc2-soft)">
    <rect x="670" y="130" width="520" height="200" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="694" y="166" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#1E40AF">{</text>
  <text x="718" y="196" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#334155">"name": "John Doe",</text>
  <text x="718" y="226" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#334155">"age": 30,</text>
  <text x="718" y="256" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#334155">"city": "New York"</text>
  <text x="694" y="286" font-size="20" font-family="Consolas, &#39;Courier New&#39;, monospace" fill="#1E40AF">}</text>

  <text x="930" y="368" font-size="20" fill="#64748B" text-anchor="middle">key and value pairs, no closing tags</text>
  <text x="930" y="402" font-size="20" fill="#64748B" text-anchor="middle">age arrives as the number 30</text>
  <text x="930" y="436" font-size="20" fill="#64748B" text-anchor="middle">parsed by one call in any language</text>

  
  <rect x="60" y="490" width="500" height="70" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="310" y="533" font-size="20" fill="#5B21B6" text-anchor="middle">documents, strict contracts, older systems</text>

  <rect x="680" y="490" width="500" height="70" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="930" y="533" font-size="20" fill="#1E40AF" text-anchor="middle">web and mobile APIs, logs, configuration</text>
</svg>