      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c6saas3-k1"><rect x="40" y="330" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="c6saas3-k2"><rect x="340" y="260" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="c6saas3-k3"><rect x="640" y="190" width="270" height="90" rx="12"/></clipPath>
