    <clipPath id="c6saas3-k6"><rect x="360" y="590" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="c6saas3-k7"><rect x="650" y="590" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="c6saas3-k8"><rect x="940" y="590" width="230" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="16.5" font-weight="600" fill="#374151">Data governance tiers: each tenant picks one</text>
  <rect x="40" y="510" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="540" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: how a tenant's tier reaches the request path</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M60,475 H1190" marker-end="url(#c6saas3-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M310,635 H360" marker-end="url(#c6saas3-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M600,635 H650" marker-end="url(#c6saas3-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M890,635 H940" marker-end="url(#c6saas3-m64748b)"/></g>
  <g filter="url(#c6saas3-soft)">
    <rect x="40" y="330" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="330" width="6" height="90" fill="#64748B" clip-path="url(#c6saas3-k1)"/>
  </g>
  <circle cx="78" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,364.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="40" y="318" font-size="15.5" font-weight="600" fill="#6B7280">Tier 1</text>
  <text x="104" y="382" font-size="18.5" font-weight="600" fill="#111827">Opt out of training use</text>
  <text x="175" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">never used to train or tune any model</text>
  <g filter="url(#c6saas3-soft)">
    <rect x="340" y="260" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="260" width="6" height="90" fill="#2563EB" clip-path="url(#c6saas3-k2)"/>
  </g>
  <circle cx="378" cy="305" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,294.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="340" y="248" font-size="15.5" font-weight="600" fill="#6B7280">Tier 2</text>
  <text x="404" y="312" font-size="18.5" font-weight="600" fill="#111827">Zero-retention APIs</text>
  <text x="475" y="375" font-size="15.5" text-anchor="middle" fill="#6B7280">the provider does not store the request</text>
  <g filter="url(#c6saas3-soft)">
    <rect x="640" y="190" width="270" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="640" y="190" width="6" height="90" fill="#4F46E5" clip-path="url(#c6saas3-k3)"/>
  </g>
  <circle cx="678" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,224.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="640" y="178" font-size="15.5" font-weight="600" fill="#6B7280">Tier 3</text>
  <text x="704" y="242" font-size="18.5" font-weight="600" fill="#111827">Regional inference</text>
  <text x="775" y="305" font-size="15.5" text-anchor="middle" fill="#6B7280">requests run only in a chosen region</text>
  <g filter="url(#c6saas3-soft)">
    <rect x="940" y="120" width="260" height="110" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="940" y="120" width="6" height="110" fill="#7C3AED" clip-path="url(#c6saas3-k4)"/>
  </g>
  <circle cx="978" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,164.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="940" y="108" font-size="15.5" font-weight="600" fill="#6B7280">Tier 4</text>
  <text x="1004" y="170" font-size="18.5" font-weight="600" fill="#111827">Models in the</text>
  <text x="1004" y="194" font-size="18.5" font-weight="600" fill="#111827">platform's own fleet</text>
  <text x="1070" y="255" font-size="15.5" text-anchor="middle" fill="#6B7280">no third-party model provider</text>
  <g filter="url(#c6saas3-soft)">
    <rect x="70" y="590" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="590" width="6" height="90" fill="#64748B" clip-path="url(#c6saas3-k5)"/>
  </g>
  <circle cx="108" cy="635" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,624.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="134" y="642" font-size="18.5" font-weight="600" fill="#111827">Tenant's tier</text>
  <text x="190" y="705" font-size="15.5" text-anchor="middle" fill="#6B7280">one tier per tenant</text>
  <g filter="url(#c6saas3-soft)">
    <rect x="360" y="590" width="240" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="360" y="590" width="6" height="90" fill="#4F46E5" clip-path="url(#c6saas3-k6)"/>
  </g>
  <circle cx="398" cy="635" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,624.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="424" y="642" font-size="18.5" font-weight="600" fill="#111827">Gateway</text>
  <text x="480" y="705" font-size="15.5" text-anchor="middle" fill="#6B7280">reads the tenant's tier</text>
  <g filter="url(#c6saas3-soft)">
    <rect x="650" y="590" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="650" y="590" width="6" height="90" fill="#2563EB" clip-path="url(#c6saas3-k7)"/>
  </g>
  <circle cx="688" cy="635" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,624.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="714" y="642" font-size="18.5" font-weight="600" fill="#111827">Router</text>
  <text x="770" y="705" font-size="15.5" text-anchor="middle" fill="#6B7280">picks only models that satisfy it</text>
  <g filter="url(#c6saas3-soft)">
    <rect x="940" y="590" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="940" y="590" width="6" height="90" fill="#2563EB" clip-path="url(#c6saas3-k8)"/>
  </g>
  <circle cx="978" cy="635" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,624.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="1004" y="642" font-size="18.5" font-weight="600" fill="#111827">Allowed models</text>
  <text x="1055" y="705" font-size="15.5" text-anchor="middle" fill="#6B7280">only routes that match the tier</text>
  <text x="1190" y="463" text-anchor="end" font-size="15.5" font-weight="600" fill="#64748B">stricter</text>
  <rect x="40" y="780" width="1160" height="60" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="815.5" text-anchor="middle" font-size="15.5" fill="#374151">No feature code knows about the tiers.</text>
</svg>