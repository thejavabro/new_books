<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four data governance tiers, from a training opt-out to models in the platform&#39;s own fleet, and the gateway and router that enforce each tenant&#39;s tier">
