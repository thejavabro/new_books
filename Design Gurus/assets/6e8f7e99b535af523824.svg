<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">One deadline includes attempts and waiting</title><desc id="desc">The overall foreground deadline includes each attempt and the delays between attempts. In this example, two attempts and two waits reach six seconds, so another foreground attempt must not start. An uncertain write keeps its operation identity for later recovery. Retry-After must also be respected; a screen deadline does not prove rejection.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="940" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">One deadline includes attempts and waiting</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Illustrative six-second foreground deadline; these timings are not recommended defaults.</text><text x="69" y="206" font-size="22" fill="#334155" font-weight="400">0s</text><text x="239" y="206" font-size="22" fill="#334155" font-weight="400">1s</text><text x="409" y="206" font-size="22" fill="#334155" font-weight="400">2s</text><text x="579" y="206" font-size="22" fill="#334155" font-weight="400">3s</text><text x="749" y="206" font-size="22" fill="#334155" font-weight="400">4s</text><text x="919" y="206" font-size="22" fill="#334155" font-weight="400">5s</text><text x="1089" y="206" font-size="22" fill="#334155" font-weight="400">6s</text><rect x="75" y="250" width="340" height="145" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="96" y="295" font-size="25" fill="#2563eb" font-weight="700">Attempt 1</text><text x="96" y="340" font-size="22" fill="#334155" font-weight="400">0–2 seconds</text><rect x="415" y="250" width="170" height="145" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="435" y="295" font-size="24" fill="#475569" font-weight="700">Wait</text><text x="435" y="340" font-size="22" fill="#334155" font-weight="400">2–3s</text><rect x="585" y="250" width="340" height="145" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="607" y="295" font-size="25" fill="#2563eb" font-weight="700">Attempt 2</text><text x="607" y="340" font-size="22" fill="#334155" font-weight="400">3–5 seconds</text><rect x="925" y="250" width="170" height="145" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="945" y="295" font-size="24" fill="#475569" font-weight="700">Wait</text><text x="945" y="340" font-size="22" fill="#334155" font-weight="400">5–6s</text><path d="M1095 225 V460" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5"/><text x="555" y="450" font-size="22" fill="#c2410c" font-weight="700">Deadline reached: stop foreground waiting</text><rect x="50" y="510" width="520" height="185" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="550" font-size="24" fill="#7c3aed" font-weight="700">If the write outcome is unknown</text><text x="72" y="591" font-size="21" fill="#334155" font-weight="400">Keep the saved operation and its ID.</text><text x="72" y="622" font-size="21" fill="#334155" font-weight="400">Show Pending or Checking status.</text><text x="72" y="653" font-size="21" fill="#334155" font-weight="400">Do not report rejection without evidence.</text><rect x="650" y="510" width="500" height="185" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="550" font-size="24" fill="#059669" font-weight="700">A later recovery opportunity</text><text x="672" y="591" font-size="21" fill="#334155" font-weight="400">Check status or retry under the contract.</text><text x="672" y="622" font-size="21" fill="#334155" font-weight="400">Respect server delays and retry budgets.</text><text x="672" y="653" font-size="21" fill="#334155" font-weight="400">Background execution has no exact start.</text><path d="M578 603 H642" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="755" width="1100" height="125" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="795" font-size="24" fill="#ffffff" font-weight="700">A request timeout and an operation lifetime are different</text><text x="72" y="836" font-size="21" fill="#ffffff" font-weight="400">Stopping the spinner does not undo a server action or make an uncertain result disappear.</text></g></svg>