<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="872" viewBox="0 0 1240 872" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities for a calendar service: a user owns calendars holding events, events send invitations and book rooms, availability is derived from events, and notifications carry invites and reminders">
  <defs>
    <filter id="calk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="calk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="calk-k1"><rect x="40" y="310" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="calk-k2"><rect x="330" y="310" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="calk-k3"><rect x="670" y="310" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="calk-k4"><rect x="1000" y="310" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="calk-k5"><rect x="670" y="140" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="calk-k6"><rect x="330" y="480" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="calk-k7"><rect x="1000" y="480" width="200" height="90" rx="12"/></clipPath>
    <marker id="calk-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="calk-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="calk-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="calk-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="calk-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="872" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Google Calendar: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Free and busy is not stored. It is derived from events, which is why availability lookups are the hard part.</text>



  <g fill="none" stroke-width="2">
    <path d="M230,335 H330" stroke="#2563EB" marker-end="url(#calk-m-blue)"/>
    <path d="M570,335 H670" stroke="#4F46E5" marker-end="url(#calk-m-indigo)"/>
    <path d="M930,335 H1000" stroke="#D97706" marker-end="url(#calk-m-amber)"/>
    <path d="M905,310 V230" stroke="#D97706" marker-end="url(#calk-m-amber)"/>
    <path d="M545,400 V480" stroke="#4F46E5" marker-end="url(#calk-m-indigo)"/>
    <path d="M1175,400 V480" stroke="#059669" marker-end="url(#calk-m-emerald)"/>
    <path d="M1000,545 H988 Q976,545 976,557 V648 Q976,660 964,660 H32 Q20,660 20,648 V367 Q20,355 32,355 H40" stroke="#DB2777" stroke-width="2.5" marker-end="url(#calk-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="280" y="322" fill="#1D4ED8">owns</text>
    <text x="620" y="322" fill="#4338CA">holds</text>
    <text x="965" y="322" fill="#B45309">invites</text>
    <text x="960" y="272" fill="#B45309">books</text>
    <text x="630" y="445" fill="#4338CA">derives</text>
    <text x="500" y="652" fill="#BE185D">reminders and invites reach the user</text>
  </g>

  <g filter="url(#calk-soft)">
    <rect x="40" y="310" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#calk-k1)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="362" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="135" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">name, time zone</text>
  <text x="135" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">owns one or more</text>
  <g filter="url(#calk-soft)">
    <rect x="330" y="310" width="240" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="330" y="310" width="6" height="90" fill="#4F46E5" clip-path="url(#calk-k2)"/>
  </g>
  <circle cx="368" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,344.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="394" y="362" font-size="21.5" font-weight="600" fill="#111827">Calendar</text>
  <text x="450" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">personal or team</text>
  <text x="450" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">shared, view or edit</text>
  <g filter="url(#calk-lift)">
    <rect x="670" y="310" width="260" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="670" y="310" width="9" height="90" fill="#D97706" clip-path="url(#calk-k3)"/>
  </g>
  <circle cx="708" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,344.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
  <text x="734" y="362" font-size="21.5" font-weight="600" fill="#111827">Event</text>
  <text x="800" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">title, time span, organizer</text>
  <g filter="url(#calk-soft)">
    <rect x="1000" y="310" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1000" y="310" width="6" height="90" fill="#059669" clip-path="url(#calk-k4)"/>
  </g>
  <circle cx="1038" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,344.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1064" y="362" font-size="21.5" font-weight="600" fill="#111827">Invitation</text>
  <text x="1100" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">one per invitee</text>
  <text x="1100" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">accept or decline</text>
  <g filter="url(#calk-soft)">
    <rect x="670" y="140" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="670" y="140" width="6" height="90" fill="#64748B" clip-path="url(#calk-k5)"/>
  </g>
  <circle cx="708" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="734" y="192" font-size="21.5" font-weight="600" fill="#111827">Room</text>
  <text x="800" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">capacity and equipment</text>
  <text x="800" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">has its own bookings</text>
  <g filter="url(#calk-soft)">
    <rect x="330" y="480" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="330" y="480" width="6" height="90" fill="#7C3AED" clip-path="url(#calk-k6)"/>
  </g>
  <circle cx="368" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,514.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="394" y="532" font-size="21.5" font-weight="600" fill="#111827">Availability</text>
  <text x="450" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">free and busy slots</text>
  <text x="450" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">derived, never typed in</text>
  <g filter="url(#calk-soft)">
    <rect x="1000" y="480" width="200" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="1000" y="480" width="6" height="90" fill="#DB2777" clip-path="url(#calk-k7)"/>
  </g>
  <circle cx="1038" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,514.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="1064" y="532" font-size="21.5" font-weight="600" fill="#111827">Notification</text>
  <text x="1100" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">invites and reminders</text>

  <rect x="40" y="670" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Recurring event</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">one rule that expands into many occurrences, each of which can be changed on its own</text>
  <rect x="64" y="745" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="770" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Free and busy</text>
  <text x="323" y="770" font-size="18.5" fill="#475569">computed from every calendar involved, which is what makes conflict checking expensive</text>
  <rect x="64" y="795" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="820" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Room</text>
  <text x="323" y="820" font-size="18.5" fill="#475569">a resource with its own calendar, so double booking a room is the same problem as double booking a person</text>
</svg>