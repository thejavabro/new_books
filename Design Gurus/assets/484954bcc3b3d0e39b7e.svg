<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">Capture event context before asynchronous work</title><desc id="desc">An event recorded for Account A captures A’s identity, session, consent generation, and sampling decision at the defined event time. If the app switches to B before the worker runs, that event must not be relabeled as B. The worker rechecks applicable policy and retains or removes the record under that policy; retained records keep their original context.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1060" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Capture event context before asynchronous work</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">An event must not inherit whichever account happens to be signed in at upload time.</text><rect x="50" y="190" width="330" height="185" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="230" font-size="24" fill="#7c3aed" font-weight="700">Event occurs for A</text><text x="72" y="271" font-size="21" fill="#334155" font-weight="400">Capture identity and session.</text><text x="72" y="302" font-size="21" fill="#334155" font-weight="400">Capture consent generation</text><text x="72" y="333" font-size="21" fill="#334155" font-weight="400">and sampling decision.</text><rect x="435" y="190" width="330" height="185" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="457" y="230" font-size="24" fill="#2563eb" font-weight="700">Queued event record</text><text x="457" y="271" font-size="21" fill="#334155" font-weight="400">Keep the captured context</text><text x="457" y="302" font-size="21" fill="#334155" font-weight="400">with the event identity.</text><rect x="820" y="190" width="330" height="185" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="230" font-size="24" fill="#c2410c" font-weight="700">App switches to B</text><text x="842" y="271" font-size="21" fill="#334155" font-weight="400">The current account changes.</text><text x="842" y="302" font-size="21" fill="#334155" font-weight="400">The old record does not</text><text x="842" y="333" font-size="21" fill="#334155" font-weight="400">become B’s event.</text><path d="M388 282 H427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M773 282 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="300" y="510" width="600" height="160" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="322" y="550" font-size="24" fill="#059669" font-weight="700">Worker processes the saved record</text><text x="322" y="591" font-size="21" fill="#334155" font-weight="400">Read its original context and recheck policy.</text><text x="322" y="622" font-size="21" fill="#334155" font-weight="400">Do not read “current user” and overwrite its identity.</text><path d="M600 383 V502" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="795" width="520" height="155" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="835" font-size="24" fill="#7c3aed" font-weight="700">Policy allows processing</text><text x="72" y="876" font-size="21" fill="#334155" font-weight="400">Keep the event labeled as A.</text><text x="72" y="907" font-size="21" fill="#334155" font-weight="400">Use the documented account and</text><text x="72" y="938" font-size="21" fill="#334155" font-weight="400">upload rules.</text><rect x="650" y="795" width="500" height="155" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="672" y="835" font-size="24" fill="#c2410c" font-weight="700">Policy prohibits processing</text><text x="672" y="876" font-size="21" fill="#334155" font-weight="400">Do not upload it merely to empty the queue.</text><text x="672" y="907" font-size="21" fill="#334155" font-weight="400">Retain or remove only as policy allows.</text><path d="M470 678 V730 H310 V787" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M730 678 V730 H900 V787" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="50" y="1015" font-size="23" fill="#475569" font-weight="400">Identity capture and permission to upload are separate checks.</text></g></svg>