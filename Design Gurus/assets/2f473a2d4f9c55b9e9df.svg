<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="578" viewBox="0 0 1240 578" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A write arrives while node B is down, node A stores a hint on its behalf so the write still succeeds, and when B returns the hint is replayed and cleared">
  <rect x="0" y="0" width="1240" height="578" fill="#FFFFFF"/>
  <defs>
    <marker id="cr6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node B is down, and the write still succeeds without losing it</text>

  <line x1="324" y1="260" x2="336" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#cr6-slate)"/>
  <line x1="614" y1="260" x2="626" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#cr6-slate)"/>
  <line x1="904" y1="260" x2="916" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#cr6-slate)"/>

  
  <rect x="50" y="100" width="270" height="320" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="185" y="140" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1  Write arrives</text>
  <rect x="80" y="180" width="210" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="185" y="209" font-size="20" fill="#065F46" text-anchor="middle">A: got it</text>
  <rect x="80" y="234" width="210" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="185" y="263" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">B: DOWN</text>
  <rect x="80" y="288" width="210" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="185" y="317" font-size="20" fill="#065F46" text-anchor="middle">C: got it</text>
  <text x="185" y="372" font-size="20" fill="#334155" text-anchor="middle">W = 2 is satisfied</text>
  <text x="185" y="398" font-size="20" fill="#334155" text-anchor="middle">by A and C</text>

  
  <rect x="340" y="100" width="270" height="320" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="475" y="140" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">2  A stores a hint</text>
  <rect x="370" y="180" width="210" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="475" y="209" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">A: + hint for B</text>
  <rect x="370" y="234" width="210" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="475" y="263" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">B: DOWN</text>
  <rect x="370" y="288" width="210" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="475" y="317" font-size="20" fill="#065F46" text-anchor="middle">C: got it</text>
  <text x="475" y="372" font-size="20" fill="#334155" text-anchor="middle">the write succeeds</text>
  <text x="475" y="398" font-size="20" fill="#334155" text-anchor="middle">and nothing is lost</text>

  
  <rect x="630" y="100" width="270" height="320" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="765" y="140" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">3  B comes back</text>
  <rect x="660" y="180" width="210" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="765" y="209" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">A: holds hint</text>
  <rect x="660" y="234" width="210" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="765" y="263" font-size="20" fill="#92400E" text-anchor="middle">B: up, stale</text>
  <rect x="660" y="288" width="210" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="765" y="317" font-size="20" fill="#065F46" text-anchor="middle">C: got it</text>
  <text x="765" y="372" font-size="20" fill="#334155" text-anchor="middle">B missed the write</text>
  <text x="765" y="398" font-size="20" fill="#334155" text-anchor="middle">and knows nothing</text>

  
  <rect x="920" y="100" width="270" height="320" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="1055" y="140" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">4  A replays it</text>
  <rect x="950" y="180" width="210" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="209" font-size="20" fill="#065F46" text-anchor="middle">A: hint cleared</text>
  <rect x="950" y="234" width="210" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="1055" y="263" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">B: got it</text>
  <rect x="950" y="288" width="210" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="317" font-size="20" fill="#065F46" text-anchor="middle">C: got it</text>
  <text x="1055" y="372" font-size="20" fill="#334155" text-anchor="middle">all three agree</text>
  <text x="1055" y="398" font-size="20" fill="#334155" text-anchor="middle">and the hint is gone</text>

  
  <rect x="50" y="456" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="492" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A hint is a promissory note. The write is durable on enough nodes now, and B is repaired later.</text>
  <text x="620" y="522" font-size="20" fill="#334155" text-anchor="middle">If the node holding the hint dies first, the note dies with it. This is repair, not a backup.</text>
</svg>