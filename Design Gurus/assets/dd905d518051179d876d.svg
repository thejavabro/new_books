<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1076" viewBox="0 0 1240 1076" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The fifteen named failures of POST /responses, each with its status, stable code, and the action the caller should take, covering input shape, token limits, output bounds, schemas, tool definitions, idempotency, authentication, scope, spend cap, an unknown model, an in-progress duplicate, three kinds of rate limit, and an unavailable service.">
  <defs>
    <filter id="p2d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2d-k1"><rect x="84" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k2"><rect x="84" y="256" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k3"><rect x="84" y="338" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k4"><rect x="84" y="420" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k5"><rect x="84" y="502" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k6"><rect x="84" y="584" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k7"><rect x="84" y="743" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k8"><rect x="84" y="825" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k9"><rect x="684" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k10"><rect x="684" y="256" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k11"><rect x="684" y="338" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k12"><rect x="684" y="497" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k13"><rect x="684" y="579" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k14"><rect x="684" y="661" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="p2d-k15"><rect x="684" y="820" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1076" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Fifteen named failures for one inference operation</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">every card carries a status, a stable code, and the caller action</text>

  
  <rect x="44" y="126" width="552" height="545" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="68" y="156" font-size="16.5" font-weight="600" fill="#BE185D">400 Bad Request, the body is wrong</text>
  <text x="572" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">six failures</text>

  <g filter="url(#p2d-soft)">
    <rect x="84" y="174" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p2d-k1)"/>
  </g>
  <rect x="100" y="185" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.4"/>
  <text x="126" y="203.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="166" y="205" font-size="18.5" font-weight="600" fill="#111827">invalid_input</text>
  <text x="320" y="242" text-anchor="middle" font-size="15.5" fill="#6B7280">Correct the named input field</text>

  <g filter="url(#p2d-soft)">
    <rect x="84" y="256" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="256" width="6" height="48" fill="#DB2777" clip-path="url(#p2d-k2)"/>
  </g>
  <rect x="100" y="267" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.4"/>
  <text x="126" y="285.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="166" y="287" font-size="18.5" font-weight="600" fill="#111827">input_token_limit_exceeded</text>
  <text x="320" y="324" text-anchor="middle" font-size="15.5" fill="#6B7280">Shorten or split the input</text>

  <g filter="url(#p2d-soft)">
    <rect x="84" y="338" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="338" width="6" height="48" fill="#DB2777" clip-path="url(#p2d-k3)"/>
  </g>
  <rect x="100" y="349" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.4"/>
  <text x="126" y="367.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="166" y="369" font-size="18.5" font-weight="600" fill="#111827">maximum_output_tokens_invalid</text>
  <text x="320" y="406" text-anchor="middle" font-size="15.5" fill="#6B7280">Choose a valid bound at or below the model maximum</text>

  <g filter="url(#p2d-soft)">
    <rect x="84" y="420" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="420" width="6" height="48" fill="#DB2777" clip-path="url(#p2d-k4)"/>
  </g>
  <rect x="100" y="431" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.4"/>
  <text x="126" y="449.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="166" y="451" font-size="18.5" font-weight="600" fill="#111827">response_schema_invalid</text>
  <text x="320" y="488" text-anchor="middle" font-size="15.5" fill="#6B7280">Correct the JSON schema, or reduce its complexity</text>

  <g filter="url(#p2d-soft)">
    <rect x="84" y="502" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="502" width="6" height="48" fill="#DB2777" clip-path="url(#p2d-k5)"/>
  </g>
  <rect x="100" y="513" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.4"/>
  <text x="126" y="531.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="166" y="533" font-size="18.5" font-weight="600" fill="#111827">tool_definition_invalid</text>
  <text x="320" y="570" text-anchor="middle" font-size="15.5" fill="#6B7280">Correct the named tool field</text>

  <g filter="url(#p2d-soft)">
    <rect x="84" y="584" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="584" width="6" height="48" fill="#DB2777" clip-path="url(#p2d-k6)"/>
  </g>
  <rect x="100" y="595" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.4"/>
  <text x="126" y="613.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="166" y="615" font-size="18.5" font-weight="600" fill="#111827">idempotency_key_reused</text>
  <text x="320" y="652" text-anchor="middle" font-size="15.5" fill="#6B7280">Correct the key usage; one key names one body</text>

  
  <rect x="44" y="695" width="552" height="217" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="68" y="725" font-size="16.5" font-weight="600" fill="#4338CA">404 and 409, wrong target or duplicate</text>
  <text x="572" y="725" text-anchor="end" font-size="15.5" fill="#6B7280">two failures</text>

  <g filter="url(#p2d-soft)">
    <rect x="84" y="743" width="472" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="743" width="6" height="48" fill="#4F46E5" clip-path="url(#p2d-k7)"/>
  </g>
  <rect x="100" y="754" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="126" y="772.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">404</text>
  <text x="166" y="774" font-size="18.5" font-weight="600" fill="#111827">model_not_found</text>
  <text x="320" y="811" text-anchor="middle" font-size="15.5" fill="#6B7280">Read /models and choose an available id</text>

  <g filter="url(#p2d-soft)">
    <rect x="84" y="825" width="472" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="825" width="6" height="48" fill="#4F46E5" clip-path="url(#p2d-k8)"/>
  </g>
  <rect x="100" y="836" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4"/>
  <text x="126" y="854.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">409</text>
  <text x="166" y="856" font-size="18.5" font-weight="600" fill="#111827">idempotency_request_in_progress</text>
  <text x="320" y="893" text-anchor="middle" font-size="15.5" fill="#6B7280">Wait for Retry-After, then repeat the same key and body</text>

  
  <rect x="644" y="126" width="552" height="299" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#5B21B6">401 and 403, caller not permitted</text>
  <text x="1172" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">three failures</text>

  <g filter="url(#p2d-soft)">
    <rect x="684" y="174" width="472" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="684" y="174" width="6" height="48" fill="#7C3AED" clip-path="url(#p2d-k9)"/>
  </g>
  <rect x="700" y="185" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="726" y="203.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">401</text>
  <text x="766" y="205" font-size="18.5" font-weight="600" fill="#111827">authentication_required</text>
  <text x="920" y="242" text-anchor="middle" font-size="15.5" fill="#6B7280">Authenticate</text>

  <g filter="url(#p2d-soft)">
    <rect x="684" y="256" width="472" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="684" y="256" width="6" height="48" fill="#7C3AED" clip-path="url(#p2d-k10)"/>
  </g>
  <rect x="700" y="267" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="726" y="285.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">403</text>
  <text x="766" y="287" font-size="18.5" font-weight="600" fill="#111827">insufficient_scope</text>
  <text x="920" y="324" text-anchor="middle" font-size="15.5" fill="#6B7280">Obtain responses:create, or stop</text>

  <g filter="url(#p2d-soft)">
    <rect x="684" y="338" width="472" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="684" y="338" width="6" height="48" fill="#7C3AED" clip-path="url(#p2d-k11)"/>
  </g>
  <rect x="700" y="349" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="726" y="367.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">403</text>
  <text x="766" y="369" font-size="18.5" font-weight="600" fill="#111827">spend_cap_exceeded</text>
  <text x="920" y="406" text-anchor="middle" font-size="15.5" fill="#6B7280">Reduce the work, raise the cap, or wait for the next period</text>

  
  <rect x="644" y="449" width="552" height="299" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="668" y="479" font-size="16.5" font-weight="600" fill="#B45309">429 Too Many Requests, over a limit</text>
  <text x="1172" y="479" text-anchor="end" font-size="15.5" fill="#6B7280">three failures</text>

  <g filter="url(#p2d-soft)">
    <rect x="684" y="497" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="497" width="6" height="48" fill="#D97706" clip-path="url(#p2d-k12)"/>
  </g>
  <rect x="700" y="508" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
  <text x="726" y="526.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">429</text>
  <text x="766" y="528" font-size="18.5" font-weight="600" fill="#111827">request_rate_limit_exceeded</text>
  <text x="920" y="565" text-anchor="middle" font-size="15.5" fill="#6B7280">Wait for Retry-After</text>

  <g filter="url(#p2d-soft)">
    <rect x="684" y="579" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="579" width="6" height="48" fill="#D97706" clip-path="url(#p2d-k13)"/>
  </g>
  <rect x="700" y="590" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
  <text x="726" y="608.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">429</text>
  <text x="766" y="610" font-size="18.5" font-weight="600" fill="#111827">token_rate_limit_exceeded</text>
  <text x="920" y="647" text-anchor="middle" font-size="15.5" fill="#6B7280">Wait, reduce the output bound, or both</text>

  <g filter="url(#p2d-soft)">
    <rect x="684" y="661" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="661" width="6" height="48" fill="#D97706" clip-path="url(#p2d-k14)"/>
  </g>
  <rect x="700" y="672" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4"/>
  <text x="726" y="690.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">429</text>
  <text x="766" y="692" font-size="18.5" font-weight="600" fill="#111827">concurrency_limit_exceeded</text>
  <text x="920" y="729" text-anchor="middle" font-size="15.5" fill="#6B7280">Wait, or cancel work that is no longer needed</text>

  
  <rect x="644" y="772" width="552" height="135" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="668" y="802" font-size="16.5" font-weight="600" fill="#475569">503 Service Unavailable</text>
  <text x="1172" y="802" text-anchor="end" font-size="15.5" fill="#6B7280">one failure</text>

  <g filter="url(#p2d-soft)">
    <rect x="684" y="820" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="820" width="6" height="48" fill="#64748B" clip-path="url(#p2d-k15)"/>
  </g>
  <rect x="700" y="831" width="52" height="26" rx="9" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4"/>
  <text x="726" y="849.5" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">503</text>
  <text x="766" y="851" font-size="18.5" font-weight="600" fill="#111827">inference_unavailable</text>
  <text x="920" y="888" text-anchor="middle" font-size="15.5" fill="#6B7280">Retry with the same key after Retry-After</text>

  
  <rect x="40" y="936" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="978" text-anchor="middle" font-size="16" fill="#475569">Every failure names three things: the status, a stable code the caller can branch on, and the action to take.</text>
  <text x="620" y="1006" text-anchor="middle" font-size="16" fill="#475569">Six come from the request body and three are rate limits; the rest are permission, target, duplicate, or service.</text>
</svg>