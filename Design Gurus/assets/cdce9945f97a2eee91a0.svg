<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="four-title four-desc">
<title id="four-title">Four patterns that only work together</title>
<desc id="four-desc">Three of the four make the system worse when applied alone. The interactions are the content, and the order to apply them in is not arbitrary.</desc>
<defs>
<marker id="four-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="four-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="four-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="four-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="790" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four patterns that only work together</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three of the four make the system worse when applied alone.</text>
<rect x="40" y="712" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="712" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A timeout without a retry</text>
<path d="M526 146H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 146H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#four-marker-slate)"/>
<rect x="570" y="118" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">turns a transient blip into a user-visible failure</text>
<rect x="40" y="184" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="218" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A retry without a budget</text>
<path d="M526 212H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 212H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#four-marker-slate)"/>
<rect x="570" y="184" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="218" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">turns an overload into a much larger overload</text>
<rect x="40" y="250" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="284" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A breaker without a fallback</text>
<path d="M526 278H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 278H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#four-marker-slate)"/>
<rect x="570" y="250" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="284" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">turns a slow failure into a fast one, still a failure</text>
<rect x="40" y="316" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="350" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A bulkhead without timeouts</text>
<path d="M526 344H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 344H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#four-marker-slate)"/>
<rect x="570" y="316" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="350" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">isolates damage into a compartment that stays broken</text>
<rect x="40" y="388" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="388" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="425" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Each pattern converts one failure mode into another. The question is which one you want.</text>
<text x="40" y="484" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And the order is not arbitrary</text>
<circle cx="177" cy="524" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="177" y="531" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="55" y="554" width="245" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="177.5" y="588" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Timeouts</text>
<rect x="40" y="622" width="275" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="60" y="647.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">nothing works without a</text><text x="60" y="672.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">bounded wait</text>
<path d="M306 582H344" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M306 582H344" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#four-marker-slate)"/>
<circle cx="472" cy="524" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="472" y="531" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="350" y="554" width="245" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="472.5" y="588" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Bulkheads</text>
<rect x="335" y="622" width="275" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="355" y="647.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">isolation limits what a</text><text x="355" y="672.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">bounded wait can consume</text>
<path d="M601 582H639" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M601 582H639" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#four-marker-slate)"/>
<circle cx="767" cy="524" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="767" y="531" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="645" y="554" width="245" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="767.5" y="574.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Retries with</text><text x="767.5" y="601.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a budget</text>
<rect x="630" y="622" width="275" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="650" y="647.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">now a retry cannot</text><text x="650" y="672.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">consume the whole system</text>
<path d="M896 582H934" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M896 582H934" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#four-marker-slate)"/>
<circle cx="1062" cy="524" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1062" y="531" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="940" y="554" width="245" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1062.5" y="588" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Circuit breakers</text>
<rect x="925" y="622" width="275" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="945" y="647.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an optimization on top,</text><text x="945" y="672.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a substitute</text>
<text x="66" y="746" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Anyone can name the four. The distinguishing move is saying what each converts into what.</text>
</svg>