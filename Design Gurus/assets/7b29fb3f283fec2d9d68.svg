<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four cards, one per common mistake when discussing trade-offs: naming a technology without its cost, comparing without deciding, re-deciding a settled question, and conceding a cost nobody challenged. Each card shows what the mistake sounds like and what to say instead.">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="to2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="to2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="to2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="to2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="to2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="to2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="to2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="to2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="to2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Four ways to lose points on a trade-off you understand</text>
  <g filter="url(#to2-soft)"><rect x="24" y="66" width="590" height="220" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="42" y="86" width="9" height="180" rx="4" fill="#DC2626"/>
  <text x="68" y="112" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="start">A technology without its cost</text>
  <text x="68" y="148" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">sounds like</text>
  <text x="68" y="176" font-size="18" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"I'll use Kafka."</text>
  <text x="68" y="202" font-size="17" fill="#64748B" text-anchor="start">A noun, not a decision.</text>
  <text x="68" y="236" font-size="17" font-weight="700" fill="#065F46" text-anchor="start">instead</text>
  <text x="68" y="262" font-size="18" fill="#065F46" text-anchor="start">Say what it gives you and what it costs.</text>
  <g filter="url(#to2-soft)"><rect x="626" y="66" width="590" height="220" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="644" y="86" width="9" height="180" rx="4" fill="#DC2626"/>
  <text x="670" y="112" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="start">Comparing without deciding</text>
  <text x="670" y="148" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">sounds like</text>
  <text x="670" y="176" font-size="18" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"Both approaches have advantages..."</text>
  <text x="670" y="202" font-size="17" fill="#64748B" text-anchor="start">The comparison ends, and no choice is made.</text>
  <text x="670" y="236" font-size="17" font-weight="700" fill="#065F46" text-anchor="start">instead</text>
  <text x="670" y="262" font-size="18" fill="#065F46" text-anchor="start">Pick one, give the reason, move on.</text>
  <g filter="url(#to2-soft)"><rect x="24" y="298" width="590" height="220" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="42" y="318" width="9" height="180" rx="4" fill="#DC2626"/>
  <text x="68" y="344" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="start">Re-deciding a settled question</text>
  <text x="68" y="380" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">sounds like</text>
  <text x="68" y="408" font-size="18" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"Let me weigh consistency against availability."</text>
  <text x="68" y="434" font-size="17" fill="#64748B" text-anchor="start">The requirements already chose availability.</text>
  <text x="68" y="468" font-size="17" font-weight="700" fill="#065F46" text-anchor="start">instead</text>
  <text x="68" y="494" font-size="18" fill="#065F46" text-anchor="start">Say the requirement settles it, and continue.</text>
  <g filter="url(#to2-soft)"><rect x="626" y="298" width="590" height="220" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <rect x="644" y="318" width="9" height="180" rx="4" fill="#DC2626"/>
  <text x="670" y="344" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="start">Conceding a cost nobody challenged</text>
  <text x="670" y="380" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">sounds like</text>
  <text x="670" y="408" font-size="18" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"Another weakness of my design is..."</text>
  <text x="670" y="434" font-size="17" fill="#64748B" text-anchor="start">Repeated until a fair choice is abandoned.</text>
  <text x="670" y="468" font-size="17" font-weight="700" fill="#065F46" text-anchor="start">instead</text>
  <text x="670" y="494" font-size="18" fill="#065F46" text-anchor="start">State the cost once, keep the decision.</text>
  <text x="620" y="542" font-size="19" fill="#64748B" text-anchor="middle">All four mistakes hide the same thing: whether you chose on purpose.</text>
</svg>