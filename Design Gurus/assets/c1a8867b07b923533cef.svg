<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Page one of the home timeline ends at a cursor boundary. Three new tweets then arrive above it. With an offset, the second page points into a shifted list and three rows repeat. With a cursor, the boundary stays attached to the last created_at and id pair, so paging continues cleanly below it. New tweets appear when the caller refreshes from the top.">
  <defs>
    <marker id="xl12timelin-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="xl12timelin-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="xl12timelin-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="xl12timelin-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl12timelin-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl12timelin-k1"><rect x="165" y="96" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="xl12timelin-k2"><rect x="655" y="96" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl12timelin-k3"><rect x="84" y="398" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12timelin-k4"><rect x="84" y="470" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12timelin-k5"><rect x="684" y="398" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12timelin-k6"><rect x="684" y="470" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="228" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">New tweets arriving between two pages</text>

  
  <rect x="44" y="330" width="552" height="212" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <rect x="644" y="330" width="552" height="212" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>

  
  <g fill="none" stroke-width="2">
    <path d="M525,141 H655" stroke="#D97706" marker-end="url(#xl12timelin-am)"/>
    <path d="M790,186 V284 Q790,296 778,296 H332 Q320,296 320,308 V331" stroke="#DB2777" marker-end="url(#xl12timelin-pm)"/>
    <path d="M920,186 V331" stroke="#059669" marker-end="url(#xl12timelin-em)"/>
  </g>

  
  <g filter="url(#xl12timelin-soft)">
    <rect x="165" y="96" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="165" y="96" width="6" height="90" fill="#2563EB" clip-path="url(#xl12timelin-k1)"/>
  </g>
  <circle cx="203" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(192.56,130.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="229" y="148" font-size="18.5" font-weight="600" fill="#111827">Page 1 returns 20 tweets</text>
  <text x="345" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">The boundary is the last (created_at, id)</text>
  <text x="345" y="234" font-size="15.5" text-anchor="middle" fill="#94A3B8">page one of the home timeline ends there</text>

  
  <g filter="url(#xl12timelin-soft)">
    <rect x="655" y="96" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="655" y="96" width="6" height="90" fill="#D97706" clip-path="url(#xl12timelin-k2)"/>
  </g>
  <circle cx="693" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(682.56,130.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="719" y="148" font-size="18.5" font-weight="600" fill="#111827">Three new tweets arrive above it</text>

  
  <text x="68" y="360" font-size="16.5" font-weight="600" fill="#BE185D">With an offset</text>
  <text x="68" y="382" font-size="15.5" fill="#6B7280">the second page points into a shifted list</text>

  <g filter="url(#xl12timelin-soft)">
    <rect x="84" y="398" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="398" width="6" height="48" fill="#DB2777" clip-path="url(#xl12timelin-k3)"/>
  </g>
  <circle cx="118" cy="422" r="4.5" fill="#DB2777"/>
  <text x="142" y="429" font-size="18.5" font-weight="600" fill="#111827">offset=20 now points lower</text>

  <g filter="url(#xl12timelin-lift)">
    <rect x="84" y="470" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="470" width="9" height="48" fill="#DB2777" clip-path="url(#xl12timelin-k4)"/>
  </g>
  <circle cx="118" cy="494" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,485) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="142" y="501" font-size="18.5" font-weight="600" fill="#111827">Three rows repeat</text>

  
  <text x="668" y="360" font-size="16.5" font-weight="600" fill="#047857">With a cursor</text>
  <text x="668" y="382" font-size="15.5" fill="#6B7280">the boundary stays attached to the last (created_at, id)</text>

  <g filter="url(#xl12timelin-soft)">
    <rect x="684" y="398" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="398" width="6" height="48" fill="#059669" clip-path="url(#xl12timelin-k5)"/>
  </g>
  <circle cx="718" cy="422" r="4.5" fill="#059669"/>
  <text x="742" y="429" font-size="18.5" font-weight="600" fill="#111827">Continue after the stored item</text>

  <g filter="url(#xl12timelin-lift)">
    <rect x="684" y="470" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="470" width="9" height="48" fill="#059669" clip-path="url(#xl12timelin-k6)"/>
  </g>
  <circle cx="718" cy="494" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,485) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="742" y="501" font-size="18.5" font-weight="600" fill="#111827">No insertion-induced repeats here</text>

  
  <rect x="40" y="582" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="627" text-anchor="middle" font-size="16" fill="#475569">The new tweets appear when the caller refreshes from the top.</text>
</svg>