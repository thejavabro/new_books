<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Walk the list once, keeping a stack of values that only ever decreases</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">A new value larger than the top means everything smaller behind it can go</text>
