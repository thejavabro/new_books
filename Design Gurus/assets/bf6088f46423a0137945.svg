<rect x="0" y="0" width="1240" height="566" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Remove every node that has a larger value to its right</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The list is 5 to 3 to 7 to 4 to 2 to 1, and a node survives only if nothing after it is bigger</text>
