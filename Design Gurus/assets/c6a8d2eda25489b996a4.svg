<text x="348" y="532" font-size="19.5" fill="#475569">found first, so the counter goes to 1</text>
<rect x="64" y="554" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
