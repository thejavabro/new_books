<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="748" viewBox="0 0 1240 748" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A grid of land and water holding three separate islands"><rect x="0" y="0" width="1240" height="748" fill="#FFFFFF"/>
