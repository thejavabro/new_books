<text x="268" y="281" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">0</text>
<rect x="324" y="232" width="92" height="82" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="370" y="281" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">0</text>
<rect x="426" y="232" width="92" height="82" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="472" y="281" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">1</text>
