<text x="348" y="580" font-size="19.5" fill="#475569">the outer loop reaches new land, so the counter goes to 2</text>
<rect x="64" y="602" width="255" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="191" y="628" text-anchor="middle" font-size="19.5" font-weight="600" fill="#B45309">island 3</text>
<text x="348" y="628" font-size="19.5" fill="#475569">and again, giving 3 in total</text>
<rect x="64" y="650" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="676" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">water</text>
<text x="348" y="676" font-size="19.5" fill="#475569">skipped by the outer loop and by the traversal</text>
