<text x="268" y="373" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">0</text>
<rect x="324" y="324" width="92" height="82" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
<text x="370" y="373" text-anchor="middle" font-size="22.5" font-weight="600" fill="#B45309">1</text>
<rect x="426" y="324" width="92" height="82" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="472" y="373" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">0</text>
<text x="560" y="178" text-anchor="start" font-size="22.5" font-weight="600" fill="#1D4ED8">island 1</text>
<text x="560" y="208" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">three cells joined in an L shape</text>
<text x="560" y="270" text-anchor="start" font-size="22.5" font-weight="600" fill="#5B21B6">island 2</text>
<text x="560" y="300" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">a single cell, with water on all four sides</text>
<text x="560" y="362" text-anchor="start" font-size="22.5" font-weight="600" fill="#B45309">island 3</text>
<text x="560" y="392" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">also alone, and not joined diagonally to island 2</text>
<rect x="40" y="484" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="506" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
