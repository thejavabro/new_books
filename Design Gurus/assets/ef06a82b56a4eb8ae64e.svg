<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three replication topologies: one leader takes every write, several leaders each take writes and sync with each other, or no leader at all and quorums decide">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="rr6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rr6-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr6-amberS" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#D97706"/></marker>
    <marker id="rr6-amberE" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="rr6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="50" width="380" height="370" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="210" y="88" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Single leader</text>

  <rect x="430" y="50" width="380" height="370" rx="14" fill="#FFFBEB" fill-opacity="0.4" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="88" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Multi leader</text>

  <rect x="840" y="50" width="380" height="370" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1030" y="88" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Leaderless</text>

  <line x1="210" y1="140" x2="210" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#rr6-slate)"/>
  <line x1="210" y1="240" x2="135" y2="282" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr6-blue)"/>
  <line x1="210" y1="240" x2="300" y2="282" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rr6-blue)"/>
  <line x1="523" y1="140" x2="523" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#rr6-slate)"/>
  <line x1="717" y1="140" x2="717" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#rr6-slate)"/>
  <line x1="600" y1="208" x2="640" y2="208" stroke="#D97706" stroke-width="2.5" marker-start="url(#rr6-amberS)" marker-end="url(#rr6-amberE)"/>
  <line x1="915" y1="140" x2="915" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#rr6-slate)"/>
  <line x1="1030" y1="140" x2="1030" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#rr6-slate)"/>
  <line x1="1145" y1="140" x2="1145" y2="170" stroke="#475569" stroke-width="2.5" marker-end="url(#rr6-slate)"/>

  <text x="210" y="128" font-size="20" fill="#475569" text-anchor="middle">writes</text>
  <text x="620" y="128" font-size="20" fill="#475569" text-anchor="middle">writes</text>
  <text x="1030" y="128" font-size="20" fill="#475569" text-anchor="middle">writes</text>

  <g filter="url(#rr6-soft)">
    <rect x="110" y="176" width="200" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="60" y="288" width="150" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="225" y="288" width="150" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>

    <rect x="450" y="176" width="146" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="644" y="176" width="146" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>

    <rect x="860" y="176" width="110" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="975" y="176" width="110" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="1090" y="176" width="110" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="210" y="215" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Leader</text>
  <text x="135" y="325" font-size="20" fill="#64748B" text-anchor="middle">Follower</text>
  <text x="300" y="325" font-size="20" fill="#64748B" text-anchor="middle">Follower</text>
  <text x="523" y="215" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Leader</text>
  <text x="717" y="215" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Leader</text>
  <text x="915" y="215" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>
  <text x="1030" y="215" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>
  <text x="1145" y="215" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node</text>

  <text x="620" y="288" font-size="20" fill="#92400E" text-anchor="middle">they sync with each other</text>
  <text x="1030" y="288" font-size="20" fill="#065F46" text-anchor="middle">any node takes a write</text>

  <text x="210" y="392" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">one writer, simple order</text>
  <text x="620" y="392" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">two writers, so conflicts</text>
  <text x="1030" y="392" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">quorums decide the rest</text>

  <text x="620" y="470" font-size="20" fill="#475569" text-anchor="middle">Strong consistency in the leaderless case needs R plus W to be greater than N.</text>
</svg>