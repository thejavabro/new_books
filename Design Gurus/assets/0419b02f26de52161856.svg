<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1470" viewBox="0 0 1240 1470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="C4 container view after the change. Learners and instructors use the web application over HTTPS. The web application calls the Billing API, a Python container, and the API application, a Python container that keeps the other eight modules, with JSON over HTTPS, and streams video from the video service. The API application reads and writes PostgreSQL and requests upload links from the video service, which sends status webhooks back. The Billing API checks sessions and access through internal HTTPS endpoints of the API application, writes the billing tables and adds jobs in PostgreSQL, creates checkouts at the payment provider, and receives its webhooks. The Billing worker claims the billing lane in PostgreSQL and checks payments with the payment provider. The worker claims jobs from PostgreSQL, sends email through the email service and stores certificate PDFs in object storage.">
