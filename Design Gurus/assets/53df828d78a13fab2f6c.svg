<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1092" viewBox="0 0 1240 1092" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The nine REST terms the course assumes, grouped into the thing the API names, the URL shapes that name it, and the actions a request performs">
  <defs>
    <filter id="c2rt-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2rt-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="c2rt-k1"><rect x="150" y="136" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="c2rt-k2"><rect x="710" y="136" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="c2rt-k3"><rect x="100" y="364" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2rt-k4"><rect x="470" y="364" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2rt-k5"><rect x="840" y="364" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c2rt-k6"><rect x="150" y="592" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="c2rt-k7"><rect x="710" y="592" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="c2rt-k8"><rect x="150" y="772" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="c2rt-k9"><rect x="710" y="772" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1092" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="912" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The REST vocabulary, the nine words the course keeps using</text>

  
  <rect x="64" y="88" width="1112" height="208" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="118" font-size="16.5" font-weight="600" fill="#1D4ED8">What the API names</text>

  
  <g filter="url(#c2rt-lift)">
    <rect x="150" y="136" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="150" y="136" width="9" height="90" fill="#2563EB" clip-path="url(#c2rt-k1)"/>
  </g>
  <circle cx="188" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="214" y="188" font-size="18.5" font-weight="600" fill="#111827">Resource</text>
  <text x="340" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a thing the API names and a caller acts on</text>
  <text x="340" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">an order</text>

  
  <g filter="url(#c2rt-soft)">
    <rect x="710" y="136" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="710" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#c2rt-k2)"/>
  </g>
  <circle cx="748" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="774" y="188" font-size="18.5" font-weight="600" fill="#111827">Representation</text>
  <text x="900" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">one rendering of a resource, sent over the network</text>
  <text x="900" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">the JSON body</text>

  
  <rect x="64" y="316" width="1112" height="208" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="88" y="346" font-size="16.5" font-weight="600" fill="#5B21B6">How a URL names it</text>

  
  <g filter="url(#c2rt-soft)">
    <rect x="100" y="364" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="100" y="364" width="6" height="90" fill="#7C3AED" clip-path="url(#c2rt-k3)"/>
  </g>
  <circle cx="138" cy="409" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,398.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="164" y="416" font-size="18.5" font-weight="600" fill="#111827">Collection</text>
  <text x="250" y="479" font-size="15.5" text-anchor="middle" fill="#6B7280">a URL naming a set of resources</text>
  <text x="250" y="502" font-size="15.5" text-anchor="middle" fill="#94A3B8">/orders</text>

  
  <g filter="url(#c2rt-soft)">
    <rect x="470" y="364" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="364" width="6" height="90" fill="#7C3AED" clip-path="url(#c2rt-k4)"/>
  </g>
  <circle cx="508" cy="409" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,398.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="534" y="416" font-size="18.5" font-weight="600" fill="#111827">Member</text>
  <text x="620" y="479" font-size="15.5" text-anchor="middle" fill="#6B7280">a URL naming one resource in a collection</text>
  <text x="620" y="502" font-size="15.5" text-anchor="middle" fill="#94A3B8">/orders/ord_7M2K</text>

  
  <g filter="url(#c2rt-soft)">
    <rect x="840" y="364" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="840" y="364" width="6" height="90" fill="#7C3AED" clip-path="url(#c2rt-k5)"/>
  </g>
  <circle cx="878" cy="409" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,398.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="904" y="416" font-size="18.5" font-weight="600" fill="#111827">Sub-resource</text>
  <text x="990" y="479" font-size="15.5" text-anchor="middle" fill="#6B7280">a resource that belongs to another one</text>
  <text x="990" y="502" font-size="15.5" text-anchor="middle" fill="#94A3B8">/orders/ord_7M2K/refunds</text>

  
  <rect x="64" y="544" width="1112" height="388" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="574" font-size="16.5" font-weight="600" fill="#047857">What a request does to it</text>

  
  <g filter="url(#c2rt-soft)">
    <rect x="150" y="592" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="150" y="592" width="6" height="90" fill="#059669" clip-path="url(#c2rt-k6)"/>
  </g>
  <circle cx="188" cy="637" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,626.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="214" y="644" font-size="18.5" font-weight="600" fill="#111827">Method</text>
  <text x="340" y="707" font-size="15.5" text-anchor="middle" fill="#6B7280">the standard action a request performs</text>
  <text x="340" y="730" font-size="15.5" text-anchor="middle" fill="#94A3B8">GET, POST, PATCH</text>

  
  <g filter="url(#c2rt-soft)">
    <rect x="710" y="592" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="710" y="592" width="6" height="90" fill="#059669" clip-path="url(#c2rt-k7)"/>
  </g>
  <circle cx="748" cy="637" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,626.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="774" y="644" font-size="18.5" font-weight="600" fill="#111827">Safe</text>
  <text x="900" y="707" font-size="15.5" text-anchor="middle" fill="#6B7280">no state change is requested</text>
  <text x="900" y="730" font-size="15.5" text-anchor="middle" fill="#94A3B8">GET</text>

  
  <g filter="url(#c2rt-soft)">
    <rect x="150" y="772" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="150" y="772" width="6" height="90" fill="#059669" clip-path="url(#c2rt-k8)"/>
  </g>
  <circle cx="188" cy="817" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,806.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="214" y="824" font-size="18.5" font-weight="600" fill="#111827">Idempotent</text>
  <text x="340" y="887" font-size="15.5" text-anchor="middle" fill="#6B7280">sending it again leaves the same end state</text>
  <text x="340" y="910" font-size="15.5" text-anchor="middle" fill="#94A3B8">PUT, DELETE</text>

  
  <g filter="url(#c2rt-soft)">
    <rect x="710" y="772" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="710" y="772" width="6" height="90" fill="#059669" clip-path="url(#c2rt-k9)"/>
  </g>
  <circle cx="748" cy="817" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,806.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="774" y="824" font-size="18.5" font-weight="600" fill="#111827">Uniform interface</text>
  <text x="900" y="887" font-size="15.5" text-anchor="middle" fill="#6B7280">shared interaction rules for resources</text>
  <text x="900" y="910" font-size="15.5" text-anchor="middle" fill="#94A3B8">methods, representations, and links</text>

  
  <rect x="40" y="976" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1021" text-anchor="middle" font-size="16" fill="#475569">Every remaining lesson of the course assumes these nine words.</text>
</svg>