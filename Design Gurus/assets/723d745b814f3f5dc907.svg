<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="704" viewBox="0 0 1240 704" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A small graph explored from node zero, with a visited set preventing repeats"><rect x="0" y="0" width="1240" height="704" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="400" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">The visited set is what stops the traversal looping</text>
<path d="M204.0,180.0 L286.0,180.0" stroke="#059669" stroke-width="2.5" fill="none"/>
<path d="M354.0,180.0 L436.0,180.0" stroke="#059669" stroke-width="2.5" fill="none"/>
<path d="M264.0,330.0 L366.0,330.0" stroke="#CBD5E1" stroke-width="2.5" fill="none"/>
<circle cx="170" cy="180" r="34" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="170" y="188" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">0</text>
<circle cx="320" cy="180" r="34" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="320" y="188" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">1</text>
<circle cx="470" cy="180" r="34" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="470" y="188" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">2</text>
<circle cx="230" cy="330" r="34" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="230" y="338" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">4</text>
<circle cx="400" cy="330" r="34" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="400" y="338" text-anchor="middle" font-size="22.5" font-weight="600" fill="#CBD5E1">5</text>
<text x="170" y="400" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">reachable from 0</text>
<text x="400" y="400" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#94A3B8">a separate group</text>
<circle cx="626" cy="172" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="626" y="179" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">1</text>
<text x="672" y="166" text-anchor="start" font-size="22.5" font-weight="600" fill="#111827">visit 0</text>
<text x="672" y="194" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">queue [1], visited {0, 1}</text>
<circle cx="626" cy="258" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="626" y="265" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">2</text>
<text x="672" y="252" text-anchor="start" font-size="22.5" font-weight="600" fill="#111827">visit 1</text>
<text x="672" y="280" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">0 is already visited, so it is skipped</text>
<circle cx="626" cy="344" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="626" y="351" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">3</text>
<text x="672" y="338" text-anchor="start" font-size="22.5" font-weight="600" fill="#111827">visit 2</text>
<text x="672" y="366" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">the target is reached, so the answer is yes</text>
<circle cx="626" cy="430" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="626" y="437" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">4</text>
<text x="672" y="424" text-anchor="start" font-size="22.5" font-weight="600" fill="#111827">nodes 4 and 5</text>
<text x="672" y="452" text-anchor="start" font-size="19.5" font-weight="normal" fill="#6B7280">never entered the queue, so 0 cannot reach 5</text>
<rect x="40" y="488" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="510" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="536" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">visited</text>
<text x="348" y="536" font-size="19.5" fill="#475569">added to the set as it entered the queue</text>
<rect x="64" y="558" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="584" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">not reachable</text>
<text x="348" y="584" font-size="19.5" fill="#475569">no edge leads here from the starting node</text>
<rect x="64" y="606" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="632" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the rule</text>
<text x="348" y="632" font-size="19.5" fill="#475569">a node is added to the queue at most once, ever</text>
</svg>