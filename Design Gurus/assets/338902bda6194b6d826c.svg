<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="888" viewBox="0 0 1240 888" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five stable stream event types and whether each may repeat: response.started once, output text and tool call deltas many times, and exactly one of response.completed or response.failed.">
  <defs>
    <marker id="p1z-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p1z-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1z-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1z-k1"><rect x="84" y="174" width="620" height="48" rx="10"/></clipPath>
    <clipPath id="p1z-k2"><rect x="84" y="260" width="620" height="48" rx="10"/></clipPath>
    <clipPath id="p1z-k3"><rect x="84" y="346" width="620" height="48" rx="10"/></clipPath>
    <clipPath id="p1z-k4"><rect x="84" y="549" width="620" height="48" rx="10"/></clipPath>
    <clipPath id="p1z-k5"><rect x="84" y="635" width="620" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="888" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Five event types, one terminal outcome</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one card per event type, its meaning underneath</text>

  
  <g fill="none" stroke-width="2">
    <path d="M394,449 V501" stroke="#64748B" marker-end="url(#p1z-sl)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="414" y="481" fill="#475569">how the stream ends</text>
  </g>

  
  <rect x="44" y="126" width="1152" height="309" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="68" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">While the response is still generating</text>
  <text x="980" y="156" text-anchor="middle" font-size="15.5" font-weight="600" fill="#6B7280">May repeat?</text>
  <text x="1172" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">three event types</text>

  
  <g filter="url(#p1z-soft)">
    <rect x="84" y="174" width="620" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="174" width="6" height="48" fill="#2563EB" clip-path="url(#p1z-k1)"/>
  </g>
  <circle cx="118" cy="198" r="4.5" fill="#2563EB"/>
  <text x="142" y="205" font-size="18.5" font-weight="600" fill="#111827">response.started</text>
  <text x="394" y="244" text-anchor="middle" font-size="15.5" fill="#6B7280">Generation was admitted and has an id</text>
  <rect x="830" y="181" width="300" height="34" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="980" y="204" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">No</text>

  
  <g filter="url(#p1z-soft)">
    <rect x="84" y="260" width="620" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="260" width="6" height="48" fill="#2563EB" clip-path="url(#p1z-k2)"/>
  </g>
  <circle cx="118" cy="284" r="4.5" fill="#2563EB"/>
  <text x="142" y="291" font-size="18.5" font-weight="600" fill="#111827">response.output_text.delta</text>
  <text x="394" y="330" text-anchor="middle" font-size="15.5" fill="#6B7280">Append text to one output item</text>
  <rect x="830" y="267" width="300" height="34" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="980" y="290" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Yes</text>

  
  <g filter="url(#p1z-soft)">
    <rect x="84" y="346" width="620" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="346" width="6" height="48" fill="#2563EB" clip-path="url(#p1z-k3)"/>
  </g>
  <circle cx="118" cy="370" r="4.5" fill="#2563EB"/>
  <text x="142" y="377" font-size="18.5" font-weight="600" fill="#111827">response.tool_call.delta</text>
  <text x="394" y="416" text-anchor="middle" font-size="15.5" fill="#6B7280">Append to one tool-call name or argument</text>
  <rect x="830" y="353" width="300" height="34" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="980" y="376" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Yes</text>

  
  <rect x="44" y="501" width="1152" height="223" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="68" y="531" font-size="16.5" font-weight="600" fill="#475569">Terminal events, never both for one response_id</text>
  <text x="980" y="531" text-anchor="middle" font-size="15.5" font-weight="600" fill="#6B7280">May repeat?</text>
  <text x="1172" y="531" text-anchor="end" font-size="15.5" fill="#6B7280">two event types</text>

  
  <g filter="url(#p1z-lift)">
    <rect x="84" y="549" width="620" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="84" y="549" width="9" height="48" fill="#059669" clip-path="url(#p1z-k4)"/>
  </g>
  <circle cx="118" cy="573" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,564) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="142" y="580" font-size="18.5" font-weight="600" fill="#111827">response.completed</text>
  <text x="394" y="619" text-anchor="middle" font-size="15.5" fill="#6B7280">Generation ended normally, for a named reason</text>
  <rect x="830" y="556" width="300" height="34" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="980" y="579" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Exactly once, or not at all</text>

  
  <g filter="url(#p1z-lift)">
    <rect x="84" y="635" width="620" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="635" width="9" height="48" fill="#DB2777" clip-path="url(#p1z-k5)"/>
  </g>
  <circle cx="118" cy="659" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,650) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="142" y="666" font-size="18.5" font-weight="600" fill="#111827">response.failed</text>
  <text x="394" y="705" text-anchor="middle" font-size="15.5" fill="#6B7280">Generation ended with an error</text>
  <rect x="830" y="642" width="300" height="34" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="980" y="665" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Exactly once, or not at all</text>

  
  <rect x="40" y="748" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="790" text-anchor="middle" font-size="16" fill="#475569">Order is guaranteed within one response_id, not across two simultaneous responses.</text>
  <text x="620" y="818" text-anchor="middle" font-size="16" fill="#475569">A delta is an append instruction in event order, never the full text so far.</text>
</svg>