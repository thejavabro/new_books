<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1232" viewBox="0 0 1240 1232" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The whole of step four for link creation on one card. POST /v1/links carries a bearer token and an optional idempotency key. The body has one required field, destination_url, and two optional fields, custom_alias and expires_at. Success is 201 Created with a Location header and the full Link representation. Four failures are named: 400 invalid_request, 401 authentication_required, 409 alias_unavailable and 429 rate_limit_exceeded with Retry-After. A repeated call is decided by the idempotency key: the same key with the same body returns the original result, the same key with a different body returns 400, and a new key starts a new creation.">
  <defs>
    <marker id="yl07complet-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="yl07complet-me" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="yl07complet-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl07complet-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
