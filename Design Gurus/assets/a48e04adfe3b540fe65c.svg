    <rect x="450" y="968" width="6" height="48" fill="#DB2777" clip-path="url(#yl07complet-k12)"/>
  </g>
  <circle cx="484" cy="992" r="4.5" fill="#DB2777"/>
  <text x="508" y="999" font-size="18.5" font-weight="600" fill="#111827">Same key, different body</text>
  <text x="620" y="1036" text-anchor="middle" font-size="15.5" fill="#6B7280">400, not the original result</text>

  <g filter="url(#yl07complet-soft)">
