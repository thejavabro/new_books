  </g>
  <circle cx="850" cy="992" r="4.5" fill="#2563EB"/>
  <text x="874" y="999" font-size="18.5" font-weight="600" fill="#111827">A new key</text>
  <text x="986" y="1036" text-anchor="middle" font-size="15.5" fill="#6B7280">a new creation</text>

  
  <rect x="40" y="1092" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1134" text-anchor="middle" font-size="16" fill="#475569">This is what "design one operation completely" produces.</text>
  <text x="620" y="1162" text-anchor="middle" font-size="16" fill="#475569">Fields and rules, one success, four failures, and retry behavior.</text>
