  <text x="920" y="430" text-anchor="middle" font-size="15.5" fill="#6B7280">Location: /v1/links/lnk_7f91</text>
  <text x="920" y="453" text-anchor="middle" font-size="15.5" fill="#94A3B8">the full Link representation</text>

  
  <text x="684" y="497" font-size="15.5" font-weight="600" fill="#047857">Four named failures</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="684" y="517" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
