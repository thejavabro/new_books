    <clipPath id="yl07complet-k7"><rect x="684" y="517" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl07complet-k8"><rect x="684" y="603" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl07complet-k9"><rect x="684" y="689" width="472" height="48" rx="10"/></clipPath>
