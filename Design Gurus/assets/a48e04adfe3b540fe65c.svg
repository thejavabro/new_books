  </g>
  <circle cx="718" cy="541" r="4.5" fill="#DB2777"/>
  <text x="742" y="548" font-size="18.5" font-weight="600" fill="#111827">400 invalid_request</text>
  <text x="920" y="585" text-anchor="middle" font-size="15.5" fill="#6B7280">correct the field</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="684" y="603" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="603" width="6" height="48" fill="#DB2777" clip-path="url(#yl07complet-k8)"/>
  </g>
  <circle cx="718" cy="627" r="4.5" fill="#DB2777"/>
  <text x="742" y="634" font-size="18.5" font-weight="600" fill="#111827">401 authentication_required</text>
  <text x="920" y="671" text-anchor="middle" font-size="15.5" fill="#6B7280">refresh the credential</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="684" y="689" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="689" width="6" height="48" fill="#DB2777" clip-path="url(#yl07complet-k9)"/>
  </g>
  <circle cx="718" cy="713" r="4.5" fill="#DB2777"/>
  <text x="742" y="720" font-size="18.5" font-weight="600" fill="#111827">409 alias_unavailable</text>
  <text x="920" y="757" text-anchor="middle" font-size="15.5" fill="#6B7280">choose another alias</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="684" y="775" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="775" width="6" height="48" fill="#DB2777" clip-path="url(#yl07complet-k10)"/>
  </g>
  <circle cx="718" cy="799" r="4.5" fill="#DB2777"/>
  <text x="742" y="806" font-size="18.5" font-weight="600" fill="#111827">429 rate_limit_exceeded</text>
  <text x="920" y="843" text-anchor="middle" font-size="15.5" fill="#6B7280">wait for Retry-After</text>

  
  <g filter="url(#yl07complet-soft)">
    <rect x="84" y="968" width="340" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
