  <text x="564" y="178" font-size="18.5" font-weight="600" fill="#111827">POST /v1/links</text>
  <text x="620" y="241" text-anchor="middle" font-size="15.5" fill="#6B7280">the create call for a short link</text>

  
  <text x="84" y="344" font-size="15.5" font-weight="600" fill="#1D4ED8">Headers</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="84" y="362" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="362" width="6" height="48" fill="#2563EB" clip-path="url(#yl07complet-k1)"/>
  </g>
  <circle cx="118" cy="386" r="4.5" fill="#2563EB"/>
  <text x="142" y="393" font-size="18.5" font-weight="600" fill="#111827">Authorization: Bearer &lt;token&gt;</text>
  <text x="320" y="430" text-anchor="middle" font-size="15.5" fill="#6B7280">the bearer token, sent on every call</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="84" y="452" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="452" width="6" height="48" fill="#2563EB" clip-path="url(#yl07complet-k2)"/>
  </g>
  <circle cx="118" cy="476" r="4.5" fill="#2563EB"/>
  <text x="142" y="483" font-size="18.5" font-weight="600" fill="#111827">Idempotency-Key: &lt;uuid&gt;</text>
  <text x="320" y="520" text-anchor="middle" font-size="15.5" fill="#6B7280">optional, and it makes a repeat safe</text>

  
  <text x="84" y="566" font-size="15.5" font-weight="600" fill="#1D4ED8">Body</text>
  <text x="572" y="566" text-anchor="end" font-size="15.5" fill="#6B7280">one required field, two optional fields</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="84" y="584" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="84" y="584" width="9" height="48" fill="#2563EB" clip-path="url(#yl07complet-k3)"/>
  </g>
  <circle cx="118" cy="608" r="4.5" fill="#2563EB"/>
  <text x="142" y="615" font-size="18.5" font-weight="600" fill="#111827">destination_url</text>
  <text x="320" y="652" text-anchor="middle" font-size="15.5" fill="#6B7280">required, an absolute http or https URL</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="84" y="676" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="676" width="6" height="48" fill="#64748B" clip-path="url(#yl07complet-k4)"/>
  </g>
  <circle cx="118" cy="700" r="4.5" fill="#64748B"/>
  <text x="142" y="707" font-size="18.5" font-weight="600" fill="#111827">custom_alias</text>
  <text x="320" y="744" text-anchor="middle" font-size="15.5" fill="#6B7280">optional, 4 to 40 chars of a-z 0-9 - _</text>

  <g filter="url(#yl07complet-soft)">
    <rect x="84" y="768" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="768" width="6" height="48" fill="#64748B" clip-path="url(#yl07complet-k5)"/>
  </g>
  <circle cx="118" cy="792" r="4.5" fill="#64748B"/>
  <text x="142" y="799" font-size="18.5" font-weight="600" fill="#111827">expires_at</text>
  <text x="320" y="836" text-anchor="middle" font-size="15.5" fill="#6B7280">optional, RFC 3339, must be in the future</text>

  
  <text x="684" y="344" font-size="15.5" font-weight="600" fill="#047857">One success</text>

  <g filter="url(#yl07complet-lift)">
