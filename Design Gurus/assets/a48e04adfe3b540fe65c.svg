    <clipPath id="yl07complet-k13"><rect x="816" y="968" width="340" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1232" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">One complete operation, on one card</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the whole of step four for link creation</text>

  
  <rect x="40" y="272" width="556" height="620" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="302" font-size="16.5" font-weight="600" fill="#1D4ED8">Request</text>
  <text x="572" y="302" text-anchor="end" font-size="15.5" fill="#6B7280">what the caller sends</text>

  
  <rect x="644" y="272" width="556" height="620" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="668" y="302" font-size="16.5" font-weight="600" fill="#047857">Response</text>
  <text x="1176" y="302" text-anchor="end" font-size="15.5" fill="#6B7280">what the caller gets back</text>

  
  <rect x="40" y="920" width="1160" height="142" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="950" font-size="16.5" font-weight="600" fill="#475569">Idempotency</text>
  <text x="1176" y="950" text-anchor="end" font-size="15.5" fill="#6B7280">the key decides what a repeated call does</text>

  
