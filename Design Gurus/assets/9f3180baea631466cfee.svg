    <clipPath id="dbps1-k2"><rect x="470" y="104" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="dbps1-k3"><rect x="852" y="104" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="dbps1-k4"><rect x="72" y="464" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="dbps1-k5"><rect x="628" y="464" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="dbps1-k6"><rect x="72" y="594" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="dbps1-k7"><rect x="628" y="594" width="540" height="90" rx="12"/></clipPath>
    <filter id="dbps1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dbps1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="320" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">Three services share one database</text>
  <rect x="40" y="404" width="1160" height="330" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="434" font-size="16.5" font-weight="600" fill="#BE185D">What goes wrong</text>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M238,174 V216 Q238,228 250,228 H560 Q572,228 572,240 V248" marker-end="url(#dbps1-mslate)"/>
    <path d="M620,174 V248" marker-end="url(#dbps1-mslate)"/>
    <path d="M1002,174 V216 Q1002,228 990,228 H680 Q668,228 668,240 V248" marker-end="url(#dbps1-mslate)"/>
  </g>
  <g filter="url(#dbps1-soft)">
    <rect x="88" y="104" width="300" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="88" y="104" width="6" height="70" fill="#64748B" clip-path="url(#dbps1-k1)"/>
  </g>
  <circle cx="126" cy="139" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,128.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="152" y="146" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <g filter="url(#dbps1-soft)">
    <rect x="470" y="104" width="300" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="470" y="104" width="6" height="70" fill="#64748B" clip-path="url(#dbps1-k2)"/>
  </g>
  <circle cx="508" cy="139" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,128.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="534" y="146" font-size="18.5" font-weight="600" fill="#111827">Inventory Service</text>
  <g filter="url(#dbps1-soft)">
    <rect x="852" y="104" width="300" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="852" y="104" width="6" height="70" fill="#64748B" clip-path="url(#dbps1-k3)"/>
  </g>
  <circle cx="890" cy="139" r="18" fill="#FFFFFF"/>
  <g transform="translate(879.56,128.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="916" y="146" font-size="18.5" font-weight="600" fill="#111827">Reporting Job</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M 500,270 L 500,324 A 120,16 0 0 0 740,324 L 740,270" fill="#E2E8F0"/>
    <ellipse cx="620" cy="270" rx="120" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="620" y="317" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">One Database</text>
  <g filter="url(#dbps1-soft)">
    <rect x="72" y="464" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="464" width="6" height="90" fill="#DB2777" clip-path="url(#dbps1-k4)"/>
  </g>
  <circle cx="110" cy="509" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,498.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="136" y="516" font-size="18.5" font-weight="600" fill="#111827">Schema Coupling</text>
  <text x="342" y="579" font-size="15.5" text-anchor="middle" fill="#6B7280">a renamed column breaks another team at runtime</text>
  <g filter="url(#dbps1-soft)">
    <rect x="628" y="464" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="628" y="464" width="6" height="90" fill="#DB2777" clip-path="url(#dbps1-k5)"/>
  </g>
  <circle cx="666" cy="509" r="18" fill="#FFFFFF"/>
  <g transform="translate(655.56,498.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="692" y="516" font-size="18.5" font-weight="600" fill="#111827">One Failure Domain</text>
  <text x="898" y="579" font-size="15.5" text-anchor="middle" fill="#6B7280">the database goes down, every service goes down</text>
  <g filter="url(#dbps1-soft)">
    <rect x="72" y="594" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="594" width="6" height="90" fill="#DB2777" clip-path="url(#dbps1-k6)"/>
  </g>
  <circle cx="110" cy="639" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,628.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="136" y="646" font-size="18.5" font-weight="600" fill="#111827">Performance Interference</text>
  <text x="342" y="709" font-size="15.5" text-anchor="middle" fill="#6B7280">one heavy query slows all three services</text>
  <g filter="url(#dbps1-soft)">
    <rect x="628" y="594" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="628" y="594" width="6" height="90" fill="#DB2777" clip-path="url(#dbps1-k7)"/>
  </g>
  <circle cx="666" cy="639" r="18" fill="#FFFFFF"/>
  <g transform="translate(655.56,628.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="692" y="646" font-size="18.5" font-weight="600" fill="#111827">The Coordination Tax</text>
  <text x="898" y="709" font-size="15.5" text-anchor="middle" fill="#6B7280">every migration needs every team to sign off</text>
  <rect x="40" y="774" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="798" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="820" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">The setup</text>
  <text x="288" y="820" font-size="15.5" fill="#475569">three teams write and read the same tables, so no schema is private to anyone</text>
  <rect x="64" y="842" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="864" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The cost</text>
  <text x="288" y="864" font-size="15.5" fill="#475569">coupling, shared failure, interference, and releases that must line up</text>
</svg>