<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three services share one database, and the four costs that follow: schema coupling, one failure domain, performance interference, and a coordination tax on every migration">
  <defs>
