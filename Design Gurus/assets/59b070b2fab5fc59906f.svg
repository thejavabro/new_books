<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four reasons REST is the default for product APIs: callers already know it, software reads the meanings, constraints create consistency, and it is visible">
  <defs>
    <filter id="c2rw-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2rw-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="c2rw-k1"><rect x="110" y="100" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="c2rw-k2"><rect x="690" y="100" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="c2rw-k3"><rect x="110" y="286" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="c2rw-k4"><rect x="690" y="286" width="440" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="420" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Why this course starts with REST</text>

  
  <g filter="url(#c2rw-lift)">
    <rect x="110" y="100" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="110" y="100" width="9" height="90" fill="#2563EB" clip-path="url(#c2rw-k1)"/>
  </g>
  <circle cx="148" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="174" y="152" font-size="18.5" font-weight="600" fill="#111827">Callers already know it</text>
  <text x="330" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">browsers, apps, servers, proxies, and monitors all speak HTTP</text>
  <text x="330" y="238" font-size="15.5" text-anchor="middle" fill="#94A3B8">familiar HTTP tools</text>

  
  <g filter="url(#c2rw-soft)">
    <rect x="690" y="100" width="440" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="690" y="100" width="6" height="90" fill="#7C3AED" clip-path="url(#c2rw-k2)"/>
  </g>
  <circle cx="728" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,134.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="754" y="152" font-size="18.5" font-weight="600" fill="#111827">Software reads the meanings</text>
  <text x="910" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">SDKs, caches, and retry libraries read the method and the status</text>
  <text x="910" y="238" font-size="15.5" text-anchor="middle" fill="#94A3B8">standard behavior, plus API-specific rules</text>

  
  <g filter="url(#c2rw-soft)">
    <rect x="110" y="286" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="110" y="286" width="6" height="90" fill="#D97706" clip-path="url(#c2rw-k3)"/>
  </g>
  <circle cx="148" cy="331" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,320.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="174" y="338" font-size="18.5" font-weight="600" fill="#111827">Constraints create consistency</text>
  <text x="330" y="401" font-size="15.5" text-anchor="middle" fill="#6B7280">a small vocabulary forces related operations to resemble one another</text>
  <text x="330" y="424" font-size="15.5" text-anchor="middle" fill="#94A3B8">each new operation costs less to learn</text>

  
  <g filter="url(#c2rw-soft)">
    <rect x="690" y="286" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="690" y="286" width="6" height="90" fill="#059669" clip-path="url(#c2rw-k4)"/>
  </g>
  <circle cx="728" cy="331" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,320.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="754" y="338" font-size="18.5" font-weight="600" fill="#111827">It is visible</text>
  <text x="910" y="401" font-size="15.5" text-anchor="middle" fill="#6B7280">a request and its response can be read without generated code</text>
  <text x="910" y="424" font-size="15.5" text-anchor="middle" fill="#94A3B8">shorter integration and incident time</text>

  
  <rect x="40" y="484" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="529" text-anchor="middle" font-size="16" fill="#475569">Use REST when it fits the requirements; consider alternatives when it does not.</text>
</svg>