<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In a read-heavy design, readers are served by a CDN and a cache first, and the remaining reads go to read replicas, while writes go to the primary. In a write-heavy design, writers send data into a queue, the data is batched, and it is spread across shards.">
  <defs>
    <filter id="rhw1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rhw1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rhw1-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rhw1-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rhw1-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rhw1-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rhw1-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rhw1-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="rhw1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Two workloads, two designs</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A news site reads 100 times per write. A metrics pipeline writes 1,000 times per read.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Read-heavy: avoid repeating the same work</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#B45309">Write-heavy: make every write cheap</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#rhw1-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#rhw1-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#rhw1-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#rhw1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#rhw1-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#rhw1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Readers</text>
  <text x="234" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">100 reads per write</text>
  <g filter="url(#rhw1-lift)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="450" y="180" width="9" height="90" fill="#2563EB" clip-path="url(#rhw1-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">CDN and cache</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">answer most reads</text>
  <g filter="url(#rhw1-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#rhw1-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Read replicas</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">the rest of the reads</text>
  <g filter="url(#rhw1-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#rhw1-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">Writers</text>
  <text x="234" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">1,000 writes per read</text>
  <g filter="url(#rhw1-lift)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="450" y="430" width="9" height="90" fill="#D97706" clip-path="url(#rhw1-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Queue and batching</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">absorb bursts</text>
  <g filter="url(#rhw1-soft)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="836" y="430" width="6" height="90" fill="#D97706" clip-path="url(#rhw1-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">Shards</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">spread the write load</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Read-heavy risk</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">serving data that is slightly old</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Write-heavy risk</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">falling behind, and hotspots on one shard</text>
</svg>