<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flowchart: event replay and huge streaming volumes point to Kafka, flexible routing and task queues point to RabbitMQ, and enterprise Java or JMS integration points to ActiveMQ">
  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>
  <defs>
    <marker id="dm8-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="dm8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M230,230 C230,150 400,125 470,125" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm8-slate)"/>
  <text x="330" y="118" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>

  <path d="M400,277 C500,277 640,340 640,410" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm8-slate)"/>
  <text x="480" y="253" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <path d="M810,457 C900,457 900,285 860,285" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm8-slate)"/>
  <text x="862" y="371" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>

  <path d="M640,505 C640,545 750,545 860,545" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm8-slate)"/>
  <text x="750" y="525" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  
  <g filter="url(#dm8-soft)">
    <rect x="60" y="230" width="340" height="95" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="470" y="410" width="340" height="95" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="266" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Do you need event replay or</text>
  <text x="230" y="294" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">huge streaming volumes?</text>
  <text x="640" y="446" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Do you need flexible routing</text>
  <text x="640" y="474" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">or classic task queues?</text>

  
  <g filter="url(#dm8-soft)">
    <rect x="470" y="70" width="280" height="110" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="860" y="230" width="280" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="860" y="490" width="280" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="610" y="104" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="610" y="132" font-size="20" fill="#64748B" text-anchor="middle">event streaming,</text>
  <text x="610" y="159" font-size="20" fill="#64748B" text-anchor="middle">replay, analytics</text>
  <text x="1000" y="264" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">RabbitMQ</text>
  <text x="1000" y="292" font-size="20" fill="#64748B" text-anchor="middle">task queues, RPC,</text>
  <text x="1000" y="319" font-size="20" fill="#64748B" text-anchor="middle">complex routing</text>
  <text x="1000" y="524" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">ActiveMQ</text>
  <text x="1000" y="552" font-size="20" fill="#64748B" text-anchor="middle">enterprise Java,</text>
  <text x="1000" y="579" font-size="20" fill="#64748B" text-anchor="middle">legacy JMS apps</text>
</svg>