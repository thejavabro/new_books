<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1150" viewBox="0 0 1240 1150" role="img" aria-label="The Google News data model. One new article is written into several Cassandra tables at once: ArticlesByID partitioned by article_id for lookup by id, ArticlesByCategory partitioned by category and clustered by publish time for recent items in a category, and UserFeed partitioned by user_id and clustered by a time based UUID for a precomputed per user feed. It is also indexed in Elasticsearch for text search. User accounts and subscriptions stay in a relational database. Cassandra cannot join, so each table repeats the data it needs.">
