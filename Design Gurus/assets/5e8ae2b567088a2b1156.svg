  <rect x="946.75" y="88" width="126.5" height="36" rx="8" fill="#FFFFFF" opacity="0.96"/>
  <text x="1010" y="113" font-size="18" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">and indexed</text>

  <text x="620" y="576" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Three tables, three questions, the same article written into each one.</text>

  <rect x="40" y="930" width="1160" height="180" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="620" y="970" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Why the same article is stored more than once</text>
  <text x="620" y="1010" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Cassandra has no joins, so a table can only answer the question its key was chosen for.</text>
  <text x="620" y="1040" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Writes are cheap and reads must be fast, so the write pays to make every read a lookup.</text>
  <text x="620" y="1070" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The cost is that a correction has to be applied to each table, not to one row.</text>
</svg>