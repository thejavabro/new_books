  <text x="1020" y="781" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">not a source of truth.</text>

  <path d="M560 152 V 176 H 220 V 242" fill="none" stroke="#D97706" stroke-width="2.2" marker-end="url(#sch-arrow-amber)"/>
  <path d="M620 152 V 242" fill="none" stroke="#D97706" stroke-width="2.2" marker-end="url(#sch-arrow-amber)"/>
