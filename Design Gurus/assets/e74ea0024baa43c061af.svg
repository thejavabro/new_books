<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Server A reads 100, Server B reads 100, Server A writes 101, Server B writes 101. Two likes were added but the result is 101, so one update was lost.">
  <defs>
    <filter id="cc1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cc1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cc1-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc1-k2"><rect x="654" y="300" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc1-k3"><rect x="64" y="420" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc1-k4"><rect x="654" y="540" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc1-k5"><rect x="40" y="740" width="1160" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="1030" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A race condition loses an update</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Two users like a post with 100 likes at the same moment. Follow the steps in order.</text>

  <rect x="40" y="120" width="570" height="580" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Server A</text>
  <rect x="630" y="120" width="570" height="580" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Server B</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#cc1-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#cc1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">1. Read likes: 100</text>
  <g filter="url(#cc1-soft)">
    <rect x="654" y="300" width="522" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="654" y="300" width="6" height="90" fill="#7C3AED" clip-path="url(#cc1-k2)"/>
  </g>
  <circle cx="692" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,334.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="718" y="352" font-size="21.5" font-weight="600" fill="#111827">2. Read likes: 100</text>
  <g filter="url(#cc1-soft)">
    <rect x="64" y="420" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="420" width="6" height="90" fill="#2563EB" clip-path="url(#cc1-k3)"/>
  </g>
  <circle cx="102" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,454.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="128" y="472" font-size="21.5" font-weight="600" fill="#111827">3. Write likes: 101</text>
  <text x="325" y="539" font-size="18.5" text-anchor="middle" fill="#6B7280">adds 1 to the 100 it read</text>
  <g filter="url(#cc1-soft)">
    <rect x="654" y="540" width="522" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="654" y="540" width="6" height="90" fill="#DB2777" clip-path="url(#cc1-k4)"/>
  </g>
  <circle cx="692" cy="585" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,574.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="718" y="592" font-size="21.5" font-weight="600" fill="#111827">4. Write likes: 101</text>
  <text x="915" y="659" font-size="18.5" text-anchor="middle" fill="#6B7280">writes over Server A's change</text>
  <g filter="url(#cc1-lift)">
    <rect x="40" y="740" width="1160" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="40" y="740" width="9" height="90" fill="#DB2777" clip-path="url(#cc1-k5)"/>
  </g>
  <circle cx="78" cy="785" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,774.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="104" y="792" font-size="21.5" font-weight="600" fill="#111827">Result: 101, but two likes were added</text>
  <text x="620" y="859" font-size="18.5" text-anchor="middle" fill="#6B7280">one update was lost</text>

  <rect x="40" y="900" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="925" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="950" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">The fix</text>
  <text x="323" y="950" font-size="18.5" fill="#475569">a lock or a version check makes the second write wait or retry</text>
</svg>