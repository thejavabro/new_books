<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four teams all edit one shared Product class of 40 fields, so every change risks another team&#39;s feature and no team can say what a valid product is">
  <defs>
    <marker id="m02-l01-shared-product-class-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m02-l01-shared-product-class-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m02-l01-shared-product-class-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="690" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2.5">
    <path d="M360,150 C360,240 500,240 500,330" stroke="#475569" marker-end="url(#m02-l01-shared-product-class-sl)"/>
    <path d="M880,150 C880,240 740,240 740,330" stroke="#475569" marker-end="url(#m02-l01-shared-product-class-sl)"/>
    <path d="M360,255 C360,290 560,290 560,330" stroke="#475569" marker-end="url(#m02-l01-shared-product-class-sl)"/>
    <path d="M880,255 C880,290 680,290 680,330" stroke="#475569" marker-end="url(#m02-l01-shared-product-class-sl)"/>
    <path d="M540,420 C540,455 310,455 310,490" stroke="#DC2626" stroke-width="3" marker-end="url(#m02-l01-shared-product-class-rd)"/>
    <path d="M700,420 C700,455 930,455 930,490" stroke="#DC2626" stroke-width="3" marker-end="url(#m02-l01-shared-product-class-rd)"/>
  </g>

  
  <text x="620" y="303" font-size="20" text-anchor="middle" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">four teams edit it</text>

  
  <g filter="url(#m02-l01-shared-product-class-soft)">
    <rect x="170" y="70" width="380" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="360" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog team</text>
  <text x="360" y="135" text-anchor="middle" font-size="20" fill="#64748B">product = title, images, price</text>

  <g filter="url(#m02-l01-shared-product-class-soft)">
    <rect x="690" y="70" width="380" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="880" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory team</text>
  <text x="880" y="135" text-anchor="middle" font-size="20" fill="#64748B">product = stock per warehouse</text>

  <g filter="url(#m02-l01-shared-product-class-soft)">
    <rect x="170" y="175" width="380" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="360" y="210" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shipping team</text>
  <text x="360" y="240" text-anchor="middle" font-size="20" fill="#64748B">product = weight, dimensions</text>

  <g filter="url(#m02-l01-shared-product-class-soft)">
    <rect x="690" y="175" width="380" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="880" y="210" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Reviews team</text>
  <text x="880" y="240" text-anchor="middle" font-size="20" fill="#64748B">product = rating, comments</text>

  
  <g filter="url(#m02-l01-shared-product-class-soft)">
    <rect x="390" y="330" width="460" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="620" y="368" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One shared Product class, 40 fields</text>
  <text x="620" y="400" text-anchor="middle" font-size="20" fill="#64748B">a god object: one model for everyone</text>

  
  <g filter="url(#m02-l01-shared-product-class-soft)">
    <rect x="90" y="490" width="440" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="310" y="534" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Every change risks</text>
  <text x="310" y="564" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">another team's feature</text>

  <g filter="url(#m02-l01-shared-product-class-soft)">
    <rect x="710" y="490" width="440" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="930" y="534" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">No team can say what</text>
  <text x="930" y="564" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">a valid product is</text>

  
  <g stroke-width="4">
    <line x1="40" y1="645" x2="74" y2="645" stroke="#475569"/>
    <line x1="640" y1="645" x2="674" y2="645" stroke="#DC2626"/>
  </g>
  <text x="84" y="652" font-size="20" fill="#475569">Four teams edit the same class</text>
  <text x="684" y="652" font-size="20" fill="#475569">The consequences of the shared model</text>
</svg>