<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two migration plans: the big rewrite freezes features and bets everything on one risky cutover, while the strangler fig replaces one capability at a time and keeps a working system in production at every step">
  <defs>
    <marker id="m02-l04-rewrite-vs-strangler-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m02-l04-rewrite-vs-strangler-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m02-l04-rewrite-vs-strangler-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>

  <rect x="40" y="170" width="460" height="510" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="208" font-size="20" font-weight="600" fill="#B91C1C">One big bet</text>

  <rect x="740" y="170" width="460" height="510" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="762" y="208" font-size="20" font-weight="600" fill="#065F46">Many small steps</text>

  <g fill="none" stroke-width="2.5">
    <path d="M620,130 C620,195 270,180 270,240" stroke="#DC2626" marker-end="url(#m02-l04-rewrite-vs-strangler-red)"/>
    <path d="M620,130 C620,195 970,180 970,240" stroke="#059669" marker-end="url(#m02-l04-rewrite-vs-strangler-em)"/>
    <path d="M270,330 L270,390" stroke="#DC2626" marker-end="url(#m02-l04-rewrite-vs-strangler-red)"/>
    <path d="M270,480 L270,540" stroke="#DC2626" stroke-width="3" marker-end="url(#m02-l04-rewrite-vs-strangler-red)"/>
    <path d="M970,330 L970,390" stroke="#059669" marker-end="url(#m02-l04-rewrite-vs-strangler-em)"/>
    <path d="M970,480 L970,540" stroke="#059669" stroke-width="3" marker-end="url(#m02-l04-rewrite-vs-strangler-em)"/>
  </g>

  <g filter="url(#m02-l04-rewrite-vs-strangler-soft)">
    <rect x="420" y="40" width="400" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="620" y="80" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Migrate the monolith</text>
  <text x="620" y="112" text-anchor="middle" font-size="20" fill="#64748B">the monolith must become services</text>

  <g filter="url(#m02-l04-rewrite-vs-strangler-soft)">
    <rect x="60" y="240" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="270" y="278" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Big rewrite</text>
  <text x="270" y="310" text-anchor="middle" font-size="20" fill="#64748B">build alongside, switch in one move</text>

  <g filter="url(#m02-l04-rewrite-vs-strangler-soft)">
    <rect x="60" y="390" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="270" y="428" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Features frozen or built twice</text>
  <text x="270" y="460" text-anchor="middle" font-size="20" fill="#64748B">the business does not stop</text>

  <g filter="url(#m02-l04-rewrite-vs-strangler-soft)">
    <rect x="60" y="540" width="420" height="115" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="270" y="578" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One risky cutover</text>
  <text x="270" y="608" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">after months of zero value</text>
  <text x="270" y="638" text-anchor="middle" font-size="20" fill="#64748B">many rewrites quietly cancelled</text>

  <g filter="url(#m02-l04-rewrite-vs-strangler-soft)">
    <rect x="760" y="240" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="970" y="278" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Strangler fig</text>
  <text x="970" y="310" text-anchor="middle" font-size="20" fill="#64748B">replace it while it keeps running</text>

  <g filter="url(#m02-l04-rewrite-vs-strangler-soft)">
    <rect x="760" y="390" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="970" y="428" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Replace one capability at a time</text>
  <text x="970" y="460" text-anchor="middle" font-size="20" fill="#64748B">ship, stabilize, observe, repeat</text>

  <g filter="url(#m02-l04-rewrite-vs-strangler-soft)">
    <rect x="760" y="540" width="420" height="115" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="970" y="578" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A working system in production</text>
  <text x="970" y="608" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">at every step</text>
  <text x="970" y="638" text-anchor="middle" font-size="20" fill="#64748B">every step shippable and reversible</text>

  <g stroke-width="4">
    <line x1="40" y1="740" x2="74" y2="740" stroke="#DC2626"/>
    <line x1="640" y1="740" x2="674" y2="740" stroke="#059669"/>
  </g>
  <text x="84" y="747" font-size="20" fill="#475569">Big rewrite: risk concentrated in one cutover</text>
  <text x="684" y="747" font-size="20" fill="#475569">Strangler fig: value shipped at every step</text>
</svg>