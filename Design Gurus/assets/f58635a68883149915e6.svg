<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1210" viewBox="0 0 1240 1210" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated Airbnb architecture showing the search read path, the booking write path, the asynchronous index sync, the media pipeline, and the caches and scaling strategies for each">
  <defs>
    <filter id="ab-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="ab-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ab-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ab-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1210" fill="#FFFFFF"/>

  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Airbnb: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Read path, write path, index sync and media, with every cache and scaling strategy marked</text>

  
  <rect x="24" y="96" width="1192" height="300" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Search (read path) &#183; target under 300ms &#183; 6,000 QPS peak</text>

  
  <path d="M260,192 L349,192" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ab-blue)"/>
  <path d="M573,192 L662,192" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ab-blue)"/>
  <path d="M886,192 L975,192" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#ab-blue)"/>
  <path d="M772,232 L772,296" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ab-emerald)"/>
  <path d="M886,332 L975,332" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ab-emerald)"/>

  <text x="304" y="180" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <text x="617" y="180" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">route</text>
  <text x="930" y="180" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">filter</text>
  <text x="790" y="272" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hydrate IDs</text>
  <text x="930" y="320" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>

  <g filter="url(#ab-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="662" y="156" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">web and mobile</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Gateway</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">rate limit per IP</text>
  <text x="772" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Search Service</text>
  <text x="772" y="216" font-size="20" fill="#64748B" text-anchor="middle">query then fetch</text>

  
  <g filter="url(#ab-soft)">
    <path d="M975,171 L975,217 A110,15 0 0 0 1195,217 L1195,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1085" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1085" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Elasticsearch</text>
  <text x="1085" y="252" font-size="20" fill="#5B21B6" text-anchor="middle">sharded by region</text>

  
  <g filter="url(#ab-soft)">
    <path d="M662,311 L662,357 A110,15 0 0 0 882,357 L882,311" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="772" cy="311" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="772" y="345" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis cache</text>
  <text x="772" y="392" font-size="20" fill="#065F46" text-anchor="middle">listing:{id}, 1 hour TTL</text>

  
  <g filter="url(#ab-soft)">
    <path d="M975,311 L975,357 A110,15 0 0 0 1195,357 L1195,311" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1085" cy="311" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1085" y="345" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Postgres replicas</text>
  <text x="1085" y="392" font-size="20" fill="#5B21B6" text-anchor="middle">read only</text>

  
  <rect x="24" y="426" width="1192" height="300" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="458" font-size="20" font-weight="600" fill="#1E40AF">2. Booking (write path) &#183; strong consistency &#183; about 1.2 writes per second</text>

  <path d="M260,522 L349,522" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ab-blue)"/>
  <path d="M573,522 L662,522" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ab-blue)"/>
  <path d="M886,522 L975,522" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#ab-blue)"/>
  <path d="M772,562 L772,606" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ab-emerald)"/>
  <path d="M882,524 C930,524 930,648 971,648" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ab-blue)"/>

  <text x="304" y="510" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <text x="617" y="510" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">route</text>
  <text x="930" y="510" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">lock row</text>
  <text x="790" y="596" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hold seats</text>
  <text x="928" y="600" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge</text>

  <g filter="url(#ab-soft)">
    <rect x="40" y="486" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="486" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="662" y="486" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="975" y="610" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="520" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="546" font-size="20" fill="#64748B" text-anchor="middle">idempotency key</text>
  <text x="463" y="520" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Gateway</text>
  <text x="463" y="546" font-size="20" fill="#64748B" text-anchor="middle">auth</text>
  <text x="772" y="520" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Booking Service</text>
  <text x="772" y="546" font-size="20" fill="#64748B" text-anchor="middle">locks the listing row</text>
  <text x="1085" y="644" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Payment Service</text>
  <text x="1085" y="670" font-size="20" fill="#64748B" text-anchor="middle">external</text>

  
  <g filter="url(#ab-soft)">
    <path d="M975,501 L975,547 A110,15 0 0 0 1195,547 L1195,501" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1085" cy="501" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1085" y="535" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Postgres primary</text>
  <text x="1085" y="582" font-size="20" fill="#5B21B6" text-anchor="middle">sharded by listing_id</text>

  
  <g filter="url(#ab-soft)">
    <path d="M662,625 L662,671 A110,15 0 0 0 882,671 L882,625" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="772" cy="625" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="772" y="659" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis temporary hold</text>
  <text x="772" y="706" font-size="20" fill="#065F46" text-anchor="middle">5 minute TTL</text>

  
  <rect x="24" y="756" width="1192" height="190" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="788" font-size="20" font-weight="600" fill="#92400E">3. Index sync (asynchronous) &#183; 1 to 5 seconds behind the database</text>

  <path d="M260,852 L349,852" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ab-amber)"/>
  <path d="M573,852 L662,852" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ab-amber)"/>
  <path d="M886,852 L975,852" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ab-amber)"/>

  <text x="304" y="840" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">WAL</text>
  <text x="617" y="840" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>
  <text x="930" y="840" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consume</text>

  <g filter="url(#ab-soft)">
    <rect x="40" y="816" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="816" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="975" y="816" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="150" y="850" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Postgres primary</text>
  <text x="150" y="876" font-size="20" fill="#64748B" text-anchor="middle">commit log</text>
  <text x="463" y="850" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Debezium CDC</text>
  <text x="463" y="876" font-size="20" fill="#92400E" text-anchor="middle">no dual writes</text>
  <text x="1085" y="850" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Indexer Service</text>
  <text x="1085" y="876" font-size="20" fill="#92400E" text-anchor="middle">updates booked_dates</text>

  
  <g filter="url(#ab-soft)">
    <path d="M662,831 L662,877 A110,15 0 0 0 882,877 L882,831" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="772" cy="831" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="772" y="865" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="772" y="922" font-size="20" fill="#92400E" text-anchor="middle">booking_events</text>

  
  <rect x="24" y="976" width="1192" height="130" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="1008" font-size="20" font-weight="600" fill="#475569">4. Media &#183; 200 TB of photos, never through the API servers</text>

  <path d="M260,1058 L349,1058" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ab-blue)"/>
  <path d="M573,1058 L662,1058" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ab-amber)"/>
  <path d="M882,1058 L975,1058" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ab-blue)"/>

  <text x="304" y="1046" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">presigned</text>
  <text x="617" y="1046" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">trigger</text>
  <text x="928" y="1046" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">serve</text>

  <g filter="url(#ab-soft)">
    <rect x="40" y="1030" width="220" height="56" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="1030" width="220" height="56" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="662" y="1030" width="220" height="56" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="975" y="1030" width="220" height="56" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="1065" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client upload</text>
  <text x="463" y="1065" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3</text>
  <text x="772" y="1065" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Lambda resize</text>
  <text x="1085" y="1065" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">CDN</text>

  
  <line x1="44" y1="1150" x2="72" y2="1150" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1157" font-size="20" fill="#475569">synchronous request</text>
  <line x1="330" y1="1150" x2="358" y2="1150" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="370" y="1157" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="616" y="1141" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="656" y="1157" font-size="20" fill="#475569">cache</text>
  <rect x="760" y="1141" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="800" y="1157" font-size="20" fill="#475569">datastore</text>
  <rect x="932" y="1141" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="972" y="1157" font-size="20" fill="#475569">service that owns the flow</text>
</svg>