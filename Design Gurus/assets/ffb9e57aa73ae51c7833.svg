<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four checkout threads put orders into a queue with a limit of 4, and two order workers take them out">
