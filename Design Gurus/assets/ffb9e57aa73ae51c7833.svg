  <rect x="0" y="0" width="1240" height="716" fill="#FFFFFF"/>

  
  <rect x="438" y="40" width="344" height="496" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="462" y="70" font-size="20" font-weight="600" fill="#475569">Bounded blocking queue, limit 4</text>

  
  <g fill="none" stroke-width="2">
