    <clipPath id="m05op-k7"><rect x="480" y="312" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="m05op-k8"><rect x="480" y="422" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="m05op-k9"><rect x="970" y="153" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="m05op-k10"><rect x="970" y="333" width="230" height="90" rx="12"/></clipPath>
