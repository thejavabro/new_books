    <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
  </g>
  <text x="1034" y="385" font-size="20" font-weight="600" fill="#111827">Order worker 2</text>
  <text x="1085" y="453" font-size="20" text-anchor="middle" fill="#6B7280">Charges the card</text>
  <text x="1085" y="481" font-size="20" text-anchor="middle" fill="#94A3B8">Emails the ticket</text>

  
  <rect x="40" y="600" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="645" text-anchor="middle" font-size="20" fill="#475569">Checkout threads wait when the queue is full, and workers wait when it is empty.</text>
