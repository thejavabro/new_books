<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The first minute of an AI design question: classify the form, confirm the lane, then state the plan, before any box is drawn">
  <defs>
    <marker id="c1fm-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <filter id="c1fm-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="c1fm-k1"><rect x="40" y="110" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="c1fm-k2"><rect x="348" y="110" width="242" height="90" rx="12"/></clipPath>
    <clipPath id="c1fm-k3"><rect x="640" y="110" width="242" height="90" rx="12"/></clipPath>
    <clipPath id="c1fm-k4"><rect x="932" y="110" width="242" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>
  <rect x="320" y="50" width="880" height="464" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="344" y="80" font-size="16.5" font-weight="600" fill="#1D4ED8">The first minute, before any box is drawn</text>
  <g fill="none" stroke-width="2">
    <path d="M280,155 H348" stroke="#2563EB" marker-end="url(#c1fm-mblue)"/>
    <path d="M590,155 H640" stroke="#2563EB" marker-end="url(#c1fm-mblue)"/>
    <path d="M882,155 H932" stroke="#2563EB" marker-end="url(#c1fm-mblue)"/>
  </g>
  <g filter="url(#c1fm-soft)">
    <rect x="40" y="110" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="110" width="6" height="90" fill="#64748B" clip-path="url(#c1fm-k1)"/>
  </g>
  <circle cx="78" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="162" font-size="18.5" font-weight="600" fill="#111827">The question</text>
  <text x="160" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">senior software engineer loop</text>
  <g filter="url(#c1fm-soft)">
    <rect x="348" y="110" width="242" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="348" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#c1fm-k2)"/>
  </g>
  <circle cx="386" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(375.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="412" y="162" font-size="18.5" font-weight="600" fill="#111827">1. Classify the form</text>
  <text x="469" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">Form 3: add AI to a system</text>
  <g filter="url(#c1fm-soft)">
    <rect x="640" y="110" width="242" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="640" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#c1fm-k3)"/>
  </g>
  <circle cx="678" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="704" y="162" font-size="18.5" font-weight="600" fill="#111827">2. Confirm the lane</text>
  <text x="761" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">modeling or serving?</text>
  <g filter="url(#c1fm-soft)">
    <rect x="932" y="110" width="242" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="932" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#c1fm-k4)"/>
  </g>
  <circle cx="970" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(959.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="996" y="162" font-size="18.5" font-weight="600" fill="#111827">3. State the plan</text>
  <text x="1053" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">where the hour will go</text>
  <rect x="40" y="245" width="240" height="94" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="56" y="273" font-size="15.5" font-weight="600" fill="#B45309">Interviewer:</text>
  <text x="56" y="295" font-size="15.5" fill="#374151">"Add AI to our support</text>
  <text x="56" y="317" font-size="15.5" fill="#374151">ticket system."</text>
  <rect x="348" y="245" width="242" height="236" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="364" y="273" font-size="15.5" font-weight="600" fill="#1D4ED8">Candidate:</text>
  <text x="364" y="295" font-size="15.5" fill="#374151">"This is about adding AI to</text>
  <text x="364" y="317" font-size="15.5" fill="#374151">a working system, so I'll</text>
  <text x="364" y="339" font-size="15.5" fill="#374151">start by choosing where AI</text>
  <text x="364" y="361" font-size="15.5" fill="#374151">helps most."</text>
  <rect x="640" y="245" width="242" height="236" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="656" y="273" font-size="15.5" font-weight="600" fill="#1D4ED8">Candidate:</text>
  <text x="656" y="295" font-size="15.5" fill="#374151">"Should I focus on modeling</text>
  <text x="656" y="317" font-size="15.5" fill="#374151">depth, or on serving</text>
  <text x="656" y="339" font-size="15.5" fill="#374151">architecture?"</text>
  <text x="656" y="371" font-size="15.5" font-weight="600" fill="#B45309">Interviewer:</text>
  <text x="656" y="393" font-size="15.5" fill="#374151">"Assume the model</text>
  <text x="656" y="415" font-size="15.5" fill="#374151">already exists."</text>
  <rect x="932" y="245" width="242" height="236" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="948" y="273" font-size="15.5" font-weight="600" fill="#1D4ED8">Candidate:</text>
  <text x="948" y="295" font-size="15.5" fill="#374151">"I'll pick the first AI</text>
  <text x="948" y="317" font-size="15.5" fill="#374151">feature for the ticket</text>
  <text x="948" y="339" font-size="15.5" fill="#374151">system and set its targets.</text>
  <text x="948" y="361" font-size="15.5" fill="#374151">Then I'll design how the</text>
  <text x="948" y="383" font-size="15.5" fill="#374151">model is served, what it</text>
  <text x="948" y="405" font-size="15.5" fill="#374151">costs, and how we learn</text>
  <text x="948" y="427" font-size="15.5" fill="#374151">whether it helps. I'll</text>
  <text x="948" y="449" font-size="15.5" fill="#374151">finish with how it fails."</text>
  <rect x="40" y="544" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="579" text-anchor="middle" font-size="15.5" fill="#374151">The whole read takes about thirty seconds.</text>
  <text x="620" y="605" text-anchor="middle" font-size="15.5" fill="#374151">The form sets what the hour is about. The lane sets how deep to go on the model.</text>
</svg>