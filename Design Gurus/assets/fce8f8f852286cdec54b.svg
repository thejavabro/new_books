<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="778" viewBox="0 0 1240 778" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three inference consumers and the contract consequence of each deciding pressure: a chat web app needs first output within one second and uses SSE, a batch pipeline values cost and throughput and uses an asynchronous batch resource, and an agent framework needs reliable machine control and uses a JSON schema with typed events.">
  <defs>
    <marker id="p2c-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p2c-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="p2c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2c-k1"><rect x="76" y="134" width="248" height="90" rx="12"/></clipPath>
    <clipPath id="p2c-k2"><rect x="386" y="134" width="398" height="90" rx="12"/></clipPath>
    <clipPath id="p2c-k3"><rect x="840" y="134" width="324" height="90" rx="12"/></clipPath>
    <clipPath id="p2c-k4"><rect x="76" y="302" width="248" height="90" rx="12"/></clipPath>
    <clipPath id="p2c-k5"><rect x="386" y="302" width="398" height="90" rx="12"/></clipPath>
    <clipPath id="p2c-k6"><rect x="840" y="302" width="324" height="90" rx="12"/></clipPath>
    <clipPath id="p2c-k7"><rect x="76" y="470" width="248" height="90" rx="12"/></clipPath>
    <clipPath id="p2c-k8"><rect x="386" y="470" width="398" height="90" rx="12"/></clipPath>
    <clipPath id="p2c-k9"><rect x="840" y="470" width="324" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="778" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="590" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Three consumers, three pressures, one vocabulary</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#94A3B8">one row per consumer</text>

  
  <text x="76" y="112" font-size="16.5" font-weight="600" fill="#1D4ED8">Consumer and main job</text>
  <text x="386" y="112" font-size="16.5" font-weight="600" fill="#B45309">Deciding pressure</text>
  <text x="840" y="112" font-size="16.5" font-weight="600" fill="#047857">Contract consequence</text>

  
  <g fill="none" stroke-width="2">
    <path d="M324,179 H386" stroke="#2563EB" marker-end="url(#p2c-bl)"/>
    <path d="M784,179 H840" stroke="#D97706" marker-end="url(#p2c-am)"/>
    <path d="M324,347 H386" stroke="#2563EB" marker-end="url(#p2c-bl)"/>
    <path d="M784,347 H840" stroke="#D97706" marker-end="url(#p2c-am)"/>
    <path d="M324,515 H386" stroke="#2563EB" marker-end="url(#p2c-bl)"/>
    <path d="M784,515 H840" stroke="#D97706" marker-end="url(#p2c-am)"/>
  </g>

  
  <g filter="url(#p2c-soft)">
    <rect x="76" y="134" width="248" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
