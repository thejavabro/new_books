    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="354" font-size="18.5" font-weight="600" fill="#111827">Batch pipeline</text>
  <text x="200" y="417" text-anchor="middle" font-size="15.5" fill="#6B7280">Process many documents cheaply</text>

  <g filter="url(#p2c-soft)">
    <rect x="386" y="302" width="398" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="386" y="302" width="6" height="90" fill="#D97706" clip-path="url(#p2c-k5)"/>
  </g>
  <circle cx="424" cy="347" r="18" fill="#FFFFFF"/>
  <g transform="translate(413.56,336.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="450" y="354" font-size="18.5" font-weight="600" fill="#111827">Cost and throughput</text>

  <g filter="url(#p2c-soft)">
    <rect x="840" y="302" width="324" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="840" y="302" width="6" height="90" fill="#059669" clip-path="url(#p2c-k6)"/>
  </g>
  <circle cx="878" cy="347" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,336.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="904" y="354" font-size="18.5" font-weight="600" fill="#111827">Async batch</text>
  <text x="1002" y="417" text-anchor="middle" font-size="15.5" fill="#6B7280">separate queue and price</text>

  
  <g filter="url(#p2c-soft)">
    <rect x="76" y="470" width="248" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="470" width="6" height="90" fill="#2563EB" clip-path="url(#p2c-k7)"/>
  </g>
  <circle cx="114" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,504.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="522" font-size="18.5" font-weight="600" fill="#111827">Agent framework</text>
  <text x="200" y="585" text-anchor="middle" font-size="15.5" fill="#6B7280">Choose tools and parse results</text>

  <g filter="url(#p2c-soft)">
    <rect x="386" y="470" width="398" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="386" y="470" width="6" height="90" fill="#D97706" clip-path="url(#p2c-k8)"/>
  </g>
  <circle cx="424" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(413.56,504.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="450" y="522" font-size="18.5" font-weight="600" fill="#111827">Reliable machine control</text>

  <g filter="url(#p2c-soft)">
    <rect x="840" y="470" width="324" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="840" y="470" width="6" height="90" fill="#059669" clip-path="url(#p2c-k9)"/>
  </g>
  <circle cx="878" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,504.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="904" y="522" font-size="18.5" font-weight="600" fill="#111827">JSON schema</text>
  <text x="1002" y="585" text-anchor="middle" font-size="15.5" fill="#6B7280">typed events</text>
  <text x="1002" y="608" text-anchor="middle" font-size="15.5" fill="#94A3B8">actionable errors</text>

  
  <rect x="40" y="662" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="707" text-anchor="middle" font-size="16" fill="#475569">The three consumers do not need three APIs. They need different operations inside one vocabulary.</text>
</svg>