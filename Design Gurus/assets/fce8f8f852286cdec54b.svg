  </g>
  <circle cx="114" cy="179" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,168.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="186" font-size="18.5" font-weight="600" fill="#111827">Chat web app</text>
  <text x="200" y="249" text-anchor="middle" font-size="15.5" fill="#6B7280">Show an answer while it is produced</text>

  <g filter="url(#p2c-soft)">
    <rect x="386" y="134" width="398" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
