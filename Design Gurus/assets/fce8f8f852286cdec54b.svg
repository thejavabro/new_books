  <g transform="translate(413.56,168.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="450" y="186" font-size="18.5" font-weight="600" fill="#111827">First output within one second</text>

  <g filter="url(#p2c-soft)">
    <rect x="840" y="134" width="324" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="840" y="134" width="6" height="90" fill="#059669" clip-path="url(#p2c-k3)"/>
