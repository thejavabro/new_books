  <g transform="translate(867.56,168.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="904" y="186" font-size="18.5" font-weight="600" fill="#111827">SSE</text>
  <text x="1002" y="249" text-anchor="middle" font-size="15.5" fill="#6B7280">short admission wait</text>
  <text x="1002" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">cancellation</text>

  
  <g filter="url(#p2c-soft)">
    <rect x="76" y="302" width="248" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="302" width="6" height="90" fill="#2563EB" clip-path="url(#p2c-k4)"/>
  </g>
  <circle cx="114" cy="347" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,336.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
