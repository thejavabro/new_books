<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Polling: the client requests on a fixed schedule and most responses come back empty">
  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
  <defs>
    <marker id="rt2-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rt2-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rt2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rt2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="240" y1="112" x2="240" y2="592" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1000" y1="112" x2="1000" y2="592" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <text x="100" y="197" font-size="20" fill="#64748B" text-anchor="end">0s</text>
  <text x="100" y="307" font-size="20" fill="#64748B" text-anchor="end">2s</text>
  <text x="100" y="417" font-size="20" fill="#64748B" text-anchor="end">4s</text>
  <text x="100" y="527" font-size="20" fill="#64748B" text-anchor="end">6s</text>

  
  <line x1="248" y1="190" x2="990" y2="190" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt2-blue)"/>
  <text x="620" y="166" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Request: any new data?</text>
  <line x1="992" y1="235" x2="250" y2="235" stroke="#DC2626" stroke-width="2" marker-end="url(#rt2-red)"/>
  <text x="620" y="228" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Empty response (no new data)</text>

  
  <line x1="248" y1="300" x2="990" y2="300" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt2-blue)"/>
  <text x="620" y="276" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Request: any new data?</text>
  <line x1="992" y1="345" x2="250" y2="345" stroke="#DC2626" stroke-width="2" marker-end="url(#rt2-red)"/>
  <text x="620" y="338" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Empty response</text>

  
  <line x1="248" y1="410" x2="990" y2="410" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt2-blue)"/>
  <text x="620" y="386" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Request: any new data?</text>
  <line x1="992" y1="455" x2="250" y2="455" stroke="#059669" stroke-width="2.5" marker-end="url(#rt2-emerald)"/>
  <text x="620" y="448" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">New data delivered</text>

  
  <line x1="248" y1="520" x2="990" y2="520" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt2-blue)"/>
  <text x="620" y="496" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Request: any new data?</text>
  <line x1="992" y1="565" x2="250" y2="565" stroke="#DC2626" stroke-width="2" marker-end="url(#rt2-red)"/>
  <text x="620" y="558" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Empty response</text>

  
  <g filter="url(#rt2-soft)">
    <rect x="120" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="880" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="240" y="98" font-size="20" fill="#64748B" text-anchor="middle">polls every 2 seconds</text>
  <text x="1000" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="1000" y="98" font-size="20" fill="#64748B" text-anchor="middle">answers right away</text>

  
  <rect x="200" y="612" width="840" height="52" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="645" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Three of four responses were empty. Each one still paid a full HTTP round trip.</text>

  
  <line x1="240" y1="700" x2="268" y2="700" stroke="#3B82F6" stroke-width="3"/>
  <text x="278" y="707" font-size="20" fill="#475569">request</text>
  <line x1="430" y1="700" x2="458" y2="700" stroke="#DC2626" stroke-width="3"/>
  <text x="468" y="707" font-size="20" fill="#475569">empty response</text>
  <line x1="680" y1="700" x2="708" y2="700" stroke="#059669" stroke-width="3"/>
  <text x="718" y="707" font-size="20" fill="#475569">response with data</text>
</svg>