<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four availability targets and the downtime they allow: 99 percent allows 3.65 days a year, 99.9 percent allows 8.76 hours, 99.99 percent allows 53 minutes, and 99.999 percent allows 5.3 minutes">
  <defs>
    <filter id="av1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="av1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="av1-k1"><rect x="40" y="130" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av1-k2"><rect x="343" y="130" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av1-k3"><rect x="646" y="130" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av1-k4"><rect x="949" y="130" width="250" height="90" rx="12"/></clipPath>
    <marker id="av1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How much downtime each target allows</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each extra nine allows 10 times less downtime than the one before it.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,175 H343" stroke="#64748B" marker-end="url(#av1-m-slate)"/>
    <path d="M593,175 H646" stroke="#64748B" marker-end="url(#av1-m-slate)"/>
    <path d="M896,175 H949" stroke="#64748B" marker-end="url(#av1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#av1-soft)">
    <rect x="40" y="130" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#av1-k1)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">99%</text>
  <text x="165" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">two nines</text>
  <text x="165" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">3.65 days a year</text>
  <text x="165" y="303" font-size="18.5" text-anchor="middle" fill="#94A3B8">7.2 hours a month</text>
  <g filter="url(#av1-soft)">
    <rect x="343" y="130" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#av1-k2)"/>
  </g>
  <circle cx="381" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="407" y="182" font-size="21.5" font-weight="600" fill="#111827">99.9%</text>
  <text x="468" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">three nines</text>
  <text x="468" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">8.76 hours a year</text>
  <text x="468" y="303" font-size="18.5" text-anchor="middle" fill="#94A3B8">43.2 minutes a month</text>
  <g filter="url(#av1-soft)">
    <rect x="646" y="130" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="646" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#av1-k3)"/>
  </g>
  <circle cx="684" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="710" y="182" font-size="21.5" font-weight="600" fill="#111827">99.99%</text>
  <text x="771" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">four nines</text>
  <text x="771" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">52.6 minutes a year</text>
  <text x="771" y="303" font-size="18.5" text-anchor="middle" fill="#94A3B8">4.32 minutes a month</text>
  <g filter="url(#av1-soft)">
    <rect x="949" y="130" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="949" y="130" width="6" height="90" fill="#DB2777" clip-path="url(#av1-k4)"/>
  </g>
  <circle cx="987" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,164.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="1013" y="182" font-size="21.5" font-weight="600" fill="#111827">99.999%</text>
  <text x="1074" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">five nines</text>
  <text x="1074" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">5.26 minutes a year</text>
  <text x="1074" y="303" font-size="18.5" text-anchor="middle" fill="#94A3B8">25.9 seconds a month</text>

  <rect x="40" y="350" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="375" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="400" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Each step right</text>
  <text x="323" y="400" font-size="18.5" fill="#475569">cuts the allowed downtime by 10 times</text>
  <rect x="64" y="425" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="450" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Five nines</text>
  <text x="323" y="450" font-size="18.5" fill="#475569">about 26 seconds a month is too short for a person to react, so recovery must be automatic</text>
  <rect x="64" y="475" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="500" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Cost</text>
  <text x="323" y="500" font-size="18.5" fill="#475569">each extra nine usually needs more servers, more locations, and more work</text>
</svg>