<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A write request goes only to the leader. The leader sends the same changes in the same order to three followers, each of which holds a full copy of the data. Followers can also answer read requests.">
  <rect x="0" y="0" width="1240" height="570" fill="#FFFFFF"/>
  <defs>
    <marker id="lf1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lf1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lf1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lf1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lf1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lf1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="lf1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lf1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lf1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One machine accepts the writes, the others copy them</text>
  <g filter="url(#lf1-soft)"><rect x="60" y="108" width="200" height="74" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="160" y="152" font-size="19" fill="#0F172A" text-anchor="middle">write request</text>
  <line x1="264" y1="145" x2="392" y2="145" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lf1-s)"/>
  <g filter="url(#lf1-soft)"><rect x="400" y="100" width="300" height="112" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.4"/></g>
  <text x="550" y="146" font-size="24" font-weight="700" fill="#1E40AF" text-anchor="middle">leader</text>
  <text x="550" y="180" font-size="19" fill="#64748B" text-anchor="middle">accepts every write</text>
  <text x="736" y="152" font-size="18" fill="#64748B" text-anchor="start">also called the primary</text>
  <line x1="500" y1="214" x2="310" y2="332" stroke="#059669" stroke-width="2.2" marker-end="url(#lf1-e)"/>
  <line x1="556" y1="214" x2="616" y2="332" stroke="#059669" stroke-width="2.2" marker-end="url(#lf1-e)"/>
  <line x1="612" y1="214" x2="930" y2="332" stroke="#059669" stroke-width="2.2" marker-end="url(#lf1-e)"/>
  <text x="200" y="266" font-size="18" fill="#065F46" text-anchor="middle">the same changes, in the same order</text>
  <text x="1180" y="300" font-size="18" fill="#64748B" text-anchor="end">also called replicas</text>
  <g filter="url(#lf1-soft)"><rect x="170" y="336" width="260" height="100" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="300" y="378" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">follower 1</text>
  <text x="300" y="410" font-size="18" fill="#64748B" text-anchor="middle">holds a full copy</text>
  <g filter="url(#lf1-soft)"><rect x="490" y="336" width="260" height="100" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="620" y="378" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">follower 2</text>
  <text x="620" y="410" font-size="18" fill="#64748B" text-anchor="middle">holds a full copy</text>
  <g filter="url(#lf1-soft)"><rect x="810" y="336" width="260" height="100" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="940" y="378" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">follower 3</text>
  <text x="940" y="410" font-size="18" fill="#64748B" text-anchor="middle">holds a full copy</text>
  <rect x="60" y="466" width="1120" height="74" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="500" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle">Reads can be answered by any follower, which takes load off the leader.</text>
  <text x="620" y="528" font-size="19" fill="#64748B" text-anchor="middle">Those reads can be a little behind the leader.</text>
</svg>