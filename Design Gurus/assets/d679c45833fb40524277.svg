<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1150" viewBox="0 0 1240 1150" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. While the circuit breaker is closed the caller&#39;s call is forwarded to the dependency and comes back a failure after the caller waits out the full timeout, the failure rate crosses the threshold so the breaker opens, and then the next call is rejected in about 1 ms without ever reaching the dependency, which gets room to recover.">
  <defs>
    <marker id="m04-l05-breaker-in-action-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l05-breaker-in-action-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l05-breaker-in-action-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <filter id="m04-l05-breaker-in-action-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1150" fill="#FFFFFF"/>

  <rect x="100" y="175" width="1080" height="300" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="100" y="650" width="1080" height="330" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="300" y1="145" x2="300" y2="990"/>
    <line x1="690" y1="145" x2="690" y2="990"/>
    <line x1="1060" y1="145" x2="1060" y2="990"/>
  </g>

  <text x="50" y="190" text-anchor="middle" font-size="20" fill="#64748B">time</text>
  <line x1="50" y1="205" x2="50" y2="960" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#m04-l05-breaker-in-action-sl)"/>

  <text x="120" y="213" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Phase 1: breaker closed</text>
  <text x="1160" y="213" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">failure rate tracked over the last 20 calls</text>
  <text x="1160" y="458" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the dependency is under sustained failure</text>
  <text x="120" y="688" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Phase 2: breaker open</text>
  <text x="1160" y="688" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">every call rejected instantly</text>

  <g fill="none" stroke-width="2.5">
    <path d="M308,290 L684,290" stroke="#3B82F6" marker-end="url(#m04-l05-breaker-in-action-bl)"/>
    <path d="M696,350 L1054,350" stroke="#3B82F6" marker-end="url(#m04-l05-breaker-in-action-bl)"/>
    <path d="M1054,415 L696,415" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m04-l05-breaker-in-action-rd)"/>
    <path d="M308,760 L684,760" stroke="#3B82F6" marker-end="url(#m04-l05-breaker-in-action-bl)"/>
    <path d="M696,760 L790,760" stroke="#DC2626" stroke-dasharray="6 5"/>
    <path d="M684,830 L308,830" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m04-l05-breaker-in-action-rd)"/>
  </g>

  <circle cx="810" cy="760" r="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <g stroke="#DC2626" stroke-width="2.5">
    <line x1="803" y1="753" x2="817" y2="767"/>
    <line x1="817" y1="753" x2="803" y2="767"/>
  </g>

  <text x="495" y="278" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Call while the breaker is closed</text>
  <text x="875" y="338" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Forward the call</text>
  <text x="875" y="403" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Failure</text>
  <text x="495" y="748" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Next call</text>
  <text x="950" y="748" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Not forwarded</text>
  <text x="495" y="818" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Rejected in about 1 ms</text>

  <rect x="293" y="282" width="14" height="140" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="275" y="345" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">caller waits out</text>
  <text x="275" y="371" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the full timeout</text>
  <rect x="293" y="752" width="14" height="86" rx="2" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="275" y="790" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">caller is free</text>
  <text x="275" y="816" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">again in 1 ms</text>
  <rect x="1053" y="346" width="14" height="76" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

  <g filter="url(#m04-l05-breaker-in-action-soft)">
    <rect x="340" y="510" width="700" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="690" y="556" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Failure rate crosses the threshold, so the breaker opens</text>
  <text x="690" y="588" text-anchor="middle" font-size="20" fill="#64748B">state changes: closed to open</text>
  <g filter="url(#m04-l05-breaker-in-action-soft)">
    <rect x="620" y="860" width="560" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="900" y="901" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">No calls reach the dependency,</text>
  <text x="900" y="933" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">so it gets room to recover</text>

  <g filter="url(#m04-l05-breaker-in-action-soft)">
    <rect x="180" y="50" width="240" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="300" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Caller</text>
  <text x="300" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">waiting on a reply</text>
  <g filter="url(#m04-l05-breaker-in-action-soft)">
    <rect x="500" y="50" width="380" height="95" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="690" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Circuit breaker</text>
  <text x="690" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">wraps every call, counts failures</text>
  <g filter="url(#m04-l05-breaker-in-action-soft)">
    <rect x="940" y="50" width="240" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1060" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Dependency</text>
  <text x="1060" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">already failing</text>

  <line x1="60" y1="1030" x2="96" y2="1030" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1037" font-size="20" fill="#475569">Call on the live request path</text>
  <line x1="60" y1="1070" x2="96" y2="1070" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1077" font-size="20" fill="#475569">Failure, or an instant rejection, returned to the caller</text>
  <circle cx="78" cy="1110" r="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <g stroke="#DC2626" stroke-width="2.5">
    <line x1="72" y1="1104" x2="84" y2="1116"/>
    <line x1="84" y1="1104" x2="72" y2="1116"/>
  </g>
  <text x="108" y="1117" font-size="20" fill="#475569">Blocked: the call never reaches the dependency</text>
</svg>