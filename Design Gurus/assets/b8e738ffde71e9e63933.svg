<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A topic split into three partitions: consumer group A processes them in parallel with one consumer per partition, while consumer group B reads all partitions with a single consumer">
  <rect x="0" y="0" width="1240" height="860" fill="#FFFFFF"/>
  <defs>
    <marker id="dm9-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="dm9-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="dm9-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="dm9-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M350,338 C380,338 380,215 415,215" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm9-amber)"/>
  <path d="M350,338 C380,338 380,335 415,335" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm9-amber)"/>
  <path d="M350,338 C380,338 380,455 415,455" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm9-amber)"/>
  <text x="380" y="290" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">writes</text>

  
  <path d="M735,215 C790,215 790,175 835,175" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#dm9-blue)"/>
  <path d="M735,335 C798,335 798,269 835,269" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#dm9-blue)"/>
  <path d="M735,455 C806,455 806,363 835,363" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#dm9-blue)"/>

  
  <path d="M735,215 C784,215 784,573 835,573" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#dm9-emerald)"/>
  <path d="M735,335 C792,335 792,573 835,573" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#dm9-emerald)"/>
  <path d="M735,455 C800,455 800,573 835,573" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#dm9-emerald)"/>

  
  <rect x="390" y="70" width="370" height="460" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="575" y="102" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Topic: orders</text>
  <text x="575" y="128" font-size="20" fill="#64748B" text-anchor="middle">split into 3 partitions</text>

  
  <g filter="url(#dm9-soft)">
    <rect x="415" y="170" width="320" height="90" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="415" y="290" width="320" height="90" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="415" y="410" width="320" height="90" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="575" y="206" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Partition 0</text>
  <text x="575" y="234" font-size="20" fill="#64748B" text-anchor="middle">append-only log</text>
  <text x="575" y="326" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Partition 1</text>
  <text x="575" y="354" font-size="20" fill="#64748B" text-anchor="middle">append-only log</text>
  <text x="575" y="446" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Partition 2</text>
  <text x="575" y="474" font-size="20" fill="#64748B" text-anchor="middle">append-only log</text>

  
  <g filter="url(#dm9-soft)">
    <rect x="50" y="300" width="300" height="76" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="332" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="200" y="360" font-size="20" fill="#64748B" text-anchor="middle">writes across partitions</text>

  
  <rect x="810" y="70" width="380" height="358" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1000" y="102" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Consumer group A (3 consumers)</text>
  <g filter="url(#dm9-soft)">
    <rect x="835" y="140" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="835" y="234" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="835" y="328" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1000" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer A1</text>
  <text x="1000" y="194" font-size="20" fill="#64748B" text-anchor="middle">owns partition 0</text>
  <text x="1000" y="262" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer A2</text>
  <text x="1000" y="288" font-size="20" fill="#64748B" text-anchor="middle">owns partition 1</text>
  <text x="1000" y="356" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer A3</text>
  <text x="1000" y="382" font-size="20" fill="#64748B" text-anchor="middle">owns partition 2</text>

  
  <rect x="810" y="468" width="380" height="170" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1000" y="500" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Consumer group B (1 consumer)</text>
  <g filter="url(#dm9-soft)">
    <rect x="835" y="538" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1000" y="566" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer B1</text>
  <text x="1000" y="592" font-size="20" fill="#64748B" text-anchor="middle">reads all 3 partitions</text>

  
  <line x1="137" y1="808" x2="165" y2="808" stroke="#D97706" stroke-width="3"/>
  <text x="175" y="814" font-size="20" fill="#475569">producer writes</text>
  <line x1="380" y1="808" x2="408" y2="808" stroke="#3B82F6" stroke-width="3"/>
  <text x="418" y="814" font-size="20" fill="#475569">group A consumes in parallel</text>
  <line x1="757" y1="808" x2="785" y2="808" stroke="#059669" stroke-width="3"/>
  <text x="795" y="814" font-size="20" fill="#475569">group B consumes its own copy</text>

  
  <rect x="245" y="688" width="750" height="80" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="720" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Each group receives every message.</text>
  <text x="620" y="747" font-size="20" fill="#64748B" text-anchor="middle">Inside a group, each message is processed by only one consumer.</text>
</svg>