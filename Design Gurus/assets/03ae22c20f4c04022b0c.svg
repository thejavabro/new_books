<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" style="background-color:#ffffff">
<defs>
<marker id="mtb" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
<marker id="mtd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="50" width="280" height="112" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="50" width="280" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="170" y="69" text-anchor="middle" font-weight="bold">DeploymentConfig  (originator)</text>
<text x="42" y="96">- replicas, image, env</text>
<text x="42" y="118">+ apply(replicas, image, env)</text>
<text x="42" y="138">+ save() : ConfigSnapshot</text>
<text x="42" y="156">+ restore(ConfigSnapshot)</text>

<rect x="380" y="50" width="240" height="90" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="380" y="50" width="240" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="500" y="69" text-anchor="middle" font-weight="bold">ConfigSnapshot  (memento)</text>
<text x="392" y="96">- replicas, image, env</text>
<text x="392" y="118" font-size="11" fill="#2f7a55">no public accessors for the</text>
<text x="392" y="134" font-size="11" fill="#2f7a55">caretaker to call</text>

<rect x="690" y="50" width="240" height="90" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="690" y="50" width="240" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="810" y="69" text-anchor="middle" font-weight="bold">DeploymentHistory</text>
<text x="702" y="96">- checkpoints : List&lt;Snapshot&gt;</text>
<text x="702" y="118">+ checkpoint(config), rollback(config)</text>

<path d="M 314 86 L 375 86" stroke="#000000" fill="none" marker-end="url(#mtb)"/>
<text x="316" y="44" font-size="10.5" fill="#414d60">creates and reads</text>

<path d="M 686 118 L 624 118" stroke="#000000" fill="none" marker-start="url(#mtd)"/>
<text x="634" y="158" font-size="10.5" fill="#414d60">holds many, opens none</text>

<path d="M 810 144 L 810 190 L 170 190 L 170 166" stroke="#000000" fill="none" marker-end="url(#mtb)"/>
<text x="420" y="184" font-size="11" fill="#414d60">calls save() and restore() on the originator</text>

<rect x="30" y="222" width="900" height="72" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="246" font-size="12.5" fill="#414d60">Three roles. The originator owns the state and is the only thing that can read a snapshot. The memento carries the state and offers</text>
<text x="52" y="268" font-size="12.5" fill="#414d60">nothing to anyone else. The caretaker decides WHEN to save and restore, and knows nothing about WHAT is being saved.</text>
<text x="52" y="288" font-size="12.5" fill="#414d60">Add a field to the config and the caretaker does not change. That is the encapsulation the pattern is protecting.</text>

<rect x="30" y="312" width="900" height="62" rx="6" fill="#f6ecd6" stroke="#8a5f10"/>
<text x="52" y="336" font-size="12.5" fill="#8a5f10">How the opacity is enforced varies by language: package-private in Java, a friend class in C++, a nested private class in C#.</text>
<text x="52" y="358" font-size="12.5" fill="#8a5f10">In Python and JavaScript it is a naming convention only, so there the guarantee is a code-review rule rather than a compiler one.</text>
</g>
</svg>