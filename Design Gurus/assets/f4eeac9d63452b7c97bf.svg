  <text x="239" y="70" font-size="20" font-weight="600" fill="#475569">Local counts, no lock</text>

  <g fill="none" stroke-width="2" stroke="#2563EB">
    <path d="M495,145 H623 Q635,145 635,157 V298 Q635,310 647,310 H835" marker-end="url(#l08lc-bl)"/>
    <path d="M495,255 H623 Q635,255 635,267 V298 Q635,310 647,310 H835" marker-end="url(#l08lc-bl)"/>
