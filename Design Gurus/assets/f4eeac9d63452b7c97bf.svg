  <text x="930" y="385" font-size="20" text-anchor="middle" fill="#6B7280">the lock is taken 4 times</text>
  <text x="405" y="550" font-size="20" text-anchor="middle" fill="#6B7280">each worker counts its own section</text>

  <rect x="40" y="610" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="655" text-anchor="middle" font-size="20" fill="#475569">Each worker counts alone, then takes the lock once, so the lock is taken 4 times instead of 4,000,000.</text>
