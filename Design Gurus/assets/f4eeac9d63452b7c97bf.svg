<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four workers each count their own section with no lock, then each adds its count once to the shared total, so the lock is taken 4 times">
