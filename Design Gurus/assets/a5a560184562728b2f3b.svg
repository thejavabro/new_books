<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="666" viewBox="0 0 1240 666" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A project sits above its task collection, which is created and listed through the nested path. One identified task then moves sideways to its canonical top-level member URL. A four-level nested path is rejected below, marked with a stop icon. The rule is one level for containment and the top level for identified members.">
  <defs>
    <marker id="xl04shallow-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="xl04shallow-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="xl04shallow-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl04shallow-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl04shallow-k1"><rect x="90" y="112" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="xl04shallow-k2"><rect x="480" y="112" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="xl04shallow-k3"><rect x="870" y="112" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="xl04shallow-k4"><rect x="270" y="368" width="700" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="666" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="248" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One level for containment, top level for identity</text>

  
  <g fill="none" stroke-width="2">
    <path d="M370,157 H480" stroke="#2563EB" marker-end="url(#xl04shallow-bl)"/>
    <path d="M760,157 H870" stroke="#059669" stroke-width="2.5" marker-end="url(#xl04shallow-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="425" y="145" fill="#1D4ED8">contains</text>
    <text x="812" y="145" fill="#047857">has own id</text>
  </g>

  
  <g filter="url(#xl04shallow-soft)">
    <rect x="90" y="112" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="90" y="112" width="6" height="90" fill="#2563EB" clip-path="url(#xl04shallow-k1)"/>
  </g>
  <circle cx="128" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="154" y="164" font-size="18.5" font-weight="600" fill="#111827">Project</text>
  <text x="230" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the parent resource</text>

  
  <g filter="url(#xl04shallow-soft)">
    <rect x="480" y="112" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="480" y="112" width="6" height="90" fill="#2563EB" clip-path="url(#xl04shallow-k2)"/>
  </g>
  <circle cx="518" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="544" y="164" font-size="18.5" font-weight="600" fill="#111827">Task collection</text>
  <text x="620" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">POST /projects/{project_id}/tasks</text>
  <text x="620" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">GET /projects/{project_id}/tasks</text>

  
  <g filter="url(#xl04shallow-lift)">
    <rect x="870" y="112" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="870" y="112" width="9" height="90" fill="#059669" clip-path="url(#xl04shallow-k3)"/>
  </g>
  <circle cx="908" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(897.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="934" y="164" font-size="18.5" font-weight="600" fill="#111827">Canonical member</text>
  <text x="1010" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">GET /tasks/{task_id}</text>

  
  <rect x="40" y="320" width="1160" height="196" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="350" font-size="16.5" font-weight="600" fill="#BE185D">A path nested four levels deep</text>

  <g filter="url(#xl04shallow-lift)">
    <rect x="270" y="368" width="700" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="270" y="368" width="9" height="90" fill="#DB2777" clip-path="url(#xl04shallow-k4)"/>
  </g>
  <circle cx="308" cy="413" r="18" fill="#FFFFFF"/>
  <g transform="translate(297.56,402.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="334" y="420" font-size="18.5" font-weight="600" fill="#111827">/organizations/org_1/projects/prj_2/tasks/tsk_3/comments/cmt_4</text>
  <text x="620" y="483" font-size="15.5" text-anchor="middle" fill="#6B7280">Too deep for this example. Clients need unnecessary parent IDs.</text>

  
  <rect x="40" y="548" width="1160" height="78" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="594" text-anchor="middle" font-size="16" fill="#475569">Prefer shallow nesting and one canonical member URL.</text>
</svg>