<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-label="An API gateway is a single entry point in front of many services. It authenticates, rate limits, routes and can cache, so each service behind it does not have to.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="520" fill="#FFFFFF"/>
  <rect x="60" y="53" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="180" y="88" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Client</text>
  <text x="180" y="113" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">makes one call</text>
  <line x1="180" y1="130" x2="180" y2="196" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <rect x="40" y="200" width="620" height="190" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="70" y="240" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">API Gateway</text>
  <text x="70" y="268" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">does the work every service would otherwise repeat</text>
  <rect x="70" y="288" width="157" height="38" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="148.5" y="313" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Authenticate</text>
  <rect x="237" y="288" width="136" height="38" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="305" y="313" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Rate limit</text>
  <rect x="383" y="288" width="84" height="38" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="425" y="313" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Route</text>
  <rect x="70" y="336" width="84" height="38" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="112" y="361" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Cache</text>
  <rect x="164" y="336" width="188" height="38" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="258" y="361" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reshape request</text>
  <rect x="362" y="336" width="198" height="38" rx="9" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="461" y="361" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reshape response</text>
  <rect x="860" y="79" width="300" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1010" y="125" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Order service</text>
  <path d="M660 295 C 780 295, 780 118, 856 118" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <rect x="860" y="226" width="300" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1010" y="272" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">User service</text>
  <path d="M660 295 C 780 295, 780 265, 856 265" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <rect x="860" y="373" width="300" height="78" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1010" y="419" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Search service</text>
  <path d="M660 295 C 780 295, 780 412, 856 412" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <rect x="40" y="414" width="620" height="74" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="442" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The client knows one address.</text>
  <text x="70" y="470" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">It never learns that there are three services behind it.</text>
</svg>