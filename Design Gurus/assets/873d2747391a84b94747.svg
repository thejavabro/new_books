<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four phases from left to right. Shadow and read stages: the old tables of the monolith are the source of truth and CDC copies changes to the new database; going back takes seconds by changing the flag, with no data lost. A city on the new service: the new service&#39;s database is the source of truth and a reverse sync copies changes back to the old tables; going back takes minutes: pause, wait for zero lag, then change the flag. Reverse sync stopped: no sync runs; going back takes days, because a new reverse sync must be built first. Old tables dropped: going back takes months, a new migration in the other direction. A dashed line between the first and second phases marks the rollback limit, the first write accepted by the new service.">
  <defs>
    <filter id="md04e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md04e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md04e-k1"><rect x="60" y="660" width="235" height="70" rx="12"/></clipPath>
    <clipPath id="md04e-k2"><rect x="355" y="660" width="235" height="70" rx="12"/></clipPath>
    <clipPath id="md04e-k3"><rect x="650" y="660" width="235" height="70" rx="12"/></clipPath>
    <clipPath id="md04e-k4"><rect x="945" y="660" width="235" height="70" rx="12"/></clipPath>
    <marker id="md04e-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="md04e-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="md04e-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Data movement and rollback limits</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Once the new service accepts its first write, going back needs a reverse sync.</text>

  <rect x="40" y="150" width="275" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="180" font-size="19.5" font-weight="600" fill="#475569">Shadow and reads</text>
  <rect x="335" y="150" width="275" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="359" y="180" font-size="19.5" font-weight="600" fill="#475569">City on new service</text>
  <rect x="630" y="150" width="275" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="654" y="180" font-size="19.5" font-weight="600" fill="#475569">Reverse sync stopped</text>
  <rect x="925" y="150" width="275" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="949" y="180" font-size="19.5" font-weight="600" fill="#475569">Old tables dropped</text>
  <rect x="955" y="244" width="215" height="106" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="979" y="274" font-size="19.5" font-weight="600" fill="#475569"></text>

  <g fill="none" stroke-width="2">
    <path d="M130,348.4 V425.6" stroke="#2563EB" marker-end="url(#md04e-m-blue)"/>
    <path d="M425,425.6 V348.4" stroke="#D97706" marker-end="url(#md04e-m-amber)"/>
    <path d="M325,128 V740" stroke="#DB2777" stroke-dasharray="7 6"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="144" y="393" fill="#1D4ED8" text-anchor="start">CDC</text>
    <text x="439" y="381" fill="#B45309" text-anchor="start">reverse</text>
    <text x="439" y="405" fill="#B45309" text-anchor="start">sync</text>
  </g>

  <g filter="url(#md04e-soft)">
    <rect x="60" y="660" width="235" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="60" y="660" width="6" height="70" fill="#059669" clip-path="url(#md04e-k1)"/>
  </g>
  <text x="80" y="702" font-size="21.5" font-weight="600" fill="#111827">Seconds</text>
  <text x="177.5" y="759" font-size="18.5" text-anchor="middle" fill="#6B7280">change the flag</text>
  <text x="177.5" y="786" font-size="18.5" text-anchor="middle" fill="#94A3B8">no data lost</text>
  <g filter="url(#md04e-soft)">
    <rect x="355" y="660" width="235" height="70" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="355" y="660" width="6" height="70" fill="#D97706" clip-path="url(#md04e-k2)"/>
  </g>
  <text x="375" y="702" font-size="21.5" font-weight="600" fill="#111827">Minutes</text>
  <text x="472.5" y="759" font-size="18.5" text-anchor="middle" fill="#6B7280">pause, wait for zero lag</text>
  <text x="472.5" y="786" font-size="18.5" text-anchor="middle" fill="#94A3B8">then change the flag</text>
  <g filter="url(#md04e-soft)">
    <rect x="650" y="660" width="235" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="650" y="660" width="6" height="70" fill="#DB2777" clip-path="url(#md04e-k3)"/>
  </g>
  <text x="670" y="702" font-size="21.5" font-weight="600" fill="#111827">Days</text>
  <text x="767.5" y="759" font-size="18.5" text-anchor="middle" fill="#6B7280">build a new reverse</text>
  <text x="767.5" y="786" font-size="18.5" text-anchor="middle" fill="#94A3B8">sync before going back</text>
  <g filter="url(#md04e-soft)">
    <rect x="945" y="660" width="235" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="945" y="660" width="6" height="70" fill="#DB2777" clip-path="url(#md04e-k4)"/>
  </g>
  <text x="965" y="702" font-size="21.5" font-weight="600" fill="#111827">Months</text>
  <text x="1062.5" y="759" font-size="18.5" text-anchor="middle" fill="#6B7280">a new migration in</text>
  <text x="1062.5" y="786" font-size="18.5" text-anchor="middle" fill="#94A3B8">the other direction</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M70,260 L70,334 A107.5,16 0 0 0 285,334 L285,260" fill="#DBEAFE"/>
    <ellipse cx="177.5" cy="260" rx="107.5" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="177.5" y="312" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Old tables</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M70,440 L70,514 A107.5,16 0 0 0 285,514 L285,440" fill="#EDE9FE"/>
    <ellipse cx="177.5" cy="440" rx="107.5" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="177.5" y="492" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">New database</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M365,260 L365,334 A107.5,16 0 0 0 580,334 L580,260" fill="#DBEAFE"/>
    <ellipse cx="472.5" cy="260" rx="107.5" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="472.5" y="312" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Old tables</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M365,440 L365,514 A107.5,16 0 0 0 580,514 L580,440" fill="#EDE9FE"/>
    <ellipse cx="472.5" cy="440" rx="107.5" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="472.5" y="492" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">New database</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M660,260 L660,334 A107.5,16 0 0 0 875,334 L875,260" fill="#DBEAFE"/>
    <ellipse cx="767.5" cy="260" rx="107.5" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="767.5" y="312" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Old tables</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M660,440 L660,514 A107.5,16 0 0 0 875,514 L875,440" fill="#EDE9FE"/>
    <ellipse cx="767.5" cy="440" rx="107.5" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="767.5" y="492" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">New database</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M955,440 L955,514 A107.5,16 0 0 0 1170,514 L1170,440" fill="#EDE9FE"/>
    <ellipse cx="1062.5" cy="440" rx="107.5" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1062.5" y="492" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">New database</text>
  <text x="177.5" y="226" font-size="18.5" font-weight="600" text-anchor="middle" fill="#334155">source of truth: monolith</text>
  <text x="472.5" y="564" font-size="18.5" font-weight="600" text-anchor="middle" fill="#334155">source of truth: new service</text>
  <text x="767.5" y="564" font-size="18.5" font-weight="600" text-anchor="middle" fill="#334155">source of truth: new service</text>
  <text x="767.5" y="397" font-size="18.5" text-anchor="middle" fill="#94A3B8">no sync</text>
  <text x="1062.5" y="290" font-size="18.5" font-weight="600" text-anchor="middle" fill="#94A3B8">Old tables</text>
  <text x="1062.5" y="316" font-size="18.5" text-anchor="middle" fill="#94A3B8">removed</text>
  <text x="1062.5" y="564" font-size="18.5" font-weight="600" text-anchor="middle" fill="#334155">source of truth: new service</text>
  <text x="1062.5" y="397" font-size="18.5" text-anchor="middle" fill="#94A3B8">no sync</text>
  <text x="338" y="132" font-size="18.5" font-weight="600" fill="#BE185D">Rollback limit: the first write accepted by the new service</text>
  <text x="40" y="632" font-size="18.5" font-weight="600" fill="#475569">How long going back takes</text>




</svg>