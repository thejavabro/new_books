<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Lambda architecture: the same events feed a fast, approximate stream path and an exact nightly batch path that replaces the fast numbers. Kappa architecture: an event log kept for a long time feeds one stream job, and history is processed again by replaying the log through a new version of the job.">
  <defs>
    <filter id="bvs4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bvs4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bvs4-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs4-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs4-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs4-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs4-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs4-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="bvs4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Using both: Lambda and Kappa architectures</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Two common ways to get fast answers and still process history again.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Lambda: two paths on the same events</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#1D4ED8">Kappa: one stream path, replayed when needed</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#bvs4-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#bvs4-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#bvs4-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#bvs4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#bvs4-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#bvs4-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Same events</text>
  <g filter="url(#bvs4-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#bvs4-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">Stream path</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">fast, approximate</text>
  <g filter="url(#bvs4-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#D97706" clip-path="url(#bvs4-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Batch path</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">nightly, exact, replaces</text>
  <g filter="url(#bvs4-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#bvs4-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">Event log</text>
  <text x="234" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">kept for a long time</text>
  <g filter="url(#bvs4-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#bvs4-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">One stream job</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">the only code path</text>
  <g filter="url(#bvs4-lift)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="836" y="430" width="9" height="90" fill="#059669" clip-path="url(#bvs4-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">Replay to redo</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">new job reads old events</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Lambda cost</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">the same logic is written and maintained twice</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Kappa needs</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">a log that keeps events for as long as you might recalculate</text>
</svg>