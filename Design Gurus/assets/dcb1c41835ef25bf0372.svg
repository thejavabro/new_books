<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A timeline. Leader A serves and sends heartbeats, then stops. After the election timeout the followers run an election, and leader B starts serving. No writes are accepted between the stop and the new leader, but reads from followers keep working.">
  <rect x="0" y="0" width="1240" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="lf3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lf3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lf3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lf3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lf3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lf3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="lf3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lf3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lf3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The gap between one leader and the next</text>
  <text x="620" y="72" font-size="19" fill="#64748B" text-anchor="middle">time runs from left to right</text>
  <circle cx="120" cy="122" r="7" fill="#059669"/>
  <circle cx="180" cy="122" r="7" fill="#059669"/>
  <circle cx="240" cy="122" r="7" fill="#059669"/>
  <circle cx="300" cy="122" r="7" fill="#059669"/>
  <circle cx="360" cy="122" r="7" fill="#059669"/>
  <text x="200" y="98" font-size="18" fill="#64748B" text-anchor="middle">heartbeats arriving</text>
  <path d="M394,114 L410,130 M410,114 L394,130" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="424" y="128" font-size="18" fill="#B91C1C" text-anchor="start">leader A stops</text>
  <rect x="80" y="142" width="320" height="62" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="240" y="180" font-size="19" font-weight="600" fill="#065F46" text-anchor="middle">leader A serving</text>
  <rect x="404" y="142" width="236" height="62" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="522" y="172" font-size="18" fill="#0F172A" text-anchor="middle">no heartbeat</text>
  <text x="522" y="196" font-size="18" font-weight="600" fill="#B45309" text-anchor="middle">election timeout</text>
  <rect x="644" y="142" width="216" height="62" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="752" y="172" font-size="18" fill="#0F172A" text-anchor="middle">candidates ask</text>
  <text x="752" y="196" font-size="18" font-weight="600" fill="#6D28D9" text-anchor="middle">for votes</text>
  <rect x="864" y="142" width="316" height="62" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="1022" y="180" font-size="19" font-weight="600" fill="#065F46" text-anchor="middle">leader B serving</text>
  <rect x="404" y="232" width="456" height="56" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="632" y="266" font-size="19" font-weight="600" fill="#B91C1C" text-anchor="middle">no writes are accepted</text>
  <rect x="80" y="304" width="1100" height="56" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="630" y="338" font-size="19" fill="#64748B" text-anchor="middle">reads from the followers keep working, with data that is a little old</text>
  <text x="620" y="404" font-size="19" fill="#64748B" text-anchor="middle">The gap is usually a few seconds. A short timeout also fires when the network is only slow.</text>
</svg>