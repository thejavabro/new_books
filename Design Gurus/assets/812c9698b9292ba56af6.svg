  <text x="460" y="330" font-size="15.5" fill="#374151">cost control through model routing</text>
  <circle cx="794" cy="325" r="4" fill="#4F46E5"/>
  <text x="808" y="330" font-size="15.5" fill="#374151">guardrails around the refund action</text>
