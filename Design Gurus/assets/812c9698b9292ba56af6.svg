  <text x="112" y="484" font-size="15.5" fill="#374151">text chat in English</text>
  <circle cx="98" cy="505" r="4" fill="#059669"/>
  <text x="112" y="510" font-size="15.5" fill="#374151">tier-1 tickets</text>
  <circle cx="98" cy="531" r="4" fill="#059669"/>
  <text x="112" y="536" font-size="15.5" fill="#374151">refunds up to $10</text>
