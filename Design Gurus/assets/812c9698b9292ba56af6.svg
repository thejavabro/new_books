  <text x="864" y="443" font-size="18.5" font-weight="600" fill="#111827">Numbers (illustrative)</text>
  <circle cx="838" cy="479" r="4" fill="#D97706"/>
  <text x="852" y="484" font-size="15.5" fill="#374151">40,000 conversations a day</text>
  <circle cx="838" cy="505" r="4" fill="#D97706"/>
  <text x="852" y="510" font-size="15.5" fill="#374151">50 percent of tier-1 resolved</text>
  <circle cx="838" cy="531" r="4" fill="#D97706"/>
  <text x="852" y="536" font-size="15.5" fill="#374151">satisfaction no worse than people</text>
