  <circle cx="468" cy="505" r="4" fill="#64748B"/>
  <text x="482" y="510" font-size="15.5" fill="#374151">other languages</text>
  <circle cx="468" cy="531" r="4" fill="#64748B"/>
  <text x="482" y="536" font-size="15.5" fill="#374151">refunds above $10 go to a person</text>
