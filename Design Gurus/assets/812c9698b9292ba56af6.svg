  <text x="112" y="154" font-size="15.5" fill="#374151">support cost is a known pain</text>
  <circle cx="98" cy="175" r="4" fill="#7C3AED"/>
  <text x="112" y="180" font-size="15.5" fill="#374151">the knowledge it needs is internal</text>
