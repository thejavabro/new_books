  <text x="852" y="562" font-size="15.5" fill="#374151">first token in about 1 second</text>
  <circle cx="838" cy="583" r="4" fill="#D97706"/>
  <text x="852" y="588" font-size="15.5" fill="#374151">short answer in about 5 seconds</text>
