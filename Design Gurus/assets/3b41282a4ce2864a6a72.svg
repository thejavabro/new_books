<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Synchronous: the caller blocks until the answer returns. Asynchronous: the caller hands the work to a queue and continues immediately">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="mc3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="mc3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="mc3-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="mc3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="530" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Synchronous: the caller waits</text>

  <rect x="640" y="76" width="580" height="530" rx="14" fill="#FFFBEB" fill-opacity="0.35" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Asynchronous: the caller carries on</text>

  
  <g filter="url(#mc3-soft)">
    <rect x="50" y="110" width="200" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="370" y="110" width="200" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Caller</text>
  <text x="470" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Service</text>
  <line x1="150" y1="174" x2="150" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="470" y1="174" x2="470" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <rect x="132" y="230" width="36" height="180" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="122" y="310" font-size="20" font-weight="600" fill="#991B1B" text-anchor="end">blocked</text>
  <text x="122" y="340" font-size="20" fill="#991B1B" text-anchor="end">the whole</text>
  <text x="122" y="370" font-size="20" fill="#991B1B" text-anchor="end">time</text>

  <line x1="170" y1="240" x2="460" y2="240" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc3-blue)"/>
  <text x="315" y="216" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. request</text>

  <rect x="380" y="270" width="180" height="70" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="470" y="313" font-size="20" fill="#334155" text-anchor="middle">2. does the work</text>

  <line x1="460" y1="400" x2="172" y2="400" stroke="#059669" stroke-width="2" marker-end="url(#mc3-emerald)"/>
  <text x="315" y="376" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. response</text>

  <text x="310" y="466" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">4. the caller continues</text>
  <text x="310" y="536" font-size="20" fill="#64748B" text-anchor="middle">Simple, immediate answer.</text>
  <text x="310" y="566" font-size="20" fill="#64748B" text-anchor="middle">If the service is slow, the caller is slow.</text>

  
  <g filter="url(#mc3-soft)">
    <rect x="670" y="110" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="870" y="110" width="160" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="1050" y="110" width="150" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="760" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Caller</text>
  <text x="950" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Queue</text>
  <text x="1125" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Worker</text>
  <line x1="760" y1="174" x2="760" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="950" y1="174" x2="950" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1125" y1="174" x2="1125" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <line x1="770" y1="240" x2="940" y2="240" stroke="#D97706" stroke-width="2" marker-end="url(#mc3-amber)"/>
  <text x="855" y="216" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. hand off</text>

  <line x1="940" y1="286" x2="772" y2="286" stroke="#059669" stroke-width="2" marker-end="url(#mc3-emerald)"/>
  <text x="855" y="322" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. accepted</text>

  <rect x="672" y="340" width="176" height="70" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="760" y="370" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">3. free now</text>
  <text x="760" y="398" font-size="20" fill="#065F46" text-anchor="middle">serves the next</text>

  <line x1="960" y1="440" x2="1115" y2="440" stroke="#D97706" stroke-width="2" marker-end="url(#mc3-amber)"/>
  <text x="1040" y="416" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. later</text>

  <text x="930" y="536" font-size="20" fill="#64748B" text-anchor="middle">No waiting, spikes are absorbed.</text>
  <text x="930" y="566" font-size="20" fill="#64748B" text-anchor="middle">The result must arrive some other way.</text>

  
  <text x="620" y="662" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Ask one question per hop: does the caller need this answer before it can continue?</text>
</svg>