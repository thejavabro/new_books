<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Batch processing: records collect all day, a job runs over the whole set at 2 AM, and the report is ready by morning with hours-old data. Stream processing: each record is processed as it arrives by a job that never stops, and the answer is ready in seconds.">
  <defs>
    <filter id="bvs1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bvs1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bvs1-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs1-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs1-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs1-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs1-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs1-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="bvs1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The same records, processed two ways</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The deciding question: how stale can the answer be?</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#B45309">Batch: collect first, then process on a schedule</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#1D4ED8">Stream: process each record as it arrives</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#bvs1-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#bvs1-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#bvs1-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#bvs1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#bvs1-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#bvs1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Records collect</text>
  <text x="234" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">all day long</text>
  <g filter="url(#bvs1-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#D97706" clip-path="url(#bvs1-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">Job runs at 2 AM</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">over the whole set</text>
  <g filter="url(#bvs1-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#D97706" clip-path="url(#bvs1-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Report by morning</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">the data is hours old</text>
  <g filter="url(#bvs1-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#bvs1-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">A record arrives</text>
  <text x="234" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">one at a time</text>
  <g filter="url(#bvs1-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#bvs1-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Processed now</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">the job never stops</text>
  <g filter="url(#bvs1-lift)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="836" y="430" width="9" height="90" fill="#059669" clip-path="url(#bvs1-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">Answer in seconds</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">like fraud detection</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Batch</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">bounded input: cheap, simple, and easy to run again</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Stream</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">unbounded input: fresh answers, with more complexity and cost</text>
</svg>