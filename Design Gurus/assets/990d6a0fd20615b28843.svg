<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same business action twice: one ACID transaction inside a monolith versus a saga of local transactions across microservices with compensating undo steps">
  <defs>
    <marker id="m01-l03-acid-vs-saga-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m01-l03-acid-vs-saga-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m01-l03-acid-vs-saga-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m01-l03-acid-vs-saga-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>

  
  <rect x="50" y="40" width="1140" height="230" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="78" font-size="20" font-weight="600" fill="#065F46">Monolith: one ACID transaction</text>
  <text x="1168" y="78" text-anchor="end" font-size="20" fill="#64748B">in-process calls, one database</text>

  <rect x="50" y="310" width="1140" height="230" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="72" y="348" font-size="20" font-weight="600" fill="#1E3A8A">Microservices: a saga</text>
  <text x="1168" y="348" text-anchor="end" font-size="20" fill="#64748B">a chain of local transactions with undo steps</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M186,180 L224,180" stroke="#475569" marker-end="url(#m01-l03-acid-vs-saga-sl)"/>
    <path d="M399,180 L437,180" stroke="#475569" marker-end="url(#m01-l03-acid-vs-saga-sl)"/>
    <path d="M632,180 L670,180" stroke="#475569" marker-end="url(#m01-l03-acid-vs-saga-sl)"/>
    <path d="M920,180 L958,180" stroke="#475569" marker-end="url(#m01-l03-acid-vs-saga-sl)"/>
    <path d="M266,450 L338,450" stroke="#3B82F6" marker-end="url(#m01-l03-acid-vs-saga-bl)"/>
    <path d="M548,450 L620,450" stroke="#3B82F6" marker-end="url(#m01-l03-acid-vs-saga-bl)"/>
    <path d="M850,450 L922,450" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#m01-l03-acid-vs-saga-rd)"/>
  </g>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="302" y="388" fill="#1E40AF">network call</text>
    <text x="584" y="388" fill="#1E40AF">network call</text>
  </g>

  
  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="76" y="130" width="110" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="131" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">BEGIN</text>

  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="224" y="130" width="175" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="312" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Create order</text>

  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="437" y="130" width="195" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="535" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Charge payment</text>

  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="670" y="130" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="795" y="187" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Decrement inventory</text>

  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="958" y="130" width="205" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1061" y="172" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">COMMIT</text>
  <text x="1061" y="202" text-anchor="middle" font-size="20" fill="#64748B">(all or nothing)</text>

  
  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="76" y="400" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="171" y="457" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order service</text>

  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="338" y="400" width="210" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="443" y="457" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment service</text>

  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="620" y="400" width="230" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="735" y="457" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory service</text>

  <g filter="url(#m01-l03-acid-vs-saga-soft)">
    <rect x="922" y="400" width="240" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1042" y="442" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Undo steps run</text>
  <text x="1042" y="472" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">if any part fails</text>

  
  <g stroke-width="4">
    <line x1="50" y1="578" x2="84" y2="578" stroke="#475569"/>
    <line x1="640" y1="578" x2="674" y2="578" stroke="#3B82F6"/>
    <line x1="50" y1="618" x2="84" y2="618" stroke="#DC2626" stroke-dasharray="6 5"/>
  </g>
  <text x="94" y="585" font-size="20" fill="#475569">In-process call: nanoseconds, cannot half-succeed</text>
  <text x="684" y="585" font-size="20" fill="#475569">Network call between services</text>
  <text x="94" y="625" font-size="20" fill="#475569">Failure path: the compensating (undo) steps</text>
</svg>