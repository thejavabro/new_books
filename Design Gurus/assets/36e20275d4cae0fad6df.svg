<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The number 8 in binary">
<defs>
<filter id="cm-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is 8 with every one of its bits flipped?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">8 is 1000 in binary, so the answer is 0111</text>
<rect x="40" y="106" width="1160" height="478" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Flipping bits one at a time would work, but XOR can do the whole number at once</text>
<text x="492" y="226" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">8 in binary</text>
<rect x="514" y="186" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="545" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="584" y="186" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="615" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="654" y="186" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="685" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="724" y="186" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="755" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="812" y="226" font-size="21.5" font-weight="600" fill="#1D4ED8">= 8</text>
<text x="492" y="318" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">wanted</text>
<rect x="514" y="278" width="62" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="545" y="315.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">0</text>
<rect x="584" y="278" width="62" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="615" y="315.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<rect x="654" y="278" width="62" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="685" y="315.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<rect x="724" y="278" width="62" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="755" y="315.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="812" y="318" font-size="18" fill="#475569">every bit the other way round</text>
<text x="492" y="410" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569"></text>
<text x="620" y="410" text-anchor="middle" font-size="18" fill="#475569">only the 4 bits 8 actually uses are flipped, not the leading zeros above them</text>
<text x="492" y="502" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569"></text>
<text x="620" y="502" text-anchor="middle" font-size="18" fill="#475569">so the first job is to work out how many bits that is</text>
<rect x="40" y="606" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="646" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A bit XOR 1 always flips, and a bit XOR 0 never does</text>
<text x="620" y="678" text-anchor="middle" font-size="18.5" fill="#475569">So XORing with a number of all ones flips exactly the bits covered by those ones</text>
</svg>