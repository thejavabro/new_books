    <circle cx="425" cy="262" r="5"/>
    <circle cx="270" cy="120" r="5"/>
    <circle cx="300" cy="235" r="5"/>
    <circle cx="285" cy="345" r="5"/>
    <circle cx="475" cy="150" r="5"/>
    <circle cx="515" cy="260" r="5"/>
