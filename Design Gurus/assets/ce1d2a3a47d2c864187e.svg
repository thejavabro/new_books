<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A map divided into fixed-size grid squares, where a search reads the user&#39;s grid and its eight neighboring grids.">
  <defs>
    <marker id="yp02-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="670" fill="#FFFFFF"/>

  
  <rect x="120" y="70" width="550" height="440" fill="#EFF6FF"/>

  
  <g fill="#E1EDFD">
    <rect x="230" y="70" width="110" height="110"/>
    <rect x="340" y="70" width="110" height="110"/>
    <rect x="450" y="70" width="110" height="110"/>
