  </g>
  <rect x="120" y="70" width="550" height="440" fill="none" stroke="#64748B" stroke-width="1.5"/>
  
  <rect x="340" y="180" width="110" height="110" fill="none" stroke="#2563EB" stroke-width="2"/>

  
  <text x="175" y="462" text-anchor="middle" font-size="15.5" fill="#475569">GridID 27</text>

  
  <g fill="#059669" stroke="#FFFFFF" stroke-width="1.5">
