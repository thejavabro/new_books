  <path d="M395,258 c-7,-9 -11,-16 -11,-22 a11,11 0 1 1 22,0 c0,6 -4,13 -11,22 z" fill="#2563EB"/>
  <circle cx="395" cy="236" r="4.5" fill="#FFFFFF"/>

  
  <g font-size="15.5" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="395" y="280" font-weight="600" fill="#1D4ED8">user</text>
    <text x="605" y="453" fill="#6B7280">places</text>
  </g>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
