  <g font-size="15.5" font-weight="600" text-anchor="middle" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="945" y="230">a search reads the user's grid</text>
    <text x="945" y="254">and its eight neighbors</text>
  </g>

  
  <rect x="40" y="555" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="600" text-anchor="middle" font-size="16" fill="#475569">Grid edge = search radius, so any search touches at most nine grids, found with plain arithmetic.</text>
