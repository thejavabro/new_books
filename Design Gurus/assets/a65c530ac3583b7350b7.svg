<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A cursor issued for status confirmed sorted by created_at descending is valid only for the same query. Reusing it with a different filter or a different sort returns 400 cursor_query_mismatch, because the token cannot describe a boundary in another result set.">
  <defs>
    <marker id="xl09cursoro-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="xl09cursoro-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="xl09cursoro-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl09cursoro-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl09cursoro-k1"><rect x="70" y="196" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="xl09cursoro-k2"><rect x="70" y="374" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="xl09cursoro-k3"><rect x="700" y="118" width="480" height="90" rx="12"/></clipPath>
    <clipPath id="xl09cursoro-k4"><rect x="700" y="298" width="480" height="90" rx="12"/></clipPath>
    <clipPath id="xl09cursoro-k5"><rect x="700" y="478" width="480" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="770" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="606" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One cursor belongs to one query</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">the query is the filter plus the sort</text>

  
  <g fill="none" stroke-width="2">
    <path d="M410,393 H533 Q545,393 545,381 V175 Q545,163 557,163 H700" stroke="#059669" stroke-width="2.5" marker-end="url(#xl09cursoro-em)"/>
    <path d="M410,419 H548 Q560,419 560,407 V355 Q560,343 572,343 H700" stroke="#DB2777" marker-end="url(#xl09cursoro-pm)"/>
    <path d="M410,439 H563 Q575,439 575,451 V511 Q575,523 587,523 H700" stroke="#DB2777" marker-end="url(#xl09cursoro-pm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="628" y="152" fill="#047857">same query</text>
    <text x="628" y="331" fill="#BE185D">different filter</text>
    <text x="634" y="511" fill="#BE185D">different sort</text>
  </g>

  
  <g filter="url(#xl09cursoro-soft)">
    <rect x="70" y="196" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="196" width="6" height="90" fill="#2563EB" clip-path="url(#xl09cursoro-k1)"/>
  </g>
  <circle cx="108" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,230.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="134" y="248" font-size="18.5" font-weight="600" fill="#111827">First request</text>
  <text x="240" y="311" font-size="15.5" text-anchor="middle" fill="#6B7280">status=confirmed</text>
  <text x="240" y="334" font-size="15.5" text-anchor="middle" fill="#94A3B8">sort=-created_at</text>

  
  <g filter="url(#xl09cursoro-lift)">
    <rect x="70" y="374" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="70" y="374" width="9" height="90" fill="#2563EB" clip-path="url(#xl09cursoro-k2)"/>
  </g>
  <circle cx="108" cy="419" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,408.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="134" y="426" font-size="18.5" font-weight="600" fill="#111827">next_cursor</text>
  <text x="240" y="489" font-size="15.5" text-anchor="middle" fill="#6B7280">issued for that exact query</text>

  
  <g filter="url(#xl09cursoro-soft)">
    <rect x="700" y="118" width="480" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="700" y="118" width="6" height="90" fill="#059669" clip-path="url(#xl09cursoro-k3)"/>
  </g>
  <circle cx="738" cy="163" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,152.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="764" y="170" font-size="18.5" font-weight="600" fill="#111827">Same query, next page</text>
  <text x="940" y="233" font-size="15.5" text-anchor="middle" fill="#6B7280">Valid</text>
  <text x="940" y="256" font-size="15.5" text-anchor="middle" fill="#94A3B8">the boundary still points into the same result set</text>

  
  <g filter="url(#xl09cursoro-soft)">
    <rect x="700" y="298" width="480" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="700" y="298" width="6" height="90" fill="#DB2777" clip-path="url(#xl09cursoro-k4)"/>
  </g>
  <circle cx="738" cy="343" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,332.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="764" y="350" font-size="18.5" font-weight="600" fill="#111827">status=cancelled</text>
  <text x="940" y="413" font-size="15.5" text-anchor="middle" fill="#6B7280">400 cursor_query_mismatch</text>
  <text x="940" y="436" font-size="15.5" text-anchor="middle" fill="#94A3B8">a different filter is a different result set</text>

  
  <g filter="url(#xl09cursoro-soft)">
    <rect x="700" y="478" width="480" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="700" y="478" width="6" height="90" fill="#DB2777" clip-path="url(#xl09cursoro-k5)"/>
  </g>
  <circle cx="738" cy="523" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,512.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="764" y="530" font-size="18.5" font-weight="600" fill="#111827">sort=total_amount</text>
  <text x="940" y="593" font-size="15.5" text-anchor="middle" fill="#6B7280">400 cursor_query_mismatch</text>
  <text x="940" y="616" font-size="15.5" text-anchor="middle" fill="#94A3B8">a different sort is a different result set</text>

  
  <rect x="40" y="670" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="715" text-anchor="middle" font-size="16" fill="#475569">Repeat the same filters and sort with the cursor you were given.</text>
</svg>