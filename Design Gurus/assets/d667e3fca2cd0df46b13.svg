<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three junior answer shapes, a benefit with no cost, a mechanism with no consequence, and a slogan instead of a judgment, all converge on one repair, attach the cost, consequence, or evidence, which lands in the sentence X because Y, costs Z, watch for W.">
  <defs>
    <marker id="m08-l02-red-flag-fixes-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m08-l02-red-flag-fixes-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m08-l02-red-flag-fixes-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1030" fill="#FFFFFF"/>

  <rect x="40" y="140" width="470" height="560" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="182" font-size="20" font-weight="600" fill="#B91C1C">Three junior shapes</text>
  <g filter="url(#m08-l02-red-flag-fixes-soft)">
    <rect x="60" y="200" width="420" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="270" y="267" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A benefit with no cost</text>
  <g filter="url(#m08-l02-red-flag-fixes-soft)">
    <rect x="60" y="360" width="420" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="270" y="411" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A mechanism with</text>
  <text x="270" y="443" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">no consequence</text>
  <g filter="url(#m08-l02-red-flag-fixes-soft)">
    <rect x="60" y="520" width="420" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="270" y="571" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A slogan instead</text>
  <text x="270" y="603" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">of a judgment</text>

  <text x="580" y="182" font-size="20" font-weight="600" fill="#065F46">The same move repairs all three</text>
  <g filter="url(#m08-l02-red-flag-fixes-soft)">
    <rect x="580" y="360" width="300" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="730" y="405" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Attach the cost,</text>
  <text x="730" y="437" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">consequence,</text>
  <text x="730" y="469" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">or evidence</text>
  <g filter="url(#m08-l02-red-flag-fixes-soft)">
    <rect x="920" y="360" width="280" height="140" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1060" y="405" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">X because Y,</text>
  <text x="1060" y="437" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">costs Z,</text>
  <text x="1060" y="469" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">watch for W</text>

  <g fill="none" stroke-width="2.5">
    <path d="M480,260 C540,260 520,400 572,400" stroke="#DC2626" stroke-width="2" marker-end="url(#m08-l02-red-flag-fixes-rd)"/>
    <path d="M480,420 L572,430" stroke="#DC2626" stroke-width="2" marker-end="url(#m08-l02-red-flag-fixes-rd)"/>
    <path d="M480,580 C540,580 520,460 572,460" stroke="#DC2626" stroke-width="2" marker-end="url(#m08-l02-red-flag-fixes-rd)"/>
    <path d="M880,430 L912,430" stroke="#059669" marker-end="url(#m08-l02-red-flag-fixes-em)"/>
    <path d="M600,800 L652,800" stroke="#059669" marker-end="url(#m08-l02-red-flag-fixes-em)"/>
  </g>

  <text x="896" y="336" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">it lands in one sentence</text>

  <g filter="url(#m08-l02-red-flag-fixes-soft)">
    <rect x="60" y="740" width="540" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="330" y="812" text-anchor="middle" font-size="20" fill="#B91C1C">We use Kafka for decoupling.</text>
  <g filter="url(#m08-l02-red-flag-fixes-soft)">
    <rect x="660" y="740" width="520" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="920" y="780" text-anchor="middle" font-size="20" fill="#065F46">We use Kafka so a slow consumer</text>
  <text x="920" y="812" text-anchor="middle" font-size="20" fill="#065F46">cannot stall checkout, and we pay</text>
  <text x="920" y="844" text-anchor="middle" font-size="20" fill="#065F46">for it in ordering and replay work.</text>

  <line x1="60" y1="930" x2="96" y2="930" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="937" font-size="20" fill="#475569">The junior shape: a benefit, a mechanism, or a slogan with nothing attached</text>
  <line x1="60" y1="970" x2="96" y2="970" stroke="#059669" stroke-width="4"/>
  <text x="108" y="977" font-size="20" fill="#475569">The repair: the cost, the consequence, or the evidence, in one sentence</text>
</svg>