<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="822" viewBox="0 0 1240 822" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sequence-title sequence-desc">
<title id="sequence-title">The recovery sequence</title>
<desc id="sequence-desc">Five steps taking about ninety seconds, where scoping the damage is the one that saves the time and shows the judgment.</desc>
<defs>
<marker id="sequence-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sequence-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sequence-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sequence-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="822" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The recovery sequence</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Five steps, and the whole thing takes about ninety seconds.</text>
<rect x="40" y="744" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="744" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say it, plainly and without apology</text>
<path d="M566 146H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 146H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="610" y="118" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"I want to revisit something."</text>
<circle cx="60" cy="214" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="470" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name the specific failure</text>
<path d="M566 214H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 214H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="610" y="186" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="207.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">vagueness reads as having been caught</text><text x="630" y="232.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than having noticed</text>
<circle cx="60" cy="282" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="470" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scope how much is affected</text>
<path d="M566 282H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 282H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="610" y="254" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the step that matters most and is most often skipped</text>
<circle cx="60" cy="350" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="470" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Give the fix</text>
<path d="M566 350H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 350H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="610" y="322" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the option, what it costs, the alternative</text>
<circle cx="60" cy="418" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="425" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="390" width="470" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Carry on from there</text>
<path d="M566 418H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 418H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sequence-marker-slate)"/>
<rect x="610" y="390" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="411.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">do not re-derive what still holds,</text><text x="630" y="436.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">or keep returning to the error</text>
<rect x="40" y="476" width="420" height="128" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 476H46A6 6 0 0 0 40 482V598A6 6 0 0 0 46 604H54Z" fill="#F28B9D"/><text x="70" y="512" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">weaker</text>
<text x="70" y="542" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"I think I need to rethink this"</text>
<rect x="480" y="476" width="720" height="128" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M494 476H486A6 6 0 0 0 480 482V598A6 6 0 0 0 486 604H494Z" fill="#39D5AA"/><text x="510" y="512" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">stronger</text>
<text x="510" y="542" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"this affects the read path and the partition key. The write path,</text><text x="510" y="568" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the queue and the data model are unchanged. I need to change one</text><text x="510" y="594" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">decision and the rest stands"</text>
<rect x="40" y="634" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="634" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="667.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">This is a design review finding, not a confession.</text><text x="64" y="696.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The tone should match.</text>
<text x="66" y="778" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Blast-radius thinking, applied to your own work.</text>
</svg>