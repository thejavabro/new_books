<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="528" viewBox="0 0 1240 528" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The offline and online planes joined by exactly two artifacts">
  <defs>
    <marker id="m2l1a-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m2l1a-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m2l1a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l1a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m2l1a-k1"><rect x="157.5" y="116" width="235" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1a-k2"><rect x="853" y="116" width="224" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="528" fill="#FFFFFF"/>
  <rect x="40" y="56" width="470" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline plane</text>
  <rect x="730" y="56" width="470" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="754" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Online plane</text>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M510,146 H730" marker-end="url(#m2l1a-mviolet)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M730,196 H510" marker-end="url(#m2l1a-memerald)"/></g>
  <g filter="url(#m2l1a-soft)">
    <rect x="157.5" y="116" width="235" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="157.5" y="116" width="6" height="90" fill="#D97706" clip-path="url(#m2l1a-k1)"/>
  </g>
  <circle cx="195.5" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(185.06,150.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="221.5" y="168" font-size="18.5" font-weight="600" fill="#111827">Training system</text>
  <text x="275" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">scheduled, throughput first</text>
  <text x="275" y="254" font-size="15.5" text-anchor="middle" fill="#94A3B8">checkpoint and resume if interrupted</text>
  <g filter="url(#m2l1a-lift)">
    <rect x="853" y="116" width="224" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="853" y="116" width="9" height="90" fill="#2563EB" clip-path="url(#m2l1a-k2)"/>
  </g>
  <circle cx="891" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(880.56,150.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="917" y="168" font-size="18.5" font-weight="600" fill="#111827">Serving system</text>
  <text x="965" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">per request, latency first</text>
  <text x="965" y="254" font-size="15.5" text-anchor="middle" fill="#94A3B8">must stay up, always on</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="132" fill="#5B21B6">the model file</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="224" fill="#047857">predictions and outcomes</text></g>
  <rect x="40" y="346" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="380" font-size="16" fill="#475569">Show model and feedback flows; schemas and configuration may also be shared.</text>
  <rect x="64" y="406" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="428" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Soft failure</text>
  <text x="288" y="428" font-size="15.5" fill="#475569">the previous model may remain usable while training is repaired</text>
  <rect x="64" y="450" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="472" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Hard failure</text>
  <text x="288" y="472" font-size="15.5" fill="#475569">a user is waiting, so the error is visible right now</text>
</svg>