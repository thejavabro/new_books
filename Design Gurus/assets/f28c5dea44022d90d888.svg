<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the most that can be taken without robbing two houses in a row?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Each cell below will hold the best possible total using only the houses up to it</text>
