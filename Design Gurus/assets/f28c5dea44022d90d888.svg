<text x="620" y="474" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">At each house there are only two things you can do, so each cell compares only two numbers</text>
<rect x="40" y="570" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="610" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Rob this house and skip the one before, or skip this house</text>
<text x="620" y="642" text-anchor="middle" font-size="18.5" fill="#475569">Every route through the street is one of those two choices repeated</text>
