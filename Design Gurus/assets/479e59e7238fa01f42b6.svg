  <text x="390" y="422" font-size="15.5" fill="#374151">checks the tier and</text>
  <text x="390" y="444" font-size="15.5" fill="#374151">routes the request</text>
  <circle cx="371" cy="474.5" r="10" fill="#7C3AED"/>
  <text x="371" y="479" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
