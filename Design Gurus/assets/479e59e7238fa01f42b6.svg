  <text x="390" y="328" font-size="15.5" fill="#374151">validates the request</text>
  <text x="390" y="350" font-size="15.5" fill="#374151">against the schema</text>
  <circle cx="371" cy="380.5" r="10" fill="#7C3AED"/>
  <text x="371" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="390" y="386" font-size="15.5" fill="#374151">checks the request against policy</text>
  <circle cx="371" cy="416.5" r="10" fill="#7C3AED"/>
