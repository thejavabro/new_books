<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the smallest largest step on any route from start to finish?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The cost of a route is its single worst step, not the total of its steps</text>
