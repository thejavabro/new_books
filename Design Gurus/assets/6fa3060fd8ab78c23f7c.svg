<text x="620" y="622" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">12 steps in all, and the cheapest 4 of them cost 1</text>
<rect x="40" y="658" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="698" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Add the cheapest steps first, and watch for the moment the corners join up</text>
<text x="620" y="730" text-anchor="middle" font-size="18.5" fill="#475569">The step that joins them is the worst step on the best route, so it is the answer</text>
