<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Entities: core business rules and domain models, such as Order with _order_id, _customer_id, _status and _line_items and the methods add_item, confirm and cancel; they represent real-world business concepts, contain business rules and invariants, and are independent of any framework or technology. Use Cases: application-specific business logic and orchestration, such as CreateOrderUseCase, which takes a CreateOrderInput dataclass, checks inventory, reserves inventory, charges payment, confirms the order, sends a notification and publishes an event, calling the InventoryRepository and PaymentGateway interfaces; use cases coordinate one business operation, use entities and domain rules, and define interfaces for external dependencies">
