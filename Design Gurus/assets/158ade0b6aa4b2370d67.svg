<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="fixes-title fixes-desc">
<title id="fixes-title">Three repairs that do not work</title>
<desc id="fixes-desc">Publishing first inverts the failure, retrying narrows the window without closing it, and two-phase commit is unavailable with Kafka and operationally hostile where it does exist. All three try to make two systems agree.</desc>
<defs>
<marker id="fixes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="fixes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="fixes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="fixes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="668" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three repairs that do not work</text>
<text x="40" y="86" font-size="21" fill="#4A5568">All three try to make two systems agree.</text>
<rect x="40" y="590" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="590" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="168" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="175" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="400" height="100" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="290" y="174" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Publish first, then write</text>
<path d="M496 168H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 168H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fixes-marker-slate)"/>
<rect x="540" y="118" width="660" height="100" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="149" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Inverts the failure rather than removing it, and makes it worse.</text><text x="560" y="174" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Consumers act on something that does not exist,</text><text x="560" y="199" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with no record to reconcile against.</text>
<circle cx="60" cy="284" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="291" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="234" width="400" height="100" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="290" y="290" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Retry the publish</text>
<path d="M496 284H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 284H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fixes-marker-slate)"/>
<rect x="540" y="234" width="660" height="100" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="265" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Narrows the window without closing it. The retry loop runs in a</text><text x="560" y="290" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">process, and a deploy or an out-of-memory kill lands in the gap.</text><text x="560" y="315" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A finally block does not survive the process ending.</text>
<circle cx="60" cy="400" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="407" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="350" width="400" height="100" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="290" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Two-phase commit</text>
<path d="M496 400H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 400H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fixes-marker-slate)"/>
<rect x="540" y="350" width="660" height="100" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="381" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Kafka does not participate in XA. Where 2PC exists it blocks:</text><text x="560" y="406" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a coordinator failure during prepare leaves participants</text><text x="560" y="431" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">holding locks, in your request path.</text>
<rect x="40" y="474" width="1160" height="90" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="474" width="5" height="90" rx="2.5" fill="#39D5AA"/><text x="64" y="510.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What all three share is an attempt to make two systems agree.</text><text x="64" y="539.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">The fix is to stop needing them to.</text>
<text x="66" y="624" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Every team rediscovers these three, in roughly this order.</text>
</svg>