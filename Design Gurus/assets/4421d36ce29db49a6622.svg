<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flow after a queue message fails. First ask whether any message can succeed right now, and if not, pause consumption or let the circuit breaker act. If the queue is otherwise healthy, ask whether attempts remain for this message. If they do, retry with backoff and run the same two checks again. If they do not, move that one message to the dead letter queue.">
  <defs>
    <marker id="m04-l06-dlq-decision-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l06-dlq-decision-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l06-dlq-decision-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m04-l06-dlq-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m04-l06-dlq-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="950" fill="#FFFFFF"/>

  <text x="60" y="44" font-size="20" font-weight="600" fill="#334155">Two questions, in this order</text>
  <text x="1180" y="44" text-anchor="end" font-size="20" fill="#64748B">the first check protects the healthy messages</text>

  <g filter="url(#m04-l06-dlq-decision-soft)">
    <rect x="140" y="80" width="440" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="360" y="126" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A message just failed</text>
  <text x="360" y="158" text-anchor="middle" font-size="20" fill="#64748B">the consumer threw, no ack sent</text>
  <rect x="100" y="225" width="520" height="310" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g filter="url(#m04-l06-dlq-decision-soft)">
    <rect x="140" y="240" width="440" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="286" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Can any message succeed?</text>
  <text x="360" y="318" text-anchor="middle" font-size="20" fill="#64748B">or is the dependency itself down?</text>
  <g filter="url(#m04-l06-dlq-decision-soft)">
    <rect x="140" y="410" width="440" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="456" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Attempts left for this one?</text>
  <text x="360" y="488" text-anchor="middle" font-size="20" fill="#64748B">commonly 3 to 5 deliveries</text>

  <g filter="url(#m04-l06-dlq-decision-soft)">
    <rect x="790" y="240" width="390" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="985" y="280" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pause consumption, or</text>
  <text x="985" y="312" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">let the breaker act</text>
  <text x="985" y="344" text-anchor="middle" font-size="20" fill="#64748B">these messages are fine</text>
  <g filter="url(#m04-l06-dlq-decision-soft)">
    <rect x="790" y="410" width="390" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="985" y="450" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Move it to the</text>
  <text x="985" y="482" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">dead letter queue</text>
  <text x="985" y="514" text-anchor="middle" font-size="20" fill="#64748B">the poison is quarantined</text>
  <g filter="url(#m04-l06-dlq-decision-soft)">
    <rect x="140" y="600" width="440" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="360" y="640" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Retry with backoff</text>
  <text x="360" y="672" text-anchor="middle" font-size="20" fill="#64748B">bounded attempts, with a wait</text>
  <text x="360" y="704" text-anchor="middle" font-size="20" fill="#64748B">that grows between them</text>

  <g fill="none" stroke-width="2.5">
    <path d="M360,190 L360,232" stroke="#DC2626" marker-end="url(#m04-l06-dlq-decision-rd)"/>
    <path d="M360,350 L360,402" stroke="#059669" marker-end="url(#m04-l06-dlq-decision-em)"/>
    <path d="M360,520 L360,592" stroke="#059669" marker-end="url(#m04-l06-dlq-decision-em)"/>
    <path d="M580,295 L782,295" stroke="#DC2626" marker-end="url(#m04-l06-dlq-decision-rd)"/>
    <path d="M580,465 L782,465" stroke="#D97706" marker-end="url(#m04-l06-dlq-decision-ab)"/>
    <path d="M140,665 L70,665 L70,270 L132,270" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m04-l06-dlq-decision-sl)"/>
  </g>

  <text x="396" y="385" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="396" y="565" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="660" y="283" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="660" y="453" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="610" y="672" font-size="20" fill="#475569">if it fails again, both checks run again</text>

  <line x1="60" y1="800" x2="96" y2="800" stroke="#059669" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">The message is still worth another attempt</text>
  <line x1="60" y1="840" x2="96" y2="840" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="847" font-size="20" fill="#475569">Stop: nothing can succeed until the dependency recovers</text>
  <line x1="60" y1="880" x2="96" y2="880" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="887" font-size="20" fill="#475569">Quarantine: this one message is moved aside</text>
</svg>