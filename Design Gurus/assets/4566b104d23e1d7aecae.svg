<text x="620" y="696" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Scan every cell, and each unvisited land cell starts a new island</text>
<text x="620" y="728" text-anchor="middle" font-size="18.5" fill="#475569">The traversal from it then marks the whole island, so it is never counted twice</text>
