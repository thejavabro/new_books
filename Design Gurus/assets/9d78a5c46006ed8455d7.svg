<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="728" viewBox="0 0 1240 728" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="lagtime-title lagtime-desc">
<title id="lagtime-title">A record count is not a duration</title>
<desc id="lagtime-desc">The same lag figure means four seconds on one topic and three hours on another in the same cluster. Time lag, the age of the oldest unprocessed record, is the measurement that maps onto a business statement.</desc>
<defs>
<marker id="lagtime-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="lagtime-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="lagtime-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="lagtime-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="728" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A record count is not a duration</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The same number means entirely different things on two topics in the same cluster.</text>
<rect x="40" y="650" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="650" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="420" y="118" width="400" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">10,000 records of lag</text>
<path d="M620 176V190" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M320 190H920" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M320 190V212" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M320 190V212" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lagtime-marker-slate)"/>
<path d="M920 190V212" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 190V212" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lagtime-marker-slate)"/>
<rect x="40" y="218" width="560" height="150" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 218H46A6 6 0 0 0 40 224V362A6 6 0 0 0 46 368H54Z" fill="#39D5AA"/><text x="320" y="254" font-size="23" font-weight="700" fill="#169B77" text-anchor="middle">on a topic doing 2,500/s</text>
<text x="320" y="306" font-size="30" font-weight="700" fill="#169B77" text-anchor="middle">four seconds</text>
<text x="320" y="342" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">nobody notices</text>
<rect x="640" y="218" width="560" height="150" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 218H646A6 6 0 0 0 640 224V362A6 6 0 0 0 646 368H654Z" fill="#F28B9D"/><text x="920" y="254" font-size="23" font-weight="700" fill="#A83147" text-anchor="middle">on a topic doing 1/s</text>
<text x="920" y="306" font-size="30" font-weight="700" fill="#A83147" text-anchor="middle">three hours</text>
<text x="920" y="342" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">an incident</text>
<rect x="40" y="392" width="1160" height="80" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="392" width="5" height="80" rx="2.5" fill="#5EC9EC"/><text x="64" y="425" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">A shared alert threshold across topics is therefore meaningless.</text><text x="64" y="451" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The number people actually want is the age of the oldest unprocessed record.</text>
<text x="40" y="514" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Why time lag is the honest one</text>
<rect x="40" y="532" width="560" height="92" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="557" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Record lag falls overnight because</text><text x="320" y="584" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">fewer records arrive, hiding a</text><text x="320" y="611" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">consumer running at half speed</text>
<rect x="640" y="532" width="560" height="92" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="570.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"Orders are four minutes late" is actionable.</text><text x="920" y="597.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"Lag is 47,000" is not</text>
<text x="66" y="684" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Put a producer timestamp in the message and report the difference when processing finishes.</text>
</svg>