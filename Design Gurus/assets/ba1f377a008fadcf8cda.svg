<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="enforce-title enforce-desc">
<title id="enforce-title">Enforce it with something that fails a build</title>
<desc id="enforce-desc">A boundary maintained by agreement decays, because agreements are invisible at the moment somebody is in a hurry. What separates the ones that hold from the ones that quietly dissolve is whether the rule is enforced by a tool rather than by intent.</desc>
<defs>
<marker id="enforce-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="enforce-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="enforce-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="enforce-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="790" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Enforce it with something that fails a build</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A boundary maintained by agreement decays.</text>
<rect x="40" y="712" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="712" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Mechanisms, strongest first</text>
<rect x="40" y="168" width="480" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="200" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Language visibility</text>
<path d="M526 194H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 194H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#enforce-marker-slate)"/>
<rect x="570" y="168" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="200" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the compiler refuses the call, which costs nothing</text>
<rect x="40" y="230" width="480" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Separate build units</text>
<path d="M526 256H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 256H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#enforce-marker-slate)"/>
<rect x="570" y="230" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="262" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an undeclared dependency does not compile</text>
<rect x="40" y="292" width="480" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Dependency tests</text>
<path d="M526 318H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 318H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#enforce-marker-slate)"/>
<rect x="570" y="292" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="324" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">assert the graph: who may import whom, and no cycles</text>
<rect x="40" y="354" width="480" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Import linting</text>
<path d="M526 380H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 380H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#enforce-marker-slate)"/>
<rect x="570" y="354" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="386" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">forbid import paths; weakest, trivial, better than nothing</text>
<rect x="40" y="416" width="480" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="448" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Code ownership</text>
<path d="M526 442H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 442H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#enforce-marker-slate)"/>
<rect x="570" y="416" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="448" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">review by the owning team; catches intent rather than accident</text>
<rect x="40" y="488" width="1160" height="62" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="488" width="5" height="62" rx="2.5" fill="#5EC9EC"/><text x="64" y="525" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">The point is not which one. It is that crossing the boundary fails something automated.</text>
<rect x="40" y="568" width="1160" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="568" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="604" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">If the only thing stopping a cross-module call is that</text><text x="64" y="633" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">somebody would mention it in review,</text><text x="64" y="662" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">the boundary will be gone within a year.</text>
<text x="66" y="746" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Language visibility is the strongest form available and the cheapest to adopt.</text>
</svg>