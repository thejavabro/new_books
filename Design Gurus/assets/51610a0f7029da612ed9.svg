<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Circuit breaker state machine: Closed trips to Open, Open moves to Half-Open after the cooldown, Half-Open returns to Closed only when the test calls succeed">
  <rect x="0" y="0" width="1300" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="a" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
  </defs>

  
  <rect x="60" y="200" width="260" height="150" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="190" y="248" font-size="24" font-weight="700" fill="#065F46" text-anchor="middle">Closed</text>
  <text x="190" y="284" font-size="20" fill="#334155" text-anchor="middle">Calls pass through.</text>
  <text x="190" y="312" font-size="20" fill="#334155" text-anchor="middle">Failures counted over</text>
  <text x="190" y="340" font-size="20" fill="#334155" text-anchor="middle">the last 20 calls.</text>

  <rect x="520" y="200" width="260" height="150" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="650" y="248" font-size="24" font-weight="700" fill="#991B1B" text-anchor="middle">Open</text>
  <text x="650" y="284" font-size="20" fill="#334155" text-anchor="middle">Every call rejected</text>
  <text x="650" y="312" font-size="20" fill="#334155" text-anchor="middle">in about 1 ms. The</text>
  <text x="650" y="340" font-size="20" fill="#334155" text-anchor="middle">dependency gets a rest.</text>

  <rect x="980" y="200" width="260" height="150" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="1110" y="248" font-size="24" font-weight="700" fill="#92400E" text-anchor="middle">Half-Open</text>
  <text x="1110" y="284" font-size="20" fill="#334155" text-anchor="middle">5 test calls are</text>
  <text x="1110" y="312" font-size="20" fill="#334155" text-anchor="middle">allowed through.</text>
  <text x="1110" y="340" font-size="20" fill="#334155" text-anchor="middle">Everything else waits.</text>

  
  <line x1="320" y1="300" x2="512" y2="300" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="416" y="256" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">over 50% of the</text>
  <text x="416" y="282" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">last 20 calls fail</text>

  
  <line x1="780" y1="300" x2="972" y2="300" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="876" y="256" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">30-second</text>
  <text x="876" y="282" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">cooldown expires</text>

  
  <path d="M1110,200 L1110,112 L190,112 L190,192" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="650" y="96" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">all 5 test calls succeed</text>

  
  <path d="M1110,350 L1110,432 L650,432 L650,358" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="880" y="462" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">a test call fails</text>

  
  <text x="60" y="530" font-size="20" font-weight="700" fill="#0F172A">Every arrow runs one way. Open never returns to Closed directly: recovery is only ever proved by the test calls.</text>
</svg>