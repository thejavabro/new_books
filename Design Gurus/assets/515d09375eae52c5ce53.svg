<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="890" viewBox="0 0 1240 890" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The failure walk for every arrow you draw between two services: ask what happens when the call is slow or fails, then name a timeout with a number, a retry only if repeating the work is safe, a breaker that opens after repeated failures, a fallback or reduced response, and finally what the user sees on screen.">
  <defs>
    <marker id="m07-l01-arrow-checklist-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l01-arrow-checklist-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l01-arrow-checklist-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l01-arrow-checklist-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m07-l01-arrow-checklist-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="890" fill="#FFFFFF"/>

  <g filter="url(#m07-l01-arrow-checklist-soft)">
    <rect x="60" y="150" width="330" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="225" y="206" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">You draw an arrow</text>
  <text x="225" y="238" text-anchor="middle" font-size="20" fill="#64748B">between two services</text>
  <g filter="url(#m07-l01-arrow-checklist-soft)">
    <rect x="460" y="150" width="430" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="675" y="206" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">What happens when this call</text>
  <text x="675" y="238" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">is slow or fails?</text>
  <g filter="url(#m07-l01-arrow-checklist-soft)">
    <rect x="920" y="150" width="270" height="130" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="1055" y="190" text-anchor="middle" font-size="20" fill="#334155">One full walkthrough</text>
  <text x="1055" y="222" text-anchor="middle" font-size="20" fill="#334155">beats five</text>
  <text x="1055" y="254" text-anchor="middle" font-size="20" fill="#334155">pattern names</text>

  <rect x="40" y="330" width="1160" height="440" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="375" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Answer it out loud, in this order, one sentence per step</text>

  <g filter="url(#m07-l01-arrow-checklist-soft)">
    <rect x="60" y="400" width="340" height="140" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="230" y="461" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Timeout</text>
  <text x="230" y="493" text-anchor="middle" font-size="20" fill="#64748B">with a stated number</text>
  <g filter="url(#m07-l01-arrow-checklist-soft)">
    <rect x="450" y="400" width="340" height="140" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="461" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Retry</text>
  <text x="620" y="493" text-anchor="middle" font-size="20" fill="#64748B">only if repeating the work is safe</text>
  <g filter="url(#m07-l01-arrow-checklist-soft)">
    <rect x="840" y="400" width="340" height="140" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1010" y="461" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Breaker opens</text>
  <text x="1010" y="493" text-anchor="middle" font-size="20" fill="#64748B">after repeated failures</text>
  <g filter="url(#m07-l01-arrow-checklist-soft)">
    <rect x="255" y="590" width="340" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="425" y="651" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fallback</text>
  <text x="425" y="683" text-anchor="middle" font-size="20" fill="#64748B">or a reduced response</text>
  <g filter="url(#m07-l01-arrow-checklist-soft)">
    <rect x="645" y="590" width="340" height="140" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="815" y="651" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">What the user sees</text>
  <text x="815" y="683" text-anchor="middle" font-size="20" fill="#64748B">said out loud, on screen</text>

  <g fill="none" stroke-width="2.5">
    <path d="M390,215 L452,215" stroke="#3B82F6" marker-end="url(#m07-l01-arrow-checklist-bl)"/>
    <path d="M500,280 L500,300 L230,300 L230,392" stroke="#DC2626" marker-end="url(#m07-l01-arrow-checklist-rd)"/>
    <path d="M400,470 L442,470" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l01-arrow-checklist-rd)"/>
    <path d="M790,470 L832,470" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l01-arrow-checklist-rd)"/>
    <path d="M1010,540 L1010,562 L425,562 L425,582" stroke="#059669" stroke-width="2" marker-end="url(#m07-l01-arrow-checklist-em)"/>
    <path d="M595,660 L637,660" stroke="#475569" stroke-width="2" marker-end="url(#m07-l01-arrow-checklist-sl)"/>
  </g>

  <text x="421" y="128" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">every arrow, every time</text>

  <line x1="60" y1="810" x2="96" y2="810" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="817" font-size="20" fill="#475569">The failure path: what you owe every scary edge</text>
  <line x1="60" y1="850" x2="96" y2="850" stroke="#059669" stroke-width="4"/>
  <text x="108" y="857" font-size="20" fill="#475569">What the caller still returns when the call does not</text>
</svg>