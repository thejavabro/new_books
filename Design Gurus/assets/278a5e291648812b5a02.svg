<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1236" viewBox="0 0 1240 1236" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated Discord architecture: REST write path, Kafka fan out to stateful gateways, cold history reads, and the lazy guild optimisation">
  <defs>
    <filter id="dd-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="dd-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="dd-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="dd-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dd-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="dd-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1236" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Discord: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">REST in, WebSocket out, and the two tricks that make a 500,000 member server possible</text>

  <rect x="24" y="96" width="1192" height="360" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Send (write path) · REST, because it handles auth and limits better</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dd-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#dd-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">write</text>
  <path d="M620,232 L620,300" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#dd-emerald)"/>
  <text x="638" y="274" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">may they post?</text>
  <path d="M1040,232 L1040,300" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#dd-amber)"/>
  <text x="1058" y="292" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">then publish</text>
  <g filter="url(#dd-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,171 L880,217 A160,15 0 0 0 1200,217 L1200,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="171" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M460,319 L460,365 A160,15 0 0 0 780,365 L780,319" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="319" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M880,319 L880,365 A160,15 0 0 0 1200,365 L1200,319" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="1040" cy="319" rx="160" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">sends a nonce</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Server</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">stateless</text>
  <text x="1040" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">ScyllaDB</text>
  <text x="1040" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">by channel_id, then id</text>
  <text x="620" y="353" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Guild cache</text>
  <text x="620" y="410" font-size="20" fill="#065F46" text-anchor="middle">roles and permissions</text>
  <text x="1040" y="353" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="1040" y="410" font-size="20" fill="#92400E" text-anchor="middle">guild-events</text>

  <rect x="24" y="486" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="518" font-size="20" font-weight="600" fill="#92400E">2. Fan out · one message, up to 100,000 sockets</text>
  <path d="M264,584 L349,584" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#dd-amber)"/>
  <text x="307" y="572" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consume</text>
  <path d="M577,584 L662,584" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#dd-emerald)"/>
  <text x="620" y="572" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">who?</text>
  <path d="M890,584 L975,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dd-blue)"/>
  <text x="933" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">RPC</text>
  <g filter="url(#dd-soft)">
    <path d="M40,561 L40,607 A110,15 0 0 0 260,607 L260,561" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="150" cy="561" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="353" y="546" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M666,561 L666,607 A110,15 0 0 0 886,607 L886,561" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="561" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="979" y="546" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="595" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="150" y="652" font-size="20" fill="#92400E" text-anchor="middle">the single event</text>
  <text x="463" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Fan out worker</text>
  <text x="463" y="606" font-size="20" fill="#64748B" text-anchor="middle">online members only</text>
  <text x="776" y="595" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Session map</text>
  <text x="776" y="652" font-size="20" fill="#065F46" text-anchor="middle">sharded Redis</text>
  <text x="1089" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Gateways</text>
  <text x="1089" y="606" font-size="20" fill="#64748B" text-anchor="middle">100k sockets each</text>

  <rect x="24" y="728" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="760" font-size="20" font-weight="600" fill="#1E40AF">3. History (cold read) · scrolling up, or a brand new device</text>
  <path d="M264,826 L349,826" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dd-blue)"/>
  <text x="307" y="814" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <path d="M577,826 L662,826" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#dd-emerald)"/>
  <text x="620" y="814" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hot?</text>
  <path d="M890,826 L975,826" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dd-blue)"/>
  <text x="933" y="814" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>
  <g filter="url(#dd-soft)">
    <rect x="40" y="788" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="788" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,803 L666,849 A110,15 0 0 0 886,849 L886,803" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="803" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M979,803 L979,849 A110,15 0 0 0 1199,849 L1199,803" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="803" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="848" font-size="20" fill="#64748B" text-anchor="middle">local SQLite first</text>
  <text x="463" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Server</text>
  <text x="463" y="848" font-size="20" fill="#64748B" text-anchor="middle">cursor paging</text>
  <text x="776" y="837" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Message cache</text>
  <text x="776" y="894" font-size="20" fill="#065F46" text-anchor="middle">last 50 per channel</text>
  <text x="1089" y="837" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">ScyllaDB</text>
  <text x="1089" y="894" font-size="20" fill="#5B21B6" text-anchor="middle">one disk seek</text>

  <rect x="24" y="970" width="1192" height="166" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="1002" font-size="20" font-weight="600" fill="#475569">4. The mega server · presence for 500,000 members is never broadcast</text>
  <path d="M364,1068 L456,1068" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dd-blue)"/>
  <text x="410" y="1056" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">scale</text>
  <path d="M784,1068 L876,1068" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#dd-blue)"/>
  <text x="830" y="1056" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">overload</text>
  <g filter="url(#dd-soft)">
    <rect x="40" y="1030" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="1030" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="1030" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Lazy guilds</text>
  <text x="200" y="1090" font-size="20" fill="#64748B" text-anchor="middle">viewport only</text>
  <text x="620" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consistent hash</text>
  <text x="620" y="1090" font-size="20" fill="#64748B" text-anchor="middle">spreads sockets</text>
  <text x="1040" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Priority shed</text>
  <text x="1040" y="1090" font-size="20" fill="#64748B" text-anchor="middle">typing drops first</text>
  <line x1="44" y1="1196" x2="72" y2="1196" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1203" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1196" x2="344.576" y2="1196" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1203" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1187" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1203" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1187" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1203" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1187" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1203" font-size="20" fill="#475569">core service</text>
</svg>