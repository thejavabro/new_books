<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Study routine: a 45 minute breakdown for one problem, a 110 minute daily plan of two problems plus a comparison, and what the second pass through the course looks like">
  <defs>
    <filter id="sr-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="sr-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="sr-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="sr-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="sr-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="sr-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">How to spend the two hours</text>
  <text x="40" y="72" font-size="20" fill="#64748B">One problem is 45 minutes, one day is two problems plus 20 minutes joining them up</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. One problem · 45 minutes · the same three moves every time</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#sr-blue)"/>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#sr-blue)"/>
  <g filter="url(#sr-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Frame it</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">first 15 minutes</text>
  <text x="200" y="262" font-size="20" fill="#1E40AF" text-anchor="middle">sections 1 to 4, do the numbers first</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Design it</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">next 15 minutes</text>
  <text x="620" y="262" font-size="20" fill="#1E40AF" text-anchor="middle">sections 5 to 7, draw before you scroll</text>
  <text x="1040" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Trace it</text>
  <text x="1040" y="216" font-size="20" fill="#64748B" text-anchor="middle">last 15 minutes</text>
  <text x="1040" y="262" font-size="20" fill="#1E40AF" text-anchor="middle">section 8, one write and one read</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. One day · 110 minutes · Day 6 and Day 7 have a third problem</text>
  <path d="M364,436 L456,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#sr-blue)"/>
  <path d="M784,436 L876,436" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#sr-emerald)"/>
  <g filter="url(#sr-soft)">
    <rect x="40" y="398" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="398" width="320" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="200" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Problem A</text>
  <text x="200" y="458" font-size="20" fill="#64748B" text-anchor="middle">45 minutes</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Problem B</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">45 minutes</text>
  <text x="1040" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Compare them</text>
  <text x="1040" y="458" font-size="20" fill="#64748B" text-anchor="middle">20 minutes</text>
  <text x="1040" y="504" font-size="20" fill="#065F46" text-anchor="middle">why did these two choose differently?</text>

  <rect x="24" y="580" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#92400E">3. The second pass · this is the one that makes it stick</text>
  <path d="M364,678 L456,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#sr-amber)"/>
  <path d="M784,678 L876,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#sr-amber)"/>
  <g filter="url(#sr-soft)">
    <rect x="40" y="640" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="460" y="640" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="880" y="640" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="200" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cover the page</text>
  <text x="200" y="700" font-size="20" fill="#64748B" text-anchor="middle">draw from memory</text>
  <text x="200" y="746" font-size="20" fill="#92400E" text-anchor="middle">then check what you missed</text>
  <text x="620" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read 9 to 14</text>
  <text x="620" y="700" font-size="20" fill="#64748B" text-anchor="middle">the deep dives</text>
  <text x="620" y="746" font-size="20" fill="#92400E" text-anchor="middle">skipped on the first pass</text>
  <text x="1040" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Say it out loud</text>
  <text x="1040" y="700" font-size="20" fill="#64748B" text-anchor="middle">5 minutes</text>
  <text x="1040" y="746" font-size="20" fill="#92400E" text-anchor="middle">interviews are spoken, not written</text>
</svg>