<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="protect-title protect-desc">
<title id="protect-title">Protecting the rest of the interview</title>
<desc id="protect-desc">The recovery is not only technical. Twenty minutes remain, and the way the error is carried affects all of them.</desc>
<defs>
<marker id="protect-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="protect-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="protect-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="protect-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="786" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Protecting the rest of the interview</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Twenty minutes remain and the way the error is carried affects all of them.</text>
<rect x="40" y="708" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="708" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="370" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="275" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do not keep apologizing</text>
<path d="M466 148H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 148H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#protect-marker-slate)"/>
<rect x="510" y="118" width="690" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one acknowledgment is a correction. Three is a pattern</text><text x="530" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that changes how they read everything after</text>
<circle cx="60" cy="220" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="370" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="275" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do not over-correct</text>
<path d="M466 220H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 220H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#protect-marker-slate)"/>
<rect x="510" y="190" width="690" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">hedging every later statement reads as lost confidence</text><text x="530" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and makes the rest weaker than your knowledge</text>
<circle cx="60" cy="292" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="370" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="275" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do use it</text>
<path d="M466 292H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 292H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#protect-marker-slate)"/>
<rect x="510" y="262" width="690" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"the main thing I would do differently is the partition key, which</text><text x="530" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">I would have caught by writing down the access patterns first"</text>
<rect x="40" y="352" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="352" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="387" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A design review where nobody finds anything is a review that did not happen.</text><text x="64" y="413" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">They are not looking for a perfect first draft, because that candidate does not exist.</text>
<text x="40" y="480" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What they are looking for</text>
<rect x="40" y="498" width="196" height="70" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="138" y="525.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">be shown a</text><text x="138" y="552.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">problem</text>
<path d="M242 533H275" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M242 533H275" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#protect-marker-slate)"/>
<rect x="281" y="498" width="196" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="379" y="539" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">understand it</text>
<path d="M483 533H516" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M483 533H516" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#protect-marker-slate)"/>
<rect x="522" y="498" width="196" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="539" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">scope it</text>
<path d="M724 533H757" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M724 533H757" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#protect-marker-slate)"/>
<rect x="763" y="498" width="196" height="70" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="861" y="525.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">fix the right</text><text x="861" y="552.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">amount</text>
<path d="M965 533H998" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M965 533H998" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#protect-marker-slate)"/>
<rect x="1004" y="498" width="196" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1102" y="539" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">keep going</text>
<rect x="40" y="598" width="1160" height="84" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="598" width="5" height="84" rx="2.5" fill="#39D5AA"/><text x="64" y="631.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">That is a description of a good colleague</text><text x="64" y="660.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">and it is what the recovery is measuring.</text>
<text x="66" y="742" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Reflection on a real error is more credible than a generic one.</text>
</svg>