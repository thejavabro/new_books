  <text x="504.5" y="398" font-size="15.5" font-weight="600" fill="#6B7280">minutes later</text>
  <text x="568.5" y="462" font-size="18.5" font-weight="600" fill="#111827">Outcomes arrive</text>
  <text x="620" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">two watched, the rest skipped</text>
