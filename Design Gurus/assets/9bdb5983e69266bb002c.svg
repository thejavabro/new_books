<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One home page request: the funnel narrows 50 million videos to about 20 within 200 ms, then the outcomes train the next ranker">
  <defs>
