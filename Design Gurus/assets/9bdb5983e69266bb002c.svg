  <text x="678" y="124" font-size="15.5" font-weight="600" fill="#6B7280">about 80 ms</text>
  <text x="742" y="188" font-size="18.5" font-weight="600" fill="#111827">Candidates ranked</text>
  <text x="802.5" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 500 to about 50</text>
