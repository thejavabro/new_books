  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M633,181 H678" marker-end="url(#c3in2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M927,181 H972" marker-end="url(#c3in2-mslate)"/></g>
