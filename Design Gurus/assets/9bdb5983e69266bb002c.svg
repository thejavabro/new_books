  <text x="120.5" y="398" font-size="15.5" font-weight="600" fill="#6B7280">as the page shows</text>
  <text x="184.5" y="462" font-size="18.5" font-weight="600" fill="#111827">Impressions logged</text>
  <text x="249" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">with features and versions</text>
