<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The grid with only the first row and column known">
<defs>
<filter id="up-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many ways lead from the top left to the bottom right of a 3 by 3 grid?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Only two moves are allowed at any point: right, or down</text>
<rect x="40" y="106" width="1160" height="530" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">A cell can only be entered from above or from the left, so its count is the sum of those two</text>
<rect x="443" y="208" width="96" height="96" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2.5"/>
<text x="491" y="265" text-anchor="middle" font-size="25" font-weight="600" fill="#047857">1</text>
<rect x="561" y="208" width="96" height="96" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2.5"/>
<text x="609" y="265" text-anchor="middle" font-size="25" font-weight="600" fill="#047857">1</text>
<rect x="679" y="208" width="96" height="96" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2.5"/>
<text x="727" y="265" text-anchor="middle" font-size="25" font-weight="600" fill="#047857">1</text>
<rect x="443" y="326" width="96" height="96" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2.5"/>
<text x="491" y="383" text-anchor="middle" font-size="25" font-weight="600" fill="#047857">1</text>
<rect x="561" y="326" width="96" height="96" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="679" y="326" width="96" height="96" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="443" y="444" width="96" height="96" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2.5"/>
<text x="491" y="501" text-anchor="middle" font-size="25" font-weight="600" fill="#047857">1</text>
<rect x="561" y="444" width="96" height="96" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5"/>
<rect x="679" y="444" width="96" height="96" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="417" y="238" text-anchor="end" font-size="17.5" font-weight="600" fill="#047857">start</text>
<text x="819" y="514" font-size="17.5" font-weight="600" fill="#047857">finish</text>
<text x="620" y="602" text-anchor="middle" font-size="19" font-weight="600" fill="#047857">There is exactly one way along the top edge, and one way down the left edge</text>
<rect x="40" y="642" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="682" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Every route into a cell arrives from exactly one of two neighbours</text>
<text x="620" y="714" text-anchor="middle" font-size="18.5" fill="#475569">So the ways to reach a cell are the ways to reach those two added together</text>
</svg>