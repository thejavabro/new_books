<text x="722" y="381" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569"></text>
<rect x="778" y="346" width="92" height="56" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
