<rect x="778" y="478" width="92" height="56" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="824" y="513" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569"></text>
<text x="620" y="580" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Using no numbers there is exactly one way to make 0, the empty subset, and no way to make anything else</text>
<rect x="40" y="646" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="686" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Counting sign assignments becomes counting subsets that add up to 4</text>
<text x="620" y="718" text-anchor="middle" font-size="18.5" fill="#475569">The plus group and the minus group differ by 1 and add to 7, so the plus group is fixed at 4</text>
</svg>