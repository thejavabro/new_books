<rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many ways can + and - signs on {1, 1, 2, 3} give a total of 1?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The numbers given a + sign must add up to (7 + 1) divided by 2, which is 4</text>
<rect x="40" y="106" width="1160" height="530" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Each cell counts the subsets of the numbers on its row that add up to the sum in its column</text>
<text x="416" y="198" text-anchor="middle" font-size="17.5" font-weight="600" fill="#475569">sum 0</text>
<text x="518" y="198" text-anchor="middle" font-size="17.5" font-weight="600" fill="#475569">sum 1</text>
<text x="620" y="198" text-anchor="middle" font-size="17.5" font-weight="600" fill="#475569">sum 2</text>
<text x="722" y="198" text-anchor="middle" font-size="17.5" font-weight="600" fill="#475569">sum 3</text>
<text x="824" y="198" text-anchor="middle" font-size="17.5" font-weight="600" fill="#475569">sum 4</text>
<text x="348" y="249" text-anchor="end" font-size="18" font-weight="600" fill="#475569">no numbers yet</text>
<rect x="370" y="214" width="92" height="56" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2"/>
<text x="416" y="249" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">1</text>
<rect x="472" y="214" width="92" height="56" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="518" y="249" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">0</text>
<rect x="574" y="214" width="92" height="56" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="620" y="249" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">0</text>
<rect x="676" y="214" width="92" height="56" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="722" y="249" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">0</text>
