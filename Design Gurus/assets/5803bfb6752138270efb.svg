<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="the five ways the new interval can sit">
<defs>
<filter id="ed-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">The new interval against an existing one: five cases</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">only the first needs no merging, and the other four all produce one block</text>
<rect x="40" y="100" width="1160" height="384" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="116" y="162" text-anchor="end" font-size="19" font-weight="600" fill="#475569">1</text>
<rect x="150" y="128" width="123" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="211.5" y="146" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="334.5" y="158" width="102.5" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="385.75" y="176" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="162" font-size="18" fill="#475569">no overlap, so a is simply inserted</text>
<text x="116" y="226" text-anchor="end" font-size="19" font-weight="600" fill="#475569">2</text>
<rect x="150" y="192" width="164" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="232" y="210" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="252.5" y="222" width="164" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="334.5" y="240" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="226" font-size="18" fill="#047857">the block runs a.start to b.end</text>
<text x="116" y="290" text-anchor="end" font-size="19" font-weight="600" fill="#475569">3</text>
<rect x="150" y="256" width="205" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="252.5" y="274" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="182.8" y="286" width="110.69999999999999" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="238.15" y="304" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="290" font-size="18" fill="#047857">the block runs a.start to a.end</text>
<text x="116" y="354" text-anchor="end" font-size="19" font-weight="600" fill="#475569">4</text>
<rect x="252.5" y="320" width="164" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="334.5" y="338" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="150" y="350" width="164" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="232" y="368" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="354" font-size="18" fill="#047857">the block runs b.start to a.end</text>
<text x="116" y="418" text-anchor="end" font-size="19" font-weight="600" fill="#475569">5</text>
<rect x="211.5" y="384" width="61.5" height="26" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="242.25" y="402" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">a</text>
<rect x="170.5" y="414" width="184.5" height="26" rx="6" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
<text x="262.75" y="432" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">b</text>
<text x="620" y="418" font-size="18" fill="#047857">the block runs b.start to b.end</text>
</svg>