<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two heaps splitting a stream of numbers so the median sits between their tops"><rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="416" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">A max heap for the smaller half, a min heap for the larger half</text>
<circle cx="70" cy="179" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="186" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">1</text>
<text x="112" y="187" text-anchor="start" font-size="19.5" font-weight="600" fill="#1D4ED8">max heap</text>
<rect x="240" y="146" width="66" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="273" y="187" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">5</text>
<rect x="316" y="146" width="66" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="400" y="187" text-anchor="start" font-size="19.5" font-weight="600" fill="#5B21B6">min heap</text>
<rect x="520" y="146" width="66" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="596" y="146" width="66" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="700" y="174" font-size="22.5" font-weight="600" fill="#111827">insert 5</text>
<text x="700" y="204" font-size="19.5" fill="#6B7280">median 5, the max heap holds the extra value</text>
<circle cx="70" cy="291" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="298" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">2</text>
<text x="112" y="299" text-anchor="start" font-size="19.5" font-weight="600" fill="#1D4ED8">max heap</text>
<rect x="240" y="258" width="66" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="273" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">5</text>
<rect x="316" y="258" width="66" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="400" y="299" text-anchor="start" font-size="19.5" font-weight="600" fill="#5B21B6">min heap</text>
<rect x="520" y="258" width="66" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="553" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">15</text>
<rect x="596" y="258" width="66" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="700" y="286" font-size="22.5" font-weight="600" fill="#111827">insert 15</text>
<text x="700" y="316" font-size="19.5" fill="#6B7280">median 10, the two tops are averaged</text>
<circle cx="70" cy="403" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="70" y="410" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">3</text>
<text x="112" y="411" text-anchor="start" font-size="19.5" font-weight="600" fill="#1D4ED8">max heap</text>
<rect x="240" y="370" width="66" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="273" y="411" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">1</text>
<rect x="316" y="370" width="66" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="349" y="411" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">5</text>
<text x="400" y="411" text-anchor="start" font-size="19.5" font-weight="600" fill="#5B21B6">min heap</text>
<rect x="520" y="370" width="66" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="553" y="411" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">15</text>
<rect x="596" y="370" width="66" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="700" y="398" font-size="22.5" font-weight="600" fill="#111827">insert 1</text>
<text x="700" y="428" font-size="19.5" fill="#6B7280">median 5, rebalanced so the sizes differ by one</text>
<rect x="40" y="504" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="526" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="552" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">smaller half</text>
<text x="348" y="552" font-size="19.5" fill="#475569">a max heap, so its largest value sits on top</text>
<rect x="64" y="574" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="600" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">larger half</text>
<text x="348" y="600" font-size="19.5" fill="#475569">a min heap, so its smallest value sits on top</text>
<rect x="64" y="622" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="648" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">empty slot</text>
<text x="348" y="648" font-size="19.5" fill="#475569">the heap holds fewer values than the diagram shows</text>
</svg>