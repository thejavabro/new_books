<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="658" viewBox="0 0 1240 658" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="price-title price-desc">
<title id="price-title">Price the second database first</title>
<desc id="price-desc">Every additional store costs tested backup and restore, monitoring and alerting, upgrade runbooks, on-call coverage that can diagnose it, and the hiring and onboarding cost of a second system. Together that is roughly a quarter to a half of an engineer, permanently.</desc>
<defs>
<marker id="price-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="price-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="price-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="price-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="658" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Price the second database first</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Per additional store, budget for all of the following, permanently.</text>
<rect x="40" y="580" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="580" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backup and restore, tested</text>
<path d="M526 146H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 146H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#price-marker-slate)"/>
<rect x="570" y="118" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an untested backup is not a backup</text>
<rect x="40" y="186" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Monitoring and alerting</text>
<path d="M526 214H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 214H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#price-marker-slate)"/>
<rect x="570" y="186" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">new thresholds somebody must read at 3am</text>
<rect x="40" y="254" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Upgrade runbooks</text>
<path d="M526 282H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 282H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#price-marker-slate)"/>
<rect x="570" y="254" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">written and rehearsed before they are needed</text>
<rect x="40" y="322" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">On-call who can diagnose it</text>
<path d="M526 350H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 350H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#price-marker-slate)"/>
<rect x="570" y="322" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a rotation that can only restart it</text>
<rect x="40" y="390" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Hiring and onboarding</text>
<path d="M526 418H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 418H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#price-marker-slate)"/>
<rect x="570" y="390" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="424" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every future engineer learns two systems</text>
<rect x="40" y="470" width="1160" height="84" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="470" width="5" height="84" rx="2.5" fill="#F28B9D"/><text x="64" y="505" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A quarter to half an engineer, permanently</text><text x="64" y="531" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">That is the number the new store must beat, not the license fee and not the benchmark.</text>
<text x="66" y="614" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This cost is invisible on the day of the decision, which is exactly when it needs to be visible.</text>
</svg>