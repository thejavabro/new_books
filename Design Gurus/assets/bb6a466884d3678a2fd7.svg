<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: a customer order flows across four microservices; the order service charges the payment service synchronously, replies to the customer, then publishes OrderPlaced events that the inventory and notification services react to on their own.">
  <defs>
    <marker id="m01-l02-order-flow-sequence-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m01-l02-order-flow-sequence-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m01-l02-order-flow-sequence-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m01-l02-order-flow-sequence-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  
  <rect x="270" y="440" width="930" height="190" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="135" y1="124" x2="135" y2="650"/>
    <line x1="375" y1="124" x2="375" y2="650"/>
    <line x1="615" y1="124" x2="615" y2="650"/>
    <line x1="855" y1="124" x2="855" y2="650"/>
    <line x1="1095" y1="124" x2="1095" y2="650"/>
  </g>
  <text x="292" y="478" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Async: inventory and notification react to the event</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M135,190 L371,190" stroke="#3B82F6" marker-end="url(#m01-l02-order-flow-sequence-bl)"/>
    <path d="M375,260 L611,260" stroke="#3B82F6" marker-end="url(#m01-l02-order-flow-sequence-bl)"/>
    <path d="M615,330 L379,330" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m01-l02-order-flow-sequence-em)"/>
    <path d="M375,400 L139,400" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m01-l02-order-flow-sequence-em)"/>
    <path d="M375,532 L851,532" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m01-l02-order-flow-sequence-ab)"/>
    <path d="M375,600 L1091,600" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m01-l02-order-flow-sequence-ab)"/>
  </g>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="255" y="178" fill="#1E40AF">Place order</text>
    <text x="495" y="248" fill="#1E40AF">Charge the card</text>
    <text x="495" y="318" fill="#065F46">Payment confirmed</text>
    <text x="255" y="388" fill="#065F46">Order accepted</text>
    <text x="615" y="520" fill="#92400E">OrderPlaced event</text>
    <text x="735" y="588" fill="#92400E">OrderPlaced event</text>
  </g>

  
  <g filter="url(#m01-l02-order-flow-sequence-soft)">
    <rect x="25" y="40" width="220" height="84" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="135" y="89" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Customer</text>

  <g filter="url(#m01-l02-order-flow-sequence-soft)">
    <rect x="265" y="40" width="220" height="84" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="375" y="77" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order</text>
  <text x="375" y="103" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service</text>

  <g filter="url(#m01-l02-order-flow-sequence-soft)">
    <rect x="505" y="40" width="220" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="615" y="77" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment</text>
  <text x="615" y="103" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service</text>

  <g filter="url(#m01-l02-order-flow-sequence-soft)">
    <rect x="745" y="40" width="220" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="855" y="77" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="855" y="103" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service</text>

  <g filter="url(#m01-l02-order-flow-sequence-soft)">
    <rect x="985" y="40" width="220" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1095" y="77" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notification</text>
  <text x="1095" y="103" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Service</text>

  
  <g stroke-width="4">
    <line x1="40" y1="694" x2="74" y2="694" stroke="#3B82F6"/>
    <line x1="400" y1="694" x2="434" y2="694" stroke="#059669" stroke-dasharray="6 5"/>
    <line x1="680" y1="694" x2="714" y2="694" stroke="#D97706" stroke-dasharray="6 5"/>
  </g>
  <text x="84" y="701" font-size="20" fill="#475569">Synchronous network call</text>
  <text x="444" y="701" font-size="20" fill="#475569">Reply (success)</text>
  <text x="724" y="701" font-size="20" fill="#475569">Async event</text>
  <text x="984" y="701" font-size="20" fill="#64748B">every service owns its data</text>
</svg>