<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="818" viewBox="0 0 1240 818" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="hybrid-title hybrid-desc">
<title id="hybrid-title">Retrieval is not only vector search</title>
<desc id="hybrid-desc">Hybrid retrieval is the single highest-value upgrade to a naive implementation, because keyword search handles exactly what embeddings handle worst.</desc>
<defs>
<marker id="hybrid-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="hybrid-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="hybrid-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="hybrid-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="818" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Retrieval is not only vector search</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Hybrid retrieval is the single highest-value upgrade to a naive implementation.</text>
<rect x="40" y="740" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="740" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="90" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="90" rx="2.5" fill="#F28B9D"/><text x="64" y="156" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Vector search is good at topic and bad at exact terms</text><text x="64" y="182" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an error code, a product identifier, a surname, an uncommon acronym</text>
<rect x="40" y="230" width="470" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="275" y="258.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">keyword search</text><text x="275" y="285.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">exact terms and rare tokens</text>
<rect x="730" y="230" width="470" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="965" y="258.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">vector search</text><text x="965" y="285.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">paraphrase and concept</text>
<path d="M300 308L492 332" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M300 308L492 332" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hybrid-marker-slate)"/>
<path d="M940 308L748 332" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M940 308L748 332" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hybrid-marker-slate)"/>
<rect x="500" y="336" width="240" height="54" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="369" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">rank fusion</text>
<text x="770" y="352" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">merged by position, not by score,</text><text x="770" y="377" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">since the scales are incomparable</text>
<rect x="40" y="412" width="390" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="235" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Query rewriting</text>
<path d="M396 440H430" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M396 440H430" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hybrid-marker-slate)"/>
<rect x="440" y="412" width="760" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="460" y="446" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">short questions with pronouns, expanded into a standalone form</text>
<rect x="40" y="480" width="390" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="235" y="514" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Metadata filtering first</text>
<path d="M396 508H430" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M396 508H430" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hybrid-marker-slate)"/>
<rect x="440" y="480" width="760" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="460" y="514" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">restrict the search space, or you retrieve ten and return two</text>
<rect x="40" y="548" width="390" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="235" y="582" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reranking</text>
<path d="M396 576H430" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M396 576H430" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hybrid-marker-slate)"/>
<rect x="440" y="548" width="760" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="460" y="582" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">score more candidates with a model that sees query and passage together</text>
<rect x="40" y="624" width="1160" height="88" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="624" width="5" height="88" rx="2.5" fill="#AC8BE8"/><text x="64" y="661" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">An index is a copy of your data</text><text x="64" y="687" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Filter permissions at retrieval against current state, not at ingest.</text>
<text x="66" y="774" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Otherwise a revoked user keeps getting answers from documents they can no longer open.</text>
</svg>