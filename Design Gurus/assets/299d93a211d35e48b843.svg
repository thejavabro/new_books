<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="948" viewBox="0 0 1240 948" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two answers to the same ten minute question. The wide answer lists ten operation names and leaves six questions unanswered: what creation requires, whether delivery is synchronous, what a retry does, how failures are represented, what the caller receives, and what can change later. The deep answer names two operations and specifies creation completely, so the interviewer can see required fields, an optional scheduling field, a 201 response with a queued resource, an idempotency key, three named failures, and one stated trade-off.">
