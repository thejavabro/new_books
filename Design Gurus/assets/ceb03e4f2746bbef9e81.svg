  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Peer churn: how nodes join and leave a P2P network</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Peers join and leave all the time, and the overlay keeps working as its connections change.</text>

