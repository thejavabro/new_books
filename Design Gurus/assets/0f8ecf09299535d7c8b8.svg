<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="604" viewBox="0 0 1240 604" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rings. On the left a new machine E joins between C and D, and only the keys between C and E move. On the right machine C leaves, and only its own arc passes to D. Every other machine is untouched in both cases.">
  <rect x="0" y="0" width="1240" height="604" fill="#FFFFFF"/>
  <defs>
    <marker id="chs3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="chs3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="chs3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="chs3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="chs3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="chs3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="chs3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="chs3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="chs3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Adding and removing a machine moves one arc, not the whole ring</text>
  <rect x="24" y="70" width="588" height="492" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="106" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">A new machine E joins</text>
  <circle cx="318" cy="296" r="130" fill="none" stroke="#F8FAFC" stroke-width="13"/>
  <path d="M194.4 255.8 A130 130 0 0 1 358.2 172.4" fill="none" stroke="#3B82F6" stroke-width="13"/>
  <path d="M358.2 172.4 A130 130 0 0 1 441.6 336.2" fill="none" stroke="#059669" stroke-width="13"/>
  <path d="M441.6 336.2 A130 130 0 0 1 277.8 419.6" fill="none" stroke="#D97706" stroke-width="13"/>
  <path d="M277.8 419.6 A130 130 0 0 1 200.4 351.4" fill="none" stroke="#0D9488" stroke-width="13"/>
  <path d="M200.4 351.4 A130 130 0 0 1 194.4 255.8" fill="none" stroke="#7C3AED" stroke-width="13"/>
  <path d="M277.8 419.6 A130 130 0 0 1 200.4 351.4" fill="none" stroke="#DC2626" stroke-width="13" stroke-dasharray="7 5"/>
  <circle cx="358.2" cy="172.4" r="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="3"/>
  <text x="358.1722092687432" y="179.36265288163003" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">A</text>
  <text x="372.38699100999077" y="134.614053132053" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="start">machine A</text>
  <circle cx="441.6" cy="336.2" r="13" fill="#FFFFFF" stroke="#065F46" stroke-width="3"/>
  <text x="441.63734711837" y="343.17220926874313" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">B</text>
  <text x="485.38594686794704" y="356.38699100999077" font-size="19" font-weight="600" fill="#065F46" text-anchor="start">machine B</text>
  <circle cx="277.8" cy="419.6" r="13" fill="#FFFFFF" stroke="#B45309" stroke-width="3"/>
  <text x="277.82779073125687" y="426.63734711837" font-size="19" font-weight="700" fill="#B45309" text-anchor="middle">C</text>
  <text x="263.6130089900093" y="469.38594686794704" font-size="19" font-weight="600" fill="#B45309" text-anchor="end">machine C</text>
  <circle cx="200.4" cy="351.4" r="13" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
  <text x="200.37248317941746" y="358.3513079034594" font-size="19" font-weight="700" fill="#0F766E" text-anchor="middle">E</text>
  <text x="158.75043876598056" y="376.93715531545274" font-size="19" font-weight="600" fill="#0F766E" text-anchor="end">E (new)</text>
  <circle cx="194.4" cy="255.8" r="13" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3"/>
  <text x="194.36265288163003" y="262.8277907312568" font-size="19" font-weight="700" fill="#6D28D9" text-anchor="middle">D</text>
  <text x="150.614053132053" y="247.6130089900092" font-size="19" font-weight="600" fill="#6D28D9" text-anchor="end">machine D</text>
  <text x="318" y="288" font-size="18" fill="#64748B" text-anchor="middle">about 1 key in 5 moves,</text>
  <text x="318" y="314" font-size="18" fill="#64748B" text-anchor="middle">and it moves to E</text>
  <text x="318" y="508" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Only the keys between C and E change hands.</text>
  <text x="318" y="536" font-size="19" fill="#64748B" text-anchor="middle">They come from D alone. A, B and C keep every key.</text>
  <rect x="628" y="70" width="588" height="492" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="106" font-size="22" font-weight="600" fill="#B91C1C" text-anchor="middle">Machine C leaves</text>
  <circle cx="922" cy="296" r="130" fill="none" stroke="#F8FAFC" stroke-width="13"/>
  <path d="M798.4 255.8 A130 130 0 0 1 962.2 172.4" fill="none" stroke="#3B82F6" stroke-width="13"/>
  <path d="M962.2 172.4 A130 130 0 0 1 1045.6 336.2" fill="none" stroke="#059669" stroke-width="13"/>
  <path d="M1045.6 336.2 A130 130 0 0 1 798.4 255.8" fill="none" stroke="#7C3AED" stroke-width="13"/>
  <path d="M1045.6 336.2 A130 130 0 0 1 881.8 419.6" fill="none" stroke="#DC2626" stroke-width="13" stroke-dasharray="7 5"/>
  <circle cx="962.2" cy="172.4" r="13" fill="#FFFFFF" stroke="#1E40AF" stroke-width="3"/>
  <text x="962.1722092687431" y="179.36265288163003" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">A</text>
  <text x="976.3869910099908" y="134.614053132053" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="start">machine A</text>
  <circle cx="1045.6" cy="336.2" r="13" fill="#FFFFFF" stroke="#065F46" stroke-width="3"/>
  <text x="1045.63734711837" y="343.17220926874313" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">B</text>
  <text x="1089.385946867947" y="356.38699100999077" font-size="19" font-weight="600" fill="#065F46" text-anchor="start">machine B</text>
  <circle cx="798.4" cy="255.8" r="13" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3"/>
  <text x="798.3626528816301" y="262.8277907312568" font-size="19" font-weight="700" fill="#6D28D9" text-anchor="middle">D</text>
  <text x="754.614053132053" y="247.6130089900092" font-size="19" font-weight="600" fill="#6D28D9" text-anchor="end">machine D</text>
  <text x="922" y="288" font-size="18" fill="#64748B" text-anchor="middle">about 1 key in 4 moves,</text>
  <text x="922" y="314" font-size="18" fill="#64748B" text-anchor="middle">and all of them go to D</text>
  <text x="922" y="508" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">C's keys go to D, the next machine clockwise.</text>
  <text x="922" y="536" font-size="19" fill="#64748B" text-anchor="middle">A and B are not touched, and no other key moves.</text>
</svg>