  <text x="114" y="992.5" font-size="18.5" fill="#1F2937">Consumers must handle duplicates (idempotent processing)</text>
  <rect x="64" y="1292" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <g transform="translate(78,1303) scale(0.92)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="1320.5" font-size="18.5" fill="#1F2937">Message is processed exactly once</text>
  <rect x="64" y="1346" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <g transform="translate(78,1357) scale(0.92)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="1374.5" font-size="18.5" fill="#1F2937">Duplicates still arrive, but idempotency or transactions apply each effect once</text>
