  <g transform="translate(78,1411) scale(0.92)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="1428.5" font-size="18.5" fill="#1F2937">More complex and higher overhead</text>
  <text x="64" y="172" font-size="18.5" fill="#475569">Message may be lost, but never delivered twice.</text>
  <text x="64" y="588" font-size="18.5" fill="#475569">Message is always delivered, but may be delivered multiple times.</text>
  <text x="64" y="1114" font-size="18.5" fill="#475569">Message is processed exactly once (within defined boundaries).</text>

