  <text x="114" y="358.5" font-size="18.5" fill="#1F2937">Message can be lost</text>
  <rect x="64" y="384" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <g transform="translate(78,395) scale(0.92)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="412.5" font-size="18.5" fill="#1F2937">Never delivered more than once</text>
  <rect x="64" y="438" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <g transform="translate(78,449) scale(0.92)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="466.5" font-size="18.5" fill="#1F2937">Lower latency, simpler design</text>
  <rect x="64" y="856" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,867) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="884.5" font-size="18.5" fill="#1F2937">Message is delivered at least once</text>
  <rect x="64" y="910" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,921) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="938.5" font-size="18.5" fill="#1F2937">Duplicates can occur</text>
