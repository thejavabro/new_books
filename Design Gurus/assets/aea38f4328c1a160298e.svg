<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1510" viewBox="0 0 1240 1510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three rows. At-most-once: the message may be lost, for example when the consumer commits the offset and then crashes before processing, but is never delivered twice. At-least-once: the message is always delivered but may be delivered twice to the same consumer, for example after it restarts, so consumers must process idempotently. Exactly-once: delivery is still at least once, so a duplicate arrives, but idempotency or transactions apply its effect only once, at the cost of more complexity">
