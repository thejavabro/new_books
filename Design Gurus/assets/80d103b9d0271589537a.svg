<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="evcmd-title evcmd-desc">
<title id="evcmd-title">Events against commands</title>
<desc id="evcmd-desc">An event states a fact that already happened and has no intended recipient. A command instructs something not yet done, has one recipient, and can be rejected. Putting commands on a topic produces remote calls with worse failure modes.</desc>
<defs>
<marker id="evcmd-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="evcmd-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="evcmd-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="evcmd-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="762" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Events against commands</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A large share of event-driven pain comes from putting the wrong thing on the bus.</text>
<rect x="40" y="684" width="1160" height="52" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="684" width="5" height="52" rx="2.5" fill="#AC8BE8"/>
<rect x="40" y="118" width="560" height="280" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V392A6 6 0 0 0 46 398H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Event</text>
<rect x="400" y="128" width="170" height="36" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="485" y="153" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">OrderShipped</text>
<rect x="72" y="174" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a fact about something that happened</text>
<rect x="72" y="226" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="255" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no intended recipient</text>
<rect x="72" y="278" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cannot fail</text>
<rect x="72" y="330" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="359" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">any number of consumers may care</text>
<rect x="640" y="118" width="560" height="280" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V392A6 6 0 0 0 646 398H654Z" fill="#F3CF6A"/><text x="670" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Command</text>
<rect x="1000" y="128" width="170" height="36" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1085" y="153" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">ShipOrder</text>
<rect x="672" y="174" width="500" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">an instruction not yet carried out</text>
<rect x="672" y="226" width="500" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="255" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">exactly one intended recipient</text>
<rect x="672" y="278" width="500" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">can be rejected</text>
<rect x="672" y="330" width="500" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="359" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the sender usually wants a result</text>
<rect x="40" y="422" width="1160" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="422" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="64" y="455" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Publishing a command to a broadcast topic</text><text x="64" y="481" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">gives you a remote procedure call with no return value, no error path,</text><text x="64" y="507" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">no timeout, and an unbounded set of possible recipients.</text>
<rect x="40" y="552" width="1160" height="106" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="552" width="5" height="106" rx="2.5" fill="#5EC9EC"/><text x="64" y="585" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Two tests</text><text x="64" y="611" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Is the name in the past tense? Could a second consumer subscribe without the producer caring?</text><text x="64" y="637" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">Wanting a response means it is a command.</text>
<text x="66" y="718" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A producer that knows its consumers has coupled them together through a broker.</text>
</svg>