<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="584" viewBox="0 0 1240 584" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A table of four quorum settings for three replicas. W equals three with R equals one, W equals two with R equals two, W equals one with R equals three, and W equals one with R equals one. Only the last one fails the R plus W greater than N rule, so only it can return stale data.">
  <rect x="0" y="0" width="1240" height="584" fill="#FFFFFF"/>
  <defs>
    <marker id="qm3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="qm3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="qm3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="qm3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="qm3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="qm3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="qm3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="qm3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="qm3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Four settings with N = 3</text>
  <text x="620" y="70" font-size="19" fill="#64748B" text-anchor="middle">the same three copies, tuned three different ways, plus one setting that gives up the guarantee</text>
  <text x="48" y="100" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">SETTING</text>
  <text x="230" y="100" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">R + W &gt; N ?</text>
  <text x="425" y="100" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">WRITE WAITS FOR</text>
  <text x="590" y="100" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">READ WAITS FOR</text>
  <text x="760" y="100" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">PICK IT WHEN</text>
  <path d="M24 112 H1216" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
  <g filter="url(#qm3-soft)"><rect x="24" y="122" width="1192" height="84" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="48" y="171" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">W=3, R=1</text>
  <text x="230" y="171" font-size="19" font-weight="600" fill="#065F46" text-anchor="start">yes, 4 &gt; 3</text>
  <text x="425" y="171" font-size="19" fill="#0F172A" text-anchor="start">all 3 replicas</text>
  <text x="590" y="171" font-size="19" fill="#0F172A" text-anchor="start">any 1 replica</text>
  <text x="760" y="171" font-size="19" fill="#64748B" text-anchor="start">reads far outnumber writes</text>
  <g filter="url(#qm3-soft)"><rect x="24" y="216" width="1192" height="84" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/></g>
  <text x="48" y="265" font-size="21" font-weight="700" fill="#065F46" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">W=2, R=2</text>
  <text x="230" y="265" font-size="19" font-weight="600" fill="#065F46" text-anchor="start">yes, 4 &gt; 3</text>
  <text x="425" y="265" font-size="19" fill="#0F172A" text-anchor="start">any 2 of 3</text>
  <text x="590" y="265" font-size="19" fill="#0F172A" text-anchor="start">any 2 of 3</text>
  <text x="760" y="265" font-size="19" fill="#64748B" text-anchor="start">the balanced default</text>
  <g filter="url(#qm3-soft)"><rect x="24" y="310" width="1192" height="84" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="48" y="359" font-size="21" font-weight="700" fill="#B45309" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">W=1, R=3</text>
  <text x="230" y="359" font-size="19" font-weight="600" fill="#065F46" text-anchor="start">yes, 4 &gt; 3</text>
  <text x="425" y="359" font-size="19" fill="#0F172A" text-anchor="start">any 1 replica</text>
  <text x="590" y="359" font-size="19" fill="#0F172A" text-anchor="start">all 3 replicas</text>
  <text x="760" y="359" font-size="19" fill="#64748B" text-anchor="start">writes must be fast</text>
  <g filter="url(#qm3-soft)"><rect x="24" y="404" width="1192" height="84" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="48" y="453" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">W=1, R=1</text>
  <text x="230" y="453" font-size="19" font-weight="600" fill="#B91C1C" text-anchor="start">no, 2 is not &gt; 3</text>
  <text x="425" y="453" font-size="19" fill="#0F172A" text-anchor="start">any 1 replica</text>
  <text x="590" y="453" font-size="19" fill="#0F172A" text-anchor="start">any 1 replica</text>
  <text x="760" y="453" font-size="19" fill="#64748B" text-anchor="start">stale reads are acceptable</text>
  <text x="620" y="532" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The first three all overlap, so a read always meets the latest write. They differ only in which operation pays for it.</text>
  <text x="620" y="560" font-size="19" fill="#64748B" text-anchor="middle">W=1, R=1 is the fastest and the least safe. A read can return a value that is already out of date.</text>
</svg>