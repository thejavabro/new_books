<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="844" viewBox="0 0 1240 844" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two overlapping range queries answered by moving one window three steps instead of rescanning"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="844" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="540" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">The cost of a query is the distance from the query answered before it</text>
<rect x="300" y="150" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="346" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="346" y="140" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=0</text>
<rect x="402" y="150" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="448" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">2</text>
<text x="448" y="140" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=1</text>
<rect x="504" y="150" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="550" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="550" y="140" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=2</text>
<rect x="606" y="150" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="652" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">3</text>
<text x="652" y="140" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=3</text>
<rect x="708" y="150" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="754" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">2</text>
<text x="754" y="140" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=4</text>
<text x="272" y="281" text-anchor="end" font-size="19.5" font-weight="600" fill="#1D4ED8">query A</text>
<rect x="300" y="240" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="346" y="281" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">1</text>
<rect x="402" y="240" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="448" y="281" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">2</text>
<rect x="504" y="240" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="550" y="281" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">1</text>
<rect x="606" y="240" width="92" height="66" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="652" y="281" text-anchor="middle" font-size="22.5" font-weight="600" fill="#94A3B8">3</text>
<rect x="708" y="240" width="92" height="66" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="754" y="281" text-anchor="middle" font-size="22.5" font-weight="600" fill="#94A3B8">2</text>
<text x="830" y="281" text-anchor="start" font-size="19.5" font-weight="600" fill="#1D4ED8">2 distinct</text>
<text x="272" y="401" text-anchor="end" font-size="19.5" font-weight="600" fill="#5B21B6">query B</text>
<rect x="300" y="360" width="92" height="66" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="346" y="401" text-anchor="middle" font-size="22.5" font-weight="600" fill="#94A3B8">1</text>
<rect x="402" y="360" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="448" y="401" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">2</text>
<rect x="504" y="360" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="550" y="401" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">1</text>
<rect x="606" y="360" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="652" y="401" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">3</text>
<rect x="708" y="360" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="754" y="401" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">2</text>
<text x="830" y="401" text-anchor="start" font-size="19.5" font-weight="600" fill="#5B21B6">3 distinct</text>
<text x="300" y="480" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">getting from A to B: remove index 0, add index 3, add index 4</text>
<text x="300" y="512" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">three single steps, not a full rescan of the range</text>
<text x="300" y="570" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">sorting queries by left block, then by right end, keeps that distance small</text>
<rect x="40" y="628" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="650" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="676" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">the window now</text>
<text x="348" y="676" font-size="19.5" fill="#475569">the range whose answer is already known</text>
<rect x="64" y="698" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="724" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the window next</text>
<text x="348" y="724" font-size="19.5" fill="#475569">the range the pointers are moving toward</text>
<rect x="64" y="746" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="772" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">outside</text>
<text x="348" y="772" font-size="19.5" fill="#475569">added or removed one index at a time</text>
</svg>