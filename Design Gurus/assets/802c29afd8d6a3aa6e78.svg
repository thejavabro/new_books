<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The CAP triangle: consistency, availability and partition tolerance at the corners, with the pairs CP, AP and CA on the edges">
  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
  <defs>
    <filter id="cp1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="620" y1="105" x2="260" y2="445" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line x1="620" y1="105" x2="1000" y2="445" stroke="#3B82F6" stroke-width="2.5"/>
  <line x1="260" y1="445" x2="1000" y2="445" stroke="#059669" stroke-width="2.5"/>

  
  <rect x="285" y="238" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="445" y="270" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="middle">CA</text>
  <text x="445" y="298" font-size="20" fill="#B91C1C" text-anchor="middle">out of reach once distributed</text>

  <rect x="670" y="238" width="290" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="815" y="270" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">CP</text>
  <text x="815" y="298" font-size="20" fill="#1E3A8A" text-anchor="middle">stays correct, may refuse</text>

  <rect x="480" y="408" width="300" height="76" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="630" y="440" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">AP</text>
  <text x="630" y="468" font-size="20" fill="#065F46" text-anchor="middle">stays up, may be stale</text>

  
  <g filter="url(#cp1-soft)">
    <rect x="470" y="60" width="300" height="90" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="110" y="400" width="300" height="90" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="830" y="400" width="340" height="90" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="620" y="98" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consistency</text>
  <text x="620" y="126" font-size="20" fill="#64748B" text-anchor="middle">every read sees the latest write</text>

  <text x="260" y="438" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Availability</text>
  <text x="260" y="466" font-size="20" fill="#64748B" text-anchor="middle">every request gets an answer</text>

  <text x="1000" y="438" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Partition tolerance</text>
  <text x="1000" y="466" font-size="20" fill="#64748B" text-anchor="middle">survives a network split</text>

  <text x="620" y="552" font-size="20" fill="#475569" text-anchor="middle">Pick any two. Since partitions happen whether you plan for them or not, the real pick is CP or AP.</text>
</svg>