<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="688" viewBox="0 0 1240 688" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A consumer inserts each message id into a processed-messages table with a unique constraint, so a redelivery fails the insert and the side effect is skipped">
  <rect x="0" y="0" width="1240" height="688" fill="#FFFFFF"/>
  <defs>
    <marker id="ms4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Let the database do the deduplication for you</text>

  
  <rect x="40" y="88" width="1160" height="212" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="122" font-size="20" font-weight="600" fill="#065F46">First delivery: no row for this message id yet</text>

  <line x1="324" y1="200" x2="346" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#ms4-slate)"/>
  <line x1="604" y1="200" x2="626" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#ms4-slate)"/>
  <line x1="884" y1="200" x2="906" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#ms4-slate)"/>

  <rect x="70" y="150" width="250" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="195" y="206" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">receive m-42</text>

  <rect x="350" y="150" width="250" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="475" y="192" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">INSERT m-42</text>
  <text x="475" y="222" font-size="20" fill="#1E40AF" text-anchor="middle">into processed_messages</text>

  <rect x="630" y="150" width="250" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="755" y="192" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">no row for m-42 yet</text>
  <text x="755" y="222" font-size="20" fill="#065F46" text-anchor="middle">the insert succeeds</text>

  <rect x="910" y="150" width="250" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="1035" y="192" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">charge the card</text>
  <text x="1035" y="222" font-size="20" fill="#065F46" text-anchor="middle">and commit</text>

  
  <rect x="40" y="320" width="1160" height="212" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="354" font-size="20" font-weight="600" fill="#B91C1C">Redelivery: the same message id arrives again</text>

  <line x1="324" y1="432" x2="346" y2="432" stroke="#475569" stroke-width="2" marker-end="url(#ms4-slate)"/>
  <line x1="604" y1="432" x2="626" y2="432" stroke="#475569" stroke-width="2" marker-end="url(#ms4-slate)"/>
  <line x1="884" y1="432" x2="906" y2="432" stroke="#475569" stroke-width="2" marker-end="url(#ms4-slate)"/>

  <rect x="70" y="382" width="250" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="195" y="438" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">receive m-42 again</text>

  <rect x="350" y="382" width="250" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="475" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">INSERT m-42</text>
  <text x="475" y="454" font-size="20" fill="#1E40AF" text-anchor="middle">into processed_messages</text>

  <rect x="630" y="382" width="250" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="755" y="424" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">m-42 is already there</text>
  <text x="755" y="454" font-size="20" fill="#B91C1C" text-anchor="middle">unique constraint fires</text>

  <rect x="910" y="382" width="250" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="1035" y="424" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">skip the charge</text>
  <text x="1035" y="454" font-size="20" fill="#065F46" text-anchor="middle">ack and move on</text>

  
  <rect x="50" y="566" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="602" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The unique constraint is the dedup check. You do not read first, you let the insert fail.</text>
  <text x="620" y="632" font-size="20" fill="#334155" text-anchor="middle">Insert the id and do the work in one transaction, or a crash between them loses the protection.</text>
</svg>