<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every limiter instance reads and writes one shared counter, so the count is correct no matter which server handles the request">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="rl9-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rl9-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rl9-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="365" y1="92" x2="515" y2="196" stroke="#D97706" stroke-width="2" marker-end="url(#rl9-amber)"/>
  <line x1="365" y1="172" x2="515" y2="221" stroke="#D97706" stroke-width="2" marker-end="url(#rl9-amber)"/>
  <line x1="365" y1="252" x2="515" y2="246" stroke="#D97706" stroke-width="2" marker-end="url(#rl9-amber)"/>
  <line x1="365" y1="332" x2="515" y2="271" stroke="#D97706" stroke-width="2" marker-end="url(#rl9-amber)"/>
  <line x1="860" y1="235" x2="925" y2="235" stroke="#059669" stroke-width="2.5" marker-end="url(#rl9-green)"/>

  <g filter="url(#rl9-soft)">
    <rect x="60" y="60" width="300" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="140" width="300" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="220" width="300" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="300" width="300" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="520" y="165" width="340" height="140" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
    <rect x="930" y="190" width="270" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="210" y="99" font-size="20" fill="#1E3A8A" text-anchor="middle">Limiter on server 1</text>
  <text x="210" y="179" font-size="20" fill="#1E3A8A" text-anchor="middle">Limiter on server 2</text>
  <text x="210" y="259" font-size="20" fill="#1E3A8A" text-anchor="middle">Limiter on server 3</text>
  <text x="210" y="339" font-size="20" fill="#1E3A8A" text-anchor="middle">and 7 more</text>

  <text x="690" y="207" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Shared counter store</text>
  <text x="690" y="243" font-size="20" fill="#B45309" text-anchor="middle">one number per user</text>
  <text x="690" y="279" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">incremented atomically</text>

  <text x="1065" y="228" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">100 a minute,</text>
  <text x="1065" y="258" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">as intended</text>

  <text x="620" y="418" font-size="20" fill="#475569" text-anchor="middle">The count is now correct, at the cost of one network round trip per request</text>
  <text x="620" y="450" font-size="20" fill="#475569" text-anchor="middle">and a dependency that has to keep working</text>
</svg>