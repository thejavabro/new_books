<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="background-color:#ffffff">
<defs>
<marker id="ta" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#2f7a55"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="28" font-size="14" font-weight="bold">One call, whatever it lands on</text>

<rect x="40" y="52" width="230" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="155" y="72" text-anchor="middle" font-weight="bold" font-size="12.5">project/</text>
<text x="155" y="88" text-anchor="middle" font-family="monospace" font-size="11">size() = 2150</text>

<rect x="40" y="140" width="200" height="42" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="140" y="160" text-anchor="middle" font-size="12">README.md</text>
<text x="140" y="176" text-anchor="middle" font-family="monospace" font-size="11">size() = 1200</text>

<rect x="270" y="140" width="200" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="370" y="160" text-anchor="middle" font-weight="bold" font-size="12">src/</text>
<text x="370" y="176" text-anchor="middle" font-family="monospace" font-size="11">size() = 950</text>

<rect x="270" y="228" width="140" height="42" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="340" y="248" text-anchor="middle" font-size="12">main.js</text>
<text x="340" y="264" text-anchor="middle" font-family="monospace" font-size="11">size() = 600</text>

<rect x="430" y="228" width="140" height="42" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="500" y="248" text-anchor="middle" font-size="12">util.js</text>
<text x="500" y="264" text-anchor="middle" font-family="monospace" font-size="11">size() = 350</text>

<path d="M 100 140 L 100 116 L 155 116 L 155 96" stroke="#2f7a55" fill="none" marker-end="url(#ta)"/>
<path d="M 330 140 L 330 116 L 155 116" stroke="#2f7a55" fill="none"/>
<path d="M 330 228 L 330 204 L 370 204 L 370 184" stroke="#2f7a55" fill="none" marker-end="url(#ta)"/>
<path d="M 480 228 L 480 204 L 370 204" stroke="#2f7a55" fill="none"/>

<text x="600" y="72" font-size="12.5" fill="#414d60">A folder answers size() by adding up what its</text>
<text x="600" y="90" font-size="12.5" fill="#414d60">children answer. A file answers directly.</text>

<text x="600" y="124" font-size="12.5" fill="#414d60">The caller makes the same call either way and</text>
<text x="600" y="142" font-size="12.5" fill="#414d60">never asks which one it is holding.</text>

<rect x="600" y="166" width="330" height="34" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="616" y="188" font-family="monospace" font-size="11.5" fill="#2f7a55">report(project);  report(readme);</text>

<line x1="30" y1="300" x2="930" y2="300" stroke="#dbe2ed"/>

<text x="30" y="330" font-size="13" font-weight="bold" fill="#b4322c">Without the pattern, every operation starts the same way</text>

<rect x="30" y="344" width="500" height="62" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="46" y="366" font-family="monospace" font-size="11.5">if (node instanceof Folder) { ...recurse... }</text>
<text x="46" y="384" font-family="monospace" font-size="11.5">else if (node instanceof File) { ...read size... }</text>
<text x="46" y="400" font-size="11" fill="#b4322c">and again in print(), and again in search(), and again in copy()</text>

<text x="560" y="366" font-size="12.5" fill="#b4322c">Each new node type means finding every one</text>
<text x="560" y="384" font-size="12.5" fill="#b4322c">of those branches. The pattern replaces all of</text>
<text x="560" y="402" font-size="12.5" fill="#b4322c">them with one interface and one recursion.</text>
</g>
</svg>