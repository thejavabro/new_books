<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two bounded contexts. The order context manages customer orders: its domain model links Order (line items, total, payment status), Line item and User, and feeds the order service, which owns the order database. The fulfillment context manages packing and delivery: its domain model links Order (warehouse, items to pick, tracking number, status), Pick list item and Shipment, and feeds the fulfillment service, which owns the fulfillment database. The two services communicate through APIs and events">
