  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Domain-driven design: defining microservice boundaries</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each bounded context has its own model of an order, its own service and its own database.</text>

