<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="884" viewBox="0 0 1240 884" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="audit-title audit-desc">
<title id="audit-title">Nine things to look for</title>
<desc id="audit-desc">Reading for quality produces a vague impression. Reading for specific absences produces a list, and the list is the repair plan.</desc>
<defs>
<marker id="audit-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="audit-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="audit-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="audit-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="884" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Nine things to look for</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Reading for quality produces a vague impression. Reading for specific absences produces a list.</text>
<rect x="40" y="806" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="806" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#5EC9EC"/><text x="64" y="155" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Read for absences, not for quality. Absences are the finding</text>
<circle cx="56" cy="223" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="230" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="80" y="200" width="408" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="284" y="229" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A number</text>
<rect x="498" y="200" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="229" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">any number. Without one the design was constrained by nothing</text>
<circle cx="56" cy="277" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="284" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="80" y="254" width="408" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="284" y="283" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A question you asked and then used</text>
<rect x="498" y="254" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="283" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an answer that appears later as the reason for a decision</text>
<circle cx="56" cy="331" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="338" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="80" y="308" width="408" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="284" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An alternative per decision</text>
<rect x="498" y="308" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="337" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">count the decisions, count the alternatives, compare the two</text>
<circle cx="56" cy="385" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="392" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="80" y="362" width="408" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="284" y="391" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A revisit condition</text>
<rect x="498" y="362" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="391" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">at least one decision with a stated trigger for changing it</text>
<circle cx="56" cy="439" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="446" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="80" y="416" width="408" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="284" y="445" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A failure, with its radius</text>
<rect x="498" y="416" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="445" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a mention of redundancy. What it does and does not take with it</text>
<circle cx="56" cy="493" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="500" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="80" y="470" width="408" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="284" y="499" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A cost, with a dominant line</text>
<rect x="498" y="470" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="499" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which component is largest, and is it the one you expected</text>
<circle cx="56" cy="547" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="554" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<rect x="80" y="524" width="408" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="284" y="553" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A signal</text>
<rect x="498" y="524" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="553" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one thing you would watch, with a threshold on it</text>
<circle cx="56" cy="601" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="608" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<rect x="80" y="578" width="408" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="284" y="607" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An omission, stated</text>
<rect x="498" y="578" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="607" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">something you decided not to build, with the reason</text>
<circle cx="56" cy="655" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="56" y="662" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>
<rect x="80" y="632" width="408" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="284" y="661" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A path</text>
<rect x="498" y="632" width="702" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="518" y="661" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the sequence from today, with at least one reversible step</text>
<rect x="40" y="700" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="700" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="733" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Most first attempts have four or five of nine, which is encouraging</text><text x="64" y="759" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The missing ones are almost all cheap to add.</text>
<text x="66" y="840" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Most of the gap is unwritten rather than unknown, and the page is what gets scored.</text>
</svg>