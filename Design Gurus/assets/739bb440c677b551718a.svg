<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One INSERT into the users table causes four writes: the database writes the row, then updates the email index, the name index, and the created_at index.">
  <defs>
    <filter id="wi4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="wi4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="wi4-k1"><rect x="40" y="295" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="wi4-k2"><rect x="470" y="130" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="wi4-k3"><rect x="470" y="240" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="wi4-k4"><rect x="470" y="350" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="wi4-k5"><rect x="470" y="460" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="wi4-k6"><rect x="930" y="295" width="270" height="90" rx="12"/></clipPath>
    <marker id="wi4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">One insert, four writes</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The users table has three indexes: on email, name, and created_at.</text>



  <g fill="none" stroke-width="2">
    <path d="M320,315 H385 Q400,315 400,300 V190 Q400,175 415,175 H470" stroke="#64748B" marker-end="url(#wi4-m-slate)"/>
    <path d="M320,330 H415 Q430,330 430,315 V300 Q430,285 445,285 H470" stroke="#64748B" marker-end="url(#wi4-m-slate)"/>
    <path d="M320,350 H415 Q430,350 430,365 V380 Q430,395 445,395 H470" stroke="#64748B" marker-end="url(#wi4-m-slate)"/>
    <path d="M320,365 H385 Q400,365 400,380 V490 Q400,505 415,505 H470" stroke="#64748B" marker-end="url(#wi4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#wi4-soft)">
    <rect x="40" y="295" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="295" width="6" height="90" fill="#64748B" clip-path="url(#wi4-k1)"/>
  </g>
  <circle cx="78" cy="340" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,329.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="104" y="347" font-size="21.5" font-weight="600" fill="#111827">INSERT one user</text>
  <g filter="url(#wi4-soft)">
    <rect x="470" y="130" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#wi4-k2)"/>
  </g>
  <circle cx="508" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="534" y="182" font-size="21.5" font-weight="600" fill="#111827">Write the row</text>
  <g filter="url(#wi4-soft)">
    <rect x="470" y="240" width="400" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="240" width="6" height="90" fill="#7C3AED" clip-path="url(#wi4-k3)"/>
  </g>
  <circle cx="508" cy="285" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,274.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="534" y="292" font-size="21.5" font-weight="600" fill="#111827">Update the email index</text>
  <g filter="url(#wi4-soft)">
    <rect x="470" y="350" width="400" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="350" width="6" height="90" fill="#7C3AED" clip-path="url(#wi4-k4)"/>
  </g>
  <circle cx="508" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,384.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="534" y="402" font-size="21.5" font-weight="600" fill="#111827">Update the name index</text>
  <g filter="url(#wi4-soft)">
    <rect x="470" y="460" width="400" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="460" width="6" height="90" fill="#7C3AED" clip-path="url(#wi4-k5)"/>
  </g>
  <circle cx="508" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,494.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="534" y="512" font-size="21.5" font-weight="600" fill="#111827">Update the created_at index</text>
  <g filter="url(#wi4-lift)">
    <rect x="930" y="295" width="270" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="930" y="295" width="9" height="90" fill="#D97706" clip-path="url(#wi4-k6)"/>
  </g>
  <circle cx="968" cy="340" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,329.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="994" y="347" font-size="21.5" font-weight="600" fill="#111827">4 writes, not 1</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Reads</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">faster, for queries that filter or sort on an indexed column</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Writes</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">slower, because every insert, update, and delete also changes each index</text>
</svg>