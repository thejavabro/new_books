<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Synchronous replication waits until the replicas confirm, which is safest but slowest. Semi-synchronous replication waits until at least one replica confirms, which is a middle ground. Asynchronous replication confirms as soon as the primary writes the change, which is fastest but can lose recent writes if the primary crashes.">
  <defs>
    <filter id="rpp2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rpp2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rpp2-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rpp2-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rpp2-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When is a write complete?</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three ways a primary can wait for its replicas before confirming a write.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#rpp2-soft)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#rpp2-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">Synchronous</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">waits for the replicas,</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">safest but slowest</text>
  <g filter="url(#rpp2-lift)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="450" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#rpp2-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">Semi-synchronous</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">waits for at least</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">one replica</text>
  <g filter="url(#rpp2-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#D97706" clip-path="url(#rpp2-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">Asynchronous</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">done once the primary</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">writes, fastest</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Synchronous</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">no confirmed write is lost, but every write waits</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Semi-sync</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">at least two machines hold every confirmed write</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Asynchronous</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">if the primary crashes early, recent confirmed writes can be lost</text>
</svg>