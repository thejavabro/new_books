<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="846" viewBox="0 0 1240 846" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A partial-success batch fails at two levels. A request-level failure refuses everything before any item is written and returns the ordinary error object with no results array. An admitted request returns 200 and one result per item, some of which may have failed.">
  <defs>
    <marker id="xl11twoleve-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="xl11twoleve-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="xl11twoleve-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl11twoleve-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl11twoleve-k1"><rect x="420" y="126" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="xl11twoleve-k2"><rect x="68" y="362" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k3"><rect x="68" y="426" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k4"><rect x="68" y="490" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k5"><rect x="68" y="554" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k6"><rect x="68" y="630" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k7"><rect x="668" y="362" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k8"><rect x="668" y="426" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k9"><rect x="668" y="490" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k10"><rect x="668" y="554" width="504" height="48" rx="10"/></clipPath>
    <clipPath id="xl11twoleve-k11"><rect x="668" y="630" width="504" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="846" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">A batch fails at two levels, and the caller checks both</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one request, two places a failure can appear</text>

  
  <rect x="44" y="290" width="552" height="416" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <rect x="644" y="290" width="552" height="416" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>

  
  <g fill="none" stroke-width="2">
    <path d="M555,216 V244 Q555,256 543,256 H332 Q320,256 320,268 V290" stroke="#DB2777" marker-end="url(#xl11twoleve-pm)"/>
    <path d="M685,216 V244 Q685,256 697,256 H908 Q920,256 920,268 V290" stroke="#059669" marker-end="url(#xl11twoleve-em)"/>
  </g>

  
  <g filter="url(#xl11twoleve-soft)">
    <rect x="420" y="126" width="400" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="420" y="126" width="6" height="90" fill="#64748B" clip-path="url(#xl11twoleve-k1)"/>
  </g>
  <circle cx="458" cy="171" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,160.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="484" y="178" font-size="18.5" font-weight="600" fill="#111827">POST /notification-delivery-batches</text>

  
  <text x="68" y="326" font-size="16.5" font-weight="600" fill="#BE185D">Level 1: refused before any work</text>
  <text x="68" y="348" font-size="15.5" fill="#6B7280">the whole request stops before any item is written</text>

  <g filter="url(#xl11twoleve-soft)">
    <rect x="68" y="362" width="504" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="68" y="362" width="6" height="48" fill="#DB2777" clip-path="url(#xl11twoleve-k2)"/>
  </g>
  <circle cx="102" cy="386" r="4.5" fill="#DB2777"/>
  <text x="126" y="393" font-size="18.5" font-weight="600" fill="#111827">Malformed JSON, or items is not an array</text>

  <g filter="url(#xl11twoleve-soft)">
    <rect x="68" y="426" width="504" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="68" y="426" width="6" height="48" fill="#DB2777" clip-path="url(#xl11twoleve-k3)"/>
  </g>
  <circle cx="102" cy="450" r="4.5" fill="#DB2777"/>
  <text x="126" y="457" font-size="18.5" font-weight="600" fill="#111827">Duplicate item_id values, or more than 100</text>

  <g filter="url(#xl11twoleve-soft)">
    <rect x="68" y="490" width="504" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="68" y="490" width="6" height="48" fill="#DB2777" clip-path="url(#xl11twoleve-k4)"/>
  </g>
  <circle cx="102" cy="514" r="4.5" fill="#DB2777"/>
  <text x="126" y="521" font-size="18.5" font-weight="600" fill="#111827">Authentication or permission failure</text>

  <g filter="url(#xl11twoleve-soft)">
    <rect x="68" y="554" width="504" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="68" y="554" width="6" height="48" fill="#DB2777" clip-path="url(#xl11twoleve-k5)"/>
  </g>
  <circle cx="102" cy="578" r="4.5" fill="#DB2777"/>
  <text x="126" y="585" font-size="18.5" font-weight="600" fill="#111827">A rate-limit refusal, before processing begins</text>

  <g filter="url(#xl11twoleve-lift)">
    <rect x="68" y="630" width="504" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="68" y="630" width="9" height="48" fill="#DB2777" clip-path="url(#xl11twoleve-k6)"/>
  </g>
  <circle cx="102" cy="654" r="15" fill="#FFFFFF"/>
  <g transform="translate(93,645) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="126" y="661" font-size="18.5" font-weight="600" fill="#111827">The ordinary error object, and no results</text>

  
  <text x="668" y="326" font-size="16.5" font-weight="600" fill="#047857">Level 2: admitted, so every item has a result</text>
  <text x="668" y="348" font-size="15.5" fill="#6B7280">one result per item, some of them failures</text>

  <g filter="url(#xl11twoleve-soft)">
    <rect x="668" y="362" width="504" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="668" y="362" width="6" height="48" fill="#059669" clip-path="url(#xl11twoleve-k7)"/>
  </g>
  <circle cx="702" cy="386" r="4.5" fill="#059669"/>
  <text x="726" y="393" font-size="18.5" font-weight="600" fill="#111827">HTTP 200, and a results array</text>

  <g filter="url(#xl11twoleve-soft)">
    <rect x="668" y="426" width="504" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="668" y="426" width="6" height="48" fill="#059669" clip-path="url(#xl11twoleve-k8)"/>
  </g>
  <circle cx="702" cy="450" r="4.5" fill="#059669"/>
  <text x="726" y="457" font-size="18.5" font-weight="600" fill="#111827">item_1: created, with a delivery_id</text>

  <g filter="url(#xl11twoleve-soft)">
    <rect x="668" y="490" width="504" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="668" y="490" width="6" height="48" fill="#059669" clip-path="url(#xl11twoleve-k9)"/>
  </g>
  <circle cx="702" cy="514" r="4.5" fill="#059669"/>
  <text x="726" y="521" font-size="18.5" font-weight="600" fill="#111827">item_2: failed, with code and field</text>

  <g filter="url(#xl11twoleve-soft)">
    <rect x="668" y="554" width="504" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="668" y="554" width="6" height="48" fill="#059669" clip-path="url(#xl11twoleve-k10)"/>
  </g>
  <circle cx="702" cy="578" r="4.5" fill="#059669"/>
  <text x="726" y="585" font-size="18.5" font-weight="600" fill="#111827">The caller correlates by item_id, not position</text>

  <g filter="url(#xl11twoleve-lift)">
    <rect x="668" y="630" width="504" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="668" y="630" width="9" height="48" fill="#059669" clip-path="url(#xl11twoleve-k11)"/>
  </g>
  <circle cx="702" cy="654" r="15" fill="#FFFFFF"/>
  <g transform="translate(693,645) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="726" y="661" font-size="18.5" font-weight="600" fill="#111827">Check the status first, then every entry</text>

  
  <rect x="40" y="730" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="775" text-anchor="middle" font-size="16" fill="#475569">A timeout or crash may leave partial work. Recover it with the original idempotency key.</text>
</svg>