<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="arrangement-title arrangement-desc">
<title id="arrangement-title">Single write region, read-local</title>
<desc id="arrangement-desc">The answers to the six questions point at one arrangement, and the globally ordered ledger is what rules out the alternative.</desc>
<defs>
<marker id="arrangement-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="arrangement-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="arrangement-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="arrangement-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="710" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Single write region, read-local</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The answers to the six questions point at one arrangement.</text>
<rect x="40" y="632" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="632" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="170" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V282A6 6 0 0 0 46 288H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Europe</text>
<rect x="72" y="172" width="120" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="132" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">app</text>
<path d="M198 200H234" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M198 200H234" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-slate)"/>
<rect x="240" y="172" width="120" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="300" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cache</text>
<path d="M366 200H402" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 200H402" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-slate)"/>
<rect x="408" y="172" width="120" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="468" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">replica</text>
<text x="320" y="262" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">sized to serve everything if promoted</text>
<rect x="640" y="118" width="560" height="170" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V282A6 6 0 0 0 646 288H654Z" fill="#AC8BE8"/><text x="670" y="154" font-size="23" font-weight="700" fill="#6040A8" text-anchor="start">North America</text>
<rect x="672" y="172" width="120" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="732" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">app</text>
<path d="M798 200H834" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M798 200H834" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-slate)"/>
<rect x="840" y="172" width="120" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="900" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cache</text>
<path d="M966 200H1002" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M966 200H1002" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-slate)"/>
<rect x="1008" y="172" width="120" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1068" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">PRIMARY</text>
<text x="920" y="262" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the only place a write is accepted</text>
<path d="M132 288V330H1068V294" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M132 288V330H1068V294" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-red)"/>
<text x="770" y="318" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">writes cross the ocean, about 60 to 70 ms of round trip</text>
<path d="M1128 288V368H468V294" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1128 288V368H468V294" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-green)"/>
<text x="798" y="356" font-size="19" font-weight="400" fill="#169B77" text-anchor="middle">async replication, and the lag is the data-loss budget</text>
<text x="40" y="404" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three decisions, each with its alternative</text>
<rect x="40" y="422" width="360" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="220" y="456" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Not active-active</text>
<path d="M366 450H400" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 450H400" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-slate)"/>
<rect x="410" y="422" width="790" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="430" y="443.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the globally ordered ledger has no conflict resolution and no</text><text x="430" y="468.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">partitioned ownership. Revisit if ordering relaxes to per-account</text>
<rect x="40" y="486" width="360" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="220" y="520" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A replica, not a cache alone</text>
<path d="M366 514H400" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 514H400" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-slate)"/>
<rect x="410" y="486" width="790" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="430" y="507.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cache-only fails on a cold start and gives no promotion</text><text x="430" y="532.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">path. The replica is what the prospect is paying for</text>
<rect x="40" y="550" width="360" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="220" y="584" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Asynchronous replication</text>
<path d="M366 578H400" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 578H400" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrangement-marker-slate)"/>
<rect x="410" y="550" width="790" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="430" y="571.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">synchronous puts the ocean round trip into</text><text x="430" y="596.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every write rather than fifteen percent of them</text>
<text x="66" y="666" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">At 1 ms per 200 km each way, a 6,000 km hop is about 30 ms in each direction.</text>
</svg>