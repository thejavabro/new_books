<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="452" viewBox="0 0 1240 452" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On the left, a normal HTTP exchange: the client asks, the server answers, and the connection closes. On the right, the server has new data but no request is open, so it cannot start a message to the client. Short polling, long polling, WebSockets and server-sent events are four ways around this.">
  <rect x="0" y="0" width="1240" height="452" fill="#FFFFFF"/>
  <defs>
    <marker id="rtd1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rtd1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rtd1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rtd1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rtd1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rtd1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rtd1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rtd1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rtd1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">HTTP lets the client ask. It does not let the server speak first.</text>
  <rect x="24" y="80" width="588" height="250" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="318" y="120" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">What HTTP does</text>
  <g filter="url(#rtd1-soft)"><rect x="84" y="170" width="170" height="66" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="169" y="210" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <g filter="url(#rtd1-soft)"><rect x="382" y="170" width="170" height="66" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="467" y="210" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <line x1="262" y1="190" x2="374" y2="190" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#rtd1-b)"/>
  <text x="318" y="178" font-size="18" fill="#1E40AF" text-anchor="middle">ask</text>
  <line x1="374" y1="222" x2="262" y2="222" stroke="#059669" stroke-width="2.2" marker-end="url(#rtd1-e)"/>
  <text x="318" y="250" font-size="18" fill="#065F46" text-anchor="middle">answer</text>
  <text x="318" y="296" font-size="19" fill="#64748B" text-anchor="middle">Then the connection closes.</text>
  <rect x="628" y="80" width="588" height="250" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="922" y="120" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">What HTTP does not do</text>
  <g filter="url(#rtd1-soft)"><rect x="688" y="170" width="170" height="66" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="773" y="210" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <g filter="url(#rtd1-soft)"><rect x="986" y="170" width="170" height="66" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1071" y="210" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">Server</text>
  <text x="1071" y="158" font-size="18" fill="#B45309" text-anchor="middle">has new data</text>
  <line x1="978" y1="203" x2="866" y2="203" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#rtd1-r)"/>
  <path d="M914,195 L930,211 M930,195 L914,211" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="922" y="250" font-size="18" fill="#B91C1C" text-anchor="middle">cannot start a message</text>
  <text x="922" y="296" font-size="19" fill="#64748B" text-anchor="middle">No request is open, so the news waits.</text>
  <rect x="24" y="352" width="1192" height="64" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="620" y="391" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Short polling, long polling, WebSockets, and server-sent events are four ways around this.</text>
</svg>