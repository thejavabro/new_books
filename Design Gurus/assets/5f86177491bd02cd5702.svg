<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A request can be answered by the browser cache, a CDN edge cache, an application cache such as Redis, or the database cache in memory, before it reaches the original data on disk.">
  <defs>
    <filter id="ch4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ch4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ch4-k1"><rect x="40" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ch4-k2"><rect x="281" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ch4-k3"><rect x="522" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ch4-k4"><rect x="763" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ch4-k5"><rect x="1004" y="140" width="196" height="90" rx="12"/></clipPath>
    <marker id="ch4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Caches along the path of a request</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each layer can answer the request before it reaches the original data.</text>



  <g fill="none" stroke-width="2">
    <path d="M236,185 H281" stroke="#64748B" marker-end="url(#ch4-m-slate)"/>
    <path d="M477,185 H522" stroke="#64748B" marker-end="url(#ch4-m-slate)"/>
    <path d="M718,185 H763" stroke="#64748B" marker-end="url(#ch4-m-slate)"/>
    <path d="M959,185 H1004" stroke="#64748B" marker-end="url(#ch4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ch4-soft)">
    <rect x="40" y="140" width="196" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ch4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Browser</text>
  <text x="138" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">images, CSS,</text>
  <text x="138" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">and scripts</text>
  <g filter="url(#ch4-soft)">
    <rect x="281" y="140" width="196" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="281" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ch4-k2)"/>
  </g>
  <circle cx="319" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(308.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="345" y="192" font-size="21.5" font-weight="600" fill="#111827">CDN edge</text>
  <text x="379" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">files stored</text>
  <text x="379" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">near users</text>
  <g filter="url(#ch4-lift)">
    <rect x="522" y="140" width="196" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="522" y="140" width="9" height="90" fill="#D97706" clip-path="url(#ch4-k3)"/>
  </g>
  <circle cx="560" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(549.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="586" y="192" font-size="21.5" font-weight="600" fill="#111827">App cache</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">in memory, like</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">Redis or Memcached</text>
  <g filter="url(#ch4-soft)">
    <rect x="763" y="140" width="196" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="763" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#ch4-k4)"/>
  </g>
  <circle cx="801" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(790.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="827" y="192" font-size="21.5" font-weight="600" fill="#111827">DB cache</text>
  <text x="861" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">recent data</text>
  <text x="861" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">kept in memory</text>
  <g filter="url(#ch4-soft)">
    <rect x="1004" y="140" width="196" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="1004" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ch4-k5)"/>
  </g>
  <circle cx="1042" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(1031.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="1068" y="192" font-size="21.5" font-weight="600" fill="#111827">Source</text>
  <text x="1102" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the original data</text>
  <text x="1102" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">on disk</text>

  <rect x="40" y="330" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Closer is faster</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">a cache hit near the user saves the most time</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">On a miss</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">the request moves to the next layer, and finally to the source</text>
</svg>