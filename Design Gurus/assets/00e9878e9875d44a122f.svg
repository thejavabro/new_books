<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="726" viewBox="0 0 1240 726" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="buildcost-title buildcost-desc">
<title id="buildcost-title">What building actually costs</title>
<desc id="buildcost-desc">Five costs follow the initial build and none of them stop: finishing it for production, operating it on call, keeping it current, the expertise concentrating in one person, and the features you did not know you needed.</desc>
<defs>
<marker id="buildcost-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="buildcost-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="buildcost-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="buildcost-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="726" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What building actually costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The initial build is the part everybody estimates and the smallest part of the total.</text>
<rect x="40" y="648" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="648" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Finishing it</text>
<path d="M536 146H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 146H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buildcost-marker-slate)"/>
<rect x="570" y="118" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="139.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">error handling, retries, edge cases,</text><text x="590" y="164.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an admin interface, backfill tooling</text>
<circle cx="60" cy="210" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="217" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="182" width="440" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="216" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Operating it</text>
<path d="M536 210H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 210H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buildcost-marker-slate)"/>
<rect x="570" y="182" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="203.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it joins the on-call rotation; a permanent</text><text x="590" y="228.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">charge against team capacity</text>
<circle cx="60" cy="274" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="281" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="246" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="280" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keeping it current</text>
<path d="M536 274H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 274H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buildcost-marker-slate)"/>
<rect x="570" y="246" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="267.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dependencies, security patches,</text><text x="590" y="292.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a runtime reaching end of life</text>
<circle cx="60" cy="338" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="345" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="310" width="440" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One person knows it</text>
<path d="M536 338H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 338H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buildcost-marker-slate)"/>
<rect x="570" y="310" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="331.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the author becomes the only person</text><text x="590" y="356.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">who can safely modify it</text>
<circle cx="60" cy="402" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="409" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="374" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="408" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Features you did not foresee</text>
<path d="M536 402H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 402H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buildcost-marker-slate)"/>
<rect x="570" y="374" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="395.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the vendor has them because</text><text x="590" y="420.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a thousand customers asked</text>
<rect x="40" y="464" width="1160" height="46" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="494" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">build</text><text x="1184" y="494" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">3 engineer-months</text>
<rect x="40" y="516" width="1160" height="46" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="546" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">operate, 1 month a year, over five years</text><text x="1184" y="546" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">5 engineer-months</text>
<rect x="40" y="576" width="1160" height="46" rx="9" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="56" y="606" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">a very ordinary small internal service</text><text x="1184" y="606" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">8 engineer-months</text>
<text x="66" y="682" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An engineer, fully costed, is more per month than most of the line items people call expensive.</text>
</svg>