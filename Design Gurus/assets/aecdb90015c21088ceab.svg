  <text x="920" y="565" text-anchor="middle" font-size="15.5" fill="#6B7280">409 with resync_required, then re-read state and reconnect</text>

  
  <rect x="644" y="608" width="552" height="299" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
