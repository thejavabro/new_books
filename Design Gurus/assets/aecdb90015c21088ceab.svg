  <text x="320" y="724" text-anchor="middle" font-size="15.5" fill="#6B7280">SSE, with ordinary REST for writes</text>

  <g filter="url(#pv-soft)">
    <rect x="84" y="738" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
