  <text x="418" y="1010" font-size="18.5" font-weight="600" fill="#111827">Main rejection</text>
  <text x="620" y="1047" text-anchor="middle" font-size="15.5" fill="#6B7280">No WebSockets, because browser delivery is one-directional</text>

  
  <rect x="40" y="1090" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1132" text-anchor="middle" font-size="16" fill="#475569">Fifteen decisions, each with the answer that goes with it.</text>
  <text x="620" y="1160" text-anchor="middle" font-size="16" fill="#475569">Delivery changes with the client. One option is rejected, and the reason is given with it.</text>
