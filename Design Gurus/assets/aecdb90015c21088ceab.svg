  <text x="320" y="888" text-anchor="middle" font-size="15.5" fill="#6B7280">A signed webhook</text>

  
  <rect x="644" y="285" width="552" height="299" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
