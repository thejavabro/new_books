<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Choose a VPN when the data is sensitive or the network is untrusted, and a proxy when the goal is only to change where requests appear to come from">
  <rect x="0" y="0" width="1240" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="px8-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="px8-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="px8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="545" y1="142" x2="360" y2="204" stroke="#059669" stroke-width="2.5" marker-end="url(#px8-emerald)"/>
  <line x1="695" y1="142" x2="880" y2="204" stroke="#D97706" stroke-width="2.5" marker-end="url(#px8-amber)"/>

  <g filter="url(#px8-soft)">
    <rect x="400" y="50" width="440" height="90" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="140" y="208" width="420" height="100" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="680" y="208" width="420" height="100" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <text x="620" y="88" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Is the data sensitive, or the</text>
  <text x="620" y="118" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">network untrusted?</text>

  <rect x="418" y="156" width="66" height="34" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <text x="451" y="180" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">yes</text>

  <rect x="758" y="156" width="60" height="34" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="788" y="180" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">no</text>

  <text x="350" y="248" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Use a VPN</text>
  <text x="350" y="282" font-size="20" fill="#059669" text-anchor="middle">encrypt everything, cover it all</text>

  <text x="890" y="248" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Use a proxy</text>
  <text x="890" y="282" font-size="20" fill="#D97706" text-anchor="middle">change where requests come from</text>

  <text x="620" y="366" font-size="20" fill="#475569" text-anchor="middle">Both hide where a request came from, only the VPN hides what is inside it</text>
</svg>