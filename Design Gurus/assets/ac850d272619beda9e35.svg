<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img" aria-labelledby="title desc"><title id="title">Compare base, local, and remote values</title><desc id="desc">Compare base, local, and remote values. B = shared base; L = local value; R = remote value. After field-level merging, validate rules that involve several fields.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="795" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Compare base, local, and remote values</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">B = shared base; L = local value; R = remote value.</tspan></text><rect x="50" y="165" width="1100" height="96" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="75" y="204" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="75" dy="0">L = B; R changed</tspan></text><text x="475" y="204" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Only remote changed: use R</tspan></text><rect x="50" y="280" width="1100" height="96" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="75" y="319" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="75" dy="0">R = B; L changed</tspan></text><text x="475" y="319" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Only local changed: keep L</tspan></text><rect x="50" y="395" width="1100" height="96" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="75" y="434" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="75" dy="0">L = R</tspan></text><text x="475" y="434" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Both agree: keep that value</tspan></text><rect x="50" y="510" width="1100" height="96" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="75" y="549" font-size="25" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="75" dy="0">Both differ from B</tspan></text><text x="475" y="549" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="475" dy="0">Different edits: apply a safe merge or preserve a</tspan><tspan x="475" dy="32">conflict</tspan></text><rect x="50" y="640" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="686" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">After field-level merging, validate rules that involve several fields.</tspan></text></g></svg>