<text x="302" y="380" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">5</text>
<circle cx="482" cy="372" r="34" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
<text x="482" y="380" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">6</text>
<circle cx="560" cy="162" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="560" y="169" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">1</text>
<text x="598" y="170" font-size="19.5" fill="#6B7280">queue</text>
<rect x="672" y="132" width="58" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="701" y="170" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">1</text>
<rect x="740" y="132" width="58" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="808" y="132" width="58" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="884" y="158" font-size="20.5" font-weight="600" fill="#111827">round 1, queue size 1</text>
<text x="884" y="186" font-size="19.5" fill="#6B7280">level = [1], add 2 and 3</text>
<circle cx="560" cy="274" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="560" y="281" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">2</text>
<text x="598" y="282" font-size="19.5" fill="#6B7280">queue</text>
<rect x="672" y="244" width="58" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="701" y="282" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">2</text>
<rect x="740" y="244" width="58" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="769" y="282" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">3</text>
<rect x="808" y="244" width="58" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="884" y="270" font-size="20.5" font-weight="600" fill="#111827">round 2, queue size 2</text>
<text x="884" y="298" font-size="19.5" fill="#6B7280">level = [2, 3], add 4, 5, 6</text>
<circle cx="560" cy="386" r="20" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="560" y="393" text-anchor="middle" font-size="20.5" font-weight="600" fill="#4338CA">3</text>
<text x="598" y="394" font-size="19.5" fill="#6B7280">queue</text>
<rect x="672" y="356" width="58" height="60" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="701" y="394" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">4</text>
<rect x="740" y="356" width="58" height="60" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="769" y="394" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">5</text>
<rect x="808" y="356" width="58" height="60" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="837" y="394" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">6</text>
<text x="884" y="382" font-size="20.5" font-weight="600" fill="#111827">round 3, queue size 3</text>
<text x="884" y="410" font-size="19.5" fill="#6B7280">level = [4, 5, 6], then done</text>
<rect x="40" y="488" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="510" width="250" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="189" y="536" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">level 1</text>
<text x="342" y="536" font-size="19.5" fill="#475569">the root, which is the whole first round</text>
<rect x="64" y="558" width="250" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="189" y="584" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">level 2</text>
<text x="342" y="584" font-size="19.5" fill="#475569">both children, measured as a queue of size 2</text>
<rect x="64" y="606" width="250" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="189" y="632" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">level 3</text>
<text x="342" y="632" font-size="19.5" fill="#475569">all three grandchildren, in one final round</text>
<rect x="64" y="654" width="250" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="189" y="680" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">empty slot</text>
<text x="342" y="680" font-size="19.5" fill="#475569">the queue never holds more than one level at a time</text>
</svg>