<path d="M430.3,290.7 L463.7,343.3" stroke="#94A3B8" stroke-width="2.5" fill="none"/>
<circle cx="322" cy="152" r="34" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
<text x="322" y="160" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">1</text>
