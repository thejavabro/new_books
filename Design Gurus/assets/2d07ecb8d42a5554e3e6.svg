</defs>
<rect x="0" y="0" width="1240" height="752" fill="#FFFFFF"/>

<rect x="40" y="64" width="1160" height="400" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">One round of the loop produces exactly one level</text>
