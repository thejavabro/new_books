<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="752" viewBox="0 0 1240 752" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A six node tree walked one level at a time, with the queue measured before each round">
<defs>
