<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rows comparing how a like toggle is counted. The top row shows the broken path: two clicks arrive at once, both read the same state of no reaction, both send a plus one delta, and the count ends one too high. The bottom row shows the working path: a conditional write succeeds only against the version the caller read, so one of the two clicks wins, the write returns the old reaction and the exact delta is known, the service publishes the transition carrying from, to and version, and the consumer applies each version once so a repeated event is dropped.">
  <defs>
    <filter id="yttog-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yttog-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="yttog-k1"><rect x="60" y="165" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="yttog-k2"><rect x="350" y="165" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="yttog-k3"><rect x="640" y="165" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="yttog-k4"><rect x="930" y="165" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="yttog-k5"><rect x="60" y="415" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="yttog-k6"><rect x="350" y="415" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="yttog-k7"><rect x="640" y="415" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="yttog-k8"><rect x="930" y="415" width="250" height="90" rx="12"/></clipPath>
    <marker id="yttog-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="yttog-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Why a toggle needs the previous reaction</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Two clicks arrive together. Reading and then writing loses one of them. A versioned write does not.</text>

  <rect x="40" y="110" width="1160" height="210" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#BE185D">Read, then write: the delta is a guess</text>
  <rect x="40" y="360" width="1160" height="240" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="390" font-size="19.5" font-weight="600" fill="#047857">One conditional, versioned write: the delta is known</text>

  <g fill="none" stroke-width="2">
    <path d="M310 210 H 344" stroke="#DB2777" marker-end="url(#yttog-m-pink)"/>
    <path d="M600 210 H 634" stroke="#DB2777" marker-end="url(#yttog-m-pink)"/>
    <path d="M890 210 H 924" stroke="#DB2777" marker-end="url(#yttog-m-pink)"/>
    <path d="M310 460 H 344" stroke="#059669" marker-end="url(#yttog-m-emerald)"/>
    <path d="M600 460 H 634" stroke="#059669" marker-end="url(#yttog-m-emerald)"/>
    <path d="M890 460 H 924" stroke="#059669" marker-end="url(#yttog-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#yttog-soft)">
    <rect x="60" y="165" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="60" y="165" width="6" height="90" fill="#7C3AED" clip-path="url(#yttog-k1)"/>
  </g>
  <circle cx="98" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,199.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6-6 6 6"/><path d="M6 14l6 6 6-6"/></g>
  <text x="124" y="217" font-size="21.5" font-weight="600" fill="#111827">Two clicks</text>
  <text x="185" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">milliseconds apart</text>
  <g filter="url(#yttog-soft)">
    <rect x="350" y="165" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="350" y="165" width="6" height="90" fill="#64748B" clip-path="url(#yttog-k2)"/>
  </g>
  <circle cx="388" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="414" y="217" font-size="21.5" font-weight="600" fill="#111827">Both read</text>
  <text x="475" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">each sees no reaction</text>
  <g filter="url(#yttog-soft)">
    <rect x="640" y="165" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="640" y="165" width="6" height="90" fill="#D97706" clip-path="url(#yttog-k3)"/>
  </g>
  <circle cx="678" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,199.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="704" y="217" font-size="21.5" font-weight="600" fill="#111827">Both send +1</text>
  <text x="765" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">the delta is guessed</text>
  <g filter="url(#yttog-lift)">
    <rect x="930" y="165" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="930" y="165" width="9" height="90" fill="#DB2777" clip-path="url(#yttog-k4)"/>
  </g>
  <circle cx="968" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,199.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="994" y="217" font-size="21.5" font-weight="600" fill="#111827">Count is wrong</text>
  <text x="1055" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">one like too many</text>
  <g filter="url(#yttog-lift)">
    <rect x="60" y="415" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="60" y="415" width="9" height="90" fill="#059669" clip-path="url(#yttog-k5)"/>
  </g>
  <circle cx="98" cy="460" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,449.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="124" y="467" font-size="21.5" font-weight="600" fill="#111827">Conditional write</text>
  <text x="185" y="534" font-size="18.5" text-anchor="middle" fill="#6B7280">lands only on the</text>
  <text x="185" y="561" font-size="18.5" text-anchor="middle" fill="#94A3B8">version it read</text>
  <g filter="url(#yttog-soft)">
    <rect x="350" y="415" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="350" y="415" width="6" height="90" fill="#4F46E5" clip-path="url(#yttog-k6)"/>
  </g>
  <circle cx="388" cy="460" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,449.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="414" y="467" font-size="21.5" font-weight="600" fill="#111827">Old value back</text>
  <text x="475" y="534" font-size="18.5" text-anchor="middle" fill="#6B7280">the exact delta is known</text>
  <g filter="url(#yttog-soft)">
    <rect x="640" y="415" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="640" y="415" width="6" height="90" fill="#2563EB" clip-path="url(#yttog-k7)"/>
  </g>
  <circle cx="678" cy="460" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,449.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="704" y="467" font-size="21.5" font-weight="600" fill="#111827">Transition sent</text>
  <text x="765" y="534" font-size="18.5" text-anchor="middle" fill="#6B7280">from, to, version</text>
  <g filter="url(#yttog-soft)">
    <rect x="930" y="415" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="930" y="415" width="6" height="90" fill="#059669" clip-path="url(#yttog-k8)"/>
  </g>
  <circle cx="968" cy="460" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,449.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="994" y="467" font-size="21.5" font-weight="600" fill="#111827">Applied once</text>
  <text x="1055" y="534" font-size="18.5" text-anchor="middle" fill="#6B7280">a repeat is dropped</text>

  <rect x="40" y="640" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="665" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="690" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Guessed delta</text>
  <text x="323" y="690" font-size="18.5" fill="#475569">A bare +1 is the wrong number for any toggle, and for any retry.</text>
  <rect x="64" y="715" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Conditional write</text>
  <text x="323" y="740" font-size="18.5" fill="#475569">The write lands only if the row still holds the version the caller read.</text>
  <rect x="64" y="765" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Versioned transition</text>
  <text x="323" y="790" font-size="18.5" fill="#475569">The consumer keeps the last version it applied, so a repeat changes nothing.</text>
</svg>