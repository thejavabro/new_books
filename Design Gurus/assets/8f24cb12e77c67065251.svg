  </g>
  <text x="784" y="536" font-size="18.5" font-weight="600" fill="#111827">Member /orders/ord_7M2K</text>
  <text x="890" y="599" font-size="15.5" text-anchor="middle" fill="#6B7280">one thing to read, change, or remove</text>

  
  <rect x="40" y="650" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="695" text-anchor="middle" font-size="16" fill="#475569">The identifier belongs in the path because it is part of identity, while filters and paging belong after the question mark.</text>
