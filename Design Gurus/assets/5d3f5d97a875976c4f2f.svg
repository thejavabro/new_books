<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="724" viewBox="0 0 1240 724" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="bug3-title bug3-desc">
<title id="bug3-title">Defect three: applying every event</title>
<desc id="bug3-desc">Fulfillment handles offsets correctly, which guarantees duplicates, and then applies every message unconditionally. The state regresses and a second pick ticket ships the order again.</desc>
<defs>
<marker id="bug3-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="bug3-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="bug3-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="bug3-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="724" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Defect three: applying every event</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The fulfillment service got the offset handling right.</text>
<rect x="40" y="646" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="646" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A redelivered PaymentReceived, against an order already shipped</text>
<rect x="40" y="168" width="280" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="180" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">status = 'shipped'</text>
<path d="M326 200H386" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M326 200H386" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bug3-marker-red)"/>
<rect x="396" y="168" width="448" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">UPDATE ... SET status = :s</text>
<path d="M850 200H910" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M850 200H910" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bug3-marker-red)"/>
<rect x="920" y="168" width="280" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1060" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">status = 'paid'</text>
<text x="620" y="258" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">The order has moved backwards into a state the business logic reads as before shipping</text>
<rect x="40" y="286" width="560" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="286" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="64" y="318" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The update has no guard</text><text x="64" y="344" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It sets paid from any prior state, so other</text><text x="64" y="370" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">processes now act as though the order had not shipped.</text>
<rect x="640" y="286" width="560" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="286" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="664" y="318" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The pick ticket is unconditional</text><text x="664" y="344" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Every redelivery produces another, so the warehouse</text><text x="664" y="370" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">ships the same order twice. A human finds this.</text>
<rect x="40" y="412" width="1160" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="412" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="444" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The repair: make the transition legal only from where it is legal</text><text x="64" y="470" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">UPDATE orders SET status = 'paid' WHERE id = :id AND status = 'created'</text><text x="64" y="496" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">if one row was updated, insert the pick ticket into the outbox</text>
<rect x="40" y="540" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="572.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">The pick ticket goes to the outbox rather than the warehouse,</text><text x="64" y="599.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">because calling it directly reintroduces defect one</text>
<text x="66" y="680" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Duplicates are guaranteed to arrive eventually, and the code does nothing about them.</text>
</svg>