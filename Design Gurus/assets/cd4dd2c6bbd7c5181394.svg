<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="PACELC labels for three systems: Cassandra is PA slash EL, MongoDB is PC slash EC and Google Spanner is PC slash EC">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <filter id="cp10-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="380" y="66" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Cassandra</text>
  <text x="710" y="66" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">MongoDB</text>
  <text x="1040" y="66" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Google Spanner</text>

  <text x="200" y="132" font-size="20" font-weight="600" fill="#475569" text-anchor="end">Under a partition</text>
  <text x="200" y="242" font-size="20" font-weight="600" fill="#475569" text-anchor="end">The rest of the time</text>
  <text x="200" y="352" font-size="20" font-weight="600" fill="#475569" text-anchor="end">PACELC label</text>

  <g filter="url(#cp10-soft)">
    <rect x="230" y="90" width="300" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="560" y="90" width="300" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="890" y="90" width="300" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

    <rect x="230" y="200" width="300" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="560" y="200" width="300" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="890" y="200" width="300" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

    <rect x="230" y="310" width="300" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <rect x="560" y="310" width="300" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <rect x="890" y="310" width="300" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>

  <text x="380" y="133" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">stays available</text>
  <text x="710" y="133" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">stays consistent</text>
  <text x="1040" y="133" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">stays consistent</text>

  <text x="380" y="243" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">favours low latency</text>
  <text x="710" y="243" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">favours consistency</text>
  <text x="1040" y="243" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">favours consistency</text>

  <text x="380" y="353" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">PA / EL</text>
  <text x="710" y="353" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">PC / EC</text>
  <text x="1040" y="353" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">PC / EC</text>

  <text x="620" y="440" font-size="20" fill="#475569" text-anchor="middle">Spanner keeps partitions rare and short, so a PC/EC system can still feel available in daily use.</text>
</svg>