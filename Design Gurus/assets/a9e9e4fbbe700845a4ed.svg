<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="936" viewBox="0 0 1240 936" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The ranking runs once and the resulting order is frozen behind a feed id for ten minutes, so page cursors move through positions one to twenty, twenty one to forty, and forty one to sixty. New posts arriving meanwhile raise a separate new post count instead of entering the list, and only an explicit refresh produces a new feed id.">
  <defs>
    <marker id="p3n-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="p3n-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p3n-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>

    <filter id="p3n-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3n-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3n-k1"><rect x="84" y="196" width="170" height="48" rx="10"/></clipPath>
    <clipPath id="p3n-k2"><rect x="274" y="196" width="170" height="48" rx="10"/></clipPath>
    <clipPath id="p3n-k3"><rect x="464" y="196" width="170" height="48" rx="10"/></clipPath>
    <clipPath id="p3n-k4"><rect x="720" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p3n-k5"><rect x="84" y="400" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3n-k6"><rect x="470" y="400" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3n-k7"><rect x="856" y="400" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3n-k8"><rect x="410" y="626" width="420" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="936" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Freeze the order, count the new posts separately</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one frozen order, one counter</text>

  
  <rect x="40" y="126" width="1160" height="190" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Posts that arrive while the reader is scrolling</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">three arrived after the ranking ran</text>

  
  <rect x="40" y="340" width="1160" height="202" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="370" font-size="16.5" font-weight="600" fill="#047857">Frozen order behind feed_91A, for ten minutes</text>
  <text x="1176" y="370" text-anchor="end" font-size="15.5" fill="#6B7280">three pages, one ranking</text>

  
  <rect x="40" y="566" width="1160" height="201" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="596" font-size="16.5" font-weight="600" fill="#1D4ED8">The only way to get a new order</text>
  <text x="1176" y="596" text-anchor="end" font-size="15.5" fill="#6B7280">a new feed id every time</text>

  
  <g fill="none" stroke-width="2">
    <path d="M634,220 H720" stroke="#DB2777" stroke-width="2.5" marker-end="url(#p3n-pm)"/>
    <path d="M384,445 H470" stroke="#059669" marker-end="url(#p3n-em)"/>
    <path d="M770,445 H856" stroke="#059669" marker-end="url(#p3n-em)"/>
    <path d="M700,490 V518 Q700,530 688,530 H632 Q620,530 620,542 V626" stroke="#2563EB" stroke-width="2.5" marker-end="url(#p3n-bm)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="672" y="203" text-anchor="middle" fill="#BE185D">counted</text>
    <text x="427" y="428" text-anchor="middle" fill="#047857">next page</text>
    <text x="813" y="428" text-anchor="middle" fill="#047857">next page</text>
    <text x="636" y="558" fill="#1D4ED8">an explicit refresh</text>
  </g>

  
  <g filter="url(#p3n-soft)">
    <rect x="84" y="196" width="170" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="196" width="6" height="48" fill="#DB2777" clip-path="url(#p3n-k1)"/>
  </g>
  <circle cx="118" cy="220" r="4.5" fill="#DB2777"/>
  <text x="142" y="227" font-size="18.5" font-weight="600" fill="#111827">new post</text>

  <g filter="url(#p3n-soft)">
    <rect x="274" y="196" width="170" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="274" y="196" width="6" height="48" fill="#DB2777" clip-path="url(#p3n-k2)"/>
  </g>
  <circle cx="308" cy="220" r="4.5" fill="#DB2777"/>
  <text x="332" y="227" font-size="18.5" font-weight="600" fill="#111827">new post</text>

  <g filter="url(#p3n-soft)">
    <rect x="464" y="196" width="170" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="464" y="196" width="6" height="48" fill="#DB2777" clip-path="url(#p3n-k3)"/>
  </g>
  <circle cx="498" cy="220" r="4.5" fill="#DB2777"/>
  <text x="522" y="227" font-size="18.5" font-weight="600" fill="#111827">new post</text>

  
  <g filter="url(#p3n-lift)">
    <rect x="720" y="175" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="720" y="175" width="9" height="90" fill="#DB2777" clip-path="url(#p3n-k4)"/>
  </g>
  <circle cx="758" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,209.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="784" y="227" font-size="18.5" font-weight="600" fill="#111827">new_post_count: 3</text>
  <text x="890" y="290" font-size="15.5" text-anchor="middle" fill="#6B7280">not inserted into the list</text>

  
  <g filter="url(#p3n-soft)">
    <rect x="84" y="400" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="400" width="6" height="90" fill="#059669" clip-path="url(#p3n-k5)"/>
  </g>
  <circle cx="122" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,434.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="148" y="452" font-size="18.5" font-weight="600" fill="#111827">positions 1 to 20</text>
  <text x="234" y="515" font-size="15.5" text-anchor="middle" fill="#6B7280">page 1</text>

  
  <g filter="url(#p3n-soft)">
    <rect x="470" y="400" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="470" y="400" width="6" height="90" fill="#059669" clip-path="url(#p3n-k6)"/>
  </g>
  <circle cx="508" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,434.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="534" y="452" font-size="18.5" font-weight="600" fill="#111827">positions 21 to 40</text>
  <text x="620" y="515" font-size="15.5" text-anchor="middle" fill="#6B7280">page 2</text>

  
  <g filter="url(#p3n-soft)">
    <rect x="856" y="400" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="856" y="400" width="6" height="90" fill="#059669" clip-path="url(#p3n-k7)"/>
  </g>
  <circle cx="894" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(883.56,434.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="920" y="452" font-size="18.5" font-weight="600" fill="#111827">positions 41 to 60</text>
  <text x="1006" y="515" font-size="15.5" text-anchor="middle" fill="#6B7280">page 3</text>

  
  <g filter="url(#p3n-lift)">
    <rect x="410" y="626" width="420" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="410" y="626" width="9" height="90" fill="#2563EB" clip-path="url(#p3n-k8)"/>
  </g>
  <circle cx="448" cy="671" r="18" fill="#FFFFFF"/>
  <g transform="translate(437.56,660.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 1 1-2.49-6.01"/>
    <path d="M20.5 4v4.5H16"/>
  </g>
  <text x="474" y="678" font-size="18.5" font-weight="600" fill="#111827">Refresh starts a new read</text>
  <text x="620" y="741" font-size="15.5" text-anchor="middle" fill="#6B7280">a new feed id and a new ranking</text>

  
  <rect x="40" y="792" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="834" text-anchor="middle" font-size="16" fill="#475569">An expired cursor returns 410 feed_expired, so a stale order is never continued.</text>
  <text x="620" y="862" text-anchor="middle" font-size="16" fill="#475569">Rows never move under a person who is reading.</text>
</svg>