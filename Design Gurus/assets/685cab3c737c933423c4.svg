<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="where-title where-desc">
<title id="where-title">Compute is rarely the dominant term</title>
<desc id="where-desc">Data transfer, storage after replication and backups, the managed-service premium and observability regularly exceed compute, which is the term most teams optimize first. Unused capacity appears in every cost audit.</desc>
<defs>
<marker id="where-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="where-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="where-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="where-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="750" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Compute is rarely the dominant term</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four categories regularly cost more than people expect.</text>
<rect x="40" y="672" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="672" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Roughly how a surprising bill breaks down</text>
<rect x="40" y="168" width="290" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="185" y="204" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Data transfer</text>
<rect x="350" y="181" width="360" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="350" y="181" width="324.0" height="34" rx="10" fill="#F25461"/>
<rect x="730" y="168" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="750" y="191.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">out to the internet costs an order of</text><text x="750" y="216.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">magnitude more than cross-zone</text>
<rect x="40" y="240" width="290" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="185" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Storage, multiplied</text>
<rect x="350" y="253" width="360" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="350" y="253" width="270.0" height="34" rx="10" fill="#E8BC60"/>
<rect x="730" y="240" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="750" y="263.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">logical size x replication, plus</text><text x="750" y="288.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">snapshots, backups and logs</text>
<rect x="40" y="312" width="290" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="185" y="348" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Managed services</text>
<rect x="350" y="325" width="360" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="350" y="325" width="216.0" height="34" rx="10" fill="#E8BC60"/>
<rect x="730" y="312" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="750" y="335.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a multiple of the raw instances</text><text x="750" y="360.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">underneath, usually worth paying</text>
<rect x="40" y="384" width="290" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="185" y="420" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Observability</text>
<rect x="350" y="397" width="360" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="350" y="397" width="162.0" height="34" rx="10" fill="#7650D6"/>
<rect x="730" y="384" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="750" y="407.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">metric cost scales with cardinality,</text><text x="750" y="432.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not volume</text>
<rect x="40" y="456" width="290" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="185" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Compute</text>
<rect x="350" y="469" width="360" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="350" y="469" width="108.0" height="34" rx="10" fill="#06AC80"/>
<rect x="730" y="456" width="470" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="750" y="492" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the one everybody optimizes first</text>
<rect x="40" y="540" width="1160" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="64" y="573" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">And the category that appears in every audit</text><text x="64" y="599" font-size="20" font-weight="400" fill="#A83147" text-anchor="start">Capacity nobody is using: finished migrations, test environments, detached volumes.</text><text x="64" y="625" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Not an engineering problem, and reliably a significant fraction of the bill.</text>
<text x="66" y="706" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The intuition that compute dominates sends optimization effort to the smallest number.</text>
</svg>