<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="838" viewBox="0 0 1240 838" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="signal-title signal-desc">
<title id="signal-title">Knowing you are overloaded</title>
<desc id="signal-desc">The four common overload signals are not equally good. Queue wait time is the best, and it produces the rule that work nobody is waiting for should be dropped first.</desc>
<defs>
<marker id="signal-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="signal-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="signal-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="signal-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="838" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Knowing you are overloaded</text>
<text x="40" y="86" font-size="21" fill="#4A5568">All of this requires knowing you are overloaded, and the common signals are not equally good.</text>
<rect x="40" y="760" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="760" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="860" y="140" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">how useful</text>
<rect x="40" y="150" width="380" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="230" y="186" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">CPU utilization</text>
<rect x="440" y="150" width="400" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="460" y="173.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">lagging, and frequently not the</text><text x="460" y="198.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">bottleneck at all</text>
<rect x="860" y="167" width="240" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="860" y="167" width="48.0" height="26" rx="10" fill="#F25461"/>
<rect x="40" y="220" width="380" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="230" y="256" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Request rate against a limit</text>
<rect x="440" y="220" width="400" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="460" y="243.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">simple, and wrong whenever</text><text x="460" y="268.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">requests differ in cost</text>
<rect x="860" y="237" width="240" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="860" y="237" width="108.0" height="26" rx="10" fill="#E8BC60"/>
<rect x="40" y="290" width="380" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="230" y="326" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Concurrency, requests in flight</text>
<rect x="440" y="290" width="400" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="460" y="313.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">captures arrival rate and how</text><text x="460" y="338.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">long things are taking</text>
<rect x="860" y="307" width="240" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="860" y="307" width="192.0" height="26" rx="10" fill="#159BEF"/>
<rect x="40" y="360" width="380" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="230" y="396" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Queue depth or wait time</text>
<rect x="440" y="360" width="400" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="460" y="383.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a queue growing is the</text><text x="460" y="408.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">definition of the problem</text>
<rect x="860" y="377" width="240" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="860" y="377" width="240.0" height="26" rx="10" fill="#06AC80"/>
<rect x="40" y="440" width="1160" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="440" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="472" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The strongest rule comes from wait time, not length</text><text x="64" y="498" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">If a request has waited longer than the client's timeout, doing the work is pure</text><text x="64" y="524" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">waste, because nobody is listening. Dropping those first costs nothing.</text>
<rect x="40" y="564" width="1160" height="74" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="593.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Deadline propagation: each service passes down the remaining time,</text><text x="620" y="620.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and anything seeing a deadline already past fails before starting work</text>
<rect x="40" y="658" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="658" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="689" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">An unbounded queue accepts work it will never complete</text><text x="64" y="715" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A bounded queue that rejects when full is shedding, for one configuration value.</text>
<text x="66" y="794" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">In an overloaded system much of the work in progress is for requests that have already given up.</text>
</svg>