    <clipPath id="p46-k2"><rect x="460" y="190" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p46-k3"><rect x="844" y="190" width="320" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="502" fill="#FFFFFF"/>

  
