  <rect x="40" y="386" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="431" text-anchor="middle" font-size="16" fill="#475569">A short answer is not a vague answer. It is the same contract, said faster.</text>
