<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="502" viewBox="0 0 1240 502" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three parts of a good rapid-fire answer, each phrased as the question to ask yourself afterward: did I state the actual distinction, did I say what the caller does next, and if this was a choice, did I name what it gives up.">
