  <text x="236" y="305" text-anchor="middle" font-size="15.5" fill="#6B7280">Did I state the actual distinction?</text>

  
  <g filter="url(#p46-soft)">
    <rect x="460" y="190" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
