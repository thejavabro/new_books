  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">three parts</text>

  
  <rect x="40" y="126" width="1160" height="228" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Each part, and the question to ask yourself afterward</text>

  
