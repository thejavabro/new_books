<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="628" viewBox="0 0 1240 628" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The sender computes a digest before transmitting, one bit flips in transit, and the receiver recomputes the digest and gets a completely different value, so the corruption is caught">
  <rect x="0" y="0" width="1240" height="628" fill="#FFFFFF"/>
  <defs>
    <marker id="st3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One bit changes, and the digest changes beyond recognition</text>

  <line x1="374" y1="200" x2="436" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#st3-slate)"/>
  <line x1="744" y1="200" x2="806" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#st3-slate)"/>

  <rect x="50" y="150" width="320" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="210" y="188" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Sender</text>
  <text x="210" y="222" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">sha256 = 9f2c4a</text>

  <rect x="440" y="150" width="300" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="590" y="188" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">In transit</text>
  <text x="590" y="222" font-size="20" fill="#B91C1C" text-anchor="middle">one bit flips</text>

  <rect x="810" y="150" width="340" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="980" y="188" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Receiver recomputes</text>
  <text x="980" y="222" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">sha256 = 41be07</text>

  <rect x="50" y="304" width="1100" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="600" y="346" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">9f2c4a does not equal 41be07, so the transfer is rejected and retried.</text>

  <rect x="50" y="404" width="1100" height="106" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="600" y="442" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A good digest has the avalanche property: flip one input bit and about half the</text>
  <text x="600" y="472" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">output bits change. There is no such thing as a nearly matching hash.</text>

  <text x="600" y="562" font-size="20" fill="#334155" text-anchor="middle">This is why storage systems keep a checksum beside every object and verify it on read.</text>
</svg>