<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="468" viewBox="0 0 1240 468" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="During a partition a system that chooses consistency refuses the request or holds it, so the user sees an error or a long wait and never a wrong value. A system that chooses availability answers from its own copy, so the user always gets a response and that response may be old.">
  <rect x="0" y="0" width="1240" height="468" fill="#FFFFFF"/>
  <defs>
    <marker id="cp4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cp4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cp4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cp4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="cp4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="cp4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="cp4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="cp4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="cp4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">What each choice looks like to the user, during a partition</text>
  <rect x="24" y="70" width="588" height="310" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="110" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">It chooses consistency</text>
  <g filter="url(#cp4-soft)"><rect x="52" y="146" width="130" height="72" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="117" y="190" font-size="19" fill="#0F172A" text-anchor="middle">user</text>
  <line x1="186" y1="182" x2="214" y2="182" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#cp4-s)"/>
  <g filter="url(#cp4-soft)"><rect x="218" y="146" width="150" height="72" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="293" y="190" font-size="19" font-weight="700" fill="#1E40AF" text-anchor="middle">node</text>
  <line x1="372" y1="182" x2="400" y2="182" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#cp4-b)"/>
  <g filter="url(#cp4-soft)"><rect x="404" y="146" width="150" height="72" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="479" y="178" font-size="19" fill="#1E40AF" text-anchor="middle">error,</text>
  <text x="479" y="204" font-size="19" fill="#1E40AF" text-anchor="middle">or a long wait</text>
  <text x="293" y="250" font-size="18" fill="#64748B" text-anchor="middle">cut off from</text>
  <text x="293" y="274" font-size="18" fill="#64748B" text-anchor="middle">the other side</text>
  <text x="318" y="322" font-size="19" fill="#0F172A" text-anchor="middle">Nobody ever reads a wrong value.</text>
  <text x="318" y="350" font-size="19" fill="#64748B" text-anchor="middle">Some users get nothing at all.</text>
  <rect x="628" y="70" width="588" height="310" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="110" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle">It chooses availability</text>
  <g filter="url(#cp4-soft)"><rect x="656" y="146" width="130" height="72" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="721" y="190" font-size="19" fill="#0F172A" text-anchor="middle">user</text>
  <line x1="790" y1="182" x2="818" y2="182" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#cp4-s)"/>
  <g filter="url(#cp4-soft)"><rect x="822" y="146" width="150" height="72" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="897" y="190" font-size="19" font-weight="700" fill="#B45309" text-anchor="middle">node</text>
  <line x1="976" y1="182" x2="1004" y2="182" stroke="#D97706" stroke-width="2.2" marker-end="url(#cp4-a)"/>
  <g filter="url(#cp4-soft)"><rect x="1008" y="146" width="150" height="72" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/></g>
  <text x="1083" y="178" font-size="19" fill="#B45309" text-anchor="middle">X = 1</text>
  <text x="1083" y="204" font-size="19" fill="#B45309" text-anchor="middle">(may be old)</text>
  <text x="897" y="250" font-size="18" fill="#64748B" text-anchor="middle">cut off, answers</text>
  <text x="897" y="274" font-size="18" fill="#64748B" text-anchor="middle">from its own copy</text>
  <text x="922" y="322" font-size="19" fill="#0F172A" text-anchor="middle">Every user gets an answer.</text>
  <text x="922" y="350" font-size="19" fill="#64748B" text-anchor="middle">Two users can see different values.</text>
  <rect x="24" y="396" width="1192" height="52" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="429" font-size="19" fill="#64748B" text-anchor="middle">Neither one is better in general. An error is right for a bank balance, and wrong for a view count.</text>
</svg>