<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The list with the zeros marked">
<defs>
<filter id="mn-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Replace each stretch between zeros with its total</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The list starts and ends with a zero, so every stretch is closed by one</text>
<rect x="40" y="106" width="1160" height="488" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Grey is a zero, which is a boundary rather than a value</text>
<text x="134" y="276" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the list</text>
<rect x="158" y="238" width="75" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="195.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="243" y="238" width="75" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="280.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="328" y="238" width="75" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="365.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="413" y="238" width="75" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="450.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="498" y="238" width="75" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="535.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="583" y="238" width="75" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="668" y="238" width="75" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="705.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="753" y="238" width="75" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="790.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="838" y="238" width="75" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="875.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="923" y="238" width="75" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="960.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="1008" y="238" width="75" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="1045.5" y="275.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="290" y="352" width="660" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="385.02" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">running sum: 0</text>
<text x="134" y="466" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the new list</text>
<text x="164" y="466" font-size="18" fill="#475569">nothing yet</text>
<text x="620" y="534" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">One running sum is the entire state, and every zero resets it</text>
<rect x="40" y="606" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="646" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A zero means: finish the stretch and start a new one</text>
<text x="620" y="678" text-anchor="middle" font-size="18.5" fill="#475569">So a single pass carrying one number is enough, with no need to look ahead</text>
</svg>