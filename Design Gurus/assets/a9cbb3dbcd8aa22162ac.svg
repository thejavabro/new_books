  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Monolith scaling: why resource usage becomes inefficient</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each new instance is a full copy of the application, including the modules that did not need more capacity.</text>

