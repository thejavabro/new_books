<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Preparation priorities vary by role. Confirm the expected depth.">
  <defs>

    <filter id="m1l1b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l1b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>


  <rect x="50" y="62" width="300" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="98" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">Software engineer</text>
  <rect x="374" y="62" width="190" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="469" y="98" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">forms 2, 3, sometimes 1</text>
  <text x="590" y="100" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">architecture, serving, cost, failure handling</text>
  <rect x="50" y="140" width="300" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="176" text-anchor="middle" font-size="16.5" font-weight="600" fill="#5B21B6">ML engineer</text>
  <rect x="374" y="140" width="190" height="60" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="469" y="176" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">forms 1, 2, 5</text>
  <text x="590" y="178" font-size="15.5" font-weight="600" text-anchor="start" fill="#5B21B6">system design plus models, features, training, and metrics</text>
  <rect x="50" y="218" width="300" height="60" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="200" y="254" text-anchor="middle" font-size="16.5" font-weight="600" fill="#4338CA">AI platform engineer</text>
  <rect x="374" y="218" width="190" height="60" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="469" y="254" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">forms 2, 4, 5</text>
  <text x="590" y="256" font-size="15.5" font-weight="600" text-anchor="start" fill="#4338CA">serving: GPUs, batching, caching, and latency under load</text>
  <rect x="50" y="296" width="300" height="60" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="332" text-anchor="middle" font-size="16.5" font-weight="600" fill="#047857">Manager, staff and up</text>
  <rect x="374" y="296" width="190" height="60" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="469" y="332" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">forms 3, 5</text>
  <text x="590" y="334" font-size="15.5" font-weight="600" text-anchor="start" fill="#047857">build versus buy, cost limits, risk, and gradual rollout</text>
  <rect x="40" y="386" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="420" font-size="16" fill="#475569">These are preparation guidelines. Confirm the expected depth for the role and question.</text>
  <rect x="64" y="446" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="468" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">A common mistake</text>
  <text x="288" y="468" font-size="15.5" fill="#475569">discussing model research instead of the requested system design</text>
  <rect x="64" y="490" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="512" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The time trade-off</text>
  <text x="288" y="512" font-size="15.5" fill="#475569">too much model detail leaves less time for the rest of the system</text>
  <rect x="64" y="534" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="556" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Just ask</text>
  <text x="288" y="556" font-size="15.5" fill="#475569">"Should I focus on model development or serving architecture?"</text>
</svg>