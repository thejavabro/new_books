<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Step 1, the load balancer receives a request from a client. Step 2, it chooses a server with its algorithm. Step 3, it forwards the request. Step 4, the server processes it and responds. Step 5, the load balancer returns the response to the client.">
  <defs>
    <filter id="ld2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ld2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ld2-k1"><rect x="40" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ld2-k2"><rect x="281" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ld2-k3"><rect x="522" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ld2-k4"><rect x="763" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="ld2-k5"><rect x="1004" y="140" width="196" height="90" rx="12"/></clipPath>
    <marker id="ld2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a load balancer handles one request</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same five steps run for every request.</text>



  <g fill="none" stroke-width="2">
    <path d="M236,185 H281" stroke="#64748B" marker-end="url(#ld2-m-slate)"/>
    <path d="M477,185 H522" stroke="#64748B" marker-end="url(#ld2-m-slate)"/>
    <path d="M718,185 H763" stroke="#64748B" marker-end="url(#ld2-m-slate)"/>
    <path d="M959,185 H1004" stroke="#64748B" marker-end="url(#ld2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ld2-soft)">
    <rect x="40" y="140" width="196" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ld2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">1. Receive</text>
  <text x="138" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">a request from</text>
  <text x="138" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">a client</text>
  <g filter="url(#ld2-lift)">
    <rect x="281" y="140" width="196" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="281" y="140" width="9" height="90" fill="#2563EB" clip-path="url(#ld2-k2)"/>
  </g>
  <circle cx="319" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(308.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="345" y="192" font-size="21.5" font-weight="600" fill="#111827">2. Choose</text>
  <text x="379" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">a server, using</text>
  <text x="379" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">the algorithm</text>
  <g filter="url(#ld2-soft)">
    <rect x="522" y="140" width="196" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="522" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ld2-k3)"/>
  </g>
  <circle cx="560" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(549.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="586" y="192" font-size="21.5" font-weight="600" fill="#111827">3. Forward</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the request to</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">that server</text>
  <g filter="url(#ld2-soft)">
    <rect x="763" y="140" width="196" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="763" y="140" width="6" height="90" fill="#059669" clip-path="url(#ld2-k4)"/>
  </g>
  <circle cx="801" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(790.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="827" y="192" font-size="21.5" font-weight="600" fill="#111827">4. Process</text>
  <text x="861" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the server builds</text>
  <text x="861" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">the response</text>
  <g filter="url(#ld2-soft)">
    <rect x="1004" y="140" width="196" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="1004" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ld2-k5)"/>
  </g>
  <circle cx="1042" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(1031.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1068" y="192" font-size="21.5" font-weight="600" fill="#111827">5. Return</text>
  <text x="1102" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the response to</text>
  <text x="1102" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">the client</text>

  <rect x="40" y="330" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Client view</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">the client talks only to the load balancer, never to a server directly</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Algorithm</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">decides which server gets each request</text>
</svg>