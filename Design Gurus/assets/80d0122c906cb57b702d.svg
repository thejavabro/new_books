<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for a multi tenant notification service: deliver over email, SMS, push and in-app, both immediately and on a schedule, with retries; and check user preferences, isolate tenants, and render from templates">
  <defs>
    <filter id="ntff-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ntff-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ntff-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ntff-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ntff-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ntff-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ntff-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ntff-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Notification service: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the system has to do. Split into getting a message out, and deciding whether it should go at all.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Getting a notification out</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">Deciding whether it should go</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ntff-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#ntff-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Four channels</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">email, SMS, push, in-app</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">one event can use several</text>
  <g filter="url(#ntff-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#ntff-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Now or scheduled</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">event driven, or held</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">for a future time</text>
  <g filter="url(#ntff-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#D97706" clip-path="url(#ntff-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Retry on failure</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a provider outage must not</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">lose the notification</text>
  <g filter="url(#ntff-lift)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="80" y="430" width="9" height="90" fill="#059669" clip-path="url(#ntff-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">User preferences</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">opt outs and quiet hours,</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">checked before sending</text>
  <g filter="url(#ntff-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#64748B" clip-path="url(#ntff-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Tenant isolation</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a tenant can only reach</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">its own users</text>
  <g filter="url(#ntff-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#ntff-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Templates</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">each tenant defines its own</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">wording per notification type</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Tenant</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">one client application using the shared service; its data and its users are never visible to another</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Channel</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">the medium. All four are treated equally, so nothing is prioritised over anything else</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Opt-out</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">a user veto that the service checks itself, so no tenant can send past it</text>
</svg>