<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="704" viewBox="0 0 1240 704" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three orders created in the same second. A cursor that stores only the timestamp cannot tell which of the equal rows was already returned, so a later page repeats one and skips another. Ending the sort with the unique id gives every item one deterministic position.">
  <defs>
    <filter id="xl08tiebrea-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl08tiebrea-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl08tiebrea-k1"><rect x="84" y="230" width="200" height="48" rx="10"/></clipPath>
    <clipPath id="xl08tiebrea-k2"><rect x="84" y="294" width="200" height="48" rx="10"/></clipPath>
    <clipPath id="xl08tiebrea-k3"><rect x="84" y="358" width="200" height="48" rx="10"/></clipPath>
    <clipPath id="xl08tiebrea-k4"><rect x="84" y="448" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl08tiebrea-k5"><rect x="684" y="230" width="200" height="48" rx="10"/></clipPath>
    <clipPath id="xl08tiebrea-k6"><rect x="684" y="294" width="200" height="48" rx="10"/></clipPath>
    <clipPath id="xl08tiebrea-k7"><rect x="684" y="358" width="200" height="48" rx="10"/></clipPath>
    <clipPath id="xl08tiebrea-k8"><rect x="684" y="448" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="704" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three rows, one timestamp, and a cursor that cannot tell them apart</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">three orders created in the same second</text>

  
  <rect x="40" y="126" width="556" height="428" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="84" y="156" font-size="16.5" font-weight="600" fill="#BE185D">sort: created_at descending</text>
  <text x="84" y="178" font-size="15.5" fill="#6B7280">the cursor stores the timestamp only</text>

  <text x="84" y="216" font-size="15.5" fill="#94A3B8">order id</text>
  <text x="330" y="216" font-size="15.5" fill="#94A3B8">created_at</text>

  <g filter="url(#xl08tiebrea-soft)">
    <rect x="84" y="230" width="200" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="230" width="6" height="48" fill="#DB2777" clip-path="url(#xl08tiebrea-k1)"/>
  </g>
  <circle cx="118" cy="254" r="4.5" fill="#DB2777"/>
  <text x="142" y="261" font-size="18.5" font-weight="600" fill="#111827">ord_91P</text>
  <text x="330" y="261" font-size="15.5" fill="#6B7280">12:04:07</text>

  <g filter="url(#xl08tiebrea-soft)">
    <rect x="84" y="294" width="200" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="294" width="6" height="48" fill="#DB2777" clip-path="url(#xl08tiebrea-k2)"/>
  </g>
  <circle cx="118" cy="318" r="4.5" fill="#DB2777"/>
  <text x="142" y="325" font-size="18.5" font-weight="600" fill="#111827">ord_42Q</text>
  <text x="330" y="325" font-size="15.5" fill="#6B7280">12:04:07</text>

  <g filter="url(#xl08tiebrea-soft)">
    <rect x="84" y="358" width="200" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="358" width="6" height="48" fill="#DB2777" clip-path="url(#xl08tiebrea-k3)"/>
  </g>
  <circle cx="118" cy="382" r="4.5" fill="#DB2777"/>
  <text x="142" y="389" font-size="18.5" font-weight="600" fill="#111827">ord_7M2K</text>
  <text x="330" y="389" font-size="15.5" fill="#6B7280">12:04:07</text>

  <text x="330" y="430" font-size="15.5" fill="#94A3B8">all three values are equal</text>

  <g filter="url(#xl08tiebrea-lift)">
    <rect x="84" y="448" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="448" width="9" height="48" fill="#DB2777" clip-path="url(#xl08tiebrea-k4)"/>
  </g>
  <circle cx="118" cy="472" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,463) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="142" y="479" font-size="18.5" font-weight="600" fill="#111827">The cursor says "start after 12:04:07".</text>
  <text x="320" y="521" font-size="15.5" text-anchor="middle" fill="#6B7280">A later page can repeat one row and skip another.</text>

  
  <rect x="644" y="126" width="556" height="428" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="156" font-size="16.5" font-weight="600" fill="#047857">sort: created_at descending, id descending</text>
  <text x="684" y="178" font-size="15.5" fill="#6B7280">the cursor stores the timestamp and the id</text>

  <text x="684" y="216" font-size="15.5" fill="#94A3B8">order id</text>
  <text x="916" y="216" font-size="15.5" fill="#94A3B8">created_at</text>
  <text x="1032" y="216" font-size="15.5" fill="#94A3B8">cursor position</text>

  <g filter="url(#xl08tiebrea-soft)">
    <rect x="684" y="230" width="200" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="230" width="6" height="48" fill="#059669" clip-path="url(#xl08tiebrea-k5)"/>
  </g>
  <circle cx="718" cy="254" r="4.5" fill="#059669"/>
  <text x="742" y="261" font-size="18.5" font-weight="600" fill="#111827">ord_91P</text>
  <text x="916" y="261" font-size="15.5" fill="#6B7280">12:04:07</text>
  <text x="1032" y="261" font-size="15.5" fill="#6B7280">position 1</text>

  <g filter="url(#xl08tiebrea-soft)">
    <rect x="684" y="294" width="200" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="294" width="6" height="48" fill="#059669" clip-path="url(#xl08tiebrea-k6)"/>
  </g>
  <circle cx="718" cy="318" r="4.5" fill="#059669"/>
  <text x="742" y="325" font-size="18.5" font-weight="600" fill="#111827">ord_7M2K</text>
  <text x="916" y="325" font-size="15.5" fill="#6B7280">12:04:07</text>
  <text x="1032" y="325" font-size="15.5" fill="#6B7280">position 2</text>

  <g filter="url(#xl08tiebrea-soft)">
    <rect x="684" y="358" width="200" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="358" width="6" height="48" fill="#059669" clip-path="url(#xl08tiebrea-k7)"/>
  </g>
  <circle cx="718" cy="382" r="4.5" fill="#059669"/>
  <text x="742" y="389" font-size="18.5" font-weight="600" fill="#111827">ord_42Q</text>
  <text x="916" y="389" font-size="15.5" fill="#6B7280">12:04:07</text>
  <text x="1032" y="389" font-size="15.5" fill="#6B7280">position 3</text>

  <text x="916" y="430" font-size="15.5" fill="#94A3B8">the id breaks the tie</text>

  <g filter="url(#xl08tiebrea-lift)">
    <rect x="684" y="448" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="448" width="9" height="48" fill="#059669" clip-path="url(#xl08tiebrea-k8)"/>
  </g>
  <circle cx="718" cy="472" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,463) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="742" y="479" font-size="18.5" font-weight="600" fill="#111827">It says "start after (12:04:07, ord_7M2K)".</text>
  <text x="920" y="521" font-size="15.5" text-anchor="middle" fill="#6B7280">Every item has exactly one position.</text>

  
  <rect x="40" y="588" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="633" text-anchor="middle" font-size="16" fill="#475569">The id is a deterministic tie-breaker, not a claim that id order carries business meaning.</text>
</svg>