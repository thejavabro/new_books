<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="722" viewBox="0 0 1240 722" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="assume-title assume-desc">
<title id="assume-title">How to state an assumption</title>
<desc id="assume-desc">The form is: I am assuming X, and if it were Y instead I would change Z. The first clause makes the assumption visible, and the second shows it really affects the design. An unstated assumption cannot be told apart from an unnoticed ambiguity.</desc>
<defs>
<marker id="assume-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="assume-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="assume-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="assume-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="722" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">How to state an assumption</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The second part is what makes it a senior move rather than a guess.</text>
<rect x="40" y="644" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="644" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="206" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="70" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The form</text>
<rect x="70" y="174" width="352" height="70" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="246" y="215" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"I am assuming X."</text>
<rect x="444" y="174" width="352" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="201.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"If it were Y instead,</text><text x="620" y="228.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">I would change Z."</text>
<rect x="818" y="174" width="352" height="70" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="994" y="215" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">And then carry on.</text>
<text x="246" y="272" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">makes it visible</text>
<text x="620" y="272" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">makes it a senior move</text>
<text x="994" y="272" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">no permission needed</text>
<text x="620" y="302" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">The second clause shows the assumption really affects the design, and that you know how.</text>
<text x="40" y="366" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Stated</text>
<rect x="40" y="384" width="560" height="130" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="384" width="5" height="130" rx="2.5" fill="#39D5AA"/><text x="64" y="414.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"I am assuming a global user base,</text><text x="64" y="441.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">so I am designing for multi-region</text><text x="64" y="468.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">reads. If it were one country, I would</text><text x="64" y="495.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">drop that and keep one region."</text>
<text x="640" y="366" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Unstated</text>
<rect x="640" y="384" width="560" height="130" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="384" width="5" height="130" rx="2.5" fill="#F28B9D"/><text x="664" y="416" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Indistinguishable from not having</text><text x="664" y="442" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">noticed the ambiguity at all.</text><text x="664" y="468" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">An assumption nobody heard</text><text x="664" y="494" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">does not count.</text>
<rect x="40" y="538" width="1160" height="80" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="538" width="5" height="80" rx="2.5" fill="#F3CF6A"/><text x="64" y="569.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">When an interviewer contradicts your assumption, they are checking</text><text x="64" y="598.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">whether you meant the second half of the sentence.</text>
<text x="66" y="678" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">State it, say what it affects, and move on. You do not need the interviewer to approve it.</text>
</svg>