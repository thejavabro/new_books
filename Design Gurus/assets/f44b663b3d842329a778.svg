<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1118" viewBox="0 0 1240 1118" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The published webhook retry schedule used by this course: an initial attempt, then retries after one minute, five minutes, thirty minutes, two hours, eight hours, and twenty-four hours, after which the delivery is marked failed. Every attempt carries the same event id.">
  <defs>
    <marker id="pj-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="pj-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="pj-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pj-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pj-k1"><rect x="76" y="202" width="210" height="48" rx="10"/></clipPath>
    <clipPath id="pj-k2"><rect x="76" y="360" width="210" height="48" rx="10"/></clipPath>
    <clipPath id="pj-k3"><rect x="76" y="428" width="210" height="48" rx="10"/></clipPath>
    <clipPath id="pj-k4"><rect x="76" y="496" width="210" height="48" rx="10"/></clipPath>
    <clipPath id="pj-k5"><rect x="76" y="564" width="210" height="48" rx="10"/></clipPath>
    <clipPath id="pj-k6"><rect x="76" y="632" width="210" height="48" rx="10"/></clipPath>
    <clipPath id="pj-k7"><rect x="76" y="700" width="210" height="48" rx="10"/></clipPath>
    <clipPath id="pj-k8"><rect x="76" y="858" width="210" height="72" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1118" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">A published retry schedule, not "we retry failures"</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">seven attempts, then one terminal state</text>

  
  <text x="76" y="138" font-size="15.5" font-weight="600" fill="#64748B">Attempt</text>
  <text x="326" y="138" font-size="15.5" font-weight="600" fill="#64748B">Sent after</text>
  <text x="576" y="138" font-size="15.5" font-weight="600" fill="#64748B">What is true at this point</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M620,270 V314" stroke="#D97706" marker-end="url(#pj-am)"/>
    <path d="M620,768 V812" stroke="#DB2777" marker-end="url(#pj-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="644" y="297" fill="#B45309">no 2xx within the deadline</text>
    <text x="644" y="795" fill="#BE185D">no 2xx after the last retry</text>
  </g>

  
  <rect x="40" y="156" width="1160" height="112" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="186" font-size="16.5" font-weight="600" fill="#1D4ED8">The first delivery attempt</text>
  <text x="1176" y="186" text-anchor="end" font-size="15.5" fill="#6B7280">one attempt</text>

  <g filter="url(#pj-soft)">
    <rect x="76" y="202" width="210" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="202" width="6" height="48" fill="#2563EB" clip-path="url(#pj-k1)"/>
  </g>
  <circle cx="110" cy="226" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,217) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="134" y="233" font-size="18.5" font-weight="600" fill="#111827">Initial</text>
  <rect x="326" y="210" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="426" y="231" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">immediately</text>
  <text x="576" y="233" font-size="15.5" fill="#6B7280">The event exists and carries id evt_91P</text>

  
  <rect x="40" y="314" width="1160" height="452" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="344" font-size="16.5" font-weight="600" fill="#B45309">Automatic retries, on a published schedule</text>
  <text x="1176" y="344" text-anchor="end" font-size="15.5" fill="#6B7280">six attempts</text>

  
  <g filter="url(#pj-soft)">
    <rect x="76" y="360" width="210" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="360" width="6" height="48" fill="#D97706" clip-path="url(#pj-k2)"/>
  </g>
  <circle cx="110" cy="384" r="4.5" fill="#D97706"/>
  <text x="134" y="391" font-size="18.5" font-weight="600" fill="#111827">Retry 1</text>
  <rect x="326" y="368" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="426" y="389" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">1 minute</text>
  <text x="576" y="391" font-size="15.5" fill="#6B7280">The endpoint timed out, failed, or answered non-2xx</text>

  
  <g filter="url(#pj-soft)">
    <rect x="76" y="428" width="210" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="428" width="6" height="48" fill="#D97706" clip-path="url(#pj-k3)"/>
  </g>
  <circle cx="110" cy="452" r="4.5" fill="#D97706"/>
  <text x="134" y="459" font-size="18.5" font-weight="600" fill="#111827">Retry 2</text>
  <rect x="326" y="436" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="426" y="457" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">5 minutes</text>
  <text x="576" y="459" font-size="15.5" fill="#6B7280">Same event id, a new signature and timestamp</text>

  
  <g filter="url(#pj-soft)">
    <rect x="76" y="496" width="210" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="496" width="6" height="48" fill="#D97706" clip-path="url(#pj-k4)"/>
  </g>
  <circle cx="110" cy="520" r="4.5" fill="#D97706"/>
  <text x="134" y="527" font-size="18.5" font-weight="600" fill="#111827">Retry 3</text>
  <rect x="326" y="504" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="426" y="525" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">30 minutes</text>
  <text x="576" y="527" font-size="15.5" fill="#6B7280">A small random extra delay avoids a synchronized wave</text>

  
  <g filter="url(#pj-soft)">
    <rect x="76" y="564" width="210" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="564" width="6" height="48" fill="#D97706" clip-path="url(#pj-k5)"/>
  </g>
  <circle cx="110" cy="588" r="4.5" fill="#D97706"/>
  <text x="134" y="595" font-size="18.5" font-weight="600" fill="#111827">Retry 4</text>
  <rect x="326" y="572" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="426" y="593" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">2 hours</text>
  <text x="576" y="595" font-size="15.5" fill="#6B7280">The delivery is visible in the customer-facing history</text>

  
  <g filter="url(#pj-soft)">
    <rect x="76" y="632" width="210" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="632" width="6" height="48" fill="#D97706" clip-path="url(#pj-k6)"/>
  </g>
  <circle cx="110" cy="656" r="4.5" fill="#D97706"/>
  <text x="134" y="663" font-size="18.5" font-weight="600" fill="#111827">Retry 5</text>
  <rect x="326" y="640" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="426" y="661" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">8 hours</text>
  <text x="576" y="663" font-size="15.5" fill="#6B7280">The customer can still request a manual redelivery</text>

  
  <g filter="url(#pj-soft)">
    <rect x="76" y="700" width="210" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="700" width="6" height="48" fill="#D97706" clip-path="url(#pj-k7)"/>
  </g>
  <circle cx="110" cy="724" r="4.5" fill="#D97706"/>
  <text x="134" y="731" font-size="18.5" font-weight="600" fill="#111827">Retry 6</text>
  <rect x="326" y="708" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="426" y="729" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">24 hours</text>
  <text x="576" y="731" font-size="15.5" fill="#6B7280">The last automatic attempt</text>

  
  <rect x="40" y="812" width="1160" height="136" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="842" font-size="16.5" font-weight="600" fill="#BE185D">The terminal state</text>
  <text x="1176" y="842" text-anchor="end" font-size="15.5" fill="#6B7280">no more attempts</text>

  <g filter="url(#pj-lift)">
    <rect x="76" y="858" width="210" height="72" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="76" y="858" width="9" height="72" fill="#DB2777" clip-path="url(#pj-k8)"/>
  </g>
  <circle cx="110" cy="894" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,885) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="134" y="901" font-size="18.5" font-weight="600" fill="#111827">Failed</text>
  <rect x="326" y="878" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="426" y="899" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">no further attempts</text>
  <text x="576" y="888" font-size="15.5" fill="#6B7280">The delivery is marked failed and stays</text>
  <text x="576" y="912" font-size="15.5" fill="#6B7280">inspectable and redeliverable</text>

  
  <rect x="40" y="978" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1020" text-anchor="middle" font-size="16" fill="#475569">The customer needs to know how long its endpoint may be called, and when a delivery becomes failed.</text>
  <text x="620" y="1048" text-anchor="middle" font-size="16" fill="#475569">An attempt succeeds only on a 2xx within the deadline. The event id never changes.</text>
</svg>