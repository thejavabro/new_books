<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated key-value store architecture: coordinator and quorum replication, LSM tree storage engine, anti-entropy repair, and the hot key mitigation">
  <defs>
    <filter id="kv-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="kv-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="kv-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="kv-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="kv-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="kv-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Key-value store: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Leaderless quorum writes, the LSM storage engine, and how the cluster heals itself</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Write path · leaderless, W plus R greater than N gives strong consistency</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#kv-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">PUT</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#kv-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fan out</text>
  <g filter="url(#kv-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,171 L880,217 A160,15 0 0 0 1200,217 L1200,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="171" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">any node will do</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Coordinator</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">hashes the key</text>
  <text x="1040" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replicas</text>
  <text x="1040" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">N equals 3, waits for 2</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. Inside one node · writes go to memory, disk work happens later</text>
  <path d="M264,436 L349,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#kv-blue)"/>
  <text x="307" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">apply</text>
  <path d="M577,436 L662,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#kv-amber)"/>
  <text x="620" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">flush</text>
  <path d="M890,436 L975,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#kv-blue)"/>
  <text x="933" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">index</text>
  <g filter="url(#kv-soft)">
    <path d="M40,413 L40,459 A110,15 0 0 0 260,459 L260,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="150" cy="413" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M353,413 L353,459 A110,15 0 0 0 573,459 L573,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="463" cy="413" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M666,413 L666,459 A110,15 0 0 0 886,459 L886,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="413" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M979,413 L979,459 A110,15 0 0 0 1199,459 L1199,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1089" cy="413" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="150" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Commit log</text>
  <text x="150" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">survives power loss</text>
  <text x="463" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">MemTable</text>
  <text x="463" y="504" font-size="20" fill="#065F46" text-anchor="middle">in RAM, sorted</text>
  <text x="776" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SSTables</text>
  <text x="776" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">immutable, compacted</text>
  <text x="1089" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bloom filter</text>
  <text x="1089" y="504" font-size="20" fill="#065F46" text-anchor="middle">skips the disk read</text>

  <rect x="24" y="580" width="1192" height="166" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#92400E">3. Self healing (asynchronous) · the cluster repairs itself, nobody is paged</text>
  <path d="M264,678 L349,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#kv-amber)"/>
  <text x="307" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">stale</text>
  <path d="M577,678 L662,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#kv-amber)"/>
  <text x="620" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">sync</text>
  <path d="M890,678 L975,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#kv-amber)"/>
  <text x="933" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">state</text>
  <g filter="url(#kv-soft)">
    <rect x="40" y="640" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="353" y="640" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="640" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="979" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read repair</text>
  <text x="150" y="700" font-size="20" fill="#64748B" text-anchor="middle">on every read</text>
  <text x="463" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Hinted handoff</text>
  <text x="463" y="700" font-size="20" fill="#64748B" text-anchor="middle">holds for the dead</text>
  <text x="776" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Merkle trees</text>
  <text x="776" y="700" font-size="20" fill="#64748B" text-anchor="middle">finds the drift</text>
  <text x="1089" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Gossip</text>
  <text x="1089" y="700" font-size="20" fill="#64748B" text-anchor="middle">who is alive</text>

  <rect x="24" y="776" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="808" font-size="20" font-weight="600" fill="#475569">4. Scaling · 150 servers for 300 TB, virtual nodes keep the ring even</text>
  <path d="M364,874 L456,874" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#kv-blue)"/>
  <text x="410" y="862" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hot key</text>
  <path d="M784,874 L876,874" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#kv-blue)"/>
  <text x="830" y="862" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">place</text>
  <g filter="url(#kv-soft)">
    <rect x="40" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M460,851 L460,897 A160,15 0 0 0 780,897 L780,851" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="851" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Virtual nodes</text>
  <text x="200" y="896" font-size="20" fill="#64748B" text-anchor="middle">many per server</text>
  <text x="620" y="885" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Front cache</text>
  <text x="620" y="942" font-size="20" fill="#065F46" text-anchor="middle">for the celebrity key</text>
  <text x="1040" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Rack awareness</text>
  <text x="1040" y="896" font-size="20" fill="#64748B" text-anchor="middle">replicas split by AZ</text>
  <line x1="44" y1="1048" x2="72" y2="1048" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1055" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1048" x2="344.576" y2="1048" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1055" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1039" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1055" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1039" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1055" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1039" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1055" font-size="20" fill="#475569">core service</text>
</svg>