<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The application tier of stateless application servers (Python, Java, Go and so on) reaches four data tier components. It reads and writes the database (PostgreSQL, MySQL) over a database protocol on TCP; the database stores persistent data with transactions and ACID guarantees. It reads and writes the cache (Redis) with the Redis protocol; the cache stores frequently accessed data with low latency, improves performance and holds sessions. It sends search queries over HTTP/JSON to search (Elasticsearch) for full-text search, indexing, search queries and faceted queries. It reads and writes object storage (Amazon S3) through the S3 API; object storage holds files and media such as images, videos and documents, is durable and scalable, and is accessed via API">
