  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Data tier: database, cache, search, and object storage</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The application tier talks to each data tier component over its own protocol.</text>

