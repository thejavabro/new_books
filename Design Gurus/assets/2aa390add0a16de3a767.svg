  <text x="64" y="178" font-size="18.5" fill="#6B7280">The core system contains only the essential functionality that is required by every use case.</text>
  <text x="64" y="483" font-size="18.5" fill="#6B7280">Every plugin implements a well-defined interface that the core defines.</text>
  <text x="64" y="818" font-size="18.5" fill="#6B7280">New plugins can be added without modifying the core system.</text>

