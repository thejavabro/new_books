  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The three defining properties of microkernel architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A minimal core, an explicit plugin contract, and plugins that can be added without changing the core.</text>

