<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1185" viewBox="0 0 1240 1185" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three defining properties. One, minimal core: the core system contains only the essential functionality every use case requires, and holds the request lifecycle, validation, routing to plugins and logging. Two, explicit plugin contract: the core system calls a plugin interface that plugins A, B and C implement. Three, dynamic extensibility: the core system calls plugins A, B and C, and a new plugin can be added without modifying the core">
