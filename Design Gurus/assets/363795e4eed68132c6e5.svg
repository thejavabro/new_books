<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="798" viewBox="0 0 1240 798" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="decision-title decision-desc">
<title id="decision-title">The eight minutes of deciding</title>
<desc id="decision-desc">The hardest decision in the incident, and the one most runbooks do not help with. The fix is to make it before the incident, as a written criterion with delegated authority.</desc>
<defs>
<marker id="decision-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="decision-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="decision-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="decision-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="798" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The eight minutes of deciding</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The hardest decision in the incident, and the one most runbooks do not help with.</text>
<rect x="40" y="720" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="720" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="151" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">From 02:23 to 02:31 nothing was executed</text><text x="64" y="177" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The responder was answering one question: is this a failover, or will it come back?</text>
<rect x="40" y="220" width="1160" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="253" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Failing over costs the replication gap and a failback, so waiting is rational and expensive</text>
<rect x="40" y="296" width="1160" height="194" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="70" y="332" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">fail over if ANY of:</text>
<text x="100" y="372" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the write path has been unavailable for 5 continuous minutes</text><text x="100" y="402" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the provider has acknowledged a regional event</text><text x="100" y="432" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the error rate exceeds the threshold for 5 minutes and is not falling</text>
<text x="70" y="470" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">and the on-call does not need further approval to act</text>
<rect x="40" y="512" width="1160" height="60" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="512" width="5" height="60" rx="2.5" fill="#39D5AA"/><text x="64" y="548" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">That last line is the one that matters most.</text>
<rect x="40" y="594" width="1160" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="594" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="64" y="624" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Replication lag at 02:31 was 45 seconds, up from a normal 8</text><text x="64" y="650" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Inside the 60 second objective, and still 45 seconds of payments to reconcile.</text><text x="64" y="676" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The person to tell is in finance, not engineering.</text>
<text x="66" y="754" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">So the responder chooses between two known outcomes rather than between a known one and an unknown one.</text>
</svg>