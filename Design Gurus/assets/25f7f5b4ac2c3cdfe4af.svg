<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An index on last name and first name is sorted by last name first. It helps a search by last name, and a search by last name and first name together. It does not help a search by first name alone.">
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="ix3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ix3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ix3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ix3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ix3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ix3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ix3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ix3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">In a composite index, the order of the columns decides what it can do</text>
  <text x="620" y="70" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">an index on (last_name, first_name)</text>
  <text x="230" y="128" font-size="18" fill="#64748B" text-anchor="middle">sorted like this</text>
  <g filter="url(#ix3-soft)"><rect x="70" y="148" width="180" height="46" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="160" y="179" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">Ahmad</text>
  <g filter="url(#ix3-soft)"><rect x="260" y="148" width="160" height="46" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="340" y="179" font-size="19" fill="#0F172A" text-anchor="middle">Maria</text>
  <g filter="url(#ix3-soft)"><rect x="70" y="202" width="180" height="46" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="160" y="233" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">Ahmad</text>
  <g filter="url(#ix3-soft)"><rect x="260" y="202" width="160" height="46" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="340" y="233" font-size="19" fill="#0F172A" text-anchor="middle">Omar</text>
  <g filter="url(#ix3-soft)"><rect x="70" y="256" width="180" height="46" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="160" y="287" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">Chen</text>
  <g filter="url(#ix3-soft)"><rect x="260" y="256" width="160" height="46" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="340" y="287" font-size="19" fill="#0F172A" text-anchor="middle">Li</text>
  <g filter="url(#ix3-soft)"><rect x="70" y="310" width="180" height="46" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="160" y="341" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">Chen</text>
  <g filter="url(#ix3-soft)"><rect x="260" y="310" width="160" height="46" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="340" y="341" font-size="19" fill="#0F172A" text-anchor="middle">Wei</text>
  <g filter="url(#ix3-soft)"><rect x="70" y="364" width="180" height="46" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="160" y="395" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">Silva</text>
  <g filter="url(#ix3-soft)"><rect x="260" y="364" width="160" height="46" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="340" y="395" font-size="19" fill="#0F172A" text-anchor="middle">Ana</text>
  <g filter="url(#ix3-soft)"><rect x="70" y="418" width="180" height="46" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="160" y="449" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">Silva</text>
  <g filter="url(#ix3-soft)"><rect x="260" y="418" width="160" height="46" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="340" y="449" font-size="19" fill="#0F172A" text-anchor="middle">Maria</text>
  <text x="160" y="502" font-size="17" fill="#64748B" text-anchor="middle">first column</text>
  <text x="340" y="502" font-size="17" fill="#64748B" text-anchor="middle">second column</text>
  <g filter="url(#ix3-soft)"><rect x="520" y="140" width="696" height="92" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <path d="M557,180 L564,188 L576,172" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="608" y="188" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">WHERE last_name = "Chen"</text>
  <text x="608" y="216" font-size="18" fill="#64748B" text-anchor="start">The index is sorted by this column, so the rows are together.</text>
  <g filter="url(#ix3-soft)"><rect x="520" y="252" width="696" height="92" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <path d="M557,292 L564,300 L576,284" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="608" y="300" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">WHERE last_name = "Chen" AND first_name = "Wei"</text>
  <text x="608" y="328" font-size="18" fill="#64748B" text-anchor="start">Both columns, in the same order as the index.</text>
  <g filter="url(#ix3-soft)"><rect x="520" y="364" width="696" height="92" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/></g>
  <path d="M558,396 L574,412 M574,396 L558,412" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="608" y="412" font-size="20" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">WHERE first_name = "Maria"</text>
  <text x="608" y="440" font-size="18" fill="#64748B" text-anchor="start">Maria appears in two places. The whole index would be read.</text>
</svg>