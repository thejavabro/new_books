<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="744" viewBox="0 0 1240 744" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="budget-title budget-desc">
<title id="budget-title">Latency is a budget</title>
<desc id="budget-desc">Writing the target down as a total with every hop as a line item turns an argument about architecture into arithmetic, and usually shows that the backend round trip is not where the time goes.</desc>
<defs>
<marker id="budget-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="budget-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="budget-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="budget-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="744" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Latency is a budget</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Writing the budget down turns an argument about architecture into arithmetic.</text>
<rect x="40" y="666" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="666" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A target is a total, and everything spends from it</text>
<rect x="40" y="168" width="1160" height="42" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="196" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">target for the page</text><text x="1184" y="196" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">200 ms</text>
<rect x="40" y="214" width="1160" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="242" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">DNS, already cached</text><text x="1184" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">0 ms</text>
<rect x="40" y="260" width="1160" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="288" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">TLS handshake, resumed</text><text x="1184" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">5 ms</text>
<rect x="40" y="306" width="1160" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="334" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">edge to origin round trip</text><text x="1184" y="334" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">25 ms</text>
<rect x="40" y="352" width="1160" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="380" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">application work</text><text x="1184" y="380" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">40 ms</text>
<rect x="40" y="398" width="1160" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="426" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">database query</text><text x="1184" y="426" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">15 ms</text>
<rect x="40" y="444" width="1160" height="42" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="56" y="472" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">remaining</text><text x="1184" y="472" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">115 ms</text>
<rect x="40" y="512" width="560" height="128" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="512" width="5" height="128" rx="2.5" fill="#39D5AA"/><text x="64" y="555" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Now a cross-region round trip is</text><text x="64" y="582" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">a line item, and it either fits in</text><text x="64" y="609" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">what remains or it does not.</text>
<rect x="640" y="512" width="560" height="128" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="512" width="5" height="128" rx="2.5" fill="#F3CF6A"/><text x="664" y="543" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The budget also shows the dominant cost is</text><text x="664" y="569" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">often not the one being discussed. For a typical</text><text x="664" y="595" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">page, connection setup and payload size usually</text><text x="664" y="621" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">cost more than the backend round trip.</text>
<text x="66" y="700" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A content delivery network and a smaller payload can buy more than a second region.</text>
</svg>