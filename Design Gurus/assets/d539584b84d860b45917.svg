<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A span tree for one trace: the gateway span of 2,300 ms total decomposes into Checkout at 200 ms, Inventory at 90 ms, and Payments at 1,900 ms, and inside Payments one database query accounts for 1,850 ms.">
  <defs>
    <marker id="m06-l03-span-tree-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l03-span-tree-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m06-l03-span-tree-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <rect x="60" y="64" width="1120" height="620" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="104" font-size="20" font-weight="600" fill="#334155">One trace, one tree</text>
  <text x="1160" y="104" text-anchor="end" font-size="20" fill="#64748B">each span records service, duration, and parent</text>

  <g filter="url(#m06-l03-span-tree-soft)">
    <rect x="470" y="150" width="300" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="206" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway span</text>
  <text x="620" y="238" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2,300 ms total</text>
  <g filter="url(#m06-l03-span-tree-soft)">
    <rect x="110" y="360" width="250" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="235" y="416" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="235" y="448" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">200 ms</text>
  <g filter="url(#m06-l03-span-tree-soft)">
    <rect x="490" y="360" width="250" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="615" y="416" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="615" y="448" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">90 ms</text>
  <g filter="url(#m06-l03-span-tree-soft)">
    <rect x="870" y="360" width="250" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="995" y="416" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="995" y="448" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1,900 ms</text>
  <g filter="url(#m06-l03-span-tree-soft)">
    <rect x="870" y="550" width="250" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="995" y="606" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">one database query</text>
  <text x="995" y="638" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1,850 ms</text>
  <g filter="url(#m06-l03-span-tree-soft)">
    <rect x="110" y="550" width="680" height="130" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="450" y="606" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">What took a war room in logs takes one query here.</text>
  <text x="450" y="638" text-anchor="middle" font-size="20" fill="#64748B">Jaeger, Zipkin, or any OpenTelemetry backend.</text>

  <g fill="none" stroke-width="2.5">
    <path d="M540,280 C540,320 235,312 235,352" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l03-span-tree-bl)"/>
    <path d="M620,280 L620,352" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l03-span-tree-bl)"/>
    <path d="M700,280 C700,320 995,312 995,352" stroke="#DC2626" marker-end="url(#m06-l03-span-tree-rd)"/>
    <path d="M995,490 L995,542" stroke="#DC2626" marker-end="url(#m06-l03-span-tree-rd)"/>
  </g>

  <text x="1160" y="330" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">where the time went</text>
  <text x="1010" y="522" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">inside Payments</text>

  <line x1="60" y1="720" x2="96" y2="720" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="727" font-size="20" fill="#475569">Parent to child span on the synchronous request path</text>
  <line x1="60" y1="760" x2="96" y2="760" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="767" font-size="20" fill="#475569">The hot path: where the 2,300 ms actually went</text>
  <line x1="60" y1="800" x2="96" y2="800" stroke="#059669" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">Fast spans, ruled out at a glance</text>
</svg>