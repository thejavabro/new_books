  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M674,905 L681,910.5 L674,916"/>
  </g>
  <text x="700" y="916" font-size="15.5" fill="#6B7280">The caller exceeded its creation rate</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M674,936 L678.5,940.5 L686,930.5"/>
  </g>
  <text x="700" y="942" font-size="15.5" fill="#6B7280">Wait for Retry-After</text>

  
  <rect x="40" y="986" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1028" text-anchor="middle" font-size="16" fill="#475569">Eight named failures for the one deep operation of the ten-minute reading-list answer.</text>
  <text x="620" y="1056" text-anchor="middle" font-size="16" fill="#475569">Compression removes consumers and hard parts. It never removes the failure design.</text>
