  <text x="100" y="878" font-size="15.5" fill="#6B7280">Authenticate</text>

  
  <rect x="640" y="126" width="560" height="206" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="664" y="156" font-size="16.5" font-weight="600" fill="#475569">403 Forbidden</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">one response</text>

