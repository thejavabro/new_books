    <path d="M674,310 L678.5,314.5 L686,304.5"/>
  </g>
  <text x="700" y="316" font-size="15.5" fill="#6B7280">Obtain the required scope</text>

  
  <rect x="640" y="356" width="560" height="372" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="664" y="386" font-size="16.5" font-weight="600" fill="#475569">409 Conflict</text>
  <text x="1176" y="386" text-anchor="end" font-size="15.5" fill="#6B7280">two responses</text>

  <g filter="url(#p3w-soft)">
    <rect x="672" y="404" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
