  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M674,540 L678.5,544.5 L686,534.5"/>
  </g>
  <text x="700" y="546" font-size="15.5" fill="#6B7280">Use the existing resource</text>

  <g filter="url(#p3w-soft)">
    <rect x="672" y="570" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="672" y="570" width="6" height="90" fill="#DB2777" clip-path="url(#p3w-k7)"/>
