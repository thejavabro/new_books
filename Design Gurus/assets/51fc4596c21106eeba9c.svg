    <path d="M74,445 L81,450.5 L74,456"/>
  </g>
  <text x="100" y="456" font-size="15.5" fill="#6B7280">url is not an allowed absolute HTTPS URL</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74,476 L78.5,480.5 L86,470.5"/>
