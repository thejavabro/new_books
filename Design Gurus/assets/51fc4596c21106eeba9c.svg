  <rect x="0" y="0" width="1240" height="1126" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Compression never removes the failure design</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M640,66 L647,71.5 L640,77"/>
  </g>
