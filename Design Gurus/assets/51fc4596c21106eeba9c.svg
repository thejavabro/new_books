<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1126" viewBox="0 0 1240 1126" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Eight named failures of the one deep operation in the ten-minute reading-list answer, grouped by status: three 400 responses, one 401, one 403, two 409 responses and one 429, each with the condition that fires it and what the caller does next.">
