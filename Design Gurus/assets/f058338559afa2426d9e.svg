<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A stub resolver on the device only asks and waits. A recursive resolver does the whole lookup. A caching-only resolver reuses cached answers and hosts no zones. A forwarder passes queries upstream. An iterative resolver replies with a referral.">
  <defs>
    <filter id="ds4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ds4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ds4-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ds4-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ds4-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ds4-k4"><rect x="257" y="350" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ds4-k5"><rect x="643" y="350" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Five kinds of DNS resolver</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">They differ in how much of the lookup work they do themselves.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ds4-soft)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ds4-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">Stub resolver</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">on your device</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">only asks and waits</text>
  <g filter="url(#ds4-lift)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="450" y="140" width="9" height="90" fill="#2563EB" clip-path="url(#ds4-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">Recursive resolver</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">does the whole lookup</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">like 8.8.8.8 or 1.1.1.1</text>
  <g filter="url(#ds4-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#D97706" clip-path="url(#ds4-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">Caching-only resolver</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">reuses cached answers</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">hosts no zones, like home routers</text>
  <g filter="url(#ds4-soft)">
    <rect x="257" y="350" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="257" y="350" width="6" height="90" fill="#7C3AED" clip-path="url(#ds4-k4)"/>
  </g>
  <circle cx="295" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(284.56,384.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="321" y="402" font-size="21.5" font-weight="600" fill="#111827">Forwarder</text>
  <text x="427" y="469" font-size="18.5" text-anchor="middle" fill="#6B7280">passes queries upstream</text>
  <text x="427" y="496" font-size="18.5" text-anchor="middle" fill="#94A3B8">central logging and filtering</text>
  <g filter="url(#ds4-soft)">
    <rect x="643" y="350" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="643" y="350" width="6" height="90" fill="#059669" clip-path="url(#ds4-k5)"/>
  </g>
  <circle cx="681" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(670.56,384.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="707" y="402" font-size="21.5" font-weight="600" fill="#111827">Iterative resolver</text>
  <text x="813" y="469" font-size="18.5" text-anchor="middle" fill="#6B7280">replies with a referral</text>
  <text x="813" y="496" font-size="18.5" text-anchor="middle" fill="#94A3B8">how authoritative servers answer</text>

  <rect x="40" y="540" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="565" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="590" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">In one lookup</text>
  <text x="323" y="590" font-size="18.5" fill="#475569">a stub resolver asks a recursive resolver, which walks the hierarchy</text>
</svg>