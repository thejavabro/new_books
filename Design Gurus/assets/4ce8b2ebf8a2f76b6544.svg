<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="556" viewBox="0 0 1240 556" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The sorted letters before the search">
<defs>
<filter id="nl-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="556" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which letter comes just after "f" in ["a", "c", "f", "h"]?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The letters are sorted and wrap around, so the answer after the last one is the first</text>
<rect x="40" y="106" width="1160" height="294" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The whole array is still in range</text>
<rect x="402" y="198" width="436" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<rect x="410" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="458" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"a"</text>
<text x="458" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="518" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="566" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"c"</text>
<text x="566" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="626" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="674" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"f"</text>
<text x="674" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="734" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="782" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"h"</text>
<text x="782" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<path d="M449,324 L467,324 L458,310 Z" fill="#4F46E5"/>
<text x="458" y="348" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">start</text>
<path d="M773,324 L791,324 L782,310 Z" fill="#DB2777"/>
<text x="782" y="348" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">end</text>
<rect x="40" y="426" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="466" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Never stop on a match: a letter equal to "f" is not greater than "f"</text>
<text x="620" y="498" text-anchor="middle" font-size="18.5" fill="#475569">So the search always moves past an equal letter, and lands on the first greater one</text>
</svg>