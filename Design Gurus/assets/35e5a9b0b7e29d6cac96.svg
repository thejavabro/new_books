<clipPath id="rdb03-k4"><rect x="446" y="300" width="348" height="90" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="978" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="648" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Every office goes through the same software, and no application touches the files directly</text>

<g fill="none" stroke-width="2">
<path d="M250,190 V238 Q250,250 262,250 H488 Q500,250 500,262 V300" stroke="#2563EB" marker-end="url(#rdb03-mblue)"/>
<path d="M620,190 V300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#rdb03-mblue)"/>
<path d="M990,190 V238 Q990,250 978,250 H752 Q740,250 740,262 V300" stroke="#2563EB" marker-end="url(#rdb03-mblue)"/>
<path d="M620,390 V440" stroke="#4F46E5" marker-end="url(#rdb03-mindigo)"/>
</g>
<g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
<text x="676" y="220" fill="#1D4ED8">SQL query</text>
<text x="712" y="420" fill="#4338CA">reads and writes</text>
</g>

<g filter="url(#rdb03-soft)">
