<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="978" viewBox="0 0 1240 978" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="All three offices go through one database management system to one shared database holding a single copy of each fact">
