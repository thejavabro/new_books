<circle cx="484" cy="345" r="18" fill="#FFFFFF"/>
<g transform="translate(473.56,334.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
<text x="510" y="352" font-size="18.5" font-weight="600" fill="#111827">Database Management System</text>

<g stroke="#2563EB" stroke-width="1.5">
<path d="M510,456 L510,540 A110,16 0 0 0 730,540 L730,456" fill="#DBEAFE"/>
<ellipse cx="620" cy="456" rx="110" ry="16" fill="#EFF6FF"/>
</g>
<text x="620" y="517" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Student database</text>

<rect x="486" y="584" width="268" height="70" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="620" y="612" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">address: 14 MG Road</text>
<text x="620" y="637" text-anchor="middle" font-size="15.5" fill="#475569">one copy, always current</text>

<rect x="40" y="722" width="1160" height="216" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="748" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="164" y="770" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">one copy</text>
<text x="288" y="770" font-size="15.5" fill="#475569">the same fact is stored once, so copies cannot disagree</text>
<rect x="64" y="792" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="164" y="814" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">query language</text>
<text x="288" y="814" font-size="15.5" fill="#475569">a new question needs a query, not a new program</text>
<rect x="64" y="836" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="164" y="858" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">constraints</text>
<text x="288" y="858" font-size="15.5" fill="#475569">integrity rules are enforced for every application that connects</text>
<rect x="64" y="880" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="164" y="902" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">transactions</text>
<text x="288" y="902" font-size="15.5" fill="#475569">a group of changes either all succeed or all undo</text>
</svg>