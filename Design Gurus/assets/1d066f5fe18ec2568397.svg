<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1400" viewBox="0 0 1240 1400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The cached approach: the service writes the user action, publishes an event to Kafka and updates a distributed cache immediately, aggregator workers batch events into the counts store and refresh the cache, and reads are answered from the cache">
  <defs>
    <filter id="ytc4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytc4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytc4-k1"><rect x="40" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="ytc4-k2"><rect x="400" y="150" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="ytc4-k3"><rect x="780" y="150" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytc4-k4"><rect x="440" y="410" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ytc4-k5"><rect x="440" y="650" width="300" height="90" rx="12"/></clipPath>
    <marker id="ytc4-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ytc4-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ytc4-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ytc4-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ytc4-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1400" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Approach 3: the same pipeline, with the cache answering reads</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The service updates the cache the moment a user reacts, so the count looks instant while the durable total catches up behind it.</text>



  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#ytc4-m-blue)"/>
    <path d="M680,195 H772" stroke="#2563EB" marker-end="url(#ytc4-m-blue)"/>
    <path d="M880,312 V324 Q880,336 868,336 H212 Q200,336 200,348 V414" stroke="#059669" marker-end="url(#ytc4-m-emerald)"/>
    <path d="M950,312 V352 Q950,364 938,364 H602 Q590,364 590,376 V404" stroke="#7C3AED" marker-end="url(#ytc4-m-violet)"/>
    <path d="M1010,312 V654" stroke="#D97706" stroke-width="2.5" marker-end="url(#ytc4-m-amber)"/>
    <path d="M590,576 V644" stroke="#7C3AED" marker-end="url(#ytc4-m-violet)"/>
    <path d="M590,816 V894" stroke="#4F46E5" marker-end="url(#ytc4-m-indigo)"/>
    <path d="M740,695 H854" stroke="#D97706" marker-end="url(#ytc4-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="336" y="183" fill="#1D4ED8">likes</text>
    <text x="726" y="183" fill="#1D4ED8">routes</text>
    <text x="420" y="318" fill="#047857">write the action</text>
    <text x="770" y="392" fill="#5B21B6">publish</text>
    <text x="1120" y="480" fill="#B45309">read and update</text>
    <text x="700" y="614" fill="#5B21B6">consume</text>
    <text x="700" y="862" fill="#4338CA">one update per batch</text>
    <text x="797" y="678" fill="#B45309">refresh</text>
  </g>

  <g filter="url(#ytc4-soft)">
    <rect x="40" y="150" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#ytc4-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web and mobile</text>
  <g filter="url(#ytc4-soft)">
    <rect x="400" y="150" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="400" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#ytc4-k2)"/>
  </g>
  <circle cx="438" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="464" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="540" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">auth and rate limits</text>
  <g filter="url(#ytc4-lift)">
    <rect x="780" y="150" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="780" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#ytc4-k3)"/>
  </g>
  <circle cx="818" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6-6 6 6"/><path d="M6 14l6 6 6-6"/></g>
  <text x="844" y="202" font-size="21.5" font-weight="600" fill="#111827">Like/Dislike Service</text>
  <text x="950" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">stateless, scales out</text>
  <text x="950" y="296" font-size="18.5" text-anchor="middle" fill="#94A3B8">one write path, one read path</text>
  <g filter="url(#ytc4-soft)">
    <rect x="440" y="410" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="440" y="410" width="6" height="90" fill="#7C3AED" clip-path="url(#ytc4-k4)"/>
  </g>
  <circle cx="478" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,444.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="504" y="462" font-size="21.5" font-weight="600" fill="#111827">Kafka topic</text>
  <text x="590" y="529" font-size="18.5" text-anchor="middle" fill="#6B7280">one event per reaction</text>
  <g filter="url(#ytc4-soft)">
    <rect x="440" y="650" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="440" y="650" width="6" height="90" fill="#7C3AED" clip-path="url(#ytc4-k5)"/>
  </g>
  <circle cx="478" cy="695" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,684.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="504" y="702" font-size="21.5" font-weight="600" fill="#111827">Workers</text>
  <text x="590" y="769" font-size="18.5" text-anchor="middle" fill="#6B7280">batch, then write once</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M60,420 L60,504 A140,16 0 0 0 340,504 L340,420" fill="#D1FAE5"/>
    <ellipse cx="200" cy="420" rx="140" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="200" y="477" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">User actions</text>
  <text x="200" y="554" font-size="18.5" text-anchor="middle" fill="#6B7280">written on the request</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M860,660 L860,744 A150,16 0 0 0 1160,744 L1160,660" fill="#FEF3C7"/>
    <ellipse cx="1010" cy="660" rx="150" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1010" y="717" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Cache</text>
  <text x="1010" y="794" font-size="18.5" text-anchor="middle" fill="#6B7280">Redis, short TTL</text>
  <text x="1010" y="821" font-size="18.5" text-anchor="middle" fill="#94A3B8">answers the read path</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M440,900 L440,984 A150,16 0 0 0 740,984 L740,900" fill="#E0E7FF"/>
    <ellipse cx="590" cy="900" rx="150" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="590" y="957" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Counts</text>
  <text x="590" y="1034" font-size="18.5" text-anchor="middle" fill="#6B7280">the durable total</text>
  <text x="590" y="1061" font-size="18.5" text-anchor="middle" fill="#94A3B8">rebuilds the cache on a miss</text>

  <rect x="40" y="1110" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1135" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="1160" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Feels instant</text>
  <text x="323" y="1160" font-size="18.5" fill="#475569">the cache is bumped on the way through, so the user sees their own like straight away</text>
  <rect x="64" y="1185" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1210" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Reads leave the database</text>
  <text x="323" y="1210" font-size="18.5" fill="#475569">a viral video is read from memory, and the store only sees the batched writes</text>
  <rect x="64" y="1235" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1260" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Three moving parts</text>
  <text x="323" y="1260" font-size="18.5" fill="#475569">store, log and cache all have to agree, and cache invalidation is the hard one</text>
  <rect x="64" y="1285" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="1310" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Short TTL on purpose</text>
  <text x="323" y="1310" font-size="18.5" fill="#475569">it bounds how long a wrong count can survive, at the cost of more misses</text>
</svg>