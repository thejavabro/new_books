<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="638" viewBox="0 0 1240 638" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The row of trees before any fruit is picked">
<defs>
<filter id="fb-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="638" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many fruits can two baskets hold from [A, B, C, B, B, C]?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Two baskets means the window may hold at most two different fruit types</text>
<rect x="40" y="106" width="1160" height="268" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Nothing picked yet</text>
<rect x="338" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="380" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">A</text>
<text x="380" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="434" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="476" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">B</text>
<text x="476" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="530" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="572" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">C</text>
<text x="572" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="626" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="668" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">B</text>
<text x="668" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="722" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="764" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">B</text>
<text x="764" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="818" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="860" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">C</text>
<text x="860" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<rect x="545" y="404" width="150" height="74" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="620" y="431" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">types in window</text>
<text x="620" y="464" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0 of 2</text>
<rect x="40" y="508" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="548" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Grow the window on the right, and shrink it on the left only when a third type appears</text>
<text x="620" y="580" text-anchor="middle" font-size="18.5" fill="#475569">The answer is the longest window that never held more than two types</text>
</svg>