<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four building blocks of security: an authentication and authorization gate, encrypted traffic, an encrypted database, and an intrusion detection system watching everything">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="se1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se1-blueR" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#3B82F6"/></marker>
    <marker id="se1-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="se1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="760" y="100" width="450" height="460" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="780" y="134" font-size="20" font-weight="600" fill="#334155">Distributed system</text>

  
  <line x1="230" y1="332" x2="380" y2="332" stroke="#3B82F6" stroke-width="2" marker-end="url(#se1-blue)"/>
  <text x="305" y="281" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">encrypted</text>
  <text x="305" y="308" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">request (TLS)</text>

  <path d="M640,310 C700,310 740,240 790,192" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#se1-blue)"/>
  <path d="M640,354 C700,354 740,420 790,472" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#se1-blue)"/>
  <text x="715" y="319" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">allowed</text>
  <text x="715" y="346" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">requests only</text>

  <path d="M970,205 C978,205 980,270 985,292" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#se1-blue)"/>
  <path d="M970,458 C978,458 980,393 985,373" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#se1-blue)"/>

  <line x1="880" y1="234" x2="880" y2="430" stroke="#3B82F6" stroke-width="2" marker-start="url(#se1-blueR)" marker-end="url(#se1-blue)"/>
  <text x="880" y="319" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">encrypted node-to-</text>
  <text x="880" y="346" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">node messages</text>

  <line x1="510" y1="460" x2="510" y2="407" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se1-slate)"/>
  <line x1="680" y1="535" x2="760" y2="535" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se1-slate)"/>

  
  <g filter="url(#se1-soft)">
    <rect x="30" y="290" width="200" height="84" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="380" y="257" width="260" height="150" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="790" y="150" width="180" height="84" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="790" y="430" width="180" height="84" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="340" y="460" width="340" height="150" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="130" y="322" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="130" y="350" font-size="20" fill="#64748B" text-anchor="middle">browser or client</text>

  <text x="510" y="290" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Authentication and</text>
  <text x="510" y="318" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Authorization</text>
  <text x="510" y="346" font-size="20" fill="#64748B" text-anchor="middle">who are you,</text>
  <text x="510" y="374" font-size="20" fill="#64748B" text-anchor="middle">what may you do</text>

  <text x="880" y="182" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Service node</text>
  <text x="880" y="210" font-size="20" fill="#64748B" text-anchor="middle">app server</text>
  <text x="880" y="462" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Service node</text>
  <text x="880" y="490" font-size="20" fill="#64748B" text-anchor="middle">app server</text>

  <text x="510" y="491" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">IDPS</text>
  <text x="510" y="519" font-size="20" fill="#64748B" text-anchor="middle">intrusion detection and</text>
  <text x="510" y="547" font-size="20" fill="#64748B" text-anchor="middle">prevention:</text>
  <text x="510" y="575" font-size="20" fill="#64748B" text-anchor="middle">watches traffic for attacks</text>

  
  <g filter="url(#se1-soft)">
    <path d="M985,280 L985,370 A100,16 0 0 0 1185,370 L1185,280" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1085" cy="280" rx="100" ry="16" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1085" y="327" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Database</text>
  <text x="1085" y="355" font-size="20" fill="#64748B" text-anchor="middle">encrypted at rest</text>

  
  <line x1="60" y1="670" x2="88" y2="670" stroke="#3B82F6" stroke-width="3"/>
  <text x="98" y="677" font-size="20" fill="#475569">encrypted traffic (TLS)</text>
  <line x1="400" y1="670" x2="428" y2="670" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="438" y="677" font-size="20" fill="#475569">IDPS monitoring</text>
</svg>