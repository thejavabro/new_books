<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="792" viewBox="0 0 1240 792" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="safely-title safely-desc">
<title id="safely-title">The safety mechanics are the point</title>
<desc id="safely-desc">The practice dies if one experiment causes a real incident, so these are not overhead, they are what lets you keep doing it.</desc>
<defs>
<marker id="safely-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="safely-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="safely-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="safely-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="792" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The safety mechanics are the point</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The practice dies if one experiment causes a real incident.</text>
<rect x="40" y="714" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="714" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A stop condition agreed in advance</text>
<path d="M566 148H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 148H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safely-marker-slate)"/>
<rect x="610" y="118" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a specific number, because deciding under pressure</text><text x="630" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">turns an experiment into an outage</text>
<circle cx="60" cy="216" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="223" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="222" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The smallest scope that works</text>
<path d="M566 216H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 216H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safely-marker-slate)"/>
<rect x="610" y="186" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="222" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one instance answers most questions a whole fleet would</text>
<circle cx="60" cy="284" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="291" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="290" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A revert that is one action</text>
<path d="M566 284H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 284H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safely-marker-slate)"/>
<rect x="610" y="254" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="277.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if undoing it requires a deploy,</text><text x="630" y="302.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the experiment is not safe</text>
<circle cx="60" cy="352" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="359" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="358" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Business hours, announced</text>
<path d="M566 352H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 352H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safely-marker-slate)"/>
<rect x="610" y="322" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="358" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with the people who would be paged already present</text>
<circle cx="60" cy="420" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="427" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="390" width="470" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="426" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Blast radius set by the structure</text>
<path d="M566 420H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 420H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#safely-marker-slate)"/>
<rect x="610" y="390" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="426" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one cell, or behind a flag affecting a known subset</text>
<rect x="40" y="470" width="560" height="118" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="470" width="5" height="118" rx="2.5" fill="#39D5AA"/><text x="64" y="496" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The first one should pass</text><text x="64" y="522" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the practice needs a credible start.</text><text x="64" y="548" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Running the riskiest first and causing</text><text x="64" y="574" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">an incident ends the practice</text>
<rect x="640" y="470" width="560" height="118" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="470" width="5" height="118" rx="2.5" fill="#5EC9EC"/><text x="664" y="509" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Findings are defects, not blame</text><text x="664" y="535" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">an experiment revealing a missing timeout</text><text x="664" y="561" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">has found a bug that was already there</text>
<rect x="40" y="608" width="1160" height="80" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="608" width="5" height="80" rx="2.5" fill="#F3CF6A"/><text x="64" y="641" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Staging finds most of the configuration defects</text><text x="64" y="667" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Production finds the ones that come from real traffic, data volumes and dependencies.</text>
<text x="66" y="748" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Nothing about this benefits from being at night.</text>
</svg>