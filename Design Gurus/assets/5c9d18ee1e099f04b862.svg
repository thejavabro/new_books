<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of one two-phase commit participant. It moves from working to prepared after voting yes with locks held, then to committed or rolled back when the coordinator&#39;s verdict arrives. If the coordinator crashes and no verdict arrives it sits in doubt, locks still held, until the coordinator recovers and answers.">
  <defs>
    <marker id="m05-l02-prepared-blocking-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l02-prepared-blocking-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l02-prepared-blocking-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l02-prepared-blocking-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l02-prepared-blocking-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>

  <rect x="440" y="230" width="360" height="500" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="716" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">The blocking window</text>

  <g fill="none" stroke-width="2.5">
    <path d="M82,330 L97,330" stroke="#475569" stroke-width="2" marker-end="url(#m05-l02-prepared-blocking-sl)"/>
    <path d="M360,330 L462,330" stroke="#3B82F6" marker-end="url(#m05-l02-prepared-blocking-bl)"/>
    <path d="M770,300 C830,300 820,195 872,195" stroke="#059669" marker-end="url(#m05-l02-prepared-blocking-em)"/>
    <path d="M770,370 C830,370 820,485 872,485" stroke="#DC2626" marker-end="url(#m05-l02-prepared-blocking-rd)"/>
    <path d="M540,400 L540,552" stroke="#DC2626" marker-end="url(#m05-l02-prepared-blocking-rd)"/>
    <path d="M700,552 L700,408" stroke="#059669" marker-end="url(#m05-l02-prepared-blocking-em)"/>
    <path d="M1130,195 L1155,195" stroke="#475569" stroke-width="2" marker-end="url(#m05-l02-prepared-blocking-sl)"/>
    <path d="M1130,485 L1155,485" stroke="#475569" stroke-width="2" marker-end="url(#m05-l02-prepared-blocking-sl)"/>
  </g>

  <text x="411" y="225" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">did the work, voted yes,</text>
  <text x="411" y="251" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">locks held</text>
  <text x="866" y="150" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the coordinator says commit</text>
  <text x="1180" y="415" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the coordinator says abort</text>
  <text x="556" y="482" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">coordinator crashes,</text>
  <text x="556" y="508" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no verdict arrives</text>
  <text x="425" y="482" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">coordinator recovers</text>
  <text x="425" y="508" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">and answers</text>

  <circle cx="70" cy="330" r="12" fill="#475569"/>

  <g filter="url(#m05-l02-prepared-blocking-soft)">
    <rect x="100" y="280" width="260" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="326" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Working</text>
  <text x="230" y="358" text-anchor="middle" font-size="20" fill="#64748B">no promise made yet</text>
  <g filter="url(#m05-l02-prepared-blocking-soft)">
    <rect x="470" y="270" width="300" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="310" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Prepared</text>
  <text x="620" y="342" text-anchor="middle" font-size="20" fill="#64748B">voted yes, locks held,</text>
  <text x="620" y="374" text-anchor="middle" font-size="20" fill="#64748B">waiting for the verdict</text>
  <g filter="url(#m05-l02-prepared-blocking-soft)">
    <rect x="880" y="140" width="250" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1005" y="186" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Committed</text>
  <text x="1005" y="218" text-anchor="middle" font-size="20" fill="#64748B">locks released</text>
  <g filter="url(#m05-l02-prepared-blocking-soft)">
    <rect x="880" y="430" width="250" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1005" y="476" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rolled back</text>
  <text x="1005" y="508" text-anchor="middle" font-size="20" fill="#64748B">locks released</text>
  <g filter="url(#m05-l02-prepared-blocking-soft)">
    <rect x="470" y="560" width="300" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="620" y="600" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">In doubt</text>
  <text x="620" y="632" text-anchor="middle" font-size="20" fill="#64748B">cannot commit,</text>
  <text x="620" y="664" text-anchor="middle" font-size="20" fill="#64748B">cannot roll back</text>
  <g filter="url(#m05-l02-prepared-blocking-soft)">
    <rect x="830" y="560" width="350" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1005" y="600" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Locks stay held</text>
  <text x="1005" y="632" text-anchor="middle" font-size="20" fill="#64748B">other transactions queue</text>
  <text x="1005" y="664" text-anchor="middle" font-size="20" fill="#64748B">while the coordinator reboots</text>

  <circle cx="1168" cy="195" r="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="1168" cy="195" r="6" fill="#475569"/>
  <circle cx="1168" cy="485" r="12" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="1168" cy="485" r="6" fill="#475569"/>

  <line x1="60" y1="760" x2="96" y2="760" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="767" font-size="20" fill="#475569">Normal progress: the work is done and the vote is yes</text>
  <line x1="60" y1="800" x2="96" y2="800" stroke="#059669" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">A verdict arrives: commit, or the coordinator recovers</text>
  <line x1="60" y1="840" x2="96" y2="840" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="847" font-size="20" fill="#475569">Abort, or a crash that leaves the locks held</text>
</svg>