<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="530" viewBox="0 0 1240 530" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On a cache hit the application asks the cache and gets the value back in under a millisecond. On a cache miss the cache has nothing, so the application reads the database, which takes several milliseconds, and then stores a copy in the cache.">
  <rect x="0" y="0" width="1240" height="530" fill="#FFFFFF"/>
  <defs>
    <marker id="ca1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ca1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ca1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ca1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ca1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ca1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ca1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ca1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ca1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Every request is either a hit or a miss</text>
  <rect x="24" y="74" width="1192" height="196" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="120" y="118" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">Cache hit</text>
  <g filter="url(#ca1-soft)"><rect x="60" y="148" width="190" height="68" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="155" y="190" font-size="20" fill="#0F172A" text-anchor="middle">application</text>
  <line x1="254" y1="182" x2="386" y2="182" stroke="#059669" stroke-width="2.2" marker-end="url(#ca1-e)"/>
  <text x="320" y="164" font-size="18" fill="#64748B" text-anchor="middle">1. ask</text>
  <g filter="url(#ca1-soft)"><rect x="390" y="148" width="190" height="68" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <text x="485" y="190" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">cache</text>
  <line x1="386" y1="226" x2="254" y2="226" stroke="#059669" stroke-width="2.2" marker-end="url(#ca1-e)"/>
  <text x="320" y="254" font-size="18" fill="#64748B" text-anchor="middle">2. here it is</text>
  <text x="660" y="176" font-size="20" fill="#0F172A" text-anchor="start">The value was there.</text>
  <text x="660" y="206" font-size="19" fill="#64748B" text-anchor="start">It comes back in under a millisecond.</text>
  <text x="660" y="232" font-size="19" fill="#64748B" text-anchor="start">The database does no work.</text>
  <rect x="24" y="296" width="1192" height="214" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="120" y="340" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle">Cache miss</text>
  <g filter="url(#ca1-soft)"><rect x="60" y="370" width="190" height="68" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="155" y="412" font-size="20" fill="#0F172A" text-anchor="middle">application</text>
  <line x1="254" y1="388" x2="386" y2="388" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca1-r)"/>
  <text x="320" y="370" font-size="18" fill="#64748B" text-anchor="middle">1. ask</text>
  <g filter="url(#ca1-soft)"><rect x="390" y="370" width="190" height="68" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/></g>
  <text x="485" y="412" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="middle">cache</text>
  <text x="485" y="454" font-size="18" fill="#B91C1C" text-anchor="middle">nothing stored</text>
  <line x1="584" y1="388" x2="716" y2="388" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ca1-s)"/>
  <text x="650" y="370" font-size="18" fill="#64748B" text-anchor="middle">2. read</text>
  <g filter="url(#ca1-soft)"><rect x="720" y="370" width="190" height="68" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="815" y="412" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">database</text>
  <line x1="716" y1="426" x2="584" y2="426" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ca1-s)"/>
  <text x="650" y="454" font-size="18" fill="#64748B" text-anchor="middle">3. store a copy</text>
  <text x="950" y="392" font-size="19" fill="#0F172A" text-anchor="start">Slower, several</text>
  <text x="950" y="418" font-size="19" fill="#0F172A" text-anchor="start">milliseconds, and the</text>
  <text x="950" y="444" font-size="19" fill="#0F172A" text-anchor="start">next request will hit.</text>
</svg>