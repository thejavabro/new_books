<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="698" viewBox="0 0 1240 698" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="HTTP 2 interleaves frames from several streams on one connection so none waits for another, but because it still runs over TCP a single lost segment stalls every stream at once">
  <rect x="0" y="0" width="1240" height="698" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">HTTP/2 fixed the queue, and inherited a different one</text>

  
  <rect x="40" y="76" width="1160" height="230" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#065F46">One connection, frames from three streams interleaved</text>

  <rect x="250" y="160" width="40" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="296" y="160" width="40" height="60" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="342" y="160" width="40" height="60" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="388" y="160" width="40" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="434" y="160" width="40" height="60" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="480" y="160" width="40" height="60" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="526" y="160" width="40" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="572" y="160" width="40" height="60" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="618" y="160" width="40" height="60" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="664" y="160" width="40" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="710" y="160" width="40" height="60" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="756" y="160" width="40" height="60" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>

  <text x="850" y="180" font-size="20" fill="#1E40AF">blue = stream A</text>
  <text x="850" y="206" font-size="20" fill="#92400E">amber = stream B</text>
  <text x="1030" y="180" font-size="20" fill="#5B21B6">violet = stream C</text>

  <text x="620" y="278" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">All three finish early, because none of them has to wait its turn.</text>

  
  <rect x="40" y="326" width="1160" height="250" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="360" font-size="20" font-weight="600" fill="#B91C1C">One TCP segment is lost, and TCP will not deliver anything past it</text>

  <rect x="250" y="410" width="40" height="60" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="296" y="410" width="40" height="60" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="342" y="410" width="40" height="60" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="388" y="410" width="40" height="60" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="396" y1="428" x2="420" y2="452" stroke="#DC2626" stroke-width="3"/>
  <line x1="420" y1="428" x2="396" y2="452" stroke="#DC2626" stroke-width="3"/>

  <rect x="434" y="410" width="40" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="480" y="410" width="40" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="526" y="410" width="40" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="572" y="410" width="40" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="618" y="410" width="40" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="664" y="410" width="40" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="710" y="410" width="40" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="756" y="410" width="40" height="60" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="408" y="392" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">lost</text>
  <text x="830" y="448" font-size="20" font-weight="600" fill="#B91C1C">held by TCP, whatever stream</text>

  <text x="620" y="530" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Streams A and C had nothing to do with the lost frame. They stall anyway.</text>

  
  <rect x="40" y="606" width="1160" height="80" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="640" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">HTTP/2 removed head-of-line blocking in the protocol, but not in the transport under it.</text>
  <text x="620" y="670" font-size="20" fill="#334155" text-anchor="middle">TCP delivers one ordered byte stream, so it cannot hand over anything after a gap.</text>
</svg>