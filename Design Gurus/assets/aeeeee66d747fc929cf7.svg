<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A read checks each file&#39;s in-memory Bloom filter first: a no skips the file entirely, and only a maybe costs a disk read">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="bf6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="bf6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="bf6-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="bf6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <text x="330" y="60" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">In memory: one Bloom filter per file</text>
  <text x="920" y="60" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">On disk: the data files</text>

  
  <g filter="url(#bf6-soft)">
    <rect x="30" y="292" width="220" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="140" y="330" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read key K</text>
  <text x="140" y="358" font-size="20" fill="#64748B" text-anchor="middle">ask each file</text>

  
  <path d="M250,320 C280,240 290,140 300,124" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bf6-slate)"/>
  <line x1="250" y1="337" x2="300" y2="337" stroke="#475569" stroke-width="2" marker-end="url(#bf6-slate)"/>
  <path d="M250,354 C280,434 290,534 300,550" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bf6-slate)"/>

  
  <g filter="url(#bf6-soft)">
    <rect x="304" y="90" width="300" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="304" y="302" width="300" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="304" y="516" width="300" height="90" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="454" y="128" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Filter for file 1</text>
  <text x="454" y="158" font-size="20" fill="#065F46" text-anchor="middle">answers "no"</text>
  <text x="454" y="340" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Filter for file 2</text>
  <text x="454" y="370" font-size="20" fill="#065F46" text-anchor="middle">answers "no"</text>
  <text x="454" y="554" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Filter for file 3</text>
  <text x="454" y="584" font-size="20" fill="#92400E" text-anchor="middle">answers "maybe"</text>

  
  <line x1="608" y1="135" x2="654" y2="135" stroke="#059669" stroke-width="2"/>
  <path d="M666,125 L688,147 M688,125 L666,147" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text x="654" y="108" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">skipped</text>
  <line x1="608" y1="347" x2="654" y2="347" stroke="#059669" stroke-width="2"/>
  <path d="M666,337 L688,359 M688,337 L666,359" stroke="#DC2626" stroke-width="3" stroke-linecap="round" fill="none"/>
  <text x="654" y="320" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">skipped</text>
  <line x1="608" y1="561" x2="700" y2="561" stroke="#D97706" stroke-width="2.5" marker-end="url(#bf6-amber)"/>
  <text x="654" y="534" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>

  
  <g filter="url(#bf6-soft)">
    <rect x="704" y="90" width="330" height="90" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="704" y="302" width="330" height="90" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="704" y="516" width="330" height="90" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="869" y="128" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">File 1</text>
  <text x="869" y="158" font-size="20" fill="#94A3B8" text-anchor="middle">never opened</text>
  <text x="869" y="340" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">File 2</text>
  <text x="869" y="370" font-size="20" fill="#94A3B8" text-anchor="middle">never opened</text>
  <text x="869" y="554" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">File 3</text>
  <text x="869" y="584" font-size="20" fill="#92400E" text-anchor="middle">one disk read, then the real answer</text>

  
  <rect x="1060" y="302" width="150" height="90" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1135" y="340" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">1 read</text>
  <text x="1135" y="368" font-size="20" fill="#065F46" text-anchor="middle">not 3</text>

  
  <text x="620" y="656" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A "no" is trusted and the file is skipped. A "maybe" falls through to the real lookup, so the answer stays correct.</text>
</svg>