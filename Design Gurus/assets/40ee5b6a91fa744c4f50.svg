<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="unchanged-title unchanged-desc">
<title id="unchanged-title">Saying what does not change</title>
<desc id="unchanged-desc">The half of the answer candidates omit is the stronger half, and the ordering before the redesign is the honest description of how systems actually evolve.</desc>
<defs>
<marker id="unchanged-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="unchanged-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="unchanged-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="unchanged-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Saying what does not change</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The half of the answer that candidates omit is the stronger half.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="150.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">"The API tier, the cache layer, the workers and object storage all handle this</text><text x="64" y="177.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">by adding capacity. The only structural change is the write path."</text>
<circle cx="60" cy="248" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="255" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="218" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="254" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It demonstrates the analysis happened</text>
<path d="M566 248H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 248H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#unchanged-marker-slate)"/>
<rect x="610" y="218" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="241.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you cannot say what is unaffected without</text><text x="630" y="266.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">having checked</text>
<circle cx="60" cy="320" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="327" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="290" width="470" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="326" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It shows restraint</text>
<path d="M566 320H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 320H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#unchanged-marker-slate)"/>
<rect x="610" y="290" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="313.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">redesigning everything says you would have</text><text x="630" y="338.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">over-built the first version</text>
<circle cx="60" cy="392" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="399" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="362" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It makes the change credible</text>
<path d="M566 392H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 392H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#unchanged-marker-slate)"/>
<rect x="610" y="362" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="385.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one named structural change is a plan;</text><text x="630" y="410.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a full rewrite is an admission</text>
<rect x="40" y="442" width="1160" height="128" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/>
<text x="80" y="488" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">first</text>
<text x="190" y="488" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tune what exists: indexes, pools, query shape, cache hit rate</text>
<text x="80" y="524" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">then</text>
<text x="190" y="524" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">buy capacity: a larger instance, more replicas, more workers</text>
<text x="80" y="560" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">then</text>
<text x="190" y="560" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">change the structure: partition, split, denormalize, move off the path</text>
<rect x="40" y="590" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="590" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="623" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">That ordering is itself the senior signal</text><text x="64" y="649" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">You would spend the cheap options before the expensive one.</text>
<text x="66" y="730" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Jumping straight to the structural change skips two cheaper options.</text>
</svg>