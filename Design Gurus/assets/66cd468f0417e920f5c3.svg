<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="678" viewBox="0 0 1240 678" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Random UUID keys land all over a B-tree and split pages everywhere, while time-sorted IDs always append to the rightmost page and keep the index compact">
  <rect x="0" y="0" width="1240" height="678" fill="#FFFFFF"/>
  <defs>
    <marker id="id2-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="id2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Where the next insert lands, and what that does to the index</text>

  
  <rect x="40" y="76" width="1160" height="256" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#B91C1C">Random UUID keys: every insert lands somewhere different</text>

  <text x="230" y="176" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">four new rows</text>
  <line x1="230" y1="192" x2="150" y2="232" stroke="#DC2626" stroke-width="2" marker-end="url(#id2-red)"/>
  <line x1="250" y1="192" x2="440" y2="232" stroke="#DC2626" stroke-width="2" marker-end="url(#id2-red)"/>
  <line x1="270" y1="192" x2="730" y2="232" stroke="#DC2626" stroke-width="2" marker-end="url(#id2-red)"/>
  <line x1="290" y1="192" x2="1020" y2="232" stroke="#DC2626" stroke-width="2" marker-end="url(#id2-red)"/>

  <rect x="70" y="240" width="230" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="185" y="272" font-size="20" fill="#B91C1C" text-anchor="middle">page 1</text>
  <rect x="360" y="240" width="230" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="475" y="272" font-size="20" fill="#B91C1C" text-anchor="middle">page 2</text>
  <rect x="650" y="240" width="230" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="765" y="272" font-size="20" fill="#B91C1C" text-anchor="middle">page 3</text>
  <rect x="940" y="240" width="230" height="52" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1055" y="272" font-size="20" fill="#B91C1C" text-anchor="middle">page 4</text>

  <text x="620" y="318" font-size="20" fill="#334155" text-anchor="middle">Every page is touched, every page may split, and none of them stays in cache.</text>

  
  <rect x="40" y="352" width="1160" height="256" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="386" font-size="20" font-weight="600" fill="#065F46">Time-sorted IDs: every insert lands at the right edge</text>

  <text x="1010" y="452" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">four new rows</text>
  <line x1="990" y1="468" x2="1040" y2="508" stroke="#059669" stroke-width="2" marker-end="url(#id2-emerald)"/>
  <line x1="1005" y1="468" x2="1050" y2="508" stroke="#059669" stroke-width="2" marker-end="url(#id2-emerald)"/>
  <line x1="1020" y1="468" x2="1060" y2="508" stroke="#059669" stroke-width="2" marker-end="url(#id2-emerald)"/>
  <line x1="1035" y1="468" x2="1070" y2="508" stroke="#059669" stroke-width="2" marker-end="url(#id2-emerald)"/>

  <rect x="70" y="516" width="230" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="185" y="548" font-size="20" fill="#94A3B8" text-anchor="middle">page 1, untouched</text>
  <rect x="360" y="516" width="230" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="475" y="548" font-size="20" fill="#94A3B8" text-anchor="middle">page 2, untouched</text>
  <rect x="650" y="516" width="230" height="52" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="765" y="548" font-size="20" fill="#94A3B8" text-anchor="middle">page 3, untouched</text>
  <rect x="940" y="516" width="230" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="1055" y="548" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">page 4</text>

  <text x="620" y="594" font-size="20" fill="#334155" text-anchor="middle">One hot page at the end, which stays in memory and rarely splits.</text>

  <rect x="40" y="632" width="1160" height="40" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="659" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same rows, the same index. Only the key order changed.</text>
</svg>