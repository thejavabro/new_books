<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Retry decision flow. A failed call must clear three gates in order: is the error retryable, is the operation idempotent, and are attempts and budget left. Failing any one gate stops the retry and reports the error. Clearing all three leads to a wait of backoff plus jitter, then one more attempt.">
  <defs>
    <marker id="m04-l03-retry-decision-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l03-retry-decision-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l03-retry-decision-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m04-l03-retry-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <g filter="url(#m04-l03-retry-decision-soft)">
    <rect x="140" y="80" width="440" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="360" y="126" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Call failed</text>
  <text x="360" y="158" text-anchor="middle" font-size="20" fill="#64748B">a timeout or a 503</text>

  <text x="60" y="44" font-size="20" font-weight="600" fill="#334155">Every retry must clear all three gates</text>
  <text x="1180" y="44" text-anchor="end" font-size="20" fill="#64748B">one No is enough to stop it</text>
  <rect x="100" y="225" width="520" height="480" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g filter="url(#m04-l03-retry-decision-soft)">
    <rect x="140" y="240" width="440" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="286" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Retryable error?</text>
  <text x="360" y="318" text-anchor="middle" font-size="20" fill="#64748B">503 or timeout yes, 400 or 404 no</text>
  <g filter="url(#m04-l03-retry-decision-soft)">
    <rect x="140" y="410" width="440" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="456" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Idempotent operation?</text>
  <text x="360" y="488" text-anchor="middle" font-size="20" fill="#64748B">running it twice equals once</text>
  <g filter="url(#m04-l03-retry-decision-soft)">
    <rect x="140" y="580" width="440" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="360" y="626" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3. Attempts and budget left?</text>
  <text x="360" y="658" text-anchor="middle" font-size="20" fill="#64748B">2 to 3 attempts, budget under 10%</text>

  <g filter="url(#m04-l03-retry-decision-soft)">
    <rect x="790" y="390" width="390" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="985" y="436" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Do not retry,</text>
  <text x="985" y="468" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">report the error</text>
  <text x="985" y="540" text-anchor="middle" font-size="20" fill="#64748B">one failed gate is enough</text>

  <g filter="url(#m04-l03-retry-decision-soft)">
    <rect x="140" y="810" width="440" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="360" y="856" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Wait backoff plus jitter</text>
  <text x="360" y="888" text-anchor="middle" font-size="20" fill="#64748B">100, 200, 400, 800 ms</text>
  <g filter="url(#m04-l03-retry-decision-soft)">
    <rect x="790" y="810" width="390" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="985" y="856" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Retry once,</text>
  <text x="985" y="888" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">then check again</text>

  <g fill="none" stroke-width="2.5">
    <path d="M360,190 L360,232" stroke="#3B82F6" marker-end="url(#m04-l03-retry-decision-bl)"/>
    <path d="M360,350 L360,402" stroke="#059669" marker-end="url(#m04-l03-retry-decision-em)"/>
    <path d="M360,520 L360,572" stroke="#059669" marker-end="url(#m04-l03-retry-decision-em)"/>
    <path d="M360,690 L360,802" stroke="#059669" marker-end="url(#m04-l03-retry-decision-em)"/>
    <path d="M580,295 L680,295 L680,425 L782,425" stroke="#DC2626" marker-end="url(#m04-l03-retry-decision-rd)"/>
    <path d="M580,465 L782,465" stroke="#DC2626" marker-end="url(#m04-l03-retry-decision-rd)"/>
    <path d="M580,635 L680,635 L680,505 L782,505" stroke="#DC2626" marker-end="url(#m04-l03-retry-decision-rd)"/>
    <path d="M580,865 L782,865" stroke="#2563EB" marker-end="url(#m04-l03-retry-decision-bl)"/>
  </g>

  <text x="396" y="385" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="396" y="555" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="396" y="760" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="614" y="283" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="614" y="453" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="614" y="623" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <line x1="60" y1="970" x2="96" y2="970" stroke="#059669" stroke-width="4"/>
  <text x="108" y="977" font-size="20" fill="#475569">Yes: the gate is cleared, so move to the next check</text>
  <line x1="60" y1="1010" x2="96" y2="1010" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1017" font-size="20" fill="#475569">No: one failed gate stops the retry</text>
  <line x1="60" y1="1050" x2="96" y2="1050" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1057" font-size="20" fill="#475569">The retry itself: a bounded wait, then one attempt</text>
</svg>