<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="First, read replicas copy the primary and answer reads, which scales reads only. Second, a bigger primary scales writes up to the largest machine. Third, sharding splits rows across databases by a shard key, which scales writes but makes cross-shard queries and transactions hard.">
  <defs>
    <filter id="hzv4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="hzv4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="hzv4-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="hzv4-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="hzv4-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    <marker id="hzv4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Scaling the database, step by step</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A database holds state, so teams usually add these options in this order.</text>



  <g fill="none" stroke-width="2">
    <path d="M404,185 H450" stroke="#64748B" marker-end="url(#hzv4-m-slate)"/>
    <path d="M790,185 H836" stroke="#64748B" marker-end="url(#hzv4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#hzv4-soft)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#hzv4-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">1. Read replicas</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">scale reads only</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">writes stay on the primary</text>
  <g filter="url(#hzv4-soft)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="140" width="6" height="90" fill="#D97706" clip-path="url(#hzv4-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">2. Bigger primary</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">scales writes</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">up to the largest machine</text>
  <g filter="url(#hzv4-lift)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="836" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#hzv4-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">3. Sharding</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">scales writes further</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">the most complex step</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Replication lag</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">replicas receive changes a little late, so a read can return old data</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Shard key</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">decides where each row lives; a bad key puts too much load on one shard</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Cross-shard</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">queries and ACID transactions across shards are hard and slow</text>
</svg>