<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1116" viewBox="0 0 1240 1116" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four required behaviors of an idempotency key: the same key with the same body returns the original result, the same key with a different body returns 400, the same key while the first request runs returns 409 with Retry-After, and a new key starts a new logical operation.">
  <defs>
    <filter id="p10-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <marker id="p10-me" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p10-mp" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="p10-ma" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p10-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>

    <clipPath id="p10-k1"><rect x="76" y="170" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p10-k2"><rect x="600" y="170" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p10-k3"><rect x="76" y="372" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p10-k4"><rect x="600" y="372" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p10-k5"><rect x="76" y="600" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p10-k6"><rect x="600" y="600" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p10-k7"><rect x="76" y="828" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p10-k8"><rect x="600" y="828" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1116" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Four behaviors the contract must publish</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">what arrives, the response, and why</text>

  
  <rect x="40" y="124" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="154" font-size="16.5" font-weight="600" fill="#475569">Behavior 1</text>

  <g fill="none" stroke-width="2">
    <path d="M536,215 H600" stroke="#059669" marker-end="url(#p10-me)"/>
  </g>

  <g filter="url(#p10-soft)">
    <rect x="76" y="170" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="170" width="6" height="90" fill="#2563EB" clip-path="url(#p10-k1)"/>
  </g>
  <circle cx="114" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,204.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="222" font-size="18.5" font-weight="600" fill="#111827">Same key, same body, after completion</text>

  <g filter="url(#p10-soft)">
    <rect x="600" y="170" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="600" y="170" width="6" height="90" fill="#059669" clip-path="url(#p10-k2)"/>
  </g>
  <circle cx="638" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(627.56,204.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="664" y="222" font-size="18.5" font-weight="600" fill="#111827">The original result</text>

  <g fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112,279 L118,285 L112,291"/>
  </g>
  <text x="132" y="291" font-size="15.5" fill="#6B7280">A duplicate delivery is one logical operation, so it must not create a second resource</text>

  
  <rect x="40" y="326" width="1160" height="212" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="356" font-size="16.5" font-weight="600" fill="#475569">Behavior 2</text>

  <g fill="none" stroke-width="2">
    <path d="M536,417 H600" stroke="#DB2777" marker-end="url(#p10-mp)"/>
  </g>

  <g filter="url(#p10-soft)">
    <rect x="76" y="372" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="372" width="6" height="90" fill="#2563EB" clip-path="url(#p10-k3)"/>
  </g>
  <circle cx="114" cy="417" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,406.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="424" font-size="18.5" font-weight="600" fill="#111827">Same key, a different body</text>

  <g filter="url(#p10-soft)">
    <rect x="600" y="372" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="600" y="372" width="6" height="90" fill="#DB2777" clip-path="url(#p10-k4)"/>
  </g>
  <circle cx="638" cy="417" r="18" fill="#FFFFFF"/>
  <g transform="translate(627.56,406.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="664" y="424" font-size="18.5" font-weight="600" fill="#111827">400</text>
  <text x="800" y="487" text-anchor="middle" font-size="15.5" fill="#6B7280">idempotency_key_reused</text>

  <g fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112,502 L118,508 L112,514"/>
  </g>
  <text x="132" y="514" font-size="15.5" fill="#6B7280">One key cannot name two logical requests. Replaying the old result would hide a caller bug</text>

  
  <rect x="40" y="554" width="1160" height="212" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="584" font-size="16.5" font-weight="600" fill="#475569">Behavior 3</text>

  <g fill="none" stroke-width="2">
    <path d="M536,645 H600" stroke="#D97706" marker-end="url(#p10-ma)"/>
  </g>

  <g filter="url(#p10-soft)">
    <rect x="76" y="600" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="600" width="6" height="90" fill="#2563EB" clip-path="url(#p10-k5)"/>
  </g>
  <circle cx="114" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,634.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="652" font-size="18.5" font-weight="600" fill="#111827">Same key, while the first is still running</text>

  <g filter="url(#p10-soft)">
    <rect x="600" y="600" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="600" y="600" width="6" height="90" fill="#D97706" clip-path="url(#p10-k6)"/>
  </g>
  <circle cx="638" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(627.56,634.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="664" y="652" font-size="18.5" font-weight="600" fill="#111827">409 + Retry-After</text>
  <text x="800" y="715" text-anchor="middle" font-size="15.5" fill="#6B7280">idempotency_request_in_progress</text>

  <g fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112,730 L118,736 L112,742"/>
  </g>
  <text x="132" y="742" font-size="15.5" fill="#6B7280">The body is valid but conflicts with an overlapping execution. The server never runs the work twice</text>

  
  <rect x="40" y="782" width="1160" height="186" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="812" font-size="16.5" font-weight="600" fill="#475569">Behavior 4</text>

  <g fill="none" stroke-width="2">
    <path d="M536,873 H600" stroke="#2563EB" marker-end="url(#p10-mb)"/>
  </g>

  <g filter="url(#p10-soft)">
    <rect x="76" y="828" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="828" width="6" height="90" fill="#2563EB" clip-path="url(#p10-k7)"/>
  </g>
  <circle cx="114" cy="873" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,862.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="880" font-size="18.5" font-weight="600" fill="#111827">A new key</text>

  <g filter="url(#p10-soft)">
    <rect x="600" y="828" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="600" y="828" width="6" height="90" fill="#2563EB" clip-path="url(#p10-k8)"/>
  </g>
  <circle cx="638" cy="873" r="18" fill="#FFFFFF"/>
  <g transform="translate(627.56,862.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="664" y="880" font-size="18.5" font-weight="600" fill="#111827">A new logical operation</text>

  <g fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112,931 L118,937 L112,943"/>
  </g>
  <text x="132" y="943" font-size="15.5" fill="#6B7280">A caller that abandons key A and sends key B has requested new work</text>

  
  <rect x="40" y="1000" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1045" text-anchor="middle" font-size="16" fill="#475569">Scope is one authenticated caller and one operation, so two customers can safely use the same string.</text>
</svg>