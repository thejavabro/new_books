<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="621" viewBox="0 0 1240 621" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="feed-title feed-desc">
<title id="feed-title">The working set does not fit</title>
<desc id="feed-desc">Two hundred million users with five hundred feed entries of a hundred bytes each is ten terabytes, which is roughly a hundred and sixty machines holding nothing but feed data before replication.</desc>
<defs>
<marker id="feed-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="feed-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="feed-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="feed-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="621" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The working set does not fit</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The design is not wrong so much as oversized, and the same arithmetic suggests what replaces it.</text>
<rect x="40" y="543" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="543" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="1160" height="72" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="72" rx="2.5" fill="#5EC9EC"/><text x="64" y="162" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">The proposal</text><text x="290" y="147.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Precompute every user feed and keep it in memory, so a read is one lookup and nothing</text><text x="290" y="174.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">is assembled at request time.</text>
<text x="40" y="229" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The arithmetic</text>
<rect x="40" y="247" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="279" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">200,000,000 users  x  500 entries  x  100 bytes</text>
<rect x="40" y="309" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="341" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">= 10,000,000,000,000 bytes, about 10 terabytes</text>
<rect x="40" y="371" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="403" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">at 64 GB usable per instance, roughly 160 machines, before replication</text>
<rect x="890" y="247" width="310" height="176" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1045" y="326.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">10 TB of memory for</text><text x="1045" y="355.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">feed data alone</text>
<rect x="40" y="445" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="445" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="489" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What replaces it</text><text x="290" y="474.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Keep 50 entries rather than 500, and precompute only for users who actually return.</text><text x="290" y="501.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Both together: a few hundred gigabytes, an ordinary cache.</text>
<text x="66" y="577" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The estimate did not rule out precomputation. It ruled out precomputing everything for everyone.</text>
</svg>