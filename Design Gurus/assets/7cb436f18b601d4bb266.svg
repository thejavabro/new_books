<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="726" viewBox="0 0 1240 726" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A freshness token and an ETag may both be opaque strings, but they answer different questions. An ETag asks whether a resource is still exactly the state the caller read. A freshness token asks whether a read is at least as new as a successful write.">
  <defs>
    <filter id="p1j-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1j-k1"><rect x="76" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1j-k2"><rect x="76" y="384" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="726" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Two opaque strings, two different questions</text>
  <g transform="translate(700,61) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9.4 9.2a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.1-2.6 3.8"/>
    <path d="M12 17.2v.3"/>
  </g>
  <text x="723" y="77" font-size="15.5" fill="#6B7280">the question it answers</text>
  <g transform="translate(930,61) scale(0.62)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="954" y="77" font-size="15.5" fill="#6B7280">direction of travel</text>

  
  <rect x="40" y="126" width="1160" height="218" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1j-soft)">
    <rect x="76" y="146" width="400" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#7C3AED" clip-path="url(#p1j-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">ETag</text>

  <g transform="translate(78,251) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9.4 9.2a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.1-2.6 3.8"/>
    <path d="M12 17.2v.3"/>
  </g>
  <text x="104" y="266" font-size="15.5" fill="#6B7280">"Is this resource still exactly the state I read?"</text>

  <rect x="76" y="286" width="1088" height="46" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <g transform="translate(96,301.56) scale(0.62)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="124" y="314" font-size="15.5" fill="#475569">A read result, sent back on a conditional write or read</text>

  
  <rect x="40" y="364" width="1160" height="218" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1j-soft)">
    <rect x="76" y="384" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
