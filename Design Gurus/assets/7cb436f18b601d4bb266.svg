  <circle cx="114" cy="429" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,418.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="436" font-size="18.5" font-weight="600" fill="#111827">Freshness-Token</text>

  <g transform="translate(78,489) scale(0.62)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9.4 9.2a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.1-2.6 3.8"/>
    <path d="M12 17.2v.3"/>
  </g>
  <text x="104" y="504" font-size="15.5" fill="#6B7280">"Is this read at least as new as this successful write?"</text>

  <rect x="76" y="524" width="1088" height="46" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <g transform="translate(96,539.56) scale(0.62)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="124" y="552" font-size="15.5" fill="#475569">A write result, sent on a later read, possibly by another caller</text>

  
  <rect x="40" y="610" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="655" text-anchor="middle" font-size="16" fill="#475569">Similar shapes do not make two guarantees interchangeable. Do not reuse one as the other.</text>
</svg>