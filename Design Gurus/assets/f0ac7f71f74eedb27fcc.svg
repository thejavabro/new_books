<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="636" viewBox="0 0 1240 636" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A spend cap is not a rate limit. A rate limit is a temporary traffic condition that waiting fixes, returning 429. A spend cap is an entitlement that waiting does not restore, returning 403.">
  <defs>
    <marker id="p27-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p27-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p27-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p27-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p27-k1"><rect x="72" y="176" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p27-k2"><rect x="500" y="176" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p27-k3"><rect x="72" y="372" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p27-k4"><rect x="500" y="372" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="636" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">A spend cap is entitlement, not traffic</text>
  <text x="500" y="77" font-size="16.5" font-weight="600" fill="#475569">Response</text>
  <text x="856" y="77" font-size="16.5" font-weight="600" fill="#475569">Because</text>

  
  <rect x="40" y="126" width="1160" height="176" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#B45309">Rate limit, a temporary traffic condition</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#94A3B8">waiting fixes it</text>

  
  <rect x="40" y="322" width="1160" height="176" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="352" font-size="16.5" font-weight="600" fill="#BE185D">Spend cap, an entitlement</text>
  <text x="1176" y="352" text-anchor="end" font-size="15.5" fill="#94A3B8">waiting does not restore it</text>

  
  <g fill="none" stroke-width="2">
    <path d="M432,221 H500" stroke="#D97706" marker-end="url(#p27-am)"/>
    <path d="M432,417 H500" stroke="#DB2777" stroke-width="2.5" marker-end="url(#p27-pm)"/>
  </g>

  
  <g filter="url(#p27-soft)">
    <rect x="72" y="176" width="360" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="176" width="6" height="90" fill="#64748B" clip-path="url(#p27-k1)"/>
  </g>
  <circle cx="110" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,210.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="136" y="228" font-size="18.5" font-weight="600" fill="#111827">Token or request bucket empty</text>

  
  <g filter="url(#p27-soft)">
    <rect x="500" y="176" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="500" y="176" width="6" height="90" fill="#D97706" clip-path="url(#p27-k2)"/>
  </g>
  <circle cx="538" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,210.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="564" y="228" font-size="18.5" font-weight="600" fill="#111827">429 + Retry-After</text>

  
  <text x="856" y="210" font-size="15.5" fill="#6B7280">Waiting refills the bucket, so the same</text>
  <text x="856" y="233" font-size="15.5" fill="#6B7280">request can succeed later</text>

  
  <g filter="url(#p27-soft)">
    <rect x="72" y="372" width="360" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="372" width="6" height="90" fill="#64748B" clip-path="url(#p27-k3)"/>
  </g>
  <circle cx="110" cy="417" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,406.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="136" y="424" font-size="18.5" font-weight="600" fill="#111827">Spend cap reached</text>

  
  <g filter="url(#p27-lift)">
    <rect x="500" y="372" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="500" y="372" width="9" height="90" fill="#DB2777" clip-path="url(#p27-k4)"/>
  </g>
  <circle cx="538" cy="417" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,406.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="564" y="424" font-size="18.5" font-weight="600" fill="#111827">403 spend_cap_exceeded</text>

  
  <text x="856" y="394" font-size="15.5" fill="#6B7280">The caller is authenticated and the</text>
  <text x="856" y="417" font-size="15.5" fill="#6B7280">input may be valid, but the account</text>
  <text x="856" y="440" font-size="15.5" fill="#6B7280">may not spend more</text>

  
  <rect x="40" y="520" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="565" text-anchor="middle" font-size="16" fill="#475569">Admission reserves for input plus maximum output, then releases the unused amount when work ends.</text>
</svg>