<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Google Calendar invitation and reminder pipelines: the event service publishes invitation_update when an invite changes, the reminder service publishes event_reminder when one comes due, and both are consumed by the notification service and its push, in app and email workers">
  <defs>
    <filter id="cal2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cal2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cal2-k1"><rect x="180" y="210" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="cal2-k2"><rect x="680" y="210" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="cal2-k3"><rect x="180" y="510" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="cal2-k4"><rect x="680" y="510" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="cal2-k5"><rect x="64" y="790" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cal2-k6"><rect x="470" y="790" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cal2-k7"><rect x="876" y="790" width="300" height="90" rx="12"/></clipPath>
    <marker id="cal2-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1180" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Google Calendar: invitations and reminders</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The detail the high level design leaves out. Both are events on a topic, and both end at the same three workers.</text>

  <rect x="40" y="150" width="1160" height="246" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="180" font-size="19.5" font-weight="600" fill="#1D4ED8">What raises the event</text>
  <rect x="40" y="450" width="1160" height="226" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="480" font-size="19.5" font-weight="600" fill="#5B21B6">Topics, one per kind</text>
  <rect x="40" y="730" width="1160" height="256" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="760" font-size="19.5" font-weight="600" fill="#5B21B6">Consumed by the same workers</text>

  <g fill="none" stroke-width="2">
    <path d="M370,366 V504" stroke="#7C3AED" marker-end="url(#cal2-m-violet)"/>
    <path d="M870,366 V504" stroke="#7C3AED" marker-end="url(#cal2-m-violet)"/>
    <path d="M370,676 V724" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#cal2-m-violet)"/>
    <path d="M870,676 V724" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#cal2-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="460" y="440" fill="#5B21B6">publish</text>
    <text x="960" y="440" fill="#5B21B6">publish</text>
    <text x="620" y="706" fill="#5B21B6">the notification service fans out</text>
  </g>

  <g filter="url(#cal2-soft)">
    <rect x="180" y="210" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="180" y="210" width="6" height="90" fill="#2563EB" clip-path="url(#cal2-k1)"/>
  </g>
  <circle cx="218" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,244.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="244" y="262" font-size="21.5" font-weight="600" fill="#111827">Event Service</text>
  <text x="370" y="329" font-size="18.5" text-anchor="middle" fill="#6B7280">someone is invited, or</text>
  <text x="370" y="356" font-size="18.5" text-anchor="middle" fill="#94A3B8">accepts, declines or is removed</text>
  <g filter="url(#cal2-soft)">
    <rect x="680" y="210" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="680" y="210" width="6" height="90" fill="#2563EB" clip-path="url(#cal2-k2)"/>
  </g>
  <circle cx="718" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,244.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="744" y="262" font-size="21.5" font-weight="600" fill="#111827">Reminder Service</text>
  <text x="870" y="329" font-size="18.5" text-anchor="middle" fill="#6B7280">a reminder comes due,</text>
  <text x="870" y="356" font-size="18.5" text-anchor="middle" fill="#94A3B8">ten minutes before the meeting</text>
  <g filter="url(#cal2-soft)">
    <rect x="180" y="510" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="180" y="510" width="6" height="90" fill="#7C3AED" clip-path="url(#cal2-k3)"/>
  </g>
  <circle cx="218" cy="555" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,544.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="244" y="562" font-size="21.5" font-weight="600" fill="#111827">invitation_update</text>
  <text x="370" y="629" font-size="18.5" text-anchor="middle" fill="#6B7280">who has answered what</text>
  <g filter="url(#cal2-soft)">
    <rect x="680" y="510" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="680" y="510" width="6" height="90" fill="#7C3AED" clip-path="url(#cal2-k4)"/>
  </g>
  <circle cx="718" cy="555" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,544.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="744" y="562" font-size="21.5" font-weight="600" fill="#111827">event_reminder</text>
  <text x="870" y="629" font-size="18.5" text-anchor="middle" fill="#6B7280">fire this one now</text>
  <g filter="url(#cal2-soft)">
    <rect x="64" y="790" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="790" width="6" height="90" fill="#7C3AED" clip-path="url(#cal2-k5)"/>
  </g>
  <circle cx="102" cy="835" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,824.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="128" y="842" font-size="21.5" font-weight="600" fill="#111827">Push worker</text>
  <text x="214" y="909" font-size="18.5" text-anchor="middle" fill="#6B7280">device notifications</text>
  <g filter="url(#cal2-soft)">
    <rect x="470" y="790" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="790" width="6" height="90" fill="#7C3AED" clip-path="url(#cal2-k6)"/>
  </g>
  <circle cx="508" cy="835" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,824.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="534" y="842" font-size="21.5" font-weight="600" fill="#111827">In-app worker</text>
  <text x="620" y="909" font-size="18.5" text-anchor="middle" fill="#6B7280">the bell in the UI</text>
  <g filter="url(#cal2-soft)">
    <rect x="876" y="790" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="876" y="790" width="6" height="90" fill="#7C3AED" clip-path="url(#cal2-k7)"/>
  </g>
  <circle cx="914" cy="835" r="18" fill="#FFFFFF"/>
  <g transform="translate(903.56,824.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="940" y="842" font-size="21.5" font-weight="600" fill="#111827">Email worker</text>
  <text x="1026" y="909" font-size="18.5" text-anchor="middle" fill="#6B7280">invites and reminders</text>

  <rect x="40" y="1030" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1055" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1080" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Nothing polls</text>
  <text x="323" y="1080" font-size="18.5" fill="#475569">a reminder is published when it comes due, so no worker scans a table on a timer</text>
  <rect x="64" y="1105" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1130" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Same workers, both paths</text>
  <text x="323" y="1130" font-size="18.5" fill="#475569">an invite and a reminder are different events that end in the same three channels</text>
</svg>