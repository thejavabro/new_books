<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="724" viewBox="0 0 1240 724" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="key-title key-desc">
<title id="key-title">What splits one object into many</title>
<desc id="key-desc">Campaign query strings, varying on a cookie, forwarding cookies and inconsistent path spellings each multiply one cached object into many, which is nearly always the real cause of a poor hit rate rather than the expiry time.</desc>
<defs>
<marker id="key-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="key-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="key-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="key-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="724" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What splits one object into many</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The key is built from the request, and anything included in it splits one cached object into many.</text>
<rect x="40" y="646" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="646" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">One article, one address</text>
<rect x="40" y="168" width="380" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="230" y="204" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Campaign query strings</text>
<rect x="440" y="181" width="250" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="440" y="181" width="250.0" height="34" rx="10" fill="#F25461"/>
<rect x="710" y="168" width="490" height="60" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="730" y="192" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">thousands of entries</text>
<text x="730" y="216" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">allow-list the parameters that matter</text>
<rect x="40" y="240" width="380" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="230" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Vary on a cookie</text>
<rect x="440" y="253" width="250" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="440" y="253" width="237.5" height="34" rx="10" fill="#F25461"/>
<rect x="710" y="240" width="490" height="60" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="730" y="264" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one per cookie value</text>
<text x="730" y="288" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">vary only on what changes it</text>
<rect x="40" y="312" width="380" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="230" y="348" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cookies forwarded to the edge</text>
<rect x="440" y="325" width="250" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="440" y="325" width="200.0" height="34" rx="10" fill="#E8BC60"/>
<rect x="710" y="312" width="490" height="60" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="730" y="336" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every request looks unique</text>
<text x="730" y="360" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">strip cookies from anything static</text>
<rect x="40" y="384" width="380" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="230" y="420" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Case and trailing slashes</text>
<rect x="440" y="397" width="250" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="440" y="397" width="62.5" height="34" rx="10" fill="#E8BC60"/>
<rect x="710" y="384" width="490" height="60" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="730" y="408" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">two spellings, two entries</text>
<text x="730" y="432" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">normalize the path</text>
<rect x="40" y="456" width="380" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="230" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Vary on encoding</text>
<rect x="440" y="469" width="250" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="440" y="469" width="25.0" height="34" rx="10" fill="#06AC80"/>
<rect x="710" y="456" width="490" height="60" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="730" y="480" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">two or three entries</text>
<text x="730" y="504" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">harmless, leave it alone</text>
<rect x="40" y="540" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="571.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A key that splits is a hit rate that collapses,</text><text x="64" y="600.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">while every dashboard still reports that caching is enabled.</text>
<text x="66" y="680" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Normalizing the key is usually the largest available improvement, and it needs no change at the origin.</text>
</svg>