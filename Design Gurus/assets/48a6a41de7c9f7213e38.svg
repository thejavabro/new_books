<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1282" viewBox="0 0 1240 1282" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated ChatGPT architecture: gatekeeping, context assembly from cache, queue based GPU orchestration, token streaming over SSE and asynchronous persistence">
  <defs>
    <filter id="cg-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="cg-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cg-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cg-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cg-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="cg-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1282" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">ChatGPT: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">A queue for the request, an open stream for the answer, and a buffer that lives in one process</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Gatekeeping · protect the GPUs before spending one</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cg-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cg-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">quota</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cg-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">safe</text>
  <g filter="url(#cg-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="666" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">sends a message</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Gateway</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">token bucket</text>
  <text x="776" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Moderation</text>
  <text x="776" y="216" font-size="20" fill="#64748B" text-anchor="middle">small fast model</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Semantic cache</text>
  <text x="1089" y="262" font-size="20" fill="#065F46" text-anchor="middle">asked this already?</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#1E40AF">2. Context · the model is stateless, so memory is rebuilt every turn</text>
  <path d="M364,436 L456,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cg-blue)"/>
  <text x="410" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">recent</text>
  <path d="M784,436 L876,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cg-blue)"/>
  <text x="830" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>
  <g filter="url(#cg-soft)">
    <rect x="40" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M460,413 L460,459 A160,15 0 0 0 780,459 L780,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="413" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M880,413 L880,459 A160,15 0 0 0 1200,459 L1200,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="413" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Chat Service</text>
  <text x="200" y="458" font-size="20" fill="#64748B" text-anchor="middle">assembles a prompt</text>
  <text x="620" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis context</text>
  <text x="620" y="504" font-size="20" fill="#065F46" text-anchor="middle">recent turns, 1h TTL</text>
  <text x="1040" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DynamoDB</text>
  <text x="1040" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">by conversation id</text>

  <rect x="24" y="580" width="1192" height="360" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#1E40AF">3. Inference · queue in, open stream back. The queue never carries tokens</text>
  <path d="M264,678 L349,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cg-blue)"/>
  <text x="307" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">dispatch</text>
  <path d="M577,678 L662,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#cg-amber)"/>
  <text x="620" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">enqueue</text>
  <path d="M890,678 L975,678" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#cg-amber)"/>
  <text x="933" y="666" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pull</text>
  <path d="M150,716 L150,784" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#cg-emerald)"/>
  <text x="168" y="758" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">appends</text>
  <path d="M1089,716 L1089,784" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#cg-emerald)"/>
  <text x="1107" y="758" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reuses</text>
  <g filter="url(#cg-soft)">
    <rect x="40" y="640" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="353" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,655 L666,701 A110,15 0 0 0 886,701 L886,655" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="776" cy="655" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="979" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M40,803 L40,849 A110,15 0 0 0 260,849 L260,803" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="150" cy="803" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M979,803 L979,849 A110,15 0 0 0 1199,849 L1199,803" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1089" cy="803" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="150" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Chat Service</text>
  <text x="150" y="700" font-size="20" fill="#64748B" text-anchor="middle">holds the SSE</text>
  <text x="463" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Model Gateway</text>
  <text x="463" y="700" font-size="20" fill="#64748B" text-anchor="middle">plus tier first</text>
  <text x="776" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Priority queue</text>
  <text x="776" y="746" font-size="20" fill="#92400E" text-anchor="middle">waits for a GPU</text>
  <text x="1089" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">GPU worker</text>
  <text x="1089" y="700" font-size="20" fill="#64748B" text-anchor="middle">streams tokens back</text>
  <text x="150" y="837" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Token buffer</text>
  <text x="150" y="894" font-size="20" fill="#065F46" text-anchor="middle">in process, not Redis</text>
  <text x="1089" y="837" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">KV cache</text>
  <text x="1089" y="894" font-size="20" fill="#065F46" text-anchor="middle">skips the history maths</text>

  <rect x="24" y="970" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="1002" font-size="20" font-weight="600" fill="#92400E">4. After DONE · write to memory first, disk second</text>
  <path d="M264,1068 L349,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#cg-amber)"/>
  <text x="307" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hot</text>
  <path d="M577,1068 L662,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#cg-amber)"/>
  <text x="620" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">cold</text>
  <path d="M890,1068 L975,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#cg-amber)"/>
  <text x="933" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">index</text>
  <g filter="url(#cg-soft)">
    <rect x="40" y="1030" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,1045 L353,1091 A110,15 0 0 0 573,1091 L573,1045" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="463" cy="1045" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M666,1045 L666,1091 A110,15 0 0 0 886,1091 L886,1045" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="1045" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M979,1045 L979,1091 A110,15 0 0 0 1199,1091 L1199,1045" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="1045" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Chat Service</text>
  <text x="150" y="1090" font-size="20" fill="#64748B" text-anchor="middle">buffer is complete</text>
  <text x="463" y="1079" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis context</text>
  <text x="463" y="1136" font-size="20" fill="#065F46" text-anchor="middle">ready for next turn</text>
  <text x="776" y="1079" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DynamoDB</text>
  <text x="776" y="1136" font-size="20" fill="#5B21B6" text-anchor="middle">permanent history</text>
  <text x="1089" y="1079" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Elasticsearch</text>
  <text x="1089" y="1136" font-size="20" fill="#5B21B6" text-anchor="middle">via change streams</text>
  <line x1="44" y1="1242" x2="72" y2="1242" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1249" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1242" x2="344.576" y2="1242" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1249" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1233" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1249" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1233" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1249" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1233" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1249" font-size="20" fill="#475569">core service</text>
</svg>