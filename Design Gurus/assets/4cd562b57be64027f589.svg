<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="788" viewBox="0 0 1240 788" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="signals-title signals-desc">
<title id="signals-title">Four signals, one runbook line</title>
<desc id="signals-desc">Operability is where this design is unusually strong if it is designed for it, because every control is a comparison that should come out at zero.</desc>
<defs>
<marker id="signals-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="signals-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="signals-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="signals-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="788" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four signals, one runbook line</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Operability is where this design is unusually strong if it is designed for it.</text>
<rect x="40" y="710" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="710" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="140.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Input counts, reconciled</text><text x="310" y="167.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">against each source</text>
<path d="M536 148H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 148H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signals-marker-slate)"/>
<rect x="580" y="118" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">daily, not monthly. Counting what arrived</text><text x="600" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">does not catch what never did</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="212.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Shadow recomputation</text><text x="310" y="239.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">of closed invoices</text>
<path d="M536 220H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 220H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signals-marker-slate)"/>
<rect x="580" y="190" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="226" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">continuously, with any disagreement paged rather than logged</text>
<circle cx="60" cy="292" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Invoice against ledger difference</text>
<path d="M536 292H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 292H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signals-marker-slate)"/>
<rect x="580" y="262" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">should be zero. The single best indicator</text><text x="600" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that money and records have diverged</text>
<circle cx="60" cy="364" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Charges with an unknown outcome</text>
<path d="M536 364H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 364H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#signals-marker-slate)"/>
<rect x="580" y="334" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="370" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a count that should return to zero within minutes</text>
<rect x="40" y="414" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="414" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="445" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The first line of the runbook</text><text x="64" y="471" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Before retrying any charge, query the provider by the stored idempotency key.</text>
<text x="40" y="528" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The three answers that most separate candidates</text>
<rect x="40" y="546" width="372" height="138" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 546H46A6 6 0 0 0 40 552V678A6 6 0 0 0 46 684H54Z" fill="#F3CF6A"/>
<text x="226" y="584" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Rating as a pure function</text>
<text x="226" y="644" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">it is what makes verification</text><text x="226" y="669" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">possible at all</text>
<rect x="434" y="546" width="372" height="138" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 546H440A6 6 0 0 0 434 552V678A6 6 0 0 0 440 684H448Z" fill="#5EC9EC"/>
<text x="620" y="584" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The key stored</text><text x="620" y="612" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">before the attempt</text>
<text x="620" y="644" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the difference between</text><text x="620" y="669" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">recovery and a guess</text>
<rect x="828" y="546" width="372" height="138" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 546H834A6 6 0 0 0 828 552V678A6 6 0 0 0 834 684H842Z" fill="#39D5AA"/>
<text x="1014" y="584" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Refusing to match</text><text x="1014" y="612" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">the old system</text>
<text x="1014" y="644" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">decides whether this is an</text><text x="1014" y="669" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">improvement or a copy</text>
<text x="66" y="744" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The manual steps finance performs today are undocumented requirements.</text>
</svg>