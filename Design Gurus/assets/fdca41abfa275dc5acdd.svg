<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rings side by side. On the left each machine owns one arc, and the four arcs are very different sizes. On the right each machine owns six small virtual nodes of varying sizes, scattered around the ring in an irregular order, so every machine has neighbours of every other colour and still owns about a quarter in total.">
  <rect x="0" y="0" width="1240" height="690" fill="#FFFFFF"/>
  <defs>
    <marker id="chs4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="chs4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="chs4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="chs4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="chs4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="chs4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="chs4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="chs4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="chs4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One token per machine, and the same four machines with virtual nodes</text>
  <rect x="24" y="70" width="588" height="526" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="106" font-size="22" font-weight="600" fill="#B91C1C" text-anchor="middle">One token per machine</text>
  <circle cx="318" cy="320" r="140" fill="none" stroke="#F8FAFC" stroke-width="16"/>
  <path d="M318.0 180.0 A140 140 0 0 1 413.8 217.9" fill="none" stroke="#059669" stroke-width="16"/>
  <path d="M413.8 217.9 A140 140 0 0 1 451.1 363.3" fill="none" stroke="#D97706" stroke-width="16"/>
  <path d="M451.1 363.3 A140 140 0 0 1 180.5 346.2" fill="none" stroke="#7C3AED" stroke-width="16"/>
  <path d="M180.5 346.2 A140 140 0 0 1 318.0 180.0" fill="none" stroke="#3B82F6" stroke-width="16"/>
  <circle cx="413.8" cy="217.9" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <text x="386.4711667993501" y="153.06157362478524" font-size="20" font-weight="700" fill="#065F46" text-anchor="start">B  12%</text>
  <circle cx="451.1" cy="363.3" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <text x="498.1564679699254" y="279.74368098733703" font-size="20" font-weight="700" fill="#B45309" text-anchor="start">C  18%</text>
  <circle cx="180.5" cy="346.2" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <text x="306.32096336754773" y="511.63297148765855" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">D  42%</text>
  <circle cx="318.0" cy="180.0" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <text x="174.68453684370323" y="207.43913790674367" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="end">A  28%</text>
  <text x="318" y="312" font-size="19" fill="#64748B" text-anchor="middle">four arcs,</text>
  <text x="318" y="338" font-size="19" fill="#64748B" text-anchor="middle">all different sizes</text>
  <text x="318" y="546" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">D holds three and a half times what B holds.</text>
  <text x="318" y="574" font-size="19" fill="#64748B" text-anchor="middle">If C leaves, D alone takes all of it and jumps to 60%.</text>
  <rect x="628" y="70" width="588" height="526" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="106" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">Six virtual nodes per machine</text>
