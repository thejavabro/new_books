  <path d="M812.9 407.7 A140 140 0 0 1 796.2 381.4" fill="none" stroke="#D97706" stroke-width="16"/>
  <path d="M794.5 377.9 A140 140 0 0 1 784.9 348.1" fill="none" stroke="#059669" stroke-width="16"/>
  <path d="M784.1 344.3 A140 140 0 0 1 782.9 304.4" fill="none" stroke="#3B82F6" stroke-width="16"/>
  <path d="M783.4 300.5 A140 140 0 0 1 792.8 266.2" fill="none" stroke="#7C3AED" stroke-width="16"/>
  <path d="M794.3 262.6 A140 140 0 0 1 818.6 225.6" fill="none" stroke="#D97706" stroke-width="16"/>
  <path d="M821.3 222.8 A140 140 0 0 1 845.4 202.8" fill="none" stroke="#7C3AED" stroke-width="16"/>
  <path d="M848.6 200.8 A140 140 0 0 1 881.1 186.1" fill="none" stroke="#059669" stroke-width="16"/>
  <path d="M884.8 185.0 A140 140 0 0 1 920.1 180.0" fill="none" stroke="#3B82F6" stroke-width="16"/>
  <text x="922" y="296" font-size="19" fill="#64748B" text-anchor="middle">24 small arcs,</text>
  <text x="922" y="322" font-size="19" fill="#64748B" text-anchor="middle">six for each machine,</text>
  <text x="922" y="348" font-size="19" fill="#64748B" text-anchor="middle">in no fixed order</text>
  <text x="922" y="546" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Each machine's six arcs sit next to different neighbours.</text>
  <text x="922" y="574" font-size="19" fill="#64748B" text-anchor="middle">If C leaves, A, B and D each pick up two of C's arcs.</text>
