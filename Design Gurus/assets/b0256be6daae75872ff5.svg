<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="453" viewBox="0 0 1240 453" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A pattern has three parts">
  <rect x="0" y="0" width="1240" height="453" fill="#FFFFFF"/>
  <defs>
    <marker id="a-475569" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>
  <text x="620" y="46" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">A pattern has three parts</text>
  <rect x="60" y="110" width="360" height="66" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="240" y="150" font-size="22" font-weight="700" fill="#991B1B" text-anchor="middle">A problem</text>
  <rect x="440" y="110" width="360" height="66" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="620" y="150" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">A standard solution</text>
  <rect x="820" y="110" width="360" height="66" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1000" y="150" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">A cost</text>
  <line x1="420" y1="143" x2="432" y2="143" stroke="#475569" stroke-width="2.5" marker-end="url(#a-475569)"/>
  <line x1="800" y1="143" x2="812" y2="143" stroke="#475569" stroke-width="2.5" marker-end="url(#a-475569)"/>
  <rect x="60" y="230" width="360" height="84" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="240" y="264" font-size="20" fill="#475569" text-anchor="middle">The same answer,</text>
  <text x="240" y="292" font-size="20" fill="#475569" text-anchor="middle">recomputed</text>
  <rect x="440" y="230" width="360" height="84" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="620" y="264" font-size="20" fill="#475569" text-anchor="middle">Keep a fast copy,</text>
  <text x="620" y="292" font-size="20" fill="#475569" text-anchor="middle">serve it until it changes</text>
  <rect x="820" y="230" width="360" height="84" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="1000" y="264" font-size="20" fill="#475569" text-anchor="middle">The copy goes stale,</text>
  <text x="1000" y="292" font-size="20" fill="#475569" text-anchor="middle">so something refreshes it</text>
  <text x="620" y="364" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Cache-aside, in its three parts</text>
  <text x="620" y="400" font-size="20" fill="#475569" text-anchor="middle">A pattern description is incomplete without its cost.</text>
</svg>