<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four justified cases: chat gateways, where the open WebSocket is the state; game servers, where state changes many times a second; older applications that keep sessions in server memory; and stream processors that keep running totals in memory.">
  <defs>
    <filter id="sfl3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sfl3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sfl3-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sfl3-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sfl3-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sfl3-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When a stateful server is justified</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">State changes too fast to store elsewhere, or the connection itself is the state.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#sfl3-lift)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="40" y="140" width="9" height="90" fill="#2563EB" clip-path="url(#sfl3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Chat gateways</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the open socket</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">is the state</text>
  <g filter="url(#sfl3-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#sfl3-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Game servers</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">changes many</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">times a second</text>
  <g filter="url(#sfl3-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#D97706" clip-path="url(#sfl3-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Older apps</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">sessions kept in</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">server memory</text>
  <g filter="url(#sfl3-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#sfl3-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Stream jobs</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">running totals</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">kept in memory</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Resource use</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">100,000 sessions at 50 KB each use about 5 GB of one server</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">The price</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">routing, replication, and careful deployments</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Keep it thin</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">make only this layer stateful, and keep the rest stateless</text>
</svg>