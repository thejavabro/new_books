<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="970" viewBox="0 0 1240 970" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three steps: one class doing two jobs, then a concrete database class that is still tightly coupled, then a repository interface that finally lowers coupling">
  <defs>
    <filter id="cpl-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cpl-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="cpl-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="cpl-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="cpl-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="cpl-k1"><rect x="90" y="100" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="cpl-k2"><rect x="90" y="330" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cpl-k3"><rect x="430" y="330" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="cpl-k4"><rect x="80" y="560" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="cpl-k5"><rect x="420" y="560" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cpl-k6"><rect x="830" y="530" width="350" height="90" rx="12"/></clipPath>
    <clipPath id="cpl-k7"><rect x="830" y="650" width="350" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="970" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="200" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Step 1: one class holds the data and the SQL</text>
  <g filter="url(#cpl-soft)">
    <rect x="90" y="100" width="220" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="90" y="100" width="6" height="90" fill="#64748B" clip-path="url(#cpl-k1)"/>
  </g>
  <circle cx="128" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,134.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="154" y="152" font-size="18.5" font-weight="600" fill="#111827">Student</text>
  <text x="330" y="138" font-size="15.5" fill="#6B7280">two jobs in one class, so cohesion is low</text>
  <text x="330" y="166" font-size="15.5" fill="#94A3B8">nothing to be coupled to yet, because there is only one class</text>

  
  <rect x="40" y="270" width="1160" height="200" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="300" font-size="16.5" font-weight="600" fill="#B45309">Step 2: extract the database class</text>
  <g fill="none" stroke-width="2.5">
    <path d="M290,375 H418" stroke="#D97706" marker-end="url(#cpl-am)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="354" y="362" fill="#B45309">names</text>
  </g>
  <g filter="url(#cpl-soft)">
    <rect x="90" y="330" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="90" y="330" width="6" height="90" fill="#64748B" clip-path="url(#cpl-k2)"/>
  </g>
  <circle cx="128" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,364.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="154" y="382" font-size="18.5" font-weight="600" fill="#111827">Student</text>
  <g filter="url(#cpl-lift)">
    <rect x="430" y="330" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="430" y="330" width="9" height="90" fill="#D97706" clip-path="url(#cpl-k3)"/>
  </g>
  <circle cx="470" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(459.56,364.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="496" y="382" font-size="18.5" font-weight="600" fill="#111827">MySqlDatabase</text>
  <text x="700" y="362" font-size="15.5" fill="#6B7280">cohesion is fixed, and coupling is now tight</text>
  <text x="700" y="390" font-size="15.5" fill="#B45309">Student cannot store anywhere else, or be tested without MySQL</text>

  
  <rect x="40" y="500" width="1160" height="280" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="530" font-size="16.5" font-weight="600" fill="#047857">Step 3: depend on an interface</text>
  <g fill="none" stroke-width="2.5">
    <path d="M280,605 H408" stroke="#059669" marker-end="url(#cpl-em)"/>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M830,575 H802 Q790,575 790,587 V593 Q790,605 778,605 H732" stroke="#64748B" marker-end="url(#cpl-sl)"/>
    <path d="M830,695 H802 Q790,695 790,683 V617 Q790,605 778,605 H732" stroke="#64748B" marker-end="url(#cpl-sl)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="344" y="592" fill="#047857">names</text>
    <text x="920" y="640" fill="#475569">implements</text>
  </g>
  <g filter="url(#cpl-soft)">
    <rect x="80" y="560" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="560" width="6" height="90" fill="#2563EB" clip-path="url(#cpl-k4)"/>
  </g>
  <circle cx="118" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,594.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="144" y="612" font-size="18.5" font-weight="600" fill="#111827">Student</text>
  <text x="180" y="675" font-size="15.5" text-anchor="middle" fill="#6B7280">names no database</text>

  <g filter="url(#cpl-lift)">
    <rect x="420" y="560" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="420" y="560" width="9" height="90" fill="#059669" clip-path="url(#cpl-k5)"/>
  </g>
  <circle cx="460" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(449.56,594.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="486" y="612" font-size="18.5" font-weight="600" fill="#111827">StudentRepository</text>
  <text x="570" y="675" font-size="15.5" text-anchor="middle" fill="#6B7280">one method, not a working class</text>

  <g filter="url(#cpl-soft)">
    <rect x="830" y="530" width="350" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="830" y="530" width="6" height="90" fill="#64748B" clip-path="url(#cpl-k6)"/>
  </g>
  <circle cx="868" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,564.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="894" y="582" font-size="18.5" font-weight="600" fill="#111827">MySqlStudentRepository</text>

  <g filter="url(#cpl-soft)">
    <rect x="830" y="650" width="350" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="830" y="650" width="6" height="90" fill="#64748B" clip-path="url(#cpl-k7)"/>
  </g>
  <circle cx="868" cy="695" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,684.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="894" y="702" font-size="18.5" font-weight="600" fill="#111827">InMemoryStudentRepository</text>

  
  <rect x="40" y="810" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="834" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="856" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Splitting is not enough</text>
  <text x="288" y="856" font-size="15.5" fill="#475569">extracting a class improves cohesion and leaves the dependency pointing at a concrete class</text>
  <rect x="64" y="878" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="900" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">This is the fix</text>
  <text x="288" y="900" font-size="15.5" fill="#475569">coupling drops only when the dependency points at an abstraction the caller supplies</text>
</svg>