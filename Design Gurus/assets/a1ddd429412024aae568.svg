<rect x="0" y="0" width="1240" height="990" fill="#FFFFFF"/>
<path d="M 540,160 H 638 Q 650,160 650,148 V 136 Q 650,124 662,124 H 757" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#fm1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="210" fill="#4338CA">every message belongs</text><text x="650" y="232" fill="#4338CA">to one conversation</text></g><path d="M 960,228 V 297" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#fm1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="960" y="269" fill="#475569">UserID1 and UserID2 point to users</text></g><path d="M 960,590 V 517" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#fm1-mamb)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="960" y="557" fill="#B45309">a user can have several devices</text></g><path d="M 540,576 H 638 Q 650,576 650,564 V 490 Q 650,478 662,478 H 757" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#fm1-mvio)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="508" fill="#5B21B6">MemberIDs is a</text><text x="650" y="530" fill="#5B21B6">list of UserIDs</text></g><g filter="url(#fm1-lift)">
<rect x="70" y="50" width="470" height="286" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="70" y="50" width="9" height="286" fill="#2563EB" clip-path="url(#fm1-k1)"/>
</g>
<circle cx="108" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,67.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
<text x="134" y="85" font-size="18.5" font-weight="600" fill="#111827">Message (one row per message)</text><text x="94" y="131" font-size="15.5" fill="#111827">MessageID</text><text x="516" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">bigint, primary key</text><line x1="84" y1="142" x2="526" y2="142" stroke="#93C5FD" stroke-width="1"/><text x="94" y="167" font-size="15.5" fill="#111827">ConversationID</text><text x="516" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">bigint</text><line x1="84" y1="178" x2="526" y2="178" stroke="#93C5FD" stroke-width="1"/><text x="94" y="203" font-size="15.5" fill="#111827">SenderID, ReceiverID</text><text x="516" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">int</text><line x1="84" y1="214" x2="526" y2="214" stroke="#93C5FD" stroke-width="1"/><text x="94" y="239" font-size="15.5" fill="#111827">SequenceNumber</text><text x="516" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">bigint</text><line x1="84" y1="250" x2="526" y2="250" stroke="#93C5FD" stroke-width="1"/><text x="94" y="275" font-size="15.5" fill="#111827">Text</text><text x="516" y="275" font-size="15.5" text-anchor="end" fill="#6B7280">about 100 bytes</text><line x1="84" y1="286" x2="526" y2="286" stroke="#93C5FD" stroke-width="1"/><text x="94" y="311" font-size="15.5" fill="#111827">Timestamp</text><text x="516" y="311" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><text x="305" y="361" font-size="15.5" text-anchor="middle" fill="#6B7280">the only table with billions of rows</text><g filter="url(#fm1-soft)">
<rect x="760" y="50" width="400" height="178" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="760" y="50" width="6" height="178" fill="#4F46E5" clip-path="url(#fm1-k2)"/>
</g>
<circle cx="798" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,67.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
<text x="824" y="85" font-size="18.5" font-weight="600" fill="#111827">Conversation (one-on-one)</text><text x="784" y="131" font-size="15.5" fill="#111827">ConversationID</text><text x="1136" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">bigint, primary key</text><line x1="774" y1="142" x2="1146" y2="142" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="167" font-size="15.5" fill="#111827">UserID1, UserID2</text><text x="1136" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">int</text><line x1="774" y1="178" x2="1146" y2="178" stroke="#A5B4FC" stroke-width="1"/><text x="784" y="203" font-size="15.5" fill="#111827">LastMessageAt</text><text x="1136" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g filter="url(#fm1-soft)">
<rect x="760" y="300" width="400" height="214" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="760" y="300" width="6" height="214" fill="#64748B" clip-path="url(#fm1-k3)"/>
</g>
<circle cx="798" cy="328" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,317.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="824" y="335" font-size="18.5" font-weight="600" fill="#111827">User</text><text x="784" y="381" font-size="15.5" fill="#111827">UserID</text><text x="1136" y="381" font-size="15.5" text-anchor="end" fill="#6B7280">int, primary key</text><line x1="774" y1="392" x2="1146" y2="392" stroke="#94A3B8" stroke-width="1"/><text x="784" y="417" font-size="15.5" fill="#111827">Name</text><text x="1136" y="417" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(32)</text><line x1="774" y1="428" x2="1146" y2="428" stroke="#94A3B8" stroke-width="1"/><text x="784" y="453" font-size="15.5" fill="#111827">Email</text><text x="1136" y="453" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(32)</text><line x1="774" y1="464" x2="1146" y2="464" stroke="#94A3B8" stroke-width="1"/><text x="784" y="489" font-size="15.5" fill="#111827">LastOnlineAt</text><text x="1136" y="489" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g filter="url(#fm1-soft)">
<rect x="70" y="430" width="470" height="214" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="70" y="430" width="6" height="214" fill="#7C3AED" clip-path="url(#fm1-k4)"/>
</g>
<circle cx="108" cy="458" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,447.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="134" y="465" font-size="18.5" font-weight="600" fill="#111827">GroupChat</text><text x="94" y="511" font-size="15.5" fill="#111827">GroupChatID</text><text x="516" y="511" font-size="15.5" text-anchor="end" fill="#6B7280">bigint, primary key</text><line x1="84" y1="522" x2="526" y2="522" stroke="#C4B5FD" stroke-width="1"/><text x="94" y="547" font-size="15.5" fill="#111827">Name</text><text x="516" y="547" font-size="15.5" text-anchor="end" fill="#6B7280">varchar(32)</text><line x1="84" y1="558" x2="526" y2="558" stroke="#C4B5FD" stroke-width="1"/><text x="94" y="583" font-size="15.5" fill="#111827">MemberIDs</text><text x="516" y="583" font-size="15.5" text-anchor="end" fill="#6B7280">list of UserIDs</text><line x1="84" y1="594" x2="526" y2="594" stroke="#C4B5FD" stroke-width="1"/><text x="94" y="619" font-size="15.5" fill="#111827">CreatedAt</text><text x="516" y="619" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g filter="url(#fm1-soft)">
<rect x="760" y="590" width="400" height="178" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="760" y="590" width="6" height="178" fill="#D97706" clip-path="url(#fm1-k5)"/>
</g>
<circle cx="798" cy="618" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,607.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
<text x="824" y="625" font-size="18.5" font-weight="600" fill="#111827">Device (push notifications)</text><text x="784" y="671" font-size="15.5" fill="#111827">UserID, DeviceID</text><text x="1136" y="671" font-size="15.5" text-anchor="end" fill="#6B7280">composite key</text><line x1="774" y1="682" x2="1146" y2="682" stroke="#FCD34D" stroke-width="1"/><text x="784" y="707" font-size="15.5" fill="#111827">PushToken</text><text x="1136" y="707" font-size="15.5" text-anchor="end" fill="#6B7280">varchar</text><line x1="774" y1="718" x2="1146" y2="718" stroke="#FCD34D" stroke-width="1"/><text x="784" y="743" font-size="15.5" fill="#111827">Platform</text><text x="1136" y="743" font-size="15.5" text-anchor="end" fill="#6B7280">apple, google, web</text><rect x="40" y="820" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="846" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="868" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Only Message is big</text><text x="288" y="868" font-size="15.5" fill="#475569">it gains 20 billion rows a day; the other tables grow only when people sign up or start chats</text><rect x="64" y="890" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/><text x="164" y="912" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">List in the row</text><text x="288" y="912" font-size="15.5" fill="#475569">a wide-column store shapes each row around its query: find every member of this group</text>
</svg>