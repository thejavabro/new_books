<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="990" viewBox="0 0 1240 990" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Messenger data model: Message with a ConversationID and sequence number, Conversation, User, GroupChat with its member list in the row, and Device for push notifications">
<defs>
