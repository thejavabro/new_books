<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What a pattern gives you: the name of a problem you will meet, a solution many teams have already used, and the cost of that solution, which is what tells you whether to apply it">
  <defs>
    <marker id="in2-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <clipPath id="in2-k1"><rect x="72" y="104" width="336" height="120" rx="12"/></clipPath>
    <clipPath id="in2-k2"><rect x="452" y="104" width="336" height="120" rx="12"/></clipPath>
    <clipPath id="in2-k3"><rect x="832" y="104" width="336" height="120" rx="12"/></clipPath>
    <filter id="in2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="in2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="320" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Every chapter of this course covers these three things</text>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M414,164 H444" marker-end="url(#in2-mblue)"/>
    <path d="M794,164 H824" marker-end="url(#in2-mblue)"/>
  </g>
  <g filter="url(#in2-soft)">
    <rect x="72" y="104" width="336" height="120" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="72" y="104" width="6" height="120" fill="#D97706" clip-path="url(#in2-k1)"/>
  </g>
  <circle cx="110" cy="164" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,153.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="136" y="171" font-size="18.5" font-weight="600" fill="#111827">A Named Problem</text>
  <text x="240" y="249" font-size="15.5" text-anchor="middle" fill="#6B7280">something that goes wrong</text>
  <text x="240" y="272" font-size="15.5" text-anchor="middle" fill="#94A3B8">in almost every system</text>
  <text x="240" y="295" font-size="15.5" text-anchor="middle" fill="#94A3B8">once services are separate</text>
  <g filter="url(#in2-soft)">
    <rect x="452" y="104" width="336" height="120" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="452" y="104" width="6" height="120" fill="#059669" clip-path="url(#in2-k2)"/>
  </g>
  <circle cx="490" cy="164" r="18" fill="#FFFFFF"/>
  <g transform="translate(479.56,153.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="516" y="171" font-size="18.5" font-weight="600" fill="#111827">A Known Solution</text>
  <text x="620" y="249" font-size="15.5" text-anchor="middle" fill="#6B7280">a shape many teams have</text>
  <text x="620" y="272" font-size="15.5" text-anchor="middle" fill="#94A3B8">already built and run</text>
  <text x="620" y="295" font-size="15.5" text-anchor="middle" fill="#94A3B8">so you are not guessing</text>
  <g filter="url(#in2-soft)">
    <rect x="832" y="104" width="336" height="120" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="832" y="104" width="6" height="120" fill="#DB2777" clip-path="url(#in2-k3)"/>
  </g>
  <circle cx="870" cy="164" r="18" fill="#FFFFFF"/>
  <g transform="translate(859.56,153.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="896" y="171" font-size="18.5" font-weight="600" fill="#111827">The Cost</text>
  <text x="1000" y="249" font-size="15.5" text-anchor="middle" fill="#6B7280">what the solution adds:</text>
  <text x="1000" y="272" font-size="15.5" text-anchor="middle" fill="#94A3B8">parts, delay, or work,</text>
  <text x="1000" y="295" font-size="15.5" text-anchor="middle" fill="#94A3B8">so you can decide</text>
  <rect x="40" y="412" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="436" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="458" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The part that decides</text>
  <text x="288" y="458" font-size="15.5" fill="#475569">a pattern applied where it is not needed adds moving parts and gives nothing back</text>
</svg>