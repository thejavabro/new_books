<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A cache hit finds the data in the cache. A cache miss fetches the data from the source. Cache eviction removes data to make room. Cache staleness means the cached copy is older than the source.">
  <defs>
    <filter id="ch2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ch2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ch2-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ch2-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ch2-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ch2-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Four key caching terms</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The words used to describe what happens inside a cache.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ch2-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#059669" clip-path="url(#ch2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Cache hit</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the data is found</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">in the cache</text>
  <g filter="url(#ch2-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#D97706" clip-path="url(#ch2-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Cache miss</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fetched from the</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">original source</text>
  <g filter="url(#ch2-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#ch2-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Eviction</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">data is removed</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">to make room</text>
  <g filter="url(#ch2-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#ch2-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Staleness</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the copy is older</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">than the source</text>

  <rect x="40" y="340" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="365" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">TTL</text>
  <text x="323" y="390" font-size="18.5" fill="#475569">a time limit after which a cached item is treated as stale</text>
</svg>