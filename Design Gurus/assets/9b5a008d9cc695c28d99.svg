<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The ten uses of proxies grouped into performance, security and privacy, and control and visibility">
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <defs>
    <filter id="px5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="386" height="400" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="213" y="82" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Faster</text>

  <rect x="426" y="40" width="386" height="400" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="619" y="82" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Safer</text>

  <rect x="832" y="40" width="386" height="400" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1025" y="82" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Under control</text>

  <g filter="url(#px5-soft)">
    <rect x="42" y="110" width="342" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="42" y="188" width="342" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="42" y="266" width="342" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

    <rect x="448" y="110" width="342" height="56" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="448" y="188" width="342" height="56" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="448" y="266" width="342" height="56" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

    <rect x="854" y="110" width="342" height="56" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="854" y="188" width="342" height="56" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="854" y="266" width="342" height="56" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="854" y="344" width="342" height="56" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>

  <text x="213" y="145" font-size="20" fill="#065F46" text-anchor="middle">1 Performance, by caching</text>
  <text x="213" y="223" font-size="20" fill="#065F46" text-anchor="middle">2 Load balancing</text>
  <text x="213" y="301" font-size="20" fill="#065F46" text-anchor="middle">3 Content adaptation</text>

  <text x="619" y="145" font-size="20" fill="#991B1B" text-anchor="middle">4 Security barrier</text>
  <text x="619" y="223" font-size="20" fill="#991B1B" text-anchor="middle">5 Anonymity and privacy</text>
  <text x="619" y="301" font-size="20" fill="#991B1B" text-anchor="middle">6 SSL termination</text>

  <text x="1025" y="145" font-size="20" fill="#5B21B6" text-anchor="middle">7 Centralized control</text>
  <text x="1025" y="223" font-size="20" fill="#5B21B6" text-anchor="middle">8 Content filtering</text>
  <text x="1025" y="301" font-size="20" fill="#5B21B6" text-anchor="middle">9 Logging and auditing</text>
  <text x="1025" y="379" font-size="20" fill="#5B21B6" text-anchor="middle">10 Application gateway</text>

  <text x="620" y="490" font-size="20" fill="#475569" text-anchor="middle">A proxy sees every request and can change what it forwards, which is why one box does all of this</text>
</svg>