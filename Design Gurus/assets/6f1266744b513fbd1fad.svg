<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="802" viewBox="0 0 1240 802" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A shared timeline showing the same event reaching a client four ways. With short polling the client only learns at its next scheduled request, so it is late. With long polling the server is already holding the connection open and answers at once, then there is a short gap while the client reconnects. With WebSockets one connection stays open and either side can send at any moment. With server-sent events one connection stays open and only the server sends.">
  <rect x="0" y="0" width="1240" height="802" fill="#FFFFFF"/>
  <defs>
    <marker id="rtd2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rtd2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rtd2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rtd2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rtd2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rtd2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rtd2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rtd2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rtd2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same event, delivered four ways, on one timeline</text>
  <path d="M800,94 L800,128" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M800,128 L800,242" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M800,292 L800,406" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M800,456 L800,570" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M800,620 L800,734" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="800" y="80" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="middle">the server has news</text>
  <rect x="800" y="162" width="126" height="64" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <g filter="url(#rtd2-soft)"><rect x="24" y="142" width="216" height="84" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="132" y="176" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">Short polling</text>
  <text x="132" y="204" font-size="17" fill="#64748B" text-anchor="middle">ask on a timer</text>
  <path d="M312,164 L1200,164" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 5"/>
  <path d="M312,224 L1200,224" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 5"/>
  <text x="302" y="169" font-size="18" fill="#64748B" text-anchor="end">client</text>
  <text x="302" y="229" font-size="18" fill="#64748B" text-anchor="end">server</text>
  <line x1="340" y1="170" x2="340" y2="218" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#rtd2-b)"/>
  <line x1="366" y1="218" x2="366" y2="170" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#rtd2-g)"/>
  <line x1="480" y1="170" x2="480" y2="218" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#rtd2-b)"/>
  <line x1="506" y1="218" x2="506" y2="170" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#rtd2-g)"/>
  <line x1="620" y1="170" x2="620" y2="218" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#rtd2-b)"/>
  <line x1="646" y1="218" x2="646" y2="170" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#rtd2-g)"/>
  <line x1="760" y1="170" x2="760" y2="218" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#rtd2-b)"/>
  <line x1="786" y1="218" x2="786" y2="170" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#rtd2-g)"/>
  <line x1="900" y1="170" x2="900" y2="218" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#rtd2-b)"/>
  <line x1="926" y1="218" x2="926" y2="170" stroke="#059669" stroke-width="2.2" marker-end="url(#rtd2-e)"/>
  <line x1="1040" y1="170" x2="1040" y2="218" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#rtd2-b)"/>
  <line x1="1066" y1="218" x2="1066" y2="170" stroke="#CBD5E1" stroke-width="2.2" marker-end="url(#rtd2-g)"/>
  <rect x="757.185" y="126" width="245.63000000000002" height="30" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="880" y="142" font-size="18" font-weight="700" fill="#B91C1C" text-anchor="middle">up to one interval late</text>
  <text x="312" y="264" font-size="18" fill="#64748B" text-anchor="start">Every request is a new connection. Most answers are empty, and the news waits for the next one.</text>
  <rect x="800" y="326" width="48" height="64" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <g filter="url(#rtd2-soft)"><rect x="24" y="306" width="216" height="84" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="132" y="340" font-size="20" font-weight="700" fill="#B45309" text-anchor="middle">Long polling</text>
  <text x="132" y="368" font-size="17" fill="#64748B" text-anchor="middle">ask, server holds</text>
  <path d="M312,328 L1200,328" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 5"/>
  <path d="M312,388 L1200,388" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 5"/>
  <text x="302" y="333" font-size="18" fill="#64748B" text-anchor="end">client</text>
  <text x="302" y="393" font-size="18" fill="#64748B" text-anchor="end">server</text>
  <rect x="340" y="324" width="860" height="8" rx="4" fill="#D97706"/>
  <rect x="340" y="384" width="860" height="8" rx="4" fill="#D97706"/>
  <rect x="800" y="324" width="400" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="800" y="384" width="400" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="848" y="324" width="352" height="8" rx="4" fill="#D97706"/>
  <rect x="848" y="384" width="352" height="8" rx="4" fill="#D97706"/>
  <line x1="340" y1="334" x2="340" y2="382" stroke="#D97706" stroke-width="2.2" marker-end="url(#rtd2-a)"/>
  <line x1="800" y1="382" x2="800" y2="334" stroke="#059669" stroke-width="2.2" marker-end="url(#rtd2-e)"/>
  <line x1="848" y1="334" x2="848" y2="382" stroke="#D97706" stroke-width="2.2" marker-end="url(#rtd2-a)"/>
  <rect x="683.61" y="290" width="392.78000000000003" height="30" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="880" y="306" font-size="18" font-weight="700" fill="#B45309" text-anchor="middle">answered at once, then a reconnect gap</text>
  <text x="312" y="428" font-size="18" fill="#64748B" text-anchor="start">The connection is held open until there is news. The answer comes on that open connection.</text>
  <g filter="url(#rtd2-soft)"><rect x="24" y="470" width="216" height="84" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="132" y="504" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">WebSockets</text>
  <text x="132" y="532" font-size="17" fill="#64748B" text-anchor="middle">both sides send</text>
  <path d="M312,492 L1200,492" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 5"/>
  <path d="M312,552 L1200,552" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 5"/>
  <text x="302" y="497" font-size="18" fill="#64748B" text-anchor="end">client</text>
  <text x="302" y="557" font-size="18" fill="#64748B" text-anchor="end">server</text>
  <rect x="452" y="488" width="748" height="8" rx="4" fill="#7C3AED"/>
  <rect x="452" y="548" width="748" height="8" rx="4" fill="#7C3AED"/>
  <line x1="354" y1="498" x2="354" y2="546" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#rtd2-v)"/>
  <line x1="406" y1="546" x2="406" y2="498" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#rtd2-v)"/>
  <text x="380" y="478" font-size="17" fill="#6D28D9" text-anchor="middle">upgrade</text>
  <line x1="560" y1="498" x2="560" y2="546" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#rtd2-v)"/>
  <line x1="660" y1="546" x2="660" y2="498" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#rtd2-v)"/>
  <line x1="800" y1="546" x2="800" y2="498" stroke="#059669" stroke-width="2.2" marker-end="url(#rtd2-e)"/>
  <line x1="1000" y1="498" x2="1000" y2="546" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#rtd2-v)"/>
  <rect x="866.425" y="454" width="167.15" height="30" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="950" y="470" font-size="18" font-weight="700" fill="#065F46" text-anchor="middle">arrives at once</text>
  <text x="312" y="592" font-size="18" fill="#64748B" text-anchor="start">One connection stays open after the upgrade. Either side may send at any moment.</text>
  <g filter="url(#rtd2-soft)"><rect x="24" y="634" width="216" height="84" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="132" y="668" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle">Server-sent events</text>
  <text x="132" y="696" font-size="17" fill="#64748B" text-anchor="middle">only the server sends</text>
  <path d="M312,656 L1200,656" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 5"/>
  <path d="M312,716 L1200,716" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="3 5"/>
  <text x="302" y="661" font-size="18" fill="#64748B" text-anchor="end">client</text>
  <text x="302" y="721" font-size="18" fill="#64748B" text-anchor="end">server</text>
  <rect x="400" y="652" width="800" height="8" rx="4" fill="#0D9488"/>
  <rect x="400" y="712" width="800" height="8" rx="4" fill="#0D9488"/>
  <line x1="354" y1="662" x2="354" y2="710" stroke="#0D9488" stroke-width="2.2" marker-end="url(#rtd2-t)"/>
  <text x="354" y="642" font-size="17" fill="#0F766E" text-anchor="middle">GET</text>
  <line x1="560" y1="710" x2="560" y2="662" stroke="#0D9488" stroke-width="2.2" marker-end="url(#rtd2-t)"/>
  <line x1="800" y1="710" x2="800" y2="662" stroke="#059669" stroke-width="2.2" marker-end="url(#rtd2-e)"/>
  <line x1="1000" y1="710" x2="1000" y2="662" stroke="#0D9488" stroke-width="2.2" marker-end="url(#rtd2-t)"/>
  <rect x="866.425" y="618" width="167.15" height="30" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="950" y="634" font-size="18" font-weight="700" fill="#065F46" text-anchor="middle">arrives at once</text>
  <text x="312" y="756" font-size="18" fill="#64748B" text-anchor="start">One connection stays open. Only the server sends on it, and the browser reconnects by itself.</text>
</svg>