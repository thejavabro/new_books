<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Side by side comparison: virtual machines stack a hypervisor over host hardware and give every guest its own full operating system costing gigabytes, while containers share one host kernel over the same hardware so each app plus its libraries costs megabytes.">
  <defs>
    <marker id="m06-l01-vm-vs-container-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l01-vm-vs-container-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m06-l01-vm-vs-container-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>

  <rect x="50" y="80" width="520" height="440" rx="14" fill="#F1F5F9" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="120" font-size="20" font-weight="600" fill="#334155">Virtual machines</text>
  <text x="550" y="120" text-anchor="end" font-size="20" fill="#64748B">a full OS per VM</text>
  <rect x="620" y="80" width="560" height="440" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="640" y="120" font-size="20" font-weight="600" fill="#065F46">Containers</text>
  <text x="1160" y="120" text-anchor="end" font-size="20" fill="#64748B">process-level isolation</text>

  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="190" y="160" width="240" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="310" y="207" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Host hardware</text>
  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="190" y="280" width="240" height="80" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="310" y="327" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Hypervisor</text>
  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="70" y="400" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="180" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Guest OS + app</text>
  <text x="180" y="473" text-anchor="middle" font-size="20" fill="#475569">gigabytes</text>
  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="330" y="400" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="440" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Guest OS + app</text>
  <text x="440" y="473" text-anchor="middle" font-size="20" fill="#475569">gigabytes</text>

  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="780" y="160" width="240" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="900" y="207" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Host hardware</text>
  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="700" y="280" width="400" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="900" y="327" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One shared host kernel</text>
  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="640" y="400" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="725" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">App + libs</text>
  <text x="725" y="473" text-anchor="middle" font-size="20" fill="#065F46">megabytes</text>
  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="825" y="400" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="910" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">App + libs</text>
  <text x="910" y="473" text-anchor="middle" font-size="20" fill="#065F46">megabytes</text>
  <g filter="url(#m06-l01-vm-vs-container-soft)">
    <rect x="1010" y="400" width="170" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1095" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">App + libs</text>
  <text x="1095" y="473" text-anchor="middle" font-size="20" fill="#065F46">megabytes</text>

  <g fill="none" stroke-width="2.5">
    <path d="M310,240 L310,272" stroke="#475569" stroke-width="2" marker-end="url(#m06-l01-vm-vs-container-sl)"/>
    <path d="M270,360 C270,380 180,372 180,392" stroke="#475569" stroke-width="2" marker-end="url(#m06-l01-vm-vs-container-sl)"/>
    <path d="M350,360 C350,380 440,372 440,392" stroke="#475569" stroke-width="2" marker-end="url(#m06-l01-vm-vs-container-sl)"/>
    <path d="M900,240 L900,272" stroke="#059669" stroke-width="2" marker-end="url(#m06-l01-vm-vs-container-em)"/>
    <path d="M820,360 C820,380 725,372 725,392" stroke="#059669" stroke-width="2" marker-end="url(#m06-l01-vm-vs-container-em)"/>
    <path d="M900,360 L900,392" stroke="#059669" stroke-width="2" marker-end="url(#m06-l01-vm-vs-container-em)"/>
    <path d="M980,360 C980,380 1095,372 1095,392" stroke="#059669" stroke-width="2" marker-end="url(#m06-l01-vm-vs-container-em)"/>
  </g>

  <line x1="60" y1="590" x2="96" y2="590" stroke="#475569" stroke-width="4"/>
  <text x="108" y="597" font-size="20" fill="#475569">Virtualized: every VM ships its own guest OS, so it costs gigabytes</text>
  <line x1="60" y1="630" x2="96" y2="630" stroke="#059669" stroke-width="4"/>
  <text x="108" y="637" font-size="20" fill="#475569">Shared kernel: a container ships only its app, so it costs megabytes</text>
</svg>