<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A spectrum from architecture to detailed design. Architecture: one backend application or separate services, one shared PostgreSQL database, the public API used by the three apps, each taking months to change. Between the two: order status values used by all apps, where a new status touches five parts and needs an app release, and Dispatch reading the Orders tables directly, which looked like a detail at first but cost 3 engineers about 7 weeks to undo. Detailed design: the Dispatch matching algorithm, an index on orders.customer_id and the name of a function, taking a day or less.">
  <defs>
    <filter id="mf01b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mf01b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mf01b-k1"><rect x="64" y="230" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="mf01b-k2"><rect x="64" y="360" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="mf01b-k3"><rect x="64" y="490" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="mf01b-k4"><rect x="459" y="230" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="mf01b-k5"><rect x="459" y="360" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="mf01b-k6"><rect x="854" y="230" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="mf01b-k7"><rect x="854" y="360" width="322" height="90" rx="12"/></clipPath>
    <clipPath id="mf01b-k8"><rect x="854" y="490" width="322" height="90" rx="12"/></clipPath>
    <marker id="mf01b-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="mf01b-s-slate" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The decision spectrum</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Food-delivery decisions placed by how much it costs to change them later (costs are illustrative).</text>

  <rect x="40" y="180" width="370" height="460" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="210" font-size="19.5" font-weight="600" fill="#4338CA">Architecture</text>
  <rect x="435" y="180" width="370" height="460" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="459" y="210" font-size="19.5" font-weight="600" fill="#475569">Between the two</text>
  <rect x="830" y="180" width="370" height="460" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="854" y="210" font-size="19.5" font-weight="600" fill="#1D4ED8">Detailed design</text>

  <g fill="none" stroke-width="2">
    <path d="M48,152 H1192" stroke="#64748B" marker-end="url(#mf01b-m-slate)" marker-start="url(#mf01b-s-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#mf01b-soft)">
    <rect x="64" y="230" width="322" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="64" y="230" width="6" height="90" fill="#4F46E5" clip-path="url(#mf01b-k1)"/>
  </g>
  <text x="84" y="269.25" font-size="21.5" font-weight="600" fill="#111827">One backend app or</text>
  <text x="84" y="294.75" font-size="21.5" font-weight="600" fill="#111827">separate services</text>
  <text x="225" y="349" font-size="18.5" text-anchor="middle" fill="#6B7280">months to change</text>
  <g filter="url(#mf01b-soft)">
    <rect x="64" y="360" width="322" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="64" y="360" width="6" height="90" fill="#4F46E5" clip-path="url(#mf01b-k2)"/>
  </g>
  <text x="84" y="399.25" font-size="21.5" font-weight="600" fill="#111827">One shared</text>
  <text x="84" y="424.75" font-size="21.5" font-weight="600" fill="#111827">PostgreSQL database</text>
  <text x="225" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">months to change</text>
  <g filter="url(#mf01b-soft)">
    <rect x="64" y="490" width="322" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="64" y="490" width="6" height="90" fill="#4F46E5" clip-path="url(#mf01b-k3)"/>
  </g>
  <text x="84" y="529.25" font-size="21.5" font-weight="600" fill="#111827">Public API used by</text>
  <text x="84" y="554.75" font-size="21.5" font-weight="600" fill="#111827">the three apps</text>
  <text x="225" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">months; old apps stay on phones</text>
  <g filter="url(#mf01b-soft)">
    <rect x="459" y="230" width="322" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="459" y="230" width="6" height="90" fill="#64748B" clip-path="url(#mf01b-k4)"/>
  </g>
  <text x="479" y="269.25" font-size="21.5" font-weight="600" fill="#111827">Order status values</text>
  <text x="479" y="294.75" font-size="21.5" font-weight="600" fill="#111827">used by all apps</text>
  <text x="620" y="349" font-size="18.5" text-anchor="middle" fill="#6B7280">five parts; needs an app release</text>
  <g filter="url(#mf01b-soft)">
    <rect x="459" y="360" width="322" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="459" y="360" width="6" height="90" fill="#64748B" clip-path="url(#mf01b-k5)"/>
  </g>
  <text x="479" y="399.25" font-size="21.5" font-weight="600" fill="#111827">Dispatch reads Orders</text>
  <text x="479" y="424.75" font-size="21.5" font-weight="600" fill="#111827">tables directly</text>
  <text x="620" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">looked like a detail at first;</text>
  <text x="620" y="503" font-size="18.5" text-anchor="middle" fill="#6B7280">3 engineers, about 7 weeks to undo</text>
  <g filter="url(#mf01b-soft)">
    <rect x="854" y="230" width="322" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="854" y="230" width="6" height="90" fill="#2563EB" clip-path="url(#mf01b-k6)"/>
  </g>
  <text x="874" y="269.25" font-size="21.5" font-weight="600" fill="#111827">Dispatch matching</text>
  <text x="874" y="294.75" font-size="21.5" font-weight="600" fill="#111827">algorithm</text>
  <text x="1015" y="349" font-size="18.5" text-anchor="middle" fill="#6B7280">about a day, inside Dispatch</text>
  <g filter="url(#mf01b-soft)">
    <rect x="854" y="360" width="322" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="854" y="360" width="6" height="90" fill="#2563EB" clip-path="url(#mf01b-k7)"/>
  </g>
  <text x="874" y="399.25" font-size="21.5" font-weight="600" fill="#111827">Index on</text>
  <text x="874" y="424.75" font-size="21.5" font-weight="600" fill="#111827">orders.customer_id</text>
  <text x="1015" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">minutes</text>
  <g filter="url(#mf01b-soft)">
    <rect x="854" y="490" width="322" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="854" y="490" width="6" height="90" fill="#2563EB" clip-path="url(#mf01b-k8)"/>
  </g>
  <text x="874" y="529.25" font-size="21.5" font-weight="600" fill="#111827">Name of the order</text>
  <text x="874" y="554.75" font-size="21.5" font-weight="600" fill="#111827">total function</text>
  <text x="1015" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">seconds, with a rename tool</text>
  <text x="40" y="132" font-size="18.5" font-weight="600" fill="#BE185D">Many parts, high cost, hard to undo</text>
  <text x="1200" y="132" font-size="18.5" font-weight="600" text-anchor="end" fill="#047857">One part, low cost, easy to undo</text>



  <rect x="40" y="680" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Scope</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">how many parts and teams the decision touches</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Cost of change</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">engineer time to change it once the system is in production</text>
  <rect x="64" y="805" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="830" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Reversibility</text>
  <text x="323" y="830" font-size="18.5" fill="#475569">whether a code change alone undoes it, or data and apps must change too</text>
</svg>