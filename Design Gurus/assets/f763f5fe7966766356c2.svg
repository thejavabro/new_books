<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One front door: the mobile app, web app, and third party clients all call a single API gateway that handles auth, rate limits, TLS, routing, and composition, and the gateway routes each request to the Catalog, Checkout, and Orders services.">
  <defs>
    <marker id="m03-l06-api-gateway-layer-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m03-l06-api-gateway-layer-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <rect x="30" y="100" width="330" height="460" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="52" y="138" font-size="20" font-weight="600" fill="#334155">Outside: one stable address</text>
  <text x="52" y="170" font-size="20" fill="#64748B">clients hold no topology</text>

  <rect x="830" y="100" width="370" height="460" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="852" y="138" font-size="20" font-weight="600" fill="#1E3A8A">Inside: topology is free</text>
  <text x="852" y="170" font-size="20" fill="#64748B">services split, merge, and move</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l06-api-gateway-layer-blue)">
    <path d="M344,255 C392,255 380,340 422,340"/>
    <path d="M344,375 L422,375"/>
    <path d="M344,495 C392,495 380,410 422,410"/>
    <path d="M760,340 C810,340 800,255 842,255"/>
    <path d="M760,375 L842,375"/>
    <path d="M760,410 C810,410 800,495 842,495"/>
  </g>

  <g filter="url(#m03-l06-api-gateway-layer-soft)">
    <rect x="50" y="210" width="290" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="195" y="262" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Mobile app</text>
  <g filter="url(#m03-l06-api-gateway-layer-soft)">
    <rect x="50" y="330" width="290" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="195" y="382" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Web app</text>
  <g filter="url(#m03-l06-api-gateway-layer-soft)">
    <rect x="50" y="450" width="290" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="195" y="502" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Third parties</text>

  <g filter="url(#m03-l06-api-gateway-layer-soft)">
    <rect x="430" y="290" width="330" height="170" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="595" y="340" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">API Gateway</text>
  <text x="595" y="378" text-anchor="middle" font-size="20" fill="#475569">auth, rate limits, TLS</text>
  <text x="595" y="410" text-anchor="middle" font-size="20" fill="#475569">routing, composition</text>

  <g filter="url(#m03-l06-api-gateway-layer-soft)">
    <rect x="850" y="210" width="330" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1015" y="262" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog</text>
  <g filter="url(#m03-l06-api-gateway-layer-soft)">
    <rect x="850" y="330" width="330" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1015" y="382" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <g filter="url(#m03-l06-api-gateway-layer-soft)">
    <rect x="850" y="450" width="330" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1015" y="502" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders</text>

  <g font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="595" y="268">all client traffic</text>
    <text x="595" y="500">routes by path, or calls in parallel</text>
  </g>

  <line x1="50" y1="614" x2="86" y2="614" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="621" font-size="20" fill="#475569">Blue edges are synchronous calls: the caller waits for the reply</text>
  <rect x="50" y="646" width="36" height="26" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="98" y="667" font-size="20" fill="#475569">The one front door: it routes, translates, and protects, it does not decide</text>
</svg>