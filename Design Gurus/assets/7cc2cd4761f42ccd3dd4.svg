<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="824" viewBox="0 0 1240 824" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A binary tree whose left and right subtrees are handed to two threads, joined at the root"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="824" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="520" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">The two subtrees share no state, so they can be compared at the same time</text>
<circle cx="620" cy="180" r="38" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="620" y="188" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<circle cx="420" cy="310" r="38" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="420" y="318" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">2</text>
<circle cx="820" cy="310" r="38" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="820" y="318" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">3</text>
<circle cx="320" cy="440" r="38" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="320" y="448" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">4</text>
<circle cx="520" cy="440" r="38" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="520" y="448" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">5</text>
<circle cx="720" cy="440" r="38" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="720" y="448" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">6</text>
<circle cx="920" cy="440" r="38" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="920" y="448" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">7</text>
<line x1="588.139" y1="200.71" x2="451.861" y2="289.29" stroke="#2563EB" stroke-width="2"/>
<line x1="651.861" y1="200.71" x2="788.139" y2="289.29" stroke="#7C3AED" stroke-width="2"/>
<line x1="396.831" y1="340.12" x2="343.169" y2="409.88" stroke="#2563EB" stroke-width="2"/>
<line x1="443.169" y1="340.12" x2="496.831" y2="409.88" stroke="#2563EB" stroke-width="2"/>
<line x1="796.831" y1="340.12" x2="743.169" y2="409.88" stroke="#7C3AED" stroke-width="2"/>
<line x1="843.169" y1="340.12" x2="896.831" y2="409.88" stroke="#7C3AED" stroke-width="2"/>
<text x="240" y="530" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">thread A returns its answer, thread B returns its own,</text>
<text x="240" y="562" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">then the root joins both and combines them</text>
<rect x="40" y="608" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="630" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="656" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">thread A</text>
<text x="348" y="656" font-size="19.5" fill="#475569">walks the left subtree and nothing else</text>
<rect x="64" y="678" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="704" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">thread B</text>
<text x="348" y="704" font-size="19.5" fill="#475569">walks the right subtree at the same time</text>
<rect x="64" y="726" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="752" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">the caller</text>
<text x="348" y="752" font-size="19.5" fill="#475569">waits for both, then combines the two results</text>
</svg>