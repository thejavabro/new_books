<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-label="A rate limiter counts requests per caller and rejects everything over the agreed limit with a 429 response, at the edge, before the traffic reaches anything expensive.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="540" fill="#FFFFFF"/>
  <rect x="45" y="132" width="190" height="96" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="178" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One caller</text>
  <text x="140" y="203" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">100 requests/s</text>
  <line x1="242" y1="108" x2="352" y2="108" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="242" y1="126" x2="352" y2="126" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="242" y1="144" x2="352" y2="144" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="242" y1="162" x2="352" y2="162" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="242" y1="180" x2="352" y2="180" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="242" y1="198" x2="352" y2="198" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="242" y1="216" x2="352" y2="216" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="242" y1="234" x2="352" y2="234" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="242" y1="252" x2="352" y2="252" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="360" y="92" width="250" height="176" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="485" y="134" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Rate limiter</text>
  <text x="485" y="164" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">limit: 10/s</text>
  <text x="485" y="208" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">counts per caller</text>
  <text x="485" y="238" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">in Redis</text>
  <rect x="700" y="84" width="500" height="82" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <path d="M726 118 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="960" y="132" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">10 pass through</text>
  <path d="M612 150 C 660 150, 660 124, 692 124" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <rect x="700" y="190" width="500" height="82" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M726 215 l16 16 M742 215 l-16 16" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-linecap="round"/>
  <text x="960" y="238" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">90 get 429 Too Many Requests</text>
  <path d="M612 210 C 660 210, 660 230, 692 230" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#ar-red)"/>
  <rect x="40" y="306" width="560" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="342" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">It sits at the edge, in the gateway.</text>
  <text x="70" y="372" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Rejecting early is the whole point: nothing expensive runs.</text>
  <rect x="640" y="306" width="560" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="670" y="342" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Limit per user, per API key or per IP.</text>
  <text x="670" y="372" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A global limit punishes everyone for one bad caller.</text>
  <rect x="40" y="416" width="1160" height="92" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="452" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Two ways to shape the traffic you do accept.</text>
  <text x="70" y="482" font-size="20" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A token bucket allows short bursts. A leaky bucket smooths everything to a steady rate.</text>
</svg>