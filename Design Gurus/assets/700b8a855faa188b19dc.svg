<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="342" viewBox="0 0 1240 342" role="img" aria-label="The anchor numbers worth carrying into an interview: a day is about 100,000 seconds and a million a day is about twelve per second, plus typical object sizes and the powers of two.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="342" fill="#FFFFFF"/>
  <rect x="40" y="40" width="409" height="262" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="40" y="40" width="409" height="8" rx="4" fill="#3B82F6"/>
  <text x="244.5" y="84" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Time</text>
  <rect x="60" y="108" width="369" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="78" y="135" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A day</text>
  <text x="411" y="135" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">86,400 s, round to 100,000</text>
  <rect x="60" y="158" width="369" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="78" y="185" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 million a day</text>
  <text x="411" y="185" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">~12 per second</text>
  <rect x="60" y="208" width="369" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="78" y="235" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 billion a day</text>
  <text x="411" y="235" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">~12,000 per second</text>
  <rect x="469" y="40" width="355" height="262" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="469" y="40" width="355" height="8" rx="4" fill="#059669"/>
  <text x="646.5" y="84" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Sizes</text>
  <rect x="489" y="108" width="315" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="507" y="135" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A character</text>
  <text x="786" y="135" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 byte</text>
  <rect x="489" y="158" width="315" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="507" y="185" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A short post</text>
  <text x="786" y="185" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">~300 bytes</text>
  <rect x="489" y="208" width="315" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="507" y="235" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A photo</text>
  <text x="786" y="235" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">~200 KB to 2 MB</text>
  <rect x="489" y="258" width="315" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="507" y="285" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A minute of 1080p</text>
  <text x="786" y="285" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">~30 MB</text>
  <rect x="844" y="40" width="355" height="262" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="844" y="40" width="355" height="8" rx="4" fill="#6D28D9"/>
  <text x="1021.5" y="84" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Powers of two</text>
  <rect x="864" y="108" width="315" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="882" y="135" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2^10</text>
  <text x="1161" y="135" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">thousand, KB</text>
  <rect x="864" y="158" width="315" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="882" y="185" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2^20</text>
  <text x="1161" y="185" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">million, MB</text>
  <rect x="864" y="208" width="315" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="882" y="235" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2^30</text>
  <text x="1161" y="235" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">billion, GB</text>
  <rect x="864" y="258" width="315" height="40" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="882" y="285" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2^40</text>
  <text x="1161" y="285" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">trillion, TB</text>
</svg>