  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Before SOA vs. after SOA: eliminating duplicate business logic</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Before SOA, each application repeats the same logic; after SOA, shared services provide it once.</text>

  <rect x="40" y="110" width="1160" height="596" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#BE185D">Before SOA: each application implements its own business logic and data.</text>
