<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="686" viewBox="0 0 1240 686" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="chain-title chain-desc">
<title id="chain-title">An untested failover is a hope</title>
<desc id="chain-desc">A failover path is a long chain of permissions, images, secrets, capacity, routing and human steps, every link of which can decay independently while nothing visibly fails.</desc>
<defs>
<marker id="chain-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="chain-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="chain-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="chain-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="686" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">An untested failover is a hope</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A failover path is not one mechanism.</text>
<rect x="40" y="608" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="608" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="120" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">permissions</text>
<path d="M206 146H234" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M206 146H234" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chain-marker-slate)"/>
<rect x="240" y="118" width="160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">images</text>
<path d="M406 146H434" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 146H434" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chain-marker-slate)"/>
<rect x="440" y="118" width="160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="520" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">secrets</text>
<path d="M606 146H634" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M606 146H634" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chain-marker-slate)"/>
<rect x="640" y="118" width="160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="720" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">capacity</text>
<path d="M806 146H834" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M806 146H834" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chain-marker-slate)"/>
<rect x="840" y="118" width="160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">routing</text>
<path d="M1006 146H1034" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1006 146H1034" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chain-marker-slate)"/>
<rect x="1040" y="118" width="160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1120" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">human steps</text>
<text x="620" y="212" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">every link can rot independently, while nothing fails</text>
<rect x="40" y="236" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="236" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="277" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A recovery plan is defined by the date of its last successful drill, not by the document.</text>
<rect x="40" y="326" width="1160" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="326" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="365" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">And the discovery is the worst-timed one available</text><text x="64" y="391" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">You learn the second region is missing a secret during the incident where you</text><text x="64" y="417" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">needed it, with the primary down and an audience watching.</text>
<rect x="40" y="464" width="1160" height="118" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="464" width="5" height="118" rx="2.5" fill="#39D5AA"/><text x="64" y="503" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The comparison is not drill against no-drill.</text><text x="64" y="529" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It is a controlled failure on a scheduled day against an uncontrolled one</text><text x="64" y="555" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">at an unknown time, having never practiced.</text>
<text x="66" y="642" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Everything you learn during the incident, you could have learned on a Tuesday afternoon for free.</text>
</svg>