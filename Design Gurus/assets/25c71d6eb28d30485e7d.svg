<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of a materialized read model. It starts out serving live reads as one indexed lookup, a bug writes wrong rows and it becomes corrupted, the events are replayed from the beginning into a fixed consumer to rebuild a new view, the new view catches up to the live events, and then reads are cut over to it and it is serving again. The event log below is the durable truth that both the steady-state feed and the rebuild come from.">
  <defs>
    <marker id="m05-l06-read-model-rebuild-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l06-read-model-rebuild-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m05-l06-read-model-rebuild-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l06-read-model-rebuild-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m05-l06-read-model-rebuild-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <g fill="none" stroke-width="2.5">
    <path d="M62,360 L72,360" stroke="#475569" stroke-width="2" marker-end="url(#m05-l06-read-model-rebuild-sl)"/>
    <path d="M325,360 L357,360" stroke="#DC2626" marker-end="url(#m05-l06-read-model-rebuild-rd)"/>
    <path d="M610,360 L642,360" stroke="#D97706" marker-end="url(#m05-l06-read-model-rebuild-ab)"/>
    <path d="M895,360 L927,360" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l06-read-model-rebuild-ab)"/>
    <path d="M1057,292 V190 Q1057,170 1037,170 H222 Q202,170 202,190 V284" stroke="#059669" marker-end="url(#m05-l06-read-model-rebuild-em)"/>
    <path d="M760,560 C790,520 772,470 772,432" stroke="#D97706" marker-end="url(#m05-l06-read-model-rebuild-ab)"/>
    <path d="M430,630 L150,630 L150,428" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m05-l06-read-model-rebuild-ab)"/>
  </g>

  <text x="630" y="158" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">cut reads over to the new view</text>
  <text x="345" y="250" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a bug writes</text>
  <text x="345" y="276" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">wrong rows</text>
  <text x="630" y="250" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replay events into</text>
  <text x="630" y="276" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a fixed consumer</text>
  <text x="915" y="250" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the new view reaches</text>
  <text x="915" y="276" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the live events</text>
  <text x="790" y="500" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replay from the beginning</text>
  <text x="170" y="590" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">live events, steady state</text>

  <circle cx="50" cy="360" r="12" fill="#475569"/>

  <g filter="url(#m05-l06-read-model-rebuild-soft)">
    <rect x="80" y="300" width="245" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="202.5" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Serving</text>
  <text x="202.5" y="367" text-anchor="middle" font-size="20" fill="#64748B">live reads from</text>
  <text x="202.5" y="399" text-anchor="middle" font-size="20" fill="#64748B">one indexed lookup</text>
  <g filter="url(#m05-l06-read-model-rebuild-soft)">
    <rect x="365" y="300" width="245" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="487.5" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Corrupted</text>
  <text x="487.5" y="367" text-anchor="middle" font-size="20" fill="#64748B">the view returns</text>
  <text x="487.5" y="399" text-anchor="middle" font-size="20" fill="#64748B">wrong rows</text>
  <g filter="url(#m05-l06-read-model-rebuild-soft)">
    <rect x="650" y="300" width="245" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="772.5" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rebuilding</text>
  <text x="772.5" y="367" text-anchor="middle" font-size="20" fill="#64748B">a new view replays</text>
  <text x="772.5" y="399" text-anchor="middle" font-size="20" fill="#64748B">the log from the start</text>
  <g filter="url(#m05-l06-read-model-rebuild-soft)">
    <rect x="935" y="300" width="245" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1057.5" y="335" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Caught up</text>
  <text x="1057.5" y="367" text-anchor="middle" font-size="20" fill="#64748B">reads are still on</text>
  <text x="1057.5" y="399" text-anchor="middle" font-size="20" fill="#64748B">the old view</text>

  <g filter="url(#m05-l06-read-model-rebuild-soft)">
    <path d="M430,580 L430,680 A190,20 0 0 0 810,680 L810,580" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="620" cy="580" rx="190" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="620" y="622" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Event log</text>
  <text x="620" y="652" text-anchor="middle" font-size="20" fill="#64748B">the truth you rebuild from</text>

  <line x1="60" y1="760" x2="96" y2="760" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="767" font-size="20" fill="#475569">Failure: a bug writes wrong rows</text>
  <line x1="60" y1="800" x2="96" y2="800" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">Replay from the event log</text>
  <line x1="60" y1="840" x2="96" y2="840" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="847" font-size="20" fill="#475569">Live events, in steady state</text>
  <line x1="60" y1="880" x2="96" y2="880" stroke="#059669" stroke-width="4"/>
  <text x="108" y="887" font-size="20" fill="#475569">Recovery: cut the reads over</text>
</svg>