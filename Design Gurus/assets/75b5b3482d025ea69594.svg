<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1236" viewBox="0 0 1240 1236" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated Google Ads architecture: scatter gather ad auction, asynchronous click billing, budget feedback loop and ad indexing">
  <defs>
    <filter id="ga-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="ga-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ga-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ga-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ga-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ga-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1236" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Google Ads: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">A 200ms auction, a click path that never blocks the user, and budgets that stay roughly honest</text>

  <rect x="24" y="96" width="1192" height="360" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. The auction · 50 million ads down to 3, in under 200ms</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ga-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">context</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#ga-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">scatter</text>
  <path d="M620,232 L620,300" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#ga-emerald)"/>
  <text x="638" y="274" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">still funded?</text>
  <path d="M784,342 L876,342" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ga-blue)"/>
  <text x="830" y="330" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">survivors</text>
  <g filter="url(#ga-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,171 L880,217 A160,15 0 0 0 1200,217 L1200,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="171" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M460,319 L460,365 A160,15 0 0 0 780,365 L780,319" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="319" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="304" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Search page</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">sends the query</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ad Mixer</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">scatter and gather</text>
  <text x="1040" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Retrieval nodes</text>
  <text x="1040" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">inverted index in RAM</text>
  <text x="620" y="353" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Negative cache</text>
  <text x="620" y="410" font-size="20" fill="#065F46" text-anchor="middle">campaigns out of money</text>
  <text x="1040" y="338" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ranking</text>
  <text x="1040" y="364" font-size="20" fill="#64748B" text-anchor="middle">bid by pCTR</text>

  <rect x="24" y="486" width="1192" height="166" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="518" font-size="20" font-weight="600" fill="#1E40AF">2. The click · redirect first, bill afterwards</text>
  <path d="M364,584 L456,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ga-blue)"/>
  <text x="410" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <path d="M784,584 L876,584" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#ga-blue)"/>
  <text x="830" y="572" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">redirect</text>
  <g filter="url(#ga-soft)">
    <rect x="40" y="546" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="546" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="546" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="200" y="606" font-size="20" fill="#64748B" text-anchor="middle">clicks the ad</text>
  <text x="620" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Click Handler</text>
  <text x="620" y="606" font-size="20" fill="#64748B" text-anchor="middle">checks the HMAC</text>
  <text x="1040" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Advertiser</text>
  <text x="1040" y="606" font-size="20" fill="#64748B" text-anchor="middle">302 immediately</text>

  <rect x="24" y="682" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="714" font-size="20" font-weight="600" fill="#92400E">3. Billing (asynchronous) · money moves off the user path</text>
  <path d="M264,780 L349,780" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ga-amber)"/>
  <text x="307" y="768" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">emit</text>
  <path d="M577,780 L662,780" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ga-amber)"/>
  <text x="620" y="768" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consume</text>
  <path d="M890,780 L975,780" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ga-amber)"/>
  <text x="933" y="768" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">debit</text>
  <g filter="url(#ga-soft)">
    <rect x="40" y="742" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,757 L353,803 A110,15 0 0 0 573,803 L573,757" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="757" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="742" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,757 L979,803 A110,15 0 0 0 1199,803 L1199,757" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="757" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="776" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Click Handler</text>
  <text x="150" y="802" font-size="20" fill="#64748B" text-anchor="middle">fire and forget</text>
  <text x="463" y="791" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="463" y="848" font-size="20" fill="#92400E" text-anchor="middle">no click is ever lost</text>
  <text x="776" y="776" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Budget Service</text>
  <text x="776" y="802" font-size="20" fill="#64748B" text-anchor="middle">idempotent by id</text>
  <text x="1089" y="791" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SQL ledger</text>
  <text x="1089" y="848" font-size="20" fill="#5B21B6" text-anchor="middle">the invoice of record</text>

  <rect x="24" y="924" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="956" font-size="20" font-weight="600" fill="#92400E">4. The feedback loop · why a spent campaign stops showing within seconds</text>
  <path d="M364,1022 L456,1022" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ga-amber)"/>
  <text x="410" y="1010" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">at zero</text>
  <path d="M784,1022 L876,1022" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#ga-amber)"/>
  <text x="830" y="1010" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <g filter="url(#ga-soft)">
    <rect x="40" y="984" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M460,999 L460,1045 A160,15 0 0 0 780,1045 L780,999" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="620" cy="999" rx="160" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <path d="M880,999 L880,1045 A160,15 0 0 0 1200,1045 L1200,999" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1040" cy="999" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="200" y="1018" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Budget Service</text>
  <text x="200" y="1044" font-size="20" fill="#64748B" text-anchor="middle">sees zero</text>
  <text x="620" y="1033" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Pub/Sub</text>
  <text x="620" y="1090" font-size="20" fill="#92400E" text-anchor="middle">control plane topic</text>
  <text x="1040" y="1033" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Negative cache</text>
  <text x="1040" y="1090" font-size="20" fill="#065F46" text-anchor="middle">on every Mixer node</text>
  <line x1="44" y1="1196" x2="72" y2="1196" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1203" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1196" x2="344.576" y2="1196" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1203" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1187" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1203" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1187" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1203" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1187" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1203" font-size="20" fill="#475569">core service</text>
</svg>