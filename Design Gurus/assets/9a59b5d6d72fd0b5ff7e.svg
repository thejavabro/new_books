<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="798" viewBox="0 0 1240 798" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pattern-title pattern-desc">
<title id="pattern-title">The pattern</title>
<desc id="pattern-desc">A routing layer in front, one slice of behavior moved at a time, and the old code deleted as each slice finishes. The old system shrinks until nothing of it remains.</desc>
<defs>
<marker id="pattern-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pattern-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pattern-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pattern-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="798" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The pattern</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Move one slice of behavior at a time to the new implementation.</text>
<rect x="40" y="720" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="720" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="240" y="118" width="760" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="151" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">routing layer</text>
<path d="M410 178V204" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M410 178V204" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pattern-marker-slate)"/>
<path d="M830 178V204" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M830 178V204" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pattern-marker-green)"/>
<rect x="240" y="210" width="340" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="410" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the existing system</text>
<rect x="660" y="210" width="340" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="830" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the new implementation</text>
<text x="40" y="298" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Slice by slice, the balance moves</text>
<path d="M72 406H1168" stroke="#284E65" stroke-width="3" stroke-linecap="round"/>
<rect x="85.0" y="322.0" width="64" height="84" rx="5" fill="#E8BC60"/>
<rect x="163.0" y="403.0" width="64" height="3" rx="5" fill="#06AC80"/>
<text x="156" y="434" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">start</text>
<rect x="317.0" y="338.8" width="64" height="67.2" rx="5" fill="#E8BC60"/>
<rect x="395.0" y="389.2" width="64" height="16.8" rx="5" fill="#06AC80"/>
<text x="388" y="434" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">slice 1</text>
<rect x="549.0" y="364.0" width="64" height="42" rx="5" fill="#E8BC60"/>
<rect x="627.0" y="364.0" width="64" height="42" rx="5" fill="#06AC80"/>
<text x="620" y="434" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">slice 3</text>
<rect x="781.0" y="389.2" width="64" height="16.8" rx="5" fill="#E8BC60"/>
<rect x="859.0" y="338.8" width="64" height="67.2" rx="5" fill="#06AC80"/>
<text x="852" y="434" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">slice 6</text>
<rect x="1013.0" y="403.0" width="64" height="3" rx="5" fill="#E8BC60"/>
<rect x="1091.0" y="322.0" width="64" height="84" rx="5" fill="#06AC80"/>
<text x="1084" y="434" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">done</text>
<text x="40" y="472" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The properties that follow</text>
<rect x="40" y="490" width="272" height="66" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="176" y="529" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every step is small</text>
<rect x="336" y="490" width="272" height="66" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="472" y="515.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every step is in</text><text x="472" y="542.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">production</text>
<rect x="632" y="490" width="272" height="66" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="768" y="515.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every step is</text><text x="768" y="542.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reversible</text>
<rect x="928" y="490" width="272" height="66" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="515.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">value arrives</text><text x="1064" y="542.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">continuously</text>
<rect x="40" y="586" width="1160" height="102" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="586" width="5" height="102" rx="2.5" fill="#F3CF6A"/><text x="64" y="616" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The honest cost</text><text x="64" y="643" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Two implementations and a routing layer, for months. More total complexity</text><text x="64" y="670" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">than either system alone, in exchange for never holding a large untested change.</text>
<text x="66" y="754" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Named after a plant that grows around a host tree and gradually replaces it.</text>
</svg>