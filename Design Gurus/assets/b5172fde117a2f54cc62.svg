<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1200" viewBox="0 0 1240 1200" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The adjusted 45-minute budget for the product architecture round, which moves time from listing operations toward modeling and the deep operation: four minutes for consumers, eight for the model, eight for operations, thirteen for one operation in full, eight for hard parts, and four for trade-offs.">
  <defs>
    <filter id="p36-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p36-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <marker id="p36-asl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p36-avi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="p36-abl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p36-aam" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p36-aem" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <clipPath id="p36-k1"><rect x="76" y="124" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p36-k2"><rect x="76" y="276" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p36-k3"><rect x="76" y="428" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p36-k4"><rect x="76" y="580" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p36-k5"><rect x="76" y="732" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p36-k6"><rect x="76" y="884" width="420" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1200" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="989" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The same 45 minutes, spent differently</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">why it moves, in gray under each step</text>

  <text x="76" y="104" font-size="15.5" font-weight="600" fill="#64748B">Step</text>
  <text x="560" y="104" font-size="15.5" font-weight="600" fill="#64748B">Ordinary</text>
  <text x="810" y="104" font-size="15.5" font-weight="600" fill="#64748B">This round</text>

  
  <g fill="none" stroke-width="2">
    <path d="M650,169 H810" stroke="#64748B" marker-end="url(#p36-asl)"/>
    <path d="M740,473 H810" stroke="#64748B" marker-end="url(#p36-asl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M650,321 H810" stroke="#7C3AED" marker-end="url(#p36-avi)"/>
    <path d="M740,625 H810" stroke="#2563EB" marker-end="url(#p36-abl)"/>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M740,777 H810" stroke="#D97706" marker-end="url(#p36-aam)"/>
    <path d="M650,929 H810" stroke="#059669" marker-end="url(#p36-aem)"/>
  </g>

  
  <g filter="url(#p36-soft)">
    <rect x="76" y="124" width="420" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="76" y="124" width="6" height="90" fill="#64748B" clip-path="url(#p36-k1)"/>
  </g>
  <circle cx="114" cy="169" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,158.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="140" y="176" font-size="18.5" font-weight="600" fill="#111827">1. Consumers and jobs</text>
  <text x="286" y="239" text-anchor="middle" font-size="15.5" fill="#6B7280">Fewer consumers, named faster</text>
  <rect x="560" y="153" width="90" height="32" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="605" y="174" text-anchor="middle" font-size="15.5" font-weight="600" fill="#64748B">5 min</text>
  <rect x="810" y="153" width="72" height="32" rx="9" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="846" y="174" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">4 min</text>

  
  <g filter="url(#p36-lift)">
    <rect x="76" y="276" width="420" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="76" y="276" width="9" height="90" fill="#7C3AED" clip-path="url(#p36-k2)"/>
  </g>
  <circle cx="114" cy="321" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,310.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="328" font-size="18.5" font-weight="600" fill="#111827">2. Model the resources and data</text>
  <text x="286" y="391" text-anchor="middle" font-size="15.5" fill="#6B7280">The model is now a deliverable</text>
  <rect x="560" y="305" width="90" height="32" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="605" y="326" text-anchor="middle" font-size="15.5" font-weight="600" fill="#64748B">5 min</text>
  <rect x="810" y="305" width="144" height="32" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="882" y="326" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">8 min</text>

  
  <g filter="url(#p36-soft)">
    <rect x="76" y="428" width="420" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="76" y="428" width="6" height="90" fill="#64748B" clip-path="url(#p36-k3)"/>
  </g>
  <circle cx="114" cy="473" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,462.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="480" font-size="18.5" font-weight="600" fill="#111827">3. List the operations</text>
  <text x="286" y="543" text-anchor="middle" font-size="15.5" fill="#6B7280">Only the screen operations are listed</text>
  <rect x="560" y="457" width="180" height="32" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="650" y="478" text-anchor="middle" font-size="15.5" font-weight="600" fill="#64748B">10 min</text>
  <rect x="810" y="457" width="144" height="32" rx="9" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="882" y="478" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">8 min</text>

  
  <g filter="url(#p36-lift)">
    <rect x="76" y="580" width="420" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="580" width="9" height="90" fill="#2563EB" clip-path="url(#p36-k4)"/>
  </g>
  <circle cx="114" cy="625" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,614.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="140" y="632" font-size="18.5" font-weight="600" fill="#111827">4. One operation in full</text>
  <text x="286" y="695" text-anchor="middle" font-size="15.5" fill="#6B7280">The call plan is designed here</text>
  <rect x="560" y="609" width="180" height="32" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="650" y="630" text-anchor="middle" font-size="15.5" font-weight="600" fill="#64748B">10 min</text>
  <rect x="810" y="609" width="234" height="32" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="927" y="630" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">13 min</text>

  
  <g filter="url(#p36-soft)">
    <rect x="76" y="732" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="732" width="6" height="90" fill="#D97706" clip-path="url(#p36-k5)"/>
  </g>
  <circle cx="114" cy="777" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,766.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="784" font-size="18.5" font-weight="600" fill="#111827">5. Hard parts</text>
  <text x="286" y="847" text-anchor="middle" font-size="15.5" fill="#6B7280">Fewer, chosen by the screen pressure</text>
  <rect x="560" y="761" width="180" height="32" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="650" y="782" text-anchor="middle" font-size="15.5" font-weight="600" fill="#64748B">10 min</text>
  <rect x="810" y="761" width="144" height="32" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="882" y="782" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">8 min</text>

  
  <g filter="url(#p36-soft)">
    <rect x="76" y="884" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="884" width="6" height="90" fill="#059669" clip-path="url(#p36-k6)"/>
  </g>
  <circle cx="114" cy="929" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,918.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="140" y="936" font-size="18.5" font-weight="600" fill="#111827">6. Trade-offs</text>
  <text x="286" y="999" text-anchor="middle" font-size="15.5" fill="#6B7280">Tighter, but never skipped</text>
  <rect x="560" y="913" width="90" height="32" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="605" y="934" text-anchor="middle" font-size="15.5" font-weight="600" fill="#64748B">5 min</text>
  <rect x="810" y="913" width="72" height="32" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="846" y="934" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">4 min</text>

  
  <rect x="40" y="1057" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1099" text-anchor="middle" font-size="16" fill="#475569">Both columns add up to 45 minutes. The time moves from listing operations toward modeling and the deep operation.</text>
  <text x="620" y="1127" text-anchor="middle" font-size="16" fill="#475569">Bar length is the minutes. Steps 2 and 4 grow because this round asks each of them for a deliverable.</text>
</svg>