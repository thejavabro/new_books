<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="For 100 requests where 98 take 100 ms and 2 take 5,000 ms, the p50 is 100 ms, the p95 is 100 ms, and the average is 198 ms, which looks healthy. The p99 is 5,000 ms, which shows the slow users.">
  <defs>
    <filter id="lvt5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lvt5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lvt5-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="lvt5-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="lvt5-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="lvt5-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The average hides the slow requests</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">100 requests: 98 take 100 ms, and 2 take 5,000 ms.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#lvt5-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#059669" clip-path="url(#lvt5-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">p50: 100 ms</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">half are faster</text>
  <g filter="url(#lvt5-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#059669" clip-path="url(#lvt5-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">p95: 100 ms</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">95 of 100 are faster</text>
  <g filter="url(#lvt5-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#64748B" clip-path="url(#lvt5-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Average: 198 ms</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">looks healthy</text>
  <g filter="url(#lvt5-lift)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="949" y="140" width="9" height="90" fill="#DB2777" clip-path="url(#lvt5-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">p99: 5,000 ms</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">shows the slow users</text>

  <rect x="40" y="310" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="335" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="360" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Average</text>
  <text x="323" y="360" font-size="18.5" fill="#475569">(98 x 100 + 2 x 5,000) / 100 = 198 ms, so the 2 slow requests are hidden</text>
  <rect x="64" y="385" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="410" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">p99</text>
  <text x="323" y="410" font-size="18.5" fill="#475569">99 of 100 requests take this long or less, so the slow requests are visible</text>
</svg>