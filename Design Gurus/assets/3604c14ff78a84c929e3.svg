<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="leaks-title leaks-desc">
<title id="leaks-title">Where secrets actually leak</title>
<desc id="leaks-desc">The leaks that happen come from a short list of ordinary places, and most of them are design decisions rather than mistakes.</desc>
<defs>
<marker id="leaks-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="leaks-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="leaks-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="leaks-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where secrets actually leak</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The leaks that happen come from a short list of ordinary places.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="400" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="240" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Logs and error reports</text>
<path d="M446 144H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 144H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leaks-marker-slate)"/>
<rect x="490" y="118" width="710" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="150" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a full request object, an exception with a connection string</text>
<rect x="40" y="180" width="400" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="240" y="212" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The environment, dumped</text>
<path d="M446 206H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 206H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leaks-marker-slate)"/>
<rect x="490" y="180" width="710" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="212" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">debug endpoints, crash handlers, support tooling that prints config</text>
<rect x="40" y="242" width="400" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="240" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Non-production environments</text>
<path d="M446 268H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 268H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leaks-marker-slate)"/>
<rect x="490" y="242" width="710" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="274" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a production database restored into staging, where access is broader</text>
<rect x="40" y="304" width="400" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="240" y="336" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The build pipeline</text>
<path d="M446 330H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 330H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leaks-marker-slate)"/>
<rect x="490" y="304" width="710" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="336" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">available to any code that runs in a build, including a dependency</text>
<rect x="40" y="366" width="400" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Source control history</text>
<path d="M446 392H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 392H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leaks-marker-slate)"/>
<rect x="490" y="366" width="710" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="398" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">removing it from the current revision does not remove it from history</text>
<rect x="40" y="428" width="400" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="240" y="460" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A third party you gave it to</text>
<path d="M446 454H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 454H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#leaks-marker-slate)"/>
<rect x="490" y="428" width="710" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="460" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every integration is a place your credential now lives</text>
<rect x="40" y="500" width="1160" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="532" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Anything committed must be treated as compromised and rotated, not merely deleted</text>
<rect x="40" y="574" width="560" height="96" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="574" width="5" height="96" rx="2.5" fill="#39D5AA"/><text x="64" y="602" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Scan at commit time</text><text x="64" y="628" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">catching it before history avoids</text><text x="64" y="654" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the rotation entirely</text>
<rect x="640" y="574" width="560" height="96" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="574" width="5" height="96" rx="2.5" fill="#5EC9EC"/><text x="664" y="602" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Alert on use, not only access</text><text x="664" y="628" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an unusual place, time or rate.</text><text x="664" y="654" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Detectable, and rarely configured</text>
<text x="66" y="730" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Two defenses are worth more than the rest combined.</text>
</svg>