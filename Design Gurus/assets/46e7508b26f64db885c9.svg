<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="624" viewBox="0 0 1240 624" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Session data held in one server&#39;s memory means a second request routed to a different server finds no session and the user appears logged out">
  <rect x="0" y="0" width="1240" height="624" fill="#FFFFFF"/>
  <defs>
    <marker id="lb1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lb1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="lb1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The session lives in one server's memory</text>

  
  <line x1="274" y1="294" x2="372" y2="294" stroke="#3B82F6" stroke-width="2" marker-end="url(#lb1-blue)"/>
  <path d="M604 270 L752 190" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#lb1-blue)"/>
  <text x="650" y="196" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">request 1</text>
  <path d="M604 318 L752 400" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#lb1-red)"/>
  <text x="650" y="412" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">request 2</text>

  
  <g filter="url(#lb1-soft)">
    <rect x="70" y="250" width="204" height="88" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="376" y="250" width="228" height="88" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="756" y="140" width="320" height="104" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="756" y="348" width="320" height="104" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="172" y="284" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="172" y="314" font-size="20" fill="#64748B" text-anchor="middle">adds to cart</text>
  <text x="490" y="284" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Load balancer</text>
  <text x="490" y="314" font-size="20" fill="#1E40AF" text-anchor="middle">round robin</text>

  <text x="916" y="176" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server A</text>
  <text x="916" y="208" font-size="20" fill="#065F46" text-anchor="middle">session for user 42</text>
  <text x="916" y="232" font-size="20" fill="#065F46" text-anchor="middle">cart: 3 items</text>

  <text x="916" y="384" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server B</text>
  <text x="916" y="416" font-size="20" fill="#B91C1C" text-anchor="middle">no session for user 42</text>
  <text x="916" y="440" font-size="20" fill="#B91C1C" text-anchor="middle">cart: empty</text>

  
  <rect x="70" y="504" width="1100" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="536" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Nothing failed. No server crashed, no request was lost.</text>
  <text x="620" y="568" font-size="20" fill="#B91C1C" text-anchor="middle">The user is simply logged out, because the state was in the wrong place.</text>
</svg>