<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="750" viewBox="0 0 1240 750" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Active-active: a load balancer sends 50 percent of traffic to each of two servers. Active-passive: a load balancer sends 100 percent of traffic to the active server, and the standby gets traffic only after a failover.">
  <defs>
    <filter id="av4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="av4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="av4-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="av4-k2"><rect x="64" y="360" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="av4-k3"><rect x="356" y="360" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="av4-k4"><rect x="654" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="av4-k5"><rect x="654" y="360" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="av4-k6"><rect x="946" y="360" width="230" height="90" rx="12"/></clipPath>
    <marker id="av4-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="av4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="750" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Two ways to run redundant copies</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Either every copy serves traffic, or one copy serves and another waits.</text>

  <rect x="40" y="120" width="570" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Active-active</text>
  <rect x="630" y="120" width="570" height="420" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#475569">Active-passive</text>

  <g fill="none" stroke-width="2">
    <path d="M179,270 V360" stroke="#2563EB" marker-end="url(#av4-m-blue)"/>
    <path d="M471,270 V360" stroke="#2563EB" marker-end="url(#av4-m-blue)"/>
    <path d="M769,270 V360" stroke="#2563EB" marker-end="url(#av4-m-blue)"/>
    <path d="M1061,270 V360" stroke="#64748B" marker-end="url(#av4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="222" y="322" fill="#1D4ED8">50%</text>
    <text x="514" y="322" fill="#1D4ED8">50%</text>
    <text x="818" y="322" fill="#1D4ED8">100%</text>
    <text x="1118" y="322" fill="#475569">on failover</text>
  </g>

  <g filter="url(#av4-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#av4-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <g filter="url(#av4-soft)">
    <rect x="64" y="360" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="360" width="6" height="90" fill="#2563EB" clip-path="url(#av4-k2)"/>
  </g>
  <circle cx="102" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="128" y="412" font-size="21.5" font-weight="600" fill="#111827">Server A</text>
  <text x="179" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">serves half the traffic</text>
  <text x="179" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">can serve all of it alone</text>
  <g filter="url(#av4-soft)">
    <rect x="356" y="360" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="356" y="360" width="6" height="90" fill="#2563EB" clip-path="url(#av4-k3)"/>
  </g>
  <circle cx="394" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(383.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="420" y="412" font-size="21.5" font-weight="600" fill="#111827">Server B</text>
  <text x="471" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">serves half the traffic</text>
  <text x="471" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">can serve all of it alone</text>
  <g filter="url(#av4-soft)">
    <rect x="654" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#av4-k4)"/>
  </g>
  <circle cx="692" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="718" y="232" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <g filter="url(#av4-soft)">
    <rect x="654" y="360" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="360" width="6" height="90" fill="#2563EB" clip-path="url(#av4-k5)"/>
  </g>
  <circle cx="692" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="718" y="412" font-size="21.5" font-weight="600" fill="#111827">Active</text>
  <text x="769" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">serves all the traffic</text>
  <text x="769" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">copies data to standby</text>
  <g filter="url(#av4-soft)">
    <rect x="946" y="360" width="230" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="946" y="360" width="6" height="90" fill="#64748B" clip-path="url(#av4-k6)"/>
  </g>
  <circle cx="984" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(973.56,394.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="1010" y="412" font-size="21.5" font-weight="600" fill="#111827">Standby</text>
  <text x="1061" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">waits with no traffic</text>
  <text x="1061" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">takes over on a failure</text>

  <rect x="40" y="570" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="595" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Active-active</text>
  <text x="323" y="620" font-size="18.5" fill="#475569">no idle machines, but each copy needs spare room for a failed copy</text>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Active-passive</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">simpler, but the standby sits idle and the switch takes time</text>
</svg>