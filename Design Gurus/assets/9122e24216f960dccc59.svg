<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="932" viewBox="0 0 1240 932" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities for a flash sale: users hit the sale service, which briefly reserves stock from a contended inventory count, turns a held reservation into an order, and confirms only after payment succeeds">
  <defs>
    <filter id="flsk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="flsk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="flsk-k1"><rect x="40" y="310" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="flsk-k2"><rect x="330" y="310" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="flsk-k3"><rect x="330" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="flsk-k4"><rect x="690" y="530" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="flsk-k5"><rect x="1010" y="530" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="flsk-k6"><rect x="690" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="flsk-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="flsk-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="flsk-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="flsk-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="flsk-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="flsk-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="flsk-s-indigo" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#4F46E5"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="932" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Flash sale: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Millions of requests chase thousands of items, so the only entity that really matters is the inventory count.</text>



  <g fill="none" stroke-width="2">
    <path d="M230,335 H330" stroke="#2563EB" marker-end="url(#flsk-m-blue)"/>
    <path d="M555,310 V230" stroke="#D97706" marker-end="url(#flsk-m-amber)"/>
    <path d="M580,335 H690" stroke="#4F46E5" marker-end="url(#flsk-m-indigo)" marker-start="url(#flsk-s-indigo)"/>
    <path d="M930,320 V230" stroke="#64748B" marker-end="url(#flsk-m-slate)"/>
    <path d="M915,430 V530" stroke="#7C3AED" marker-end="url(#flsk-m-violet)"/>
    <path d="M940,575 H1010" stroke="#7C3AED" marker-end="url(#flsk-m-violet)"/>
    <path d="M1175,620 V678 Q1175,690 1163,690 H32 Q20,690 20,678 V367 Q20,355 32,355 H40" stroke="#059669" stroke-width="2.5" marker-end="url(#flsk-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="280" y="322" fill="#1D4ED8">buys</text>
    <text x="650" y="272" fill="#B45309">sells</text>
    <text x="635" y="322" fill="#4338CA">decrement</text>
    <text x="1000" y="285" fill="#475569">holds</text>
    <text x="985" y="505" fill="#5B21B6">becomes</text>
    <text x="975" y="562" fill="#5B21B6">charged</text>
    <text x="500" y="682" fill="#047857">confirmed only after payment succeeds</text>
  </g>

  <g filter="url(#flsk-soft)">
    <rect x="40" y="310" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#flsk-k1)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="362" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="135" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">hundreds of thousands</text>
  <text x="135" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">all at the same second</text>
  <g filter="url(#flsk-lift)">
    <rect x="330" y="310" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="330" y="310" width="9" height="90" fill="#4F46E5" clip-path="url(#flsk-k2)"/>
  </g>
  <circle cx="368" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,344.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="394" y="362" font-size="21.5" font-weight="600" fill="#111827">Sale Service</text>
  <text x="455" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">admits or rejects fast</text>
  <g filter="url(#flsk-soft)">
    <rect x="330" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="330" y="140" width="6" height="90" fill="#D97706" clip-path="url(#flsk-k3)"/>
  </g>
  <circle cx="368" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="394" y="192" font-size="21.5" font-weight="600" fill="#111827">Item</text>
  <text x="455" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">id, description, price</text>
  <text x="455" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">a fixed number exist</text>
  <g filter="url(#flsk-soft)">
    <rect x="690" y="530" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="690" y="530" width="6" height="90" fill="#7C3AED" clip-path="url(#flsk-k4)"/>
  </g>
  <circle cx="728" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,564.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="754" y="582" font-size="21.5" font-weight="600" fill="#111827">Order</text>
  <text x="815" y="649" font-size="18.5" text-anchor="middle" fill="#6B7280">created only after a hold</text>
  <text x="815" y="676" font-size="18.5" text-anchor="middle" fill="#94A3B8">links user, item, quantity</text>
  <g filter="url(#flsk-soft)">
    <rect x="1010" y="530" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1010" y="530" width="6" height="90" fill="#059669" clip-path="url(#flsk-k5)"/>
  </g>
  <circle cx="1048" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(1037.56,564.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1074" y="582" font-size="21.5" font-weight="600" fill="#111827">Payment</text>
  <text x="1105" y="649" font-size="18.5" text-anchor="middle" fill="#6B7280">pending or paid</text>
  <g filter="url(#flsk-soft)">
    <rect x="690" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="690" y="140" width="6" height="90" fill="#64748B" clip-path="url(#flsk-k6)"/>
  </g>
  <circle cx="728" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="754" y="192" font-size="21.5" font-weight="600" fill="#111827">Reservation</text>
  <text x="815" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">holds one unit briefly</text>
  <text x="815" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">expires on its own</text>
  <g stroke="#DB2777" stroke-width="1.5">
    <path d="M690,320 L690,414 A125,16 0 0 0 940,414 L940,320" fill="#FCE7F3"/>
    <ellipse cx="815" cy="320" rx="125" ry="16" fill="#FDF2F8"/>
  </g>
  <text x="815" y="382" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Inventory</text>
  <text x="815" y="464" font-size="18.5" text-anchor="middle" fill="#6B7280">the contended counter</text>
  <text x="815" y="491" font-size="18.5" text-anchor="middle" fill="#94A3B8">never goes below zero</text>

  <rect x="40" y="730" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Oversell</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">two buyers taking the last unit; the whole design exists to make this impossible</text>
  <rect x="64" y="805" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="830" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Reservation</text>
  <text x="323" y="830" font-size="18.5" fill="#475569">stock held for a short window so checkout can finish, released automatically if it does not</text>
  <rect x="64" y="855" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="880" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Queue</text>
  <text x="323" y="880" font-size="18.5" fill="#475569">requests are admitted in order rather than all at once, which turns a stampede into a line</text>
</svg>