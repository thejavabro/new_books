<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Active health checks, where the broker proactively checks each server: the broker sends a health check to servers A and B, which are healthy, and to server C, which is unhealthy. Passive health checks, where the broker observes request results: a client sends a request to the broker, requests to servers A and B succeed, requests to server C fail, and the broker marks server C as unhealthy based on the failures">
