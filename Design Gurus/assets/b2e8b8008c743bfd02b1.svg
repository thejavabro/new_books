<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="588" viewBox="0 0 1240 588" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A comparison of CRC32, MD5, SHA-256 and HMAC. All four catch accidental corruption. Only HMAC, which uses a secret key, catches a deliberate change, because anyone else can recalculate a plain checksum after changing the data.">
  <rect x="0" y="0" width="1240" height="588" fill="#FFFFFF"/>
  <defs>
    <marker id="ck3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ck3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ck3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ck3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ck3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ck3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ck3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ck3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ck3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The common functions, and what each one is for</text>
  <g filter="url(#ck3-soft)"><rect x="334" y="56" width="213" height="40" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="440.5" y="84" font-size="21" font-weight="700" fill="#0F766E" text-anchor="middle">CRC32</text>
  <g filter="url(#ck3-soft)"><rect x="557" y="56" width="213" height="40" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="663.5" y="84" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">MD5</text>
  <g filter="url(#ck3-soft)"><rect x="780" y="56" width="213" height="40" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="886.5" y="84" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">SHA-256</text>
  <g filter="url(#ck3-soft)"><rect x="1003" y="56" width="213" height="40" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1109.5" y="84" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">HMAC</text>
  <rect x="24" y="106" width="300" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="152" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Output size</text>
  <g filter="url(#ck3-soft)"><rect x="334" y="106" width="213" height="78" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="440.5" y="152" font-size="19" fill="#0F172A" text-anchor="middle">4 bytes</text>
  <g filter="url(#ck3-soft)"><rect x="557" y="106" width="213" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="663.5" y="152" font-size="19" fill="#0F172A" text-anchor="middle">16 bytes</text>
  <g filter="url(#ck3-soft)"><rect x="780" y="106" width="213" height="78" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="886.5" y="152" font-size="19" fill="#0F172A" text-anchor="middle">32 bytes</text>
  <g filter="url(#ck3-soft)"><rect x="1003" y="106" width="213" height="78" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1109.5" y="138" font-size="19" fill="#0F172A" text-anchor="middle">32 bytes with</text>
  <text x="1109.5" y="164" font-size="19" fill="#0F172A" text-anchor="middle">SHA-256</text>
  <rect x="24" y="194" width="300" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="240" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Speed</text>
  <g filter="url(#ck3-soft)"><rect x="334" y="194" width="213" height="78" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="440.5" y="240" font-size="19" fill="#0F172A" text-anchor="middle">very fast</text>
  <g filter="url(#ck3-soft)"><rect x="557" y="194" width="213" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="663.5" y="240" font-size="19" fill="#0F172A" text-anchor="middle">fast</text>
  <g filter="url(#ck3-soft)"><rect x="780" y="194" width="213" height="78" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="886.5" y="240" font-size="19" fill="#0F172A" text-anchor="middle">slower</text>
  <g filter="url(#ck3-soft)"><rect x="1003" y="194" width="213" height="78" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1109.5" y="240" font-size="19" fill="#0F172A" text-anchor="middle">slower</text>
  <rect x="24" y="282" width="300" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="314" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Catches accidental</text>
  <text x="48" y="342" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">corruption</text>
  <g filter="url(#ck3-soft)"><rect x="334" y="282" width="213" height="78" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="440.5" y="328" font-size="19" fill="#0F172A" text-anchor="middle">yes</text>
  <g filter="url(#ck3-soft)"><rect x="557" y="282" width="213" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="663.5" y="328" font-size="19" fill="#0F172A" text-anchor="middle">yes</text>
  <g filter="url(#ck3-soft)"><rect x="780" y="282" width="213" height="78" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="886.5" y="328" font-size="19" fill="#0F172A" text-anchor="middle">yes</text>
  <g filter="url(#ck3-soft)"><rect x="1003" y="282" width="213" height="78" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1109.5" y="328" font-size="19" fill="#0F172A" text-anchor="middle">yes</text>
  <rect x="24" y="370" width="300" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="402" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Catches deliberate</text>
  <text x="48" y="430" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">change</text>
  <g filter="url(#ck3-soft)"><rect x="334" y="370" width="213" height="78" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="440.5" y="416" font-size="19" fill="#0F172A" text-anchor="middle">no</text>
  <g filter="url(#ck3-soft)"><rect x="557" y="370" width="213" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="663.5" y="416" font-size="19" fill="#0F172A" text-anchor="middle">no</text>
  <g filter="url(#ck3-soft)"><rect x="780" y="370" width="213" height="78" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="886.5" y="416" font-size="19" fill="#0F172A" text-anchor="middle">no</text>
  <g filter="url(#ck3-soft)"><rect x="1003" y="370" width="213" height="78" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1109.5" y="416" font-size="19" fill="#0F172A" text-anchor="middle">yes</text>
  <rect x="24" y="458" width="300" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="504" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Where it is used</text>
  <g filter="url(#ck3-soft)"><rect x="334" y="458" width="213" height="78" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="440.5" y="490" font-size="19" fill="#0F172A" text-anchor="middle">network frames,</text>
  <text x="440.5" y="516" font-size="19" fill="#0F172A" text-anchor="middle">stored blocks</text>
  <g filter="url(#ck3-soft)"><rect x="557" y="458" width="213" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="663.5" y="504" font-size="19" fill="#0F172A" text-anchor="middle">file downloads</text>
  <g filter="url(#ck3-soft)"><rect x="780" y="458" width="213" height="78" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="886.5" y="490" font-size="19" fill="#0F172A" text-anchor="middle">published file</text>
  <text x="886.5" y="516" font-size="19" fill="#0F172A" text-anchor="middle">values</text>
  <g filter="url(#ck3-soft)"><rect x="1003" y="458" width="213" height="78" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1109.5" y="490" font-size="19" fill="#0F172A" text-anchor="middle">signed messages</text>
  <text x="1109.5" y="516" font-size="19" fill="#0F172A" text-anchor="middle">and tokens</text>
  <text x="620" y="576" font-size="19" fill="#64748B" text-anchor="middle">Only a value made with a secret key stops someone who can also rewrite the checksum</text>
</svg>