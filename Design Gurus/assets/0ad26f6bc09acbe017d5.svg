<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same burst measured three ways. A fixed window allows a double burst across its boundary. A sliding window counts the exact preceding interval and needs more state. A token bucket drains during a burst and refills steadily, so it publishes both a rate and a burst size.">
  <defs>
    <marker id="p16-im" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="p16-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p16-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p16-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p16-k1"><rect x="60" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="p16-k2"><rect x="455" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="p16-k3"><rect x="850" y="104" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="p16-k4"><rect x="60" y="470" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="p16-k5"><rect x="455" y="470" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="p16-k6"><rect x="850" y="470" width="330" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="772" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="592" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Three ways to count the same burst</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">one burst, counted three ways</text>

  
  <g filter="url(#p16-soft)">
    <rect x="60" y="104" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="60" y="104" width="6" height="90" fill="#D97706" clip-path="url(#p16-k1)"/>
  </g>
  <circle cx="98" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,138.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="124" y="156" font-size="18.5" font-weight="600" fill="#111827">Fixed window</text>
  <text x="225" y="219" text-anchor="middle" font-size="15.5" fill="#6B7280">one counter per clock minute</text>

  <rect x="65" y="262" width="155" height="96" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="230" y="262" width="155" height="96" rx="12" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <g fill="#D97706">
    <rect x="152" y="278" width="7" height="60" rx="2"/>
    <rect x="165" y="278" width="7" height="60" rx="2"/>
    <rect x="178" y="278" width="7" height="60" rx="2"/>
    <rect x="191" y="278" width="7" height="60" rx="2"/>
    <rect x="204" y="278" width="7" height="60" rx="2"/>
    <rect x="239" y="278" width="7" height="60" rx="2"/>
    <rect x="252" y="278" width="7" height="60" rx="2"/>
    <rect x="265" y="278" width="7" height="60" rx="2"/>
    <rect x="278" y="278" width="7" height="60" rx="2"/>
    <rect x="291" y="278" width="7" height="60" rx="2"/>
  </g>
  <text x="142.5" y="384" text-anchor="middle" font-size="15.5" fill="#6B7280">12:00</text>
  <text x="307.5" y="384" text-anchor="middle" font-size="15.5" fill="#6B7280">12:01</text>
  <text x="225" y="424" text-anchor="middle" font-size="15.5" fill="#6B7280">600 then 600 again</text>
  <text x="225" y="447" text-anchor="middle" font-size="15.5" fill="#94A3B8">both bursts sit on one boundary</text>

  
  <g filter="url(#p16-soft)">
    <rect x="455" y="104" width="330" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="455" y="104" width="6" height="90" fill="#4F46E5" clip-path="url(#p16-k2)"/>
  </g>
  <circle cx="493" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,138.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="519" y="156" font-size="18.5" font-weight="600" fill="#111827">Sliding window</text>
  <text x="620" y="219" text-anchor="middle" font-size="15.5" fill="#6B7280">one counter over the moving minute</text>

  <path d="M455,358 H785" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M455,346 V370" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <path d="M785,238 V370" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <rect x="565" y="268" width="220" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.8" stroke-dasharray="6 5"/>
  <g fill="none" stroke-width="2">
    <path d="M690,250 H785" stroke="#4F46E5" marker-end="url(#p16-im)"/>
  </g>
  <text x="785" y="384" text-anchor="end" font-size="15.5" fill="#6B7280">now</text>
  <text x="620" y="424" text-anchor="middle" font-size="15.5" fill="#6B7280">counts the exact preceding</text>
  <text x="620" y="447" text-anchor="middle" font-size="15.5" fill="#94A3B8">one-minute interval</text>

  
  <g filter="url(#p16-lift)">
    <rect x="850" y="104" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="850" y="104" width="9" height="90" fill="#059669" clip-path="url(#p16-k3)"/>
  </g>
  <circle cx="888" cy="149" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,138.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="914" y="156" font-size="18.5" font-weight="600" fill="#111827">Token bucket</text>
  <text x="1015" y="219" text-anchor="middle" font-size="15.5" fill="#6B7280">a budget that refills as time passes</text>

  <g fill="none" stroke-width="2">
    <path d="M1015,234 V268" stroke="#059669" marker-end="url(#p16-em)"/>
  </g>
  <path d="M942,268 H1088 V380 A10,10 0 0 1 1078,390 H952 A10,10 0 0 1 942,380 Z" fill="#D1FAE5"/>
  <path d="M940,268 V380 A12,12 0 0 0 952,392 H1078 A12,12 0 0 0 1090,380 V268" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M942,268 H1088" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="1015" y="336" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">120</text>
  <text x="1015" y="424" text-anchor="middle" font-size="15.5" fill="#6B7280">refill 10 per second</text>
  <text x="1015" y="447" text-anchor="middle" font-size="15.5" fill="#94A3B8">burst up to 120</text>

  
  <g filter="url(#p16-soft)">
    <rect x="60" y="470" width="330" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="470" width="6" height="90" fill="#64748B" clip-path="url(#p16-k4)"/>
  </g>
  <circle cx="98" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,504.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="124" y="522" font-size="18.5" font-weight="600" fill="#111827">Cost: double burst</text>
  <text x="225" y="585" text-anchor="middle" font-size="15.5" fill="#6B7280">a caller may send two full</text>
  <text x="225" y="608" text-anchor="middle" font-size="15.5" fill="#94A3B8">allowances in seconds</text>

  <g filter="url(#p16-soft)">
    <rect x="455" y="470" width="330" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="455" y="470" width="6" height="90" fill="#64748B" clip-path="url(#p16-k5)"/>
  </g>
  <circle cx="493" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,504.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="519" y="522" font-size="18.5" font-weight="600" fill="#111827">Cost: more state</text>
  <text x="620" y="585" text-anchor="middle" font-size="15.5" fill="#6B7280">more state to track</text>
  <text x="620" y="608" text-anchor="middle" font-size="15.5" fill="#94A3B8">the recent history</text>

  <g filter="url(#p16-soft)">
    <rect x="850" y="470" width="330" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="850" y="470" width="6" height="90" fill="#64748B" clip-path="url(#p16-k6)"/>
  </g>
  <circle cx="888" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,504.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="914" y="522" font-size="18.5" font-weight="600" fill="#111827">Cost: two numbers</text>
  <text x="1015" y="585" text-anchor="middle" font-size="15.5" fill="#6B7280">publish a rate</text>
  <text x="1015" y="608" text-anchor="middle" font-size="15.5" fill="#94A3B8">and a burst size</text>

  
  <rect x="40" y="656" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="701" text-anchor="middle" font-size="16" fill="#475569">Publish the counted unit and the scope, not only a number.</text>
</svg>