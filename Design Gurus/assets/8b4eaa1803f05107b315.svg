<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="970" viewBox="0 0 1240 970" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In series, a load balancer at 99.99 percent, an app server at 99.9 percent and a database at 99.9 percent give a total of about 99.79 percent. In parallel, two servers at 99 percent each give 99.99 percent together.">
  <defs>
    <filter id="av2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="av2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="av2-k1"><rect x="64" y="180" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="av2-k2"><rect x="358" y="180" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="av2-k3"><rect x="652" y="180" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="av2-k4"><rect x="946" y="180" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="av2-k5"><rect x="64" y="535" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av2-k6"><rect x="460" y="450" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av2-k7"><rect x="460" y="620" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="av2-k8"><rect x="900" y="535" width="276" height="90" rx="12"/></clipPath>
    <marker id="av2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="av2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="970" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Availability of parts in series and in parallel</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every required part lowers the total. Every spare copy raises it.</text>

  <rect x="40" y="120" width="1160" height="230" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">In series: the request needs every part</text>
  <rect x="40" y="390" width="1160" height="370" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="420" font-size="19.5" font-weight="600" fill="#475569">In parallel: the request needs only one copy</text>

  <g fill="none" stroke-width="2">
    <path d="M294,225 H358" stroke="#2563EB" marker-end="url(#av2-m-blue)"/>
    <path d="M588,225 H652" stroke="#2563EB" marker-end="url(#av2-m-blue)"/>
    <path d="M882,225 H946" stroke="#64748B" marker-end="url(#av2-m-slate)"/>
    <path d="M314,580 H372 Q387,580 387,565 V510 Q387,495 402,495 H460" stroke="#2563EB" marker-end="url(#av2-m-blue)"/>
    <path d="M314,580 H372 Q387,580 387,595 V650 Q387,665 402,665 H460" stroke="#2563EB" marker-end="url(#av2-m-blue)"/>
    <path d="M710,495 H790 Q805,495 805,510 V565 Q805,580 820,580 H900" stroke="#64748B" marker-end="url(#av2-m-slate)"/>
    <path d="M710,665 H790 Q805,665 805,650 V595 Q805,580 820,580 H900" stroke="#64748B" marker-end="url(#av2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#av2-soft)">
    <rect x="64" y="180" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#av2-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <text x="179" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">99.99% available</text>
  <g filter="url(#av2-soft)">
    <rect x="358" y="180" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="358" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#av2-k2)"/>
  </g>
  <circle cx="396" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(385.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="422" y="232" font-size="21.5" font-weight="600" fill="#111827">App server</text>
  <text x="473" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">99.9% available</text>
  <g filter="url(#av2-soft)">
    <rect x="652" y="180" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="652" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#av2-k3)"/>
  </g>
  <circle cx="690" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(679.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="716" y="232" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="767" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">99.9% available</text>
  <g filter="url(#av2-lift)">
    <rect x="946" y="180" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="946" y="180" width="9" height="90" fill="#DB2777" clip-path="url(#av2-k4)"/>
  </g>
  <circle cx="984" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(973.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="1010" y="232" font-size="21.5" font-weight="600" fill="#111827">Total: 99.79%</text>
  <text x="1061" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">0.9999 x 0.999 x 0.999</text>
  <text x="1061" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">about 18 hours down a year</text>
  <g filter="url(#av2-soft)">
    <rect x="64" y="535" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="535" width="6" height="90" fill="#2563EB" clip-path="url(#av2-k5)"/>
  </g>
  <circle cx="102" cy="580" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,569.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="128" y="587" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <text x="189" y="654" font-size="18.5" text-anchor="middle" fill="#6B7280">skips a failed server</text>
  <g filter="url(#av2-soft)">
    <rect x="460" y="450" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="460" y="450" width="6" height="90" fill="#2563EB" clip-path="url(#av2-k6)"/>
  </g>
  <circle cx="498" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,484.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="524" y="502" font-size="21.5" font-weight="600" fill="#111827">Server A</text>
  <text x="585" y="569" font-size="18.5" text-anchor="middle" fill="#6B7280">99% available</text>
  <g filter="url(#av2-soft)">
    <rect x="460" y="620" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="460" y="620" width="6" height="90" fill="#2563EB" clip-path="url(#av2-k7)"/>
  </g>
  <circle cx="498" cy="665" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,654.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="524" y="672" font-size="21.5" font-weight="600" fill="#111827">Server B</text>
  <text x="585" y="739" font-size="18.5" text-anchor="middle" fill="#6B7280">99% available</text>
  <g filter="url(#av2-lift)">
    <rect x="900" y="535" width="276" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="900" y="535" width="9" height="90" fill="#059669" clip-path="url(#av2-k8)"/>
  </g>
  <circle cx="938" cy="580" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,569.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="964" y="587" font-size="21.5" font-weight="600" fill="#111827">Together: 99.99%</text>
  <text x="1038" y="654" font-size="18.5" text-anchor="middle" fill="#6B7280">1 - (0.01 x 0.01)</text>
  <text x="1038" y="681" font-size="18.5" text-anchor="middle" fill="#94A3B8">fails only if both fail at once</text>

  <rect x="40" y="790" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="815" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="840" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Series</text>
  <text x="323" y="840" font-size="18.5" fill="#475569">each extra required part lowers the total availability</text>
  <rect x="64" y="865" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="890" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Parallel</text>
  <text x="323" y="890" font-size="18.5" fill="#475569">copies raise the total, but only when they fail independently</text>
</svg>