<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1300" viewBox="0 0 1240 1300" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The failure playbook: a misbehaving dependency is detected by a timeout set from p99, then the shape of the failure picks the tool. Transient gets a retry with backoff, jitter, budget and one layer. Sustained gets a circuit breaker plus alert. Slow gets a bulkhead, a bounded pool per dependency. Every path then asks whether there is a real answer: yes serves it, no degrades to stale, default, hide, defer, or a clean refusal.">
  <defs>
    <marker id="m08-l03-failure-playbook-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m08-l03-failure-playbook-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m08-l03-failure-playbook-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m08-l03-failure-playbook-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1300" fill="#FFFFFF"/>

  <rect x="40" y="110" width="1160" height="190" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="150" font-size="20" font-weight="600" fill="#334155">1. Detect: notice the trouble fast</text>
  <g filter="url(#m08-l03-failure-playbook-soft)">
    <rect x="70" y="180" width="380" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="260" y="242" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A dependency is misbehaving</text>
  <g filter="url(#m08-l03-failure-playbook-soft)">
    <rect x="520" y="180" width="440" height="110" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="740" y="242" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Detect it with a timeout set from p99</text>

  <g filter="url(#m08-l03-failure-playbook-soft)">
    <path d="M620,330 L820,420 L620,510 L420,420 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="620" y="411" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">What shape is</text>
  <text x="620" y="443" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the failure?</text>

  <rect x="40" y="560" width="1160" height="230" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="600" font-size="20" font-weight="600" fill="#334155">2. Respond and contain</text>
  <g filter="url(#m08-l03-failure-playbook-soft)">
    <rect x="60" y="650" width="340" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="230" y="706" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Retry with backoff,</text>
  <text x="230" y="738" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">jitter, a budget, one layer</text>
  <g filter="url(#m08-l03-failure-playbook-soft)">
    <rect x="450" y="650" width="340" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="706" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A circuit breaker,</text>
  <text x="620" y="738" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">plus an alert</text>
  <g filter="url(#m08-l03-failure-playbook-soft)">
    <rect x="840" y="650" width="340" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1010" y="706" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A bulkhead: a bounded</text>
  <text x="1010" y="738" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">pool per dependency</text>

  <rect x="40" y="860" width="1160" height="270" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="900" font-size="20" font-weight="600" fill="#334155">3. Degrade, or serve</text>
  <g filter="url(#m08-l03-failure-playbook-soft)">
    <path d="M620,915 L820,1000 L620,1085 L420,1000 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="620" y="991" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Do we have</text>
  <text x="620" y="1023" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">a real answer?</text>
  <g filter="url(#m08-l03-failure-playbook-soft)">
    <rect x="60" y="940" width="280" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="200" y="1007" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Serve it</text>
  <g filter="url(#m08-l03-failure-playbook-soft)">
    <rect x="880" y="930" width="300" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1030" y="991" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Degrade: stale, default,</text>
  <text x="1030" y="1023" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">hide, defer, or refuse</text>

  <g fill="none" stroke-width="2.5">
    <path d="M450,235 L512,235" stroke="#DC2626" stroke-width="2" marker-end="url(#m08-l03-failure-playbook-rd)"/>
    <path d="M740,290 C740,315 660,308 640,332" stroke="#DC2626" stroke-width="2" marker-end="url(#m08-l03-failure-playbook-rd)"/>
    <path d="M420,420 C300,420 230,560 230,642" stroke="#059669" stroke-width="2" marker-end="url(#m08-l03-failure-playbook-em)"/>
    <path d="M620,510 L620,642" stroke="#DC2626" stroke-width="2" marker-end="url(#m08-l03-failure-playbook-rd)"/>
    <path d="M820,420 C940,420 1010,560 1010,642" stroke="#3B82F6" stroke-width="2" marker-end="url(#m08-l03-failure-playbook-bl)"/>
    <path d="M230,780 C230,850 460,880 500,940" stroke="#059669" stroke-width="2" marker-end="url(#m08-l03-failure-playbook-em)"/>
    <path d="M620,780 L620,907" stroke="#DC2626" stroke-width="2" marker-end="url(#m08-l03-failure-playbook-rd)"/>
    <path d="M1010,780 C1010,850 780,880 740,940" stroke="#3B82F6" stroke-width="2" marker-end="url(#m08-l03-failure-playbook-bl)"/>
    <path d="M420,1000 L352,1000" stroke="#059669" marker-end="url(#m08-l03-failure-playbook-em)"/>
    <path d="M820,1000 L872,1000" stroke="#DC2626" marker-end="url(#m08-l03-failure-playbook-rd)"/>
  </g>

  <text x="230" y="632" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Transient</text>
  <text x="620" y="632" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Sustained</text>
  <text x="1010" y="632" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Slow</text>
  <text x="415" y="985" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="825" y="985" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <line x1="60" y1="1180" x2="96" y2="1180" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1187" font-size="20" fill="#475569">Transient: retry, and then serve the real answer</text>
  <line x1="60" y1="1220" x2="96" y2="1220" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1227" font-size="20" fill="#475569">Sustained: trip the breaker, and degrade cleanly</text>
  <line x1="60" y1="1260" x2="96" y2="1260" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1267" font-size="20" fill="#475569">Slow: bulkhead it, so one dependency cannot take the rest down</text>
</svg>