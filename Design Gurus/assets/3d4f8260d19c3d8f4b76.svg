<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1200" viewBox="0 0 1240 1200" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Anatomy of a cascade with no timeouts. Payments hangs at 2:00:00, every waiting call holds a Checkout thread, the pool of about 200 threads is exhausted in 2 seconds, unrelated endpoints queue and gateway calls time out, user refreshes feed more hung calls back into the loop, and the whole site is down by 2:03.">
  <defs>
    <marker id="m04-l08-cascade-anatomy-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l08-cascade-anatomy-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m04-l08-cascade-anatomy-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1200" fill="#FFFFFF"/>

  <rect x="40" y="60" width="1160" height="220" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="110" font-size="20" font-weight="600" fill="#B91C1C">2:00:00</text>
  <text x="175" y="110" font-size="20" font-weight="600" fill="#334155">The trigger</text>
  <text x="1180" y="110" text-anchor="end" font-size="20" fill="#64748B">hanging is worse than crashing</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="60" y="170" width="320" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="220" y="211" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments hangs</text>
  <text x="220" y="243" text-anchor="middle" font-size="20" fill="#64748B">accepts, never answers</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="420" y="170" width="420" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="630" y="211" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">No timeout, so each call</text>
  <text x="630" y="243" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">waits forever</text>

  <rect x="40" y="320" width="1160" height="220" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="370" font-size="20" font-weight="600" fill="#B91C1C">2:00:30</text>
  <text x="175" y="370" font-size="20" font-weight="600" fill="#334155">Resource exhaustion</text>
  <text x="1180" y="370" text-anchor="end" font-size="20" fill="#64748B">a thread pool is a fixed set of workers</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="60" y="430" width="400" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="260" y="471" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Every waiting call holds</text>
  <text x="260" y="503" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">a Checkout thread</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="520" y="430" width="460" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="750" y="471" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The pool of about 200 threads</text>
  <text x="750" y="503" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">is exhausted in 2 seconds</text>

  <rect x="40" y="580" width="1160" height="220" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="630" font-size="20" font-weight="600" fill="#B91C1C">2:01:00</text>
  <text x="175" y="630" font-size="20" font-weight="600" fill="#334155">The damage spreads</text>
  <text x="1180" y="630" text-anchor="end" font-size="20" fill="#64748B">endpoints that never touch Payments queue too</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="60" y="690" width="360" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="240" y="731" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cart and order history</text>
  <text x="240" y="763" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">queue behind dead threads</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="445" y="690" width="340" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="615" y="731" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway calls to</text>
  <text x="615" y="763" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout time out</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="810" y="690" width="370" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="995" y="731" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Users refresh,</text>
  <text x="995" y="763" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">adding more load</text>

  <rect x="40" y="840" width="1160" height="220" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="890" font-size="20" font-weight="600" fill="#B91C1C">2:03:00</text>
  <text x="175" y="890" font-size="20" font-weight="600" fill="#B91C1C">Total failure</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="60" y="950" width="460" height="100" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="290" y="991" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The whole site is down</text>
  <text x="290" y="1023" text-anchor="middle" font-size="20" fill="#64748B">not the payment feature, the site</text>
  <g filter="url(#m04-l08-cascade-anatomy-soft)">
    <rect x="580" y="950" width="600" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="880" y="991" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Nothing anywhere was broken</text>
  <text x="880" y="1023" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">except one service being slow</text>

  <g fill="none" stroke-width="2.5">
    <path d="M380,220 L412,220" stroke="#DC2626" marker-end="url(#m04-l08-cascade-anatomy-rd)"/>
    <path d="M630,270 L630,422" stroke="#DC2626" marker-end="url(#m04-l08-cascade-anatomy-rd)"/>
    <path d="M460,480 L512,480" stroke="#DC2626" marker-end="url(#m04-l08-cascade-anatomy-rd)"/>
    <path d="M560,530 L560,660 L240,660 L240,682" stroke="#DC2626" marker-end="url(#m04-l08-cascade-anatomy-rd)"/>
    <path d="M620,530 L620,682" stroke="#DC2626" marker-end="url(#m04-l08-cascade-anatomy-rd)"/>
    <path d="M615,790 L615,920 L290,920 L290,942" stroke="#DC2626" marker-end="url(#m04-l08-cascade-anatomy-rd)"/>
    <path d="M1180,740 L1212,740 L1212,220 L852,220" stroke="#3B82F6" marker-end="url(#m04-l08-cascade-anatomy-bl)"/>
  </g>

  <text x="1180" y="822" text-anchor="end" font-size="20" fill="#1E40AF">each refresh is multiplied into more hung calls</text>

  <line x1="60" y1="1110" x2="96" y2="1110" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1117" font-size="20" fill="#475569">Cascade: the failure spreading through held threads</text>
  <line x1="60" y1="1150" x2="96" y2="1150" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1157" font-size="20" fill="#475569">Live traffic re-entering: each refresh becomes more hung calls</text>
</svg>