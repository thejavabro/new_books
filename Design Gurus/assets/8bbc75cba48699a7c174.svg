<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="the input and an empty stack">
<defs>
<filter id="bp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">The input is "{[()]}" and the stack starts empty</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">an opening bracket is pushed, and a closing bracket must match the most recent opener</text>
<rect x="40" y="100" width="1160" height="116" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="130" font-size="19.5" font-weight="600" fill="#475569">the input</text>
<rect x="379" y="146" width="72" height="52" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="415" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">{</text>
<rect x="461" y="146" width="72" height="52" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="497" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">[</text>
<rect x="543" y="146" width="72" height="52" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="579" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">(</text>
<rect x="625" y="146" width="72" height="52" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="661" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">)</text>
<rect x="707" y="146" width="72" height="52" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="743" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">]</text>
<rect x="789" y="146" width="72" height="52" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="825" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">}</text>
<rect x="40" y="236" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="266" font-size="19.5" font-weight="600" fill="#047857">the stack, bottom to top</text>
<rect x="379" y="282" width="240" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="499" y="314.5" text-anchor="middle" font-size="18" fill="#94A3B8">empty</text>
<rect x="40" y="402" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="442" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">nothing read yet</text>
<text x="620" y="474" text-anchor="middle" font-size="18.5" fill="#475569">only a stack remembers which opener is still waiting to be closed</text>
</svg>