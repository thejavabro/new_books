<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A message arrives for user 42. The system looks up the registry, which says user 42 is connected to gateway 3. The message is sent to gateway 3, which holds the open socket, and user 42 receives the message immediately.">
  <defs>
    <filter id="sfl4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sfl4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sfl4-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sfl4-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sfl4-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sfl4-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="sfl4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Finding the gateway that holds a connection</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">500,000 connected users on 10 gateways, each holding 50,000 connections.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#sfl4-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#sfl4-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#sfl4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#sfl4-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#sfl4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Message arrives</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">for user 42</text>
  <g filter="url(#sfl4-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#D97706" clip-path="url(#sfl4-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Registry</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">user 42 is on</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">gateway 3</text>
  <g filter="url(#sfl4-lift)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="646" y="140" width="9" height="90" fill="#2563EB" clip-path="url(#sfl4-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Gateway 3</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">holds the open</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">connection</text>
  <g filter="url(#sfl4-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#sfl4-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">User 42</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">gets the message</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">immediately</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Registry</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">a shared map from each connected user to their gateway</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Reconnect</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">a user may connect to another gateway, so the registry is updated</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Behind it</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">the services that create messages stay stateless</text>
</svg>