<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Event style pub/sub: Checkout publishes one order placed event to a topic inside the broker, and Notifications, Fulfillment, Analytics and Loyalty each receive their own copy, while a fraud check subscribes next quarter without any change to Checkout">
  <defs>
    <marker id="m03-l04-pubsub-topic-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m03-l04-pubsub-topic-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m03-l04-pubsub-topic-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="870" fill="#FFFFFF"/>

  <rect x="380" y="228" width="480" height="170" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="266" text-anchor="middle" font-size="20" font-weight="600" fill="#92400E">Broker</text>

  <rect x="40" y="450" width="1160" height="250" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="488" font-size="20" font-weight="600" fill="#334155">Subscribers: each gets its own copy</text>

  
  <g fill="none" stroke="#D97706" stroke-width="2.5">
    <path d="M620,160 L620,222" marker-end="url(#m03-l04-pubsub-topic-am)"/>
    <path d="M620,378 V520"/>
    <path d="M152,520 H854"/>
    <path d="M152,520 V544" marker-end="url(#m03-l04-pubsub-topic-am)"/>
    <path d="M386,520 V544" marker-end="url(#m03-l04-pubsub-topic-am)"/>
    <path d="M620,520 V544" marker-end="url(#m03-l04-pubsub-topic-am)"/>
    <path d="M854,520 V544" marker-end="url(#m03-l04-pubsub-topic-am)"/>
  </g>
  <path d="M834,332 H1150 V520 H1088 V544" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m03-l04-pubsub-topic-em)"/>

  <g filter="url(#m03-l04-pubsub-topic-soft)">
    <rect x="470" y="70" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="620" y="111" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="620" y="141" text-anchor="middle" font-size="20" fill="#64748B">publishes once, then done</text>
  <g filter="url(#m03-l04-pubsub-topic-soft)">
    <rect x="410" y="286" width="420" height="92" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="620" y="328" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Topic: order placed</text>
  <text x="620" y="358" text-anchor="middle" font-size="20" fill="#92400E">routing lives in the subscriptions</text>

  <g filter="url(#m03-l04-pubsub-topic-soft)">
    <rect x="40" y="548" width="224" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="152" y="594" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="152" y="624" text-anchor="middle" font-size="20" fill="#64748B">confirmation email</text>
  <g filter="url(#m03-l04-pubsub-topic-soft)">
    <rect x="274" y="548" width="224" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="386" y="594" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="386" y="624" text-anchor="middle" font-size="20" fill="#64748B">warehouse</text>
  <g filter="url(#m03-l04-pubsub-topic-soft)">
    <rect x="508" y="548" width="224" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="620" y="594" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Analytics</text>
  <text x="620" y="624" text-anchor="middle" font-size="20" fill="#64748B">order analytics</text>
  <g filter="url(#m03-l04-pubsub-topic-soft)">
    <rect x="742" y="548" width="224" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="854" y="594" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Loyalty</text>
  <text x="854" y="624" text-anchor="middle" font-size="20" fill="#64748B">points update</text>
  <g filter="url(#m03-l04-pubsub-topic-soft)">
    <rect x="976" y="548" width="224" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1088" y="594" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fraud check</text>
  <text x="1088" y="624" text-anchor="middle" font-size="20" fill="#065F46">joins next quarter</text>

  <g font-size="20" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="644" y="200" fill="#92400E">publishes order placed</text>
    <text x="874" y="290" fill="#065F46">added next quarter,</text>
    <text x="874" y="322" fill="#065F46">Checkout unchanged</text>
  </g>

  <text x="620" y="750" text-anchor="middle" font-size="20" fill="#065F46">Checkout names no receivers, so the fraud consumer ships by adding a subscription.</text>

  <line x1="50" y1="790" x2="86" y2="790" stroke="#D97706" stroke-width="4"/>
  <text x="98" y="797" font-size="20" fill="#475569">Asynchronous publish and fan-out: one copy per subscription</text>
  <line x1="50" y1="830" x2="86" y2="830" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="98" y="837" font-size="20" fill="#475569">Added later: a new subscriber joins with zero producer changes</text>
</svg>