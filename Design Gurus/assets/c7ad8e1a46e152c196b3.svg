<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Long-polling: the server holds each request open until it has data or the request times out, and the client immediately reconnects">
  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>
  <defs>
    <marker id="rt3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rt3-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rt3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rt3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="240" y1="112" x2="240" y2="630" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1000" y1="112" x2="1000" y2="630" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="248" y1="192" x2="990" y2="192" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt3-blue)"/>
  <text x="620" y="168" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. The client sends a request</text>

  
  <rect x="845" y="218" width="310" height="84" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1000" y="252" font-size="20" fill="#92400E" text-anchor="middle">2. Server holds the request</text>
  <text x="1000" y="279" font-size="20" fill="#92400E" text-anchor="middle">open, waiting for new data</text>

  
  <line x1="992" y1="350" x2="250" y2="350" stroke="#059669" stroke-width="2.5" marker-end="url(#rt3-emerald)"/>
  <text x="620" y="326" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. Data arrives: the server sends a full response</text>

  
  <line x1="248" y1="400" x2="990" y2="400" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt3-blue)"/>
  <text x="620" y="376" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. The client immediately sends a new request</text>

  
  <rect x="845" y="426" width="310" height="84" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1000" y="460" font-size="20" fill="#92400E" text-anchor="middle">Server holds again,</text>
  <text x="1000" y="487" font-size="20" fill="#92400E" text-anchor="middle">no data this time</text>

  
  <line x1="992" y1="558" x2="250" y2="558" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rt3-red)"/>
  <text x="620" y="534" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. Timeout reached: empty response</text>

  
  <line x1="248" y1="608" x2="990" y2="608" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt3-blue)"/>
  <text x="620" y="584" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. The client reconnects with a new request</text>

  
  <g filter="url(#rt3-soft)">
    <rect x="120" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="880" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="240" y="98" font-size="20" fill="#64748B" text-anchor="middle">asks and waits</text>
  <text x="1000" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="1000" y="98" font-size="20" fill="#64748B" text-anchor="middle">answers only with news</text>

  
  <rect x="200" y="644" width="840" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="675" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A request is almost always waiting,</text>
  <text x="620" y="702" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">so an update leaves the server the moment it exists.</text>

  
  <line x1="105" y1="756" x2="133" y2="756" stroke="#3B82F6" stroke-width="3"/>
  <text x="143" y="763" font-size="20" fill="#475569">request</text>
  <line x1="255" y1="756" x2="283" y2="756" stroke="#059669" stroke-width="3"/>
  <text x="293" y="763" font-size="20" fill="#475569">response with data</text>
  <line x1="514" y1="756" x2="542" y2="756" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="552" y="763" font-size="20" fill="#475569">empty response on timeout</text>
  <rect x="850" y="747" width="28" height="18" rx="4" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="888" y="763" font-size="20" fill="#475569">server holding the request</text>
</svg>