<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="782" viewBox="0 0 1240 782" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="findings-title findings-desc">
<title id="findings-title">The findings that recur</title>
<desc id="findings-desc">The same handful of issues come out of this exercise repeatedly across small and medium systems, and knowing them makes a first session much faster.</desc>
<defs>
<marker id="findings-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="findings-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="findings-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="findings-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="782" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The findings that recur</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Across small and medium systems, the same handful of issues come out of this exercise repeatedly.</text>
<rect x="40" y="704" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="704" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="138.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Authorization at the edge,</text><text x="280" y="165.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">not at the object</text>
<path d="M526 146H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 146H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#findings-marker-slate)"/>
<rect x="570" y="118" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="139.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most common serious finding, and it survives</text><text x="590" y="164.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because the normal path works</text>
<rect x="40" y="182" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="202.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An internal service with</text><text x="280" y="229.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no authentication</text>
<path d="M526 210H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 210H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#findings-marker-slate)"/>
<rect x="570" y="182" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="216" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reachable from anywhere, assuming the network is the boundary</text>
<rect x="40" y="246" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="280" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Secrets in places that get copied</text>
<path d="M526 274H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 274H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#findings-marker-slate)"/>
<rect x="570" y="246" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="267.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">environment dumps, logs, error reports, support tooling,</text><text x="590" y="292.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a restored staging database</text>
<rect x="40" y="310" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No rate limit on anything expensive</text>
<path d="M526 338H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 338H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#findings-marker-slate)"/>
<rect x="570" y="310" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="344" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">password reset, search, export, anything that sends a message</text>
<rect x="40" y="374" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="408" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A webhook signature not verified</text>
<path d="M526 402H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 402H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#findings-marker-slate)"/>
<rect x="570" y="374" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="408" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">or verified with a comparison that is not constant time</text>
<rect x="40" y="438" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="472" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Logs containing what they protected</text>
<path d="M526 466H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 466H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#findings-marker-slate)"/>
<rect x="570" y="438" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="459.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the failure mode of structured logging, which is why</text><text x="590" y="484.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">field selection matters</text>
<rect x="40" y="520" width="520" height="72" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="520" width="5" height="72" rx="2.5" fill="#5EC9EC"/><text x="64" y="549" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Debuggability wants more fields</text><text x="64" y="575" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a user id, a tenant, a resource id, a trace id</text>
<rect x="600" y="520" width="600" height="72" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="600" y="520" width="5" height="72" rx="2.5" fill="#F28B9D"/><text x="624" y="549" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Security wants fewer</text><text x="624" y="575" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the contents of the record are what you were protecting</text>
<rect x="40" y="618" width="1160" height="60" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="618" width="5" height="60" rx="2.5" fill="#39D5AA"/><text x="64" y="654" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The resolution: decide which fields are identifiers and which are contents.</text>
<text x="66" y="738" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The two lessons pull in opposite directions, and the resolution is a field-by-field decision.</text>
</svg>