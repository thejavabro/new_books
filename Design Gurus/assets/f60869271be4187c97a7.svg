<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ordering-title ordering-desc">
<title id="ordering-title">Ordering is a per-partition promise</title>
<desc id="ordering-desc">Records sharing a key share a partition and arrive in order, and nothing is guaranteed across partitions or topics. Key selection is therefore the ordering decision, and four common patterns quietly discard it.</desc>
<defs>
<marker id="ordering-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ordering-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ordering-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ordering-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="790" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Ordering is a per-partition promise</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Since a keyed record is assigned to a partition by hashing its key, ordering is really a promise about keys.</text>
<rect x="40" y="712" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="712" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="58" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="58" rx="2.5" fill="#AC8BE8"/><text x="64" y="153" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Kafka orders records within a partition. Nothing more.</text>
<rect x="40" y="194" width="300" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="228" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">key = order-42</text>
<path d="M346 222H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 222H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ordering-marker-slate)"/>
<rect x="390" y="194" width="320" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="550" y="228" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">hash mod partitions</text>
<path d="M716 222H750" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M716 222H750" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ordering-marker-slate)"/>
<rect x="760" y="194" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="980" y="228" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">always partition 3, always in order</text>
<text x="40" y="288" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Four ways this breaks in practice</text>
<circle cx="60" cy="336" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="343" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="306" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ordering assumed across topics</text>
<path d="M536 336H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 336H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ordering-marker-slate)"/>
<rect x="580" y="306" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="329.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">OrderCreated and PaymentReceived on separate topics</text><text x="600" y="354.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">have no relative order</text>
<circle cx="60" cy="408" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="415" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="378" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="414" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A retry topic reorders by design</text>
<path d="M536 408H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 408H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ordering-marker-slate)"/>
<rect x="580" y="378" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="401.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the failed record is reprocessed</text><text x="600" y="426.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">after records that came behind it</text>
<circle cx="60" cy="480" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="487" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="450" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="486" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Adding partitions moves keys</text>
<path d="M536 480H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 480H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ordering-marker-slate)"/>
<rect x="580" y="450" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="473.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the modulus changes, so a key</text><text x="600" y="498.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">briefly exists in two partitions</text>
<circle cx="60" cy="552" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="559" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="522" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="558" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A thread pool inside the consumer</text>
<path d="M536 552H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 552H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ordering-marker-slate)"/>
<rect x="580" y="522" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="545.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">throws away the ordering the broker gave you,</text><text x="600" y="570.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in your own process</text>
<rect x="40" y="606" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="606" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="639" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Key by the entity whose history must stay consistent.</text><text x="64" y="665" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Coarser collapses parallelism. Finer or null discards the ordering you needed.</text>
<text x="66" y="746" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Any design with retry topics has already given up per-key ordering.</text>
</svg>