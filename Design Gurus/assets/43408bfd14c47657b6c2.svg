<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="468" viewBox="0 0 1240 468" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four examples and the option each one calls for. A chat application needs WebSockets because both sides send often. A live price feed needs server-sent events because data flows one way. A progress bar needs server-sent events, with long polling as a fallback. A notification badge needs only short polling.">
  <rect x="0" y="0" width="1240" height="468" fill="#FFFFFF"/>
  <defs>
    <marker id="rtd4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rtd4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rtd4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rtd4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rtd4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rtd4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rtd4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rtd4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rtd4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Pick by the direction of the data, then by how late an update may be</text>
  <g filter="url(#rtd4-soft)"><rect x="24" y="76" width="280" height="344" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="164" y="116" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Chat application</text>
  <text x="164" y="144" font-size="18" fill="#64748B" text-anchor="middle">people type to each other</text>
  <path d="M44,166 L284,166" fill="none" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="44" y="186" width="240" height="84" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="164" y="214" font-size="17" fill="#64748B" text-anchor="middle">use</text>
  <text x="164" y="248" font-size="22" font-weight="700" fill="#6D28D9" text-anchor="middle">WebSockets</text>
  <text x="164" y="306" font-size="18" fill="#64748B" text-anchor="middle">Both sides send, and both</text>
  <text x="164" y="334" font-size="18" fill="#64748B" text-anchor="middle">sides send often. One open</text>
  <text x="164" y="362" font-size="18" fill="#64748B" text-anchor="middle">connection carries the</text>
  <text x="164" y="390" font-size="18" fill="#64748B" text-anchor="middle">whole conversation.</text>
  <g filter="url(#rtd4-soft)"><rect x="328" y="76" width="280" height="344" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="468" y="116" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Live price feed</text>
  <text x="468" y="144" font-size="18" fill="#64748B" text-anchor="middle">numbers change every second</text>
  <path d="M348,166 L588,166" fill="none" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="348" y="186" width="240" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="468" y="214" font-size="17" fill="#64748B" text-anchor="middle">use</text>
  <text x="468" y="248" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle">Server-sent events</text>
  <text x="468" y="306" font-size="18" fill="#64748B" text-anchor="middle">The screen only receives.</text>
  <text x="468" y="334" font-size="18" fill="#64748B" text-anchor="middle">You get the same speed as</text>
  <text x="468" y="362" font-size="18" fill="#64748B" text-anchor="middle">WebSockets, with far less</text>
  <text x="468" y="390" font-size="18" fill="#64748B" text-anchor="middle">code to write.</text>
  <g filter="url(#rtd4-soft)"><rect x="632" y="76" width="280" height="344" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="772" y="116" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Progress bar</text>
  <text x="772" y="144" font-size="18" fill="#64748B" text-anchor="middle">one long job is running</text>
  <path d="M652,166 L892,166" fill="none" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="652" y="186" width="240" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
  <text x="772" y="214" font-size="17" fill="#64748B" text-anchor="middle">use</text>
  <text x="772" y="248" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle">Server-sent events</text>
  <text x="772" y="306" font-size="18" fill="#64748B" text-anchor="middle">The server sends a percent</text>
  <text x="772" y="334" font-size="18" fill="#64748B" text-anchor="middle">while it works, then closes.</text>
  <text x="772" y="362" font-size="18" fill="#64748B" text-anchor="middle">Use long polling if the</text>
  <text x="772" y="390" font-size="18" fill="#64748B" text-anchor="middle">network blocks them.</text>
  <g filter="url(#rtd4-soft)"><rect x="936" y="76" width="280" height="344" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="1076" y="116" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Notification badge</text>
  <text x="1076" y="144" font-size="18" fill="#64748B" text-anchor="middle">a small count on an icon</text>
  <path d="M956,166 L1196,166" fill="none" stroke="#CBD5E1" stroke-width="1.4"/>
  <rect x="956" y="186" width="240" height="84" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="1076" y="214" font-size="17" fill="#64748B" text-anchor="middle">use</text>
  <text x="1076" y="248" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">Short polling</text>
  <text x="1076" y="306" font-size="18" fill="#64748B" text-anchor="middle">It changes a few times a</text>
  <text x="1076" y="334" font-size="18" fill="#64748B" text-anchor="middle">day. A delay of a minute is</text>
  <text x="1076" y="362" font-size="18" fill="#64748B" text-anchor="middle">fine, so holding a connection</text>
  <text x="1076" y="390" font-size="18" fill="#64748B" text-anchor="middle">open is not worth it.</text>
  <text x="620" y="448" font-size="19" fill="#64748B" text-anchor="middle">One product may use all of them, one per data flow.</text>
</svg>