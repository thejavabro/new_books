<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One thousand lookups reach a Bloom filter in memory. The filter answers definitely not for 891 missing keys, so no disk read happens. It answers possibly for 109 lookups, which are the 100 real keys and 9 false positives, and those go to the disk. Every final answer is correct.">
  <defs>
    <filter id="bl5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bl5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bl5-k1"><rect x="40" y="290" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="bl5-k2"><rect x="380" y="290" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="bl5-k3"><rect x="740" y="140" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="bl5-k4"><rect x="740" y="440" width="460" height="90" rx="12"/></clipPath>
    <marker id="bl5-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="bl5-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="bl5-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A Bloom filter in front of the disk</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">1,000 lookups. 900 ask for keys that do not exist. False positive rate: 1 percent.</text>



  <g fill="none" stroke-width="2">
    <path d="M300,335 H380" stroke="#64748B" marker-end="url(#bl5-m-slate)"/>
    <path d="M640,315 H670 Q685,315 685,300 V200 Q685,185 700,185 H740" stroke="#059669" marker-end="url(#bl5-m-emerald)"/>
    <path d="M640,355 H670 Q685,355 685,370 V470 Q685,485 700,485 H740" stroke="#D97706" marker-end="url(#bl5-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#bl5-soft)">
    <rect x="40" y="290" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#bl5-k1)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">1,000 lookups</text>
  <text x="170" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">900 for missing keys</text>
  <g filter="url(#bl5-soft)">
    <rect x="380" y="290" width="260" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="380" y="290" width="6" height="90" fill="#7C3AED" clip-path="url(#bl5-k2)"/>
  </g>
  <circle cx="418" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(407.56,324.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="444" y="342" font-size="21.5" font-weight="600" fill="#111827">Bloom filter</text>
  <text x="510" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">in memory</text>
  <g filter="url(#bl5-lift)">
    <rect x="740" y="140" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="740" y="140" width="9" height="90" fill="#059669" clip-path="url(#bl5-k3)"/>
  </g>
  <circle cx="778" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="804" y="192" font-size="21.5" font-weight="600" fill="#111827">891: definitely not</text>
  <text x="970" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">answered in memory, no disk read</text>
  <g filter="url(#bl5-soft)">
    <rect x="740" y="440" width="460" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="740" y="440" width="6" height="90" fill="#D97706" clip-path="url(#bl5-k4)"/>
  </g>
  <circle cx="778" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,474.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="804" y="492" font-size="21.5" font-weight="600" fill="#111827">109: possibly, read the disk</text>
  <text x="970" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">100 real keys + 9 false positives</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Work saved</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">109 disk reads instead of 1,000</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Still correct</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">the disk finds nothing for the 9 false positives, so no answer is wrong</text>
</svg>