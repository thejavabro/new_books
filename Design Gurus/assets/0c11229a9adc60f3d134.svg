<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Range sharding routes by value interval, directory sharding routes by lookup table, and geo sharding routes by the user&#39;s region">
  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>
  <defs>
    <marker id="sh3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="sh3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Same record, three routing rules</text>

  
  <rect x="40" y="72" width="1160" height="216" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#1E40AF">Range sharding: the key falls in an interval</text>

  <g filter="url(#sh3-soft)">
    <rect x="80" y="150" width="250" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="205" y="182" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">user "Khan"</text>
  <text x="205" y="210" font-size="20" fill="#64748B" text-anchor="middle">sorted by last name</text>

  <path d="M205 150 L205 128 L793 128 L793 146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#sh3-slate)"/>

  <g filter="url(#sh3-soft)">
    <rect x="428" y="150" width="230" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="678" y="150" width="230" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="928" y="150" width="230" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="543" y="182" font-size="20" font-weight="600" fill="#64748B" text-anchor="middle">Shard 1</text>
  <text x="543" y="210" font-size="20" fill="#94A3B8" text-anchor="middle">A to I</text>
  <text x="793" y="182" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Shard 2</text>
  <text x="793" y="210" font-size="20" fill="#1E40AF" text-anchor="middle">J to S</text>
  <text x="1043" y="182" font-size="20" font-weight="600" fill="#64748B" text-anchor="middle">Shard 3</text>
  <text x="1043" y="210" font-size="20" fill="#94A3B8" text-anchor="middle">T to Z</text>
  <text x="620" y="264" font-size="20" fill="#475569" text-anchor="middle">Range scans stay on one shard. Skewed data makes one interval far bigger than the rest.</text>

  
  <rect x="40" y="316" width="1160" height="216" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="350" font-size="20" font-weight="600" fill="#5B21B6">Directory sharding: a lookup table says where</text>

  <g filter="url(#sh3-soft)">
    <rect x="80" y="394" width="250" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="205" y="426" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">tenant "Acme"</text>
  <text x="205" y="454" font-size="20" fill="#64748B" text-anchor="middle">a big customer</text>

  <line x1="334" y1="430" x2="424" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#sh3-slate)"/>

  <g filter="url(#sh3-soft)">
    <rect x="428" y="386" width="300" height="88" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="578" y="418" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Directory</text>
  <text x="578" y="448" font-size="20" fill="#5B21B6" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">Acme = Shard 3</text>

  <line x1="732" y1="430" x2="924" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#sh3-slate)"/>

  <g filter="url(#sh3-soft)">
    <rect x="928" y="394" width="230" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  </g>
  <text x="1043" y="426" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Shard 3</text>
  <text x="1043" y="454" font-size="20" fill="#5B21B6" text-anchor="middle">Acme only</text>
  <text x="620" y="508" font-size="20" fill="#475569" text-anchor="middle">Any placement rule you like, changed by editing a row. The extra hop is on every request.</text>

  
  <rect x="40" y="560" width="1160" height="216" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="594" font-size="20" font-weight="600" fill="#065F46">Geo sharding: the user's region decides</text>

  <g filter="url(#sh3-soft)">
    <rect x="80" y="638" width="250" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="205" y="670" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">user in Berlin</text>
  <text x="205" y="698" font-size="20" fill="#64748B" text-anchor="middle">region = EU</text>

  <path d="M205 638 L205 616 L793 616 L793 634" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#sh3-slate)"/>

  <g filter="url(#sh3-soft)">
    <rect x="428" y="638" width="230" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="678" y="638" width="230" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
    <rect x="928" y="638" width="230" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="543" y="670" font-size="20" font-weight="600" fill="#64748B" text-anchor="middle">US shard</text>
  <text x="543" y="698" font-size="20" fill="#94A3B8" text-anchor="middle">Virginia</text>
  <text x="793" y="670" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">EU shard</text>
  <text x="793" y="698" font-size="20" fill="#065F46" text-anchor="middle">Frankfurt</text>
  <text x="1043" y="670" font-size="20" font-weight="600" fill="#64748B" text-anchor="middle">APAC shard</text>
  <text x="1043" y="698" font-size="20" fill="#94A3B8" text-anchor="middle">Singapore</text>
  <text x="620" y="752" font-size="20" fill="#475569" text-anchor="middle">Low latency and data residency come free. Regions are rarely the same size, so load is uneven.</text>
</svg>