<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="592" viewBox="0 0 1240 592" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A cold start pays for container start, runtime init and dependency init before any of your code runs, while a warm start skips all of it and runs only your handler">
  <rect x="0" y="0" width="1240" height="592" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same handler, called twice, and where the first call spends its time</text>

  
  <text x="60" y="172" font-size="20" font-weight="600" fill="#B91C1C">Cold start</text>
  <text x="60" y="198" font-size="20" fill="#64748B">first call</text>

  <rect x="220" y="150" width="240" height="60" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="340" y="186" font-size="20" fill="#B91C1C" text-anchor="middle">container start</text>

  <rect x="460" y="150" width="144" height="60" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="532" y="186" font-size="20" fill="#92400E" text-anchor="middle">runtime init</text>

  <rect x="604" y="150" width="456" height="60" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="832" y="186" font-size="20" fill="#5B21B6" text-anchor="middle">dependency init</text>

  <rect x="1060" y="150" width="60" height="60" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="1090" y="142" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">your code</text>

  <text x="340" y="236" font-size="20" fill="#64748B" text-anchor="middle">200 ms</text>
  <text x="532" y="236" font-size="20" fill="#64748B" text-anchor="middle">120 ms</text>
  <text x="832" y="236" font-size="20" fill="#64748B" text-anchor="middle">380 ms</text>
  <text x="1090" y="236" font-size="20" fill="#64748B" text-anchor="middle">50 ms</text>

  <text x="1140" y="186" font-size="20" font-weight="600" fill="#B91C1C">750 ms</text>

  
  <text x="60" y="352" font-size="20" font-weight="600" fill="#065F46">Warm start</text>
  <text x="60" y="378" font-size="20" fill="#64748B">next call</text>

  <rect x="220" y="330" width="60" height="60" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="250" y="322" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">your code</text>

  <rect x="280" y="330" width="840" height="60" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="700" y="366" font-size="20" fill="#94A3B8" text-anchor="middle">all of this was already done</text>

  <text x="250" y="416" font-size="20" fill="#64748B" text-anchor="middle">50 ms</text>

  <text x="1140" y="366" font-size="20" font-weight="600" fill="#065F46">50 ms</text>

  
  <rect x="50" y="470" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="506" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A cold start is not your code being slow. It is everything that must exist before your code runs.</text>
  <text x="620" y="536" font-size="20" fill="#334155" text-anchor="middle">Which is why trimming dependencies or keeping instances warm moves the number, and tuning the handler does not.</text>
</svg>