<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four step reasoning order for a failing dependency: detect when the timeout fires, respond with a retry if the failure is transient and the call is idempotent or open the circuit breaker if it is sustained, contain with a bounded pool per dependency plus queues, then degrade deliberately with a fallback, a partial page, or a clean error.">
  <defs>
    <marker id="m04-l01-failure-response-path-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l01-failure-response-path-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l01-failure-response-path-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m04-l01-failure-response-path-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  
  <rect x="60" y="112" width="1120" height="114" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="138" font-size="13.5" font-weight="600" fill="#334155">1. Detect</text>
  <text x="1160" y="138" text-anchor="end" font-size="12" fill="#64748B">a hard limit on how long the caller will wait</text>

  <rect x="60" y="242" width="1120" height="168" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="268" font-size="13.5" font-weight="600" fill="#334155">2. Respond</text>
  <text x="1160" y="268" text-anchor="end" font-size="12" fill="#64748B">the kind of failure decides which tool you reach for</text>

  <rect x="60" y="426" width="1120" height="118" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="452" font-size="13.5" font-weight="600" fill="#334155">3. Contain</text>
  <text x="1160" y="452" text-anchor="end" font-size="12" fill="#64748B">queues hold work for consumers that are down</text>

  <rect x="60" y="560" width="1120" height="118" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="586" font-size="13.5" font-weight="600" fill="#334155">4. Degrade</text>
  <text x="1160" y="586" text-anchor="end" font-size="12" fill="#64748B">a design that skips this step only makes the error page arrive faster</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,88 L620,147" stroke="#3B82F6" marker-end="url(#m04-l01-failure-response-path-bl)"/>
    <path d="M620,214 L620,277" stroke="#DC2626" marker-end="url(#m04-l01-failure-response-path-rd)"/>
    <path d="M494,338 L363,338" stroke="#059669" marker-end="url(#m04-l01-failure-response-path-em)"/>
    <path d="M746,338 L877,338" stroke="#DC2626" marker-end="url(#m04-l01-failure-response-path-rd)"/>
    <path d="M240,382 C240,422 517,400 517,463" stroke="#059669" marker-end="url(#m04-l01-failure-response-path-em)"/>
    <path d="M1000,382 C1000,422 723,400 723,463" stroke="#DC2626" marker-end="url(#m04-l01-failure-response-path-rd)"/>
    <path d="M620,532 L620,595" stroke="#059669" stroke-width="2.5" marker-end="url(#m04-l01-failure-response-path-em)"/>
  </g>

  
  <g font-size="12" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="636" y="108" fill="#1E40AF">no reply arrives</text>
    <text x="428" y="326" text-anchor="middle" fill="#065F46">Transient</text>
    <text x="812" y="326" text-anchor="middle" fill="#B91C1C">Sustained</text>
  </g>

  
  <g filter="url(#m04-l01-failure-response-path-soft)">
    <rect x="490" y="24" width="260" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Call to a dependency</text>
  <text x="620" y="72" text-anchor="middle" font-size="12" fill="#64748B">the caller is holding a thread</text>

  
  <g filter="url(#m04-l01-failure-response-path-soft)">
    <rect x="460" y="150" width="320" height="64" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">The timeout fires</text>
  <text x="620" y="198" text-anchor="middle" font-size="12" fill="#64748B">without a deadline, it is never detected</text>

  
  <g filter="url(#m04-l01-failure-response-path-soft)">
    <path d="M620,280 L746,338 L620,396 L494,338 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="620" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Transient or</text>
  <text x="620" y="353" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">sustained?</text>

  
  <g filter="url(#m04-l01-failure-response-path-soft)">
    <rect x="120" y="294" width="240" height="88" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="240" y="328" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0F172A">Retry, only if idempotent</text>
  <text x="240" y="350" text-anchor="middle" font-size="12" fill="#64748B">transient: the failure clears</text>
  <text x="240" y="367" text-anchor="middle" font-size="12" fill="#64748B">on its own in a moment</text>

  
  <g filter="url(#m04-l01-failure-response-path-soft)">
    <rect x="880" y="294" width="240" height="88" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1000" y="328" text-anchor="middle" font-size="14.5" font-weight="600" fill="#0F172A">Open the circuit breaker</text>
  <text x="1000" y="350" text-anchor="middle" font-size="12" fill="#64748B">sustained: stop calling for</text>
  <text x="1000" y="367" text-anchor="middle" font-size="12" fill="#64748B">a while and fail fast</text>

  
  <g filter="url(#m04-l01-failure-response-path-soft)">
    <rect x="430" y="464" width="380" height="68" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="620" y="496" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Bounded pool per dependency, queues</text>
  <text x="620" y="518" text-anchor="middle" font-size="12" fill="#64748B">one sick dependency cannot starve the rest</text>

  
  <g filter="url(#m04-l01-failure-response-path-soft)">
    <rect x="410" y="598" width="420" height="68" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="620" y="630" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Fallback, partial page, or clean error</text>
  <text x="620" y="652" text-anchor="middle" font-size="12" fill="#64748B">decide deliberately what the user sees</text>

  
  <g stroke-width="3">
    <line x1="60" y1="716" x2="88" y2="716" stroke="#3B82F6"/>
    <line x1="418" y1="716" x2="446" y2="716" stroke="#DC2626"/>
    <line x1="782" y1="716" x2="810" y2="716" stroke="#059669"/>
  </g>
  <text x="96" y="720" font-size="12.5" fill="#475569">Sync call: the caller waits, holding a thread</text>
  <text x="454" y="720" font-size="12.5" fill="#475569">Failure path: the timeout fires, stop calling</text>
  <text x="818" y="720" font-size="12.5" fill="#475569">Recovery path: a safe retry, a deliberate answer</text>
</svg>