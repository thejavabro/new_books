<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="724" viewBox="0 0 1240 724" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="lines-title lines-desc">
<title id="lines-title">The five lines in almost every bill</title>
<desc id="lines-desc">Compute, storage, data transfer, per-request charges and the managed-service premium, plus the sixth line that never appears on an invoice and usually dominates it at small scale.</desc>
<defs>
<marker id="lines-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="lines-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="lines-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="lines-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="724" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The five lines in almost every bill</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Cloud pricing looks complicated because there are thousands of line items.</text>
<rect x="40" y="646" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="646" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="270" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="175" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Compute</text>
<rect x="326" y="118" width="540" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="346" y="151" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">instances, containers or functions, charged by time</text>
<rect x="882" y="118" width="318" height="54" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1041" y="152" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">everybody estimates this</text>
<rect x="40" y="182" width="270" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="175" y="215" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Storage</text>
<rect x="326" y="182" width="540" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="346" y="215" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">per GB per month, times every copy that exists</text>
<rect x="882" y="182" width="318" height="54" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1041" y="216" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">the multiplier is forgotten</text>
<rect x="40" y="246" width="270" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="175" y="279" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Data transfer</text>
<rect x="326" y="246" width="540" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="346" y="279" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">per GB moved, at four different rates</text>
<rect x="882" y="246" width="318" height="54" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1041" y="280" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">nobody estimates this</text>
<rect x="40" y="310" width="270" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="175" y="343" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Per-request charges</text>
<rect x="326" y="310" width="540" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="346" y="343" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">billed by operation rather than by hour</text>
<rect x="882" y="310" width="318" height="54" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1041" y="344" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">harmless until it is not</text>
<rect x="40" y="374" width="270" height="54" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="175" y="407" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Managed premium</text>
<rect x="326" y="374" width="540" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="346" y="407" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what you pay to not operate it yourself</text>
<rect x="882" y="374" width="318" height="54" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1041" y="408" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">usually worth it</text>
<rect x="40" y="452" width="1160" height="80" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="452" width="5" height="80" rx="2.5" fill="#F28B9D"/><text x="64" y="485" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The sixth line never appears on the invoice: engineer time</text><text x="64" y="511" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A design that saves $400 a month and costs a day a month to operate is losing money.</text>
<rect x="40" y="556" width="560" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="580.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Inbound transfer is generally free.</text><text x="320" y="607.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Outbound is charged.</text>
<rect x="640" y="556" width="560" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="580.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Internet egress tiers downward,</text><text x="920" y="607.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">so the rate falls as volume rises.</text>
<text x="66" y="680" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The asymmetry is why a service that returns data costs differently from one that receives it.</text>
</svg>