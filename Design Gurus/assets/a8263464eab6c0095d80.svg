<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Flowchart: a call to Payments stops responding. With no timeout the caller waits forever holding a thread and a connection until threads run out and the outage spreads to the caller. With a timeout the call is marked failed at the deadline, which lets a retry, a circuit breaker count, and a fallback response run.">
  <defs>
    <marker id="m04-l02-timeout-or-not-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m04-l02-timeout-or-not-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l02-timeout-or-not-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m04-l02-timeout-or-not-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>

  
  <rect x="550" y="50" width="650" height="170" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="570" y="76" font-size="13.5" font-weight="600" fill="#B91C1C">No timeout set: the wait is unbounded</text>
  <text x="1180" y="76" text-anchor="end" font-size="12" fill="#64748B">nothing detects the failure, so nothing reacts</text>

  <rect x="550" y="252" width="650" height="302" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="570" y="278" font-size="13.5" font-weight="600" fill="#065F46">Timeout set: the failure is detected</text>
  <text x="1180" y="278" text-anchor="end" font-size="12" fill="#64748B">detection is what lets the rest of the toolkit run</text>

  
  <g fill="none">
    <path d="M266,302 L310,302" stroke="#475569" stroke-width="2" marker-end="url(#m04-l02-timeout-or-not-sl)"/>
    <path d="M474,275 C518,275 532,143 568,143" stroke="#DC2626" stroke-width="2.5" marker-end="url(#m04-l02-timeout-or-not-rd)"/>
    <path d="M854,143 L914,143" stroke="#DC2626" stroke-width="2" marker-end="url(#m04-l02-timeout-or-not-rd)"/>
    <path d="M474,329 C518,329 532,414 568,414" stroke="#059669" stroke-width="2.5" marker-end="url(#m04-l02-timeout-or-not-em)"/>
    <path d="M828,414 C860,414 872,328 902,328" stroke="#059669" stroke-width="2" marker-end="url(#m04-l02-timeout-or-not-em)"/>
    <path d="M828,414 L902,414" stroke="#059669" stroke-width="2" marker-end="url(#m04-l02-timeout-or-not-em)"/>
    <path d="M828,414 C860,414 872,500 902,500" stroke="#059669" stroke-width="2" marker-end="url(#m04-l02-timeout-or-not-em)"/>
  </g>

  
  <g font-size="12" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="524" y="202" fill="#B91C1C">No</text>
    <text x="527" y="364" fill="#065F46">Yes</text>
  </g>

  
  <g filter="url(#m04-l02-timeout-or-not-soft)">
    <rect x="40" y="258" width="222" height="88" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="151" y="288" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Call to Payments</text>
  <text x="151" y="309" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">stops responding</text>
  <text x="151" y="330" text-anchor="middle" font-size="12" fill="#64748B">a synchronous call in flight</text>

  
  <g filter="url(#m04-l02-timeout-or-not-soft)">
    <path d="M418,242 L520,302 L418,362 L316,302 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="418" y="308" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Is a timeout set?</text>
  <text x="414" y="396" text-anchor="middle" font-size="12" fill="#64748B">Library defaults are not a plan:</text>
  <text x="414" y="413" text-anchor="middle" font-size="12" fill="#64748B">many ship with none, or 75 seconds</text>

  
  <g filter="url(#m04-l02-timeout-or-not-soft)">
    <rect x="574" y="100" width="276" height="86" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="712" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Caller waits forever,</text>
  <text x="712" y="149" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">thread and connection held</text>
  <text x="712" y="170" text-anchor="middle" font-size="12" fill="#64748B">nothing comes back, nothing is released</text>

  <g filter="url(#m04-l02-timeout-or-not-soft)">
    <rect x="920" y="100" width="260" height="86" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1050" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Threads run out, the outage</text>
  <text x="1050" y="149" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">spreads to the caller</text>
  <text x="1050" y="170" text-anchor="middle" font-size="12" fill="#64748B">cascading failure</text>

  
  <g filter="url(#m04-l02-timeout-or-not-soft)">
    <rect x="574" y="366" width="250" height="96" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="699" y="400" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Call marked failed</text>
  <text x="699" y="421" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">at the deadline</text>
  <text x="699" y="443" text-anchor="middle" font-size="12" fill="#64748B">the detection step</text>

  <g filter="url(#m04-l02-timeout-or-not-soft)">
    <rect x="906" y="296" width="274" height="64" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1043" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Retry</text>
  <text x="1043" y="344" text-anchor="middle" font-size="12" fill="#64748B">only when the call is idempotent</text>

  <g filter="url(#m04-l02-timeout-or-not-soft)">
    <rect x="906" y="382" width="274" height="64" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1043" y="407" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Circuit breaker counts</text>
  <text x="1043" y="428" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">the failure</text>

  <g filter="url(#m04-l02-timeout-or-not-soft)">
    <rect x="906" y="468" width="274" height="64" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1043" y="505" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Fallback response</text>

  
  <g stroke-width="3">
    <line x1="40" y1="596" x2="68" y2="596" stroke="#DC2626"/>
    <line x1="520" y1="596" x2="548" y2="596" stroke="#059669"/>
  </g>
  <text x="76" y="600" font-size="12.5" fill="#475569">No timeout: unbounded wait, threads gone, the outage spreads</text>
  <text x="556" y="600" font-size="12.5" fill="#475569">Timeout set: detection fires, so retries, breakers, and fallbacks can run</text>
</svg>