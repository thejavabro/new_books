<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="extract-title extract-desc">
<title id="extract-title">How a module becomes a service</title>
<desc id="extract-desc">With a real boundary, extraction is four mechanical steps and the callers never change. Without one, the first step is discovering where the boundary should have been, under the pressure of already needing the split.</desc>
<defs>
<marker id="extract-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="extract-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="extract-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="extract-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="702" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">How a module becomes a service</text>
<text x="40" y="86" font-size="21" fill="#4A5568">If the boundary was real, the extraction is mechanical.</text>
<rect x="40" y="624" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="624" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<circle cx="60" cy="144" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="151" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="118" width="1108" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="646" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the interface already exists and is already the only way in</text>
<circle cx="60" cy="206" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="213" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="180" width="1108" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="646" y="212" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">replace the in-process implementation with a client that makes a network call</text>
<circle cx="60" cy="268" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="275" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="242" width="1108" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="646" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">move the module's own tables into their own database</text>
<circle cx="60" cy="330" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="337" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="304" width="1108" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="646" y="336" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deploy, point the client at it, delete the in-process implementation</text>
<text x="646" y="390" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Callers do not change, because they were only ever using the interface</text>
<rect x="40" y="412" width="1160" height="86" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="412" width="5" height="86" rx="2.5" fill="#F28B9D"/><text x="64" y="448" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Without the boundary, step one is a multi-month investigation</text><text x="64" y="474" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">to find out what the boundary even is, performed under pressure.</text>
<rect x="40" y="518" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="518" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="551" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The hard part of extracting a service was never the network.</text><text x="64" y="577" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It was the boundary, and this is the decision to do that work early, when it is cheap.</text>
<text x="66" y="658" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">What you are buying is an option, and the discipline pays for itself whether or not you use it.</text>
</svg>