<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The characters and their counts">
<defs>
<filter id="rs-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="590" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Rearrange "aappp" so no two equal characters sit next to each other</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">"a" appears 2 times, "p" appears 3 times</text>
<rect x="40" y="106" width="1160" height="332" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Every character in the heap, most frequent on top</text>
<text x="464" y="202" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<rect x="486" y="166" width="124" height="56" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="548" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"p"</text>
<text x="548" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">3 left</text>
<rect x="630" y="166" width="124" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="692" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"a"</text>
<text x="692" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">2 left</text>
<text x="464" y="304" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">held back</text>
<text x="492" y="303" font-size="18" fill="#475569">nothing held back</text>
<text x="364" y="406" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">result</text>
<rect x="386" y="370" width="84" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="428" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="482" y="370" width="84" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="524" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="578" y="370" width="84" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="674" y="370" width="84" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="716" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="770" y="370" width="84" height="56" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="812" y="405.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="40" y="460" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="500" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Always write the most frequent character left, then hold it back for one turn</text>
<text x="620" y="532" text-anchor="middle" font-size="18.5" fill="#475569">Holding it back is what stops it being chosen twice in a row</text>
</svg>