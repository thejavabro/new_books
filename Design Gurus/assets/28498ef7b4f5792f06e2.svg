<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Deploying only the new user tower causes version skew and wrong candidates, while the safe upgrade re-embeds, rebuilds, tests and promotes the pair together">
