  <g transform="translate(677.56,444.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="650" y="398" font-size="15.5" font-weight="600" fill="#6B7280">Step 3</text>
  <text x="714" y="462" font-size="18.5" font-weight="600" fill="#111827">Test the pair</text>
  <text x="745" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">recall on recent logs</text>
