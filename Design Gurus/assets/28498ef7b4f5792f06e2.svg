  <text x="377" y="398" font-size="15.5" font-weight="600" fill="#6B7280">Step 2</text>
  <text x="441" y="462" font-size="18.5" font-weight="600" fill="#111827">Rebuild the index</text>
  <text x="493" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">next to the old index</text>
