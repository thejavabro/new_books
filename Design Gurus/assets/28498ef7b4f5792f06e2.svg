  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M757,181 H936" marker-end="url(#emb2t3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M336,455 H377" marker-end="url(#emb2t3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M609,455 H650" marker-end="url(#emb2t3-mslate)"/></g>
