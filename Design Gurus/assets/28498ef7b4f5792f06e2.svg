  <g transform="translate(908.56,444.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="881" y="398" font-size="15.5" font-weight="600" fill="#6B7280">Step 4</text>
  <text x="945" y="462" font-size="18.5" font-weight="600" fill="#111827">Promote both atomically</text>
  <text x="1027.5" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">keep the old pair for rollback</text>
