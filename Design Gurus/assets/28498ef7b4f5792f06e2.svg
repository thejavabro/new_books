      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="emb2t3-k1"><rect x="66" y="136" width="258" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t3-k2"><rect x="503" y="136" width="254" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t3-k3"><rect x="936" y="136" width="238" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t3-k4"><rect x="66" y="410" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t3-k5"><rect x="377" y="410" width="232" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t3-k6"><rect x="650" y="410" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t3-k7"><rect x="881" y="410" width="293" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="716" fill="#FFFFFF"/>
