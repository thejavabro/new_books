<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="834" viewBox="0 0 1240 834" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="triggers-title triggers-desc">
<title id="triggers-title">Triggers, not dates</title>
<desc id="triggers-desc">The brief asks for a plan as well as a system, and a plan made of measurable triggers removes the growth decisions from the moment when everybody is busy.</desc>
<defs>
<marker id="triggers-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="triggers-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="triggers-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="triggers-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="834" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Triggers, not dates</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The brief asks for a plan as well as a system.</text>
<rect x="40" y="756" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="756" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="68" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="68" rx="2.5" fill="#5EC9EC"/><text x="64" y="158" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">A plan is not a roadmap of features. It is a set of triggers and the response to each</text>
<text x="40" y="222" font-size="19" font-weight="700" fill="#8795A5" text-anchor="start">trigger</text>
<text x="610" y="222" font-size="19" font-weight="700" fill="#8795A5" text-anchor="start">response</text>
<rect x="40" y="240" width="520" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="300" y="272" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads are the bottleneck</text>
<path d="M566 266H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 266H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="240" width="590" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="272" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">add a cache on the hottest path</text>
<rect x="40" y="300" width="520" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="300" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one workload dominates the database</text>
<path d="M566 326H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 326H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="300" width="590" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="332" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">move that workload to its own store</text>
<rect x="40" y="360" width="520" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="300" y="392" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a team forms around one area</text>
<path d="M566 386H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 386H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="360" width="590" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="392" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">extract that area as a service</text>
<rect x="40" y="420" width="520" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="300" y="452" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a single customer needs isolation</text>
<path d="M566 446H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 446H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="420" width="590" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="452" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">give that tenant their own database</text>
<rect x="40" y="480" width="520" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="300" y="512" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a region requirement appears in a contract</text>
<path d="M566 506H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 506H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="480" width="590" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="512" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">read-local, then a promotable standby</text>
<rect x="40" y="540" width="520" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="300" y="572" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the background queue starves one tenant</text>
<path d="M566 566H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 566H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#triggers-marker-slate)"/>
<rect x="610" y="540" width="590" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="572" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">partition the queue by tenant</text>
<rect x="40" y="624" width="1160" height="106" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="624" width="5" height="106" rx="2.5" fill="#39D5AA"/><text x="64" y="670" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The value is not the responses, which are mostly obvious</text><text x="64" y="696" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">It is that the triggers are written down before the pressure arrives.</text>
<text x="66" y="790" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">So the decision is taken calmly rather than during an incident or a sales call.</text>
</svg>