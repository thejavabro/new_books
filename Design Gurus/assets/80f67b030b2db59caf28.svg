<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="996" viewBox="0 0 1240 996" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The sender combines the timestamp, a dot and the raw request body with the shared secret to produce a version one signature carried in the Webhook-Signature header. The receiver works through four steps in order: timestamp window, computed signature, constant time comparison, and event id deduplication with a durable enqueue in one step. The 204 answer is returned right after the enqueue, before any business processing.">
  <defs>
    <marker id="pl-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="pl-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="pl-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="pl-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pl-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pl-k1"><rect x="80" y="100" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pl-k2"><rect x="510" y="100" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="pl-k3"><rect x="830" y="100" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="pl-k4"><rect x="310" y="340" width="620" height="48" rx="10"/></clipPath>
    <clipPath id="pl-k5"><rect x="310" y="424" width="620" height="48" rx="10"/></clipPath>
    <clipPath id="pl-k6"><rect x="310" y="508" width="620" height="48" rx="10"/></clipPath>
    <clipPath id="pl-k7"><rect x="310" y="592" width="620" height="48" rx="10"/></clipPath>
    <clipPath id="pl-k9"><rect x="450" y="674" width="340" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="996" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Sender, signing one delivery</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">the signature travels in one header</text>

  
  <rect x="40" y="280" width="1160" height="546" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="310" font-size="16.5" font-weight="600" fill="#475569">Receiver, verifying one delivery, four steps in order</text>
  <text x="1176" y="310" text-anchor="end" font-size="15.5" fill="#6B7280">each step before the next</text>

  
  <g fill="none" stroke-width="2">
    <path d="M420,145 H510" stroke="#2563EB" marker-end="url(#pl-bl)"/>
    <path d="M740,145 H830" stroke="#2563EB" marker-end="url(#pl-bl)"/>
    <path d="M620,388 V424" stroke="#64748B" marker-end="url(#pl-sl)"/>
    <path d="M620,472 V508" stroke="#64748B" marker-end="url(#pl-sl)"/>
    <path d="M620,556 V592" stroke="#64748B" marker-end="url(#pl-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,640 V674" stroke="#059669" marker-end="url(#pl-em)"/>
  </g>

  
  <g filter="url(#pl-soft)">
    <rect x="80" y="100" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#pl-k1)"/>
  </g>
  <circle cx="118" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="144" y="152" font-size="18.5" font-weight="600" fill="#111827">timestamp + "." + raw body</text>
  <text x="250" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">with the shared secret</text>

  
  <g filter="url(#pl-soft)">
    <rect x="510" y="100" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="510" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#pl-k2)"/>
  </g>
  <circle cx="548" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(537.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="574" y="152" font-size="18.5" font-weight="600" fill="#111827">HMAC-SHA-256</text>

  
  <g filter="url(#pl-soft)">
    <rect x="830" y="100" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="830" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#pl-k3)"/>
  </g>
  <circle cx="868" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="894" y="152" font-size="18.5" font-weight="600" fill="#111827">Webhook-Signature: v1=...</text>
  <text x="995" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">A new signature on every attempt.</text>

  
  <g filter="url(#pl-soft)">
    <rect x="310" y="340" width="620" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="310" y="340" width="6" height="48" fill="#DB2777" clip-path="url(#pl-k4)"/>
  </g>
  <circle cx="344" cy="364" r="15" fill="#FFFFFF"/>
  <text x="344" y="370" font-size="15.5" font-weight="700" text-anchor="middle" fill="#DB2777">1</text>
  <text x="368" y="371" font-size="18.5" font-weight="600" fill="#111827">Timestamp inside the replay window</text>

  
  <g filter="url(#pl-soft)">
    <rect x="310" y="424" width="620" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="310" y="424" width="6" height="48" fill="#4F46E5" clip-path="url(#pl-k5)"/>
  </g>
  <circle cx="344" cy="448" r="15" fill="#FFFFFF"/>
  <text x="344" y="454" font-size="15.5" font-weight="700" text-anchor="middle" fill="#4F46E5">2</text>
  <text x="368" y="455" font-size="18.5" font-weight="600" fill="#111827">Compute the expected signature</text>

  
  <g filter="url(#pl-soft)">
    <rect x="310" y="508" width="620" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="310" y="508" width="6" height="48" fill="#4F46E5" clip-path="url(#pl-k6)"/>
  </g>
  <circle cx="344" cy="532" r="15" fill="#FFFFFF"/>
  <text x="344" y="538" font-size="15.5" font-weight="700" text-anchor="middle" fill="#4F46E5">3</text>
  <text x="368" y="539" font-size="18.5" font-weight="600" fill="#111827">Compare in constant time</text>

  
  <g filter="url(#pl-soft)">
    <rect x="310" y="592" width="620" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="310" y="592" width="6" height="48" fill="#D97706" clip-path="url(#pl-k7)"/>
  </g>
  <circle cx="344" cy="616" r="15" fill="#FFFFFF"/>
  <text x="344" y="622" font-size="15.5" font-weight="700" text-anchor="middle" fill="#D97706">4</text>
  <text x="368" y="623" font-size="18.5" font-weight="600" fill="#111827">Deduplicate by event id and enqueue in one step</text>

  
  <g filter="url(#pl-lift)">
    <rect x="450" y="674" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="450" y="674" width="9" height="90" fill="#059669" clip-path="url(#pl-k9)"/>
  </g>
  <circle cx="488" cy="719" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,708.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="514" y="726" font-size="18.5" font-weight="600" fill="#111827">Answer 204 No Content</text>
  <text x="620" y="789" font-size="15.5" text-anchor="middle" fill="#6B7280">returned right after the enqueue, before any business processing</text>

  
  <rect x="40" y="856" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="898" text-anchor="middle" font-size="16" fill="#475569">Parse the body only after step 3. Reserializing JSON first can change the bytes the signature covered.</text>
  <text x="620" y="926" text-anchor="middle" font-size="16" fill="#475569">Business processing happens after the answer.</text>
</svg>