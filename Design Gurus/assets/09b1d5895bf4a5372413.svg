<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="970" viewBox="0 0 1240 970" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Failover sequence: writes and heartbeats flow normally, the leader crashes, heartbeats stop, the followers elect Follower A as the new leader, and clients switch their writes to it">
  <rect x="0" y="0" width="1240" height="970" fill="#FFFFFF"/>
  <defs>
    <marker id="lf2-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lf2-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="lf2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="150" y1="112" x2="150" y2="877" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="500" y1="112" x2="500" y2="310" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="820" y1="112" x2="820" y2="877" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1090" y1="112" x2="1090" y2="877" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="158" y1="180" x2="492" y2="180" stroke="#3B82F6" stroke-width="2" marker-end="url(#lf2-blue)"/>
  <text x="325" y="156" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. Writes go to the leader</text>

  <line x1="508" y1="230" x2="812" y2="230" stroke="#3B82F6" stroke-width="2" marker-end="url(#lf2-blue)"/>
  <line x1="508" y1="257" x2="1082" y2="257" stroke="#3B82F6" stroke-width="2" marker-end="url(#lf2-blue)"/>
  <text x="795" y="206" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. The leader sends regular heartbeats to the followers</text>

  
  <line x1="480" y1="310" x2="520" y2="350" stroke="#DC2626" stroke-width="3.5"/>
  <line x1="520" y1="310" x2="480" y2="350" stroke="#DC2626" stroke-width="3.5"/>
  <g filter="url(#lf2-soft)">
    <rect x="360" y="370" width="280" height="52" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="500" y="403" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">3. The leader crashes</text>

  
  <rect x="680" y="462" width="520" height="116" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="940" y="493" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">4. The heartbeats stop arriving.</text>
  <text x="940" y="520" font-size="20" fill="#92400E" text-anchor="middle">After a timeout, the followers</text>
  <text x="940" y="547" font-size="20" fill="#92400E" text-anchor="middle">decide the leader is down.</text>

  
  <line x1="828" y1="650" x2="1082" y2="650" stroke="#D97706" stroke-width="2" marker-end="url(#lf2-amber)"/>
  <line x1="1082" y1="677" x2="828" y2="677" stroke="#D97706" stroke-width="2" marker-end="url(#lf2-amber)"/>
  <text x="945" y="626" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. The followers vote and elect a new leader</text>

  
  <g filter="url(#lf2-soft)">
    <rect x="680" y="717" width="280" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="820" y="748" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">6. Follower A becomes</text>
  <text x="820" y="775" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">the new leader</text>

  
  <line x1="158" y1="857" x2="812" y2="857" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#lf2-blue)"/>
  <text x="485" y="833" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">7. Clients send their writes to the new leader</text>

  
  <g filter="url(#lf2-soft)">
    <rect x="30" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="380" y="40" width="240" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="710" y="40" width="220" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="980" y="40" width="220" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="98" font-size="20" fill="#64748B" text-anchor="middle">sends writes</text>
  <text x="500" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Leader</text>
  <text x="500" y="98" font-size="20" fill="#1E40AF" text-anchor="middle">the server in charge</text>
  <text x="820" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Follower A</text>
  <text x="820" y="98" font-size="20" fill="#64748B" text-anchor="middle">standby copy</text>
  <text x="1090" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Follower B</text>
  <text x="1090" y="98" font-size="20" fill="#64748B" text-anchor="middle">standby copy</text>

  
  <line x1="60" y1="920" x2="88" y2="920" stroke="#3B82F6" stroke-width="3"/>
  <text x="98" y="927" font-size="20" fill="#475569">writes and heartbeats</text>
  <line x1="364" y1="920" x2="392" y2="920" stroke="#D97706" stroke-width="3"/>
  <text x="402" y="927" font-size="20" fill="#475569">leader election</text>
</svg>