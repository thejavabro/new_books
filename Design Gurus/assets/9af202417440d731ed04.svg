<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1256" viewBox="0 0 1240 1256" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Why the visited optimization in the circular array cycle question needs a direction guard, shown on the array two, two, minus three, minus one">
<defs>
<filter id="ca2-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="1256" fill="#FFFFFF"/>
<text x="76" y="78" font-size="26" font-weight="600" fill="#111827">Why the visited shortcut needs a direction guard</text>
<text x="76" y="108" font-size="16" fill="#475569">arr = [2, 2, -3, -1]. This array does contain a cycle, so the answer is true. Skipping start points carelessly hides it.</text>
<rect x="40" y="136" width="1160" height="214" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="64" y="166" font-size="16.5" font-weight="600" fill="#1D4ED8">Step 1. Start at index 0. arr[0] is positive, so this walk goes forward</text>
<g filter="url(#ca2-soft)"><rect x="76" y="228" width="92" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.2"/></g>
<text x="122" y="268" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">2</text>
<text x="122" y="313" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<text x="122" y="216" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">start</text>
<g filter="url(#ca2-soft)"><rect x="182" y="228" width="92" height="64" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="228" y="268" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">2</text>
<text x="228" y="313" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<g filter="url(#ca2-soft)"><rect x="288" y="228" width="92" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2.2"/></g>
<text x="334" y="268" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">-3</text>
<text x="334" y="313" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<text x="334" y="216" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">arrives here</text>
<g filter="url(#ca2-soft)"><rect x="394" y="228" width="92" height="64" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="440" y="268" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">-1</text>
<text x="440" y="313" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<text x="542" y="204" font-size="16" fill="#475569">The walk moves 0 to 2, because (0 + 2) mod 4 = 2.</text>
<text x="542" y="230" font-size="16" fill="#475569">At index 2 the value is -3, which points backward.</text>
<rect x="542" y="248" width="634" height="34" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="556" y="271" font-size="15.5" font-weight="600" fill="#1D4ED8">The forward walk stops at index 2. No cycle found from index 0.</text>
<rect x="40" y="372" width="1160" height="214" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="64" y="402" font-size="16.5" font-weight="600" fill="#BE185D">Step 2. The bug. The old markVisited marked every index the walk touched</text>
<g filter="url(#ca2-soft)"><rect x="76" y="464" width="92" height="64" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.2"/></g>
<text x="122" y="504" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">2</text>
<text x="122" y="549" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<text x="122" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">visited</text>
<g filter="url(#ca2-soft)"><rect x="182" y="464" width="92" height="64" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="228" y="504" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">2</text>
<text x="228" y="549" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<g filter="url(#ca2-soft)"><rect x="288" y="464" width="92" height="64" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.2"/></g>
<text x="334" y="504" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">-3</text>
<text x="334" y="549" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<text x="334" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">visited</text>
<g filter="url(#ca2-soft)"><rect x="394" y="464" width="92" height="64" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="440" y="504" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">-1</text>
<text x="440" y="549" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<text x="542" y="440" font-size="16" fill="#475569">Index 0 was walked from, so marking it is fair.</text>
<text x="542" y="466" font-size="16" fill="#475569">Index 2 was only ever arrived at. It was never walked from.</text>
<rect x="542" y="484" width="634" height="34" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="556" y="507" font-size="15.5" font-weight="600" fill="#BE185D">Index 2 is now skipped as a start point for the rest of the run.</text>
<rect x="40" y="608" width="1160" height="214" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="64" y="638" font-size="16.5" font-weight="600" fill="#047857">Step 3. But index 2 is exactly where the real cycle begins, going backward</text>
<g filter="url(#ca2-soft)"><rect x="76" y="700" width="92" height="64" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="122" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">2</text>
<text x="122" y="785" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<g filter="url(#ca2-soft)"><rect x="182" y="700" width="92" height="64" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="228" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">2</text>
<text x="228" y="785" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<g filter="url(#ca2-soft)"><rect x="288" y="700" width="92" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2.2"/></g>
<text x="334" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">-3</text>
<text x="334" y="785" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<text x="334" y="688" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">start</text>
<g filter="url(#ca2-soft)"><rect x="394" y="700" width="92" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2.2"/></g>
<text x="440" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">-1</text>
<text x="440" y="785" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<text x="440" y="688" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">then here</text>
<text x="542" y="676" font-size="16" fill="#475569">arr[2] is -3, so from index 2 the walk goes backward to index 3.</text>
<text x="542" y="702" font-size="16" fill="#475569">arr[3] is -1, so from index 3 it goes back to index 2.</text>
<rect x="542" y="720" width="634" height="34" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="556" y="743" font-size="15.5" font-weight="600" fill="#047857">2 to 3 to 2 is a two element cycle, all backward. The answer is true.</text>
<rect x="40" y="844" width="1160" height="214" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="64" y="874" font-size="16.5" font-weight="600" fill="#5B21B6">Step 4. The fix. Mark only an index you can actually leave in this direction</text>
<g filter="url(#ca2-soft)"><rect x="76" y="936" width="92" height="64" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.2"/></g>
<text x="122" y="976" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">2</text>
<text x="122" y="1021" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<text x="122" y="924" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">visited</text>
<g filter="url(#ca2-soft)"><rect x="182" y="936" width="92" height="64" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="228" y="976" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">2</text>
<text x="228" y="1021" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<g filter="url(#ca2-soft)"><rect x="288" y="936" width="92" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2.2"/></g>
<text x="334" y="976" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">-3</text>
<text x="334" y="1021" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<text x="334" y="924" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">still free</text>
<g filter="url(#ca2-soft)"><rect x="394" y="936" width="92" height="64" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="440" y="976" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">-1</text>
<text x="440" y="1021" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<text x="542" y="912" font-size="16" fill="#475569">The forward walk from index 0 now marks index 0 and stops.</text>
<text x="542" y="938" font-size="16" fill="#475569">Index 2 stays unmarked, because it cannot be left going forward.</text>
<rect x="542" y="956" width="634" height="34" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="556" y="979" font-size="15.5" font-weight="600" fill="#047857">The outer loop reaches index 2, tries it backward, and finds the cycle.</text>
<rect x="40" y="1080" width="1160" height="132" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="1112" font-size="16.5" font-weight="600" fill="#475569">The rule to remember</text>
<text x="64" y="1146" font-size="18.5" font-weight="600" fill="#111827">An index you arrived at is not an index you have finished with.</text>
<text x="64" y="1178" font-size="16" fill="#475569">Every index can be left in one direction only, the sign of its own value. Skipping a start point is safe only when the earlier walk went that same way.</text>
</svg>