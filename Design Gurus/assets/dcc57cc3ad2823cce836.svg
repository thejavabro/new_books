  <circle cx="693" cy="593" r="18" fill="#FFFFFF"/>
  <g transform="translate(682.56,582.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="719" y="600" font-size="18.5" font-weight="600" fill="#111827">An arbitrary callback URL per call</text>
  <text x="620" y="664" text-anchor="middle" font-size="15.5" fill="#6B7280">Partner setup first</text>
  <text x="620" y="690" text-anchor="middle" font-size="15.5" fill="#94A3B8">registration makes validation and rotation observable</text>

  
  <rect x="40" y="726" width="1160" height="184" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#64748B" stroke-width="2">
