  <circle cx="163" cy="393" r="18" fill="#FFFFFF"/>
  <g transform="translate(152.56,382.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="189" y="400" font-size="18.5" font-weight="600" fill="#111827">Push carries an id and a type</text>
  <g filter="url(#pu-soft)">
    <rect x="655" y="348" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="655" y="348" width="6" height="90" fill="#DB2777" clip-path="url(#pu-k4)"/>
  </g>
  <circle cx="693" cy="393" r="18" fill="#FFFFFF"/>
