  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="600" y="978" fill="#475569">instead of</text>
  </g>
  <g filter="url(#pu-soft)">
    <rect x="125" y="948" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="125" y="948" width="6" height="90" fill="#059669" clip-path="url(#pu-k9)"/>
  </g>
  <circle cx="163" cy="993" r="18" fill="#FFFFFF"/>
  <g transform="translate(152.56,982.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="189" y="1000" font-size="18.5" font-weight="600" fill="#111827">One read state per user</text>
  <g filter="url(#pu-soft)">
    <rect x="655" y="948" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="655" y="948" width="6" height="90" fill="#DB2777" clip-path="url(#pu-k10)"/>
  </g>
  <circle cx="693" cy="993" r="18" fill="#FFFFFF"/>
  <g transform="translate(682.56,982.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="719" y="1000" font-size="18.5" font-weight="600" fill="#111827">One unread state per device</text>
  <text x="620" y="1064" text-anchor="middle" font-size="15.5" fill="#6B7280">No "read on phone, unread on laptop"</text>
  <text x="620" y="1090" text-anchor="middle" font-size="15.5" fill="#94A3B8">users expect the badge to agree</text>

  
  <rect x="40" y="1126" width="1160" height="184" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#64748B" stroke-width="2">
