<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1846" viewBox="0 0 1240 1846" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven trade-offs of the notification API, each with what was chosen, what was rejected, and the cost accepted: SSE over WebSockets, push as a hint, registered webhooks, at-least-once delivery, one read state per user, cursor over offset, and the unread count in the list envelope.">
