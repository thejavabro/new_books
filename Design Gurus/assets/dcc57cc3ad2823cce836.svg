  </g>
  <circle cx="163" cy="793" r="18" fill="#FFFFFF"/>
  <g transform="translate(152.56,782.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="189" y="800" font-size="18.5" font-weight="600" fill="#111827">At-least-once delivery</text>
  <g filter="url(#pu-soft)">
    <rect x="655" y="748" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="655" y="748" width="6" height="90" fill="#DB2777" clip-path="url(#pu-k8)"/>
  </g>
  <circle cx="693" cy="793" r="18" fill="#FFFFFF"/>
  <g transform="translate(682.56,782.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="719" y="800" font-size="18.5" font-weight="600" fill="#111827">Exactly-once delivery</text>
  <text x="620" y="864" text-anchor="middle" font-size="15.5" fill="#6B7280">Every receiver deduplicates</text>
  <text x="620" y="890" text-anchor="middle" font-size="15.5" fill="#94A3B8">duplicates require explicit safe handling</text>

  
  <rect x="40" y="926" width="1160" height="184" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#64748B" stroke-width="2">
