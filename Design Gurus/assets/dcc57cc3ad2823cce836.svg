    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="719" y="400" font-size="18.5" font-weight="600" fill="#111827">Push as the authoritative record</text>
  <text x="620" y="464" text-anchor="middle" font-size="15.5" fill="#6B7280">One read when the app opens</text>
  <text x="620" y="490" text-anchor="middle" font-size="15.5" fill="#94A3B8">platforms delay, collapse, and repeat</text>

  
  <rect x="40" y="526" width="1160" height="184" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#64748B" stroke-width="2">
