  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="600" y="1178" fill="#475569">instead of</text>
  </g>
  <g filter="url(#pu-soft)">
    <rect x="125" y="1148" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="125" y="1148" width="6" height="90" fill="#059669" clip-path="url(#pu-k11)"/>
  </g>
