    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="719" y="200" font-size="18.5" font-weight="600" fill="#111827">WebSockets</text>
  <text x="620" y="264" text-anchor="middle" font-size="15.5" fill="#6B7280">One one-way connection and separate writes</text>
  <text x="620" y="290" text-anchor="middle" font-size="15.5" fill="#94A3B8">the browser has no two-way need</text>

  
  <rect x="40" y="326" width="1160" height="184" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#64748B" stroke-width="2">
