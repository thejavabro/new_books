    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="189" y="1200" font-size="18.5" font-weight="600" fill="#111827">A cursor over created_at and id</text>
  <g filter="url(#pu-soft)">
    <rect x="655" y="1148" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="655" y="1148" width="6" height="90" fill="#DB2777" clip-path="url(#pu-k12)"/>
  </g>
  <circle cx="693" cy="1193" r="18" fill="#FFFFFF"/>
  <g transform="translate(682.56,1182.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="719" y="1200" font-size="18.5" font-weight="600" fill="#111827">Numbered offset pages</text>
  <text x="620" y="1264" text-anchor="middle" font-size="15.5" fill="#6B7280">No jump-to-page</text>
  <text x="620" y="1290" text-anchor="middle" font-size="15.5" fill="#94A3B8">new notifications would make offsets repeat or skip</text>

  
  <rect x="40" y="1326" width="1160" height="184" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M545,1393 H655" marker-end="url(#pu-ar)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="600" y="1378" fill="#475569">instead of</text>
  </g>
  <g filter="url(#pu-soft)">
    <rect x="125" y="1348" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="125" y="1348" width="6" height="90" fill="#059669" clip-path="url(#pu-k13)"/>
  </g>
  <circle cx="163" cy="1393" r="18" fill="#FFFFFF"/>
  <g transform="translate(152.56,1382.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="189" y="1400" font-size="18.5" font-weight="600" fill="#111827">unread_count in the envelope</text>
  <g filter="url(#pu-soft)">
    <rect x="655" y="1348" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="655" y="1348" width="6" height="90" fill="#DB2777" clip-path="url(#pu-k14)"/>
