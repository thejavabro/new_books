    <rect x="125" y="548" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="125" y="548" width="6" height="90" fill="#059669" clip-path="url(#pu-k5)"/>
  </g>
  <circle cx="163" cy="593" r="18" fill="#FFFFFF"/>
  <g transform="translate(152.56,582.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="189" y="600" font-size="18.5" font-weight="600" fill="#111827">Registered, signed webhooks</text>
  <g filter="url(#pu-soft)">
    <rect x="655" y="548" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="655" y="548" width="6" height="90" fill="#DB2777" clip-path="url(#pu-k6)"/>
