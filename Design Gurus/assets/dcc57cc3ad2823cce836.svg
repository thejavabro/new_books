    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="189" y="200" font-size="18.5" font-weight="600" fill="#111827">SSE plus REST writes</text>
  <g filter="url(#pu-soft)">
    <rect x="655" y="148" width="460" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
