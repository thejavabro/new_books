  <circle cx="693" cy="1393" r="18" fill="#FFFFFF"/>
  <g transform="translate(682.56,1382.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="719" y="1400" font-size="18.5" font-weight="600" fill="#111827">A separate count call</text>
  <text x="620" y="1464" text-anchor="middle" font-size="15.5" fill="#6B7280">The list owns a derived count</text>
  <text x="620" y="1490" text-anchor="middle" font-size="15.5" fill="#94A3B8">the screen always needs it anyway</text>

  
  <rect x="40" y="1534" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1558" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="1580" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Chosen</text>
  <text x="288" y="1580" font-size="15.5" fill="#475569">the green card on the left of every row</text>
  <rect x="64" y="1602" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="1624" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Rejected</text>
  <text x="288" y="1624" font-size="15.5" fill="#475569">the pink card on the right, the option the choice replaced</text>
  <rect x="64" y="1646" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="1668" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Cost accepted</text>
  <text x="288" y="1668" font-size="15.5" fill="#475569">and why, in the two gray lines under each row</text>

  
  <rect x="40" y="1730" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1775" text-anchor="middle" font-size="16" fill="#475569">Every row names one choice, the option it replaced, and the cost the design accepts in return.</text>
