  <rect x="0" y="0" width="1240" height="1846" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Seven choices, seven rejections, seven costs</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one row per trade-off</text>

  
  <rect x="40" y="126" width="1160" height="184" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#64748B" stroke-width="2">
