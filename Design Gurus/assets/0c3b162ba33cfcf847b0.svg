<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Clean Architecture rings from outside in: Frameworks and Drivers, Interface Adapters, Use Cases, Entities. Onion Architecture rings from outside in: the outer ring of UI, Infrastructure and Tests, Application Services, Domain Services, Domain Model. Mapping: Frameworks and Drivers and Interface Adapters together map to the outer ring (UI, Infrastructure, Tests); Use Cases maps to Application Services; Entities maps to Domain Services and Domain Model, and application-specific domain service logic maps to Use Cases">
