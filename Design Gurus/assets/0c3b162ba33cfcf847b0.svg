  <rect x="670" y="247" width="490" height="303" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="694" y="277" font-size="19.5" font-weight="600" fill="#B45309">Application Services</text>
  <rect x="690" y="319" width="450" height="211" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="714" y="349" font-size="19.5" font-weight="600" fill="#5B21B6">Domain Services</text>
  <rect x="40" y="620" width="1160" height="464" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="650" font-size="19.5" font-weight="600" fill="#475569">Ring mapping</text>

