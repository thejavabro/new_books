  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Clean Architecture vs. Onion Architecture: ring mapping</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Both patterns put the domain model at the center; the ring mapping shows how their names line up.</text>

  <rect x="40" y="125" width="570" height="469" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#475569">Clean Architecture</text>
