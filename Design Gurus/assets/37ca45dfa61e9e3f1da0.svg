<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The rotated array with the search covering all of it">
<defs>
<filter id="fm-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Find the smallest number in a sorted array that has been rotated</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Rotating breaks the order in exactly one place, and the smallest number sits right after it</text>
<rect x="40" y="106" width="1160" height="488" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The search starts covering the whole array, and each step throws away half of it</text>
<rect x="180" y="268" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="236" y="305.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="308" y="268" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="364" y="305.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="436" y="268" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="492" y="305.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<rect x="564" y="268" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="305.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<rect x="692" y="268" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="748" y="305.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="820" y="268" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="876" y="305.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="948" y="268" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="1004" y="305.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<path d="M236,280 l -7,-12 l 14,0 Z" fill="#2563EB"/>
<text x="236" y="248" text-anchor="middle" font-size="17" font-weight="600" fill="#1D4ED8">low</text>
<path d="M1004,280 l -7,-12 l 14,0 Z" fill="#7C3AED"/>
<text x="1004" y="248" text-anchor="middle" font-size="17" font-weight="600" fill="#5B21B6">high</text>
<rect x="360" y="402" width="520" height="50" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="434" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">compare the middle against the RIGHT hand end, not the left</text>
<text x="620" y="526" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Comparing against the left end cannot tell the two cases apart, but the right end can</text>
<rect x="40" y="606" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="646" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">If the middle is bigger than the right end, the break is to its right</text>
<text x="620" y="678" text-anchor="middle" font-size="18.5" fill="#475569">Otherwise the middle is in the already sorted tail, and the break is at it or to its left</text>
</svg>