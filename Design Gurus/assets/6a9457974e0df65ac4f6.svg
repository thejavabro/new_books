<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three write strategies. Write-through sends the write to the cache, which writes to the database before reporting success. Write-back confirms immediately and writes to the database later. Write-around writes straight to the database and puts nothing in the cache.">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="ca3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ca3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ca3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ca3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ca3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ca3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ca3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ca3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ca3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three ways to handle a write</text>
  <rect x="24" y="70" width="388" height="380" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="218" y="108" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">Write-through</text>
  <g filter="url(#ca3-soft)"><rect x="54" y="140" width="130" height="58" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="119" y="176" font-size="19" fill="#0F172A" text-anchor="middle">app</text>
  <g filter="url(#ca3-soft)"><rect x="252" y="140" width="130" height="58" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="317" y="176" font-size="19" fill="#065F46" text-anchor="middle">cache</text>
  <g filter="url(#ca3-soft)"><rect x="153" y="250" width="130" height="58" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="218" y="286" font-size="19" fill="#6D28D9" text-anchor="middle">database</text>
  <line x1="188" y1="169" x2="246" y2="169" stroke="#059669" stroke-width="2.2" marker-end="url(#ca3-e)"/>
  <line x1="317" y1="202" x2="264" y2="246" stroke="#059669" stroke-width="2.2" marker-end="url(#ca3-e)"/>
  <text x="218" y="232" font-size="17" fill="#64748B" text-anchor="middle">waits for this</text>
  <text x="218" y="358" font-size="19" fill="#065F46" text-anchor="middle">The cache is never behind.</text>
  <text x="218" y="388" font-size="19" fill="#B91C1C" text-anchor="middle">Every write is slower.</text>
  <rect x="426" y="70" width="388" height="380" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="108" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle">Write-back</text>
  <g filter="url(#ca3-soft)"><rect x="456" y="140" width="130" height="58" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="521" y="176" font-size="19" fill="#0F172A" text-anchor="middle">app</text>
  <g filter="url(#ca3-soft)"><rect x="654" y="140" width="130" height="58" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="719" y="176" font-size="19" fill="#B45309" text-anchor="middle">cache</text>
  <g filter="url(#ca3-soft)"><rect x="555" y="250" width="130" height="58" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="620" y="286" font-size="19" fill="#6D28D9" text-anchor="middle">database</text>
  <line x1="590" y1="169" x2="648" y2="169" stroke="#D97706" stroke-width="2.2" marker-end="url(#ca3-a)"/>
  <line x1="719" y1="202" x2="666" y2="246" stroke="#D97706" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ca3-a)"/>
  <text x="620" y="232" font-size="17" fill="#64748B" text-anchor="middle">later</text>
  <text x="620" y="358" font-size="19" fill="#065F46" text-anchor="middle">Writes are very fast.</text>
  <text x="620" y="388" font-size="19" fill="#B91C1C" text-anchor="middle">A crash loses the newest data.</text>
  <rect x="828" y="70" width="388" height="380" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="1022" y="108" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">Write-around</text>
  <g filter="url(#ca3-soft)"><rect x="858" y="140" width="130" height="58" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="923" y="176" font-size="19" fill="#0F172A" text-anchor="middle">app</text>
  <g filter="url(#ca3-soft)"><rect x="1056" y="140" width="130" height="58" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="1121" y="176" font-size="19" fill="#1E40AF" text-anchor="middle">cache</text>
  <g filter="url(#ca3-soft)"><rect x="957" y="250" width="130" height="58" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="1022" y="286" font-size="19" fill="#6D28D9" text-anchor="middle">database</text>
  <line x1="923" y1="202" x2="988" y2="246" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#ca3-b)"/>
  <text x="858" y="244" font-size="17" fill="#64748B" text-anchor="start">straight to</text>
  <text x="858" y="268" font-size="17" fill="#64748B" text-anchor="start">the database</text>
  <text x="1022" y="358" font-size="19" fill="#065F46" text-anchor="middle">Nothing useless is cached.</text>
  <text x="1022" y="388" font-size="19" fill="#B91C1C" text-anchor="middle">The next read misses or is stale.</text>
</svg>