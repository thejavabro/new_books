  <g transform="translate(831.56,200.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="804" y="154" font-size="15.5" font-weight="600" fill="#6B7280">Gate 3</text>
  <text x="868" y="218" font-size="18.5" font-weight="600" fill="#111827">Provenance</text>
  <text x="893" y="281" font-size="15.5" text-anchor="middle" fill="#6B7280">watermark,</text>
  <text x="893" y="304" font-size="15.5" text-anchor="middle" fill="#6B7280">content credentials,</text>
  <text x="893" y="327" font-size="15.5" text-anchor="middle" fill="#6B7280">takedown hash</text>
