  <text x="508" y="281" font-size="15.5" text-anchor="middle" fill="#6B7280">four images</text>
  <g filter="url(#c6ttg-soft)">
    <rect x="624" y="166" width="150" height="90" rx="12" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1.5"/>
