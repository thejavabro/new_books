  </g>
  <circle cx="1050" cy="211" r="18" fill="#FFFFFF"/>
  <g transform="translate(1039.56,200.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="1076" y="206.5" font-size="18.5" font-weight="600" fill="#111827">User sees</text>
  <text x="1076" y="229.5" font-size="18.5" font-weight="600" fill="#111827">the image</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="412.5" y="122" fill="#E11D48">before any GPU work</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="796" y="122" fill="#E11D48">before any user sees them</text></g>
  <rect x="40" y="400" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="445" text-anchor="middle" font-size="16" fill="#475569">Both checking gates fail closed. Unchecked prompts never reach a GPU, and unchecked images never reach a user.</text>
