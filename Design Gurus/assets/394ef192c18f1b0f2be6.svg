<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="516" viewBox="0 0 1240 516" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A prompt passes the prompt gate before GPU generation; the generated images pass the image gate; provenance adds a watermark, content credentials, and a takedown hash before the user sees the image. Both checking gates fail closed.">
