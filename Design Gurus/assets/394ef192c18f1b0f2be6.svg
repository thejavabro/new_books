  <text x="699" y="281" font-size="15.5" text-anchor="middle" fill="#6B7280">checks the pixels</text>
  <text x="699" y="304" font-size="15.5" text-anchor="middle" fill="#94A3B8">innocent prompt,</text>
  <text x="699" y="327" font-size="15.5" text-anchor="middle" fill="#94A3B8">harmful image</text>
  <g filter="url(#c6ttg-soft)">
    <rect x="804" y="166" width="178" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="804" y="166" width="6" height="90" fill="#7C3AED" clip-path="url(#c6ttg-k5)"/>
