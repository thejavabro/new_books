  <g transform="translate(525.56,620.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="562" y="638" font-size="18.5" font-weight="600" fill="#111827">Distillation</text>
  <text x="660" y="701" font-size="15.5" text-anchor="middle" fill="#6B7280">a small model imitates a large one</text>
  <g filter="url(#so3s-soft)">
    <rect x="849" y="586" width="324" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="849" y="586" width="6" height="90" fill="#7C3AED" clip-path="url(#so3s-k9)"/>
  </g>
  <circle cx="887" cy="631" r="18" fill="#FFFFFF"/>
  <g transform="translate(876.56,620.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="913" y="638" font-size="18.5" font-weight="600" fill="#111827">Speculative decoding</text>
  <text x="1011" y="701" font-size="15.5" text-anchor="middle" fill="#6B7280">a draft model guesses, the large model checks</text>
  <text x="1176" y="735" font-size="15.5" font-weight="600" text-anchor="end" fill="#5B21B6">saves memory and time per token</text>
