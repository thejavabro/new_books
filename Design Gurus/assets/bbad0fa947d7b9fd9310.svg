  <text x="211" y="148" font-size="18.5" font-weight="600" fill="#111827">Semantic cache</text>
  <text x="309" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">reuses an answer to a repeated question</text>
  <g filter="url(#so3s-soft)">
    <rect x="498" y="96" width="324" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="498" y="96" width="6" height="90" fill="#2563EB" clip-path="url(#so3s-k2)"/>
