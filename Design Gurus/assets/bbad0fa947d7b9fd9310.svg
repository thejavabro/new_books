    <rect x="147" y="341" width="324" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="147" y="341" width="6" height="90" fill="#4F46E5" clip-path="url(#so3s-k4)"/>
  </g>
  <circle cx="185" cy="386" r="18" fill="#FFFFFF"/>
  <g transform="translate(174.56,375.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="211" y="393" font-size="18.5" font-weight="600" fill="#111827">Continuous batching</text>
  <text x="309" y="456" font-size="15.5" text-anchor="middle" fill="#6B7280">admits requests at every decode step</text>
  <g filter="url(#so3s-soft)">
    <rect x="498" y="341" width="324" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="498" y="341" width="6" height="90" fill="#4F46E5" clip-path="url(#so3s-k5)"/>
  </g>
  <circle cx="536" cy="386" r="18" fill="#FFFFFF"/>
  <g transform="translate(525.56,375.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="562" y="393" font-size="18.5" font-weight="600" fill="#111827">Paged attention</text>
  <text x="660" y="456" font-size="15.5" text-anchor="middle" fill="#6B7280">stores the KV cache in small pages</text>
  <g filter="url(#so3s-soft)">
    <rect x="849" y="341" width="324" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="849" y="341" width="6" height="90" fill="#4F46E5" clip-path="url(#so3s-k6)"/>
  </g>
  <circle cx="887" cy="386" r="18" fill="#FFFFFF"/>
  <g transform="translate(876.56,375.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="913" y="393" font-size="18.5" font-weight="600" fill="#111827">Prefix caching</text>
  <text x="1011" y="456" font-size="15.5" text-anchor="middle" fill="#6B7280">reuses the shared start of a prompt</text>
  <text x="1176" y="490" font-size="15.5" font-weight="600" text-anchor="end" fill="#4338CA">saves GPU time across many requests</text>
