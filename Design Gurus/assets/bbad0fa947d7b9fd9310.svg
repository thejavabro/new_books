    <rect x="147" y="586" width="6" height="90" fill="#7C3AED" clip-path="url(#so3s-k7)"/>
  </g>
  <circle cx="185" cy="631" r="18" fill="#FFFFFF"/>
  <g transform="translate(174.56,620.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="211" y="638" font-size="18.5" font-weight="600" fill="#111827">Quantization</text>
  <text x="309" y="701" font-size="15.5" text-anchor="middle" fill="#6B7280">stores weights in fewer bits</text>
