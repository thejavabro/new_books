  <circle cx="536" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(525.56,130.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="562" y="148" font-size="18.5" font-weight="600" fill="#111827">Router</text>
  <text x="660" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">sends easy requests to a small model</text>
  <g filter="url(#so3s-soft)">
    <rect x="849" y="96" width="324" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
