  <text x="913" y="148" font-size="18.5" font-weight="600" fill="#111827">Shorter prompts and outputs</text>
  <text x="1011" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">fewer tokens on every request</text>
  <text x="1176" y="245" font-size="15.5" font-weight="600" text-anchor="end" fill="#1D4ED8">saves work on the large model: whole calls, frontier calls, or tokens</text>
  <rect x="120" y="285" width="1080" height="225" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="144" y="315" font-size="16.5" font-weight="600" fill="#4338CA">Middle shelf: tune the engine</text>
