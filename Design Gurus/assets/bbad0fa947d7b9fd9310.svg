  <rect x="120" y="40" width="1080" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="144" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">Top shelf: avoid calling the model</text>
