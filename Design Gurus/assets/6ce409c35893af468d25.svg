<marker id="d-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="d-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="d-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="d-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="d-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="d-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="d-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="940" height="510" fill="#FFFFFF"/>
<text x="470" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Each result cell reuses the one before it</text>
<rect x="150" y="84" width="640" height="118" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="166" y="112" font-size="19.5" font-weight="600" fill="#475569">Input</text>
<rect x="178" y="128" width="96" height="58" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="226" y="164.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="300" y="128" width="96" height="58" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="348" y="164.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="422" y="128" width="96" height="58" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="470" y="164.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="544" y="128" width="96" height="58" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="592" y="164.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="666" y="128" width="96" height="58" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="714" y="164.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<rect x="150" y="270" width="640" height="120" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="166" y="294" font-size="19.5" font-weight="600" fill="#047857">Result</text>
<rect x="178" y="316" width="96" height="58" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="226" y="352.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="300" y="316" width="96" height="58" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="348" y="352.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="422" y="316" width="96" height="58" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="470" y="352.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<rect x="544" y="316" width="96" height="58" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="592" y="352.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">11</text>
<rect x="666" y="316" width="96" height="58" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="714" y="352.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">17</text>
<path d="M226,190 L226,310" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#d-ar-slate)"/>
<path d="M348,190 L348,310" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#d-ar-slate)"/>
<path d="M470,190 L470,310" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#d-ar-slate)"/>
<path d="M592,190 L592,310" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#d-ar-slate)"/>
<path d="M714,190 L714,310" stroke="#64748B" stroke-width="2.2" fill="none" marker-end="url(#d-ar-slate)"/>
<path d="M276,345 L294,345" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#d-ar-emerald)"/>
<path d="M398,345 L416,345" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#d-ar-emerald)"/>
<path d="M520,345 L538,345" stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#d-ar-blue)"/>
<path d="M642,345 L660,345" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#d-ar-emerald)"/>
<rect x="365.8" y="216" width="208.4" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.94"/>
<text x="470" y="240" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">add the input value</text>
<rect x="50" y="406" width="840" height="82" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="72" y="442" font-size="18.5" fill="#475569">result[3] = result[2] + nums[3] = 10 + 1 = 11. The 10 already holds 2 + 3 + 5,</text>
<text x="72" y="470" font-size="18.5" fill="#475569">so the earlier values are never added a second time. One pass is enough.</text>
</svg>