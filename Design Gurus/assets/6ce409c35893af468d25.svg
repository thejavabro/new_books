<svg xmlns="http://www.w3.org/2000/svg" width="940" height="510" viewBox="0 0 940 510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Each running sum cell reuses the one before it">
<defs>
