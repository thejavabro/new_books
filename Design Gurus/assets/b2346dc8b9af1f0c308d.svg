<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Use a relational database for payments and balances, orders and invoices, data people will report on, and a new product whose queries are not known yet. Use a NoSQL store for sessions and counters with a key-value store, records with varying fields in a document store, device readings and messages in a wide-column store, and relationship questions in a graph database. Most large systems use both.">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="sn5-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="sn5-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="sn5-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="sn5-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="sn5-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="sn5-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="sn5-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="sn5-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="sn5-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Concrete cases on both sides</text>
  <g filter="url(#sn5-soft)"><rect x="24" y="74" width="586" height="306" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="317" y="116" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="middle">Use a relational database</text>
  <path d="M59,164 L66,172 L78,156" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="170" font-size="20" fill="#0F172A" text-anchor="start">Payments and account balances</text>
  <path d="M59,220 L66,228 L78,212" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="226" font-size="20" fill="#0F172A" text-anchor="start">Orders, customers, and invoices</text>
  <path d="M59,276 L66,284 L78,268" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="282" font-size="20" fill="#0F172A" text-anchor="start">Data that people will run reports on</text>
  <path d="M59,332 L66,340 L78,324" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="338" font-size="20" fill="#0F172A" text-anchor="start">A product whose queries are not known yet</text>
  <g filter="url(#sn5-soft)"><rect x="630" y="74" width="586" height="306" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="923" y="116" font-size="22" font-weight="700" fill="#6D28D9" text-anchor="middle">Use a NoSQL store</text>
  <path d="M665,164 L672,172 L684,156" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <text x="706" y="170" font-size="20" fill="#0F172A" text-anchor="start">Sessions and counters (key-value)</text>
  <path d="M665,220 L672,228 L684,212" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <text x="706" y="226" font-size="20" fill="#0F172A" text-anchor="start">Records with varying fields (document)</text>
  <path d="M665,276 L672,284 L684,268" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <text x="706" y="282" font-size="20" fill="#0F172A" text-anchor="start">Device readings, messages (wide-column)</text>
  <path d="M665,332 L672,340 L684,324" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
  <text x="706" y="338" font-size="20" fill="#0F172A" text-anchor="start">Who is connected to whom (graph)</text>
  <rect x="24" y="404" width="1192" height="72" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="620" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Most large systems use both, and every extra store is another system to run</text>
</svg>