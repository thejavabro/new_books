<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="C4-style component view of the supplied code. Inside the backend application container, two Flask routes, POST /orders in app.py and POST /admin/orders in support_routes.py, call five Python modules: Menu, Orders, Payments, Dispatch and Notifications. Each route has its own arrows: the customer route calls all five modules. The customer route holds rules copy 1; Orders holds rules copy 2; the phone route calls only Orders, Payments and Dispatch, so it sends no restaurant message. In the PostgreSQL container, each module owns its tables: Menu owns restaurants and menu_items, Orders owns orders and order_lines, Payments owns payments, Dispatch owns courier_requests, Notifications owns sent_messages. Three pink lines cross boundaries: Orders reads menu_items and updates it with no check, Payments updates the status in orders, and Dispatch reads the orders table.">
