<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="804" viewBox="0 0 1240 804" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="first-title first-desc">
<title id="first-title">What to split first</title>
<desc id="first-desc">The first extraction should be chosen for how little it can hurt: a clear boundary, little shared data, and tolerance for being asynchronous. The core domain has none of those and is what teams attempt first.</desc>
<defs>
<marker id="first-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="first-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="first-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="first-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="804" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What to split first</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The first extraction should be chosen for how little it can hurt.</text>
<rect x="40" y="726" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="726" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="272" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V384A6 6 0 0 0 46 390H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Good first candidates</text>
<text x="72" y="182" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">clear boundary, little shared data, tolerates async</text>
<rect x="72" y="196" width="500" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="222" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">notifications and email</text>
<rect x="72" y="242" width="500" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="268" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">file and media processing</text>
<rect x="72" y="288" width="500" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">search indexing</text>
<rect x="72" y="334" width="500" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="360" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">report and export generation</text>
<rect x="640" y="118" width="560" height="272" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V384A6 6 0 0 0 646 390H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">The bad first candidate</text>
<text x="1170" y="154" font-size="20" font-weight="700" fill="#A83147" text-anchor="end">the core domain</text>
<text x="672" y="182" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the one teams attempt first</text>
<rect x="672" y="196" width="500" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="222" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the most shared data</text>
<rect x="672" y="242" width="500" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="268" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the most tangled rules</text>
<rect x="672" y="288" width="500" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the least tolerance for latency</text>
<rect x="672" y="334" width="500" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="360" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the highest cost of being wrong</text>
<rect x="40" y="410" width="1160" height="58" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="410" width="5" height="58" rx="2.5" fill="#AC8BE8"/><text x="64" y="445" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Extract outwards from the edges. The core is the last thing to split, not the first.</text>
<text x="40" y="500" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two practical rules</text>
<rect x="40" y="518" width="560" height="86" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="540" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Split one thing, finish it including</text><text x="320" y="567" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the deletion, and operate it a while</text><text x="320" y="594" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">before starting another</text>
<rect x="640" y="518" width="560" height="86" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="540" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep the same language and</text><text x="920" y="567" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deployment machinery, so the</text><text x="920" y="594" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">experiment is about the boundary</text>
<rect x="40" y="626" width="1160" height="74" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="626" width="5" height="74" rx="2.5" fill="#39D5AA"/><text x="64" y="655.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Distribution is not an architecture you adopt.</text><text x="64" y="682.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">It is a cost you pay to solve a problem that should be visible before you pay.</text>
<text x="66" y="760" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The judgment signal is naming what stays together, because deciding means declining.</text>
</svg>