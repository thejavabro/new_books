<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="816" viewBox="0 0 1240 816" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="additive-title additive-desc">
<title id="additive-title">Additive first, always</title>
<desc id="additive-desc">Nothing is removed, narrowed or made required until the end. Additive steps leave old code unaffected, which is what allows old and new to coexist, and every tightening belongs in the contract phase.</desc>
<defs>
<marker id="additive-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="additive-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="additive-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="additive-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="816" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Additive first, always</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Nothing is removed, narrowed or made required until the end.</text>
<rect x="40" y="738" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="738" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="155" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Every step before the final one is additive.</text>
<text x="40" y="212" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Which means, concretely</text>
<rect x="40" y="230" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="264" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the new column is nullable</text>
<path d="M526 258H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 258H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#additive-marker-slate)"/>
<rect x="570" y="230" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="264" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">even though the eventual model requires it</text>
<rect x="40" y="298" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the new table exists alongside</text>
<path d="M526 326H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 326H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#additive-marker-slate)"/>
<rect x="570" y="298" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="332" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than replacing the old one</text>
<rect x="40" y="366" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="400" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the new API field is optional</text>
<path d="M526 394H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 394H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#additive-marker-slate)"/>
<rect x="570" y="366" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="400" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">even though new clients always send it</text>
<rect x="40" y="434" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="468" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the new service runs beside</text>
<path d="M526 462H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 462H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#additive-marker-slate)"/>
<rect x="570" y="434" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="468" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than in front of the old one</text>
<rect x="40" y="512" width="1160" height="88" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="512" width="5" height="88" rx="2.5" fill="#AC8BE8"/><text x="64" y="536" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The property that makes additive steps safe</text><text x="64" y="562" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Old code is unaffected by them. It does not read the new column,</text><text x="64" y="588" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">so a nullable column it never selects cannot break it.</text>
<text x="40" y="638" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And the tightening comes last</text>
<text x="1198" y="638" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">Safe then, precisely because the expand phase already made it true in practice</text>
<rect x="40" y="656" width="372" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="226" y="690" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">make the new column NOT NULL</text>
<rect x="434" y="656" width="372" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="690" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">drop the old column</text>
<rect x="828" y="656" width="372" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="690" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">make the API field required</text>
<text x="66" y="772" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Almost every migration failure is a violation of this one rule.</text>
</svg>