    <path d="M645,745 H682 Q694,745 694,733 V707 Q694,695 706,695 H730" stroke="#D97706" marker-end="url(#yt03-ma)"/>
    <path d="M645,785 H682 Q694,785 694,797 V863 Q694,875 706,875 H730" stroke="#D97706" marker-end="url(#yt03-ma)"/>
    <path d="M780,920 V932 Q780,944 768,944 H602 Q590,944 590,956 V964" stroke="#D97706" marker-end="url(#yt03-ma)"/>
