    <rect x="2.5" y="3.5" width="19" height="7" rx="1.6"/><rect x="2.5" y="13.5" width="19" height="7" rx="1.6"/><path d="M6.5 7h.01M6.5 17h.01"/>
  </g>
  <text x="194" y="282" font-size="18.5" font-weight="600" fill="#111827">Web Server</text>

  
  <g filter="url(#yt03-soft)">
    <rect x="130" y="410" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="130" y="410" width="6" height="90" fill="#2563EB" clip-path="url(#yt03-k3)"/>
