    <path d="M480,1020 H352 Q340,1020 340,1008 V797 Q340,785 328,785 H310" stroke="#D97706" marker-end="url(#yt03-ma)"/>
    <path d="M140,785 H102 Q90,785 90,773 V107 Q90,95 102,95 H140" stroke="#2563EB" marker-end="url(#yt03-mb)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="318" y="190" fill="#1D4ED8">search / view</text>
    <text x="380" y="447" fill="#1D4ED8">read metadata</text>
    <text x="732" y="447" fill="#1D4ED8">on miss</text>
    <text x="365" y="600" fill="#BE185D">new upload</text>
    <text x="418" y="1012" fill="#B45309">popular videos</text>
    <text x="90" y="450" fill="#1D4ED8">playback</text>
  </g>

  
  <g filter="url(#yt03-soft)">
    <rect x="140" y="50" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="140" y="50" width="6" height="90" fill="#2563EB" clip-path="url(#yt03-k1)"/>
  </g>
  <circle cx="178" cy="95" r="18" fill="#FFFFFF"/>
  <g transform="translate(167.56,84.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="204" y="102" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#yt03-soft)">
    <rect x="130" y="230" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
