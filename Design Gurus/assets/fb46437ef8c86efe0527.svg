      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yt03-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yt03-k1"><rect x="140" y="50" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="yt03-k2"><rect x="130" y="230" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="yt03-k3"><rect x="130" y="410" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="yt03-k4"><rect x="440" y="410" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="yt03-k5"><rect x="400" y="720" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="yt03-k6"><rect x="730" y="830" width="170" height="90" rx="12"/></clipPath>
