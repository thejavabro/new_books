    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="194" y="462" font-size="18.5" font-weight="600" fill="#111827">App Server</text>

  
  <g filter="url(#yt03-soft)">
    <rect x="440" y="410" width="224" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="410" width="6" height="90" fill="#2563EB" clip-path="url(#yt03-k4)"/>
  </g>
  <circle cx="478" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,444.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="504" y="462" font-size="18.5" font-weight="600" fill="#111827">Metadata Cache</text>
  <text x="552" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">hot rows, LRU, 20 percent of daily reads</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M800,420 L800,504 A140,16 0 0 0 1080,504 L1080,420" fill="#EDE9FE"/>
    <ellipse cx="940" cy="420" rx="140" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="940" y="470" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Metadata DB</text>
  <text x="940" y="548" font-size="15.5" text-anchor="middle" fill="#6B7280">sharded MySQL; primary plus replicas</text>

  
  <g filter="url(#yt03-soft)">
    <rect x="400" y="720" width="245" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="400" y="720" width="6" height="90" fill="#D97706" clip-path="url(#yt03-k5)"/>
  </g>
  <circle cx="438" cy="765" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,754.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
