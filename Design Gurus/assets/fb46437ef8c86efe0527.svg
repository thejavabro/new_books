<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1420" viewBox="0 0 1240 1420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="YouTube detailed design: the app server reads metadata through a cache backed by a sharded MySQL metadata DB, each upload is queued so the encoder fills video storage and the thumbnails generator fills Bigtable thumbnails, and popular videos reach clients through the CDN.">
  <defs>
    <marker id="yt03-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
