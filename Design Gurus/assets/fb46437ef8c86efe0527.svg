  </g>
  <text x="464" y="772" font-size="18.5" font-weight="600" fill="#111827">Processing Queue</text>

  
  <g filter="url(#yt03-soft)">
    <rect x="730" y="650" width="265" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="730" y="650" width="6" height="90" fill="#D97706" clip-path="url(#yt03-k8)"/>
  </g>
  <circle cx="768" cy="695" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,684.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 15.5l-5-5-8.5 8.5"/>
  </g>
  <text x="794" y="702" font-size="18.5" font-weight="600" fill="#111827">Thumbnails Generator</text>

  
  <g filter="url(#yt03-soft)">
    <rect x="730" y="830" width="170" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="730" y="830" width="6" height="90" fill="#D97706" clip-path="url(#yt03-k6)"/>
  </g>
  <circle cx="768" cy="875" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,864.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7 4.5v15M17 4.5v15M3 9h4M3 15h4M17 9h4M17 15h4"/>
  </g>
  <text x="794" y="882" font-size="18.5" font-weight="600" fill="#111827">Encoder</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M480,980 L480,1064 A110,16 0 0 0 700,1064 L700,980" fill="#FEF3C7"/>
    <ellipse cx="590" cy="980" rx="110" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="590" y="1030" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Video Storage</text>
  <text x="590" y="1108" font-size="15.5" text-anchor="middle" fill="#6B7280">object storage or HDFS, replicated</text>
  <text x="590" y="1131" font-size="15.5" text-anchor="middle" fill="#94A3B8">unpopular videos served from our own servers</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M875,980 L875,1064 A115,16 0 0 0 1105,1064 L1105,980" fill="#FEF3C7"/>
    <ellipse cx="990" cy="980" rx="115" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="990" y="1030" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Bigtable Thumbnails</text>
  <text x="990" y="1108" font-size="15.5" text-anchor="middle" fill="#6B7280">small files packed into blocks,</text>
  <text x="990" y="1131" font-size="15.5" text-anchor="middle" fill="#6B7280">hot ones cached</text>

  
  <g filter="url(#yt03-lift)">
    <rect x="140" y="740" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="140" y="740" width="9" height="90" fill="#2563EB" clip-path="url(#yt03-k7)"/>
  </g>
  <circle cx="178" cy="785" r="18" fill="#FFFFFF"/>
  <g transform="translate(167.56,774.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.5 4 5.6 4 9s-1.4 6.5-4 9c-2.6-2.5-4-5.6-4-9s1.4-6.5 4-9z"/>
  </g>
  <text x="204" y="792" font-size="18.5" font-weight="600" fill="#111827">CDN</text>
  <text x="225" y="855" font-size="15.5" text-anchor="middle" fill="#6B7280">serves popular videos</text>
  <text x="225" y="878" font-size="15.5" text-anchor="middle" fill="#6B7280">from memory near the viewer</text>

  
  <rect x="40" y="1195" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1217" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="1239" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Upload</text>
  <text x="288" y="1239" font-size="15.5" fill="#475569">stored first, then queued for encoding</text>
  <rect x="64" y="1261" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="1283" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Pipeline</text>
  <text x="288" y="1283" font-size="15.5" fill="#475569">background work the user never waits for</text>
  <rect x="64" y="1305" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="1327" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Playback</text>
  <text x="288" y="1327" font-size="15.5" fill="#475569">popular from the CDN, the rest from our servers</text>
</svg>