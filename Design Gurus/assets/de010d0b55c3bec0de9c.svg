<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="652" viewBox="0 0 1240 652" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Nothing chosen yet, with 20 still to factor">
<defs>
<filter id="fc-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="652" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which sets of factors multiply back to 20?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A factor is taken, the rest is factored the same way, and then the factor is put back</text>
<rect x="40" y="106" width="1160" height="400" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Factors are only ever taken in non decreasing order, so no set is found twice</text>
<text x="550" y="214" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">factors chosen</text>
<text x="578" y="213" font-size="18" fill="#475569">none yet</text>
<text x="490" y="334" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">still to factor</text>
<rect x="510" y="296" width="120" height="56" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="570" y="331.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">20</text>
<text x="680" y="332" font-size="18.5" fill="#475569">divisors are tried from the smallest upward</text>
<text x="520" y="438" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">combinations found</text>
<text x="548" y="437" font-size="18" fill="#475569">none yet</text>
<rect x="40" y="528" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="568" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Taking a factor makes a smaller version of the very same question</text>
<text x="620" y="600" text-anchor="middle" font-size="18.5" fill="#475569">Putting it back afterwards is what lets the next factor be tried in its place</text>
</svg>