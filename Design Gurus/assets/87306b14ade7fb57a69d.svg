<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A two by two grid. Vertical axis: effect on the main requirement. Horizontal axis: cost to fix, low meaning 5 engineer-days or less. Upper left, high effect and low cost: 1, fee formula copied in three places, effect 3, 5 engineer-days, recommended; 2, Menu computes the surcharge, effect 2, 2 engineer-days, recommended. Upper right, high effect and high cost: no finding in this review. Lower left, low effect and low cost: 3, Orders and Payments cycle, effect 1, 2 engineer-days; 4, Dispatch writes the orders table, effect 0, 3 engineer-days; 5, restaurant page runs 34 queries, effect 0, 2 engineer-days. Lower right, low effect and high cost: 6, move Dispatch into its own service, a proposal rather than a finding, effect 0, about 30 engineer-days.">
  <defs>
    <filter id="md03b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md03b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md03b-k1"><rect x="144" y="200" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md03b-k2"><rect x="144" y="330" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md03b-k3"><rect x="144" y="550" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md03b-k4"><rect x="144" y="680" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md03b-k5"><rect x="144" y="810" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md03b-k6"><rect x="694" y="550" width="482" height="56" rx="12"/></clipPath>
    <marker id="md03b-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1010" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Ranking findings by effect and cost to fix</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The fee review recommends the two findings in the upper left quadrant.</text>

  <rect x="120" y="120" width="530" height="330" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="144" y="150" font-size="19.5" font-weight="600" fill="#047857">High effect, low cost</text>
  <rect x="670" y="120" width="530" height="330" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="694" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">High effect, high cost</text>
  <rect x="120" y="470" width="530" height="450" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="144" y="500" font-size="19.5" font-weight="600" fill="#475569">Low effect, low cost</text>
  <rect x="670" y="470" width="530" height="450" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="694" y="500" font-size="19.5" font-weight="600" fill="#BE185D">Low effect, high cost</text>

  <g fill="none" stroke-width="2">
    <path d="M120,950 H1200" stroke="#64748B" marker-end="url(#md03b-m-slate)"/>
    <path d="M90,920 V120" stroke="#64748B" marker-end="url(#md03b-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#md03b-lift)">
    <rect x="144" y="200" width="482" height="56" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="144" y="200" width="9" height="56" fill="#059669" clip-path="url(#md03b-k1)"/>
  </g>
  <text x="164" y="235" font-size="18.5" font-weight="600" fill="#111827">1. Fee formula copied in three places</text>
  <text x="385" y="285" font-size="18.5" text-anchor="middle" fill="#6B7280">recommended: effect 3, cost 5 engineer-days</text>
  <g filter="url(#md03b-lift)">
    <rect x="144" y="330" width="482" height="56" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="144" y="330" width="9" height="56" fill="#059669" clip-path="url(#md03b-k2)"/>
  </g>
  <text x="164" y="365" font-size="18.5" font-weight="600" fill="#111827">2. Menu computes the surcharge</text>
  <text x="385" y="415" font-size="18.5" text-anchor="middle" fill="#6B7280">recommended: effect 2, cost 2 engineer-days</text>
  <g filter="url(#md03b-soft)">
    <rect x="144" y="550" width="482" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="144" y="550" width="6" height="56" fill="#64748B" clip-path="url(#md03b-k3)"/>
  </g>
  <text x="164" y="585" font-size="18.5" font-weight="600" fill="#111827">3. Orders and Payments cycle</text>
  <text x="385" y="635" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 1, cost 2 engineer-days</text>
  <g filter="url(#md03b-soft)">
    <rect x="144" y="680" width="482" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="144" y="680" width="6" height="56" fill="#64748B" clip-path="url(#md03b-k4)"/>
  </g>
  <text x="164" y="715" font-size="18.5" font-weight="600" fill="#111827">4. Dispatch writes the orders table</text>
  <text x="385" y="765" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 0, cost 3 engineer-days</text>
  <g filter="url(#md03b-soft)">
    <rect x="144" y="810" width="482" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="144" y="810" width="6" height="56" fill="#64748B" clip-path="url(#md03b-k5)"/>
  </g>
  <text x="164" y="845" font-size="18.5" font-weight="600" fill="#111827">5. Restaurant page runs 34 queries</text>
  <text x="385" y="895" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 0, cost 2 engineer-days</text>
  <g filter="url(#md03b-soft)">
    <rect x="694" y="550" width="482" height="56" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="694" y="550" width="6" height="56" fill="#DB2777" clip-path="url(#md03b-k6)"/>
  </g>
  <text x="714" y="585" font-size="18.5" font-weight="600" fill="#111827">6. Move Dispatch into its own service</text>
  <text x="935" y="635" font-size="18.5" text-anchor="middle" fill="#6B7280">a proposal: effect 0, about 30 engineer-days</text>
  <text x="935" y="295" font-size="18.5" text-anchor="middle" fill="#94A3B8">No finding in this review</text>
  <text x="660" y="994" font-size="18.5" font-weight="600" text-anchor="middle" fill="#475569">Cost to fix: low (5 engineer-days or less) on the left, high on the right</text>

  <text transform="rotate(-90 70 520)" x="70" y="520" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Effect on the main requirement: high at the top</text>


</svg>