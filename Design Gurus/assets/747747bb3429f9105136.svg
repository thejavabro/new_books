<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="270" viewBox="0 0 1240 270" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A fixed window counter record: the key Kristie maps to a value holding a request count and the window start time, 12 bytes per user before overhead.">
