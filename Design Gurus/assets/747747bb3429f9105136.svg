  </g>
  <circle cx="178" cy="125" r="18" fill="#FFFFFF"/>
  <g transform="translate(167.56,114.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="204" y="132" font-size="18.5" font-weight="600" fill="#111827">Kristie</text>
  <text x="225" y="195" font-size="15.5" text-anchor="middle" fill="#6B7280">UserID, 8 bytes</text>

  
  <g filter="url(#rl04-soft)">
    <rect x="560" y="50" width="400" height="150" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
