  </g>
  <text x="624" y="93" font-size="18.5" font-weight="600" fill="#111827">Value</text>
  <rect x="584" y="110" width="352" height="32" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="598" y="131" font-size="15.5" fill="#111827">Count: 3</text>
  <rect x="584" y="152" width="352" height="32" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="598" y="173" font-size="15.5" fill="#111827">StartTime: minute start (epoch)</text>
  <text x="760" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">12 bytes per user before overhead</text>
