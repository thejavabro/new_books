    <filter id="rl04-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="rl04-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="rl04-k1"><rect x="140" y="80" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="rl04-k2"><rect x="560" y="50" width="400" height="150" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="270" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2">
    <path d="M310,125 H552" stroke="#64748B" marker-end="url(#rl04-sl)"/>
  </g>

  
  <g filter="url(#rl04-soft)">
    <rect x="140" y="80" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
