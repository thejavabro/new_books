<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Non-functional requirements for a recommendation system: over 200 million registered users, under 200 milliseconds for the online path, high availability; a strongly read heavy load with experiments running continuously">
  <defs>
    <filter id="nfxn-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nfxn-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nfxn-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxn-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxn-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxn-k4"><rect x="80" y="430" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="nfxn-k5"><rect x="640" y="430" width="520" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Recommendation system: non-functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">How well it has to work. Targets first, then the shape of the load that follows from them.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Targets the design must hit</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#B45309">The shape of the load</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nfxn-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#nfxn-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">200M+ users</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">with over 100 million</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">active in a month</text>
  <g filter="url(#nfxn-lift)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="450" y="175" width="9" height="90" fill="#059669" clip-path="url(#nfxn-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Under 200 ms</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">for the online path, or</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">the screen feels slow</text>
  <g filter="url(#nfxn-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#nfxn-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Always available</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">it is the home screen,</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">so it cannot be blank</text>
  <g filter="url(#nfxn-soft)">
    <rect x="80" y="430" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#D97706" clip-path="url(#nfxn-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Read heavy</text>
  <text x="340" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">fetched many times a session,</text>
  <text x="340" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">written far less often</text>
  <g filter="url(#nfxn-soft)">
    <rect x="640" y="430" width="520" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="640" y="430" width="6" height="90" fill="#64748B" clip-path="url(#nfxn-k5)"/>
  </g>
  <circle cx="678" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="704" y="482" font-size="21.5" font-weight="600" fill="#111827">Experiments always on</text>
  <text x="900" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">several algorithms serving</text>
  <text x="900" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">different users at once</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Graceful fallback</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">if personalisation fails, serve popular titles; a blank home screen is the worst outcome</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Read heavy</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">the read path decides the cost, which is why results are precomputed rather than derived per request</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Cold start</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">a new account or a new title has no history, so popularity has to stand in until events arrive</text>
</svg>