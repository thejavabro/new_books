<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1146" viewBox="0 0 1240 1146" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One sentence you can say aloud for each of the five graded signals, so the evidence reaches the interviewer without a speech.">
  <defs>
    <filter id="yl03sayital-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="yl03sayital-k1"><rect x="76" y="146" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl03sayital-k2"><rect x="76" y="318" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl03sayital-k3"><rect x="76" y="490" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl03sayital-k4"><rect x="76" y="662" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl03sayital-k5"><rect x="76" y="834" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1146" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">One sentence makes each signal visible</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">five graded signals, one sentence each</text>

  
  <rect x="40" y="126" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#yl03sayital-soft)">
    <rect x="76" y="146" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#4F46E5" clip-path="url(#yl03sayital-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Caller and jobs</text>
  <text x="76" y="262" font-size="15.5" fill="#6B7280">"The primary caller is the mobile client, and its main job is to complete checkout in as few sequential calls as possible."</text>

  
  <rect x="40" y="298" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#yl03sayital-soft)">
    <rect x="76" y="318" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="318" width="6" height="90" fill="#D97706" clip-path="url(#yl03sayital-k2)"/>
  </g>
  <circle cx="114" cy="363" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,352.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="370" font-size="18.5" font-weight="600" fill="#111827">Consistency</text>
  <text x="76" y="434" font-size="15.5" fill="#6B7280">"I'll use the same identifier, pagination envelope, and error shape across these operations."</text>

  
  <rect x="40" y="470" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#yl03sayital-soft)">
    <rect x="76" y="490" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="490" width="6" height="90" fill="#4F46E5" clip-path="url(#yl03sayital-k3)"/>
  </g>
  <circle cx="114" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,524.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="542" font-size="18.5" font-weight="600" fill="#111827">Failures</text>
  <text x="76" y="606" font-size="15.5" fill="#6B7280">"Before moving on, I'll name the four failures and what the caller should do after each one."</text>

  
  <rect x="40" y="642" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#yl03sayital-soft)">
    <rect x="76" y="662" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="662" width="6" height="90" fill="#D97706" clip-path="url(#yl03sayital-k4)"/>
  </g>
  <circle cx="114" cy="707" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,696.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="714" font-size="18.5" font-weight="600" fill="#111827">Change</text>
  <text x="76" y="778" font-size="15.5" fill="#6B7280">"New response fields will be additive, and callers must ignore fields they do not understand."</text>

  
  <rect x="40" y="814" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#yl03sayital-soft)">
    <rect x="76" y="834" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="834" width="6" height="90" fill="#4F46E5" clip-path="url(#yl03sayital-k5)"/>
  </g>
  <circle cx="114" cy="879" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,868.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="140" y="886" font-size="18.5" font-weight="600" fill="#111827">Trade-offs</text>
  <text x="76" y="950" font-size="15.5" fill="#6B7280">"I chose this expanded response over separate reads to reduce mobile round trips; the cost is a larger payload."</text>

  
  <rect x="40" y="998" width="1160" height="108" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1043" text-anchor="middle" font-size="16" fill="#475569">You do not need to announce the signal by name. Say the decision.</text>
  <text x="620" y="1075" text-anchor="middle" font-size="16" fill="#475569">Each statement explains the reason for a design decision.</text>
</svg>