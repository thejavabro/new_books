<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Attempt 1 fails, the client waits 100 ms. Attempt 2 fails, it waits 200 ms. Attempt 3 fails, it waits 400 ms. Attempt 4 succeeds.">
  <defs>
    <filter id="re2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="re2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="re2-k1"><rect x="40" y="140" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="re2-k2"><rect x="350" y="140" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="re2-k3"><rect x="660" y="140" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="re2-k4"><rect x="970" y="140" width="230" height="90" rx="12"/></clipPath>
    <marker id="re2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Retries with exponential backoff</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">After each failure, the client waits twice as long before trying again.</text>



  <g fill="none" stroke-width="2">
    <path d="M270,185 H350" stroke="#2563EB" marker-end="url(#re2-m-blue)"/>
    <path d="M580,185 H660" stroke="#2563EB" marker-end="url(#re2-m-blue)"/>
    <path d="M890,185 H970" stroke="#2563EB" marker-end="url(#re2-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="310" y="173" fill="#1D4ED8">100 ms</text>
    <text x="620" y="173" fill="#1D4ED8">200 ms</text>
    <text x="930" y="173" fill="#1D4ED8">400 ms</text>
  </g>

  <g filter="url(#re2-soft)">
    <rect x="40" y="140" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#re2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Attempt 1</text>
  <text x="155" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fails: timeout</text>
  <g filter="url(#re2-soft)">
    <rect x="350" y="140" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="350" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#re2-k2)"/>
  </g>
  <circle cx="388" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="414" y="192" font-size="21.5" font-weight="600" fill="#111827">Attempt 2</text>
  <text x="465" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fails: HTTP 503</text>
  <g filter="url(#re2-soft)">
    <rect x="660" y="140" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="660" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#re2-k3)"/>
  </g>
  <circle cx="698" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="724" y="192" font-size="21.5" font-weight="600" fill="#111827">Attempt 3</text>
  <text x="775" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fails: timeout</text>
  <g filter="url(#re2-lift)">
    <rect x="970" y="140" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="970" y="140" width="9" height="90" fill="#059669" clip-path="url(#re2-k4)"/>
  </g>
  <circle cx="1008" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(997.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1034" y="192" font-size="21.5" font-weight="600" fill="#111827">Attempt 4</text>
  <text x="1085" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">succeeds</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Backoff</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">the wait doubles after each failure, so a struggling service gets room</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Jitter</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">a small random amount on each wait, so clients do not retry together</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Limits</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">stop after a few attempts, and retry only transient errors</text>
</svg>