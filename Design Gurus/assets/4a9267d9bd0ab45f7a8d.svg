<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" style="background-color:#ffffff">
<defs>
<marker id="sta" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#2f7a55"/></marker>
<marker id="stb" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#b4322c"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="26" font-size="13.5" font-weight="bold" fill="#b4322c">Without the pattern, the same conditional appears in every method</text>

<rect x="30" y="40" width="440" height="108" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="46" y="62" font-family="monospace" font-size="11.5">void pay() {</text>
<text x="46" y="80" font-family="monospace" font-size="11.5">  if (status == TRIALING) { ... }</text>
<text x="46" y="98" font-family="monospace" font-size="11.5">  else if (status == ACTIVE) { ... }</text>
<text x="46" y="116" font-family="monospace" font-size="11.5">  else if (status == PAST_DUE) { ... }</text>
<text x="46" y="134" font-family="monospace" font-size="11.5">  else if (status == CANCELLED) { ... }</text>

<text x="500" y="62" font-size="12.5" fill="#b4322c">The same four branches appear again in</text>
<text x="500" y="80" font-size="12.5" fill="#b4322c">cancel(), and again in missPayment().</text>
<text x="500" y="106" font-size="12.5" fill="#b4322c">Adding a fifth state means finding every</text>
<text x="500" y="124" font-size="12.5" fill="#b4322c">one of them. Miss a branch and the object</text>
<text x="500" y="142" font-size="12.5" fill="#b4322c">silently does nothing.</text>

<line x1="30" y1="172" x2="930" y2="172" stroke="#dbe2ed"/>

<text x="30" y="200" font-size="13.5" font-weight="bold" fill="#2f7a55">With the pattern, each state is a class, and the transitions are the design</text>

<path d="M 105 258 L 105 222 L 775 222 L 775 256" stroke="#2f7a55" fill="none" marker-end="url(#sta)"/>
<text x="380" y="216" font-size="11" fill="#2f7a55">cancel()</text>

<path d="M 315 258 L 315 244 L 742 244 L 742 256" stroke="#2f7a55" fill="none" marker-end="url(#sta)"/>
<text x="600" y="238" font-size="11" fill="#2f7a55">cancel()</text>

<rect x="40" y="260" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="105" y="286" text-anchor="middle" font-size="12">trialing</text>

<rect x="250" y="260" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="315" y="286" text-anchor="middle" font-size="12">active</text>

<rect x="460" y="260" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="525" y="286" text-anchor="middle" font-size="12">past_due</text>

<rect x="695" y="260" width="130" height="42" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="760" y="286" text-anchor="middle" font-size="12">cancelled</text>

<path d="M 174 281 L 245 281" stroke="#2f7a55" fill="none" marker-end="url(#sta)"/>
<text x="180" y="274" font-size="11" fill="#2f7a55">pay()</text>

<path d="M 384 275 L 455 275" stroke="#2f7a55" fill="none" marker-end="url(#sta)"/>
<text x="386" y="254" font-size="11" fill="#2f7a55">missPayment()</text>

<path d="M 525 306 L 525 336 L 315 336 L 315 306" stroke="#2f7a55" fill="none" marker-end="url(#sta)"/>
<text x="392" y="350" font-size="11" fill="#2f7a55">pay()</text>

<path d="M 594 288 L 690 288" stroke="#2f7a55" fill="none" marker-end="url(#sta)"/>
<text x="600" y="304" font-size="11" fill="#2f7a55">cancel()</text>

<path d="M 795 306 L 830 306 L 830 330 L 760 330 L 760 306" stroke="#b4322c" fill="none" marker-end="url(#stb)"/>
<text x="700" y="348" font-size="11" fill="#b4322c">pay(), cancel(): rejected</text>

<rect x="30" y="384" width="900" height="70" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="408" font-size="12.5" fill="#414d60">Each box is a class, and the arrows are the only transitions that exist. Everything not drawn here is refused, in one predictable way.</text>
<text x="52" y="430" font-size="12.5" fill="#414d60">The cost: this graph is now spread across four files, so the whole machine is harder to see at once than one enum and one switch.</text>
</g>
</svg>