<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Static files such as images, CSS, scripts, video, and fonts go on the CDN. Public pages that are the same for everyone can go on the CDN with a short lifetime. Personalized responses such as dashboards and carts stay at the origin and are marked private. Data that must stay in one country also stays at the origin.">
  <defs>
    <filter id="cvd4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cvd4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cvd4-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cvd4-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cvd4-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="cvd4-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Decide for each type of response</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Most sites use a CDN for some content and the origin for the rest.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#cvd4-lift)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="140" width="9" height="90" fill="#059669" clip-path="url(#cvd4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Static files</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">images, CSS, scripts,</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">video: use the CDN</text>
  <g filter="url(#cvd4-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#cvd4-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Public pages</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">same for everyone:</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">CDN, short lifetime</text>
  <g filter="url(#cvd4-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#D97706" clip-path="url(#cvd4-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Personalized</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">dashboards, carts:</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">origin, private</text>
  <g filter="url(#cvd4-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#cvd4-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Local-only data</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">legal rules:</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">origin only</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">CDN</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">content that is the same for many users and changes rarely</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Origin</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">content that differs per user, or must stay in one place</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Direct only</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">fine for one region, low traffic, or mostly personalized sites</text>
</svg>