<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566" role="img" aria-label="How much of the keyspace 30 billion stored links occupy. With six base62 characters there are 56.8 billion possible keys and 53 percent of them are in use, so a random guess finds a working link about one time in two. Seven characters give 3.5 trillion keys and 0.9 percent occupancy, one hit in 117 guesses. Eight characters give 218 trillion keys and 0.014 percent occupancy, one hit in 7,278 guesses.">
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.09"/></filter>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.20"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DB2777"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>
  <rect width="1240" height="566" fill="#FFFFFF"/>
  <text x="601" y="56" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">share of the keyspace that 30 billion links occupy</text>
  <rect x="40" y="76" width="1160" height="100" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M40 90 a14 14 0 0 1 14 -14 h0 v100 h0 a14 14 0 0 1 -14 -14 z" fill="#DC2626"/>
  <text x="76" y="118" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">6 characters</text>
  <text x="76" y="150" font-size="19" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">56.8 billion keys</text>
  <path d="M318 110 l18 18 M336 110 l-18 18" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <rect x="366" y="110" width="470" height="32" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="366" y="110" width="248" height="32" rx="9" fill="#DC2626" opacity="0.92"/>
  <text x="490" y="132" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">53% in use</text>
  <text x="1180" y="120" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a random guess hits</text>
  <text x="1180" y="152" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 in 2</text>
  <rect x="40" y="198" width="1160" height="100" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M40 212 a14 14 0 0 1 14 -14 h0 v100 h0 a14 14 0 0 1 -14 -14 z" fill="#059669"/>
  <text x="76" y="240" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">7 characters</text>
  <text x="76" y="272" font-size="19" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">3.5 trillion keys</text>
  <path d="M316 242 l7 8 l15 -17" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="366" y="232" width="470" height="32" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="366" y="232" width="4" height="32" rx="2" fill="#059669" opacity="0.92"/>
  <text x="384" y="254" font-size="18" font-weight="700" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">0.9% in use</text>
  <text x="1180" y="242" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a random guess hits</text>
  <text x="1180" y="274" font-size="22" font-weight="700" fill="#047857" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 in 117</text>
  <rect x="40" y="320" width="1160" height="100" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M40 334 a14 14 0 0 1 14 -14 h0 v100 h0 a14 14 0 0 1 -14 -14 z" fill="#059669"/>
  <text x="76" y="362" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">8 characters</text>
  <text x="76" y="394" font-size="19" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">218 trillion keys</text>
  <path d="M316 364 l7 8 l15 -17" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="366" y="354" width="470" height="32" rx="9" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.4"/>
  <rect x="366" y="354" width="3" height="32" rx="1.5" fill="#059669" opacity="0.92"/>
  <text x="383" y="376" font-size="18" font-weight="700" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">0.014% in use</text>
  <text x="1180" y="364" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a random guess hits</text>
  <text x="1180" y="396" font-size="22" font-weight="700" fill="#047857" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 in 7,278</text>
  <rect x="40" y="452" width="1160" height="74" rx="13" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="620" y="483" font-size="20" font-weight="600" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Six characters is the classic answer, and it breaks the "not guessable" requirement without anyone noticing.</text>
  <text x="620" y="509" font-size="20" font-weight="600" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Seven is the shortest length that does not.</text>
</svg>