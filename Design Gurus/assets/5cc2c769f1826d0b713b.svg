<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Step 1, one machine runs everything. Step 2, scale up to a bigger machine. Step 3, scale the application tier out with stateless servers, a load balancer, and read replicas. Step 4, shard the database only when writes outgrow the biggest primary.">
  <defs>
    <filter id="hzv5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="hzv5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="hzv5-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="hzv5-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="hzv5-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="hzv5-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="hzv5-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The usual scaling path</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Most growing systems use both kinds of scaling, in this order.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#hzv5-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#hzv5-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#hzv5-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#hzv5-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#hzv5-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">1. One machine</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">app and database</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">together</text>
  <g filter="url(#hzv5-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#hzv5-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">2. Scale up</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">a bigger machine,</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">no code changes</text>
  <g filter="url(#hzv5-lift)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="646" y="140" width="9" height="90" fill="#059669" clip-path="url(#hzv5-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">3. App tier out</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">stateless servers,</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">read replicas</text>
  <g filter="url(#hzv5-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#hzv5-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">4. Shard</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">only when writes</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">outgrow the primary</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Scale up first</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">it is fast and needs no engineering work</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Plan to scale out</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">keep servers stateless from the first day, even with one server</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Shard last</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">it scales writes, but it is the most expensive step</text>
</svg>