<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="638" viewBox="0 0 1240 638" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="boundary-title boundary-desc">
<title id="boundary-title">Where the guarantee stops</title>
<desc id="boundary-desc">Kafka transactions cover reads, processing and writes that stay inside Kafka. Any effect that leaves the broker, such as a database row, a payment or an email, is outside the transaction and needs its own idempotence.</desc>
<defs>
<marker id="boundary-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="boundary-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="boundary-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="boundary-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="638" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where the guarantee stops</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The guarantee ends at the edge of Kafka, and that edge is where most real work happens.</text>
<rect x="40" y="560" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="560" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="40" y="118" width="560" height="286" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V398A6 6 0 0 0 46 404H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Inside the transaction</text>
<rect x="72" y="174" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">read from a Kafka topic</text>
<path d="M322 224V250" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M322 224V250" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundary-marker-green)"/>
<rect x="72" y="254" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="283" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">process</text>
<path d="M322 304V330" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M322 304V330" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundary-marker-green)"/>
<rect x="72" y="334" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="363" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">write to a Kafka topic + commit offset</text>
<rect x="640" y="118" width="560" height="286" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V398A6 6 0 0 0 646 404H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Outside it, and unprotected</text>
<rect x="672" y="174" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a row written to Postgres</text>
<rect x="672" y="226" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="255" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a charge at a payment provider</text>
<rect x="672" y="278" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">an email handed to a mail server</text>
<rect x="672" y="330" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="359" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a call to a service you do not own</text>
<path d="M620 118V404" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="40" y="428" width="1160" height="106" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="428" width="5" height="106" rx="2.5" fill="#F3CF6A"/><text x="64" y="461" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A transaction cannot roll back anything on the right.</text><text x="64" y="487" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A pipeline that consumes an order event and inserts a database row</text><text x="64" y="513" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">gets no protection from Kafka transactions at all.</text>
<text x="66" y="594" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The uncovered part of the system is usually the part that touches money.</text>
</svg>