<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="828" viewBox="0 0 1240 828" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Synchronous replication acknowledges the write only after a replica confirms it, adding a round trip to every write, while asynchronous replication acknowledges immediately and replicates afterwards">
  <rect x="0" y="0" width="1240" height="828" fill="#FFFFFF"/>
  <defs>
    <marker id="db5-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="db5-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="db5-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="db5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The whole difference is where the acknowledgement comes from</text>

  
  <rect x="40" y="76" width="1160" height="290" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#1E40AF">Synchronous: the primary waits for the replica before it answers</text>

  <text x="365" y="163" font-size="20" fill="#1E40AF" text-anchor="middle">1. write</text>
  <line x1="294" y1="185" x2="432" y2="185" stroke="#3B82F6" stroke-width="2" marker-end="url(#db5-blue)"/>
  <text x="735" y="163" font-size="20" fill="#1E40AF" text-anchor="middle">2. replicate</text>
  <line x1="664" y1="185" x2="802" y2="185" stroke="#3B82F6" stroke-width="2" marker-end="url(#db5-blue)"/>
  <line x1="806" y1="225" x2="668" y2="225" stroke="#059669" stroke-width="2" marker-end="url(#db5-emerald)"/>
  <text x="735" y="264" font-size="20" fill="#065F46" text-anchor="middle">3. applied</text>
  <line x1="436" y1="225" x2="298" y2="225" stroke="#059669" stroke-width="2" marker-end="url(#db5-emerald)"/>
  <text x="365" y="264" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">4. commit ok</text>

  <g filter="url(#db5-soft)">
    <rect x="90" y="170" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="440" y="170" width="220" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="810" y="170" width="200" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="190" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="550" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Primary</text>
  <text x="910" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica</text>

  <text x="620" y="306" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">The client waits for the round trip to the replica: about 12 ms.</text>
  <text x="620" y="336" font-size="20" fill="#334155" text-anchor="middle">If the replica is slow or far away, every write slows down.</text>

  
  <rect x="40" y="386" width="1160" height="290" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="420" font-size="20" font-weight="600" fill="#92400E">Asynchronous: the primary answers first and replicates afterwards</text>

  <text x="365" y="473" font-size="20" fill="#92400E" text-anchor="middle">1. write</text>
  <line x1="294" y1="495" x2="432" y2="495" stroke="#D97706" stroke-width="2" marker-end="url(#db5-amber)"/>
  <text x="735" y="473" font-size="20" fill="#92400E" text-anchor="middle">3. replicate, later</text>
  <line x1="664" y1="515" x2="802" y2="515" stroke="#D97706" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#db5-amber)"/>
  <line x1="436" y1="535" x2="298" y2="535" stroke="#059669" stroke-width="2" marker-end="url(#db5-emerald)"/>
  <text x="365" y="574" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">2. commit ok</text>

  <g filter="url(#db5-soft)">
    <rect x="90" y="480" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="440" y="480" width="220" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="810" y="480" width="200" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="190" y="522" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="550" y="522" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Primary</text>
  <text x="910" y="522" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica</text>

  <text x="620" y="616" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">The client waits only for the primary: about 4 ms.</text>
  <text x="620" y="646" font-size="20" fill="#334155" text-anchor="middle">The replica is behind by however long the replication takes.</text>

  
  <rect x="40" y="706" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="742" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The only real difference is where the acknowledgement happens.</text>
  <text x="620" y="772" font-size="20" fill="#334155" text-anchor="middle">Synchronous buys a replica that is never behind, and pays for it on every single write.</text>
</svg>