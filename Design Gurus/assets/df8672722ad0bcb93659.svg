<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three stacked layers: the presentation layer handles HTTP, validates input, authenticates the request and formats the response; it calls down to the business logic layer, which implements business rules, coordinates components, validates business constraints and orchestrates use cases; that calls down to the data access layer, which queries the database, maps data to domain models and hides storage details">
  <defs>
    <filter id="m02a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m02a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m02a-k1"><rect x="40" y="130" width="540" height="140" rx="12"/></clipPath>
    <clipPath id="m02a-k2"><rect x="40" y="380" width="540" height="140" rx="12"/></clipPath>
    <clipPath id="m02a-k3"><rect x="40" y="630" width="540" height="140" rx="12"/></clipPath>
    <marker id="m02a-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1010" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Layered architecture: the three-layer model</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each layer calls only the layer directly below it, and the data access layer alone reaches the database.</text>

  <rect x="620" y="130" width="580" height="140" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="644" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8"></text>
  <rect x="620" y="380" width="580" height="140" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="644" y="410" font-size="19.5" font-weight="600" fill="#047857"></text>
  <rect x="620" y="630" width="580" height="140" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="644" y="660" font-size="19.5" font-weight="600" fill="#5B21B6"></text>

  <g fill="none" stroke-width="2">
    <path d="M120,270 V380" stroke="#2563EB" marker-end="url(#m02a-m-blue)"/>
    <path d="M120,520 V630" stroke="#2563EB" marker-end="url(#m02a-m-blue)"/>
    <path d="M120,770 V854" stroke="#2563EB" marker-end="url(#m02a-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="136" y="336" fill="#1D4ED8" text-anchor="start">Calls down</text>
    <text x="136" y="586" fill="#1D4ED8" text-anchor="start">Calls down</text>
  </g>

  <g filter="url(#m02a-soft)">
    <rect x="40" y="130" width="540" height="140" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="140" fill="#2563EB" clip-path="url(#m02a-k1)"/>
  </g>
  <circle cx="78" cy="200" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,189.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="104" y="207" font-size="21.5" font-weight="600" fill="#111827">Presentation layer</text>
  <text x="310" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">controllers, API handlers, views</text>
  <g filter="url(#m02a-soft)">
    <rect x="40" y="380" width="540" height="140" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="380" width="6" height="140" fill="#059669" clip-path="url(#m02a-k2)"/>
  </g>
  <circle cx="78" cy="450" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,439.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="104" y="457" font-size="21.5" font-weight="600" fill="#111827">Business logic layer</text>
  <text x="310" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">domain rules, use cases, validation</text>
  <g filter="url(#m02a-soft)">
    <rect x="40" y="630" width="540" height="140" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="630" width="6" height="140" fill="#7C3AED" clip-path="url(#m02a-k3)"/>
  </g>
  <circle cx="78" cy="700" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,689.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="104" y="707" font-size="21.5" font-weight="600" fill="#111827">Data access layer</text>
  <text x="310" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">repositories, ORM</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M40,870 L40,954 A80,16 0 0 0 200,954 L200,870" fill="#DBEAFE"/>
    <ellipse cx="120" cy="870" rx="80" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="120" y="927" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>

  <circle cx="650" cy="160" r="3.5" fill="#2563EB"/>
  <text x="666" y="166" font-size="18.5" fill="#1F2937">Handle HTTP requests and responses</text>
  <circle cx="650" cy="187" r="3.5" fill="#2563EB"/>
  <text x="666" y="193" font-size="18.5" fill="#1F2937">Validate input</text>
  <circle cx="650" cy="214" r="3.5" fill="#2563EB"/>
  <text x="666" y="220" font-size="18.5" fill="#1F2937">Authenticate the request</text>
  <circle cx="650" cy="241" r="3.5" fill="#2563EB"/>
  <text x="666" y="247" font-size="18.5" fill="#1F2937">Format the response</text>
  <circle cx="650" cy="410" r="3.5" fill="#059669"/>
  <text x="666" y="416" font-size="18.5" fill="#1F2937">Implement business rules</text>
  <circle cx="650" cy="437" r="3.5" fill="#059669"/>
  <text x="666" y="443" font-size="18.5" fill="#1F2937">Coordinate between components</text>
  <circle cx="650" cy="464" r="3.5" fill="#059669"/>
  <text x="666" y="470" font-size="18.5" fill="#1F2937">Validate business constraints</text>
  <circle cx="650" cy="491" r="3.5" fill="#059669"/>
  <text x="666" y="497" font-size="18.5" fill="#1F2937">Orchestrate use cases</text>
  <circle cx="650" cy="660" r="3.5" fill="#7C3AED"/>
  <text x="666" y="666" font-size="18.5" fill="#1F2937">Interact with the database</text>
  <circle cx="650" cy="687" r="3.5" fill="#7C3AED"/>
  <text x="666" y="693" font-size="18.5" fill="#1F2937">Execute queries (ORM/SQL)</text>
  <circle cx="650" cy="714" r="3.5" fill="#7C3AED"/>
  <text x="666" y="720" font-size="18.5" fill="#1F2937">Map data to domain models</text>
  <circle cx="650" cy="741" r="3.5" fill="#7C3AED"/>
  <text x="666" y="747" font-size="18.5" fill="#1F2937">Hide data storage details</text>


</svg>