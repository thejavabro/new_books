<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Prime Video&#39;s merge: a distributed pipeline with an orchestrator, frame splitting, two intermediate storage trips, defect detectors, and aggregation, replaced by one process that splits, detects, and aggregates in memory">
  <defs>
    <marker id="m01-l05-prime-video-merge-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m01-l05-prime-video-merge-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m01-l05-prime-video-merge-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="1020" fill="#FFFFFF"/>

  
  <rect x="40" y="70" width="440" height="856" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="108" font-size="20" font-weight="600" fill="#92400E">Before: distributed pipeline</text>

  <rect x="560" y="300" width="640" height="400" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="582" y="338" font-size="20" font-weight="600" fill="#065F46">After: one process</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M260,240 L260,290" stroke="#D97706" marker-end="url(#m01-l05-prime-video-merge-am)"/>
    <path d="M260,360 L260,410" stroke="#D97706" marker-end="url(#m01-l05-prime-video-merge-am)"/>
    <path d="M260,508 L260,558" stroke="#D97706" marker-end="url(#m01-l05-prime-video-merge-am)"/>
    <path d="M260,628 L260,678" stroke="#D97706" marker-end="url(#m01-l05-prime-video-merge-am)"/>
    <path d="M260,776 L260,826" stroke="#D97706" marker-end="url(#m01-l05-prime-video-merge-am)"/>
    <path d="M495,465 L600,465" stroke="#059669" stroke-width="3.5" marker-end="url(#m01-l05-prime-video-merge-em)"/>
  </g>

  
  <g font-size="20" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="278" y="392" fill="#92400E">write frames</text>
    <text x="278" y="540" fill="#92400E">read frames back</text>
    <text x="278" y="660" fill="#92400E">write again</text>
    <text x="278" y="808" fill="#92400E">read again</text>
  </g>

  
  <g filter="url(#m01-l05-prime-video-merge-soft)">
    <rect x="110" y="140" width="300" height="100" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="260" y="182" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orchestrator</text>
  <text x="260" y="212" text-anchor="middle" font-size="20" fill="#64748B">coordinates all the pieces</text>

  <g filter="url(#m01-l05-prime-video-merge-soft)">
    <rect x="100" y="290" width="320" height="70" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="260" y="332" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Split video into frames</text>

  <g filter="url(#m01-l05-prime-video-merge-soft)">
    <path d="M90,428 L90,490 A170,18 0 0 0 430,490 L430,428" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="260" cy="428" rx="170" ry="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="260" y="473" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Intermediate storage</text>

  <g filter="url(#m01-l05-prime-video-merge-soft)">
    <rect x="100" y="558" width="320" height="70" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="260" y="600" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Defect detectors</text>

  <g filter="url(#m01-l05-prime-video-merge-soft)">
    <path d="M90,696 L90,758 A170,18 0 0 0 430,758 L430,696" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="260" cy="696" rx="170" ry="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="260" y="741" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Intermediate storage again</text>

  <g filter="url(#m01-l05-prime-video-merge-soft)">
    <rect x="100" y="826" width="320" height="70" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="260" y="868" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Aggregate results</text>

  
  <g filter="url(#m01-l05-prime-video-merge-soft)">
    <rect x="610" y="400" width="540" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="880" y="444" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Split, detect, and aggregate</text>
  <text x="880" y="474" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">in memory</text>
  <text x="880" y="506" text-anchor="middle" font-size="20" fill="#64748B">frames never leave the process</text>

  <text x="880" y="588" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">90% infrastructure cost reduction</text>
  <text x="880" y="626" text-anchor="middle" font-size="20" fill="#065F46">No data moves between components.</text>

  
  <g stroke-width="4">
    <line x1="40" y1="975" x2="74" y2="975" stroke="#D97706"/>
    <line x1="640" y1="975" x2="674" y2="975" stroke="#059669"/>
  </g>
  <text x="84" y="982" font-size="20" fill="#475569">Data moving between components, paid for per trip</text>
  <text x="684" y="982" font-size="20" fill="#475569">Merge into a single process</text>
</svg>