<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="748" viewBox="0 0 1240 748" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="depth-title depth-desc">
<title id="depth-title">You drew it, so you own it</title>
<desc id="depth-desc">Drawing a queue invites three layers of follow-up: what happens when a consumer fails, when it fails repeatedly, and what happens to ordering meanwhile. Each layer is fair, and each is where a recited design stops having answers.</desc>
<defs>
<marker id="depth-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="depth-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="depth-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="depth-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="748" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">You drew it, so you own it</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three follow-ups is the usual depth, and every box you draw invites them.</text>
<rect x="40" y="670" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="670" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="470" y="118" width="300" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="154" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">You drew a queue</text>
<path d="M620 178V200" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 178V200" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#depth-marker-slate)"/>
<rect x="240" y="206" width="760" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What happens when a consumer fails?</text>
<text x="1024" y="243" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">level 1</text>
<path d="M620 268V290" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 268V290" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#depth-marker-slate)"/>
<rect x="240" y="296" width="760" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What happens when it fails repeatedly?</text>
<text x="1024" y="333" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">level 2</text>
<path d="M620 358V380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 358V380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#depth-marker-slate)"/>
<rect x="240" y="386" width="760" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="422" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What happens to ordering while that is going on?</text>
<text x="1024" y="423" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">level 3</text>
<rect x="40" y="474" width="1160" height="170" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="620" y="510" font-size="23" font-weight="700" fill="#6040A8" text-anchor="middle">Every box is a promise that you can go three levels down</text>
<rect x="70" y="532" width="500" height="84" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="566.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A smaller design you</text><text x="320" y="593.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">understand completely</text>
<text x="620" y="581" font-size="21" font-weight="700" fill="#6040A8" text-anchor="middle">beats</text>
<rect x="670" y="532" width="500" height="84" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="566.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A larger one you cannot defend</text><text x="920" y="593.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">under three questions</text>
<text x="66" y="704" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Do not put a component on the board to look thorough. It is a promise, not decoration.</text>
</svg>