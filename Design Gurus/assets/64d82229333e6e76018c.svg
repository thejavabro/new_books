<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="808" viewBox="0 0 1240 808" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="timeline-title timeline-desc">
<title id="timeline-title">Where the fifty-two minutes went</title>
<desc id="timeline-desc">The failover mechanism was thirteen percent of the outage. The rest was everything around it, which is the part nobody rehearses.</desc>
<defs>
<marker id="timeline-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="timeline-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="timeline-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="timeline-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="808" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where the fifty-two minutes went</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The failover mechanism was thirteen percent of the outage.</text>
<rect x="40" y="730" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="730" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="125" y="140" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">clock</text>
<text x="240" y="140" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what is happening</text>
<text x="940" y="140" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">minutes</text>
<rect x="40" y="156" width="170" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="125" y="185" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">02:14</text>
<text x="240" y="186" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">the region starts failing</text>
<rect x="40" y="208" width="170" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="125" y="237" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">02:19</text>
<text x="240" y="238" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">detection</text>
<rect x="840" y="217" width="200" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="217" width="66.7" height="28" rx="10" fill="#F25461"/>
<text x="1190" y="238" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">5 min</text>
<rect x="40" y="260" width="170" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="125" y="289" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">02:23</text>
<text x="240" y="290" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">escalation, somebody is awake</text>
<rect x="840" y="269" width="200" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="269" width="53.3" height="28" rx="10" fill="#E8BC60"/>
<text x="1190" y="290" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">4 min</text>
<rect x="40" y="312" width="170" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="125" y="341" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">02:31</text>
<text x="240" y="342" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">diagnosis and the decision</text>
<rect x="840" y="321" width="200" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="321" width="106.7" height="28" rx="10" fill="#F25461"/>
<text x="1190" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">8 min</text>
<rect x="40" y="364" width="170" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="125" y="393" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">02:38</text>
<text x="240" y="394" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">the failover is executed</text>
<rect x="840" y="373" width="200" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="373" width="93.3" height="28" rx="10" fill="#06AC80"/>
<text x="1190" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">7 min</text>
<rect x="40" y="416" width="170" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="125" y="445" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">02:53</text>
<text x="240" y="446" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">routing has propagated</text>
<rect x="840" y="425" width="200" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="425" width="200.0" height="28" rx="10" fill="#7650D6"/>
<text x="1190" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">15 min</text>
<rect x="40" y="468" width="170" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="125" y="497" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">03:06</text>
<text x="240" y="498" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">the secondary is stable</text>
<rect x="840" y="477" width="200" height="28" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="477" width="173.3" height="28" rx="10" fill="#E8BC60"/>
<text x="1190" y="498" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">13 min</text>
<rect x="40" y="538" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="538" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="571" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Seven of the fifty-two minutes were the failover mechanism</text><text x="64" y="597" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The other forty-five were detection, human coordination, a decision, propagation and capacity.</text>
<rect x="40" y="642" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="642" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="679" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Teams rehearse the seven, because that is the part that looks like engineering.</text>
<text x="66" y="764" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The forty-five minutes are where the recovery objective is actually lost.</text>
</svg>