<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A forward proxy sits next to the clients inside an office network. Every request from the clients goes through it before reaching the internet, so it can filter, log, cache and require a sign in.">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="px1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="px1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="px1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="px1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="px1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="px1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="px1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="px1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="px1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A forward proxy stands next to the clients and works for them</text>
  <rect x="40" y="78" width="340" height="266" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="210" y="112" font-size="19" fill="#64748B" text-anchor="middle">the office network</text>
  <g filter="url(#px1-soft)"><rect x="90" y="140" width="190" height="54" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="185" y="174" font-size="19" fill="#0F172A" text-anchor="middle">client 1</text>
  <line x1="284" y1="167" x2="456" y2="210" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#px1-s)"/>
  <g filter="url(#px1-soft)"><rect x="90" y="208" width="190" height="54" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="185" y="242" font-size="19" fill="#0F172A" text-anchor="middle">client 2</text>
  <line x1="284" y1="235" x2="456" y2="210" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#px1-s)"/>
  <g filter="url(#px1-soft)"><rect x="90" y="276" width="190" height="54" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="185" y="310" font-size="19" fill="#0F172A" text-anchor="middle">client 3</text>
  <line x1="284" y1="303" x2="456" y2="210" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#px1-s)"/>
  <g filter="url(#px1-soft)"><rect x="460" y="154" width="220" height="112" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="570" y="196" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">forward</text>
  <text x="570" y="226" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">proxy</text>
  <line x1="684" y1="210" x2="806" y2="210" stroke="#D97706" stroke-width="2.2" marker-end="url(#px1-a)"/>
  <g filter="url(#px1-soft)"><rect x="810" y="168" width="220" height="84" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="920" y="218" font-size="20" fill="#1E40AF" text-anchor="middle">the internet</text>
  <text x="1060" y="168" font-size="18" fill="#64748B" text-anchor="start">The outside</text>
  <text x="1060" y="194" font-size="18" fill="#64748B" text-anchor="start">server sees the</text>
  <text x="1060" y="220" font-size="18" fill="#64748B" text-anchor="start">proxy, not the</text>
  <text x="1060" y="246" font-size="18" fill="#64748B" text-anchor="start">individual user.</text>
  <rect x="40" y="358" width="1160" height="44" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="386" font-size="19" fill="#64748B" text-anchor="middle">It can block sites, log requests, keep one shared copy of a file, and require a sign in.</text>
</svg>