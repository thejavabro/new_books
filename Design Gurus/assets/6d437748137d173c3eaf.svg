    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="470" fill="#FFFFFF"/>
  <text x="620" y="46" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">"Design a Twitter-like service"</text>
  <rect x="40" y="84" width="560" height="216" rx="10" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="62" y="68" width="108" height="32" rx="8" fill="#FFFFFF"/>
  <text x="116" y="91" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">In scope</text>
  <rect x="76" y="132" width="488" height="44" rx="9" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <path d="M96 149 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="162" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Post a tweet</text>
