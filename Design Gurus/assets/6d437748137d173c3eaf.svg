  <path d="M96 203 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="216" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Follow another user</text>
  <rect x="76" y="240" width="488" height="44" rx="9" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <path d="M96 257 l6 7 l13 -15" fill="none" stroke="#065F46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="130" y="270" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">See a home timeline</text>
  <rect x="640" y="84" width="560" height="216" rx="10" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="662" y="68" width="174" height="32" rx="8" fill="#FFFFFF"/>
  <text x="749" y="91" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Explicitly out</text>
  <rect x="676" y="132" width="488" height="44" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M696 140 l16 16 M712 140 l-16 16" fill="none" stroke="#FCA5A5" stroke-width="2.6" stroke-linecap="round"/>
  <text x="730" y="162" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Search</text>
  <rect x="676" y="186" width="488" height="44" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M696 194 l16 16 M712 194 l-16 16" fill="none" stroke="#FCA5A5" stroke-width="2.6" stroke-linecap="round"/>
  <text x="730" y="216" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Direct messages</text>
  <rect x="676" y="240" width="488" height="44" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M696 248 l16 16 M712 248 l-16 16" fill="none" stroke="#FCA5A5" stroke-width="2.6" stroke-linecap="round"/>
  <text x="730" y="270" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Trending topics</text>
  <rect x="40" y="336" width="1160" height="100" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="372" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Then the numbers: 200M daily users, a hundred reads per write, p99 under 200 ms.</text>
  <text x="70" y="404" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Saying what you are leaving out is the part that earns the marks. It is also your only chance to be redirected early.</text>
</svg>