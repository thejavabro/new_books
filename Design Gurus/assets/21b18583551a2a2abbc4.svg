<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated live chat architecture: gateway ingestion, hierarchical relay tree fan out, asynchronous persistence and load shedding">
  <defs>
    <filter id="tc-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="tc-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="tc-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="tc-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="tc-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="tc-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Live chat: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">A relay tree for the fan out, and deliberate message dropping so browsers survive</text>

  <rect x="24" y="96" width="1192" height="166" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Send · the gateway is a pipe, the chat service is the brain</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#tc-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">send</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#tc-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">forward</text>
  <g filter="url(#tc-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Viewer</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">holds a socket</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Gateway</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">50k sockets each</text>
  <text x="1040" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Chat Service</text>
  <text x="1040" y="216" font-size="20" fill="#64748B" text-anchor="middle">sanitise and limit</text>

  <rect x="24" y="292" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="324" font-size="20" font-weight="600" fill="#475569">2. Fan out · 10,000 in becomes 10 billion out, so no node does it alone</text>
  <path d="M264,390 L349,390" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#tc-blue)"/>
  <text x="307" y="378" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>
  <path d="M577,390 L662,390" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#tc-blue)"/>
  <text x="620" y="378" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">split</text>
  <path d="M890,390 L975,390" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#tc-blue)"/>
  <text x="933" y="378" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">deliver</text>
  <g filter="url(#tc-soft)">
    <rect x="40" y="352" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,367 L353,413 A110,15 0 0 0 573,413 L573,367" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="367" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <path d="M666,367 L666,413 A110,15 0 0 0 886,413 L886,367" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="776" cy="367" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="979" y="352" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="386" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Chat Service</text>
  <text x="150" y="412" font-size="20" fill="#64748B" text-anchor="middle">publishes once</text>
  <text x="463" y="401" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Root broker</text>
  <text x="463" y="458" font-size="20" fill="#92400E" text-anchor="middle">never fans out alone</text>
  <text x="776" y="401" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Relays</text>
  <text x="776" y="458" font-size="20" fill="#92400E" text-anchor="middle">10 of them, then 100</text>
  <text x="1089" y="386" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Gateways</text>
  <text x="1089" y="412" font-size="20" fill="#64748B" text-anchor="middle">local socket lookup</text>

  <rect x="24" y="534" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="566" font-size="20" font-weight="600" fill="#92400E">3. Persistence (asynchronous) · history is never dropped, even when live is</text>
  <path d="M264,632 L349,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#tc-amber)"/>
  <text x="307" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fork</text>
  <path d="M577,632 L662,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#tc-amber)"/>
  <text x="620" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>
  <path d="M890,632 L975,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#tc-amber)"/>
  <text x="933" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">insert</text>
  <g filter="url(#tc-soft)">
    <rect x="40" y="594" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,609 L353,655 A110,15 0 0 0 573,655 L573,609" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="609" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="594" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,609 L979,655 A110,15 0 0 0 1199,655 L1199,609" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="609" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Chat Service</text>
  <text x="150" y="654" font-size="20" fill="#64748B" text-anchor="middle">forks the message</text>
  <text x="463" y="643" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="463" y="700" font-size="20" fill="#92400E" text-anchor="middle">the cold path</text>
  <text x="776" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Worker</text>
  <text x="776" y="654" font-size="20" fill="#64748B" text-anchor="middle">batches of 100</text>
  <text x="1089" y="643" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cassandra</text>
  <text x="1089" y="700" font-size="20" fill="#5B21B6" text-anchor="middle">channel plus hour bucket</text>

  <rect x="24" y="776" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="808" font-size="20" font-weight="600" fill="#475569">4. Survival · the bottleneck is the browser, not the server</text>
  <path d="M364,874 L456,874" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#tc-blue)"/>
  <text x="410" y="862" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">history</text>
  <path d="M784,874 L876,874" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#tc-blue)"/>
  <text x="830" y="862" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">slow user</text>
  <g filter="url(#tc-soft)">
    <rect x="40" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M460,851 L460,897 A160,15 0 0 0 780,897 L780,851" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="851" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shedding</text>
  <text x="200" y="896" font-size="20" fill="#64748B" text-anchor="middle">drops 90% of live</text>
  <text x="620" y="885" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis list</text>
  <text x="620" y="942" font-size="20" fill="#065F46" text-anchor="middle">last 50 on join</text>
  <text x="1040" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Drop head</text>
  <text x="1040" y="896" font-size="20" fill="#64748B" text-anchor="middle">newest wins</text>
  <line x1="44" y1="1048" x2="72" y2="1048" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1055" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1048" x2="344.576" y2="1048" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1055" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1039" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1055" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1039" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1055" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1039" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1055" font-size="20" fill="#475569">core service</text>
</svg>