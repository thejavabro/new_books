<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The DNS server for example.com has three A records. Query 1 gets 203.0.113.10 first, query 2 gets 203.0.113.11 first, and query 3 gets 203.0.113.12 first, so requests spread across servers A, B, and C.">
  <defs>
    <filter id="dl1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dl1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="dl1-k1"><rect x="40" y="290" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="dl1-k2"><rect x="700" y="140" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="dl1-k3"><rect x="700" y="290" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="dl1-k4"><rect x="700" y="440" width="500" height="90" rx="12"/></clipPath>
    <marker id="dl1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Round-robin DNS</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One name, three addresses. Each query receives the next address first.</text>



  <g fill="none" stroke-width="2">
    <path d="M370,315 H520 Q535,315 535,300 V200 Q535,185 550,185 H700" stroke="#64748B" marker-end="url(#dl1-m-slate)"/>
    <path d="M370,335 H700" stroke="#64748B" marker-end="url(#dl1-m-slate)"/>
    <path d="M370,355 H520 Q535,355 535,370 V470 Q535,485 550,485 H700" stroke="#64748B" marker-end="url(#dl1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#dl1-soft)">
    <rect x="40" y="290" width="330" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#7C3AED" clip-path="url(#dl1-k1)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">example.com DNS</text>
  <text x="205" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">three A records, rotated</text>
  <g filter="url(#dl1-soft)">
    <rect x="700" y="140" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="700" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#dl1-k2)"/>
  </g>
  <circle cx="738" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="764" y="192" font-size="21.5" font-weight="600" fill="#111827">Query 1 gets 203.0.113.10</text>
  <text x="950" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">server A</text>
  <g filter="url(#dl1-soft)">
    <rect x="700" y="290" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="700" y="290" width="6" height="90" fill="#2563EB" clip-path="url(#dl1-k3)"/>
  </g>
  <circle cx="738" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,324.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="764" y="342" font-size="21.5" font-weight="600" fill="#111827">Query 2 gets 203.0.113.11</text>
  <text x="950" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">server B</text>
  <g filter="url(#dl1-soft)">
    <rect x="700" y="440" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="700" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#dl1-k4)"/>
  </g>
  <circle cx="738" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="764" y="492" font-size="21.5" font-weight="600" fill="#111827">Query 3 gets 203.0.113.12</text>
  <text x="950" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">server C</text>

  <rect x="40" y="610" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="635" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="660" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Round-robin</text>
  <text x="323" y="660" font-size="18.5" fill="#475569">each query gets the next address in turn</text>
  <rect x="64" y="685" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="710" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Blind spots</text>
  <text x="323" y="710" font-size="18.5" fill="#475569">it ignores each server's real load and the user's location</text>
</svg>