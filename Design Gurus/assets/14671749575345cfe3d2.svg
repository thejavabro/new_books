<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The full calculation on one page: assumptions on the left, the four results on the right, each traced back to the numbers it came from">
  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  <rect x="30" y="50" width="560" height="470" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="7 5"/>
  <rect x="650" y="50" width="560" height="470" rx="14" fill="#ECFDF5" fill-opacity="0.35" stroke="#059669" stroke-width="1.8" stroke-dasharray="7 5"/>

  <text x="310" y="95" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Assumptions</text>
  <text x="930" y="95" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Results</text>

  <line x1="60" y1="115" x2="560" y2="115" stroke="#3B82F6" stroke-width="1.5"/>
  <line x1="680" y1="115" x2="1180" y2="115" stroke="#059669" stroke-width="1.5"/>

  <text x="60" y="160" font-size="20" fill="#334155">Daily active users</text>
  <text x="560" y="160" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="end">100 million</text>

  <text x="60" y="210" font-size="20" fill="#334155">Upload on a given day</text>
  <text x="560" y="210" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="end">10 percent</text>

  <text x="60" y="260" font-size="20" fill="#334155">Size of one photo</text>
  <text x="560" y="260" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="end">500 KB</text>

  <text x="60" y="310" font-size="20" fill="#334155">Reads per write</text>
  <text x="560" y="310" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="end">100</text>

  <text x="60" y="360" font-size="20" fill="#334155">Photos are kept for</text>
  <text x="560" y="360" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="end">5 years</text>

  <text x="60" y="410" font-size="20" fill="#334155">Copies of each photo</text>
  <text x="560" y="410" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="end">3</text>

  <text x="60" y="460" font-size="20" fill="#334155">Peak against average</text>
  <text x="560" y="460" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="end">3 times</text>

  <text x="680" y="160" font-size="20" fill="#334155">Writes</text>
  <text x="1180" y="160" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">100 a second</text>

  <text x="680" y="210" font-size="20" fill="#334155">Reads</text>
  <text x="1180" y="210" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">10,000 a second</text>

  <text x="680" y="260" font-size="20" fill="#334155">Reads at peak</text>
  <text x="1180" y="260" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">30,000 a second</text>

  <text x="680" y="310" font-size="20" fill="#334155">New storage</text>
  <text x="1180" y="310" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">5 TB a day</text>

  <text x="680" y="360" font-size="20" fill="#334155">Kept over 5 years</text>
  <text x="1180" y="360" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">10 PB</text>

  <text x="680" y="410" font-size="20" fill="#334155">With 3 copies</text>
  <text x="1180" y="410" font-size="20" font-weight="700" fill="#065F46" text-anchor="end">30 PB</text>

  <text x="680" y="460" font-size="20" fill="#334155">Bandwidth out</text>
  <text x="1180" y="460" font-size="20" font-weight="700" fill="#065F46" text-anchor="end">5 GB a second</text>

  <text x="620" y="558" font-size="20" fill="#475569" text-anchor="middle">Every result on the right traces back to the left, so one corrected assumption updates all of them</text>
</svg>