  <text x="964" y="612" font-size="18.5" font-weight="600" fill="#111827">Synchronization Service</text>

  
  <rect x="40" y="810" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="830" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="852" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">File data</text>
  <text x="288" y="852" font-size="15.5" fill="#475569">chunks flow through block servers to cloud storage</text>
  <rect x="64" y="874" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="896" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Metadata reads</text>
  <text x="288" y="896" font-size="15.5" fill="#475569">lookups go through their own balancer to the metadata servers</text>
  <rect x="64" y="918" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="940" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Notifications</text>
  <text x="288" y="940" font-size="15.5" fill="#475569">changes fan out through per-device response queues</text>
