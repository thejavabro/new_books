<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Dropbox detailed design where clients reach block servers and metadata servers through separate load balancers, commit updates through a request queue, and receive change notifications through per-device response queues fed by the synchronization service.">
