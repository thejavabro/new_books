  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a new peer joins a P2P network</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A bootstrap node hands the new peer a list of peers, and the new peer connects to some of them.</text>

  <rect x="40" y="120" width="560" height="470" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Contact a bootstrap node</text>
