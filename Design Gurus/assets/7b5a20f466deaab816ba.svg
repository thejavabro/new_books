  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#047857">2. Discover peers</text>
  <rect x="40" y="630" width="560" height="470" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="660" font-size="19.5" font-weight="600" fill="#B45309">3. Establish connections</text>
  <rect x="640" y="630" width="560" height="470" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="664" y="660" font-size="19.5" font-weight="600" fill="#5B21B6">4. Become part of the network</text>
  <rect x="950" y="335" width="220" height="140" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="974" y="365" font-size="19.5" font-weight="600" fill="#5B21B6">List of peers</text>

