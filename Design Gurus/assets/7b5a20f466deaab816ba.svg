  <text x="64" y="178" font-size="18.5" fill="#6B7280">The new peer contacts a known bootstrap node to</text>
  <text x="64" y="204" font-size="18.5" fill="#6B7280">join the network.</text>
  <text x="664" y="178" font-size="18.5" fill="#6B7280">The bootstrap node returns a list of active peers.</text>
  <text x="64" y="688" font-size="18.5" fill="#6B7280">The new peer connects to a few peers from the list.</text>
  <text x="664" y="688" font-size="18.5" fill="#6B7280">The new peer is now part of the overlay network and</text>
  <text x="664" y="714" font-size="18.5" fill="#6B7280">starts exchanging data with peers.</text>
  <text x="974" y="395" font-size="18.5" fill="#1F2937">• Peer A</text>
