<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before any window is opened">
<defs>
<filter id="kd-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="674" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many stretches of [4, 2, 4, 2, 5] hold exactly 2 different values?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Counting exactly 2 directly is awkward, but counting "at most 2" is a plain sliding window</text>
<rect x="40" y="106" width="1160" height="420" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Exactly 2 is "at most 2" minus "at most 1", because the second is contained in the first</text>
<text x="276" y="214" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<rect x="298" y="176" width="116" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="356" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">4</text>
<text x="356" y="258" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="430" y="176" width="116" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="488" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="488" y="258" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="562" y="176" width="116" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">4</text>
<text x="620" y="258" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="694" y="176" width="116" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="752" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="752" y="258" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="826" y="176" width="116" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="884" y="213.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">5</text>
<text x="884" y="258" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<text x="532" y="438" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">inside the window</text>
<text x="560" y="437" font-size="18" fill="#475569">no window has been opened yet</text>
<text x="620" y="326" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">So the work is two identical sweeps, one with a limit of 2 and one with a limit of 1</text>
<rect x="40" y="548" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="588" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A window can grow while a condition holds, but not while a count is exact</text>
<text x="620" y="620" text-anchor="middle" font-size="18.5" fill="#475569">Turning the exact question into two at-most questions is what makes a window possible at all</text>
</svg>