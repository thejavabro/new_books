<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A fan-out query finishes only when the slowest shard replies, so a per-shard 99th percentile of 10 ms becomes a coin flip across 64 shards">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <filter id="ix16-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="20" y="46" font-size="20" font-weight="600" fill="#334155">Every shard answers within 10 ms, 99 times out of 100. One of them did not.</text>

  
  <line x1="130" y1="110" x2="1110" y2="110" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1105" y="100" font-size="20" fill="#B91C1C" text-anchor="end">the whole query finishes here</text>
  <line x1="130" y1="286" x2="1110" y2="286" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1105" y="276" font-size="20" fill="#047857" text-anchor="end">what a typical shard costs</text>

  
  <rect x="150" y="294" width="40" height="36" rx="4" fill="#BFDBFE"/>
  <rect x="210" y="286" width="40" height="44" rx="4" fill="#BFDBFE"/>
  <rect x="270" y="290" width="40" height="40" rx="4" fill="#BFDBFE"/>
  <rect x="330" y="282" width="40" height="48" rx="4" fill="#BFDBFE"/>
  <rect x="390" y="294" width="40" height="36" rx="4" fill="#BFDBFE"/>
  <rect x="450" y="278" width="40" height="52" rx="4" fill="#BFDBFE"/>
  <rect x="510" y="290" width="40" height="40" rx="4" fill="#BFDBFE"/>
  <rect x="570" y="286" width="40" height="44" rx="4" fill="#BFDBFE"/>
  <rect x="630" y="294" width="40" height="36" rx="4" fill="#BFDBFE"/>
  <rect x="690" y="282" width="40" height="48" rx="4" fill="#BFDBFE"/>
  <rect x="750" y="290" width="40" height="40" rx="4" fill="#BFDBFE"/>
  <rect x="810" y="110" width="40" height="220" rx="4" fill="#DC2626"/>
  <rect x="870" y="286" width="40" height="44" rx="4" fill="#BFDBFE"/>
  <rect x="930" y="294" width="40" height="36" rx="4" fill="#BFDBFE"/>
  <rect x="990" y="290" width="40" height="40" rx="4" fill="#BFDBFE"/>
  <rect x="1050" y="282" width="40" height="48" rx="4" fill="#BFDBFE"/>

  <line x1="130" y1="330" x2="1110" y2="330" stroke="#475569" stroke-width="2"/>
  <text x="20" y="222" font-size="20" fill="#64748B">slower</text>
  <text x="20" y="324" font-size="20" fill="#64748B">faster</text>

  <text x="830" y="360" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">55 ms</text>
  <text x="620" y="396" font-size="20" fill="#64748B" text-anchor="middle">Sixteen of the shards, drawn. The coordinator cannot answer until the last one replies.</text>

  
  <g filter="url(#ix16-soft)">
    <rect x="70" y="426" width="260" height="84" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="350" y="426" width="260" height="84" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="630" y="426" width="260" height="84" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="910" y="426" width="260" height="84" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="200" y="458" font-size="20" fill="#64748B" text-anchor="middle">1 shard</text>
  <text x="200" y="490" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">fast 99% of the time</text>
  <text x="480" y="458" font-size="20" fill="#64748B" text-anchor="middle">16 shards</text>
  <text x="480" y="490" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">fast 85% of the time</text>
  <text x="760" y="458" font-size="20" fill="#64748B" text-anchor="middle">64 shards</text>
  <text x="760" y="490" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">fast 53% of the time</text>
  <text x="1040" y="458" font-size="20" fill="#64748B" text-anchor="middle">200 shards</text>
  <text x="1040" y="490" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">fast 13% of the time</text>

  <text x="620" y="552" font-size="20" fill="#334155" text-anchor="middle">The chance that all of them are fast is 0.99 multiplied by itself once per shard.</text>

  <text x="620" y="596" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Adding shards makes a fan-out query worse, not better. That is the argument against a local index.</text>
</svg>