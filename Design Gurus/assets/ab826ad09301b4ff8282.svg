<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="864" viewBox="0 0 1240 864" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A segment tree of minimums over four values, with a range query covering two stored nodes"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="864" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="560" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Each node stores one range, so any query is a few stored pieces combined</text>
<rect x="500" y="140" width="240" height="86" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="620.0" y="172" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#2563EB">range 0 to 3</text>
<text x="620.0" y="206" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">min 1</text>
<rect x="310" y="290" width="220" height="86" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="420.0" y="322" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#2563EB">range 0 to 1</text>
<text x="420.0" y="356" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">min 2</text>
<rect x="710" y="290" width="220" height="86" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="820.0" y="322" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#2563EB">range 2 to 3</text>
<text x="820.0" y="356" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">min 1</text>
<rect x="240" y="440" width="160" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="320" y="483" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">5</text>
<text x="320" y="536" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=0</text>
<rect x="430" y="440" width="160" height="70" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="510" y="483" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">2</text>
<text x="510" y="536" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=1</text>
<rect x="620" y="440" width="160" height="70" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="700" y="483" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">7</text>
<text x="700" y="536" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=2</text>
<rect x="810" y="440" width="160" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="890" y="483" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="890" y="536" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=3</text>
<line x1="620" y1="226" x2="420" y2="290" stroke="#93C5FD" stroke-width="2"/>
<line x1="620" y1="226" x2="820" y2="290" stroke="#93C5FD" stroke-width="2"/>
<line x1="420" y1="376" x2="320" y2="440" stroke="#93C5FD" stroke-width="2"/>
<line x1="420" y1="376" x2="510" y2="440" stroke="#93C5FD" stroke-width="2"/>
<line x1="820" y1="376" x2="700" y2="440" stroke="#93C5FD" stroke-width="2"/>
<line x1="820" y1="376" x2="890" y2="440" stroke="#93C5FD" stroke-width="2"/>
<text x="90" y="580" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">query 1 to 2 lands on two leaves, and min(2, 7) gives 2</text>
<text x="90" y="612" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">no level ever contributes more than two pieces, so a query is log N</text>
<rect x="40" y="648" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="670" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="696" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">a stored range</text>
<text x="348" y="696" font-size="19.5" fill="#475569">holds the answer for everything below it</text>
<rect x="64" y="718" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="744" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">covers the query</text>
<text x="348" y="744" font-size="19.5" fill="#475569">fully inside, so its stored value is returned</text>
<rect x="64" y="766" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="792" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">outside the query</text>
<text x="348" y="792" font-size="19.5" fill="#475569">not visited, because its range does not overlap</text>
</svg>