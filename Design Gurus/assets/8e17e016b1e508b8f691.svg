<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four concentric rings with a callout for each: Frameworks and Drivers on the outside holds web frameworks, databases, external services and UI; Interface Adapters holds controllers, presenters and gateways that translate data and protocols; Use Cases holds application-specific business logic and orchestration; Entities at the center holds core business rules and domain models, independent of any framework">
