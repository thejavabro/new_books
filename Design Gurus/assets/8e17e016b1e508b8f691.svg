  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Clean Architecture: the four concentric rings</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Entities sit at the center, wrapped by use cases, interface adapters, and frameworks and drivers.</text>



