  <text x="844" y="377" font-size="21.5" font-weight="600" fill="#111827">3. Interface Adapters</text>
  <text x="990" y="444" font-size="18.5" text-anchor="middle" fill="#6B7280">controllers, presenters, and gateways</text>
  <text x="990" y="471" font-size="18.5" text-anchor="middle" fill="#94A3B8">that translate data and protocols</text>
