<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of API composition. A client asks the gateway for order history, the gateway fetches 50 orders from Orders, then batch fetches product names from Catalog and shipping statuses from Fulfillment, names return fast while statuses return slowly, so the merged response waits for the slowest of the three services.">
  <defs>
    <marker id="m05-l06-composition-sequence-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l06-composition-sequence-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l06-composition-sequence-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l06-composition-sequence-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1060" fill="#FFFFFF"/>

  <rect x="270" y="280" width="910" height="440" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="152" y1="145" x2="152" y2="900"/>
    <line x1="377" y1="145" x2="377" y2="900"/>
    <line x1="602" y1="145" x2="602" y2="900"/>
    <line x1="827" y1="145" x2="827" y2="900"/>
    <line x1="1052" y1="145" x2="1052" y2="900"/>
  </g>

  <text x="290" y="320" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Fan-out: one page read becomes three service calls</text>
  <text x="1160" y="320" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">50 orders must cost 3 calls, not 101</text>

  <rect x="146" y="210" width="12" height="580" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="371" y="370" width="12" height="310" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

  <g fill="none" stroke-width="2.5">
    <path d="M160,220 L369,220" stroke="#3B82F6" marker-end="url(#m05-l06-composition-sequence-bl)"/>
    <path d="M385,380 L596,380" stroke="#3B82F6" marker-end="url(#m05-l06-composition-sequence-bl)"/>
    <path d="M596,430 L387,430" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m05-l06-composition-sequence-em)"/>
    <path d="M385,490 L821,490" stroke="#3B82F6" marker-end="url(#m05-l06-composition-sequence-bl)"/>
    <path d="M385,545 L1046,545" stroke="#3B82F6" marker-end="url(#m05-l06-composition-sequence-bl)"/>
    <path d="M821,600 L387,600" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m05-l06-composition-sequence-em)"/>
    <path d="M1046,670 L387,670" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m05-l06-composition-sequence-rd)"/>
    <path d="M365,880 L160,880" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m05-l06-composition-sequence-em)"/>
  </g>

  <text x="265" y="208" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Get order history</text>
  <text x="490" y="368" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Fetch orders</text>
  <text x="490" y="418" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">50 orders</text>
  <text x="600" y="478" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Batch fetch product names</text>
  <text x="715" y="533" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Batch fetch shipping statuses</text>
  <text x="600" y="588" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">names return fast</text>
  <text x="715" y="658" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">statuses return slowly</text>
  <text x="262" y="868" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Merged response</text>
  <text x="134" y="300" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">client waits</text>

  <g filter="url(#m05-l06-composition-sequence-soft)">
    <rect x="300" y="740" width="500" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="550" y="781" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The page waits for the slowest of the three</text>
  <text x="550" y="813" text-anchor="middle" font-size="20" fill="#64748B">and all three must be up</text>

  <g filter="url(#m05-l06-composition-sequence-soft)">
    <rect x="50" y="50" width="205" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="152.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Client</text>
  <text x="152.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">history page</text>
  <g filter="url(#m05-l06-composition-sequence-soft)">
    <rect x="275" y="50" width="205" height="95" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="377.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="377.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">merges in memory</text>
  <g filter="url(#m05-l06-composition-sequence-soft)">
    <rect x="500" y="50" width="205" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="602.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders</text>
  <text x="602.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">owns the orders</text>
  <g filter="url(#m05-l06-composition-sequence-soft)">
    <rect x="725" y="50" width="205" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="827.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog</text>
  <text x="827.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">owns the names</text>
  <g filter="url(#m05-l06-composition-sequence-soft)">
    <rect x="950" y="50" width="205" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1052.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="1052.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">owns shipping</text>

  <line x1="60" y1="940" x2="96" y2="940" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="947" font-size="20" fill="#475569">Synchronous call: the caller blocks until it returns</text>
  <line x1="60" y1="980" x2="96" y2="980" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="987" font-size="20" fill="#475569">A reply to the caller</text>
  <line x1="60" y1="1020" x2="96" y2="1020" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1027" font-size="20" fill="#475569">The slow branch: the merged page waits for it</text>
</svg>