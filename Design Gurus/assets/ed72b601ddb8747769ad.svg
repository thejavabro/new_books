<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" style="background-color:#ffffff">
<defs>
<marker id="sga" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#2f7a55"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="26" font-size="13.5" font-weight="bold" fill="#b4322c">Without the pattern, the caller branches on which algorithm to run</text>

<rect x="30" y="40" width="430" height="94" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="46" y="62" font-family="monospace" font-size="11.5">if (policy == NONE)             { ... }</text>
<text x="46" y="80" font-family="monospace" font-size="11.5">else if (policy == FIXED)       { ... }</text>
<text x="46" y="98" font-family="monospace" font-size="11.5">else if (policy == EXPONENTIAL) { ... }</text>
<text x="46" y="120" font-size="11" fill="#b4322c">inside ApiClient, which has nothing to do with backoff maths</text>

<text x="490" y="62" font-size="12.5" fill="#b4322c">A fourth policy edits a class that already works.</text>
<text x="490" y="82" font-size="12.5" fill="#b4322c">Testing the backoff maths means constructing</text>
<text x="490" y="100" font-size="12.5" fill="#b4322c">an ApiClient and a fake server.</text>
<text x="490" y="126" font-size="12.5" fill="#b4322c">Another team cannot add one without touching</text>
<text x="490" y="144" font-size="12.5" fill="#b4322c">your file.</text>

<line x1="30" y1="164" x2="930" y2="164" stroke="#dbe2ed"/>

<text x="30" y="192" font-size="13.5" font-weight="bold" fill="#2f7a55">With the pattern, the caller holds one interface and never branches</text>

<rect x="30" y="212" width="200" height="60" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="130" y="238" text-anchor="middle" font-weight="bold" font-size="12.5">ApiClient</text>
<text x="130" y="257" text-anchor="middle" font-size="11" fill="#414d60">one line, no conditional</text>

<rect x="300" y="212" width="180" height="60" rx="4" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="390" y="238" text-anchor="middle" font-size="12.5">RetryPolicy</text>
<text x="390" y="257" text-anchor="middle" font-size="11" fill="#414d60">delayBeforeAttempt()</text>

<rect x="560" y="192" width="230" height="30" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="574" y="212" font-size="11.5">NoRetry</text>
<rect x="560" y="228" width="230" height="30" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="574" y="248" font-size="11.5">FixedDelay</text>
<rect x="560" y="264" width="230" height="30" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="574" y="284" font-size="11.5">ExponentialBackoff</text>

<path d="M 234 242 L 295 242" stroke="#2f7a55" fill="none" marker-end="url(#sga)"/>
<path d="M 484 236 L 555 209" stroke="#2f7a55" fill="none" stroke-dasharray="4 3" marker-end="url(#sga)"/>
<path d="M 484 242 L 555 243" stroke="#2f7a55" fill="none" stroke-dasharray="4 3" marker-end="url(#sga)"/>
<path d="M 484 248 L 555 277" stroke="#2f7a55" fill="none" stroke-dasharray="4 3" marker-end="url(#sga)"/>

<text x="812" y="228" font-size="12" fill="#2f7a55">A fourth policy is one</text>
<text x="812" y="246" font-size="12" fill="#2f7a55">new class, and nothing</text>
<text x="812" y="264" font-size="12" fill="#2f7a55">existing is edited.</text>

<text x="30" y="330" font-size="12.5" font-weight="bold" fill="#414d60">Same client code, three policies, three behaviours</text>

<rect x="30" y="344" width="280" height="62" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="44" y="364" font-size="11" font-weight="bold">NoRetry</text>
<text x="44" y="382" font-family="monospace" font-size="11">attempt 1 failed, giving up</text>

<rect x="330" y="344" width="280" height="62" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="344" y="364" font-size="11" font-weight="bold">FixedDelay</text>
<text x="344" y="382" font-family="monospace" font-size="11">wait 100ms, wait 100ms, ok</text>

<rect x="630" y="344" width="280" height="62" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="644" y="364" font-size="11" font-weight="bold">ExponentialBackoff</text>
<text x="644" y="382" font-family="monospace" font-size="11">wait 100ms, wait 200ms, ok</text>

<text x="30" y="432" font-size="12.5" fill="#414d60">The choice is data: a config value, a feature flag, a per-customer setting. Nothing about it belongs inside ApiClient.</text>
</g>
</svg>