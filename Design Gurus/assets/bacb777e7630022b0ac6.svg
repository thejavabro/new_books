<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A prefix search lands on one continuous run of leaf entries, while a contains search matches entries scattered across the whole index, so there is no run to walk">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <filter id="ix21-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="1200" height="220" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="50" y="114" font-size="20" font-weight="600" fill="#047857">WHERE Title LIKE 'sys%'</text>

  <g filter="url(#ix21-soft)">
    <rect x="50" y="140" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="215" y="140" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="380" y="140" width="150" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
    <rect x="545" y="140" width="150" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
    <rect x="710" y="140" width="150" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
    <rect x="875" y="140" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="1040" y="140" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="125" y="179" font-size="20" fill="#94A3B8" text-anchor="middle">api design</text>
  <text x="290" y="179" font-size="20" fill="#94A3B8" text-anchor="middle">hash index</text>
  <text x="455" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">sys admin</text>
  <text x="620" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">sys call</text>
  <text x="785" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">sys design</text>
  <text x="950" y="179" font-size="20" fill="#94A3B8" text-anchor="middle">web cache</text>
  <text x="1115" y="179" font-size="20" fill="#94A3B8" text-anchor="middle">zone design</text>

  <path d="M380,222 L380,232 L860,232 L860,222" fill="none" stroke="#059669" stroke-width="2.5"/>
  <text x="620" y="272" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">One continuous run. Descend once, walk sideways, stop when the prefix stops matching.</text>

  
  <rect x="20" y="326" width="1200" height="220" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="50" y="364" font-size="20" font-weight="600" fill="#B91C1C">WHERE Title LIKE '%design'</text>

  <g filter="url(#ix21-soft)">
    <rect x="50" y="390" width="150" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="215" y="390" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="380" y="390" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="545" y="390" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="710" y="390" width="150" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="875" y="390" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="1040" y="390" width="150" height="64" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="125" y="429" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">api design</text>
  <text x="290" y="429" font-size="20" fill="#94A3B8" text-anchor="middle">hash index</text>
  <text x="455" y="429" font-size="20" fill="#94A3B8" text-anchor="middle">sys admin</text>
  <text x="620" y="429" font-size="20" fill="#94A3B8" text-anchor="middle">sys call</text>
  <text x="785" y="429" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">sys design</text>
  <text x="950" y="429" font-size="20" fill="#94A3B8" text-anchor="middle">web cache</text>
  <text x="1115" y="429" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">zone design</text>

  <line x1="125" y1="466" x2="125" y2="482" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="785" y1="466" x2="785" y2="482" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="1115" y1="466" x2="1115" y2="482" stroke="#DC2626" stroke-width="2.5"/>
  <text x="620" y="522" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Matches sit all over the index. There is no run to walk, so the whole table gets scanned.</text>

  <text x="620" y="590" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The index is sorted from the left, so a B-tree helps only when the wildcard is on the right.</text>
</svg>