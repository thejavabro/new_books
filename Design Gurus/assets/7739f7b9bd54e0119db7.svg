<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="782" viewBox="0 0 1240 782" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="When a node fails, consistent hashing moves its whole key range to one neighbour while rendezvous hashing spreads those keys across every surviving node">
  <rect x="0" y="0" width="1240" height="782" fill="#FFFFFF"/>
  <defs>
    <marker id="sh6-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="sh6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="sh6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node B fails. Where do its keys go?</text>

  
  <rect x="40" y="72" width="1160" height="300" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#B91C1C">Consistent hashing: the next node clockwise takes all of them</text>

  <g filter="url(#sh6-soft)">
    <rect x="90" y="180" width="220" height="88" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="200" y="214" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Node B</text>
  <text x="200" y="244" font-size="20" fill="#B91C1C" text-anchor="middle">down, 25% of keys</text>

  <line x1="314" y1="224" x2="600" y2="224" stroke="#DC2626" stroke-width="3" marker-end="url(#sh6-red)"/>
  <rect x="358" y="182" width="200" height="30" fill="#FFFFFF"/>
  <text x="458" y="204" font-size="20" fill="#B91C1C" text-anchor="middle">all 25% at once</text>

  <g filter="url(#sh6-soft)">
    <rect x="604" y="176" width="220" height="96" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="860" y="188" width="140" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="1016" y="188" width="140" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="714" y="208" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Node C</text>
  <text x="714" y="238" font-size="20" fill="#B91C1C" text-anchor="middle">now holds 50%</text>
  <text x="714" y="262" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">double load</text>
  <text x="930" y="230" font-size="20" fill="#94A3B8" text-anchor="middle">Node A</text>
  <text x="1086" y="230" font-size="20" fill="#94A3B8" text-anchor="middle">Node D</text>
  <text x="1008" y="286" font-size="20" fill="#94A3B8" text-anchor="middle">unchanged</text>

  <text x="620" y="344" font-size="20" fill="#475569" text-anchor="middle">One neighbour absorbs the whole failure and can topple next. Virtual nodes are what soften this.</text>

  
  <rect x="40" y="398" width="1160" height="342" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="432" font-size="20" font-weight="600" fill="#065F46">Rendezvous hashing: each key independently picks its next best node</text>

  <g filter="url(#sh6-soft)">
    <rect x="90" y="506" width="220" height="88" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="200" y="540" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Node B</text>
  <text x="200" y="570" font-size="20" fill="#B91C1C" text-anchor="middle">down, 25% of keys</text>

  <line x1="314" y1="536" x2="716" y2="504" stroke="#059669" stroke-width="2" marker-end="url(#sh6-emerald)"/>
  <line x1="314" y1="550" x2="716" y2="574" stroke="#059669" stroke-width="2" marker-end="url(#sh6-emerald)"/>
  <line x1="314" y1="564" x2="716" y2="644" stroke="#059669" stroke-width="2" marker-end="url(#sh6-emerald)"/>
  <rect x="390" y="500" width="270" height="30" fill="#FFFFFF"/>
  <text x="525" y="522" font-size="20" fill="#065F46" text-anchor="middle">roughly a third each</text>

  <g filter="url(#sh6-soft)">
    <rect x="720" y="470" width="300" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="720" y="546" width="300" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="720" y="622" width="300" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="870" y="508" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Node A: 33%</text>
  <text x="870" y="584" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Node C: 33%</text>
  <text x="870" y="660" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Node D: 33%</text>

  <text x="620" y="716" font-size="20" fill="#475569" text-anchor="middle">No survivor is overloaded, so a single failure is far less likely to cascade.</text>
</svg>