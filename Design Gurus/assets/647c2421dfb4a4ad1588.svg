<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">A cache limit is not a process-memory limit</title><desc id="desc">Peak process memory includes more than decoded cache entries. Active or prefetched results, concurrent decoder workspace, rendering resources, and other app data can coexist. Limit cached bytes and work in progress. Count shared allocations once rather than adding the same pixels again for each reference.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1040" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">A cache limit is not a process-memory limit</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Budget retained data, active results, and temporary work together.</text><rect x="50" y="180" width="330" height="185" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="220" font-size="24" fill="#7c3aed" font-weight="700">Retained pixels</text><text x="72" y="261" font-size="21" fill="#334155" font-weight="400">Decoded cache entries</text><text x="72" y="292" font-size="21" fill="#334155" font-weight="400">Active and prefetched results</text><text x="72" y="323" font-size="21" fill="#334155" font-weight="400">Count shared pixels once.</text><rect x="435" y="180" width="330" height="185" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="457" y="220" font-size="24" fill="#c2410c" font-weight="700">Temporary work</text><text x="457" y="261" font-size="21" fill="#334155" font-weight="400">Concurrent decoder workspace</text><text x="457" y="292" font-size="21" fill="#334155" font-weight="400">Intermediate buffers</text><text x="457" y="323" font-size="21" fill="#334155" font-weight="400">Bound concurrent decodes.</text><rect x="820" y="180" width="330" height="185" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="842" y="220" font-size="24" fill="#2563eb" font-weight="700">Other allocations</text><text x="842" y="261" font-size="21" fill="#334155" font-weight="400">Rendering and GPU resources</text><text x="842" y="292" font-size="21" fill="#334155" font-weight="400">Views, records, and app data</text><text x="842" y="323" font-size="21" fill="#334155" font-weight="400">Include relevant overhead.</text><rect x="240" y="510" width="720" height="150" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="262" y="550" font-size="24" fill="#059669" font-weight="700">Observed peak process memory</text><text x="262" y="591" font-size="21" fill="#334155" font-weight="400">These allocations can exist at the same time.</text><text x="262" y="622" font-size="21" fill="#334155" font-weight="400">A cache byte cap controls only part of the total.</text><path d="M215 373 V430 H430 V502" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M600 373 V502" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M985 373 V430 H770 V502" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="755" width="1100" height="145" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="795" font-size="24" fill="#ffffff" font-weight="700">Measure repeated use, not only one load</text><text x="72" y="836" font-size="21" fill="#ffffff" font-weight="400">Scroll, leave the screen, and return while profiling. Check that unused work and resources are released.</text><text x="72" y="867" font-size="21" fill="#ffffff" font-weight="400">Do not rely on receiving a memory warning before termination.</text><text x="50" y="975" font-size="21" fill="#475569" font-weight="400">This is a relationship diagram, not a universal memory allowance or a measured allocation report.</text></g></svg>