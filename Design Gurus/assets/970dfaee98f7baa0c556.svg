<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="782" viewBox="0 0 1240 782" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shape-title shape-desc">
<title id="shape-title">The arrangement that is usually right</title>
<desc id="shape-desc">The data path is a primary and its replicas and carries all the throughput. The consensus store holds a leader key, a lease and membership, takes a few writes a minute, and is never on the request path.</desc>
<defs>
<marker id="shape-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shape-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shape-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shape-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="782" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The arrangement that is usually right</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Put the two answers together and you get an arrangement that appears over and over in production systems.</text>
<rect x="40" y="704" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="704" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="740" height="236" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V348A6 6 0 0 0 46 354H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">The data path</text>
<rect x="90" y="176" width="280" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="230" y="210" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">primary</text>
<path d="M376 204H430" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M376 204H430" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="440" y="176" width="280" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="580" y="210" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">replica</text>
<text x="410" y="268" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">all application traffic, all the throughput</text>
<text x="410" y="312" font-size="20" font-weight="700" fill="#155B9E" text-anchor="middle">never touches the consensus store</text>
<rect x="820" y="118" width="380" height="236" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M834 118H826A6 6 0 0 0 820 124V348A6 6 0 0 0 826 354H834Z" fill="#39D5AA"/><text x="850" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">The control decision</text>
<rect x="850" y="174" width="320" height="42" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1010" y="201" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">leader key</text>
<rect x="850" y="220" width="320" height="42" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1010" y="247" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a lease on it</text>
<rect x="850" y="266" width="320" height="42" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1010" y="293" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">membership</text>
<text x="1010" y="332" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a few writes a minute</text>
<rect x="40" y="372" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="372" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="403.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Single-leader replication for the data.</text><text x="64" y="432.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Consensus for the decision about who the leader is.</text>
<text x="40" y="494" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Already in use, everywhere</text>
<rect x="40" y="512" width="372" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="226" y="542.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a managed relational</text><text x="226" y="569.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">database failing over</text>
<rect x="434" y="512" width="372" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="542.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Patroni holding a Postgres</text><text x="620" y="569.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">leader key in etcd</text>
<rect x="828" y="512" width="372" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="542.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Kafka's controller, for</text><text x="1014" y="569.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">partition leadership</text>
<rect x="40" y="616" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="616" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="653" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">If the consensus store is down: keep serving, cannot fail over.</text>
<text x="66" y="738" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Not a workaround. Recognizing it saves you from designing something more elaborate.</text>
</svg>