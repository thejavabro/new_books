<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="812" viewBox="0 0 1240 812" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="levels-title levels-desc">
<title id="levels-title">What each level looks like</title>
<desc id="levels-desc">The rubric is only useful if the levels are distinguishable. The middle column is where most answers land, and the gap to the right is smaller than it looks.</desc>
<defs>
<marker id="levels-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="levels-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="levels-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="levels-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="812" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What each level looks like</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The rubric is only useful if the levels are distinguishable.</text>
<rect x="40" y="734" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="734" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="276" y="150" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">weak</text>
<text x="522" y="150" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">competent</text>
<text x="808" y="150" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">senior</text>
<rect x="40" y="168" width="200" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="140" y="204" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">scoping</text>
<rect x="256" y="168" width="230" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="276" y="204" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">starts designing</text>
<rect x="502" y="168" width="270" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="522" y="204" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">asks questions</text>
<rect x="788" y="168" width="412" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="808" y="191.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">asks, uses the answers,</text><text x="808" y="216.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">states what is excluded</text>
<rect x="40" y="238" width="200" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="140" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">trade-offs</text>
<rect x="256" y="238" width="230" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="276" y="274" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">one answer</text>
<rect x="502" y="238" width="270" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="522" y="274" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">names an alternative</text>
<rect x="788" y="238" width="412" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="808" y="261.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">options with costs, a choice,</text><text x="808" y="286.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and a revisit condition</text>
<rect x="40" y="308" width="200" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="140" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">failure</text>
<rect x="256" y="308" width="230" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="276" y="344" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">not mentioned</text>
<rect x="502" y="308" width="270" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="522" y="344" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">mentions redundancy</text>
<rect x="788" y="308" width="412" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="808" y="331.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">per component, with the</text><text x="808" y="356.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">blast radius bounded</text>
<rect x="40" y="378" width="200" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="140" y="414" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cost</text>
<rect x="256" y="378" width="230" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="276" y="414" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">not mentioned</text>
<rect x="502" y="378" width="270" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="522" y="414" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">says it is a concern</text>
<rect x="788" y="378" width="412" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="808" y="401.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a number, a dominant line,</text><text x="808" y="426.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a rejected cheaper design</text>
<rect x="40" y="448" width="200" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="140" y="484" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">operability</text>
<rect x="256" y="448" width="230" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="276" y="484" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">not mentioned</text>
<rect x="502" y="448" width="270" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="522" y="484" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">says it is monitored</text>
<rect x="788" y="448" width="412" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="808" y="471.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the signal, the debugging</text><text x="808" y="496.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">path, the action at 3am</text>
<rect x="40" y="536" width="1160" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="536" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="64" y="572" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The competent column mentions the area. The senior column answers it with a specific.</text><text x="64" y="598" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">That is nearly the whole distance, and every specific is already available to you.</text>
<rect x="40" y="646" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="646" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="683" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">The other difference is who raises it. At the senior level it is volunteered</text>
<text x="66" y="768" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The weak column usually describes somebody who ran out of time.</text>
</svg>