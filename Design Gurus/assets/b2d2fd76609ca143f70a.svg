    <rect x="76" y="554" width="6" height="48" fill="#2563EB" clip-path="url(#p41-k4)"/>
  </g>
  <circle cx="110" cy="578" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,569) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="134" y="585" font-size="18.5" font-weight="600" fill="#111827">Turn accepted parts into a file</text>

  <g filter="url(#p41-soft)">
    <rect x="580" y="554" width="400" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
