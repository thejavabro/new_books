  <text x="638" y="843" font-size="15.5" fill="#6B7280">GET /files?limit=20&amp;cursor=...</text>

  
  <g filter="url(#p41-soft)">
    <rect x="76" y="878" width="440" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
