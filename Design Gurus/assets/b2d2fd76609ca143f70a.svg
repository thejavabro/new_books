  </g>
  <text x="134" y="909" font-size="18.5" font-weight="600" fill="#111827">Remove a file</text>

  <g filter="url(#p41-soft)">
    <rect x="580" y="878" width="400" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="580" y="878" width="6" height="48" fill="#059669" clip-path="url(#p41-m7)"/>
  </g>
  <circle cx="614" cy="902" r="4.5" fill="#059669"/>
  <text x="638" y="909" font-size="18.5" font-weight="600" fill="#111827">Delete file</text>
  <text x="638" y="951" font-size="15.5" fill="#6B7280">DELETE /files/{file_id}</text>

  
  <rect x="40" y="994" width="1160" height="140" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
