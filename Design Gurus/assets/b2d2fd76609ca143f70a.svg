  </g>
  <circle cx="110" cy="686" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,677) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="134" y="693" font-size="18.5" font-weight="600" fill="#111827">Read completed metadata</text>

