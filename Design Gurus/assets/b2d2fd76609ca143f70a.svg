  <text x="638" y="735" font-size="15.5" fill="#6B7280">GET /files/{file_id}</text>

  
  <g filter="url(#p41-soft)">
    <rect x="76" y="770" width="440" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="770" width="6" height="48" fill="#2563EB" clip-path="url(#p41-k6)"/>
  </g>
  <circle cx="110" cy="794" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,785) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="134" y="801" font-size="18.5" font-weight="600" fill="#111827">List files</text>

  <g filter="url(#p41-soft)">
    <rect x="580" y="770" width="400" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="580" y="770" width="6" height="48" fill="#059669" clip-path="url(#p41-m6)"/>
