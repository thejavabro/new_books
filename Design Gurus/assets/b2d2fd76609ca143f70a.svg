  <text x="638" y="247" font-size="15.5" fill="#6B7280">POST /upload-sessions</text>

  
  <g filter="url(#p41-soft)">
    <rect x="76" y="282" width="440" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="282" width="6" height="48" fill="#2563EB" clip-path="url(#p41-k2)"/>
