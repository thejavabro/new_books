  <text x="64" y="536" font-size="16.5" font-weight="600" fill="#475569">File</text>
  <text x="1176" y="536" text-anchor="end" font-size="15.5" fill="#6B7280">four operations</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M520,578 H580" marker-end="url(#p41-ar)"/>
    <path d="M520,686 H580" marker-end="url(#p41-ar)"/>
    <path d="M520,794 H580" marker-end="url(#p41-ar)"/>
    <path d="M520,902 H580" marker-end="url(#p41-ar)"/>
