  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">caller job, operation, HTTP surface</text>

  
  <rect x="40" y="126" width="1160" height="356" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
