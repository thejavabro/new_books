  <text x="638" y="627" font-size="15.5" fill="#6B7280">POST /files</text>

  
  <g filter="url(#p41-soft)">
    <rect x="76" y="662" width="440" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
