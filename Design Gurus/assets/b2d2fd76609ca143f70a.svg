  </g>

  
  <g filter="url(#p41-soft)">
    <rect x="76" y="1042" width="440" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="1042" width="6" height="48" fill="#2563EB" clip-path="url(#p41-k8)"/>
  </g>
  <circle cx="110" cy="1066" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,1057) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="134" y="1073" font-size="18.5" font-weight="600" fill="#111827">Authorize a direct download</text>

  <g filter="url(#p41-soft)">
    <rect x="580" y="1042" width="400" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="580" y="1042" width="6" height="48" fill="#059669" clip-path="url(#p41-m8)"/>
  </g>
  <circle cx="614" cy="1066" r="4.5" fill="#059669"/>
  <text x="638" y="1073" font-size="18.5" font-weight="600" fill="#111827">Create download location</text>
  <text x="638" y="1115" font-size="15.5" fill="#6B7280">POST /download-locations</text>

  
  <rect x="40" y="1158" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1200" text-anchor="middle" font-size="16" fill="#475569">Each row reads left to right: the caller job, the operation that finishes it, then the HTTP surface it uses.</text>
  <text x="620" y="1229" text-anchor="middle" font-size="16" fill="#475569">Together they cover the whole life of a file: open a session, upload numbered parts, complete, read, list, download, and delete.</text>
</svg>