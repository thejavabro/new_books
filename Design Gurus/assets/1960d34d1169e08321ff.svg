<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A range query descends to the first matching leaf once, then walks the leaf linked list sideways in key order until it passes the end of the range">
  <rect x="0" y="0" width="1240" height="690" fill="#FFFFFF"/>
  <defs>
    <marker id="ix10-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix10-grey" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <marker id="ix10-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ix10-chain" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="ix10-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="40" width="500" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="270" y="76" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">WHERE CustomerID BETWEEN 1000 AND 1500</text>

  
  <line x1="900" y1="56" x2="932" y2="56" stroke="#3B82F6" stroke-width="3"/>
  <text x="944" y="63" font-size="20" fill="#475569">descend once</text>
  <line x1="900" y1="88" x2="932" y2="88" stroke="#059669" stroke-width="3"/>
  <text x="944" y="95" font-size="20" fill="#475569">walk the leaf chain</text>

  
  <path d="M620,194 C620,235 929,225 929,262" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ix10-grey)"/>
  <path d="M311,334 C311,372 105,378 105,412" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ix10-grey)"/>
  <path d="M311,334 C311,372 517,378 517,412" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ix10-grey)"/>
  <path d="M929,334 C929,372 723,378 723,412" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ix10-grey)"/>
  <path d="M929,334 L929,412" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ix10-grey)"/>
  <path d="M929,334 C929,372 1135,378 1135,412" fill="none" stroke="#CBD5E1" stroke-width="2" marker-end="url(#ix10-grey)"/>

  
  <path d="M620,194 C620,235 311,225 311,262" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#ix10-blue)"/>
  <path d="M311,334 L311,412" fill="none" stroke="#3B82F6" stroke-width="3" marker-end="url(#ix10-blue)"/>

  
  <g filter="url(#ix10-soft)">
    <rect x="480" y="130" width="280" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="169" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1400</text>

  
  <g filter="url(#ix10-soft)">
    <rect x="171" y="270" width="280" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="789" y="270" width="280" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <line x1="311" y1="270" x2="311" y2="334" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="929" y1="270" x2="929" y2="334" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="241" y="309" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">800</text>
  <text x="381" y="309" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1200</text>
  <text x="859" y="309" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1800</text>
  <text x="999" y="309" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">2200</text>

  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="430" y="240" font-size="20" fill="#1D4ED8" text-anchor="middle">descend</text>
  </g>

  
  <line x1="190" y1="452" x2="222" y2="452" stroke="#94A3B8" stroke-width="2" marker-end="url(#ix10-chain)"/>
  <line x1="396" y1="452" x2="428" y2="452" stroke="#059669" stroke-width="3" marker-end="url(#ix10-green)"/>
  <line x1="602" y1="452" x2="634" y2="452" stroke="#059669" stroke-width="3" marker-end="url(#ix10-green)"/>
  <line x1="808" y1="452" x2="840" y2="452" stroke="#94A3B8" stroke-width="2" marker-end="url(#ix10-chain)"/>
  <line x1="1014" y1="452" x2="1046" y2="452" stroke="#94A3B8" stroke-width="2" marker-end="url(#ix10-chain)"/>

  
  <g filter="url(#ix10-soft)">
    <rect x="20" y="420" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="226" y="420" width="170" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="432" y="420" width="170" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="638" y="420" width="170" height="64" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="844" y="420" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="1050" y="420" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="105" y="459" font-size="20" fill="#94A3B8" text-anchor="middle">1 to 799</text>
  <text x="311" y="459" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">800 to 1199</text>
  <text x="517" y="459" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1200 to 1399</text>
  <text x="723" y="459" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1400 to 1799</text>
  <text x="929" y="459" font-size="20" fill="#94A3B8" text-anchor="middle">1800 to 2199</text>
  <text x="1135" y="459" font-size="20" fill="#94A3B8" text-anchor="middle">2200 and up</text>

  <text x="620" y="532" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">Walk the chain in key order and stop at the first leaf past 1500.</text>

  <rect x="170" y="562" width="900" height="56" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="597" font-size="20" fill="#334155" text-anchor="middle">The scan never climbs back up, even where the range crosses into the other subtree.</text>

  <text x="620" y="662" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">One descent, then a sideways walk. The same structure serves BETWEEN, ORDER BY and prefix matches.</text>
</svg>