<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four questions that turn one sentence into a requirement list">
  <defs>
    <marker id="oodi2-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oodi2-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oodi2-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oodi2-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oodi2-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oodi2-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oodi2-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oodi2-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oodi2-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oodi2-q0"><rect x="64" y="122" width="274" height="84" rx="12"/></clipPath>
    <clipPath id="oodi2-q1"><rect x="350" y="122" width="274" height="84" rx="12"/></clipPath>
    <clipPath id="oodi2-q2"><rect x="636" y="122" width="274" height="84" rx="12"/></clipPath>
    <clipPath id="oodi2-q3"><rect x="922" y="122" width="274" height="84" rx="12"/></clipPath>
    <clipPath id="oodi2-out"><rect x="64" y="340" width="1112" height="84" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <rect x="34" y="96" width="1172" height="190" rx="16" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="52" y="84" font-size="16.5" font-weight="600" fill="#4338CA">Ask these four, in this order, in about five minutes</text>
  <g filter="url(#oodi2-soft)">
    <rect x="64" y="122" width="274" height="84" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="64" y="122" width="6" height="84" fill="#4F46E5" clip-path="url(#oodi2-q0)"/>
  </g>
  <circle cx="102" cy="164.0" r="18" fill="#FFFFFF"/>
  <text x="102" y="170.5" font-size="17" font-weight="700" text-anchor="middle" fill="#4F46E5">1</text>
  <text x="132" y="170.5" font-size="18.5" font-weight="600" fill="#111827">Who uses this?</text>
  <text x="201.0" y="232" text-anchor="middle" font-size="15.5" fill="#6B7280">customer, attendant,</text>
  <text x="201.0" y="256" text-anchor="middle" font-size="15.5" fill="#94A3B8">administrator, the system</text>
  <g filter="url(#oodi2-soft)">
    <rect x="350" y="122" width="274" height="84" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="350" y="122" width="6" height="84" fill="#2563EB" clip-path="url(#oodi2-q1)"/>
  </g>
  <circle cx="388" cy="164.0" r="18" fill="#FFFFFF"/>
  <text x="388" y="170.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">2</text>
  <text x="418" y="170.5" font-size="18.5" font-weight="600" fill="#111827">What can each do?</text>
  <text x="487.0" y="232" text-anchor="middle" font-size="15.5" fill="#6B7280">take a ticket, pay, leave,</text>
  <text x="487.0" y="256" text-anchor="middle" font-size="15.5" fill="#94A3B8">add a floor, change the rate</text>
  <g filter="url(#oodi2-soft)">
    <rect x="636" y="122" width="274" height="84" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="636" y="122" width="6" height="84" fill="#7C3AED" clip-path="url(#oodi2-q2)"/>
  </g>
  <circle cx="674" cy="164.0" r="18" fill="#FFFFFF"/>
  <text x="674" y="170.5" font-size="17" font-weight="700" text-anchor="middle" fill="#7C3AED">3</text>
  <text x="704" y="170.5" font-size="18.5" font-weight="600" fill="#111827">What are the limits?</text>
  <text x="773.0" y="232" text-anchor="middle" font-size="15.5" fill="#6B7280">how many floors, how long,</text>
  <text x="773.0" y="256" text-anchor="middle" font-size="15.5" fill="#94A3B8">how many at a time</text>
  <g filter="url(#oodi2-soft)">
    <rect x="922" y="122" width="274" height="84" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="922" y="122" width="6" height="84" fill="#DB2777" clip-path="url(#oodi2-q3)"/>
  </g>
  <circle cx="960" cy="164.0" r="18" fill="#FFFFFF"/>
  <text x="960" y="170.5" font-size="17" font-weight="700" text-anchor="middle" fill="#DB2777">4</text>
  <text x="990" y="170.5" font-size="18.5" font-weight="600" fill="#111827">What is out of scope?</text>
  <text x="1059.0" y="232" text-anchor="middle" font-size="15.5" fill="#6B7280">the most valuable question,</text>
  <text x="1059.0" y="256" text-anchor="middle" font-size="15.5" fill="#94A3B8">and the one most people skip</text>
  <path d="M201.0,286 L201.0,336" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi2-arrow-slate)"/>
  <path d="M487.0,286 L487.0,336" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi2-arrow-slate)"/>
  <path d="M773.0,286 L773.0,336" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi2-arrow-slate)"/>
  <path d="M1059.0,286 L1059.0,336" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi2-arrow-slate)"/>
  <g filter="url(#oodi2-soft)">
    <rect x="64" y="340" width="1112" height="84" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="340" width="6" height="84" fill="#059669" clip-path="url(#oodi2-out)"/>
  </g>
  <circle cx="102" cy="382.0" r="18" fill="#FFFFFF"/>
  <text x="102" y="388.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">=</text>
  <text x="132" y="388.5" font-size="18.5" font-weight="600" fill="#111827">8 to 12 requirements in scope, plus a written out of scope list</text>
  <text x="620" y="468" text-anchor="middle" font-size="15.5" fill="#6B7280">Every class you write later should trace back to one of these lines.</text>
  <text x="620" y="500" text-anchor="middle" font-size="15.5" fill="#94A3B8">Nothing exists in the design without a requirement that asked for it.</text>
</svg>