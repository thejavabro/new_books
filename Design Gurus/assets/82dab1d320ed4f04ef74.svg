<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The numbers before the scan">
<defs>
<filter id="ks-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="566" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which number is the 3rd smallest in [1, 5, 12, 2, 11, 5]?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Sorting would answer it, but only the 3 smallest numbers ever matter</text>
<rect x="40" y="106" width="1160" height="312" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Nothing collected yet</text>
<text x="314" y="225" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">numbers</text>
<rect x="338" y="186" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="380" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="380" y="270" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="434" y="186" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="476" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="476" y="270" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="530" y="186" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="572" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">12</text>
<text x="572" y="270" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="626" y="186" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="668" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="668" y="270" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="722" y="186" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="764" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">11</text>
<text x="764" y="270" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="818" y="186" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="860" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="860" y="270" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<text x="314" y="355" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<text x="344" y="354" font-size="18.5" fill="#475569">empty</text>
<rect x="40" y="436" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Keep a heap of the 3 smallest numbers seen so far, with the largest of them on top</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">The top is the one to beat, so a new number only matters if it is smaller than the top</text>
</svg>