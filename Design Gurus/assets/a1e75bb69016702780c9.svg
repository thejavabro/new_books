<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="802" viewBox="0 0 1240 802" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="irreversible-title irreversible-desc">
<title id="irreversible-title">When a step cannot be reversed</title>
<desc id="irreversible-desc">Separate the irreversible part, delay it behind a retention period, keep the original input, and apply it gradually. Each technique converts a one-way decision into a window during which it is still two-way.</desc>
<defs>
<marker id="irreversible-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="irreversible-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="irreversible-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="irreversible-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="802" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">When a step cannot be reversed</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Some changes have no clean undo.</text>
<rect x="40" y="724" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="724" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="62" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="155" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deleting data</text>
<rect x="434" y="118" width="372" height="62" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="141.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a transformation that</text><text x="620" y="168.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">loses information</text>
<rect x="828" y="118" width="372" height="62" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="141.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">anything a customer</text><text x="1014" y="168.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">has already seen</text>
<text x="40" y="216" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Four ways to buy time around it</text>
<circle cx="60" cy="264" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="271" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="234" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Separate it</text>
<path d="M536 264H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 264H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#irreversible-marker-slate)"/>
<rect x="580" y="234" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so one small step carries the risk rather than a large one</text>
<circle cx="60" cy="336" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="343" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="306" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Delay it</text>
<path d="M536 336H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 336H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#irreversible-marker-slate)"/>
<rect x="580" y="306" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="342" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">soft delete now, remove for real after a retention period</text>
<circle cx="60" cy="408" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="415" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="378" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="414" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep the input</text>
<path d="M536 408H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 408H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#irreversible-marker-slate)"/>
<rect x="580" y="378" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="414" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">retain the original somewhere, even if only as an export</text>
<circle cx="60" cy="480" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="487" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="450" width="440" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="486" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Make it gradual</text>
<path d="M536 480H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 480H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#irreversible-marker-slate)"/>
<rect x="580" y="450" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="473.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">applying it to one percent is a reversible</text><text x="600" y="498.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">decision about the rest</text>
<rect x="40" y="532" width="1160" height="78" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="532" width="5" height="78" rx="2.5" fill="#39D5AA"/><text x="64" y="562.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What all four are doing</text><text x="64" y="591.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Turning a decision you cannot undo into one you can undo for a while.</text>
<rect x="40" y="632" width="1160" height="66" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="632" width="5" height="66" rx="2.5" fill="#F3CF6A"/><text x="64" y="671" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">When it genuinely is not possible, that step gets a written plan and a person watching it.</text>
<text x="66" y="758" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Make the irreversible part as small and as late as possible.</text>
</svg>