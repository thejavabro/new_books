<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="608" viewBox="0 0 1240 608" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four feature buckets of the delivery-time model, each with its examples">
  <defs>
    <filter id="c2ffb-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2ffb-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2ffb-k1"><rect x="188" y="72" width="284" height="90" rx="12"/></clipPath>
    <clipPath id="c2ffb-k2"><rect x="768" y="72" width="284" height="90" rx="12"/></clipPath>
    <clipPath id="c2ffb-k3"><rect x="188" y="302" width="284" height="90" rx="12"/></clipPath>
    <clipPath id="c2ffb-k4"><rect x="768" y="302" width="284" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="608" fill="#FFFFFF"/>
  <g filter="url(#c2ffb-soft)">
    <rect x="188" y="72" width="284" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="188" y="72" width="6" height="90" fill="#D97706" clip-path="url(#c2ffb-k1)"/>
  </g>
  <circle cx="226" cy="117" r="18" fill="#FFFFFF"/>
  <g transform="translate(215.56,106.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="188" y="60" font-size="15.5" font-weight="600" fill="#6B7280">Bucket 1</text>
  <text x="252" y="124" font-size="18.5" font-weight="600" fill="#111827">Entity features</text>
  <text x="330" y="187" font-size="15.5" text-anchor="middle" fill="#6B7280">slowly changing properties of one thing</text>
  <text x="330" y="210" font-size="15.5" text-anchor="middle" fill="#94A3B8">restaurant's average prep time, courier's vehicle type</text>
  <g filter="url(#c2ffb-lift)">
    <rect x="768" y="72" width="284" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="768" y="72" width="9" height="90" fill="#2563EB" clip-path="url(#c2ffb-k2)"/>
  </g>
  <circle cx="806" cy="117" r="18" fill="#FFFFFF"/>
  <g transform="translate(795.56,106.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="768" y="60" font-size="15.5" font-weight="600" fill="#6B7280">Bucket 2</text>
  <text x="832" y="124" font-size="18.5" font-weight="600" fill="#111827">Behavioral aggregates</text>
  <text x="910" y="187" font-size="15.5" text-anchor="middle" fill="#6B7280">numbers computed over a recent window of activity</text>
  <text x="910" y="210" font-size="15.5" text-anchor="middle" fill="#94A3B8">orders in the last 30 minutes</text>
  <text x="910" y="233" font-size="15.5" text-anchor="middle" fill="#94A3B8">median prep time for this dish over 7 days</text>
  <g filter="url(#c2ffb-soft)">
    <rect x="188" y="302" width="284" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="188" y="302" width="6" height="90" fill="#059669" clip-path="url(#c2ffb-k3)"/>
  </g>
  <circle cx="226" cy="347" r="18" fill="#FFFFFF"/>
  <g transform="translate(215.56,336.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="188" y="290" font-size="15.5" font-weight="600" fill="#6B7280">Bucket 3</text>
  <text x="252" y="354" font-size="18.5" font-weight="600" fill="#111827">Contextual features</text>
  <text x="330" y="417" font-size="15.5" text-anchor="middle" fill="#6B7280">describe the request moment itself</text>
  <text x="330" y="440" font-size="15.5" text-anchor="middle" fill="#94A3B8">the time of day, the weather, whether a sports final is on TV</text>
  <g filter="url(#c2ffb-soft)">
    <rect x="768" y="302" width="284" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="768" y="302" width="6" height="90" fill="#7C3AED" clip-path="url(#c2ffb-k4)"/>
  </g>
  <circle cx="806" cy="347" r="18" fill="#FFFFFF"/>
  <g transform="translate(795.56,336.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="768" y="290" font-size="15.5" font-weight="600" fill="#6B7280">Bucket 4</text>
  <text x="832" y="354" font-size="18.5" font-weight="600" fill="#111827">Cross features</text>
  <text x="910" y="417" font-size="15.5" text-anchor="middle" fill="#6B7280">combine two entities and describe how they interact</text>
  <text x="910" y="440" font-size="15.5" text-anchor="middle" fill="#94A3B8">this courier's past delivery times from this restaurant</text>
  <rect x="40" y="492" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="537" text-anchor="middle" font-size="16" fill="#475569">Most of the hard engineering in a feature system comes from bucket 2.</text>
</svg>