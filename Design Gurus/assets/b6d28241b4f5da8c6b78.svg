<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="limits-title limits-desc">
<title id="limits-title">The loop needs limits</title>
<desc id="limits-desc">An agent without limits is an unbounded consumer of time, money and external effects. Each limit is one line of configuration preventing a failure that happens regularly.</desc>
<defs>
<marker id="limits-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="limits-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="limits-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="limits-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="832" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The loop needs limits</text>
<text x="40" y="86" font-size="21" fill="#4A5568">An agent without limits is an unbounded consumer of time, money and external effects.</text>
<rect x="40" y="754" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="754" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="320" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="200" y="149" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">max steps</text>
<rect x="370" y="118" width="830" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="390" y="149" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stop after N iterations, whatever the state</text>
<rect x="40" y="178" width="320" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="200" y="209" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">max tokens</text>
<rect x="370" y="178" width="830" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="390" y="209" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a cost ceiling per run, enforced not estimated</text>
<rect x="40" y="238" width="320" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="200" y="269" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">wall-clock deadline</text>
<rect x="370" y="238" width="830" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="390" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">propagated into every tool call</text>
<rect x="40" y="298" width="320" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="200" y="329" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">max tool calls</text>
<rect x="370" y="298" width="830" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="390" y="329" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">per tool, so one cannot be called forty times</text>
<rect x="40" y="366" width="1160" height="88" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="366" width="5" height="88" rx="2.5" fill="#F28B9D"/><text x="64" y="390" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The characteristic failure: the loop that does not converge</text><text x="64" y="416" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">It tries something, it fails, it tries a variation, that fails, and it continues,</text><text x="64" y="442" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">spending real money and possibly repeating external actions.</text>
<rect x="40" y="476" width="560" height="76" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="476" width="5" height="76" rx="2.5" fill="#F3CF6A"/><text x="64" y="507" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Detect repetition</text><text x="64" y="533" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the same tool, the same arguments, twice</text>
<rect x="640" y="476" width="560" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="476" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="664" y="507" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Stop on no progress</text><text x="664" y="533" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">several steps producing nothing new</text>
<rect x="40" y="574" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="574" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="603" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What happens at the limit is a design decision, not an error case</text><text x="64" y="629" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The run ends in a reportable state: what it accomplished, what it did not, and what it tried.</text>
<rect x="40" y="668" width="1160" height="60" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="668" width="5" height="60" rx="2.5" fill="#AC8BE8"/><text x="64" y="704" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A partial result with an honest account is usable. A long silence then a timeout is not.</text>
<text x="66" y="788" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Stopping on repetition is cheaper than waiting for the step limit.</text>
</svg>