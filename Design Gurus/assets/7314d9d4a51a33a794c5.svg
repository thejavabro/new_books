<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="612" viewBox="0 0 1240 612" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rows that agree on Roll_Number must agree on Name, and a row repeating a roll number with a different name breaks the dependency">
<rect x="0" y="0" width="1240" height="612" fill="#FFFFFF"/>

<rect x="40" y="40" width="560" height="440" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#047857">Roll_Number to Name holds here</text>
<g stroke="#6EE7B7" stroke-width="1.3">
<rect x="64" y="96" width="170" height="42" fill="#D1FAE5"/>
<rect x="234" y="96" width="220" height="42" fill="#D1FAE5"/>
<rect x="454" y="96" width="120" height="42" fill="#D1FAE5"/>
<rect x="64" y="138" width="170" height="42" fill="#FFFFFF"/><rect x="234" y="138" width="220" height="42" fill="#FFFFFF"/><rect x="454" y="138" width="120" height="42" fill="#FFFFFF"/>
<rect x="64" y="180" width="170" height="42" fill="#ECFDF5"/><rect x="234" y="180" width="220" height="42" fill="#ECFDF5"/><rect x="454" y="180" width="120" height="42" fill="#FFFFFF"/>
<rect x="64" y="222" width="170" height="42" fill="#FFFFFF"/><rect x="234" y="222" width="220" height="42" fill="#FFFFFF"/><rect x="454" y="222" width="120" height="42" fill="#FFFFFF"/>
<rect x="64" y="264" width="170" height="42" fill="#ECFDF5"/><rect x="234" y="264" width="220" height="42" fill="#ECFDF5"/><rect x="454" y="264" width="120" height="42" fill="#FFFFFF"/>
</g>
<g font-size="15" font-weight="600" fill="#047857">
<text x="80" y="123">Roll_Number</text>
<text x="250" y="123">Name</text>
<text x="470" y="123">Course</text>
</g>
<g font-size="15" fill="#111827">
<text x="80" y="165">2102</text><text x="250" y="165">Bala Krishnan</text><text x="470" y="165">Civil</text>
<text x="80" y="249">2103</text><text x="250" y="249">Chandra Patel</text><text x="470" y="249">Civil</text>
<text x="470" y="207">Maths</text>
<text x="470" y="291">Physics</text>
</g>
<g font-size="15" font-weight="600" fill="#047857">
<text x="80" y="207">2101</text><text x="250" y="207">Anita Deshmukh</text>
<text x="80" y="291">2101</text><text x="250" y="291">Anita Deshmukh</text>
</g>
<path d="M584,201 H600 V285 H584" fill="none" stroke="#059669" stroke-width="2"/>
<text x="330" y="344" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">these two rows agree on Roll_Number</text>
<text x="330" y="368" text-anchor="middle" font-size="15.5" fill="#475569">and they also agree on Name, so the rule holds</text>
<text x="330" y="412" text-anchor="middle" font-size="15.5" fill="#6B7280">Course differs, and that is fine.</text>
<text x="330" y="436" text-anchor="middle" font-size="15.5" fill="#6B7280">The rule says nothing about Course.</text>

<rect x="640" y="40" width="560" height="440" rx="14" fill="#FEF2F2" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="664" y="70" font-size="16.5" font-weight="600" fill="#BE185D">One row like this breaks it</text>
<g stroke="#F9A8D4" stroke-width="1.3">
<rect x="664" y="96" width="170" height="42" fill="#FCE7F3"/>
<rect x="834" y="96" width="220" height="42" fill="#FCE7F3"/>
<rect x="1054" y="96" width="120" height="42" fill="#FCE7F3"/>
<rect x="664" y="138" width="170" height="42" fill="#FFFFFF"/><rect x="834" y="138" width="220" height="42" fill="#FFFFFF"/><rect x="1054" y="138" width="120" height="42" fill="#FFFFFF"/>
<rect x="664" y="180" width="170" height="42" fill="#FCE7F3"/><rect x="834" y="180" width="220" height="42" fill="#FCE7F3"/><rect x="1054" y="180" width="120" height="42" fill="#FFFFFF"/>
<rect x="664" y="222" width="170" height="42" fill="#FFFFFF"/><rect x="834" y="222" width="220" height="42" fill="#FFFFFF"/><rect x="1054" y="222" width="120" height="42" fill="#FFFFFF"/>
<rect x="664" y="264" width="170" height="42" fill="#FCE7F3"/><rect x="834" y="264" width="220" height="42" fill="#FCE7F3"/><rect x="1054" y="264" width="120" height="42" fill="#FFFFFF"/>
</g>
<g font-size="15" font-weight="600" fill="#BE185D">
<text x="680" y="123">Roll_Number</text>
<text x="850" y="123">Name</text>
<text x="1070" y="123">Course</text>
</g>
<g font-size="15" fill="#111827">
<text x="680" y="165">2102</text><text x="850" y="165">Bala Krishnan</text><text x="1070" y="165">Civil</text>
<text x="680" y="249">2103</text><text x="850" y="249">Chandra Patel</text><text x="1070" y="249">Civil</text>
<text x="1070" y="207">Maths</text>
<text x="1070" y="291">Physics</text>
</g>
<g font-size="15" font-weight="600" fill="#BE185D">
<text x="680" y="207">2101</text><text x="850" y="207">Anita Deshmukh</text>
<text x="680" y="291">2101</text><text x="850" y="291">A. Deshmukh</text>
</g>
<path d="M1184,201 H1196 V285 H1184" fill="none" stroke="#DB2777" stroke-width="2"/>
<text x="930" y="344" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">same Roll_Number, two different Names</text>
<text x="930" y="368" text-anchor="middle" font-size="15.5" fill="#475569">one pair of rows like this is enough to disprove the rule</text>
<text x="930" y="412" text-anchor="middle" font-size="15.5" fill="#6B7280">It does not matter that the two names</text>
<text x="930" y="436" text-anchor="middle" font-size="15.5" fill="#6B7280">refer to the same person. The values differ.</text>

<rect x="40" y="514" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="552" font-size="16" fill="#475569">A dependency is a rule about every row the table could ever hold, not only the rows in it today.</text>
</svg>