<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="908" viewBox="0 0 1240 908" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="fencing-title fencing-desc">
<title id="fencing-title">Fencing tokens</title>
<desc id="fencing-desc">A monotonically increasing number issued with the lock, carried on every write, and checked by the resource, which rejects anything older than what it has already accepted. The stale write identifies itself without anybody detecting the pause.</desc>
<defs>
<marker id="fencing-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="fencing-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="fencing-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="fencing-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="908" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Fencing tokens</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A fencing token is a number that increases every time the lock is granted.</text>
<rect x="40" y="830" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="830" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The same pause, with tokens</text>
<rect x="40" y="168" width="1160" height="42" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="195" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you acquire, and receive token 33</text>
<rect x="40" y="216" width="1160" height="42" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you pause past the lease</text>
<rect x="40" y="264" width="1160" height="42" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="291" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">another process acquires, receives 34, and writes</text>
<rect x="40" y="312" width="1160" height="42" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="339" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the resource records 34</text>
<rect x="40" y="360" width="1160" height="42" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="387" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you resume and write with 33</text>
<rect x="40" y="408" width="1160" height="42" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="435" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the resource rejects it, because 33 is lower than 34</text>
<text x="620" y="482" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">Nothing had to detect the pause. The stale write identifies itself.</text>
<rect x="40" y="504" width="560" height="92" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="504" width="5" height="92" rx="2.5" fill="#39D5AA"/><text x="64" y="530" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The easy half</text><text x="64" y="556" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">etcd gives a revision. ZooKeeper gives</text><text x="64" y="582" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">sequential nodes. A sequence works too.</text>
<rect x="640" y="504" width="560" height="92" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="504" width="5" height="92" rx="2.5" fill="#F28B9D"/><text x="664" y="530" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The hard half</text><text x="664" y="556" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The resource has to enforce it. A token</text><text x="664" y="582" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">nothing checks is just a number.</text>
<text x="40" y="634" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">When the resource cannot check a token, three honest options</text>
<rect x="40" y="652" width="372" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="676.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">make the operation</text><text x="226" y="703.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">idempotent</text>
<rect x="434" y="652" width="372" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="676.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">move the exclusion</text><text x="620" y="703.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">into the resource</text>
<rect x="828" y="652" width="372" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="676.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">accept it is best-effort,</text><text x="1014" y="703.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and say so</text>
<rect x="40" y="742" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="742" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="779" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A lock keeps two processes from starting. Only the resource can keep two from finishing.</text>
<text x="66" y="864" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The resource is the only participant that cannot be paused relative to itself.</text>
</svg>