<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Service consumers such as a web app, a mobile app and a desktop app send a request, for example GET /orders/{id}, to the OrderService contract and receive a response, for example order data. The contract lists GET /orders/{id}, POST /orders and PUT /orders/{id} with their requests, responses and error codes: 404 for GET, 404, 409 and 402 for POST, and 404 for PUT. Below a divider between interface and implementation, the hidden implementation is the request handler, the business logic and the order database">
  <defs>
    <filter id="m06d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m06d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m06d-k1"><rect x="64" y="856" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="m06d-k2"><rect x="464" y="856" width="300" height="90" rx="12"/></clipPath>
    <marker id="m06d-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m06d-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m06d-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m06d-s-slate" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#64748B"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1030" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Service contracts: how SOA separates interface from implementation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Consumers call the contract; the implementation behind it stays hidden.</text>

  <rect x="40" y="110" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#475569">Service consumer (for example, web app, mobile app)</text>
  <rect x="40" y="400" width="1160" height="264" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="430" font-size="19.5" font-weight="600" fill="#5B21B6">Service contract (interface)</text>
  <rect x="64" y="456" width="1112" height="184" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="88" y="486" font-size="19.5" font-weight="600" fill="#5B21B6">OrderService</text>
  <rect x="40" y="776" width="1160" height="214" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="806" font-size="19.5" font-weight="600" fill="#1D4ED8">Service implementation (internal logic)</text>

  <g fill="none" stroke-width="2">
    <path d="M560,290 V400" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m06d-m-blue)"/>
    <path d="M680,400 V290" stroke="#059669" stroke-width="2.5" marker-end="url(#m06d-m-emerald)"/>
    <path d="M40,720 H600" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M640,720 H1200" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M620,696 V744" stroke="#64748B" marker-end="url(#m06d-m-slate)" marker-start="url(#m06d-s-slate)"/>
    <path d="M364,901 H464" stroke="#2563EB" marker-end="url(#m06d-m-blue)"/>
    <path d="M764,901 H880" stroke="#2563EB" marker-end="url(#m06d-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="548" y="336" fill="#1D4ED8" text-anchor="end">Request</text>
    <text x="692" y="336" fill="#047857" text-anchor="start">Response</text>
    <text x="600" y="704" fill="#475569" text-anchor="end">Interface (contract)</text>
    <text x="640" y="748" fill="#475569" text-anchor="start">Implementation (hidden)</text>
  </g>

  <g filter="url(#m06d-soft)">
    <rect x="64" y="856" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="856" width="6" height="90" fill="#2563EB" clip-path="url(#m06d-k1)"/>
  </g>
  <circle cx="102" cy="901" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,890.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="128" y="908" font-size="21.5" font-weight="600" fill="#111827">Request handler</text>
  <g filter="url(#m06d-soft)">
    <rect x="464" y="856" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="464" y="856" width="6" height="90" fill="#2563EB" clip-path="url(#m06d-k2)"/>
  </g>
  <circle cx="502" cy="901" r="18" fill="#FFFFFF"/>
  <g transform="translate(491.56,890.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="528" y="908" font-size="21.5" font-weight="600" fill="#111827">Business logic</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M880,872 L880,950 A120,16 0 0 0 1120,950 L1120,872" fill="#DBEAFE"/>
    <ellipse cx="1000" cy="872" rx="120" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1000" y="926" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Order database</text>
  <text x="548" y="362" font-size="18.5" text-anchor="end" fill="#475569">(for example, GET /orders/{id})</text>
  <text x="692" y="362" font-size="18.5" text-anchor="start" fill="#475569">(for example, order data)</text>
  <text x="88" y="562" font-size="18.5" fill="#1F2937">•  Request: order ID</text>
  <text x="88" y="590" font-size="18.5" fill="#1F2937">•  Response: order data</text>
  <text x="88" y="618" font-size="18.5" fill="#1F2937">•  Errors: 404</text>
  <text x="458" y="562" font-size="18.5" fill="#1F2937">•  Request: order details</text>
  <text x="458" y="590" font-size="18.5" fill="#1F2937">•  Response: created order</text>
  <text x="458" y="618" font-size="18.5" fill="#1F2937">•  Errors: 404, 409, 402</text>
  <text x="828" y="562" font-size="18.5" fill="#1F2937">•  Request: updated fields</text>
  <text x="828" y="590" font-size="18.5" fill="#1F2937">•  Response: updated order</text>
  <text x="828" y="618" font-size="18.5" fill="#1F2937">•  Errors: 404</text>

  <rect x="415" y="190" width="110" height="76" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <g transform="translate(449,207) scale(1.75)" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <rect x="565" y="190" width="110" height="76" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <g transform="translate(599,207) scale(1.75)" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></g>
  <rect x="715" y="190" width="110" height="76" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <g transform="translate(749,207) scale(1.75)" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="88" y="530" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="19" font-weight="700" fill="#111827">GET /orders/{id}</text>
  <text x="458" y="530" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="19" font-weight="700" fill="#111827">POST /orders</text>
  <text x="828" y="530" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="19" font-weight="700" fill="#111827">PUT /orders/{id}</text>


</svg>