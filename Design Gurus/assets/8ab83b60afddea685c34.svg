<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="754" viewBox="0 0 1240 754" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="three-title three-desc">
<title id="three-title">Three migrations, sequenced</title>
<desc id="three-desc">The amount change, the currency column and the card split each get their own sequence. The third goes last and separately, because it is irreversible in a way the other two are not.</desc>
<defs>
<marker id="three-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="three-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="three-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="three-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="754" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three migrations, sequenced</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The amount change, the currency column and the card split each get their own sequence.</text>
<rect x="40" y="676" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="676" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="155" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Combining them is the first temptation and the first mistake.</text>
<rect x="40" y="212" width="372" height="206" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 212H46A6 6 0 0 0 40 218V412A6 6 0 0 0 46 418H54Z" fill="#39D5AA"/>
<circle cx="226" cy="252" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="226" y="260" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="226" y="306" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">A: amount</text>
<text x="226" y="346" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the straightforward application of</text><text x="226" y="371" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the pattern, with the guard and</text><text x="226" y="396" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the transformation in the statement</text>
<rect x="434" y="212" width="372" height="206" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 212H440A6 6 0 0 0 434 218V412A6 6 0 0 0 440 418H448Z" fill="#F3CF6A"/>
<circle cx="620" cy="252" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="260" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="620" y="306" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">B: currency</text>
<text x="620" y="346" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">same shape, and the column stays</text><text x="620" y="371" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">nullable until a separate later</text><text x="620" y="396" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">step after the finance review</text>
<rect x="828" y="212" width="372" height="206" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 212H834A6 6 0 0 0 828 218V412A6 6 0 0 0 834 418H842Z" fill="#F28B9D"/>
<circle cx="1014" cy="252" r="21" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1014" y="260" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1014" y="306" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">C: card columns</text>
<text x="1014" y="346" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">its own change window, a written</text><text x="1014" y="371" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">rollback that admits there is</text><text x="1014" y="396" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">not one, and a person watching</text>
<rect x="40" y="450" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="450" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="487" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A rollback should never have to reason about three changes at once.</text>
<rect x="40" y="544" width="1160" height="100" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="544" width="5" height="100" rx="2.5" fill="#5EC9EC"/><text x="64" y="574" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">The gate for migration A</text><text x="64" y="600" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Zero mismatches across a full month-end, because a payments system has</text><text x="64" y="626" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">month-end jobs and that is where the forgotten writer is.</text>
<text x="66" y="710" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">When the deletion is the goal, there is nothing to restore from afterwards.</text>
</svg>