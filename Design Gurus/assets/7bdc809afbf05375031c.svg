<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="558" viewBox="0 0 1240 558" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With one thread pool per dependency, the slow payments calls fill only their own four threads and then fail fast. Inventory and search keep their own threads and carry on serving normally, so the failure is contained to one compartment">
  <defs>
    <filter id="bh2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bh2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bh2-k1"><rect x="72" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="bh2-k2"><rect x="455" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="bh2-k3"><rect x="838" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="bh2-b1"><rect x="72" y="226" width="330" height="22" rx="6"/></clipPath>
    <clipPath id="bh2-b2"><rect x="455" y="226" width="330" height="22" rx="6"/></clipPath>
    <clipPath id="bh2-b3"><rect x="838" y="226" width="330" height="22" rx="6"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="558" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="312" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#047857">A pool per dependency: the slow one fills its own compartment and stops there</text>

  
  <g filter="url(#bh2-lift)">
    <rect x="72" y="112" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="72" y="112" width="9" height="90" fill="#DB2777" clip-path="url(#bh2-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Payments Pool</text>
  <g clip-path="url(#bh2-b1)">
    <rect x="72" y="226" width="330" height="22" fill="#E2E8F0"/>
    <rect x="72" y="226" width="330" height="22" fill="#DB2777"/>
  </g>
  <rect x="72" y="226" width="330" height="22" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="237" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">4 threads, all 4 held by slow calls</text>
  <text x="237" y="296" font-size="15.5" text-anchor="middle" fill="#94A3B8">the next payment call fails at once</text>
  <text x="237" y="319" font-size="15.5" text-anchor="middle" fill="#94A3B8">and it can borrow nothing</text>

  
  <g filter="url(#bh2-soft)">
    <rect x="455" y="112" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="455" y="112" width="6" height="90" fill="#059669" clip-path="url(#bh2-k2)"/>
  </g>
  <circle cx="493" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="519" y="164" font-size="18.5" font-weight="600" fill="#111827">Inventory Pool</text>
  <g clip-path="url(#bh2-b2)">
    <rect x="455" y="226" width="330" height="22" fill="#E2E8F0"/>
    <rect x="455" y="226" width="110" height="22" fill="#059669"/>
  </g>
  <rect x="455" y="226" width="330" height="22" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="620" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">3 threads, 1 in use</text>
  <text x="620" y="296" font-size="15.5" text-anchor="middle" fill="#94A3B8">serving normally</text>
  <text x="620" y="319" font-size="15.5" text-anchor="middle" fill="#94A3B8">payments cannot touch these</text>

  
  <g filter="url(#bh2-soft)">
    <rect x="838" y="112" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="838" y="112" width="6" height="90" fill="#059669" clip-path="url(#bh2-k3)"/>
  </g>
  <circle cx="876" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="902" y="164" font-size="18.5" font-weight="600" fill="#111827">Search Pool</text>
  <g clip-path="url(#bh2-b3)">
    <rect x="838" y="226" width="330" height="22" fill="#E2E8F0"/>
    <rect x="838" y="226" width="110" height="22" fill="#059669"/>
  </g>
  <rect x="838" y="226" width="330" height="22" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1003" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">3 threads, 1 in use</text>
  <text x="1003" y="296" font-size="15.5" text-anchor="middle" fill="#94A3B8">serving normally</text>
  <text x="1003" y="319" font-size="15.5" text-anchor="middle" fill="#94A3B8">payments cannot touch these</text>

  <rect x="40" y="388" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="412" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="434" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">What you gain</text>
  <text x="288" y="434" font-size="15.5" fill="#475569">a failure is capped at one compartment, so the rest of the service keeps answering requests</text>

  <rect x="64" y="456" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="478" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">What you pay</text>
  <text x="288" y="478" font-size="15.5" fill="#475569">threads reserved for one dependency sit idle when it is quiet, so you trade some capacity for isolation</text>
</svg>