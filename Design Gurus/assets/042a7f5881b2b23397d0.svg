<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Synchronous replication waits for every replica, asynchronous waits for none, and semi-synchronous waits for exactly one">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="rr5-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rr5-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="rr5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="424" y1="112" x2="454" y2="112" stroke="#475569" stroke-width="2.5" marker-end="url(#rr5-slate)"/>
  <line x1="814" y1="112" x2="844" y2="112" stroke="#475569" stroke-width="2.5" marker-end="url(#rr5-slate)"/>
  <line x1="424" y1="282" x2="454" y2="282" stroke="#475569" stroke-width="2.5" marker-end="url(#rr5-slate)"/>
  <line x1="694" y1="282" x2="754" y2="282" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#rr5-amber)"/>
  <line x1="424" y1="452" x2="454" y2="452" stroke="#475569" stroke-width="2.5" marker-end="url(#rr5-slate)"/>
  <line x1="774" y1="452" x2="804" y2="452" stroke="#475569" stroke-width="2.5" marker-end="url(#rr5-slate)"/>
  <line x1="1044" y1="452" x2="1068" y2="452" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#rr5-amber)"/>

  <g filter="url(#rr5-soft)">
    <rect x="244" y="80" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="454" y="80" width="360" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="844" y="80" width="230" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

    <rect x="244" y="250" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="454" y="250" width="240" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="754" y="250" width="320" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4"/>

    <rect x="244" y="420" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="454" y="420" width="320" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="804" y="420" width="240" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="1068" y="420" width="128" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>

  <text x="220" y="104" font-size="20" font-weight="700" fill="#0F172A" text-anchor="end">Synchronous</text>
  <text x="220" y="132" font-size="20" fill="#64748B" text-anchor="end">slowest, safest</text>
  <text x="220" y="274" font-size="20" font-weight="700" fill="#0F172A" text-anchor="end">Asynchronous</text>
  <text x="220" y="302" font-size="20" fill="#64748B" text-anchor="end">fastest, riskiest</text>
  <text x="220" y="444" font-size="20" font-weight="700" fill="#0F172A" text-anchor="end">Semi-synchronous</text>
  <text x="220" y="472" font-size="20" fill="#64748B" text-anchor="end">the middle ground</text>

  <text x="334" y="119" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">write</text>
  <text x="634" y="119" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">wait for every replica</text>
  <text x="959" y="119" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">acknowledge</text>

  <text x="334" y="289" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">write</text>
  <text x="574" y="289" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">acknowledge</text>
  <text x="914" y="289" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">replicas catch up later</text>

  <text x="334" y="459" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">write</text>
  <text x="614" y="459" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">wait for one replica</text>
  <text x="924" y="459" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">acknowledge</text>
  <text x="1132" y="459" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">rest later</text>

  <text x="620" y="530" font-size="20" fill="#475569" text-anchor="middle">The only question is how many replicas must confirm before the client is told the write is done.</text>
</svg>