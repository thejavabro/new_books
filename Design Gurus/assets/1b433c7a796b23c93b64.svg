<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="924" viewBox="0 0 1240 924" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A cart stays editable for days while several ten-minute quotes come and go, each bound to one cart ETag. The active quote leads to one checkout carrying an idempotency key, which then references a payment and an order.">
  <defs>
    <marker id="p2y-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p2y-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p2y-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2y-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2y-k1"><rect x="64" y="92" width="1112" height="90" rx="12"/></clipPath>
    <clipPath id="p2y-k2"><rect x="64" y="254" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p2y-k3"><rect x="460" y="254" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p2y-k4"><rect x="856" y="254" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p2y-k5"><rect x="440" y="490" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p2y-k6"><rect x="180" y="670" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p2y-k7"><rect x="760" y="670" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="924" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="744" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">A cart lives for days, a quote for ten minutes</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">three quotes come and go while one cart stays</text>

  
  <g fill="none" stroke-width="2">
    <path d="M224,182 V254" stroke="#64748B" stroke-dasharray="6 6" marker-end="url(#p2y-sl)"/>
    <path d="M620,182 V254" stroke="#64748B" stroke-dasharray="6 6" marker-end="url(#p2y-sl)"/>
    <path d="M1016,182 V254" stroke="#64748B" stroke-dasharray="6 6" marker-end="url(#p2y-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M1132,344 V428 Q1132,440 1120,440 H632 Q620,440 620,452 V490" stroke="#059669" marker-end="url(#p2y-em)"/>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M500,580 V616 Q500,628 488,628 H342 Q330,628 330,640 V670" stroke="#059669" marker-end="url(#p2y-em)"/>
    <path d="M740,580 V616 Q740,628 752,628 H898 Q910,628 910,640 V670" stroke="#059669" marker-end="url(#p2y-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="866" y="432" fill="#047857">Idempotency-Key</text>
  </g>

  
  <g filter="url(#p2y-soft)">
    <rect x="64" y="92" width="1112" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="92" width="6" height="90" fill="#2563EB" clip-path="url(#p2y-k1)"/>
  </g>
  <circle cx="102" cy="137" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,126.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="20" r="1.6"/>
    <circle cx="18" cy="20" r="1.6"/>
    <path d="M2.5 3.5h3l2.6 11.2h10.2l2.2-8.2H7"/>
  </g>
  <text x="128" y="144" font-size="18.5" font-weight="600" fill="#111827">Cart, editable for days</text>

  
  <g filter="url(#p2y-soft)">
    <rect x="64" y="254" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="254" width="6" height="90" fill="#D97706" clip-path="url(#p2y-k2)"/>
  </g>
  <circle cx="102" cy="299" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,288.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="128" y="306" font-size="18.5" font-weight="600" fill="#111827">Quote</text>
  <text x="224" y="369" text-anchor="middle" font-size="15.5" fill="#6B7280">ten minutes, then expired</text>
  <text x="224" y="392" text-anchor="middle" font-size="15.5" fill="#94A3B8">cart ETag crt-81M-r5</text>

  
  <g filter="url(#p2y-soft)">
    <rect x="460" y="254" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="460" y="254" width="6" height="90" fill="#D97706" clip-path="url(#p2y-k3)"/>
  </g>
  <circle cx="498" cy="299" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,288.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="524" y="306" font-size="18.5" font-weight="600" fill="#111827">Quote</text>
  <text x="620" y="369" text-anchor="middle" font-size="15.5" fill="#6B7280">ten minutes, then expired</text>
  <text x="620" y="392" text-anchor="middle" font-size="15.5" fill="#94A3B8">cart ETag crt-81M-r6</text>

  
  <g filter="url(#p2y-lift)">
    <rect x="856" y="254" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="856" y="254" width="9" height="90" fill="#D97706" clip-path="url(#p2y-k4)"/>
  </g>
  <circle cx="894" cy="299" r="18" fill="#FFFFFF"/>
  <g transform="translate(883.56,288.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="920" y="306" font-size="18.5" font-weight="600" fill="#111827">Quote, active</text>
  <text x="1016" y="369" text-anchor="middle" font-size="15.5" fill="#6B7280">ten minutes, still valid</text>
  <text x="1016" y="392" text-anchor="middle" font-size="15.5" fill="#94A3B8">cart ETag crt-81M-r7</text>

  
  <g filter="url(#p2y-lift)">
    <rect x="440" y="490" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="440" y="490" width="9" height="90" fill="#059669" clip-path="url(#p2y-k5)"/>
  </g>
  <circle cx="478" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,524.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="504" y="542" font-size="18.5" font-weight="600" fill="#111827">Checkout</text>
  <text x="620" y="605" text-anchor="middle" font-size="15.5" fill="#6B7280">one purchase attempt</text>

  
  <g filter="url(#p2y-soft)">
    <rect x="180" y="670" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="180" y="670" width="6" height="90" fill="#059669" clip-path="url(#p2y-k6)"/>
  </g>
  <circle cx="218" cy="715" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,704.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="19" height="14" rx="2"/>
    <path d="M2.5 10h19"/>
  </g>
  <text x="244" y="722" font-size="18.5" font-weight="600" fill="#111827">Payment</text>

  
  <g filter="url(#p2y-soft)">
    <rect x="760" y="670" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="760" y="670" width="6" height="90" fill="#059669" clip-path="url(#p2y-k7)"/>
  </g>
  <circle cx="798" cy="715" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,704.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="824" y="722" font-size="18.5" font-weight="600" fill="#111827">Order</text>

  
  <rect x="40" y="808" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="853" text-anchor="middle" font-size="16" fill="#475569">The cart holds selection. Only the quote promises a price, and only for its lifetime.</text>
</svg>