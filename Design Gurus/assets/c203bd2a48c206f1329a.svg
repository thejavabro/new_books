<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="556" viewBox="0 0 1240 556" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five machines are split by a network partition into a group of three and a group of two. The group of three has a majority and elects a leader. The group of two cannot reach three votes, so it elects nobody and accepts no writes.">
  <rect x="0" y="0" width="1240" height="556" fill="#FFFFFF"/>
  <defs>
    <marker id="lf4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lf4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lf4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lf4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lf4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lf4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="lf4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lf4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lf4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Why only one side can elect a leader</text>
  <path d="M620 102 V468" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="620" y="92" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="middle">network partition</text>
  <rect x="40" y="116" width="540" height="340" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="310" y="158" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">three machines</text>
  <g filter="url(#lf4-soft)"><rect x="80" y="186" width="140" height="66" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/></g>
  <text x="150" y="228" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">A</text>
  <g filter="url(#lf4-soft)"><rect x="250" y="186" width="140" height="66" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/></g>
  <text x="320" y="228" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">B</text>
  <g filter="url(#lf4-soft)"><rect x="420" y="186" width="140" height="66" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/></g>
  <text x="490" y="228" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">C</text>
  <text x="310" y="288" font-size="18" fill="#64748B" text-anchor="middle">they can still reach each other</text>
  <text x="310" y="324" font-size="20" fill="#0F172A" text-anchor="middle">three votes out of five</text>
  <text x="310" y="356" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">that is a majority</text>
  <g filter="url(#lf4-soft)"><rect x="130" y="376" width="360" height="60" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="2"/></g>
  <text x="310" y="414" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">a leader is elected</text>
  <rect x="660" y="116" width="540" height="340" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="930" y="158" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="middle">two machines</text>
  <g filter="url(#lf4-soft)"><rect x="775" y="186" width="140" height="66" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="845" y="228" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">D</text>
  <g filter="url(#lf4-soft)"><rect x="945" y="186" width="140" height="66" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1015" y="228" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">E</text>
  <text x="930" y="288" font-size="18" fill="#64748B" text-anchor="middle">the old leader may be on this side</text>
  <text x="930" y="324" font-size="20" fill="#0F172A" text-anchor="middle">only two votes out of five</text>
  <text x="930" y="356" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">not a majority</text>
  <g filter="url(#lf4-soft)"><rect x="750" y="376" width="360" height="60" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/></g>
  <text x="930" y="414" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">no leader, no writes</text>
  <rect x="40" y="476" width="1160" height="56" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="510" font-size="19" font-weight="600" fill="#0F172A" text-anchor="middle">Only one group can hold more than half, so two leaders cannot exist at the same time.</text>
</svg>