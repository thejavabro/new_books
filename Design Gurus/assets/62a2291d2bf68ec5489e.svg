<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The prioritized operation list from the ten-minute reading-list answer, showing that a compressed answer still names every caller job it supports.">
  <defs>
    <marker id="p3v-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>

    <filter id="p3v-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3v-k1"><rect x="76" y="176" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k2"><rect x="76" y="252" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k3"><rect x="76" y="328" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k4"><rect x="76" y="404" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k5"><rect x="76" y="480" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k6"><rect x="516" y="176" width="648" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k7"><rect x="516" y="252" width="648" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k8"><rect x="516" y="328" width="648" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k9"><rect x="516" y="404" width="648" height="48" rx="10"/></clipPath>
    <clipPath id="p3v-k10"><rect x="516" y="480" width="648" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">A ten-minute answer still names every job</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">five jobs, five operations</text>

  
  <rect x="40" y="126" width="1160" height="426" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Job</text>
  <text x="516" y="156" font-size="16.5" font-weight="600" fill="#047857">Operation</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M436,200 H516" marker-end="url(#p3v-bl)"/>
    <path d="M436,276 H516" marker-end="url(#p3v-bl)"/>
    <path d="M436,352 H516" marker-end="url(#p3v-bl)"/>
    <path d="M436,428 H516" marker-end="url(#p3v-bl)"/>
    <path d="M436,504 H516" marker-end="url(#p3v-bl)"/>
  </g>

  
  <g filter="url(#p3v-soft)">
    <rect x="76" y="176" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="176" width="6" height="48" fill="#2563EB" clip-path="url(#p3v-k1)"/>
  </g>
  <circle cx="110" cy="200" r="4.5" fill="#2563EB"/>
  <text x="134" y="207" font-size="18.5" font-weight="600" fill="#111827">Save the current page</text>
  <g filter="url(#p3v-soft)">
    <rect x="516" y="176" width="648" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="516" y="176" width="6" height="48" fill="#059669" clip-path="url(#p3v-k6)"/>
  </g>
  <circle cx="550" cy="200" r="4.5" fill="#059669"/>
  <text x="574" y="207" font-size="18.5" font-weight="600" fill="#111827">POST /saved-articles</text>

  
  <g filter="url(#p3v-soft)">
    <rect x="76" y="252" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="252" width="6" height="48" fill="#2563EB" clip-path="url(#p3v-k2)"/>
  </g>
  <circle cx="110" cy="276" r="4.5" fill="#2563EB"/>
  <text x="134" y="283" font-size="18.5" font-weight="600" fill="#111827">List saved pages</text>
  <g filter="url(#p3v-soft)">
    <rect x="516" y="252" width="648" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="516" y="252" width="6" height="48" fill="#059669" clip-path="url(#p3v-k7)"/>
  </g>
  <circle cx="550" cy="276" r="4.5" fill="#059669"/>
  <text x="574" y="283" font-size="18.5" font-weight="600" fill="#111827">GET /saved-articles?status=unread&amp;limit=20&amp;cursor=...</text>

  
  <g filter="url(#p3v-soft)">
    <rect x="76" y="328" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="328" width="6" height="48" fill="#2563EB" clip-path="url(#p3v-k3)"/>
  </g>
  <circle cx="110" cy="352" r="4.5" fill="#2563EB"/>
  <text x="134" y="359" font-size="18.5" font-weight="600" fill="#111827">Read one saved page</text>
  <g filter="url(#p3v-soft)">
    <rect x="516" y="328" width="648" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="516" y="328" width="6" height="48" fill="#059669" clip-path="url(#p3v-k8)"/>
  </g>
  <circle cx="550" cy="352" r="4.5" fill="#059669"/>
  <text x="574" y="359" font-size="18.5" font-weight="600" fill="#111827">GET /saved-articles/{saved_article_id}</text>

  
  <g filter="url(#p3v-soft)">
    <rect x="76" y="404" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="404" width="6" height="48" fill="#2563EB" clip-path="url(#p3v-k4)"/>
  </g>
  <circle cx="110" cy="428" r="4.5" fill="#2563EB"/>
  <text x="134" y="435" font-size="18.5" font-weight="600" fill="#111827">Mark it finished</text>
  <g filter="url(#p3v-soft)">
    <rect x="516" y="404" width="648" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="516" y="404" width="6" height="48" fill="#059669" clip-path="url(#p3v-k9)"/>
  </g>
  <circle cx="550" cy="428" r="4.5" fill="#059669"/>
  <text x="574" y="435" font-size="18.5" font-weight="600" fill="#111827">PATCH /saved-articles/{saved_article_id}</text>

  
  <g filter="url(#p3v-soft)">
    <rect x="76" y="480" width="360" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="480" width="6" height="48" fill="#2563EB" clip-path="url(#p3v-k5)"/>
  </g>
  <circle cx="110" cy="504" r="4.5" fill="#2563EB"/>
  <text x="134" y="511" font-size="18.5" font-weight="600" fill="#111827">Remove it</text>
  <g filter="url(#p3v-soft)">
    <rect x="516" y="480" width="648" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="516" y="480" width="6" height="48" fill="#059669" clip-path="url(#p3v-k10)"/>
  </g>
  <circle cx="550" cy="504" r="4.5" fill="#059669"/>
  <text x="574" y="511" font-size="18.5" font-weight="600" fill="#111827">DELETE /saved-articles/{saved_article_id}</text>

  
  <rect x="40" y="580" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="622" text-anchor="middle" font-size="16" fill="#475569">This is the prioritized operation list from the ten-minute reading-list answer.</text>
  <text x="620" y="650" text-anchor="middle" font-size="16" fill="#475569">The list is compressed, and every caller job it supports is still named.</text>
</svg>