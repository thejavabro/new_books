<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1270" viewBox="0 0 1240 1270" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A two by two grid. Vertical axis: effect on the main requirement, high meaning 2 or 3. Horizontal axis: cost to fix, low meaning 5 engineer-days or less. Upper left, high effect and low cost: 1, unchecked write to menu_items, effect 2, 0.5 engineer-days; 2, steps out of order with no transaction, effect 2, 2 engineer-days; 3, rules in the route with a second copy, effect 2, 2.5 engineer-days. Upper right, high effect and high cost: no finding in this review. Lower left, low effect and low cost: 4, tests that check almost nothing, effect 0, 1 engineer-day; 5, Payments writes the order status, effect 0, 0.1 engineer-days; both fixed now as part of the fixes for 1 to 3. 7, one Menu query per line, effect 0, 0.5 engineer-days; 8, notifier factory with one implementation, effect 0, 0.1 engineer-days. Lower right, low effect and high cost: 6, Dispatch reads the orders table in 14 queries, effect 0, about 100 engineer-days.">
  <defs>
    <filter id="md05b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md05b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md05b-k1"><rect x="144" y="200" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md05b-k2"><rect x="144" y="330" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md05b-k3"><rect x="144" y="460" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md05b-k4"><rect x="694" y="200" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md05b-k5"><rect x="144" y="670" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md05b-k6"><rect x="144" y="800" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md05b-k7"><rect x="144" y="930" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md05b-k8"><rect x="144" y="1060" width="482" height="56" rx="12"/></clipPath>
    <clipPath id="md05b-k9"><rect x="694" y="670" width="482" height="56" rx="12"/></clipPath>
    <marker id="md05b-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1270" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Ranking the findings by effect and cost to fix</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Green findings are fixed now. Findings 4 and 5 are part of the fixes for 1 to 3.</text>

  <rect x="120" y="120" width="530" height="450" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="144" y="150" font-size="19.5" font-weight="600" fill="#047857">High effect, low cost</text>
  <rect x="670" y="120" width="530" height="450" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="694" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">High effect, high cost</text>
  <rect x="120" y="590" width="530" height="580" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="144" y="620" font-size="19.5" font-weight="600" fill="#475569">Low effect, low cost</text>
  <rect x="670" y="590" width="530" height="580" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="694" y="620" font-size="19.5" font-weight="600" fill="#BE185D">Low effect, high cost</text>

  <g fill="none" stroke-width="2">
    <path d="M120,1200 H1200" stroke="#64748B" marker-end="url(#md05b-m-slate)"/>
    <path d="M90,1170 V120" stroke="#64748B" marker-end="url(#md05b-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

