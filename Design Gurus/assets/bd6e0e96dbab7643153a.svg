    <rect x="144" y="200" width="9" height="56" fill="#059669" clip-path="url(#md05b-k1)"/>
  </g>
  <text x="164" y="235" font-size="18.5" font-weight="600" fill="#111827">1. Unchecked write to menu_items</text>
  <text x="385" y="285" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 2, cost 0.5 engineer-days</text>
  <g filter="url(#md05b-lift)">
    <rect x="144" y="330" width="482" height="56" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="144" y="330" width="9" height="56" fill="#059669" clip-path="url(#md05b-k2)"/>
  </g>
  <text x="164" y="365" font-size="18.5" font-weight="600" fill="#111827">2. Steps out of order, no transaction</text>
  <text x="385" y="415" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 2, cost 2 engineer-days</text>
  <g filter="url(#md05b-lift)">
    <rect x="144" y="460" width="482" height="56" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="144" y="460" width="9" height="56" fill="#059669" clip-path="url(#md05b-k3)"/>
  </g>
  <text x="164" y="495" font-size="18.5" font-weight="600" fill="#111827">3. Rules in the route, second copy</text>
  <text x="385" y="545" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 2, cost 2.5 engineer-days</text>
  <text x="935" y="355" font-size="18.5" text-anchor="middle" fill="#94A3B8">No finding in this review</text>
  <g filter="url(#md05b-lift)">
    <rect x="144" y="670" width="482" height="56" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="144" y="670" width="9" height="56" fill="#059669" clip-path="url(#md05b-k5)"/>
  </g>
  <text x="164" y="705" font-size="18.5" font-weight="600" fill="#111827">4. Tests that check almost nothing</text>
  <text x="385" y="755" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 0, cost 1 engineer-day</text>
  <g filter="url(#md05b-lift)">
    <rect x="144" y="800" width="482" height="56" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="144" y="800" width="9" height="56" fill="#059669" clip-path="url(#md05b-k6)"/>
  </g>
  <text x="164" y="835" font-size="18.5" font-weight="600" fill="#111827">5. Payments writes the order status</text>
  <text x="385" y="885" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 0, cost 0.1 engineer-days</text>
  <g filter="url(#md05b-soft)">
    <rect x="144" y="930" width="482" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="144" y="930" width="6" height="56" fill="#64748B" clip-path="url(#md05b-k7)"/>
  </g>
  <text x="164" y="965" font-size="18.5" font-weight="600" fill="#111827">7. One Menu query per order line</text>
  <text x="385" y="1015" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 0, cost 0.5 engineer-days</text>
  <g filter="url(#md05b-soft)">
    <rect x="144" y="1060" width="482" height="56" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="144" y="1060" width="6" height="56" fill="#64748B" clip-path="url(#md05b-k8)"/>
  </g>
  <text x="164" y="1095" font-size="18.5" font-weight="600" fill="#111827">8. Notifier factory, one implementation</text>
  <text x="385" y="1145" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 0, cost 0.1 engineer-days</text>
  <g filter="url(#md05b-soft)">
    <rect x="694" y="670" width="482" height="56" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="694" y="670" width="6" height="56" fill="#DB2777" clip-path="url(#md05b-k9)"/>
  </g>
  <text x="714" y="705" font-size="18.5" font-weight="600" fill="#111827">6. Dispatch reads the orders table</text>
  <text x="935" y="755" font-size="18.5" text-anchor="middle" fill="#6B7280">effect 0, about 100 engineer-days</text>
  <text x="660" y="1244" font-size="18.5" font-weight="600" text-anchor="middle" fill="#475569">Cost to fix: low (5 engineer-days or less) on the left, high on the right</text>

  <text transform="rotate(-90 70 645)" x="70" y="645" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Effect on the main requirement: high (2 or 3) at the top</text>


</svg>