<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="875" viewBox="0 0 1240 875" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Hybrid coordination: an orchestrator synchronously commands inventory, payments, and fulfillment, and publishes events that choreographed notifications and analytics consumers react to on their own">
  <defs>
    <marker id="m03-l05-hybrid-orchestration-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l05-hybrid-orchestration-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m03-l05-hybrid-orchestration-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="875" fill="#FFFFFF"/>

  <rect x="40" y="70" width="1160" height="250" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="108" font-size="20" font-weight="600" fill="#1E3A8A">Orchestrated: the money steps</text>
  <rect x="40" y="380" width="1160" height="290" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="418" font-size="20" font-weight="600" fill="#92400E">Choreographed: the reactions</text>

  
  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M410,180 V146 H595 V162" marker-end="url(#m03-l05-hybrid-orchestration-bl)"/>
    <path d="M410,205 V134 H835 V162" marker-end="url(#m03-l05-hybrid-orchestration-bl)"/>
    <path d="M410,230 V122 H1075 V162" marker-end="url(#m03-l05-hybrid-orchestration-bl)"/>
  </g>
  <path d="M240,285 V360 H620 V442" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m03-l05-hybrid-orchestration-am)"/>
  <g fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 5">
    <path d="M540,540 C540,552 450,554 450,562" marker-end="url(#m03-l05-hybrid-orchestration-am)"/>
    <path d="M700,540 C700,552 810,554 810,562" marker-end="url(#m03-l05-hybrid-orchestration-am)"/>
  </g>

  <g filter="url(#m03-l05-hybrid-orchestration-soft)">
    <rect x="70" y="155" width="340" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="240" y="199" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orchestrator:</text>
  <text x="240" y="229" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">checkout saga</text>
  <text x="240" y="263" text-anchor="middle" font-size="20" fill="#64748B">keeps saga state</text>

  <g filter="url(#m03-l05-hybrid-orchestration-soft)">
    <rect x="490" y="170" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="595" y="222" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <g filter="url(#m03-l05-hybrid-orchestration-soft)">
    <rect x="730" y="170" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="835" y="222" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <g filter="url(#m03-l05-hybrid-orchestration-soft)">
    <rect x="970" y="170" width="210" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1075" y="222" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>

  <g filter="url(#m03-l05-hybrid-orchestration-soft)">
    <rect x="420" y="450" width="400" height="90" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="620" y="491" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Event stream</text>
  <text x="620" y="521" text-anchor="middle" font-size="20" fill="#64748B">order placed, order shipped</text>
  <g filter="url(#m03-l05-hybrid-orchestration-soft)">
    <rect x="300" y="566" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="450" y="609" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="450" y="639" text-anchor="middle" font-size="20" fill="#64748B">email the customer</text>
  <g filter="url(#m03-l05-hybrid-orchestration-soft)">
    <rect x="660" y="566" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="810" y="609" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Analytics</text>
  <text x="810" y="639" text-anchor="middle" font-size="20" fill="#64748B">dashboards from events</text>

  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="595" y="292" fill="#1E40AF">1. reserve</text>
    <text x="835" y="292" fill="#1E40AF">2. charge</text>
    <text x="1075" y="292" fill="#1E40AF">3. fulfill</text>
    <text x="580" y="350" fill="#92400E">publishes events along the way</text>
  </g>

  <text x="620" y="718" text-anchor="middle" font-size="20" fill="#475569">Real systems use both at once. The orchestrator runs the checkout saga,</text>
  <text x="620" y="750" text-anchor="middle" font-size="20" fill="#475569">and the events it emits feed reactions it never has to know about.</text>

  <line x1="50" y1="800" x2="86" y2="800" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="807" font-size="20" fill="#475569">Orchestrated command: the coordinator calls, waits, and records the result</text>
  <line x1="50" y1="840" x2="86" y2="840" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="98" y="847" font-size="20" fill="#475569">Event: published once, and whoever subscribes reacts on its own</text>
</svg>