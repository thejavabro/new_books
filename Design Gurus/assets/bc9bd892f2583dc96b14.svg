<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four decisions inside the POST slash v1 slash ids endpoint. It is a POST rather than a GET because a cached ID would be a duplicate ID. IDs are returned as strings because JavaScript loses precision above two to the fifty-third. A count parameter of up to one thousand means one round trip per thousand rows. There is no idempotency key, because a wasted ID costs nothing.">
  <defs>
    <filter id="uidapi-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="uidapi-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="uidapi-k1"><rect x="60" y="175" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="uidapi-k2"><rect x="350" y="175" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="uidapi-k3"><rect x="640" y="175" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="uidapi-k4"><rect x="930" y="175" width="250" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Four decisions inside one endpoint</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">POST /v1/ids. Each field below answers a question that would otherwise be argued twice.</text>

  <rect x="40" y="115" width="1160" height="245" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="145" font-size="19.5" font-weight="600" fill="#1D4ED8">POST /v1/ids</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#uidapi-soft)">
    <rect x="60" y="175" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="175" width="6" height="90" fill="#2563EB" clip-path="url(#uidapi-k1)"/>
  </g>
  <circle cx="98" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,209.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="124" y="227" font-size="21.5" font-weight="600" fill="#111827">POST, not GET</text>
  <text x="185" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a cached ID is</text>
  <text x="185" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">a duplicate ID</text>
  <g filter="url(#uidapi-soft)">
    <rect x="350" y="175" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="350" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#uidapi-k2)"/>
  </g>
  <circle cx="388" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="414" y="227" font-size="21.5" font-weight="600" fill="#111827">IDs as strings</text>
  <text x="475" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">JavaScript loses</text>
  <text x="475" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">precision past 2^53</text>
  <g filter="url(#uidapi-lift)">
    <rect x="640" y="175" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="640" y="175" width="9" height="90" fill="#059669" clip-path="url(#uidapi-k3)"/>
  </g>
  <circle cx="678" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="704" y="227" font-size="21.5" font-weight="600" fill="#111827">count up to 1000</text>
  <text x="765" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">one round trip</text>
  <text x="765" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">per thousand rows</text>
  <g filter="url(#uidapi-soft)">
    <rect x="930" y="175" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="930" y="175" width="6" height="90" fill="#64748B" clip-path="url(#uidapi-k4)"/>
  </g>
  <circle cx="968" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="994" y="227" font-size="21.5" font-weight="600" fill="#111827">No idem. key</text>
  <text x="1055" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a wasted ID</text>
  <text x="1055" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">costs nothing</text>

  <rect x="40" y="400" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="425" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="450" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">The one that matters</text>
  <text x="323" y="450" font-size="18.5" fill="#475569">Making an ID is microseconds; asking for one is milliseconds. So ask once.</text>
  <rect x="64" y="475" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="500" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Why retries are free</text>
  <text x="323" y="500" font-size="18.5" fill="#475569">Nothing is recorded, so a repeat just makes another ID and the old one is dropped.</text>
  <rect x="64" y="525" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="550" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Safe by method</text>
  <text x="323" y="550" font-size="18.5" fill="#475569">A GET may be cached by anything in the path, and this call is not safe to repeat.</text>
</svg>