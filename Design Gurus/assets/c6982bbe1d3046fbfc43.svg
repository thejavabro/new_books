<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An army knife carries three jobs and has three reasons to change, while a kitchen knife has one job and one reason to change">
  <defs>
    <filter id="sak-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sak-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="sak-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="sak-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <clipPath id="sak-army"><rect x="170" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="sak-j1"><rect x="70" y="270" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="sak-j2"><rect x="245" y="270" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="sak-j3"><rect x="420" y="270" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="sak-kit"><rect x="770" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="sak-j4"><rect x="795" y="270" width="250" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="400" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#B45309">One tool that tries to do everything</text>

  <g fill="none" stroke-width="2">
    <path d="M245,200 V220 Q245,232 233,232 H157 Q145,232 145,244 V264" stroke="#D97706" marker-end="url(#sak-am)"/>
    <path d="M320,200 V264" stroke="#D97706" marker-end="url(#sak-am)"/>
    <path d="M395,200 V220 Q395,232 407,232 H483 Q495,232 495,244 V264" stroke="#D97706" marker-end="url(#sak-am)"/>
  </g>

  <g filter="url(#sak-lift)">
    <rect x="170" y="110" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="170" y="110" width="9" height="90" fill="#D97706" clip-path="url(#sak-army)"/>
  </g>
  <circle cx="210" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(199.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="236" y="162" font-size="18.5" font-weight="600" fill="#111827">Army knife</text>

  <g filter="url(#sak-soft)">
    <rect x="70" y="270" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="270" width="6" height="90" fill="#64748B" clip-path="url(#sak-j1)"/>
  </g>
  <circle cx="108" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,304.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><path d="M12 3.5v3.5M12 17v3.5M3.5 12h3.5M17 12h3.5M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>
  </g>
  <text x="134" y="322" font-size="18.5" font-weight="600" fill="#111827">Cutting</text>

  <g filter="url(#sak-soft)">
    <rect x="245" y="270" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="245" y="270" width="6" height="90" fill="#64748B" clip-path="url(#sak-j2)"/>
  </g>
  <circle cx="283" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(272.56,304.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><path d="M12 3.5v3.5M12 17v3.5M3.5 12h3.5M17 12h3.5M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>
  </g>
  <text x="309" y="322" font-size="18.5" font-weight="600" fill="#111827">Opening</text>

  <g filter="url(#sak-soft)">
    <rect x="420" y="270" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="420" y="270" width="6" height="90" fill="#64748B" clip-path="url(#sak-j3)"/>
  </g>
  <circle cx="458" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,304.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><path d="M12 3.5v3.5M12 17v3.5M3.5 12h3.5M17 12h3.5M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>
  </g>
  <text x="484" y="322" font-size="18.5" font-weight="600" fill="#111827">Turning</text>
  <text x="320" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">three jobs inside one tool</text>
  <text x="320" y="408" font-size="15.5" text-anchor="middle" fill="#B45309">so three reasons to change it</text>

  
  <rect x="640" y="40" width="560" height="400" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#047857">One tool with one job</text>

  <g fill="none" stroke-width="2.5">
    <path d="M920,200 V264" stroke="#059669" marker-end="url(#sak-em)"/>
  </g>

  <g filter="url(#sak-lift)">
    <rect x="770" y="110" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="770" y="110" width="9" height="90" fill="#059669" clip-path="url(#sak-kit)"/>
  </g>
  <circle cx="810" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(799.56,144.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 3.5v6L11 18l-4-4z"/><path d="M7 14l-3.5 3.5"/>
  </g>
  <text x="836" y="162" font-size="18.5" font-weight="600" fill="#111827">Kitchen knife</text>

  <g filter="url(#sak-soft)">
    <rect x="795" y="270" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="795" y="270" width="6" height="90" fill="#059669" clip-path="url(#sak-j4)"/>
  </g>
  <circle cx="833" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(822.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/><path d="M12 3.5v3.5M12 17v3.5M3.5 12h3.5M17 12h3.5M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>
  </g>
  <text x="859" y="322" font-size="18.5" font-weight="600" fill="#111827">Cutting</text>
  <text x="920" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">one job, and it is sharp at it</text>
  <text x="920" y="408" font-size="15.5" text-anchor="middle" fill="#047857">so one reason to change it</text>

  
  <rect x="40" y="470" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="494" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="516" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Many jobs</text>
  <text x="288" y="516" font-size="15.5" fill="#475569">a class that does several unrelated things has several reasons to be opened and changed</text>
  <rect x="64" y="538" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="560" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">One job</text>
  <text x="288" y="560" font-size="15.5" fill="#475569">a class with a single purpose changes for a single reason, which is what the principle asks for</text>
</svg>