<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shed-title shed-desc">
<title id="shed-title">Which work to refuse</title>
<desc id="shed-desc">Four natural orderings for prioritized shedding, and the two mechanical details that decide whether shedding helps at all.</desc>
<defs>
<marker id="shed-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shed-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shed-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shed-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="796" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Which work to refuse</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Useful shedding is prioritized, and the priorities come from a few natural orderings.</text>
<rect x="40" y="718" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="718" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="56" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="56" rx="2.5" fill="#F28B9D"/><text x="64" y="152" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Random rejection is the default, and it wastes the one decision that matters</text>
<circle cx="60" cy="224" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="231" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="192" width="440" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="230" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">By request type</text>
<path d="M536 224H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 224H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shed-marker-slate)"/>
<rect x="570" y="192" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="217.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a purchase outranks a dashboard read;</text><text x="590" y="242.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a health check outranks both</text>
<circle cx="60" cy="296" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="303" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="264" width="440" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="302" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">By user state</text>
<path d="M536 296H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 296H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shed-marker-slate)"/>
<rect x="570" y="264" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="289.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an in-progress session outranks a new one,</text><text x="590" y="314.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because abandoning somebody halfway is worse</text>
<circle cx="60" cy="368" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="375" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="336" width="440" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="374" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">By cost</text>
<path d="M536 368H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 368H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shed-marker-slate)"/>
<rect x="570" y="336" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="361.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">expensive queries are both the likely cause</text><text x="590" y="386.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the cheapest to refuse</text>
<circle cx="60" cy="440" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="447" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="408" width="440" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">By tenant</text>
<path d="M536 440H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 440H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shed-marker-slate)"/>
<rect x="570" y="408" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="446" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one tenant should not consume the capacity of all the others</text>
<rect x="40" y="494" width="560" height="120" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="494" width="5" height="120" rx="2.5" fill="#39D5AA"/><text x="64" y="521" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Reject early and cheaply</text><text x="64" y="547" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a rejection after parsing, auth and</text><text x="64" y="573" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a database connection has spent</text><text x="64" y="599" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">what it was meant to save</text>
<rect x="640" y="494" width="560" height="120" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="494" width="5" height="120" rx="2.5" fill="#F3CF6A"/><text x="664" y="521" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Reject clearly</text><text x="664" y="547" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a distinct response saying refused</text><text x="664" y="573" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">for capacity, with a hint about</text><text x="664" y="599" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">when to come back</text>
<rect x="40" y="636" width="1160" height="56" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="636" width="5" height="56" rx="2.5" fill="#AC8BE8"/><text x="64" y="670" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">Shedding clients cannot distinguish from an error creates the load it was meant to reduce.</text>
<text x="66" y="752" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Shedding belongs at the edge, before the expensive work.</text>
</svg>