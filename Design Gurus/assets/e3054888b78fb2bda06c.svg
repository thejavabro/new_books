<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The provider uploads content to the edge servers ahead of time, so every user request is already a cache hit">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="cd10-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cd10-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="cd10-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="58" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Push CDN: content is uploaded before anyone asks for it</text>

  <line x1="278" y1="215" x2="492" y2="126" stroke="#D97706" stroke-width="2.5" marker-end="url(#cd10-amber)"/>
  <line x1="278" y1="215" x2="492" y2="215" stroke="#D97706" stroke-width="2.5" marker-end="url(#cd10-amber)"/>
  <line x1="278" y1="215" x2="492" y2="304" stroke="#D97706" stroke-width="2.5" marker-end="url(#cd10-amber)"/>

  <line x1="686" y1="120" x2="782" y2="120" stroke="#059669" stroke-width="2.5" marker-end="url(#cd10-emerald)"/>
  <line x1="686" y1="215" x2="782" y2="215" stroke="#059669" stroke-width="2.5" marker-end="url(#cd10-emerald)"/>
  <line x1="686" y1="310" x2="782" y2="310" stroke="#059669" stroke-width="2.5" marker-end="url(#cd10-emerald)"/>

  <g filter="url(#cd10-soft)">
    <rect x="55" y="175" width="220" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>

    <rect x="500" y="92" width="184" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="500" y="187" width="184" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="500" y="282" width="184" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

    <rect x="788" y="92" width="170" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="788" y="187" width="170" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="788" y="282" width="170" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <text x="165" y="205" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Content</text>
  <text x="165" y="233" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">provider</text>

  <text x="592" y="127" font-size="20" fill="#065F46" text-anchor="middle">Edge server</text>
  <text x="592" y="222" font-size="20" fill="#065F46" text-anchor="middle">Edge server</text>
  <text x="592" y="317" font-size="20" fill="#065F46" text-anchor="middle">Edge server</text>

  <text x="873" y="127" font-size="20" fill="#0F172A" text-anchor="middle">User</text>
  <text x="873" y="222" font-size="20" fill="#0F172A" text-anchor="middle">User</text>
  <text x="873" y="317" font-size="20" fill="#0F172A" text-anchor="middle">User</text>

  <text x="385" y="382" font-size="20" fill="#92400E" text-anchor="middle">1 pushed ahead of time</text>
  <text x="845" y="382" font-size="20" fill="#065F46" text-anchor="middle">2 every request is a hit</text>

  <rect x="1000" y="175" width="200" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1100" y="205" font-size="20" fill="#475569" text-anchor="middle">Stored twice:</text>
  <text x="1100" y="233" font-size="20" fill="#475569" text-anchor="middle">origin and CDN</text>
</svg>