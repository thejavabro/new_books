<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1366" viewBox="0 0 1240 1366" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A top down flow of six numbered steps, each card carrying its minute budget in the title and its visible artifact underneath. Step one consumers and jobs, five minutes. Step two resources, five minutes. Step three operations, ten minutes. Step four one operation in full, ten minutes, drawn with a thicker border and marked never cut. Step five hard parts, ten minutes. Step six trade-offs, five minutes. The total is forty five minutes.">
  <defs>
    <marker id="yl04sixstep-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="yl04sixstep-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="yl04sixstep-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="yl04sixstep-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="yl04sixstep-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="yl04sixstep-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl04sixstep-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl04sixstep-k1"><rect x="340" y="100" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl04sixstep-k2"><rect x="340" y="272" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl04sixstep-k3"><rect x="340" y="444" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl04sixstep-k4"><rect x="340" y="616" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl04sixstep-k5"><rect x="340" y="788" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="yl04sixstep-k6"><rect x="340" y="960" width="560" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1366" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="1158" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The six-step answer path</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">each step shows the result you should produce</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,232 V272" stroke="#7C3AED" marker-end="url(#yl04sixstep-vi)"/>
    <path d="M620,404 V444" stroke="#059669" marker-end="url(#yl04sixstep-em)"/>
    <path d="M620,748 V788" stroke="#D97706" marker-end="url(#yl04sixstep-am)"/>
    <path d="M620,920 V960" stroke="#DB2777" marker-end="url(#yl04sixstep-pk)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,576 V616" stroke="#2563EB" marker-end="url(#yl04sixstep-bl)"/>
  </g>
  <g fill="none" stroke-width="2">
    <path d="M900,661 H930" stroke="#2563EB" marker-end="url(#yl04sixstep-bl)"/>
  </g>

  
  <g filter="url(#yl04sixstep-soft)">
    <rect x="340" y="100" width="560" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="340" y="100" width="6" height="90" fill="#4F46E5" clip-path="url(#yl04sixstep-k1)"/>
  </g>
  <circle cx="378" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,134.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="404" y="152" font-size="18.5" font-weight="600" fill="#111827">1. Consumers and jobs (5 min)</text>
  <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">A caller and job list, plus the scope</text>

  
  <g filter="url(#yl04sixstep-soft)">
    <rect x="340" y="272" width="560" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="340" y="272" width="6" height="90" fill="#7C3AED" clip-path="url(#yl04sixstep-k2)"/>
  </g>
  <circle cx="378" cy="317" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,306.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="404" y="324" font-size="18.5" font-weight="600" fill="#111827">2. Resources (5 min)</text>
  <text x="620" y="387" font-size="15.5" text-anchor="middle" fill="#6B7280">Resources, identifiers, relationships</text>

  
  <g filter="url(#yl04sixstep-soft)">
    <rect x="340" y="444" width="560" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="340" y="444" width="6" height="90" fill="#059669" clip-path="url(#yl04sixstep-k3)"/>
  </g>
  <circle cx="378" cy="489" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,478.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="404" y="496" font-size="18.5" font-weight="600" fill="#111827">3. Operations (10 min)</text>
  <text x="620" y="559" font-size="15.5" text-anchor="middle" fill="#6B7280">A prioritized operation table</text>

  
  <g filter="url(#yl04sixstep-lift)">
    <rect x="340" y="616" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="340" y="616" width="9" height="90" fill="#2563EB" clip-path="url(#yl04sixstep-k4)"/>
  </g>
  <circle cx="378" cy="661" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,650.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="404" y="668" font-size="18.5" font-weight="600" fill="#111827">4. One operation in full (10 min)</text>
  <rect x="930" y="641" width="130" height="40" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="995" y="667" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Never cut</text>
  <text x="620" y="731" font-size="15.5" text-anchor="middle" fill="#6B7280">Request, response, status codes, errors</text>

  
  <g filter="url(#yl04sixstep-soft)">
    <rect x="340" y="788" width="560" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="340" y="788" width="6" height="90" fill="#D97706" clip-path="url(#yl04sixstep-k5)"/>
  </g>
  <circle cx="378" cy="833" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,822.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="404" y="840" font-size="18.5" font-weight="600" fill="#111827">5. Hard parts (10 min)</text>
  <text x="620" y="903" font-size="15.5" text-anchor="middle" fill="#6B7280">Decisions on the relevant concerns</text>

  
  <g filter="url(#yl04sixstep-soft)">
    <rect x="340" y="960" width="560" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="340" y="960" width="6" height="90" fill="#DB2777" clip-path="url(#yl04sixstep-k6)"/>
  </g>
  <circle cx="378" cy="1005" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,994.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="404" y="1012" font-size="18.5" font-weight="600" fill="#111827">6. Trade-offs (5 min)</text>
  <text x="620" y="1075" font-size="15.5" text-anchor="middle" fill="#6B7280">Options rejected and costs accepted</text>

  
  <rect x="340" y="1115" width="560" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="1146" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">5 + 5 + 10 + 10 + 10 + 5 = 45 minutes</text>

  
  <rect x="40" y="1226" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1268" text-anchor="middle" font-size="16" fill="#475569">Suggested plan for a 45-minute API design discussion.</text>
  <text x="620" y="1296" text-anchor="middle" font-size="16" fill="#475569">Keep time for one complete operation; adjust to the discussion.</text>
</svg>