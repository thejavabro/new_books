<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five characteristics of a distributed system: scalability, reliability, availability, efficiency and manageability. Each row shows the question it answers and how it is measured.">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="kd1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="kd1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="kd1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="kd1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="kd1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="kd1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="kd1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="kd1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The five words, the question each one answers, and how each one is measured</text>
  <text x="66" y="76" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">WORD</text>
  <text x="340" y="76" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">THE QUESTION IT ANSWERS</text>
  <text x="800" y="76" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">HOW IT IS MEASURED</text>
  <path d="M40 88 H1200" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
  <g filter="url(#kd1-soft)"><rect x="40" y="100" width="1160" height="82" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <rect x="40" y="100" width="9" height="82" rx="4" fill="#3B82F6"/>
  <text x="66" y="148" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="start">Scalability</text>
  <text x="340" y="148" font-size="20" fill="#0F172A" text-anchor="start">Can it do more work if we add machines?</text>
  <text x="800" y="148" font-size="20" fill="#64748B" text-anchor="start">Response time and cost as load grows</text>
  <g filter="url(#kd1-soft)"><rect x="40" y="194" width="1160" height="82" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <rect x="40" y="194" width="9" height="82" rx="4" fill="#7C3AED"/>
  <text x="66" y="242" font-size="22" font-weight="700" fill="#6D28D9" text-anchor="start">Reliability</text>
  <text x="340" y="242" font-size="20" fill="#0F172A" text-anchor="start">Does it give the correct result over time?</text>
  <text x="800" y="242" font-size="20" fill="#64748B" text-anchor="start">MTBF, the time between failures</text>
  <g filter="url(#kd1-soft)"><rect x="40" y="288" width="1160" height="82" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/></g>
  <rect x="40" y="288" width="9" height="82" rx="4" fill="#059669"/>
  <text x="66" y="336" font-size="22" font-weight="700" fill="#065F46" text-anchor="start">Availability</text>
  <text x="340" y="336" font-size="20" fill="#0F172A" text-anchor="start">Can it answer during the promised time?</text>
  <text x="800" y="336" font-size="20" fill="#64748B" text-anchor="start">Percent of the promised time</text>
  <g filter="url(#kd1-soft)"><rect x="40" y="382" width="1160" height="82" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/></g>
  <rect x="40" y="382" width="9" height="82" rx="4" fill="#D97706"/>
  <text x="66" y="430" font-size="22" font-weight="700" fill="#B45309" text-anchor="start">Efficiency</text>
  <text x="340" y="430" font-size="20" fill="#0F172A" text-anchor="start">What do we get for the resources we use?</text>
  <text x="800" y="430" font-size="20" fill="#64748B" text-anchor="start">Latency, throughput, cost</text>
  <g filter="url(#kd1-soft)"><rect x="40" y="476" width="1160" height="82" rx="11" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/></g>
  <rect x="40" y="476" width="9" height="82" rx="4" fill="#0D9488"/>
  <text x="66" y="524" font-size="22" font-weight="700" fill="#0F766E" text-anchor="start">Manageability</text>
  <text x="340" y="524" font-size="20" fill="#0F172A" text-anchor="start">How fast can we find and fix a problem?</text>
  <text x="800" y="524" font-size="20" fill="#64748B" text-anchor="start">MTTR, the time to repair</text>
  <rect x="40" y="578" width="1160" height="54" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="620" y="612" font-size="20" fill="#64748B" text-anchor="middle">A good design puts a number next to every row.</text>
</svg>