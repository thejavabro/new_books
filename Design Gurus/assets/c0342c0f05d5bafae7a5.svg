<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="738" viewBox="0 0 1240 738" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same restaurant record stored as a relational row, a document, a key-value pair, a wide column row, and a graph node">
<rect x="0" y="0" width="1240" height="738" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">Relational: fixed columns, and every row has all of them</text>
<g stroke="#93C5FD" stroke-width="1.2">
<rect x="380" y="98" width="90" height="40" fill="#DBEAFE"/>
<rect x="470" y="98" width="240" height="40" fill="#DBEAFE"/>
<rect x="710" y="98" width="150" height="40" fill="#DBEAFE"/>
<rect x="380" y="138" width="90" height="40" fill="#FFFFFF"/>
<rect x="470" y="138" width="240" height="40" fill="#FFFFFF"/>
<rect x="710" y="138" width="150" height="40" fill="#FFFFFF"/>
<rect x="380" y="178" width="90" height="40" fill="#FFFFFF"/>
<rect x="470" y="178" width="240" height="40" fill="#FFFFFF"/>
<rect x="710" y="178" width="150" height="40" fill="#FFFFFF"/>
</g>
<g font-size="15.5" font-weight="600" fill="#1D4ED8">
<text x="394" y="124">id</text>
<text x="484" y="124">name</text>
<text x="724" y="124">city</text>
</g>
<g font-size="15.5" fill="#111827">
<text x="394" y="164">7</text>
<text x="484" y="164">Cafe Madras</text>
<text x="724" y="164">Chennai</text>
<text x="394" y="204">8</text>
<text x="484" y="204">Anand Bhavan</text>
<text x="724" y="204">Madurai</text>
</g>
<text x="620" y="242" font-size="15.5" text-anchor="middle" fill="#6B7280">a new field means changing the table for every row</text>

<rect x="40" y="290" width="275" height="310" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="60" y="320" font-size="16.5" font-weight="600" fill="#5B21B6">Document</text>
<rect x="60" y="340" width="235" height="170" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.2"/>
<g font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="13.5" fill="#111827">
<text x="76" y="366">{</text>
<text x="92" y="392">id: 7,</text>
<text x="92" y="418">name: "Cafe Madras",</text>
<text x="92" y="444">city: "Chennai",</text>
<text x="92" y="470">dishes: ["Dosa"]</text>
<text x="76" y="496">}</text>
</g>
<text x="177" y="540" font-size="15.5" text-anchor="middle" fill="#6B7280">MongoDB, Couchbase</text>
<text x="177" y="563" font-size="15.5" text-anchor="middle" fill="#94A3B8">each record read as a whole</text>

<rect x="335" y="290" width="275" height="310" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
<text x="355" y="320" font-size="16.5" font-weight="600" fill="#B45309">Key-value</text>
<rect x="355" y="352" width="235" height="60" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="472" y="378" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">key</text>
<text x="472" y="400" text-anchor="middle" font-size="15.5" fill="#111827">rest:7</text>
<rect x="355" y="430" width="235" height="80" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
<text x="472" y="456" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">value</text>
<text x="472" y="478" text-anchor="middle" font-size="15.5" fill="#111827">one blob of bytes</text>
<text x="472" y="498" text-anchor="middle" font-size="14" fill="#94A3B8">the store cannot look inside</text>
<text x="472" y="540" font-size="15.5" text-anchor="middle" fill="#6B7280">Redis</text>
<text x="472" y="563" font-size="15.5" text-anchor="middle" fill="#94A3B8">lookup by one key only</text>

<rect x="630" y="290" width="275" height="310" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="650" y="320" font-size="16.5" font-weight="600" fill="#047857">Wide column</text>
<g stroke="#6EE7B7" stroke-width="1.2">
<rect x="650" y="352" width="70" height="42" fill="#D1FAE5"/>
<rect x="720" y="352" width="82" height="42" fill="#FFFFFF"/>
<rect x="802" y="352" width="83" height="42" fill="#FFFFFF"/>
<rect x="650" y="410" width="70" height="42" fill="#D1FAE5"/>
<rect x="720" y="410" width="82" height="42" fill="#FFFFFF"/>
</g>
<g font-size="14" fill="#111827">
<text x="662" y="378">row 7</text>
<text x="732" y="378">name</text>
<text x="814" y="378">city</text>
<text x="662" y="436">row 8</text>
<text x="732" y="436">name</text>
</g>
<text x="767" y="482" font-size="14" text-anchor="middle" fill="#94A3B8">row 8 simply has no city cell</text>
<text x="767" y="540" font-size="15.5" text-anchor="middle" fill="#6B7280">Cassandra, HBase</text>
<text x="767" y="563" font-size="15.5" text-anchor="middle" fill="#94A3B8">huge tables across machines</text>

<rect x="925" y="290" width="275" height="310" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="945" y="320" font-size="16.5" font-weight="600" fill="#4338CA">Graph</text>
<g fill="none" stroke="#4F46E5" stroke-width="2">
<path d="M1010,392 L1090,440"/>
<path d="M1010,392 L1010,462"/>
</g>
<circle cx="1010" cy="374" r="28" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="1010" y="379" text-anchor="middle" font-size="13" font-weight="600" fill="#4338CA">Cafe</text>
<circle cx="1105" cy="452" r="28" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="1105" y="457" text-anchor="middle" font-size="13" font-weight="600" fill="#4338CA">Dosa</text>
<circle cx="1010" cy="480" r="28" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
<text x="1010" y="485" text-anchor="middle" font-size="13" font-weight="600" fill="#4338CA">City</text>
<text x="1062" y="540" font-size="15.5" text-anchor="middle" fill="#6B7280">Neo4j</text>
<text x="1062" y="563" font-size="15.5" text-anchor="middle" fill="#94A3B8">questions about connections</text>

<rect x="40" y="634" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="672" font-size="16" fill="#475569">The same facts, five shapes. The shape you pick decides which questions are cheap and which get expensive.</text>
</svg>