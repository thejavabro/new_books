<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="currency-title currency-desc">
<title id="currency-title">The change that is not an engineering decision</title>
<desc id="currency-desc">Backfilling a default currency is almost certainly correct, and in a payments table that is not the same as correct. Whether any historical row is something else is a question for finance rather than engineering.</desc>
<defs>
<marker id="currency-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="currency-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="currency-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="currency-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="702" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The change that is not an engineering decision</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Whether any historical row is something else is a question for finance rather than engineering.</text>
<rect x="40" y="624" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="624" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="1160" height="84" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="84" rx="2.5" fill="#F3CF6A"/><text x="64" y="153" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Default every existing row to the one traded currency.</text><text x="64" y="179" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Almost certainly right, and "almost certainly" is doing real work here.</text>
<text x="40" y="240" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">What might not be that currency</text>
<rect x="40" y="258" width="372" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="293" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a test account</text>
<rect x="434" y="258" width="372" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="293" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">an acquisition</text>
<rect x="828" y="258" width="372" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="293" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a manual correction</text>
<rect x="40" y="348" width="560" height="150" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="348" width="5" height="150" rx="2.5" fill="#F28B9D"/><text x="64" y="377" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Why the next phase makes it permanent</text><text x="64" y="403" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Making the column NOT NULL asserts the backfilled</text><text x="64" y="429" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">value is correct for all eleven million rows. If it is</text><text x="64" y="455" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">wrong for forty, the error is now indistinguishable</text><text x="64" y="481" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">from the truth, because nothing records uncertainty.</text>
<rect x="640" y="348" width="560" height="124" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="348" width="5" height="124" rx="2.5" fill="#39D5AA"/><text x="664" y="377" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The senior move</text><text x="664" y="403" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Notice that one of three changes needs an answer</text><text x="664" y="429" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">from somebody else, and say so before writing</text><text x="664" y="455" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">any of it.</text>
<rect x="40" y="530" width="1160" height="62" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="530" width="5" height="62" rx="2.5" fill="#5EC9EC"/><text x="64" y="567" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Keep the column nullable through the whole migration, and tighten it only after the review</text>
<text x="66" y="658" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Tightening to NOT NULL is a contract-phase action, and here is why it waits.</text>
</svg>