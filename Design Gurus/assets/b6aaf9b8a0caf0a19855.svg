    <filter id="msa1c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="msa1c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="msa1c-k1"><rect x="40" y="180" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="msa1c-k2"><rect x="364" y="180" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="msa1c-k3"><rect x="364" y="310" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="msa1c-k4"><rect x="364" y="440" width="192" height="90" rx="12"/></clipPath>
    <clipPath id="msa1c-k5"><rect x="572" y="440" width="192" height="90" rx="12"/></clipPath>
    <clipPath id="msa1c-k6"><rect x="896" y="483" width="280" height="56" rx="12"/></clipPath>
    <clipPath id="msa1c-k7"><rect x="896" y="559" width="280" height="56" rx="12"/></clipPath>
    <clipPath id="msa1c-k8"><rect x="896" y="635" width="280" height="56" rx="12"/></clipPath>
    <marker id="msa1c-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="msa1c-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="960" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Layered architecture of a monolith</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A request enters at the presentation layer and flows down through the layers to the database and external services.</text>

  <rect x="340" y="130" width="448" height="480" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="364" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Monolithic application</text>
  <rect x="872" y="433" width="328" height="282" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="896" y="463" font-size="19.5" font-weight="600" fill="#BE185D">External services</text>

  <g fill="none" stroke-width="2">
    <path d="M210,210 H340" stroke="#2563EB" marker-end="url(#msa1c-m-blue)"/>
    <path d="M340,240 H210" stroke="#2563EB" marker-end="url(#msa1c-m-blue)"/>
    <path d="M402,270 V310" stroke="#2563EB" marker-end="url(#msa1c-m-blue)"/>
    <path d="M402,400 V440" stroke="#2563EB" marker-end="url(#msa1c-m-blue)"/>
    <path d="M726,400 V440" stroke="#2563EB" marker-end="url(#msa1c-m-blue)"/>
    <path d="M764,470 H872" stroke="#2563EB" marker-end="url(#msa1c-m-blue)"/>
    <path d="M872,500 H764" stroke="#2563EB" marker-end="url(#msa1c-m-blue)"/>
    <path d="M460,610 V784" stroke="#2563EB" marker-end="url(#msa1c-m-blue)" marker-start="url(#msa1c-s-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="275" y="197" fill="#1D4ED8">HTTP request</text>
    <text x="275" y="265" fill="#1D4ED8">Response</text>
  </g>

  <g filter="url(#msa1c-soft)">
    <rect x="40" y="180" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="180" width="6" height="90" fill="#64748B" clip-path="url(#msa1c-k1)"/>
  </g>
  <circle cx="78" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="232" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="125" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">browser or mobile app</text>
  <g filter="url(#msa1c-soft)">
    <rect x="364" y="180" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="364" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#msa1c-k2)"/>
  </g>
  <circle cx="402" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(391.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="428" y="232" font-size="21.5" font-weight="600" fill="#111827">Presentation layer</text>
  <text x="554" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">controllers, API endpoints, UI</text>
  <g filter="url(#msa1c-soft)">
    <rect x="364" y="310" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="364" y="310" width="6" height="90" fill="#059669" clip-path="url(#msa1c-k3)"/>
  </g>
  <circle cx="402" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(391.56,344.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="428" y="362" font-size="21.5" font-weight="600" fill="#111827">Business logic layer</text>
  <text x="554" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">services, domain logic</text>
  <g filter="url(#msa1c-soft)">
    <rect x="364" y="440" width="192" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="364" y="440" width="6" height="90" fill="#7C3AED" clip-path="url(#msa1c-k4)"/>
  </g>
  <circle cx="402" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(391.56,474.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="428" y="479.25" font-size="21.5" font-weight="600" fill="#111827">Data access</text>
  <text x="428" y="504.75" font-size="21.5" font-weight="600" fill="#111827">layer</text>
  <text x="460" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">repositories, ORM</text>
  <g filter="url(#msa1c-soft)">
    <rect x="572" y="440" width="192" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="572" y="440" width="6" height="90" fill="#D97706" clip-path="url(#msa1c-k5)"/>
  </g>
  <circle cx="610" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(599.56,474.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h11a4 4 0 0 0 .6-7.95A6 6 0 0 0 7.1 9.1 4.75 4.75 0 0 0 7 18.5z"/></g>
  <text x="636" y="479.25" font-size="21.5" font-weight="600" fill="#111827">Integration</text>
  <text x="636" y="504.75" font-size="21.5" font-weight="600" fill="#111827">layer</text>
  <text x="668" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">external APIs,</text>
  <text x="668" y="585" font-size="18.5" text-anchor="middle" fill="#6B7280">third-party services</text>
  <g filter="url(#msa1c-soft)">
    <rect x="896" y="483" width="280" height="56" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="896" y="483" width="6" height="56" fill="#DB2777" clip-path="url(#msa1c-k6)"/>
  </g>
  <circle cx="934" cy="511" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,500.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="960" y="518" font-size="18.5" font-weight="600" fill="#111827">Email service</text>
  <g filter="url(#msa1c-soft)">
    <rect x="896" y="559" width="280" height="56" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="896" y="559" width="6" height="56" fill="#7C3AED" clip-path="url(#msa1c-k7)"/>
  </g>
  <circle cx="934" cy="587" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,576.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="960" y="594" font-size="18.5" font-weight="600" fill="#111827">Payment processor</text>
  <g filter="url(#msa1c-soft)">
    <rect x="896" y="635" width="280" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="896" y="635" width="6" height="56" fill="#2563EB" clip-path="url(#msa1c-k8)"/>
  </g>
  <circle cx="934" cy="663" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,652.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h11a4 4 0 0 0 .6-7.95A6 6 0 0 0 7.1 9.1 4.75 4.75 0 0 0 7 18.5z"/></g>
  <text x="960" y="670" font-size="18.5" font-weight="600" fill="#111827">Other APIs</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M370,800 L370,894 A90,16 0 0 0 550,894 L550,800" fill="#DBEAFE"/>
    <ellipse cx="460" cy="800" rx="90" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="460" y="849.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Shared</text>
  <text x="460" y="874.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">database</text>




</svg>