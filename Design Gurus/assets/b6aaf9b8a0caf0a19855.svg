<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client sends an HTTP request to a monolithic application made of a presentation layer, a business logic layer, and under it a data access layer beside an integration layer; the data access layer reads and writes a shared database and the integration layer calls an email service, a payment processor and other APIs">
