<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="boundary-title boundary-desc">
<title id="boundary-title">Where to draw the cache boundary</title>
<desc id="boundary-desc">Caching the finished response is coherent and has the lowest hit rate. Caching fragments has the highest hit rate and is where cross-entity incoherence comes from. Caching the inputs and assembling per request costs CPU on every request.</desc>
<defs>
<marker id="boundary-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="boundary-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="boundary-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="boundary-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="674" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where to draw the cache boundary</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three choices come up repeatedly.</text>
<rect x="40" y="596" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="596" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="312" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V424A6 6 0 0 0 46 430H54Z" fill="#5EC9EC"/><text x="226" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="middle">The whole response</text>
<text x="226" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">one entry, one moment</text>
<rect x="60" y="198" width="332" height="30" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="60" y="198" width="83.0" height="30" rx="10" fill="#F25461"/>
<text x="226" y="252" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">lowest hit rate</text>
<rect x="60" y="270" width="332" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">captured at one moment</text>
<rect x="60" y="346" width="332" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="370.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">any per-user difference</text><text x="226" y="397.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">is a new entry</text>
<rect x="434" y="118" width="372" height="312" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V424A6 6 0 0 0 440 430H448Z" fill="#F3CF6A"/><text x="620" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="middle">Fragments</text>
<text x="620" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">header, price, carousel</text>
<rect x="454" y="198" width="332" height="30" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="454" y="198" width="282.2" height="30" rx="10" fill="#06AC80"/>
<text x="620" y="252" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">highest hit rate</text>
<rect x="454" y="270" width="332" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">shared parts are shared</text>
<rect x="454" y="346" width="332" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="370.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">exactly where incoherence</text><text x="620" y="397.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">comes from</text>
<rect x="828" y="118" width="372" height="312" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V424A6 6 0 0 0 834 430H842Z" fill="#39D5AA"/><text x="1014" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="middle">The inputs</text>
<text x="1014" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">assemble per request</text>
<rect x="848" y="198" width="332" height="30" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="848" y="198" width="199.2" height="30" rx="10" fill="#E8BC60"/>
<text x="1014" y="252" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">good hit rate</text>
<rect x="848" y="270" width="332" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1014" y="294.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">coherent if read</text><text x="1014" y="321.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">at one moment</text>
<rect x="848" y="346" width="332" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">CPU on every single request</text>
<rect x="40" y="452" width="1160" height="118" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="452" width="5" height="118" rx="2.5" fill="#AC8BE8"/><text x="64" y="488" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Put the boundary where the consistency requirement changes,</text><text x="64" y="517" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">not where the code boundary happens to be.</text><text x="64" y="546" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A price and its currency belong together. A price and a recommendation carousel do not.</text>
<text x="66" y="630" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Things that must agree with each other belong in one entry, read once.</text>
</svg>