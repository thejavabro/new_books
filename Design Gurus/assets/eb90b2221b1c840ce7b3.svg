<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="686" viewBox="0 0 1240 686" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sizing-title sizing-desc">
<title id="sizing-title">A bigger pool is a slower database</title>
<desc id="sizing-desc">At five thousand queries per second and five milliseconds of service time, twenty five queries execute at any instant. A pool slightly above that keeps the queue outside the database. A pool of five hundred moves the same queue inside the database, where every waiter costs memory and context switches.</desc>
<defs>
<marker id="sizing-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sizing-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sizing-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sizing-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="686" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A bigger pool is a slower database</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The difference that matters is between application concurrency and executing concurrency.</text>
<rect x="40" y="608" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="608" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="86" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="86" rx="2.5" fill="#5EC9EC"/><text x="64" y="152.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Little's law: concurrency = arrival rate x service time</text><text x="64" y="181.5" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">5,000 queries/sec  x  5 ms  =  25 executing at any instant</text>
<rect x="40" y="228" width="560" height="268" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 228H46A6 6 0 0 0 40 234V490A6 6 0 0 0 46 496H54Z" fill="#39D5AA"/><text x="70" y="264" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Pool of 30</text><rect x="72" y="284" width="140" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="142" y="312.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">App</text><text x="142" y="339.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">5,000/sec</text><path d="M215 320H247" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M215 320H247" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sizing-marker-slate)"/><rect x="252" y="284" width="110" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="307" y="312.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Pool</text><text x="307" y="339.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">30</text><path d="M365 320H397" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M365 320H397" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sizing-marker-slate)"/><rect x="402" y="284" width="166" height="72" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="485" y="312.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Database</text><text x="485" y="339.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">25 at a time</text><rect x="72" y="376" width="496" height="96" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="376" width="5" height="96" rx="2.5" fill="#39D5AA"/><text x="96" y="404" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">The queue waits OUTSIDE the database</text><text x="96" y="430" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">waiting costs nothing but time</text><text x="96" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the database runs at its best rate</text>
<rect x="640" y="228" width="560" height="268" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 228H646A6 6 0 0 0 640 234V490A6 6 0 0 0 646 496H654Z" fill="#F28B9D"/><text x="670" y="264" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Pool of 500</text><rect x="672" y="284" width="140" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="742" y="312.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">App</text><text x="742" y="339.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">5,000/sec</text><path d="M815 320H847" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M815 320H847" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sizing-marker-slate)"/><rect x="852" y="284" width="110" height="72" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="907" y="312.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Pool</text><text x="907" y="339.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">500</text><path d="M965 320H997" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M965 320H997" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sizing-marker-slate)"/><rect x="1002" y="284" width="166" height="72" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1085" y="312.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Database</text><text x="1085" y="339.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">25 at a time</text><rect x="672" y="376" width="496" height="96" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="672" y="376" width="5" height="96" rx="2.5" fill="#F28B9D"/><text x="696" y="404" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">The queue waits INSIDE the database</text><text x="696" y="430" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every waiter holds memory and a process</text><text x="696" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">context switching makes all of them slower</text>
<rect x="40" y="520" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="520" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="557" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Size the pool for executing concurrency, not for application concurrency.</text>
<text x="66" y="642" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">For most workloads the right pool size is in the dozens, which is smaller than almost anyone guesses.</text>
</svg>