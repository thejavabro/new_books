<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1722" viewBox="0 0 1240 1722" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Seven alternatives to ordinary REST, each with the named trigger that justifies it and the cost that must be said aloud: gRPC, GraphQL, Server-Sent Events, WebSockets, webhooks, asynchronous jobs, and direct storage locations.">
  <defs>
    <filter id="p3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3-k1"><rect x="76" y="176" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3-k2"><rect x="76" y="348" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3-k3"><rect x="76" y="582" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3-k4"><rect x="76" y="754" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3-k5"><rect x="76" y="988" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3-k6"><rect x="76" y="1160" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3-k7"><rect x="76" y="1394" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1722" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Seven alternatives, seven triggers, seven costs</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M620,72 L632,72 M627.2,66.8 L632.5,72 L627.2,77.2"/>
  </g>
  <text x="648" y="77" font-size="15.5" fill="#6B7280">the named trigger</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M866,66 L877,77 M877,66 L866,77"/>
  </g>
  <text x="894" y="77" font-size="15.5" fill="#6B7280">the cost said aloud</text>

  
  <rect x="40" y="126" width="1160" height="386" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">The call itself changes shape</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#94A3B8">two of the seven</text>

  <g filter="url(#p3-soft)">
    <rect x="76" y="176" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="176" width="6" height="90" fill="#2563EB" clip-path="url(#p3-k1)"/>
  </g>
  <circle cx="114" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,210.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="228" font-size="18.5" font-weight="600" fill="#111827">gRPC</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,287 L90,287 M85.2,281.8 L90.5,287 L85.2,292.2"/>
  </g>
  <text x="106" y="292" font-size="15.5" fill="#6B7280">High-volume internal calls with small typed messages</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,307 L89,318 M89,307 L78,318"/>
  </g>
  <text x="106" y="318" font-size="15.5" fill="#6B7280">Generated code and schema tooling; a browser cannot call it directly</text>

  <g filter="url(#p3-soft)">
    <rect x="76" y="348" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="348" width="6" height="90" fill="#2563EB" clip-path="url(#p3-k2)"/>
  </g>
  <circle cx="114" cy="393" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,382.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="400" font-size="18.5" font-weight="600" fill="#111827">GraphQL</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,459 L90,459 M85.2,453.8 L90.5,459 L85.2,464.2"/>
  </g>
  <text x="106" y="464" font-size="15.5" fill="#6B7280">Several clients need materially different connected field sets</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,479 L89,490 M89,479 L78,490"/>
  </g>
  <text x="106" y="490" font-size="15.5" fill="#6B7280">The server loses control of query shape and must enforce cost</text>

  
  <rect x="40" y="532" width="1160" height="386" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="562" font-size="16.5" font-weight="600" fill="#475569">The connection stays open</text>
  <text x="1176" y="562" text-anchor="end" font-size="15.5" fill="#94A3B8">two of the seven</text>

  <g filter="url(#p3-soft)">
    <rect x="76" y="582" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="582" width="6" height="90" fill="#2563EB" clip-path="url(#p3-k3)"/>
  </g>
  <circle cx="114" cy="627" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,616.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="634" font-size="18.5" font-weight="600" fill="#111827">Server-Sent Events (SSE)</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,693 L90,693 M85.2,687.8 L90.5,693 L85.2,698.2"/>
  </g>
  <text x="106" y="698" font-size="15.5" fill="#6B7280">A browser needs one-way updates</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,713 L89,724 M89,713 L78,724"/>
  </g>
  <text x="106" y="724" font-size="15.5" fill="#6B7280">Long-lived stateful connections and a resume history</text>

  <g filter="url(#p3-soft)">
    <rect x="76" y="754" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="754" width="6" height="90" fill="#2563EB" clip-path="url(#p3-k4)"/>
  </g>
  <circle cx="114" cy="799" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,788.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="806" font-size="18.5" font-weight="600" fill="#111827">WebSockets</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,865 L90,865 M85.2,859.8 L90.5,865 L85.2,870.2"/>
  </g>
  <text x="106" y="870" font-size="15.5" fill="#6B7280">Both client and server must send frequently</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,885 L89,896 M89,885 L78,896"/>
  </g>
  <text x="106" y="896" font-size="15.5" fill="#6B7280">A second message contract, without URL and status semantics</text>

  
  <rect x="40" y="938" width="1160" height="386" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="968" font-size="16.5" font-weight="600" fill="#475569">Work continues after the response</text>
  <text x="1176" y="968" text-anchor="end" font-size="15.5" fill="#94A3B8">two of the seven</text>

  <g filter="url(#p3-soft)">
    <rect x="76" y="988" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="988" width="6" height="90" fill="#2563EB" clip-path="url(#p3-k5)"/>
  </g>
  <circle cx="114" cy="1033" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1022.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="1040" font-size="18.5" font-weight="600" fill="#111827">Webhook</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1099 L90,1099 M85.2,1093.8 L90.5,1099 L85.2,1104.2"/>
  </g>
  <text x="106" y="1104" font-size="15.5" fill="#6B7280">A partner server needs an event after the original call ended</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1119 L89,1130 M89,1119 L78,1130"/>
  </g>
  <text x="106" y="1130" font-size="15.5" fill="#6B7280">Signing, retries, duplicates, delivery history, customer endpoint failures</text>

  <g filter="url(#p3-soft)">
    <rect x="76" y="1160" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="1160" width="6" height="90" fill="#2563EB" clip-path="url(#p3-k6)"/>
  </g>
  <circle cx="114" cy="1205" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1194.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="1212" font-size="18.5" font-weight="600" fill="#111827">Async job</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1271 L90,1271 M85.2,1265.8 L90.5,1271 L85.2,1276.2"/>
  </g>
  <text x="106" y="1276" font-size="15.5" fill="#6B7280">Work cannot finish within the request deadline</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1291 L89,1302 M89,1291 L78,1302"/>
  </g>
  <text x="106" y="1302" font-size="15.5" fill="#6B7280">A lifecycle the caller must poll or subscribe to</text>

  
  <rect x="40" y="1344" width="1160" height="214" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1374" font-size="16.5" font-weight="600" fill="#475569">The bytes do not pass through the API</text>
  <text x="1176" y="1374" text-anchor="end" font-size="15.5" fill="#94A3B8">one of the seven</text>

  <g filter="url(#p3-soft)">
    <rect x="76" y="1394" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="1394" width="6" height="90" fill="#2563EB" clip-path="url(#p3-k7)"/>
  </g>
  <circle cx="114" cy="1439" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1428.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="1446" font-size="18.5" font-weight="600" fill="#111827">Direct storage</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1505 L90,1505 M85.2,1499.8 L90.5,1505 L85.2,1510.2"/>
  </g>
  <text x="106" y="1510" font-size="15.5" fill="#6B7280">Bytes are too large to proxy economically</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1525 L89,1536 M89,1525 L78,1536"/>
  </g>
  <text x="106" y="1536" font-size="15.5" fill="#6B7280">A short-lived credential and a separate completion flow</text>

  
  <rect x="40" y="1582" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1624" text-anchor="middle" font-size="16" fill="#475569">Every gain in this chapter creates an obligation somewhere else.</text>
  <text x="620" y="1652" text-anchor="middle" font-size="16" fill="#475569">This is not a lookup that replaces reasoning. Each choice is paid for somewhere.</text>
</svg>