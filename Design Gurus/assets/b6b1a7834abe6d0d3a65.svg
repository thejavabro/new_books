<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three levels of microservices knowledge, the pieces, the design, and the judgment, and what each one asks of you.">
  <defs>
    <marker id="m01-l01-question-shapes-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m01-l01-question-shapes-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m01-l01-question-shapes-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2.5">
    <path d="M515,102 C515,148 218,134 218,168" stroke="#475569" marker-end="url(#m01-l01-question-shapes-slate)"/>
    <path d="M620,102 L620,168" stroke="#475569" marker-end="url(#m01-l01-question-shapes-slate)"/>
    <path d="M725,102 C725,148 1022,134 1022,168" stroke="#475569" marker-end="url(#m01-l01-question-shapes-slate)"/>
    <path d="M218,280 L218,332" stroke="#059669" marker-end="url(#m01-l01-question-shapes-em)"/>
    <path d="M620,280 L620,332" stroke="#059669" marker-end="url(#m01-l01-question-shapes-em)"/>
    <path d="M1022,280 L1022,332" stroke="#059669" marker-end="url(#m01-l01-question-shapes-em)"/>
  </g>

  
  <g filter="url(#m01-l01-question-shapes-soft)">
    <rect x="445" y="30" width="350" height="72" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="620" y="60" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Microservices knowledge</text>
  <text x="620" y="86" text-anchor="middle" font-size="20" fill="#64748B">works at three levels</text>

  
  <g filter="url(#m01-l01-question-shapes-soft)">
    <rect x="30" y="172" width="376" height="108" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="218" y="204" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Level 1: The pieces</text>
  <text x="218" y="234" text-anchor="middle" font-size="20" fill="#64748B">"What is a circuit breaker?"</text>
  <text x="218" y="261" text-anchor="middle" font-size="20" fill="#64748B">vocabulary and mechanism</text>

  <g filter="url(#m01-l01-question-shapes-soft)">
    <rect x="432" y="172" width="376" height="108" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="620" y="204" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Level 2: The design</text>
  <text x="620" y="234" text-anchor="middle" font-size="20" fill="#64748B">"Design a food delivery app"</text>
  <text x="620" y="261" text-anchor="middle" font-size="20" fill="#64748B">building a real architecture</text>

  <g filter="url(#m01-l01-question-shapes-soft)">
    <rect x="834" y="172" width="376" height="108" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1022" y="204" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Level 3: The judgment</text>
  <text x="1022" y="234" text-anchor="middle" font-size="20" fill="#64748B">"Use microservices at all?"</text>
  <text x="1022" y="261" text-anchor="middle" font-size="20" fill="#64748B">experience and trade-offs</text>

  
  <g filter="url(#m01-l01-question-shapes-soft)">
    <rect x="30" y="340" width="376" height="132" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="218" y="378" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Define it, give an</text>
  <text x="218" y="404" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">example, and name</text>
  <text x="218" y="430" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the trade-off</text>
  <text x="218" y="461" text-anchor="middle" font-size="20" fill="#64748B">short and precise</text>

  <g filter="url(#m01-l01-question-shapes-soft)">
    <rect x="432" y="340" width="376" height="132" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="620" y="378" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Split the system,</text>
  <text x="620" y="404" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">explain the pieces,</text>
  <text x="620" y="430" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">handle failure</text>
  <text x="620" y="461" text-anchor="middle" font-size="20" fill="#64748B">most of the work is here</text>

  <g filter="url(#m01-l01-question-shapes-soft)">
    <rect x="834" y="340" width="376" height="132" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1022" y="378" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Weigh the costs,</text>
  <text x="1022" y="404" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the evidence,</text>
  <text x="1022" y="430" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">and the context</text>
  <text x="1022" y="461" text-anchor="middle" font-size="20" fill="#64748B">the reasoning matters most</text>

  
  <g stroke-width="4">
    <line x1="30" y1="505" x2="64" y2="505" stroke="#475569"/>
    <line x1="640" y1="505" x2="674" y2="505" stroke="#059669"/>
  </g>
  <text x="76" y="512" font-size="20" fill="#475569">The level you are working at</text>
  <text x="686" y="512" font-size="20" fill="#475569">What each level asks of you</text>
</svg>