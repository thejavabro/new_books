<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1103" viewBox="0 0 1240 1103" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One evaluation call returns a complete values object into a local cache, and the application answers many checks from that cache without further network calls. The rejected design makes one remote call per flag, so forty checks become forty round trips whose values come from forty different moments.">
  <defs>
    <marker id="p2v-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p2v-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p2v-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2v-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2v-k1"><rect x="84" y="156" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2v-k2"><rect x="84" y="316" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2v-k3"><rect x="740" y="176" width="416" height="48" rx="10"/></clipPath>
    <clipPath id="p2v-k4"><rect x="740" y="284" width="416" height="48" rx="10"/></clipPath>
    <clipPath id="p2v-k5"><rect x="740" y="392" width="416" height="48" rx="10"/></clipPath>
    <clipPath id="p2v-k6"><rect x="740" y="500" width="416" height="48" rx="10"/></clipPath>
    <clipPath id="p2v-k7"><rect x="89" y="703" width="250" height="48" rx="10"/></clipPath>
    <clipPath id="p2v-k8"><rect x="353" y="703" width="250" height="48" rx="10"/></clipPath>
    <clipPath id="p2v-k9"><rect x="617" y="703" width="250" height="48" rx="10"/></clipPath>
    <clipPath id="p2v-k10"><rect x="881" y="703" width="250" height="48" rx="10"/></clipPath>
    <clipPath id="p2v-k11"><rect x="420" y="817" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1103" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">One evaluated set, many local checks</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one network call, then only local lookups</text>

  
  <rect x="40" y="102" width="1160" height="521" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="132" font-size="16.5" font-weight="600" fill="#047857">One call, then local lookups</text>
  <text x="1176" y="132" text-anchor="end" font-size="15.5" fill="#6B7280">the accepted design</text>

  
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M294,284 V316" stroke-width="2.5" marker-end="url(#p2v-em)"/>
    <path d="M294,444 V476" marker-end="url(#p2v-em)"/>
    <path d="M464,524 H740" marker-end="url(#p2v-em)"/>
    <path d="M464,524 H604 Q616,524 616,512 V428 Q616,416 628,416 H740" marker-end="url(#p2v-em)"/>
    <path d="M464,524 H580 Q592,524 592,512 V320 Q592,308 604,308 H740" marker-end="url(#p2v-em)"/>
    <path d="M464,524 H556 Q568,524 568,512 V212 Q568,200 580,200 H740" marker-end="url(#p2v-em)"/>
  </g>

  
  <g filter="url(#p2v-soft)">
    <rect x="84" y="156" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="156" width="6" height="90" fill="#059669" clip-path="url(#p2v-k1)"/>
  </g>
  <circle cx="122" cy="201" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,190.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="148" y="208" font-size="18.5" font-weight="600" fill="#111827">GET /flag-evaluations</text>
  <text x="294" y="271" text-anchor="middle" font-size="15.5" fill="#6B7280">one request, sent once at startup</text>

  
  <g filter="url(#p2v-lift)">
    <rect x="84" y="316" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="84" y="316" width="9" height="90" fill="#059669" clip-path="url(#p2v-k2)"/>
  </g>
  <circle cx="122" cy="361" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,350.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="148" y="368" font-size="18.5" font-weight="600" fill="#111827">One values object</text>
  <text x="294" y="431" text-anchor="middle" font-size="15.5" fill="#6B7280">one version for the whole set</text>

  
  <g stroke="#059669" stroke-width="1.5">
    <path d="M124,492 L124,556 A170,16 0 0 0 464,556 L464,492" fill="#D1FAE5"/>
    <ellipse cx="294" cy="492" rx="170" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="294" y="536" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Local cache</text>
  <text x="294" y="597" text-anchor="middle" font-size="15.5" fill="#6B7280">held in the application process</text>

  
  <g filter="url(#p2v-soft)">
    <rect x="740" y="176" width="416" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="740" y="176" width="6" height="48" fill="#64748B" clip-path="url(#p2v-k3)"/>
  </g>
  <circle cx="774" cy="200" r="4.5" fill="#64748B"/>
  <text x="798" y="207" font-size="18.5" font-weight="600" fill="#111827">checkout</text>

  <g filter="url(#p2v-soft)">
    <rect x="740" y="284" width="416" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="740" y="284" width="6" height="48" fill="#64748B" clip-path="url(#p2v-k4)"/>
  </g>
  <circle cx="774" cy="308" r="4.5" fill="#64748B"/>
  <text x="798" y="315" font-size="18.5" font-weight="600" fill="#111827">search</text>

  <g filter="url(#p2v-soft)">
    <rect x="740" y="392" width="416" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="740" y="392" width="6" height="48" fill="#64748B" clip-path="url(#p2v-k5)"/>
  </g>
  <circle cx="774" cy="416" r="4.5" fill="#64748B"/>
  <text x="798" y="423" font-size="18.5" font-weight="600" fill="#111827">navigation</text>

  <g filter="url(#p2v-soft)">
    <rect x="740" y="500" width="416" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="740" y="500" width="6" height="48" fill="#64748B" clip-path="url(#p2v-k6)"/>
  </g>
  <circle cx="774" cy="524" r="4.5" fill="#64748B"/>
  <text x="798" y="531" font-size="18.5" font-weight="600" fill="#111827">and more</text>

  <text x="948" y="578" text-anchor="middle" font-size="15.5" fill="#6B7280">Forty checks, no extra network calls.</text>

  
  <rect x="40" y="647" width="1160" height="316" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="677" font-size="16.5" font-weight="600" fill="#BE185D">Rejected: one remote call per flag</text>
  <text x="1176" y="677" text-anchor="end" font-size="15.5" fill="#6B7280">four of the forty calls shown</text>

  
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M214,751 V777 Q214,789 226,789 H448 Q460,789 460,801 V817" marker-end="url(#p2v-pm)"/>
    <path d="M478,751 V777 Q478,789 490,789 H548 Q560,789 560,801 V817" marker-end="url(#p2v-pm)"/>
    <path d="M742,751 V777 Q742,789 730,789 H692 Q680,789 680,801 V817" marker-end="url(#p2v-pm)"/>
    <path d="M1006,751 V777 Q1006,789 994,789 H792 Q780,789 780,801 V817" marker-end="url(#p2v-pm)"/>
  </g>

  <g filter="url(#p2v-soft)">
    <rect x="89" y="703" width="250" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="89" y="703" width="6" height="48" fill="#DB2777" clip-path="url(#p2v-k7)"/>
  </g>
  <circle cx="123" cy="727" r="4.5" fill="#DB2777"/>
  <text x="147" y="734" font-size="18.5" font-weight="600" fill="#111827">GET /flags/a</text>

  <g filter="url(#p2v-soft)">
    <rect x="353" y="703" width="250" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="353" y="703" width="6" height="48" fill="#DB2777" clip-path="url(#p2v-k8)"/>
  </g>
  <circle cx="387" cy="727" r="4.5" fill="#DB2777"/>
  <text x="411" y="734" font-size="18.5" font-weight="600" fill="#111827">GET /flags/b</text>

  <g filter="url(#p2v-soft)">
    <rect x="617" y="703" width="250" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="617" y="703" width="6" height="48" fill="#DB2777" clip-path="url(#p2v-k9)"/>
  </g>
  <circle cx="651" cy="727" r="4.5" fill="#DB2777"/>
  <text x="675" y="734" font-size="18.5" font-weight="600" fill="#111827">GET /flags/c</text>

  <g filter="url(#p2v-soft)">
    <rect x="881" y="703" width="250" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="881" y="703" width="6" height="48" fill="#DB2777" clip-path="url(#p2v-k10)"/>
  </g>
  <circle cx="915" cy="727" r="4.5" fill="#DB2777"/>
  <text x="939" y="734" font-size="18.5" font-weight="600" fill="#111827">GET /flags/d</text>

  
  <g filter="url(#p2v-lift)">
    <rect x="420" y="817" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="420" y="817" width="9" height="90" fill="#DB2777" clip-path="url(#p2v-k11)"/>
  </g>
  <circle cx="458" cy="862" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,851.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="484" y="869" font-size="18.5" font-weight="600" fill="#111827">Forty round trips</text>
  <text x="620" y="932" text-anchor="middle" font-size="15.5" fill="#6B7280">values from forty different moments</text>

  
  <rect x="40" y="987" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1032" text-anchor="middle" font-size="16" fill="#475569">This is an N+1 problem measured in network round trips rather than database queries.</text>
</svg>