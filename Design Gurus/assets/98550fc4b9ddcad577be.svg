<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1072" viewBox="0 0 1240 1072" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The fourteen one-line operations of the Twitter answer, grouped by the five resources they act on: Tweet, User, Follow, Like, and the read-only derived HomeTimeline. Every operation is tied to a caller job and no path contains a verb.">
  <defs>
    <filter id="xl12operati-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl12operati-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl12operati-k1"><rect x="84" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k2"><rect x="84" y="256" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k3"><rect x="84" y="338" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k4"><rect x="84" y="420" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k5"><rect x="84" y="502" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k6"><rect x="84" y="661" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k7"><rect x="84" y="743" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k8"><rect x="684" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k9"><rect x="684" y="256" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k10"><rect x="684" y="338" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k11"><rect x="684" y="497" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k12"><rect x="684" y="579" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k13"><rect x="684" y="661" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl12operati-k14"><rect x="684" y="820" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1072" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Fourteen operations, five resources, no invented verbs</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">every operation is tied to a caller job</text>

  
  <rect x="40" y="126" width="556" height="463" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Tweet</text>
  <text x="572" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">five operations</text>

  <g filter="url(#xl12operati-lift)">
    <rect x="84" y="174" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="84" y="174" width="9" height="48" fill="#2563EB" clip-path="url(#xl12operati-k1)"/>
  </g>
  <circle cx="118" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,189) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="142" y="205" font-size="18.5" font-weight="600" fill="#111827">POST /tweets</text>
  <text x="320" y="242" text-anchor="middle" font-size="15.5" fill="#6B7280">Create an original tweet or a reply</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="84" y="256" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="256" width="6" height="48" fill="#2563EB" clip-path="url(#xl12operati-k2)"/>
  </g>
  <circle cx="118" cy="280" r="4.5" fill="#2563EB"/>
  <text x="142" y="287" font-size="18.5" font-weight="600" fill="#111827">GET /tweets/{tweet_id}</text>
  <text x="320" y="324" text-anchor="middle" font-size="15.5" fill="#6B7280">Read one tweet</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="84" y="338" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="338" width="6" height="48" fill="#2563EB" clip-path="url(#xl12operati-k3)"/>
  </g>
  <circle cx="118" cy="362" r="4.5" fill="#2563EB"/>
  <text x="142" y="369" font-size="18.5" font-weight="600" fill="#111827">DELETE /tweets/{tweet_id}</text>
  <text x="320" y="406" text-anchor="middle" font-size="15.5" fill="#6B7280">Delete one of the caller's tweets</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="84" y="420" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="420" width="6" height="48" fill="#2563EB" clip-path="url(#xl12operati-k4)"/>
  </g>
  <circle cx="118" cy="444" r="4.5" fill="#2563EB"/>
  <text x="142" y="451" font-size="18.5" font-weight="600" fill="#111827">GET /users/{user_id}/tweets</text>
  <text x="320" y="488" text-anchor="middle" font-size="15.5" fill="#6B7280">List a user's tweets</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="84" y="502" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="502" width="6" height="48" fill="#2563EB" clip-path="url(#xl12operati-k5)"/>
  </g>
  <circle cx="118" cy="526" r="4.5" fill="#2563EB"/>
  <text x="142" y="533" font-size="18.5" font-weight="600" fill="#111827">GET /tweets/{tweet_id}/replies</text>
  <text x="320" y="570" text-anchor="middle" font-size="15.5" fill="#6B7280">List replies to one tweet</text>

  
  <rect x="40" y="613" width="556" height="217" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="643" font-size="16.5" font-weight="600" fill="#4338CA">User</text>
  <text x="572" y="643" text-anchor="end" font-size="15.5" fill="#6B7280">two operations</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="84" y="661" width="472" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="661" width="6" height="48" fill="#4F46E5" clip-path="url(#xl12operati-k6)"/>
  </g>
  <circle cx="118" cy="685" r="4.5" fill="#4F46E5"/>
  <text x="142" y="692" font-size="18.5" font-weight="600" fill="#111827">GET /users/{user_id}</text>
  <text x="320" y="729" text-anchor="middle" font-size="15.5" fill="#6B7280">Read one public profile</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="84" y="743" width="472" height="48" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="84" y="743" width="6" height="48" fill="#4F46E5" clip-path="url(#xl12operati-k7)"/>
  </g>
  <circle cx="118" cy="767" r="4.5" fill="#4F46E5"/>
  <text x="142" y="774" font-size="18.5" font-weight="600" fill="#111827">GET /me</text>
  <text x="320" y="811" text-anchor="middle" font-size="15.5" fill="#6B7280">Read the authenticated profile</text>

  
  <rect x="644" y="126" width="556" height="299" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#047857">Follow</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">three operations</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="684" y="174" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="174" width="6" height="48" fill="#059669" clip-path="url(#xl12operati-k8)"/>
  </g>
  <circle cx="718" cy="198" r="4.5" fill="#059669"/>
  <text x="742" y="205" font-size="18.5" font-weight="600" fill="#111827">POST /follows</text>
  <text x="920" y="242" text-anchor="middle" font-size="15.5" fill="#6B7280">Follow a user</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="684" y="256" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="256" width="6" height="48" fill="#059669" clip-path="url(#xl12operati-k9)"/>
  </g>
  <circle cx="718" cy="280" r="4.5" fill="#059669"/>
  <text x="742" y="287" font-size="18.5" font-weight="600" fill="#111827">DELETE /follows/{follow_id}</text>
  <text x="920" y="324" text-anchor="middle" font-size="15.5" fill="#6B7280">Remove a follow</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="684" y="338" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="338" width="6" height="48" fill="#059669" clip-path="url(#xl12operati-k10)"/>
  </g>
  <circle cx="718" cy="362" r="4.5" fill="#059669"/>
  <text x="742" y="369" font-size="18.5" font-weight="600" fill="#111827">GET /users/{user_id}/followers</text>
  <text x="920" y="406" text-anchor="middle" font-size="15.5" fill="#6B7280">List a user's followers</text>

  
  <rect x="644" y="449" width="556" height="299" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="668" y="479" font-size="16.5" font-weight="600" fill="#B45309">Like</text>
  <text x="1176" y="479" text-anchor="end" font-size="15.5" fill="#6B7280">three operations</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="684" y="497" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="497" width="6" height="48" fill="#D97706" clip-path="url(#xl12operati-k11)"/>
  </g>
  <circle cx="718" cy="521" r="4.5" fill="#D97706"/>
  <text x="742" y="528" font-size="18.5" font-weight="600" fill="#111827">PUT /tweets/{tweet_id}/likes/me</text>
  <text x="920" y="565" text-anchor="middle" font-size="15.5" fill="#6B7280">Ensure the current user likes a tweet</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="684" y="579" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="579" width="6" height="48" fill="#D97706" clip-path="url(#xl12operati-k12)"/>
  </g>
  <circle cx="718" cy="603" r="4.5" fill="#D97706"/>
  <text x="742" y="610" font-size="18.5" font-weight="600" fill="#111827">DELETE /tweets/{tweet_id}/likes/me</text>
  <text x="920" y="647" text-anchor="middle" font-size="15.5" fill="#6B7280">Ensure the current user does not like a tweet</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="684" y="661" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="661" width="6" height="48" fill="#D97706" clip-path="url(#xl12operati-k13)"/>
  </g>
  <circle cx="718" cy="685" r="4.5" fill="#D97706"/>
  <text x="742" y="692" font-size="18.5" font-weight="600" fill="#111827">GET /tweets/{tweet_id}/likes</text>
  <text x="920" y="729" text-anchor="middle" font-size="15.5" fill="#6B7280">List users who liked a tweet</text>

  
  <rect x="644" y="772" width="556" height="135" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="668" y="802" font-size="16.5" font-weight="600" fill="#5B21B6">HomeTimeline</text>
  <text x="1176" y="802" text-anchor="end" font-size="15.5" fill="#6B7280">one operation, read only</text>

  <g filter="url(#xl12operati-soft)">
    <rect x="684" y="820" width="472" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="684" y="820" width="6" height="48" fill="#7C3AED" clip-path="url(#xl12operati-k14)"/>
  </g>
  <circle cx="718" cy="844" r="4.5" fill="#7C3AED"/>
  <text x="742" y="851" font-size="18.5" font-weight="600" fill="#111827">GET /home-timeline?limit=20&amp;cursor=...</text>
  <text x="920" y="888" text-anchor="middle" font-size="15.5" fill="#6B7280">Read the first page, or the next</text>

  
  <rect x="40" y="931" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="973" text-anchor="middle" font-size="16" fill="#475569">Step 3 keeps every operation to one line. Bodies and failures come later, for one of them.</text>
  <text x="620" y="1001" text-anchor="middle" font-size="16" fill="#475569">POST /tweets is taken to full depth: it serves all three consumers, and a repeat is safe.</text>
</svg>