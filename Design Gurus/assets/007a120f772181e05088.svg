<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="784" viewBox="0 0 1240 784" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="decide-title decide-desc">
<title id="decide-title">Deciding whether to fix it</title>
<desc id="decide-desc">Not every hole needs repairing in the room, and judging which ones do is itself part of the signal.</desc>
<defs>
<marker id="decide-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="decide-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="decide-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="decide-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="784" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Deciding whether to fix it</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Not every hole needs repairing in the room, and judging which ones do is itself part of the signal.</text>
<rect x="40" y="706" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="706" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="240" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="160" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Fix it now</text>
<rect x="300" y="118" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="320" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it invalidates what comes next: a wrong data model,</text><text x="320" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a key that cannot serve the core query</text>
<rect x="880" y="118" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="900" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the remaining time is wasted</text><text x="900" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">without it</text>
<rect x="40" y="190" width="240" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="160" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Note it and move on</text>
<rect x="300" y="190" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="320" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it is contained: "this retry logic should have a</text><text x="320" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">budget, which I would add"</text>
<rect x="880" y="190" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="900" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">fifteen seconds, and it</text><text x="900" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">preserves the time</text>
<rect x="40" y="262" width="240" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="160" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say it and defer it</text>
<rect x="300" y="262" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="320" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the fix is long and the clock is short</text>
<rect x="880" y="262" width="320" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="900" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">prioritization under a</text><text x="900" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">constraint, not avoidance</text>
<rect x="40" y="352" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="352" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="387" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What is assessed in all three is proportionality</text><text x="64" y="413" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Restarting over a contained issue and ignoring a structural one are the same error.</text>
<rect x="40" y="466" width="1160" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="494.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One honest caution: if the interviewer raised it, they consider it important enough to mention,</text><text x="620" y="521.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">so a contained issue they named should still be engaged with properly</text>
<rect x="40" y="568" width="1160" height="110" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="568" width="5" height="110" rx="2.5" fill="#39D5AA"/><text x="64" y="603" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A legitimate deferral sounds like this</text><text x="64" y="629" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"The right answer is to partition by customer. With the time left I think failure</text><text x="64" y="655" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">handling is more valuable, but that is the change I would make."</text>
<text x="66" y="740" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The senior property in every module of this course.</text>
</svg>