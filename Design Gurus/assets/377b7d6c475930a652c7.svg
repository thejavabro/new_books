<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="726" viewBox="0 0 1240 726" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three Armstrong axioms and the three shortcut rules derived from them, each with the pattern it matches and an example">
<rect x="0" y="0" width="1240" height="726" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="296" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">The three axioms. Everything else is built from these.</text>

<rect x="64" y="96" width="360" height="216" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="88" y="128" font-size="17" font-weight="600" fill="#111827">Reflexivity</text>
<text x="88" y="156" font-size="15" fill="#6B7280">a set decides any part of itself</text>
<rect x="88" y="172" width="312" height="40" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
<text x="244" y="198" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#1D4ED8">if Y is inside X, then X -&gt; Y</text>
<text x="88" y="240" font-size="14.5" font-weight="600" fill="#475569">Example</text>
<text x="88" y="264" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">{Student_ID, Course_ID}</text>
<text x="88" y="288" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">      -&gt; Course_ID</text>

<rect x="440" y="96" width="360" height="216" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="464" y="128" font-size="17" font-weight="600" fill="#111827">Augmentation</text>
<text x="464" y="156" font-size="15" fill="#6B7280">extra columns on both sides are harmless</text>
<rect x="464" y="172" width="312" height="40" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
<text x="620" y="198" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#1D4ED8">if X -&gt; Y, then XZ -&gt; YZ</text>
<text x="464" y="240" font-size="14.5" font-weight="600" fill="#475569">Example</text>
<text x="464" y="264" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">Course_ID -&gt; Instructor gives</text>
<text x="464" y="288" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">{Course_ID, Grade}</text>

<rect x="816" y="96" width="360" height="216" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="840" y="128" font-size="17" font-weight="600" fill="#111827">Transitivity</text>
<text x="840" y="156" font-size="15" fill="#6B7280">dependencies chain end to end</text>
<rect x="840" y="172" width="312" height="40" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
<text x="996" y="198" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#1D4ED8">if X -&gt; Y and Y -&gt; Z, then X -&gt; Z</text>
<text x="840" y="240" font-size="14.5" font-weight="600" fill="#475569">Example</text>
<text x="840" y="264" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">Course_ID -&gt; Instructor and</text>
<text x="840" y="288" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">Instructor -&gt; Dept</text>

<rect x="40" y="370" width="1160" height="296" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="64" y="400" font-size="16.5" font-weight="600" fill="#5B21B6">The three shortcuts, each proved from the axioms above</text>

<rect x="64" y="426" width="360" height="216" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="88" y="458" font-size="17" font-weight="600" fill="#111827">Union</text>
<text x="88" y="486" font-size="15" fill="#6B7280">one determinant, two targets, joined</text>
<rect x="88" y="502" width="312" height="40" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="244" y="528" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#5B21B6">X -&gt; Y and X -&gt; Z give X -&gt; YZ</text>
<text x="88" y="570" font-size="14.5" font-weight="600" fill="#475569">Example</text>
<text x="88" y="594" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">Course_ID -&gt; Instructor and</text>
<text x="88" y="618" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">Course_ID -&gt; Dept</text>

<rect x="440" y="426" width="360" height="216" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="464" y="458" font-size="17" font-weight="600" fill="#111827">Decomposition</text>
<text x="464" y="486" font-size="15" fill="#6B7280">the reverse of union</text>
<rect x="464" y="502" width="312" height="40" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="620" y="528" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#5B21B6">X -&gt; YZ gives X -&gt; Y and X -&gt; Z</text>
<text x="464" y="570" font-size="14.5" font-weight="600" fill="#475569">Example</text>
<text x="464" y="594" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">Course_ID -&gt; {Instructor, Dept}</text>
<text x="464" y="618" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">splits back into two</text>

<rect x="816" y="426" width="360" height="216" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="840" y="458" font-size="17" font-weight="600" fill="#111827">Pseudotransitivity</text>
<text x="840" y="486" font-size="15" fill="#6B7280">chaining when the second rule needs help</text>
<rect x="840" y="502" width="312" height="40" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="996" y="528" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#5B21B6">X -&gt; Y and WY -&gt; Z give WX -&gt; Z</text>
<text x="840" y="570" font-size="14.5" font-weight="600" fill="#475569">Example</text>
<text x="840" y="594" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">the extra W is carried along</text>
<text x="840" y="618" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">from the left of both rules</text>

<rect x="40" y="700" width="1160" height="0" rx="14" fill="none" stroke="none"/>
<text x="64" y="702" font-size="16" fill="#475569">The three axioms are sound and complete: every dependency that follows from a set can be derived using only them.</text>
</svg>