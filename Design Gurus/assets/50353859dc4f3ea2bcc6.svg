  <text x="230" y="782" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A hold with a clock on it.</text>
  <text x="670" y="740" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Created only once payment succeeds.</text>

  <rect x="40" y="830" width="1160" height="180" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="620" y="870" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Why these tables are sharded by user, not by product</text>
  <text x="620" y="910" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A flash sale is one product, so sharding by product_id puts the entire sale on one shard.</text>
  <text x="620" y="940" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Sharding reservations and orders by user_id spreads a hundred thousand clicks across them all.</text>
  <text x="620" y="970" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The stock count cannot be spread, which is why it is one row and why it is guarded.</text>
</svg>