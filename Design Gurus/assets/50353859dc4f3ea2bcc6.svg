  <text x="1000" y="150" font-size="21" font-weight="700" fill="#BE185D" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The hot row</text>
  <text x="1000" y="184" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Every buyer contends for this one row.</text>
  <text x="1000" y="211" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">It is decremented conditionally, so it</text>
  <text x="1000" y="238" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">can never fall below zero.</text>

