<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1040" viewBox="0 0 1240 1040" role="img" aria-label="The flash sale database schema. A product has exactly one inventory row holding its available quantity, decremented by an atomic conditional update so it can never go negative. A reservation row holds stock for one user with an expires_at timestamp, so a hold that is never paid for is released. An order references the reservation it came from. Reservations and orders are sharded by user_id rather than product_id, because sharding by product would put the whole sale on one shard.">
