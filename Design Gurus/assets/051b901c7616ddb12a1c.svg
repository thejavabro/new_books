<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A distributed file system shows the client one logical file tree while file blocks are stored and copied across several storage servers">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="df1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="df1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M345,160 C385,160 400,255 415,302" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#df1-blue)"/>
  <text x="395" y="213" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read and write files</text>

  <path d="M755,270 C785,270 795,165 810,165" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#df1-blue)"/>
  <path d="M755,302 C785,302 795,305 810,305" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#df1-blue)"/>
  <path d="M755,334 C785,334 795,445 810,445" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#df1-blue)"/>
  <text x="785" y="240" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">stores and fetches blocks</text>

  
  <rect x="50" y="80" width="340" height="300" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="220" y="104" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">What the user sees</text>

  <g filter="url(#df1-soft)">
    <rect x="95" y="124" width="250" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="220" y="154" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="220" y="182" font-size="20" fill="#64748B" text-anchor="middle">app or user</text>

  <g filter="url(#df1-soft)">
    <rect x="75" y="220" width="290" height="140" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="220" y="248" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">one logical file tree</text>
  <text x="100" y="282" font-size="20" fill="#64748B">/docs/report.txt</text>
  <text x="100" y="309" font-size="20" fill="#64748B">/photos/trip.jpg</text>
  <text x="100" y="336" font-size="20" fill="#64748B">/videos/demo.mp4</text>

  
  <g filter="url(#df1-soft)">
    <rect x="415" y="250" width="340" height="104" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="585" y="280" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Distributed File System</text>
  <text x="585" y="308" font-size="20" fill="#64748B" text-anchor="middle">one file system view</text>
  <text x="585" y="335" font-size="20" fill="#64748B" text-anchor="middle">maps files to blocks</text>

  
  <rect x="780" y="50" width="420" height="474" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="990" y="74" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Where the data actually lives</text>

  <g filter="url(#df1-soft)">
    <rect x="810" y="110" width="360" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="810" y="250" width="360" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="810" y="390" width="360" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="990" y="140" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Storage server 1</text>
  <rect x="840" y="166" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="916" y="166" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="870" y="191" font-size="20" fill="#5B21B6" text-anchor="middle">B1</text>
  <text x="946" y="191" font-size="20" fill="#5B21B6" text-anchor="middle">B2</text>

  <text x="990" y="280" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Storage server 2</text>
  <rect x="840" y="306" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="916" y="306" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="870" y="331" font-size="20" fill="#5B21B6" text-anchor="middle">B2</text>
  <text x="946" y="331" font-size="20" fill="#5B21B6" text-anchor="middle">B3</text>

  <text x="990" y="420" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Storage server 3</text>
  <rect x="840" y="446" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <rect x="916" y="446" width="60" height="36" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="870" y="471" font-size="20" fill="#5B21B6" text-anchor="middle">B3</text>
  <text x="946" y="471" font-size="20" fill="#5B21B6" text-anchor="middle">B1</text>

  
  <rect x="180" y="564" width="880" height="110" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="594" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The client never sees blocks or servers.</text>
  <text x="620" y="622" font-size="20" fill="#64748B" text-anchor="middle">It works with files and folders.</text>
  <text x="620" y="649" font-size="20" fill="#64748B" text-anchor="middle">The DFS maps each file to blocks (B1, B2, B3) copied across many machines.</text>
</svg>