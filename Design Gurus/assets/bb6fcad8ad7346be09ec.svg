<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="550" viewBox="0 0 1240 550" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A candidate asks four other machines for a vote. Two machines vote yes, one has already voted for another candidate, and one does not answer. With its own vote the candidate has three votes out of five, which is a majority, so it becomes the leader.">
  <rect x="0" y="0" width="1240" height="550" fill="#FFFFFF"/>
  <defs>
    <marker id="lf2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lf2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lf2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lf2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lf2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lf2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="lf2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lf2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lf2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A candidate becomes leader with votes from more than half</text>
  <text x="620" y="72" font-size="19" fill="#64748B" text-anchor="middle">five machines in the group, so three votes are needed</text>
  <g filter="url(#lf2-soft)"><rect x="60" y="212" width="260" height="124" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2.2"/></g>
  <text x="190" y="256" font-size="23" font-weight="700" fill="#B45309" text-anchor="middle">candidate</text>
  <text x="190" y="288" font-size="19" fill="#64748B" text-anchor="middle">votes for itself</text>
  <text x="190" y="318" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">1 vote</text>
  <line x1="324" y1="272" x2="552" y2="150" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lf2-s)"/>
  <g filter="url(#lf2-soft)"><rect x="556" y="110" width="300" height="80" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="706" y="144" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">machine B</text>
  <text x="706" y="172" font-size="18" fill="#065F46" text-anchor="middle">votes yes</text>
  <path d="M889,150 L896,158 L908,142" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <line x1="324" y1="272" x2="552" y2="250" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lf2-s)"/>
  <g filter="url(#lf2-soft)"><rect x="556" y="210" width="300" height="80" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="706" y="244" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">machine C</text>
  <text x="706" y="272" font-size="18" fill="#065F46" text-anchor="middle">votes yes</text>
  <path d="M889,250 L896,258 L908,242" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <line x1="324" y1="272" x2="552" y2="350" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lf2-s)"/>
  <g filter="url(#lf2-soft)"><rect x="556" y="310" width="300" height="80" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5"/></g>
  <text x="706" y="344" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">machine D</text>
  <text x="706" y="372" font-size="18" fill="#64748B" text-anchor="middle">already voted this round</text>
  <path d="M890,342 L906,358 M906,342 L890,358" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <line x1="324" y1="272" x2="552" y2="450" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lf2-s)"/>
  <g filter="url(#lf2-soft)"><rect x="556" y="410" width="300" height="80" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5"/></g>
  <text x="706" y="444" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">machine E</text>
  <text x="706" y="472" font-size="18" fill="#64748B" text-anchor="middle">did not answer</text>
  <path d="M890,442 L906,458 M906,442 L890,458" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <rect x="360.5" y="236" width="155" height="30" rx="7" fill="#FFFFFF" opacity="0.96"/>
  <text x="438" y="252" font-size="18" fill="#0F172A" text-anchor="middle">asks for a vote</text>
  <g filter="url(#lf2-soft)"><rect x="956" y="212" width="224" height="124" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/></g>
  <text x="1068" y="256" font-size="24" font-weight="700" fill="#065F46" text-anchor="middle">3 votes</text>
  <text x="1068" y="288" font-size="19" fill="#64748B" text-anchor="middle">of 5 machines</text>
  <text x="1068" y="318" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">it is the leader</text>
  <text x="620" y="528" font-size="19" fill="#64748B" text-anchor="middle">A machine votes only once in each round, so two candidates can never both win.</text>
</svg>