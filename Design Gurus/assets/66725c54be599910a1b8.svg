<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Bulkhead: one shared pool lets order history hold every thread while every request succeeds; walled pools cap it">
  <rect x="0" y="0" width="1300" height="700" fill="#FFFFFF"/>

  
  <text x="40" y="46" font-size="24" font-weight="700" fill="#0F172A">BEFORE: one shared pool of 200 threads</text>

  
  <circle cx="52" cy="84" r="7" fill="#3B82F6"/>
  <text x="70" y="91" font-size="20" fill="#334155">Checkout: 300 req/s x 250 ms = <tspan font-weight="700" fill="#1E3A8A">75 threads needed</tspan></text>
  <circle cx="52" cy="120" r="7" fill="#059669"/>
  <text x="70" y="127" font-size="20" fill="#334155">Search: 200 req/s x 150 ms = <tspan font-weight="700" fill="#065F46">30 threads needed</tspan></text>
  <circle cx="52" cy="156" r="7" fill="#D97706"/>
  <text x="70" y="163" font-size="20" fill="#334155">Order history: 1,500 req/s x 500 ms = <tspan font-weight="700" fill="#92400E">750 threads needed</tspan></text>

  
  <text x="40" y="222" font-size="20" font-weight="700" fill="#334155">Shared pool</text>
  <text x="40" y="248" font-size="20" fill="#475569">200 threads</text>
  <rect x="340" y="196" width="620" height="62" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <rect x="340" y="196" width="620" height="62" rx="8" fill="#FDE9C8"/>
  <rect x="340" y="196" width="620" height="62" rx="8" fill="none" stroke="#D97706" stroke-width="2.5"/>
  <text x="650" y="234" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Order history holds all 200</text>
  <text x="985" y="220" font-size="20" font-weight="700" fill="#991B1B">Checkout: 0 threads</text>
  <text x="985" y="248" font-size="20" font-weight="700" fill="#991B1B">Search: 0 threads</text>

  
  <text x="40" y="308" font-size="20" fill="#0F172A"><tspan font-weight="700">Error rate: 0.0%.</tspan> Every request holding a thread is succeeding. Nothing has failed, so a circuit breaker sees nothing.</text>

  <line x1="40" y1="340" x2="1260" y2="340" stroke="#CBD5E1" stroke-width="1.5"/>

  
  <text x="40" y="392" font-size="24" font-weight="700" fill="#0F172A">AFTER: one walled pool per feature</text>

  
  <text x="40" y="443" font-size="20" font-weight="700" fill="#334155">Checkout</text>
  <text x="40" y="469" font-size="20" fill="#475569">80 threads</text>
  <rect x="340" y="424" width="248" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <rect x="342" y="426" width="229" height="48" rx="6" fill="#BFD9FE"/>
  <text x="464" y="457" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">75 in use</text>
  <text x="700" y="457" font-size="20" font-weight="700" fill="#065F46">Unaffected: still serving</text>

  
  <text x="40" y="509" font-size="20" font-weight="700" fill="#334155">Search</text>
  <text x="40" y="535" font-size="20" fill="#475569">60 threads</text>
  <rect x="340" y="490" width="186" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <rect x="342" y="492" width="91" height="48" rx="6" fill="#A9E9CB"/>
  <text x="433" y="523" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">30 in use</text>
  <text x="700" y="523" font-size="20" font-weight="700" fill="#065F46">Unaffected: still serving</text>

  
  <text x="40" y="575" font-size="20" font-weight="700" fill="#334155">Order history</text>
  <text x="40" y="601" font-size="20" fill="#475569">40 threads</text>
  <rect x="340" y="556" width="124" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <rect x="342" y="558" width="120" height="48" rx="6" fill="#FDE9C8"/>
  <text x="402" y="589" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">FULL</text>
  <text x="700" y="581" font-size="20" font-weight="700" fill="#92400E">Serves 80 req/s;</text>
  <text x="700" y="607" font-size="20" font-weight="700" fill="#92400E">refuses 1,420 req/s in under 1 ms</text>

  
  <text x="40" y="641" font-size="20" font-weight="700" fill="#334155">Reserve</text>
  <rect x="340" y="622" width="62" height="40" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="649" font-size="20" fill="#475569">20 threads spare</text>

  
  <text x="40" y="692" font-size="20" font-weight="700" fill="#0F172A">Each wall is sized by rate x duration. The wall triggers on fullness, not on errors.</text>
</svg>