<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Raw JSON input with order_id 123, customer_id C42, product_ids P7, quantities 2, total_amount 99.50, currency USD and an order_date passes through a transformer filter, which converts input data from one format to another, and comes out as a structured ParsedOrder object with the same seven fields">
  <defs>
    <filter id="m08f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m08f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m08f-k1"><rect x="425" y="285" width="290" height="90" rx="12"/></clipPath>
    <marker id="m08f-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Transformer filter: changing data representation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The transformer turns raw JSON text into a structured object with typed fields.</text>

  <rect x="40" y="120" width="340" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Input</text>
  <rect x="770" y="120" width="430" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="794" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Output</text>

  <g fill="none" stroke-width="2">
    <path d="M380,330 H425" stroke="#64748B" marker-end="url(#m08f-m-slate)"/>
    <path d="M715,330 H770" stroke="#64748B" marker-end="url(#m08f-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m08f-lift)">
    <rect x="425" y="285" width="290" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="425" y="285" width="9" height="90" fill="#4F46E5" clip-path="url(#m08f-k1)"/>
  </g>
  <circle cx="463" cy="330" r="18" fill="#FFFFFF"/>
  <g transform="translate(452.56,319.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="489" y="337" font-size="21.5" font-weight="600" fill="#111827">Transformer filter</text>
  <text x="570" y="404" font-size="18.5" text-anchor="middle" fill="#6B7280">converts input data from</text>
  <text x="570" y="431" font-size="18.5" text-anchor="middle" fill="#94A3B8">one format to another</text>
  <text x="64" y="178" font-size="18.5" fill="#6B7280">Raw data (JSON)</text>
  <text x="794" y="178" font-size="18.5" fill="#6B7280">Structured object</text>

  <rect x="64" y="200" width="292" height="310" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="88" y="232" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#1F2937">{</text>
  <text x="88" y="260" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" xml:space="preserve">  <tspan fill="#1F2937">"order_id":</tspan> <tspan fill="#047857">"123"</tspan><tspan fill="#1F2937">,</tspan></text>
  <text x="88" y="288" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" xml:space="preserve">  <tspan fill="#1F2937">"customer_id":</tspan> <tspan fill="#047857">"C42"</tspan><tspan fill="#1F2937">,</tspan></text>
  <text x="88" y="316" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" xml:space="preserve">  <tspan fill="#1F2937">"product_ids":</tspan> <tspan fill="#1F2937">[</tspan><tspan fill="#047857">"P7"</tspan><tspan fill="#1F2937">],</tspan></text>
  <text x="88" y="344" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" xml:space="preserve">  <tspan fill="#1F2937">"quantities":</tspan> <tspan fill="#1F2937">[</tspan><tspan fill="#047857">2</tspan><tspan fill="#1F2937">],</tspan></text>
  <text x="88" y="372" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" xml:space="preserve">  <tspan fill="#1F2937">"total_amount":</tspan> <tspan fill="#047857">"99.50"</tspan><tspan fill="#1F2937">,</tspan></text>
  <text x="88" y="400" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" xml:space="preserve">  <tspan fill="#1F2937">"currency":</tspan> <tspan fill="#047857">"USD"</tspan><tspan fill="#1F2937">,</tspan></text>
  <text x="88" y="428" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" xml:space="preserve">  <tspan fill="#1F2937">"order_date":</tspan> <tspan fill="#047857">"..."</tspan><tspan fill="#1F2937"></tspan></text>
  <text x="88" y="456" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#1F2937">}</text>
  <rect x="794" y="200" width="382" height="310" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="818" y="240" font-size="21.5" font-weight="600" fill="#111827">ParsedOrder</text>
  <text x="818" y="278" font-size="18.5" fill="#475569">order_id:</text>
  <rect x="950" y="258" width="50.2" height="28" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="975.1" y="278" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#111827">123</text>
  <text x="818" y="312" font-size="18.5" fill="#475569">customer_id:</text>
  <rect x="950" y="292" width="50.2" height="28" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="975.1" y="312" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#111827">C42</text>
  <text x="818" y="346" font-size="18.5" fill="#475569">product_ids:</text>
  <rect x="950" y="326" width="59.6" height="28" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="979.8" y="346" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#111827">[P7]</text>
  <text x="818" y="380" font-size="18.5" fill="#475569">quantities:</text>
  <rect x="950" y="360" width="50.2" height="28" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="975.1" y="380" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#111827">[2]</text>
  <text x="818" y="414" font-size="18.5" fill="#475569">total_amount:</text>
  <rect x="950" y="394" width="69" height="28" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="984.5" y="414" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#111827">99.50</text>
  <text x="818" y="448" font-size="18.5" fill="#475569">currency:</text>
  <rect x="950" y="428" width="50.2" height="28" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="975.1" y="448" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#111827">USD</text>
  <text x="818" y="482" font-size="18.5" fill="#475569">order_date:</text>
  <rect x="950" y="462" width="50.2" height="28" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="975.1" y="482" text-anchor="middle" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17" fill="#111827">...</text>


</svg>