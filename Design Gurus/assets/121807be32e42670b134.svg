<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The browser says hello with the encryption methods it supports. The server replies with its choice and its certificate. The browser checks the certificate. Both sides create the same secret key. Encrypted HTTP begins.">
  <defs>
    <filter id="hs3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="hs3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="hs3-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="hs3-k2"><rect x="654" y="300" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="hs3-k3"><rect x="64" y="420" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="hs3-k4"><rect x="40" y="640" width="1160" height="90" rx="12"/></clipPath>
    <clipPath id="hs3-k5"><rect x="40" y="820" width="1160" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="1170" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The TLS handshake, simplified</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Follow the numbers. Encrypted HTTP starts only after step 5.</text>

  <rect x="40" y="120" width="570" height="480" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Browser</text>
  <rect x="630" y="120" width="570" height="480" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Server</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#hs3-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#hs3-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">1. Hello: here is what I support</text>
  <g filter="url(#hs3-soft)">
    <rect x="654" y="300" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="300" width="6" height="90" fill="#2563EB" clip-path="url(#hs3-k2)"/>
  </g>
  <circle cx="692" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,334.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="718" y="352" font-size="21.5" font-weight="600" fill="#111827">2. Hello, plus my certificate</text>
  <g filter="url(#hs3-soft)">
    <rect x="64" y="420" width="522" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="420" width="6" height="90" fill="#7C3AED" clip-path="url(#hs3-k3)"/>
  </g>
  <circle cx="102" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,454.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="128" y="472" font-size="21.5" font-weight="600" fill="#111827">3. Check the certificate</text>
  <text x="325" y="539" font-size="18.5" text-anchor="middle" fill="#6B7280">trusted CA? not expired? right domain?</text>
  <g filter="url(#hs3-soft)">
    <rect x="40" y="640" width="1160" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="640" width="6" height="90" fill="#7C3AED" clip-path="url(#hs3-k4)"/>
  </g>
  <circle cx="78" cy="685" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,674.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="104" y="692" font-size="21.5" font-weight="600" fill="#111827">4. Both sides create the same secret key</text>
  <text x="620" y="759" font-size="18.5" text-anchor="middle" fill="#6B7280">the key itself never crosses the network</text>
  <g filter="url(#hs3-lift)">
    <rect x="40" y="820" width="1160" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="820" width="9" height="90" fill="#059669" clip-path="url(#hs3-k5)"/>
  </g>
  <circle cx="78" cy="865" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,854.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="872" font-size="21.5" font-weight="600" fill="#111827">5. Encrypted HTTP requests and responses</text>
  <text x="620" y="939" font-size="18.5" text-anchor="middle" fill="#6B7280">fast symmetric encryption, like AES</text>

  <rect x="40" y="990" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1015" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1040" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">TLS 1.3</text>
  <text x="323" y="1040" font-size="18.5" fill="#475569">the handshake takes one round trip before data can flow</text>
  <rect x="64" y="1065" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1090" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Certificate</text>
  <text x="323" y="1090" font-size="18.5" fill="#475569">proves the server owns the domain, which stops man-in-the-middle attacks</text>
</svg>