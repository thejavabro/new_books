<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The hardened payment call path: gateway to Checkout to a bulkhead that caps payment calls at 30 threads, then a circuit breaker. While the breaker is closed it calls the hanging Payments service with a 1 second timeout and one jittered retry; once open it rejects in about 1 millisecond and the fallback either fails cleanly or queues the charge.">
  <defs>
    <marker id="m04-l08-hardened-path-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l08-hardened-path-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m04-l08-hardened-path-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>

  <rect x="650" y="80" width="530" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="670" y="120" font-size="20" font-weight="600" fill="#334155">Inside Checkout</text>
  <text x="1160" y="120" text-anchor="end" font-size="20" fill="#64748B">both live here, not in Payments</text>

  <g filter="url(#m04-l08-hardened-path-soft)">
    <rect x="60" y="150" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="170" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="170" y="228" text-anchor="middle" font-size="20" fill="#64748B">sets the deadline</text>
  <g filter="url(#m04-l08-hardened-path-soft)">
    <rect x="330" y="150" width="280" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="470" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="470" y="228" text-anchor="middle" font-size="20" fill="#64748B">100 orders per second</text>
  <g filter="url(#m04-l08-hardened-path-soft)">
    <rect x="670" y="150" width="240" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="790" y="180" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Bulkhead</text>
  <text x="790" y="212" text-anchor="middle" font-size="20" fill="#64748B">payment calls capped</text>
  <text x="790" y="244" text-anchor="middle" font-size="20" fill="#64748B">at 30 threads</text>
  <g filter="url(#m04-l08-hardened-path-soft)">
    <rect x="940" y="150" width="220" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1050" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Circuit breaker</text>
  <text x="1050" y="228" text-anchor="middle" font-size="20" fill="#64748B">opens at 2:00:05</text>

  <g filter="url(#m04-l08-hardened-path-soft)">
    <rect x="380" y="480" width="380" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="570" y="525" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments (hanging)</text>
  <text x="570" y="557" text-anchor="middle" font-size="20" fill="#64748B">accepts, never answers</text>
  <text x="570" y="589" text-anchor="middle" font-size="20" fill="#64748B">each call fails at 1 s</text>
  <g filter="url(#m04-l08-hardened-path-soft)">
    <rect x="800" y="480" width="380" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="990" y="525" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fallback</text>
  <text x="990" y="557" text-anchor="middle" font-size="20" fill="#64748B">A: honest fast error, cart saved</text>
  <text x="990" y="589" text-anchor="middle" font-size="20" fill="#64748B">B: accept order, queue the charge</text>

  <g fill="none" stroke-width="2.5">
    <path d="M280,205 L322,205" stroke="#3B82F6" marker-end="url(#m04-l08-hardened-path-bl)"/>
    <path d="M610,205 L662,205" stroke="#3B82F6" marker-end="url(#m04-l08-hardened-path-bl)"/>
    <path d="M910,205 L932,205" stroke="#3B82F6" marker-end="url(#m04-l08-hardened-path-bl)"/>
    <path d="M1010,260 L1010,330 L570,330 L570,472" stroke="#3B82F6" marker-end="url(#m04-l08-hardened-path-bl)"/>
    <path d="M1100,260 L1100,420 L990,420 L990,472" stroke="#DC2626" marker-end="url(#m04-l08-hardened-path-rd)"/>
  </g>

  <text x="600" y="362" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">closed: 1 s timeout,</text>
  <text x="600" y="388" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one retry with jitter</text>
  <text x="1180" y="362" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">open: reject in about 1 ms</text>
  <text x="1180" y="388" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2:00:05 onward</text>

  <line x1="60" y1="700" x2="96" y2="700" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="707" font-size="20" fill="#475569">Synchronous call, the caller waits: the breaker is closed</text>
  <line x1="60" y1="740" x2="96" y2="740" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="747" font-size="20" fill="#475569">Rejected in about 1 ms, no thread held: the breaker is open</text>
</svg>