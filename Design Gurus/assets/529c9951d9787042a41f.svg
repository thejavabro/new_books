<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="812" viewBox="0 0 1240 812" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The lines with a pointer at each end">
<defs>
<filter id="cw-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="812" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which two lines hold the most water?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The width is the gap between them, and the height is the shorter of the two</text>
<rect x="40" y="106" width="1160" height="552" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Start as wide as possible, with one pointer at each end</text>
<rect x="266" y="445" width="708" height="29" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="620" y="178" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">2 tall and 6 wide</text>
<line x1="190" y1="474" x2="1050" y2="474" stroke="#94A3B8" stroke-width="2.5"/>
<rect x="257" y="445" width="18" height="29" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2.5"/>
<text x="266" y="433" text-anchor="middle" font-size="17.5" font-weight="600" fill="#B45309">2</text>
<text x="266" y="500" text-anchor="middle" font-size="16.5" fill="#475569">0</text>
<rect x="375" y="431" width="18" height="43" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="384" y="419" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">3</text>
<text x="384" y="500" text-anchor="middle" font-size="16.5" fill="#475569">1</text>
<rect x="493" y="417" width="18" height="57" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="502" y="405" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">4</text>
<text x="502" y="500" text-anchor="middle" font-size="16.5" fill="#475569">2</text>
<rect x="611" y="402" width="18" height="72" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="390" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">5</text>
<text x="620" y="500" text-anchor="middle" font-size="16.5" fill="#475569">3</text>
<rect x="729" y="216" width="18" height="258" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="738" y="204" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">18</text>
<text x="738" y="500" text-anchor="middle" font-size="16.5" fill="#475569">4</text>
<rect x="847" y="230" width="18" height="244" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="856" y="218" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">17</text>
<text x="856" y="500" text-anchor="middle" font-size="16.5" fill="#475569">5</text>
<rect x="965" y="388" width="18" height="86" rx="4" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2.5"/>
<text x="974" y="376" text-anchor="middle" font-size="17.5" font-weight="600" fill="#B45309">6</text>
<text x="974" y="500" text-anchor="middle" font-size="16.5" fill="#475569">6</text>
<path d="M266,508 l -7,12 l 14,0 Z" fill="#D97706"/>
<text x="266" y="550" text-anchor="middle" font-size="17" font-weight="600" fill="#B45309">left</text>
<path d="M974,508 l -7,12 l 14,0 Z" fill="#7C3AED"/>
<text x="974" y="550" text-anchor="middle" font-size="17" font-weight="600" fill="#5B21B6">right</text>
<rect x="420" y="558" width="400" height="46" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="588" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">best so far: nothing yet</text>
<text x="620" y="630" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Checking every pair would be far more work, and almost all of it wasted</text>
<rect x="40" y="674" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="714" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Only the shorter side limits the water, so only it is worth moving</text>
<text x="620" y="746" text-anchor="middle" font-size="18.5" fill="#475569">Moving the taller side inwards loses width and cannot gain height, so it can only lose</text>
</svg>