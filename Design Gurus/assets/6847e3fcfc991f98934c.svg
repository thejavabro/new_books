<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="766" viewBox="0 0 1240 766" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A four tier test pyramid. Top: few end-to-end tests with real infrastructure that test the complete flow and are slower and more expensive. Next: some integration tests that test each adapter, PostgreSQL, Stripe and Kafka, at moderate speed. Next: many unit tests for use cases with in-memory stubs and no database or external services. Base: the most tests, unit tests for entities in isolation, fast and reliable">
  <defs>
    <filter id="m11o-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m11o-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="766" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Clean Architecture testing pyramid</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Most tests check entities and use cases without infrastructure; few run the complete wired system.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>



