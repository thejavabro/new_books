<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The first request returns 200 OK with a full body and an ETag; the second sends If-None-Match with that ETag and receives a 304 Not Modified with no body at all">
  <rect x="0" y="0" width="1240" height="710" fill="#FFFFFF"/>
  <defs>
    <marker id="ap3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ap3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="ap3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The second request still happens. What it saves is the body.</text>

  
  <line x1="280" y1="134" x2="280" y2="560" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="960" y1="134" x2="960" y2="560" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>

  
  <g filter="url(#ap3-soft)">
    <rect x="170" y="80" width="220" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="850" y="80" width="220" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="280" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Browser</text>
  <text x="960" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>

  
  <text x="620" y="172" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">First visit, nothing cached</text>

  <text x="620" y="214" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">GET /styles.css</text>
  <line x1="284" y1="228" x2="956" y2="228" stroke="#3B82F6" stroke-width="2" marker-end="url(#ap3-blue)"/>

  <text x="620" y="268" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">200 OK, the full 84 KB body</text>
  <text x="620" y="292" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">ETag: "abc123"</text>
  <line x1="956" y1="306" x2="284" y2="306" stroke="#3B82F6" stroke-width="2" marker-end="url(#ap3-blue)"/>

  <line x1="40" y1="342" x2="1200" y2="342" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 6"/>

  
  <text x="620" y="380" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Same file, next page view</text>

  <text x="620" y="420" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">GET /styles.css</text>
  <text x="620" y="444" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">If-None-Match: "abc123"</text>
  <line x1="284" y1="458" x2="956" y2="458" stroke="#059669" stroke-width="2" marker-end="url(#ap3-emerald)"/>

  <rect x="986" y="428" width="214" height="112" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1093" y="462" font-size="20" fill="#065F46" text-anchor="middle">the tag matches,</text>
  <text x="1093" y="488" font-size="20" fill="#065F46" text-anchor="middle">so the file is</text>
  <text x="1093" y="514" font-size="20" fill="#065F46" text-anchor="middle">never even read</text>

  <text x="600" y="498" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">304 Not Modified</text>
  <text x="600" y="522" font-size="20" fill="#065F46" text-anchor="middle">no body, about 200 bytes of headers</text>
  <line x1="956" y1="536" x2="284" y2="536" stroke="#059669" stroke-width="2" marker-end="url(#ap3-emerald)"/>

  
  <rect x="50" y="592" width="1140" height="92" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="628" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The browser still pays for one round trip. It stops paying for the download.</text>
  <text x="620" y="658" font-size="20" fill="#065F46" text-anchor="middle">An 84 KB transfer becomes a 200 byte one, and the server skips reading the file entirely.</text>
</svg>