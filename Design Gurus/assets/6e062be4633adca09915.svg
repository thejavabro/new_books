<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="652" viewBox="0 0 1240 652" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Little&#39;s Law, L equals lambda times W, read twice: as customers in a coffee shop and as requests in flight in a web service">
  <rect x="0" y="0" width="1240" height="652" fill="#FFFFFF"/>
  <defs>
    <filter id="sc1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One formula, and the two readings of it you need</text>

  
  <g filter="url(#sc1-soft)">
    <rect x="280" y="88" width="200" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="520" y="88" width="200" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="760" y="88" width="200" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="380" y="122" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">L</text>
  <text x="380" y="152" font-size="20" fill="#065F46" text-anchor="middle">how many are</text>
  <text x="380" y="182" font-size="20" fill="#065F46" text-anchor="middle">in the system</text>

  <text x="620" y="122" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">λ</text>
  <text x="620" y="152" font-size="20" fill="#1E40AF" text-anchor="middle">how fast they</text>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle">arrive</text>

  <text x="860" y="122" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">W</text>
  <text x="860" y="152" font-size="20" fill="#92400E" text-anchor="middle">how long each</text>
  <text x="860" y="182" font-size="20" fill="#92400E" text-anchor="middle">one stays</text>

  <text x="500" y="152" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">=</text>
  <text x="740" y="152" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">×</text>

  
  <rect x="50" y="240" width="560" height="260" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M50 252 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#F1F5F9"/>
  <text x="330" y="274" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A coffee shop</text>

  <text x="70" y="336" font-size="20" fill="#0F172A">λ = 2 customers arrive each minute</text>
  <text x="70" y="378" font-size="20" fill="#0F172A">W = each customer stays 5 minutes</text>

  <rect x="70" y="398" width="520" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="90" y="425" font-size="20" font-weight="600" fill="#065F46">L = 2 × 5 = 10 people in the shop</text>

  <text x="70" y="474" font-size="20" fill="#64748B">Count the people inside and you know how busy it is.</text>

  
  <rect x="630" y="240" width="560" height="260" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M630 252 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#EFF6FF"/>
  <text x="910" y="274" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">A web service</text>

  <text x="650" y="336" font-size="20" fill="#0F172A">λ = 200 requests per second</text>
  <text x="650" y="378" font-size="20" fill="#0F172A">W = 0.5 s to serve each one</text>

  <rect x="650" y="398" width="520" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="670" y="425" font-size="20" font-weight="600" fill="#065F46">L = 200 × 0.5 = 100 in flight</text>

  <text x="650" y="474" font-size="20" fill="#64748B">That is how many threads or connections you must have.</text>

  
  <rect x="50" y="530" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="566" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The three numbers are locked together. Fix any two and the third is already decided.</text>
  <text x="620" y="596" font-size="20" fill="#334155" text-anchor="middle">This is why you can never judge load from throughput alone.</text>
</svg>