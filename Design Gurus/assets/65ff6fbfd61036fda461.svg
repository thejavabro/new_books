    <marker id="m05i-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Shared database vs. database per service</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Multiple services use the same database, or each service owns its own database.</text>

