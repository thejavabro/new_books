    <g transform="translate(668,605) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
    <text x="704" y="622.5" font-size="18.5" fill="#1F2937">Services are tightly coupled through the database</text>
    <rect x="654" y="648" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
    <g transform="translate(668,659) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
    <text x="704" y="676.5" font-size="18.5" fill="#1F2937">Harder to scale services independently</text>
    <rect x="654" y="702" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
    <g transform="translate(668,713) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
    <text x="704" y="730.5" font-size="18.5" fill="#1F2937">Changes to the database impact multiple services</text>
    <text x="654" y="180" font-size="18.5" fill="#6B7280">Multiple services use the same database</text>
  </g>
  <g transform="translate(590,0)">
    <rect x="40" y="120" width="570" height="650" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Database per service</text>
