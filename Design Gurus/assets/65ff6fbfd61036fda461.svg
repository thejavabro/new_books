    <text x="496" y="252.25" font-size="21.5" font-weight="600" fill="#111827">Product</text>
    <text x="496" y="277.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
    <g stroke="#2563EB" stroke-width="1.5">
      <path d="M75,385 L75,459 A70,16 0 0 0 215,459 L215,385" fill="#DBEAFE"/>
      <ellipse cx="145" cy="385" rx="70" ry="16" fill="#EFF6FF"/>
    </g>
    <text x="145" y="437" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">User DB</text>
    <g stroke="#2563EB" stroke-width="1.5">
      <path d="M259,385 L259,459 A70,16 0 0 0 399,459 L399,385" fill="#DBEAFE"/>
      <ellipse cx="329" cy="385" rx="70" ry="16" fill="#EFF6FF"/>
