      <path d="M839,400 L839,484 A80,16 0 0 0 999,484 L999,400" fill="#DBEAFE"/>
      <ellipse cx="919" cy="400" rx="80" ry="16" fill="#EFF6FF"/>
    </g>
    <text x="919" y="457" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Shared DB</text>
    <rect x="654" y="540" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
    <g transform="translate(668,551) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
