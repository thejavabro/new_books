<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels: on the left, with a shared database, all three services use one database, which is simpler to set up but couples the services, makes independent scaling harder and lets a database change affect several services; on the right, with database per service, the user, order and product services each read and write their own database, so services are independently deployable with better data isolation, and each service can change its schema alone">
