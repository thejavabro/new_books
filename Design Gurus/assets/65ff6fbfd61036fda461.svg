    <filter id="m05i-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m05i-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m05i-k1"><rect x="64" y="210" width="162" height="96" rx="12"/></clipPath>
    <clipPath id="m05i-k2"><rect x="248" y="210" width="162" height="96" rx="12"/></clipPath>
    <clipPath id="m05i-k3"><rect x="432" y="210" width="162" height="96" rx="12"/></clipPath>
    <clipPath id="m05i-k4"><rect x="654" y="210" width="162" height="96" rx="12"/></clipPath>
