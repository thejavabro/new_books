    <g transform="translate(78,605) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
    <text x="114" y="622.5" font-size="18.5" fill="#1F2937">Better data isolation and ownership</text>
