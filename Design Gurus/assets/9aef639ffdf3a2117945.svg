<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="714" viewBox="0 0 1240 714" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two screen failures to define before choosing a fix: over-fetching, where one response carries far more than the screen shows, and the API-level N plus one problem, where a list of twenty rows becomes twenty more member reads.">
  <defs>
    <filter id="p3b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3b-k1"><rect x="76" y="172" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p3b-k2"><rect x="76" y="402" width="420" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="714" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Name the failure before choosing the fix</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <circle cx="565.5" cy="70.5" r="5"/>
    <path d="M569.1,74.1 L572.5,77.5"/>
  </g>
  <text x="586" y="77" font-size="15.5" fill="#6B7280">what it looks like</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M800,66 L811,77 M811,66 L800,77"/>
  </g>
  <text x="826" y="77" font-size="15.5" fill="#6B7280">what it costs the screen</text>

  
  <rect x="40" y="126" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">Failure 1</text>
  <g filter="url(#p3b-soft)">
    <rect x="76" y="172" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="172" width="6" height="90" fill="#DB2777" clip-path="url(#p3b-k1)"/>
  </g>
  <circle cx="114" cy="217" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,206.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="224" font-size="18.5" font-weight="600" fill="#111827">Over-fetching</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <circle cx="83.5" cy="281.5" r="5"/>
    <path d="M87.1,285.1 L90.5,288.5"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">One response carries far more than the screen displays.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,303 L89,314 M89,303 L78,314"/>
  </g>
  <text x="104" y="314" font-size="15.5" fill="#6B7280">Bytes, parsing, and battery on a weak network.</text>

  
  <rect x="40" y="356" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="386" font-size="16.5" font-weight="600" fill="#475569">Failure 2</text>
  <g filter="url(#p3b-soft)">
    <rect x="76" y="402" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="402" width="6" height="90" fill="#DB2777" clip-path="url(#p3b-k2)"/>
  </g>
  <circle cx="114" cy="447" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,436.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="454" font-size="18.5" font-weight="600" fill="#111827">The API-level N+1</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round">
    <circle cx="83.5" cy="511.5" r="5"/>
    <path d="M87.1,515.1 L90.5,518.5"/>
  </g>
  <text x="104" y="518" font-size="15.5" fill="#6B7280">A list of twenty rows becomes twenty more member reads.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,533 L89,544 M89,533 L78,544"/>
  </g>
  <text x="104" y="544" font-size="15.5" fill="#6B7280">Extra requests and dependent waits before rendering.</text>

  
  <rect x="40" y="598" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="643" text-anchor="middle" font-size="16" fill="#475569">Count blocking round trips. Two parallel calls are one wait; two sequential calls are two.</text>
</svg>