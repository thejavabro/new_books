<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Deleting a server session logs a user out immediately, while a JWT stays valid until it expires, leaving a window in which a stolen token still works unless you add a blocklist">
  <rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>
  <defs>
    <marker id="se2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">You click log out. How long are you actually logged in for?</text>

  <line x1="380" y1="100" x2="380" y2="470" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="380" y="90" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">log out clicked</text>

  
  <text x="150" y="176" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="end">Server session</text>
  <rect x="200" y="150" width="180" height="50" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="290" y="182" font-size="20" fill="#1E40AF" text-anchor="middle">valid</text>
  <rect x="380" y="150" width="740" height="50" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="750" y="182" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">the row is deleted, so the very next request fails</text>
  <text x="200" y="234" font-size="20" font-weight="600" fill="#065F46">Revocation is instant, because the server owns the state.</text>

  
  <text x="150" y="316" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="end">Plain JWT</text>
  <rect x="200" y="290" width="180" height="50" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="290" y="322" font-size="20" fill="#5B21B6" text-anchor="middle">valid</text>
  <rect x="380" y="290" width="500" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="630" y="322" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">still accepted everywhere, until exp</text>
  <rect x="880" y="290" width="240" height="50" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1000" y="322" font-size="20" fill="#334155" text-anchor="middle">expires on its own</text>
  <text x="200" y="374" font-size="20" font-weight="600" fill="#B91C1C">Nothing on the server knows you logged out.</text>

  
  <text x="150" y="446" font-size="20" font-weight="600" fill="#92400E" text-anchor="end">JWT + blocklist</text>
  <rect x="200" y="420" width="180" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="290" y="452" font-size="20" fill="#92400E" text-anchor="middle">valid</text>
  <rect x="380" y="420" width="740" height="50" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="750" y="452" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">rejected, but only because you added a store to check</text>
  <text x="200" y="504" font-size="20" font-weight="600" fill="#92400E">Which is the shared state JWTs were supposed to avoid.</text>

  <line x1="200" y1="540" x2="1130" y2="540" stroke="#475569" stroke-width="2" marker-end="url(#se2-slate)"/>

  
  <rect x="40" y="566" width="1160" height="86" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="600" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A JWT is a signed statement about the past. Nothing can retract it once it is out.</text>
  <text x="620" y="630" font-size="20" fill="#334155" text-anchor="middle">Short lifetimes shrink the window. A blocklist closes it, and hands back the shared state.</text>
</svg>