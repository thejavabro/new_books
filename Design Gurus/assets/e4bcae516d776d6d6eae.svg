<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On the left, a relational database keeps users and orders in two tables. The order row points at the user row with a foreign key, so reading an order with the user name needs a join. On the right, a document store keeps the user name inside the order document, so the read is one lookup and the name is repeated in every order.">
  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>
  <defs>
    <marker id="sn1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="sn1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="sn1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="sn1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="sn1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="sn1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="sn1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="sn1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="sn1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same order, stored two ways</text>
  <text x="317" y="84" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">RELATIONAL: split into tables</text>
  <g filter="url(#sn1-soft)"><rect x="97" y="106" width="440" height="116" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="117" y="134" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="start">users</text>
  <path d="M97,146 L537,146" fill="none" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="117" y="174" font-size="19" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">id</text>
  <text x="190" y="174" font-size="19" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">name</text>
  <text x="117" y="206" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">1</text>
  <text x="190" y="206" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">Maria</text>
  <text x="317" y="252" font-size="19" fill="#64748B" text-anchor="middle">user_id points at users.id (foreign key)</text>
  <g filter="url(#sn1-soft)"><rect x="97" y="272" width="440" height="148" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="117" y="300" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="start">orders</text>
  <path d="M97,312 L537,312" fill="none" stroke="#3B82F6" stroke-width="1.4"/>
  <text x="117" y="340" font-size="19" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">id</text>
  <text x="117" y="372" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">77</text>
  <text x="117" y="404" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">78</text>
  <text x="190" y="340" font-size="19" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">user_id</text>
  <text x="190" y="372" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">1</text>
  <text x="190" y="404" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">1</text>
  <text x="340" y="340" font-size="19" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">total</text>
  <text x="340" y="372" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">42.00</text>
  <text x="340" y="404" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">19.50</text>
  <path d="M91,352 C46,352 46,204 87,204" fill="none" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#sn1-b)"/>
  <rect x="24" y="440" width="586" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="317" y="472" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">The name is stored once</text>
  <text x="317" y="500" font-size="19" fill="#64748B" text-anchor="middle">Reading an order with the name needs a join</text>
  <text x="923" y="84" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">DOCUMENT: kept together</text>
  <g filter="url(#sn1-soft)"><rect x="645" y="106" width="556" height="314" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="675" y="146" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">{</text>
  <text x="701" y="176" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"order_id": 77,</text>
  <text x="701" y="206" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"user_id": 1,</text>
  <text x="701" y="236" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"user_name": "Maria",</text>
  <text x="701" y="266" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"total": 42.00,</text>
  <text x="701" y="296" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">"items": [</text>
  <text x="727" y="326" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">{ "sku": "A1", "qty": 2 }</text>
  <text x="701" y="356" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">]</text>
  <text x="675" y="386" font-size="19" fill="#0F172A" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">}</text>
  <rect x="630" y="440" width="586" height="78" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="923" y="472" font-size="20" font-weight="600" fill="#6D28D9" text-anchor="middle">Everything the read needs, in one place</text>
  <text x="923" y="500" font-size="19" fill="#64748B" text-anchor="middle">The name is repeated in every order</text>
</svg>