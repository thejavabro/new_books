<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. The gateway sends a request carrying trace ID abc123 to checkout, checkout writes a log line tagged abc123 and publishes an event with the trace ID in the headers, the broker delivers the event to fulfillment still carrying abc123, and fulfillment writes another log line tagged abc123, so one ID tells one story even across the queue.">
  <defs>
    <marker id="m06-l03-correlation-id-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l03-correlation-id-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l03-correlation-id-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m06-l03-correlation-id-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="157" y1="145" x2="157" y2="620"/>
    <line x1="382" y1="145" x2="382" y2="620"/>
    <line x1="607" y1="145" x2="607" y2="620"/>
    <line x1="832" y1="145" x2="832" y2="620"/>
    <line x1="1057" y1="145" x2="1057" y2="620"/>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M163,220 L376,220" stroke="#3B82F6" marker-end="url(#m06-l03-correlation-id-bl)"/>
    <path d="M388,290 L601,290" stroke="#475569" stroke-width="2" marker-end="url(#m06-l03-correlation-id-sl)"/>
    <path d="M388,360 L826,360" stroke="#D97706" marker-end="url(#m06-l03-correlation-id-ab)"/>
    <path d="M838,430 L1051,430" stroke="#D97706" marker-end="url(#m06-l03-correlation-id-ab)"/>
    <path d="M1051,500 L613,500" stroke="#475569" stroke-width="2" marker-end="url(#m06-l03-correlation-id-sl)"/>
  </g>

  <text x="270" y="208" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Request with trace ID abc123</text>
  <text x="495" y="278" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Log line tagged abc123</text>
  <text x="607" y="348" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Publish event, ID in the headers</text>
  <text x="945" y="418" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Deliver event, still abc123</text>
  <text x="832" y="488" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Log line tagged abc123</text>

  <g filter="url(#m06-l03-correlation-id-soft)">
    <rect x="50" y="50" width="215" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="157.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="157.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">ID set at the edge</text>
  <g filter="url(#m06-l03-correlation-id-soft)">
    <rect x="275" y="50" width="215" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="382.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="382.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">passes it along</text>
  <g filter="url(#m06-l03-correlation-id-soft)">
    <rect x="500" y="50" width="215" height="95" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="607.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Log store</text>
  <text x="607.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">centralized</text>
  <g filter="url(#m06-l03-correlation-id-soft)">
    <rect x="725" y="50" width="215" height="95" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="832.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="832.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">ID in the headers</text>
  <g filter="url(#m06-l03-correlation-id-soft)">
    <rect x="950" y="50" width="215" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1057.5" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="1057.5" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">same trace</text>

  <rect x="90" y="650" width="1090" height="130" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="635" y="700" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">One ID, one story, even across the queue</text>
  <text x="635" y="736" text-anchor="middle" font-size="20" fill="#64748B">so "everything about order 4711" is one query</text>

  <line x1="60" y1="820" x2="96" y2="820" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="827" font-size="20" fill="#475569">Synchronous call: the ID rides in the request headers</text>
  <line x1="60" y1="860" x2="96" y2="860" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="867" font-size="20" fill="#475569">Async hop: the ID rides in the message headers</text>
  <line x1="60" y1="900" x2="96" y2="900" stroke="#475569" stroke-width="4"/>
  <text x="108" y="907" font-size="20" fill="#475569">Log write: every line tagged with the same ID</text>
</svg>