<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="clock-title clock-desc">
<title id="clock-title">Running the clock</title>
<desc id="clock-desc">Time management in the room is a skill separate from knowing the material, with a few mechanics and a close that is worth protecting.</desc>
<defs>
<marker id="clock-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="clock-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="clock-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="clock-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="902" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Running the clock</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Time management in the room is a skill separate from knowing the material.</text>
<rect x="40" y="824" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="824" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="58" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="153" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Narrate the plan at the start</text>
<path d="M526 147H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 147H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#clock-marker-slate)"/>
<rect x="570" y="118" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="140.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it sets expectations and makes it normal for you to</text><text x="590" y="165.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">move things along later</text>
<rect x="40" y="188" width="480" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="223" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Watch for the two-minute drift</text>
<path d="M526 217H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 217H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#clock-marker-slate)"/>
<rect x="570" y="188" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="223" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a tangent worth thirty seconds consuming four minutes</text>
<rect x="40" y="258" width="480" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="293" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ask before going deep</text>
<path d="M526 287H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 287H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#clock-marker-slate)"/>
<rect x="570" y="258" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="280.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not deference, efficiency. It spends the largest</text><text x="590" y="305.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">block on what is assessed</text>
<rect x="40" y="328" width="480" height="58" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="363" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Leave the last three minutes</text>
<path d="M526 357H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 357H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#clock-marker-slate)"/>
<rect x="570" y="328" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="363" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the close is worth more than one more technical point</text>
<rect x="40" y="404" width="1160" height="60" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="404" width="5" height="60" rx="2.5" fill="#39D5AA"/><text x="64" y="440" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"That is the kind of thing I would dig into with more time, but let me get back to the main path"</text>
<text x="40" y="508" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A strong close has three parts and takes two minutes</text>
<rect x="40" y="526" width="480" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="558" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The main trade-off you made</text>
<path d="M526 552H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 552H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#clock-marker-slate)"/>
<rect x="570" y="526" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="558" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and what you gave up</text>
<rect x="40" y="586" width="480" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="618" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What changes at ten times</text>
<path d="M526 612H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 612H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#clock-marker-slate)"/>
<rect x="570" y="586" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="618" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">volunteered, since it is the most common follow-up</text>
<rect x="40" y="646" width="480" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="678" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What you knowingly left out</text>
<path d="M526 672H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 672H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#clock-marker-slate)"/>
<rect x="570" y="646" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="678" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the move that signals seniority most reliably</text>
<rect x="40" y="722" width="1160" height="76" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="722" width="5" height="76" rx="2.5" fill="#AC8BE8"/><text x="64" y="753" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Out of time? Say so and prioritize out loud.</text><text x="64" y="779" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Managing the constraint visibly is itself a senior behavior.</text>
<text x="66" y="858" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The alternative is being cut off mid-sentence by the clock.</text>
</svg>