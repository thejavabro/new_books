<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1702" viewBox="0 0 1240 1702" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The paging, filtering, caching, and freshness cheat sheet: cursor against offset paging, rejecting unknown filters, and the cache and freshness choices, each with the trigger that selects it and the sentence to say.">
  <defs>
    <filter id="p4b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p4b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p4b-k1"><rect x="76" y="174" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p4b-k2"><rect x="76" y="324" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p4b-k3"><rect x="76" y="530" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p4b-k4"><rect x="76" y="736" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p4b-k5"><rect x="76" y="886" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p4b-k6"><rect x="76" y="1036" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p4b-k7"><rect x="76" y="1242" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p4b-k8"><rect x="76" y="1392" width="500" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1702" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Paging, filtering, caching, and freshness: what the collection and the cache promise</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the choice, the sentence to say, and the trigger beneath</text>

  
  <rect x="40" y="126" width="1160" height="336" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Paging</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two decisions</text>

  <g filter="url(#p4b-lift)">
    <rect x="76" y="174" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="174" width="9" height="90" fill="#2563EB" clip-path="url(#p4b-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">Opaque cursor over a stable total order</text>
  <rect x="608" y="174" width="568" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="632" y="214" font-size="15.5" fill="#475569">"Choose cursor paging; accept no direct jump</text>
  <text x="632" y="238" font-size="15.5" fill="#475569">to an arbitrary page number."</text>
  <text x="104" y="289" font-size="15.5" fill="#6B7280">When: the collection changes while it is traversed</text>

  <g filter="url(#p4b-soft)">
    <rect x="76" y="324" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="324" width="6" height="90" fill="#2563EB" clip-path="url(#p4b-k2)"/>
  </g>
  <circle cx="114" cy="369" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,358.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="376" font-size="18.5" font-weight="600" fill="#111827">Bounded offset paging</text>
  <rect x="608" y="324" width="568" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="632" y="364" font-size="15.5" fill="#475569">"Choose offset paging; accept shifting results if the</text>
  <text x="632" y="388" font-size="15.5" fill="#475569">collection changes between requests."</text>
  <text x="104" y="439" font-size="15.5" fill="#6B7280">When: a small administrative collection is stable and page numbers are a real job</text>

  
  <rect x="40" y="482" width="1160" height="186" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="512" font-size="16.5" font-weight="600" fill="#BE185D">Filtering and sorting</text>
  <text x="1176" y="512" text-anchor="end" font-size="15.5" fill="#6B7280">one decision</text>

  <g filter="url(#p4b-soft)">
    <rect x="76" y="530" width="500" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="530" width="6" height="90" fill="#DB2777" clip-path="url(#p4b-k3)"/>
  </g>
  <circle cx="114" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,564.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="582" font-size="18.5" font-weight="600" fill="#111827">Reject with 400</text>
  <rect x="608" y="530" width="568" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="632" y="570" font-size="15.5" fill="#475569">"Reject unknown filters; accept stricter clients in exchange</text>
  <text x="632" y="594" font-size="15.5" fill="#475569">for avoiding silently broad, expensive reads."</text>
  <text x="104" y="645" font-size="15.5" fill="#6B7280">When: the caller supplies an unknown filter or sort</text>

  
  <rect x="40" y="688" width="1160" height="486" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="718" font-size="16.5" font-weight="600" fill="#5B21B6">Caching</text>
  <text x="1176" y="718" text-anchor="end" font-size="15.5" fill="#6B7280">three decisions</text>

  <g filter="url(#p4b-soft)">
    <rect x="76" y="736" width="500" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="736" width="6" height="90" fill="#7C3AED" clip-path="url(#p4b-k4)"/>
  </g>
  <circle cx="114" cy="781" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,770.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="788" font-size="18.5" font-weight="600" fill="#111827">Public cache with explicit lifetime</text>
  <rect x="608" y="736" width="568" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="632" y="776" font-size="15.5" fill="#475569">"Choose public caching; accept staleness for the published</text>
  <text x="632" y="800" font-size="15.5" fill="#475569">lifetime and forbid caller-specific content."</text>
  <text x="104" y="851" font-size="15.5" fill="#6B7280">When: every caller may safely share one representation</text>

  <g filter="url(#p4b-soft)">
    <rect x="76" y="886" width="500" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="886" width="6" height="90" fill="#7C3AED" clip-path="url(#p4b-k5)"/>
  </g>
  <circle cx="114" cy="931" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,920.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="140" y="938" font-size="18.5" font-weight="600" fill="#111827">Private cache</text>
  <rect x="608" y="886" width="568" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="632" y="926" font-size="15.5" fill="#475569">"Choose private caching; accept fewer shared-cache hits</text>
  <text x="632" y="950" font-size="15.5" fill="#475569">in exchange for caller isolation."</text>
  <text x="104" y="1001" font-size="15.5" fill="#6B7280">When: only one caller's device may retain the response</text>

  <g filter="url(#p4b-soft)">
    <rect x="76" y="1036" width="500" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="1036" width="6" height="90" fill="#7C3AED" clip-path="url(#p4b-k6)"/>
  </g>
  <circle cx="114" cy="1081" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1070.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="1088" font-size="18.5" font-weight="600" fill="#111827">no-store</text>
  <rect x="608" y="1036" width="568" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="632" y="1076" font-size="15.5" fill="#475569">"Choose no-store; accept more origin reads to avoid</text>
  <text x="632" y="1100" font-size="15.5" fill="#475569">storage of this response in caches."</text>
  <text x="104" y="1151" font-size="15.5" fill="#6B7280">When: the response contains money, credentials, or rapidly changing private state</text>

  
  <rect x="40" y="1194" width="1160" height="336" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="1224" font-size="16.5" font-weight="600" fill="#047857">Freshness</text>
  <text x="1176" y="1224" text-anchor="end" font-size="15.5" fill="#6B7280">two decisions</text>

  <g filter="url(#p4b-soft)">
    <rect x="76" y="1242" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1242" width="6" height="90" fill="#059669" clip-path="url(#p4b-k7)"/>
  </g>
  <circle cx="114" cy="1287" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1276.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="1294" font-size="18.5" font-weight="600" fill="#111827">Read-your-writes guarantee</text>
  <rect x="608" y="1242" width="568" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="632" y="1282" font-size="15.5" fill="#475569">"Choose read your writes; accept routing, tokens,</text>
  <text x="632" y="1306" font-size="15.5" fill="#475569">waiting, or reduced replica freedom."</text>
  <text x="104" y="1357" font-size="15.5" fill="#6B7280">When: the caller must immediately observe its acknowledged write</text>

  <g filter="url(#p4b-soft)">
    <rect x="76" y="1392" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1392" width="6" height="90" fill="#059669" clip-path="url(#p4b-k8)"/>
  </g>
  <circle cx="114" cy="1437" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1426.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="1444" font-size="18.5" font-weight="600" fill="#111827">Publish a measurable staleness window</text>
  <rect x="608" y="1392" width="568" height="90" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="632" y="1432" font-size="15.5" fill="#475569">"Choose bounded staleness; accept that the caller may</text>
  <text x="632" y="1456" font-size="15.5" fill="#475569">display old state for the stated period."</text>
  <text x="104" y="1507" font-size="15.5" fill="#6B7280">When: stale reads are acceptable</text>

  
  <rect x="40" y="1562" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1604" text-anchor="middle" font-size="16" fill="#475569">Every row is the same move: read the trigger, pick one option, then say the sentence that states what you accept.</text>
  <text x="620" y="1632" text-anchor="middle" font-size="16" fill="#475569">Eight decisions across four groups. The sentence always names the cost, so no cost stays hidden.</text>
</svg>