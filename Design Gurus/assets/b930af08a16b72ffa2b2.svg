<svg xmlns="http://www.w3.org/2000/svg" width="980" height="410" viewBox="0 0 980 410" style="background-color:#ffffff">
<defs>
<marker id="ba" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#3a6fb0"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">

<text x="30" y="30" font-size="14" font-weight="bold" fill="#b4322c">The problem: a constructor nobody can read</text>

<rect x="30" y="46" width="920" height="52" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="48" y="72" font-family="monospace" font-size="13.5">new HttpRequest(url, "GET", headers, null, 30, 3, true, false, null);</text>
<text x="48" y="90" font-size="12" fill="#b4322c">Which null is the body? What is true? Swap the two booleans and it still compiles.</text>

<line x1="30" y1="122" x2="950" y2="122" stroke="#dbe2ed"/>

<text x="30" y="156" font-size="14" font-weight="bold" fill="#2f7a55">The fix: one named step at a time, and one gate at the end</text>

<rect x="30" y="176" width="250" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="155" y="203" text-anchor="middle" font-family="monospace" font-size="12.5">Builder(url)</text>

<rect x="30" y="230" width="250" height="42" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="155" y="257" text-anchor="middle" font-family="monospace" font-size="12.5">.method("POST")</text>

<rect x="30" y="284" width="250" height="42" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="155" y="311" text-anchor="middle" font-family="monospace" font-size="12.5">.timeoutSeconds(5)</text>


<path d="M 280 197 L 420 197 L 420 240" stroke="#3a6fb0" fill="none" stroke-width="1.5"/>
<path d="M 280 251 L 420 251" stroke="#3a6fb0" fill="none" stroke-width="1.5"/>
<path d="M 280 305 L 420 305 L 420 262" stroke="#3a6fb0" fill="none" stroke-width="1.5"/>
<path d="M 420 251 L 470 251" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#ba)"/>

<rect x="475" y="222" width="200" height="60" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
<text x="575" y="248" text-anchor="middle" font-family="monospace" font-size="13">build()</text>
<text x="575" y="269" text-anchor="middle" font-size="11.5" fill="#414d60">checks the rules</text>

<path d="M 675 240 L 730 200" stroke="#2f7a55" fill="none" stroke-width="1.5" marker-end="url(#ba)"/>
<path d="M 675 264 L 730 304" stroke="#b4322c" fill="none" stroke-width="1.5" marker-end="url(#ba)"/>

<rect x="735" y="172" width="215" height="52" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="842" y="194" text-anchor="middle" font-size="12.5" fill="#2f7a55">a finished HttpRequest</text>
<text x="842" y="212" text-anchor="middle" font-size="11.5" fill="#2f7a55">immutable, every field set</text>

<rect x="735" y="278" width="215" height="52" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="842" y="300" text-anchor="middle" font-size="12.5" fill="#b4322c">or an error, before</text>
<text x="842" y="318" text-anchor="middle" font-size="11.5" fill="#b4322c">a broken object exists</text>

<rect x="30" y="344" width="920" height="58" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="367" font-size="13" fill="#414d60">Each step returns the builder, which is what lets the calls chain. Only build() returns the product.</text><text x="52" y="389" font-size="13" fill="#414d60">Without build(), a rule spanning two fields, such as "a GET cannot have a body", has nowhere to live.</text>
</g>
</svg>