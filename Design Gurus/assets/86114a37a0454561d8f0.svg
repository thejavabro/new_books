<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three circuit breaker states. Closed, normal operation: the client sends requests and gets responses, failures are tracked, and the breaker stays closed while the failure rate is low. When the failure rate exceeds a threshold it moves to open, fast fail: requests are rejected immediately by the circuit breaker in the client, the service is not called, and the breaker stays open for a configured cooldown period. After the cooldown it moves to half-open, test requests: a small number of requests go through; if they succeed the breaker goes back to closed, and if the test requests fail it returns to open">
  <defs>
    <filter id="m05g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m05g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m05g-k1"><rect x="64" y="175" width="170" height="110" rx="12"/></clipPath>
    <clipPath id="m05g-k2"><rect x="420" y="175" width="170" height="110" rx="12"/></clipPath>
    <clipPath id="m05g-k3"><rect x="64" y="455" width="170" height="110" rx="12"/></clipPath>
    <clipPath id="m05g-k4"><rect x="420" y="455" width="170" height="110" rx="12"/></clipPath>
    <clipPath id="m05g-k5"><rect x="64" y="735" width="170" height="110" rx="12"/></clipPath>
    <clipPath id="m05g-k6"><rect x="420" y="735" width="170" height="110" rx="12"/></clipPath>
    <marker id="m05g-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m05g-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="m05g-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Circuit breaker: closed, open, half-open</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The breaker stops calls to a failing service, waits, tests it with a few requests, and closes again if they succeed.</text>

  <rect x="40" y="120" width="1100" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Closed (normal operation)</text>
  <rect x="40" y="400" width="1100" height="220" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="430" font-size="19.5" font-weight="600" fill="#BE185D">Open (fast fail)</text>
  <rect x="40" y="680" width="1100" height="220" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="710" font-size="19.5" font-weight="600" fill="#B45309">Half-open (test requests)</text>

  <g fill="none" stroke-width="2">
    <path d="M234,215 H420" stroke="#059669" marker-end="url(#m05g-m-emerald)"/>
    <path d="M420,255 H234" stroke="#059669" stroke-dasharray="7 6" marker-end="url(#m05g-m-emerald)"/>
    <path d="M234,510 H313" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#m05g-m-pink)"/>
    <path d="M234,775 H420" stroke="#D97706" marker-end="url(#m05g-m-amber)"/>
    <path d="M420,815 H234" stroke="#D97706" stroke-dasharray="7 6" marker-end="url(#m05g-m-amber)"/>
    <path d="M150,340 V400" stroke="#DB2777" stroke-width="2.5" marker-end="url(#m05g-m-pink)"/>
    <path d="M150,620 V680" stroke="#D97706" stroke-width="2.5" marker-end="url(#m05g-m-amber)"/>
    <path d="M860,680 V620" stroke="#DB2777" stroke-width="2.5" marker-end="url(#m05g-m-pink)"/>
    <path d="M1140,790 H1158 Q1170,790 1170,778 V242 Q1170,230 1158,230 H1140" stroke="#059669" stroke-width="2.5" marker-end="url(#m05g-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="327" y="202" fill="#047857">Requests</text>
    <text x="327" y="283" fill="#047857">Responses</text>
    <text x="327" y="464" fill="#BE185D">Requests</text>
    <text x="327" y="487" fill="#BE185D">fail fast</text>
    <text x="327" y="739" fill="#B45309">Limited requests</text>
    <text x="327" y="762" fill="#B45309">(try again)</text>
    <text x="327" y="843" fill="#B45309">Responses</text>
    <text x="166" y="377" fill="#BE185D" text-anchor="start">Failure rate exceeds threshold</text>
    <text x="166" y="657" fill="#B45309" text-anchor="start">After cooldown time</text>
    <text x="876" y="657" fill="#BE185D" text-anchor="start">Test requests fail</text>
    <text x="327" y="547" fill="#BE185D">Circuit breaker</text>
    <text x="327" y="570" fill="#BE185D">(in the client)</text>
    <text x="1156" y="377" fill="#047857" text-anchor="end">Successful requests</text>
  </g>

  <g filter="url(#m05g-soft)">
    <rect x="64" y="175" width="170" height="110" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="175" width="6" height="110" fill="#2563EB" clip-path="url(#m05g-k1)"/>
  </g>
  <circle cx="102" cy="230" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,219.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="237" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m05g-soft)">
    <rect x="420" y="175" width="170" height="110" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="420" y="175" width="6" height="110" fill="#059669" clip-path="url(#m05g-k2)"/>
  </g>
  <circle cx="458" cy="230" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,219.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="484" y="237" font-size="21.5" font-weight="600" fill="#111827">Service</text>
  <g filter="url(#m05g-soft)">
    <rect x="64" y="455" width="170" height="110" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="455" width="6" height="110" fill="#2563EB" clip-path="url(#m05g-k3)"/>
  </g>
  <circle cx="102" cy="510" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,499.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="517" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m05g-soft)">
    <rect x="420" y="455" width="170" height="110" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="420" y="455" width="6" height="110" fill="#64748B" clip-path="url(#m05g-k4)"/>
  </g>
  <circle cx="458" cy="510" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,499.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="484" y="517" font-size="21.5" font-weight="600" fill="#111827">Service</text>
  <g filter="url(#m05g-soft)">
    <rect x="64" y="735" width="170" height="110" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="735" width="6" height="110" fill="#2563EB" clip-path="url(#m05g-k5)"/>
  </g>
  <circle cx="102" cy="790" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,779.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="797" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m05g-soft)">
    <rect x="420" y="735" width="170" height="110" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="420" y="735" width="6" height="110" fill="#059669" clip-path="url(#m05g-k6)"/>
  </g>
  <circle cx="458" cy="790" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,779.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="484" y="797" font-size="21.5" font-weight="600" fill="#111827">Service</text>

  <rect x="620" y="166" width="496" height="40" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="644" cy="186" r="6" fill="#059669"/>
  <text x="664" y="192.5" font-size="18.5" fill="#1F2937">Requests flow normally</text>
  <rect x="620" y="214" width="496" height="40" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="644" cy="234" r="6" fill="#059669"/>
  <text x="664" y="240.5" font-size="18.5" fill="#1F2937">Failures are tracked</text>
  <rect x="620" y="262" width="496" height="40" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="644" cy="282" r="6" fill="#059669"/>
  <text x="664" y="288.5" font-size="18.5" fill="#1F2937">Stays in this state if failure rate is low</text>
  <rect x="620" y="446" width="496" height="40" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <circle cx="644" cy="466" r="6" fill="#DB2777"/>
  <text x="664" y="472.5" font-size="18.5" fill="#1F2937">Requests are rejected immediately</text>
  <rect x="620" y="494" width="496" height="40" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <circle cx="644" cy="514" r="6" fill="#DB2777"/>
  <text x="664" y="520.5" font-size="18.5" fill="#1F2937">Service is not called</text>
  <rect x="620" y="542" width="496" height="64" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <circle cx="644" cy="562" r="6" fill="#DB2777"/>
  <text x="664" y="568.5" font-size="18.5" fill="#1F2937">Stays in this state for a configured time</text>
  <text x="664" y="592.5" font-size="18.5" fill="#1F2937">(cooldown period)</text>
  <rect x="620" y="726" width="496" height="40" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <circle cx="644" cy="746" r="6" fill="#D97706"/>
  <text x="664" y="752.5" font-size="18.5" fill="#1F2937">Allow a small number of requests</text>
  <rect x="620" y="774" width="496" height="40" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <circle cx="644" cy="794" r="6" fill="#D97706"/>
  <text x="664" y="800.5" font-size="18.5" fill="#1F2937">If successful, go back to Closed</text>
  <rect x="620" y="822" width="496" height="40" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <circle cx="644" cy="842" r="6" fill="#D97706"/>
  <text x="664" y="848.5" font-size="18.5" fill="#1F2937">If failures continue, return to Open</text>
  <g stroke="#DB2777" stroke-width="4" stroke-linecap="round"><path d="M317,500 L337,520 M337,500 L317,520"/></g>


</svg>