<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What an API gateway costs and how teams reduce each cost. A single point of failure is answered by running several instances behind a load balancer. The extra network hop is answered by caching and compression. Growing complexity is answered by splitting the gateway per client type, which is the backends for frontends pattern">
  <defs>
    <marker id="ag1-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="ag1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ag1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ag1-p1"><rect x="72" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ag1-p2"><rect x="455" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ag1-p3"><rect x="838" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ag1-s1"><rect x="72" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ag1-s2"><rect x="455" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="ag1-s3"><rect x="838" y="398" width="330" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">What the gateway costs you</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#047857">What you do about it</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M237,296 L237,394" marker-end="url(#ag1-em)"/>
    <path d="M620,296 L620,394" marker-end="url(#ag1-em)"/>
    <path d="M1003,296 L1003,394" marker-end="url(#ag1-em)"/>
  </g>

  
  <g filter="url(#ag1-soft)">
    <rect x="72" y="112" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#ag1-p1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Single Point of Failure</text>
  <text x="237" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">if the gateway is down</text>
  <text x="237" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">no client can reach anything</text>

  <g filter="url(#ag1-soft)">
    <rect x="455" y="112" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="455" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#ag1-p2)"/>
  </g>
  <circle cx="493" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="519" y="164" font-size="18.5" font-weight="600" fill="#111827">One More Network Hop</text>
  <text x="620" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">every request passes through it</text>
  <text x="620" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">so latency is added to all of them</text>

  <g filter="url(#ag1-soft)">
    <rect x="838" y="112" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="838" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#ag1-p3)"/>
  </g>
  <circle cx="876" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="902" y="164" font-size="18.5" font-weight="600" fill="#111827">Growing Complexity</text>
  <text x="1003" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">routes, auth, limits, transforms</text>
  <text x="1003" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">all in one codebase</text>

  
  <g filter="url(#ag1-lift)">
    <rect x="72" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="72" y="398" width="9" height="90" fill="#059669" clip-path="url(#ag1-s1)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Run Several Instances</text>
  <text x="237" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">behind a load balancer</text>
  <text x="237" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">no one machine to lose</text>

  <g filter="url(#ag1-soft)">
    <rect x="455" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="455" y="398" width="6" height="90" fill="#059669" clip-path="url(#ag1-s2)"/>
  </g>
  <circle cx="493" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="519" y="450" font-size="18.5" font-weight="600" fill="#111827">Cache and Compress</text>
  <text x="620" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">serve repeat reads at the edge</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">and shrink the payload</text>

  <g filter="url(#ag1-soft)">
    <rect x="838" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="838" y="398" width="6" height="90" fill="#059669" clip-path="url(#ag1-s3)"/>
  </g>
  <circle cx="876" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="902" y="450" font-size="18.5" font-weight="600" fill="#111827">Split the Gateway</text>
  <text x="1003" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">one gateway per client type</text>
  <text x="1003" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">which is the BFF pattern</text>

  
  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Worth accepting</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">the extra hop is the price of the pattern, and a well run gateway keeps it in the low milliseconds</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Not worth accepting</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">one gateway instance makes a single machine the availability ceiling for every service behind it</text>
</svg>