<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="twogen-title twogen-desc">
<title id="twogen-title">Why exactly-once delivery does not exist</title>
<desc id="twogen-desc">A sender whose acknowledgment never arrives cannot distinguish a lost message from a lost acknowledgment, and the two cases demand opposite responses. Adding acknowledgments reproduces the ambiguity one level up.</desc>
<defs>
<marker id="twogen-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="twogen-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="twogen-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="twogen-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="708" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why exactly-once delivery does not exist</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Exactly-once delivery is not a feature that vendors have been too lazy to implement.</text>
<rect x="40" y="630" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="630" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="110" y="118" width="300" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="260" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Sender</text>
<rect x="830" y="118" width="300" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="980" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Receiver</text>
<path d="M416 148H824" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M416 148H824" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#twogen-marker-slate)"/>
<text x="620" y="136" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">message</text>
<rect x="110" y="204" width="1020" height="78" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="110" y="204" width="5" height="78" rx="2.5" fill="#F28B9D"/><text x="620" y="236" font-size="22" font-weight="700" fill="#A83147" text-anchor="middle">the acknowledgment never arrives</text><text x="620" y="262" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">and the sender cannot tell these two apart</text>
<path d="M360 288V320" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M360 288V320" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#twogen-marker-red)"/>
<path d="M880 288V320" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M880 288V320" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#twogen-marker-red)"/>
<rect x="110" y="326" width="500" height="84" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="360" y="360.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The message was lost.</text><text x="360" y="387.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Resending is correct.</text>
<rect x="630" y="326" width="500" height="84" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="880" y="360.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It arrived and the ack was lost.</text><text x="880" y="387.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Resending makes a duplicate.</text>
<rect x="40" y="434" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="467.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Another acknowledgment does not help. The same ambiguity reappears one level up.</text><text x="64" y="496.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">This is the two generals problem: a proof, not an engineering gap.</text>
<rect x="40" y="542" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="542" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="579" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">You cannot stop the duplicate arriving. You can stop it mattering.</text>
<text x="66" y="664" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The achievable goal is effectively-once: at-least-once delivery plus an idempotent consumer.</text>
</svg>