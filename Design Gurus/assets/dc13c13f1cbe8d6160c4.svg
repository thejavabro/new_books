<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The client sends uploads to a dedicated upload service and views or searches to a separate read service, and both services talk to object storage and the metadata database.">
  <defs>
    <marker id="ig03-mp" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="ig03-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>

    <filter id="ig03-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ig03-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ig03-k1"><rect x="60" y="205" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="ig03-k2"><rect x="520" y="90" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="ig03-k3"><rect x="520" y="325" width="224" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2">
    <path d="M230,228 H340 Q352,228 352,216 V147 Q352,135 364,135 H520" stroke="#DB2777" marker-end="url(#ig03-mp)"/>
    <path d="M230,272 H340 Q352,272 352,284 V358 Q352,370 364,370 H520" stroke="#2563EB" marker-end="url(#ig03-mb)"/>
    <path d="M744,120 H950" stroke="#DB2777" marker-end="url(#ig03-mp)"/>
    <path d="M744,150 H788 Q800,150 800,162 V328 Q800,340 812,340 H950" stroke="#DB2777" marker-end="url(#ig03-mp)"/>
    <path d="M744,390 H950" stroke="#2563EB" marker-end="url(#ig03-mb)"/>
    <path d="M744,362 H882 Q894,362 894,350 V182 Q894,170 906,170 H950" stroke="#2563EB" marker-end="url(#ig03-mb)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="442" y="123" fill="#BE185D">uploads</text>
    <text x="442" y="358" fill="#1D4ED8">views, searches</text>
    <text x="847" y="108" fill="#BE185D">photo file</text>
    <text x="738" y="235" fill="#BE185D">metadata row</text>
    <text x="847" y="378" fill="#1D4ED8">read metadata</text>
    <text x="950" y="272" fill="#1D4ED8">fetch photo</text>
  </g>

  
  <g filter="url(#ig03-soft)">
    <rect x="60" y="205" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="205" width="6" height="90" fill="#2563EB" clip-path="url(#ig03-k1)"/>
  </g>
  <circle cx="98" cy="250" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,239.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="124" y="257" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#ig03-lift)">
    <rect x="520" y="90" width="224" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="520" y="90" width="9" height="90" fill="#DB2777" clip-path="url(#ig03-k2)"/>
  </g>
  <circle cx="558" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,124.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 16V5"/>
    <path d="M7.5 9.5L12 5l4.5 4.5"/>
    <path d="M4 20h16"/>
  </g>
  <text x="584" y="142" font-size="18.5" font-weight="600" fill="#111827">Upload Service</text>
  <text x="632" y="205" font-size="15.5" text-anchor="middle" fill="#6B7280">slow writes hold connections long</text>

  
  <g filter="url(#ig03-soft)">
    <rect x="520" y="325" width="224" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="520" y="325" width="6" height="90" fill="#2563EB" clip-path="url(#ig03-k3)"/>
  </g>
  <circle cx="558" cy="370" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,359.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="584" y="377" font-size="18.5" font-weight="600" fill="#111827">Read Service</text>
  <text x="632" y="440" font-size="15.5" text-anchor="middle" fill="#6B7280">fast reads, mostly cache hits</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M950,95 L950,189 A95,16 0 0 0 1140,189 L1140,95" fill="#FEF3C7"/>
    <ellipse cx="1045" cy="95" rx="95" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1045" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Object Storage</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M950,315 L950,409 A95,16 0 0 0 1140,409 L1140,315" fill="#EDE9FE"/>
    <ellipse cx="1045" cy="315" rx="95" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1045" y="378" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Metadata DB</text>

  
  <rect x="40" y="480" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="504" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="526" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Write path</text>
  <text x="288" y="526" font-size="15.5" fill="#475569">dedicated upload servers; a burst of slow uploads fills only their connections</text>
  <rect x="64" y="548" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="570" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Read path</text>
  <text x="288" y="570" font-size="15.5" fill="#475569">separate servers and connections, so views never wait behind uploads</text>
</svg>