<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two servers read the same value before either writes, so one of the two increments is lost and an extra request is served">
  <rect x="0" y="0" width="1240" height="510" fill="#FFFFFF"/>
  <defs>
    <marker id="rl10-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rl10-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="rl10-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="200" y1="110" x2="200" y2="410" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="620" y1="110" x2="620" y2="410" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="1040" y1="110" x2="1040" y2="410" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>

  <line x1="200" y1="165" x2="612" y2="165" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rl10-blue)"/>
  <line x1="1040" y1="220" x2="628" y2="220" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#rl10-violet)"/>
  <line x1="200" y1="290" x2="612" y2="290" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rl10-blue)"/>
  <line x1="1040" y1="345" x2="628" y2="345" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#rl10-violet)"/>

  <g filter="url(#rl10-soft)">
    <rect x="60" y="40" width="280" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="480" y="40" width="280" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="900" y="40" width="280" height="64" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="280" y="420" width="680" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <text x="200" y="79" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Server A</text>
  <text x="620" y="79" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Counter store</text>
  <text x="1040" y="79" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Server B</text>

  <text x="406" y="150" font-size="20" fill="#1E3A8A" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">reads 99</text>
  <text x="834" y="205" font-size="20" fill="#5B21B6" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">reads 99</text>
  <text x="406" y="275" font-size="20" fill="#1E3A8A" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">writes 100</text>
  <text x="834" y="330" font-size="20" fill="#5B21B6" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">writes 100</text>

  <text x="620" y="392" font-size="20" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">time runs down the page</text>

  <text x="620" y="450" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Two requests were served</text>
  <text x="620" y="478" font-size="20" fill="#DC2626" text-anchor="middle">and the counter moved by one</text>
</svg>