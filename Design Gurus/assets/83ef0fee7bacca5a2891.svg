<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="856" viewBox="0 0 1240 856" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Offline and online migrations compared on downtime, rollback cost and failure mode, with a shared clock showing that offline is short but stops the service while online is long and never does">
  <rect x="0" y="0" width="1240" height="856" fill="#FFFFFF"/>
  <defs>
    <marker id="db10-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two ways to change a schema, and what each one costs you</text>

  
  <rect x="50" y="88" width="560" height="412" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#FEF2F2"/>
  <text x="330" y="122" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Offline migration</text>

  <text x="70" y="176" font-size="20" font-weight="600" fill="#475569">Downtime</text>
  <text x="70" y="206" font-size="20" fill="#0F172A">A maintenance window, minutes to hours.</text>

  <text x="70" y="246" font-size="20" font-weight="600" fill="#475569">Rollback</text>
  <text x="70" y="276" font-size="20" fill="#0F172A">Restore from a backup, which is more downtime.</text>

  <text x="70" y="316" font-size="20" font-weight="600" fill="#475569">Where it goes wrong</text>
  <text x="70" y="346" font-size="20" fill="#0F172A">The window is a hard deadline. If the migration</text>
  <text x="70" y="372" font-size="20" fill="#0F172A">runs long, you are down longer than you promised.</text>

  <text x="70" y="412" font-size="20" font-weight="600" fill="#475569">Reach for it when</text>
  <text x="70" y="442" font-size="20" fill="#0F172A">The table is small, the service can be down, or the</text>
  <text x="70" y="468" font-size="20" fill="#0F172A">change genuinely cannot be made compatible.</text>

  
  <rect x="630" y="88" width="560" height="412" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <path d="M630 100 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#ECFDF5"/>
  <text x="910" y="122" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Online migration</text>

  <text x="650" y="176" font-size="20" font-weight="600" fill="#475569">Downtime</text>
  <text x="650" y="206" font-size="20" fill="#0F172A">None. The application keeps serving throughout.</text>

  <text x="650" y="246" font-size="20" font-weight="600" fill="#475569">Rollback</text>
  <text x="650" y="276" font-size="20" fill="#0F172A">Redeploy the old code. The old column still works.</text>

  <text x="650" y="316" font-size="20" font-weight="600" fill="#475569">Where it goes wrong</text>
  <text x="650" y="346" font-size="20" fill="#0F172A">More moving parts and a longer calendar. Dual</text>
  <text x="650" y="372" font-size="20" fill="#0F172A">writes can drift if one path has a bug.</text>

  <text x="650" y="412" font-size="20" font-weight="600" fill="#475569">Reach for it when</text>
  <text x="650" y="442" font-size="20" fill="#0F172A">The service cannot go down, the table is large, or</text>
  <text x="650" y="468" font-size="20" fill="#0F172A">the change can be phased safely.</text>

  
  <text x="620" y="540" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same change, drawn on one clock</text>

  <text x="60" y="588" font-size="20" font-weight="600" fill="#B91C1C">Offline</text>
  <rect x="200" y="560" width="200" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="416" y="588" font-size="20" font-weight="600" fill="#B91C1C">down the whole time</text>

  <text x="60" y="658" font-size="20" font-weight="600" fill="#065F46">Online</text>
  <rect x="200" y="630" width="880" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="640" y="658" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">up the whole time, spread over days</text>

  <line x1="200" y1="700" x2="1130" y2="700" stroke="#475569" stroke-width="2" marker-end="url(#db10-slate)"/>

  
  <rect x="50" y="734" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="770" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Offline trades availability for simplicity. Online trades simplicity for availability.</text>
  <text x="620" y="800" font-size="20" fill="#334155" text-anchor="middle">Choose by what your users can tolerate, not by which is less work for you.</text>
</svg>