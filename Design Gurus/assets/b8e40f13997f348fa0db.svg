<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" role="img" aria-label="The high-level design is five or six boxes from the client inward, built up one at a time with a reason given for each, until a request can travel end to end.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="430" fill="#FFFFFF"/>
  <rect x="40" y="96" width="200" height="84" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="140" y="145" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Client</text>
  <line x1="244" y1="138" x2="274" y2="138" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <circle cx="140" cy="60" r="17" fill="#059669"/>
  <text x="140" y="67" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1</text>
  <rect x="280" y="96" width="200" height="84" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="380" y="145" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Load Balancer</text>
  <line x1="484" y1="138" x2="514" y2="138" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <circle cx="380" cy="60" r="17" fill="#059669"/>
  <text x="380" y="67" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2</text>
  <rect x="520" y="96" width="200" height="84" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="145" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">App Servers</text>
  <line x1="724" y1="138" x2="754" y2="138" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <circle cx="620" cy="60" r="17" fill="#059669"/>
  <text x="620" y="67" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">3</text>
  <rect x="760" y="96" width="200" height="84" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="860" y="145" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Cache</text>
  <line x1="964" y1="138" x2="994" y2="138" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <circle cx="860" cy="60" r="17" fill="#059669"/>
  <text x="860" y="67" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">4</text>
  <rect x="1000" y="96" width="200" height="84" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="1100" y="145" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Database</text>
  <circle cx="1100" cy="60" r="17" fill="#059669"/>
  <text x="1100" y="67" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">5</text>
  <text x="620" y="226" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Add them one at a time, saying why each one is needed as it appears.</text>
  <rect x="40" y="258" width="566" height="128" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="294" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Built up while you talk</text>
  <text x="70" y="326" font-size="20" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reads as reasoning, which is</text>
  <text x="70" y="356" font-size="20" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">what is actually being marked.</text>
  <rect x="634" y="258" width="566" height="128" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="664" y="294" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Fifteen boxes at once</text>
  <text x="664" y="326" font-size="20" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reads as a memorised template,</text>
  <text x="664" y="356" font-size="20" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">and gives nothing to engage with.</text>
</svg>