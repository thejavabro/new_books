<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The expression with its three operators marked">
<defs>
<filter id="ee-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">In how many ways can "2*3-4-5" be bracketed, and what does each give?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Every set of brackets is decided by one thing: which operator is applied last</text>
<rect x="40" y="106" width="1160" height="528" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">This expression has 3 operators, so there are 3 choices for the last one applied</text>
<text x="224" y="241" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the expression</text>
<rect x="248" y="202" width="96" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="296" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="356" y="202" width="96" height="62" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="404" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">*</text>
<rect x="464" y="202" width="96" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="512" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="572" y="202" width="96" height="62" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="620" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-</text>
<rect x="680" y="202" width="96" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="728" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="788" y="202" width="96" height="62" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="836" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-</text>
<rect x="896" y="202" width="96" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="944" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="620" y="594" text-anchor="middle" font-size="19" font-weight="600" fill="#B45309">Amber is an operator, and each one in turn gets to be the last one applied</text>
<rect x="40" y="646" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="686" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Choosing the last operator cuts the expression into two shorter ones</text>
<text x="620" y="718" text-anchor="middle" font-size="18.5" fill="#475569">Each side is then the same question again, and a single number answers itself</text>
</svg>