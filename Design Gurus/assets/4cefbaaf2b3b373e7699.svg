<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Line chart of monthly cost against steady load. The serverless FaaS line rises with load: one busy environment at 10 requests per second costs about 48.50 dollars a month, and a steady 200 requests per second needs 20 environments and costs about 970 dollars a month. The always-on containers or instances line stays flat. The lines cross at the break-even point. Below it, at low or spiky utilization, serverless is cheaper; above it, at high and constant utilization, provisioned containers or instances are cheaper. Where the lines cross depends on the workload.">
  <defs>
    <filter id="m15l-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="m15l-k1"><rect x="40" y="742" width="366" height="118" rx="12"/></clipPath>
    <clipPath id="m15l-k2"><rect x="437" y="742" width="366" height="118" rx="12"/></clipPath>
    <clipPath id="m15l-k3"><rect x="834" y="742" width="366" height="118" rx="12"/></clipPath>
    <marker id="m15l-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="902" fill="#FFFFFF"/>
  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Serverless vs. traditional servers: the cost crossover</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">FaaS cost rises with steady load, while always-on capacity keeps a flat monthly bill.</text>
  <rect x="40" y="112" width="1160" height="600" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="150" y="140" width="300" height="460" fill="#F5F3FF"/>
  <rect x="450" y="140" width="710" height="460" fill="#EFF6FF"/>
  <text x="300" y="174" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">Serverless cheaper</text>
  <text x="300" y="201" text-anchor="middle" font-size="18.5" fill="#1F2937">Low or spiky utilization</text>
  <text x="805" y="174" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">Provisioned containers or instances cheaper</text>
  <text x="805" y="201" text-anchor="middle" font-size="18.5" fill="#1F2937">High and constant utilization</text>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M150,600 H1180" marker-end="url(#m15l-m-slate)"/>
    <path d="M150,600 V146" marker-end="url(#m15l-m-slate)"/>
  </g>
  <path d="M150,600 V608" stroke="#64748B" stroke-width="2"/>
  <text x="150" y="630" text-anchor="middle" font-size="18.5" fill="#1F2937">0</text>
  <path d="M400,600 V608" stroke="#64748B" stroke-width="2"/>
  <text x="400" y="630" text-anchor="middle" font-size="18.5" fill="#1F2937">50</text>
  <path d="M650,600 V608" stroke="#64748B" stroke-width="2"/>
  <text x="650" y="630" text-anchor="middle" font-size="18.5" fill="#1F2937">100</text>
  <path d="M900,600 V608" stroke="#64748B" stroke-width="2"/>
  <text x="900" y="630" text-anchor="middle" font-size="18.5" fill="#1F2937">150</text>
  <path d="M1150,600 V608" stroke="#64748B" stroke-width="2"/>
  <text x="1150" y="630" text-anchor="middle" font-size="18.5" fill="#1F2937">200</text>
  <text x="650" y="662" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">Steady load (requests per second, 100 ms each)</text>
  <text x="104" y="373" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827" transform="rotate(-90 104 373)">Monthly cost</text>
  <text x="1176" y="694" text-anchor="end" font-size="18.5" fill="#6B7280">Where the lines cross depends on the workload.</text>
  <path d="M150,498 H1150" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M150,600 L1150,260" fill="none" stroke="#7C3AED" stroke-width="4" stroke-linecap="round"/>
  <path d="M450,508 V600" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="450" cy="498" r="9" fill="#FFFFFF" stroke="#111827" stroke-width="3"/>
  <text x="466" y="534" font-size="19.5" font-weight="600" fill="#111827">Break-even point</text>
  <text x="466" y="561" font-size="18.5" fill="#1F2937">Both options cost the same for this load</text>
  <text x="900" y="300" text-anchor="end" font-size="19.5" font-weight="600" fill="#5B21B6">Serverless (FaaS): grows with load</text>
  <text x="1150" y="484" text-anchor="end" font-size="19.5" font-weight="600" fill="#1D4ED8">Always-on containers or instances: flat</text>
  <circle cx="200" cy="583" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="200" y="589" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">1</text>
  <circle cx="1150" cy="260" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="1150" y="266" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">2</text>
  <g filter="url(#m15l-soft)">
    <rect x="40" y="742" width="366" height="118" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="742" width="6" height="118" fill="#7C3AED" clip-path="url(#m15l-k1)"/>
  </g>
  <circle cx="78" cy="775" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="78" y="781" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">1</text>
  <text x="104" y="782" font-size="21.5" font-weight="600" fill="#111827">One busy environment</text>
  <text x="60" y="815" font-size="18.5" fill="#1F2937">1 GB, 10 requests per second</text>
  <text x="60" y="842" font-size="18.5" fill="#1F2937">About $48.50 a month</text>

  <g filter="url(#m15l-soft)">
    <rect x="437" y="742" width="366" height="118" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="437" y="742" width="6" height="118" fill="#7C3AED" clip-path="url(#m15l-k2)"/>
  </g>
  <circle cx="475" cy="775" r="15" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="475" y="781" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">2</text>
  <text x="501" y="782" font-size="21.5" font-weight="600" fill="#111827">Steady 200 requests/s</text>
  <text x="457" y="815" font-size="18.5" fill="#1F2937">20 environments, billed separately</text>
  <text x="457" y="842" font-size="18.5" fill="#1F2937">About 20 × $48.50 = $970 a month</text>

  <g filter="url(#m15l-soft)">
    <rect x="834" y="742" width="366" height="118" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="834" y="742" width="6" height="118" fill="#2563EB" clip-path="url(#m15l-k3)"/>
  </g>
  <text x="854" y="782" font-size="21.5" font-weight="600" fill="#111827">Always-on capacity</text>
  <text x="854" y="815" font-size="18.5" fill="#1F2937">One instance serves many</text>
  <text x="854" y="842" font-size="18.5" fill="#1F2937">concurrent requests on one bill</text>

</svg>