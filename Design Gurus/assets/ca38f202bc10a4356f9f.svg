<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Encryption means nobody can read the data and stops eavesdropping. Authentication means the server is who it claims to be and stops man-in-the-middle attacks. Integrity means nobody can change the data unnoticed and stops tampering.">
  <defs>
    <filter id="hs2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="hs2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="hs2-k1"><rect x="40" y="140" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="hs2-k2"><rect x="440" y="140" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="hs2-k3"><rect x="840" y="140" width="360" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The three guarantees of TLS</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each one stops a different attack.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#hs2-soft)">
    <rect x="40" y="140" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#hs2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Encryption</text>
  <text x="220" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">nobody can read the data</text>
  <text x="220" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">stops eavesdropping</text>
  <g filter="url(#hs2-lift)">
    <rect x="440" y="140" width="360" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="440" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#hs2-k2)"/>
  </g>
  <circle cx="478" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="504" y="192" font-size="21.5" font-weight="600" fill="#111827">Authentication</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the server is who it says it is</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">stops man-in-the-middle attacks</text>
  <g filter="url(#hs2-soft)">
    <rect x="840" y="140" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="840" y="140" width="6" height="90" fill="#059669" clip-path="url(#hs2-k3)"/>
  </g>
  <circle cx="878" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="904" y="192" font-size="21.5" font-weight="600" fill="#111827">Integrity</text>
  <text x="1020" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">nobody can change the data unnoticed</text>
  <text x="1020" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">stops tampering</text>

  <rect x="40" y="340" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="365" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Why all three</text>
  <text x="323" y="390" font-size="18.5" fill="#475569">an encrypted conversation with an impostor protects nothing</text>
</svg>