<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="990" viewBox="0 0 1240 990" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The healthy shape of a microservice system: short synchronous paths for reads and for the checkout payment the user must know about now, then one order placed event fanning out asynchronously through a broker to fulfillment, notifications, analytics, and loyalty points">
  <defs>
    <marker id="m03-l01-healthy-system-shape-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l01-healthy-system-shape-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m03-l01-healthy-system-shape-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="990" fill="#FFFFFF"/>

  <rect x="40" y="60" width="1160" height="300" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="98" font-size="20" font-weight="600" fill="#1E3A8A">Synchronous: the user is waiting</text>
  <rect x="40" y="430" width="1160" height="440" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="468" font-size="20" font-weight="600" fill="#92400E">Asynchronous: work that follows from the fact</text>

  
  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M290,270 C345,270 340,178 394,178" marker-end="url(#m03-l01-healthy-system-shape-bl)"/>
    <path d="M290,292 L394,292" marker-end="url(#m03-l01-healthy-system-shape-bl)"/>
    <path d="M680,292 L854,292" marker-end="url(#m03-l01-healthy-system-shape-bl)"/>
  </g>

  
  <path d="M540,336 C540,392 620,404 620,494" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m03-l01-healthy-system-shape-ab)"/>

  
  <g fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 5">
    <path d="M620,594 L620,676"/>
    <path d="M185,676 L1025,676"/>
    <path d="M185,676 L185,752" marker-end="url(#m03-l01-healthy-system-shape-ab)"/>
    <path d="M465,676 L465,752" marker-end="url(#m03-l01-healthy-system-shape-ab)"/>
    <path d="M745,676 L745,752" marker-end="url(#m03-l01-healthy-system-shape-ab)"/>
    <path d="M1025,676 L1025,752" marker-end="url(#m03-l01-healthy-system-shape-ab)"/>
  </g>

  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="60" y="248" width="230" height="88" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="175" y="299" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User request</text>
  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="394" y="136" width="286" height="84" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="537" y="174" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Read path</text>
  <text x="537" y="204" text-anchor="middle" font-size="20" fill="#64748B">show my cart</text>
  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="394" y="248" width="286" height="88" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="537" y="288" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="537" y="318" text-anchor="middle" font-size="20" fill="#64748B">the user's command</text>
  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="860" y="248" width="290" height="88" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1005" y="288" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="1005" y="318" text-anchor="middle" font-size="20" fill="#64748B">user must know now</text>

  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="470" y="494" width="300" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="620" y="540" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="620" y="570" text-anchor="middle" font-size="20" fill="#64748B">event: order placed</text>

  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="60" y="752" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="185" y="797" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="340" y="752" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="465" y="797" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="620" y="752" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="745" y="797" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Analytics</text>
  <g filter="url(#m03-l01-healthy-system-shape-soft)">
    <rect x="900" y="752" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1025" y="797" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Loyalty points</text>

  
  <g font-size="20" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="342" y="282" text-anchor="middle" fill="#1E40AF">sync</text>
    <text x="767" y="278" text-anchor="middle" fill="#1E40AF">sync, blocking</text>
    <text x="656" y="386" fill="#92400E">async: Checkout publishes</text>
    <text x="656" y="414" fill="#92400E">and returns right away</text>
    <text x="648" y="648" fill="#92400E">async: one event, four reactions</text>
  </g>

  <line x1="50" y1="910" x2="86" y2="910" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="917" font-size="20" fill="#475569">Synchronous call: the caller waits, its fate tied to the callee</text>
  <line x1="50" y1="950" x2="86" y2="950" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="98" y="957" font-size="20" fill="#475569">Asynchronous event: hand the message to the broker and move on</text>
</svg>