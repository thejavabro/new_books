<rect x="50" y="396" width="840" height="82" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="72" y="432" font-size="18.5" fill="#475569">The rotation sends row r, column c to row c, column n - 1 - r. For 7 that is row 2,</text>
<text x="72" y="460" font-size="18.5" fill="#475569">column 0 going to row 0, column 0, which is where the two steps left it.</text>
