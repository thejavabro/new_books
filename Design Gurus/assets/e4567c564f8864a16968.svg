<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five operations in order, with how much slower each one is than the step above it">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="be4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="be4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="80" y="45" font-size="20" font-weight="700" fill="#334155">Operation</text>
  <text x="600" y="45" font-size="20" font-weight="700" fill="#334155" text-anchor="end">Typical time</text>

  <line x1="340" y1="142" x2="340" y2="172" stroke="#475569" stroke-width="2.5" marker-end="url(#be4-slate)"/>
  <line x1="340" y1="252" x2="340" y2="282" stroke="#475569" stroke-width="2.5" marker-end="url(#be4-slate)"/>
  <line x1="340" y1="362" x2="340" y2="392" stroke="#475569" stroke-width="2.5" marker-end="url(#be4-slate)"/>
  <line x1="340" y1="472" x2="340" y2="502" stroke="#475569" stroke-width="2.5" marker-end="url(#be4-slate)"/>

  <g filter="url(#be4-soft)">
    <rect x="60" y="70" width="560" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="180" width="560" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="290" width="560" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="60" y="400" width="560" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="60" y="510" width="560" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <text x="80" y="113" font-size="20" fill="#334155">Read from memory</text>
  <text x="600" y="113" font-size="20" font-weight="700" fill="#065F46" text-anchor="end">100 nanoseconds</text>

  <text x="80" y="223" font-size="20" fill="#334155">Read from an SSD</text>
  <text x="600" y="223" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="end">100 microseconds</text>

  <text x="80" y="333" font-size="20" fill="#334155">Round trip inside one data center</text>
  <text x="600" y="333" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="end">500 microseconds</text>

  <text x="80" y="443" font-size="20" fill="#334155">Seek on a spinning disk</text>
  <text x="600" y="443" font-size="20" font-weight="700" fill="#92400E" text-anchor="end">10 milliseconds</text>

  <text x="80" y="553" font-size="20" fill="#334155">Round trip across the world</text>
  <text x="600" y="553" font-size="20" font-weight="700" fill="#991B1B" text-anchor="end">150 milliseconds</text>

  <text x="700" y="167" font-size="20" font-weight="600" fill="#475569">about 1,000 times slower</text>
  <text x="700" y="277" font-size="20" font-weight="600" fill="#475569">about 5 times slower</text>
  <text x="700" y="387" font-size="20" font-weight="600" fill="#475569">about 20 times slower</text>
  <text x="700" y="497" font-size="20" font-weight="600" fill="#475569">about 15 times slower</text>

  <text x="620" y="618" font-size="20" fill="#475569" text-anchor="middle">From memory to the far side of the world is more than a million times</text>
</svg>