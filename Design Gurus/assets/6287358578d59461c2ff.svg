  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Saga pattern: local transactions and compensation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">When a step fails, compensating transactions undo the steps that already completed, newest first.</text>

  <rect x="40" y="120" width="1160" height="200" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">1. Successful saga</text>
  <text x="1176" y="150" font-size="18.5" text-anchor="end" fill="#6B7280">Arrows show step order. One saga orchestrator calls each service.</text>
  <rect x="40" y="350" width="1160" height="450" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="380" font-size="19.5" font-weight="600" fill="#BE185D">2. Failure and compensation</text>
  <text x="1176" y="380" font-size="18.5" text-anchor="end" fill="#6B7280">The same orchestrator runs the compensating actions.</text>
  <rect x="56" y="575" width="520" height="200" rx="14" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="80" y="605" font-size="19.5" font-weight="600" fill="#BE185D">Compensating actions (undo)</text>

