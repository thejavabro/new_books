<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Saga pattern. One saga orchestrator calls each service in turn; the arrows show step order. Successful saga: order service creates the order, inventory service reserves items, payment service charges payment, fulfillment service creates the fulfillment, and the saga completes. Failure and compensation: the order is created and items are reserved, then the payment fails, so fulfillment never runs; the orchestrator runs the compensating actions, releasing the inventory and then canceling the order, so the completed steps are undone">
