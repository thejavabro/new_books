<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="546" viewBox="0 0 1240 546" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The numbers before sorting">
<defs>
<filter id="mg-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="546" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the largest gap between neighbours once [10, 50, 20, 90, 60] is sorted?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The gap only means anything in sorted order, so the sort has to happen first</text>
<rect x="40" y="106" width="1160" height="296" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The numbers as given</text>
<text x="296" y="210" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">order</text>
<rect x="318" y="172" width="108" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="372" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<rect x="442" y="172" width="108" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="496" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">50</text>
<rect x="566" y="172" width="108" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">20</text>
<rect x="690" y="172" width="108" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="744" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">90</text>
<rect x="814" y="172" width="108" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="868" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">60</text>
<text x="296" y="326" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">gaps</text>
<text x="324" y="325" font-size="18" fill="#475569">not measurable until the numbers are in order</text>
<rect x="40" y="416" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="456" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Radix sort orders them one digit at a time, starting from the last digit</text>
<text x="620" y="488" text-anchor="middle" font-size="18.5" fill="#475569">Each pass is a counting sort on a single digit, so nothing is ever compared</text>
</svg>