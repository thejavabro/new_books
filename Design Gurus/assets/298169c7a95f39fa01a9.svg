<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="727" viewBox="0 0 1240 727" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A user tower and an item tower each output one vector, and the two vectors meet only at the dot product">
  <defs>
    <marker id="emb2t1-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="emb2t1-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="emb2t1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="emb2t1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="emb2t1-k1"><rect x="200" y="56" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t1-k2"><rect x="780" y="56" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t1-k3"><rect x="200" y="262" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t1-k4"><rect x="780" y="262" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="emb2t1-k5"><rect x="500" y="456" width="240" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="727" fill="#FFFFFF"/>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M330,229 V262" marker-end="url(#emb2t1-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M910,206 V262" marker-end="url(#emb2t1-mslate)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M330,389 V412 Q330,424 342,424 H608 Q620,424 620,436 V456" marker-end="url(#emb2t1-mviolet)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M910,389 V412 Q910,424 898,424 H632 Q620,424 620,436 V456" marker-end="url(#emb2t1-mviolet)"/></g>
  <g filter="url(#emb2t1-soft)">
    <rect x="200" y="56" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="200" y="56" width="6" height="90" fill="#2563EB" clip-path="url(#emb2t1-k1)"/>
  </g>
  <circle cx="238" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,90.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="264" y="108" font-size="18.5" font-weight="600" fill="#111827">User tower</text>
  <text x="330" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">user ID's embedding</text>
  <text x="330" y="194" font-size="15.5" text-anchor="middle" fill="#6B7280">products viewed in this session</text>
  <text x="330" y="217" font-size="15.5" text-anchor="middle" fill="#6B7280">time of day</text>
  <g filter="url(#emb2t1-soft)">
    <rect x="780" y="56" width="260" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="780" y="56" width="6" height="90" fill="#D97706" clip-path="url(#emb2t1-k2)"/>
  </g>
  <circle cx="818" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,90.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="844" y="108" font-size="18.5" font-weight="600" fill="#111827">Item tower</text>
  <text x="910" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">product ID's embedding, category, price</text>
  <text x="910" y="194" font-size="15.5" text-anchor="middle" fill="#6B7280">title and photo vectors</text>
  <g filter="url(#emb2t1-soft)">
    <rect x="200" y="262" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="200" y="262" width="6" height="90" fill="#4F46E5" clip-path="url(#emb2t1-k3)"/>
  </g>
  <circle cx="238" cy="307" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,296.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="264" y="314" font-size="18.5" font-weight="600" fill="#111827">User vector</text>
  <text x="330" y="377" font-size="15.5" text-anchor="middle" fill="#6B7280">one list of numbers</text>
  <g filter="url(#emb2t1-soft)">
    <rect x="780" y="262" width="260" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="780" y="262" width="6" height="90" fill="#4F46E5" clip-path="url(#emb2t1-k4)"/>
  </g>
  <circle cx="818" cy="307" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,296.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="844" y="314" font-size="18.5" font-weight="600" fill="#111827">Item vector</text>
  <text x="910" y="377" font-size="15.5" text-anchor="middle" fill="#6B7280">same length as the user vector</text>
  <g filter="url(#emb2t1-lift)">
    <rect x="500" y="456" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="500" y="456" width="9" height="90" fill="#7C3AED" clip-path="url(#emb2t1-k5)"/>
  </g>
  <circle cx="538" cy="501" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,490.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="564" y="508" font-size="18.5" font-weight="600" fill="#111827">Dot product</text>
  <text x="620" y="571" font-size="15.5" text-anchor="middle" fill="#6B7280">a high score means a close match</text>
  <text x="620" y="96" font-size="15.5" text-anchor="middle" fill="#6B7280">the towers never</text>
  <text x="620" y="119" font-size="15.5" text-anchor="middle" fill="#6B7280">see each other</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="620" y="410" fill="#5B21B6">the only place they meet</text></g>
  <rect x="40" y="611" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="656" text-anchor="middle" font-size="16" fill="#475569">Training pushes positive pairs together and negative pairs apart.</text>
</svg>