<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. The saga coordinator charges Payments with idempotency key K, the charge succeeds and the result is stored under K, the response is lost so the coordinator only sees an ambiguous timeout, the coordinator retries the charge with the same key K, and Payments returns the stored result, so the card is charged once.">
  <defs>
    <marker id="m05-l08-idempotent-charge-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l08-idempotent-charge-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m05-l08-idempotent-charge-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m05-l08-idempotent-charge-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1120" fill="#FFFFFF"/>

  <rect x="110" y="180" width="1040" height="440" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="110" y="660" width="1040" height="300" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="320" y1="145" x2="320" y2="880"/>
    <line x1="940" y1="145" x2="940" y2="880"/>
  </g>

  <text x="132" y="220" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Attempt 1: the charge lands, the reply does not</text>
  <text x="1128" y="220" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the ambiguous failure</text>
  <text x="132" y="700" font-size="20" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Attempt 2: retry with the same key K</text>
  <text x="1128" y="700" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the same key is the whole answer</text>

  <g fill="none" stroke-width="2.5">
    <path d="M328,280 L934,280" stroke="#3B82F6" marker-end="url(#m05-l08-idempotent-charge-bl)"/>
    <path d="M934,470 L600,470" stroke="#DC2626" stroke-dasharray="6 5"/>
    <path d="M328,760 L934,760" stroke="#3B82F6" marker-end="url(#m05-l08-idempotent-charge-bl)"/>
    <path d="M934,840 L328,840" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m05-l08-idempotent-charge-em)"/>
  </g>
  <g stroke="#DC2626" stroke-width="3.5" stroke-linecap="round">
    <line x1="566" y1="457" x2="590" y2="483"/>
    <line x1="590" y1="457" x2="566" y2="483"/>
  </g>

  <rect x="314" y="270" width="12" height="230" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="300" y="390" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">coordinator waits</text>
  <text x="300" y="416" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">until the timeout</text>

  <text x="630" y="268" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Charge with idempotency key K</text>
  <text x="800" y="458" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Response lost in the network</text>
  <text x="630" y="748" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Retry the charge with the same key K</text>
  <text x="628" y="828" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Returns the stored result. Charged once.</text>

  <g filter="url(#m05-l08-idempotent-charge-soft)">
    <rect x="720" y="320" width="420" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="930" y="366" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Charge succeeds.</text>
  <text x="930" y="398" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Result stored under K.</text>
  <g filter="url(#m05-l08-idempotent-charge-soft)">
    <rect x="140" y="500" width="400" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="340" y="541" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Coordinator sees a timeout</text>
  <text x="340" y="573" text-anchor="middle" font-size="20" fill="#64748B">it may or may not have landed</text>
  <g filter="url(#m05-l08-idempotent-charge-soft)">
    <rect x="140" y="880" width="400" height="100" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="340" y="921" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Charged exactly once</text>
  <text x="340" y="953" text-anchor="middle" font-size="20" fill="#64748B">not on a crash or a duplicate</text>
  <g filter="url(#m05-l08-idempotent-charge-soft)">
    <rect x="700" y="880" width="440" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="920" y="921" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments recognizes key K</text>
  <text x="920" y="953" text-anchor="middle" font-size="20" fill="#64748B">the card network is never called again</text>

  <g filter="url(#m05-l08-idempotent-charge-soft)">
    <rect x="170" y="50" width="300" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="320" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Saga coordinator</text>
  <text x="320" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">a saga table, or Temporal</text>
  <g filter="url(#m05-l08-idempotent-charge-soft)">
    <rect x="790" y="50" width="300" height="95" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="940" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="940" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">one charge per key</text>

  <line x1="60" y1="1010" x2="96" y2="1010" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1017" font-size="20" fill="#475569">Synchronous charge call: the coordinator waits</text>
  <line x1="60" y1="1050" x2="96" y2="1050" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1057" font-size="20" fill="#475569">Lost response: the coordinator cannot tell</text>
  <line x1="60" y1="1090" x2="96" y2="1090" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1097" font-size="20" fill="#475569">The reply replays the stored result, charged once</text>
</svg>