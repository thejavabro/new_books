    <path d="M609,490 H622 Q634,490 634,502 V538 Q634,550 646,550 H656" marker-end="url(#yt02-am)"/>
    <path d="M930,375 H934 Q946,375 946,387 V428 Q946,440 957,440" marker-end="url(#yt02-am)"/>
    <path d="M930,550 H934 Q946,550 946,538 V492 Q946,480 957,480" marker-end="url(#yt02-am)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="330" y="163" fill="#1D4ED8">upload / search / view</text>
    <text x="430" y="210" fill="#5B21B6">metadata</text>
