  <circle cx="698" cy="550" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,539.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
