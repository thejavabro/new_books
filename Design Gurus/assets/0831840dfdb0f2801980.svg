    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="124" y="142" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#yt02-soft)">
    <rect x="430" y="90" width="184" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
