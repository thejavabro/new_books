    <circle cx="8.5" cy="10" r="1.6"/>
    <path d="M21 15.5l-5-5-8.5 8.5"/>
  </g>
  <text x="724" y="557" font-size="18.5" font-weight="600" fill="#111827">Thumbnails Generator</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M960,420 L960,505 A120,16 0 0 0 1200,505 L1200,420" fill="#FEF3C7"/>
    <ellipse cx="1080" cy="420" rx="120" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1080" y="458" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Video &amp; Thumbnail</text>
  <text x="1080" y="484" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Storage</text>
  <text x="1080" y="551" font-size="15.5" text-anchor="middle" fill="#6B7280">distributed storage for the files</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M60,340 L60,420 A110,16 0 0 0 280,420 L280,340" fill="#EDE9FE"/>
    <ellipse cx="170" cy="340" rx="110" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="170" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Video Metadata DB</text>
  <text x="170" y="461" font-size="15.5" text-anchor="middle" fill="#6B7280">title, path, uploader,</text>
  <text x="170" y="484" font-size="15.5" text-anchor="middle" fill="#6B7280">counts; comments</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M60,570 L60,650 A110,16 0 0 0 280,650 L280,570" fill="#EDE9FE"/>
    <ellipse cx="170" cy="570" rx="110" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="170" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">User DB</text>

  
  <rect x="40" y="700" width="1160" height="80" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="734" text-anchor="middle" font-size="16" fill="#475569">The upload returns as soon as the video is stored and queued.</text>
  <text x="620" y="760" text-anchor="middle" font-size="16" fill="#475569">Encoding and thumbnail generation run in the background, and the user is notified when they finish.</text>
</svg>