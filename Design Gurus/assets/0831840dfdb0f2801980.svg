  <circle cx="402" cy="460" r="18" fill="#FFFFFF"/>
  <g transform="translate(391.56,449.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="428" y="467" font-size="18.5" font-weight="600" fill="#111827">Processing Queue</text>
  <text x="486" y="530" font-size="15.5" text-anchor="middle" fill="#6B7280">uploads wait here</text>
  <text x="486" y="553" font-size="15.5" text-anchor="middle" fill="#6B7280">for background work</text>

  
  <g filter="url(#yt02-soft)">
    <rect x="660" y="330" width="270" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="660" y="330" width="6" height="90" fill="#D97706" clip-path="url(#yt02-k5)"/>
  </g>
  <circle cx="698" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,364.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"/>
    <path d="M7.5 5v14M16.5 5v14"/>
  </g>
  <text x="724" y="382" font-size="18.5" font-weight="600" fill="#111827">Encoder</text>
  <text x="795" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">encodes each video</text>
  <text x="795" y="468" font-size="15.5" text-anchor="middle" fill="#6B7280">into multiple formats</text>

  
  <g filter="url(#yt02-soft)">
    <rect x="660" y="505" width="270" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="660" y="505" width="6" height="90" fill="#D97706" clip-path="url(#yt02-k6)"/>
