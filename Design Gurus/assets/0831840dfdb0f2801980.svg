  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M716,180 V206 Q716,218 704,218 H182 Q170,218 170,230 V321" marker-end="url(#yt02-vi)"/>
    <path d="M752,180 V224 Q752,236 740,236 H322 Q310,236 310,248 V598 Q310,610 298,610 H283" marker-end="url(#yt02-vi)"/>
