  <g filter="url(#yt02-soft)">
    <rect x="700" y="90" width="184" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="700" y="90" width="6" height="90" fill="#2563EB" clip-path="url(#yt02-k3)"/>
  </g>
  <circle cx="738" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
