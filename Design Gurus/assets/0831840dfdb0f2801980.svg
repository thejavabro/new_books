      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="yt02-k1"><rect x="60" y="90" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="yt02-k2"><rect x="430" y="90" width="184" height="90" rx="12"/></clipPath>
    <clipPath id="yt02-k3"><rect x="700" y="90" width="184" height="90" rx="12"/></clipPath>
    <clipPath id="yt02-k4"><rect x="364" y="415" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="yt02-k5"><rect x="660" y="330" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="yt02-k6"><rect x="660" y="505" width="270" height="90" rx="12"/></clipPath>
