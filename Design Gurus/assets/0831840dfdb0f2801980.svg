  <g filter="url(#yt02-soft)">
    <rect x="364" y="415" width="245" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="364" y="415" width="6" height="90" fill="#D97706" clip-path="url(#yt02-k4)"/>
