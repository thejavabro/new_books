  <text x="319" y="355" font-size="19" fill="#0F172A" text-anchor="middle">S3</text>
  <line x1="319" y1="316" x2="231" y2="246" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#hb2-b)"/>
  <g filter="url(#hb2-soft)"><rect x="519" y="180" width="200" height="60" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/></g>
  <text x="619" y="217" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle">Monitor</text>
  <g filter="url(#hb2-soft)"><rect x="454" y="320" width="72" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="490" y="355" font-size="19" fill="#0F172A" text-anchor="middle">S1</text>
  <line x1="490" y1="316" x2="593.2" y2="246" stroke="#0D9488" stroke-width="2.2" marker-end="url(#hb2-t)"/>
  <g filter="url(#hb2-soft)"><rect x="540" y="320" width="72" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="576" y="355" font-size="19" fill="#0F172A" text-anchor="middle">S2</text>
  <line x1="576" y1="316" x2="610.4" y2="246" stroke="#0D9488" stroke-width="2.2" marker-end="url(#hb2-t)"/>
  <g filter="url(#hb2-soft)"><rect x="626" y="320" width="72" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
