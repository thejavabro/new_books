  <line x1="1038.2705098312483" y1="218.5316954888546" x2="1074.9510551477865" y2="331.4228059441751" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#hb2-v)"/>
  <line x1="1095.0798592167912" y1="273.2769431031542" x2="999.0489448522134" y2="343.04748639226085" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#hb2-v)"/>
