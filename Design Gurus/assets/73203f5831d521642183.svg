<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three arrangements. In the first, every machine sends its heartbeat to the leader. In the second, every machine sends it to a separate monitoring service. In the third there is no central point, and each machine sends its heartbeat to a few random peers, which pass on what they heard.">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="hb2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="hb2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="hb2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="hb2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="hb2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="hb2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="hb2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="hb2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="hb2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three ways to arrange the heartbeats</text>
  <rect x="24" y="80" width="370" height="350" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="209" y="118" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">To a leader</text>
  <text x="209" y="146" font-size="18" fill="#64748B" text-anchor="middle">one machine collects them</text>
  <text x="209" y="408" font-size="18" fill="#64748B" text-anchor="middle">The leader knows who is alive</text>
  <rect x="434" y="80" width="370" height="350" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="619" y="118" font-size="21" font-weight="700" fill="#0F766E" text-anchor="middle">To a monitor</text>
  <text x="619" y="146" font-size="18" fill="#64748B" text-anchor="middle">a service outside the group</text>
  <text x="619" y="408" font-size="18" fill="#64748B" text-anchor="middle">Detection is kept out of the way</text>
  <rect x="844" y="80" width="370" height="350" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="1029" y="118" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">To random peers</text>
  <text x="1029" y="146" font-size="18" fill="#64748B" text-anchor="middle">gossip, with no central point</text>
  <text x="1029" y="408" font-size="18" fill="#64748B" text-anchor="middle">Everyone learns about everyone</text>
  <g filter="url(#hb2-soft)"><rect x="124" y="180" width="170" height="60" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="209" y="217" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">Leader</text>
  <g filter="url(#hb2-soft)"><rect x="54" y="320" width="90" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="99" y="355" font-size="19" fill="#0F172A" text-anchor="middle">S1</text>
