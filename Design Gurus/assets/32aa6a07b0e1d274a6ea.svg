<circle cx="760" cy="220" r="34" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="760" y="227" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<rect x="40" y="290" width="1160" height="90" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="330" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">Compare the root to the sum of its two children</text>
<text x="620" y="362" text-anchor="middle" font-size="18.5" fill="#475569">the tree always has exactly one root and two children</text>
