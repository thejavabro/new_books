<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The tree with root 10 and children 3 and 7">
<defs>
<filter id="rs-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
<text x="620" y="50" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">root = [10, 3, 7]</text>
<line x1="620" y1="124" x2="480" y2="186" stroke="#94A3B8" stroke-width="2"/>
<line x1="620" y1="124" x2="760" y2="186" stroke="#94A3B8" stroke-width="2"/>
<circle cx="620" cy="90" r="34" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
