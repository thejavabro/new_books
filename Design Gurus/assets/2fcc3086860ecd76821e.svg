<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1178" viewBox="0 0 1240 1178" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven steps on a 45-minute clock, each with the question it answers, with the serving path as the longest block and two minutes held free">
