  <path d="M119.08,66.75 H244.47 V109.25 H119.08 V66.75 Z" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="181.78" y="93.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">2</text>
  <path d="M247.97,66.75 H373.36 V109.25 H247.97 V66.75 Z" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="310.67" y="93.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">3</text>
  <path d="M376.86,66.75 H502.25 V109.25 H376.86 V66.75 Z" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="439.56" y="93.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">4</text>
  <path d="M505.75,66.75 H811.58 V109.25 H505.75 V66.75 Z" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="658.67" y="93.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">5</text>
  <path d="M815.08,66.75 H1017.81 V109.25 H815.08 V66.75 Z" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="916.44" y="93.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">6</text>
  <path d="M1021.31,66.75 H1146.69 V109.25 H1021.31 V66.75 Z" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="1084.00" y="93.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#111827">7</text>
  <path d="M1150.19,66.75 H1191.25 Q1199.25,66.75 1199.25,74.75 V101.25 Q1199.25,109.25 1191.25,109.25 H1150.19 V66.75 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="40.00" y="134" font-size="15.5" text-anchor="start" fill="#6B7280">0</text>
  <text x="117.33" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">3</text>
  <text x="246.22" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">8</text>
  <text x="375.11" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">13</text>
  <text x="504.00" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">18</text>
  <text x="813.33" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">30</text>
  <text x="1019.56" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">38</text>
  <text x="1148.44" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">43</text>
  <text x="1200.00" y="134" font-size="15.5" text-anchor="end" fill="#6B7280">45</text>
  <rect x="40" y="162" width="1160" height="860" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="192" font-size="16.5" font-weight="600" fill="#1D4ED8">Each step answers one question</text>
  <g filter="url(#c1fw2-soft)">
    <rect x="70" y="214" width="430" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="214" width="6" height="60" fill="#2563EB" clip-path="url(#c1fw2-k1)"/>
  </g>
  <circle cx="108" cy="244" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,233.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="251" font-size="18.5" font-weight="600" fill="#111827">1. Frame the problem</text>
  <text x="285" y="299" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 0 to 3</text>
  <text x="530" y="249.5" font-size="15.5" fill="#374151">What kind of system is this, and what exactly are we building?</text>
  <g filter="url(#c1fw2-soft)">
    <rect x="70" y="314" width="430" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="314" width="6" height="60" fill="#2563EB" clip-path="url(#c1fw2-k2)"/>
  </g>
  <circle cx="108" cy="344" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,333.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="351" font-size="18.5" font-weight="600" fill="#111827">2. Define success</text>
  <text x="285" y="399" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 3 to 8</text>
  <text x="530" y="349.5" font-size="15.5" fill="#374151">Which numbers tell us that it works?</text>
  <g filter="url(#c1fw2-soft)">
    <rect x="70" y="414" width="430" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="414" width="6" height="60" fill="#2563EB" clip-path="url(#c1fw2-k3)"/>
  </g>
  <circle cx="108" cy="444" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,433.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="451" font-size="18.5" font-weight="600" fill="#111827">3. Map the data</text>
  <text x="285" y="499" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 8 to 13</text>
  <text x="530" y="449.5" font-size="15.5" fill="#374151">What does the model learn from, and what does it read at request time?</text>
  <g filter="url(#c1fw2-soft)">
    <rect x="70" y="514" width="430" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="514" width="6" height="60" fill="#2563EB" clip-path="url(#c1fw2-k4)"/>
  </g>
  <circle cx="108" cy="544" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,533.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="551" font-size="18.5" font-weight="600" fill="#111827">4. Pick the model</text>
  <text x="285" y="599" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 13 to 18</text>
  <text x="530" y="549.5" font-size="15.5" fill="#374151">What is the simplest model that could work, and when do we upgrade?</text>
  <g filter="url(#c1fw2-soft)">
    <rect x="70" y="614" width="430" height="60" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="70" y="614" width="6" height="60" fill="#4F46E5" clip-path="url(#c1fw2-k5)"/>
  </g>
  <circle cx="108" cy="644" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,633.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="651" font-size="18.5" font-weight="600" fill="#111827">5. Design the serving path</text>
  <text x="285" y="699" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 18 to 30</text>
  <text x="530" y="649.5" font-size="15.5" fill="#374151">How does one request get its answer on time, and what if a part fails?</text>
  <g filter="url(#c1fw2-soft)">
    <rect x="70" y="714" width="430" height="60" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="70" y="714" width="6" height="60" fill="#D97706" clip-path="url(#c1fw2-k6)"/>
  </g>
  <circle cx="108" cy="744" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,733.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="751" font-size="18.5" font-weight="600" fill="#111827">6. Keep it working</text>
  <text x="285" y="799" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 30 to 38</text>
  <text x="530" y="749.5" font-size="15.5" fill="#374151">How does the system stay accurate after launch?</text>
  <g filter="url(#c1fw2-soft)">
    <rect x="70" y="814" width="430" height="60" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="70" y="814" width="6" height="60" fill="#D97706" clip-path="url(#c1fw2-k7)"/>
  </g>
  <circle cx="108" cy="844" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,833.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="851" font-size="18.5" font-weight="600" fill="#111827">7. Count the costs</text>
  <text x="285" y="899" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 38 to 43</text>
  <text x="530" y="849.5" font-size="15.5" fill="#374151">What breaks, and what is the bill?</text>
  <g filter="url(#c1fw2-soft)">
    <rect x="70" y="914" width="430" height="60" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="914" width="6" height="60" fill="#64748B" clip-path="url(#c1fw2-k8)"/>
  </g>
  <circle cx="108" cy="944" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,933.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="951" font-size="18.5" font-weight="600" fill="#111827">Slack</text>
  <text x="285" y="999" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 43 to 45</text>
  <text x="530" y="949.5" font-size="15.5" fill="#374151">Held free for the interviewer's questions.</text>
  <rect x="40" y="1062" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1106" text-anchor="middle" font-size="15.5" fill="#374151">The serving path gets the longest block, about 12 minutes. The split shifts by family, but no step drops to zero.</text>
</svg>