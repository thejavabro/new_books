    <clipPath id="c1fw2-k4"><rect x="70" y="514" width="430" height="60" rx="12"/></clipPath>
    <clipPath id="c1fw2-k5"><rect x="70" y="614" width="430" height="60" rx="12"/></clipPath>
    <clipPath id="c1fw2-k6"><rect x="70" y="714" width="430" height="60" rx="12"/></clipPath>
    <clipPath id="c1fw2-k7"><rect x="70" y="814" width="430" height="60" rx="12"/></clipPath>
    <clipPath id="c1fw2-k8"><rect x="70" y="914" width="430" height="60" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="1178" fill="#FFFFFF"/>
  <text x="40" y="50" font-size="16.5" font-weight="600" fill="#1D4ED8">Seven steps in 45 minutes</text>
  <path d="M48.75,66.75 H115.58 V109.25 H48.75 Q40.75,109.25 40.75,101.25 V74.75 Q40.75,66.75 48.75,66.75 Z" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
