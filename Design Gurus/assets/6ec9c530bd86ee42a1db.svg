<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="990" viewBox="0 0 1240 990" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. In both, the user service instances register with the service registry. Client-side discovery: the client asks the service registry to discover services, the registry returns the list of instances, and the client chooses instance 1 of three user service instances and sends the request. Server-side discovery: the client sends the request to a load balancer, which queries the service registry and forwards the request to one of three user service instances">
