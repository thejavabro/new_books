<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Seven caller jobs and the operation each one produces, with the design note that belongs to it. Every operation is tied to a job rather than to a table.">
  <defs>
    <filter id="yl04operati-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl04operati-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <marker id="yl04operati-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="yl04operati-as" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>

    <clipPath id="yl04operati-k1"><rect x="84" y="200" width="400" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k2"><rect x="548" y="200" width="608" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k3"><rect x="84" y="282" width="400" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k4"><rect x="548" y="282" width="608" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k5"><rect x="84" y="364" width="400" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k6"><rect x="548" y="364" width="608" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k7"><rect x="84" y="523" width="400" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k8"><rect x="548" y="523" width="608" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k9"><rect x="84" y="605" width="400" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k10"><rect x="548" y="605" width="608" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k11"><rect x="84" y="687" width="400" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k12"><rect x="548" y="687" width="608" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k13"><rect x="84" y="769" width="400" height="48" rx="10"/></clipPath>
    <clipPath id="yl04operati-k14"><rect x="548" y="769" width="608" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1020" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Every operation is tied to a caller job</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">seven jobs, seven operations</text>

  
  <text x="84" y="134" font-size="15.5" font-weight="600" fill="#94A3B8">Caller job</text>
  <text x="606" y="134" font-size="15.5" font-weight="600" fill="#94A3B8">Operation</text>

  
  <rect x="40" y="152" width="1160" height="299" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="182" font-size="16.5" font-weight="600" fill="#1D4ED8">Core jobs</text>
  <text x="1176" y="182" text-anchor="end" font-size="15.5" fill="#6B7280">three operations</text>

  
  <g fill="none" stroke-width="2">
    <path d="M484,224 L547,224" stroke="#2563EB" marker-end="url(#yl04operati-ab)"/>
  </g>
  
  <g filter="url(#yl04operati-soft)">
    <rect x="84" y="200" width="400" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="200" width="6" height="48" fill="#2563EB" clip-path="url(#yl04operati-k1)"/>
  </g>
  <circle cx="118" cy="224" r="4.5" fill="#2563EB"/>
  <text x="142" y="231" font-size="18.5" font-weight="600" fill="#111827">Create a task in a project</text>
  
  <g filter="url(#yl04operati-lift)">
    <rect x="548" y="200" width="608" height="48" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="548" y="200" width="9" height="48" fill="#2563EB" clip-path="url(#yl04operati-k2)"/>
  </g>
  <circle cx="582" cy="224" r="15" fill="#FFFFFF"/>
  <g transform="translate(573,215) scale(0.75)" fill="none" stroke="#2563EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="606" y="231" font-size="18.5" font-weight="600" fill="#111827">POST /v1/projects/{project_id}/tasks</text>
  <text x="852" y="268" text-anchor="middle" font-size="15.5" fill="#6B7280">returns the task, safe to retry</text>

  
  <g fill="none" stroke-width="2">
    <path d="M484,306 L547,306" stroke="#2563EB" marker-end="url(#yl04operati-ab)"/>
  </g>
  <g filter="url(#yl04operati-soft)">
    <rect x="84" y="282" width="400" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="282" width="6" height="48" fill="#2563EB" clip-path="url(#yl04operati-k3)"/>
  </g>
  <circle cx="118" cy="306" r="4.5" fill="#2563EB"/>
  <text x="142" y="313" font-size="18.5" font-weight="600" fill="#111827">Display one task</text>
  <g filter="url(#yl04operati-soft)">
    <rect x="548" y="282" width="608" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="548" y="282" width="6" height="48" fill="#2563EB" clip-path="url(#yl04operati-k4)"/>
  </g>
  <circle cx="582" cy="306" r="4.5" fill="#2563EB"/>
  <text x="606" y="313" font-size="18.5" font-weight="600" fill="#111827">GET /v1/tasks/{task_id}</text>
  <text x="852" y="350" text-anchor="middle" font-size="15.5" fill="#6B7280">compact assignee summaries</text>

  
  <g fill="none" stroke-width="2">
    <path d="M484,388 L547,388" stroke="#2563EB" marker-end="url(#yl04operati-ab)"/>
  </g>
  <g filter="url(#yl04operati-soft)">
    <rect x="84" y="364" width="400" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="364" width="6" height="48" fill="#2563EB" clip-path="url(#yl04operati-k5)"/>
  </g>
  <circle cx="118" cy="388" r="4.5" fill="#2563EB"/>
  <text x="142" y="395" font-size="18.5" font-weight="600" fill="#111827">Display a project's tasks</text>
  <g filter="url(#yl04operati-soft)">
    <rect x="548" y="364" width="608" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="548" y="364" width="6" height="48" fill="#2563EB" clip-path="url(#yl04operati-k6)"/>
  </g>
  <circle cx="582" cy="388" r="4.5" fill="#2563EB"/>
  <text x="606" y="395" font-size="18.5" font-weight="600" fill="#111827">GET /v1/projects/{project_id}/tasks</text>
  <text x="852" y="432" text-anchor="middle" font-size="15.5" fill="#6B7280">cursor paged, filterable</text>

  
  <rect x="40" y="475" width="1160" height="381" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="505" font-size="16.5" font-weight="600" fill="#475569">Supporting jobs</text>
  <text x="1176" y="505" text-anchor="end" font-size="15.5" fill="#6B7280">four operations</text>

  
  <g fill="none" stroke-width="2">
    <path d="M484,547 L547,547" stroke="#64748B" marker-end="url(#yl04operati-as)"/>
  </g>
  <g filter="url(#yl04operati-soft)">
    <rect x="84" y="523" width="400" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="523" width="6" height="48" fill="#64748B" clip-path="url(#yl04operati-k7)"/>
  </g>
  <circle cx="118" cy="547" r="4.5" fill="#64748B"/>
  <text x="142" y="554" font-size="18.5" font-weight="600" fill="#111827">Change selected task fields</text>
  <g filter="url(#yl04operati-soft)">
    <rect x="548" y="523" width="608" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="548" y="523" width="6" height="48" fill="#64748B" clip-path="url(#yl04operati-k8)"/>
  </g>
  <circle cx="582" cy="547" r="4.5" fill="#64748B"/>
  <text x="606" y="554" font-size="18.5" font-weight="600" fill="#111827">PATCH /v1/tasks/{task_id}</text>
  <text x="852" y="591" text-anchor="middle" font-size="15.5" fill="#6B7280">supports concurrency control</text>

  
  <g fill="none" stroke-width="2">
    <path d="M484,629 L547,629" stroke="#64748B" marker-end="url(#yl04operati-as)"/>
  </g>
  <g filter="url(#yl04operati-soft)">
    <rect x="84" y="605" width="400" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="605" width="6" height="48" fill="#64748B" clip-path="url(#yl04operati-k9)"/>
  </g>
  <circle cx="118" cy="629" r="4.5" fill="#64748B"/>
  <text x="142" y="636" font-size="18.5" font-weight="600" fill="#111827">Assign a person</text>
  <g filter="url(#yl04operati-soft)">
    <rect x="548" y="605" width="608" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="548" y="605" width="6" height="48" fill="#64748B" clip-path="url(#yl04operati-k10)"/>
  </g>
  <circle cx="582" cy="629" r="4.5" fill="#64748B"/>
  <text x="606" y="636" font-size="18.5" font-weight="600" fill="#111827">POST /v1/tasks/{task_id}/assignees</text>
  <text x="852" y="673" text-anchor="middle" font-size="15.5" fill="#6B7280">authorization made explicit</text>

  
  <g fill="none" stroke-width="2">
    <path d="M484,711 L547,711" stroke="#64748B" marker-end="url(#yl04operati-as)"/>
  </g>
  <g filter="url(#yl04operati-soft)">
    <rect x="84" y="687" width="400" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="687" width="6" height="48" fill="#64748B" clip-path="url(#yl04operati-k11)"/>
  </g>
  <circle cx="118" cy="711" r="4.5" fill="#64748B"/>
  <text x="142" y="718" font-size="18.5" font-weight="600" fill="#111827">Add a comment</text>
  <g filter="url(#yl04operati-soft)">
    <rect x="548" y="687" width="608" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="548" y="687" width="6" height="48" fill="#64748B" clip-path="url(#yl04operati-k12)"/>
  </g>
  <circle cx="582" cy="711" r="4.5" fill="#64748B"/>
  <text x="606" y="718" font-size="18.5" font-weight="600" fill="#111827">POST /v1/tasks/{task_id}/comments</text>
  <text x="852" y="755" text-anchor="middle" font-size="15.5" fill="#6B7280">returns a comment resource</text>

  
  <g fill="none" stroke-width="2">
    <path d="M484,793 L547,793" stroke="#64748B" marker-end="url(#yl04operati-as)"/>
  </g>
  <g filter="url(#yl04operati-soft)">
    <rect x="84" y="769" width="400" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="769" width="6" height="48" fill="#64748B" clip-path="url(#yl04operati-k13)"/>
  </g>
  <circle cx="118" cy="793" r="4.5" fill="#64748B"/>
  <text x="142" y="800" font-size="18.5" font-weight="600" fill="#111827">View comments</text>
  <g filter="url(#yl04operati-soft)">
    <rect x="548" y="769" width="608" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="548" y="769" width="6" height="48" fill="#64748B" clip-path="url(#yl04operati-k14)"/>
  </g>
  <circle cx="582" cy="793" r="4.5" fill="#64748B"/>
  <text x="606" y="800" font-size="18.5" font-weight="600" fill="#111827">GET /v1/tasks/{task_id}/comments</text>
  <text x="852" y="837" text-anchor="middle" font-size="15.5" fill="#6B7280">paged separately, can grow</text>

  
  <rect x="40" y="880" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="922" text-anchor="middle" font-size="16" fill="#475569">The first three are core: they carry the primary flow.</text>
  <text x="620" y="950" text-anchor="middle" font-size="16" fill="#475569">Creation is the one designed in complete detail.</text>
</svg>