<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="768" viewBox="0 0 1240 768" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ladder-title ladder-desc">
<title id="ladder-title">Four arrangements, not two</title>
<desc id="ladder-desc">Backup and restore, warm standby, active-passive and active-active form a ladder of rising cost and complexity. The usual binary framing hides the two cheaper options that are correct more often.</desc>
<defs>
<marker id="ladder-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ladder-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ladder-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ladder-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="768" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four arrangements, not two</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The usual binary framing hides the two cheaper options that are correct more often.</text>
<rect x="40" y="690" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="690" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="1126" y="120" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">relative cost</text>
<rect x="40" y="134" width="290" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="185" y="170" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backup and restore</text>
<rect x="342" y="134" width="270" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="477" y="156.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">RTO hours, RPO the</text><text x="477" y="183.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">backup interval</text>
<rect x="624" y="134" width="420" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="644" y="170" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the cheapest thing that is not nothing</text>
<rect x="1056" y="147" width="140" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1056" y="147" width="23.3" height="34" rx="10" fill="#06AC80"/>
<rect x="40" y="206" width="290" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="185" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Warm standby</text>
<rect x="342" y="206" width="270" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="477" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">RTO tens of minutes</text>
<rect x="624" y="206" width="420" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="644" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">exists, scaled down, replicating</text>
<rect x="1056" y="219" width="140" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1056" y="219" width="56.0" height="34" rx="10" fill="#159BEF"/>
<rect x="40" y="278" width="290" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="185" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Active-passive</text>
<rect x="342" y="278" width="270" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="477" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">RTO minutes</text>
<rect x="624" y="278" width="420" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="644" y="314" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">full capacity, serving no traffic</text>
<rect x="1056" y="291" width="140" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1056" y="291" width="93.3" height="34" rx="10" fill="#E8BC60"/>
<rect x="40" y="350" width="290" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="185" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Active-active</text>
<rect x="342" y="350" width="270" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="477" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">RTO near zero</text>
<rect x="624" y="350" width="420" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="644" y="386" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">both regions serving</text>
<rect x="1056" y="363" width="140" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1056" y="363" width="140.0" height="34" rx="10" fill="#F25461"/>
<rect x="40" y="434" width="1160" height="118" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="118" rx="2.5" fill="#AC8BE8"/><text x="64" y="473" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Cost rises steeply. Availability improves in smaller and smaller steps.</text><text x="64" y="499" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Nothing to backup-and-restore buys more than active-passive to active-active,</text><text x="64" y="525" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">at a tiny fraction of the cost.</text>
<rect x="40" y="572" width="1160" height="92" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="572" width="5" height="92" rx="2.5" fill="#F3CF6A"/><text x="64" y="611" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The structural weakness of the middle two</text><text x="64" y="637" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The standby is the part that is not exercised, so it is the part that has quietly broken.</text>
<text x="66" y="723" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">That weakness is the strongest argument for active-active that has nothing to do with availability arithmetic.</text>
</svg>