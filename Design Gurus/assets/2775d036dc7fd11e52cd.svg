<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="714" viewBox="0 0 1240 714" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four levels of service from full features down to core only and finally down, showing what is shed at each step so that the checkout keeps working longest">
  <rect x="0" y="0" width="1240" height="714" fill="#FFFFFF"/>
  <defs>
    <marker id="rl5-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">What you switch off, in the order you switch it off</text>

  <line x1="620" y1="152" x2="620" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#rl5-slate)"/>
  <line x1="620" y1="292" x2="620" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#rl5-slate)"/>
  <line x1="620" y1="432" x2="620" y2="470" stroke="#475569" stroke-width="2" marker-end="url(#rl5-slate)"/>

  <rect x="50" y="90" width="1140" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="80" y="128" font-size="20" font-weight="600" fill="#065F46">Full service</text>
  <text x="400" y="128" font-size="20" fill="#065F46">everything on: recommendations, reviews, search, checkout</text>

  <rect x="50" y="192" width="1140" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="80" y="230" font-size="20" font-weight="600" fill="#92400E">Reduced</text>
  <text x="400" y="230" font-size="20" fill="#92400E">recommendations off, reviews served from cache</text>
  <text x="80" y="268" font-size="20" fill="#92400E">shed first</text>
  <text x="400" y="268" font-size="20" fill="#92400E">nobody fails to buy anything because of this</text>

  <rect x="50" y="332" width="1140" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="80" y="370" font-size="20" font-weight="600" fill="#B91C1C">Core only</text>
  <text x="400" y="370" font-size="20" fill="#B91C1C">search degraded to exact match, checkout still live</text>
  <text x="80" y="408" font-size="20" fill="#B91C1C">shed next</text>
  <text x="400" y="408" font-size="20" fill="#B91C1C">the site looks worse, and it still takes money</text>

  <rect x="50" y="472" width="1140" height="60" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="80" y="510" font-size="20" font-weight="600" fill="#334155">Down</text>
  <text x="400" y="510" font-size="20" fill="#334155">nothing works, and every step above existed to avoid this</text>

  <rect x="50" y="572" width="1140" height="112" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="610" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Availability is not a switch. There are useful states between working and down.</text>
  <text x="620" y="642" font-size="20" fill="#334155" text-anchor="middle">Decide the order in advance, because during an incident nobody wants to argue about</text>
  <text x="620" y="668" font-size="20" fill="#334155" text-anchor="middle">whether recommendations matter more than checkout.</text>
</svg>