<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="688" viewBox="0 0 1240 688" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="classes-title classes-desc">
<title id="classes-title">Classify the data first</title>
<desc id="classes-desc">Cosmetic data tolerates minutes with a long expiry alone. Operational data wants seconds with invalidation on write. Transactional data may be cached to inform a page and must be reread at the point of commitment. Security data treats a stale allow as an incident.</desc>
<defs>
<marker id="classes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="classes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="classes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="classes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="688" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Classify the data first</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Every argument becomes short once the classes are named, because the mechanism follows from the class.</text>
<rect x="40" y="610" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="610" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="150" y="136" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Class</text>
<text x="296" y="136" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">Examples</text>
<text x="664" y="136" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">Tolerance</text>
<text x="940" y="136" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">Mechanism</text>
<rect x="40" y="150" width="220" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="150" y="188" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cosmetic</text>
<rect x="276" y="150" width="356" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="296" y="175.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">view counts, follower numbers,</text><text x="296" y="200.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">trending lists</text>
<rect x="644" y="150" width="264" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="664" y="188" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">minutes</text>
<rect x="920" y="150" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="940" y="175.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">long expiry,</text><text x="940" y="200.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">no invalidation</text>
<rect x="40" y="226" width="220" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="150" y="264" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Operational</text>
<rect x="276" y="226" width="356" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="296" y="264" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">catalogs, profiles, configuration</text>
<rect x="644" y="226" width="264" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="664" y="264" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">seconds to a minute</text>
<rect x="920" y="226" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="940" y="251.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">expiry plus invalidation</text><text x="940" y="276.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">on write</text>
<rect x="40" y="302" width="220" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="150" y="340" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Transactional</text>
<rect x="276" y="302" width="356" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="296" y="327.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">price at checkout, inventory,</text><text x="296" y="352.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">balances</text>
<rect x="644" y="302" width="264" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="664" y="340" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">informs, never decides</text>
<rect x="920" y="302" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="940" y="327.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">reread at the moment</text><text x="940" y="352.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">of commitment</text>
<rect x="40" y="378" width="220" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="150" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Security</text>
<rect x="276" y="378" width="356" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="296" y="403.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">permissions, roles, tokens,</text><text x="296" y="428.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">entitlements</text>
<rect x="644" y="378" width="264" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="664" y="403.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a stale allow</text><text x="664" y="428.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">is an incident</text>
<rect x="920" y="378" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="940" y="403.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">very short expiry,</text><text x="940" y="428.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">explicit invalidation</text>
<rect x="40" y="466" width="1160" height="118" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="466" width="5" height="118" rx="2.5" fill="#AC8BE8"/><text x="64" y="502" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Staleness is acceptable almost everywhere.</text><text x="64" y="531" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Incoherence is acceptable almost nowhere.</text><text x="64" y="560" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">So spend the effort on the boundary rather than on the expiry.</text>
<text x="66" y="644" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A cached value may inform a decision. It should rarely be the thing that makes it.</text>
</svg>