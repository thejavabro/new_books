<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five SOLID principles side by side: single responsibility, open closed, Liskov substitution, interface segregation and dependency inversion, each with the rule it states">
  <defs>
    <filter id="sfp-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="sfp-c1"><rect x="60" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="sfp-c2"><rect x="290" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="sfp-c3"><rect x="520" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="sfp-c4"><rect x="750" y="130" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="sfp-c5"><rect x="980" y="130" width="200" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <rect x="40" y="40" width="1160" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Five principles, and the one rule each of them states</text>

  <text x="160" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">S</text>
  <g filter="url(#sfp-soft)">
    <rect x="60" y="130" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#sfp-c1)"/>
  </g>
  <circle cx="98" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="124" y="182" font-size="18.5" font-weight="600" fill="#111827">SRP</text>
  <text x="160" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">Single Responsibility</text>
  <text x="160" y="268" font-size="15.5" text-anchor="middle" fill="#1D4ED8">one reason to change</text>

  <text x="390" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">O</text>
  <g filter="url(#sfp-soft)">
    <rect x="290" y="130" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="290" y="130" width="6" height="90" fill="#7C3AED" clip-path="url(#sfp-c2)"/>
  </g>
  <circle cx="328" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(317.56,164.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>
  </g>
  <text x="354" y="182" font-size="18.5" font-weight="600" fill="#111827">OCP</text>
  <text x="390" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">Open/Closed</text>
  <text x="390" y="268" font-size="15.5" text-anchor="middle" fill="#5B21B6">extend without editing</text>

  <text x="620" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">L</text>
  <g filter="url(#sfp-soft)">
    <rect x="520" y="130" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="520" y="130" width="6" height="90" fill="#059669" clip-path="url(#sfp-c3)"/>
  </g>
  <circle cx="558" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,164.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8h13l-3-3M20 16H7l3 3"/>
  </g>
  <text x="584" y="182" font-size="18.5" font-weight="600" fill="#111827">LSP</text>
  <text x="620" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">Liskov Substitution</text>
  <text x="620" y="268" font-size="15.5" text-anchor="middle" fill="#047857">a subtype must stand in</text>

  <text x="850" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">I</text>
  <g filter="url(#sfp-soft)">
    <rect x="750" y="130" width="200" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="750" y="130" width="6" height="90" fill="#D97706" clip-path="url(#sfp-c4)"/>
  </g>
  <circle cx="788" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,164.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="814" y="182" font-size="18.5" font-weight="600" fill="#111827">ISP</text>
  <text x="850" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">Interface Segregation</text>
  <text x="850" y="268" font-size="15.5" text-anchor="middle" fill="#B45309">no unused methods</text>

  <text x="1080" y="115" font-size="15.5" text-anchor="middle" fill="#94A3B8">D</text>
  <g filter="url(#sfp-soft)">
    <rect x="980" y="130" width="200" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="980" y="130" width="6" height="90" fill="#4F46E5" clip-path="url(#sfp-c5)"/>
  </g>
  <circle cx="1018" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(1007.56,164.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="1044" y="182" font-size="18.5" font-weight="600" fill="#111827">DIP</text>
  <text x="1080" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">Dependency Inversion</text>
  <text x="1080" y="268" font-size="15.5" text-anchor="middle" fill="#4338CA">depend on an interface</text>

  
  <rect x="40" y="360" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="384" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="406" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">What they share</text>
  <text x="288" y="406" font-size="15.5" fill="#475569">every one of them limits how far a single change has to spread through the code</text>
  <rect x="64" y="428" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="450" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">How to use them</text>
  <text x="288" y="450" font-size="15.5" fill="#475569">reach for the one that names the problem in front of you, rather than applying all five at once</text>
</svg>