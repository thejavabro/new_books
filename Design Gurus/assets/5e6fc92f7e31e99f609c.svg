<text x="345" y="380" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<circle cx="455" cy="276" r="30" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="455" y="284" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<circle cx="565" cy="372" r="30" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
<text x="565" y="380" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<circle cx="675" cy="180" r="30" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
<text x="675" y="188" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
