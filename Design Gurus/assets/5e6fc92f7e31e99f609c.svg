<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="545" viewBox="0 0 1240 545" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A tree that is not a binary search tree because 9 sits in the left subtree of 8">
