<text x="675" y="134" text-anchor="middle" font-size="17" font-weight="600" fill="#BE185D">search for 9</text>
<text x="565" y="436" text-anchor="middle" font-size="17" font-weight="600" fill="#BE185D">9 is larger than 8</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#6B7280">A search for 9 starts at 8, goes right to 10, goes left, and runs out of nodes. 9 is never found.</text>
