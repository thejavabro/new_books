<marker id="bstinvalid-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="bstinvalid-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="545" fill="#FFFFFF"/>
<text x="620" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Not a BST: correct at every parent, wrong for the subtree</text>
<text x="620" y="90" text-anchor="middle" font-size="19" fill="#475569">9 is right of its parent 3, which looks fine, but 9 is larger than 8 and sits on the left of 8</text>
