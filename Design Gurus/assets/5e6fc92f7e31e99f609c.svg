<line x1="773" y1="306" x2="753" y2="338" stroke="#DB2777" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#bstinvalid-ar-pink)"/>
<circle cx="741" cy="372" r="30" fill="none" stroke="#F9A8D4" stroke-width="2" stroke-dasharray="6 6"/>
<text x="741" y="379" text-anchor="middle" font-size="18" font-weight="600" fill="#BE185D">null</text>
