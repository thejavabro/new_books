<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="836" viewBox="0 0 1240 836" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="copies-title copies-desc">
<title id="copies-title">Row security protects rows</title>
<desc id="copies-desc">Several other places hold tenant data and none of them are covered by a database policy. The most common cross-tenant leak outside the database is a cache key.</desc>
<defs>
<marker id="copies-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="copies-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="copies-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="copies-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="836" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Row security protects rows</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Several other places hold tenant data and none of them are covered by it.</text>
<rect x="40" y="758" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="758" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="124" width="480" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="159" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Caches</text>
<path d="M526 153H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 153H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#copies-marker-slate)"/>
<rect x="570" y="124" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="146.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a key that omits the tenant serves one tenant's data</text><text x="590" y="171.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">to another, correctly and quickly</text>
<rect x="40" y="192" width="480" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="227" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Search indexes</text>
<path d="M526 221H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 221H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#copies-marker-slate)"/>
<rect x="570" y="192" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="214.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a separate system, frequently queried</text><text x="590" y="239.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">without the tenant filter</text>
<rect x="40" y="260" width="480" height="58" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Object storage</text>
<path d="M526 289H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 289H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#copies-marker-slate)"/>
<rect x="570" y="260" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="295" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">addressed by identifier, where guessing one is enough</text>
<rect x="40" y="328" width="480" height="58" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="363" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Background jobs</text>
<path d="M526 357H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 357H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#copies-marker-slate)"/>
<rect x="570" y="328" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a batch across tenants, where an error path</text><text x="590" y="375.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">writes to the wrong one</text>
<rect x="40" y="396" width="480" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="431" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Logs and support tooling</text>
<path d="M526 425H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 425H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#copies-marker-slate)"/>
<rect x="570" y="396" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="418.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">internal views that show everything,</text><text x="590" y="443.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is a real exposure</text>
<rect x="40" y="464" width="480" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="499" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Exports, reports and emails</text>
<path d="M526 493H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 493H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#copies-marker-slate)"/>
<rect x="570" y="464" width="630" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="486.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">assembled asynchronously, where the</text><text x="590" y="511.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tenant context was lost</text>
<rect x="40" y="550" width="1160" height="76" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="550" width="5" height="76" rx="2.5" fill="#AC8BE8"/><text x="64" y="581" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Isolation holds where it was designed and fails wherever data was copied</text><text x="64" y="607" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Every copy is a place the boundary has to be re-established.</text>
<rect x="40" y="650" width="1160" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="650" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="64" y="680.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Take one tenant and list every place their data exists outside the primary table.</text><text x="64" y="707.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">The list is usually longer than expected.</text>
<text x="66" y="792" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The copies are made by caches, indexes, exports and jobs.</text>
</svg>