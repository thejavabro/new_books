<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="question-title question-desc">
<title id="question-title">The question that replaces "will it fail"</title>
<desc id="question-desc">Making a component less likely to fail pays off less and less. Making its failure smaller is usually cheaper and works for failures nobody predicted.</desc>
<defs>
<marker id="question-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="question-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="question-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="question-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="786" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The question that replaces "will it fail"</text>
<text x="40" y="86" font-size="21" fill="#4A5568">At a certain scale the question stops being whether a component fails and becomes how much it takes with it.</text>
<rect x="40" y="708" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="708" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Will this component fail?</text>
<rect x="640" y="118" width="560" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How much does it take with it?</text>
<rect x="40" y="188" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="60" y="224" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it pays off less and less, and gets expensive quickly</text>
<rect x="640" y="188" width="560" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="660" y="211.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">usually cheaper, and it works for</text><text x="660" y="236.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the failures nobody predicted</text>
<rect x="40" y="268" width="1160" height="64" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="268" width="5" height="64" rx="2.5" fill="#AC8BE8"/><text x="64" y="306" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Blast radius is the set of things that stop working when one thing breaks.</text>
<text x="40" y="374" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three questions that make it concrete</text>
<circle cx="60" cy="422" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="429" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="392" width="430" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="305" y="428" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">If this instance dies, who notices?</text>
<path d="M526 422H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 422H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#question-marker-slate)"/>
<rect x="570" y="392" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="428" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the answer should be nobody</text>
<circle cx="60" cy="494" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="501" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="464" width="430" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="305" y="486.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">If this shard is corrupted,</text><text x="305" y="513.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">how many customers?</text>
<path d="M526 494H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 494H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#question-marker-slate)"/>
<rect x="570" y="464" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="500" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a number, and one you chose</text>
<circle cx="60" cy="566" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="573" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="536" width="430" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="305" y="558.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">If this deploy is bad,</text><text x="305" y="585.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">how far does it get?</text>
<path d="M526 566H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 566H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#question-marker-slate)"/>
<rect x="570" y="536" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="572" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most ignored of the three</text>
<rect x="40" y="618" width="1160" height="64" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="618" width="5" height="64" rx="2.5" fill="#39D5AA"/><text x="64" y="656" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">You cannot predict which component fails. You can decide how much goes with it.</text>
<text x="66" y="742" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">It is a property you design, whether or not you think about it.</text>
</svg>