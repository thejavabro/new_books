<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Rules live in UserService and storage lives in UserStore, so each new requirement lands in exactly one module">
  <defs>
    <filter id="soc-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="soc-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="soc-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="soc-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <clipPath id="soc-s1"><rect x="170" y="120" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="soc-s2"><rect x="170" y="300" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="soc-c1"><rect x="670" y="120" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="soc-t1"><rect x="940" y="120" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="soc-c2"><rect x="670" y="300" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="soc-t2"><rect x="940" y="300" width="230" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="670" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Two concerns, two modules</text>

  <g fill="none" stroke-width="2.5">
    <path d="M445,210 V294" stroke="#2563EB" marker-end="url(#soc-bl)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="368" y="272" fill="#1D4ED8">asks it to save</text>
  </g>

  <g filter="url(#soc-lift)">
    <rect x="170" y="120" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="170" y="120" width="9" height="90" fill="#2563EB" clip-path="url(#soc-s1)"/>
  </g>
  <circle cx="210" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(199.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="236" y="172" font-size="18.5" font-weight="600" fill="#111827">UserService</text>
  <text x="320" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">decides what is acceptable</text>

  <g filter="url(#soc-soft)">
    <rect x="170" y="300" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="170" y="300" width="6" height="90" fill="#059669" clip-path="url(#soc-s2)"/>
  </g>
  <circle cx="208" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,334.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="234" y="352" font-size="18.5" font-weight="600" fill="#111827">UserStore</text>
  <text x="320" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">stores whatever it is handed</text>
  <text x="320" y="438" font-size="15.5" text-anchor="middle" fill="#94A3B8">it has no opinion about the data</text>

  
  <rect x="640" y="40" width="560" height="440" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#B45309">Where the next change lands</text>

  <g fill="none" stroke-width="2">
    <path d="M900,165 H928" stroke="#D97706" marker-end="url(#soc-am)"/>
    <path d="M900,345 H928" stroke="#D97706" marker-end="url(#soc-am)"/>
  </g>

  <g filter="url(#soc-soft)">
    <rect x="670" y="120" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="670" y="120" width="6" height="90" fill="#D97706" clip-path="url(#soc-c1)"/>
  </g>
  <circle cx="708" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,154.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="734" y="172" font-size="18.5" font-weight="600" fill="#111827">New name rule</text>

  <g filter="url(#soc-soft)">
    <rect x="940" y="120" width="230" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="940" y="120" width="6" height="90" fill="#2563EB" clip-path="url(#soc-t1)"/>
  </g>
  <circle cx="978" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="1004" y="172" font-size="18.5" font-weight="600" fill="#111827">UserService</text>
  <text x="920" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">the store is not opened</text>

  <g filter="url(#soc-soft)">
    <rect x="670" y="300" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="670" y="300" width="6" height="90" fill="#D97706" clip-path="url(#soc-c2)"/>
  </g>
  <circle cx="708" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,334.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="734" y="352" font-size="18.5" font-weight="600" fill="#111827">A real database</text>

  <g filter="url(#soc-soft)">
    <rect x="940" y="300" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="940" y="300" width="6" height="90" fill="#059669" clip-path="url(#soc-t2)"/>
  </g>
  <circle cx="978" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,334.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="1004" y="352" font-size="18.5" font-weight="600" fill="#111827">UserStore</text>
  <text x="920" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">the rules are not opened</text>

  
  <rect x="40" y="510" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="534" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="556" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">One area each</text>
  <text x="288" y="556" font-size="15.5" fill="#475569">a concern is one area of the work, such as storing data or deciding what input is valid</text>
  <rect x="64" y="578" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="600" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The practical test</text>
  <text x="288" y="600" font-size="15.5" fill="#475569">when a requirement changes, count how many modules you have to open</text>
</svg>