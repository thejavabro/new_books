<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="734" viewBox="0 0 1240 734" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="committed-title committed-desc">
<title id="committed-title">What committed actually means</title>
<desc id="committed-desc">An entry is committed once a majority of the cluster has it on durable storage. A minority can be missing it entirely, which is fine, and this is what sets the arithmetic of cluster sizing.</desc>
<defs>
<marker id="committed-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="committed-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="committed-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="committed-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="734" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What committed actually means</text>
<text x="40" y="86" font-size="21" fill="#4A5568">An entry is committed once a majority of the cluster has it on durable storage.</text>
<rect x="40" y="656" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="656" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="40" y="138" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A five-node cluster, one entry in flight</text>
<rect x="40" y="162" width="216" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="148" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">leader</text>
<rect x="98" y="222" width="100" height="44" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="148" y="251" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">entry</text>
<rect x="276" y="162" width="216" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="384" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">follower</text>
<rect x="334" y="222" width="100" height="44" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="384" y="251" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">entry</text>
<rect x="512" y="162" width="216" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">follower</text>
<rect x="570" y="222" width="100" height="44" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="251" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">entry</text>
<rect x="748" y="162" width="216" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="856" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">follower</text>
<rect x="806" y="222" width="100" height="44" rx="7" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="856" y="251" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">no</text>
<rect x="984" y="162" width="216" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1092" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">follower</text>
<rect x="1042" y="222" width="100" height="44" rx="7" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1092" y="251" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">no</text>
<path d="M32 152H736V276H32Z" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="384" y="296" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">a majority has it on disk, so it is COMMITTED</text>
<text x="974" y="296" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">behind or down, and will catch up</text>
<rect x="40" y="320" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="320" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="361" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Committed means a majority has it. Not all of it.</text>
<text x="40" y="422" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Which is why cluster sizes are odd</text>
<rect x="40" y="440" width="300" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="474" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">3 nodes</text>
<rect x="360" y="440" width="300" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="510" y="474" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">majority 2</text>
<rect x="680" y="440" width="520" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="700" y="474" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tolerates 1 failure</text>
<rect x="40" y="506" width="300" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="540" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">4 nodes</text>
<rect x="360" y="506" width="300" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="510" y="540" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">majority 3</text>
<rect x="680" y="506" width="520" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="700" y="540" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tolerates 1 failure</text>
<rect x="40" y="572" width="300" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="606" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">5 nodes</text>
<rect x="360" y="572" width="300" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="510" y="606" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">majority 3</text>
<rect x="680" y="572" width="520" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="700" y="606" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tolerates 2 failures</text>
<text x="1180" y="540" font-size="19" font-weight="700" fill="#A83147" text-anchor="end">no better than 3</text>
<text x="66" y="690" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Four nodes tolerate one failure, exactly like three, with more cost and more latency.</text>
</svg>