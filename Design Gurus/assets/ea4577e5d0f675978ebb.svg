<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rollback-title rollback-desc">
<title id="rollback-title">The rollback you will actually use</title>
<desc id="rollback-desc">Most plans describe reversing the whole migration. The one that gets used is a single flag, available during or just after the read switch, and it works only because the old representation is still being written.</desc>
<defs>
<marker id="rollback-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="rollback-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="rollback-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="rollback-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="832" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The rollback you will actually use</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Most rollback plans describe reversing the migration.</text>
<rect x="40" y="754" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="754" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<text x="40" y="148" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The realistic bad moment</text>
<rect x="40" y="166" width="1160" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="200" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads have moved, and something is wrong: latency, a wrong edge case, the error rate slightly up</text>
<path d="M620 230V266" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 230V266" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rollback-marker-slate)"/>
<rect x="340" y="272" width="560" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="306" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the read flag goes back</text>
<rect x="40" y="350" width="1160" height="68" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="350" width="5" height="68" rx="2.5" fill="#39D5AA"/><text x="64" y="377" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">It works because writes are still going to both representations</text><text x="64" y="403" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which is exactly why the soak exists and why stopping old writes is deliberately late</text>
<rect x="40" y="442" width="560" height="116" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="442" width="5" height="116" rx="2.5" fill="#39D5AA"/><text x="64" y="467" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Phases 0 to 7</text><text x="64" y="493" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">One flag. Seconds.</text><text x="64" y="519" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">No coordination. Covers almost</text><text x="64" y="545" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">every realistic failure.</text>
<rect x="640" y="442" width="560" height="116" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="442" width="5" height="116" rx="2.5" fill="#F28B9D"/><text x="664" y="467" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Phase 8 onwards</text><text x="664" y="493" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A reverse backfill, which is</text><text x="664" y="519" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a new migration and should be</text><text x="664" y="545" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">planned as one.</text>
<rect x="40" y="582" width="1160" height="68" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="582" width="5" height="68" rx="2.5" fill="#AC8BE8"/><text x="64" y="607.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Write down who can flip the flag and how,</text><text x="64" y="636.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">in a place somebody will find at three in the morning.</text>
<rect x="40" y="672" width="1160" height="56" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="672" width="5" height="56" rx="2.5" fill="#F28B9D"/><text x="64" y="706" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A rollback only the author can operate is unavailable exactly when it is needed.</text>
<text x="66" y="788" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">One action, available immediately, that somebody can take without understanding the whole migration.</text>
</svg>