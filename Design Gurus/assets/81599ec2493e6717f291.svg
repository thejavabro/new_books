<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Why a hash set finds a value faster than a list">
<defs>
<marker id="d-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="d-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="d-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="d-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="d-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="d-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="d-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="d-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="d-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="940" height="490" fill="#FFFFFF"/>
<text x="470" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Why a set, and not a list</text>
<rect x="40" y="84" width="420" height="296" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="62" y="114" font-size="19.5" font-weight="600" fill="#BE185D">Looking inside a list</text>
<rect x="72" y="140" width="70" height="56" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="107" y="175.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="154" y="140" width="70" height="56" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="189" y="175.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="236" y="140" width="70" height="56" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="271" y="175.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<rect x="318" y="140" width="70" height="56" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="353" y="175.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-1</text>
<text x="107" y="218" text-anchor="middle" font-size="15" fill="#6B7280">check</text>
<text x="189" y="218" text-anchor="middle" font-size="15" fill="#6B7280">check</text>
<text x="271" y="218" text-anchor="middle" font-size="15" fill="#6B7280">check</text>
<text x="353" y="218" text-anchor="middle" font-size="15" fill="#6B7280">check</text>
<text x="250" y="262" text-anchor="middle" font-size="18.5" fill="#BE185D">Is 6 in here?</text>
<text x="250" y="292" text-anchor="middle" font-size="18.5" fill="#6B7280">There is no shortcut. You compare</text>
<text x="250" y="320" text-anchor="middle" font-size="18.5" fill="#6B7280">against every value, one by one.</text>
<rect x="150" y="334" width="200" height="38" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="250" y="359" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">up to N comparisons</text>
<rect x="480" y="84" width="420" height="296" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="502" y="114" font-size="19.5" font-weight="600" fill="#047857">Looking inside a set</text>
<rect x="512" y="140" width="70" height="56" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="547" y="175.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<path d="M590,168 L632,168" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#d-ar-emerald)"/>
<rect x="638" y="140" width="122" height="56" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="699" y="175.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">hash(6)</text>
<path d="M768,168 L806,168" stroke="#059669" stroke-width="2.2" fill="none" marker-end="url(#d-ar-emerald)"/>
<rect x="812" y="140" width="76" height="56" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="850" y="175.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">slot 4</text>
<text x="690" y="262" text-anchor="middle" font-size="18.5" fill="#047857">The value says which slot</text>
<text x="690" y="292" text-anchor="middle" font-size="18.5" fill="#6B7280">to look in, so only that one</text>
<text x="690" y="320" text-anchor="middle" font-size="18.5" fill="#6B7280">slot is ever read.</text>
<rect x="590" y="334" width="200" height="38" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="690" y="359" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">1 step on average</text>
<rect x="40" y="394" width="860" height="82" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="62" y="430" font-size="18.5" fill="#475569">This is the whole reason approach 2 is faster. The work per value drops from N to 1,</text>
<text x="62" y="458" font-size="18.5" fill="#475569">so the total drops from N squared to N. The cost is the memory the set needs.</text>
</svg>