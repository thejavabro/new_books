<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One changed requirement, two candidates">
  <rect x="0" y="0" width="1240" height="670" fill="#FFFFFF"/>
  <defs>
    <marker id="a-DC2626" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="a-059669" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
  </defs>
  <text x="620" y="46" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">One changed requirement, two candidates</text>
  <text x="620" y="88" font-size="21" font-weight="700" fill="#334155" text-anchor="middle">&quot;Drivers are notified by SMS, through a provider that rate-limits you.&quot;</text>
  <rect x="70" y="126" width="500" height="64" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="320" y="164" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Memorized the architecture</text>
  <rect x="670" y="126" width="500" height="64" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="920" y="164" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Identified known problems</text>
  <rect x="160" y="240" width="320" height="90" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="320" y="276" font-size="20" fill="#475569" text-anchor="middle">This case is not</text>
  <text x="320" y="306" font-size="20" fill="#475569" text-anchor="middle">on the diagram</text>
  <line x1="320" y1="190" x2="320" y2="232" stroke="#DC2626" stroke-width="2.5" marker-end="url(#a-DC2626)"/>
  <rect x="160" y="372" width="320" height="66" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="320" y="412" font-size="22" font-weight="700" fill="#991B1B" text-anchor="middle">Cannot adapt</text>
  <line x1="320" y1="330" x2="320" y2="364" stroke="#DC2626" stroke-width="2.5" marker-end="url(#a-DC2626)"/>
  <rect x="670" y="236" width="500" height="76" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="920" y="266" font-size="20" fill="#475569" text-anchor="middle">Crosses a company boundary</text>
  <text x="920" y="294" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Webhooks</text>
  <rect x="670" y="342" width="500" height="76" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="920" y="372" font-size="20" fill="#475569" text-anchor="middle">The provider rate-limits us</text>
  <text x="920" y="400" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Message queue</text>
  <rect x="670" y="448" width="500" height="76" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="920" y="478" font-size="20" fill="#475569" text-anchor="middle">Reports arrive twice</text>
  <text x="920" y="506" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Idempotency</text>
  <rect x="670" y="554" width="500" height="76" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  <text x="920" y="584" font-size="20" fill="#475569" text-anchor="middle">It could be down for an hour</text>
  <text x="920" y="612" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Circuit breaker</text>
  <line x1="920" y1="190" x2="920" y2="228" stroke="#059669" stroke-width="2.5" marker-end="url(#a-059669)"/>
  <text x="320" y="506" font-size="20" fill="#991B1B" text-anchor="middle">Requirements change.</text>
  <text x="320" y="534" font-size="20" fill="#991B1B" text-anchor="middle">Diagrams do not.</text>
</svg>