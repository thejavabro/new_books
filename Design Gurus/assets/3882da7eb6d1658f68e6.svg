<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="390" viewBox="0 0 1240 390" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Writes per day times the size of one object gives daily storage, multiplied by the retention period and then by the replication factor to get the real total">
  <rect x="0" y="0" width="1240" height="390" fill="#FFFFFF"/>
  <defs>
    <marker id="be7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="be7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="290" y1="195" x2="343" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#be7-slate)"/>
  <line x1="600" y1="195" x2="653" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#be7-slate)"/>
  <line x1="910" y1="195" x2="963" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#be7-slate)"/>

  <g filter="url(#be7-soft)">
    <rect x="40" y="140" width="250" height="110" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="350" y="140" width="250" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="660" y="140" width="250" height="110" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="970" y="140" width="250" height="110" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>

  <text x="165" y="185" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">10 million</text>
  <text x="165" y="218" font-size="20" fill="#475569" text-anchor="middle">writes a day</text>

  <text x="475" y="185" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">5 TB</text>
  <text x="475" y="218" font-size="20" fill="#3B82F6" text-anchor="middle">a day</text>

  <text x="785" y="185" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">10 PB</text>
  <text x="785" y="218" font-size="20" fill="#3B82F6" text-anchor="middle">over 5 years</text>

  <text x="1095" y="185" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">30 PB</text>
  <text x="1095" y="218" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">actually stored</text>

  <text x="316" y="120" font-size="20" fill="#475569" text-anchor="middle">x 500 KB each</text>
  <text x="626" y="120" font-size="20" fill="#475569" text-anchor="middle">x 1,825 days</text>
  <text x="936" y="120" font-size="20" fill="#475569" text-anchor="middle">x 3 copies</text>

  <text x="620" y="320" font-size="20" fill="#475569" text-anchor="middle">Retention and replication are the two multipliers that get forgotten, and both are large</text>
</svg>