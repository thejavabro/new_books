<text x="620" y="324" font-size="15.5" text-anchor="middle" font-weight="600" fill="#BE185D">The fact that Rao sits in B-204 is stored once for every student he teaches.</text>
<rect x="40" y="382" width="1160" height="264" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="412" width="250" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="189" y="434" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">insertion anomaly</text>
<text x="340" y="428" font-size="16" font-weight="600" fill="#111827">A new course that nobody has enrolled in yet cannot be stored.</text>
<text x="340" y="456" font-size="16" fill="#6B7280">The key is (Student_ID, Course_ID), so the row needs a student.</text>
<rect x="64" y="488" width="250" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="189" y="510" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">update anomaly</text>
<text x="340" y="504" font-size="16" font-weight="600" fill="#111827">Rao moves to office B-410, so two rows have to change.</text>
<text x="340" y="532" font-size="16" fill="#6B7280">Change one and miss the other, and the table gives two offices for Rao.</text>
<rect x="64" y="564" width="250" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="189" y="586" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">deletion anomaly</text>
<text x="340" y="580" font-size="16" font-weight="600" fill="#111827">Meera Das drops Compilers, so her row is deleted.</text>
<text x="340" y="608" font-size="16" fill="#6B7280">That also erases the only record that Sen teaches Compilers in B-118.</text>
</svg>