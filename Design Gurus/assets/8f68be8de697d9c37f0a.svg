<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="582" viewBox="0 0 1240 582" role="img" aria-label="A full-text search engine builds an inverted index: a map from each word to the list of documents containing it. A query looks up each word and intersects the lists, instead of reading every document.">
