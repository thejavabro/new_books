  <text x="64" y="290" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Doc 3</text>
  <text x="64" y="316" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">"system capacity"</text>
  <line x1="390" y1="190" x2="456" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="423" y="176" font-size="20" fill="#64748B" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">indexed</text>
  <text x="490" y="48" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The inverted index</text>
  <rect x="490" y="74" width="400" height="320" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="510" y="92" width="360" height="48" rx="8" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
