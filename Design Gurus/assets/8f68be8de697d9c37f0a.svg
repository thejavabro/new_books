  <text x="1065" y="272" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Look up both words,</text>
  <text x="1065" y="300" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">intersect: Doc 1</text>
  <rect x="40" y="434" width="1160" height="116" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="468" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A normal database index finds rows by an exact column value.</text>
  <text x="70" y="498" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">It cannot rank documents by how well their text matches a phrase, which is why search gets its own store</text>
  <text x="70" y="526" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">and its own box in your diagram, kept up to date from your primary data.</text>
</svg>