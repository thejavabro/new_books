<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Autoscaling as a control loop: a workload signal (requests per second per instance, or queue depth) is compared to a target, instances are added up to a ceiling or removed down to a floor, new instances warm up for tens of seconds, and the loop measures again. Separately, a sudden spike is absorbed by headroom and queues because scaling shows up after the spike is over.">
  <defs>
    <marker id="m06-l04-autoscaling-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l04-autoscaling-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l04-autoscaling-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m06-l04-autoscaling-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m06-l04-autoscaling-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="960" fill="#FFFFFF"/>

  <rect x="60" y="80" width="1120" height="430" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="120" font-size="20" font-weight="600" fill="#1E3A8A">The control loop: capacity follows the signal</text>
  <text x="1160" y="120" text-anchor="end" font-size="20" fill="#64748B">floors and ceilings bound it</text>

  <g filter="url(#m06-l04-autoscaling-soft)">
    <rect x="90" y="200" width="280" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="230" y="240" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Signal</text>
  <text x="230" y="272" text-anchor="middle" font-size="20" fill="#64748B">requests per instance,</text>
  <text x="230" y="304" text-anchor="middle" font-size="20" fill="#64748B">or queue depth</text>
  <g filter="url(#m06-l04-autoscaling-soft)">
    <path d="M560,190 L700,265 L560,340 L420,265 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="560" y="272" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Above target?</text>
  <g filter="url(#m06-l04-autoscaling-soft)">
    <rect x="740" y="180" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="880" y="226" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Add instances,</text>
  <text x="880" y="258" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">up to the ceiling</text>
  <g filter="url(#m06-l04-autoscaling-soft)">
    <rect x="740" y="330" width="280" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="880" y="376" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Remove instances,</text>
  <text x="880" y="408" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">down to the floor</text>
  <text x="880" y="312" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">new instances warm up: tens of seconds</text>

  <g fill="none" stroke-width="2.5">
    <path d="M370,265 L412,265" stroke="#3B82F6" marker-end="url(#m06-l04-autoscaling-bl)"/>
    <path d="M700,240 C720,240 715,235 732,235" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l04-autoscaling-bl)"/>
    <path d="M700,290 C720,290 715,385 732,385" stroke="#475569" stroke-width="2" marker-end="url(#m06-l04-autoscaling-sl)"/>
    <path d="M1020,235 L1100,235 L1100,470 L230,470 L230,342" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l04-autoscaling-sl)"/>
  </g>

  <text x="700" y="212" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="700" y="340" text-anchor="end" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="600" y="455" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">then measure again</text>

  <rect x="60" y="560" width="1120" height="200" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="600" font-size="20" font-weight="600" fill="#92400E">The spike the loop cannot catch</text>
  <text x="1160" y="600" text-anchor="end" font-size="20" fill="#64748B">sustained growth, not sudden bursts</text>
  <g filter="url(#m06-l04-autoscaling-soft)">
    <rect x="90" y="630" width="320" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="250" y="676" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A sudden spike</text>
  <text x="250" y="708" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">arrives</text>
  <g filter="url(#m06-l04-autoscaling-soft)">
    <rect x="460" y="630" width="320" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="620" y="676" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Headroom and queues</text>
  <text x="620" y="708" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">absorb it</text>
  <g filter="url(#m06-l04-autoscaling-soft)">
    <rect x="830" y="630" width="320" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="990" y="676" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Scaling shows up after</text>
  <text x="990" y="708" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the spike is over</text>

  <g fill="none" stroke-width="2.5">
    <path d="M410,685 L452,685" stroke="#3B82F6" marker-end="url(#m06-l04-autoscaling-bl)"/>
    <path d="M780,685 L822,685" stroke="#DC2626" marker-end="url(#m06-l04-autoscaling-rd)"/>
  </g>

  <line x1="60" y1="800" x2="96" y2="800" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">The signal, and the capacity added for it</text>
  <line x1="60" y1="840" x2="96" y2="840" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="847" font-size="20" fill="#475569">The lag: warm-up seconds</text>
  <line x1="60" y1="880" x2="96" y2="880" stroke="#475569" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="887" font-size="20" fill="#475569">The loop closes, and measures again</text>
  <line x1="60" y1="920" x2="96" y2="920" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="927" font-size="20" fill="#475569">Capacity that arrives too late</text>
</svg>