<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="background-color:#ffffff">
<defs>
<marker id="pa" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#b4322c"/></marker>
<marker id="pb" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#2f7a55"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="30" font-size="14" font-weight="bold" fill="#b4322c">Shallow copy: the fields are copied, what they point at is not</text>

<rect x="30" y="48" width="180" height="66" fill="#ffffff" stroke="#b4322c"/>
<text x="120" y="70" text-anchor="middle" font-weight="bold">prototype</text>
<text x="42" y="92" font-size="11.5">subject: "Welcome"</text>
<text x="42" y="108" font-size="11.5">channels:</text>

<rect x="30" y="140" width="180" height="66" fill="#ffffff" stroke="#b4322c"/>
<text x="120" y="162" text-anchor="middle" font-weight="bold">copy</text>
<text x="42" y="184" font-size="11.5">subject: "Welcome, Ada"</text>
<text x="42" y="200" font-size="11.5">channels:</text>

<rect x="300" y="94" width="200" height="60" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="400" y="118" text-anchor="middle" font-family="monospace" font-size="12">["email", "push"]</text>
<text x="400" y="140" text-anchor="middle" font-size="11.5" fill="#b4322c">one list, two owners</text>

<path d="M 210 105 L 295 115" stroke="#b4322c" fill="none" marker-end="url(#pa)"/>
<path d="M 210 197 L 295 135" stroke="#b4322c" fill="none" marker-end="url(#pa)"/>

<rect x="540" y="90" width="410" height="68" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="560" y="114" font-size="12.5" fill="#b4322c">The copy adds "push" and the prototype gets it too.</text>
<text x="560" y="134" font-size="12.5" fill="#b4322c">Every template made afterwards is now wrong, and nothing</text>
<text x="560" y="150" font-size="12.5" fill="#b4322c">in the code looks like it did anything.</text>

<line x1="30" y1="232" x2="930" y2="232" stroke="#dbe2ed"/>

<text x="30" y="266" font-size="14" font-weight="bold" fill="#2f7a55">Deep copy: the copy gets its own list</text>

<rect x="30" y="284" width="180" height="60" fill="#ffffff" stroke="#2f7a55"/>
<text x="120" y="306" text-anchor="middle" font-weight="bold">prototype</text>
<text x="42" y="328" font-size="11.5">channels:</text>

<rect x="300" y="284" width="180" height="34" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="390" y="306" text-anchor="middle" font-family="monospace" font-size="12">["email"]</text>

<rect x="30" y="356" width="180" height="46" fill="#ffffff" stroke="#2f7a55"/>
<text x="120" y="374" text-anchor="middle" font-weight="bold">copy</text>
<text x="42" y="394" font-size="11.5">channels:</text>

<rect x="300" y="352" width="180" height="34" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="390" y="374" text-anchor="middle" font-family="monospace" font-size="12">["email", "push"]</text>

<path d="M 210 325 L 295 301" stroke="#2f7a55" fill="none" marker-end="url(#pb)"/>
<path d="M 210 391 L 295 371" stroke="#2f7a55" fill="none" marker-end="url(#pb)"/>

<rect x="540" y="300" width="410" height="70" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="560" y="324" font-size="12.5" fill="#2f7a55">One line does it: new ArrayList&lt;&gt;(other.channels).</text>
<text x="560" y="344" font-size="12.5" fill="#2f7a55">Shallow or deep is a decision per field, and the compiler</text>
<text x="560" y="360" font-size="12.5" fill="#2f7a55">will not make it for you.</text>
</g>
</svg>