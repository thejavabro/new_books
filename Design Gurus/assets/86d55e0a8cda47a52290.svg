<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five forms an AI design question takes">
  <defs>

    <filter id="m1l1a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l1a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>


  <rect x="50" y="58" width="300" height="62" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="200" y="95" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">1. Known ML product</text>
  <text x="374" y="84" font-size="15.5" text-anchor="start" fill="#94A3B8">"Design YouTube recommendations"</text>
  <text x="374" y="106" font-size="15.5" font-weight="600" text-anchor="start" fill="#1D4ED8">explain data, features, serving, evaluation, and feedback</text>
  <rect x="50" y="140" width="300" height="62" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="200" y="177" text-anchor="middle" font-size="16.5" font-weight="600" fill="#5B21B6">2. GenAI product</text>
  <text x="374" y="166" font-size="15.5" text-anchor="start" fill="#94A3B8">"Design a docs assistant"</text>
  <text x="374" y="188" font-size="15.5" font-weight="600" text-anchor="start" fill="#5B21B6">explain context, inference cost, evaluation, and safety</text>
  <rect x="50" y="222" width="300" height="62" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="259" text-anchor="middle" font-size="16.5" font-weight="600" fill="#047857">3. Add AI to this</text>
  <text x="374" y="248" font-size="15.5" text-anchor="start" fill="#94A3B8">"Where would you add AI?"</text>
  <text x="374" y="270" font-size="15.5" font-weight="600" text-anchor="start" fill="#047857">explain whether AI is needed and choose a useful feature</text>
  <rect x="50" y="304" width="300" height="62" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="200" y="341" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">4. Design an agent</text>
  <text x="374" y="330" font-size="15.5" text-anchor="start" fill="#94A3B8">"An agent that books travel"</text>
  <text x="374" y="352" font-size="15.5" font-weight="600" text-anchor="start" fill="#B45309">explain permissions, limits, and task evaluation</text>
  <rect x="50" y="386" width="300" height="62" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="200" y="423" text-anchor="middle" font-size="16.5" font-weight="600" fill="#BE185D">5. Critique this design</text>
  <text x="374" y="412" font-size="15.5" text-anchor="start" fill="#94A3B8">"Our RAG is slow and wrong"</text>
  <text x="374" y="434" font-size="15.5" font-weight="600" text-anchor="start" fill="#BE185D">use measurements to diagnose and improve the design</text>
  <rect x="40" y="478" width="1160" height="108" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="512" font-size="16" fill="#475569">Identify the question form, then confirm the expected focus.</text>
  <rect x="64" y="538" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="560" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Identify it early</text>
  <text x="288" y="560" font-size="15.5" fill="#475569">use the form to guide your questions, not to assume the requirements</text>
</svg>