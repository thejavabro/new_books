<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="641" viewBox="0 0 1240 641" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Before launch, people judge results and NDCG scores them; after launch, click-through arrives first and contact-seller rate arrives later as the delayed truth">
  <defs>
    <marker id="c8vsm-m64748b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c8vsm-md97706" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="c8vsm-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c8vsm-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c8vsm-k1"><rect x="64" y="136" width="306" height="90" rx="12"/></clipPath>
    <clipPath id="c8vsm-k2"><rect x="130" y="340" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="c8vsm-k3"><rect x="548" y="136" width="246" height="90" rx="12"/></clipPath>
    <clipPath id="c8vsm-k4"><rect x="890" y="136" width="248" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="641" fill="#FFFFFF"/>
  <rect x="40" y="56" width="454" height="429" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Before launch: no users yet</text>
  <rect x="518" y="56" width="682" height="429" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="542" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">After launch: real usage builds up</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M370,181 H548" marker-end="url(#c8vsm-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M794,181 H890" marker-end="url(#c8vsm-m64748b)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M340,226 V340" marker-end="url(#c8vsm-md97706)"/></g>
  <g filter="url(#c8vsm-soft)">
    <rect x="64" y="136" width="306" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c8vsm-k1)"/>
  </g>
  <circle cx="102" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="64" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 1: before launch</text>
  <text x="128" y="188" font-size="18.5" font-weight="600" fill="#111827">Human-judged relevance</text>
  <text x="217" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">scored with NDCG</text>
  <g filter="url(#c8vsm-soft)">
    <rect x="130" y="340" width="230" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="130" y="340" width="6" height="90" fill="#64748B" clip-path="url(#c8vsm-k2)"/>
  </g>
  <circle cx="168" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,374.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="194" y="392" font-size="18.5" font-weight="600" fill="#111827">Regression suite</text>
  <text x="245" y="455" font-size="15.5" text-anchor="middle" fill="#6B7280">a fixed test every new encoder must pass</text>
  <g filter="url(#c8vsm-soft)">
    <rect x="548" y="136" width="246" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="548" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#c8vsm-k3)"/>
  </g>
  <circle cx="586" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(575.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="548" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 2: after launch, within seconds</text>
  <text x="612" y="188" font-size="18.5" font-weight="600" fill="#111827">Click-through rate</text>
  <text x="671" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">the faster signal, a proxy</text>
  <g filter="url(#c8vsm-soft)">
    <rect x="890" y="136" width="248" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="890" y="136" width="6" height="90" fill="#059669" clip-path="url(#c8vsm-k4)"/>
  </g>
  <circle cx="928" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(917.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="890" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 3: later, hours to days</text>
  <text x="954" y="188" font-size="18.5" font-weight="600" fill="#111827">Contact-seller rate</text>
  <text x="1014" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">the delayed truth, decides which model ships</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="432" y="167" fill="#475569">graduates to</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="842" y="167" fill="#475569">then</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="328" y="296" fill="#B45309">the judged set becomes</text></g>
  <rect x="40" y="525" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="570" text-anchor="middle" font-size="16" fill="#475569">Human grades need no users, and clicks need users but no waiting. Contacts need both users and time.</text>
</svg>