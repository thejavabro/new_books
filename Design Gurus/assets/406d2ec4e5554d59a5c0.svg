<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. The user sends a request with a session or OAuth token, the gateway validates that credential once at the edge, then calls the Orders service with a short-lived signed JWT, Orders verifies the signature locally and reads the claims, forwards the same JWT to the Payments service, and Payments verifies the signature locally as well.">
  <defs>
    <marker id="m06-l05-token-flow-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l05-token-flow-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m06-l05-token-flow-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1030" fill="#FFFFFF"/>

  <rect x="30" y="180" width="1180" height="190" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="50" y="220" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">North-south: traffic entering from outside</text>
  <rect x="30" y="400" width="1180" height="470" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="50" y="440" font-size="20" font-weight="600" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Inside the system: the token travels with the call</text>
  <text x="1180" y="440" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the network confers no trust</text>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="175" y1="145" x2="175" y2="870"/>
    <line x1="445" y1="145" x2="445" y2="870"/>
    <line x1="715" y1="145" x2="715" y2="870"/>
    <line x1="985" y1="145" x2="985" y2="870"/>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M181,290 L439,290" stroke="#3B82F6" marker-end="url(#m06-l05-token-flow-bl)"/>
    <path d="M451,510 L709,510" stroke="#3B82F6" marker-end="url(#m06-l05-token-flow-bl)"/>
    <path d="M721,650 L979,650" stroke="#3B82F6" marker-end="url(#m06-l05-token-flow-bl)"/>
    <path d="M445,325 H490 Q500,325 500,337 V349 Q500,361 490,361 H449" stroke="#059669" stroke-width="2" marker-end="url(#m06-l05-token-flow-em)"/>
    <path d="M715,545 H760 Q770,545 770,557 V569 Q770,581 760,581 H719" stroke="#059669" stroke-width="2" marker-end="url(#m06-l05-token-flow-em)"/>
    <path d="M985,685 H1030 Q1040,685 1040,697 V709 Q1040,721 1030,721 H989" stroke="#059669" stroke-width="2" marker-end="url(#m06-l05-token-flow-em)"/>
  </g>

  <text x="310" y="278" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. Request with a session token</text>
  <text x="512" y="355" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. Validate the credential once</text>
  <text x="580" y="498" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. Call with a short-lived signed JWT</text>
  <text x="782" y="575" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. Verify the signature locally</text>
  <text x="850" y="638" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. Forward the same JWT</text>
  <text x="1160" y="760" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. Verify the signature locally</text>

  <g filter="url(#m06-l05-token-flow-soft)">
    <rect x="60" y="560" width="340" height="170" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="230" y="604" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">What the JWT carries</text>
  <text x="230" y="636" text-anchor="middle" font-size="20" fill="#64748B">claims: the id and the role</text>
  <text x="230" y="668" text-anchor="middle" font-size="20" fill="#64748B">plus a signature over them</text>
  <text x="230" y="700" text-anchor="middle" font-size="20" fill="#64748B">a lifetime in minutes</text>
  <g filter="url(#m06-l05-token-flow-soft)">
    <rect x="60" y="760" width="340" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="230" y="801" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Never trust a bare header</text>
  <text x="230" y="833" text-anchor="middle" font-size="20" fill="#64748B">just because it is present</text>

  <g filter="url(#m06-l05-token-flow-soft)">
    <rect x="50" y="50" width="250" height="95" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="175" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User</text>
  <text x="175" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">browser or app</text>
  <g filter="url(#m06-l05-token-flow-soft)">
    <rect x="320" y="50" width="250" height="95" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="445" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="445" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">authenticates once</text>
  <g filter="url(#m06-l05-token-flow-soft)">
    <rect x="590" y="50" width="250" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="715" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders</text>
  <text x="715" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">verifies the token</text>
  <g filter="url(#m06-l05-token-flow-soft)">
    <rect x="860" y="50" width="250" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="985" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="985" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">verifies the token</text>

  <line x1="60" y1="910" x2="96" y2="910" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="917" font-size="20" fill="#475569">Synchronous call: the caller is waiting</text>
  <line x1="60" y1="950" x2="96" y2="950" stroke="#059669" stroke-width="4"/>
  <text x="108" y="957" font-size="20" fill="#475569">Local verification, with no network hop</text>
  <line x1="60" y1="990" x2="96" y2="990" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="997" font-size="20" fill="#475569">The short-lived signed JWT travels with the call</text>
</svg>