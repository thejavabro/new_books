  <text x="1018.5" y="891" font-size="18.5" font-weight="600" fill="#111827">View tiers</text>
  <text x="1039.5" y="954" font-size="15.5" text-anchor="middle" fill="#6B7280">10,000, 100,000, 1 million views</text>
