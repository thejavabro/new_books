  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="500" y="293" fill="#5B21B6">known CSAM match</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="827.5" y="340" fill="#4338CA">about 1 percent flagged</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="638" y="556" fill="#475569">not flagged</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="1027.5" y="556" fill="#5B21B6">still uncertain</text></g>
