  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="430" y="655" fill="#475569">sets thresholds per</text><text x="430" y="674" fill="#475569">category and region</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="687" y="762" fill="#475569">unless removed</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="879" y="870" fill="#475569">views counted</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1164" y="762" fill="#1D4ED8">score again with heavier models</text></g>
  <rect x="40" y="1029" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1072" text-anchor="middle" font-size="16" fill="#475569">Thresholds are configuration, keyed by category and region, so a line can change without a new model.</text>
  <text x="620" y="1097" text-anchor="middle" font-size="16" fill="#475569">A flagged item goes live reduced at once, and the heavy models score it right after.</text>
