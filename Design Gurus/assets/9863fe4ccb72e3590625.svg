  <circle cx="942" cy="429" r="18" fill="#FFFFFF"/>
  <g transform="translate(931.56,418.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="968" y="436" font-size="20" font-weight="600" fill="#111827">Worker 2</text>

  <text x="136" y="385" font-size="20" text-anchor="middle" fill="#6B7280">a file on disk</text>
  <text x="456" y="250" font-size="20" text-anchor="middle" fill="#6B7280">the program&#39;s instructions</text>
  <text x="748" y="250" font-size="20" text-anchor="middle" fill="#6B7280">objects, such as</text>
