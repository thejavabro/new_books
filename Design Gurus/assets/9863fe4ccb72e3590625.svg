  <g transform="translate(639.56,418.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="676" y="436" font-size="20" font-weight="600" fill="#111827">Worker 1</text>

  <g filter="url(#l03pm-soft)">
    <rect x="904" y="384" width="272" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="904" y="384" width="6" height="90" fill="#2563EB" clip-path="url(#l03pm-k7)"/>
