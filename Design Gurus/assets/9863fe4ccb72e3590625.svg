  <text x="1040" y="250" font-size="20" text-anchor="middle" fill="#6B7280">and open files</text>
  <text x="456" y="504" font-size="20" text-anchor="middle" fill="#6B7280">own stack</text>
  <text x="456" y="532" font-size="20" text-anchor="middle" fill="#94A3B8">own program counter</text>
  <text x="748" y="504" font-size="20" text-anchor="middle" fill="#6B7280">own stack</text>
  <text x="748" y="532" font-size="20" text-anchor="middle" fill="#94A3B8">own program counter</text>
  <text x="1040" y="504" font-size="20" text-anchor="middle" fill="#6B7280">own stack</text>
  <text x="1040" y="532" font-size="20" text-anchor="middle" fill="#94A3B8">own program counter</text>

  <rect x="40" y="598" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="643" text-anchor="middle" font-size="20" fill="#475569">Every thread uses the same heap, but each thread keeps its own stack and program counter.</text>
