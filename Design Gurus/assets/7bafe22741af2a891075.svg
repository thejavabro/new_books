<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="734" viewBox="0 0 1240 734" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="headroom-title headroom-desc">
<title id="headroom-title">Why you cannot run at ninety percent</title>
<desc id="headroom-desc">Time in the system is service time divided by one minus utilization, so a request takes twice its service time at fifty percent busy and twenty times at ninety five. Separately, losing one of three availability zones raises each survivor from a third of the load to a half.</desc>
<defs>
<marker id="headroom-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="headroom-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="headroom-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="headroom-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="734" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why you cannot run at ninety percent</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Time in the system is service time divided by one minus utilization.</text>
<rect x="40" y="656" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="656" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="40" y="136" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Time in the system, as a multiple of service time</text>
<rect x="100.0" y="304.0" width="120" height="16" rx="5" fill="#06AC80"/>
<text x="160" y="288" font-size="22" font-weight="700" fill="#169B77" text-anchor="middle">2x</text>
<rect x="330.0" y="293.6" width="120" height="26.4" rx="5" fill="#06AC80"/>
<text x="390" y="277.6" font-size="22" font-weight="700" fill="#169B77" text-anchor="middle">3.3x</text>
<rect x="560.0" y="280.0" width="120" height="40" rx="5" fill="#E8BC60"/>
<text x="620" y="264" font-size="22" font-weight="700" fill="#91642E" text-anchor="middle">5x</text>
<rect x="790.0" y="240.0" width="120" height="80" rx="5" fill="#F25461"/>
<text x="850" y="224" font-size="22" font-weight="700" fill="#A83147" text-anchor="middle">10x</text>
<rect x="1020.0" y="160.0" width="120" height="160" rx="5" fill="#F25461"/>
<text x="1080" y="144" font-size="22" font-weight="700" fill="#A83147" text-anchor="middle">20x</text>
<path d="M40 320H1200" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><path d="M160 320V332" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="160" y="360" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">50% busy</text><path d="M390 320V332" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="390" y="360" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">70% busy</text><path d="M620 320V332" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="620" y="360" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">80% busy</text><path d="M850 320V332" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="850" y="360" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">90% busy</text><path d="M1080 320V332" stroke="#284E65" stroke-width="3" stroke-linecap="round"/><text x="1080" y="360" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">95% busy</text>
<rect x="40" y="400" width="560" height="140" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="400" width="5" height="140" rx="2.5" fill="#F3CF6A"/><text x="64" y="437" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Queueing</text><text x="64" y="463" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">service time / (1 - utilization)</text><text x="64" y="489" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Nothing breaks between 90 and 95 percent.</text><text x="64" y="515" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The arithmetic stops being forgiving.</text>
<rect x="640" y="400" width="560" height="140" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 400H646A6 6 0 0 0 640 406V534A6 6 0 0 0 646 540H654Z" fill="#F28B9D"/><text x="670" y="436" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Losing one of three zones</text>
<rect x="690" y="454" width="210" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="795" y="483" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">each at 33%</text>
<path d="M906 477H940" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M906 477H940" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#headroom-marker-slate)"/>
<rect x="946" y="454" width="210" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1051" y="483" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">survivors at 50%</text>
<text x="920" y="526" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">so steady state must stay at or below about 66 percent</text>
<rect x="40" y="564" width="1160" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="564" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="64" y="603" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Headroom is not slack. It is the capacity the failure you planned for will consume.</text>
<text x="66" y="690" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The familiar seventy percent target is roughly what three zones and a single-zone failure allow.</text>
</svg>