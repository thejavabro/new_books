<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five step Messenger message flow: User A sends a message to the chat server, the server acknowledges User A, stores the message in the database and delivers it to User B, User B acknowledges the server, and the server notifies User A that delivery succeeded.">
  <defs>
    <marker id="fm03-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="fm03-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="fm03-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="fm03-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="fm03-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="fm03-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="fm03-k1"><rect x="70" y="90" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="fm03-k2"><rect x="520" y="90" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="fm03-k3"><rect x="1000" y="90" width="170" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2">
    <path d="M240,106 L520,106" stroke="#2563EB" marker-end="url(#fm03-bl)"/>
    <path d="M520,135 L240,135" stroke="#64748B" marker-end="url(#fm03-sl)"/>
    <path d="M520,164 L240,164" stroke="#059669" marker-end="url(#fm03-em)"/>
    <path d="M720,121 L1000,121" stroke="#059669" marker-end="url(#fm03-em)"/>
    <path d="M1000,151 L720,151" stroke="#64748B" marker-end="url(#fm03-sl)"/>
    <path d="M620,180 L620,254" stroke="#D97706" marker-end="url(#fm03-am)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="404" y="140" fill="#475569">ack</text>
    <text x="324" y="169" fill="#047857">delivered</text>
    <text x="804" y="126" fill="#047857">deliver</text>
    <text x="944" y="156" fill="#475569">ack</text>
    <text x="644" y="222" fill="#B45309">store</text>
  </g>

  
  <g stroke="#FFFFFF" stroke-width="2">
    <circle cx="290" cy="106" r="14" fill="#2563EB"/>
    <circle cx="380" cy="135" r="14" fill="#64748B"/>
    <circle cx="300" cy="164" r="14" fill="#059669"/>
    <circle cx="780" cy="121" r="14" fill="#059669"/>
    <circle cx="920" cy="151" r="14" fill="#64748B"/>
    <circle cx="620" cy="217" r="14" fill="#D97706"/>
  </g>
  <g font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <text x="290" y="111.5">1</text>
    <text x="380" y="140.5">2</text>
    <text x="300" y="169.5">5</text>
    <text x="780" y="126.5">3</text>
    <text x="920" y="156.5">4</text>
    <text x="620" y="222.5">3</text>
  </g>

  
  <g filter="url(#fm03-soft)">
    <rect x="70" y="90" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="90" width="6" height="90" fill="#2563EB" clip-path="url(#fm03-k1)"/>
  </g>
  <circle cx="108" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="134" y="142" font-size="18.5" font-weight="600" fill="#111827">User A</text>

  
  <g filter="url(#fm03-lift)">
    <rect x="520" y="90" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="520" y="90" width="9" height="90" fill="#7C3AED" clip-path="url(#fm03-k2)"/>
  </g>
  <circle cx="558" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,124.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="584" y="142" font-size="18.5" font-weight="600" fill="#111827">Chat Server</text>

  
  <g filter="url(#fm03-soft)">
    <rect x="1000" y="90" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="1000" y="90" width="6" height="90" fill="#2563EB" clip-path="url(#fm03-k3)"/>
  </g>
  <circle cx="1038" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="1064" y="142" font-size="18.5" font-weight="600" fill="#111827">User B</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M505,270 L505,344 A115,16 0 0 0 735,344 L735,270" fill="#FEF3C7"/>
    <ellipse cx="620" cy="270" rx="115" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="620" y="322" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Message Database</text>

  
  <rect x="40" y="400" width="1160" height="190" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g font-size="16" fill="#475569">
    <text x="72" y="436"><tspan font-weight="600" fill="#111827">1.</tspan><tspan x="98">User-A sends a message to User-B through the chat server.</tspan></text>
    <text x="72" y="466"><tspan font-weight="600" fill="#111827">2.</tspan><tspan x="98">The server sends an acknowledgment to User-A.</tspan></text>
    <text x="72" y="496"><tspan font-weight="600" fill="#111827">3.</tspan><tspan x="98">The server stores the message and sends it to User-B.</tspan></text>
    <text x="72" y="526"><tspan font-weight="600" fill="#111827">4.</tspan><tspan x="98">User-B sends an acknowledgment to the server.</tspan></text>
    <text x="72" y="556"><tspan font-weight="600" fill="#111827">5.</tspan><tspan x="98">The server notifies User-A that delivery succeeded.</tspan></text>
  </g>
</svg>