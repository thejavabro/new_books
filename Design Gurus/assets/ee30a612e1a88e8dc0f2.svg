<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four design-time steps: 1, the provider team publishes the service&#39;s catalog entry (service name, owner team, capabilities such as order.create, and contract URL) to the service registry; 2, the Checkout team searches the registry by capability while designing; 3, the registry returns the OrderService entry with its owner and contract URL, and the team reads the contract; 4, the built Checkout service calls the provider directly at its documented endpoint with an API request and response such as REST or SOAP">
  <defs>
    <filter id="m06f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m06f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m06f-k1"><rect x="440" y="130" width="360" height="100" rx="12"/></clipPath>
    <clipPath id="m06f-k2"><rect x="40" y="660" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="m06f-k3"><rect x="900" y="660" width="300" height="90" rx="12"/></clipPath>
    <marker id="m06f-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m06f-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m06f-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="m06f-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Discoverability in SOA: registry, provider, and consumer</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The provider team publishes to the registry, the consumer team searches it while designing, then the built consumer calls the provider.</text>



  <g fill="none" stroke-width="2">
    <path d="M100,660 V192 Q100,180 112,180 H440" stroke="#059669" stroke-width="2.5" marker-end="url(#m06f-m-emerald)"/>
    <path d="M1160,660 V192 Q1160,180 1148,180 H800" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m06f-m-blue)"/>
    <path d="M770,230 V588 Q770,600 782,600 H928 Q940,600 940,612 V660" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m06f-m-amber)"/>
    <path d="M900,705 H340" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#m06f-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m06f-lift)">
    <rect x="440" y="130" width="360" height="100" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="440" y="130" width="9" height="100" fill="#7C3AED" clip-path="url(#m06f-k1)"/>
  </g>
  <circle cx="478" cy="180" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,169.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="504" y="187" font-size="21.5" font-weight="600" fill="#111827">Service registry</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">for example, UDDI</text>
  <g filter="url(#m06f-soft)">
    <rect x="40" y="660" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="660" width="6" height="90" fill="#2563EB" clip-path="url(#m06f-k2)"/>
  </g>
  <circle cx="78" cy="705" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,694.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="104" y="712" font-size="21.5" font-weight="600" fill="#111827">Service provider</text>
  <text x="190" y="779" font-size="18.5" text-anchor="middle" fill="#6B7280">for example, Order service</text>
  <g filter="url(#m06f-soft)">
    <rect x="900" y="660" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="660" width="6" height="90" fill="#2563EB" clip-path="url(#m06f-k3)"/>
  </g>
  <circle cx="938" cy="705" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,694.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="964" y="712" font-size="21.5" font-weight="600" fill="#111827">Service consumer</text>
  <text x="1050" y="779" font-size="18.5" text-anchor="middle" fill="#6B7280">for example, Checkout service</text>

  <circle cx="140" cy="222" r="16" fill="#059669"/>
  <text x="140" y="228.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">1</text>
  <text x="166" y="229" font-size="19.5" font-weight="600" fill="#047857">Publish service</text>
  <text x="124" y="262" font-size="18.5" fill="#475569">Provider team publishes the</text>
  <text x="124" y="289" font-size="18.5" fill="#475569">contract and capabilities.</text>
  <rect x="124" y="312" width="270" height="148" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="142" y="344" font-size="17" fill="#1F2937">Service: OrderService</text>
  <text x="142" y="370" font-size="17" fill="#1F2937">Owner: platform-commerce</text>
  <text x="142" y="396" font-size="17" fill="#1F2937">Capabilities: order.create,</text>
  <text x="142" y="422" font-size="17" fill="#1F2937">order.retrieve, order.cancel</text>
  <text x="142" y="448" font-size="17" fill="#1F2937">Contract URL: https://...</text>
  <circle cx="840" cy="222" r="16" fill="#2563EB"/>
  <text x="840" y="228.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">2</text>
  <text x="866" y="229" font-size="19.5" font-weight="600" fill="#1D4ED8">Search the registry</text>
  <text x="824" y="262" font-size="18.5" fill="#475569">Checkout team searches the registry</text>
  <text x="824" y="289" font-size="18.5" fill="#475569">by capability while designing.</text>
  <rect x="824" y="312" width="230" height="44" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="842" y="344" font-size="17" fill="#1F2937">Search: order.create</text>
  <circle cx="810" cy="398" r="16" fill="#D97706"/>
  <text x="810" y="404.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">3</text>
  <text x="836" y="405" font-size="19.5" font-weight="600" fill="#B45309">Read the contract</text>
  <text x="794" y="438" font-size="18.5" fill="#475569">Registry returns the entry and</text>
  <text x="794" y="465" font-size="18.5" fill="#475569">the team reads the contract.</text>
  <rect x="794" y="488" width="260" height="96" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="812" y="520" font-size="17" fill="#1F2937">Service: OrderService</text>
  <text x="812" y="546" font-size="17" fill="#1F2937">Owner: platform-commerce</text>
  <text x="812" y="572" font-size="17" fill="#1F2937">Contract URL: https://...</text>
  <circle cx="551" cy="600" r="16" fill="#4F46E5"/>
  <text x="551" y="606.5" text-anchor="middle" font-size="18.5" font-weight="700" fill="#FFFFFF">4</text>
  <text x="577" y="607" font-size="19.5" font-weight="600" fill="#4338CA">Call the provider</text>
  <text x="620" y="640" text-anchor="middle" font-size="18.5" fill="#475569">The built Checkout service calls the</text>
  <text x="620" y="667" text-anchor="middle" font-size="18.5" fill="#475569">provider directly at its documented endpoint.</text>
  <rect x="470" y="725" width="300" height="70" rx="10" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="620" y="757" text-anchor="middle" font-size="17" fill="#1F2937">API request and response</text>
  <text x="620" y="783" text-anchor="middle" font-size="17" fill="#1F2937">(for example, REST or SOAP)</text>


</svg>