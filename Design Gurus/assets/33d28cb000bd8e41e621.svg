<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="536" viewBox="0 0 1240 536" role="img" aria-label="Deriving the load: 500 million new URLs a month is about 17 million a day, which over 100,000 seconds is about 200 writes a second; at a hundred reads per write that is 20 thousand reads a second, and three times that at peak. Storage is 15 terabytes, outgoing bandwidth 10 megabytes a second, and the cache needs about 200 gigabytes. Those numbers decide that the data must be partitioned, that a cache belongs in front of the database, and that bandwidth is a non-issue.">
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.09"/></filter>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.20"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DB2777"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>
  <rect width="1240" height="536" fill="#FFFFFF"/>
  <rect x="38" y="43" width="196" height="126" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M38 57 A14 14 0 0 1 52 43 L220 43 A14 14 0 0 1 234 57 Z" fill="#64748B"/>
  <text x="136" y="101" font-size="29" font-weight="700" fill="#334155" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">500M</text>
  <text x="136" y="131" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">new URLs / month</text>
  <text x="136" y="190" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">given</text>
  <rect x="280" y="43" width="196" height="126" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M280 57 A14 14 0 0 1 294 43 L462 43 A14 14 0 0 1 476 57 Z" fill="#64748B"/>
  <text x="378" y="101" font-size="29" font-weight="700" fill="#334155" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">~17M</text>
  <text x="378" y="131" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">per day</text>
  <text x="378" y="190" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">÷ 30 days</text>
  <line x1="242" y1="106" x2="272" y2="106" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/>
  <rect x="522" y="43" width="196" height="126" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M522 57 A14 14 0 0 1 536 43 L704 43 A14 14 0 0 1 718 57 Z" fill="#2563EB"/>
  <text x="620" y="101" font-size="29" font-weight="700" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">~200/s</text>
  <text x="620" y="131" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">writes</text>
  <text x="620" y="190" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">÷ 100,000 s</text>
  <line x1="484" y1="106" x2="514" y2="106" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/>
  <rect x="764" y="43" width="196" height="126" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M764 57 A14 14 0 0 1 778 43 L946 43 A14 14 0 0 1 960 57 Z" fill="#2563EB"/>
  <text x="862" y="101" font-size="29" font-weight="700" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">20K/s</text>
  <text x="862" y="131" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">reads</text>
  <text x="862" y="190" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">× 100 read:write</text>
  <line x1="726" y1="106" x2="756" y2="106" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/>
  <rect x="1006" y="43" width="196" height="126" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M1006 57 A14 14 0 0 1 1020 43 L1188 43 A14 14 0 0 1 1202 57 Z" fill="#2563EB"/>
  <text x="1104" y="101" font-size="29" font-weight="700" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">60K/s</text>
  <text x="1104" y="131" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">reads at peak</text>
  <text x="1104" y="190" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">× 3 peak factor</text>
  <line x1="968" y1="106" x2="998" y2="106" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/>
  <path d="M40 222 H 1200" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="58" y="254" width="348" height="136" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M58 268 A14 14 0 0 1 72 254 L392 254 A14 14 0 0 1 406 268 Z" fill="#7C3AED"/>
  <text x="232" y="312" font-size="32" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">15 TB</text>
  <text x="232" y="342" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">30 billion objects</text>
  <text x="232" y="366" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">at ~500 bytes each</text>
  <rect x="446" y="254" width="348" height="136" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M446 268 A14 14 0 0 1 460 254 L780 254 A14 14 0 0 1 794 268 Z" fill="#7C3AED"/>
  <text x="620" y="312" font-size="32" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">10 MB/s</text>
  <text x="620" y="342" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">outgoing at 20K reads/s</text>
  <text x="620" y="366" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">(100 KB/s incoming)</text>
  <rect x="834" y="254" width="348" height="136" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M834 268 A14 14 0 0 1 848 254 L1168 254 A14 14 0 0 1 1182 268 Z" fill="#7C3AED"/>
  <text x="1008" y="312" font-size="32" font-weight="700" fill="#6D28D9" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">~200 GB</text>
  <text x="1008" y="342" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">20% of 2 billion</text>
  <text x="1008" y="366" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">daily reads, cached</text>
  <rect x="58" y="420" width="348" height="76" rx="13" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="232" y="450" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">30 billion rows</text>
  <text x="232" y="478" font-size="20" font-weight="700" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">partition the data</text>
  <rect x="446" y="420" width="348" height="76" rx="13" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="620" y="450" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">10 MB/s out</text>
  <text x="620" y="478" font-size="20" font-weight="700" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">bandwidth is a non-issue</text>
  <rect x="834" y="420" width="348" height="76" rx="13" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="1008" y="450" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">100 reads per write</text>
  <text x="1008" y="478" font-size="20" font-weight="700" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">put a cache in front</text>
</svg>