<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="How a service gets its values. The service asks the configuration server at startup and is sent its values, the server reads them from a version controlled store, and the values are organised by environment, by service and by instance">
  <defs>
    <marker id="cf3-mindigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="cf3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="cf3-k1"><rect x="72" y="124" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="cf3-k2"><rect x="470" y="124" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cf3-k3"><rect x="72" y="428" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf3-k4"><rect x="455" y="428" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf3-k5"><rect x="838" y="428" width="330" height="90" rx="12"/></clipPath>
    <filter id="cf3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cf3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="280" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">How a service gets its values</text>
  <rect x="40" y="360" width="1160" height="250" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="390" font-size="16.5" font-weight="600" fill="#475569">How the values are organised</text>
  <g fill="none" stroke="#4F46E5" stroke-width="2">
    <path d="M282,158 H462" marker-end="url(#cf3-mindigo)"/>
  </g>
  <g fill="none" stroke="#4F46E5" stroke-width="2">
    <path d="M470,190 H290" marker-end="url(#cf3-mindigo)"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M770,169 H862" marker-end="url(#cf3-mslate)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="376" y="146" fill="#4338CA">asks at startup</text>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="376" y="211" fill="#4338CA">gets its values</text>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="820" y="157" fill="#475569">reads</text>
  </g>
  <g filter="url(#cf3-soft)">
    <rect x="72" y="124" width="210" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="124" width="6" height="90" fill="#2563EB" clip-path="url(#cf3-k1)"/>
  </g>
  <circle cx="110" cy="169" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,158.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="176" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="177" y="239" font-size="15.5" text-anchor="middle" fill="#6B7280">one of many services,</text>
  <text x="177" y="262" font-size="15.5" text-anchor="middle" fill="#94A3B8">with no values in its build</text>
  <g filter="url(#cf3-lift)">
    <rect x="470" y="124" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="470" y="124" width="9" height="90" fill="#4F46E5" clip-path="url(#cf3-k2)"/>
  </g>
  <circle cx="508" cy="169" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,158.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="534" y="176" font-size="18.5" font-weight="600" fill="#111827">Configuration Server</text>
  <text x="620" y="239" font-size="15.5" text-anchor="middle" fill="#6B7280">holds every service's values</text>
  <text x="620" y="262" font-size="15.5" text-anchor="middle" fill="#94A3B8">and answers at run time</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M 870,138 L 870,198 A 140,16 0 0 0 1150,198 L 1150,138" fill="#E2E8F0"/>
    <ellipse cx="1010" cy="138" rx="140" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="1010" y="188" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Version Store</text>
  <text x="1010" y="239" font-size="15.5" text-anchor="middle" fill="#6B7280">a file per service and</text>
  <text x="1010" y="262" font-size="15.5" text-anchor="middle" fill="#94A3B8">per environment, with history</text>
  <g filter="url(#cf3-soft)">
    <rect x="72" y="428" width="330" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="428" width="6" height="90" fill="#64748B" clip-path="url(#cf3-k3)"/>
  </g>
  <circle cx="110" cy="473" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,462.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="136" y="480" font-size="18.5" font-weight="600" fill="#111827">By Environment</text>
  <text x="237" y="543" font-size="15.5" text-anchor="middle" fill="#6B7280">development, staging and</text>
  <text x="237" y="566" font-size="15.5" text-anchor="middle" fill="#94A3B8">production each get their own</text>
  <g filter="url(#cf3-soft)">
    <rect x="455" y="428" width="330" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="455" y="428" width="6" height="90" fill="#64748B" clip-path="url(#cf3-k4)"/>
  </g>
  <circle cx="493" cy="473" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,462.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="519" y="480" font-size="18.5" font-weight="600" fill="#111827">By Service</text>
  <text x="620" y="543" font-size="15.5" text-anchor="middle" fill="#6B7280">the order service reads only</text>
  <text x="620" y="566" font-size="15.5" text-anchor="middle" fill="#94A3B8">the keys that belong to it</text>
  <g filter="url(#cf3-soft)">
    <rect x="838" y="428" width="330" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="838" y="428" width="6" height="90" fill="#64748B" clip-path="url(#cf3-k5)"/>
  </g>
  <circle cx="876" cy="473" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,462.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="902" y="480" font-size="18.5" font-weight="600" fill="#111827">By Instance</text>
  <text x="1003" y="543" font-size="15.5" text-anchor="middle" fill="#6B7280">one machine can be given a</text>
  <text x="1003" y="566" font-size="15.5" text-anchor="middle" fill="#94A3B8">value its peers do not have</text>
  <rect x="40" y="642" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="666" width="200" height="32" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="164" y="688" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">At startup</text>
  <text x="288" y="688" font-size="15.5" fill="#475569">the service fetches its values before it serves any traffic, so a missing key fails immediately</text>
  <rect x="64" y="710" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="732" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Behind the server</text>
  <text x="288" y="732" font-size="15.5" fill="#475569">a version controlled store, so every change has an author, a review and a way back</text>
</svg>