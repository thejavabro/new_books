  <text x="1116" y="845" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Database</text>
  <text x="64" y="180" font-size="18.5" fill="#475569">A sudden surge of buyers competing for a small,</text>
  <text x="64" y="206" font-size="18.5" fill="#475569">fixed set of items.</text>
  <text x="64" y="340" font-size="18.5" fill="#475569">Bids arrive in bursts, and each is compared</text>
  <text x="64" y="366" font-size="18.5" fill="#475569">against the current highest bid.</text>
  <text x="64" y="500" font-size="18.5" fill="#475569">Order books and risk calculations are held</text>
  <text x="64" y="526" font-size="18.5" fill="#475569">in memory for speed.</text>
  <text x="64" y="660" font-size="18.5" fill="#475569">Many concurrent state updates, with session</text>
  <text x="64" y="686" font-size="18.5" fill="#475569">and score data served from memory.</text>
  <text x="64" y="820" font-size="18.5" fill="#475569">Call routing and session state handled at very</text>
  <text x="64" y="846" font-size="18.5" fill="#475569">high rates with minimal latency.</text>




</svg>