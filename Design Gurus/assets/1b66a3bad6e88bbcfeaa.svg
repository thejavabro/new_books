  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Where space-based architecture is used</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Used where load is extremely spiky, writes are contended, and speed matters more than immediate global consistency.</text>

  <rect x="40" y="118" width="1160" height="140" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="148" font-size="19.5" font-weight="600" fill="#475569">1. Online ticketing and flash sales</text>
