<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Runtime trace of PlaceOrder.place. Step 1 checks the lines, the opening hours and the price, and writes nothing; an invalid order, a closed restaurant or an order below the minimum returns 400 or 422 with nothing written. Transaction 1, step 2, reserves the portions and saves the order with status new; a sold-out dish rolls back the transaction and returns 422. Step 3 charges the card outside any transaction. If the card is declined, transaction 2 releases the portions and marks the order payment_failed, and the route returns 402. If the charge succeeds, transaction 3, step 4, records the payment, marks the order paid, requests a courier and notifies the restaurant, and the route returns 201 with the order id and total.">
  <defs>
    <filter id="md05d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md05d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md05d-k1"><rect x="60" y="130" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="md05d-k2"><rect x="748" y="130" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="md05d-k3"><rect x="60" y="310" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="md05d-k4"><rect x="748" y="310" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="md05d-k5"><rect x="60" y="480" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="md05d-k6"><rect x="748" y="500" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="md05d-k7"><rect x="60" y="690" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="md05d-k8"><rect x="748" y="690" width="440" height="90" rx="12"/></clipPath>
    <marker id="md05d-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="md05d-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="md05d-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Runtime trace: placing an order after the refactor</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three short transactions, with the card charged outside all of them.</text>

  <rect x="40" y="250" width="600" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="64" y="280" font-size="19.5" font-weight="600" fill="#475569">Transaction 1</text>
  <rect x="724" y="440" width="488" height="170" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="748" y="470" font-size="19.5" font-weight="600" fill="#BE185D">Transaction 2</text>
  <rect x="40" y="630" width="600" height="170" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="64" y="660" font-size="19.5" font-weight="600" fill="#047857">Transaction 3</text>

  <g fill="none" stroke-width="2">
    <path d="M340,220 V310" stroke="#2563EB" marker-end="url(#md05d-m-blue)"/>
    <path d="M340,400 V480" stroke="#2563EB" marker-end="url(#md05d-m-blue)"/>
    <path d="M340,570 V690" stroke="#059669" marker-end="url(#md05d-m-emerald)"/>
    <path d="M620,175 H748" stroke="#DB2777" marker-end="url(#md05d-m-pink)"/>
    <path d="M620,355 H748" stroke="#DB2777" marker-end="url(#md05d-m-pink)"/>
    <path d="M620,545 H748" stroke="#DB2777" marker-end="url(#md05d-m-pink)"/>
    <path d="M620,735 H748" stroke="#059669" marker-end="url(#md05d-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="352" y="615" fill="#047857" text-anchor="start">charged</text>
    <text x="668" y="533" fill="#BE185D">declined</text>
  </g>

  <g filter="url(#md05d-soft)">
    <rect x="60" y="130" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#md05d-k1)"/>
  </g>
  <text x="80" y="170.25" font-size="19.5" font-weight="600" fill="#111827">1. Check lines, hours and price</text>
  <text x="80" y="193.75" font-size="19.5" font-weight="600" fill="#111827">(no writes)</text>
  <g filter="url(#md05d-soft)">
    <rect x="748" y="130" width="440" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="748" y="130" width="6" height="90" fill="#DB2777" clip-path="url(#md05d-k2)"/>
  </g>
  <text x="768" y="170.25" font-size="19.5" font-weight="600" fill="#111827">Invalid, closed or below minimum:</text>
  <text x="768" y="193.75" font-size="19.5" font-weight="600" fill="#111827">400 or 422, nothing written</text>
  <g filter="url(#md05d-soft)">
    <rect x="60" y="310" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#md05d-k3)"/>
  </g>
  <text x="80" y="350.25" font-size="19.5" font-weight="600" fill="#111827">2. Reserve portions, save the</text>
  <text x="80" y="373.75" font-size="19.5" font-weight="600" fill="#111827">order with status new</text>
  <g filter="url(#md05d-soft)">
    <rect x="748" y="310" width="440" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="748" y="310" width="6" height="90" fill="#DB2777" clip-path="url(#md05d-k4)"/>
  </g>
  <text x="768" y="350.25" font-size="19.5" font-weight="600" fill="#111827">Sold out: roll back,</text>
  <text x="768" y="373.75" font-size="19.5" font-weight="600" fill="#111827">422, nothing kept</text>
  <g filter="url(#md05d-soft)">
    <rect x="60" y="480" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="480" width="6" height="90" fill="#2563EB" clip-path="url(#md05d-k5)"/>
  </g>
  <text x="80" y="520.25" font-size="19.5" font-weight="600" fill="#111827">3. Charge the card</text>
  <text x="80" y="543.75" font-size="19.5" font-weight="600" fill="#111827">(outside any transaction)</text>
  <g filter="url(#md05d-soft)">
    <rect x="748" y="500" width="440" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="748" y="500" width="6" height="90" fill="#DB2777" clip-path="url(#md05d-k6)"/>
  </g>
  <text x="768" y="540.25" font-size="19.5" font-weight="600" fill="#111827">Release portions, mark</text>
  <text x="768" y="563.75" font-size="19.5" font-weight="600" fill="#111827">payment_failed, 402</text>
  <g filter="url(#md05d-lift)">
    <rect x="60" y="690" width="560" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="60" y="690" width="9" height="90" fill="#059669" clip-path="url(#md05d-k7)"/>
  </g>
  <text x="80" y="730.25" font-size="19.5" font-weight="600" fill="#111827">4. Record payment, mark paid,</text>
  <text x="80" y="753.75" font-size="19.5" font-weight="600" fill="#111827">request courier, notify</text>
  <g filter="url(#md05d-soft)">
    <rect x="748" y="690" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="748" y="690" width="6" height="90" fill="#059669" clip-path="url(#md05d-k8)"/>
  </g>
  <text x="768" y="730.25" font-size="19.5" font-weight="600" fill="#111827">201 with the order id</text>
  <text x="768" y="753.75" font-size="19.5" font-weight="600" fill="#111827">and the total</text>




</svg>