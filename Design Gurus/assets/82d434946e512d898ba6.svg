<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A service mesh control plane holding service discovery, traffic policies and configuration pushes to the sidecar proxy in each of three pods. In each pod, service A, B or C talks to its own sidecar proxy in both directions, and the sidecars of neighboring pods talk to each other directly over mutual TLS">
