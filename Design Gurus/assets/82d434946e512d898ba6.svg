  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Sidecar broker architecture in a service mesh</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The control plane configures a sidecar proxy in every pod, and the sidecars talk to each other over mutual TLS.</text>

