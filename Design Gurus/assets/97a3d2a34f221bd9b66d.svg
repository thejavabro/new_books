<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A request reaches the PoP. On a cache hit, the PoP has a copy and returns it, and the origin never sees the request. On a cache miss, the PoP fetches the content from the origin, stores a copy, and returns it, so the next user gets a hit.">
  <defs>
    <filter id="cvd2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cvd2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cvd2-k1"><rect x="40" y="290" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="cvd2-k2"><rect x="470" y="140" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cvd2-k3"><rect x="470" y="440" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cvd2-k4"><rect x="900" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cvd2-k5"><rect x="900" y="440" width="300" height="90" rx="12"/></clipPath>
    <marker id="cvd2-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cvd2-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cvd2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">What a PoP does with each request</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The first request in a region fills the cache. Later requests are served locally.</text>



  <g fill="none" stroke-width="2">
    <path d="M320,315 H400 Q415,315 415,300 V200 Q415,185 430,185 H470" stroke="#059669" marker-end="url(#cvd2-m-emerald)"/>
    <path d="M320,355 H400 Q415,355 415,370 V470 Q415,485 430,485 H470" stroke="#D97706" marker-end="url(#cvd2-m-amber)"/>
    <path d="M800,185 H900" stroke="#059669" marker-end="url(#cvd2-m-emerald)"/>
    <path d="M800,485 H900" stroke="#2563EB" marker-end="url(#cvd2-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#cvd2-soft)">
    <rect x="40" y="290" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#cvd2-k1)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">Request at PoP</text>
  <g filter="url(#cvd2-lift)">
    <rect x="470" y="140" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="470" y="140" width="9" height="90" fill="#059669" clip-path="url(#cvd2-k2)"/>
  </g>
  <circle cx="508" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="534" y="192" font-size="21.5" font-weight="600" fill="#111827">Cache hit</text>
  <text x="635" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">a copy is stored here</text>
  <g filter="url(#cvd2-soft)">
    <rect x="470" y="440" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="470" y="440" width="6" height="90" fill="#D97706" clip-path="url(#cvd2-k3)"/>
  </g>
  <circle cx="508" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,474.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="534" y="492" font-size="21.5" font-weight="600" fill="#111827">Cache miss</text>
  <text x="635" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">no copy yet</text>
  <g filter="url(#cvd2-soft)">
    <rect x="900" y="140" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="900" y="140" width="6" height="90" fill="#059669" clip-path="url(#cvd2-k4)"/>
  </g>
  <circle cx="938" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="964" y="192" font-size="21.5" font-weight="600" fill="#111827">Return the copy</text>
  <text x="1050" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">origin never sees it</text>
  <g filter="url(#cvd2-soft)">
    <rect x="900" y="440" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#cvd2-k5)"/>
  </g>
  <circle cx="938" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="964" y="492" font-size="21.5" font-weight="600" fill="#111827">Fetch and store</text>
  <text x="1050" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">next user gets a hit</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Hit ratio</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">at 95 percent, only 1 request in 20 reaches the origin</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Pull CDN</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">fills each PoP on the first request for an item in that region</text>
</svg>