<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1050" viewBox="0 0 1240 1050" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four gRPC call shapes: unary, server streaming, client streaming, and bidirectional streaming. Each row shows the message pattern, when to use it, and what it costs.">
  <defs>
    <filter id="p8-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p8-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <marker id="p8-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>

    <clipPath id="p8-k1"><rect x="76" y="162" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p8-k2"><rect x="76" y="358" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p8-k3"><rect x="76" y="554" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p8-k4"><rect x="76" y="750" width="360" height="90" rx="12"/></clipPath>

    <clipPath id="p8-p1"><rect x="640" y="183" width="300" height="48" rx="10"/></clipPath>
    <clipPath id="p8-p2"><rect x="640" y="379" width="300" height="48" rx="10"/></clipPath>
    <clipPath id="p8-p3"><rect x="640" y="575" width="300" height="48" rx="10"/></clipPath>
    <clipPath id="p8-p4"><rect x="640" y="771" width="300" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1050" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Four call shapes. Choose from the job, not from novelty.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700,71 L704.5,75.5 L712,65.5"/>
  </g>
  <text x="723" y="77" font-size="15.5" fill="#6B7280">use it when</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round">
    <path d="M886,65 V78 M879.5,71.5 H892.5"/>
  </g>
  <text x="903" y="77" font-size="15.5" fill="#6B7280">what it costs</text>

  
  <text x="76" y="132" font-size="16.5" font-weight="600" fill="#475569">Shape</text>
  <text x="640" y="132" font-size="16.5" font-weight="600" fill="#475569">Pattern</text>

  
  <rect x="40" y="142" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke-width="2.5">
    <path d="M436,207 H640" stroke="#2563EB" marker-end="url(#p8-bl)"/>
  </g>
  <g filter="url(#p8-lift)">
    <rect x="76" y="162" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="162" width="9" height="90" fill="#2563EB" clip-path="url(#p8-k1)"/>
  </g>
  <circle cx="114" cy="207" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,196.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="214" font-size="18.5" font-weight="600" fill="#111827">Unary</text>
  <g filter="url(#p8-soft)">
    <rect x="640" y="183" width="300" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="640" y="183" width="6" height="48" fill="#64748B" clip-path="url(#p8-p1)"/>
  </g>
  <circle cx="674" cy="207" r="4.5" fill="#64748B"/>
  <text x="698" y="214" font-size="18.5" font-weight="600" fill="#111827">one -&gt; one</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,272 L82.5,276.5 L90,266.5"/>
  </g>
  <text x="104" y="278" font-size="15.5" fill="#6B7280">One bounded input makes one bounded output. The default.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round">
    <path d="M84,292 V305 M77.5,298.5 H90.5"/>
  </g>
  <text x="104" y="304" font-size="15.5" fill="#6B7280">Nothing beyond an ordinary call.</text>

  
  <rect x="40" y="338" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke-width="2">
    <path d="M436,403 H640" stroke="#2563EB" marker-end="url(#p8-bl)"/>
  </g>
  <g filter="url(#p8-soft)">
    <rect x="76" y="358" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="358" width="6" height="90" fill="#2563EB" clip-path="url(#p8-k2)"/>
  </g>
  <circle cx="114" cy="403" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,392.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="140" y="410" font-size="18.5" font-weight="600" fill="#111827">Server streaming</text>
  <g filter="url(#p8-soft)">
    <rect x="640" y="379" width="300" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="640" y="379" width="6" height="48" fill="#64748B" clip-path="url(#p8-p2)"/>
  </g>
  <circle cx="674" cy="403" r="4.5" fill="#64748B"/>
  <text x="698" y="410" font-size="18.5" font-weight="600" fill="#111827">one -&gt; many</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,468 L82.5,472.5 L90,462.5"/>
  </g>
  <text x="104" y="474" font-size="15.5" fill="#6B7280">The caller subscribes and only the server keeps sending.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round">
    <path d="M84,488 V501 M77.5,494.5 H90.5"/>
  </g>
  <text x="104" y="500" font-size="15.5" fill="#6B7280">Identity, order, resume, and end rules.</text>

  
  <rect x="40" y="534" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke-width="2">
    <path d="M436,599 H640" stroke="#2563EB" marker-end="url(#p8-bl)"/>
  </g>
  <g filter="url(#p8-soft)">
    <rect x="76" y="554" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="554" width="6" height="90" fill="#2563EB" clip-path="url(#p8-k3)"/>
  </g>
  <circle cx="114" cy="599" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,588.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="606" font-size="18.5" font-weight="600" fill="#111827">Client streaming</text>
  <g filter="url(#p8-soft)">
    <rect x="640" y="575" width="300" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="640" y="575" width="6" height="48" fill="#64748B" clip-path="url(#p8-p3)"/>
  </g>
  <circle cx="674" cy="599" r="4.5" fill="#64748B"/>
  <text x="698" y="606" font-size="18.5" font-weight="600" fill="#111827">many -&gt; one</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,664 L82.5,668.5 L90,658.5"/>
  </g>
  <text x="104" y="670" font-size="15.5" fill="#6B7280">A caller produces many pieces and one acknowledgement is enough.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round">
    <path d="M84,684 V697 M77.5,690.5 H90.5"/>
  </g>
  <text x="104" y="696" font-size="15.5" fill="#6B7280">Limits on count, bytes, and duration.</text>

  
  <rect x="40" y="730" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke-width="2">
    <path d="M436,795 H640" stroke="#2563EB" marker-end="url(#p8-bl)"/>
  </g>
  <g filter="url(#p8-soft)">
    <rect x="76" y="750" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="750" width="6" height="90" fill="#2563EB" clip-path="url(#p8-k4)"/>
  </g>
  <circle cx="114" cy="795" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,784.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8h18"/>
    <path d="M16.5 3.5L21 8l-4.5 4.5"/>
    <path d="M21 16H3"/>
    <path d="M7.5 11.5L3 16l4.5 4.5"/>
  </g>
  <text x="140" y="802" font-size="18.5" font-weight="600" fill="#111827">Bidirectional streaming</text>
  <g filter="url(#p8-soft)">
    <rect x="640" y="771" width="300" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="640" y="771" width="6" height="48" fill="#64748B" clip-path="url(#p8-p4)"/>
  </g>
  <circle cx="674" cy="795" r="4.5" fill="#64748B"/>
  <text x="698" y="802" font-size="18.5" font-weight="600" fill="#111827">many &lt;-&gt; many</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,860 L82.5,864.5 L90,854.5"/>
  </g>
  <text x="104" y="866" font-size="15.5" fill="#6B7280">Both directions are frequent and cannot be split cleanly.</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round">
    <path d="M84,880 V893 M77.5,886.5 H90.5"/>
  </g>
  <text x="104" y="892" font-size="15.5" fill="#6B7280">Two vocabularies, replay, flow control.</text>

  
  <rect x="40" y="934" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="979" text-anchor="middle" font-size="16" fill="#475569">The word stream answers none of these. "Real time" does not require the bidirectional shape.</text>
</svg>