<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Breaker states during the Payments outage. It starts closed with payment calls flowing under a 1 second timeout, opens at 2:00:05 when the failure rate crosses the threshold so calls fail in about 1 ms, half-opens about every 30 seconds to send a few probe calls, re-opens while the probes fail, and closes again at 2:14:00 when Payments answers.">
  <defs>
    <marker id="m04-l08-recovery-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l08-recovery-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l08-recovery-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m04-l08-recovery-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="870" fill="#FFFFFF"/>

  <rect x="30" y="110" width="1180" height="590" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="50" y="150" font-size="20" font-weight="600" fill="#334155">Breaker on Checkout's Payments client</text>
  <text x="1190" y="150" text-anchor="end" font-size="20" fill="#64748B">on the clock of the 2:00 PM outage</text>

  <g fill="none">
    <path d="M70,385 L82,385" stroke="#475569" stroke-width="2" marker-end="url(#m04-l08-recovery-states-sl)"/>
    <path d="M420,385 L447,385" stroke="#DC2626" stroke-width="2.5" marker-end="url(#m04-l08-recovery-states-rd)"/>
    <path d="M785,368 L812,368" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m04-l08-recovery-states-sl)"/>
    <path d="M812,402 L793,402" stroke="#DC2626" stroke-width="2" marker-end="url(#m04-l08-recovery-states-rd)"/>
    <path d="M985,322 V230 Q985,210 965,210 H275 Q255,210 255,230 V318" stroke="#059669" stroke-width="2.5" marker-end="url(#m04-l08-recovery-states-em)"/>
  </g>

  <text x="620" y="196" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">probe calls succeed: the breaker closes at 2:14:00</text>
  <text x="434" y="262" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">failure rate crosses</text>
  <text x="434" y="288" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the threshold (2:00:05)</text>
  <text x="800" y="262" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">about 30 seconds pass</text>
  <text x="800" y="288" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">(first probe at 2:00:35)</text>
  <text x="800" y="480" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the probes still fail</text>

  <circle cx="58" cy="385" r="12" fill="#475569"/>

  <g stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="255" y1="440" x2="255" y2="520"/>
    <line x1="620" y1="440" x2="620" y2="520"/>
    <line x1="985" y1="440" x2="985" y2="520"/>
  </g>

  <g filter="url(#m04-l08-recovery-states-soft)">
    <rect x="90" y="330" width="330" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="255" y="376" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Closed</text>
  <text x="255" y="408" text-anchor="middle" font-size="20" fill="#64748B">payment calls flow</text>
  <g filter="url(#m04-l08-recovery-states-soft)">
    <rect x="455" y="330" width="330" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="620" y="376" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Open</text>
  <text x="620" y="408" text-anchor="middle" font-size="20" fill="#64748B">tripped: calls fail fast</text>
  <g filter="url(#m04-l08-recovery-states-soft)">
    <rect x="820" y="330" width="330" height="110" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="985" y="376" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Half-open</text>
  <text x="985" y="408" text-anchor="middle" font-size="20" fill="#64748B">probing: a trickle allowed</text>

  <g filter="url(#m04-l08-recovery-states-soft)">
    <rect x="90" y="520" width="330" height="150" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  </g>
  <text x="255" y="570" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2:00:00 to 2:00:05</text>
  <text x="255" y="602" text-anchor="middle" font-size="20" fill="#1E40AF">calls still go out</text>
  <text x="255" y="634" text-anchor="middle" font-size="20" fill="#1E40AF">1 s timeout, one retry</text>
  <g filter="url(#m04-l08-recovery-states-soft)">
    <rect x="455" y="520" width="330" height="150" rx="10" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
  </g>
  <text x="620" y="570" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2:00:05 onward</text>
  <text x="620" y="602" text-anchor="middle" font-size="20" fill="#B91C1C">every call fails in 1 ms</text>
  <text x="620" y="634" text-anchor="middle" font-size="20" fill="#B91C1C">the fallback answers</text>
  <g filter="url(#m04-l08-recovery-states-soft)">
    <rect x="820" y="520" width="330" height="150" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="985" y="570" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2:00:35, then every 30 s</text>
  <text x="985" y="602" text-anchor="middle" font-size="20" fill="#475569">a few probe calls</text>
  <text x="985" y="634" text-anchor="middle" font-size="20" fill="#475569">the cost is a few calls</text>

  <line x1="60" y1="750" x2="96" y2="750" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="757" font-size="20" fill="#475569">Failure transition: the breaker trips or re-opens</text>
  <line x1="60" y1="790" x2="96" y2="790" stroke="#059669" stroke-width="4"/>
  <text x="108" y="797" font-size="20" fill="#475569">Recovery transition: the probes pass, so calls flow again</text>
  <line x1="60" y1="830" x2="96" y2="830" stroke="#475569" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="837" font-size="20" fill="#475569">Timer driven: the cooldown, with no call involved</text>
</svg>