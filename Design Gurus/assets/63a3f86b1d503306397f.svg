<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1076" viewBox="0 0 1240 1076" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Start from a measured prompt baseline, then let the kind of failure choose the tool">
  <defs>
    <marker id="adp2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="adp2-mindigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="adp2-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="adp2-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="adp2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="adp2-k1"><rect x="505" y="56" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="adp2-k2"><rect x="508" y="211" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="adp2-k3"><rect x="130" y="440" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="adp2-k4"><rect x="512" y="440" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="adp2-k5"><rect x="512" y="605" width="216" height="90" rx="12"/></clipPath>
    <clipPath id="adp2-k6"><rect x="875" y="605" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="adp2-k7"><rect x="875" y="770" width="290" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="1076" fill="#FFFFFF"/>
  <rect x="40" y="380" width="360" height="540" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="16.5" font-weight="600" fill="#1D4ED8">Knowledge branch</text>
  <rect x="440" y="380" width="360" height="540" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="464" y="410" font-size="16.5" font-weight="600" fill="#6D28D9">Behavior branch</text>
  <rect x="840" y="380" width="360" height="540" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="864" y="410" font-size="16.5" font-weight="600" fill="#B45309">Cost branch</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M620,183 V211" marker-end="url(#adp2-mslate)"/></g>
  <g fill="none" stroke="#4F46E5" stroke-width="2"><path d="M508,256 H242 Q230,256 230,268 V440" marker-end="url(#adp2-mindigo)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M620,338 V440" marker-end="url(#adp2-mviolet)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M732,256 H1008 Q1020,256 1020,268 V605" marker-end="url(#adp2-mamber)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M620,567 V605" marker-end="url(#adp2-mviolet)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1020,732 V770" marker-end="url(#adp2-mslate)"/></g>
  <g filter="url(#adp2-soft)">
    <rect x="505" y="56" width="230" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="505" y="56" width="6" height="90" fill="#64748B" clip-path="url(#adp2-k1)"/>
  </g>
  <circle cx="543" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(532.56,90.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="569" y="108" font-size="18.5" font-weight="600" fill="#111827">Prompt baseline</text>
  <text x="620" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">a prompt and few-shot examples, scored on the evaluation set</text>
  <g filter="url(#adp2-soft)">
    <rect x="508" y="211" width="224" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="508" y="211" width="6" height="90" fill="#64748B" clip-path="url(#adp2-k2)"/>
  </g>
  <circle cx="546" cy="256" r="18" fill="#FFFFFF"/>
  <g transform="translate(535.56,245.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="572" y="263" font-size="18.5" font-weight="600" fill="#111827">What is failing?</text>
  <text x="620" y="326" font-size="15.5" text-anchor="middle" fill="#6B7280">sort each failure by kind</text>
  <g filter="url(#adp2-soft)">
    <rect x="130" y="440" width="200" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="130" y="440" width="6" height="90" fill="#4F46E5" clip-path="url(#adp2-k3)"/>
  </g>
  <circle cx="168" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,474.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="194" y="492" font-size="18.5" font-weight="600" fill="#111827">RAG</text>
  <text x="230" y="555" font-size="15.5" text-anchor="middle" fill="#6B7280">facts at request time</text>
  <g filter="url(#adp2-soft)">
    <rect x="512" y="440" width="216" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="512" y="440" width="6" height="90" fill="#7C3AED" clip-path="url(#adp2-k4)"/>
  </g>
  <circle cx="550" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(539.56,474.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="576" y="492" font-size="18.5" font-weight="600" fill="#111827">Better prompt</text>
  <text x="620" y="555" font-size="15.5" text-anchor="middle" fill="#6B7280">try this first</text>
  <g filter="url(#adp2-soft)">
    <rect x="512" y="605" width="216" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="512" y="605" width="6" height="90" fill="#D97706" clip-path="url(#adp2-k5)"/>
  </g>
  <circle cx="550" cy="650" r="18" fill="#FFFFFF"/>
  <g transform="translate(539.56,639.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="576" y="657" font-size="18.5" font-weight="600" fill="#111827">Fine-tune</text>
  <text x="620" y="720" font-size="15.5" text-anchor="middle" fill="#6B7280">usually a LoRA adapter</text>
  <g filter="url(#adp2-soft)">
    <rect x="875" y="605" width="290" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="875" y="605" width="6" height="90" fill="#2563EB" clip-path="url(#adp2-k6)"/>
  </g>
  <circle cx="913" cy="650" r="18" fill="#FFFFFF"/>
  <g transform="translate(902.56,639.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="939" y="657" font-size="18.5" font-weight="600" fill="#111827">Router</text>
  <text x="1020" y="720" font-size="15.5" text-anchor="middle" fill="#6B7280">sends the rest to the large model</text>
  <g filter="url(#adp2-soft)">
    <rect x="875" y="770" width="290" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="875" y="770" width="6" height="90" fill="#D97706" clip-path="url(#adp2-k7)"/>
  </g>
  <circle cx="913" cy="815" r="18" fill="#FFFFFF"/>
  <g transform="translate(902.56,804.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="939" y="822" font-size="18.5" font-weight="600" fill="#111827">Fine-tuned small model</text>
  <text x="1020" y="885" font-size="15.5" text-anchor="middle" fill="#6B7280">does one narrow task</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="375" y="242" fill="#4338CA">missing facts</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="632" y="362" fill="#5B21B6">wrong behavior</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="877" y="242" fill="#B45309">right, but too slow or costly at volume</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="632" y="591" fill="#5B21B6">stops improving</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1032" y="756" fill="#B45309">routine traffic</text></g>
  <rect x="40" y="960" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1005" text-anchor="middle" font-size="16" fill="#475569">Two of the three branches lead toward fine-tuning: the behavior branch and the cost branch. The knowledge branch never does.</text>
</svg>