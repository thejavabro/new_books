<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With a branch per invoice type a fourth type means editing Invoice, while delegating to an InvoiceGenerator interface means a fourth type is a new class and Invoice is untouched">
  <defs>
    <filter id="ocp-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ocp-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="ocp-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="ocp-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ocp-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <clipPath id="ocp-c1"><rect x="150" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ocp-c2"><rect x="150" y="420" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ocp-c3"><rect x="750" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ocp-c4"><rect x="750" y="250" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ocp-c5"><rect x="770" y="420" width="260" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="510" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#B45309">A branch per type: the next case edits this file</text>

  <g fill="none" stroke-width="2.5">
    <path d="M420,420 V206" stroke="#DB2777" marker-end="url(#ocp-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="502" y="320" fill="#BE185D">must edit Invoice</text>
  </g>

  <g filter="url(#ocp-lift)">
    <rect x="150" y="110" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="150" y="110" width="9" height="90" fill="#D97706" clip-path="url(#ocp-c1)"/>
  </g>
  <circle cx="190" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(179.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="216" y="162" font-size="18.5" font-weight="600" fill="#111827">Invoice</text>
  <text x="300" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">a branch per invoice type</text>

  <g filter="url(#ocp-soft)">
    <rect x="150" y="420" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="150" y="420" width="6" height="90" fill="#DB2777" clip-path="url(#ocp-c2)"/>
  </g>
  <circle cx="188" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,454.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="214" y="472" font-size="18.5" font-weight="600" fill="#111827">A fourth format</text>

  
  <rect x="640" y="40" width="560" height="510" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#047857">One class per format: the next case adds a file</text>

  <g fill="none" stroke-width="2">
    <path d="M900,200 V244" stroke="#2563EB" marker-end="url(#ocp-bl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M800,420 V346" stroke="#059669" marker-end="url(#ocp-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="985" y="228" fill="#1D4ED8">delegates to</text>
    <text x="712" y="385" fill="#047857">a new class</text>
  </g>

  <g filter="url(#ocp-soft)">
    <rect x="750" y="110" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="750" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#ocp-c3)"/>
  </g>
  <circle cx="788" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="814" y="162" font-size="18.5" font-weight="600" fill="#111827">Invoice</text>

  <g filter="url(#ocp-lift)">
    <rect x="750" y="250" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="750" y="250" width="9" height="90" fill="#059669" clip-path="url(#ocp-c4)"/>
  </g>
  <circle cx="790" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(779.56,284.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="816" y="302" font-size="18.5" font-weight="600" fill="#111827">InvoiceGenerator</text>
  <text x="900" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">one class per format</text>

  <g filter="url(#ocp-soft)">
    <rect x="770" y="420" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="770" y="420" width="6" height="90" fill="#059669" clip-path="url(#ocp-c5)"/>
  </g>
  <circle cx="808" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,454.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="834" y="472" font-size="18.5" font-weight="600" fill="#111827">A fourth format</text>

  
  <rect x="40" y="580" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="604" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="626" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Open the file</text>
  <text x="288" y="626" font-size="15.5" fill="#475569">every new type means another branch inside a method that already works and is tested</text>
  <rect x="64" y="648" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="670" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Add a file</text>
  <text x="288" y="670" font-size="15.5" fill="#475569">the new format implements the interface, and no existing class is opened at all</text>
</svg>