<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="YouTube likes counter high level design: a client calls the API gateway, which routes to a stateless like and dislike service, which writes each user action to a NoSQL store and reads totals from a separate counts store">
  <defs>
    <filter id="ytc1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytc1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytc1-k1"><rect x="40" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="ytc1-k2"><rect x="400" y="150" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="ytc1-k3"><rect x="780" y="150" width="340" height="90" rx="12"/></clipPath>
    <marker id="ytc1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ytc1-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ytc1-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">YouTube likes counter: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One service, two stores. The write records who reacted, the read answers with a total that nobody wants to compute on demand.</text>



  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#ytc1-m-blue)"/>
    <path d="M680,195 H772" stroke="#2563EB" marker-end="url(#ytc1-m-blue)"/>
    <path d="M880,312 V342 Q880,354 868,354 H512 Q500,354 500,366 V414" stroke="#059669" marker-end="url(#ytc1-m-emerald)"/>
    <path d="M950,312 V414" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#ytc1-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="336" y="183" fill="#1D4ED8">likes</text>
    <text x="726" y="183" fill="#1D4ED8">routes</text>
    <text x="690" y="336" fill="#047857">write the action</text>
    <text x="1060" y="370" fill="#4338CA">read the total</text>
  </g>

  <g filter="url(#ytc1-soft)">
    <rect x="40" y="150" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#ytc1-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web and mobile</text>
  <g filter="url(#ytc1-soft)">
    <rect x="400" y="150" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="400" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#ytc1-k2)"/>
  </g>
  <circle cx="438" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="464" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="540" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">auth and rate limits</text>
  <g filter="url(#ytc1-lift)">
    <rect x="780" y="150" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="780" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#ytc1-k3)"/>
  </g>
  <circle cx="818" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6-6 6 6"/><path d="M6 14l6 6 6-6"/></g>
  <text x="844" y="202" font-size="21.5" font-weight="600" fill="#111827">Like/Dislike Service</text>
  <text x="950" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">stateless, scales out</text>
  <text x="950" y="296" font-size="18.5" text-anchor="middle" fill="#94A3B8">one write path, one read path</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M350,420 L350,504 A150,16 0 0 0 650,504 L650,420" fill="#D1FAE5"/>
    <ellipse cx="500" cy="420" rx="150" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="500" y="477" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">User actions</text>
  <text x="500" y="554" font-size="18.5" text-anchor="middle" fill="#6B7280">NoSQL, upsert per user</text>
  <text x="500" y="581" font-size="18.5" text-anchor="middle" fill="#94A3B8">stops a second like</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M800,420 L800,504 A150,16 0 0 0 1100,504 L1100,420" fill="#E0E7FF"/>
    <ellipse cx="950" cy="420" rx="150" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="950" y="477" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Counts</text>
  <text x="950" y="554" font-size="18.5" text-anchor="middle" fill="#6B7280">one row per content id</text>
  <text x="950" y="581" font-size="18.5" text-anchor="middle" fill="#94A3B8">total likes and dislikes</text>

  <rect x="40" y="650" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Two shapes of data</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">one row per user per item for correctness, one row per item for speed</text>
  <rect x="64" y="725" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="750" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Write is an upsert</text>
  <text x="323" y="750" font-size="18.5" fill="#475569">the record itself is what stops the same user liking a video twice</text>
  <rect x="64" y="775" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="800" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Read never counts</text>
  <text x="323" y="800" font-size="18.5" fill="#475569">nobody scans the action table to answer a view, the total is already stored</text>
</svg>