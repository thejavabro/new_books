<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Snowflake 64 bit ID layout: one unused sign bit, 41 bits of millisecond timestamp giving about 69.7 years, five bits of region and five of machine giving 1024 nodes, and 12 bits of sequence giving 4096 IDs per millisecond">
  <defs>
    <filter id="uidbits-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A Snowflake ID, 64 bits laid out</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Time goes first, so the IDs sort by creation. The rest is what lets every node generate alone.</text>

  <text x="442" y="190" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">41 bits, timestamp</text>
  <text x="442" y="217" text-anchor="middle" font-size="18.5" fill="#6B7280">about 69.7 years of milliseconds</text>
  <text x="1074" y="190" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">12 bits, sequence</text>
  <text x="1074" y="217" text-anchor="middle" font-size="18.5" fill="#6B7280">4,096 IDs per millisecond per node</text>
  <path d="M90,250 V240 H795 V250" fill="none" stroke="#2563EB" stroke-width="2"/>
  <path d="M969,250 V240 H1180 V250" fill="none" stroke="#059669" stroke-width="2"/>

  <rect x="60" y="270" width="30" height="90" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="75" y="323" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">1</text>
  <rect x="90" y="270" width="705" height="90" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="442.5" y="323" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">41</text>
  <rect x="795" y="270" width="87" height="90" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="838.5" y="323" text-anchor="middle" font-size="21.5" font-weight="600" fill="#5B21B6">5</text>
  <rect x="882" y="270" width="87" height="90" rx="6" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="925.5" y="323" text-anchor="middle" font-size="21.5" font-weight="600" fill="#4338CA">5</text>
  <rect x="969" y="270" width="211" height="90" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="1074.5" y="323" text-anchor="middle" font-size="21.5" font-weight="600" fill="#047857">12</text>

  <path d="M795,380 V390 H969 V380" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="882" y="432" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10 bits, region and machine</text>
  <text x="882" y="459" text-anchor="middle" font-size="18.5" fill="#6B7280">32 regions x 32 machines = 1,024 nodes</text>
  <path d="M75,360 V400 H150" fill="none" stroke="#64748B" stroke-width="2"/>
  <text x="160" y="406" font-size="18.5" fill="#6B7280">1 bit, always zero, so the ID stays positive</text>

  <path d="M60,500 V510 H1180 V500" fill="none" stroke="#64748B" stroke-width="2"/>
  <text x="620" y="552" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">64 bits in total</text>

  <rect x="40" y="600" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Time sorted</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">the timestamp is the most significant part, so a later ID is always a larger number</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">No coordination</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">each node owns its region and machine number, so it never has to ask anyone for one</text>
  <rect x="64" y="725" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="750" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">The ceiling</text>
  <text x="323" y="750" font-size="18.5" fill="#475569">a node that burns all 4,096 in one millisecond waits for the clock to tick over</text>
</svg>