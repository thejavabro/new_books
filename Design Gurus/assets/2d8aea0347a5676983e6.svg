<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="806" viewBox="0 0 1240 806" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="routing-title routing-desc">
<title id="routing-title">Deciding what to send where</title>
<desc id="routing-desc">The largest cost reductions come from routing by difficulty and from sending less, and a surprising share of calls are doing work that is not a model problem at all.</desc>
<defs>
<marker id="routing-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="routing-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="routing-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="routing-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="806" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Deciding what to send where</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The largest cost reductions come from routing by difficulty and from sending less.</text>
<rect x="40" y="728" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="728" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="220" height="66" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="150" y="157" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">request</text>
<path d="M266 151H300" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M266 151H300" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routing-marker-slate)"/>
<rect x="308" y="118" width="360" height="66" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="488" y="143.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a cheap model first</text><text x="488" y="170.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">handles the majority</text>
<path d="M674 151H708" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M674 151H708" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routing-marker-slate)"/>
<rect x="716" y="118" width="484" height="66" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="958" y="143.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">escalate on a confidence signal,</text><text x="958" y="170.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a validation failure, a classifier</text>
<text x="620" y="210" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">sending everything to the largest model is the simplest and most expensive design</text>
<rect x="40" y="232" width="450" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="265" y="268" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ask what does not need the model</text>
<path d="M496 262H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 262H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routing-marker-slate)"/>
<rect x="540" y="232" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="255.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a lookup, a regular expression, a query or a small</text><text x="560" y="280.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">classifier does it better</text>
<rect x="40" y="304" width="450" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="265" y="340" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Shorten the input</text>
<path d="M496 334H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 334H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routing-marker-slate)"/>
<rect x="540" y="304" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="340" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">most prompts carry material somebody added and nobody removed</text>
<rect x="40" y="376" width="450" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="265" y="412" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cap the output</text>
<path d="M496 406H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 406H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routing-marker-slate)"/>
<rect x="540" y="376" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="412" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an unbounded maximum length is an unbounded cost and latency</text>
<rect x="40" y="448" width="450" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="265" y="484" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Stream the output</text>
<path d="M496 478H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 478H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routing-marker-slate)"/>
<rect x="540" y="448" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="484" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">time to first token is what the user feels as responsiveness</text>
<rect x="40" y="520" width="450" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="265" y="556" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Make the long ones asynchronous</text>
<path d="M496 550H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 550H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#routing-marker-slate)"/>
<rect x="540" y="520" width="660" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="543.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tens of seconds should be a job with a result,</text><text x="560" y="568.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a held connection</text>
<rect x="40" y="602" width="1160" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="602" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="632" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The self-hosting crossover is sustained utilization</text><text x="64" y="658" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">An API costs per token with no idle. Hardware costs the same whether or not it is busy,</text><text x="64" y="684" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and running a serving stack belongs in the comparison.</text>
<text x="66" y="762" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The question with the largest single saving is what does not need the model at all.</text>
</svg>