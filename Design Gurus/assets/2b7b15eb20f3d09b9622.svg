<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two grids of the 60 web worker threads, 6 servers with 10 threads each, one square per thread. On a normal evening, about 1,500 requests per second for menus, tracking and courier locations, at about 0.02 seconds each, keep 30 threads busy; Place Order, at 2 per second times 0.2 seconds, needs only 0.4 of a thread, so about 30 of 60 threads are busy and menu p99 is 180 ms. In a provider slow period, 5 order requests per second times 8 seconds need 40 threads, and other requests still need 30, 70 in all. Every one of the 60 threads is busy, 40 of them waiting on the provider, so menu requests wait in line with a p99 of 9 seconds.">
  <defs>
    <filter id="md01b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md01b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    
    
    
