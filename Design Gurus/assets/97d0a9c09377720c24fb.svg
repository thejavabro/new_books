<text x="770" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"b"</text>
<text x="770" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">1x</text>
<text x="275" y="326" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">result</text>
<rect x="297" y="288" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="345" y="325.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="407" y="288" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="455" y="325.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="517" y="288" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="565" y="325.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="627" y="288" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="675" y="325.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="737" y="288" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="785" y="325.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="847" y="288" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="895" y="325.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">?</text>
<rect x="40" y="416" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="456" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Take the most frequent character, write all of its copies, and repeat</text>
<text x="620" y="488" text-anchor="middle" font-size="18.5" fill="#475569">Characters with the same count may come out in either order, and both are correct</text>
</svg>