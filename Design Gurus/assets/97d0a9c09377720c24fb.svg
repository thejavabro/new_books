<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="546" viewBox="0 0 1240 546" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The characters and their counts">
<defs>
<filter id="cf-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="546" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Sort the characters of "banana" so the most frequent come first</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">"b" appears 1 time, "a" appears 3 times, "n" appears 2 times</text>
<rect x="40" y="106" width="1160" height="296" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Counts, already arranged with the most frequent first</text>
<text x="383" y="210" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">counts</text>
<rect x="405" y="172" width="130" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="470" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"a"</text>
<text x="470" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">3x</text>
<rect x="555" y="172" width="130" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">"n"</text>
<text x="620" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">2x</text>
