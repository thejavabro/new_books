<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1282" viewBox="0 0 1240 1282" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated Netflix architecture: ingestion pipeline, Open Connect push model, playback control plane and asynchronous watch history">
  <defs>
    <filter id="nf-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="nf-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="nf-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="nf-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="nf-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="nf-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1282" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Netflix: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Ingestion, proactive CDN push, playback control plane and watch history in one picture</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#92400E">1. Ingestion (asynchronous) · 2.25 PB of masters, about 50 renditions per title</text>
  <path d="M264,194 L349,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#nf-amber)"/>
  <text x="307" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">upload</text>
  <path d="M577,194 L662,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#nf-amber)"/>
  <text x="620" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">chunk</text>
  <path d="M890,194 L975,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#nf-amber)"/>
  <text x="933" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">store</text>
  <g filter="url(#nf-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="156" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Content ops</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">uploads master</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Orchestrator</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">Conductor</text>
  <text x="776" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Transcode fleet</text>
  <text x="776" y="216" font-size="20" fill="#64748B" text-anchor="middle">4 minute chunks</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3</text>
  <text x="1089" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">the golden copies</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. Proactive push · copied into ISP racks off peak, before anyone presses play</text>
  <path d="M364,436 L456,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#nf-amber)"/>
  <text x="410" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <path d="M784,436 L876,436" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#nf-blue)"/>
  <text x="830" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">stream</text>
  <g filter="url(#nf-soft)">
    <path d="M40,413 L40,459 A160,15 0 0 0 360,459 L360,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="200" cy="413" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="398" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3</text>
  <text x="200" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">origin of record</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Open Connect</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">inside the ISP</text>
  <text x="1040" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Viewer</text>
  <text x="1040" y="458" font-size="20" fill="#64748B" text-anchor="middle">120 Tbps at peak</text>

  <rect x="24" y="580" width="1192" height="360" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#1E40AF">3. Playback control plane · under 2 seconds to the first frame</text>
  <path d="M264,678 L349,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#nf-blue)"/>
  <text x="307" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">play</text>
  <path d="M577,678 L662,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#nf-blue)"/>
  <text x="620" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">steer</text>
  <path d="M890,678 L975,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#nf-blue)"/>
  <text x="933" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">licence</text>
  <path d="M463,716 L463,784" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#nf-emerald)"/>
  <text x="481" y="758" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">metadata</text>
  <g filter="url(#nf-soft)">
    <rect x="40" y="640" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="640" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="666" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M979,655 L979,701 A110,15 0 0 0 1199,701 L1199,655" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="655" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M353,803 L353,849 A110,15 0 0 0 573,849 L573,803" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="463" cy="803" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="150" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="700" font-size="20" fill="#64748B" text-anchor="middle">presses play</text>
  <text x="463" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Playback Service</text>
  <text x="463" y="700" font-size="20" fill="#64748B" text-anchor="middle">checks the plan</text>
  <text x="776" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Steering</text>
  <text x="776" y="700" font-size="20" fill="#64748B" text-anchor="middle">best OCA</text>
  <text x="1089" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DRM and KMS</text>
  <text x="1089" y="746" font-size="20" fill="#5B21B6" text-anchor="middle">one licence per play</text>
  <text x="463" y="837" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">EVCache</text>
  <text x="463" y="894" font-size="20" fill="#065F46" text-anchor="middle">titles and profiles</text>

  <rect x="24" y="970" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="1002" font-size="20" font-weight="600" fill="#92400E">4. Watch history (asynchronous) · a heartbeat every 10 seconds</text>
  <path d="M264,1068 L349,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#nf-amber)"/>
  <text x="307" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">beat</text>
  <path d="M577,1068 L662,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#nf-amber)"/>
  <text x="620" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>
  <path d="M890,1068 L975,1068" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#nf-amber)"/>
  <text x="933" y="1056" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">batch</text>
  <g filter="url(#nf-soft)">
    <rect x="40" y="1030" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M353,1045 L353,1091 A110,15 0 0 0 573,1091 L573,1045" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="1045" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="1030" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,1045 L979,1091 A110,15 0 0 0 1199,1091 L1199,1045" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="1045" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="1090" font-size="20" fill="#64748B" text-anchor="middle">every 10s</text>
  <text x="463" y="1079" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="463" y="1136" font-size="20" fill="#92400E" text-anchor="middle">absorbs the burst</text>
  <text x="776" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Flink</text>
  <text x="776" y="1090" font-size="20" fill="#64748B" text-anchor="middle">keeps the latest</text>
  <text x="1089" y="1079" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cassandra</text>
  <text x="1089" y="1136" font-size="20" fill="#5B21B6" text-anchor="middle">partitioned by user_id</text>
  <line x1="44" y1="1242" x2="72" y2="1242" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1249" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1242" x2="344.576" y2="1242" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1249" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1233" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1249" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1233" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1249" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1233" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1249" font-size="20" fill="#475569">core service</text>
</svg>