<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="598" viewBox="0 0 1240 598" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The path of one query through a DBMS, from the application through the query processor and storage manager to disk, with the catalog and transaction manager supporting them">
<defs>
<filter id="rdb05-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="rdb05-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="rdb05-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="rdb05-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="rdb05-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<clipPath id="rdb05-k1"><rect x="40" y="116" width="210" height="90" rx="12"/></clipPath>
<clipPath id="rdb05-k2"><rect x="310" y="116" width="280" height="90" rx="12"/></clipPath>
<clipPath id="rdb05-k3"><rect x="650" y="116" width="280" height="90" rx="12"/></clipPath>
<clipPath id="rdb05-k4"><rect x="310" y="290" width="280" height="90" rx="12"/></clipPath>
<clipPath id="rdb05-k5"><rect x="650" y="290" width="280" height="90" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="598" fill="#FFFFFF"/>

<rect x="290" y="64" width="660" height="396" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="314" y="94" font-size="16.5" font-weight="600" fill="#475569">Inside the DBMS</text>

<g fill="none" stroke-width="2">
<path d="M258,161 H302" stroke="#2563EB" marker-end="url(#rdb05-mblue)"/>
<path d="M598,161 H642" stroke="#2563EB" stroke-width="2.5" marker-end="url(#rdb05-mblue)"/>
<path d="M938,161 H982" stroke="#2563EB" marker-end="url(#rdb05-mblue)"/>
<path d="M450,290 V212" stroke="#7C3AED" marker-end="url(#rdb05-mviolet)"/>
<path d="M790,290 V212" stroke="#D97706" marker-end="url(#rdb05-mamber)"/>
</g>
<g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
<text x="536" y="255" fill="#5B21B6">reads definitions</text>
<text x="872" y="255" fill="#B45309">locks and log</text>
</g>

<g filter="url(#rdb05-soft)">
<rect x="40" y="116" width="210" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="40" y="116" width="6" height="90" fill="#64748B" clip-path="url(#rdb05-k1)"/>
</g>
<circle cx="78" cy="161" r="18" fill="#FFFFFF"/>
<g transform="translate(67.56,150.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
<text x="104" y="168" font-size="18.5" font-weight="600" fill="#111827">Application</text>
<text x="145" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">sends SQL text</text>

<g filter="url(#rdb05-lift)">
<rect x="310" y="116" width="280" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
<rect x="310" y="116" width="9" height="90" fill="#4F46E5" clip-path="url(#rdb05-k2)"/>
</g>
<circle cx="348" cy="161" r="18" fill="#FFFFFF"/>
<g transform="translate(337.56,150.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
<text x="374" y="168" font-size="18.5" font-weight="600" fill="#111827">Query processor</text>

<g filter="url(#rdb05-soft)">
<rect x="650" y="116" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="650" y="116" width="6" height="90" fill="#2563EB" clip-path="url(#rdb05-k3)"/>
</g>
<circle cx="688" cy="161" r="18" fill="#FFFFFF"/>
<g transform="translate(677.56,150.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
<text x="714" y="168" font-size="18.5" font-weight="600" fill="#111827">Storage manager</text>

<g stroke="#64748B" stroke-width="1.5">
<path d="M990,111 L990,195 A95,16 0 0 0 1180,195 L1180,111" fill="#E2E8F0"/>
<ellipse cx="1085" cy="111" rx="95" ry="16" fill="#F8FAFC"/>
</g>
<text x="1085" y="172" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Disk</text>
<text x="1085" y="236" font-size="15.5" text-anchor="middle" fill="#6B7280">pages of rows</text>

<g filter="url(#rdb05-soft)">
<rect x="310" y="290" width="280" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="310" y="290" width="6" height="90" fill="#7C3AED" clip-path="url(#rdb05-k4)"/>
</g>
<circle cx="348" cy="335" r="18" fill="#FFFFFF"/>
<g transform="translate(337.56,324.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
<text x="374" y="342" font-size="18.5" font-weight="600" fill="#111827">Catalog</text>
<text x="450" y="405" font-size="15.5" text-anchor="middle" fill="#6B7280">what tables and columns</text>
<text x="450" y="428" font-size="15.5" text-anchor="middle" fill="#94A3B8">exist, and who may use them</text>

<g filter="url(#rdb05-soft)">
<rect x="650" y="290" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="650" y="290" width="6" height="90" fill="#D97706" clip-path="url(#rdb05-k5)"/>
</g>
<circle cx="688" cy="335" r="18" fill="#FFFFFF"/>
<g transform="translate(677.56,324.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
<text x="714" y="342" font-size="18.5" font-weight="600" fill="#111827">Transaction manager</text>
<text x="790" y="405" font-size="15.5" text-anchor="middle" fill="#6B7280">keeps users apart, and</text>
<text x="790" y="428" font-size="15.5" text-anchor="middle" fill="#94A3B8">repairs the data after a crash</text>

<rect x="40" y="494" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="532" font-size="16" fill="#475569">You write what you want. The query processor decides how to get it, and that decision is where most speed is won or lost.</text>
</svg>