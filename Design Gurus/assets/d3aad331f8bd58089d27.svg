<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="running-title running-desc">
<title id="running-title">Running a game day</title>
<desc id="running-desc">A written hypothesis before, a declared window and an incident commander, an agreed stop condition, a dedicated recorder, and a practiced revert. Without them a drill produces a feeling rather than information.</desc>
<defs>
<marker id="running-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="running-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="running-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="running-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="796" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Running a game day</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A drill that is not structured produces a feeling rather than information.</text>
<rect x="40" y="718" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="718" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A written hypothesis, before</text>
<path d="M536 148H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 148H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#running-marker-slate)"/>
<rect x="580" y="118" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a drill without a prediction is a demonstration,</text><text x="600" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">judged a success regardless</text>
<circle cx="60" cy="216" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="223" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="222" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A window and an incident commander</text>
<path d="M536 216H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 216H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#running-marker-slate)"/>
<rect x="580" y="186" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="222" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because somebody has to be able to call it off</text>
<circle cx="60" cy="284" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="291" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="290" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A stop condition agreed in advance</text>
<path d="M536 284H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 284H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#running-marker-slate)"/>
<rect x="580" y="254" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="277.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">deciding this under pressure is how a drill</text><text x="600" y="302.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">becomes a real outage</text>
<circle cx="60" cy="352" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="359" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="440" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="358" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Somebody recording</text>
<path d="M536 352H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 352H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#running-marker-slate)"/>
<rect x="580" y="322" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="358" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">whose only job is that, because participants cannot do it</text>
<circle cx="60" cy="420" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="427" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="390" width="440" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="426" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A revert that is also practiced</text>
<path d="M536 420H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 420H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#running-marker-slate)"/>
<rect x="580" y="390" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="426" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which brings up the half that gets skipped</text>
<rect x="40" y="470" width="1160" height="132" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="470" width="5" height="132" rx="2.5" fill="#F28B9D"/><text x="64" y="503" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Failback is the under-drilled half</text><text x="64" y="529" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The secondary now holds writes the primary never saw, so returning means</text><text x="64" y="555" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">reconciling divergence rather than flipping a switch.</text><text x="64" y="581" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A plan covering failover and not failback has rehearsed only half the operation.</text>
<rect x="40" y="622" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="622" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="663" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">"Traffic shifts within five minutes with no data loss" can be falsified. A demo cannot.</text>
<text x="66" y="752" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Teams practice leaving and rarely practice coming back.</text>
</svg>