<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="845" viewBox="0 0 1240 845" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every live task writes one trace, and that same record serves incident forensics, aggregate dashboards, and eval-case harvesting into the sandbox">
