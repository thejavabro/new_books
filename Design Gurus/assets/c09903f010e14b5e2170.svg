<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="692" viewBox="0 0 1240 692" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="kinds-title kinds-desc">
<title id="kinds-title">Four kinds of flag, four lifetimes</title>
<desc id="kinds-desc">Release flags last days, experiment flags last the experiment, operational flags are long-lived controls, and permission flags are really entitlements. Expected lifetime is the property that distinguishes them.</desc>
<defs>
<marker id="kinds-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="kinds-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="kinds-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="kinds-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="692" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four kinds of flag, four lifetimes</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Expected lifetime is the property that distinguishes them.</text>
<rect x="40" y="614" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="614" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="60" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="106" y="155" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Release</text><text x="544" y="155" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">days to weeks</text>
<path d="M566 148H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 148H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#kinds-marker-slate)"/>
<rect x="610" y="118" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">hide work in progress and roll it out; existing past</text><text x="630" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the rollout is a defect</text>
<circle cx="60" cy="218" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="225" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="188" width="470" height="60" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="106" y="225" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Experiment</text><text x="544" y="225" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">the experiment</text>
<path d="M566 218H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 218H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#kinds-marker-slate)"/>
<rect x="610" y="188" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="211.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">split traffic to measure a difference;</text><text x="630" y="236.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">removed when the result is read</text>
<circle cx="60" cy="288" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="295" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="258" width="470" height="60" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="106" y="295" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Operational</text><text x="544" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">long, by design</text>
<path d="M566 288H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 288H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#kinds-marker-slate)"/>
<rect x="610" y="258" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="281.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">turn an expensive feature off under load;</text><text x="630" y="306.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a control, documented like any other</text>
<circle cx="60" cy="358" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="365" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="328" width="470" height="60" rx="9" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="106" y="365" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Permission</text><text x="544" y="365" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">permanent</text>
<path d="M566 358H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 358H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#kinds-marker-slate)"/>
<rect x="610" y="328" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="351.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what a customer or plan can access;</text><text x="630" y="376.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a flag at all, an entitlement</text>
<rect x="40" y="410" width="1160" height="56" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="410" width="5" height="56" rx="2.5" fill="#AC8BE8"/><text x="64" y="444" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Flag debt comes almost entirely from treating all four the same.</text>
<rect x="40" y="488" width="1160" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="488" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="518" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The migration exception</text><text x="64" y="544" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Keep the switch that moves reads back to the old path as an operational flag,</text><text x="64" y="570" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">because it is the control you want during an incident you have not had yet.</text>
<text x="66" y="648" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Migration flags are release flags, with one deliberate exception.</text>
</svg>