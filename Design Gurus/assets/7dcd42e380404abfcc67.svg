<rect x="40" y="710" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="736" width="207" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="167.5" y="758" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">two is not enough</text>
<text x="295" y="758" font-size="15.5" fill="#475569">joining only Instructor_Subject and Instructor_Campus invents the row Rao, Networks, South</text>
<rect x="64" y="780" width="207" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="167.5" y="802" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">the third blocks it</text>
<text x="295" y="802" font-size="15.5" fill="#475569">Subject_Campus has no Networks with South pairing, so the invented row cannot survive the join</text>
<rect x="64" y="824" width="207" height="32" rx="9" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
<text x="167.5" y="846" text-anchor="middle" font-size="15.5" font-weight="600" fill="#4338CA">join dependency</text>
<text x="295" y="846" font-size="15.5" fill="#475569">a fact that needs three tables to store and reconstruct without inventing rows</text>
