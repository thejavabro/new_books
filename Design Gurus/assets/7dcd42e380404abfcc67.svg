<text x="64" y="70" font-size="16.5" font-weight="600" fill="#4338CA">One ternary rule: teaches the subject, works at the campus, campus offers the subject</text>
<text x="467" y="104" font-size="16.5" font-weight="600" fill="#111827">Instructor_Subject_Campus</text>
