<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc"><title id="title">Booking and checkout: client architecture</title><desc id="desc">The booking repository supplies saved and remote facts. The checkout coordinator retains the reviewed operation across screens and restarts. The payment adapter handles provider interaction, but only the backend can confirm the booking. The local countdown does not control hold expiry. Selected connections are shown.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1240" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><rect x="25" y="140" width="1150" height="760" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Booking and checkout: client architecture</text><text x="50" y="106" font-size="22" fill="#334155" font-weight="400">The backend decides booking status. A timer or payment callback cannot confirm it.</text><rect x="50" y="165" width="1100" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="205" font-size="24" fill="#2563eb" font-weight="700">Selection and checkout views + presentation state</text><text x="72" y="243" font-size="21" fill="#334155" font-weight="400">Show the selection, reviewed price, advisory countdown, and booking status.</text><text x="995" y="310" font-size="18" fill="#64748b" font-weight="700">MOBILE APP</text><path d="M215 273 V342" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M600 273 V342" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><rect x="50" y="350" width="330" height="205" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="390" font-size="24" fill="#7c3aed" font-weight="700">Booking repository +</text><text x="72" y="420" font-size="24" fill="#7c3aed" font-weight="700">time estimate</text><text x="72" y="458" font-size="21" fill="#334155" font-weight="400">Read saved and remote facts.</text><text x="72" y="488" font-size="21" fill="#334155" font-weight="400">Estimate time remaining.</text><rect x="435" y="350" width="330" height="205" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="457" y="390" font-size="24" fill="#059669" font-weight="700">Durable checkout</text><text x="457" y="420" font-size="24" fill="#059669" font-weight="700">coordinator</text><text x="457" y="458" font-size="21" fill="#334155" font-weight="400">Save, submit, and recover</text><text x="457" y="488" font-size="21" fill="#334155" font-weight="400">one reviewed checkout.</text><rect x="820" y="350" width="330" height="205" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="390" font-size="24" fill="#c2410c" font-weight="700">Payment adapter</text><text x="842" y="428" font-size="21" fill="#334155" font-weight="400">Handle provider interaction.</text><text x="842" y="458" font-size="21" fill="#334155" font-weight="400">Return approval results</text><text x="842" y="488" font-size="21" fill="#334155" font-weight="400">to the coordinator.</text><path d="M773 450 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M215 563 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M540 563 V612 H450 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M660 563 V612 H800 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="260" y="651" font-size="19" fill="#64748b" font-weight="400">Saved data</text><text x="1000" y="603" font-size="19" fill="#64748b" font-weight="400">Requests</text><text x="1000" y="633" font-size="19" fill="#64748b" font-weight="400">and updates</text><rect x="50" y="680" width="520" height="185" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="720" font-size="24" fill="#7c3aed" font-weight="700">Account-scoped local store</text><text x="72" y="758" font-size="21" fill="#334155" font-weight="400">Reviewed checkout and operation identity</text><text x="72" y="788" font-size="21" fill="#334155" font-weight="400">Hold and booking references</text><text x="72" y="818" font-size="21" fill="#334155" font-weight="400">Last confirmed status for recovery</text><rect x="650" y="680" width="500" height="185" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="672" y="720" font-size="24" fill="#2563eb" font-weight="700">Backend API client</text><text x="672" y="758" font-size="21" fill="#334155" font-weight="400">Check current hold status.</text><text x="672" y="788" font-size="21" fill="#334155" font-weight="400">Submit the same checkout operation.</text><text x="672" y="818" font-size="21" fill="#334155" font-weight="400">Recover the authoritative booking result.</text><path d="M900 873 V952" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="922" y="927" font-size="19" fill="#64748b" font-weight="400">Network</text><rect x="50" y="960" width="520" height="185" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="1000" font-size="24" fill="#ffffff" font-weight="700">Keep confirmation separate</text><text x="72" y="1038" font-size="21" fill="#ffffff" font-weight="400">The countdown is advisory.</text><text x="72" y="1068" font-size="21" fill="#ffffff" font-weight="400">Payment approval is not booking proof.</text><text x="72" y="1098" font-size="21" fill="#ffffff" font-weight="400">Recover the backend result after timeout.</text><rect x="650" y="960" width="500" height="185" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="672" y="1000" font-size="24" fill="#c2410c" font-weight="700">Booking backend</text><text x="672" y="1038" font-size="21" fill="#334155" font-weight="400">Coordinate inventory and payment.</text><text x="672" y="1068" font-size="21" fill="#334155" font-weight="400">Enforce hold expiry and acceptance.</text><text x="672" y="1098" font-size="21" fill="#334155" font-weight="400">Own the confirmed booking outcome.</text><text x="50" y="1191" font-size="19" fill="#475569" font-weight="400">Selected connections shown. The repository also calls the backend; the payment adapter uses its provider.</text></g></svg>