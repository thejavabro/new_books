<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="crossover-title crossover-desc">
<title id="crossover-title">Where the crossover actually sits</title>
<desc id="crossover-desc">Four conditions push toward a dedicated store, and they are mostly about scale and the shape of the workload rather than about capability.</desc>
<defs>
<marker id="crossover-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="crossover-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="crossover-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="crossover-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="870" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where the crossover actually sits</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four conditions push toward a dedicated vector store.</text>
<rect x="40" y="792" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="792" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="150" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Volume</text>
<path d="M536 150H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 150H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#crossover-marker-slate)"/>
<rect x="580" y="118" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tens of millions of vectors, where build time,</text><text x="600" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">memory and latency stop being comfortable</text>
<circle cx="60" cy="226" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="194" width="440" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Query rate</text>
<path d="M536 226H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 226H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#crossover-marker-slate)"/>
<rect x="580" y="194" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sustained high-throughput search, a different</text><text x="600" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">profile from transactional load</text>
<circle cx="60" cy="302" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="270" width="440" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Index features you need</text>
<path d="M536 302H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 302H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#crossover-marker-slate)"/>
<rect x="580" y="270" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">quantization, multiple index types, sharded</text><text x="600" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">search, filtered recall guarantees</text>
<circle cx="60" cy="378" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="385" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="346" width="440" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Operational separation</text>
<path d="M536 378H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 378H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#crossover-marker-slate)"/>
<rect x="580" y="346" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">keeping a heavy workload off the database</text><text x="600" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that serves transactions</text>
<text x="40" y="446" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">And two reasons that are weaker than they look</text>
<rect x="40" y="464" width="560" height="88" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="464" width="5" height="88" rx="2.5" fill="#F28B9D"/><text x="64" y="501" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Raw speed at modest volume</text><text x="64" y="527" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">small next to the network hop you added</text>
<rect x="640" y="464" width="560" height="88" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="464" width="5" height="88" rx="2.5" fill="#F28B9D"/><text x="664" y="501" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Because it is the specialized tool</text><text x="664" y="527" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">worse at everything around the thing</text>
<rect x="40" y="570" width="1160" height="196" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 570H46A6 6 0 0 0 40 576V760A6 6 0 0 0 46 766H54Z" fill="#39D5AA"/><text x="70" y="606" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">A sequence rather than a choice.</text>
<text x="76" y="646" font-size="19" font-weight="700" fill="#155B9E" text-anchor="start">start</text>
<text x="240" y="646" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the relational store, in the same database as the data</text>
<text x="76" y="680" font-size="19" font-weight="700" fill="#155B9E" text-anchor="start">grow</text>
<text x="240" y="680" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the same, with tuning: index type, recall parameters, partitioning</text>
<text x="76" y="714" font-size="19" font-weight="700" fill="#155B9E" text-anchor="start">crossover</text>
<text x="240" y="714" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tens of millions of vectors, or a conflicting load profile</text>
<text x="76" y="748" font-size="19" font-weight="700" fill="#155B9E" text-anchor="start">then</text>
<text x="240" y="748" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a dedicated store, with the sync problem explicit and owned</text>
<text x="66" y="826" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The specialized tool is better at the thing and worse at everything around it, which is most of the work.</text>
</svg>