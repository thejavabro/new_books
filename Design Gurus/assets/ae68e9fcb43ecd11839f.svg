<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="856" viewBox="0 0 1240 856" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="failure-title failure-desc">
<title id="failure-title">When the backfill fails halfway</title>
<desc id="failure-desc">Three causes calling for three responses: restart from the cursor, investigate the row, or fix the throttle. The structural answer is a job that records what it cannot process and keeps going.</desc>
<defs>
<marker id="failure-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="failure-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="failure-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="failure-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="856" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">When the backfill fails halfway</text>
<text x="40" y="86" font-size="21" fill="#4A5568">It will stop at some point, and the response depends entirely on why.</text>
<rect x="40" y="778" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="778" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="155" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The first action is never to restart it.</text>
<rect x="40" y="208" width="340" height="88" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="210" y="258" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Infrastructure</text>
<path d="M386 252H420" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M386 252H420" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failure-marker-slate)"/>
<rect x="430" y="208" width="770" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="450" y="245.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a connection drop, a deploy, a restarted pod. Restart from the cursor.</text><text x="450" y="270.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Uneventful, because of decisions made before the job started.</text>
<rect x="40" y="306" width="340" height="88" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="210" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A row</text>
<path d="M386 350H420" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M386 350H420" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failure-marker-slate)"/>
<rect x="430" y="306" width="770" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="450" y="331" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">restarting stops at the same place. A null where a value was assumed, a</text><text x="450" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">negative amount, an unexpected encoding. A product decision, not a</text><text x="450" y="381" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">code change to silence it.</text>
<rect x="40" y="404" width="340" height="88" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="210" y="454" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The database</text>
<path d="M386 448H420" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M386 448H420" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failure-marker-slate)"/>
<rect x="430" y="404" width="770" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="450" y="441.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">replication lag climbed. The throttle was wrong, not the job. Reduce the</text><text x="450" y="466.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">batch size rather than the frequency, because the problem is lock duration.</text>
<rect x="40" y="522" width="1160" height="74" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="522" width="5" height="74" rx="2.5" fill="#39D5AA"/><text x="64" y="552" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A backfill records rows it could not process and continues. It does not halt.</text><text x="64" y="578" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Which makes the gate two conditions rather than one</text>
<rect x="40" y="612" width="560" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="648" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the comparison is at zero</text>
<rect x="640" y="612" width="560" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="634.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the unprocessable list is empty, or</text><text x="920" y="661.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every entry has been resolved</text>
<rect x="40" y="692" width="1160" height="60" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="692" width="5" height="60" rx="2.5" fill="#F28B9D"/><text x="64" y="728" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">A migration that completes with forty rows quietly skipped has not completed</text>
<text x="66" y="812" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Restarting repeatedly on a bad row is how a backfill spends a day making no progress.</text>
</svg>