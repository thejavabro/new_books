<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="618" viewBox="0 0 1240 618" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="lsmread-title lsmread-desc">
<title id="lsmread-title">The LSM read path and Bloom filters</title>
<desc id="lsmread-desc">A read checks the memtable, then SSTables from newest to oldest. Each SSTable carries a Bloom filter. A negative answer skips the file entirely. A positive answer may be a false positive, costing one unnecessary file read.</desc>
<defs>
<marker id="lsmread-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="lsmread-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="lsmread-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="lsmread-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="618" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The LSM read path and Bloom filters</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A row is not in one known location, so a read checks the memtable, then SSTables from newest to oldest.</text>
<rect x="40" y="540" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="540" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="407" y="150" font-size="19" font-weight="700" fill="#4A5568" text-anchor="middle">Checked newest to oldest</text>
<text x="717" y="150" font-size="19" font-weight="700" fill="#4A5568" text-anchor="middle">Bloom filter</text>
<text x="896" y="150" font-size="19" font-weight="700" fill="#4A5568" text-anchor="start">Result</text>
<rect x="40" y="270" width="140" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="110" y="290.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Read</text><text x="110" y="317.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">key = k</text>
<path d="M186 298H232" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M232 196V400" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M232 196H266" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M232 196H266" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<rect x="272" y="168" width="270" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="407" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Memtable  (in memory)</text>
<path d="M548 196H882" fill="none" stroke="#8795A5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="896" y="203" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">checked first</text>
<path d="M232 264H266" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M232 264H266" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<rect x="272" y="236" width="270" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="407" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SSTable 3  (newest)</text>
<path d="M548 264H582" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M548 264H582" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<rect x="592" y="236" width="250" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="717" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">definitely NOT here</text>
<path d="M848 264H882" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M848 264H882" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-green)"/>
<text x="896" y="271" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">file skipped</text>
<path d="M232 332H266" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M232 332H266" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<rect x="272" y="304" width="270" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="407" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SSTable 2</text>
<path d="M548 332H582" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M548 332H582" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<rect x="592" y="304" width="250" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="717" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">maybe here</text>
<path d="M848 332H882" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M848 332H882" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<text x="896" y="339" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">file opened, key absent</text>
<path d="M232 400H266" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M232 400H266" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<rect x="272" y="372" width="270" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="407" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SSTable 1  (oldest)</text>
<path d="M548 400H582" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M548 400H582" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<rect x="592" y="372" width="250" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="717" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">maybe here</text>
<path d="M848 400H882" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M848 400H882" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmread-marker-slate)"/>
<text x="896" y="407" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">file opened, key FOUND</text>
<rect x="40" y="452" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="452" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="489" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Four places checked and two files opened, for one row. That is read amplification.</text>
<rect x="40" y="540" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="52" rx="2.5" fill="#5EC9EC"/><text x="64" y="559" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A Bloom filter can say "definitely not here" but never "definitely here",</text><text x="64" y="585" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">so a positive answer still costs a file read.</text>
<text x="66" y="574" font-size="21" font-weight="400" fill="#080C50" text-anchor="start"></text>
</svg>