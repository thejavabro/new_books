<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="boundaries-title boundaries-desc">
<title id="boundaries-title">Trust boundaries are where the bugs are</title>
<desc id="boundaries-desc">Marking every line where data crosses from something you control less into something you control more is the single highest-yield move in the exercise.</desc>
<defs>
<marker id="boundaries-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="boundaries-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="boundaries-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="boundaries-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="790" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Trust boundaries are where the bugs are</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The common ones are worth listing because teams routinely miss several.</text>
<rect x="40" y="712" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="712" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="149" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The internet to your edge</text>
<path d="M526 143H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 143H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="118" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="149" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">everybody marks this one</text>
<rect x="40" y="176" width="480" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="207" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Service to another service</text>
<path d="M526 201H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 201H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="176" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="207" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a boundary even though both are yours</text>
<rect x="40" y="234" width="480" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="265" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Application to database</text>
<path d="M526 259H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 259H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="234" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="265" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">whenever the application can be induced to build queries</text>
<rect x="40" y="292" width="480" height="50" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="323" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Tenant to tenant</text>
<path d="M526 317H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 317H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="292" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="323" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most expensive one to get wrong</text>
<rect x="40" y="350" width="480" height="50" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="381" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Build pipeline to production</text>
<path d="M526 375H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 375H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="350" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="381" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">forgotten entirely, and the one with the broadest reach</text>
<rect x="40" y="408" width="480" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="439" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A third party into your system</text>
<path d="M526 433H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 433H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundaries-marker-slate)"/>
<rect x="570" y="408" width="630" height="50" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="439" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">webhooks, callbacks, anything bearing a signature to check</text>
<rect x="40" y="486" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="486" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="523" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Validation belongs at the boundary, every time it is crossed.</text>
<rect x="40" y="576" width="1160" height="110" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="576" width="5" height="110" rx="2.5" fill="#F28B9D"/><text x="64" y="611" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Data does not become trustworthy by having been stored</text><text x="64" y="637" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A value validated at the public API, stored, then read back and used by an internal</text><text x="64" y="663" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">service that trusted it because it came from the database.</text>
<text x="66" y="746" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A boundary crossing needs an identity, not a network position.</text>
</svg>