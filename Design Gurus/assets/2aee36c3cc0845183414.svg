<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="939" viewBox="0 0 1240 939" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The anatomy of one call. The request carries a method saying what kind of interaction is wanted, a path identifying the thing addressed, and headers carrying information about the request. The response carries a status code saying how the attempt ended, headers, and a body holding the answer. Each part is shown with the example value from the shipment read, and a closing band names the four things the contract holds that no single message shows.">
  <defs>
    <marker id="yapianatomy-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="yapianatomy-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="yapianatomy-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yapianatomy-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yapianatomy-k1"><rect x="100" y="180" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="yapianatomy-k2"><rect x="100" y="324" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="yapianatomy-k3"><rect x="100" y="468" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="yapianatomy-k4"><rect x="740" y="180" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="yapianatomy-k5"><rect x="740" y="324" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="yapianatomy-k6"><rect x="740" y="468" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="yapianatomy-k7"><rect x="84" y="679" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapianatomy-k8"><rect x="684" y="679" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapianatomy-k9"><rect x="84" y="743" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapianatomy-k10"><rect x="684" y="743" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="939" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The parts of one API call</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">reading one shipment, with every part named</text>

  
  <rect x="40" y="126" width="520" height="481" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#B45309">Request</text>
  <text x="536" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">sent by the caller</text>

  
  <rect x="680" y="126" width="520" height="481" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="704" y="156" font-size="16.5" font-weight="600" fill="#047857">Response</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">returned by the server</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M560,225 H680" stroke="#D97706" marker-end="url(#yapianatomy-am)"/>
    <path d="M680,369 H560" stroke="#059669" marker-end="url(#yapianatomy-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="213" fill="#B45309">goes out</text>
    <text x="620" y="357" fill="#047857">comes back</text>
  </g>

  
  <g filter="url(#yapianatomy-lift)">
    <rect x="100" y="180" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="100" y="180" width="9" height="90" fill="#D97706" clip-path="url(#yapianatomy-k1)"/>
  </g>
  <circle cx="138" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,214.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="164" y="232" font-size="18.5" font-weight="600" fill="#111827">Method: GET</text>
  <text x="300" y="295" text-anchor="middle" font-size="15.5" fill="#6B7280">what kind of interaction</text>

  
  <g filter="url(#yapianatomy-soft)">
    <rect x="100" y="324" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="100" y="324" width="6" height="90" fill="#D97706" clip-path="url(#yapianatomy-k2)"/>
  </g>
  <circle cx="138" cy="369" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,358.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="164" y="376" font-size="18.5" font-weight="600" fill="#111827">Path: /shipments/shp_81M</text>
  <text x="300" y="439" text-anchor="middle" font-size="15.5" fill="#6B7280">which thing</text>

  
  <g filter="url(#yapianatomy-soft)">
    <rect x="100" y="468" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="100" y="468" width="6" height="90" fill="#D97706" clip-path="url(#yapianatomy-k3)"/>
  </g>
  <circle cx="138" cy="513" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,502.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="164" y="520" font-size="18.5" font-weight="600" fill="#111827">Headers: Authorization</text>
  <text x="300" y="583" text-anchor="middle" font-size="15.5" fill="#6B7280">about the request</text>

  
  <g filter="url(#yapianatomy-lift)">
    <rect x="740" y="180" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="740" y="180" width="9" height="90" fill="#059669" clip-path="url(#yapianatomy-k4)"/>
  </g>
  <circle cx="778" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="804" y="232" font-size="18.5" font-weight="600" fill="#111827">Status: 200 OK</text>
  <text x="940" y="295" text-anchor="middle" font-size="15.5" fill="#6B7280">how it ended</text>

  
  <g filter="url(#yapianatomy-soft)">
    <rect x="740" y="324" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="740" y="324" width="6" height="90" fill="#059669" clip-path="url(#yapianatomy-k5)"/>
  </g>
  <circle cx="778" cy="369" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,358.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="804" y="376" font-size="18.5" font-weight="600" fill="#111827">Headers: Content-Type</text>
  <text x="940" y="439" text-anchor="middle" font-size="15.5" fill="#6B7280">about the response</text>

  
  <g filter="url(#yapianatomy-soft)">
    <rect x="740" y="468" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="740" y="468" width="6" height="90" fill="#059669" clip-path="url(#yapianatomy-k6)"/>
  </g>
  <circle cx="778" cy="513" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,502.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="804" y="520" font-size="18.5" font-weight="600" fill="#111827">Body: the shipment</text>
  <text x="940" y="583" text-anchor="middle" font-size="15.5" fill="#6B7280">the answer itself</text>

  
  <rect x="40" y="631" width="1160" height="184" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="661" font-size="16.5" font-weight="600" fill="#5B21B6">The contract also defines rules across calls</text>

  <g filter="url(#yapianatomy-soft)">
    <rect x="84" y="679" width="472" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="84" y="679" width="6" height="48" fill="#7C3AED" clip-path="url(#yapianatomy-k7)"/>
  </g>
  <circle cx="118" cy="703" r="4.5" fill="#7C3AED"/>
  <text x="142" y="710" font-size="18.5" font-weight="600" fill="#111827">Fields always present</text>

  <g filter="url(#yapianatomy-soft)">
    <rect x="684" y="679" width="472" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="684" y="679" width="6" height="48" fill="#7C3AED" clip-path="url(#yapianatomy-k8)"/>
  </g>
  <circle cx="718" cy="703" r="4.5" fill="#7C3AED"/>
  <text x="742" y="710" font-size="18.5" font-weight="600" fill="#111827">How absence is reported</text>

  <g filter="url(#yapianatomy-soft)">
    <rect x="84" y="743" width="472" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="84" y="743" width="6" height="48" fill="#7C3AED" clip-path="url(#yapianatomy-k9)"/>
  </g>
  <circle cx="118" cy="767" r="4.5" fill="#7C3AED"/>
  <text x="142" y="774" font-size="18.5" font-weight="600" fill="#111827">Whether a retry is safe</text>

  <g filter="url(#yapianatomy-soft)">
    <rect x="684" y="743" width="472" height="48" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="684" y="743" width="6" height="48" fill="#7C3AED" clip-path="url(#yapianatomy-k10)"/>
  </g>
  <circle cx="718" cy="767" r="4.5" fill="#7C3AED"/>
  <text x="742" y="774" font-size="18.5" font-weight="600" fill="#111827">What stays true later</text>

  
  <rect x="40" y="839" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="884" text-anchor="middle" font-size="16" fill="#475569">A message shows one exchange. The contract defines the rules that future exchanges must follow.</text>
</svg>