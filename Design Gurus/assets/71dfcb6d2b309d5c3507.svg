<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two shapes of service discovery. In client side discovery, Checkout queries the registry, gets back a list of live instances, and picks one Payments instance itself. In server side discovery, Checkout calls one stable name and a load balancer, backed by the registry, routes the call to a healthy Payments instance.">
  <defs>
    <marker id="m06-l02-discovery-styles-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l02-discovery-styles-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m06-l02-discovery-styles-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m06-l02-discovery-styles-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1020" fill="#FFFFFF"/>

  <rect x="50" y="80" width="1130" height="380" rx="14" fill="#F8FAFC" fill-opacity="0.7" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="120" font-size="20" font-weight="600" fill="#334155">Client side discovery</text>
  <text x="1160" y="120" text-anchor="end" font-size="20" fill="#64748B">the caller picks an instance</text>
  <text x="1160" y="152" text-anchor="end" font-size="20" fill="#64748B">discovery logic in every service</text>
  <g filter="url(#m06-l02-discovery-styles-soft)">
    <path d="M470,190 L470,280 A150,20 0 0 0 770,280 L770,190" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="620" cy="190" rx="150" ry="20" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="620" y="227" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Registry</text>
  <text x="620" y="257" text-anchor="middle" font-size="20" fill="#64748B">Consul, Eureka, etcd</text>
  <g filter="url(#m06-l02-discovery-styles-soft)">
    <rect x="80" y="330" width="250" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="205" y="371" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="205" y="403" text-anchor="middle" font-size="20" fill="#64748B">holds discovery logic</text>
  <g filter="url(#m06-l02-discovery-styles-soft)">
    <rect x="880" y="330" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1020" y="371" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments instance</text>
  <text x="1020" y="403" text-anchor="middle" font-size="20" fill="#64748B">the caller chose it</text>

  <rect x="50" y="500" width="1130" height="350" rx="14" fill="#F8FAFC" fill-opacity="0.7" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="540" font-size="20" font-weight="600" fill="#334155">Server side discovery</text>
  <text x="1160" y="540" text-anchor="end" font-size="20" fill="#64748B">the routing layer chooses</text>
  <text x="1160" y="572" text-anchor="end" font-size="20" fill="#64748B">somebody has to run it</text>
  <g filter="url(#m06-l02-discovery-styles-soft)">
    <path d="M460,600 L460,660 A125,20 0 0 0 710,660 L710,600" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="585" cy="600" rx="125" ry="20" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="585" y="637" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Registry</text>
  <g filter="url(#m06-l02-discovery-styles-soft)">
    <rect x="80" y="710" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="205" y="751" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="205" y="783" text-anchor="middle" font-size="20" fill="#64748B">no discovery logic</text>
  <g filter="url(#m06-l02-discovery-styles-soft)">
    <rect x="420" y="710" width="330" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="585" y="751" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One stable name</text>
  <text x="585" y="783" text-anchor="middle" font-size="20" fill="#64748B">a load balancer behind it</text>
  <g filter="url(#m06-l02-discovery-styles-soft)">
    <rect x="880" y="710" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1020" y="751" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments instance</text>
  <text x="1020" y="783" text-anchor="middle" font-size="20" fill="#64748B">the routing layer chose it</text>

  <g fill="none" stroke-width="2.5">
    <path d="M180,330 C180,270 380,212 462,212" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l02-discovery-styles-bl)"/>
    <path d="M470,285 C400,320 320,340 268,392" stroke="#059669" stroke-width="2" marker-end="url(#m06-l02-discovery-styles-em)"/>
    <path d="M330,380 L872,380" stroke="#3B82F6" marker-end="url(#m06-l02-discovery-styles-bl)"/>
    <path d="M330,760 L412,760" stroke="#3B82F6" marker-end="url(#m06-l02-discovery-styles-bl)"/>
    <path d="M750,760 L872,760" stroke="#3B82F6" marker-end="url(#m06-l02-discovery-styles-bl)"/>
    <path d="M585,680 L585,702" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l02-discovery-styles-vi)"/>
  </g>

  <text x="320" y="196" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">where is Payments?</text>
  <text x="520" y="340" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">list of live instances</text>
  <text x="600" y="412" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the caller picks one</text>
  <text x="371" y="696" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">call the name</text>
  <text x="811" y="696" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">routes to a healthy one</text>
  <text x="730" y="640" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">backs the routing layer</text>
  <text x="585" y="872" text-anchor="middle" font-size="20" fill="#64748B">on Kubernetes, a Service object is exactly this stable name</text>

  <line x1="60" y1="910" x2="96" y2="910" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="917" font-size="20" fill="#475569">Live request path: the caller is waiting</text>
  <line x1="60" y1="950" x2="96" y2="950" stroke="#059669" stroke-width="4"/>
  <text x="108" y="957" font-size="20" fill="#475569">Reply: the list of live instances</text>
  <line x1="60" y1="990" x2="96" y2="990" stroke="#7C3AED" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="997" font-size="20" fill="#475569">Registry data behind the routing layer</text>
</svg>