<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two honest exits from a distributed monolith: if the boundaries are right, finish the decoupling by giving each service its own data and replacing synchronous chains with events; if they are wrong, merge the services back into one">
  <defs>
    <marker id="m02-l05-remediation-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m02-l05-remediation-decision-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m02-l05-remediation-decision-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m02-l05-remediation-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <g fill="none" stroke-width="2.5">
    <path d="M620,140 L620,196" stroke="#475569" marker-end="url(#m02-l05-remediation-decision-sl)"/>
    <path d="M400,280 C300,280 260,350 260,416" stroke="#059669" stroke-width="3" marker-end="url(#m02-l05-remediation-decision-em)"/>
    <path d="M840,280 C940,280 990,350 990,416" stroke="#DC2626" stroke-width="3" marker-end="url(#m02-l05-remediation-decision-rd)"/>
    <path d="M260,500 C260,540 210,540 210,576" stroke="#059669" marker-end="url(#m02-l05-remediation-decision-em)"/>
    <path d="M260,500 C260,540 630,540 630,576" stroke="#059669" marker-end="url(#m02-l05-remediation-decision-em)"/>
  </g>
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="320" y="262" fill="#065F46">Yes</text>
    <text x="920" y="262" fill="#B91C1C">No</text>
  </g>

  <g filter="url(#m02-l05-remediation-decision-soft)">
    <rect x="310" y="40" width="620" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="620" y="80" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">You have diagnosed a distributed monolith</text>
  <text x="620" y="112" text-anchor="middle" font-size="20" fill="#64748B">half-decoupled is the most expensive place to stand still</text>

  <g filter="url(#m02-l05-remediation-decision-soft)">
    <path d="M620,200 L840,280 L620,360 L400,280 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="620" y="274" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Are the service</text>
  <text x="620" y="302" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">boundaries right?</text>

  <g filter="url(#m02-l05-remediation-decision-soft)">
    <rect x="100" y="416" width="320" height="84" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="260" y="466" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Finish the decoupling</text>

  <g filter="url(#m02-l05-remediation-decision-soft)">
    <rect x="820" y="416" width="360" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1000" y="456" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Merge the services</text>
  <text x="1000" y="486" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">back into one</text>
  <text x="1000" y="516" text-anchor="middle" font-size="20" fill="#64748B">what never should have been split</text>

  <g filter="url(#m02-l05-remediation-decision-soft)">
    <rect x="40" y="576" width="340" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="210" y="616" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Give each service</text>
  <text x="210" y="646" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">its own data</text>
  <text x="210" y="676" text-anchor="middle" font-size="20" fill="#64748B">ends the shared database</text>

  <g filter="url(#m02-l05-remediation-decision-soft)">
    <rect x="420" y="576" width="420" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="630" y="616" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Replace synchronous chains</text>
  <text x="630" y="646" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">with events where the flow allows</text>
  <text x="630" y="676" text-anchor="middle" font-size="20" fill="#64748B">asynchronous, no caller waiting</text>

  <g stroke-width="4">
    <line x1="40" y1="760" x2="74" y2="760" stroke="#059669"/>
    <line x1="40" y1="800" x2="74" y2="800" stroke="#DC2626"/>
  </g>
  <text x="84" y="767" font-size="20" fill="#475569">Yes: the boundaries hold, finish the decoupling</text>
  <text x="84" y="807" font-size="20" fill="#475569">No: the boundaries are wrong, merge back</text>
</svg>