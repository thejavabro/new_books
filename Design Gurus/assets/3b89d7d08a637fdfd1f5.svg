  <text x="128" y="530" font-size="21.5" font-weight="600" fill="#111827">34% of database CPU at peak</text>
  <text x="320" y="597" font-size="18.5" text-anchor="middle" fill="#6B7280">4% at 4 AM: add a read replica</text>
