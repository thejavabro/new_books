  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#1D4ED8">Traffic issue: not enough capacity</text>
  <rect x="640" y="125" width="560" height="520" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="664" y="155" font-size="19.5" font-weight="600" fill="#4338CA">Structural issue: how parts are divided</text>

  <g fill="none" stroke-width="2">

  </g>

