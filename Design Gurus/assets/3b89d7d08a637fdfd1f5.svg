<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. A traffic issue, a shortage of capacity: worst at the dinner peak and low at 4 AM, reproduced by a load test, seen in CPU, latency and pool waits, and fixed by more instances, a cache or a replica. In the Dispatch case, Dispatch queries use 34 percent of database CPU at the peak and 4 percent at 4 AM, so the fix is a read replica. A structural issue, a problem in how code, data or teams are divided: the same at every hour, not reproduced by a load test, seen in release logs, reviews and incidents, and needing a change to code, data or ownership. In the Dispatch case, Fulfillment had 5 release waits last month, so the fix is refactoring, then extraction.">
  <defs>
    <filter id="md04b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md04b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md04b-k1"><rect x="64" y="478" width="512" height="90" rx="12"/></clipPath>
    <clipPath id="md04b-k2"><rect x="664" y="478" width="512" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="690" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Traffic issues and structural issues</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The two kinds show up in different measurements, so each needs its own evidence.</text>

