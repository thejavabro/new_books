<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="562" viewBox="0 0 1240 562" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before any number is moved">
<defs>
<filter id="cym-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="562" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which number from 0 to 4 is missing from [4, 0, 3, 1]?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array holds four of the five numbers 0 to 4, each at most once</text>
<rect x="40" y="106" width="1160" height="300" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Nothing placed yet</text>
<rect x="434" y="210" width="84" height="64" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="476" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">4</text>
<text x="476" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="530" y="210" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="572" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="572" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="626" y="210" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="668" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="668" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="722" y="210" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="764" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="764" y="296" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<path d="M467,326 L485,326 L476,312 Z" fill="#4F46E5"/>
<text x="476" y="350" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">i</text>
<rect x="40" y="432" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="472" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Send every value v to index v, then look at what does not fit</text>
<text x="620" y="504" text-anchor="middle" font-size="18.5" fill="#475569">Green marks a value already at its own index, and grey marks one that cannot be placed at all</text>
</svg>