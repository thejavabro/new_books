  <text x="962" y="460" font-size="18.5" font-weight="600" fill="#111827">Server 3 (session C)</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M320,560 L320,634 A100,16 0 0 0 520,634 L520,560" fill="#DBEAFE"/>
