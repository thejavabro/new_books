  <text x="962" y="390" font-size="18.5" font-weight="600" fill="#111827">Server 2 (session B)</text>
  <g filter="url(#m04f-soft)">
    <rect x="898" y="425" width="246" height="56" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
