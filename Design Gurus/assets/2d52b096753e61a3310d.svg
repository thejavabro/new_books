  <text x="354" y="377.25" font-size="21.5" font-weight="600" fill="#111827">Stateless</text>
  <text x="354" y="402.75" font-size="21.5" font-weight="600" fill="#111827">application servers</text>
  <g filter="url(#m04f-soft)">
    <rect x="898" y="285" width="246" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="898" y="285" width="6" height="56" fill="#2563EB" clip-path="url(#m04f-k8)"/>
