  <text x="420" y="599.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Shared session</text>
  <text x="420" y="624.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">store</text>
  <text x="420" y="684" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, Redis)</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M940,560 L940,634 A78,16 0 0 0 1096,634 L1096,560" fill="#DBEAFE"/>
    <ellipse cx="1018" cy="560" rx="78" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1018" y="612" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M90,560 L90,634 A78,16 0 0 0 246,634 L246,560" fill="#DBEAFE"/>
    <ellipse cx="168" cy="560" rx="78" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="168" y="612" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="64" y="183" font-size="18.5" fill="#475569">Each request is independent</text>
  <text x="664" y="183" font-size="18.5" fill="#475569">Server stores client state in its own memory</text>

  <circle cx="102" cy="383" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,372.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></g>
  <circle cx="702" cy="383" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,372.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></g>
  <circle cx="90" cy="776" r="6" fill="#2563EB"/>
  <text x="108" y="782" font-size="18.5" fill="#1F2937">Server does not store client state between requests</text>
  <circle cx="90" cy="815" r="6" fill="#2563EB"/>
  <text x="108" y="821" font-size="18.5" fill="#1F2937">Each request contains all the information needed</text>
  <text x="108" y="848" font-size="18.5" fill="#1F2937">(for example, a session ID or JWT)</text>
  <circle cx="90" cy="881" r="6" fill="#2563EB"/>
  <text x="108" y="887" font-size="18.5" fill="#1F2937">Easily scalable with multiple identical servers</text>
  <circle cx="90" cy="920" r="6" fill="#2563EB"/>
  <text x="108" y="926" font-size="18.5" fill="#1F2937">Works well with load balancers</text>
  <circle cx="690" cy="749" r="6" fill="#059669"/>
  <text x="708" y="755" font-size="18.5" fill="#1F2937">Server stores client state (for example,</text>
  <text x="708" y="782" font-size="18.5" fill="#1F2937">session data) locally</text>
  <circle cx="690" cy="815" r="6" fill="#059669"/>
  <text x="708" y="821" font-size="18.5" fill="#1F2937">Subsequent requests from the same client go</text>
  <text x="708" y="848" font-size="18.5" fill="#1F2937">to the same server (sticky sessions)</text>
  <circle cx="690" cy="881" r="6" fill="#059669"/>
  <text x="708" y="887" font-size="18.5" fill="#1F2937">Sticky sessions make the load uneven</text>
  <circle cx="690" cy="920" r="6" fill="#059669"/>
  <text x="708" y="926" font-size="18.5" fill="#1F2937">State can be lost if the server fails</text>
  <text x="708" y="953" font-size="18.5" fill="#1F2937">(its users must log in again)</text>


</svg>