  <circle cx="936" cy="313" r="18" fill="#FFFFFF"/>
  <g transform="translate(925.56,302.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="962" y="320" font-size="18.5" font-weight="600" fill="#111827">Server 1 (session A)</text>
