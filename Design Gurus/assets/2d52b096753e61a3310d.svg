  <rect x="0" y="0" width="1240" height="1040" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Stateless vs. stateful servers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A stateless server keeps no client state between requests; a stateful server keeps it in its own memory.</text>

  <rect x="40" y="125" width="560" height="870" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#1D4ED8">Stateless server</text>
  <rect x="640" y="125" width="560" height="870" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="155" font-size="19.5" font-weight="600" fill="#047857">Stateful server</text>
  <rect x="860" y="205" width="316" height="300" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="884" y="235" font-size="19.5" font-weight="600" fill="#047857">Stateful application servers</text>
  <rect x="64" y="715" width="512" height="256" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="745" font-size="19.5" font-weight="600" fill="#1D4ED8"></text>
