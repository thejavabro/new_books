  <g transform="translate(691.56,372.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="728" y="390" font-size="18.5" font-weight="600" fill="#111827">Client 2</text>
