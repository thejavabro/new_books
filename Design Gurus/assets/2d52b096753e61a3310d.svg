<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1040" viewBox="0 0 1240 1040" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Stateless server: each request is independent; clients 1, 2 and 3 reach any of the stateless application servers, which keep sessions in a shared session store such as Redis and read and write a database, so the servers scale easily behind load balancers. Stateful server: the server stores client state in its own memory; client 1, 2 and 3 each stick to server 1, 2 or 3, which holds session A, B or C; sticky sessions make the load uneven, and if a server fails its users must log in again; the servers also read and write a database">
