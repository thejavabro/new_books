<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: a mobile client makes five sequential REST round trips to fetch the user, the user&#39;s orders, the items in those orders, the shipping address, and the payment method, and each response returns too much or too little; one GraphQL query naming the four fields it needs returns exactly that shape in a single round trip.">
  <defs>
    <marker id="m03-l02-rest-vs-graphql-round-trips-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l02-rest-vs-graphql-round-trips-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m03-l02-rest-vs-graphql-round-trips-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m03-l02-rest-vs-graphql-round-trips-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <rect x="40" y="150" width="1160" height="560" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="740" width="1160" height="200" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="185" y1="124" x2="185" y2="940"/>
    <line x1="580" y1="124" x2="580" y2="712"/>
    <line x1="1075" y1="124" x2="1075" y2="940"/>
  </g>

  <text x="62" y="190" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">REST: five sequential round trips, fetching too much and too little</text>
  <text x="62" y="780" font-size="20" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">GraphQL: one query, one round trip</text>

  <g fill="none" stroke-width="2">
    <path d="M191,240 L574,240" stroke="#3B82F6" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-bl)"/>
    <path d="M574,284 L191,284" stroke="#475569" stroke-dasharray="6 5" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-sl)"/>
    <path d="M191,330 L574,330" stroke="#3B82F6" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-bl)"/>
    <path d="M574,374 L191,374" stroke="#475569" stroke-dasharray="6 5" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-sl)"/>
    <path d="M191,420 L574,420" stroke="#3B82F6" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-bl)"/>
    <path d="M574,464 L191,464" stroke="#475569" stroke-dasharray="6 5" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-sl)"/>
    <path d="M191,510 L574,510" stroke="#3B82F6" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-bl)"/>
    <path d="M574,554 L191,554" stroke="#475569" stroke-dasharray="6 5" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-sl)"/>
    <path d="M191,600 L574,600" stroke="#3B82F6" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-bl)"/>
    <path d="M574,644 L191,644" stroke="#475569" stroke-dasharray="6 5" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-sl)"/>
    <path d="M191,850 L1069,850" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-bl)"/>
    <path d="M1069,910 L191,910" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m03-l02-rest-vs-graphql-round-trips-em)"/>
  </g>

  <g filter="url(#m03-l02-rest-vs-graphql-round-trips-soft)">
    <rect x="60" y="40" width="250" height="84" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="185" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Mobile client</text>
  <text x="185" y="108" text-anchor="middle" font-size="20" fill="#64748B">needs 4 fields</text>
  <g filter="url(#m03-l02-rest-vs-graphql-round-trips-soft)">
    <rect x="440" y="40" width="280" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="580" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">REST API</text>
  <text x="580" y="108" text-anchor="middle" font-size="20" fill="#64748B">one endpoint per resource</text>
  <g filter="url(#m03-l02-rest-vs-graphql-round-trips-soft)">
    <rect x="950" y="40" width="250" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1075" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">GraphQL API</text>
  <text x="1075" y="108" text-anchor="middle" font-size="20" fill="#64748B">client-shaped queries</text>

  
  <g filter="url(#m03-l02-rest-vs-graphql-round-trips-soft)">
    <rect x="680" y="330" width="500" height="146" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="930" y="374" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">5 round trips, 10 messages</text>
  <text x="930" y="410" text-anchor="middle" font-size="20" fill="#475569">Over-fetching: 40 fields, 4 needed</text>
  <text x="930" y="446" text-anchor="middle" font-size="20" fill="#475569">Under-fetching: five sequential calls</text>

  <g text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="920" y="530">A round trip is one request out and one response back.</text>
    <text x="920" y="562">The client waits through every one of them.</text>
  </g>

  <g filter="url(#m03-l02-rest-vs-graphql-round-trips-soft)">
    <rect x="910" y="756" width="270" height="46" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1045" y="786" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">1 round trip, 2 messages</text>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="382" y="226" fill="#1E40AF">Get user</text>
    <text x="382" y="270" fill="#475569">40 fields, most unused</text>
    <text x="382" y="316" fill="#1E40AF">Get that user's orders</text>
    <text x="382" y="360" fill="#475569">Orders</text>
    <text x="382" y="406" fill="#1E40AF">Get the items in those orders</text>
    <text x="382" y="450" fill="#475569">Items</text>
    <text x="382" y="496" fill="#1E40AF">Get shipping address</text>
    <text x="382" y="540" fill="#475569">Address</text>
    <text x="382" y="586" fill="#1E40AF">Get payment method</text>
    <text x="382" y="630" fill="#475569">Payment method</text>
    <text x="627" y="836" fill="#1E40AF">One query naming the 4 fields it needs</text>
    <text x="627" y="896" fill="#065F46">Exactly that shape, one round trip</text>
  </g>

  <line x1="50" y1="980" x2="86" y2="980" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="987" font-size="20" fill="#475569">Synchronous request: the client waits</text>
  <line x1="50" y1="1020" x2="86" y2="1020" stroke="#475569" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="98" y="1027" font-size="20" fill="#475569">REST response: one payload per call</text>
  <line x1="50" y1="1060" x2="86" y2="1060" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="98" y="1067" font-size="20" fill="#475569">GraphQL response: exactly the requested shape</text>
</svg>