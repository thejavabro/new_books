<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="672" viewBox="0 0 1240 672" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="graded-title graded-desc">
<title id="graded-title">What the interviewer is writing down</title>
<desc id="graded-desc">Candidates prepare as though the diagram were graded. What reaches the feedback form is behavior in four areas: scoping under ambiguity, trade-off reasoning, depth on demand, and judgment, each assessed separately.</desc>
<defs>
<marker id="graded-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="graded-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="graded-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="graded-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="672" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the interviewer is writing down</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Candidates prepare for the drawing. The feedback form records behavior in four areas.</text>
<rect x="40" y="594" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="594" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="280" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V392A6 6 0 0 0 46 398H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">What candidates prepare for</text>
<rect x="72" y="176" width="500" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="210" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the right boxes</text>
<rect x="72" y="244" width="500" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="278" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the right arrows</text>
<rect x="72" y="312" width="500" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="346" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">matching a reference answer</text>
<rect x="640" y="118" width="560" height="280" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V392A6 6 0 0 0 646 398H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">What is actually written down</text>
<circle cx="694" cy="197" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="694" y="204" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="724" y="174" width="448" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="948" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scoping under ambiguity</text>
<circle cx="694" cy="249" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="694" y="256" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="724" y="226" width="448" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="948" y="255" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Trade-off reasoning</text>
<circle cx="694" cy="301" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="694" y="308" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="724" y="278" width="448" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="948" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Depth on demand</text>
<circle cx="694" cy="353" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="694" y="360" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="724" y="330" width="448" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="948" y="359" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Judgment</text>
<rect x="40" y="422" width="1160" height="146" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="620" y="458" font-size="23" font-weight="700" fill="#6040A8" text-anchor="middle">Two consequences, both uncomfortable</text>
<rect x="70" y="478" width="540" height="70" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="70" y="478" width="5" height="70" rx="2.5" fill="#5EC9EC"/><text x="94" y="506" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A reasonable design, scoped well and defended with</text><text x="94" y="532" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">real reasoning, outscores an excellent one without.</text>
<rect x="630" y="478" width="540" height="70" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="630" y="478" width="5" height="70" rx="2.5" fill="#F3CF6A"/><text x="654" y="506" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The four score separately, so strength in three</text><text x="654" y="532" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">can still be rated a level lower by the fourth.</text>
<text x="66" y="628" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Interviewers are predicting how you behave on a problem where nobody knows the answer in advance.</text>
</svg>