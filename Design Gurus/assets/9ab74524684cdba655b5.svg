<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same partition handled two ways: a CP system refuses writes on one side to keep the replicas in agreement, an AP system accepts them everywhere and reconciles later">
  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
  <defs>
    <marker id="cp6-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cp6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cp6-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="cp6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="504" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="78" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">CP: one side stops</text>

  <rect x="640" y="40" width="580" height="504" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="78" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">AP: both sides keep going</text>

  
  <line x1="265" y1="150" x2="292" y2="150" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="328" y1="150" x2="355" y2="150" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M300,138 L320,162 M320,138 L300,162" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <line x1="885" y1="150" x2="912" y2="150" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="948" y1="150" x2="975" y2="150" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M920,138 L940,162 M940,138 L920,162" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>

  
  <line x1="155" y1="230" x2="155" y2="266" stroke="#059669" stroke-width="2.5" marker-end="url(#cp6-emerald)"/>
  <line x1="465" y1="230" x2="465" y2="266" stroke="#DC2626" stroke-width="2.5" marker-end="url(#cp6-red)"/>
  <line x1="775" y1="230" x2="775" y2="266" stroke="#059669" stroke-width="2.5" marker-end="url(#cp6-emerald)"/>
  <line x1="1085" y1="230" x2="1085" y2="266" stroke="#059669" stroke-width="2.5" marker-end="url(#cp6-emerald)"/>
  <line x1="310" y1="380" x2="310" y2="416" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#cp6-blue)"/>
  <line x1="930" y1="380" x2="930" y2="416" stroke="#059669" stroke-width="2.5" marker-end="url(#cp6-emerald)"/>

  
  <g filter="url(#cp6-soft)">
    <rect x="55" y="115" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="365" y="115" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="675" y="115" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="985" y="115" width="200" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="155" y="157" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Majority side</text>
  <text x="465" y="157" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Minority side</text>
  <text x="775" y="157" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Side A</text>
  <text x="1085" y="157" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Side B</text>

  <text x="155" y="216" font-size="20" fill="#64748B" text-anchor="middle">a write arrives</text>
  <text x="465" y="216" font-size="20" fill="#64748B" text-anchor="middle">a write arrives</text>
  <text x="775" y="216" font-size="20" fill="#64748B" text-anchor="middle">a write arrives</text>
  <text x="1085" y="216" font-size="20" fill="#64748B" text-anchor="middle">a write arrives</text>

  <g filter="url(#cp6-soft)">
    <rect x="55" y="272" width="200" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="365" y="272" width="200" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="675" y="272" width="200" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="985" y="272" width="200" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="155" y="314" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">accepted</text>
  <text x="465" y="314" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">refused</text>
  <text x="775" y="314" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">accepted</text>
  <text x="1085" y="314" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">accepted</text>

  <g filter="url(#cp6-soft)">
    <rect x="55" y="422" width="510" height="76" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="675" y="422" width="510" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="310" y="454" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">The two sides can never disagree</text>
  <text x="310" y="482" font-size="20" fill="#3B82F6" text-anchor="middle">cost: some users are told no</text>
  <text x="930" y="454" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The two sides drift apart</text>
  <text x="930" y="482" font-size="20" fill="#059669" text-anchor="middle">cost: reads are stale until repair</text>

  <text x="620" y="578" font-size="20" fill="#475569" text-anchor="middle">Same partition, same write, two designs. Neither one is cheating; each is paying a different bill.</text>
</svg>