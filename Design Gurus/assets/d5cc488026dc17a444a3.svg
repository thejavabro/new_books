<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The moving window covers part of the previous fixed window, and that fraction of its count is added to the current one">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <filter id="rl7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <g filter="url(#rl7-soft)">
    <rect x="80" y="150" width="960" height="150" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <rect x="416" y="150" width="144" height="150" fill="#7C3AED" fill-opacity="0.14"/>
  <line x1="560" y1="150" x2="560" y2="300" stroke="#475569" stroke-width="2.5"/>

  <text x="320" y="196" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Previous minute</text>
  <text x="320" y="248" font-size="20" fill="#475569" text-anchor="middle">80 requests</text>
  <text x="800" y="196" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Current minute</text>
  <text x="800" y="248" font-size="20" fill="#475569" text-anchor="middle">30 requests so far</text>

  <rect x="416" y="118" width="480" height="214" rx="12" fill="none" stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="656" y="100" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">The moving window, one minute wide</text>

  <line x1="896" y1="332" x2="896" y2="352" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="896" y="378" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">now</text>

  <line x1="416" y1="348" x2="560" y2="348" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="416" y1="340" x2="416" y2="356" stroke="#7C3AED" stroke-width="2.5"/>
  <line x1="560" y1="340" x2="560" y2="356" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="488" y="386" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">30 percent of the previous minute is still inside</text>

  <rect x="300" y="402" width="640" height="52" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="620" y="436" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">(80 x 0.3) + 30 = 54 requests counted</text>
</svg>