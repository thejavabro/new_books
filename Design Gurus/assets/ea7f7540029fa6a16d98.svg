<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="During a storm, input drift fires first, prediction drift second, and the hourly MAE last, once delivered orders bring labels">
  <defs>
    <marker id="c2eta3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c2eta3-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="c2eta3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2eta3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2eta3-k1"><rect x="70" y="136" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta3-k2"><rect x="320" y="136" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta3-k3"><rect x="600" y="136" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta3-k4"><rect x="910" y="136" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta3-k5"><rect x="110" y="410" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta3-k6"><rect x="490" y="410" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta3-k7"><rect x="900" y="410" width="270" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="716" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">The signals, in the order they fire</text>
  <rect x="40" y="330" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#B45309">What responds</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M270,181 H320" marker-end="url(#c2eta3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M550,181 H600" marker-end="url(#c2eta3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M860,181 H910" marker-end="url(#c2eta3-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M1035,263 V410" marker-end="url(#c2eta3-memerald)"/></g>
  <g filter="url(#c2eta3-soft)">
    <rect x="70" y="136" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="136" width="6" height="90" fill="#64748B" clip-path="url(#c2eta3-k1)"/>
  </g>
  <circle cx="108" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,170.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="70" y="124" font-size="15.5" font-weight="600" fill="#6B7280">6:00 PM</text>
  <text x="134" y="188" font-size="18.5" font-weight="600" fill="#111827">Storm begins</text>
  <text x="170" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">couriers slow down</text>
  <g filter="url(#c2eta3-soft)">
    <rect x="320" y="136" width="230" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="320" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#c2eta3-k2)"/>
  </g>
  <circle cx="358" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(347.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="320" y="124" font-size="15.5" font-weight="600" fill="#6B7280">within minutes</text>
  <text x="384" y="188" font-size="18.5" font-weight="600" fill="#111827">Input drift fires</text>
  <text x="435" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">weather and kitchen queues change</text>
  <g filter="url(#c2eta3-soft)">
    <rect x="600" y="136" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="600" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#c2eta3-k3)"/>
  </g>
  <circle cx="638" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(627.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="600" y="124" font-size="15.5" font-weight="600" fill="#6B7280">next</text>
  <text x="664" y="188" font-size="18.5" font-weight="600" fill="#111827">Prediction drift fires</text>
  <text x="730" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">predicted minutes shift upward</text>
  <g filter="url(#c2eta3-lift)">
    <rect x="910" y="136" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="910" y="136" width="9" height="90" fill="#059669" clip-path="url(#c2eta3-k4)"/>
  </g>
  <circle cx="948" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(937.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="910" y="124" font-size="15.5" font-weight="600" fill="#6B7280">around 7:00 PM</text>
  <text x="974" y="188" font-size="18.5" font-weight="600" fill="#111827">Hourly MAE fires</text>
  <text x="1035" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">storm orders are delivered</text>
  <g filter="url(#c2eta3-soft)">
    <rect x="110" y="410" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="110" y="410" width="6" height="90" fill="#7C3AED" clip-path="url(#c2eta3-k5)"/>
  </g>
  <circle cx="148" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,444.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="110" y="398" font-size="15.5" font-weight="600" fill="#6B7280">right away</text>
  <text x="174" y="462" font-size="18.5" font-weight="600" fill="#111827">Calibration layer</text>
  <text x="230" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">widens the buffer for that region</text>
  <g filter="url(#c2eta3-soft)">
    <rect x="490" y="410" width="280" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="490" y="410" width="6" height="90" fill="#4F46E5" clip-path="url(#c2eta3-k6)"/>
  </g>
  <circle cx="528" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,444.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="490" y="398" font-size="15.5" font-weight="600" fill="#6B7280">within minutes</text>
  <text x="554" y="462" font-size="18.5" font-weight="600" fill="#111827">Streaming aggregates</text>
  <text x="630" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">carry the storm into the model</text>
  <g filter="url(#c2eta3-soft)">
    <rect x="900" y="410" width="270" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="900" y="410" width="6" height="90" fill="#D97706" clip-path="url(#c2eta3-k7)"/>
  </g>
  <circle cx="938" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,444.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="900" y="398" font-size="15.5" font-weight="600" fill="#6B7280">last</text>
  <text x="964" y="462" font-size="18.5" font-weight="600" fill="#111827">Triggered training run</text>
  <text x="1035" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">passes the same gates</text>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1025" y="313" fill="#047857">the breach triggers it</text></g>
  <rect x="40" y="600" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="644" text-anchor="middle" font-size="15.5" fill="#374151">Retraining is not what responds fastest.</text>
</svg>