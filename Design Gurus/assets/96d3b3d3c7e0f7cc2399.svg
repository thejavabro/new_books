<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated job scheduler architecture: partition assignment through ZooKeeper, indexed scanning, queue decoupled execution with retries and archival">
  <defs>
    <filter id="js-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="js-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="js-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="js-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="js-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="js-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Distributed job scheduler: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Partitioned scanning, a queue between finding and running, and at-least-once on purpose</text>

  <rect x="24" y="96" width="1192" height="166" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#475569">1. Ownership · 1,000 partitions divided among the scheduler nodes</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#js-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">assign</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#js-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">heartbeat</text>
  <g filter="url(#js-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="156" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">ZooKeeper</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">assigns partitions</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Scheduler node</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">owns 0 to 99</text>
  <text x="1040" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">On failure</text>
  <text x="1040" y="216" font-size="20" fill="#64748B" text-anchor="middle">reassigned in 10s</text>

  <rect x="24" y="292" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="324" font-size="20" font-weight="600" fill="#1E40AF">2. Finding due jobs · one indexed query a second, not a table scan</text>
  <path d="M364,390 L456,390" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#js-blue)"/>
  <text x="410" y="378" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">select</text>
  <path d="M784,390 L876,390" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#js-blue)"/>
  <text x="830" y="378" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <g filter="url(#js-soft)">
    <rect x="40" y="352" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M460,367 L460,413 A160,15 0 0 0 780,413 L780,367" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="620" cy="367" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M880,367 L880,413 A160,15 0 0 0 1200,413 L1200,367" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="1040" cy="367" rx="160" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="200" y="386" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Scheduler node</text>
  <text x="200" y="412" font-size="20" fill="#64748B" text-anchor="middle">wakes every second</text>
  <text x="620" y="401" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Jobs table</text>
  <text x="620" y="458" font-size="20" fill="#5B21B6" text-anchor="middle">index on partition, time</text>
  <text x="1040" y="401" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="1040" y="458" font-size="20" fill="#92400E" text-anchor="middle">pushed before updating</text>

  <rect x="24" y="534" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="566" font-size="20" font-weight="600" fill="#92400E">3. Running · the scheduler never waits for a slow webhook</text>
  <path d="M264,632 L349,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#js-amber)"/>
  <text x="307" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consume</text>
  <path d="M577,632 L662,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#js-amber)"/>
  <text x="620" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <path d="M890,632 L975,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#js-amber)"/>
  <text x="933" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">log</text>
  <g filter="url(#js-soft)">
    <path d="M40,609 L40,655 A110,15 0 0 0 260,655 L260,609" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="150" cy="609" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="353" y="594" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="594" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M979,609 L979,655 A110,15 0 0 0 1199,655 L1199,609" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="609" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="643" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="150" y="700" font-size="20" fill="#92400E" text-anchor="middle">16,600 a second at peak</text>
  <text x="463" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Worker</text>
  <text x="463" y="654" font-size="20" fill="#64748B" text-anchor="middle">stateless, autoscaled</text>
  <text x="776" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User webhook</text>
  <text x="776" y="654" font-size="20" fill="#64748B" text-anchor="middle">HMAC signed</text>
  <text x="1089" y="643" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">History</text>
  <text x="1089" y="700" font-size="20" fill="#5B21B6" text-anchor="middle">720 GB a day</text>

  <rect x="24" y="776" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="808" font-size="20" font-weight="600" fill="#475569">4. Failure and cost · run twice rather than never, and archive aggressively</text>
  <path d="M364,874 L456,874" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#js-blue)"/>
  <text x="410" y="862" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">herd</text>
  <path d="M784,874 L876,874" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#js-amber)"/>
  <text x="830" y="862" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">archive</text>
  <g filter="url(#js-soft)">
    <rect x="40" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M880,851 L880,897 A160,15 0 0 0 1200,897 L1200,851" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="851" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Retry topic</text>
  <text x="200" y="896" font-size="20" fill="#64748B" text-anchor="middle">exponential backoff</text>
  <text x="620" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Jitter</text>
  <text x="620" y="896" font-size="20" fill="#64748B" text-anchor="middle">spreads 09:00:00</text>
  <text x="1040" y="885" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3 Parquet</text>
  <text x="1040" y="942" font-size="20" fill="#5B21B6" text-anchor="middle">logs older than 7 days</text>
  <line x1="44" y1="1048" x2="72" y2="1048" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1055" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1048" x2="344.576" y2="1048" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1055" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1039" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1055" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1039" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1055" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1039" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1055" font-size="20" fill="#475569">core service</text>
</svg>