<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" style="background-color:#ffffff">
<defs>
<marker id="aa" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#3a6fb0"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="120" width="200" height="120" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="130" y="150" text-anchor="middle" font-weight="bold">Our application</text>
<text x="130" y="176" text-anchor="middle" font-family="monospace" font-size="12">checkout(gateway,</text>
<text x="130" y="192" text-anchor="middle" font-family="monospace" font-size="12">         money)</text>
<text x="130" y="214" text-anchor="middle" font-size="11.5" fill="#414d60">calls pay(Money) and gets</text><text x="130" y="230" text-anchor="middle" font-size="11.5" fill="#414d60">back a Receipt</text>

<line x1="290" y1="40" x2="290" y2="370" stroke="#c3cfe0" stroke-dasharray="4 4"/>
<text x="300" y="58" font-size="11.5" fill="#6b7789">the boundary</text>

<rect x="330" y="80" width="230" height="90" rx="4" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="445" y="106" text-anchor="middle" font-weight="bold">StripeGateway</text>
<text x="445" y="128" text-anchor="middle" font-size="11.5" fill="#414d60">Money to cents</text>
<text x="445" y="148" text-anchor="middle" font-size="11.5" fill="#414d60">charge id to Receipt</text>

<rect x="330" y="215" width="230" height="90" rx="4" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="445" y="241" text-anchor="middle" font-weight="bold">PayPalGateway</text>
<text x="445" y="263" text-anchor="middle" font-size="11.5" fill="#414d60">Money to "42.50"</text>
<text x="445" y="283" text-anchor="middle" font-size="11.5" fill="#414d60">payment id to Receipt</text>

<rect x="660" y="80" width="290" height="90" rx="4" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="805" y="106" text-anchor="middle" font-weight="bold" fill="#414d60">StripeClient</text>
<text x="805" y="132" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#414d60">charge(4250, "usd")</text>
<text x="805" y="152" text-anchor="middle" font-size="11" fill="#6b7789">vendor library, cannot change</text>

<rect x="660" y="215" width="290" height="90" rx="4" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="805" y="241" text-anchor="middle" font-weight="bold" fill="#414d60">PayPalClient</text>
<text x="805" y="267" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#414d60">sendPayment("42.50", "USD")</text>
<text x="805" y="287" text-anchor="middle" font-size="11" fill="#6b7789">vendor library, cannot change</text>

<path d="M 230 165 L 260 165 L 260 125 L 325 125" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#aa)"/>
<path d="M 230 195 L 260 195 L 260 260 L 325 260" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#aa)"/>
<path d="M 560 125 L 655 125" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#aa)"/>
<path d="M 560 260 L 655 260" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#aa)"/>


<rect x="30" y="336" width="920" height="46" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="363" font-size="12.5" fill="#414d60">Nothing left of the dashed line knows that Stripe or PayPal exist. Swapping vendors means writing one class, not editing call sites.</text>
</g>
</svg>