<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1570" viewBox="0 0 1240 1570" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Ticket booking service map: buyers pass a virtual waiting room at the front door, then the API gateway, which reads show layout from Events and seat states from the seat map cache, and writes holds into Seat Inventory or purchases through Orders and Payments. Seat Inventory publishes seat state events to a topic that feeds the seat map read model, which warms the cache, and Notifications.">
  <defs>
    <marker id="m07-l05-booking-architecture-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l05-booking-architecture-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m07-l05-booking-architecture-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1570" fill="#FFFFFF"/>

  <rect x="40" y="110" width="1160" height="450" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="152" font-size="20" font-weight="600" fill="#1E3A8A">Front door</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="80" y="180" width="320" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="231" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Buyers</text>
  <text x="240" y="263" text-anchor="middle" font-size="20" fill="#64748B">50,000 in the on-sale second</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="80" y="350" width="420" height="170" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="290" y="394" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Waiting room</text>
  <text x="290" y="426" text-anchor="middle" font-size="20" fill="#64748B">admission tokens, one per session</text>
  <text x="290" y="458" text-anchor="middle" font-size="20" fill="#64748B">about 1,000 buyers a second</text>
  <text x="290" y="490" text-anchor="middle" font-size="20" fill="#64748B">no token, no seat map, no hold</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="560" y="180" width="620" height="340" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="870" y="261" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The queue is a fairness mechanism</text>
  <text x="870" y="293" text-anchor="middle" font-size="20" fill="#475569">Errors at the gateway hand tickets to</text>
  <text x="870" y="325" text-anchor="middle" font-size="20" fill="#475569">whoever retries hardest, which means bots.</text>
  <text x="870" y="357" text-anchor="middle" font-size="20" fill="#475569">A queue that keeps its order makes first</text>
  <text x="870" y="389" text-anchor="middle" font-size="20" fill="#475569">come, first served a property of the system.</text>
  <text x="870" y="421" text-anchor="middle" font-size="20" fill="#475569">Cap per account and per card, the identity</text>
  <text x="870" y="453" text-anchor="middle" font-size="20" fill="#475569">a bot farm cannot multiply.</text>

  <rect x="400" y="610" width="800" height="390" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="420" y="652" font-size="20" font-weight="600" fill="#1E3A8A">Read path: about 50,000 reads a second, cached, seconds stale</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="440" y="690" width="340" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="610" y="735" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Events</text>
  <text x="610" y="767" text-anchor="middle" font-size="20" fill="#64748B">venues, shows, seat layout,</text>
  <text x="610" y="799" text-anchor="middle" font-size="20" fill="#64748B">cacheable for hours</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="820" y="690" width="340" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="990" y="735" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Seat map read model</text>
  <text x="990" y="767" text-anchor="middle" font-size="20" fill="#64748B">a materialized view,</text>
  <text x="990" y="799" text-anchor="middle" font-size="20" fill="#64748B">rebuilt from seat events</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <path d="M560,870 L560,960 A220,20 0 0 0 1000,960 L1000,870" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
    <ellipse cx="780" cy="870" rx="220" ry="20" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="780" y="907" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">seat map cache</text>
  <text x="780" y="937" text-anchor="middle" font-size="20" fill="#64748B">seat states, seconds stale</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="80" y="690" width="280" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="220" y="735" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">API Gateway</text>
  <text x="220" y="767" text-anchor="middle" font-size="20" fill="#64748B">one entry point, the</text>
  <text x="220" y="799" text-anchor="middle" font-size="20" fill="#64748B">token checked every call</text>

  <rect x="40" y="1050" width="760" height="350" rx="14" fill="#DBEAFE" fill-opacity="0.4" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="1092" font-size="20" font-weight="600" fill="#1E3A8A">Write path: one narrow serialized lane</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="70" y="1130" width="280" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="210" y="1181" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders</text>
  <text x="210" y="1213" text-anchor="middle" font-size="20" fill="#64748B">a short saga</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="70" y="1280" width="280" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="210" y="1337" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="400" y="1130" width="380" height="250" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="590" y="1182" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Seat Inventory</text>
  <text x="590" y="1214" text-anchor="middle" font-size="20" fill="#64748B">the only writer: it owns</text>
  <text x="590" y="1246" text-anchor="middle" font-size="20" fill="#64748B">the invariant</text>
  <text x="590" y="1278" text-anchor="middle" font-size="20" fill="#64748B">one partition per event</text>
  <text x="590" y="1310" text-anchor="middle" font-size="20" fill="#64748B">one conditional write on</text>
  <text x="590" y="1342" text-anchor="middle" font-size="20" fill="#64748B">one seat row</text>

  <rect x="840" y="1050" width="360" height="350" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="860" y="1092" font-size="20" font-weight="600" fill="#92400E">Event spine</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <path d="M860,1150 L860,1240 A160,20 0 0 0 1180,1240 L1180,1150" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="1020" cy="1150" rx="160" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1020" y="1187" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">seat events topic</text>
  <text x="1020" y="1217" text-anchor="middle" font-size="20" fill="#64748B">written with an outbox</text>
  <g filter="url(#m07-l05-booking-architecture-soft)">
    <rect x="860" y="1290" width="320" height="100" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1020" y="1347" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>

  <g fill="none" stroke-width="2.5">
    <path d="M240,300 L240,342" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-booking-architecture-bl)"/>
    <path d="M230,520 L230,682" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-booking-architecture-bl)"/>
    <path d="M360,730 L432,730" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-booking-architecture-bl)"/>
    <path d="M360,790 C450,830 500,872 552,890" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-booking-architecture-bl)"/>
    <path d="M180,830 L180,1122" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-booking-architecture-bl)"/>
    <path d="M300,830 C400,900 500,1010 560,1122" stroke="#3B82F6" marker-end="url(#m07-l05-booking-architecture-bl)"/>
    <path d="M350,1190 L392,1190" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-booking-architecture-bl)"/>
    <path d="M210,1250 L210,1272" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-booking-architecture-bl)"/>
    <path d="M780,1190 L852,1190" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l05-booking-architecture-ab)"/>
    <path d="M1020,1260 L1020,1282" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l05-booking-architecture-ab)"/>
    <path d="M1180,1150 L1215,1150 L1215,780 L1168,780" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l05-booking-architecture-ab)"/>
    <path d="M900,830 L900,846" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l05-booking-architecture-ab)"/>
  </g>

  <text x="430" y="702" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">layout</text>
  <text x="440" y="852" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">seat states</text>
  <text x="200" y="980" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">buy</text>
  <text x="480" y="1028" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hold seat 14A</text>
  <text x="930" y="842" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">warms</text>

  <line x1="60" y1="1460" x2="96" y2="1460" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1467" font-size="20" fill="#475569">Synchronous: a buyer is waiting on the answer</text>
  <line x1="60" y1="1500" x2="96" y2="1500" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1507" font-size="20" fill="#475569">Published once, then read by whoever cares</text>
</svg>