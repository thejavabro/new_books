<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Clients send all writes to the leader, the leader replicates every change to three followers, and followers can serve read requests">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="lf1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lf1-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lf1-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="lf1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="60" y1="40" x2="88" y2="40" stroke="#3B82F6" stroke-width="3"/>
  <text x="98" y="47" font-size="20" fill="#475569">writes</text>
  <line x1="60" y1="74" x2="88" y2="74" stroke="#D97706" stroke-width="3"/>
  <text x="98" y="81" font-size="20" fill="#475569">replication</text>
  <line x1="60" y1="108" x2="88" y2="108" stroke="#059669" stroke-width="3"/>
  <text x="98" y="115" font-size="20" fill="#475569">reads</text>

  
  <rect x="930" y="88" width="260" height="470" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="948" y="516" font-size="20" font-weight="600" fill="#334155">Followers</text>
  <text x="948" y="544" font-size="20" font-weight="600" fill="#334155">(standby copies)</text>

  
  <path d="M310,186 C355,186 375,222 386,254" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#lf1-blue)"/>
  <text x="475" y="162" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. All writes go to the leader</text>

  <path d="M670,262 C770,215 860,178 972,170" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#lf1-amber)"/>
  <path d="M670,290 C780,296 880,304 972,308" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#lf1-amber)"/>
  <path d="M670,318 C770,372 870,435 972,448" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#lf1-amber)"/>
  <text x="745" y="103" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. The leader copies every</text>
  <text x="745" y="130" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">change to the followers</text>

  <path d="M980,462 C700,565 460,540 318,470" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#lf1-emerald)"/>
  <text x="620" y="578" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. Followers can serve read requests</text>

  
  <g filter="url(#lf1-soft)">
    <rect x="70" y="150" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="70" y="430" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="190" y="180" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client A</text>
  <text x="190" y="208" font-size="20" fill="#64748B" text-anchor="middle">sends writes</text>
  <text x="190" y="460" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client B</text>
  <text x="190" y="488" font-size="20" fill="#64748B" text-anchor="middle">sends reads</text>

  
  <g filter="url(#lf1-soft)">
    <path d="M390,235 L390,350 A140,16 0 0 0 670,350 L670,235" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <ellipse cx="530" cy="235" rx="140" ry="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="530" y="282" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Leader</text>
  <text x="530" y="310" font-size="20" fill="#1E40AF" text-anchor="middle">accepts all writes,</text>
  <text x="530" y="337" font-size="20" fill="#1E40AF" text-anchor="middle">coordinates the followers</text>

  
  <g filter="url(#lf1-soft)">
    <path d="M980,140 L980,194 A80,15 0 0 0 1140,194 L1140,140" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1060" cy="140" rx="80" ry="15" fill="#FAF8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M980,280 L980,334 A80,15 0 0 0 1140,334 L1140,280" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1060" cy="280" rx="80" ry="15" fill="#FAF8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M980,420 L980,474 A80,15 0 0 0 1140,474 L1140,420" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1060" cy="420" rx="80" ry="15" fill="#FAF8FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1060" y="174" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Follower 1</text>
  <text x="1060" y="314" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Follower 2</text>
  <text x="1060" y="454" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Follower 3</text>

  
  <rect x="240" y="608" width="760" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="639" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">One server orders every change.</text>
  <text x="620" y="667" font-size="20" fill="#64748B" text-anchor="middle">Because all writes flow through the leader, every copy stays in sync.</text>
</svg>