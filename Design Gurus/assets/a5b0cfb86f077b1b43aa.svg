<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Over HTTP on port 80, the Wi-Fi and internet provider can read password=secret123. Over HTTPS on port 443, they see only encrypted bytes.">
  <defs>
    <filter id="hs1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="hs1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="hs1-k1"><rect x="64" y="180" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="hs1-k2"><rect x="470" y="180" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="hs1-k3"><rect x="876" y="180" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="hs1-k4"><rect x="64" y="430" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="hs1-k5"><rect x="470" y="430" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="hs1-k6"><rect x="876" y="430" width="300" height="90" rx="12"/></clipPath>
    <marker id="hs1-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="hs1-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">What the network sees</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same login request, sent over HTTP and over HTTPS.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#BE185D">HTTP: plain text, port 80</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#047857">HTTPS: encrypted with TLS, port 443</text>

  <g fill="none" stroke-width="2">
    <path d="M364,225 H470" stroke="#DB2777" marker-end="url(#hs1-m-pink)"/>
    <path d="M770,225 H876" stroke="#DB2777" marker-end="url(#hs1-m-pink)"/>
    <path d="M364,475 H470" stroke="#059669" marker-end="url(#hs1-m-emerald)"/>
    <path d="M770,475 H876" stroke="#059669" marker-end="url(#hs1-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#hs1-soft)">
    <rect x="64" y="180" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#hs1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Browser</text>
  <g filter="url(#hs1-soft)">
    <rect x="470" y="180" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="470" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#hs1-k2)"/>
  </g>
  <circle cx="508" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="534" y="232" font-size="21.5" font-weight="600" fill="#111827">Wi-Fi and ISP</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">can read: password=secret123</text>
  <g filter="url(#hs1-soft)">
    <rect x="876" y="180" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="876" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#hs1-k3)"/>
  </g>
  <circle cx="914" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(903.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="940" y="232" font-size="21.5" font-weight="600" fill="#111827">Server</text>
  <g filter="url(#hs1-soft)">
    <rect x="64" y="430" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#hs1-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">Browser</text>
  <g filter="url(#hs1-soft)">
    <rect x="470" y="430" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="470" y="430" width="6" height="90" fill="#059669" clip-path="url(#hs1-k5)"/>
  </g>
  <circle cx="508" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="534" y="482" font-size="21.5" font-weight="600" fill="#111827">Wi-Fi and ISP</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">sees only: 8f3a9c04d2...e71b</text>
  <g filter="url(#hs1-soft)">
    <rect x="876" y="430" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="876" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#hs1-k6)"/>
  </g>
  <circle cx="914" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(903.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="940" y="482" font-size="21.5" font-weight="600" fill="#111827">Server</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">HTTP</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">anyone between you and the server can read or change the data</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">HTTPS</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">the network carries the data but cannot read or change it</text>
</svg>