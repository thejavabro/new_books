<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Fixed windows, also called tumbling windows, count each five-minute block separately. Sliding windows count the last five minutes and update every minute. Session windows group one user&#39;s activity until the user is inactive for a while.">
  <defs>
    <filter id="bvs2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bvs2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="bvs2-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs2-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="bvs2-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three ways to put a boundary on a stream</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The stream never ends, so every count needs a window.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#bvs2-lift)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="64" y="140" width="9" height="90" fill="#2563EB" clip-path="url(#bvs2-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">Fixed windows</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">each 5-minute block,</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">counted separately</text>
  <g filter="url(#bvs2-soft)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#bvs2-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">Sliding windows</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the last 5 minutes,</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">updated every minute</text>
  <g filter="url(#bvs2-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#059669" clip-path="url(#bvs2-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">Session windows</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">one user's activity,</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">ends after a quiet gap</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Fixed</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">also called tumbling windows; each record is counted once</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Sliding</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">windows overlap, so one record can appear in several counts</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Session</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">the window length depends on how the user behaves</text>
</svg>