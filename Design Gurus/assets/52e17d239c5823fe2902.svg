<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" role="img" aria-label="Two ways to get a key. Hashing the URL means hash, truncate, check the database for a collision, and repeat on conflict, and that loop sits on the request path while the user waits. Pre-generating keys means a background service fills a pool of unique keys offline, so a write just takes one from the pool and inserts. The uniqueness check does not disappear, it moves off the request path.">
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.09"/></filter>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.20"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DB2777"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>
  <rect width="1240" height="740" fill="#FFFFFF"/>
  <rect x="40" y="60" width="560" height="560" rx="18" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <rect x="40" y="60" width="560" height="560" rx="18" fill="none" stroke="#DC2626" stroke-width="1.8"/>
  <rect x="240.87" y="43" width="158.26" height="34" rx="17" fill="#DC2626"/>
  <text x="320" y="66" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Hash the URL</text>
  <rect x="104" y="112" width="464" height="76" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="138" cy="150" r="17" fill="#DC2626"/>
  <text x="138" y="157" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1</text>
  <text x="168" y="146" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Hash the long URL</text>
  <text x="168" y="172" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">MD5 or SHA-256</text>
  <rect x="104" y="212" width="464" height="76" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="138" cy="250" r="17" fill="#DC2626"/>
  <text x="138" y="257" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2</text>
  <text x="168" y="246" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Truncate to 7 characters</text>
  <text x="168" y="272" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">discards most of the hash</text>
  <line x1="320" y1="188" x2="320" y2="208" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="104" y="312" width="464" height="76" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="138" cy="350" r="17" fill="#DC2626"/>
  <text x="138" y="357" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">3</text>
  <text x="168" y="346" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Check the database</text>
  <text x="168" y="372" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">is this key already taken?</text>
  <line x1="320" y1="288" x2="320" y2="308" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="104" y="412" width="464" height="76" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="138" cy="450" r="17" fill="#DC2626"/>
  <text x="138" y="457" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">4</text>
  <text x="168" y="446" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">On collision, change the input</text>
  <text x="168" y="472" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">add a salt or counter, re-hash</text>
  <line x1="320" y1="388" x2="320" y2="408" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <path d="M104 450 H 70 V 150 H 100" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="104" y="502" width="464" height="86" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8"/>
  <text x="320" y="538" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The check and the retry happen</text>
  <text x="320" y="564" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">while the user is waiting.</text>
  <rect x="640" y="60" width="560" height="560" rx="18" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <rect x="640" y="60" width="560" height="560" rx="18" fill="none" stroke="#059669" stroke-width="1.8"/>
  <rect x="794.2725" y="43" width="251.455" height="34" rx="17" fill="#059669"/>
  <text x="920" y="66" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Pre-generate the keys</text>
  <rect x="674" y="112" width="492" height="192" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="920" y="146" font-size="19" font-weight="700" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Offline, nobody is waiting</text>
  <rect x="704" y="173" width="432" height="70" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M704 187 a14 14 0 0 1 14 -14 h0 v70 h0 a14 14 0 0 1 -14 -14 z" fill="#059669"/>
  <circle cx="748" cy="208" r="21" fill="#ECFDF5"/>
  <g transform="translate(735.5 195.5) scale(1.0417)" fill="none" stroke="#047857" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#047857"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2M5.3 5.3l2.3 2.3M16.4 16.4l2.3 2.3M18.7 5.3l-2.3 2.3M7.6 16.4l-2.3 2.3"/></g>
  <text x="778" y="215" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Key Generation Service</text>
  <text x="920" y="278" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">make random keys, drop any already used</text>
  <line x1="920" y1="316" x2="920" y2="344" stroke="#059669" stroke-width="2.2" marker-end="url(#arg)"/>
  <path d="M724 365 v74 a88 13 0 0 0 176 0 v-74 z" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.8"/>
  <ellipse cx="812" cy="365" rx="88" ry="13" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.8"/>
  <path d="M724 396.08 a88 13 0 0 0 176 0" fill="none" stroke="#0891B2" stroke-width="1.3" opacity="0.5"/>
  <text x="950" y="392" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Pool of</text>
  <text x="950" y="418" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">unused keys</text>
  <line x1="920" y1="452" x2="920" y2="494" stroke="#059669" stroke-width="2.2" marker-end="url(#arg)"/>
  <rect x="704" y="502" width="464" height="86" rx="13" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <text x="920" y="538" font-size="20" font-weight="600" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A write just takes one key</text>
  <text x="920" y="564" font-size="20" font-weight="600" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">and inserts. No loop, no retry.</text>
  <rect x="40" y="648" width="1160" height="62" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="620" y="686" font-size="21" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The uniqueness check does not disappear. It moves off the request path.</text>
</svg>