<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One writer per piece of data: each store with exactly one writing service passes; two services writing the same store means the boundary is wrong">
  <defs>
    <marker id="m02-l02-one-writer-rule-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m02-l02-one-writer-rule-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m02-l02-one-writer-rule-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  
  <rect x="40" y="60" width="1160" height="340" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="98" font-size="20" font-weight="600" fill="#065F46">Boundary holds: one writer each</text>

  <g fill="none" stroke="#059669" stroke-width="2.5">
    <path d="M370,170 L520,170" marker-end="url(#m02-l02-one-writer-rule-em)"/>
    <path d="M370,300 L520,300" marker-end="url(#m02-l02-one-writer-rule-em)"/>
  </g>
  <g font-size="20" text-anchor="middle" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="445" y="160">writes</text>
    <text x="445" y="290">writes</text>
  </g>

  <g filter="url(#m02-l02-one-writer-rule-soft)">
    <rect x="90" y="130" width="280" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="230" y="177" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory service</text>

  <g filter="url(#m02-l02-one-writer-rule-soft)">
    <rect x="90" y="260" width="280" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="230" y="307" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment service</text>

  <g filter="url(#m02-l02-one-writer-rule-soft)">
    <path d="M520,130 L520,210 A150,20 0 0 0 820,210 L820,130" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="670" cy="130" rx="150" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="670" y="165" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory counts</text>
  <text x="670" y="195" text-anchor="middle" font-size="20" fill="#64748B">single source of truth</text>

  <g filter="url(#m02-l02-one-writer-rule-soft)">
    <path d="M520,260 L520,340 A150,20 0 0 0 820,340 L820,260" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="670" cy="260" rx="150" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="670" y="295" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment records</text>
  <text x="670" y="325" text-anchor="middle" font-size="20" fill="#64748B">single source of truth</text>

  
  <rect x="40" y="440" width="1160" height="300" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="478" font-size="20" font-weight="600" fill="#B91C1C">Boundary is wrong: two writers</text>

  <g fill="none" stroke="#DC2626" stroke-width="3">
    <path d="M370,550 C480,550 510,580 620,580" marker-end="url(#m02-l02-one-writer-rule-red)"/>
    <path d="M370,660 C480,660 510,630 620,630" marker-end="url(#m02-l02-one-writer-rule-red)"/>
  </g>
  <g font-size="20" text-anchor="middle" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="480" y="537">writes</text>
    <text x="480" y="690">writes</text>
  </g>

  <g filter="url(#m02-l02-one-writer-rule-soft)">
    <rect x="90" y="510" width="280" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="230" y="557" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout service</text>

  <g filter="url(#m02-l02-one-writer-rule-soft)">
    <rect x="90" y="620" width="280" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="230" y="667" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Warehouse service</text>

  <g filter="url(#m02-l02-one-writer-rule-soft)">
    <path d="M620,545 L620,665 A160,20 0 0 0 940,665 L940,545" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <ellipse cx="780" cy="545" rx="160" ry="20" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="780" y="600" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory counts</text>
  <text x="780" y="632" text-anchor="middle" font-size="20" fill="#B91C1C">no single source of truth</text>

  
  <g stroke-width="4">
    <line x1="40" y1="790" x2="74" y2="790" stroke="#059669"/>
    <line x1="640" y1="790" x2="674" y2="790" stroke="#DC2626"/>
  </g>
  <text x="84" y="797" font-size="20" fill="#475569">One writer per store: the boundary holds</text>
  <text x="684" y="797" font-size="20" fill="#475569">Two writers on one store: the boundary is wrong</text>
</svg>