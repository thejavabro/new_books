<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A sequence with a caller, a server, and a resource store. POST /orders reaches the server, the order is created, and the response is lost, so the caller cannot observe whether the first write happened. Two branches follow. An unprotected retry creates a second order. A retry carrying the same idempotency key returns the original order.">
  <defs>
    <marker id="xl03lostres-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="xl03lostres-me" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="xl03lostres-mp" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="xl03lostres-ma" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="xl03lostres-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl03lostres-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl03lostres-k1"><rect x="80" y="100" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="xl03lostres-k2"><rect x="490" y="100" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="xl03lostres-k3"><rect x="900" y="100" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="xl03lostres-k4"><rect x="260" y="340" width="720" height="90" rx="12"/></clipPath>
    <clipPath id="xl03lostres-k5"><rect x="84" y="568" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03lostres-k6"><rect x="684" y="568" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="260" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The lost response</text>

  
  <g fill="none" stroke-width="2">
    <path d="M344,145 H489" stroke="#2563EB" marker-end="url(#xl03lostres-mb)"/>
    <path d="M754,145 H899" stroke="#059669" marker-end="url(#xl03lostres-me)"/>
    <path d="M560,190 V226 Q560,238 548,238 H232 Q220,238 220,226 V191" stroke="#DB2777" stroke-dasharray="7 5" marker-end="url(#xl03lostres-mp)"/>
  </g>

  
  <g filter="url(#xl03lostres-soft)">
    <rect x="80" y="100" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="80" y="100" width="6" height="90" fill="#64748B" clip-path="url(#xl03lostres-k1)"/>
  </g>
  <circle cx="118" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,134.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="144" y="152" font-size="18.5" font-weight="600" fill="#111827">Caller</text>

  
  <g filter="url(#xl03lostres-soft)">
    <rect x="490" y="100" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="490" y="100" width="6" height="90" fill="#64748B" clip-path="url(#xl03lostres-k2)"/>
  </g>
  <circle cx="528" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,134.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="554" y="152" font-size="18.5" font-weight="600" fill="#111827">Server</text>

  
  <g filter="url(#xl03lostres-soft)">
    <rect x="900" y="100" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="900" y="100" width="6" height="90" fill="#64748B" clip-path="url(#xl03lostres-k3)"/>
  </g>
  <circle cx="938" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,134.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="964" y="152" font-size="18.5" font-weight="600" fill="#111827">Resource store</text>

  
  <circle cx="390" cy="238" r="14" fill="#FFFFFF"/>
  <g fill="none" stroke="#DB2777" stroke-width="3" stroke-linecap="round">
    <path d="M382,230 L398,246"/>
    <path d="M398,230 L382,246"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="414" y="133" fill="#1D4ED8">POST /orders</text>
    <text x="824" y="133" fill="#047857">order created</text>
    <text x="390" y="274" fill="#BE185D">the response is lost</text>
  </g>

  
  <g fill="none" stroke-width="2.5">
    <path d="M620,302 V337" stroke="#D97706" marker-end="url(#xl03lostres-ma)"/>
  </g>

  
  <g filter="url(#xl03lostres-lift)">
    <rect x="260" y="340" width="720" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="260" y="340" width="9" height="90" fill="#D97706" clip-path="url(#xl03lostres-k4)"/>
  </g>
  <circle cx="298" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(287.56,374.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="324" y="392" font-size="18.5" font-weight="600" fill="#111827">The caller cannot observe whether the first write happened.</text>

  
  <g fill="none" stroke-width="2">
    <path d="M450,430 V456 Q450,468 438,468 H332 Q320,468 320,480 V490" stroke="#DB2777" marker-end="url(#xl03lostres-mp)"/>
    <path d="M790,430 V456 Q790,468 802,468 H908 Q920,468 920,480 V490" stroke="#059669" marker-end="url(#xl03lostres-me)"/>
  </g>

  
  <rect x="44" y="490" width="552" height="200" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="84" y="526" font-size="16.5" font-weight="600" fill="#BE185D">Retry with no key</text>
  <text x="84" y="550" font-size="15.5" fill="#6B7280">The server sees a new request</text>

  <g filter="url(#xl03lostres-lift)">
    <rect x="84" y="568" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="568" width="9" height="90" fill="#DB2777" clip-path="url(#xl03lostres-k5)"/>
  </g>
  <circle cx="122" cy="613" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,602.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="148" y="620" font-size="18.5" font-weight="600" fill="#111827">A second order exists</text>

  
  <rect x="644" y="490" width="552" height="200" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="684" y="526" font-size="16.5" font-weight="600" fill="#047857">Retry with the same key</text>
  <text x="684" y="550" font-size="15.5" fill="#6B7280">The server recognizes one request</text>

  <g filter="url(#xl03lostres-lift)">
    <rect x="684" y="568" width="472" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="684" y="568" width="9" height="90" fill="#059669" clip-path="url(#xl03lostres-k6)"/>
  </g>
  <circle cx="722" cy="613" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,602.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="748" y="620" font-size="18.5" font-weight="600" fill="#111827">The original order returns</text>

  
  <rect x="40" y="714" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="759" text-anchor="middle" font-size="16" fill="#475569">One key means these deliveries are one logical request.</text>
</svg>