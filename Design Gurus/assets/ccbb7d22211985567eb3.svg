<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="884" viewBox="0 0 1240 884" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="last-title last-desc">
<title id="last-title">Physics, then capacity</title>
<desc id="last-desc">DNS propagation has three known causes and is a design cost rather than a surprise. The secondary then struggled for reasons that only a full-traffic drill would have found.</desc>
<defs>
<marker id="last-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="last-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="last-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="last-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="884" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Physics, then capacity</text>
<text x="40" y="86" font-size="21" fill="#4A5568">DNS propagation has three known causes and is a design cost rather than a surprise.</text>
<rect x="40" y="806" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="806" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="58" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="58" rx="2.5" fill="#AC8BE8"/><text x="64" y="153" font-size="21" font-weight="700" fill="#6040A8" text-anchor="start">Propagation took fifteen minutes against a 60 second TTL</text>
<rect x="40" y="198" width="360" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="220" y="230" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Resolvers ignore short TTLs</text>
<path d="M406 224H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 224H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#last-marker-slate)"/>
<rect x="450" y="198" width="750" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="230" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a 60 second record is not honored at 60 seconds by everyone in the path</text>
<rect x="40" y="258" width="360" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="220" y="290" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Clients cache independently</text>
<path d="M406 284H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 284H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#last-marker-slate)"/>
<rect x="450" y="258" width="750" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="290" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">connection pools and long-lived connections hold the old address</text>
<rect x="40" y="318" width="360" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="220" y="350" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Mobile is the worst case</text>
<path d="M406 344H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 344H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#last-marker-slate)"/>
<rect x="450" y="318" width="750" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="350" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">holding resolution far longer than a browser</text>
<rect x="40" y="392" width="1160" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="425" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A tighter objective than this needs a routing layer that fails over at the network level</text>
<text x="40" y="492" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Then the secondary struggled for thirteen minutes</text>
<rect x="40" y="510" width="360" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="220" y="542" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cold caches</text>
<path d="M406 536H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 536H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#last-marker-slate)"/>
<rect x="450" y="510" width="750" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="542" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every cache empty, so the first wave went straight to the database</text>
<rect x="40" y="570" width="360" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="220" y="602" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Connection limits</text>
<path d="M406 596H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 596H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#last-marker-slate)"/>
<rect x="450" y="570" width="750" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="602" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sized for the traffic the secondary was actually receiving, which was none</text>
<rect x="40" y="630" width="360" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="220" y="662" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Autoscaling lag</text>
<path d="M406 656H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 656H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#last-marker-slate)"/>
<rect x="450" y="630" width="750" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="662" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">scaling takes minutes, arriving at the worst possible moment</text>
<rect x="40" y="704" width="1160" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="704" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="64" y="734" font-size="21" font-weight="700" fill="#169B77" text-anchor="start">None of these are failover defects. They are capacity defects</text><text x="64" y="762" font-size="21" font-weight="700" fill="#169B77" text-anchor="start">that only appear when the secondary takes real load.</text>
<text x="66" y="840" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A standby is a capacity hypothesis, not a capacity fact.</text>
</svg>