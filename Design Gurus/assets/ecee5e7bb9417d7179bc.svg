<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for a streaming recommendation system: personalised rows, help discovering less known titles, and the same picks on every device; refreshed in near real time after each action, recomputed nightly in bulk, with watched and unsuitable content filtered out">
  <defs>
    <filter id="nfxf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nfxf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nfxf-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxf-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxf-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxf-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxf-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfxf-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Recommendation system: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the system has to do. Split into what a viewer sees, and how those picks stay current.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">What a viewer sees</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#B45309">How the picks stay current</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nfxf-lift)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="80" y="175" width="9" height="90" fill="#7C3AED" clip-path="url(#nfxf-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Personalised rows</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a home screen built for</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">this account, not everyone</text>
  <g filter="url(#nfxf-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#059669" clip-path="url(#nfxf-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Discovery</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">new and less known titles,</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">not only the obvious picks</text>
  <g filter="url(#nfxf-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#nfxf-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Same on every device</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">TV, web and mobile show</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">a coherent set</text>
  <g filter="url(#nfxf-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#059669" clip-path="url(#nfxf-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Updates as you watch</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a finished episode changes</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">the next set of rows</text>
  <g filter="url(#nfxf-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#D97706" clip-path="url(#nfxf-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Nightly batch</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">bulk recomputation over</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">the full history</text>
  <g filter="url(#nfxf-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#nfxf-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Filter and exclude</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">nothing already watched,</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">nothing unsuitable</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Online path</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">answers in milliseconds from precomputed results plus whatever the viewer just did</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Offline path</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">recomputes models on a schedule, which is where long term taste is actually learned</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">A/B testing</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">a share of users always sees an alternative algorithm, so the system is never one fixed thing</text>
</svg>