<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="564" viewBox="0 0 1240 564" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="modes-title modes-desc">
<title id="modes-title">The three pooler modes</title>
<desc id="modes-desc">Session pooling dedicates one server connection per application connection and reduces nothing. Transaction pooling returns the server connection after each transaction and collapses many application connections onto few server connections. Statement pooling multiplexes furthest but breaks multi-statement transactions.</desc>
<defs>
<marker id="modes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
