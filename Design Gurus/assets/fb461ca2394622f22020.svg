<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two endpoints of the likes counter API. The write, POST slash v1 slash votes, runs left to right: the client sends an idempotency key and the state it wants, the service checks the key so a repeat returns the stored result, and the new counts come back so the client needs no second call. The read, GET slash v1 slash votes slash summary, also runs left to right: twenty-one target ids for one video and its comments, one pipelined lookup of twenty-one keys in a single round trip, and a response carrying both the counts and the reader own reaction state.">
  <defs>
    <filter id="ytapi-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytapi-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytapi-k1"><rect x="65" y="165" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytapi-k2"><rect x="450" y="165" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytapi-k3"><rect x="835" y="165" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytapi-k4"><rect x="65" y="405" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytapi-k5"><rect x="450" y="405" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ytapi-k6"><rect x="835" y="405" width="340" height="90" rx="12"/></clipPath>
    <marker id="ytapi-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="ytapi-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Two calls, and why each is shaped the way it is</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One write that is safe to repeat, and one read that carries a whole page.</text>

  <rect x="40" y="110" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">POST /v1/votes, the write</text>
  <rect x="40" y="350" width="1160" height="200" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="380" font-size="19.5" font-weight="600" fill="#047857">GET /v1/votes/summary, the read</text>

  <g fill="none" stroke-width="2">
    <path d="M405 210 H 444" stroke="#2563EB" marker-end="url(#ytapi-m-blue)"/>
    <path d="M790 210 H 829" stroke="#2563EB" marker-end="url(#ytapi-m-blue)"/>
    <path d="M405 450 H 444" stroke="#059669" marker-end="url(#ytapi-m-emerald)"/>
    <path d="M790 450 H 829" stroke="#059669" marker-end="url(#ytapi-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ytapi-soft)">
    <rect x="65" y="165" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="65" y="165" width="6" height="90" fill="#2563EB" clip-path="url(#ytapi-k1)"/>
  </g>
  <circle cx="103" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,199.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="129" y="217" font-size="21.5" font-weight="600" fill="#111827">Client sends</text>
  <text x="235" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">an Idempotency-Key and a state</text>
  <g filter="url(#ytapi-lift)">
    <rect x="450" y="165" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="450" y="165" width="9" height="90" fill="#4F46E5" clip-path="url(#ytapi-k2)"/>
  </g>
  <circle cx="488" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,199.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="514" y="217" font-size="21.5" font-weight="600" fill="#111827">Service checks the key</text>
  <text x="620" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">a repeat returns the stored result</text>
  <g filter="url(#ytapi-soft)">
    <rect x="835" y="165" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="835" y="165" width="6" height="90" fill="#2563EB" clip-path="url(#ytapi-k3)"/>
  </g>
  <circle cx="873" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(862.56,199.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="899" y="217" font-size="21.5" font-weight="600" fill="#111827">New counts come back</text>
  <text x="1005" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">no second call to render</text>
  <g filter="url(#ytapi-soft)">
    <rect x="65" y="405" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="65" y="405" width="6" height="90" fill="#059669" clip-path="url(#ytapi-k4)"/>
  </g>
  <circle cx="103" cy="450" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,439.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="129" y="457" font-size="21.5" font-weight="600" fill="#111827">21 target ids</text>
  <text x="235" y="524" font-size="18.5" text-anchor="middle" fill="#6B7280">one video and its comments</text>
  <g filter="url(#ytapi-lift)">
    <rect x="450" y="405" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="450" y="405" width="9" height="90" fill="#7C3AED" clip-path="url(#ytapi-k5)"/>
  </g>
  <circle cx="488" cy="450" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,439.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="457" font-size="21.5" font-weight="600" fill="#111827">One pipelined lookup</text>
  <text x="620" y="524" font-size="18.5" text-anchor="middle" fill="#6B7280">21 keys, one round trip</text>
  <g filter="url(#ytapi-soft)">
    <rect x="835" y="405" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="835" y="405" width="6" height="90" fill="#059669" clip-path="url(#ytapi-k6)"/>
  </g>
  <circle cx="873" cy="450" r="18" fill="#FFFFFF"/>
  <g transform="translate(862.56,439.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="899" y="457" font-size="21.5" font-weight="600" fill="#111827">Counts and user state</text>
  <text x="1005" y="524" font-size="18.5" text-anchor="middle" fill="#6B7280">every button rendered at once</text>

  <rect x="40" y="590" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="615" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="640" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Safe to repeat</text>
  <text x="323" y="640" font-size="18.5" fill="#475569">The key, and an action that names a state, mean a retry cannot move the count twice.</text>
  <rect x="64" y="665" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="690" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">One call per page</text>
  <text x="323" y="690" font-size="18.5" fill="#475569">Ids in, counts and the reader's own reaction out, so nothing needs a second call.</text>
  <rect x="64" y="715" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">What batching saves</text>
  <text x="323" y="740" font-size="18.5" fill="#475569">Sent one at a time these reads would be 250,000 a second, not about 11,500.</text>
</svg>