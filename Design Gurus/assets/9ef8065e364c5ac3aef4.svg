<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">A subscription can keep a closed screen alive</title><desc id="desc">A long-lived bus can retain a handler that retains the screen. Closing navigation alone does not remove that chain. An independently observed lifecycle event or explicit subscription owner must cancel the subscription and detach the handler. Waiting for the retained screen’s deinitializer can leave cleanup unable to run.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1060" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">A subscription can keep a closed screen alive</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Removing a screen from navigation does not necessarily remove the bus’s references.</text><rect x="50" y="200" width="330" height="165" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="240" font-size="24" fill="#2563eb" font-weight="700">Long-lived event bus</text><text x="72" y="281" font-size="21" fill="#334155" font-weight="400">Retains active handlers.</text><rect x="435" y="200" width="330" height="165" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="457" y="240" font-size="24" fill="#7c3aed" font-weight="700">Handler closure</text><text x="457" y="281" font-size="21" fill="#334155" font-weight="400">Captures the screen</text><text x="457" y="312" font-size="21" fill="#334155" font-weight="400">or another screen owner.</text><rect x="820" y="200" width="330" height="165" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="240" font-size="24" fill="#c2410c" font-weight="700">Closed screen</text><text x="842" y="281" font-size="21" fill="#334155" font-weight="400">May remain reachable</text><text x="842" y="312" font-size="21" fill="#334155" font-weight="400">through the handler.</text><path d="M388 282 H427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M773 282 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="390" y="251" font-size="16" fill="#334155" font-weight="400">holds</text><text x="774" y="251" font-size="16" fill="#334155" font-weight="400">holds</text><rect x="50" y="540" width="520" height="180" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="72" y="580" font-size="24" fill="#059669" font-weight="700">Independent lifecycle or owner</text><text x="72" y="621" font-size="21" fill="#334155" font-weight="400">Observe that the screen scope has ended.</text><text x="72" y="652" font-size="21" fill="#334155" font-weight="400">Do not wait for the retained screen</text><text x="72" y="683" font-size="21" fill="#334155" font-weight="400">to be destroyed.</text><rect x="650" y="540" width="500" height="180" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="672" y="580" font-size="24" fill="#2563eb" font-weight="700">Cancel the subscription token</text><text x="672" y="621" font-size="21" fill="#334155" font-weight="400">Detach the handler from the bus.</text><text x="672" y="652" font-size="21" fill="#334155" font-weight="400">Suppress queued delivery under the contract.</text><text x="672" y="683" font-size="21" fill="#334155" font-weight="400">An executing handler may still finish.</text><path d="M578 630 H642" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M900 532 V455 H215 V373" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#end)"/><text x="450" y="433" font-size="21" fill="#64748b" font-weight="400">Explicit cleanup removes the retained handler</text><rect x="50" y="830" width="1100" height="150" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="870" font-size="24" fill="#ffffff" font-weight="700">Test open–close loops</text><text x="72" y="911" font-size="21" fill="#ffffff" font-weight="400">Check that old screens and handlers are released.</text><text x="72" y="942" font-size="21" fill="#ffffff" font-weight="400">A weak reference can help, but it does not replace an explicit subscription-lifetime contract.</text></g></svg>