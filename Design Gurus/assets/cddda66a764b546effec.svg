<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="costs-title costs-desc">
<title id="costs-title">What each arrangement costs</title>
<desc id="costs-desc">Infrastructure roughly doubles, synchronous replication puts a cross-region round trip on the write path, every change happens in two places, and two regions introduce failure modes one region cannot have.</desc>
<defs>
<marker id="costs-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="costs-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="costs-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="costs-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="820" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What each arrangement costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Multi-region costs more than the infrastructure bill.</text>
<rect x="40" y="742" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="742" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Infrastructure roughly doubles</text>
<path d="M526 148H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 148H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-slate)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">plus cross-region transfer, which is charged where</text><text x="590" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">intra-region often is not</text>
<rect x="40" y="190" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Latency moves onto the write path</text>
<path d="M526 220H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 220H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-slate)"/>
<rect x="570" y="190" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if replication is synchronous, a transcontinental round</text><text x="590" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">trip is tens of ms at best</text>
<rect x="40" y="262" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Every change happens twice</text>
<path d="M526 292H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 292H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-slate)"/>
<rect x="570" y="262" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">deploys, migrations, configuration and secrets, and drift</text><text x="590" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is what breaks failovers</text>
<rect x="40" y="334" width="480" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The testing surface doubles</text>
<path d="M526 364H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 364H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-slate)"/>
<rect x="570" y="334" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">including failures that only exist because there are</text><text x="590" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">two regions</text>
<text x="40" y="438" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">The failures one region cannot have</text>
<rect x="40" y="456" width="372" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">split brain</text>
<rect x="434" y="456" width="372" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="478.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">replication lag, visible</text><text x="620" y="505.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">to users</text>
<rect x="828" y="456" width="372" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="478.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one region degraded rather</text><text x="1014" y="505.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">than dead</text>
<rect x="40" y="540" width="1160" height="90" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="90" rx="2.5" fill="#AC8BE8"/><text x="64" y="578" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">That last category is the real cost.</text><text x="64" y="604" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Some of the availability you bought is spent paying for the complexity you added.</text>
<rect x="40" y="654" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="654" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="691" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Choose from the ladder, stopping at the first arrangement that meets the numbers.</text>
<text x="66" y="776" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The failure to avoid is proposing active-active because it sounds strongest.</text>
</svg>