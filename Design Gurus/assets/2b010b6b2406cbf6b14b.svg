<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="712" viewBox="0 0 1240 712" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="outbox-title outbox-desc">
<title id="outbox-title">The outbox</title>
<desc id="outbox-desc">The business write and a row describing the event go into one local transaction against one database. A separate relay reads the outbox and publishes afterwards, so the event is durable from the moment the transaction commits.</desc>
<defs>
<marker id="outbox-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="outbox-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="outbox-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="outbox-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="712" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The outbox</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The business write and a row describing the event go into one local transaction against one database.</text>
<rect x="40" y="634" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="634" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="540" height="272" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V384A6 6 0 0 0 46 390H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">One transaction, one database</text>
<rect x="72" y="174" width="476" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">INSERT INTO orders ...</text>
<rect x="72" y="242" width="476" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">INSERT INTO outbox ...</text>
<rect x="72" y="310" width="476" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">COMMIT</text>
<path d="M588 254H652" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M588 254H652" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#outbox-marker-slate)"/>
<rect x="660" y="118" width="540" height="272" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M674 118H666A6 6 0 0 0 660 124V384A6 6 0 0 0 666 390H674Z" fill="#5EC9EC"/><text x="690" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">The relay, separately</text>
<rect x="692" y="174" width="476" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="930" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">read unpublished rows</text>
<path d="M930 226V242" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M930 226V242" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#outbox-marker-slate)"/>
<rect x="692" y="246" width="476" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="930" y="275" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">publish to the broker</text>
<path d="M930 298V314" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M930 298V314" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#outbox-marker-slate)"/>
<rect x="692" y="318" width="476" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="930" y="347" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">mark published</text>
<rect x="40" y="410" width="1160" height="104" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="410" width="5" height="104" rx="2.5" fill="#AC8BE8"/><text x="64" y="442" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Either the order and its event both exist, or neither does.</text><text x="64" y="468" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The event is durable from the moment the business transaction commits.</text><text x="64" y="494" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">If the relay is down the rows accumulate. If it crashes, they are still there.</text>
<rect x="40" y="534" width="1160" height="74" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="534" width="5" height="74" rx="2.5" fill="#F3CF6A"/><text x="64" y="564" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The event id is generated at INSERT time, not at publish time</text><text x="64" y="590" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">otherwise a retry produces a new id and the consumer cannot tell it apart from a new event.</text>
<text x="66" y="668" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Put both facts in the one system that already has a working transaction.</text>
</svg>