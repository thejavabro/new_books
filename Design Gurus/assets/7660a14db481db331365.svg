<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sidecar service mesh mechanism: Checkout sends all traffic out through its local sidecar proxy, that proxy carries mTLS, retries, timeouts, metrics, circuit breaking and trace headers on the wire to the sidecar proxy in the Payments pod, which passes the call to Payments, while a central mesh control plane programs both proxies with the same policy.">
  <defs>
    <marker id="m06-l02-sidecar-mesh-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l02-sidecar-mesh-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m06-l02-sidecar-mesh-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <g filter="url(#m06-l02-sidecar-mesh-soft)">
    <rect x="440" y="50" width="360" height="110" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="620" y="96" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Mesh control plane</text>
  <text x="620" y="128" text-anchor="middle" font-size="20" fill="#64748B">holds the configuration</text>
  <text x="1180" y="220" text-anchor="end" font-size="20" fill="#5B21B6">programs every proxy the same way</text>
  <text x="1180" y="252" text-anchor="end" font-size="20" fill="#5B21B6">with no application code changes</text>

  <rect x="50" y="330" width="480" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="370" font-size="20" font-weight="600" fill="#334155">Checkout pod</text>
  <rect x="710" y="330" width="470" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="730" y="370" font-size="20" font-weight="600" fill="#334155">Payments pod</text>

  <g filter="url(#m06-l02-sidecar-mesh-soft)">
    <rect x="70" y="400" width="210" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="175" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="175" y="473" text-anchor="middle" font-size="20" fill="#64748B">application code</text>
  <g filter="url(#m06-l02-sidecar-mesh-soft)">
    <rect x="310" y="400" width="200" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="410" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Sidecar proxy</text>
  <text x="410" y="473" text-anchor="middle" font-size="20" fill="#64748B">Envoy in Istio</text>
  <g filter="url(#m06-l02-sidecar-mesh-soft)">
    <rect x="730" y="400" width="200" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="830" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Sidecar proxy</text>
  <text x="830" y="473" text-anchor="middle" font-size="20" fill="#64748B">Envoy in Istio</text>
  <g filter="url(#m06-l02-sidecar-mesh-soft)">
    <rect x="960" y="400" width="200" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1060" y="441" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="1060" y="473" text-anchor="middle" font-size="20" fill="#64748B">application code</text>

  <g fill="none" stroke-width="2.5">
    <path d="M280,450 L302,450" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l02-sidecar-mesh-bl)"/>
    <path d="M510,450 L722,450" stroke="#3B82F6" marker-end="url(#m06-l02-sidecar-mesh-bl)"/>
    <path d="M930,450 L952,450" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l02-sidecar-mesh-bl)"/>
    <path d="M500,160 C500,250 410,280 410,392" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l02-sidecar-mesh-vi)"/>
    <path d="M740,160 C740,250 830,280 830,392" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l02-sidecar-mesh-vi)"/>
  </g>

  <text x="620" y="572" text-anchor="middle" font-size="20" fill="#1E40AF">on the wire: mTLS, retries, timeouts, metrics,</text>
  <text x="620" y="604" text-anchor="middle" font-size="20" fill="#1E40AF">circuit breaking, and trace headers</text>

  <g filter="url(#m06-l02-sidecar-mesh-soft)">
    <rect x="340" y="650" width="560" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="696" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cost: every call makes two proxy hops</text>
  <text x="620" y="728" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">milliseconds, plus real memory per pod</text>

  <line x1="60" y1="800" x2="96" y2="800" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">Request path: app to its proxy, then proxy to proxy</text>
  <line x1="60" y1="840" x2="96" y2="840" stroke="#7C3AED" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="847" font-size="20" fill="#475569">The control plane programs every proxy: policy and certificates</text>
</svg>