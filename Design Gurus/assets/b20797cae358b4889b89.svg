<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="572" viewBox="0 0 1240 572" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With three replicas, a write to two nodes and a read from two nodes cannot avoid each other, so at least one node is in both sets and the read always sees the newest value">
  <rect x="0" y="0" width="1240" height="572" fill="#FFFFFF"/>
  <defs>
    <filter id="cr1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Why the read set and the write set cannot avoid each other</text>

  <rect x="50" y="76" width="1140" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="108" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">N = 3 replicas, W = 2, R = 2, so R + W = 4, which is greater than 3</text>

  <text x="470" y="164" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">the write goes to 2 of 3</text>
  <path d="M190 184 V174 H750 V184" fill="none" stroke="#3B82F6" stroke-width="2"/>

  <g filter="url(#cr1-soft)">
    <rect x="190" y="200" width="260" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="490" y="200" width="260" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
    <rect x="790" y="200" width="260" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="320" y="240" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node A</text>
  <text x="320" y="272" font-size="20" fill="#1E40AF" text-anchor="middle">v2, the new value</text>
  <text x="320" y="302" font-size="20" fill="#1E40AF" text-anchor="middle">in the write set</text>

  <text x="620" y="240" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node B</text>
  <text x="620" y="272" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">v2, the new value</text>
  <text x="620" y="302" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">in both sets</text>

  <text x="920" y="240" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node C</text>
  <text x="920" y="272" font-size="20" fill="#5B21B6" text-anchor="middle">v1, still stale</text>
  <text x="920" y="302" font-size="20" fill="#5B21B6" text-anchor="middle">in the read set</text>

  <path d="M490 336 V346 H1050 V336" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="770" y="376" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">the read asks 2 of 3</text>

  
  <rect x="50" y="410" width="1140" height="92" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="446" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Two nodes plus two nodes on a cluster of three must share at least one. Node B is that node.</text>
  <text x="620" y="476" font-size="20" fill="#065F46" text-anchor="middle">It holds the newest value, so the read cannot miss the write. That is all R + W &gt; N means.</text>
</svg>