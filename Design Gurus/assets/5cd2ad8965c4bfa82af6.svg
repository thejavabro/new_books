<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="594" viewBox="0 0 1240 594" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A sidecar runs as a second container inside the same pod as the application, not inside the same container. The two share the pod network namespace so they reach each other on localhost, and they can share mounted volumes, but each keeps its own image and its own resource limits">
  <defs>
    <marker id="sc1-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="sc1-bs" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/>
    </marker>
    <filter id="sc1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sc1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sc1-k1"><rect x="110" y="120" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="sc1-k2"><rect x="670" y="120" width="460" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="594" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="350" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">One pod: two separate containers, placed and scaled as a single unit</text>

  <g fill="none" stroke="#2563EB" stroke-width="2.5">
    <path d="M574,165 L666,165" marker-end="url(#sc1-bl)" marker-start="url(#sc1-bs)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="158" fill="#1D4ED8">localhost</text>
  </g>

  <g filter="url(#sc1-lift)">
    <rect x="110" y="120" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="110" y="120" width="9" height="90" fill="#2563EB" clip-path="url(#sc1-k1)"/>
  </g>
  <circle cx="148" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="174" y="172" font-size="18.5" font-weight="600" fill="#111827">Application Container</text>
  <text x="340" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">your service, its own image</text>
  <text x="340" y="258" font-size="15.5" text-anchor="middle" fill="#94A3B8">its own CPU and memory limits</text>

  <g filter="url(#sc1-soft)">
    <rect x="670" y="120" width="460" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="670" y="120" width="6" height="90" fill="#7C3AED" clip-path="url(#sc1-k2)"/>
  </g>
  <circle cx="708" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,154.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="734" y="172" font-size="18.5" font-weight="600" fill="#111827">Sidecar Container</text>
  <text x="900" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">logging, proxying or config</text>
  <text x="900" y="258" font-size="15.5" text-anchor="middle" fill="#94A3B8">patched on its own schedule</text>

  <text x="620" y="320" font-size="15.5" text-anchor="middle" fill="#6B7280">They share the pod's network namespace and any mounted volumes</text>
  <text x="620" y="343" font-size="15.5" text-anchor="middle" fill="#94A3B8">They do not share an image, a process space, or a resource limit</text>

  <rect x="40" y="426" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="450" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="472" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Same pod</text>
  <text x="288" y="472" font-size="15.5" fill="#475569">both containers land on the same machine, start together, and are removed together</text>

  <rect x="64" y="494" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="516" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Not one container</text>
  <text x="288" y="516" font-size="15.5" fill="#475569">separate images and limits are the whole point, because one image with both processes is just a library</text>
</svg>