    <clipPath id="c2oe3-k2"><rect x="490" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="c2oe3-k3"><rect x="920" y="136" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c2oe3-k4"><rect x="160" y="440" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="c2oe3-k5"><rect x="500" y="440" width="240" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="746" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="234" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Offline: the same test set and the same segments</text>
  <rect x="40" y="360" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="390" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: real users</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M300,181 H490" marker-end="url(#c2oe3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M730,181 H920" marker-end="url(#c2oe3-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M1020,263 V318 Q1020,330 1008,330 H282 Q270,330 270,342 V440" marker-end="url(#c2oe3-memerald)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M380,485 H500" marker-end="url(#c2oe3-mslate)"/></g>
  <g filter="url(#c2oe3-soft)">
    <rect x="70" y="136" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="70" y="136" width="6" height="90" fill="#D97706" clip-path="url(#c2oe3-k1)"/>
  </g>
  <circle cx="108" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,170.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="70" y="124" font-size="15.5" font-weight="600" fill="#6B7280">candidate</text>
  <text x="134" y="188" font-size="18.5" font-weight="600" fill="#111827">Candidate model</text>
  <text x="185" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">scored on the test set</text>
  <g filter="url(#c2oe3-soft)">
    <rect x="490" y="136" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="490" y="136" width="6" height="90" fill="#64748B" clip-path="url(#c2oe3-k2)"/>
  </g>
  <circle cx="528" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,170.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="490" y="124" font-size="15.5" font-weight="600" fill="#6B7280">baseline 1</text>
  <text x="554" y="188" font-size="18.5" font-weight="600" fill="#111827">Naive baseline</text>
  <text x="610" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">majority class, popularity, or yesterday&#39;s value</text>
