    <rect x="920" y="136" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="920" y="136" width="9" height="90" fill="#2563EB" clip-path="url(#c2oe3-k3)"/>
