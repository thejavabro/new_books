  <text x="920" y="124" font-size="15.5" font-weight="600" fill="#6B7280">baseline 2</text>
  <text x="984" y="188" font-size="18.5" font-weight="600" fill="#111827">Incumbent</text>
  <text x="1020" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">the model serving in production today</text>
  <g filter="url(#c2oe3-soft)">
    <rect x="160" y="440" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="160" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#c2oe3-k4)"/>
  </g>
  <circle cx="198" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(187.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="160" y="428" font-size="15.5" font-weight="600" fill="#6B7280">experiment</text>
  <text x="224" y="492" font-size="18.5" font-weight="600" fill="#111827">A/B test</text>
  <text x="270" y="555" font-size="15.5" text-anchor="middle" fill="#6B7280">measures the business result</text>
  <g filter="url(#c2oe3-soft)">
    <rect x="500" y="440" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="500" y="440" width="6" height="90" fill="#059669" clip-path="url(#c2oe3-k5)"/>
  </g>
  <circle cx="538" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,474.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="500" y="428" font-size="15.5" font-weight="600" fill="#6B7280">decision</text>
  <text x="564" y="492" font-size="18.5" font-weight="600" fill="#111827">Launch decision</text>
  <text x="620" y="555" font-size="15.5" text-anchor="middle" fill="#6B7280">made online, not offline</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="395" y="167" fill="#B45309">needs a model at all?</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="825" y="167" fill="#B45309">worth the switch?</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="645" y="320" fill="#047857">beats both</text></g>
  <rect x="40" y="630" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="675" text-anchor="middle" font-size="16" fill="#475569">The offline metric picks candidates. The online experiment decides what ships.</text>
</svg>