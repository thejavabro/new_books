<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="746" viewBox="0 0 1240 746" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Offline, a candidate must beat the naive baseline and the incumbent; online, an A/B test decides whether it ships">
  <defs>
