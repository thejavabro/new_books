<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Locking: A takes the lock, B waits, A writes and releases the lock, then B takes the lock. Optimistic: both read version 7, A writes and the version becomes 8, B&#39;s version check fails, B reads again and retries.">
  <defs>
    <filter id="cc2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cc2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cc2-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc2-k2"><rect x="64" y="315" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc2-k3"><rect x="64" y="450" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc2-k4"><rect x="64" y="585" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc2-k5"><rect x="654" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc2-k6"><rect x="654" y="315" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc2-k7"><rect x="654" y="450" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="cc2-k8"><rect x="654" y="585" width="522" height="90" rx="12"/></clipPath>
    <marker id="cc2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="930" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Locking and optimistic concurrency control</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Two servers want to change the same post. One waits, or one retries.</text>

  <rect x="40" y="120" width="570" height="600" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Locking: wait your turn</text>
  <rect x="630" y="120" width="570" height="600" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#475569">Optimistic: check before you write</text>

  <g fill="none" stroke-width="2">
    <path d="M325,270 V315" stroke="#64748B" marker-end="url(#cc2-m-slate)"/>
    <path d="M915,270 V315" stroke="#64748B" marker-end="url(#cc2-m-slate)"/>
    <path d="M325,405 V450" stroke="#64748B" marker-end="url(#cc2-m-slate)"/>
    <path d="M915,405 V450" stroke="#64748B" marker-end="url(#cc2-m-slate)"/>
    <path d="M325,540 V585" stroke="#64748B" marker-end="url(#cc2-m-slate)"/>
    <path d="M915,540 V585" stroke="#64748B" marker-end="url(#cc2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#cc2-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#cc2-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">1. A takes the lock</text>
  <g filter="url(#cc2-soft)">
    <rect x="64" y="315" width="522" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="315" width="6" height="90" fill="#D97706" clip-path="url(#cc2-k2)"/>
  </g>
  <circle cx="102" cy="360" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,349.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="128" y="367" font-size="21.5" font-weight="600" fill="#111827">2. B waits</text>
  <g filter="url(#cc2-soft)">
    <rect x="64" y="450" width="522" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="450" width="6" height="90" fill="#059669" clip-path="url(#cc2-k3)"/>
  </g>
  <circle cx="102" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,484.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="128" y="502" font-size="21.5" font-weight="600" fill="#111827">3. A writes, then releases</text>
  <g filter="url(#cc2-soft)">
    <rect x="64" y="585" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="585" width="6" height="90" fill="#2563EB" clip-path="url(#cc2-k4)"/>
  </g>
  <circle cx="102" cy="630" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,619.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="128" y="637" font-size="21.5" font-weight="600" fill="#111827">4. B takes the lock and writes</text>
  <g filter="url(#cc2-soft)">
    <rect x="654" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#cc2-k5)"/>
  </g>
  <circle cx="692" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="718" y="232" font-size="21.5" font-weight="600" fill="#111827">1. Both read version 7</text>
  <g filter="url(#cc2-soft)">
    <rect x="654" y="315" width="522" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="654" y="315" width="6" height="90" fill="#059669" clip-path="url(#cc2-k6)"/>
  </g>
  <circle cx="692" cy="360" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,349.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="718" y="367" font-size="21.5" font-weight="600" fill="#111827">2. A writes, version is now 8</text>
  <g filter="url(#cc2-soft)">
    <rect x="654" y="450" width="522" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="654" y="450" width="6" height="90" fill="#DB2777" clip-path="url(#cc2-k7)"/>
  </g>
  <circle cx="692" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,484.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="718" y="502" font-size="21.5" font-weight="600" fill="#111827">3. B's check fails: not 7</text>
  <g filter="url(#cc2-soft)">
    <rect x="654" y="585" width="522" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="654" y="585" width="6" height="90" fill="#D97706" clip-path="url(#cc2-k8)"/>
  </g>
  <circle cx="692" cy="630" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,619.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="718" y="637" font-size="21.5" font-weight="600" fill="#111827">4. B reads again and retries</text>

  <rect x="40" y="750" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="775" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="800" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Locking</text>
  <text x="323" y="800" font-size="18.5" fill="#475569">safe and simple, but others wait; best when conflicts are common</text>
  <rect x="64" y="825" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="850" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Optimistic</text>
  <text x="323" y="850" font-size="18.5" fill="#475569">no waiting, but a conflict costs a retry; best when conflicts are rare</text>
</svg>