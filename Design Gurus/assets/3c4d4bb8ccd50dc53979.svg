<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The outbox pattern commits the event in the same transaction as the business data and relays it afterwards, while change data capture reads the database log directly with no application change">
  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>
  <defs>
    <marker id="dp2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dp2-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="dp2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two ways to publish an event without a distributed transaction</text>

  
  <rect x="40" y="72" width="1160" height="330" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#065F46">Outbox: the event is part of the same commit</text>

  <g filter="url(#dp2-soft)">
    <rect x="80" y="196" width="216" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="188" y="228" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Order Service</text>
  <text x="188" y="258" font-size="20" fill="#64748B" text-anchor="middle">one write, one place</text>

  <line x1="300" y1="236" x2="368" y2="236" stroke="#059669" stroke-width="2" marker-end="url(#dp2-emerald)"/>

  
  <rect x="372" y="140" width="392" height="212" rx="12" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="568" y="170" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">ONE transaction</text>

  <g filter="url(#dp2-soft)">
    <rect x="400" y="188" width="336" height="64" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="400" y="266" width="336" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="568" y="226" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">orders row</text>
  <text x="568" y="304" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">outbox row</text>

  <path d="M740 298 L836 298" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dp2-amber)"/>

  <g filter="url(#dp2-soft)">
    <rect x="840" y="262" width="216" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="840" y="150" width="216" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="948" y="294" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Relay</text>
  <text x="948" y="320" font-size="20" fill="#92400E" text-anchor="middle">polls or tails the log</text>
  <text x="948" y="182" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Broker</text>
  <text x="948" y="208" font-size="20" fill="#1E40AF" text-anchor="middle">event published</text>

  <path d="M948 258 L948 226" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dp2-amber)"/>

  <text x="620" y="382" font-size="20" fill="#475569" text-anchor="middle">If the commit succeeds the event exists, so it can always be delivered later. Consumers must handle duplicates.</text>

  
  <rect x="40" y="430" width="1160" height="248" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="464" font-size="20" font-weight="600" fill="#5B21B6">Change data capture: read the log the database already keeps</text>

  <g filter="url(#dp2-soft)">
    <rect x="80" y="522" width="216" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="188" y="554" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Any Service</text>
  <text x="188" y="584" font-size="20" fill="#64748B" text-anchor="middle">unchanged code</text>

  <line x1="300" y1="562" x2="396" y2="562" stroke="#475569" stroke-width="2" marker-end="url(#dp2-emerald)"/>

  <g filter="url(#dp2-soft)">
    <path d="M400 540 a112 17 0 0 1 224 0 v46 a112 17 0 0 1 -224 0 z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="512" cy="540" rx="112" ry="17" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="512" y="574" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Database</text>
  <text x="512" y="598" font-size="20" fill="#5B21B6" text-anchor="middle">WAL or binlog</text>

  <line x1="628" y1="562" x2="736" y2="562" stroke="#7C3AED" stroke-width="2" marker-end="url(#dp2-amber)"/>
  <text x="682" y="538" font-size="20" fill="#5B21B6" text-anchor="middle">tail</text>

  <g filter="url(#dp2-soft)">
    <rect x="740" y="526" width="216" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="1000" y="526" width="160" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="848" y="558" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">CDC connector</text>
  <text x="848" y="584" font-size="20" fill="#5B21B6" text-anchor="middle">Debezium</text>
  <text x="1080" y="570" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Broker</text>

  <line x1="960" y1="562" x2="996" y2="562" stroke="#7C3AED" stroke-width="2" marker-end="url(#dp2-amber)"/>

  <text x="620" y="654" font-size="20" fill="#475569" text-anchor="middle">Nothing is added to the application. The events are raw row changes, so they carry no business intent.</text>

  <rect x="40" y="702" width="1160" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="729" font-size="20" fill="#334155" text-anchor="middle">Common in practice: write an outbox row, then let a CDC connector tail that one table.</text>
</svg>