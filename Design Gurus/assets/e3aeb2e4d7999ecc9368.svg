<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="577" viewBox="0 0 1240 577" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="techniques-title techniques-desc">
<title id="techniques-title">Four cheap, underused techniques</title>
<desc id="techniques-desc">Store the age alongside the value so staleness is measured rather than configured. Pin one moment per request to stop incoherence. Put a version in the key so a whole family can be retired at once. Cache negative results separately, with a shorter expiry.</desc>
<defs>
<marker id="techniques-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="techniques-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="techniques-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="techniques-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="577" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four cheap, underused techniques</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four techniques keep staleness from becoming incoherence.</text>
<rect x="40" y="499" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="499" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="272" height="251" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V363A6 6 0 0 0 46 369H54Z" fill="#5EC9EC"/>
<circle cx="176" cy="154" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="176" y="162" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="176" y="202" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Carry the age</text>
<text x="176" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">store when it was made,</text><text x="176" y="257" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">not only the value</text>
<text x="176" y="318" font-size="20" font-weight="700" fill="#155B9E" text-anchor="middle">Measured staleness,</text><text x="176" y="345" font-size="20" font-weight="700" fill="#155B9E" text-anchor="middle">not configured</text>
<rect x="336" y="118" width="272" height="251" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M350 118H342A6 6 0 0 0 336 124V363A6 6 0 0 0 342 369H350Z" fill="#39D5AA"/>
<circle cx="472" cy="154" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="472" y="162" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="472" y="202" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Pin one moment</text>
<text x="472" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">read every value</text><text x="472" y="257" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a request needs</text><text x="472" y="282" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">at one instant</text>
<text x="472" y="318" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">This is what stops</text><text x="472" y="345" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">incoherence</text>
<rect x="632" y="118" width="272" height="251" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M646 118H638A6 6 0 0 0 632 124V363A6 6 0 0 0 638 369H646Z" fill="#AC8BE8"/>
<circle cx="768" cy="154" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="768" y="162" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="768" y="202" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Version the key</text>
<text x="768" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">put an epoch</text><text x="768" y="257" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">in the key; bump it</text><text x="768" y="282" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">to retire a family</text>
<text x="768" y="318" font-size="20" font-weight="700" fill="#6040A8" text-anchor="middle">Atomic invalidation</text><text x="768" y="345" font-size="20" font-weight="700" fill="#6040A8" text-anchor="middle">without deletes</text>
<rect x="928" y="118" width="272" height="251" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M942 118H934A6 6 0 0 0 928 124V363A6 6 0 0 0 934 369H942Z" fill="#F3CF6A"/>
<circle cx="1064" cy="154" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1064" y="162" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1064" y="202" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Cache the misses</text>
<text x="1064" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">cache a not-found too,</text><text x="1064" y="257" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">with a shorter expiry</text>
<text x="1064" y="318" font-size="20" font-weight="700" fill="#91642E" text-anchor="middle">Stops every miss</text><text x="1064" y="345" font-size="20" font-weight="700" fill="#91642E" text-anchor="middle">hitting the store</text>
<rect x="40" y="393" width="1160" height="80" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="393" width="5" height="80" rx="2.5" fill="#F28B9D"/><text x="64" y="425.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A newly created record hidden behind a cached absence</text><text x="64" y="452.5" font-size="20" font-weight="400" fill="#A83147" text-anchor="start">is a far more confusing bug than a stale value, which is why negative entries expire sooner.</text>
<text x="66" y="533" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">None of these change the expiry time. All of them change what a wrong answer looks like.</text>
</svg>