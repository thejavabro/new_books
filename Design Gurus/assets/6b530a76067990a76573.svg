<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="876" viewBox="0 0 1240 876" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="reversals-title reversals-desc">
<title id="reversals-title">What is expensive to undo</title>
<desc id="reversals-desc">Restraint is easy to recommend and hard to practice. The skill is knowing which decisions are genuinely expensive to reverse.</desc>
<defs>
<marker id="reversals-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="reversals-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="reversals-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="reversals-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="876" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What is expensive to undo</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Restraint is easy to recommend and hard to practice.</text>
<rect x="40" y="798" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="798" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="600" height="510" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V622A6 6 0 0 0 46 628H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Expensive to reverse</text>
<rect x="72" y="174" width="536" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="174" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="96" y="206" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The data model</text><text x="96" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">entities, relationships, identifiers. Changing</text><text x="96" y="258" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">these later is a migration against live data</text>
<rect x="72" y="286" width="536" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="286" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="96" y="318" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Identifiers and tenancy</text><text x="96" y="344" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">retrofitting an owner column onto an established</text><text x="96" y="370" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">schema is one of the worst projects available</text>
<rect x="72" y="398" width="536" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="398" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="96" y="430" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The audit and event record</text><text x="96" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">add it later and the history before the change</text><text x="96" y="482" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">does not exist. Unrecoverable rather than absent</text>
<rect x="72" y="510" width="536" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="72" y="510" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="96" y="542" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Where money is recorded</text><text x="96" y="568" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reconstructing a ledger from a provider after a</text><text x="96" y="594" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">year is possible and painful</text>
<rect x="680" y="118" width="520" height="510" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M694 118H686A6 6 0 0 0 680 124V622A6 6 0 0 0 686 628H694Z" fill="#39D5AA"/><text x="710" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Cheap to change</text>
<rect x="712" y="174" width="456" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="940" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the cache</text>
<rect x="712" y="232" width="456" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="940" y="261" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the search backend</text>
<rect x="712" y="290" width="456" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="940" y="319" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the queue</text>
<rect x="712" y="348" width="456" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="940" y="377" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the number of services</text>
<rect x="712" y="406" width="456" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="940" y="435" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the hosting arrangement</text>
<rect x="712" y="464" width="456" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="940" y="493" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the region layout</text>
<text x="940" y="552" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">all changeable in weeks, because none of them</text><text x="940" y="577" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">is the shape of the data</text>
<rect x="40" y="662" width="1160" height="110" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="662" width="5" height="110" rx="2.5" fill="#AC8BE8"/><text x="64" y="710" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Be conservative about the shape of the data and liberal about everything around it</text><text x="64" y="736" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">That is more useful than a general preference for simplicity, because it says where the care belongs</text>
<text x="66" y="832" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The cheap list is longer than people expect.</text>
</svg>