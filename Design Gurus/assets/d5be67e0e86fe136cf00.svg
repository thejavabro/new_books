<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-label="The three signals: metrics tell you something is wrong, logs tell you what happened on one request, and traces tell you where the time went across services.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="560" fill="#FFFFFF"/>
  <rect x="40" y="48" width="373" height="300" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="48" width="373" height="8" rx="4" fill="#3B82F6"/>
  <text x="226.5" y="96" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Metrics</text>
  <text x="226.5" y="126" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Numbers over time</text>
  <rect x="80" y="160" width="293" height="110" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M94 230 L131.85714285714286 226 L169.71428571428572 232.4 L207.57142857142856 222 L245.42857142857142 227.6 L283.2857142857143 224.4 L321.1428571428571 186 L359 182 " fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="90" y1="198" x2="363" y2="198" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="226.5" y="294" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">p99 latency, error rate</text>
  <text x="226.5" y="330" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Something is wrong</text>
  <rect x="433" y="48" width="373" height="300" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="433" y="48" width="373" height="8" rx="4" fill="#059669"/>
  <text x="619.5" y="96" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Logs</text>
  <text x="619.5" y="126" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">What happened, per event</text>
  <rect x="459" y="160" width="321" height="110" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="477" y="186" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">12:04:01  order 88 ok</text>
  <text x="477" y="212" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">12:04:02  order 89 ok</text>
  <text x="477" y="238" font-size="20" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">12:04:03  order 90 FAILED</text>
  <text x="477" y="264" font-size="20" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">12:04:03  timeout on billing</text>
  <text x="619.5" y="294" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">one line per event</text>
  <text x="619.5" y="330" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">What exactly happened</text>
  <rect x="826" y="48" width="373" height="300" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="826" y="48" width="373" height="8" rx="4" fill="#6D28D9"/>
  <text x="1012.5" y="96" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Traces</text>
  <text x="1012.5" y="126" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One request across services</text>
  <rect x="942" y="160" width="227" height="18" rx="5" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="932" y="175" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">gateway</text>
  <rect x="969.24" y="188" width="181.60000000000002" height="18" rx="5" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="932" y="203" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">order svc</text>
  <rect x="1010.1" y="216" width="140.74" height="18" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="932" y="231" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">billing</text>
  <rect x="1023.72" y="244" width="45.400000000000006" height="18" rx="5" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
  <text x="932" y="259" font-size="20" fill="#64748B" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">db</text>
  <text x="1012.5" y="294" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">billing is the slow one</text>
  <text x="1012.5" y="330" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Where the time went</text>
  <rect x="40" y="372" width="1160" height="82" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="408" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Name the two or three numbers you would watch for this system, not a generic list.</text>
  <text x="70" y="438" font-size="20" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">For a URL shortener: redirect latency at the ninety-ninth percentile, cache hit rate, and errors on link creation.</text>
  <rect x="40" y="472" width="1160" height="68" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="513" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Metrics find the problem, traces find the service, logs find the cause. You want all three, and in that order.</text>
</svg>