<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Filtering candidate nouns down to classes">
  <defs>
    <marker id="oodi3-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oodi3-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oodi3-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oodi3-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oodi3-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oodi3-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oodi3-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oodi3-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oodi3-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oodi3-in"><rect x="44" y="236" width="232" height="96" rx="12"/></clipPath>
    <clipPath id="oodi3-t0"><rect x="344" y="92" width="552" height="56" rx="12"/></clipPath>
    <clipPath id="oodi3-t1"><rect x="344" y="180" width="552" height="56" rx="12"/></clipPath>
    <clipPath id="oodi3-t2"><rect x="344" y="268" width="552" height="56" rx="12"/></clipPath>
    <clipPath id="oodi3-t3"><rect x="344" y="356" width="552" height="56" rx="12"/></clipPath>
    <clipPath id="oodi3-t4"><rect x="344" y="444" width="552" height="56" rx="12"/></clipPath>
    <clipPath id="oodi3-outc"><rect x="964" y="236" width="232" height="96" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
  <g filter="url(#oodi3-soft)">
    <rect x="44" y="236" width="232" height="96" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="236" width="6" height="96" fill="#64748B" clip-path="url(#oodi3-in)"/>
  </g>
  <circle cx="82" cy="284.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="290.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">?</text>
  <text x="112" y="290.5" font-size="18.5" font-weight="600" fill="#111827">About 22 nouns</text>
  <text x="160" y="358" text-anchor="middle" font-size="15.5" fill="#6B7280">underlined in the</text>
  <text x="160" y="382" text-anchor="middle" font-size="15.5" fill="#94A3B8">requirement list</text>
  <rect x="320" y="62" width="600" height="470" rx="16" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="338" y="50" font-size="16.5" font-weight="600" fill="#BE185D">Five tests, each one removes candidates</text>
  <g filter="url(#oodi3-soft)">
    <rect x="344" y="92" width="552" height="56" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="344" y="92" width="6" height="56" fill="#DB2777" clip-path="url(#oodi3-t0)"/>
  </g>
  <circle cx="382" cy="120.0" r="18" fill="#FFFFFF"/>
  <text x="382" y="126.5" font-size="17" font-weight="700" text-anchor="middle" fill="#DB2777">1</text>
  <text x="412" y="126.5" font-size="18.5" font-weight="600" fill="#111827">Is it a value, not a thing?</text>
  <text x="368" y="170" font-size="15.5" fill="#94A3B8">an hour is a number, cash is an enum</text>
  <g filter="url(#oodi3-soft)">
    <rect x="344" y="180" width="552" height="56" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="344" y="180" width="6" height="56" fill="#DB2777" clip-path="url(#oodi3-t1)"/>
  </g>
  <circle cx="382" cy="208.0" r="18" fill="#FFFFFF"/>
  <text x="382" y="214.5" font-size="17" font-weight="700" text-anchor="middle" fill="#DB2777">2</text>
  <text x="412" y="214.5" font-size="18.5" font-weight="600" fill="#111827">Is it the same thing renamed?</text>
  <text x="368" y="258" font-size="15.5" fill="#94A3B8">customer and driver are one actor</text>
  <g filter="url(#oodi3-soft)">
    <rect x="344" y="268" width="552" height="56" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="344" y="268" width="6" height="56" fill="#DB2777" clip-path="url(#oodi3-t2)"/>
  </g>
  <circle cx="382" cy="296.0" r="18" fill="#FFFFFF"/>
  <text x="382" y="302.5" font-size="17" font-weight="700" text-anchor="middle" fill="#DB2777">3</text>
  <text x="412" y="302.5" font-size="18.5" font-weight="600" fill="#111827">Does its state ever change?</text>
  <text x="368" y="346" font-size="15.5" fill="#94A3B8">a spot is free or taken, an hour is not</text>
  <g filter="url(#oodi3-soft)">
    <rect x="344" y="356" width="552" height="56" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="344" y="356" width="6" height="56" fill="#DB2777" clip-path="url(#oodi3-t3)"/>
  </g>
  <circle cx="382" cy="384.0" r="18" fill="#FFFFFF"/>
  <text x="382" y="390.5" font-size="17" font-weight="700" text-anchor="middle" fill="#DB2777">4</text>
  <text x="412" y="390.5" font-size="18.5" font-weight="600" fill="#111827">Does anything call it?</text>
  <text x="368" y="434" font-size="15.5" fill="#94A3B8">a class nobody asks is a field</text>
  <g filter="url(#oodi3-lift)">
    <rect x="344" y="444" width="552" height="56" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="344" y="444" width="6" height="56" fill="#D97706" clip-path="url(#oodi3-t4)"/>
  </g>
  <circle cx="382" cy="472.0" r="18" fill="#FFFFFF"/>
  <text x="382" y="478.5" font-size="17" font-weight="700" text-anchor="middle" fill="#D97706">5</text>
  <text x="412" y="478.5" font-size="18.5" font-weight="600" fill="#111827">Different behaviour, or only data?</text>
  <text x="368" y="522" font-size="15.5" fill="#94A3B8">removes more than the other four</text>
  <g filter="url(#oodi3-soft)">
    <rect x="964" y="236" width="232" height="96" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="964" y="236" width="6" height="96" fill="#059669" clip-path="url(#oodi3-outc)"/>
  </g>
  <circle cx="1002" cy="284.0" r="18" fill="#FFFFFF"/>
  <text x="1002" y="290.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">=</text>
  <text x="1032" y="290.5" font-size="18.5" font-weight="600" fill="#111827">About 12 classes</text>
  <text x="1080" y="358" text-anchor="middle" font-size="15.5" fill="#6B7280">each with one job</text>
  <text x="1080" y="382" text-anchor="middle" font-size="15.5" fill="#94A3B8">you can say in a sentence</text>
  <path d="M276,284 L344,284" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi3-arrow-slate)"/>
  <path d="M896,284 L964,284" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oodi3-arrow-emerald)"/>
  <text x="620" y="570" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">Different data means a field. Different behaviour means a class.</text>
</svg>