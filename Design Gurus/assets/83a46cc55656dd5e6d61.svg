<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="third-title third-desc">
<title id="third-title">The third envelope</title>
<desc id="third-desc">Traffic and data are estimated before committing to a design. Cost is the third envelope and is almost never computed, although it decides which designs survive.</desc>
<defs>
<marker id="third-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="third-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="third-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="third-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="702" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The third envelope</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Cost is the third envelope and is almost never computed, although it decides which designs survive.</text>
<rect x="40" y="624" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="624" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V284A6 6 0 0 0 46 290H54Z" fill="#5EC9EC"/>
<circle cx="226" cy="154" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="226" y="162" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="226" y="206" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Traffic</text>
<text x="226" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">how much the system has to absorb</text>
<rect x="40" y="302" width="372" height="46" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="332" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">usually</text><text x="396" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">computed</text>
<rect x="434" y="118" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V284A6 6 0 0 0 440 290H448Z" fill="#39D5AA"/>
<circle cx="620" cy="154" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="162" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="620" y="206" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Data</text>
<text x="620" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">how much it has to hold</text>
<rect x="434" y="302" width="372" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="450" y="332" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">usually</text><text x="790" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">computed</text>
<rect x="828" y="118" width="372" height="172" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V284A6 6 0 0 0 834 290H842Z" fill="#F28B9D"/>
<circle cx="1014" cy="154" r="21" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1014" y="162" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1014" y="206" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Cost</text>
<text x="1014" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">what it bills every month</text>
<rect x="828" y="302" width="372" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="844" y="332" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">usually</text><text x="1184" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">skipped</text>
<rect x="40" y="372" width="1160" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="372" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="408" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Cost is the constraint that decides which designs are allowed to exist</text><text x="64" y="434" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A design costing ten times what the feature earns is not a design.</text><text x="64" y="460" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It is a proposal that gets rejected later, after the work is done.</text>
<rect x="40" y="508" width="1160" height="90" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="508" width="5" height="90" rx="2.5" fill="#39D5AA"/><text x="64" y="546" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">You do not need accuracy. You need the order of magnitude and the dominant line.</text><text x="64" y="572" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Hundreds, thousands, or hundreds of thousands, and which decision caused most of it</text>
<text x="66" y="658" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Both are reachable in about three minutes, which is the whole reason to do it.</text>
</svg>