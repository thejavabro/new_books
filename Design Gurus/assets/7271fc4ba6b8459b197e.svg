<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1120" viewBox="0 0 1240 1120" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Migration wave plan: wave 1 extracts Notifications or Reviews, then a checkpoint asks whether the playbook is proven. No sends the team to fix pipelines, tracing, and contract tests and repeat the same wave. Yes escalates to wave 2, Search, read heavy. A second checkpoint asks whether the evidence still pays. Yes escalates to wave 3, Booking and Payments. No stops the migration with services around a healthy core.">
  <defs>
    <marker id="m07-l10-wave-plan-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l10-wave-plan-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l10-wave-plan-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l10-wave-plan-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1120" fill="#FFFFFF"/>

  <rect x="50" y="180" width="1150" height="210" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="215" font-size="20" font-weight="600" fill="#334155">Escalate deliberately: each wave carries more risk than the last</text>

  <g filter="url(#m07-l10-wave-plan-soft)">
    <rect x="60" y="230" width="300" height="140" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="210" y="291" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Wave 1: Notifications</text>
  <text x="210" y="323" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">or Reviews</text>
  <g filter="url(#m07-l10-wave-plan-soft)">
    <path d="M580,220 L750,300 L580,380 L410,300 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="580" y="291" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The playbook</text>
  <text x="580" y="323" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">is proven?</text>
  <g filter="url(#m07-l10-wave-plan-soft)">
    <rect x="830" y="230" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="980" y="291" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Wave 2: Search,</text>
  <text x="980" y="323" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">read heavy</text>

  <g filter="url(#m07-l10-wave-plan-soft)">
    <path d="M1010,520 L1190,600 L1010,680 L830,600 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="1010" y="591" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The evidence</text>
  <text x="1010" y="623" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">still pays?</text>
  <g filter="url(#m07-l10-wave-plan-soft)">
    <rect x="60" y="530" width="420" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="270" y="591" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fix the pipelines, tracing,</text>
  <text x="270" y="623" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">and the contract tests</text>

  <g filter="url(#m07-l10-wave-plan-soft)">
    <rect x="830" y="800" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="980" y="861" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Wave 3: Booking</text>
  <text x="980" y="893" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">and Payments</text>
  <g filter="url(#m07-l10-wave-plan-soft)">
    <rect x="60" y="800" width="440" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="280" y="861" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Stop: services around</text>
  <text x="280" y="893" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">a healthy core</text>

  <g fill="none" stroke-width="2.5">
    <path d="M360,300 L402,300" stroke="#475569" stroke-width="2" marker-end="url(#m07-l10-wave-plan-sl)"/>
    <path d="M750,300 L822,300" stroke="#059669" marker-end="url(#m07-l10-wave-plan-em)"/>
    <path d="M980,370 L980,512" stroke="#475569" stroke-width="2" marker-end="url(#m07-l10-wave-plan-sl)"/>
    <path d="M1010,680 L1010,792" stroke="#059669" marker-end="url(#m07-l10-wave-plan-em)"/>
    <path d="M580,380 L580,450 L270,450 L270,522" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l10-wave-plan-rd)"/>
    <path d="M900,680 L900,730 L280,730 L280,792" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l10-wave-plan-rd)"/>
    <path d="M60,600 L40,600 L40,160 L210,160 L210,222" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l10-wave-plan-sl)"/>
  </g>

  <text x="786" y="275" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="1030" y="740" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="600" y="438" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="920" y="718" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="1000" y="450" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">wave 2 ships</text>
  <text x="480" y="148" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">close the gaps, then prove it again</text>

  <line x1="60" y1="1000" x2="96" y2="1000" stroke="#475569" stroke-width="4"/>
  <text x="108" y="1007" font-size="20" fill="#475569">A wave ships, and then the checkpoint runs</text>
  <line x1="60" y1="1040" x2="96" y2="1040" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1047" font-size="20" fill="#475569">Yes: escalate to the next wave</text>
  <line x1="60" y1="1080" x2="96" y2="1080" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1087" font-size="20" fill="#475569">No: this wave does not go ahead</text>
</svg>