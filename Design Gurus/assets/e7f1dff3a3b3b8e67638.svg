    <filter id="m06e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m06e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m06e-k1"><rect x="64" y="361" width="220" height="100" rx="12"/></clipPath>
    <clipPath id="m06e-k2"><rect x="804" y="240" width="348" height="80" rx="12"/></clipPath>
    <clipPath id="m06e-k3"><rect x="804" y="486" width="348" height="80" rx="12"/></clipPath>
    <clipPath id="m06e-k4"><rect x="64" y="895" width="220" height="100" rx="12"/></clipPath>
