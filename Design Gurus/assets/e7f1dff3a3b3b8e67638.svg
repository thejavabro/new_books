  <g filter="url(#m06e-soft)">
    <rect x="64" y="895" width="220" height="100" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="895" width="6" height="100" fill="#2563EB" clip-path="url(#m06e-k4)"/>
  </g>
  <circle cx="102" cy="945" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,934.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="128" y="939.25" font-size="21.5" font-weight="600" fill="#111827">Checkout</text>
  <text x="128" y="964.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
