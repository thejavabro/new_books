  <text x="128" y="405.25" font-size="21.5" font-weight="600" fill="#111827">Checkout</text>
  <text x="128" y="430.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
  <g filter="url(#m06e-soft)">
    <rect x="804" y="240" width="348" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
