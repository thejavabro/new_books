    <marker id="m06e-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m06e-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1190" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Tight coupling vs. loose coupling in SOA</text>


  <rect x="40" y="110" width="1160" height="504" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#BE185D">Tight coupling: services depend on each other's internal details.</text>
  <rect x="780" y="160" width="396" height="430" rx="14" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="804" y="190" font-size="19.5" font-weight="600" fill="#BE185D">Order service</text>
  <rect x="40" y="644" width="1160" height="504" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="674" font-size="19.5" font-weight="600" fill="#047857">Loose coupling (SOA): services interact through well-defined contracts.</text>
  <rect x="780" y="694" width="396" height="430" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="804" y="724" font-size="19.5" font-weight="600" fill="#047857">Order service</text>
  <rect x="450" y="835" width="270" height="196" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="474" y="865" font-size="19.5" font-weight="600" fill="#5B21B6">Order service contract</text>

  <g fill="none" stroke-width="2">
    <path d="M284,386 H400 Q420,386 420,366 V300 Q420,280 440,280 H804" stroke="#DB2777" marker-end="url(#m06e-m-pink)"/>
    <path d="M284,411 H880" stroke="#DB2777" marker-end="url(#m06e-m-pink)"/>
    <path d="M284,436 H400 Q420,436 420,456 V506 Q420,526 440,526 H804" stroke="#DB2777" marker-end="url(#m06e-m-pink)"/>
    <path d="M284,945 H450" stroke="#2563EB" marker-end="url(#m06e-m-blue)"/>
    <path d="M720,945 H780" stroke="#2563EB" marker-end="url(#m06e-m-blue)"/>
    <path d="M474,885 H696" stroke="#7C3AED"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="610" y="268" fill="#BE185D">Calls internal methods</text>
    <text x="590" y="399" fill="#BE185D">Accesses database directly</text>
    <text x="610" y="514" fill="#BE185D">Depends on internal data model</text>
    <text x="367" y="909" fill="#1D4ED8">Uses service</text>
    <text x="367" y="933" fill="#1D4ED8">contract</text>
    <text x="367" y="970" fill="#1D4ED8">(for example,</text>
    <text x="367" y="994" fill="#1D4ED8">OpenAPI or</text>
    <text x="367" y="1018" fill="#1D4ED8">WSDL)</text>
  </g>

