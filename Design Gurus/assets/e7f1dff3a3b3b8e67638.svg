<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Tight coupling: a checkout service calls the internal methods of the order application code, accesses the order database directly and depends on the internal data model. Loose coupling: the checkout service uses the order service contract, for example OpenAPI or WSDL, with GET /orders/{id}, POST /orders and PUT /orders/{id}, and only the contract reaches the order service">
