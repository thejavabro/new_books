  <g transform="translate(831.56,1049.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="868" y="1067" font-size="21.5" font-weight="600" fill="#111827">Internal data model</text>
