<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="moment-title moment-desc">
<title id="moment-title">The moment, and what it is worth</title>
<desc id="moment-desc">Most candidates experience this as the interview going wrong. It is closer to the opposite, and the instinctive responses are all bad in predictable ways.</desc>
<defs>
<marker id="moment-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="moment-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="moment-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="moment-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="800" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The moment, and what it is worth</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Most candidates experience this as the interview going wrong. It is closer to the opposite.</text>
<rect x="40" y="722" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="722" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="149.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Finding a hole in your own design, and handling it well,</text><text x="64" y="178.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">is a stronger signal than never having one.</text>
<rect x="40" y="210" width="1160" height="62" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="233.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What is assessed is not whether the first attempt was right.</text><text x="620" y="260.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It is what you do with new information</text>
<text x="40" y="306" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The four instinctive responses, all bad</text>
<rect x="40" y="324" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="358" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Pretending it is fine</text>
<path d="M526 352H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 352H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#moment-marker-slate)"/>
<rect x="570" y="324" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="345.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the interviewer usually noticed first, and is now</text><text x="590" y="370.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">watching you defend it</text>
<rect x="40" y="392" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="426" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Silent repair</text>
<path d="M526 420H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 420H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#moment-marker-slate)"/>
<rect x="570" y="392" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="413.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">leaves them unsure which version is current</text><text x="590" y="438.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and whether you knew</text>
<rect x="40" y="460" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="494" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Collapse</text>
<path d="M526 488H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 488H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#moment-marker-slate)"/>
<rect x="570" y="460" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="494" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">performing worse for twenty minutes than the error warranted</text>
<rect x="40" y="528" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="562" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Full restart</text>
<path d="M526 556H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 556H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#moment-marker-slate)"/>
<rect x="570" y="528" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="549.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">spends the time you had left and discards</text><text x="590" y="574.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the parts that were correct</text>
<rect x="40" y="614" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="614" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="645.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Every senior engineer has shipped a design that turned out to be wrong.</text><text x="64" y="674.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The ones worth hiring noticed and said so.</text>
<text x="66" y="756" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Nobody designs correctly under time pressure with incomplete requirements, and the interviewer knows that.</text>
</svg>