<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Breaker states for one notification provider: healthy sending, then failing as provider errors climb, then breaker open once the failure threshold is crossed, then either failover to a second provider or park the queue, then probing when the primary is retried later, which returns to healthy if the probe succeeds and re-opens the breaker if the probe fails.">
  <defs>
    <marker id="m07-l09-provider-breaker-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l09-provider-breaker-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l09-provider-breaker-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l09-provider-breaker-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l09-provider-breaker-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l09-provider-breaker-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1180" fill="#FFFFFF"/>

  <rect x="40" y="140" width="1160" height="840" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="182" font-size="20" font-weight="600" fill="#334155">One breaker per provider: SMS, email, push</text>

  <g filter="url(#m07-l09-provider-breaker-soft)">
    <rect x="80" y="250" width="300" height="140" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="230" y="311" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Healthy</text>
  <text x="230" y="343" text-anchor="middle" font-size="20" fill="#64748B">sending normally</text>
  <g filter="url(#m07-l09-provider-breaker-soft)">
    <rect x="470" y="250" width="300" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="620" y="311" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Failing</text>
  <text x="620" y="343" text-anchor="middle" font-size="20" fill="#64748B">errors are climbing</text>
  <g filter="url(#m07-l09-provider-breaker-soft)">
    <rect x="860" y="250" width="300" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1010" y="311" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Breaker open</text>
  <text x="1010" y="343" text-anchor="middle" font-size="20" fill="#64748B">stop calling it</text>
  <g filter="url(#m07-l09-provider-breaker-soft)">
    <rect x="560" y="530" width="280" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="700" y="591" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Failover</text>
  <text x="700" y="623" text-anchor="middle" font-size="20" fill="#64748B">a second provider</text>
  <g filter="url(#m07-l09-provider-breaker-soft)">
    <rect x="880" y="530" width="280" height="140" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="1020" y="591" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Parked</text>
  <text x="1020" y="623" text-anchor="middle" font-size="20" fill="#64748B">the queue holds it</text>
  <g filter="url(#m07-l09-provider-breaker-soft)">
    <rect x="720" y="800" width="300" height="140" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="870" y="861" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Probing</text>
  <text x="870" y="893" text-anchor="middle" font-size="20" fill="#64748B">one careful retry</text>
  <g filter="url(#m07-l09-provider-breaker-soft)">
    <rect x="80" y="530" width="420" height="140" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  </g>
  <text x="290" y="575" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Either way, the queue absorbs it</text>
  <text x="290" y="607" text-anchor="middle" font-size="20" fill="#92400E">A provider down for an hour becomes</text>
  <text x="290" y="639" text-anchor="middle" font-size="20" fill="#92400E">an incident nobody outside notices.</text>

  <g fill="none" stroke-width="2.5">
    <path d="M60,320 L72,320" stroke="#475569" stroke-width="2" marker-end="url(#m07-l09-provider-breaker-sl)"/>
    <path d="M380,320 L462,320" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l09-provider-breaker-rd)"/>
    <path d="M770,320 L852,320" stroke="#DC2626" marker-end="url(#m07-l09-provider-breaker-rd)"/>
    <path d="M960,390 C960,460 700,470 700,522" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l09-provider-breaker-bl)"/>
    <path d="M1060,390 L1060,522" stroke="#D97706" stroke-width="2" marker-end="url(#m07-l09-provider-breaker-ab)"/>
    <path d="M760,670 C760,740 810,740 810,792" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l09-provider-breaker-sl)"/>
    <path d="M1020,670 C1020,740 940,740 940,792" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l09-provider-breaker-sl)"/>
    <path d="M720,870 L60,870 L60,320 L72,320" stroke="#059669" marker-end="url(#m07-l09-provider-breaker-em)"/>
    <path d="M1020,870 L1200,870 L1200,320 L1168,320" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l09-provider-breaker-rd)"/>
  </g>

  <circle cx="48" cy="320" r="12" fill="#475569"/>

  <text x="421" y="222" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">provider errors climb</text>
  <text x="811" y="222" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the threshold is crossed</text>
  <text x="740" y="450" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a second provider</text>
  <text x="1150" y="490" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no second provider</text>
  <text x="600" y="740" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">retry the primary later</text>
  <text x="450" y="850" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the probe succeeds</text>
  <text x="1180" y="918" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the probe fails</text>

  <line x1="60" y1="1040" x2="96" y2="1040" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1047" font-size="20" fill="#475569">Failure: errors climb, the breaker trips or re-opens</text>
  <line x1="60" y1="1080" x2="96" y2="1080" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1087" font-size="20" fill="#475569">Failover: live sends move to the second provider</text>
  <line x1="60" y1="1120" x2="96" y2="1120" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="1127" font-size="20" fill="#475569">Park: the queue holds the work until the provider is back</text>
  <line x1="60" y1="1160" x2="96" y2="1160" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1167" font-size="20" fill="#475569">Recovery: the probe passes, and sending resumes</text>
</svg>