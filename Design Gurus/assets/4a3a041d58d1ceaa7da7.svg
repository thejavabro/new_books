<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="626" viewBox="0 0 1240 626" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two bars drawn to scale against a dashed target line at 800 ms. Before: 30 Menu queries take 1,800 ms, the saved-cards call to the payment provider 420 ms and everything else 180 ms, a total of 2,400 ms. After, as an estimate: one Menu query takes about 60 ms, the saved-cards call to the payment provider 420 ms and everything else 180 ms, a total of about 660 ms, under the target.">
  <defs>
    <filter id="md03d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md03d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="626" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Where a slow checkout spends its time</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One checkout at the p95, drawn to scale, before batching the Menu queries and after.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>



  <path d="M520,136 V446" stroke="#DB2777" stroke-width="2" stroke-dasharray="7 6" fill="none"/>
  <text x="520" y="126" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Target: 800 ms</text>
  <rect x="200" y="166" width="720" height="64" rx="6" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="560" y="205" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">30 Menu queries: 1,800</text>
  <rect x="920" y="166" width="168" height="64" rx="6" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="1004" y="205" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Saved cards 420</text>
  <rect x="1088" y="166" width="72" height="64" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="1124" y="205" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">180</text>
  <text x="1160" y="262" text-anchor="end" font-size="19.5" font-weight="700" fill="#111827">Total: 2,400 ms</text>
  <rect x="200" y="316" width="24" height="64" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <rect x="224" y="316" width="168" height="64" rx="6" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="308" y="355" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Saved cards 420</text>
  <rect x="392" y="316" width="72" height="64" rx="6" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="428" y="355" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">180</text>
  <text x="544" y="355" font-size="19.5" font-weight="700" fill="#111827">Total: about 660 ms (estimate)</text>
  <text x="200" y="412" font-size="18.5" font-weight="600" fill="#047857">Menu: 1 query, about 60</text>
  <text x="40" y="205" font-size="21.5" font-weight="700" fill="#111827">Before</text>
  <text x="40" y="355" font-size="21.5" font-weight="700" fill="#111827">After</text>
