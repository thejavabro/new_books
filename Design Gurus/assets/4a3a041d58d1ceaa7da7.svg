  <path d="M200,446 V454" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <text x="200" y="478" text-anchor="middle" font-size="18.5" fill="#6B7280">0</text>
  <path d="M520,446 V454" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <text x="520" y="478" text-anchor="middle" font-size="18.5" fill="#6B7280">800 ms</text>
  <path d="M840,446 V454" stroke="#94A3B8" stroke-width="1.5" fill="none"/>
  <text x="840" y="478" text-anchor="middle" font-size="18.5" fill="#6B7280">1,600 ms</text>
