<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of the dual-write crash window. Checkout commits the order row to its database in a local transaction, the process crashes, the publish of the order placed event to the broker never happens, so the order exists in the database while no consumer is ever told.">
  <defs>
    <marker id="m05-l03-dual-write-failure-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l03-dual-write-failure-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l03-dual-write-failure-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="950" fill="#FFFFFF"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="230" y1="145" x2="230" y2="300"/>
    <line x1="630" y1="145" x2="630" y2="520"/>
    <line x1="1035" y1="145" x2="1035" y2="520"/>
  </g>
  <line x1="230" y1="345" x2="230" y2="520" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.55"/>

  <g fill="none" stroke-width="2.5">
    <path d="M236,230 L624,230" stroke="#3B82F6" marker-end="url(#m05-l03-dual-write-failure-bl)"/>
    <path d="M236,460 L1000,460" stroke="#DC2626" stroke-dasharray="6 5" opacity="0.6"/>
  </g>
  <g stroke="#DC2626" stroke-width="3.5" stroke-linecap="round">
    <line x1="1012" y1="447" x2="1038" y2="473"/>
    <line x1="1038" y1="447" x2="1012" y2="473"/>
    <line x1="215" y1="307" x2="245" y2="337"/>
    <line x1="245" y1="307" x2="215" y2="337"/>
  </g>

  <text x="430" y="212" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Write 1: commit the order row</text>
  <text x="620" y="412" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Write 2: publish the event</text>
  <text x="620" y="438" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">never happens, nothing is left running</text>

  <g filter="url(#m05-l03-dual-write-failure-soft)">
    <rect x="300" y="280" width="400" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="500" y="321" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Crash here</text>
  <text x="500" y="353" text-anchor="middle" font-size="20" fill="#64748B">nothing after this line runs</text>

  <rect x="430" y="560" width="750" height="250" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="452" y="600" font-size="20" font-weight="600" fill="#B91C1C">The order exists. The world was never told.</text>
  <text x="452" y="632" font-size="20" fill="#64748B">a rare crash becomes a steady leak</text>
  <g filter="url(#m05-l03-dual-write-failure-soft)">
    <rect x="452" y="660" width="340" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="622" y="700" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order row: committed</text>
  <text x="622" y="732" text-anchor="middle" font-size="20" fill="#64748B">durable and real,</text>
  <text x="622" y="764" text-anchor="middle" font-size="20" fill="#64748B">no way to take it back</text>
  <g filter="url(#m05-l03-dual-write-failure-soft)">
    <rect x="812" y="660" width="346" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="985" y="700" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">No event published</text>
  <text x="985" y="732" text-anchor="middle" font-size="20" fill="#64748B">fulfillment never ships,</text>
  <text x="985" y="764" text-anchor="middle" font-size="20" fill="#64748B">no email is ever sent</text>

  <text x="60" y="600" font-size="20" font-weight="600" fill="#334155">The structural cause</text>
  <text x="60" y="632" font-size="20" fill="#64748B">reordering only picks the failure</text>
  <g filter="url(#m05-l03-dual-write-failure-soft)">
    <rect x="60" y="660" width="340" height="130" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="230" y="700" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Two systems,</text>
  <text x="230" y="732" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">two writes, and no</text>
  <text x="230" y="764" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">shared transaction</text>

  <g filter="url(#m05-l03-dual-write-failure-soft)">
    <rect x="110" y="50" width="240" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="230" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">order service</text>
  <g filter="url(#m05-l03-dual-write-failure-soft)">
    <rect x="480" y="50" width="300" height="95" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="630" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Database</text>
  <text x="630" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">one local transaction</text>
  <g filter="url(#m05-l03-dual-write-failure-soft)">
    <rect x="890" y="50" width="290" height="95" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1035" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="1035" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">carries events onward</text>

  <line x1="60" y1="870" x2="96" y2="870" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="877" font-size="20" fill="#475569">A write that commits and survives the crash</text>
  <line x1="60" y1="910" x2="96" y2="910" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="917" font-size="20" fill="#475569">The write to the second system that never happens</text>
</svg>