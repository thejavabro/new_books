<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Advantages: business rules tested with in-memory adapters and no running infrastructure, one new adapter per new driving mechanism, and one new driven adapter to replace a database or payment provider. Limitations: more structure, since every external dependency needs a port, an adapter and a line in the composition root; the rule that the domain imports nothing from outside must be enforced; and the pattern adds cost without benefit when there are few business rules">
  <defs>
    <filter id="m10l-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m10l-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m10l-k1"><rect x="64" y="200" width="512" height="70" rx="12"/></clipPath>
    <clipPath id="m10l-k2"><rect x="64" y="356" width="512" height="70" rx="12"/></clipPath>
    <clipPath id="m10l-k3"><rect x="64" y="512" width="512" height="70" rx="12"/></clipPath>
    <clipPath id="m10l-k6"><rect x="664" y="200" width="512" height="70" rx="12"/></clipPath>
    <clipPath id="m10l-k7"><rect x="664" y="356" width="512" height="70" rx="12"/></clipPath>
    <clipPath id="m10l-k8"><rect x="664" y="512" width="512" height="70" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="708" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Hexagonal architecture: advantages and limitations</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What ports and adapters give the team, and what they cost it.</text>


  <rect x="40" y="120" width="560" height="548" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Advantages</text>
  <rect x="640" y="120" width="560" height="548" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#BE185D">Limitations</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m10l-soft)">
    <rect x="64" y="200" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="200" width="6" height="70" fill="#059669" clip-path="url(#m10l-k1)"/>
  </g>
  <circle cx="102" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,224.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="128" y="242" font-size="21.5" font-weight="600" fill="#111827">Tests without infrastructure</text>
  <g filter="url(#m10l-soft)">
    <rect x="64" y="356" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="356" width="6" height="70" fill="#059669" clip-path="url(#m10l-k2)"/>
  </g>
  <circle cx="102" cy="391" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,380.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="128" y="398" font-size="21.5" font-weight="600" fill="#111827">One adapter per new driving mechanism</text>
  <g filter="url(#m10l-soft)">
    <rect x="64" y="512" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="512" width="6" height="70" fill="#059669" clip-path="url(#m10l-k3)"/>
  </g>
  <circle cx="102" cy="547" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,536.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="554" font-size="21.5" font-weight="600" fill="#111827">One adapter to replace a provider</text>
  <g filter="url(#m10l-soft)">
    <rect x="664" y="200" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="200" width="6" height="70" fill="#DB2777" clip-path="url(#m10l-k6)"/>
  </g>
  <circle cx="702" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,224.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="728" y="242" font-size="21.5" font-weight="600" fill="#111827">More structure</text>
  <g filter="url(#m10l-soft)">
    <rect x="664" y="356" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="356" width="6" height="70" fill="#DB2777" clip-path="url(#m10l-k7)"/>
  </g>
  <circle cx="702" cy="391" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,380.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a5 5 0 0 1 3.5 4.8V20"/></g>
  <text x="728" y="398" font-size="21.5" font-weight="600" fill="#111827">The import rule must be enforced</text>
  <g filter="url(#m10l-soft)">
    <rect x="664" y="512" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="512" width="6" height="70" fill="#DB2777" clip-path="url(#m10l-k8)"/>
  </g>
  <circle cx="702" cy="547" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,536.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="728" y="554" font-size="21.5" font-weight="600" fill="#111827">No benefit with few business rules</text>
  <text x="320" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">Business rules are tested with in-memory</text>
  <text x="320" y="326" font-size="18.5" text-anchor="middle" fill="#6B7280">adapters and no running infrastructure.</text>
  <text x="320" y="455" font-size="18.5" text-anchor="middle" fill="#6B7280">A CLI command or a queue consumer is one new</text>
  <text x="320" y="482" font-size="18.5" text-anchor="middle" fill="#6B7280">adapter class, not a change to the domain.</text>
  <text x="320" y="611" font-size="18.5" text-anchor="middle" fill="#6B7280">A database or payment provider is replaced by</text>
  <text x="320" y="638" font-size="18.5" text-anchor="middle" fill="#6B7280">writing one new driven adapter.</text>
  <text x="920" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">Every external dependency needs a port, an adapter</text>
  <text x="920" y="326" font-size="18.5" text-anchor="middle" fill="#6B7280">and a line in the composition root.</text>
  <text x="920" y="455" font-size="18.5" text-anchor="middle" fill="#6B7280">Code review or an import-checking tool must keep</text>
  <text x="920" y="482" font-size="18.5" text-anchor="middle" fill="#6B7280">the domain free of outside imports.</text>
  <text x="920" y="611" font-size="18.5" text-anchor="middle" fill="#6B7280">It adds cost without benefit when there are</text>
  <text x="920" y="638" font-size="18.5" text-anchor="middle" fill="#6B7280">few business rules to protect.</text>




</svg>