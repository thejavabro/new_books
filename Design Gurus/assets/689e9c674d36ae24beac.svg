<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="User A writes v1 to replica R1, the copy to replica R2 is still in flight, so User B reads the old value from R2">
  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="qr1-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="qr1-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="qr1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="qr1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="170" y1="112" x2="170" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="470" y1="112" x2="470" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="770" y1="112" x2="770" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1070" y1="112" x2="1070" y2="700" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="178" y1="200" x2="462" y2="200" stroke="#3B82F6" stroke-width="2" marker-end="url(#qr1-blue)"/>
  <text x="320" y="176" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. User A writes v1 to R1</text>

  <line x1="478" y1="368" x2="762" y2="620" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#qr1-amber)"/>
  <text x="600" y="304" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. R1 starts copying v1 to R2</text>
  <text x="600" y="332" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the copy takes a moment</text>

  <line x1="1062" y1="486" x2="778" y2="486" stroke="#3B82F6" stroke-width="2" marker-end="url(#qr1-blue)"/>
  <text x="920" y="462" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. User B reads from R2</text>

  <line x1="778" y1="590" x2="1062" y2="590" stroke="#DC2626" stroke-width="2.5" marker-end="url(#qr1-red)"/>
  <text x="920" y="538" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. R2 returns the old value</text>
  <text x="920" y="566" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">not v1</text>

  
  <g filter="url(#qr1-soft)">
    <rect x="50" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="350" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="650" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="950" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="170" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User A</text>
  <text x="170" y="98" font-size="20" fill="#64748B" text-anchor="middle">writes the new value</text>
  <text x="470" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica R1</text>
  <text x="470" y="98" font-size="20" fill="#64748B" text-anchor="middle">accepts the write</text>
  <text x="770" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica R2</text>
  <text x="770" y="98" font-size="20" fill="#64748B" text-anchor="middle">copy not arrived yet</text>
  <text x="1070" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User B</text>
  <text x="1070" y="98" font-size="20" fill="#64748B" text-anchor="middle">reads the value</text>

  
  <g filter="url(#qr1-soft)">
    <rect x="370" y="224" width="200" height="40" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="470" y="251" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">R1 now holds v1</text>

  <g filter="url(#qr1-soft)">
    <rect x="605" y="370" width="330" height="40" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="770" y="397" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">R2 still holds the old value</text>

  <g filter="url(#qr1-soft)">
    <rect x="610" y="630" width="320" height="40" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="770" y="657" font-size="20" fill="#92400E" text-anchor="middle">v1 arrives a moment later</text>

  
  <rect x="240" y="740" width="760" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="771" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">User A sees v1. User B sees the old value.</text>
  <text x="620" y="799" font-size="20" fill="#64748B" text-anchor="middle">The replicas are out of sync. This is the problem quorum solves.</text>

  
  <line x1="194" y1="856" x2="222" y2="856" stroke="#3B82F6" stroke-width="3"/>
  <text x="232" y="863" font-size="20" fill="#475569">read or write request</text>
  <line x1="514" y1="856" x2="542" y2="856" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="552" y="863" font-size="20" fill="#475569">replication in progress</text>
  <line x1="854" y1="856" x2="882" y2="856" stroke="#DC2626" stroke-width="3"/>
  <text x="892" y="863" font-size="20" fill="#475569">stale response</text>
</svg>