<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="While a migration is part done, the legacy system and the new service both write the same business data. Three ways to handle it: keep one shared database, replicate one way from the legacy store to the new one, or have every write publish an event so each side keeps its own store">
  <defs>
    <marker id="sf3-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="sf3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sf3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sf3-kl"><rect x="100" y="110" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="sf3-kn"><rect x="860" y="110" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="sf3-k1"><rect x="72" y="418" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sf3-k2"><rect x="455" y="418" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sf3-k3"><rect x="838" y="418" width="330" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  
  <rect x="40" y="44" width="1160" height="270" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">While the migration is part done, the same business data has two writers</text>

  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M380,155 L512,155" marker-end="url(#sf3-pk)"/>
    <path d="M860,155 L728,155" marker-end="url(#sf3-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="446" y="148" fill="#BE185D">writes</text>
    <text x="794" y="148" fill="#BE185D">writes</text>
  </g>

  <g filter="url(#sf3-soft)">
    <rect x="100" y="110" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="100" y="110" width="6" height="90" fill="#64748B" clip-path="url(#sf3-kl)"/>
  </g>
  <circle cx="138" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="164" y="162" font-size="18.5" font-weight="600" fill="#111827">Legacy System</text>
  <text x="240" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">still serves /orders</text>
  <text x="240" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">and still writes customers</text>

  
  <g stroke="#DB2777" stroke-width="1.5">
    <path d="M520,120 L520,199 A100,16 0 0 0 720,199 L720,120" fill="#FCE7F3"/>
    <ellipse cx="620" cy="120" rx="100" ry="16" fill="#FDF2F8"/>
  </g>
  <text x="620" y="175" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Customer Data</text>
  <text x="620" y="240" font-size="15.5" text-anchor="middle" fill="#6B7280">one set of records</text>
  <text x="620" y="263" font-size="15.5" text-anchor="middle" fill="#94A3B8">two systems changing it</text>

  <g filter="url(#sf3-soft)">
    <rect x="860" y="110" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="110" width="6" height="90" fill="#059669" clip-path="url(#sf3-kn)"/>
  </g>
  <circle cx="898" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,144.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="924" y="162" font-size="18.5" font-weight="600" fill="#111827">New Service</text>
  <text x="1000" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">already serves /users</text>
  <text x="1000" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">and writes the same customers</text>

  
  <rect x="40" y="350" width="1160" height="270" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="380" font-size="16.5" font-weight="600" fill="#475569">Three ways to keep the two sides in step, cheapest first</text>

  <g filter="url(#sf3-soft)">
    <rect x="72" y="418" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="418" width="6" height="90" fill="#2563EB" clip-path="url(#sf3-k1)"/>
  </g>
  <circle cx="110" cy="463" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,452.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="136" y="470" font-size="18.5" font-weight="600" fill="#111827">Shared Database</text>
  <text x="237" y="533" font-size="15.5" text-anchor="middle" fill="#6B7280">both systems use one database</text>
  <text x="237" y="556" font-size="15.5" text-anchor="middle" fill="#94A3B8">nothing to keep in step</text>
  <text x="237" y="579" font-size="15.5" text-anchor="middle" fill="#94A3B8">the new service inherits the old schema</text>

  <g filter="url(#sf3-soft)">
    <rect x="455" y="418" width="330" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="455" y="418" width="6" height="90" fill="#7C3AED" clip-path="url(#sf3-k2)"/>
  </g>
  <circle cx="493" cy="463" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,452.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="519" y="470" font-size="18.5" font-weight="600" fill="#111827">One-Way Replication</text>
  <text x="620" y="533" font-size="15.5" text-anchor="middle" fill="#6B7280">legacy stays the source of truth</text>
  <text x="620" y="556" font-size="15.5" text-anchor="middle" fill="#94A3B8">changes are copied to the new store</text>
  <text x="620" y="579" font-size="15.5" text-anchor="middle" fill="#94A3B8">the new side only reads at first</text>

  <g filter="url(#sf3-lift)">
    <rect x="838" y="418" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="838" y="418" width="9" height="90" fill="#059669" clip-path="url(#sf3-k3)"/>
  </g>
  <circle cx="876" cy="463" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,452.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="902" y="470" font-size="18.5" font-weight="600" fill="#111827">Event Sync</text>
  <text x="1003" y="533" font-size="15.5" text-anchor="middle" fill="#6B7280">every write publishes an event</text>
  <text x="1003" y="556" font-size="15.5" text-anchor="middle" fill="#94A3B8">each side keeps its own store</text>
  <text x="1003" y="579" font-size="15.5" text-anchor="middle" fill="#94A3B8">most work, most independence</text>

  
  <rect x="40" y="652" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="676" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="698" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The risk</text>
  <text x="288" y="698" font-size="15.5" fill="#475569">a write that reaches one store and not the other shows the user different data depending on which side answered</text>

  <rect x="64" y="720" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="742" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Retire early</text>
  <text x="288" y="742" font-size="15.5" fill="#475569">every extra week of running both systems is another week of keeping two stores in step, so cut over as soon as you can</text>
</svg>