<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">Sign-out is more than deleting a token</title><desc id="desc">Invalidate the current session generation first so old results can be rejected. Coordinate work cancellation, server credential revocation, local retention, and push or authenticated web state under their contracts. A late result for Account A must not be applied to Account B. Revocation does not necessarily invalidate every issued access token immediately.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1060" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Sign-out is more than deleting a token</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Coordinate the session boundary across work, credentials, stored data, and routing.</text><rect x="300" y="170" width="600" height="130" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="322" y="210" font-size="24" fill="#2563eb" font-weight="700">Invalidate the old session generation</text><text x="322" y="251" font-size="21" fill="#334155" font-weight="400">Close the boundary before accepting new account work.</text><rect x="50" y="420" width="260" height="165" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="460" font-size="24" fill="#7c3aed" font-weight="700">Workers</text><text x="72" y="501" font-size="21" fill="#334155" font-weight="400">Stop new work.</text><text x="72" y="532" font-size="21" fill="#334155" font-weight="400">Cancel where possible.</text><path d="M600 308 V355 H180 V412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="330" y="420" width="260" height="165" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="352" y="460" font-size="24" fill="#059669" font-weight="700">Credentials</text><text x="352" y="501" font-size="21" fill="#334155" font-weight="400">Revoke under the</text><text x="352" y="532" font-size="21" fill="#334155" font-weight="400">server contract.</text><path d="M600 308 V355 H460 V412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="610" y="420" width="260" height="165" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="632" y="460" font-size="24" fill="#c2410c" font-weight="700">Local data</text><text x="632" y="501" font-size="21" fill="#334155" font-weight="400">Remove or isolate</text><text x="632" y="532" font-size="21" fill="#334155" font-weight="400">under retention policy.</text><path d="M600 308 V355 H740 V412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="890" y="420" width="260" height="165" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="912" y="460" font-size="24" fill="#2563eb" font-weight="700">Account routing</text><text x="912" y="501" font-size="21" fill="#334155" font-weight="400">Detach push and</text><text x="912" y="532" font-size="21" fill="#334155" font-weight="400">authenticated web state.</text><path d="M600 308 V355 H1020 V412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="710" width="430" height="155" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="72" y="750" font-size="24" fill="#475569" font-weight="700">Late result: Account A</text><text x="72" y="791" font-size="21" fill="#334155" font-weight="400">Carries the old session generation.</text><rect x="600" y="710" width="550" height="155" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="622" y="750" font-size="24" fill="#059669" font-weight="700">Current session: Account B</text><text x="622" y="791" font-size="21" fill="#334155" font-weight="400">Generation does not match: reject the result.</text><text x="622" y="822" font-size="21" fill="#334155" font-weight="400">Do not write it into B’s data or screen.</text><path d="M488 785 H592" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="920" width="1100" height="100" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="960" font-size="24" fill="#ffffff" font-weight="700">Handle pending work explicitly</text><text x="72" y="1001" font-size="21" fill="#ffffff" font-weight="400">Never send Account A’s queue with Account B’s credentials.</text></g></svg>