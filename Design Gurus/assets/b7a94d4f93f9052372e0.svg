<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="assemble-title assemble-desc">
<title id="assemble-title">What reaches the model is constructed</title>
<desc id="assemble-desc">The context is a built document rather than a concatenation, and its construction is a design decision with product consequences.</desc>
<defs>
<marker id="assemble-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="assemble-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="assemble-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="assemble-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="800" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What reaches the model is constructed</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The context is a built document rather than a concatenation.</text>
<rect x="40" y="722" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="722" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="148" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="620" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">The context window</text>
<rect x="70" y="172" width="212" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="176" y="206" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">strongest passage</text>
<rect x="292" y="172" width="212" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="398" y="206" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">supporting</text>
<rect x="514" y="172" width="212" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="206" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">weakest, if any</text>
<rect x="736" y="172" width="212" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="842" y="206" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">supporting</text>
<rect x="958" y="172" width="212" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1064" y="206" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">strongest passage</text>
<text x="620" y="254" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">models attend more reliably at the edges than in the middle</text>
<rect x="40" y="286" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="322" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">More context is not better</text>
<path d="M526 316H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 316H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#assemble-marker-slate)"/>
<rect x="570" y="286" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="322" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">weakly relevant passages measurably degrade the answer</text>
<rect x="40" y="356" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="392" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Every passage needs a citation handle</text>
<path d="M526 386H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 386H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#assemble-marker-slate)"/>
<rect x="570" y="356" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="392" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what makes the output checkable, and painful to add later</text>
<rect x="40" y="426" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="462" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say what to do when nothing fits</text>
<path d="M526 456H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 456H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#assemble-marker-slate)"/>
<rect x="570" y="426" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="449.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">answer only from the passages, and say so</text><text x="590" y="474.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">when they do not contain it</text>
<rect x="40" y="504" width="1160" height="86" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="504" width="5" height="86" rx="2.5" fill="#F28B9D"/><text x="64" y="540" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A system that cannot say it does not know will fabricate</text><text x="64" y="566" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It is being asked for an answer from passages that do not support one.</text>
<rect x="40" y="608" width="1160" height="86" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="608" width="5" height="86" rx="2.5" fill="#F3CF6A"/><text x="64" y="644" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">And a large window is not a substitute for retrieval</text><text x="64" y="670" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It changes how much slack you have. It does not remove the need to pick.</text>
<text x="66" y="756" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Count refusals as a separate outcome from wrong answers, because they are much less harmful.</text>
</svg>