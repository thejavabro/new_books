<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="694" viewBox="0 0 1240 694" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The digits with the first two answers filled in">
<defs>
<filter id="dw-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="694" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">In how many ways can "121" be read as letters?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">1 to 26 stand for A to Z, so each step reads either one digit or two</text>
<rect x="40" y="106" width="1160" height="418" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Each cell counts the ways to read everything up to and including its digit</text>
<text x="386" y="270" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the digits</text>
<rect x="410" y="232" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="458" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-</text>
<rect x="518" y="232" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="566" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="626" y="232" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="674" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="734" y="232" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="782" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="386" y="386" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">ways so far</text>
<rect x="410" y="348" width="96" height="60" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="458" y="385.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="518" y="348" width="96" height="60" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="566" y="385.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="626" y="348" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="674" y="385.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="734" y="348" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="782" y="385.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="620" y="452" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">An empty string has one reading, the empty one, and a single digit that is not 0 has one</text>
<rect x="40" y="562" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="602" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Every reading ends by taking either the last digit alone or the last two together</text>
<text x="620" y="634" text-anchor="middle" font-size="18.5" fill="#475569">So each cell is the cell before it plus the cell two before it, when each of those is allowed</text>
</svg>