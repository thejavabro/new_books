<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1430" viewBox="0 0 1240 1430" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six trade-offs of the payment API, each with what was chosen and the cost accepted: a pending state rather than a guess, idempotency storage for an exactly-once observable effect, a refund resource rather than a patched payment, conditional refunds, no caching of money, and narrow browser authority.">
  <defs>
    <filter id="p1u-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1u-klg"><rect x="700" y="62" width="26" height="18" rx="5"/></clipPath>
    <clipPath id="p1u-k1"><rect x="76" y="146" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p1u-k2"><rect x="76" y="342" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p1u-k3"><rect x="76" y="538" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p1u-k4"><rect x="76" y="734" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p1u-k5"><rect x="76" y="930" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="p1u-k6"><rect x="76" y="1126" width="500" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1430" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Six choices, six costs named aloud</text>

  <rect x="700" y="62" width="26" height="18" rx="5" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <rect x="700" y="62" width="4" height="18" fill="#059669" clip-path="url(#p1u-klg)"/>
  <text x="736" y="77" font-size="15.5" font-weight="600" fill="#047857">chosen</text>

  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M830,66 L841,77 M841,66 L830,77"/>
  </g>
  <text x="855" y="77" font-size="15.5" font-weight="600" fill="#BE185D">instead of</text>

  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M984,64 L984,78 M979.5,73.5 L984,78 L988.5,73.5"/>
  </g>
  <text x="1002" y="77" font-size="15.5" font-weight="600" fill="#B45309">cost accepted</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1u-soft)">
    <rect x="76" y="146" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p1u-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Pending, rather than a guess</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,251 L89,262 M89,251 L78,262"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">Reporting a false failure or success</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,276 L84,286 M79.5,281.5 L84,286 L88.5,281.5"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">The merchant handles a lifecycle instead of one answer</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1u-soft)">
    <rect x="76" y="342" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#059669" clip-path="url(#p1u-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">24-hour idempotency storage</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,447 L89,458 M89,447 L78,458"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">Trusting the network not to duplicate</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,472 L84,482 M79.5,477.5 L84,482 L88.5,477.5"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Storage, coordination, and a processor that honors the identity</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1u-soft)">
    <rect x="76" y="538" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p1u-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">Refund as its own resource</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,643 L89,654 M89,643 L78,654"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">Patching an amount onto the payment</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,668 L84,678 M79.5,673.5 L84,678 L88.5,673.5"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">More operations, but partial and async refunds become observable</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1u-soft)">
    <rect x="76" y="734" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#059669" clip-path="url(#p1u-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">Conditional refunds with If-Match</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,839 L89,850 M89,839 L78,850"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">Last write wins on a shared amount</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,864 L84,874 M79.5,869.5 L84,874 L88.5,869.5"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Colliding agents need another read and decision</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1u-soft)">
    <rect x="76" y="930" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#059669" clip-path="url(#p1u-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">no-store on all money</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1035 L89,1046 M89,1035 L78,1046"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">Client and CDN cache savings</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,1060 L84,1070 M79.5,1065.5 L84,1070 L88.5,1065.5"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">Every monetary read reaches the service</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1u-soft)">
    <rect x="76" y="1126" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#059669" clip-path="url(#p1u-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">A ten-minute, one-payment browser token</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1231 L89,1242 M89,1231 L78,1242"/>
  </g>
  <text x="104" y="1242" font-size="15.5" fill="#6B7280">Sending the merchant secret to the client</text>
  <g fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84,1256 L84,1266 M79.5,1261.5 L84,1266 L88.5,1261.5"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">The merchant server must mint and refresh it</text>

  
  <rect x="40" y="1314" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1359" text-anchor="middle" font-size="16" fill="#475569">Each choice above is paired with the option it replaced and the cost it accepts.</text>
</svg>