  <text x="764" y="412" font-size="21.5" font-weight="600" fill="#111827">Presentation layer</text>
  <text x="920" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">controllers, views</text>
  <g filter="url(#m02b-soft)">
    <rect x="700" y="530" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="700" y="530" width="6" height="90" fill="#059669" clip-path="url(#m02b-k8)"/>
