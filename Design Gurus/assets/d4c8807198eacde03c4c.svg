<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1070" viewBox="0 0 1240 1070" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Left, unstructured code with all concerns mixed: a client sends a request to one code file that holds HTTP handling, business logic, database queries and response generation, and that file reads and writes the database. Right, layered architecture with clear separation of concerns: a client calls the presentation layer, which calls the business logic layer, which calls the data access layer, which reads and writes the database; the response returns through the presentation layer">
