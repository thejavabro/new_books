    <clipPath id="m02b-k9"><rect x="700" y="700" width="440" height="90" rx="12"/></clipPath>
    <marker id="m02b-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m02b-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1070" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Unstructured code vs. layered architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same request either passes through one file that mixes every concern or through three separate layers.</text>

  <rect x="40" y="110" width="560" height="920" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#BE185D">Unstructured code (all concerns mixed)</text>
  <rect x="640" y="110" width="560" height="920" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="140" font-size="19.5" font-weight="600" fill="#047857">Layered architecture</text>
  <rect x="100" y="360" width="440" height="370" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="124" y="390" font-size="19.5" font-weight="600" fill="#475569"></text>

