  <text x="899" y="252" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m02b-soft)">
    <rect x="700" y="360" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="700" y="360" width="6" height="90" fill="#2563EB" clip-path="url(#m02b-k7)"/>
  </g>
  <circle cx="738" cy="405" r="18" fill="#FFFFFF"/>
