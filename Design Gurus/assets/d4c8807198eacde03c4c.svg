    <rect x="124" y="440" width="6" height="56" fill="#2563EB" clip-path="url(#m02b-k2)"/>
  </g>
  <text x="144" y="475" font-size="18.5" font-weight="600" fill="#111827">HTTP handling</text>
  <g filter="url(#m02b-soft)">
