  <circle cx="738" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,564.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="764" y="582" font-size="21.5" font-weight="600" fill="#111827">Business logic layer</text>
  <text x="920" y="649" font-size="18.5" text-anchor="middle" fill="#6B7280">domain rules, use cases</text>
