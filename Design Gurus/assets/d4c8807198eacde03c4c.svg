  <g filter="url(#m02b-soft)">
    <rect x="124" y="580" width="392" height="56" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="124" y="580" width="6" height="56" fill="#7C3AED" clip-path="url(#m02b-k4)"/>
  </g>
  <text x="144" y="615" font-size="18.5" font-weight="600" fill="#111827">Database queries</text>
  <g filter="url(#m02b-soft)">
    <rect x="124" y="650" width="392" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
