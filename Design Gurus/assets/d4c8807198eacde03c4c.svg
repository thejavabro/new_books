      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m02b-k1"><rect x="235" y="200" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m02b-k2"><rect x="124" y="440" width="392" height="56" rx="12"/></clipPath>
    <clipPath id="m02b-k3"><rect x="124" y="510" width="392" height="56" rx="12"/></clipPath>
    <clipPath id="m02b-k4"><rect x="124" y="580" width="392" height="56" rx="12"/></clipPath>
