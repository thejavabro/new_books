<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pgvector-title pgvector-desc">
<title id="pgvector-title">What the relational option does</title>
<desc id="pgvector-desc">Two index types with a clear trade, and a set of dimension limits where one of them catches people.</desc>
<defs>
<marker id="pgvector-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pgvector-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pgvector-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pgvector-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="772" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the relational option does</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The extension adds vector types and two index types, with a clear trade between them.</text>
<rect x="40" y="694" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="694" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="86" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="86" rx="2.5" fill="#5EC9EC"/><text x="64" y="154" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">HNSW: a multilayer graph</text><text x="64" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">better queries, slower builds, more memory</text>
<rect x="640" y="118" width="560" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="118" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="664" y="154" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">IVFFlat: lists, searched in part</text><text x="664" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">faster builds, less memory, lower performance</text>
<text x="620" y="228" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">start with HNSW unless build time or memory is the binding constraint</text>
<text x="40" y="266" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The limits are specific and worth committing to memory</text>
<rect x="40" y="284" width="560" height="46" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="314" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">vector, stored</text><text x="584" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">up to 16,000 dimensions</text>
<rect x="40" y="336" width="560" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="56" y="366" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">vector, indexed</text><text x="584" y="366" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">up to  2,000 dimensions</text>
<rect x="40" y="388" width="560" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="56" y="418" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">halfvec, indexed</text><text x="584" y="418" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">up to  4,000 dimensions</text>
<rect x="640" y="284" width="560" height="46" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="656" y="314" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">bit, indexed</text><text x="1184" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">up to 64,000 dimensions</text>
<rect x="640" y="336" width="560" height="46" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="656" y="366" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">sparsevec</text><text x="1184" y="366" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">up to  1,000 non-zero elements</text>
<rect x="40" y="458" width="1160" height="96" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="458" width="5" height="96" rx="2.5" fill="#F28B9D"/><text x="64" y="486" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The indexed limit is lower than the output of some embedding models</text><text x="64" y="512" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">You can store those vectors and cannot build an ordinary vector index over them.</text><text x="64" y="538" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Use half precision, which indexes to 4,000, or reduce the dimension count.</text>
<text x="40" y="596" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What staying in the relational store buys</text>
<rect x="40" y="612" width="372" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="646" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One transaction</text>
<rect x="434" y="612" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="646" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Real filtering by the planner</text>
<rect x="828" y="612" width="372" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="646" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One system to operate</text>
<text x="66" y="728" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The row and its embedding are written together, so they cannot diverge.</text>
</svg>