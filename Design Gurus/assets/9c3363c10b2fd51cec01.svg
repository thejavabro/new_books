    <marker id="m03i-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m03i-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m03i-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Inter-tier communication: protocols and network boundaries</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every hop crosses a network boundary, and the protocol changes at each one.</text>

  <rect x="40" y="120" width="1160" height="190" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Public network (internet)</text>
  <rect x="40" y="430" width="1160" height="230" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="460" font-size="19.5" font-weight="600" fill="#4338CA">Public network (load balancer)</text>
  <rect x="40" y="780" width="780" height="730" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="810" font-size="19.5" font-weight="600" fill="#1D4ED8">Private network (application)</text>
  <rect x="860" y="780" width="340" height="730" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="884" y="810" font-size="19.5" font-weight="600" fill="#1D4ED8">Private network (data)</text>
  <rect x="872" y="830" width="316" height="660" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="896" y="860" font-size="19.5" font-weight="600" fill="#5B21B6">Data tier</text>

