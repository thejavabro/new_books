  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="368" y="336" fill="#1D4ED8" text-anchor="end">HTTPS</text>
    <text x="368" y="360" fill="#1D4ED8" text-anchor="end">(REST, GraphQL)</text>
    <text x="432" y="336" fill="#047857" text-anchor="start">Response</text>
    <text x="432" y="360" fill="#047857" text-anchor="start">(HTML/JSON)</text>
    <text x="368" y="686" fill="#1D4ED8" text-anchor="end">HTTP or gRPC</text>
    <text x="368" y="710" fill="#1D4ED8" text-anchor="end">(internal network)</text>
    <text x="432" y="686" fill="#047857" text-anchor="start">Response</text>
    <text x="432" y="710" fill="#047857" text-anchor="start">(JSON/Proto)</text>
    <text x="660" y="934" fill="#1D4ED8">Database protocol</text>
    <text x="660" y="957" fill="#1D4ED8">(TCP)</text>
    <text x="660" y="1019" fill="#047857">Query results</text>
    <text x="660" y="1042" fill="#047857">(data)</text>
    <text x="660" y="1084" fill="#1D4ED8">Cache protocol</text>
    <text x="660" y="1107" fill="#1D4ED8">(TCP, such as Redis)</text>
    <text x="660" y="1169" fill="#047857">Cached data</text>
    <text x="660" y="1192" fill="#047857">(objects)</text>
    <text x="660" y="1234" fill="#1D4ED8">Search protocol</text>
    <text x="660" y="1257" fill="#1D4ED8">(HTTP, such as Elasticsearch)</text>
    <text x="660" y="1319" fill="#047857">Search results</text>
    <text x="660" y="1342" fill="#047857">(JSON)</text>
    <text x="660" y="1384" fill="#1D4ED8">Object storage API</text>
    <text x="660" y="1407" fill="#1D4ED8">(HTTPS, such as S3)</text>
    <text x="660" y="1469" fill="#047857">Stored objects</text>
    <text x="660" y="1492" fill="#047857">(binary files)</text>
  </g>

