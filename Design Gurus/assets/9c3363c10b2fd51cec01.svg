<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1560" viewBox="0 0 1240 1560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The client, a browser or mobile app on the public internet and part of the presentation tier, sends HTTPS requests (REST, GraphQL) across a network boundary to the web servers and load balancer (Nginx, Apache), infrastructure in front of the application tier and not a tier of its own, in the public network, and receives HTML or JSON responses; the web servers and load balancer send HTTP or gRPC requests over the internal network across a second boundary to the application tier on a private application network and receive JSON or Protobuf responses; across a third boundary, the application tier reaches the data tier on a private data network: a database over a database protocol on TCP, a cache over TCP such as Redis, search over HTTP such as Elasticsearch, and object storage over HTTPS such as S3">
  <defs>
    <filter id="m03i-soft" x="-12%" y="-14%" width="124%" height="140%">
