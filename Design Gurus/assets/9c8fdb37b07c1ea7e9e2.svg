<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="804" viewBox="0 0 1240 804" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Ten GraphQL schema changes sorted into two groups of five. Safe: add a nullable output field, add a new query or mutation, add an optional input with a safe default, add an enum value if callers tolerate unknowns, and deprecate a field with a reason and a replacement. Breaking: remove a field, change a field type, make a nullable field non-null, make an input required, and change a field meaning while keeping its name.">
  <defs>
    <filter id="pe-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pe-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pe-k1"><rect x="84" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k2"><rect x="84" y="270" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k3"><rect x="84" y="366" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k4"><rect x="84" y="462" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k5"><rect x="84" y="558" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k6"><rect x="684" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k7"><rect x="684" y="270" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k8"><rect x="684" y="366" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k9"><rect x="684" y="462" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="pe-k10"><rect x="684" y="558" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="804" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Evolve by adding and deprecating, not by versioning</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">ten schema changes, five safe and five breaking</text>

  
  <rect x="44" y="126" width="552" height="522" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="68" y="156" font-size="16.5" font-weight="600" fill="#047857">Usually compatible</text>
  <text x="572" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">five changes</text>

  <g filter="url(#pe-soft)">
    <rect x="84" y="174" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="174" width="6" height="48" fill="#059669" clip-path="url(#pe-k1)"/>
  </g>
  <circle cx="118" cy="198" r="4.5" fill="#059669"/>
  <text x="142" y="205" font-size="18.5" font-weight="600" fill="#111827">Add a nullable output field</text>

  <g filter="url(#pe-soft)">
    <rect x="84" y="270" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="270" width="6" height="48" fill="#059669" clip-path="url(#pe-k2)"/>
  </g>
  <circle cx="118" cy="294" r="4.5" fill="#059669"/>
  <text x="142" y="301" font-size="18.5" font-weight="600" fill="#111827">Add a new query or mutation</text>

  <g filter="url(#pe-soft)">
    <rect x="84" y="366" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="366" width="6" height="48" fill="#059669" clip-path="url(#pe-k3)"/>
  </g>
  <circle cx="118" cy="390" r="4.5" fill="#059669"/>
  <text x="142" y="397" font-size="18.5" font-weight="600" fill="#111827">Add an optional input</text>
  <text x="320" y="436" text-anchor="middle" font-size="15.5" fill="#6B7280">with a safe default</text>

  <g filter="url(#pe-soft)">
    <rect x="84" y="462" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="462" width="6" height="48" fill="#059669" clip-path="url(#pe-k4)"/>
  </g>
  <circle cx="118" cy="486" r="4.5" fill="#059669"/>
  <text x="142" y="493" font-size="18.5" font-weight="600" fill="#111827">Add an enum value</text>
  <text x="320" y="532" text-anchor="middle" font-size="15.5" fill="#6B7280">if callers tolerate unknowns</text>

  <g filter="url(#pe-lift)">
    <rect x="84" y="558" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="84" y="558" width="9" height="48" fill="#059669" clip-path="url(#pe-k5)"/>
  </g>
  <circle cx="118" cy="582" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,573) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="142" y="589" font-size="18.5" font-weight="600" fill="#111827">Deprecate a field</text>
  <text x="320" y="628" text-anchor="middle" font-size="15.5" fill="#6B7280">with a reason and a replacement</text>

  
  <rect x="644" y="126" width="552" height="522" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Breaking</text>
  <text x="1172" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">five changes</text>

  <g filter="url(#pe-soft)">
    <rect x="684" y="174" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#pe-k6)"/>
  </g>
  <circle cx="718" cy="198" r="4.5" fill="#DB2777"/>
  <text x="742" y="205" font-size="18.5" font-weight="600" fill="#111827">Remove a field</text>

  <g filter="url(#pe-soft)">
    <rect x="684" y="270" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="270" width="6" height="48" fill="#DB2777" clip-path="url(#pe-k7)"/>
  </g>
  <circle cx="718" cy="294" r="4.5" fill="#DB2777"/>
  <text x="742" y="301" font-size="18.5" font-weight="600" fill="#111827">Change a field type</text>

  <g filter="url(#pe-soft)">
    <rect x="684" y="366" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="366" width="6" height="48" fill="#DB2777" clip-path="url(#pe-k8)"/>
  </g>
  <circle cx="718" cy="390" r="4.5" fill="#DB2777"/>
  <text x="742" y="397" font-size="18.5" font-weight="600" fill="#111827">Make a non-null output nullable</text>

  <g filter="url(#pe-soft)">
    <rect x="684" y="462" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="462" width="6" height="48" fill="#DB2777" clip-path="url(#pe-k9)"/>
  </g>
  <circle cx="718" cy="486" r="4.5" fill="#DB2777"/>
  <text x="742" y="493" font-size="18.5" font-weight="600" fill="#111827">Make an input required</text>

  <g filter="url(#pe-lift)">
    <rect x="684" y="558" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="684" y="558" width="9" height="48" fill="#DB2777" clip-path="url(#pe-k10)"/>
  </g>
  <circle cx="718" cy="582" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,573) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="742" y="589" font-size="18.5" font-weight="600" fill="#111827">Change a field meaning</text>
  <text x="920" y="628" text-anchor="middle" font-size="15.5" fill="#6B7280">while keeping its name</text>

  
  <rect x="40" y="688" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="733" text-anchor="middle" font-size="16" fill="#475569">To replace a field: add the new one, deprecate the old one, measure who still asks, then remove it.</text>
</svg>