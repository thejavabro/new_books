<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Order Service makes a network call to Payment Service, and the unspoken question is what happens when that call fails">
  <defs>
    <marker id="m01-l01-network-boundary-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m01-l01-network-boundary-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m01-l01-network-boundary-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>

  
  <rect x="150" y="66" width="940" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Two boxes and an arrow</text>

  
  <g fill="none">
    <path d="M470,190 L764,190" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m01-l01-network-boundary-blue)"/>
    <path d="M760,318 C800,286 850,262 892,242" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m01-l01-network-boundary-red)"/>
  </g>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="176" fill="#1E40AF">network call</text>
  </g>

  
  <g filter="url(#m01-l01-network-boundary-soft)">
    <rect x="210" y="142" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="340" y="184" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order Service</text>
  <text x="340" y="214" text-anchor="middle" font-size="20" fill="#64748B">the box on the left</text>

  <g filter="url(#m01-l01-network-boundary-soft)">
    <rect x="770" y="142" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="900" y="184" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment Service</text>
  <text x="900" y="214" text-anchor="middle" font-size="20" fill="#64748B">the box on the right</text>

  <g filter="url(#m01-l01-network-boundary-soft)">
    <rect x="400" y="318" width="440" height="94" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="620" y="356" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Unspoken question:</text>
  <text x="620" y="386" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">what happens when this call fails?</text>

  
  <g stroke-width="4">
    <line x1="40" y1="443" x2="74" y2="443" stroke="#3B82F6"/>
    <line x1="600" y1="443" x2="634" y2="443" stroke="#DC2626" stroke-dasharray="6 5"/>
  </g>
  <text x="86" y="450" font-size="20" fill="#475569">Synchronous call: the live request path</text>
  <text x="646" y="450" font-size="20" fill="#475569">The failure question every arrow creates</text>
</svg>