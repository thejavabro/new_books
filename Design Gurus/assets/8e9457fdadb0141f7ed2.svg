<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="606" viewBox="0 0 1240 606" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The box office changes the flag and notifies between the fan&#39;s check and its wait, so the notify wakes nobody and the fan sleeps forever">
  <defs>
    <filter id="mtlw-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="mtlw-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="mtlw-k1"><rect x="64" y="120" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k2"><rect x="64" y="230" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k3"><rect x="64" y="340" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k4"><rect x="260" y="120" width="222" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k5"><rect x="490" y="120" width="452" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k6"><rect x="950" y="120" width="222" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k7"><rect x="260" y="230" width="222" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k8"><rect x="490" y="230" width="682" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k9"><rect x="490" y="340" width="222" height="90" rx="12"/></clipPath>
    <clipPath id="mtlw-k10"><rect x="720" y="340" width="222" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="606" fill="#FFFFFF"/>

  <rect x="40" y="30" width="1160" height="482" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="60" font-size="20" font-weight="600" fill="#475569">A lost wakeup: the box office skips the mutex</text>

  <text x="371" y="100" text-anchor="middle" font-size="20" fill="#6B7280">Step 1</text>
  <text x="601" y="100" text-anchor="middle" font-size="20" fill="#6B7280">Step 2</text>
  <text x="831" y="100" text-anchor="middle" font-size="20" fill="#6B7280">Step 3</text>
  <text x="1061" y="100" text-anchor="middle" font-size="20" fill="#6B7280">Step 4</text>

  <g filter="url(#mtlw-soft)">
    <rect x="64" y="120" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="120" width="6" height="90" fill="#64748B" clip-path="url(#mtlw-k1)"/>
  </g>
  <circle cx="102" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,154.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="128" y="172" font-size="20" font-weight="600" fill="#111827">Fan</text>
  <g filter="url(#mtlw-soft)">
    <rect x="64" y="230" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="230" width="6" height="90" fill="#64748B" clip-path="url(#mtlw-k2)"/>
  </g>
  <circle cx="102" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,264.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 3.5L8 20.5M16 3.5L14 20.5M4.5 9h15.5M4 15h15.5"/>
  </g>
  <text x="128" y="282" font-size="20" font-weight="600" fill="#111827">sale_open</text>
  <g filter="url(#mtlw-soft)">
    <rect x="64" y="340" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="340" width="6" height="90" fill="#64748B" clip-path="url(#mtlw-k3)"/>
  </g>
  <circle cx="102" cy="385" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,374.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="128" y="392" font-size="20" font-weight="600" fill="#111827">Box office</text>

  <g filter="url(#mtlw-soft)">
    <rect x="260" y="120" width="222" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="260" y="120" width="6" height="90" fill="#2563EB" clip-path="url(#mtlw-k4)"/>
  </g>
  <text x="374" y="172" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Checks: sees false</text>
  <g filter="url(#mtlw-soft)">
    <rect x="490" y="120" width="452" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="490" y="120" width="6" height="90" fill="#2563EB" clip-path="url(#mtlw-k5)"/>
  </g>
  <text x="719" y="172" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">About to call wait</text>
  <g filter="url(#mtlw-soft)">
    <rect x="950" y="120" width="222" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="950" y="120" width="6" height="90" fill="#DB2777" clip-path="url(#mtlw-k6)"/>
  </g>
  <text x="1064" y="157" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Calls wait:</text>
  <text x="1064" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">sleeps forever</text>
  <g filter="url(#mtlw-soft)">
    <rect x="260" y="230" width="222" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="260" y="230" width="6" height="90" fill="#64748B" clip-path="url(#mtlw-k7)"/>
  </g>
  <text x="374" y="282" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">false</text>
  <g filter="url(#mtlw-soft)">
    <rect x="490" y="230" width="682" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="490" y="230" width="6" height="90" fill="#64748B" clip-path="url(#mtlw-k8)"/>
  </g>
  <text x="834" y="282" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">true</text>
  <g filter="url(#mtlw-soft)">
    <rect x="490" y="340" width="222" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="490" y="340" width="6" height="90" fill="#7C3AED" clip-path="url(#mtlw-k9)"/>
  </g>
  <text x="604" y="392" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">Sets true, no mutex</text>
  <g filter="url(#mtlw-soft)">
    <rect x="720" y="340" width="222" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="720" y="340" width="6" height="90" fill="#7C3AED" clip-path="url(#mtlw-k10)"/>
  </g>
  <text x="834" y="377" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">notify all:</text>
  <text x="834" y="405" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">nobody waits</text>

  <text x="716" y="470" text-anchor="middle" font-size="20" fill="#6B7280">The notify came before the wait, so nothing wakes the fan</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M256,544 H1190" marker-end="url(#mtlw-sl)"/>
    <path d="M256,537 V551"/>
    <path d="M486,537 V551"/>
    <path d="M716,537 V551"/>
    <path d="M946,537 V551"/>
    <path d="M1176,537 V551"/>
  </g>
  <text x="1190" y="582" text-anchor="end" font-size="20" font-weight="600" fill="#475569">time</text>
</svg>