<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consistent hashing places nodes and keys on a ring and the key walks clockwise to the next node, while rendezvous hashing has every node score the key and the highest score wins">
  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>
  <defs>
    <marker id="sh5-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="sh5-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="sh5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two ways to decide which node owns a key</text>

  
  <rect x="40" y="72" width="1160" height="400" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#334155">Consistent hashing: the key walks clockwise to the next node</text>

  
  <circle cx="266" cy="300" r="130" fill="none" stroke="#CBD5E1" stroke-width="2"/>

  
  <path d="M357.9 208.1 A 130 130 0 0 1 396 294" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#sh5-emerald)"/>

  
  <circle cx="266" cy="170" r="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="396" cy="300" r="13" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <circle cx="266" cy="430" r="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="136" cy="300" r="13" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="266" y="148" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Node A</text>
  <text x="424" y="307" font-size="20" font-weight="600" fill="#065F46">Node B</text>
  <text x="266" y="468" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Node C</text>
  <text x="108" y="307" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="end">Node D</text>

  
  <circle cx="357.9" cy="208.1" r="9" fill="#D97706"/>
  <text x="374" y="190" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">key</text>

  
  <circle cx="536" cy="184" r="5" fill="#475569"/>
  <text x="558" y="191" font-size="20" fill="#334155">Nodes and keys are hashed onto the same circle.</text>
  <circle cx="536" cy="240" r="5" fill="#475569"/>
  <text x="558" y="247" font-size="20" fill="#334155">A key belongs to the first node clockwise from it.</text>
  <circle cx="536" cy="296" r="5" fill="#475569"/>
  <text x="558" y="303" font-size="20" fill="#334155">Remove node B and its whole arc moves to node C,</text>
  <text x="558" y="331" font-size="20" fill="#334155">so one neighbour absorbs all of its load.</text>
  <circle cx="536" cy="384" r="5" fill="#475569"/>
  <text x="558" y="391" font-size="20" fill="#334155">Arcs are uneven, so each node is given 100 to 200</text>
  <text x="558" y="419" font-size="20" fill="#334155">virtual nodes to even out the distribution.</text>

  
  <rect x="40" y="496" width="1160" height="400" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="530" font-size="20" font-weight="600" fill="#334155">Rendezvous hashing: every node scores the key, the highest score wins</text>

  <line x1="342" y1="678" x2="420" y2="678" stroke="#475569" stroke-width="2" marker-end="url(#sh5-slate)"/>

  <g filter="url(#sh5-soft)">
    <rect x="100" y="642" width="242" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="221" y="672" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">the key</text>
  <text x="221" y="700" font-size="20" fill="#92400E" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">user:42</text>

  
  <rect x="430" y="558" width="430" height="52" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="452" y="592" font-size="20" fill="#334155" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">score(user:42, A) = 0.31</text>

  <rect x="430" y="620" width="430" height="52" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="452" y="654" font-size="20" font-weight="600" fill="#065F46" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">score(user:42, B) = 0.87</text>

  <rect x="430" y="682" width="430" height="52" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="452" y="716" font-size="20" fill="#334155" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">score(user:42, C) = 0.55</text>

  <rect x="430" y="744" width="430" height="52" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="452" y="778" font-size="20" fill="#334155" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">score(user:42, D) = 0.12</text>

  
  <line x1="1010" y1="646" x2="872" y2="646" stroke="#059669" stroke-width="2" marker-end="url(#sh5-emerald)"/>
  <text x="1022" y="639" font-size="20" font-weight="600" fill="#065F46">highest score,</text>
  <text x="1022" y="667" font-size="20" font-weight="600" fill="#065F46">so B owns the key</text>

  <rect x="80" y="812" width="1080" height="68" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="842" font-size="20" fill="#334155" text-anchor="middle">No ring and no virtual nodes. Remove node B and this key moves to C, the next highest score.</text>
  <text x="620" y="870" font-size="20" fill="#334155" text-anchor="middle">A failed node's keys spread across every survivor instead of landing on one neighbour.</text>
</svg>