<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="When a region fails, GeoDNS failover waits for cached DNS records to expire while anycast failover happens as soon as BGP withdraws the route">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="lb6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The Frankfurt region goes down. How long until users stop being sent there?</text>

  
  <rect x="40" y="72" width="1160" height="228" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#1E40AF">GeoDNS: you must wait out the TTL</text>

  <line x1="110" y1="200" x2="1150" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#lb6-slate)"/>
  <line x1="110" y1="188" x2="110" y2="212" stroke="#475569" stroke-width="2"/>
  <line x1="880" y1="184" x2="880" y2="216" stroke="#059669" stroke-width="2.5"/>

  <rect x="110" y="140" width="770" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="495" y="169" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">resolvers keep handing out the dead IP until their cache expires</text>

  <text x="110" y="248" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">region fails</text>
  <text x="880" y="248" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">TTL expires</text>
  <text x="880" y="276" font-size="20" fill="#065F46" text-anchor="middle">users move to Singapore</text>

  
  <rect x="40" y="328" width="1160" height="228" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="362" font-size="20" font-weight="600" fill="#5B21B6">Anycast: the route is withdrawn and the network reconverges</text>

  <line x1="110" y1="456" x2="1150" y2="456" stroke="#475569" stroke-width="2" marker-end="url(#lb6-slate)"/>
  <line x1="110" y1="444" x2="110" y2="468" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="440" x2="300" y2="472" stroke="#059669" stroke-width="2.5"/>

  <rect x="110" y="396" width="190" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="205" y="425" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">BGP converges</text>

  <text x="110" y="504" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">region fails</text>
  <text x="300" y="504" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">seconds later</text>
  <text x="300" y="532" font-size="20" fill="#065F46" text-anchor="middle">the same IP now lands in Singapore</text>

  
  <rect x="40" y="580" width="1160" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="608" font-size="20" fill="#334155" text-anchor="middle">This is why a low DNS TTL matters, and why many teams run anycast for the endpoint and GeoDNS for policy.</text>
</svg>