<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Retrieval-augmented generation as two pipelines: ingestion runs continuously to chunk, embed and index the documents, and the query pipeline embeds the question, retrieves what the asker may read, reranks, assembles the prompt, and answers with citations">
  <rect x="0" y="0" width="1300" height="780" fill="#FFFFFF"/>
  <defs>
    <marker id="s" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="v" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  
  <rect x="30" y="34" width="1240" height="204" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="54" y="70" font-size="22" font-weight="700" fill="#5B21B6">Ingestion: continuous, triggered by change</text>

  <rect x="60" y="86" width="200" height="126" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="160" y="122" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Sources</text>
  <text x="160" y="152" font-size="20" fill="#334155" text-anchor="middle">CMS, catalog,</text>
  <text x="160" y="180" font-size="20" fill="#334155" text-anchor="middle">wikis, the</text>
  <text x="160" y="204" font-size="20" fill="#334155" text-anchor="middle">policy pages</text>
  <line x1="262" y1="149" x2="301" y2="149" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#v)"/>

  <rect x="305" y="86" width="200" height="126" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="405" y="122" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Chunking</text>
  <text x="405" y="152" font-size="20" fill="#334155" text-anchor="middle">by headings and</text>
  <text x="405" y="180" font-size="20" fill="#334155" text-anchor="middle">sections, never</text>
  <text x="405" y="204" font-size="20" fill="#334155" text-anchor="middle">mid-table</text>
  <line x1="507" y1="149" x2="546" y2="149" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#v)"/>

  <rect x="550" y="86" width="200" height="126" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="650" y="122" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Embedding</text>
  <text x="650" y="152" font-size="20" fill="#334155" text-anchor="middle">one versioned</text>
  <text x="650" y="180" font-size="20" fill="#334155" text-anchor="middle">model, recorded</text>
  <text x="650" y="204" font-size="20" fill="#334155" text-anchor="middle">with each chunk</text>
  <line x1="752" y1="149" x2="791" y2="149" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#v)"/>

  <rect x="795" y="86" width="200" height="126" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="895" y="122" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Vector index</text>
  <text x="895" y="152" font-size="20" fill="#334155" text-anchor="middle">chunk, source,</text>
  <text x="895" y="180" font-size="20" fill="#334155" text-anchor="middle">timestamp, who</text>
  <text x="895" y="204" font-size="20" fill="#334155" text-anchor="middle">may read it</text>

  <rect x="1040" y="86" width="200" height="126" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="1140" y="122" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Kept fresh</text>
  <text x="1140" y="152" font-size="20" fill="#334155" text-anchor="middle">by change data</text>
  <text x="1140" y="180" font-size="20" fill="#334155" text-anchor="middle">capture: an edit</text>
  <text x="1140" y="204" font-size="20" fill="#334155" text-anchor="middle">re-embeds in seconds</text>
  <line x1="1038" y1="149" x2="1001" y2="149" stroke="#059669" stroke-width="2.5" marker-end="url(#s)"/>

  
  <path d="M895,238 L895,272 L713,272 L713,302" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#v)"/>
  <text x="915" y="278" font-size="20" font-weight="700" fill="#5B21B6">the index is what remembers</text>

  
  <rect x="30" y="308" width="1240" height="212" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="54" y="344" font-size="22" font-weight="700" fill="#1E3A8A">Query: once per request</text>

  <rect x="60" y="360" width="175" height="130" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="147" y="396" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Question</text>
  <text x="147" y="428" font-size="20" fill="#334155" text-anchor="middle">"what is the</text>
  <text x="147" y="456" font-size="20" fill="#334155" text-anchor="middle">return window</text>
  <text x="147" y="482" font-size="20" fill="#334155" text-anchor="middle">on shoes?"</text>
  <line x1="237" y1="420" x2="259" y2="420" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="261" y="360" width="175" height="130" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="348" y="396" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Embed it</text>
  <text x="348" y="428" font-size="20" fill="#334155" text-anchor="middle">with the same</text>
  <text x="348" y="456" font-size="20" fill="#334155" text-anchor="middle">model the</text>
  <text x="348" y="482" font-size="20" fill="#334155" text-anchor="middle">chunks used</text>
  <line x1="438" y1="420" x2="460" y2="420" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="462" y="360" width="175" height="130" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="549" y="396" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Retrieve</text>
  <text x="549" y="428" font-size="20" fill="#334155" text-anchor="middle">the top chunks</text>
  <text x="549" y="456" font-size="20" fill="#334155" text-anchor="middle">this asker is</text>
  <text x="549" y="482" font-size="20" fill="#334155" text-anchor="middle">allowed to read</text>
  <line x1="639" y1="420" x2="661" y2="420" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="663" y="360" width="175" height="130" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="750" y="396" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Rerank</text>
  <text x="750" y="428" font-size="20" fill="#334155" text-anchor="middle">optional: order</text>
  <text x="750" y="456" font-size="20" fill="#334155" text-anchor="middle">by relevance</text>
  <text x="750" y="482" font-size="20" fill="#334155" text-anchor="middle">and recency</text>
  <line x1="840" y1="420" x2="862" y2="420" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="864" y="360" width="175" height="130" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <text x="951" y="396" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Assemble</text>
  <text x="951" y="428" font-size="20" fill="#334155" text-anchor="middle">the chunks into</text>
  <text x="951" y="456" font-size="20" fill="#334155" text-anchor="middle">the prompt, with</text>
  <text x="951" y="482" font-size="20" fill="#334155" text-anchor="middle">their sources</text>
  <line x1="1041" y1="420" x2="1063" y2="420" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="1065" y="360" width="175" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="1152" y="396" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Answer</text>
  <text x="1152" y="428" font-size="20" fill="#334155" text-anchor="middle">"30 days,"</text>
  <text x="1152" y="456" font-size="20" fill="#334155" text-anchor="middle">citing the page</text>
  <text x="1152" y="482" font-size="20" fill="#334155" text-anchor="middle">it read it on</text>

  
  <text x="40" y="588" font-size="20" font-weight="700" fill="#0F172A">The model reasons; the index remembers. A policy edited this morning is answered correctly this afternoon</text>
  <text x="40" y="618" font-size="20" font-weight="700" fill="#0F172A">without retraining anything, the answer points at the page it came from, and permissions are enforced at</text>
  <text x="40" y="648" font-size="20" font-weight="700" fill="#0F172A">retrieval, where the system can still check them.</text>

  <text x="40" y="712" font-size="20" fill="#475569">Fine-tuning is for behavior: tone, format, the way the answer is argued. This is for knowledge. They are not</text>
  <text x="40" y="742" font-size="20" fill="#475569">alternatives to each other.</text>
</svg>