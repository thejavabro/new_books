<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="792" viewBox="0 0 1240 792" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rows compared. In the correct row one 800 millisecond budget moves through three services as remaining time: Service A receives 800 and uses 150, Service B receives 650 and uses 250, Service C receives 400 and must finish inside it. In the wrong row every service starts a fresh 800 millisecond deadline, so Service C is still working after the caller stopped waiting.">
  <defs>
    <marker id="pc-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="pc-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="pc-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pc-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pc-k1"><rect x="76" y="176" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="pc-k2"><rect x="485" y="176" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="pc-k3"><rect x="894" y="176" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="pc-k4"><rect x="76" y="416" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="pc-k5"><rect x="485" y="416" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="pc-k6"><rect x="894" y="416" width="270" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="792" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Pass the remaining deadline, never a fresh one</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one 800 ms budget, three services</text>

  
  <rect x="40" y="126" width="1160" height="210" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#047857">Correct: each service passes the time that is left</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M346,221 H485" stroke="#059669" marker-end="url(#pc-em)"/>
    <path d="M755,221 H894" stroke="#059669" marker-end="url(#pc-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#ECFDF5" stroke-width="5">
    <text x="415" y="209" fill="#047857">passes 650 ms</text>
    <text x="824" y="209" fill="#047857">passes 400 ms</text>
  </g>

  
  <g filter="url(#pc-soft)">
    <rect x="76" y="176" width="270" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="176" width="6" height="90" fill="#059669" clip-path="url(#pc-k1)"/>
  </g>
  <circle cx="114" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,210.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="228" font-size="18.5" font-weight="600" fill="#111827">Service A</text>
  <text x="211" y="291" font-size="15.5" text-anchor="middle" fill="#6B7280">receives 800 ms</text>
  <text x="211" y="314" font-size="15.5" text-anchor="middle" fill="#94A3B8">uses 150 ms</text>

  
  <g filter="url(#pc-soft)">
    <rect x="485" y="176" width="270" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="485" y="176" width="6" height="90" fill="#059669" clip-path="url(#pc-k2)"/>
  </g>
  <circle cx="523" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(512.56,210.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="549" y="228" font-size="18.5" font-weight="600" fill="#111827">Service B</text>
  <text x="620" y="291" font-size="15.5" text-anchor="middle" fill="#6B7280">receives 650 ms</text>
  <text x="620" y="314" font-size="15.5" text-anchor="middle" fill="#94A3B8">uses 250 ms</text>

  
  <g filter="url(#pc-soft)">
    <rect x="894" y="176" width="270" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="894" y="176" width="6" height="90" fill="#059669" clip-path="url(#pc-k3)"/>
  </g>
  <circle cx="932" cy="221" r="18" fill="#FFFFFF"/>
  <g transform="translate(921.56,210.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="958" y="228" font-size="18.5" font-weight="600" fill="#111827">Service C</text>
  <text x="1029" y="291" font-size="15.5" text-anchor="middle" fill="#6B7280">receives 400 ms</text>
  <text x="1029" y="314" font-size="15.5" text-anchor="middle" fill="#94A3B8">must finish inside it</text>

  
  <rect x="40" y="366" width="1160" height="254" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="396" font-size="16.5" font-weight="600" fill="#BE185D">Wrong: each service starts a new 800 ms</text>

  <g fill="none" stroke-width="2.5">
    <path d="M346,461 H485" stroke="#DB2777" marker-end="url(#pc-pm)"/>
    <path d="M755,461 H894" stroke="#DB2777" marker-end="url(#pc-pm)"/>
  </g>

  
  <g filter="url(#pc-soft)">
    <rect x="76" y="416" width="270" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="416" width="6" height="90" fill="#DB2777" clip-path="url(#pc-k4)"/>
  </g>
  <circle cx="114" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,450.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="468" font-size="18.5" font-weight="600" fill="#111827">Service A</text>
  <text x="211" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">starts 800 ms</text>
  <text x="211" y="554" font-size="15.5" text-anchor="middle" fill="#94A3B8">uses 150 ms</text>

  
  <g filter="url(#pc-soft)">
    <rect x="485" y="416" width="270" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="485" y="416" width="6" height="90" fill="#DB2777" clip-path="url(#pc-k5)"/>
  </g>
  <circle cx="523" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(512.56,450.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="549" y="468" font-size="18.5" font-weight="600" fill="#111827">Service B</text>
  <text x="620" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">starts 800 ms again</text>
  <text x="620" y="554" font-size="15.5" text-anchor="middle" fill="#94A3B8">uses 250 ms</text>

  
  <g filter="url(#pc-lift)">
    <rect x="894" y="416" width="270" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="894" y="416" width="9" height="90" fill="#DB2777" clip-path="url(#pc-k6)"/>
  </g>
  <circle cx="932" cy="461" r="18" fill="#FFFFFF"/>
  <g transform="translate(921.56,450.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="958" y="468" font-size="18.5" font-weight="600" fill="#111827">Service C</text>
  <text x="1029" y="531" font-size="15.5" text-anchor="middle" fill="#6B7280">starts 800 ms again</text>
  <text x="1029" y="554" font-size="15.5" text-anchor="middle" fill="#94A3B8">still working</text>

  
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M388,585 L399,596 M399,585 L388,596"/>
  </g>
  <text x="414" y="596" font-size="15.5" fill="#6B7280">The caller stopped waiting long ago, and the work continues.</text>

  
  <rect x="40" y="652" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="694" text-anchor="middle" font-size="16" fill="#475569">When the shared budget reaches zero, stop the work and cancel downstream calls.</text>
  <text x="620" y="722" text-anchor="middle" font-size="16" fill="#475569">A deadline error does not prove that no write occurred.</text>
</svg>