<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="672" viewBox="0 0 1180 672" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Smallest common value in two sorted arrays">
<defs>
<marker id="mincommon-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="mincommon-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="mincommon-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="mincommon-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="mincommon-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="mincommon-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="mincommon-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="mincommon-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="mincommon-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1180" height="672" fill="#FFFFFF"/>
<text x="590" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Smallest common value in two sorted arrays</text>
<text x="590" y="90" text-anchor="middle" font-size="19" fill="#475569">nums1 = [1, 3, 5, 7], nums2 = [3, 4, 5, 6, 8, 10]. Each value of nums1 is looked up in nums2.</text>
<rect x="86" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="106" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">3</text>
<text x="106" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">0</text>
<rect x="129" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="149" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">4</text>
<text x="149" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">1</text>
<rect x="172" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="192" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">5</text>
<text x="192" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">2</text>
<rect x="215" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="235" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">6</text>
<text x="235" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">3</text>
<rect x="258" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="278" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">8</text>
<text x="278" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">4</text>
<rect x="301" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="321" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">10</text>
<text x="321" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">5</text>
<text x="363" y="158" text-anchor="start" font-size="18.5" fill="#6B7280">index below each cell</text>
<text x="86" y="216" font-size="19.5" font-weight="600" fill="#475569">Step</text>
<text x="270" y="216" font-size="19.5" font-weight="600" fill="#475569">What happens</text>
<rect x="60" y="232" width="1060" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="262" font-size="18.5" font-weight="600" fill="#1D4ED8">searching 1</text>
<text x="270" y="262" font-size="18.5" fill="#475569">nums2[mid] = 5 is above 1, so move right to 1</text>
<rect x="60" y="290" width="1060" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="320" font-size="18.5" font-weight="600" fill="#1D4ED8">searching 1</text>
<text x="270" y="320" font-size="18.5" fill="#475569">nums2[mid] = 3 is above 1, so move right to -1</text>
<rect x="60" y="348" width="1060" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="378" font-size="18.5" font-weight="600" fill="#1D4ED8">searching 1</text>
<text x="270" y="378" font-size="18.5" fill="#475569">1 is not in nums2, so try the next value from nums1</text>
<rect x="60" y="406" width="1060" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="436" font-size="18.5" font-weight="600" fill="#1D4ED8">searching 3</text>
<text x="270" y="436" font-size="18.5" fill="#475569">nums2[mid] = 5 is above 3, so move right to 1</text>
<rect x="60" y="464" width="1060" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="494" font-size="18.5" font-weight="600" fill="#1D4ED8">searching 3</text>
<text x="270" y="494" font-size="18.5" fill="#475569">nums2[mid] = 3 equals 3, so 3 is the smallest common value</text>
<rect x="60" y="548" width="1060" height="92" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="84" y="568" width="250" height="38" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="209" y="593" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Answer: 3</text>
<text x="352" y="593" font-size="18.5" fill="#475569">nums1 is already sorted, so the first value found in nums2 is the smallest common one.</text>
</svg>