<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sync-title sync-desc">
<title id="sync-title">Why expiry synchronizes</title>
<desc id="sync-desc">Cache entries are usually created together by a deploy, a warming job, a traffic spike or one upstream event, so they expire together. Backend load then shows a flat baseline with a sharp spike exactly one expiry period after each event.</desc>
<defs>
<marker id="sync-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sync-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sync-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sync-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="770" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why expiry synchronizes</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Cache entries are usually created together by a deploy, a warming job, a traffic spike or one upstream event.</text>
<rect x="40" y="692" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="692" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Entries created together expire together</text>
<rect x="40" y="168" width="480" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="197" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A deploy or cache restart</text>
<path d="M526 191H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 191H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sync-marker-slate)"/>
<rect x="570" y="168" width="630" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="197" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every key repopulated within seconds of the others</text>
<rect x="40" y="222" width="480" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="251" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A scheduled warming job</text>
<path d="M526 245H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 245H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sync-marker-slate)"/>
<rect x="570" y="222" width="630" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="251" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one moment, one expiry value, every key</text>
<rect x="40" y="276" width="480" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="305" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A traffic spike that filled the cache</text>
<path d="M526 299H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 299H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sync-marker-slate)"/>
<rect x="570" y="276" width="630" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="305" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the spike writes its own shape into the expiry times</text>
<rect x="40" y="330" width="480" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="359" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One upstream event</text>
<path d="M526 353H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 353H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sync-marker-slate)"/>
<rect x="570" y="330" width="630" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="359" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a price refresh or a nightly import</text>
<text x="40" y="486" font-size="19" font-weight="700" fill="#4A5568" text-anchor="start">Backend</text><text x="40" y="510" font-size="19" font-weight="700" fill="#4A5568" text-anchor="start">load</text>
