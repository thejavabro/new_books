<rect x="40" y="590" width="1160" height="76" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="590" width="5" height="76" rx="2.5" fill="#F3CF6A"/><text x="64" y="619.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A cache that has just been cleared is not merely cold.</text><text x="64" y="648.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">It is cold on a timer, with the next wave already scheduled.</text>
<text x="66" y="726" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Misses that should arrive as an even trickle instead arrive as a wave, at a fixed period.</text>
