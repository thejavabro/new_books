<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" style="background-color:#ffffff">
<defs>
<marker id="sgc" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="sgd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="sge" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="50" width="280" height="86" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="50" width="280" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="170" y="69" text-anchor="middle" font-weight="bold">ApiClient  (context)</text>
<text x="42" y="96">- policy : RetryPolicy</text>
<text x="42" y="116">+ call(...)</text>
<text x="42" y="132" font-size="10.5" fill="#414d60">no branch on which policy it holds</text>

<rect x="520" y="50" width="320" height="86" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="50" width="320" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="680" y="69" text-anchor="middle" font-weight="bold">&#171;interface&#187; RetryPolicy</text>
<text x="532" y="96">+ name() : String</text>
<text x="532" y="116">+ delayBeforeAttempt(attempt) : int</text>
<text x="532" y="132" font-size="10.5" fill="#414d60">-1 means stop</text>

<rect x="60" y="242" width="220" height="46" fill="#dcefe4" stroke="#2f7a55"/>
<text x="170" y="270" text-anchor="middle" font-size="11.5">NoRetry</text>
<rect x="330" y="242" width="220" height="46" fill="#dcefe4" stroke="#2f7a55"/>
<text x="440" y="270" text-anchor="middle" font-size="11.5">FixedDelay</text>
<rect x="600" y="242" width="240" height="46" fill="#dcefe4" stroke="#2f7a55"/>
<text x="720" y="270" text-anchor="middle" font-size="11.5">ExponentialBackoff</text>

<path d="M 170 242 L 170 190 L 680 190 L 680 136" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#sgc)"/>
<path d="M 440 242 L 440 190" stroke="#000000" fill="none" stroke-dasharray="5 4"/>
<path d="M 720 242 L 720 190 L 680 190" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<path d="M 314 88 L 515 88" stroke="#000000" fill="none" marker-start="url(#sgd)" marker-end="url(#sge)"/>
<text x="326" y="80" font-size="11" fill="#414d60">holds exactly one, chosen from outside</text>

<rect x="30" y="316" width="900" height="68" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="340" font-size="12.5" fill="#414d60">This is the same diagram as State and Bridge. What separates them is intent, not shape.</text>
<text x="52" y="364" font-size="12.5" fill="#b4322c">Here the CALLER picks the policy, and no policy names another. In State the objects name each other and advance the machine themselves.</text>
</g>
</svg>