<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sequence-title sequence-desc">
<title id="sequence-title">The sequence, with its rollbacks</title>
<desc id="sequence-desc">Ten phases, each one deploy or one flag change, with the rollback stated for each. The rollback column is what makes it a plan rather than a list of commands.</desc>
<defs>
<marker id="sequence-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sequence-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sequence-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sequence-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="902" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The sequence, with its rollbacks</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Ten phases, each one deploy or one flag change, with the rollback stated for each.</text>
<rect x="40" y="824" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="824" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="56" height="46" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="68" y="148" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">0</text>
<rect x="112" y="118" width="620" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="422" y="147" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add the new structure, nullable</text>
<rect x="750" y="118" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="147" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">drop it</text>
<rect x="40" y="170" width="56" height="46" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="68" y="200" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">1</text>
<rect x="112" y="170" width="620" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="422" y="199" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Deploy dual-write code, flag off</text>
<rect x="750" y="170" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="199" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">revert the deploy</text>
<rect x="40" y="222" width="56" height="46" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="68" y="252" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">2</text>
<rect x="112" y="222" width="620" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="422" y="251" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Turn dual writing on</text>
<rect x="750" y="222" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="251" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">flag off, instantly</text>
<rect x="40" y="274" width="56" height="46" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="68" y="304" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">3</text>
<rect x="112" y="274" width="620" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="422" y="303" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Start the backfill, throttled</text>
<rect x="750" y="274" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="303" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stop it; its work is additive</text>
<rect x="40" y="326" width="56" height="46" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="68" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">4</text>
<rect x="112" y="326" width="620" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="422" y="355" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Gate: comparison at zero, and stays</text>
<rect x="750" y="326" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="355" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a change</text>
<rect x="40" y="378" width="56" height="46" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="68" y="408" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">5</text>
<rect x="112" y="378" width="620" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="422" y="407" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Dark launch the read</text>
<rect x="750" y="378" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="407" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">flag off</text>
<rect x="40" y="430" width="56" height="46" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="68" y="460" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">6</text>
<rect x="112" y="430" width="620" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="422" y="459" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Move reads, gradually</text>
<rect x="750" y="430" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="459" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">flag off</text>
<rect x="40" y="482" width="56" height="46" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="68" y="512" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">7</text>
<rect x="112" y="482" width="620" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="422" y="511" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Soak, writes still going to both</text>
<rect x="750" y="482" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="511" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">flag off</text>
<rect x="40" y="590" width="56" height="46" rx="7" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="68" y="620" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">8</text>
<rect x="112" y="590" width="620" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="422" y="619" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Stop writing the old</text>
<rect x="750" y="590" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="619" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">only until the data drifts</text>
<rect x="40" y="642" width="56" height="46" rx="7" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="68" y="672" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">9</text>
<rect x="112" y="642" width="620" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="422" y="671" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Remove the old structure</text>
<rect x="750" y="642" width="450" height="46" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="770" y="671" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">none</text>
<path d="M40 559H480" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<path d="M760 559H1200" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="620" y="566" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">The point of no return</text>
<rect x="40" y="716" width="1160" height="82" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="716" width="5" height="82" rx="2.5" fill="#AC8BE8"/><text x="64" y="750" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Phases 0 through 7 are all reversible in seconds, and there are eight of them.</text><text x="64" y="776" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">One dangerous moment, deliberately placed as late as possible.</text>
<text x="66" y="858" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The migration is almost entirely made of safe steps.</text>
</svg>