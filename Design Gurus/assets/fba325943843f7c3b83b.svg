<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="528" viewBox="0 0 1240 528" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="lsmwrite-title lsmwrite-desc">
<title id="lsmwrite-title">The LSM write path</title>
<desc id="lsmwrite-desc">A write is appended to the write-ahead log and inserted into the sorted in-memory memtable. When the memtable fills it is flushed to disk in one sequential pass as an immutable SSTable. Background compaction later merges SSTables, keeping the newest version of each key.</desc>
<defs>
<marker id="lsmwrite-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="lsmwrite-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="lsmwrite-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="lsmwrite-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="528" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The LSM write path</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The write path has three stages.</text>
<rect x="40" y="450" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="450" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="241" width="140" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="110" y="263.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write</text><text x="110" y="290.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">arrives</text>
<path d="M186 271H226" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M186 271H226" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmwrite-marker-slate)"/>
<rect x="232" y="118" width="330" height="306" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M246 118H238A6 6 0 0 0 232 124V418A6 6 0 0 0 238 424H246Z" fill="#39D5AA"/>
<circle cx="276" cy="146" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="276" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="306" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Append and insert</text>
<text x="397" y="192" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write-ahead log</text>
<rect x="271" y="202" width="44" height="40" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="293" y="229" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle"></text><rect x="323" y="202" width="44" height="40" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="345" y="229" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle"></text><rect x="375" y="202" width="44" height="40" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="397" y="229" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle"></text><rect x="427" y="202" width="44" height="40" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="449" y="229" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle"></text><rect x="479" y="202" width="44" height="40" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/>
<text x="397" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Memtable (in memory)</text>
<text x="397" y="300" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">sorted, mutable</text>
<rect x="281" y="310" width="52" height="40" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="307" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a</text><rect x="341" y="310" width="52" height="40" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="367" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">f</text><rect x="401" y="310" width="52" height="40" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="427" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">k</text><rect x="461" y="310" width="52" height="40" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="487" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">q</text>
<text x="397" y="380" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">Both sequential,</text><text x="397" y="404" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">at memory speed</text>
<path d="M568 271H608" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M568 271H608" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmwrite-marker-slate)"/>
<text x="588" y="256" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">full</text>
<rect x="614" y="118" width="290" height="306" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M628 118H620A6 6 0 0 0 614 124V418A6 6 0 0 0 620 424H628Z" fill="#5EC9EC"/>
<circle cx="658" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="658" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="688" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Flush to disk</text>
<text x="759" y="192" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">One sequential pass</text>
<rect x="646" y="204" width="226" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="759" y="235" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SSTable 3  (new)</text>
<rect x="646" y="264" width="226" height="50" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="759" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SSTable 2</text>
<rect x="646" y="324" width="226" height="50" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="759" y="355" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SSTable 1</text>
<text x="759" y="404" font-size="19" font-weight="700" fill="#155B9E" text-anchor="middle">Immutable once written</text>
<path d="M910 271H950" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M910 271H950" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsmwrite-marker-slate)"/>
<rect x="956" y="118" width="244" height="306" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M970 118H962A6 6 0 0 0 956 124V418A6 6 0 0 0 962 424H970Z" fill="#AC8BE8"/>
<circle cx="1000" cy="146" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1000" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1030" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Compaction</text>
<text x="1078" y="192" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">In the background</text>
<rect x="978" y="204" width="200" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1078" y="235" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">merged SSTable</text>
<text x="1078" y="294" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">newest version kept,</text><text x="1078" y="320" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">older ones dropped</text>
<text x="1078" y="380" font-size="19" font-weight="700" fill="#6040A8" text-anchor="middle">The deferred half</text><text x="1078" y="404" font-size="19" font-weight="700" fill="#6040A8" text-anchor="middle">of the write</text>
<rect x="40" y="450" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="450" width="5" height="52" rx="2.5" fill="#39D5AA"/><text x="64" y="469" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Nothing already on disk is ever modified.</text><text x="64" y="495" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">That single rule is what makes LSM writes fast and LSM reads expensive.</text>
<text x="66" y="484" font-size="21" font-weight="400" fill="#080C50" text-anchor="start"></text>
</svg>