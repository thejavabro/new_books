<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four named pressures that justify leaving ordinary REST, each with the shape it earns and the cost that shape accepts: long work becomes a job, many items become a bounded batch, a crowded screen earns embedding or a composite read or GraphQL, and high-volume internal traffic earns gRPC.">
  <defs>
    <marker id="xl10fourtri-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="xl10fourtri-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="xl10fourtri-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="xl10fourtri-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>

    <filter id="xl10fourtri-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl10fourtri-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl10fourtri-k1"><rect x="80" y="174" width="490" height="90" rx="12"/></clipPath>
    <clipPath id="xl10fourtri-k2"><rect x="670" y="174" width="490" height="90" rx="12"/></clipPath>
    <clipPath id="xl10fourtri-k3"><rect x="80" y="402" width="490" height="90" rx="12"/></clipPath>
    <clipPath id="xl10fourtri-k4"><rect x="670" y="402" width="490" height="90" rx="12"/></clipPath>
    <clipPath id="xl10fourtri-k5"><rect x="80" y="630" width="490" height="90" rx="12"/></clipPath>
    <clipPath id="xl10fourtri-k6"><rect x="670" y="630" width="490" height="90" rx="12"/></clipPath>
    <clipPath id="xl10fourtri-k7"><rect x="80" y="858" width="490" height="90" rx="12"/></clipPath>
    <clipPath id="xl10fourtri-k8"><rect x="670" y="858" width="490" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1190" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Four pressures, four answers, four costs</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each trigger earns a shape, and that shape accepts a cost</text>

  
  <rect x="40" y="126" width="1160" height="208" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">The work takes minutes</text>

  <g fill="none" stroke-width="2">
    <path d="M580,219 H668" stroke="#2563EB" marker-end="url(#xl10fourtri-bl)"/>
  </g>

  <g filter="url(#xl10fourtri-soft)">
    <rect x="80" y="174" width="490" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#xl10fourtri-k1)"/>
  </g>
  <circle cx="118" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="144" y="226" font-size="18.5" font-weight="600" fill="#111827">A job resource</text>
  <text x="325" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">202 Accepted, plus a Location header</text>
  <text x="325" y="312" font-size="15.5" text-anchor="middle" fill="#94A3B8">the header names the status resource</text>

  <g filter="url(#xl10fourtri-soft)">
    <rect x="670" y="174" width="490" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="670" y="174" width="6" height="90" fill="#DB2777" clip-path="url(#xl10fourtri-k2)"/>
  </g>
  <circle cx="708" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,208.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="734" y="226" font-size="18.5" font-weight="600" fill="#111827">Cost accepted</text>
  <text x="915" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">The caller manages an async lifecycle</text>
  <text x="915" y="312" font-size="15.5" text-anchor="middle" fill="#94A3B8">job status is stored, and results expire</text>

  
  <rect x="40" y="354" width="1160" height="208" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="384" font-size="16.5" font-weight="600" fill="#047857">One request acts on many items</text>

  <g fill="none" stroke-width="2">
    <path d="M580,447 H668" stroke="#059669" marker-end="url(#xl10fourtri-em)"/>
  </g>

  <g filter="url(#xl10fourtri-soft)">
    <rect x="80" y="402" width="490" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="402" width="6" height="90" fill="#059669" clip-path="url(#xl10fourtri-k3)"/>
  </g>
  <circle cx="118" cy="447" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,436.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="144" y="454" font-size="18.5" font-weight="600" fill="#111827">A bounded batch</text>
  <text x="325" y="517" font-size="15.5" text-anchor="middle" fill="#6B7280">One result per item</text>
  <text x="325" y="540" font-size="15.5" text-anchor="middle" fill="#94A3B8">one status code cannot cover them all</text>

  <g filter="url(#xl10fourtri-soft)">
    <rect x="670" y="402" width="490" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="670" y="402" width="6" height="90" fill="#DB2777" clip-path="url(#xl10fourtri-k4)"/>
  </g>
  <circle cx="708" cy="447" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,436.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="734" y="454" font-size="18.5" font-weight="600" fill="#111827">Cost accepted</text>
  <text x="915" y="517" font-size="15.5" text-anchor="middle" fill="#6B7280">Two levels of failure to handle</text>
  <text x="915" y="540" font-size="15.5" text-anchor="middle" fill="#94A3B8">the server defines size, idempotency, and limits</text>

  
  <rect x="40" y="582" width="1160" height="208" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="612" font-size="16.5" font-weight="600" fill="#B45309">One screen needs many resources</text>

  <g fill="none" stroke-width="2">
    <path d="M580,675 H668" stroke="#D97706" marker-end="url(#xl10fourtri-am)"/>
  </g>

  <g filter="url(#xl10fourtri-soft)">
    <rect x="80" y="630" width="490" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="630" width="6" height="90" fill="#D97706" clip-path="url(#xl10fourtri-k5)"/>
  </g>
  <circle cx="118" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,664.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="144" y="682" font-size="18.5" font-weight="600" fill="#111827">Embed, compose, or GraphQL</text>
  <text x="325" y="745" font-size="15.5" text-anchor="middle" fill="#6B7280">Three fixes, not one default</text>
  <text x="325" y="768" font-size="15.5" text-anchor="middle" fill="#94A3B8">GraphQL only when field sets differ</text>

  <g filter="url(#xl10fourtri-soft)">
    <rect x="670" y="630" width="490" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="670" y="630" width="6" height="90" fill="#DB2777" clip-path="url(#xl10fourtri-k6)"/>
  </g>
  <circle cx="708" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,664.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="734" y="682" font-size="18.5" font-weight="600" fill="#111827">Cost accepted</text>
  <text x="915" y="745" font-size="15.5" text-anchor="middle" fill="#6B7280">A larger body, or a new operation</text>
  <text x="915" y="768" font-size="15.5" text-anchor="middle" fill="#94A3B8">GraphQL adds query-cost control</text>

  
  <rect x="40" y="810" width="1160" height="208" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="840" font-size="16.5" font-weight="600" fill="#5B21B6">Internal calls at high volume</text>

  <g fill="none" stroke-width="2">
    <path d="M580,903 H668" stroke="#7C3AED" marker-end="url(#xl10fourtri-vi)"/>
  </g>

  <g filter="url(#xl10fourtri-soft)">
    <rect x="80" y="858" width="490" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="858" width="6" height="90" fill="#7C3AED" clip-path="url(#xl10fourtri-k7)"/>
  </g>
  <circle cx="118" cy="903" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,892.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="144" y="910" font-size="18.5" font-weight="600" fill="#111827">gRPC behind a gateway</text>
  <text x="325" y="973" font-size="15.5" text-anchor="middle" fill="#6B7280">Small typed messages, high volume</text>
  <text x="325" y="996" font-size="15.5" text-anchor="middle" fill="#94A3B8">encoding overhead is a measurable cost</text>

  <g filter="url(#xl10fourtri-soft)">
    <rect x="670" y="858" width="490" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="670" y="858" width="6" height="90" fill="#DB2777" clip-path="url(#xl10fourtri-k8)"/>
  </g>
  <circle cx="708" cy="903" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,892.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="734" y="910" font-size="18.5" font-weight="600" fill="#111827">Cost accepted</text>
  <text x="915" y="973" font-size="15.5" text-anchor="middle" fill="#6B7280">Generated clients and browser adaptation</text>
  <text x="915" y="996" font-size="15.5" text-anchor="middle" fill="#94A3B8">ad hoc debugging gets harder</text>

  
  <rect x="40" y="1042" width="1160" height="108" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1085" text-anchor="middle" font-size="16" fill="#475569">Explain the requirement and cost. Jobs and batches can still use REST.</text>
  <text x="620" y="1115" text-anchor="middle" font-size="16" fill="#475569">This does not rank technologies. It maps a product pressure to the contract that pressure earns.</text>
</svg>