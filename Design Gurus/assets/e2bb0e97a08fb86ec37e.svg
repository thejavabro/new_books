<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1300" viewBox="0 0 1240 1300" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The vocabulary used through the rest of the course, each term with a plain definition and the value it takes in the shipment example: provider, consumer, request, response, operation, endpoint, payload, status code, and contract.">
