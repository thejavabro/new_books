<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="worked-title worked-desc">
<title id="worked-title">Three minutes, one envelope</title>
<desc id="worked-desc">A worked cost estimate for a service at a thousand requests a second. Data transfer out is fifty-six percent of the bill and compute is twenty-nine, which is the opposite of what the mental model of a cloud bill predicts.</desc>
<defs>
<marker id="worked-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="worked-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="worked-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="worked-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="786" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three minutes, one envelope</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A worked cost estimate for a service at a thousand requests a second.</text>
<rect x="40" y="708" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="708" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="54" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="54" rx="2.5" fill="#5EC9EC"/><text x="64" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">1,000 req/sec average, peaking near 3,000, 20 KB per response, 2 TB database with one replica</text>
<rect x="40" y="192" width="1160" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="220" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">seconds per month  = 30 x 86,400</text><text x="1184" y="220" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">2.6 million</text>
<rect x="40" y="242" width="1160" height="42" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="270" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">requests per month = 1,000 x 2.6M</text><text x="1184" y="270" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">2.6 billion</text>
<rect x="40" y="308" width="300" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Data transfer out</text>
<text x="360" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">2.6B x 20 KB = 52 TB</text>
<text x="812" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$4,400</text>
<rect x="840" y="316" width="280" height="30" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="316" width="156.8" height="30" rx="10" fill="#F25461"/>
<text x="1192" y="338" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">56%</text>
<rect x="40" y="362" width="300" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="391" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Compute</text>
<text x="360" y="392" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">16 instances x $0.20/hr</text>
<text x="812" y="392" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$2,300</text>
<rect x="840" y="370" width="280" height="30" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="370" width="81.2" height="30" rx="10" fill="#159BEF"/>
<text x="1192" y="392" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">29%</text>
<rect x="40" y="416" width="300" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="190" y="445" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Database instances</text>
<text x="360" y="446" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">2 x $0.50/hr</text>
<text x="812" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$730</text>
<rect x="840" y="424" width="280" height="30" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="424" width="25.2" height="30" rx="10" fill="#7650D6"/>
<text x="1192" y="446" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">9%</text>
<rect x="40" y="470" width="300" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="499" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Storage</text>
<text x="360" y="500" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">4,000 GB x $0.10</text>
<text x="812" y="500" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$400</text>
<rect x="840" y="478" width="280" height="30" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="478" width="14.0" height="30" rx="10" fill="#06AC80"/>
<text x="1192" y="500" font-size="19" font-weight="700" fill="#080C50" text-anchor="end">5%</text>
<rect x="40" y="540" width="1160" height="50" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="571" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Total about $7,900 a month, and the proportion is the result that matters</text>
<rect x="40" y="614" width="1160" height="68" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="614" width="5" height="68" rx="2.5" fill="#F28B9D"/><text x="64" y="654" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Data transfer is larger than compute, which almost nobody predicts.</text>
<text x="66" y="742" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Rates move and should be looked up. The ratio is the durable part.</text>
</svg>