<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" role="img" aria-label="The seven steps of a system design interview and roughly how many minutes each takes: five to clarify requirements, three to estimate scale, four for the API, five for the data model, ten for the high-level design, thirteen for the deep dive and five for bottlenecks and failure points.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="620" fill="#FFFFFF"/>
  <rect x="40" y="48" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="40" y="48" width="8" height="62" rx="4" fill="#3B82F6"/>
  <circle cx="86" cy="79" r="19" fill="#3B82F6"/>
  <text x="86" y="86" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1</text>
  <text x="120" y="86" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Clarify the requirements</text>
  <rect x="620" y="66" width="440" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="620" y="66" width="49" height="26" rx="7" fill="#3B82F6" opacity="0.85"/>
  <text x="1190" y="86" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">5 min</text>
  <rect x="40" y="122" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="40" y="122" width="8" height="62" rx="4" fill="#3B82F6"/>
  <circle cx="86" cy="153" r="19" fill="#3B82F6"/>
  <text x="86" y="160" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2</text>
  <text x="120" y="160" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Estimate the scale</text>
  <rect x="620" y="140" width="440" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="620" y="140" width="29" height="26" rx="7" fill="#3B82F6" opacity="0.85"/>
  <text x="1190" y="160" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">3 min</text>
  <rect x="40" y="196" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="40" y="196" width="8" height="62" rx="4" fill="#6D28D9"/>
  <circle cx="86" cy="227" r="19" fill="#6D28D9"/>
  <text x="86" y="234" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">3</text>
  <text x="120" y="234" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Define the API</text>
  <rect x="620" y="214" width="440" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="620" y="214" width="39" height="26" rx="7" fill="#6D28D9" opacity="0.85"/>
  <text x="1190" y="234" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">4 min</text>
  <rect x="40" y="270" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/>
  <rect x="40" y="270" width="8" height="62" rx="4" fill="#6D28D9"/>
  <circle cx="86" cy="301" r="19" fill="#6D28D9"/>
  <text x="86" y="308" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">4</text>
  <text x="120" y="308" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Define the data model</text>
  <rect x="620" y="288" width="440" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="620" y="288" width="49" height="26" rx="7" fill="#6D28D9" opacity="0.85"/>
  <text x="1190" y="308" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">5 min</text>
  <rect x="40" y="344" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <rect x="40" y="344" width="8" height="62" rx="4" fill="#059669"/>
  <circle cx="86" cy="375" r="19" fill="#059669"/>
  <text x="86" y="382" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">5</text>
  <text x="120" y="382" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Draw the high-level design</text>
  <rect x="620" y="362" width="440" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="620" y="362" width="98" height="26" rx="7" fill="#059669" opacity="0.85"/>
  <text x="1190" y="382" font-size="20" font-weight="600" fill="#065F46" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">10 min</text>
  <rect x="40" y="418" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <rect x="40" y="418" width="8" height="62" rx="4" fill="#D97706"/>
  <circle cx="86" cy="449" r="19" fill="#D97706"/>
  <text x="86" y="456" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">6</text>
  <text x="120" y="456" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Go deep on two or three things</text>
  <rect x="620" y="436" width="440" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="620" y="436" width="127" height="26" rx="7" fill="#D97706" opacity="0.85"/>
  <text x="1190" y="456" font-size="20" font-weight="600" fill="#B45309" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">13 min</text>
  <rect x="40" y="492" width="1160" height="62" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <rect x="40" y="492" width="8" height="62" rx="4" fill="#DC2626"/>
  <circle cx="86" cy="523" r="19" fill="#DC2626"/>
  <text x="86" y="530" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">7</text>
  <text x="120" y="530" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Bottlenecks and failure points</text>
  <rect x="620" y="510" width="440" height="26" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="620" y="510" width="49" height="26" rx="7" fill="#DC2626" opacity="0.85"/>
  <text x="1190" y="530" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">5 min</text>
  <rect x="40" y="566" width="1160" height="40" rx="10" fill="none" stroke="none" stroke-width="1.5"/>
  <text x="620" y="594" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">About 45 minutes. Most of the time belongs to steps 5 and 6, and candidates who fail usually spend it on steps 1 and 2 instead.</text>
</svg>