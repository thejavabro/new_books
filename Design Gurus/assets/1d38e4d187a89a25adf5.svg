<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two filters of the same size combine with plain bit operations: OR produces the union, AND approximates the intersection">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <filter id="bf4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="46" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Two filters of the same size, built with the same hash functions</text>

  
  <text x="300" y="120" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">Filter A</text>
  <text x="300" y="210" font-size="20" font-weight="600" fill="#0F172A" text-anchor="end">Filter B</text>
  <text x="300" y="360" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">A OR B</text>
  <text x="300" y="470" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="end">A AND B</text>

  <text x="300" y="150" font-size="20" fill="#64748B" text-anchor="end">its own items</text>
  <text x="300" y="240" font-size="20" fill="#64748B" text-anchor="end">its own items</text>
  <text x="300" y="390" font-size="20" fill="#64748B" text-anchor="end">the union</text>
  <text x="300" y="500" font-size="20" fill="#64748B" text-anchor="end">the intersection,</text>
  <text x="300" y="530" font-size="20" fill="#64748B" text-anchor="end">approximately</text>

  
