<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The limiter passes requests through until the client reaches its cap, then rejects the rest with a 429 response">
  <rect x="0" y="0" width="1240" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="rl1-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rl1-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rl1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="rl1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <g transform="translate(0,-60)">
  <line x1="240" y1="235" x2="415" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#rl1-slate)"/>
  <line x1="730" y1="200" x2="910" y2="185" stroke="#059669" stroke-width="2.5" marker-end="url(#rl1-green)"/>
  <line x1="730" y1="270" x2="910" y2="320" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rl1-red)"/>

  <g filter="url(#rl1-soft)">
    <rect x="50" y="190" width="190" height="90" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <rect x="420" y="165" width="310" height="140" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
    <rect x="915" y="140" width="275" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="915" y="290" width="275" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <text x="145" y="228" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="145" y="258" font-size="20" fill="#475569" text-anchor="middle">8 requests</text>

  <text x="575" y="207" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Rate limiter</text>
  <text x="575" y="243" font-size="20" fill="#B45309" text-anchor="middle">5 requests</text>
  <text x="575" y="275" font-size="20" fill="#B45309" text-anchor="middle">per minute</text>

  <text x="1052" y="178" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Service</text>
  <text x="1052" y="208" font-size="20" fill="#059669" text-anchor="middle">5 requests served</text>

  <text x="1052" y="328" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">429 Too Many Requests</text>
  <text x="1052" y="358" font-size="20" fill="#DC2626" text-anchor="middle">3 requests rejected</text>

  <text x="820" y="168" font-size="20" font-weight="600" fill="#059669" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">allowed</text>
  <text x="812" y="330" font-size="20" font-weight="600" fill="#DC2626" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">rejected</text>

  <text x="620" y="435" font-size="20" fill="#475569" text-anchor="middle">The cap is per client and per window, so the sixth request in the same minute is rejected</text>
  </g>
</svg>