<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The SLI is the measured number, the SLO is the internal target above it, and the SLA is the looser external promise, with the gap between SLO and SLA acting as a buffer">
  <rect x="0" y="0" width="1240" height="708" fill="#FFFFFF"/>
  <defs>
    <marker id="ob1-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A measurement, a target, and a promise with money attached</text>

  <line x1="390" y1="232" x2="390" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#ob1-slate)"/>
  <line x1="390" y1="392" x2="390" y2="416" stroke="#475569" stroke-width="2" marker-end="url(#ob1-slate)"/>

  <rect x="50" y="100" width="680" height="130" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="70" y="140" font-size="20" font-weight="600" fill="#0F172A">SLI, what you measure</text>
  <text x="70" y="178" font-size="20" fill="#0F172A">uptime this month came out at 99.2%</text>
  <text x="70" y="210" font-size="20" fill="#64748B">a fact, not a promise</text>

  <rect x="50" y="260" width="680" height="130" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="70" y="300" font-size="20" font-weight="600" fill="#065F46">SLO, what you aim for</text>
  <text x="70" y="338" font-size="20" fill="#0F172A">99.9% a month, which allows about 43 minutes down</text>
  <text x="70" y="370" font-size="20" fill="#065F46">internal, and deliberately stricter than the SLA</text>

  <rect x="50" y="420" width="680" height="130" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="70" y="460" font-size="20" font-weight="600" fill="#B91C1C">SLA, what you promise</text>
  <text x="70" y="498" font-size="20" fill="#0F172A">99.5% a month, or the customer gets a credit</text>
  <text x="70" y="530" font-size="20" fill="#B91C1C">external, and it costs money to miss</text>

  
  <text x="985" y="90" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">uptime this month</text>

  <rect x="860" y="100" width="250" height="45" fill="#ECFDF5"/>
  <text x="985" y="128" font-size="20" fill="#065F46" text-anchor="middle">meeting the SLO</text>

  <rect x="860" y="145" width="250" height="180" fill="#FFFBEB"/>
  <text x="985" y="205" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">the buffer</text>
  <text x="985" y="234" font-size="20" fill="#92400E" text-anchor="middle">SLO missed here</text>
  <text x="985" y="262" font-size="20" fill="#92400E" text-anchor="middle">SLA still safe</text>

  <rect x="860" y="325" width="250" height="225" fill="#FEF2F2"/>
  <text x="985" y="392" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">SLA breached</text>
  <text x="985" y="420" font-size="20" fill="#B91C1C" text-anchor="middle">credits owed</text>

  <line x1="860" y1="100" x2="860" y2="550" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="860" y1="145" x2="1110" y2="145" stroke="#059669" stroke-width="2.5"/>
  <line x1="860" y1="325" x2="1110" y2="325" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="860" y1="460" x2="1110" y2="460" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 4"/>

  <text x="1120" y="151" font-size="20" font-weight="600" fill="#065F46">99.9 SLO</text>
  <text x="1120" y="331" font-size="20" font-weight="600" fill="#B91C1C">99.5 SLA</text>
  <text x="1120" y="466" font-size="20" font-weight="600" fill="#334155">99.2 now</text>

  
  <rect x="50" y="586" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="622" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The SLI is a fact, the SLO is a target, and the SLA is a bill. Only one of them costs money.</text>
  <text x="620" y="652" font-size="20" fill="#334155" text-anchor="middle">Set the SLO stricter than the SLA so you learn you are in trouble before your customers do.</text>
</svg>