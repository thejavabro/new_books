<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The pricing service is the single writer of its private price store, publishes a price changed event to an event stream, and the checkout and reporting services each keep a narrow local copy holding only the price fields they use.">
  <defs>
    <marker id="m05-l01-single-writer-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l01-single-writer-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m05-l01-single-writer-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <rect x="50" y="180" width="320" height="380" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="210" y="220" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Owner of the price data</text>
  <g filter="url(#m05-l01-single-writer-soft)">
    <rect x="70" y="250" width="280" height="110" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="210" y="296" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pricing service</text>
  <text x="210" y="328" text-anchor="middle" font-size="20" fill="#64748B">the single writer</text>
  <g filter="url(#m05-l01-single-writer-soft)">
    <path d="M70,440 L70,530 A140,20 0 0 0 350,530 L350,440" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="210" cy="440" rx="140" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="210" y="477" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Private price store</text>
  <text x="210" y="507" text-anchor="middle" font-size="20" fill="#64748B">the source of truth</text>

  <g filter="url(#m05-l01-single-writer-soft)">
    <rect x="410" y="250" width="300" height="110" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="560" y="296" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Event stream</text>
  <text x="560" y="328" text-anchor="middle" font-size="20" fill="#92400E">every change, published once</text>

  <rect x="740" y="100" width="460" height="640" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="970" y="140" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Consumers: narrow copies</text>
  <g filter="url(#m05-l01-single-writer-soft)">
    <rect x="760" y="180" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="970" y="237" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout service</text>
  <g filter="url(#m05-l01-single-writer-soft)">
    <path d="M790,330 L790,410 A180,20 0 0 0 1150,410 L1150,330" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="970" cy="330" rx="180" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="970" y="362" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Local copy</text>
  <text x="970" y="392" text-anchor="middle" font-size="20" fill="#64748B">price fields only</text>
  <g filter="url(#m05-l01-single-writer-soft)">
    <rect x="760" y="470" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="970" y="527" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Reporting service</text>
  <g filter="url(#m05-l01-single-writer-soft)">
    <path d="M790,620 L790,700 A180,20 0 0 0 1150,700 L1150,620" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="970" cy="620" rx="180" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="970" y="652" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Local copy</text>
  <text x="970" y="682" text-anchor="middle" font-size="20" fill="#64748B">price fields only</text>

  <g fill="none" stroke-width="2.5">
    <path d="M210,360 L210,412" stroke="#059669" marker-end="url(#m05-l01-single-writer-em)"/>
    <path d="M350,305 L402,305" stroke="#D97706" marker-end="url(#m05-l01-single-writer-am)"/>
    <path d="M710,285 C742,285 730,230 752,230" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l01-single-writer-am)"/>
    <path d="M710,325 C742,325 730,520 752,520" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l01-single-writer-am)"/>
    <path d="M970,280 L970,302" stroke="#059669" stroke-width="2" marker-end="url(#m05-l01-single-writer-em)"/>
    <path d="M970,570 L970,592" stroke="#059669" stroke-width="2" marker-end="url(#m05-l01-single-writer-em)"/>
  </g>

  <text x="228" y="392" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">writes</text>
  <text x="480" y="225" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">price changed event</text>
  <text x="620" y="790" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">Replicate with one clear writer, never share with two.</text>

  <line x1="60" y1="840" x2="96" y2="840" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="847" font-size="20" fill="#475569">Async event fan-out: one publisher, many consumers</text>
  <line x1="60" y1="880" x2="96" y2="880" stroke="#059669" stroke-width="4"/>
  <text x="108" y="887" font-size="20" fill="#475569">Each service writes only its own store</text>
</svg>