<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="wrong-title wrong-desc">
<title id="wrong-title">Objectives that change nothing</title>
<desc id="wrong-desc">Set to current performance, averaged across everything, measured on something users cannot feel, with no window, and above what the dependency chain permits.</desc>
<defs>
<marker id="wrong-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="wrong-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="wrong-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="wrong-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="760" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Objectives that change nothing</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four failures account for most SLOs that exist on paper and change nothing.</text>
<rect x="40" y="682" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="682" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="118" width="470" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="327" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Set to what the system already does</text>
<path d="M568 146H602" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M568 146H602" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="610" y="118" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">never missed, and therefore never informs anything</text>
<circle cx="60" cy="214" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="186" width="470" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="327" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One number across everything</text>
<path d="M568 214H602" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M568 214H602" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="610" y="186" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">checkout and avatar upload do not deserve the same target</text>
<circle cx="60" cy="282" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="254" width="470" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="327" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Measured on something users cannot feel</text>
<path d="M568 282H602" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M568 282H602" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="610" y="254" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">CPU and cache hit rate are signals, not service levels</text>
<circle cx="60" cy="350" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="322" width="470" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="327" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No window</text>
<path d="M568 350H602" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M568 350H602" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="610" y="322" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a percentage without a period is not a target</text>
<text x="40" y="412" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And the fifth, harder to see: your dependencies are inside your number</text>
<rect x="40" y="430" width="280" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="180" y="464" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">dependency A 99.9%</text>
<rect x="330" y="430" width="280" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="470" y="464" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">dependency B 99.9%</text>
<rect x="620" y="430" width="280" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="760" y="464" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">dependency C 99.9%</text>
<path d="M906 458H944" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M906 458H944" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-red)"/>
<rect x="952" y="430" width="248" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1076" y="464" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">99.7% ceiling</text>
<rect x="40" y="508" width="1160" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="508" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="64" y="547" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">That is your ceiling before you make a single mistake of your own.</text>
<rect x="40" y="590" width="1160" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="590" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="64" y="629" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A target nobody would act on is not a target. It is a wish that got written down.</text>
<text x="66" y="716" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An objective above what your dependencies allow cannot be met by trying harder.</text>
</svg>