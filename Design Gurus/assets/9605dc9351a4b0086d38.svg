<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="676" viewBox="0 0 1240 676" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every request consults the directory before reaching a shard, which makes the directory both an extra hop and a single point of failure">
  <rect x="0" y="0" width="1240" height="676" fill="#FFFFFF"/>
  <defs>
    <marker id="sh4-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="sh4-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="sh4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The directory sits on the request path</text>

  
  <line x1="264" y1="216" x2="392" y2="216" stroke="#3B82F6" stroke-width="2" marker-end="url(#sh4-blue)"/>
  <text x="328" y="192" font-size="20" fill="#1E40AF" text-anchor="middle">which shard?</text>

  <path d="M696 216 L764 216 L764 306 L824 306" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#sh4-blue)"/>
  <text x="764" y="192" font-size="20" fill="#1E40AF" text-anchor="middle">go to shard 3</text>

  
  <g filter="url(#sh4-soft)">
    <rect x="80" y="180" width="184" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="396" y="164" width="300" height="104" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="172" y="224" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Request</text>
  <text x="546" y="198" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Directory</text>
  <text x="546" y="228" font-size="20" fill="#5B21B6" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">Acme  = Shard 3</text>
  <text x="546" y="256" font-size="20" fill="#5B21B6" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">Globex = Shard 1</text>

  <g filter="url(#sh4-soft)">
    <rect x="832" y="132" width="290" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="832" y="204" width="290" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="832" y="276" width="290" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  </g>
  <text x="977" y="170" font-size="20" fill="#64748B" text-anchor="middle">Shard 1</text>
  <text x="977" y="242" font-size="20" fill="#64748B" text-anchor="middle">Shard 2</text>
  <text x="977" y="314" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Shard 3</text>

  
  <path d="M546 272 L546 372" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#sh4-red)"/>
  <text x="562" y="330" font-size="20" fill="#B91C1C">if this is down</text>

  <rect x="300" y="380" width="492" height="76" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="546" y="412" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">nothing can be routed at all</text>
  <text x="546" y="440" font-size="20" fill="#B91C1C" text-anchor="middle">every shard is healthy and unreachable</text>

  
  <rect x="80" y="496" width="1080" height="140" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="528" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The flexibility is real, and so is the price</text>
  <text x="620" y="562" font-size="20" fill="#475569" text-anchor="middle">Move a tenant to a new shard by editing one row, with no rehashing and no data reshuffle.</text>
  <text x="620" y="592" font-size="20" fill="#475569" text-anchor="middle">In exchange you add a hop to every request and a component that must never go down.</text>
  <text x="620" y="622" font-size="20" fill="#475569" text-anchor="middle">In practice the directory is replicated and cached in memory at every caller.</text>
</svg>