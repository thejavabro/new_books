<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="890" viewBox="0 0 1240 890" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. The mesh control plane issues and rotates certificates for the Checkout and Payments sidecars, the two sidecars present certificates to each other, the Payments sidecar verifies the caller identity is checkout, and the real request then travels encrypted on the mTLS connection.">
  <defs>
    <marker id="m06-l05-mtls-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m06-l05-mtls-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m06-l05-mtls-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m06-l05-mtls-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="890" fill="#FFFFFF"/>

  <rect x="60" y="180" width="1120" height="170" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="220" font-size="20" font-weight="600" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Before any traffic: the mesh issues every certificate</text>
  <rect x="60" y="390" width="1120" height="330" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="430" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Every internal call: both sides prove identity first</text>
  <text x="1160" y="430" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">enforced by the sidecars</text>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="230" y1="145" x2="230" y2="740"/>
    <line x1="610" y1="145" x2="610" y2="740"/>
    <line x1="990" y1="145" x2="990" y2="740"/>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M236,290 L604,290" stroke="#7C3AED" stroke-width="2" marker-end="url(#m06-l05-mtls-vi)"/>
    <path d="M236,330 L984,330" stroke="#7C3AED" stroke-width="2" marker-end="url(#m06-l05-mtls-vi)"/>
    <path d="M616,490 L984,490" stroke="#7C3AED" stroke-width="2" marker-end="url(#m06-l05-mtls-vi)"/>
    <path d="M984,545 L616,545" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l05-mtls-vi)"/>
    <path d="M616,700 L984,700" stroke="#3B82F6" marker-end="url(#m06-l05-mtls-bl)"/>
  </g>

  <text x="420" y="278" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Issue and rotate the certificate</text>
  <text x="800" y="318" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Issue and rotate the certificate</text>
  <text x="800" y="478" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Connect and present a certificate</text>
  <text x="800" y="533" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Present a certificate back</text>
  <text x="800" y="688" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Encrypted request on the mTLS connection</text>

  <g filter="url(#m06-l05-mtls-soft)">
    <rect x="80" y="580" width="440" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="300" y="610" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The handshake produces two things</text>
  <text x="300" y="642" text-anchor="middle" font-size="20" fill="#64748B">an encrypted connection, and a</text>
  <text x="300" y="674" text-anchor="middle" font-size="20" fill="#64748B">cryptographic identity, not an IP</text>
  <g filter="url(#m06-l05-mtls-soft)">
    <rect x="780" y="580" width="380" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="970" y="632" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Verified caller: checkout</text>

  <g filter="url(#m06-l05-mtls-soft)">
    <rect x="90" y="50" width="280" height="95" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="230" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Mesh control plane</text>
  <text x="230" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">the certificate authority</text>
  <g filter="url(#m06-l05-mtls-soft)">
    <rect x="470" y="50" width="280" height="95" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="610" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout sidecar</text>
  <text x="610" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">proxy beside Checkout</text>
  <g filter="url(#m06-l05-mtls-soft)">
    <rect x="850" y="50" width="280" height="95" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="990" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments sidecar</text>
  <text x="990" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">proxy beside Payments</text>

  <line x1="60" y1="770" x2="96" y2="770" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="777" font-size="20" fill="#475569">Certificates: issued, rotated, presented (dashed is the reply)</text>
  <line x1="60" y1="810" x2="96" y2="810" stroke="#059669" stroke-width="4"/>
  <text x="108" y="817" font-size="20" fill="#475569">The identity check passes</text>
  <line x1="60" y1="850" x2="96" y2="850" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="857" font-size="20" fill="#475569">The real request, encrypted on the mTLS connection</text>
</svg>