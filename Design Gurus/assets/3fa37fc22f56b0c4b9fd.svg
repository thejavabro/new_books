<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Allowed downtime per year and per 30-day month: 99 percent allows 87.6 hours and 7.2 hours, 99.9 percent allows 8.76 hours and 43.2 minutes, 99.95 percent allows 4.38 hours and 21.6 minutes, 99.99 percent allows 52.6 minutes and 4.32 minutes, 99.999 percent allows 5.26 minutes and 25.9 seconds">
