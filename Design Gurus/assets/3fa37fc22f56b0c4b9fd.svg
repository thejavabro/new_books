  <text x="640" y="470" font-size="21.5" font-weight="600" fill="#111827">52.6 minutes</text>
  <text x="930" y="470" font-size="21.5" font-weight="600" fill="#111827">4.32 minutes</text>
  <text x="330" y="556" font-size="19.5" fill="#475569">five nines</text>
  <text x="640" y="556" font-size="21.5" font-weight="600" fill="#111827">5.26 minutes</text>
  <text x="930" y="556" font-size="21.5" font-weight="600" fill="#111827">25.9 seconds</text>
  <text x="40" y="634" font-size="18.5" fill="#6B7280">A year is 365 days (525,600 minutes) and a month is 30 days (43,200 minutes).</text>
  <text x="40" y="662" font-size="18.5" fill="#6B7280">Each extra nine cuts the allowed downtime by a factor of 10.</text>




</svg>