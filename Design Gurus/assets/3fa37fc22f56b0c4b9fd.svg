  <text x="64" y="150" font-size="18.5" font-weight="600" fill="#475569">Availability</text>
  <text x="330" y="150" font-size="18.5" font-weight="600" fill="#475569">Common name</text>
  <text x="640" y="150" font-size="18.5" font-weight="600" fill="#475569">Downtime per year</text>
