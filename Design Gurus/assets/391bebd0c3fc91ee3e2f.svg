<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="824" viewBox="0 0 1240 824" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ident-title ident-desc">
<title id="ident-title">The identifier that travels</title>
<desc id="ident-desc">One identifier attached at the edge and carried through everything that happens because of the request, using the standard header rather than an invented one.</desc>
<defs>
<marker id="ident-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ident-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ident-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ident-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="824" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The identifier that travels</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Propagation is the hard part, and it fails silently.</text>
<rect x="40" y="746" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="746" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="192" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="136" y="142.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">edge</text><text x="136" y="169.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">id generated</text>
<path d="M238 150H276" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M238 150H276" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ident-marker-slate)"/>
<rect x="282" y="118" width="192" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="378" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">api</text>
<path d="M480 150H518" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M480 150H518" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ident-marker-slate)"/>
<rect x="524" y="118" width="192" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">service A</text>
<path d="M722 150H760" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M722 150H760" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ident-marker-slate)"/>
<rect x="766" y="118" width="192" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="862" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">queue</text>
<path d="M964 150H1002" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M964 150H1002" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ident-marker-slate)"/>
<rect x="1008" y="118" width="192" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1104" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">worker</text>
<text x="620" y="208" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">the queue hop is where propagation breaks, and nothing errors when it does</text>
<rect x="40" y="224" width="1160" height="212" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 224H46A6 6 0 0 0 40 230V430A6 6 0 0 0 46 436H54Z" fill="#5EC9EC"/>
<text x="70" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01</text>
<text x="70" y="304" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">version</text>
<text x="240" y="304" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">00</text>
<text x="1170" y="304" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">2 hex digits</text>
<text x="70" y="332" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">trace id</text>
<text x="240" y="332" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">4bf92f3577b34da6a3ce929d0e0e4736</text>
<text x="1170" y="332" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">32 hex digits</text>
<text x="70" y="360" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">span id</text>
<text x="240" y="360" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">00f067aa0ba902b7</text>
<text x="1170" y="360" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">16 hex digits</text>
<text x="70" y="388" font-size="19" font-weight="700" fill="#080C50" text-anchor="start">flags</text>
<text x="240" y="388" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">01</text>
<text x="1170" y="388" font-size="19" font-weight="400" fill="#8795A5" text-anchor="end">2 hex digits</text>
<text x="70" y="424" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a W3C recommendation, which is why every proxy and vendor already carries it</text>
<circle cx="60" cy="484" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="491" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="456" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="490" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Generated at the edge</text>
<path d="M536 484H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 484H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ident-marker-slate)"/>
<rect x="580" y="456" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="490" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so nothing inside the system is ever without one</text>
<circle cx="60" cy="548" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="555" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="520" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="554" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Propagated everywhere</text>
<path d="M536 548H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 548H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ident-marker-slate)"/>
<rect x="580" y="520" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="554" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">synchronous calls, queue messages, scheduled work</text>
<circle cx="60" cy="612" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="619" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="584" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="618" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Returned to the caller</text>
<path d="M536 612H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 612H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ident-marker-slate)"/>
<rect x="580" y="584" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="618" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a support ticket with an id is a two-minute investigation</text>
<rect x="40" y="660" width="1160" height="60" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="660" width="5" height="60" rx="2.5" fill="#F28B9D"/><text x="64" y="696" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A header you invented stops at the first component you did not write.</text>
<text x="66" y="780" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The gap is almost always an asynchronous hop, and it fails without an error.</text>
</svg>