<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="826" viewBox="0 0 1240 826" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Each cardinality converts by a fixed rule: one to one becomes a unique foreign key, one to many puts the key on the many side, many to many becomes a new table, and a unary relationship points back at the same table">
<defs>
<marker id="rdb10-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="826" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="150" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="64" y="68" font-size="16.5" font-weight="600" fill="#1D4ED8">One-to-one (1:1)</text>
<rect x="90" y="108" width="140" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="160" y="136" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Instructor</text>
<path d="M284,130 L330,104 L376,130 L330,156 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="330" y="135" text-anchor="middle" font-size="13.5" fill="#111827">assigned</text>
<rect x="430" y="108" width="140" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="500" y="136" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Office</text>
<g stroke="#2563EB" stroke-width="1.5" fill="none"><path d="M230,130 H284"/><path d="M376,130 H430"/></g>
<text x="257" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">1</text>
<text x="403" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#1D4ED8">1</text>
<path d="M600,130 H650" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#rdb10-mslate)"/>
<rect x="680" y="102" width="496" height="56" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="700" y="126" font-size="15.5" font-weight="600" fill="#111827">Office gets instructor_id</text>
<text x="700" y="147" font-size="15.5" fill="#6B7280">plus a UNIQUE constraint, so only one each way</text>

<rect x="40" y="206" width="1160" height="150" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="64" y="234" font-size="16.5" font-weight="600" fill="#5B21B6">One-to-many (1:N), and many-to-one (N:1) read the other way</text>
<rect x="90" y="274" width="140" height="44" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="160" y="302" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Department</text>
<path d="M284,296 L330,270 L376,296 L330,322 Z" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="330" y="301" text-anchor="middle" font-size="13.5" fill="#111827">offers</text>
<rect x="430" y="274" width="140" height="44" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="500" y="302" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Course</text>
<g stroke="#7C3AED" stroke-width="1.5" fill="none"><path d="M230,296 H284"/><path d="M376,296 H430"/></g>
<text x="257" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#5B21B6">1</text>
<text x="403" y="288" text-anchor="middle" font-size="14" font-weight="600" fill="#5B21B6">N</text>
<path d="M600,296 H650" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#rdb10-mslate)"/>
<rect x="680" y="268" width="496" height="56" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="700" y="292" font-size="15.5" font-weight="600" fill="#111827">Course gets department_id</text>
<text x="700" y="313" font-size="15.5" fill="#6B7280">the foreign key always goes on the many side</text>

<rect x="40" y="372" width="1160" height="150" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="64" y="400" font-size="16.5" font-weight="600" fill="#047857">Many-to-many (M:N), the rule worth memorising</text>
<rect x="90" y="440" width="140" height="44" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<text x="160" y="468" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Student</text>
<path d="M284,462 L330,436 L376,462 L330,488 Z" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
<text x="330" y="467" text-anchor="middle" font-size="13.5" fill="#111827">enrols</text>
<rect x="430" y="440" width="140" height="44" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
<text x="500" y="468" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Course</text>
<g stroke="#059669" stroke-width="1.5" fill="none"><path d="M230,462 H284"/><path d="M376,462 H430"/></g>
<text x="257" y="454" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">M</text>
<text x="403" y="454" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">N</text>
<path d="M600,462 H650" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#rdb10-mslate)"/>
<rect x="680" y="434" width="496" height="56" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="700" y="458" font-size="15.5" font-weight="600" fill="#111827">a new table Enrolment(student_id, course_id)</text>
<text x="700" y="479" font-size="15.5" fill="#6B7280">both columns together are its primary key</text>

<rect x="40" y="538" width="1160" height="150" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
<text x="64" y="566" font-size="16.5" font-weight="600" fill="#B45309">Unary, an entity linked to itself</text>
<rect x="160" y="606" width="140" height="44" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
<text x="230" y="634" text-anchor="middle" font-size="15.5" font-weight="600" fill="#111827">Employee</text>
<path d="M414,628 L460,602 L506,628 L460,654 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="460" y="633" text-anchor="middle" font-size="13.5" fill="#111827">supervises</text>
<g stroke="#D97706" stroke-width="1.5" fill="none">
<path d="M300,620 H414"/>
<path d="M460,602 V582 Q460,570 448,570 H242 Q230,570 230,582 V606"/>
</g>
<text x="357" y="612" text-anchor="middle" font-size="14" font-weight="600" fill="#B45309">N</text>
<text x="345" y="562" text-anchor="middle" font-size="14" font-weight="600" paint-order="stroke" stroke="#FFFBEB" stroke-width="5" fill="#B45309">1</text>
<path d="M600,628 H650" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#rdb10-mslate)"/>
<rect x="680" y="600" width="496" height="56" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
<text x="700" y="624" font-size="15.5" font-weight="600" fill="#111827">Employee gets supervisor_id</text>
<text x="700" y="645" font-size="15.5" fill="#6B7280">the foreign key points back at Employee itself</text>

<rect x="40" y="722" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="760" font-size="16" fill="#475569">Participation decides one more thing: total participation makes that foreign key NOT NULL, partial participation lets it be empty.</text>
</svg>