<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1308" viewBox="0 0 1240 1308" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six hard parts of the feature flag API: one call rather than one call per flag, a change that must arrive within seconds, why the cache must be private, rare and dangerous writes, offline fallback, and configuring values rather than per-client contract shapes. Each hard part is shown with the decision it forces.">
  <defs>
    <filter id="p2t-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2t-ks"><rect x="800" y="64" width="24" height="22" rx="7"/></clipPath>
    <clipPath id="p2t-k1"><rect x="76" y="146" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2t-k2"><rect x="76" y="322" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2t-k3"><rect x="76" y="498" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2t-k4"><rect x="76" y="674" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2t-k5"><rect x="76" y="850" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2t-k6"><rect x="76" y="1026" width="420" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1308" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Six hard parts, six decisions</text>

  <rect x="800" y="64" width="24" height="22" rx="7" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <rect x="800" y="64" width="5" height="22" fill="#D97706" clip-path="url(#p2t-ks)"/>
  <text x="834" y="77" font-size="15.5" fill="#6B7280">the hard part</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M975,71.5 H989 M984.5,67 L989,71.5 L984.5,76"/>
  </g>
  <text x="1005" y="77" font-size="15.5" fill="#6B7280">the decision it forces</text>

  
  <rect x="40" y="126" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2t-soft)">
    <rect x="76" y="146" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#D97706" clip-path="url(#p2t-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">One call, not one call per flag</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,256.5 H92 M87.5,252 L92,256.5 L87.5,261"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">One GET returns every allowed value for one bounded context</text>

  
  <rect x="40" y="302" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2t-soft)">
    <rect x="76" y="322" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="322" width="6" height="90" fill="#D97706" clip-path="url(#p2t-k2)"/>
  </g>
  <circle cx="114" cy="367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,356.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="374" font-size="18.5" font-weight="600" fill="#111827">Change within seconds</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,432.5 H92 M87.5,428 L92,432.5 L87.5,437"/>
  </g>
  <text x="104" y="438" font-size="15.5" fill="#6B7280">SSE pushes a complete replacement snapshot, reusing the chapter resume contract</text>

  
  <rect x="40" y="478" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2t-soft)">
    <rect x="76" y="498" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="498" width="6" height="90" fill="#D97706" clip-path="url(#p2t-k3)"/>
  </g>
  <circle cx="114" cy="543" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,532.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="550" font-size="18.5" font-weight="600" fill="#111827">The cache must be private</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,608.5 H92 M87.5,604 L92,608.5 L87.5,613"/>
  </g>
  <text x="104" y="614" font-size="15.5" fill="#6B7280">private, max-age=5 with an ETag; a personalized body is never public</text>

  
  <rect x="40" y="654" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2t-soft)">
    <rect x="76" y="674" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="674" width="6" height="90" fill="#D97706" clip-path="url(#p2t-k4)"/>
  </g>
  <circle cx="114" cy="719" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,708.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="726" font-size="18.5" font-weight="600" fill="#111827">Writes are rare and dangerous</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,784.5 H92 M87.5,780 L92,784.5 L87.5,789"/>
  </g>
  <text x="104" y="790" font-size="15.5" fill="#6B7280">feature_flags:write, a current If-Match, and an audit record in the same operation</text>

  
  <rect x="40" y="830" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2t-soft)">
    <rect x="76" y="850" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="850" width="6" height="90" fill="#D97706" clip-path="url(#p2t-k5)"/>
  </g>
  <circle cx="114" cy="895" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,884.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="902" font-size="18.5" font-weight="600" fill="#111827">Offline fallback</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,960.5 H92 M87.5,956 L92,960.5 L87.5,965"/>
  </g>
  <text x="104" y="966" font-size="15.5" fill="#6B7280">Last-known values until a published deadline, then compiled defaults</text>

  
  <rect x="40" y="1006" width="1160" height="158" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2t-soft)">
    <rect x="76" y="1026" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1026" width="6" height="90" fill="#D97706" clip-path="url(#p2t-k6)"/>
  </g>
  <circle cx="114" cy="1071" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1060.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="140" y="1078" font-size="18.5" font-weight="600" fill="#111827">Values, not contract shapes</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1136.5 H92 M87.5,1132 L92,1136.5 L87.5,1141"/>
  </g>
  <text x="104" y="1142" font-size="15.5" fill="#6B7280">A tenant configures documented values, and never invents fields or requiredness</text>

  
  <rect x="40" y="1192" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1237" text-anchor="middle" font-size="16" fill="#475569">Each hard part is a constraint the requirements already set. The line under it is the decision that constraint forces.</text>
</svg>