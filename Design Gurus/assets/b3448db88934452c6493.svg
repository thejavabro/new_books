<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Server-Sent Events: the client subscribes once over HTTP and the server streams events down the open connection, one way only">
  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>
  <defs>
    <marker id="rt5-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rt5-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rt5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="240" y1="112" x2="240" y2="480" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1000" y1="112" x2="1000" y2="480" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="248" y1="196" x2="990" y2="196" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt5-blue)"/>
  <text x="620" y="172" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Client subscribes once: GET /updates (EventSource)</text>

  
  <rect x="120" y="222" width="1000" height="324" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="140" y="256" font-size="20" font-weight="600" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Connection stays open: the server streams events</text>

  <line x1="992" y1="326" x2="250" y2="326" stroke="#059669" stroke-width="2.5" marker-end="url(#rt5-emerald)"/>
  <text x="620" y="302" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">event: score update</text>

  <line x1="992" y1="396" x2="250" y2="396" stroke="#059669" stroke-width="2.5" marker-end="url(#rt5-emerald)"/>
  <text x="620" y="372" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">event: price change</text>

  <line x1="992" y1="466" x2="250" y2="466" stroke="#059669" stroke-width="2.5" marker-end="url(#rt5-emerald)"/>
  <text x="620" y="442" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">event: news alert</text>

  <text x="620" y="512" font-size="20" font-weight="600" fill="#334155" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Data flows one way only: server to client</text>

  
  <rect x="240" y="586" width="760" height="56" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="620" font-size="20" fill="#334155" text-anchor="middle">If the connection drops, the browser reconnects automatically.</text>

  
  <g filter="url(#rt5-soft)">
    <rect x="100" y="40" width="280" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="860" y="40" width="280" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="240" y="98" font-size="20" fill="#64748B" text-anchor="middle">browser with EventSource</text>
  <text x="1000" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="1000" y="98" font-size="20" fill="#64748B" text-anchor="middle">sends events as they happen</text>
</svg>