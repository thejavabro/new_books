<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of an order inside the checkout saga. The order starts pending, moves to stock reserved, then payment pending, then confirmed once the charge succeeds and fulfillment starts. An abandoned order or a declined charge moves it to cancelled after compensations run in reverse. Pending, stock reserved and payment pending are in-flight states that other services can read, because a saga gives atomicity over time and not isolation.">
  <defs>
    <marker id="m05-l04-order-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l04-order-states-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l04-order-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l04-order-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l04-order-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <rect x="60" y="100" width="880" height="230" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="140" font-size="20" font-weight="600" fill="#334155">In-flight states</text>
  <text x="920" y="140" text-anchor="end" font-size="20" fill="#64748B">other services can read every one</text>

  <g filter="url(#m05-l04-order-states-soft)">
    <rect x="80" y="200" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="210" y="246" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pending</text>
  <text x="210" y="278" text-anchor="middle" font-size="20" fill="#64748B">order row created</text>
  <g filter="url(#m05-l04-order-states-soft)">
    <rect x="370" y="200" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="500" y="246" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Stock reserved</text>
  <text x="500" y="278" text-anchor="middle" font-size="20" fill="#64748B">2 units held</text>
  <g filter="url(#m05-l04-order-states-soft)">
    <rect x="660" y="200" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="790" y="246" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment pending</text>
  <text x="790" y="278" text-anchor="middle" font-size="20" fill="#64748B">$59 charge in flight</text>
  <g filter="url(#m05-l04-order-states-soft)">
    <rect x="980" y="200" width="200" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1080" y="246" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Confirmed</text>
  <text x="1080" y="278" text-anchor="middle" font-size="20" fill="#64748B">fulfillment started</text>
  <g filter="url(#m05-l04-order-states-soft)">
    <rect x="360" y="470" width="300" height="150" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="510" y="520" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cancelled</text>
  <text x="510" y="552" text-anchor="middle" font-size="20" fill="#64748B">compensations ran</text>
  <text x="510" y="584" text-anchor="middle" font-size="20" fill="#64748B">no order, no hold, no charge</text>

  <g filter="url(#m05-l04-order-states-soft)">
    <rect x="700" y="470" width="480" height="190" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="940" y="508" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Atomicity over time, not isolation</text>
  <text x="940" y="540" text-anchor="middle" font-size="20" fill="#0F172A">a report that runs mid-saga counts a</text>
  <text x="940" y="572" text-anchor="middle" font-size="20" fill="#0F172A">reservation about to be released</text>
  <text x="940" y="604" text-anchor="middle" font-size="20" fill="#0F172A">mitigate with pending states as semantic</text>
  <text x="940" y="636" text-anchor="middle" font-size="20" fill="#0F172A">locks, and readers that tolerate them</text>

  <g fill="none" stroke-width="2.5">
    <path d="M52,255 L72,255" stroke="#475569" stroke-width="2" marker-end="url(#m05-l04-order-states-sl)"/>
    <path d="M340,255 L362,255" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l04-order-states-ab)"/>
    <path d="M630,255 L652,255" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l04-order-states-ab)"/>
    <path d="M920,255 L972,255" stroke="#059669" marker-end="url(#m05-l04-order-states-em)"/>
    <path d="M210,310 L210,545 L352,545" stroke="#DC2626" stroke-width="2" marker-end="url(#m05-l04-order-states-rd)"/>
    <path d="M795,310 L795,430 L560,430 L560,462" stroke="#DC2626" marker-end="url(#m05-l04-order-states-rd)"/>
  </g>

  <circle cx="40" cy="255" r="12" fill="#475569"/>

  <text x="351" y="180" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">stock reserved</text>
  <text x="641" y="180" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge submitted</text>
  <text x="946" y="180" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge succeeded</text>
  <text x="226" y="420" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">order abandoned</text>
  <text x="810" y="400" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge declined,</text>
  <text x="810" y="426" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">compensations run</text>

  <line x1="60" y1="700" x2="96" y2="700" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="707" font-size="20" fill="#475569">Forward saga step, fired by the previous step's event</text>
  <line x1="60" y1="740" x2="96" y2="740" stroke="#059669" stroke-width="4"/>
  <text x="108" y="747" font-size="20" fill="#475569">Success: the saga finished and the order is final</text>
  <line x1="60" y1="780" x2="96" y2="780" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="787" font-size="20" fill="#475569">Failure: compensations run in reverse</text>
</svg>