<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A token bucket holding twenty thousand units. Admission removes six thousand, the input tokens plus the caller maximum output. Generation actually produces six hundred output tokens, so fourteen hundred unused units return to the bucket. Billing follows the actual forty six hundred, not the reservation.">
  <defs>
    <marker id="p2b-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p2b-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p2b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2b-kA"><rect x="104" y="142" width="220" height="210" rx="12"/></clipPath>
    <clipPath id="p2b-kB"><rect x="510" y="142" width="220" height="210" rx="12"/></clipPath>
    <clipPath id="p2b-kC"><rect x="916" y="142" width="220" height="210" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="772" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="402" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Reserve at admission, settle at the end</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">one bucket, three moments</text>

  
  <rect x="64" y="90" width="300" height="332" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="120" font-size="16.5" font-weight="600" fill="#047857">Before admission</text>

  <rect x="470" y="90" width="300" height="332" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="494" y="120" font-size="16.5" font-weight="600" fill="#B45309">While generating</text>

  <rect x="876" y="90" width="300" height="332" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="900" y="120" font-size="16.5" font-weight="600" fill="#047857">After the terminal event</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M364,247 H470" stroke="#D97706" marker-end="url(#p2b-am)"/>
    <path d="M770,247 H876" stroke="#059669" marker-end="url(#p2b-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="417" y="227" fill="#B45309">reserve</text>
    <text x="417" y="279" fill="#B45309">6,000</text>
    <text x="823" y="227" fill="#047857">return</text>
    <text x="823" y="279" fill="#047857">1,400</text>
  </g>

  
  <g filter="url(#p2b-soft)">
    <rect x="104" y="142" width="220" height="210" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#p2b-kA)">
    <rect x="104" y="142" width="220" height="210" fill="#D1FAE5"/>
    <rect x="104" y="142" width="6" height="210" fill="#059669"/>
  </g>
  <rect x="104" y="142" width="220" height="210" rx="12" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
  <circle cx="214" cy="318" r="18" fill="#FFFFFF"/>
  <g transform="translate(203.56,307.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="214" y="254" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">20,000</text>
  <text x="214" y="377" text-anchor="middle" font-size="15.5" fill="#6B7280">token units in the bucket</text>
  <text x="214" y="400" text-anchor="middle" font-size="15.5" fill="#94A3B8">100 percent of capacity</text>

  
  <g filter="url(#p2b-soft)">
    <rect x="510" y="142" width="220" height="210" rx="12" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#p2b-kB)">
    <rect x="510" y="205" width="220" height="147" fill="#FEF3C7"/>
    <rect x="510" y="205" width="220" height="2.4" fill="#D97706"/>
    <rect x="510" y="142" width="6" height="210" fill="#D97706"/>
  </g>
  <rect x="510" y="142" width="220" height="210" rx="12" fill="none" stroke="#FCD34D" stroke-width="1.5"/>
  <circle cx="620" cy="318" r="18" fill="#FFFFFF"/>
  <g transform="translate(609.56,307.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="620" y="179" text-anchor="middle" font-size="15.5" fill="#94A3B8">6,000 held</text>
  <text x="620" y="285" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">14,000</text>
  <text x="620" y="377" text-anchor="middle" font-size="15.5" fill="#6B7280">token units in the bucket</text>
  <text x="620" y="400" text-anchor="middle" font-size="15.5" fill="#94A3B8">70 percent of capacity</text>

  
  <g filter="url(#p2b-soft)">
    <rect x="916" y="142" width="220" height="210" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#p2b-kC)">
    <rect x="916" y="190" width="220" height="162" fill="#D1FAE5"/>
    <rect x="916" y="190" width="220" height="2.4" fill="#059669"/>
    <rect x="916" y="142" width="6" height="210" fill="#059669"/>
  </g>
  <rect x="916" y="142" width="220" height="210" rx="12" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
  <circle cx="1026" cy="318" r="18" fill="#FFFFFF"/>
  <g transform="translate(1015.56,307.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="1026" y="172" text-anchor="middle" font-size="15.5" fill="#94A3B8">4,600 spent</text>
  <text x="1026" y="278" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">15,400</text>
  <text x="1026" y="377" text-anchor="middle" font-size="15.5" fill="#6B7280">token units in the bucket</text>
  <text x="1026" y="400" text-anchor="middle" font-size="15.5" fill="#94A3B8">77 percent of capacity</text>

  
  <rect x="40" y="468" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="488" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="510" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Reserved</text>
  <text x="288" y="510" font-size="15.5" fill="#475569">input 4,000 + maximum output 2,000 = 6,000 reserved at admission</text>

  <rect x="64" y="532" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="554" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Billable</text>
  <text x="288" y="554" font-size="15.5" fill="#475569">input 4,000 + actual output 600 = 4,600 billable</text>

  <rect x="64" y="576" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="598" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Returned</text>
  <text x="288" y="598" font-size="15.5" fill="#475569">the unused 1,400 returns to the bucket</text>

  
  <rect x="40" y="664" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="709" text-anchor="middle" font-size="16" fill="#475569">Reservation protects capacity. Asking for the model maximum every time reduces what you can run.</text>
</svg>