    <clipPath id="jdg1-k6"><rect x="856" y="404" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="jdg1-k7"><rect x="64" y="680" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="jdg1-k8"><rect x="460" y="680" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="jdg1-k9"><rect x="856" y="680" width="320" height="90" rx="12"/></clipPath>
    <marker id="jdg1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="jdg1-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="jdg1-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="jdg1-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="jdg1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1620" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Code judging system: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The submission returns immediately and the code runs somewhere else. Everything hard here is about running a stranger’s code safely.</text>

  <rect x="40" y="344" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="374" font-size="19.5" font-weight="600" fill="#1D4ED8">Services behind the gateway</text>
  <rect x="40" y="620" width="1160" height="236" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="650" font-size="19.5" font-weight="600" fill="#5B21B6">Execution, deliberately far from everything else</text>
  <rect x="100" y="900" width="1100" height="306" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="124" y="930" font-size="19.5" font-weight="600" fill="#475569">Stores</text>

  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#jdg1-m-blue)"/>
    <path d="M1080,150 V132 Q1080,120 1068,120 H172 Q160,120 160,132 V144" stroke="#D97706" marker-end="url(#jdg1-m-amber)"/>
    <path d="M540,312 V338" stroke="#2563EB" stroke-width="2.5" marker-end="url(#jdg1-m-blue)"/>
    <path d="M224,544 V614" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#jdg1-m-violet)"/>
    <path d="M404,725 H454" stroke="#7C3AED" marker-end="url(#jdg1-m-violet)"/>
    <path d="M800,725 H850" stroke="#DB2777" stroke-width="2.5" marker-end="url(#jdg1-m-pink)"/>
    <path d="M400,856 V954" stroke="#64748B" stroke-width="2.5" marker-end="url(#jdg1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="336" y="183" fill="#1D4ED8">HTTPS</text>
    <text x="620" y="110" fill="#B45309">cached problem pages</text>
    <text x="680" y="310" fill="#1D4ED8">routes to services</text>
    <text x="330" y="590" fill="#5B21B6">publish, then reply</text>
    <text x="520" y="886" fill="#475569">verdict and stats</text>
  </g>

  <g filter="url(#jdg1-soft)">
    <rect x="40" y="150" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#jdg1-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web and app</text>
  <g filter="url(#jdg1-lift)">
    <rect x="400" y="150" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="400" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#jdg1-k2)"/>
  </g>
  <circle cx="438" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="464" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="540" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">auth and rate limits</text>
  <g filter="url(#jdg1-soft)">
    <rect x="960" y="150" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="960" y="150" width="6" height="90" fill="#D97706" clip-path="url(#jdg1-k3)"/>
  </g>
  <circle cx="998" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(987.56,184.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="1024" y="202" font-size="21.5" font-weight="600" fill="#111827">CDN</text>
  <text x="1080" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">problem pages</text>
  <g filter="url(#jdg1-soft)">
    <rect x="64" y="404" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="404" width="6" height="90" fill="#2563EB" clip-path="url(#jdg1-k4)"/>
  </g>
  <circle cx="102" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,438.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="456" font-size="21.5" font-weight="600" fill="#111827">Submission</text>
  <text x="224" y="523" font-size="18.5" text-anchor="middle" fill="#6B7280">accepts code and returns</text>
  <g filter="url(#jdg1-soft)">
    <rect x="460" y="404" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="460" y="404" width="6" height="90" fill="#2563EB" clip-path="url(#jdg1-k5)"/>
  </g>
  <circle cx="498" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,438.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="524" y="456" font-size="21.5" font-weight="600" fill="#111827">Problem</text>
  <text x="620" y="523" font-size="18.5" text-anchor="middle" fill="#6B7280">statements and test cases</text>
  <g filter="url(#jdg1-soft)">
    <rect x="856" y="404" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="856" y="404" width="6" height="90" fill="#2563EB" clip-path="url(#jdg1-k6)"/>
  </g>
  <circle cx="894" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(883.56,438.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="920" y="456" font-size="21.5" font-weight="600" fill="#111827">Leaderboard</text>
  <text x="1016" y="523" font-size="18.5" text-anchor="middle" fill="#6B7280">ranks, from Redis</text>
  <g filter="url(#jdg1-soft)">
    <rect x="64" y="680" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="680" width="6" height="90" fill="#7C3AED" clip-path="url(#jdg1-k7)"/>
  </g>
  <circle cx="102" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,714.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="732" font-size="21.5" font-weight="600" fill="#111827">Submission queue</text>
  <text x="234" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">Kafka, one job per run</text>
  <g filter="url(#jdg1-soft)">
    <rect x="460" y="680" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="460" y="680" width="6" height="90" fill="#7C3AED" clip-path="url(#jdg1-k8)"/>
  </g>
  <circle cx="498" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,714.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="524" y="732" font-size="21.5" font-weight="600" fill="#111827">Execution service</text>
  <text x="630" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">hands work to the pool</text>
  <g filter="url(#jdg1-lift)">
    <rect x="856" y="680" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="856" y="680" width="9" height="90" fill="#DB2777" clip-path="url(#jdg1-k9)"/>
  </g>
  <circle cx="894" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(883.56,714.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="920" y="732" font-size="21.5" font-weight="600" fill="#111827">Sandboxed workers</text>
  <text x="1016" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">a container per run</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M124,960 L124,1034 A150,16 0 0 0 424,1034 L424,960" fill="#E0E7FF"/>
    <ellipse cx="274" cy="960" rx="150" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="274" y="1012" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Submissions</text>
  <text x="274" y="1084" font-size="18.5" text-anchor="middle" fill="#6B7280">code, verdict, runtime</text>
  <text x="274" y="1111" font-size="18.5" text-anchor="middle" fill="#94A3B8">one row per attempt</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M476,960 L476,1034 A150,16 0 0 0 776,1034 L776,960" fill="#D1FAE5"/>
    <ellipse cx="626" cy="960" rx="150" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="626" y="1012" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Problems</text>
  <text x="626" y="1084" font-size="18.5" text-anchor="middle" fill="#6B7280">statements and metadata</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M828,960 L828,1034 A150,16 0 0 0 1128,1034 L1128,960" fill="#E2E8F0"/>
    <ellipse cx="978" cy="960" rx="150" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="978" y="1012" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Test cases</text>
  <text x="978" y="1084" font-size="18.5" text-anchor="middle" fill="#6B7280">object storage, S3 or HDFS</text>
  <text x="978" y="1111" font-size="18.5" text-anchor="middle" fill="#94A3B8">too big for a database</text>

  <rect x="40" y="1250" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1275" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1300" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">The submit is async</text>
  <text x="323" y="1300" font-size="18.5" fill="#475569">the API returns a job id, and the browser polls or waits on a socket for the verdict</text>
  <rect x="64" y="1325" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1350" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Assume the code is hostile</text>
  <text x="323" y="1350" font-size="18.5" fill="#475569">it runs in a throwaway container with no network, a CPU cap and a hard timeout</text>
  <rect x="64" y="1375" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="1400" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Test cases are objects</text>
  <text x="323" y="1400" font-size="18.5" fill="#475569">they are megabytes of text, so they live in object storage and are cached near the workers</text>
  <rect x="64" y="1425" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1450" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">One queue absorbs the spike</text>
  <text x="323" y="1450" font-size="18.5" fill="#475569">a contest starts and submissions jump a hundredfold, and only the queue length moves</text>
</svg>