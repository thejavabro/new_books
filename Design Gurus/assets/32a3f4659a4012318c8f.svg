    </filter>
    <clipPath id="jdg1-k1"><rect x="40" y="150" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="jdg1-k2"><rect x="400" y="150" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="jdg1-k3"><rect x="960" y="150" width="240" height="90" rx="12"/></clipPath>
