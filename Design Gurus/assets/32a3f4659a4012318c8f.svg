<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1620" viewBox="0 0 1240 1620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A LeetCode style code judging system: the submission service accepts code and publishes to a Kafka submission queue, the code execution service runs it on a pool of workers against test cases pulled from object storage, and results land in the submission database and the leaderboard">
