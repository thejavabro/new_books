<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Push: the server sends each update as it happens. Pull: the client asks on a timer, and most answers come back empty">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="mc4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="mc4-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="mc4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="mc4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="530" rx="14" fill="#ECFDF5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Push: the server starts</text>

  <rect x="640" y="76" width="580" height="530" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Pull: the client starts</text>

  
  <g filter="url(#mc4-soft)">
    <rect x="50" y="110" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="390" y="110" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="140" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="480" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <line x1="140" y1="174" x2="140" y2="470" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="480" y1="174" x2="480" y2="470" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <line x1="150" y1="230" x2="470" y2="230" stroke="#059669" stroke-width="2" marker-end="url(#mc4-emerald)"/>
  <text x="310" y="208" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">new message</text>
  <line x1="150" y1="330" x2="470" y2="330" stroke="#059669" stroke-width="2" marker-end="url(#mc4-emerald)"/>
  <text x="310" y="308" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">price alert</text>
  <line x1="150" y1="430" x2="470" y2="430" stroke="#059669" stroke-width="2" marker-end="url(#mc4-emerald)"/>
  <text x="310" y="408" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">order shipped</text>

  <text x="310" y="516" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">3 events, 3 messages, no wasted traffic</text>
  <text x="310" y="556" font-size="20" fill="#64748B" text-anchor="middle">the server must track every client it can reach</text>

  
  <g filter="url(#mc4-soft)">
    <rect x="670" y="110" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="1010" y="110" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="760" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="1100" y="149" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <line x1="760" y1="174" x2="760" y2="470" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1100" y1="174" x2="1100" y2="470" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="930" y="204" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">poll</text>
  <line x1="1090" y1="222" x2="770" y2="222" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc4-blue)"/>
  <line x1="770" y1="252" x2="1090" y2="252" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mc4-slate)"/>
  <text x="930" y="280" font-size="20" fill="#94A3B8" text-anchor="middle">nothing new</text>

  <text x="930" y="322" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">poll</text>
  <line x1="1090" y1="340" x2="770" y2="340" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc4-blue)"/>
  <line x1="770" y1="370" x2="1090" y2="370" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mc4-slate)"/>
  <text x="930" y="398" font-size="20" fill="#94A3B8" text-anchor="middle">nothing new</text>

  <text x="930" y="440" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">poll</text>
  <line x1="1090" y1="458" x2="770" y2="458" stroke="#3B82F6" stroke-width="2" marker-end="url(#mc4-blue)"/>
  <line x1="770" y1="488" x2="1090" y2="488" stroke="#059669" stroke-width="2" marker-end="url(#mc4-emerald)"/>

  <text x="930" y="516" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">3 polls, 2 wasted, 3 updates arriving late</text>
  <text x="930" y="556" font-size="20" fill="#64748B" text-anchor="middle">no per-client state, but never current</text>

  
  <text x="620" y="670" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Push pays with state and complexity. Pull pays with delay and empty requests.</text>
</svg>