<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="roles-title roles-desc">
<title id="roles-title">Three roles, and the term that orders them</title>
<desc id="roles-desc">A follower that hears nothing becomes a candidate, and a candidate that collects a majority becomes leader. Terms are a logical clock, and a node seeing a higher term knows its information is stale.</desc>
<defs>
<marker id="roles-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="roles-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="roles-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="roles-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="708" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three roles, and the term that orders them</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A follower that hears nothing becomes a candidate, and a candidate that collects a majority becomes leader.</text>
<rect x="40" y="630" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="630" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="124" width="300" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Follower</text>
<rect x="470" y="124" width="300" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Candidate</text>
<rect x="900" y="124" width="300" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1050" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Leader</text>
<path d="M346 154H464" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 154H464" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-marker-slate)"/>
<text x="405" y="144" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">timeout</text>
<path d="M776 154H894" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M776 154H894" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-marker-green)"/>
<text x="835" y="144" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">majority</text>
<path d="M620 186V222H190V188" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 186V222H190V188" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-marker-slate)"/>
<text x="405" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">hears from a legitimate leader</text>
<path d="M1050 186V268H120V188" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1050 186V268H120V188" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roles-marker-red)"/>
<text x="620" y="290" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">sees a higher term</text>
<rect x="40" y="314" width="560" height="180" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 314H46A6 6 0 0 0 40 320V488A6 6 0 0 0 46 494H54Z" fill="#AC8BE8"/><text x="70" y="350" font-size="23" font-weight="700" fill="#6040A8" text-anchor="start">Terms are a logical clock</text>
<rect x="64" y="370" width="512" height="104" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="84" y="390.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A number that only increases. A term</text><text x="84" y="415.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">begins with an election and lasts until</text><text x="84" y="440.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the next one. Any message with a higher</text><text x="84" y="465.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">term means you have been left behind.</text>
<rect x="640" y="314" width="560" height="180" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 314H646A6 6 0 0 0 640 320V488A6 6 0 0 0 646 494H654Z" fill="#39D5AA"/><text x="670" y="350" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Two rules carry the safety</text>
<rect x="664" y="370" width="512" height="104" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="684" y="390.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Each node votes once per term, so two</text><text x="684" y="415.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">leaders in one term are impossible.</text><text x="684" y="440.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A vote is granted only if the candidate</text><text x="684" y="465.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">log is at least as current as the voter.</text>
<rect x="40" y="520" width="1160" height="84" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="520" width="5" height="84" rx="2.5" fill="#F3CF6A"/><text x="64" y="553.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Election timeouts are randomized across a few hundred milliseconds.</text><text x="64" y="582.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Without that, nodes time out together, split the vote and repeat.</text>
<text x="66" y="662" font-size="18" font-weight="400" fill="#080C50" text-anchor="start">At most one leader at a time, and all writes go through it. A decision about being understandable, not a performance one.</text>
</svg>