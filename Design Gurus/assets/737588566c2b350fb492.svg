<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Customer app, Restaurant app and Courier app call one backend application over HTTPS. The backend holds six modules: Orders, Menu, Dispatch, Notifications, Accounts and Payments. All modules store data in one PostgreSQL database, and only Payments calls the external payment provider.">
