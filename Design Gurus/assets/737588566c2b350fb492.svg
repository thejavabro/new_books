    <clipPath id="mf01a-k8"><rect x="384" y="440" width="244" height="90" rx="12"/></clipPath>
    <clipPath id="mf01a-k9"><rect x="652" y="440" width="244" height="90" rx="12"/></clipPath>
    <clipPath id="mf01a-k10"><rect x="960" y="440" width="240" height="90" rx="12"/></clipPath>
    <marker id="mf01a-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="mf01a-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The food-delivery app: first version</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three apps call one backend application; six modules share one PostgreSQL database.</text>

  <rect x="360" y="130" width="560" height="455" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="384" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Backend application: one deployable artifact</text>

  <g fill="none" stroke-width="2">
    <path d="M290,225 H360" stroke="#2563EB" marker-end="url(#mf01a-m-blue)"/>
    <path d="M290,375 H360" stroke="#2563EB" marker-end="url(#mf01a-m-blue)"/>
    <path d="M290,525 H360" stroke="#2563EB" marker-end="url(#mf01a-m-blue)"/>
    <path d="M920,310 H980" stroke="#2563EB" marker-end="url(#mf01a-m-blue)"/>
    <path d="M896,485 H960" stroke="#2563EB" marker-end="url(#mf01a-m-blue)"/>
    <path d="M628,225 H640 V485 H652" stroke="#2563EB" stroke-linejoin="round" marker-end="url(#mf01a-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="325" y="212" fill="#1D4ED8">HTTPS</text>
    <text x="325" y="362" fill="#1D4ED8">HTTPS</text>
    <text x="325" y="512" fill="#1D4ED8">HTTPS</text>
    <text x="640" y="429" fill="#1D4ED8" stroke="#EFF6FF">calls</text>
    <text x="950" y="297" fill="#1D4ED8">SQL</text>
  </g>

  <g filter="url(#mf01a-soft)">
    <rect x="40" y="180" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
