    <clipPath id="mf01a-k2"><rect x="40" y="330" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="mf01a-k3"><rect x="40" y="480" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="mf01a-k4"><rect x="384" y="180" width="244" height="90" rx="12"/></clipPath>
    <clipPath id="mf01a-k5"><rect x="652" y="180" width="244" height="90" rx="12"/></clipPath>
    <clipPath id="mf01a-k6"><rect x="384" y="310" width="244" height="90" rx="12"/></clipPath>
