  <circle cx="422" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(411.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="448" y="232" font-size="21.5" font-weight="600" fill="#111827">Orders</text>
  <text x="506" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">creates and tracks orders</text>
  <g filter="url(#mf01a-soft)">
    <rect x="652" y="180" width="244" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="652" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#mf01a-k5)"/>
  </g>
  <circle cx="690" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(679.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="716" y="232" font-size="21.5" font-weight="600" fill="#111827">Menu</text>
  <text x="774" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">dishes, prices, hours</text>
  <g filter="url(#mf01a-soft)">
    <rect x="384" y="310" width="244" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="384" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#mf01a-k6)"/>
  </g>
  <circle cx="422" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(411.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="448" y="362" font-size="21.5" font-weight="600" fill="#111827">Dispatch</text>
  <text x="506" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">assigns couriers</text>
  <g filter="url(#mf01a-soft)">
    <rect x="652" y="310" width="244" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="652" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#mf01a-k7)"/>
  </g>
  <circle cx="690" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(679.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="716" y="362" font-size="21.5" font-weight="600" fill="#111827">Notifications</text>
  <text x="774" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">push messages and texts</text>
  <g filter="url(#mf01a-soft)">
    <rect x="384" y="440" width="244" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="384" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#mf01a-k8)"/>
  </g>
  <circle cx="422" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(411.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="448" y="492" font-size="21.5" font-weight="600" fill="#111827">Accounts</text>
  <text x="506" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">users and logins</text>
  <g filter="url(#mf01a-soft)">
    <rect x="652" y="440" width="244" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="652" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#mf01a-k9)"/>
  </g>
  <circle cx="690" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(679.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="716" y="492" font-size="21.5" font-weight="600" fill="#111827">Payments</text>
  <text x="774" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">charges and refunds</text>
  <g filter="url(#mf01a-soft)">
    <rect x="960" y="440" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="960" y="440" width="6" height="90" fill="#64748B" clip-path="url(#mf01a-k10)"/>
  </g>
  <circle cx="998" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(987.56,474.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="1024" y="479.25" font-size="21.5" font-weight="600" fill="#111827">Payment</text>
  <text x="1024" y="504.75" font-size="21.5" font-weight="600" fill="#111827">provider</text>
  <text x="1080" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">external, over HTTPS</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M980,250 L980,354 A110,16 0 0 0 1200,354 L1200,250" fill="#DBEAFE"/>
    <ellipse cx="1090" cy="250" rx="110" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1090" y="317" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">PostgreSQL</text>
  <text x="1090" y="404" font-size="18.5" text-anchor="middle" fill="#6B7280">one shared database</text>



  <rect x="40" y="650" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Client apps</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">installed on phones; they call the backend over HTTPS</text>
  <rect x="64" y="725" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="750" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Modules</text>
  <text x="323" y="750" font-size="18.5" fill="#475569">one job each; they call each other with function calls in one process</text>
  <rect x="64" y="775" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="800" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">One database</text>
  <text x="323" y="800" font-size="18.5" fill="#475569">every module stores its data in the same PostgreSQL database</text>
  <rect x="64" y="825" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="850" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">External provider</text>
  <text x="323" y="850" font-size="18.5" fill="#475569">only the Payments module talks to it</text>
</svg>