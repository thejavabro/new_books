  </g>
  <circle cx="78" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,214.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2"/><path d="M11 18h2"/></g>
  <text x="104" y="232" font-size="21.5" font-weight="600" fill="#111827">Customer app</text>
  <text x="165" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">browses and orders</text>
  <g filter="url(#mf01a-soft)">
    <rect x="40" y="330" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="40" y="330" width="6" height="90" fill="#4F46E5" clip-path="url(#mf01a-k2)"/>
  </g>
  <circle cx="78" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,364.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2"/><path d="M11 18h2"/></g>
  <text x="104" y="382" font-size="21.5" font-weight="600" fill="#111827">Restaurant app</text>
  <text x="165" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">accepts and prepares</text>
  <g filter="url(#mf01a-soft)">
    <rect x="40" y="480" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="40" y="480" width="6" height="90" fill="#4F46E5" clip-path="url(#mf01a-k3)"/>
  </g>
  <circle cx="78" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,514.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2"/><path d="M11 18h2"/></g>
  <text x="104" y="532" font-size="21.5" font-weight="600" fill="#111827">Courier app</text>
  <text x="165" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">picks up and delivers</text>
  <g filter="url(#mf01a-soft)">
    <rect x="384" y="180" width="244" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="384" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#mf01a-k4)"/>
