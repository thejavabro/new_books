<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" style="background-color:#ffffff">
<defs>
<marker id="tma" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#3a6fb0"/></marker>
<marker id="tmb" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#b4322c"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="26" font-size="13.5" font-weight="bold">run() is written once. Its five steps always happen, and always in this order.</text>

<rect x="30" y="44" width="150" height="52" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="105" y="68" text-anchor="middle" font-size="12">read rows</text>
<text x="105" y="85" text-anchor="middle" font-size="10.5" fill="#b4322c">varies</text>

<rect x="210" y="44" width="150" height="52" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="285" y="68" text-anchor="middle" font-size="12">parse each row</text>
<text x="285" y="85" text-anchor="middle" font-size="10.5" fill="#b4322c">varies</text>

<rect x="390" y="44" width="150" height="52" rx="4" fill="#f6ecd6" stroke="#8a5f10"/>
<text x="465" y="68" text-anchor="middle" font-size="12">validate</text>
<text x="465" y="85" text-anchor="middle" font-size="10.5" fill="#8a5f10">optional, a hook</text>

<rect x="570" y="44" width="150" height="52" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="645" y="68" text-anchor="middle" font-size="12">save</text>
<text x="645" y="85" text-anchor="middle" font-size="10.5" fill="#2f7a55">shared, written once</text>

<rect x="750" y="44" width="150" height="52" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="825" y="68" text-anchor="middle" font-size="12">report done</text>
<text x="825" y="85" text-anchor="middle" font-size="10.5" fill="#2f7a55">shared</text>

<path d="M 184 70 L 205 70" stroke="#3a6fb0" fill="none" marker-end="url(#tma)"/>
<path d="M 364 70 L 385 70" stroke="#3a6fb0" fill="none" marker-end="url(#tma)"/>
<path d="M 544 70 L 565 70" stroke="#3a6fb0" fill="none" marker-end="url(#tma)"/>
<path d="M 724 70 L 745 70" stroke="#3a6fb0" fill="none" marker-end="url(#tma)"/>

<text x="30" y="146" font-size="12.5" font-weight="bold" fill="#414d60">Subclasses fill in only the parts that differ</text>

<rect x="30" y="162" width="420" height="106" rx="4" fill="#ffffff" stroke="#c3cfe0"/>
<text x="46" y="184" font-size="12" font-weight="bold">CsvImportJob</text>
<text x="46" y="206" font-size="11.5">read rows: split the file into lines</text>
<text x="46" y="226" font-size="11.5">parse each row: take the field before the comma</text>
<text x="46" y="248" font-size="11.5" fill="#8a5f10">validate: keeps the default, so it runs</text>

<rect x="480" y="162" width="420" height="106" rx="4" fill="#ffffff" stroke="#c3cfe0"/>
<text x="496" y="184" font-size="12" font-weight="bold">JsonImportJob</text>
<text x="496" y="206" font-size="11.5">read rows: parse the file into objects</text>
<text x="496" y="226" font-size="11.5">parse each row: read the id field</text>
<text x="496" y="248" font-size="11.5" fill="#8a5f10">validate: overrides the hook, so it is skipped</text>

<path d="M 350 158 L 350 128 L 240 128 L 240 100" stroke="#b4322c" fill="none" stroke-dasharray="4 3" marker-end="url(#tmb)"/>
<path d="M 760 158 L 760 128 L 465 128 L 465 100" stroke="#b4322c" fill="none" stroke-dasharray="4 3" marker-end="url(#tmb)"/>

<rect x="30" y="292" width="900" height="120" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="316" font-size="12.5" fill="#414d60">Neither subclass can change the order, add a step, or skip the save. run() is marked final, so the shape of the algorithm is guaranteed.</text>
<text x="52" y="340" font-size="12.5" fill="#414d60">The duplication this removes is not in the code that differs. It is in the code that does not: the flow, the ordering, and the save.</text>
<text x="52" y="366" font-size="12.5" fill="#b4322c">The cost is inheritance. Reading CsvImportJob alone does not show you the flow, and you cannot combine two variations,</text>
<text x="52" y="384" font-size="12.5" fill="#b4322c">because a CSV importer that is also encrypted would need two parents.</text>
<text x="52" y="404" font-size="11.5" fill="#414d60">Python, JavaScript and other languages without final rely on convention here, which is worth saying out loud in a review.</text>
</g>
</svg>