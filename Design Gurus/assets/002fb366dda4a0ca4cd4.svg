<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The browser connects with HTTPS to the load balancer. The load balancer decrypts the traffic and holds the certificate. It forwards requests to app servers inside the network, over HTTP or over a new encrypted connection.">
  <defs>
    <filter id="hs4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="hs4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="hs4-k1"><rect x="40" y="140" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="hs4-k2"><rect x="475" y="140" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="hs4-k3"><rect x="910" y="140" width="290" height="90" rx="12"/></clipPath>
    <marker id="hs4-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="hs4-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="510" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">TLS termination at the load balancer</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Encryption from the browser ends at the load balancer, which holds the certificate.</text>



  <g fill="none" stroke-width="2">
    <path d="M330,185 H475" stroke="#059669" marker-end="url(#hs4-m-emerald)"/>
    <path d="M765,185 H910" stroke="#2563EB" marker-end="url(#hs4-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="402" y="173" fill="#047857">HTTPS</text>
    <text x="837" y="173" fill="#1D4ED8">HTTP or TLS</text>
  </g>

  <g filter="url(#hs4-soft)">
    <rect x="40" y="140" width="290" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#hs4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Browser</text>
  <g filter="url(#hs4-lift)">
    <rect x="475" y="140" width="290" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="475" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#hs4-k2)"/>
  </g>
  <circle cx="513" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(502.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="539" y="192" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">decrypts traffic</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">holds the certificate</text>
  <g filter="url(#hs4-soft)">
    <rect x="910" y="140" width="290" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="910" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#hs4-k3)"/>
  </g>
  <circle cx="948" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(937.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="974" y="192" font-size="21.5" font-weight="600" fill="#111827">App servers</text>
  <text x="1055" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">inside your network</text>

  <rect x="40" y="330" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Termination</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">the load balancer decrypts, so app servers do less work</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Inside traffic</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">many teams encrypt it again, because the internal network may not be private</text>
</svg>