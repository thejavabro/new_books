<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="924" viewBox="0 0 1240 924" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On the left the literal resource design reads the project and the task list, then makes twenty assignee calls and twenty comment-count calls, which is up to forty-two calls across two network stages. On the right one bounded project overview response carries the header and the task rows, so the screen makes one call in one stage.">
  <defs>
    <marker id="p3e-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="p3e-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p3e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3e-k1"><rect x="76" y="224" width="488" height="48" rx="10"/></clipPath>
    <clipPath id="p3e-k2"><rect x="76" y="306" width="488" height="48" rx="10"/></clipPath>
    <clipPath id="p3e-k3"><rect x="76" y="506" width="488" height="48" rx="10"/></clipPath>
    <clipPath id="p3e-k4"><rect x="76" y="588" width="488" height="48" rx="10"/></clipPath>
    <clipPath id="p3e-k5"><rect x="76" y="704" width="488" height="48" rx="10"/></clipPath>
    <clipPath id="p3e-k6"><rect x="676" y="256" width="488" height="48" rx="10"/></clipPath>
    <clipPath id="p3e-k7"><rect x="676" y="704" width="488" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="924" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Up to forty-two calls, or one bounded response</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one screen, two designs</text>

  
  <rect x="40" y="126" width="560" height="650" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Literal resource design</text>
  <text x="576" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two network stages</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M320,400 V458" stroke="#DB2777" marker-end="url(#p3e-pm)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="344" y="434" fill="#BE185D">needs the task ids first</text>
  </g>

  
  <rect x="56" y="176" width="528" height="216" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="80" y="206" font-size="16.5" font-weight="600" fill="#475569">Stage 1</text>
  <text x="560" y="206" text-anchor="end" font-size="15.5" fill="#6B7280">two calls</text>

  <g filter="url(#p3e-soft)">
    <rect x="76" y="224" width="488" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="76" y="224" width="6" height="48" fill="#64748B" clip-path="url(#p3e-k1)"/>
  </g>
  <circle cx="110" cy="248" r="4.5" fill="#64748B"/>
  <text x="134" y="255" font-size="18.5" font-weight="600" fill="#111827">GET /projects/{project_id}</text>
  <text x="320" y="292" text-anchor="middle" font-size="15.5" fill="#6B7280">reads the project header</text>

  <g filter="url(#p3e-soft)">
    <rect x="76" y="306" width="488" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="76" y="306" width="6" height="48" fill="#64748B" clip-path="url(#p3e-k2)"/>
  </g>
  <circle cx="110" cy="330" r="4.5" fill="#64748B"/>
  <text x="134" y="337" font-size="18.5" font-weight="600" fill="#111827">GET /projects/{id}/tasks</text>
  <text x="320" y="374" text-anchor="middle" font-size="15.5" fill="#6B7280">reads the task list, and the task ids</text>

  
  <rect x="56" y="458" width="528" height="216" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="80" y="488" font-size="16.5" font-weight="600" fill="#475569">Stage 2</text>
  <text x="560" y="488" text-anchor="end" font-size="15.5" fill="#6B7280">forty calls</text>

  <g filter="url(#p3e-soft)">
    <rect x="76" y="506" width="488" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="506" width="6" height="48" fill="#DB2777" clip-path="url(#p3e-k3)"/>
  </g>
  <circle cx="110" cy="530" r="4.5" fill="#DB2777"/>
  <text x="134" y="537" font-size="18.5" font-weight="600" fill="#111827">GET /users/{user_id}</text>
  <text x="546" y="537" text-anchor="end" font-size="16.5" font-weight="600" fill="#BE185D">x20</text>
  <text x="320" y="574" text-anchor="middle" font-size="15.5" fill="#6B7280">one call for each assignee</text>

  <g filter="url(#p3e-soft)">
    <rect x="76" y="588" width="488" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="588" width="6" height="48" fill="#DB2777" clip-path="url(#p3e-k4)"/>
  </g>
  <circle cx="110" cy="612" r="4.5" fill="#DB2777"/>
  <text x="134" y="619" font-size="18.5" font-weight="600" fill="#111827">GET /tasks/{id}/comments</text>
  <text x="546" y="619" text-anchor="end" font-size="16.5" font-weight="600" fill="#BE185D">x20</text>
  <text x="320" y="656" text-anchor="middle" font-size="15.5" fill="#6B7280">one call for each task row</text>

  
  <g filter="url(#p3e-lift)">
    <rect x="76" y="704" width="488" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="76" y="704" width="9" height="48" fill="#DB2777" clip-path="url(#p3e-k5)"/>
  </g>
  <circle cx="110" cy="728" r="15" fill="#FFFFFF"/>
  <g transform="translate(101,719) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="134" y="735" font-size="18.5" font-weight="600" fill="#111827">up to 42 calls, 2 network stages</text>

  
  <rect x="640" y="126" width="560" height="650" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="156" font-size="16.5" font-weight="600" fill="#047857">One screen operation</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">one network stage</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M920,400 V458" stroke="#059669" marker-end="url(#p3e-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="944" y="434" fill="#047857">returns the whole screen</text>
  </g>

  
  <rect x="656" y="176" width="528" height="216" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="680" y="206" font-size="16.5" font-weight="600" fill="#475569">One stage</text>
  <text x="1160" y="206" text-anchor="end" font-size="15.5" fill="#6B7280">one call</text>

  <g filter="url(#p3e-soft)">
    <rect x="676" y="256" width="488" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="676" y="256" width="6" height="48" fill="#059669" clip-path="url(#p3e-k6)"/>
  </g>
  <circle cx="710" cy="280" r="4.5" fill="#059669"/>
  <text x="734" y="287" font-size="18.5" font-weight="600" fill="#111827">GET /project-overviews/{id}</text>
  <text x="920" y="324" text-anchor="middle" font-size="15.5" fill="#6B7280">one request for the whole screen</text>
  <text x="920" y="347" text-anchor="middle" font-size="15.5" fill="#94A3B8">nothing to wait on, and nothing to fan out</text>

  
  <rect x="656" y="458" width="528" height="216" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="680" y="488" font-size="16.5" font-weight="600" fill="#475569">One response</text>
  <text x="1160" y="488" text-anchor="end" font-size="15.5" fill="#6B7280">one payload</text>

  <circle cx="690" cy="523" r="3.5" fill="#059669"/>
  <text x="708" y="528" font-size="15.5" fill="#6B7280">project header</text>
  <circle cx="690" cy="563" r="3.5" fill="#059669"/>
  <text x="708" y="568" font-size="15.5" fill="#6B7280">a bounded page of task rows</text>
  <circle cx="690" cy="603" r="3.5" fill="#059669"/>
  <text x="708" y="608" font-size="15.5" fill="#6B7280">each with an assignee summary</text>
  <circle cx="690" cy="643" r="3.5" fill="#059669"/>
  <text x="708" y="648" font-size="15.5" fill="#6B7280">and a comment_count</text>

  
  <g filter="url(#p3e-lift)">
    <rect x="676" y="704" width="488" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="676" y="704" width="9" height="48" fill="#059669" clip-path="url(#p3e-k7)"/>
  </g>
  <circle cx="710" cy="728" r="15" fill="#FFFFFF"/>
  <g transform="translate(701,719) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="734" y="735" font-size="18.5" font-weight="600" fill="#111827">1 call, 1 network stage</text>

  
  <rect x="40" y="808" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="853" text-anchor="middle" font-size="16" fill="#475569">The cost is screen coupling and a duplicated projection.</text>
</svg>