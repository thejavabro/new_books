<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A request from Paris is answered by the Paris edge server on a hit, instead of making the round trip to the origin in New York">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="cd5-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cd5-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="cd5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="600" y="52" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Without a CDN: Paris to New York and back</text>

  <path d="M 145 144 C 350 78 820 78 1058 144" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#cd5-red)"/>

  <line x1="236" y1="185" x2="304" y2="185" stroke="#059669" stroke-width="2.5" marker-end="url(#cd5-emerald)"/>
  <line x1="304" y1="215" x2="236" y2="215" stroke="#059669" stroke-width="2.5" marker-end="url(#cd5-emerald)"/>

  <g filter="url(#cd5-soft)">
    <rect x="60" y="160" width="176" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="310" y="160" width="210" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="960" y="160" width="222" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>

  <text x="148" y="207" font-size="20" fill="#0F172A" text-anchor="middle">User in Paris</text>
  <text x="415" y="196" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Paris edge</text>
  <text x="415" y="224" font-size="20" fill="#059669" text-anchor="middle">server</text>
  <text x="1071" y="196" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Origin server</text>
  <text x="1071" y="224" font-size="20" fill="#2563EB" text-anchor="middle">in New York</text>

  <rect x="288" y="272" width="254" height="46" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="415" y="302" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Cache hit, served here</text>

  <text x="1071" y="302" font-size="20" fill="#991B1B" text-anchor="middle">The full round trip</text>

  <text x="620" y="380" font-size="20" fill="#475569" text-anchor="middle">The next Paris user is fast too, because the first request already filled the cache</text>
</svg>