<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Metrics answer how the system is doing, traces answer what happened to one request, and logs answer what exactly happened. Alerts use them to say when someone should look, and dashboards show the state right now.">
  <defs>
    <filter id="mo1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mo1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mo1-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="mo1-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="mo1-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="mo1-k4"><rect x="257" y="480" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="mo1-k5"><rect x="643" y="480" width="340" height="90" rx="12"/></clipPath>
    <marker id="mo1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The five parts of monitoring and observability</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three signals that the system produces, and two tools that use them.</text>

  <rect x="40" y="120" width="1160" height="230" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Signals the system produces</text>
  <rect x="40" y="420" width="1160" height="230" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="450" font-size="19.5" font-weight="600" fill="#5B21B6">Tools that use the signals</text>

  <g fill="none" stroke-width="2">
    <path d="M620,350 V420" stroke="#64748B" marker-end="url(#mo1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#mo1-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#mo1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Metrics</text>
  <text x="234" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">how is the system doing?</text>
  <g filter="url(#mo1-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#mo1-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">Traces</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">what happened to this request?</text>
  <g filter="url(#mo1-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#mo1-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Logs</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">what exactly happened?</text>
  <g filter="url(#mo1-soft)">
    <rect x="257" y="480" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="257" y="480" width="6" height="90" fill="#7C3AED" clip-path="url(#mo1-k4)"/>
  </g>
  <circle cx="295" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(284.56,514.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="321" y="532" font-size="21.5" font-weight="600" fill="#111827">Alerts</text>
  <text x="427" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">when should someone look?</text>
  <g filter="url(#mo1-soft)">
    <rect x="643" y="480" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="643" y="480" width="6" height="90" fill="#7C3AED" clip-path="url(#mo1-k5)"/>
  </g>
  <circle cx="681" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(670.56,514.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="707" y="532" font-size="21.5" font-weight="600" fill="#111827">Dashboards</text>
  <text x="813" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">what is the state right now?</text>

  <rect x="40" y="680" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Monitoring</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">watches known metrics and tells you that something is wrong</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Observability</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">lets you explain why, even for problems nobody predicted</text>
</svg>