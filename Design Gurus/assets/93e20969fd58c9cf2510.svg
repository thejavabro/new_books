    <rect x="700" y="230" width="6" height="90" fill="#2563EB" clip-path="url(#m10h-k6)"/>
  </g>
  <circle cx="738" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,264.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="764" y="282" font-size="21.5" font-weight="600" fill="#111827">Real input adapter</text>
  <text x="920" y="349" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, REST)</text>
  <g filter="url(#m10h-soft)">
    <rect x="700" y="470" width="440" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="700" y="470" width="6" height="56" fill="#4F46E5" clip-path="url(#m10h-k7)"/>
  </g>
  <text x="720" y="505" font-size="18.5" font-weight="600" fill="#111827">Business rules</text>
  <g filter="url(#m10h-soft)">
    <rect x="700" y="538" width="440" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="700" y="538" width="6" height="56" fill="#4F46E5" clip-path="url(#m10h-k8)"/>
  </g>
  <text x="720" y="573" font-size="18.5" font-weight="600" fill="#111827">Domain entities</text>
  <g filter="url(#m10h-soft)">
    <rect x="700" y="606" width="440" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="700" y="606" width="6" height="56" fill="#4F46E5" clip-path="url(#m10h-k9)"/>
  </g>
  <text x="720" y="641" font-size="18.5" font-weight="600" fill="#111827">Use cases</text>
  <g filter="url(#m10h-soft)">
    <rect x="700" y="746" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="700" y="746" width="6" height="90" fill="#2563EB" clip-path="url(#m10h-k10)"/>
  </g>
  <circle cx="738" cy="791" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,780.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="764" y="798" font-size="21.5" font-weight="600" fill="#111827">Real output adapter</text>
  <text x="920" y="865" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, PostgreSQL)</text>
  <rect x="64" y="900" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <g transform="translate(78,911) scale(0.92)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="928.5" font-size="18.5" fill="#1F2937">Test business logic in isolation</text>
  <rect x="64" y="954" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <g transform="translate(78,965) scale(0.92)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="982.5" font-size="18.5" fill="#1F2937">Use in-memory implementations for ports</text>
  <rect x="64" y="1008" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <g transform="translate(78,1019) scale(0.92)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="1036.5" font-size="18.5" fill="#1F2937">No real database, message queue, or external systems</text>
  <rect x="664" y="900" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,911) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="928.5" font-size="18.5" fill="#1F2937">Same domain and use cases as in the tests</text>
  <rect x="664" y="954" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,965) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="982.5" font-size="18.5" fill="#1F2937">Real PostgreSQL, Stripe and Kafka adapters</text>
  <rect x="664" y="1008" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,1019) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="1036.5" font-size="18.5" fill="#1F2937">Only the composition root wiring changes</text>
  <text x="64" y="180" font-size="18.5" fill="#475569">Test domain logic with in-memory adapters</text>
  <text x="664" y="180" font-size="18.5" fill="#475569">Run with real adapters and infrastructure</text>




