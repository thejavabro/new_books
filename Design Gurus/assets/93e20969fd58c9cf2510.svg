    <rect x="100" y="470" width="440" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="100" y="470" width="6" height="56" fill="#4F46E5" clip-path="url(#m10h-k2)"/>
  </g>
  <text x="120" y="505" font-size="18.5" font-weight="600" fill="#111827">Business rules</text>
  <g filter="url(#m10h-soft)">
    <rect x="100" y="538" width="440" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="100" y="538" width="6" height="56" fill="#4F46E5" clip-path="url(#m10h-k3)"/>
  </g>
  <text x="120" y="573" font-size="18.5" font-weight="600" fill="#111827">Domain entities</text>
