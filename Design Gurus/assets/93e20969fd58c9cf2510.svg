<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1116" viewBox="0 0 1240 1116" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels: in a unit test, the test acts as the driving adapter and calls the application core of business rules, domain entities and use cases, and an in-memory output adapter implements an output port of the core; in production, a real input adapter such as REST calls the same core, and a real output adapter such as PostgreSQL implements that port; only the composition root wiring changes">
  <defs>
    <filter id="m10h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m10h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m10h-k1"><rect x="100" y="230" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="m10h-k2"><rect x="100" y="470" width="440" height="56" rx="12"/></clipPath>
    <clipPath id="m10h-k3"><rect x="100" y="538" width="440" height="56" rx="12"/></clipPath>
    <clipPath id="m10h-k4"><rect x="100" y="606" width="440" height="56" rx="12"/></clipPath>
    <clipPath id="m10h-k5"><rect x="100" y="746" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="m10h-k6"><rect x="700" y="230" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="m10h-k7"><rect x="700" y="470" width="440" height="56" rx="12"/></clipPath>
    <clipPath id="m10h-k8"><rect x="700" y="538" width="440" height="56" rx="12"/></clipPath>
    <clipPath id="m10h-k9"><rect x="700" y="606" width="440" height="56" rx="12"/></clipPath>
    <clipPath id="m10h-k10"><rect x="700" y="746" width="440" height="90" rx="12"/></clipPath>
    <marker id="m10h-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1116" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Unit tests vs. production in hexagonal architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every arrow is a dependency and points toward the core; unit tests use in-memory adapters, production uses real ones.</text>

  <rect x="40" y="120" width="560" height="956" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Unit tests</text>
  <rect x="64" y="390" width="512" height="296" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="88" y="420" font-size="19.5" font-weight="600" fill="#4338CA">Application core (domain + use cases)</text>
  <rect x="640" y="120" width="560" height="956" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#047857">Production</text>
  <rect x="664" y="390" width="512" height="296" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="688" y="420" font-size="19.5" font-weight="600" fill="#4338CA">Application core (domain + use cases)</text>

