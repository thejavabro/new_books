    <path d="M500,746 V686" stroke="#4F46E5" marker-end="url(#m10h-m-indigo)"/>
    <path d="M1100,320 V390" stroke="#4F46E5" marker-end="url(#m10h-m-indigo)"/>
    <path d="M1100,746 V686" stroke="#4F46E5" marker-end="url(#m10h-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m10h-soft)">
    <rect x="100" y="230" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="230" width="6" height="90" fill="#2563EB" clip-path="url(#m10h-k1)"/>
