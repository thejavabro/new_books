    <rect x="100" y="606" width="440" height="56" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="100" y="606" width="6" height="56" fill="#4F46E5" clip-path="url(#m10h-k4)"/>
  </g>
  <text x="120" y="641" font-size="18.5" font-weight="600" fill="#111827">Use cases</text>
  <g filter="url(#m10h-soft)">
    <rect x="100" y="746" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="746" width="6" height="90" fill="#2563EB" clip-path="url(#m10h-k5)"/>
  </g>
  <circle cx="138" cy="791" r="18" fill="#FFFFFF"/>
