<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="656" viewBox="0 0 1240 656" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="limits-title limits-desc">
<title id="limits-title">What the outbox does not give you</title>
<desc id="limits-desc">It is at-least-once rather than exactly-once, it gives per-partition ordering rather than global ordering, and it protects only the producer boundary. It is also overhead for streams where losing an event costs nothing.</desc>
<defs>
<marker id="limits-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="limits-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="limits-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="limits-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="656" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the outbox does not give you</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The outbox solves exactly one problem, and it is worth being precise about the three it does not.</text>
<rect x="40" y="578" width="1160" height="52" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="578" width="5" height="52" rx="2.5" fill="#AC8BE8"/>
<rect x="40" y="118" width="372" height="204" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V316A6 6 0 0 0 46 322H54Z" fill="#F28B9D"/>
<text x="226" y="160" font-size="22" font-weight="700" fill="#A83147" text-anchor="middle">Not exactly-once</text>
<text x="226" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">The relay can publish and crash</text><text x="226" y="223" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">before marking the row, so it</text><text x="226" y="248" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">publishes again. You get</text><text x="226" y="273" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">at-least-once with no loss, and</text><text x="226" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">consumers still deduplicate.</text>
<rect x="434" y="118" width="372" height="204" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V316A6 6 0 0 0 440 322H448Z" fill="#F3CF6A"/>
<text x="620" y="160" font-size="22" font-weight="700" fill="#91642E" text-anchor="middle">Not global ordering</text>
<text x="620" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Ordering holds within a partition.</text><text x="620" y="223" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Key by the aggregate id for</text><text x="620" y="248" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">per-entity ordering, which is what</text><text x="620" y="273" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the domain usually needs.</text>
<rect x="828" y="118" width="372" height="204" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V316A6 6 0 0 0 834 322H842Z" fill="#AC8BE8"/>
<text x="1014" y="160" font-size="22" font-weight="700" fill="#6040A8" text-anchor="middle">Not the consumer side</text>
<text x="1014" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">It protects the producer boundary</text><text x="1014" y="223" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">only. The consumer has the mirror</text><text x="1014" y="248" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">problem and makes its own</text><text x="1014" y="273" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">processing and write atomic.</text>
<rect x="40" y="346" width="560" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="346" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="378" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Worth the cost</text><text x="64" y="404" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">An order event, a payment, any state change</text><text x="64" y="430" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">somebody will later reconcile against a database.</text>
<rect x="640" y="346" width="560" height="104" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="346" width="5" height="104" rx="2.5" fill="#F3CF6A"/><text x="664" y="378" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Overhead</text><text x="664" y="404" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Telemetry and analytics, where no consumer cares</text><text x="664" y="430" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">about losing one. The outbox is pure cost there.</text>
<rect x="40" y="474" width="1160" height="78" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="474" width="5" height="78" rx="2.5" fill="#5EC9EC"/><text x="64" y="506" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">At a hundred thousand events a second,</text><text x="64" y="532" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the outbox table is itself a capacity problem needing partitioning and aggressive deletion.</text>
<text x="66" y="612" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Teams that adopt an outbox and skip consumer idempotence have moved the duplicate, not removed it.</text>
</svg>