<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="826" viewBox="0 0 1240 826" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="timeouts-title timeouts-desc">
<title id="timeouts-title">Timeouts are the foundation</title>
<desc id="timeouts-desc">Every call crossing a process boundary needs one, derived from a high percentile rather than the average, and shrinking as you go down the call chain.</desc>
<defs>
<marker id="timeouts-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="timeouts-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="timeouts-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="timeouts-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="826" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Timeouts are the foundation</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Every call crossing a process boundary needs one, derived from a high percentile rather than the average.</text>
<rect x="40" y="748" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="748" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="155" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The default in most libraries is to wait indefinitely</text>
<rect x="40" y="198" width="560" height="80" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="230.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do not set it from the average</text><text x="320" y="257.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a 50 ms mean does not make 200 ms generous</text>
<rect x="640" y="198" width="560" height="80" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="230.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Set it from a high percentile</text><text x="920" y="257.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">plus headroom, so it fires for stuck requests</text>
<text x="40" y="316" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Timeouts must decrease down the call chain</text>
<rect x="40" y="334" width="300" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="363" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">client</text>
<text x="350" y="364" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">10 s</text>
<rect x="90" y="386" width="300" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="240" y="415" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">api</text>
<text x="400" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">8 s</text>
<rect x="140" y="438" width="300" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="290" y="467" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">service</text>
<text x="450" y="468" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">5 s</text>
<rect x="190" y="490" width="300" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="340" y="519" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">database</text>
<text x="500" y="520" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">2 s</text>
<rect x="560" y="400" width="640" height="70" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="580" y="428.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">otherwise you are doing work for somebody</text><text x="580" y="453.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">who has already left</text>
<rect x="40" y="558" width="1160" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="592" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Connection and request timeouts are different. Setting only one of them leaves a gap</text>
<rect x="40" y="634" width="1160" height="86" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="634" width="5" height="86" rx="2.5" fill="#F28B9D"/><text x="64" y="670" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A timeout does not stop the work</text><text x="64" y="696" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The server is still processing a request nobody is waiting for.</text>
<text x="66" y="782" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Which is why a retry after a timeout can double the load on a server that is already struggling.</text>
</svg>