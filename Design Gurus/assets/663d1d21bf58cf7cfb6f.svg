<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="quotas-title quotas-desc">
<title id="quotas-title">Noisy neighbors is a quota problem</title>
<desc id="quotas-desc">The goal is fairness under contention rather than prevention, and five resources need separate limits.</desc>
<defs>
<marker id="quotas-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="quotas-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="quotas-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="quotas-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="796" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Noisy neighbors is a quota problem</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The goal is fairness under contention rather than prevention.</text>
<rect x="40" y="718" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="718" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="124" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Request rate</text>
<path d="M526 154H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 154H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#quotas-marker-slate)"/>
<rect x="570" y="124" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="160" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the one everybody implements</text>
<rect x="40" y="194" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="230" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Concurrency</text>
<path d="M526 224H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 224H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#quotas-marker-slate)"/>
<rect x="570" y="194" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="217.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">matters more: ten simultaneous expensive</text><text x="590" y="242.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">requests beat a hundred cheap ones</text>
<rect x="40" y="264" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="300" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Query cost</text>
<path d="M526 294H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 294H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#quotas-marker-slate)"/>
<rect x="570" y="264" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="287.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one tenant with a hundred times more data makes</text><text x="590" y="312.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the same query cost a hundred times more</text>
<rect x="40" y="334" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Storage and growth</text>
<path d="M526 364H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 364H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#quotas-marker-slate)"/>
<rect x="570" y="334" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="370" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">slower, and produces the same contention eventually</text>
<rect x="40" y="404" width="480" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="440" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Background and batch work</text>
<path d="M526 434H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 434H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#quotas-marker-slate)"/>
<rect x="570" y="404" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="440" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one tenant's import can starve everybody's queue</text>
<rect x="40" y="492" width="560" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="492" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="522" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Per-tenant, not just global</text><text x="64" y="548" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a global limit protects the system and does nothing</text><text x="64" y="574" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">for fairness, because the greedy tenant is within it</text>
<rect x="640" y="492" width="560" height="100" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="492" width="5" height="100" rx="2.5" fill="#5EC9EC"/><text x="664" y="522" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Separate queues or fair scheduling</text><text x="664" y="548" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a shared queue lets a tenant who enqueues a hundred</text><text x="664" y="574" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">thousand items decide the order for everybody</text>
<rect x="40" y="616" width="1160" height="70" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="616" width="5" height="70" rx="2.5" fill="#F3CF6A"/><text x="64" y="657" font-size="19" font-weight="700" fill="#91642E" text-anchor="start">At the limit, refuse clearly: a quota, not a failure, so the client does not retry into it.</text>
<text x="66" y="752" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A global rate limit is not about tenancy at all.</text>
</svg>