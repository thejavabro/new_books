<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1042" viewBox="0 0 1240 1042" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated Google Docs architecture: snapshot plus replay loading, optimistic editing, operational transformation on the server, and write behind persistence">
  <defs>
    <filter id="gd-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="gd-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="gd-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="gd-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="gd-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="gd-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1042" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Google Docs: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Operational transformation on one server per document, with an append only log behind it</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Opening a document · replaying 50,000 edits would be far too slow</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gd-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">open</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#gd-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">latest</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gd-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replay</text>
  <g filter="url(#gd-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">asks to open</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Collab server</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">hydrates in RAM</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Snapshots</text>
  <text x="776" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">every 500 ops</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Operations log</text>
  <text x="1089" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">only the ops since</text>

  <rect x="24" y="338" width="1192" height="166" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. Typing · the letter appears before the server has seen it</text>
  <path d="M364,436 L456,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gd-blue)"/>
  <text x="410" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">at v100</text>
  <path d="M784,436 L876,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gd-blue)"/>
  <text x="830" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <g filter="url(#gd-soft)">
    <rect x="40" y="398" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="398" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Alice</text>
  <text x="200" y="458" font-size="20" fill="#64748B" text-anchor="middle">0ms locally</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Collab server</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">checks the version</text>
  <text x="1040" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bob</text>
  <text x="1040" y="458" font-size="20" fill="#64748B" text-anchor="middle">under 200ms</text>

  <rect x="24" y="534" width="1192" height="166" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="566" font-size="20" font-weight="600" fill="#475569">3. The collision · two people type at the same index at the same moment</text>
  <path d="M364,632 L456,632" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gd-blue)"/>
  <text x="410" y="620" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">stale</text>
  <path d="M784,632 L876,632" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gd-blue)"/>
  <text x="830" y="620" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">apply</text>
  <g filter="url(#gd-soft)">
    <rect x="40" y="594" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="594" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="594" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Op at v100</text>
  <text x="200" y="654" font-size="20" fill="#64748B" text-anchor="middle">arrives second</text>
  <text x="620" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Transform</text>
  <text x="620" y="654" font-size="20" fill="#64748B" text-anchor="middle">shifts the index</text>
  <text x="1040" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Converged</text>
  <text x="1040" y="654" font-size="20" fill="#64748B" text-anchor="middle">both see ACATS</text>

  <rect x="24" y="730" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="762" font-size="20" font-weight="600" fill="#92400E">4. Saving and surviving · the ack goes out before the database write</text>
  <path d="M264,828 L349,828" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gd-amber)"/>
  <text x="307" y="816" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <path d="M577,828 L662,828" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gd-amber)"/>
  <text x="620" y="816" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">batch</text>
  <path d="M890,828 L975,828" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gd-amber)"/>
  <text x="933" y="816" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">append</text>
  <g filter="url(#gd-soft)">
    <rect x="40" y="790" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,805 L353,851 A110,15 0 0 0 573,851 L573,805" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="805" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="790" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,805 L979,851 A110,15 0 0 0 1199,851 L1199,805" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="805" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="824" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Collab server</text>
  <text x="150" y="850" font-size="20" fill="#64748B" text-anchor="middle">RAM is the truth</text>
  <text x="463" y="839" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="463" y="896" font-size="20" fill="#92400E" text-anchor="middle">acked once queued</text>
  <text x="776" y="824" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Save worker</text>
  <text x="776" y="850" font-size="20" fill="#64748B" text-anchor="middle">batches 50 ops</text>
  <text x="1089" y="839" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">NoSQL log</text>
  <text x="1089" y="896" font-size="20" fill="#5B21B6" text-anchor="middle">append only, by doc</text>
  <line x1="44" y1="1002" x2="72" y2="1002" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1009" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1002" x2="344.576" y2="1002" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1009" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="993" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1009" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="993" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1009" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="993" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1009" font-size="20" fill="#475569">core service</text>
</svg>