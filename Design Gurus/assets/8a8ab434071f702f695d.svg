<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" style="background-color:#ffffff">
<defs>
<marker id="mta" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#3a6fb0"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="28" font-size="13.5" font-weight="bold">The history can store the state without ever being able to read it</text>

<rect x="30" y="52" width="250" height="128" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="155" y="76" text-anchor="middle" font-weight="bold" font-size="12.5">DeploymentConfig</text>
<text x="155" y="94" text-anchor="middle" font-size="11" fill="#414d60">the originator</text>
<text x="46" y="120" font-family="monospace" font-size="11">replicas  = 3</text>
<text x="46" y="138" font-family="monospace" font-size="11">image     = api:1.4</text>
<text x="46" y="156" font-family="monospace" font-size="11">env       = {LOG_LEVEL}</text>
<text x="155" y="174" text-anchor="middle" font-size="10.5" fill="#414d60">all private</text>

<rect x="380" y="66" width="200" height="100" rx="8" fill="#dcefe4" stroke="#2f7a55" stroke-width="2"/>
<text x="480" y="92" text-anchor="middle" font-weight="bold" font-size="12.5">ConfigSnapshot</text>
<text x="480" y="112" text-anchor="middle" font-size="11" fill="#2f7a55">the memento</text>
<text x="480" y="138" text-anchor="middle" font-size="11.5" fill="#2f7a55">sealed</text>
<text x="480" y="156" text-anchor="middle" font-size="10.5" fill="#2f7a55">only the originator opens it</text>

<rect x="690" y="66" width="240" height="100" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="810" y="92" text-anchor="middle" font-weight="bold" font-size="12.5">DeploymentHistory</text>
<text x="810" y="110" text-anchor="middle" font-size="11" fill="#414d60">the caretaker</text>
<text x="810" y="136" text-anchor="middle" font-size="11.5">holds a stack of snapshots</text>
<text x="810" y="154" text-anchor="middle" font-size="11.5" fill="#b4322c">and reads none of them</text>

<path d="M 284 100 L 375 100" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#mta)"/>
<text x="288" y="92" font-size="10.5" fill="#414d60">save()</text>
<path d="M 584 100 L 685 100" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#mta)"/>
<text x="592" y="92" font-size="10.5" fill="#414d60">stored</text>

<path d="M 810 170 L 810 206 L 155 206 L 155 184" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#mta)"/>
<text x="430" y="200" font-size="11" fill="#414d60">restore(snapshot), later</text>

<line x1="30" y1="238" x2="930" y2="238" stroke="#dbe2ed"/>

<text x="30" y="266" font-size="13" font-weight="bold" fill="#b4322c">The bug that makes a snapshot useless</text>

<rect x="30" y="282" width="430" height="86" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="46" y="304" font-family="monospace" font-size="11.5">this.env = other.env;</text>
<text x="46" y="326" font-size="11.5" fill="#b4322c">The snapshot now points at the same map the live</text>
<text x="46" y="344" font-size="11.5" fill="#b4322c">config keeps mutating. Restoring puts back the</text>
<text x="46" y="360" font-size="11.5" fill="#b4322c">current state, and nothing looks wrong.</text>

<rect x="500" y="282" width="430" height="86" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="516" y="304" font-family="monospace" font-size="11.5">this.env = new TreeMap&lt;&gt;(other.env);</text>
<text x="516" y="326" font-size="11.5" fill="#2f7a55">The snapshot owns its own copy, so later changes</text>
<text x="516" y="344" font-size="11.5" fill="#2f7a55">to the live config cannot reach into it.</text>
<text x="516" y="360" font-size="11.5" fill="#2f7a55">How deep to copy is a decision, per field.</text>

<rect x="30" y="386" width="900" height="34" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="408" font-size="12.5" fill="#414d60">This is the same shallow-versus-deep decision as the Prototype pattern, and it fails the same way: silently.</text>
</g>
</svg>