<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What a sidecar costs and what keeps each cost small. The extra network hop stays on localhost so it is cheap, the memory it uses is paid once per pod so the container is kept small, and having a second container to upgrade is handled by rolling the sidecar out centrally rather than per team">
  <defs>
    <marker id="sc2-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="sc2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sc2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sc2-p1"><rect x="72" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-p2"><rect x="455" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-p3"><rect x="838" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-s1"><rect x="72" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-s2"><rect x="455" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sc2-s3"><rect x="838" y="398" width="330" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#B45309">What a sidecar costs you</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#047857">What keeps each cost small</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M237,296 L237,394" marker-end="url(#sc2-em)"/>
    <path d="M620,296 L620,394" marker-end="url(#sc2-em)"/>
    <path d="M1003,296 L1003,394" marker-end="url(#sc2-em)"/>
  </g>

  <g filter="url(#sc2-soft)">
    <rect x="72" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#D97706" clip-path="url(#sc2-p1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">An Extra Hop</text>
  <text x="237" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">traffic passes through the sidecar</text>
  <text x="237" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">on the way in and on the way out</text>

  <g filter="url(#sc2-soft)">
    <rect x="455" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="455" y="112" width="6" height="90" fill="#D97706" clip-path="url(#sc2-p2)"/>
  </g>
  <circle cx="493" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="519" y="164" font-size="18.5" font-weight="600" fill="#111827">Memory In Every Pod</text>
  <text x="620" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">you pay for it once per replica</text>
  <text x="620" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">so 300 pods means 300 copies</text>

  <g filter="url(#sc2-soft)">
    <rect x="838" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="838" y="112" width="6" height="90" fill="#D97706" clip-path="url(#sc2-p3)"/>
  </g>
  <circle cx="876" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="902" y="164" font-size="18.5" font-weight="600" fill="#111827">Two Things To Upgrade</text>
  <text x="1003" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the app and the sidecar both ship</text>
  <text x="1003" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">on their own schedules</text>

  <g filter="url(#sc2-lift)">
    <rect x="72" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="72" y="398" width="9" height="90" fill="#059669" clip-path="url(#sc2-s1)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">It Stays On localhost</text>
  <text x="237" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">the hop never leaves the machine</text>
  <text x="237" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">so it costs well under a millisecond</text>

  <g filter="url(#sc2-soft)">
    <rect x="455" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="455" y="398" width="6" height="90" fill="#059669" clip-path="url(#sc2-s2)"/>
  </g>
  <circle cx="493" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="519" y="450" font-size="18.5" font-weight="600" fill="#111827">Keep It Small</text>
  <text x="620" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">one job per sidecar</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">and a tight memory limit on it</text>

  <g filter="url(#sc2-soft)">
    <rect x="838" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="838" y="398" width="6" height="90" fill="#059669" clip-path="url(#sc2-s3)"/>
  </g>
  <circle cx="876" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="902" y="450" font-size="18.5" font-weight="600" fill="#111827">Roll It Out Centrally</text>
  <text x="1003" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">one platform team owns the image</text>
  <text x="1003" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">so no service team has to act</text>

  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">What you buy</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">one platform capability added to every service without changing a single line of their code</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">When to skip it</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">for one service in one language, a shared library does the same job with none of the pod overhead</text>
</svg>