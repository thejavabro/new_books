<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The points before any is chosen">
<defs>
<filter id="kp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="566" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which 2 points are closest to the origin?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Comparing squared distances avoids square roots, and gives the same order</text>
<rect x="40" y="106" width="1160" height="312" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One distance per point</text>
<rect x="330" y="176" width="176" height="78" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="418" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">(1, 3)</text>
<text x="418" y="240" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">distance 10</text>
<rect x="532" y="176" width="176" height="78" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">(3, 4)</text>
<text x="620" y="240" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">distance 25</text>
<rect x="734" y="176" width="176" height="78" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="822" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">(2, -1)</text>
<text x="822" y="240" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">distance 5</text>
<text x="306" y="223" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">points</text>
<text x="407" y="355" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<text x="437" y="354" font-size="18.5" fill="#475569">empty</text>
<rect x="40" y="436" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Keep a heap of the 2 closest points, with the furthest of them on top</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">Squaring is enough because a larger distance always has a larger square</text>
</svg>