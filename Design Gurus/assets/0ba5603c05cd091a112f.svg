<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="887" viewBox="0 0 1240 887" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Lexical retrieval catches exact terms and semantic retrieval catches meaning, so each one misses what the other finds">
  <defs>

    <filter id="c3sr2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c3sr2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c3sr2-k1"><rect x="259" y="116" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="c3sr2-k2"><rect x="729" y="116" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="c3sr2-k3"><rect x="259" y="271" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="c3sr2-k4"><rect x="729" y="271" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="c3sr2-k5"><rect x="259" y="426" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="c3sr2-k6"><rect x="729" y="426" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="c3sr2-k7"><rect x="259" y="581" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="c3sr2-k8"><rect x="729" y="581" width="330" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="887" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="675" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Two retrieval engines, run at the same time</text>
  <g filter="url(#c3sr2-lift)">
    <rect x="259" y="116" width="330" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="259" y="116" width="9" height="90" fill="#4F46E5" clip-path="url(#c3sr2-k1)"/>
  </g>
  <circle cx="297" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(286.56,150.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="323" y="168" font-size="18.5" font-weight="600" fill="#111827">Lexical retrieval</text>
  <text x="424" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">inverted index, BM25</text>
  <g filter="url(#c3sr2-lift)">
    <rect x="729" y="116" width="330" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="729" y="116" width="9" height="90" fill="#7C3AED" clip-path="url(#c3sr2-k2)"/>
  </g>
  <circle cx="767" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(756.56,150.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="793" y="168" font-size="18.5" font-weight="600" fill="#111827">Semantic retrieval</text>
  <text x="894" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">two-tower embeddings, ANN index</text>
  <g filter="url(#c3sr2-soft)">
    <rect x="259" y="271" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="259" y="271" width="6" height="90" fill="#059669" clip-path="url(#c3sr2-k3)"/>
  </g>
  <circle cx="297" cy="316" r="18" fill="#FFFFFF"/>
  <g transform="translate(286.56,305.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="323" y="323" font-size="18.5" font-weight="600" fill="#111827">Exact terms</text>
  <text x="424" y="386" font-size="15.5" text-anchor="middle" fill="#6B7280">finds the model number HX-200</text>
  <g filter="url(#c3sr2-soft)">
    <rect x="729" y="271" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="729" y="271" width="6" height="90" fill="#059669" clip-path="url(#c3sr2-k4)"/>
  </g>
  <circle cx="767" cy="316" r="18" fill="#FFFFFF"/>
  <g transform="translate(756.56,305.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="793" y="323" font-size="18.5" font-weight="600" fill="#111827">Meaning</text>
  <text x="894" y="386" font-size="15.5" text-anchor="middle" fill="#6B7280">keep coffee hot finds insulated travel mug</text>
  <g filter="url(#c3sr2-soft)">
    <rect x="259" y="426" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="259" y="426" width="6" height="90" fill="#DB2777" clip-path="url(#c3sr2-k5)"/>
  </g>
  <circle cx="297" cy="471" r="18" fill="#FFFFFF"/>
  <g transform="translate(286.56,460.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="323" y="478" font-size="18.5" font-weight="600" fill="#111827">Vocabulary mismatch</text>
  <text x="424" y="541" font-size="15.5" text-anchor="middle" fill="#6B7280">no shared words, no match</text>
  <g filter="url(#c3sr2-soft)">
    <rect x="729" y="426" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="729" y="426" width="6" height="90" fill="#DB2777" clip-path="url(#c3sr2-k6)"/>
  </g>
  <circle cx="767" cy="471" r="18" fill="#FFFFFF"/>
  <g transform="translate(756.56,460.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="793" y="478" font-size="18.5" font-weight="600" fill="#111827">Confident wrong item</text>
  <text x="894" y="541" font-size="15.5" text-anchor="middle" fill="#6B7280">HX-200 filter returns HX-250 filter</text>
  <g filter="url(#c3sr2-soft)">
    <rect x="259" y="581" width="330" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="259" y="581" width="6" height="90" fill="#64748B" clip-path="url(#c3sr2-k7)"/>
  </g>
  <circle cx="297" cy="626" r="18" fill="#FFFFFF"/>
  <g transform="translate(286.56,615.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="323" y="633" font-size="18.5" font-weight="600" fill="#111827">Almost instantly</text>
  <text x="424" y="696" font-size="15.5" text-anchor="middle" fill="#6B7280">within a second or two</text>
  <g filter="url(#c3sr2-soft)">
    <rect x="729" y="581" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="729" y="581" width="6" height="90" fill="#D97706" clip-path="url(#c3sr2-k8)"/>
  </g>
  <circle cx="767" cy="626" r="18" fill="#FFFFFF"/>
  <g transform="translate(756.56,615.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="793" y="633" font-size="18.5" font-weight="600" fill="#111827">On a cycle</text>
  <text x="894" y="696" font-size="15.5" text-anchor="middle" fill="#6B7280">every few hours or nightly</text>
  <text x="235" y="323" font-size="15.5" font-weight="600" text-anchor="end" fill="#6B7280">Catches</text>
  <text x="235" y="478" font-size="15.5" font-weight="600" text-anchor="end" fill="#6B7280">Misses</text>
  <text x="235" y="633" font-size="15.5" font-weight="600" text-anchor="end" fill="#6B7280">Refresh</text>
  <rect x="40" y="771" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="816" text-anchor="middle" font-size="16" fill="#475569">Each engine catches what the other misses, so modern search runs both.</text>
</svg>