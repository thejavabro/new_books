<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="834" viewBox="0 0 1240 834" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="chunking-title chunking-desc">
<title id="chunking-title">Chunking decides more than the model</title>
<desc id="chunking-desc">The dullest stage with the largest effect on answer quality, and two patterns that resolve the size tension rather than compromising on it.</desc>
<defs>
<marker id="chunking-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="chunking-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="chunking-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="chunking-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="834" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Chunking decides more than the model</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Chunking is the dullest stage and the one with the largest effect on answer quality.</text>
<rect x="40" y="756" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="756" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="76" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="148.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Small chunks</text><text x="320" y="175.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">retrieve precisely, lack context</text>
<rect x="640" y="118" width="560" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="148.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Large chunks</text><text x="920" y="175.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">carry context, retrieve imprecisely</text>
<text x="620" y="222" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the embedding of a long passage is an average that matches everything weakly</text>
<rect x="40" y="240" width="420" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="250" y="274" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Size</text>
<path d="M466 268H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 268H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chunking-marker-slate)"/>
<rect x="510" y="240" width="690" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="274" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in tokens, chosen against the shape of the source</text>
<rect x="40" y="308" width="420" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="250" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Boundaries</text>
<path d="M466 336H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 336H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chunking-marker-slate)"/>
<rect x="510" y="308" width="690" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="342" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">on structure: headings, sections, paragraphs, code blocks</text>
<rect x="40" y="376" width="420" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="250" y="410" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Overlap</text>
<path d="M466 404H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 404H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chunking-marker-slate)"/>
<rect x="510" y="376" width="690" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="410" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so an answer straddling a boundary is not lost</text>
<rect x="40" y="444" width="420" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="250" y="478" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What travels with it</text>
<path d="M466 472H500" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M466 472H500" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#chunking-marker-slate)"/>
<rect x="510" y="444" width="690" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="530" y="478" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">title, heading, date, source, permissions. Nearly free, and skipped</text>
<rect x="40" y="520" width="560" height="128" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="520" width="5" height="128" rx="2.5" fill="#39D5AA"/><text x="64" y="551" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Retrieve small, return large</text><text x="64" y="577" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">index small precise chunks, pass the</text><text x="64" y="603" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">surrounding section to the model.</text><text x="64" y="629" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Both, instead of a trade</text>
<rect x="640" y="520" width="560" height="128" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="520" width="5" height="128" rx="2.5" fill="#5EC9EC"/><text x="664" y="551" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Index a summary, return the original</text><text x="664" y="577" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">for long structured documents where</text><text x="664" y="603" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the topic is clear but the wording</text><text x="664" y="629" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">does not match how people ask</text>
<rect x="40" y="668" width="1160" height="60" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="668" width="5" height="60" rx="2.5" fill="#F3CF6A"/><text x="64" y="704" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Chunking must be re-runnable and versioned, because you will change it.</text>
<text x="66" y="790" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Treat the index as derived data, or you are stuck with the first guess.</text>
</svg>