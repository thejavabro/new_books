<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="724" viewBox="0 0 1240 724" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A whiteboard divided into six regions whose sizes match the evidence each one carries. Callers and jobs, resources, and operations sit small across the top. One operation in full takes the largest region in the middle. The hard parts run down the right side as a tall narrow column. Trade-offs run full width across the bottom.">
  <defs>
    <filter id="yl04board-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl04board-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl04board-k1"><rect x="64" y="92" width="264" height="90" rx="12"/></clipPath>
    <clipPath id="yl04board-k2"><rect x="344" y="92" width="264" height="90" rx="12"/></clipPath>
    <clipPath id="yl04board-k3"><rect x="624" y="92" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="yl04board-k4"><rect x="80" y="248" width="804" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="724" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="544" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">How to use the board</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#94A3B8">six regions, sized by the evidence each one carries</text>

  
  <g filter="url(#yl04board-soft)">
    <rect x="64" y="92" width="264" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="92" width="6" height="90" fill="#64748B" clip-path="url(#yl04board-k1)"/>
  </g>
  <circle cx="102" cy="137" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,126.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="128" y="144" font-size="18.5" font-weight="600" fill="#111827">Callers and jobs</text>
  <text x="196" y="207" text-anchor="middle" font-size="15.5" fill="#6B7280">who calls, and the job each one has</text>

  <g filter="url(#yl04board-soft)">
    <rect x="344" y="92" width="264" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="344" y="92" width="6" height="90" fill="#64748B" clip-path="url(#yl04board-k2)"/>
  </g>
  <circle cx="382" cy="137" r="18" fill="#FFFFFF"/>
  <g transform="translate(371.56,126.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="408" y="144" font-size="18.5" font-weight="600" fill="#111827">Resources</text>
  <text x="476" y="207" text-anchor="middle" font-size="15.5" fill="#6B7280">the resources clients need</text>

  <g filter="url(#yl04board-soft)">
    <rect x="624" y="92" width="276" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="624" y="92" width="6" height="90" fill="#64748B" clip-path="url(#yl04board-k3)"/>
  </g>
  <circle cx="662" cy="137" r="18" fill="#FFFFFF"/>
  <g transform="translate(651.56,126.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="688" y="144" font-size="18.5" font-weight="600" fill="#111827">Operations</text>
  <text x="762" y="207" text-anchor="middle" font-size="15.5" fill="#6B7280">one line each, with the method</text>

  
  <rect x="64" y="232" width="836" height="184" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <g filter="url(#yl04board-lift)">
    <rect x="80" y="248" width="804" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="80" y="248" width="9" height="90" fill="#2563EB" clip-path="url(#yl04board-k4)"/>
  </g>
  <circle cx="118" cy="293" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,282.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="144" y="300" font-size="18.5" font-weight="600" fill="#111827">One operation in full</text>
  <text x="482" y="363" text-anchor="middle" font-size="15.5" fill="#6B7280">request, response, status codes, every named failure</text>
  <text x="482" y="386" text-anchor="middle" font-size="15.5" fill="#94A3B8">the largest region, because it carries the most evidence</text>

  
  <rect x="916" y="92" width="260" height="324" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="940" y="122" font-size="16.5" font-weight="600" fill="#B45309">Hard parts</text>
  <text x="1152" y="122" text-anchor="end" font-size="15.5" fill="#94A3B8">a tall column</text>
  <text x="940" y="164" font-size="15.5" fill="#6B7280">idempotency and retries</text>
  <text x="940" y="196" font-size="15.5" fill="#6B7280">pagination and limits</text>
  <text x="940" y="228" font-size="15.5" fill="#6B7280">authorization per action</text>
  <text x="940" y="260" font-size="15.5" fill="#6B7280">concurrency and versions</text>
  <text x="940" y="300" font-size="15.5" fill="#94A3B8">one decision each, said</text>
  <text x="940" y="323" font-size="15.5" fill="#94A3B8">aloud with its cost</text>

  
  <rect x="64" y="432" width="1112" height="104" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="462" font-size="16.5" font-weight="600" fill="#047857">Trade-offs</text>
  <text x="1152" y="462" text-anchor="end" font-size="15.5" fill="#94A3B8">full width</text>
  <text x="88" y="500" font-size="15.5" fill="#6B7280">the option you rejected, and the cost you accepted</text>

  
  <rect x="40" y="608" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="653" text-anchor="middle" font-size="16" fill="#475569">Give the most space to the detailed operation so the interviewer can follow its behavior.</text>
</svg>