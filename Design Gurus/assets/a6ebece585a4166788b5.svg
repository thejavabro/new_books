<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for a code judging platform: browse problems, submit code in several languages, run it against test cases under limits, and return a verdict in seconds; plus timed contests with a live leaderboard and stored rankings">
  <defs>
    <filter id="jdgf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="jdgf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="jdgf-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="jdgf-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="jdgf-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="jdgf-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="jdgf-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="jdgf-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Code judging system: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the system has to do. Split into one submission, and what a contest adds on top.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">One submission</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#5B21B6">What a contest adds</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#jdgf-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#D97706" clip-path="url(#jdgf-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Browse problems</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">description, io format,</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">constraints and examples</text>
  <g filter="url(#jdgf-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#jdgf-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Submit code</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">Python, Java, C++, Go,</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">JavaScript and C#</text>
  <g filter="url(#jdgf-lift)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="820" y="175" width="9" height="90" fill="#059669" clip-path="url(#jdgf-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Verdict in seconds</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">passed, wrong answer,</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">timeout or runtime error</text>
  <g filter="url(#jdgf-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#jdgf-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Timed contests</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a set of problems and</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">a fixed duration</text>
  <g filter="url(#jdgf-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#jdgf-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Live leaderboard</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">score and time, updating</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">as submissions are judged</text>
  <g filter="url(#jdgf-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#64748B" clip-path="url(#jdgf-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Rankings kept</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">results stored after,</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">feeding a global ranking</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Test case</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">an input paired with its expected output; the visible examples are a subset of a larger hidden set</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Verdict</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">not just pass or fail: the error type is what tells the user which case broke and how</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Sequential tests</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">one submission runs its cases in order; the parallelism is across submissions, not within one</text>
</svg>