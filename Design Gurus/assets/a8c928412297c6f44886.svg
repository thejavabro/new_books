<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="reqs-title reqs-desc">
<title id="reqs-title">Two kinds of requirement</title>
<desc id="reqs-desc">Functional requirements say what the system does and define scope. Non-functional requirements say how well, in numbers, and they are what shapes the architecture. A feature list alone is satisfied by two designs that have nothing in common.</desc>
<defs>
<marker id="reqs-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="reqs-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="reqs-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="reqs-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="650" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two kinds of requirement</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Requirements come in two kinds, and they do different work.</text>
<rect x="40" y="572" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="572" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="560" height="310" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V422A6 6 0 0 0 46 428H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Functional</text>
<text x="570" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">what the system does</text>
<rect x="72" y="174" width="500" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A user can upload a file</text>
<rect x="72" y="242" width="500" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A user can share it with another user</text>
<rect x="72" y="310" width="500" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A user can see a list of their files</text>
<text x="320" y="402" font-size="20" font-weight="700" fill="#155B9E" text-anchor="middle">Defines scope</text>
<rect x="640" y="118" width="560" height="310" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V422A6 6 0 0 0 646 428H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Non-functional</text>
<text x="1170" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">how well, in numbers</text>
<rect x="672" y="174" width="500" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How many users, and how many files each</text>
<rect x="672" y="242" width="500" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How large is the largest file</text>
<rect x="672" y="310" width="500" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How quickly must a shared file appear</text>
<text x="920" y="402" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">Shapes the architecture</text>
<text x="40" y="472" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">"Users can share a file"</text>
<rect x="40" y="490" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="524" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">satisfied by a design for ten people</text>
<rect x="640" y="490" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="524" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and by one for ten million</text>
<text x="66" y="606" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Candidates are reliably good at the left column and routinely skip the right one.</text>
</svg>