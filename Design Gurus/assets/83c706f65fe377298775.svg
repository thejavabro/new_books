<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="698" viewBox="0 0 1240 698" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A metric says something is wrong, a trace says where, and a log says what happened, and all three carry the same trace id so you can move between them">
  <rect x="0" y="0" width="1240" height="698" fill="#FFFFFF"/>
  <defs>
    <marker id="ob4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three signals, three different questions, one incident</text>

  
  <rect x="50" y="100" width="360" height="320" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M50 112 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#EFF6FF"/>
  <text x="230" y="134" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Metric: something is wrong</text>
  <text x="70" y="192" font-size="20" font-weight="600" fill="#475569">What it tells you</text>
  <text x="70" y="222" font-size="20" fill="#0F172A">An aggregate crossed a</text>
  <text x="70" y="248" font-size="20" fill="#0F172A">threshold.</text>
  <text x="70" y="298" font-size="20" font-weight="600" fill="#475569">In this incident</text>
  <text x="70" y="328" font-size="20" fill="#0F172A">p99 latency went from</text>
  <text x="70" y="354" font-size="20" fill="#0F172A">120 ms to 420 ms.</text>

  
  <rect x="440" y="100" width="360" height="320" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M440 112 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FFFBEB"/>
  <text x="620" y="134" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Trace: where it is wrong</text>
  <text x="460" y="192" font-size="20" font-weight="600" fill="#475569">What it tells you</text>
  <text x="460" y="222" font-size="20" fill="#0F172A">Which service and which</text>
  <text x="460" y="248" font-size="20" fill="#0F172A">call owns the time.</text>
  <text x="460" y="298" font-size="20" font-weight="600" fill="#475569">In this incident</text>
  <text x="460" y="328" font-size="20" fill="#0F172A">320 of the 420 ms are</text>
  <text x="460" y="354" font-size="20" fill="#0F172A">one catalog query.</text>

  
  <rect x="830" y="100" width="360" height="320" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M830 112 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#F5F3FF"/>
  <text x="1010" y="134" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Log: what actually happened</text>
  <text x="850" y="192" font-size="20" font-weight="600" fill="#475569">What it tells you</text>
  <text x="850" y="222" font-size="20" fill="#0F172A">The detail from inside</text>
  <text x="850" y="248" font-size="20" fill="#0F172A">that one call.</text>
  <text x="850" y="298" font-size="20" font-weight="600" fill="#475569">In this incident</text>
  <text x="850" y="328" font-size="20" fill="#0F172A">the query lost its index</text>
  <text x="850" y="354" font-size="20" fill="#0F172A">in last night's migration.</text>

  <line x1="230" y1="422" x2="230" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#ob4-slate)"/>
  <line x1="620" y1="422" x2="620" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#ob4-slate)"/>
  <line x1="1010" y1="422" x2="1010" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#ob4-slate)"/>

  <rect x="50" y="452" width="1140" height="100" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="620" y="492" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">trace_id = 7f3a9c21</text>
  <text x="620" y="524" font-size="20" fill="#065F46" text-anchor="middle">stamped on all three, which is what lets you jump from one to the next</text>

  
  <rect x="50" y="586" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="622" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Alone each signal is a hint. Joined by one trace id they are an answer.</text>
  <text x="620" y="652" font-size="20" fill="#334155" text-anchor="middle">The correlation is the point of OpenTelemetry, not the collecting.</text>
</svg>