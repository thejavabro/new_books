<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A URI identifies a resource. A URL is a URI that locates the resource, answering how and where, like https://shop.example.com/products/42. A URN is a URI that names the resource, answering what, like urn:isbn:0451450523.">
  <defs>
    <filter id="ur1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ur1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ur1-k1"><rect x="90" y="190" width="500" height="90" rx="12"/></clipPath>
    <clipPath id="ur1-k2"><rect x="650" y="190" width="500" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">URI, URL, and URN</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">URI is the general term. URL and URN are two kinds of URI.</text>

  <rect x="40" y="120" width="1160" height="250" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">URI: identifies a resource</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ur1-soft)">
    <rect x="90" y="190" width="500" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="90" y="190" width="6" height="90" fill="#2563EB" clip-path="url(#ur1-k1)"/>
  </g>
  <circle cx="128" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,224.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="154" y="242" font-size="21.5" font-weight="600" fill="#111827">URL: locates it</text>
  <text x="340" y="309" font-size="18.5" text-anchor="middle" fill="#6B7280">answers how and where</text>
  <text x="340" y="336" font-size="18.5" text-anchor="middle" fill="#94A3B8">https://shop.example.com/products/42</text>
  <g filter="url(#ur1-soft)">
    <rect x="650" y="190" width="500" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="650" y="190" width="6" height="90" fill="#059669" clip-path="url(#ur1-k2)"/>
  </g>
  <circle cx="688" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,224.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="714" y="242" font-size="21.5" font-weight="600" fill="#111827">URN: names it</text>
  <text x="900" y="309" font-size="18.5" text-anchor="middle" fill="#6B7280">answers what</text>
  <text x="900" y="336" font-size="18.5" text-anchor="middle" fill="#94A3B8">urn:isbn:0451450523</text>

  <rect x="40" y="400" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="425" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="450" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Always true</text>
  <text x="323" y="450" font-size="18.5" fill="#475569">every URL and every URN is a URI</text>
  <rect x="64" y="475" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="500" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Not always</text>
  <text x="323" y="500" font-size="18.5" fill="#475569">a URI is not always a URL, because it may only name the resource</text>
</svg>