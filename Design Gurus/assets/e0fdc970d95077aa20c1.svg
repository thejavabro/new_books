<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pipeline-title pipeline-desc">
<title id="pipeline-title">The pipeline, and where the defects sit</title>
<desc id="pipeline-desc">Three services and two topics. Each service carries one correctness defect that can independently charge a customer twice or lose an order, and none of them is a logic error in the code as written.</desc>
<defs>
<marker id="pipeline-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pipeline-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pipeline-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pipeline-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="710" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The pipeline, and where the defects sit</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three defects in that code can each independently charge a customer twice or lose an order.</text>
<rect x="40" y="632" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="632" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="300" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Order service</text><text x="190" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">writes orders</text>
<path d="M346 154H464" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 154H464" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<text x="405" y="142" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">orders</text>
<rect x="470" y="118" width="300" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Payment service</text><text x="620" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">charges the gateway</text>
<path d="M776 154H894" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M776 154H894" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<text x="835" y="142" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">payments</text>
<rect x="900" y="118" width="300" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1050" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Fulfillment</text><text x="1050" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">ships the order</text>
<path d="M190 196V238" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M190 196V238" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-red)"/>
<circle cx="190" cy="262" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="190" y="269" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="40" y="294" width="300" height="68" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="321" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">publishes outside its</text><text x="190" y="347" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">transaction</text>
<path d="M620 196V238" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 196V238" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-red)"/>
<circle cx="620" cy="262" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="269" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="470" y="294" width="300" height="68" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="334" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">commits offsets on a timer</text>
<path d="M1050 196V238" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1050 196V238" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-red)"/>
<circle cx="1050" cy="262" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1050" y="269" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="900" y="294" width="300" height="68" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1050" y="321" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">applies every event</text><text x="1050" y="347" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">unconditionally</text>
<rect x="40" y="386" width="560" height="110" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="386" width="5" height="110" rx="2.5" fill="#F3CF6A"/><text x="64" y="421" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The reported symptoms</text><text x="64" y="447" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Some customers charged twice.</text><text x="64" y="473" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Two orders paid for and never shipped.</text>
<rect x="640" y="386" width="560" height="110" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="386" width="5" height="110" rx="2.5" fill="#AC8BE8"/><text x="664" y="421" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What the code is not</text><text x="664" y="447" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Logically wrong. Every defect is in a</text><text x="664" y="473" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">gap between two operations.</text>
<rect x="40" y="520" width="1160" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="520" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="64" y="554.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Ask at every boundary: what if the process stops here,</text><text x="64" y="583.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">and what if this message arrives twice.</text>
<text x="66" y="666" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Four months in production, every test passing, and two support tickets.</text>
</svg>