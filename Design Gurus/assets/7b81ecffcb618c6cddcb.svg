<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four-part shape of a strong decision: restate the constraint that decides it, commit to one decision, name what you are giving up, then name the trigger that would change your mind.">
  <defs>
    <marker id="m01-l06-decision-answer-shape-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m01-l06-decision-answer-shape-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="770" fill="#FFFFFF"/>

  
  <rect x="40" y="24" width="1160" height="706" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="66" font-size="20" font-weight="600" fill="#334155">A strong answer to any decision like this has the same four parts</text>

  
  <g fill="none" stroke-width="3" stroke="#059669">
    <path d="M620,210 L620,260" marker-end="url(#m01-l06-decision-answer-shape-em)"/>
    <path d="M620,370 L620,420" marker-end="url(#m01-l06-decision-answer-shape-em)"/>
    <path d="M620,530 L620,580" marker-end="url(#m01-l06-decision-answer-shape-em)"/>
  </g>

  
  <g filter="url(#m01-l06-decision-answer-shape-soft)">
    <rect x="270" y="100" width="700" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="620" y="145" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Restate the constraint that decides it</text>
  <text x="620" y="181" text-anchor="middle" font-size="20" fill="#64748B">team size, domain stability, load shape, or ops maturity</text>

  
  <g filter="url(#m01-l06-decision-answer-shape-soft)">
    <rect x="270" y="260" width="700" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="620" y="305" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Commit to one decision</text>
  <text x="620" y="341" text-anchor="middle" font-size="20" fill="#64748B">hedging between options is worse than either choice</text>

  
  <g filter="url(#m01-l06-decision-answer-shape-soft)">
    <rect x="270" y="420" width="700" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="620" y="465" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3. Name what you are giving up</text>
  <text x="620" y="501" text-anchor="middle" font-size="20" fill="#64748B">every architecture pays something, so say what</text>

  
  <g filter="url(#m01-l06-decision-answer-shape-soft)">
    <rect x="270" y="580" width="700" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="620" y="625" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">4. Name the trigger that would change your mind</text>
  <text x="620" y="661" text-anchor="middle" font-size="20" fill="#64748B">turns a static opinion into engineering judgment</text>
</svg>