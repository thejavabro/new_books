<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="guarantees-title guarantees-desc">
<title id="guarantees-title">The five safety guarantees</title>
<desc id="guarantees-desc">Election safety, leader append-only, log matching, leader completeness and state machine safety. The first four exist to produce the fifth, which is the one an application actually relies on.</desc>
<defs>
<marker id="guarantees-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="guarantees-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="guarantees-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="guarantees-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="690" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The five safety guarantees</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The first four exist to produce the fifth, which is the one an application actually relies on.</text>
<rect x="40" y="612" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="612" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Election safety</text>
<path d="M536 146H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 146H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#guarantees-marker-slate)"/>
<rect x="580" y="118" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">at most one leader per term</text>
<circle cx="60" cy="214" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Leader append-only</text>
<path d="M536 214H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 214H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#guarantees-marker-slate)"/>
<rect x="580" y="186" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a leader never overwrites or deletes its own entries</text>
<circle cx="60" cy="282" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Log matching</text>
<path d="M536 282H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 282H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#guarantees-marker-slate)"/>
<rect x="580" y="254" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">same index and term means identical logs up to that point</text>
<circle cx="60" cy="350" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="440" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Leader completeness</text>
<path d="M536 350H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 350H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#guarantees-marker-slate)"/>
<rect x="580" y="322" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a committed entry is present in every later leader</text>
<circle cx="60" cy="418" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="425" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="390" width="440" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">State machine safety</text>
<path d="M536 418H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 418H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#guarantees-marker-slate)"/>
<rect x="580" y="390" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="424" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no two nodes ever apply a different entry at the same index</text>
<rect x="40" y="476" width="1160" height="110" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="476" width="5" height="110" rx="2.5" fill="#AC8BE8"/><text x="64" y="508" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The last one is the property your application depends on.</text><text x="64" y="537" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Everything above it exists to produce it.</text><text x="64" y="566" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Each guarantee answers a question an interviewer may ask, which is why the list is worth holding.</text>
<text x="66" y="646" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Easy to recite. The boundaries are what separate candidates.</text>
</svg>