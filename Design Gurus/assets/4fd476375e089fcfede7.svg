<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before the window opens">
<defs>
<filter id="cs-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="708" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many stretches of [1, 2, 2, 13, 1] have all values within 2 of each other?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">That is the same as saying the largest and smallest of the stretch differ by no more than 2</text>
<rect x="40" y="106" width="1160" height="456" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Two queues are kept: one with the largest at its front, one with the smallest</text>
<text x="242" y="228" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<rect x="264" y="190" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="328" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="328" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="410" y="190" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="474" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="474" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="556" y="190" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="620" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="702" y="190" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="766" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">13</text>
<text x="766" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="848" y="190" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="912" y="227.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="912" y="272" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<text x="544" y="368" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">largest first</text>
<text x="572" y="367" font-size="18" fill="#475569">nothing queued yet</text>
<text x="544" y="476" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">smallest first</text>
<text x="572" y="475" font-size="18" fill="#475569">nothing queued yet</text>
<text x="620" y="304" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">Only two of the numbers in a window ever matter, so only those two are tracked</text>
<rect x="40" y="584" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="624" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Each queue is kept in order, so its front is the value wanted</text>
<text x="620" y="656" text-anchor="middle" font-size="18.5" fill="#475569">A number is dropped from the back the moment a newer one makes it useless</text>
</svg>