<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="606" viewBox="0 0 1240 606" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two bar charts showing the share of the ring each machine owns before and after machine C leaves. With one token per machine, D jumps from forty-two percent to sixty percent. With virtual nodes, A, B and D each rise from twenty-five percent to thirty-three percent.">
  <rect x="0" y="0" width="1240" height="606" fill="#FFFFFF"/>
  <defs>
    <marker id="chs5-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="chs5-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="chs5-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="chs5-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="chs5-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="chs5-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="chs5-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="chs5-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="chs5-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Who picks up the load when machine C leaves</text>
  <rect x="24" y="70" width="588" height="502" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="106" font-size="22" font-weight="600" fill="#B91C1C" text-anchor="middle">One token per machine</text>
  <path d="M64 452 H572" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <rect x="324" y="137" width="22" height="14" rx="3" fill="#CBD5E1"/>
  <text x="354" y="150" font-size="18" fill="#64748B" text-anchor="start">before</text>
  <rect x="434" y="137" width="22" height="14" rx="3" fill="#0F172A"/>
  <text x="464" y="150" font-size="18" fill="#64748B" text-anchor="start">after</text>
  <rect x="77.5" y="340" width="46" height="112" rx="4" fill="#CBD5E1"/>
  <text x="100.5" y="331" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">28</text>
  <rect x="131.5" y="340" width="46" height="112" rx="4" fill="#0F172A"/>
  <text x="154.5" y="331" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">28</text>
  <text x="127.5" y="482" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">machine A</text>
  <rect x="204.5" y="404" width="46" height="48" rx="4" fill="#CBD5E1"/>
  <text x="227.5" y="395" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">12</text>
  <rect x="258.5" y="404" width="46" height="48" rx="4" fill="#0F172A"/>
  <text x="281.5" y="395" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">12</text>
  <text x="254.5" y="482" font-size="19" font-weight="600" fill="#065F46" text-anchor="middle">machine B</text>
  <rect x="331.5" y="380" width="46" height="72" rx="4" fill="#CBD5E1"/>
  <text x="354.5" y="371" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">18</text>
  <text x="408.5" y="440" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="middle">gone</text>
  <text x="381.5" y="482" font-size="19" font-weight="600" fill="#B45309" text-anchor="middle">machine C</text>
  <rect x="458.5" y="284" width="46" height="168" rx="4" fill="#CBD5E1"/>
  <text x="481.5" y="275" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">42</text>
  <rect x="512.5" y="212" width="46" height="240" rx="4" fill="#0F172A"/>
  <text x="535.5" y="203" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">60</text>
  <text x="508.5" y="482" font-size="19" font-weight="600" fill="#6D28D9" text-anchor="middle">machine D</text>
  <text x="318" y="528" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">D takes the whole of C and nobody else helps.</text>
  <text x="318" y="556" font-size="19" fill="#64748B" text-anchor="middle">One neighbour absorbs the failure on its own.</text>
  <rect x="628" y="70" width="588" height="502" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="106" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">Six virtual nodes per machine</text>
  <path d="M668 452 H1176" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <rect x="928" y="137" width="22" height="14" rx="3" fill="#CBD5E1"/>
  <text x="958" y="150" font-size="18" fill="#64748B" text-anchor="start">before</text>
  <rect x="1038" y="137" width="22" height="14" rx="3" fill="#0F172A"/>
  <text x="1068" y="150" font-size="18" fill="#64748B" text-anchor="start">after</text>
  <rect x="681.5" y="352" width="46" height="100" rx="4" fill="#CBD5E1"/>
  <text x="704.5" y="343" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">25</text>
  <rect x="735.5" y="320" width="46" height="132" rx="4" fill="#0F172A"/>
  <text x="758.5" y="311" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">33</text>
  <text x="731.5" y="482" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">machine A</text>
  <rect x="808.5" y="352" width="46" height="100" rx="4" fill="#CBD5E1"/>
  <text x="831.5" y="343" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">25</text>
  <rect x="862.5" y="320" width="46" height="132" rx="4" fill="#0F172A"/>
  <text x="885.5" y="311" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">33</text>
  <text x="858.5" y="482" font-size="19" font-weight="600" fill="#065F46" text-anchor="middle">machine B</text>
  <rect x="935.5" y="352" width="46" height="100" rx="4" fill="#CBD5E1"/>
  <text x="958.5" y="343" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">25</text>
  <text x="1012.5" y="440" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="middle">gone</text>
  <text x="985.5" y="482" font-size="19" font-weight="600" fill="#B45309" text-anchor="middle">machine C</text>
  <rect x="1062.5" y="352" width="46" height="100" rx="4" fill="#CBD5E1"/>
  <text x="1085.5" y="343" font-size="19" font-weight="700" fill="#64748B" text-anchor="middle">25</text>
  <rect x="1116.5" y="320" width="46" height="132" rx="4" fill="#0F172A"/>
  <text x="1139.5" y="311" font-size="19" font-weight="700" fill="#0F172A" text-anchor="middle">33</text>
  <text x="1112.5" y="482" font-size="19" font-weight="600" fill="#6D28D9" text-anchor="middle">machine D</text>
  <text x="922" y="528" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The three survivors each take a third of C.</text>
  <text x="922" y="556" font-size="19" fill="#64748B" text-anchor="middle">The extra work is shared, so no machine is overloaded.</text>
  <text x="620" y="592" font-size="18" fill="#64748B" text-anchor="middle">Numbers are the share of the hash ring each machine owns, in percent.</text>
</svg>