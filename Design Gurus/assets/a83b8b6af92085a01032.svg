<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" role="img" aria-label="The deep dive means picking the two or three parts that are genuinely hard for this system and presenting each option against its alternative with the reason for the choice.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="470" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Every design has two or three genuinely hard parts. Pick them.</text>
  <rect x="40" y="72" width="1160" height="56" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="108" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A Twitter-like service</text>
  <text x="430" y="108" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Timeline generation, the celebrity problem</text>
  <rect x="40" y="140" width="1160" height="56" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="176" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A URL shortener</text>
  <text x="430" y="176" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Key generation, cache sizing</text>
  <rect x="40" y="208" width="1160" height="56" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="244" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A chat system</text>
  <text x="430" y="244" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Connection handling, message ordering</text>
  <rect x="40" y="292" width="1160" height="148" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="70" y="328" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Present the option with its alternative, and say why you chose one.</text>
  <text x="70" y="362" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">"Fan out on write makes reads cheap, which suits a hundred to one read ratio. But a celebrity with fifty</text>
  <text x="70" y="392" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">million followers turns one post into fifty million writes. So: fan out on write for normal accounts, and</text>
  <text x="70" y="422" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">merge celebrity posts in at read time."</text>
</svg>