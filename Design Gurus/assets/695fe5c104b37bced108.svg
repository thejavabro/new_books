<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="956" viewBox="0 0 1240 956" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A matrix with two axes, safe and idempotent. GET is both safe and idempotent. PUT and DELETE change state but are idempotent. POST and PATCH change state and are not idempotent by method definition. The safe but not idempotent cell is empty, because a read never asks for a second change. Underneath, a timeout asks whether an automatic retry is allowed: yes for the idempotent methods, and only when the operation publishes that a retry is safe, which for POST means an idempotency key.">
  <defs>
    <marker id="xl03safeide-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="xl03safeide-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="xl03safeide-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl03safeide-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl03safeide-k1"><rect x="192" y="190" width="450" height="90" rx="12"/></clipPath>
    <clipPath id="xl03safeide-k2"><rect x="722" y="190" width="450" height="90" rx="12"/></clipPath>
    <clipPath id="xl03safeide-k3"><rect x="192" y="368" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="xl03safeide-k4"><rect x="432" y="368" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="xl03safeide-k5"><rect x="722" y="368" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="xl03safeide-k6"><rect x="962" y="368" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="xl03safeide-k7"><rect x="192" y="636" width="450" height="90" rx="12"/></clipPath>
    <clipPath id="xl03safeide-k8"><rect x="722" y="636" width="450" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="956" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Safety and idempotency</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">read the row and the column together</text>

  
  <text x="148" y="242" text-anchor="end" font-size="16.5" font-weight="600" fill="#475569">Safe</text>
  <text x="148" y="420" text-anchor="end" font-size="16.5" font-weight="600" fill="#475569">Not safe</text>

  
  <rect x="164" y="126" width="506" height="412" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="192" y="162" font-size="16.5" font-weight="600" fill="#475569">Idempotent</text>

  
  <g filter="url(#xl03safeide-lift)">
    <rect x="192" y="190" width="450" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="192" y="190" width="9" height="90" fill="#059669" clip-path="url(#xl03safeide-k1)"/>
  </g>
  <circle cx="230" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(219.56,224.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="256" y="242" font-size="18.5" font-weight="600" fill="#111827">GET</text>
  <text x="417" y="305" font-size="15.5" text-anchor="middle" fill="#6B7280">a read, so it is both safe and idempotent</text>

  
  <g filter="url(#xl03safeide-soft)">
    <rect x="192" y="368" width="210" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="192" y="368" width="6" height="90" fill="#2563EB" clip-path="url(#xl03safeide-k3)"/>
  </g>
  <circle cx="230" cy="413" r="18" fill="#FFFFFF"/>
  <g transform="translate(219.56,402.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="256" y="420" font-size="18.5" font-weight="600" fill="#111827">PUT</text>

  
  <g filter="url(#xl03safeide-soft)">
    <rect x="432" y="368" width="210" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="432" y="368" width="6" height="90" fill="#2563EB" clip-path="url(#xl03safeide-k4)"/>
  </g>
  <circle cx="470" cy="413" r="18" fill="#FFFFFF"/>
  <g transform="translate(459.56,402.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="496" y="420" font-size="18.5" font-weight="600" fill="#111827">DELETE</text>

  <text x="417" y="483" font-size="15.5" text-anchor="middle" fill="#6B7280">they change state, but stay idempotent</text>
  <text x="417" y="506" font-size="15.5" text-anchor="middle" fill="#94A3B8">a repeat leaves the same final state</text>

  
  <rect x="694" y="126" width="506" height="412" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="722" y="162" font-size="16.5" font-weight="600" fill="#475569">Not idempotent</text>

  
  <g filter="url(#xl03safeide-soft)">
    <rect x="722" y="190" width="450" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="7 6"/>
    <rect x="722" y="190" width="6" height="90" fill="#64748B" clip-path="url(#xl03safeide-k2)"/>
  </g>
  <circle cx="760" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(749.56,224.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8 12h8"/>
  </g>
  <text x="786" y="242" font-size="18.5" font-weight="600" fill="#111827">Nothing here</text>
  <text x="947" y="305" font-size="15.5" text-anchor="middle" fill="#6B7280">a read asks for no change</text>

  
  <g filter="url(#xl03safeide-soft)">
    <rect x="722" y="368" width="210" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="722" y="368" width="6" height="90" fill="#DB2777" clip-path="url(#xl03safeide-k5)"/>
  </g>
  <circle cx="760" cy="413" r="18" fill="#FFFFFF"/>
  <g transform="translate(749.56,402.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 8v8M8 12h8"/>
  </g>
  <text x="786" y="420" font-size="18.5" font-weight="600" fill="#111827">POST</text>

  
  <g filter="url(#xl03safeide-soft)">
    <rect x="962" y="368" width="210" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="962" y="368" width="6" height="90" fill="#DB2777" clip-path="url(#xl03safeide-k6)"/>
  </g>
  <circle cx="1000" cy="413" r="18" fill="#FFFFFF"/>
  <g transform="translate(989.56,402.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 19.5h4l11-11-4-4-11 11z"/>
    <path d="M14.5 5.5l4 4"/>
  </g>
  <text x="1026" y="420" font-size="18.5" font-weight="600" fill="#111827">PATCH</text>

  <text x="947" y="483" font-size="15.5" text-anchor="middle" fill="#6B7280">not guaranteed idempotent by the method</text>
  <text x="947" y="506" font-size="15.5" text-anchor="middle" fill="#94A3B8">the method definition promises nothing here</text>

  
  <rect x="40" y="578" width="1160" height="206" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="612" font-size="16.5" font-weight="600" fill="#475569">After a timeout, may a program retry?</text>

  
  <g fill="none" stroke-width="2">
    <path d="M417,538 V635" stroke="#2563EB" marker-end="url(#xl03safeide-bl)"/>
    <path d="M947,538 V635" stroke="#DB2777" marker-end="url(#xl03safeide-pk)"/>
  </g>

  
  <g filter="url(#xl03safeide-soft)">
    <rect x="192" y="636" width="450" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="192" y="636" width="6" height="90" fill="#059669" clip-path="url(#xl03safeide-k7)"/>
  </g>
  <circle cx="230" cy="681" r="18" fill="#FFFFFF"/>
  <g transform="translate(219.56,670.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="256" y="688" font-size="18.5" font-weight="600" fill="#111827">Yes, by the method</text>
  <text x="417" y="751" font-size="15.5" text-anchor="middle" fill="#6B7280">GET, PUT and DELETE leave the same final state</text>

  
  <g filter="url(#xl03safeide-soft)">
    <rect x="722" y="636" width="450" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="722" y="636" width="6" height="90" fill="#D97706" clip-path="url(#xl03safeide-k8)"/>
  </g>
  <circle cx="760" cy="681" r="18" fill="#FFFFFF"/>
  <g transform="translate(749.56,670.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="786" y="688" font-size="18.5" font-weight="600" fill="#111827">Only if the operation says so</text>
  <text x="947" y="751" font-size="15.5" text-anchor="middle" fill="#6B7280">for example, POST with documented idempotency</text>

  
  <rect x="40" y="812" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="854" text-anchor="middle" font-size="16" fill="#475569">Two properties settle most of the method choice.</text>
  <text x="620" y="886" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Idempotency is about the final state, not an identical response.</text>
</svg>