<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The string before any star is applied">
<defs>
<filter id="rs-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Apply every star in "a*bc*def**g"</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A star deletes the closest letter to its left, and itself</text>
<rect x="40" y="106" width="1160" height="488" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Reading left to right, the letter a star deletes is always the most recent one kept</text>
<text x="145" y="260" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the string</text>
<rect x="169" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="205.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">a</text>
<rect x="252" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="288.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">*</text>
<rect x="335" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="371.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">b</text>
<rect x="418" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="454.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">c</text>
<rect x="501" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="537.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">*</text>
<rect x="584" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">d</text>
<rect x="667" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="703.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">e</text>
<rect x="750" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="786.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">f</text>
<rect x="833" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="869.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">*</text>
<rect x="916" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="952.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">*</text>
<rect x="999" y="222" width="73" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1035.5" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">g</text>
<text x="256" y="388" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">kept so far</text>
<text x="286" y="387" font-size="18" fill="#475569">nothing kept yet</text>
<rect x="320" y="452" width="600" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="485.02" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">nothing read yet</text>
<text x="620" y="534" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">That is exactly what a stack gives: the most recent thing is the first to come off</text>
<rect x="40" y="606" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="646" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A star is an undo of the last letter kept</text>
<text x="620" y="678" text-anchor="middle" font-size="18.5" fill="#475569">So keep the letters on a stack, and let a star pop one off</text>
</svg>