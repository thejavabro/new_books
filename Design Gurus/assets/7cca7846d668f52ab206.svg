<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Expand-contract applied to a database column change as five separate releases: add the new column, write to both columns, backfill old rows, read from the new column, then drop the old column, grouped into expand, migrate, and contract phases.">
  <defs>
    <marker id="m06-l06-expand-contract-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l06-expand-contract-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m06-l06-expand-contract-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m06-l06-expand-contract-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="610" fill="#FFFFFF"/>

  <rect x="40" y="140" width="470" height="280" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="180" font-size="20" font-weight="600" fill="#334155">Expand</text>
  <text x="60" y="210" font-size="20" fill="#64748B">ship the new alongside the old</text>
  <rect x="520" y="140" width="440" height="280" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="540" y="180" font-size="20" font-weight="600" fill="#334155">Migrate</text>
  <text x="540" y="210" font-size="20" fill="#64748B">move the data and the readers</text>
  <rect x="970" y="140" width="215" height="280" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="990" y="180" font-size="20" font-weight="600" fill="#334155">Contract</text>
  <text x="990" y="210" font-size="20" fill="#64748B">remove the old</text>

  <g filter="url(#m06-l06-expand-contract-soft)">
    <rect x="60" y="240" width="200" height="140" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="160" y="285" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Add the</text>
  <text x="160" y="317" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">new column</text>
  <text x="160" y="349" text-anchor="middle" font-size="20" fill="#64748B">no readers yet</text>
  <g filter="url(#m06-l06-expand-contract-soft)">
    <rect x="290" y="240" width="200" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="390" y="285" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Write to</text>
  <text x="390" y="317" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">both columns</text>
  <text x="390" y="349" text-anchor="middle" font-size="20" fill="#64748B">old code is fine</text>
  <g filter="url(#m06-l06-expand-contract-soft)">
    <rect x="520" y="240" width="200" height="140" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="620" y="285" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3. Backfill</text>
  <text x="620" y="317" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">old rows</text>
  <text x="620" y="349" text-anchor="middle" font-size="20" fill="#64748B">old rows catch up</text>
  <g filter="url(#m06-l06-expand-contract-soft)">
    <rect x="750" y="240" width="200" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="850" y="285" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">4. Read from</text>
  <text x="850" y="317" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the new one</text>
  <text x="850" y="349" text-anchor="middle" font-size="20" fill="#64748B">cut the reads over</text>
  <g filter="url(#m06-l06-expand-contract-soft)">
    <rect x="980" y="240" width="200" height="140" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="1080" y="285" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">5. Drop the</text>
  <text x="1080" y="317" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">old column</text>
  <text x="1080" y="349" text-anchor="middle" font-size="20" fill="#64748B">nothing reads it</text>

  <g fill="none" stroke-width="2.5">
    <path d="M260,310 L282,310" stroke="#3B82F6" marker-end="url(#m06-l06-expand-contract-bl)"/>
    <path d="M490,310 L512,310" stroke="#D97706" marker-end="url(#m06-l06-expand-contract-ab)"/>
    <path d="M720,310 L742,310" stroke="#3B82F6" marker-end="url(#m06-l06-expand-contract-bl)"/>
    <path d="M950,310 L972,310" stroke="#7C3AED" marker-end="url(#m06-l06-expand-contract-vi)"/>
  </g>

  <path d="M60,440 L60,452 L950,452 L950,440" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="505" y="490" text-anchor="middle" font-size="20" fill="#64748B">old and new run side by side the whole way</text>

  <line x1="60" y1="530" x2="96" y2="530" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="537" font-size="20" fill="#475569">Schema change: purely additive, then purely subtractive</text>
  <line x1="60" y1="570" x2="96" y2="570" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="577" font-size="20" fill="#475569">Code change: write both, then read the new one</text>
</svg>