<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1435" viewBox="0 0 1240 1435" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven hard parts of the checkout API: the client never sends a price, cart and quote lifetimes differ, 412 and 409 never overlap in meaning, checkout must never run twice, stock is taken at checkout, an unknown payment outcome stays pending, and money is never cached.">
  <defs>
    <filter id="p2w-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2w-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2w-k1"><rect x="76" y="174" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p2w-k2"><rect x="76" y="314" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p2w-k3"><rect x="76" y="454" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p2w-k4"><rect x="76" y="665" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p2w-k5"><rect x="76" y="876" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p2w-k6"><rect x="76" y="1016" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="p2w-k7"><rect x="76" y="1156" width="560" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1435" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Seven hard parts, seven decisions</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760,66 L766.5,72 L760,78"/>
  </g>
  <text x="786" y="77" font-size="15.5" fill="#6B7280">the decision that hard part forces</text>

  
  <rect x="40" y="126" width="1160" height="467" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Money the server controls</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">three hard parts</text>

  <g filter="url(#p2w-soft)">
    <rect x="76" y="174" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p2w-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">The client never sends a price</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,278 L86.5,284 L80,290"/>
  </g>
  <text x="104" y="289" font-size="15.5" fill="#6B7280">The server calculates the charged amount from a Quote it issued</text>

  <g filter="url(#p2w-soft)">
    <rect x="76" y="314" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="314" width="6" height="90" fill="#2563EB" clip-path="url(#p2w-k2)"/>
  </g>
  <circle cx="114" cy="359" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,348.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="366" font-size="18.5" font-weight="600" fill="#111827">Cart and quote lifetimes differ</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,418 L86.5,424 L80,430"/>
  </g>
  <text x="104" y="429" font-size="15.5" fill="#6B7280">A days-long cart, and a ten-minute price promise, are two resources</text>

  <g filter="url(#p2w-soft)">
    <rect x="76" y="454" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="454" width="6" height="90" fill="#2563EB" clip-path="url(#p2w-k3)"/>
  </g>
  <circle cx="114" cy="499" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,488.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="506" font-size="18.5" font-weight="600" fill="#111827">Money is never cached</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,558 L86.5,564 L80,570"/>
  </g>
  <text x="104" y="569" font-size="15.5" fill="#6B7280">Every monetary response is Cache-Control: no-store</text>

  
  <rect x="40" y="617" width="1160" height="187" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="647" font-size="16.5" font-weight="600" fill="#047857">Running checkout exactly once</text>
  <text x="1176" y="647" text-anchor="end" font-size="15.5" fill="#6B7280">one hard part</text>

  <g filter="url(#p2w-lift)">
    <rect x="76" y="665" width="560" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="76" y="665" width="9" height="90" fill="#059669" clip-path="url(#p2w-k4)"/>
  </g>
  <circle cx="114" cy="710" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,699.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="717" font-size="18.5" font-weight="600" fill="#111827">Checkout must never run twice</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,769 L86.5,775 L80,781"/>
  </g>
  <text x="104" y="780" font-size="15.5" fill="#6B7280">One 24-hour idempotency key covers payment and order effects together</text>

  
  <rect x="40" y="828" width="1160" height="467" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="858" font-size="16.5" font-weight="600" fill="#BE185D">What fails, and how the caller can tell</text>
  <text x="1176" y="858" text-anchor="end" font-size="15.5" fill="#6B7280">three hard parts</text>

  <g filter="url(#p2w-soft)">
    <rect x="76" y="876" width="560" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="876" width="6" height="90" fill="#DB2777" clip-path="url(#p2w-k5)"/>
  </g>
  <circle cx="114" cy="921" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,910.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="928" font-size="18.5" font-weight="600" fill="#111827">412 and 409 never overlap</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,980 L86.5,986 L80,992"/>
  </g>
  <text x="104" y="991" font-size="15.5" fill="#6B7280">A stale If-Match is 412; an expired quote or missing stock is 409</text>

  <g filter="url(#p2w-soft)">
    <rect x="76" y="1016" width="560" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1016" width="6" height="90" fill="#DB2777" clip-path="url(#p2w-k6)"/>
  </g>
  <circle cx="114" cy="1061" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1050.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="1068" font-size="18.5" font-weight="600" fill="#111827">Stock is taken at checkout</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,1120 L86.5,1126 L80,1132"/>
  </g>
  <text x="104" y="1131" font-size="15.5" fill="#6B7280">Carts do not hoard inventory, so stock can fail late</text>

  <g filter="url(#p2w-soft)">
    <rect x="76" y="1156" width="560" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1156" width="6" height="90" fill="#DB2777" clip-path="url(#p2w-k7)"/>
  </g>
  <circle cx="114" cy="1201" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1190.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="1208" font-size="18.5" font-weight="600" fill="#111827">Unknown payment outcome</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,1260 L86.5,1266 L80,1272"/>
  </g>
  <text x="104" y="1271" font-size="15.5" fill="#6B7280">The checkout stays pending; the API never guesses that money moved</text>

  
  <rect x="40" y="1319" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1364" text-anchor="middle" font-size="16" fill="#475569">Seven hard parts, and the one decision each forces: price, lifetimes, codes, one run, stock, pending, no-store.</text>
</svg>