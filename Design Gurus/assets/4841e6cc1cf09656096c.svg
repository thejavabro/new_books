<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Callers on the left, the API contract as the boundary in the middle, and the implementation on the right. The callers are a mobile app, a partner server, another service, and a script. The contract lists operations, inputs and outputs, failures, and long-term promises. The implementation holds a cache, a database, an object store, and an authorization service, all replaceable, while the caller keeps calling the same operations and reading the same fields.">
