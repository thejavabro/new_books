<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Publish-subscribe: a publisher sends a message to a topic inside the broker, and every subscriber receives its own copy">
  <rect x="0" y="0" width="1240" height="570" fill="#FFFFFF"/>
  <defs>
    <marker id="dm2-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="dm2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M252,226 L393,226" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm2-amber)"/>
  <text x="322" y="208" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>

  <path d="M687,196 C800,196 850,76 988,76" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm2-amber)"/>
  <path d="M687,226 L988,226" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm2-amber)"/>
  <path d="M687,256 C800,256 850,376 988,376" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm2-amber)"/>
  <text x="837" y="208" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a copy of every message</text>

  
  <rect x="360" y="126" width="360" height="180" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="540" y="156" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Message Broker</text>

  
  <g filter="url(#dm2-soft)">
    <rect x="395" y="176" width="290" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="540" y="216" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Topic: orders</text>
  <text x="540" y="244" font-size="20" fill="#64748B" text-anchor="middle">stores every message</text>

  
  <g filter="url(#dm2-soft)">
    <rect x="30" y="190" width="220" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="140" y="220" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Publisher</text>
  <text x="140" y="248" font-size="20" fill="#64748B" text-anchor="middle">producer of events</text>

  
  <g filter="url(#dm2-soft)">
    <rect x="990" y="40" width="220" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="990" y="190" width="220" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="990" y="340" width="220" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1100" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Subscriber 1</text>
  <text x="1100" y="98" font-size="20" fill="#64748B" text-anchor="middle">gets its own copy</text>
  <text x="1100" y="220" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Subscriber 2</text>
  <text x="1100" y="248" font-size="20" fill="#64748B" text-anchor="middle">gets its own copy</text>
  <text x="1100" y="370" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Subscriber 3</text>
  <text x="1100" y="398" font-size="20" fill="#64748B" text-anchor="middle">gets its own copy</text>

  
  <rect x="180" y="452" width="880" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="483" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Every subscriber receives every message published to the topic.</text>
  <text x="620" y="511" font-size="20" fill="#64748B" text-anchor="middle">A new subscriber starts getting copies too. The publisher does not change.</text>
</svg>