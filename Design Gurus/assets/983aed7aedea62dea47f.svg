<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="judgment-title judgment-desc">
<title id="judgment-title">Judgment, and what senior means</title>
<desc id="judgment-desc">Judgment is whether the design is proportionate to the problem, and it is heard in three moves: choosing the boring option with a reason, naming what you are not building, and rejecting a technique you clearly know.</desc>
<defs>
<marker id="judgment-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="judgment-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="judgment-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="judgment-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Judgment, and what senior means</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Whether the design is proportionate to the problem, and the sentence it adds up to.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three things you say that show judgment</text>
<rect x="40" y="168" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Choose the boring option and say why</text>
<path d="M526 196H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 196H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgment-marker-slate)"/>
<rect x="570" y="168" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"one database holds this for years at these numbers"</text>
<rect x="40" y="236" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name what you are not building</text>
<path d="M526 264H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 264H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgment-marker-slate)"/>
<rect x="570" y="236" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the trigger that would change it</text>
<rect x="40" y="304" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reject a technique you clearly know</text>
<path d="M526 332H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 332H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#judgment-marker-slate)"/>
<rect x="570" y="304" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stronger evidence of experience than knowing it exists</text>
<rect x="40" y="388" width="1160" height="112" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="388" width="5" height="112" rx="2.5" fill="#F28B9D"/><text x="64" y="423" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Geographic sharding for a product with a thousand users</text><text x="64" y="450" font-size="20" font-weight="400" fill="#A83147" text-anchor="start">shows knowledge and bad judgment at the same time,</text><text x="64" y="477" font-size="20" font-weight="400" fill="#A83147" text-anchor="start">and the second one is the expensive finding.</text>
<rect x="40" y="520" width="1160" height="150" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="520" width="5" height="150" rx="2.5" fill="#AC8BE8"/><text x="64" y="557.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A senior engineer is someone who can be given an ambiguous problem</text><text x="64" y="586.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">and trusted to come back with a decision, its reasoning,</text><text x="64" y="615.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">and an honest account of what it costs.</text><text x="64" y="644.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Nothing in that sentence is about years, titles, or having seen this problem before.</text>
<text x="66" y="730" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Over-preparation damages this signal, because it supplies components looking for a place to be used.</text>
</svg>