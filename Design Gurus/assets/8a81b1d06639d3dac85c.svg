<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="570" viewBox="0 0 1240 570" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three timelines showing when the client is told the write succeeded. Synchronous waits for every copy, so the wait is long. Asynchronous answers at once. Semi-synchronous waits for any one copy and the others catch up afterwards.">
  <rect x="0" y="0" width="1240" height="570" fill="#FFFFFF"/>
  <defs>
    <marker id="rr3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rr3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rr3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rr3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rr3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rr3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rr3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rr3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rr3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">When is the client told that the write succeeded?</text>
  <text x="620" y="72" font-size="19" fill="#64748B" text-anchor="middle">the bar is the time the client is waiting</text>
  <rect x="30" y="114" width="9" height="92" rx="4" fill="#059669"/>
  <text x="58" y="148" font-size="21" font-weight="700" fill="#065F46" text-anchor="start">Synchronous</text>
  <text x="58" y="178" font-size="18" fill="#64748B" text-anchor="start">waits for every copy</text>
  <rect x="470" y="138" width="540" height="44" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="740" y="167" font-size="19" fill="#065F46" text-anchor="middle">client waits</text>
  <path d="M1033,160 L1040,168 L1052,152" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="1042" y="128" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">success</text>
  <rect x="30" y="274" width="9" height="92" rx="4" fill="#D97706"/>
  <text x="58" y="308" font-size="21" font-weight="700" fill="#B45309" text-anchor="start">Asynchronous</text>
  <text x="58" y="338" font-size="18" fill="#64748B" text-anchor="start">does not wait at all</text>
  <rect x="470" y="298" width="130" height="44" rx="9" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="535" y="327" font-size="19" fill="#B45309" text-anchor="middle">client waits</text>
  <path d="M623,320 L630,328 L642,312" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="632" y="288" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">success</text>
  <line x1="670" y1="320" x2="930" y2="320" stroke="#CBD5E1" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#rr3-g)"/>
  <text x="800" y="296" font-size="18" fill="#64748B" text-anchor="middle">the copies receive it later</text>
  <rect x="30" y="434" width="9" height="92" rx="4" fill="#3B82F6"/>
  <text x="58" y="468" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="start">Semi-synchronous</text>
  <text x="58" y="498" font-size="18" fill="#64748B" text-anchor="start">waits for any one copy</text>
  <rect x="470" y="458" width="320" height="44" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="630" y="487" font-size="19" fill="#1E40AF" text-anchor="middle">client waits</text>
  <path d="M813,480 L820,488 L832,472" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="822" y="448" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">success</text>
  <line x1="860" y1="480" x2="1120" y2="480" stroke="#CBD5E1" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#rr3-g)"/>
  <text x="990" y="456" font-size="18" fill="#64748B" text-anchor="middle">the other copies catch up</text>
  <text x="620" y="546" font-size="19" fill="#64748B" text-anchor="middle">A write that is lost is a change the client was already told had succeeded.</text>
</svg>