<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Image file size and pixel memory are different</title><desc id="desc">At four bytes per pixel, a 4000 by 3000 image needs 48 MB for pixels, while a 400 by 300 image needs 0.48 MB. These values exclude other memory.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="640" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Image file size and pixel memory are different</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Example: four bytes per pixel, using decimal MB.</tspan></text><rect x="50" y="175" width="530" height="240" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="217" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Full-size image</tspan></text><text x="72" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">4,000 x 3,000 pixels</tspan><tspan x="72" dy="32">12,000,000 pixels x 4 bytes</tspan><tspan x="72" dy="32">About 48 MB for pixels</tspan></text><rect x="620" y="175" width="530" height="240" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="642" y="217" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="642" dy="0">Smaller image</tspan></text><text x="642" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="642" dy="0">400 x 300 pixels</tspan><tspan x="642" dy="32">120,000 pixels x 4 bytes</tspan><tspan x="642" dy="32">About 0.48 MB for pixels</tspan></text><rect x="50" y="465" width="1100" height="110" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="511" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">The smaller image uses one hundredth of the pixel memory in this example.</tspan><tspan x="600" dy="32">Other app memory is not included.</tspan></text></g></svg>