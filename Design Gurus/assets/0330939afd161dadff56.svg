<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The design as handed to you: an API gateway doing premium membership checks, then a six-hop synchronous chain from User to Cart, Product, Coupon, Payment with five blind retries, and Order, with all six services plus the other six reading and writing one shared PostgreSQL database.">
  <defs>
    <marker id="m07-l11-broken-architecture-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l11-broken-architecture-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m07-l11-broken-architecture-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <g filter="url(#m07-l11-broken-architecture-soft)">
    <rect x="60" y="140" width="380" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="250" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">API Gateway</text>
  <text x="250" y="223" text-anchor="middle" font-size="20" fill="#64748B">it checks premium membership</text>
  <text x="470" y="180" font-size="20" fill="#B91C1C">Business logic in shared infrastructure:</text>
  <text x="470" y="212" font-size="20" fill="#B91C1C">every membership change redeploys the gateway</text>

  <rect x="50" y="310" width="1140" height="400" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1180" y="350" text-anchor="end" font-size="20" font-weight="600" fill="#1E3A8A">Place order: six synchronous hops, in sequence</text>

  <g filter="url(#m07-l11-broken-architecture-soft)">
    <rect x="70" y="400" width="300" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="220" y="467" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User</text>
  <g filter="url(#m07-l11-broken-architecture-soft)">
    <rect x="470" y="400" width="300" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="467" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cart</text>
  <g filter="url(#m07-l11-broken-architecture-soft)">
    <rect x="870" y="400" width="300" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1020" y="467" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Product</text>
  <g filter="url(#m07-l11-broken-architecture-soft)">
    <rect x="70" y="590" width="300" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="220" y="657" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Coupon</text>
  <g filter="url(#m07-l11-broken-architecture-soft)">
    <rect x="470" y="590" width="300" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="641" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment</text>
  <text x="620" y="673" text-anchor="middle" font-size="20" fill="#64748B">five blind retries</text>
  <g filter="url(#m07-l11-broken-architecture-soft)">
    <rect x="870" y="590" width="300" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1020" y="657" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order</text>

  <g filter="url(#m07-l11-broken-architecture-soft)">
    <path d="M200,820 L200,930 A420,20 0 0 0 1040,930 L1040,820" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
    <ellipse cx="620" cy="820" rx="420" ry="20" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="882" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One shared PostgreSQL, all twelve services</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M250,260 L250,392" marker-end="url(#m07-l11-broken-architecture-bl)"/>
    <path d="M370,460 L462,460" marker-end="url(#m07-l11-broken-architecture-bl)"/>
    <path d="M770,460 L862,460" marker-end="url(#m07-l11-broken-architecture-bl)"/>
    <path d="M1020,520 L1020,555 L220,555 L220,582" marker-end="url(#m07-l11-broken-architecture-bl)"/>
    <path d="M370,650 L462,650" marker-end="url(#m07-l11-broken-architecture-bl)"/>
    <path d="M770,650 L862,650" marker-end="url(#m07-l11-broken-architecture-bl)"/>
  </g>

  <g fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5">
    <path d="M220,710 C220,760 380,760 400,792" marker-end="url(#m07-l11-broken-architecture-rd)"/>
    <path d="M620,710 L620,792" marker-end="url(#m07-l11-broken-architecture-rd)"/>
    <path d="M1020,710 C1020,760 860,760 840,792" marker-end="url(#m07-l11-broken-architecture-rd)"/>
    <path d="M70,460 L40,460 L40,865 L184,865" marker-end="url(#m07-l11-broken-architecture-rd)"/>
    <path d="M1170,460 L1200,460 L1200,865 L1056,865" marker-end="url(#m07-l11-broken-architecture-rd)"/>
  </g>

  <circle cx="250" cy="340" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="250" y="347" text-anchor="middle" font-size="20" font-weight="700" fill="#1E40AF">1</text>
  <circle cx="416" cy="460" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="416" y="467" text-anchor="middle" font-size="20" font-weight="700" fill="#1E40AF">2</text>
  <circle cx="816" cy="460" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="816" y="467" text-anchor="middle" font-size="20" font-weight="700" fill="#1E40AF">3</text>
  <circle cx="620" cy="555" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="620" y="562" text-anchor="middle" font-size="20" font-weight="700" fill="#1E40AF">4</text>
  <circle cx="416" cy="650" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="416" y="657" text-anchor="middle" font-size="20" font-weight="700" fill="#1E40AF">5</text>
  <circle cx="816" cy="650" r="17" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="816" y="657" text-anchor="middle" font-size="20" font-weight="700" fill="#1E40AF">6</text>

  <text x="620" y="772" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">all twelve read and write the same tables</text>

  <line x1="60" y1="1010" x2="96" y2="1010" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1017" font-size="20" fill="#475569">A synchronous call: the caller waits, and nothing here is event-driven</text>
  <line x1="60" y1="1050" x2="96" y2="1050" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1057" font-size="20" fill="#475569">Reads and writes on the one shared database</text>
</svg>