<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="726" viewBox="0 0 1240 726" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shapes-title shapes-desc">
<title id="shapes-title">Which workload shapes earn a new store</title>
<desc id="shapes-desc">Five workload shapes, what Postgres specifically handles badly in each, the symptom that tells you the limit has been reached, and the class of store to consider only then.</desc>
<defs>
<marker id="shapes-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shapes-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shapes-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shapes-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="726" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Which workload shapes earn a new store</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Five shapes come up repeatedly.</text>
<rect x="40" y="648" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="648" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="175" y="150" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Workload shape</text>
<text x="457" y="150" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">What Postgres does badly</text>
<text x="749" y="150" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">The tell</text>
<text x="1053" y="150" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Then consider</text>
<rect x="40" y="168" width="270" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="175" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Time-series at volume</text>
<rect x="322" y="168" width="270" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="342" y="193.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">retention, downsampling,</text><text x="342" y="218.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cardinality</text>
<rect x="604" y="168" width="290" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="624" y="193.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">you are fighting retention,</text><text x="624" y="218.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not query speed</text>
<rect x="906" y="168" width="294" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1053" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">TimescaleDB, ClickHouse</text>
<rect x="40" y="244" width="270" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="175" y="282" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Full-text and facets</text>
<rect x="322" y="244" width="270" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="342" y="269.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">relevance tuning,</text><text x="342" y="294.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">typo tolerance</text>
<rect x="604" y="244" width="290" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="624" y="269.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">ranking quality, not</text><text x="624" y="294.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">latency, is the complaint</text>
<rect x="906" y="244" width="294" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1053" y="282" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">OpenSearch</text>
<rect x="40" y="320" width="270" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="175" y="358" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Analytics on live data</text>
<rect x="322" y="320" width="270" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="342" y="345.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">large scans competing</text><text x="342" y="370.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with transactions</text>
<rect x="604" y="320" width="290" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="624" y="345.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reports slow the</text><text x="624" y="370.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">application down</text>
<rect x="906" y="320" width="294" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1053" y="358" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">replica, views, columnar</text>
<rect x="40" y="396" width="270" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="175" y="434" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Graph traversals</text>
<rect x="322" y="396" width="270" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="342" y="421.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">deep multi-hop</text><text x="342" y="446.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">queries</text>
<rect x="604" y="396" width="290" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="624" y="421.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">traversal IS the product,</text><text x="624" y="446.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a feature</text>
<rect x="906" y="396" width="294" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1053" y="434" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a graph database</text>
<rect x="40" y="472" width="270" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="175" y="510" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Extreme write ingest</text>
<rect x="322" y="472" width="270" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="342" y="497.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">B-tree write</text><text x="342" y="522.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">amplification</text>
<rect x="604" y="472" width="290" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="624" y="497.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">measured, from the</text><text x="624" y="522.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">storage engine lesson</text>
<rect x="906" y="472" width="294" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1053" y="510" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cassandra, ScyllaDB</text>
<rect x="40" y="560" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="560" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="597" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Every row names a measurable property of the workload, not a preference between products.</text>
<text x="66" y="682" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Stop asking which database is best. Ask what shape the workload is and what Postgres does badly with it.</text>
</svg>