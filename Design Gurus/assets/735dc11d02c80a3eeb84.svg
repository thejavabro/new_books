<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="970" viewBox="0 0 1240 970" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Flowchart of the on-call path: an SLO alert says checkout latency tripled, then ask whether any deploy or flag landed in the last few hours. Yes means roll back first and diagnose second. No means pull one trace of a slow checkout, read the span tree to see where the 3x sits, check that service RED dashboard plus dependency saturation, and land on one cause: a lock storm, a missing index, or a noisy neighbor.">
  <defs>
    <marker id="m06-l07-incident-response-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l07-incident-response-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m06-l07-incident-response-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l07-incident-response-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m06-l07-incident-response-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="970" fill="#FFFFFF"/>

  <g filter="url(#m06-l07-incident-response-soft)">
    <rect x="50" y="160" width="300" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="200" y="200" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">SLO alert: checkout</text>
  <text x="200" y="232" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">latency tripled</text>
  <text x="200" y="264" text-anchor="middle" font-size="20" fill="#64748B">a symptom, not a CPU graph</text>
  <g filter="url(#m06-l07-incident-response-soft)">
    <path d="M560,130 L720,225 L560,320 L400,225 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="560" y="216" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Any deploy or flag</text>
  <text x="560" y="248" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">in the last few hours?</text>
  <g filter="url(#m06-l07-incident-response-soft)">
    <rect x="790" y="165" width="390" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="985" y="216" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Roll back first,</text>
  <text x="985" y="248" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">diagnose second</text>

  <rect x="40" y="360" width="1150" height="430" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="405" font-size="20" font-weight="600" fill="#1E3A8A">No, nothing changed</text>
  <text x="1170" y="405" text-anchor="end" font-size="20" fill="#64748B">one trace replaces grepping twelve services' logs</text>

  <g filter="url(#m06-l07-incident-response-soft)">
    <rect x="90" y="440" width="470" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="325" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pull one trace of a slow checkout</text>
  <text x="325" y="533" text-anchor="middle" font-size="20" fill="#64748B">one request, end to end</text>
  <g filter="url(#m06-l07-incident-response-soft)">
    <rect x="650" y="440" width="470" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="885" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The span tree shows where the 3x sits</text>
  <text x="885" y="533" text-anchor="middle" font-size="20" fill="#64748B">time per step, one culprit</text>
  <g filter="url(#m06-l07-incident-response-soft)">
    <rect x="90" y="630" width="470" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="325" y="691" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Check that RED dashboard</text>
  <text x="325" y="723" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">and dependency saturation</text>
  <g filter="url(#m06-l07-incident-response-soft)">
    <rect x="650" y="630" width="470" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="885" y="691" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One cause: a lock storm, a missing</text>
  <text x="885" y="723" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">index, or a noisy neighbor</text>

  <g fill="none" stroke-width="2.5">
    <path d="M350,225 L392,225" stroke="#475569" stroke-width="2" marker-end="url(#m06-l07-incident-response-sl)"/>
    <path d="M720,225 L782,225" stroke="#DC2626" marker-end="url(#m06-l07-incident-response-rd)"/>
    <path d="M560,320 L560,340 L325,340 L325,432" stroke="#3B82F6" marker-end="url(#m06-l07-incident-response-bl)"/>
    <path d="M560,510 L642,510" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l07-incident-response-bl)"/>
    <path d="M885,580 L885,605 L325,605 L325,622" stroke="#3B82F6" stroke-width="2" marker-end="url(#m06-l07-incident-response-bl)"/>
    <path d="M560,700 L642,700" stroke="#059669" marker-end="url(#m06-l07-incident-response-em)"/>
  </g>

  <text x="751" y="150" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="450" y="328" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <line x1="60" y1="850" x2="96" y2="850" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="857" font-size="20" fill="#475569">Something changed: undo it, then understand it</text>
  <line x1="60" y1="890" x2="96" y2="890" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="897" font-size="20" fill="#475569">Nothing changed: read one request end to end</text>
  <line x1="60" y1="930" x2="96" y2="930" stroke="#059669" stroke-width="4"/>
  <text x="108" y="937" font-size="20" fill="#475569">The path lands on one cause, not a list of suspects</text>
</svg>