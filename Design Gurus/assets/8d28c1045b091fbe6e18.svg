<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="550" viewBox="0 0 1240 550" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five nodes with a write set of three nodes and a read set of three nodes overlapping at node 3, which holds the latest value, because W plus R is greater than N">
  <rect x="0" y="0" width="1240" height="550" fill="#FFFFFF"/>
  <defs>
    <marker id="qr3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="qr3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="620" y1="140" x2="620" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#qr3-slate)"/>

  
  <rect x="20" y="160" width="725" height="195" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="190" font-size="20" font-weight="600" fill="#1E3A8A">Write set: W = 3 nodes</text>

  
  <rect x="495" y="205" width="725" height="195" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1200" y="380" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">Read set: R = 3 nodes</text>

  
  <g filter="url(#qr3-soft)">
    <path d="M40,230 L40,300 A105,15 0 0 0 250,300 L250,230" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <ellipse cx="145" cy="230" rx="105" ry="15" fill="#F8FBFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M278,230 L278,300 A105,15 0 0 0 488,300 L488,230" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <ellipse cx="383" cy="230" rx="105" ry="15" fill="#F8FBFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M515,230 L515,300 A105,15 0 0 0 725,300 L725,230" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <ellipse cx="620" cy="230" rx="105" ry="15" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <path d="M753,230 L753,300 A105,15 0 0 0 963,300 L963,230" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="858" cy="230" rx="105" ry="15" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M990,230 L990,300 A105,15 0 0 0 1200,300 L1200,230" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="1095" cy="230" rx="105" ry="15" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="145" y="270" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 1</text>
  <text x="145" y="298" font-size="20" fill="#065F46" text-anchor="middle">has v1 (latest)</text>
  <text x="383" y="270" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 2</text>
  <text x="383" y="298" font-size="20" fill="#065F46" text-anchor="middle">has v1 (latest)</text>
  <text x="620" y="270" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 3</text>
  <text x="620" y="298" font-size="20" fill="#065F46" text-anchor="middle">has v1 (latest)</text>
  <text x="858" y="270" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 4</text>
  <text x="858" y="298" font-size="20" fill="#64748B" text-anchor="middle">has the old value</text>
  <text x="1095" y="270" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Node 5</text>
  <text x="1095" y="298" font-size="20" fill="#64748B" text-anchor="middle">has the old value</text>

  
  <g filter="url(#qr3-soft)">
    <rect x="410" y="30" width="420" height="105" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="61" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The overlap</text>
  <text x="620" y="91" font-size="20" fill="#64748B" text-anchor="middle">at least one node is in both sets</text>
  <text x="620" y="118" font-size="20" fill="#64748B" text-anchor="middle">and holds the latest value</text>

  
  <rect x="210" y="440" width="820" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="471" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">N = 5 nodes. W + R = 3 + 3 = 6, which is greater than 5.</text>
  <text x="620" y="499" font-size="20" fill="#64748B" text-anchor="middle">The two sets cannot avoid sharing at least one node.</text>
</svg>