<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Entity services sized by noun: one business operation, placing an order, fans out into five synchronous calls, and no entity service can complete the operation alone">
  <defs>
    <marker id="m02-l03-order-fanout-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m02-l03-order-fanout-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="670" fill="#FFFFFF"/>

  <rect x="20" y="340" width="1200" height="190" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="42" y="512" font-size="20" font-weight="600" fill="#B91C1C">Entity services, sized by noun</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M560,160 C560,270 115,270 115,380" marker-end="url(#m02-l03-order-fanout-bl)"/>
    <path d="M590,160 C590,270 367,270 367,380" marker-end="url(#m02-l03-order-fanout-bl)"/>
    <path d="M619,160 L619,380" marker-end="url(#m02-l03-order-fanout-bl)"/>
    <path d="M648,160 C648,270 871,270 871,380" marker-end="url(#m02-l03-order-fanout-bl)"/>
    <path d="M678,160 C678,270 1123,270 1123,380" marker-end="url(#m02-l03-order-fanout-bl)"/>
  </g>
  <text x="619" y="290" font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">five synchronous calls</text>

  <g filter="url(#m02-l03-order-fanout-soft)">
    <rect x="459" y="70" width="320" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="619" y="110" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Place an order</text>
  <text x="619" y="142" text-anchor="middle" font-size="20" fill="#64748B">one business operation</text>

  <g filter="url(#m02-l03-order-fanout-soft)">
    <rect x="40" y="380" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="115" y="415" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User</text>
  <text x="115" y="445" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <g filter="url(#m02-l03-order-fanout-soft)">
    <rect x="292" y="380" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="367" y="415" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Product</text>
  <text x="367" y="445" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <g filter="url(#m02-l03-order-fanout-soft)">
    <rect x="544" y="380" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="619" y="415" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="619" y="445" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <g filter="url(#m02-l03-order-fanout-soft)">
    <rect x="796" y="380" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="871" y="415" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment</text>
  <text x="871" y="445" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <g filter="url(#m02-l03-order-fanout-soft)">
    <rect x="1048" y="380" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="1123" y="415" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shipping</text>
  <text x="1123" y="445" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <text x="619" y="580" text-anchor="middle" font-size="20" fill="#B91C1C">No entity service can complete the operation alone, and the call graph</text>
  <text x="619" y="610" text-anchor="middle" font-size="20" fill="#B91C1C">grows with every new feature.</text>

  <line x1="40" y1="645" x2="74" y2="645" stroke="#3B82F6" stroke-width="4"/>
  <text x="84" y="652" font-size="20" fill="#475569">Synchronous call: the caller stops and waits for the answer</text>
</svg>