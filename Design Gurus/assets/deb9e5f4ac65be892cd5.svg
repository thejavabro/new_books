<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A safe webhook receiver in five steps: read the exact raw bytes, reject a stale timestamp, compare signatures in constant time, deduplicate by event id and durably enqueue, then answer 204 quickly and process the work afterward.">
  <defs>
    <marker id="pk-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="pk-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="pk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pk-k1"><rect x="300" y="100" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="pk-k2"><rect x="300" y="274" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="pk-k3"><rect x="300" y="448" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="pk-k4"><rect x="300" y="622" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="pk-k5"><rect x="300" y="796" width="640" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="900" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">A safe receiver: verify, deduplicate, enqueue, answer fast</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">five steps, in order</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,231 V274" stroke="#64748B" marker-end="url(#pk-sl)"/>
    <path d="M620,405 V448" stroke="#64748B" marker-end="url(#pk-sl)"/>
    <path d="M620,579 V622" stroke="#64748B" marker-end="url(#pk-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M620,753 V796" stroke="#059669" marker-end="url(#pk-em)"/>
  </g>

  
  <g filter="url(#pk-soft)">
    <rect x="300" y="100" width="640" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="300" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#pk-k1)"/>
  </g>
  <circle cx="338" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="364" y="152" font-size="18.5" font-weight="600" fill="#111827">Read the exact raw bytes</text>
  <text x="916" y="152" text-anchor="end" font-size="15.5" font-weight="600" fill="#1D4ED8">Step 1</text>
  <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">Do not parse and reserialize first: whitespace and key order change the bytes</text>

  
  <g filter="url(#pk-soft)">
    <rect x="300" y="274" width="640" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="300" y="274" width="6" height="90" fill="#DB2777" clip-path="url(#pk-k2)"/>
  </g>
  <circle cx="338" cy="319" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,308.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="364" y="326" font-size="18.5" font-weight="600" fill="#111827">Reject a stale timestamp</text>
  <text x="916" y="326" text-anchor="end" font-size="15.5" font-weight="600" fill="#BE185D">Step 2</text>
  <text x="620" y="389" font-size="15.5" text-anchor="middle" fill="#6B7280">Outside the published replay window, such as five minutes</text>

  
  <g filter="url(#pk-soft)">
    <rect x="300" y="448" width="640" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="300" y="448" width="6" height="90" fill="#4F46E5" clip-path="url(#pk-k3)"/>
  </g>
  <circle cx="338" cy="493" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,482.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="364" y="500" font-size="18.5" font-weight="600" fill="#111827">Compare signatures in constant time</text>
  <text x="916" y="500" text-anchor="end" font-size="15.5" font-weight="600" fill="#4338CA">Step 3</text>
  <text x="620" y="563" font-size="15.5" text-anchor="middle" fill="#6B7280">Over timestamp, a dot, and the raw body, using the registration secret</text>

  
  <g filter="url(#pk-soft)">
    <rect x="300" y="622" width="640" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="300" y="622" width="6" height="90" fill="#D97706" clip-path="url(#pk-k4)"/>
  </g>
  <circle cx="338" cy="667" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,656.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="364" y="674" font-size="18.5" font-weight="600" fill="#111827">Deduplicate by event id, and enqueue</text>
  <text x="916" y="674" text-anchor="end" font-size="15.5" font-weight="600" fill="#B45309">Step 4</text>
  <text x="620" y="737" font-size="15.5" text-anchor="middle" fill="#6B7280">Store the id and enqueue the work in one durable step</text>

  
  <g filter="url(#pk-lift)">
    <rect x="300" y="796" width="640" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="300" y="796" width="9" height="90" fill="#059669" clip-path="url(#pk-k5)"/>
  </g>
  <circle cx="338" cy="841" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,830.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="364" y="848" font-size="18.5" font-weight="600" fill="#111827">Answer 204 immediately</text>
  <text x="916" y="848" text-anchor="end" font-size="15.5" font-weight="600" fill="#047857">Step 5</text>
  <text x="620" y="911" font-size="15.5" text-anchor="middle" fill="#6B7280">Then send the email, update the index, and call the other partner</text>

  
  <rect x="40" y="972" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1017" text-anchor="middle" font-size="16" fill="#475569">Holding the request open makes delivery depend on every downstream system.</text>
</svg>