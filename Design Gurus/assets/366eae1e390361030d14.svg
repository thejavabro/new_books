<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="606" viewBox="0 0 1240 606" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Streaming inference: an uploaded menu photo enters a queue, and workers score it within seconds">
  <defs>
    <marker id="c2bo3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c2bo3-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="c2bo3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2bo3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2bo3-k1"><rect x="78" y="116" width="275" height="90" rx="12"/></clipPath>
    <clipPath id="c2bo3-k2"><rect x="401" y="116" width="160" height="90" rx="12"/></clipPath>
    <clipPath id="c2bo3-k3"><rect x="679" y="116" width="223" height="90" rx="12"/></clipPath>
    <clipPath id="c2bo3-k4"><rect x="950" y="116" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="c2bo3-k5"><rect x="679" y="300" width="223" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="606" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="394" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Streaming: within seconds</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M353,161 H401" marker-end="url(#c2bo3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M561,161 H679" marker-end="url(#c2bo3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M902,161 H950" marker-end="url(#c2bo3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="7 5"><path d="M790.5,243 V300" marker-end="url(#c2bo3-mslate)"/></g>
  <g filter="url(#c2bo3-soft)">
    <rect x="78" y="116" width="275" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="78" y="116" width="6" height="90" fill="#059669" clip-path="url(#c2bo3-k1)"/>
  </g>
  <circle cx="116" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(105.56,150.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="142" y="168" font-size="18.5" font-weight="600" fill="#111827">Menu photo uploaded</text>
  <text x="215.5" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">the event starts the work</text>
  <g filter="url(#c2bo3-soft)">
    <rect x="401" y="116" width="160" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="401" y="116" width="6" height="90" fill="#D97706" clip-path="url(#c2bo3-k2)"/>
  </g>
  <circle cx="439" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(428.56,150.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="465" y="168" font-size="18.5" font-weight="600" fill="#111827">Queue</text>
  <text x="481" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">holds events, absorbs bursts</text>
  <g filter="url(#c2bo3-lift)">
    <rect x="679" y="116" width="223" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="679" y="116" width="9" height="90" fill="#2563EB" clip-path="url(#c2bo3-k3)"/>
  </g>
  <circle cx="717" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(706.56,150.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="743" y="168" font-size="18.5" font-weight="600" fill="#111827">Scoring workers</text>
  <text x="790.5" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">take events, run the model</text>
  <g filter="url(#c2bo3-soft)">
    <rect x="950" y="116" width="204" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="950" y="116" width="6" height="90" fill="#7C3AED" clip-path="url(#c2bo3-k4)"/>
  </g>
  <circle cx="988" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,150.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="1014" y="168" font-size="18.5" font-weight="600" fill="#111827">Result written</text>
  <text x="1052" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">approved, or sent to a human reviewer</text>
  <g filter="url(#c2bo3-soft)">
    <rect x="679" y="300" width="223" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="679" y="300" width="6" height="90" fill="#64748B" clip-path="url(#c2bo3-k5)"/>
  </g>
  <circle cx="717" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(706.56,334.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="743" y="352" font-size="18.5" font-weight="600" fill="#111827">Separate queue</text>
  <text x="790.5" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">events that fail again and again</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="620" y="151" fill="#1D4ED8">nobody waits</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="802.5" y="277" fill="#475569">failed again and again</text></g>
  <rect x="40" y="490" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="535" text-anchor="middle" font-size="16" fill="#475569">Streaming is online inference with a queue in front instead of a waiting caller.</text>
</svg>