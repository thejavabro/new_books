<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1360" viewBox="0 0 1240 1360" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Uber detailed design with two separate paths: driver location updates flow through a load balancer into the Driver Location Servers, which push positions to the Notification Service, refresh the QuadTree Servers every 15 seconds, and persist to SSD, while customer searches flow through a second load balancer to the Aggregator Servers, which query the QuadTree partitions, write ride records to the databases, and reach drivers through the Notification Service.">
