<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A B-tree updates a page in place with a random write; an LSM appends to memory and flushes whole sorted files, then merges them in the background">
  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>
  <defs>
    <marker id="ix14-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix14-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="ix14-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="76" width="580" height="470" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="56" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">B-tree: change the page where the key lives</text>

  <rect x="640" y="76" width="580" height="470" rx="14" fill="#FFFBEB" fill-opacity="0.35" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="56" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">LSM tree: append, then merge later</text>

  
  <path d="M310,168 C310,215 190,210 190,254" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix14-blue)"/>
  <path d="M310,168 C310,215 430,210 430,254" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix14-blue)"/>

  
  <g filter="url(#ix14-soft)">
    <rect x="230" y="104" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="310" y="143" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">write</text>

  <g filter="url(#ix14-soft)">
    <rect x="70" y="256" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
    <rect x="330" y="256" width="240" height="74" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="190" y="286" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Write-ahead log</text>
  <text x="190" y="316" font-size="20" fill="#64748B" text-anchor="middle">sequential</text>
  <text x="450" y="286" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The page on disk</text>
  <text x="450" y="316" font-size="20" fill="#1D4ED8" text-anchor="middle">random write</text>

  <text x="310" y="392" font-size="20" fill="#334155" text-anchor="middle">Changing 20 bytes rewrites a whole</text>
  <text x="310" y="422" font-size="20" fill="#334155" text-anchor="middle">16 KB page, in a random place.</text>
  <text x="310" y="490" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Cost paid now, on every write.</text>
  <text x="310" y="520" font-size="20" fill="#334155" text-anchor="middle">Reads stay one predictable tree walk.</text>

  
  <path d="M930,168 L930,250" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ix14-amber)"/>
  <path d="M930,330 C930,360 765,356 765,382" fill="none" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ix14-amber)"/>

  
  <g filter="url(#ix14-soft)">
    <rect x="850" y="104" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="930" y="143" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">write</text>

  <g filter="url(#ix14-soft)">
    <rect x="810" y="256" width="240" height="74" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="930" y="286" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Memtable</text>
  <text x="930" y="316" font-size="20" fill="#B45309" text-anchor="middle">memory, no disk seek</text>

  <g filter="url(#ix14-soft)">
    <rect x="690" y="384" width="150" height="74" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="855" y="384" width="150" height="74" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="1020" y="384" width="150" height="74" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="765" y="414" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SSTable</text>
  <text x="765" y="442" font-size="20" fill="#64748B" text-anchor="middle">newest</text>
  <text x="930" y="414" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SSTable</text>
  <text x="930" y="442" font-size="20" fill="#64748B" text-anchor="middle">older</text>
  <text x="1095" y="414" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SSTable</text>
  <text x="1095" y="442" font-size="20" fill="#64748B" text-anchor="middle">oldest</text>

  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="1058" y="362" font-size="20" fill="#B45309" text-anchor="middle">flush, then compact</text>
  </g>

  <text x="930" y="490" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">Cost deferred to compaction.</text>
  <text x="930" y="520" font-size="20" fill="#334155" text-anchor="middle">Reads may have to touch several files.</text>

  
  <rect x="20" y="576" width="1200" height="60" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="613" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Same goal, different moment of payment: a B-tree pays on every write, an LSM pays in the background.</text>
</svg>