<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1078" viewBox="0 0 1240 1078" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven hard parts of the calendar API: never storing one row per future occurrence, an open-ended range being unbounded too, one occurrence needing an exception, this-and-all-later splitting the series, recurring events being the necessary UTC exception, ambiguous and missing local times, and conditional series writes.">
  <defs>
    <filter id="p2z-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2z-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2z-k1"><rect x="76" y="174" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p2z-k2"><rect x="644" y="174" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p2z-k3"><rect x="76" y="383" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p2z-k4"><rect x="644" y="383" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p2z-k5"><rect x="76" y="592" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p2z-k6"><rect x="644" y="592" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="p2z-k7"><rect x="360" y="801" width="520" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1078" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Seven hard parts, seven decisions</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">all seven come from the calendar API</text>

  
  <rect x="40" y="126" width="1160" height="185" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Storing and reading a recurring series</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two hard parts</text>

  <g filter="url(#p2z-soft)">
    <rect x="76" y="174" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p2z-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">No row per future occurrence</text>
  <text x="336" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">One stored recurrence rule; occurrences are computed on read</text>

  <g filter="url(#p2z-soft)">
    <rect x="644" y="174" width="520" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="644" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p2z-k2)"/>
  </g>
  <circle cx="682" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="708" y="226" font-size="18.5" font-weight="600" fill="#111827">An open range is unbounded too</text>
  <text x="904" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">The range is required, and capped at 366 days</text>

  
  <rect x="40" y="335" width="1160" height="185" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="365" font-size="16.5" font-weight="600" fill="#5B21B6">Changing a series that already exists</text>
  <text x="1176" y="365" text-anchor="end" font-size="15.5" fill="#6B7280">two hard parts</text>

  <g filter="url(#p2z-soft)">
    <rect x="76" y="383" width="520" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="383" width="6" height="90" fill="#7C3AED" clip-path="url(#p2z-k3)"/>
  </g>
  <circle cx="114" cy="428" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,417.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="435" font-size="18.5" font-weight="600" fill="#111827">One occurrence changes</text>
  <text x="336" y="498" text-anchor="middle" font-size="15.5" fill="#6B7280">An EventException per changed date, leaving the series intact</text>

  <g filter="url(#p2z-soft)">
    <rect x="644" y="383" width="520" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="644" y="383" width="6" height="90" fill="#7C3AED" clip-path="url(#p2z-k4)"/>
  </g>
  <circle cx="682" cy="428" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,417.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="708" y="435" font-size="18.5" font-weight="600" fill="#111827">"This and all later"</text>
  <text x="904" y="498" text-anchor="middle" font-size="15.5" fill="#6B7280">The series splits into two events, not a third edit operation</text>

  
  <rect x="40" y="544" width="1160" height="185" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="574" font-size="16.5" font-weight="600" fill="#B45309">Local time and time zones</text>
  <text x="1176" y="574" text-anchor="end" font-size="15.5" fill="#6B7280">two hard parts</text>

  <g filter="url(#p2z-lift)">
    <rect x="76" y="592" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="76" y="592" width="9" height="90" fill="#D97706" clip-path="url(#p2z-k5)"/>
  </g>
  <circle cx="114" cy="637" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,626.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="644" font-size="18.5" font-weight="600" fill="#111827">Recurrence breaks pure UTC</text>
  <text x="336" y="707" text-anchor="middle" font-size="15.5" fill="#6B7280">A local start plus an IANA time-zone name is the needed exception</text>

  <g filter="url(#p2z-soft)">
    <rect x="644" y="592" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="644" y="592" width="6" height="90" fill="#D97706" clip-path="url(#p2z-k6)"/>
  </g>
  <circle cx="682" cy="637" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,626.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="708" y="644" font-size="18.5" font-weight="600" fill="#111827">Ambiguous and missing local times</text>
  <text x="904" y="707" text-anchor="middle" font-size="15.5" fill="#6B7280">Publish the behavior for a repeated hour and for a skipped hour</text>

  
  <rect x="40" y="753" width="1160" height="185" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="783" font-size="16.5" font-weight="600" fill="#BE185D">Concurrent edits to one series</text>
  <text x="1176" y="783" text-anchor="end" font-size="15.5" fill="#6B7280">one hard part</text>

  <g filter="url(#p2z-soft)">
    <rect x="360" y="801" width="520" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="360" y="801" width="6" height="90" fill="#DB2777" clip-path="url(#p2z-k7)"/>
  </g>
  <circle cx="398" cy="846" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,835.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="424" y="853" font-size="18.5" font-weight="600" fill="#111827">Conditional series writes</text>
  <text x="620" y="916" text-anchor="middle" font-size="15.5" fill="#6B7280">An ETag and If-Match, so one editor cannot erase another's rule change</text>

  
  <rect x="40" y="962" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1007" text-anchor="middle" font-size="16" fill="#475569">Every card is a hard part. The gray line beneath it is the decision that hard part forces.</text>
</svg>