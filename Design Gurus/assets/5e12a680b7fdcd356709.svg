<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What it costs to change a setting that is compiled into the service. The change needs an edit, a rebuild, a full retest and a redeploy of every instance, so a one character change carries the risk and delay of a full release, environments drift apart, and credentials ship inside the artifact">
  <defs>
    <marker id="cf1-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <clipPath id="cf1-k1"><rect x="72" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf1-k2"><rect x="358" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf1-k3"><rect x="644" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf1-k4"><rect x="930" y="112" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="cf1-k5"><rect x="72" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf1-k6"><rect x="455" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf1-k7"><rect x="838" y="398" width="330" height="90" rx="12"/></clipPath>
    <filter id="cf1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cf1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#B45309">Changing one setting that is baked into the build</text>
  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#BE185D">What that costs you</text>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M308,157 H350" marker-end="url(#cf1-mamber)"/>
    <path d="M594,157 H636" marker-end="url(#cf1-mamber)"/>
    <path d="M880,157 H922" marker-end="url(#cf1-mamber)"/>
  </g>
  <g filter="url(#cf1-soft)">
    <rect x="72" y="112" width="236" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#D97706" clip-path="url(#cf1-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Edit The Code</text>
  <text x="190" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">one character changes in a</text>
  <text x="190" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">constant inside the service</text>
  <g filter="url(#cf1-soft)">
    <rect x="358" y="112" width="236" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="358" y="112" width="6" height="90" fill="#D97706" clip-path="url(#cf1-k2)"/>
  </g>
  <circle cx="396" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(385.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="422" y="164" font-size="18.5" font-weight="600" fill="#111827">Rebuild It</text>
  <text x="476" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">a whole new artifact for a</text>
  <text x="476" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">value that is not code</text>
  <g filter="url(#cf1-soft)">
    <rect x="644" y="112" width="236" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="644" y="112" width="6" height="90" fill="#D97706" clip-path="url(#cf1-k3)"/>
  </g>
  <circle cx="682" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="708" y="164" font-size="18.5" font-weight="600" fill="#111827">Retest It</text>
  <text x="762" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the full test cycle runs</text>
  <text x="762" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">before anything can ship</text>
  <g filter="url(#cf1-soft)">
    <rect x="930" y="112" width="236" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="930" y="112" width="6" height="90" fill="#D97706" clip-path="url(#cf1-k4)"/>
  </g>
  <circle cx="968" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="994" y="164" font-size="18.5" font-weight="600" fill="#111827">Redeploy</text>
  <text x="1048" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">every instance restarts to</text>
  <text x="1048" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">pick up one new value</text>
  <g filter="url(#cf1-lift)">
    <rect x="72" y="398" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="72" y="398" width="9" height="90" fill="#DB2777" clip-path="url(#cf1-k5)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">A Release Per Value</text>
  <text x="237" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">a config change and a code</text>
  <text x="237" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">change now cost the same</text>
  <g filter="url(#cf1-soft)">
    <rect x="455" y="398" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="455" y="398" width="6" height="90" fill="#DB2777" clip-path="url(#cf1-k6)"/>
  </g>
  <circle cx="493" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,432.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="519" y="450" font-size="18.5" font-weight="600" fill="#111827">Environments Drift</text>
  <text x="620" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">each one is edited by hand</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">so test stops matching production</text>
  <g filter="url(#cf1-soft)">
    <rect x="838" y="398" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="838" y="398" width="6" height="90" fill="#DB2777" clip-path="url(#cf1-k7)"/>
  </g>
  <circle cx="876" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,432.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="902" y="450" font-size="18.5" font-weight="600" fill="#111827">Secrets In The Build</text>
  <text x="1003" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">credentials ship inside the</text>
  <text x="1003" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">artifact and sit in the repository</text>
  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="636" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The change path</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">editing a constant means a rebuild, a retest and a redeploy of every running instance</text>
  <rect x="64" y="680" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The real cost</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">a one character change carries the risk and the delay of a full release</text>
</svg>