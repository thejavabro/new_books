<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An LSM write lands in the write-ahead log and the in-memory memtable, and the memtable is later flushed to disk as one immutable sorted file">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="ix12-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix12-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="ix12-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="790" y1="46" x2="822" y2="46" stroke="#3B82F6" stroke-width="3"/>
  <text x="834" y="53" font-size="20" fill="#475569">on the write path</text>
  <line x1="1024" y1="46" x2="1056" y2="46" stroke="#D97706" stroke-width="3"/>
  <text x="1068" y="53" font-size="20" fill="#475569">background</text>

  
  <rect x="280" y="112" width="420" height="152" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="300" y="146" font-size="20" font-weight="600" fill="#1E3A8A">In memory</text>

  
  <path d="M200,196 L314,196" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix12-blue)"/>
  <path d="M120,228 C120,320 200,318 200,384" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix12-blue)"/>
  <path d="M490,264 C490,330 660,324 660,384" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ix12-amber)"/>

  
  <g filter="url(#ix12-soft)">
    <rect x="40" y="164" width="160" height="64" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="120" y="203" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">write</text>

  
  <g filter="url(#ix12-soft)">
    <rect x="320" y="170" width="340" height="84" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="490" y="204" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Memtable</text>
  <text x="490" y="234" font-size="20" fill="#64748B" text-anchor="middle">sorted, and it accepts every write</text>

  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="257" y="180" font-size="20" fill="#1D4ED8" text-anchor="middle">1</text>
    <text x="262" y="300" font-size="20" fill="#1D4ED8" text-anchor="middle">2. durability first</text>
    <text x="626" y="306" font-size="20" fill="#B45309" text-anchor="middle">3. flush when full</text>
  </g>

  
  <g filter="url(#ix12-soft)">
    <rect x="80" y="386" width="240" height="84" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="200" y="420" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Write-ahead log</text>
  <text x="200" y="450" font-size="20" fill="#64748B" text-anchor="middle">append only</text>
  <text x="200" y="506" font-size="20" fill="#64748B" text-anchor="middle">Replayed after a crash.</text>

  
  <g filter="url(#ix12-soft)">
    <rect x="560" y="386" width="200" height="84" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="790" y="386" width="200" height="84" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="1020" y="386" width="200" height="84" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="660" y="420" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SSTable 3</text>
  <text x="660" y="450" font-size="20" fill="#64748B" text-anchor="middle">newest</text>
  <text x="890" y="420" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SSTable 2</text>
  <text x="890" y="450" font-size="20" fill="#64748B" text-anchor="middle">older</text>
  <text x="1120" y="420" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SSTable 1</text>
  <text x="1120" y="450" font-size="20" fill="#64748B" text-anchor="middle">oldest</text>
  <text x="890" y="506" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Immutable. Written once, never edited.</text>

  <text x="620" y="556" font-size="20" fill="#334155" text-anchor="middle">An update writes a new value into a newer file. A delete writes a tombstone.</text>

  <text x="620" y="598" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Every disk write is sequential, which is why an LSM tree absorbs writes a B-tree cannot.</text>
</svg>