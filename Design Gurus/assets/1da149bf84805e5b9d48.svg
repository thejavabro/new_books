<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Tracing the blast radius of a compromised notifications pod: the attacker calls refund on Payments, mTLS shows the certificate identity is notifications and not checkout, the authorization policy says no, and the call is refused. Separately, an unreachable auth service also refuses, because security fails closed.">
  <defs>
    <marker id="m06-l05-blast-radius-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m06-l05-blast-radius-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m06-l05-blast-radius-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l05-blast-radius-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m06-l05-blast-radius-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="930" fill="#FFFFFF"/>

  <rect x="60" y="60" width="1120" height="460" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="100" font-size="20" font-weight="600" fill="#334155">Tracing the blast radius: one compromised pod</text>
  <text x="1160" y="100" text-anchor="end" font-size="20" fill="#64748B">location confers no trust</text>

  <g filter="url(#m06-l05-blast-radius-soft)">
    <rect x="80" y="150" width="300" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="230" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications pod</text>
  <text x="230" y="217" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">is compromised</text>
  <text x="230" y="249" text-anchor="middle" font-size="20" fill="#64748B">the attacker runs code inside</text>
  <g filter="url(#m06-l05-blast-radius-soft)">
    <rect x="470" y="150" width="300" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">It calls refund</text>
  <text x="620" y="217" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">on Payments</text>
  <text x="620" y="249" text-anchor="middle" font-size="20" fill="#64748B">an east-west call from inside</text>
  <g filter="url(#m06-l05-blast-radius-soft)">
    <rect x="860" y="150" width="300" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1010" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">mTLS: which identity</text>
  <text x="1010" y="217" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">is on the certificate?</text>
  <text x="1010" y="249" text-anchor="middle" font-size="20" fill="#64748B">both sides presented one</text>

  <g filter="url(#m06-l05-blast-radius-soft)">
    <rect x="80" y="340" width="300" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="230" y="375" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Identity is notifications,</text>
  <text x="230" y="407" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">not checkout</text>
  <text x="230" y="439" text-anchor="middle" font-size="20" fill="#64748B">cryptographic, not an IP</text>
  <g filter="url(#m06-l05-blast-radius-soft)">
    <rect x="470" y="340" width="300" height="120" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="375" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Policy: may notifications</text>
  <text x="620" y="407" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">call refund?</text>
  <text x="620" y="439" text-anchor="middle" font-size="20" fill="#64748B">explicit: who may call what</text>
  <g filter="url(#m06-l05-blast-radius-soft)">
    <rect x="860" y="340" width="300" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1010" y="375" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Refused: the blast</text>
  <text x="1010" y="407" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">radius is contained</text>
  <text x="1010" y="439" text-anchor="middle" font-size="20" fill="#64748B">the compromise stops here</text>

  <rect x="60" y="560" width="1120" height="210" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="600" font-size="20" font-weight="600" fill="#334155">The second refusal path: security fails closed</text>
  <text x="1160" y="600" text-anchor="end" font-size="20" fill="#64748B">an unreachable check refuses</text>
  <g filter="url(#m06-l05-blast-radius-soft)">
    <rect x="290" y="630" width="340" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="460" y="671" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The auth service is unreachable</text>
  <text x="460" y="703" text-anchor="middle" font-size="20" fill="#64748B">the check itself is down</text>
  <g filter="url(#m06-l05-blast-radius-soft)">
    <rect x="680" y="630" width="340" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="850" y="671" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The request is refused</text>
  <text x="850" y="703" text-anchor="middle" font-size="20" fill="#64748B">never waved through</text>

  <g fill="none" stroke-width="2.5">
    <path d="M380,210 L462,210" stroke="#DC2626" stroke-width="2" marker-end="url(#m06-l05-blast-radius-rd)"/>
    <path d="M770,210 L852,210" stroke="#DC2626" stroke-width="2" marker-end="url(#m06-l05-blast-radius-rd)"/>
    <path d="M1010,270 L1010,305 L230,305 L230,332" stroke="#7C3AED" stroke-width="2" marker-end="url(#m06-l05-blast-radius-vi)"/>
    <path d="M380,400 L462,400" stroke="#475569" stroke-width="2" marker-end="url(#m06-l05-blast-radius-sl)"/>
    <path d="M770,400 L852,400" stroke="#059669" marker-end="url(#m06-l05-blast-radius-em)"/>
    <path d="M630,680 L672,680" stroke="#DC2626" stroke-width="2" marker-end="url(#m06-l05-blast-radius-rd)"/>
  </g>

  <text x="620" y="290" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the handshake answers it</text>
  <text x="811" y="500" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No: the policy denies it</text>
  <text x="651" y="755" text-anchor="middle" font-size="20" fill="#B91C1C">it cannot verify the caller</text>

  <line x1="60" y1="810" x2="96" y2="810" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="817" font-size="20" fill="#475569">The attack, or the failure, path</text>
  <line x1="60" y1="850" x2="96" y2="850" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="857" font-size="20" fill="#475569">Identity taken from the mTLS certificate</text>
  <line x1="60" y1="890" x2="96" y2="890" stroke="#059669" stroke-width="4"/>
  <text x="108" y="897" font-size="20" fill="#475569">Refused: the blast radius is contained</text>
</svg>