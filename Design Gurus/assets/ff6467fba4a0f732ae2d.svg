<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="918" viewBox="0 0 1240 918" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An event-driven system has three parts. A producer commits its own work and publishes one event. An event channel on the event bus holds that event. Every consumer subscribed to the channel gets its own copy and acts on it independently, so a new consumer can be added without changing the producer">
  <defs>
    <marker id="ed1-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="ed1-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>

    <filter id="ed1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ed1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ed1-k1"><rect x="65" y="350" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed1-k2"><rect x="470" y="350" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed1-k3"><rect x="900" y="170" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed1-k4"><rect x="900" y="350" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ed1-k5"><rect x="900" y="530" width="260" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="918" fill="#FFFFFF"/>

  
  <rect x="40" y="290" width="310" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="320" font-size="16.5" font-weight="600" fill="#1D4ED8">Producer</text>

  <rect x="430" y="290" width="340" height="250" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="454" y="320" font-size="16.5" font-weight="600" fill="#5B21B6">Event bus</text>

  <rect x="860" y="110" width="340" height="610" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="884" y="140" font-size="16.5" font-weight="600" fill="#047857">Consumers, each one independent</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2.5">
    <path d="M325,395 L466,395" marker-end="url(#ed1-bl)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M730,395 L790,395 Q802,395 802,383 L802,227 Q802,215 814,215 L896,215" marker-end="url(#ed1-vi)"/>
    <path d="M730,395 L896,395" marker-end="url(#ed1-vi)"/>
    <path d="M730,395 L790,395 Q802,395 802,407 L802,563 Q802,575 814,575 L896,575" marker-end="url(#ed1-vi)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="395" y="388" fill="#1D4ED8">publishes</text>
    <text x="815" y="318" fill="#5B21B6">one each</text>
  </g>

  
  <g filter="url(#ed1-soft)">
    <rect x="65" y="350" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="65" y="350" width="6" height="90" fill="#2563EB" clip-path="url(#ed1-k1)"/>
  </g>
  <circle cx="103" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,384.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="129" y="402" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <text x="195" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">commits the order</text>
  <text x="195" y="488" font-size="15.5" text-anchor="middle" fill="#94A3B8">then publishes one event</text>

  
  <g filter="url(#ed1-lift)">
    <rect x="470" y="350" width="260" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="470" y="350" width="9" height="90" fill="#7C3AED" clip-path="url(#ed1-k2)"/>
  </g>
  <circle cx="508" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,384.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="534" y="402" font-size="18.5" font-weight="600" fill="#111827">Event Channel</text>
  <text x="600" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">topic: order.created</text>
  <text x="600" y="488" font-size="15.5" text-anchor="middle" fill="#94A3B8">holds the event until read</text>

  
  <g filter="url(#ed1-soft)">
    <rect x="900" y="170" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="900" y="170" width="6" height="90" fill="#059669" clip-path="url(#ed1-k3)"/>
  </g>
  <circle cx="938" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,204.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="964" y="222" font-size="18.5" font-weight="600" fill="#111827">Email Service</text>
  <text x="1030" y="285" font-size="15.5" text-anchor="middle" fill="#6B7280">sends the confirmation</text>
  <text x="1030" y="308" font-size="15.5" text-anchor="middle" fill="#94A3B8">does not know who else reads</text>

  <g filter="url(#ed1-soft)">
    <rect x="900" y="350" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="900" y="350" width="6" height="90" fill="#059669" clip-path="url(#ed1-k4)"/>
  </g>
  <circle cx="938" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,384.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="964" y="402" font-size="18.5" font-weight="600" fill="#111827">Analytics Service</text>
  <text x="1030" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">updates the dashboard</text>
  <text x="1030" y="488" font-size="15.5" text-anchor="middle" fill="#94A3B8">can lag without harm</text>

  <g filter="url(#ed1-soft)">
    <rect x="900" y="530" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="900" y="530" width="6" height="90" fill="#059669" clip-path="url(#ed1-k5)"/>
  </g>
  <circle cx="938" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,564.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="964" y="582" font-size="18.5" font-weight="600" fill="#111827">Warehouse Service</text>
  <text x="1030" y="645" font-size="15.5" text-anchor="middle" fill="#6B7280">starts picking the items</text>
  <text x="1030" y="668" font-size="15.5" text-anchor="middle" fill="#94A3B8">added last, no producer change</text>

  
  <rect x="40" y="750" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="774" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="796" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Event channel</text>
  <text x="288" y="796" font-size="15.5" fill="#475569">one named stream of events, so consumers subscribe to a topic rather than to a service</text>

  <rect x="64" y="818" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="840" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Loose coupling</text>
  <text x="288" y="840" font-size="15.5" fill="#475569">the producer holds no list of listeners, which is what lets you add the third consumer</text>
</svg>