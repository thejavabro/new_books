<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="788" viewBox="0 0 1240 788" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="boundary-title boundary-desc">
<title id="boundary-title">What a wrong boundary costs</title>
<desc id="boundary-desc">Boundaries are discovered by building, and the first decomposition of a new product is a guess. What matters is the asymmetry in what being wrong costs on each side of a network call.</desc>
<defs>
<marker id="boundary-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="boundary-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="boundary-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="boundary-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="788" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What a wrong boundary costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Boundaries are discovered by building, and the first decomposition of a new product is a guess.</text>
<rect x="40" y="710" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="710" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="400" y="118" width="440" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="152" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">a boundary in the wrong place</text>
<path d="M540 180L326 208" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M540 180L326 208" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundary-marker-green)"/>
<path d="M700 180L914 208" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M700 180L914 208" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#boundary-marker-red)"/>
<rect x="40" y="214" width="560" height="270" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 214H46A6 6 0 0 0 40 220V478A6 6 0 0 0 46 484H54Z" fill="#39D5AA"/><text x="70" y="250" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Inside a monolith</text>
<text x="570" y="250" font-size="21" font-weight="700" fill="#169B77" text-anchor="end">a refactor</text>
<rect x="72" y="270" width="500" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">move the code</text>
<rect x="72" y="320" width="500" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="348" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">change the calls</text>
<rect x="72" y="370" width="500" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">run the tests</text>
<rect x="72" y="420" width="500" height="44" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="448" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deploy once</text>
<rect x="640" y="214" width="560" height="270" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 214H646A6 6 0 0 0 640 220V478A6 6 0 0 0 646 484H654Z" fill="#F28B9D"/><text x="670" y="250" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Between services</text>
<text x="1170" y="250" font-size="21" font-weight="700" fill="#A83147" text-anchor="end">a migration</text>
<rect x="672" y="270" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a new interface</text>
<rect x="672" y="320" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="348" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a deprecation period</text>
<rect x="672" y="370" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">coordinated deploys</text>
<rect x="672" y="420" width="500" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="448" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">data moved between stores</text>
<rect x="40" y="508" width="1160" height="90" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="508" width="5" height="90" rx="2.5" fill="#F3CF6A"/><text x="64" y="544.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Not a larger version of the refactor. A different kind of work,</text><text x="64" y="573.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">paid at the point when you are least certain you were right.</text>
<rect x="40" y="622" width="1160" height="62" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="622" width="5" height="62" rx="2.5" fill="#5EC9EC"/><text x="64" y="659" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Start where a mistake costs a refactor. Move once you have stopped making mistakes.</text>
<text x="66" y="744" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This is why splitting too early is expensive in a way that leaving things coupled is not.</text>
</svg>