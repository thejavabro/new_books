<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1012" viewBox="0 0 1240 1012" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three places to put behavior that does not look like ordinary create, read, update, or delete, tried in order: a state change first, a result sub-resource second, and a verb endpoint only as a last resort with its cost named.">
  <defs>
    <marker id="xl02threeop-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="xl02threeop-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl02threeop-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl02threeop-k1"><rect x="100" y="136" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl02threeop-k2"><rect x="556" y="157" width="584" height="48" rx="10"/></clipPath>
    <clipPath id="xl02threeop-k3"><rect x="100" y="404" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl02threeop-k4"><rect x="556" y="425" width="584" height="48" rx="10"/></clipPath>
    <clipPath id="xl02threeop-k5"><rect x="100" y="672" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="xl02threeop-k6"><rect x="556" y="693" width="584" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1012" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="832" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Where behavior that is not ordinary CRUD goes</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">try them in this order, and stop at the first option that fits</text>

  
  <rect x="64" y="88" width="1112" height="224" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="118" font-size="16.5" font-weight="600" fill="#047857">Option 1, try this first</text>

  
  <rect x="64" y="356" width="1112" height="224" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="386" font-size="16.5" font-weight="600" fill="#1D4ED8">Option 2, try this next</text>

  
  <rect x="64" y="624" width="1112" height="224" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="88" y="654" font-size="16.5" font-weight="600" fill="#B45309">Option 3, the last resort</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,320 V350" marker-end="url(#xl02threeop-sl)"/>
    <path d="M620,588 V618" marker-end="url(#xl02threeop-sl)"/>
  </g>

  
  <g filter="url(#xl02threeop-lift)">
    <rect x="100" y="136" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="100" y="136" width="9" height="90" fill="#059669" clip-path="url(#xl02threeop-k1)"/>
  </g>
  <circle cx="138" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="164" y="188" font-size="18.5" font-weight="600" fill="#111827">Change the state</text>

  <g filter="url(#xl02threeop-soft)">
    <rect x="556" y="157" width="584" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="556" y="157" width="6" height="48" fill="#059669" clip-path="url(#xl02threeop-k2)"/>
  </g>
  <circle cx="590" cy="181" r="4.5" fill="#059669"/>
  <text x="614" y="188" font-size="18.5" font-weight="600" fill="#111827">PATCH /orders/ord_7M2K</text>
  <text x="890" y="188" font-size="18.5" font-weight="600" fill="#111827">{ "status": "cancelled" }</text>

  <circle cx="108" cy="251" r="3.5" fill="#059669"/>
  <text x="122" y="256" font-size="15.5" fill="#6B7280">When the behavior changes an existing resource and creates nothing independently useful.</text>
  <circle cx="108" cy="281" r="3.5" fill="#059669"/>
  <text x="122" y="286" font-size="15.5" fill="#6B7280">Cost: the patch must publish exactly which transitions it accepts.</text>

  
  <g filter="url(#xl02threeop-soft)">
    <rect x="100" y="404" width="420" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="404" width="6" height="90" fill="#2563EB" clip-path="url(#xl02threeop-k3)"/>
  </g>
  <circle cx="138" cy="449" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,438.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="164" y="456" font-size="18.5" font-weight="600" fill="#111827">Create a result sub-resource</text>

  <g filter="url(#xl02threeop-soft)">
    <rect x="556" y="425" width="584" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="556" y="425" width="6" height="48" fill="#2563EB" clip-path="url(#xl02threeop-k4)"/>
  </g>
  <circle cx="590" cy="449" r="4.5" fill="#2563EB"/>
  <text x="614" y="456" font-size="18.5" font-weight="600" fill="#111827">POST /orders/ord_7M2K/refunds</text>

  <circle cx="108" cy="519" r="3.5" fill="#2563EB"/>
  <text x="122" y="524" font-size="15.5" fill="#6B7280">When the action creates something with its own identity, lifecycle, or permissions.</text>
  <circle cx="108" cy="549" r="3.5" fill="#2563EB"/>
  <text x="122" y="554" font-size="15.5" fill="#6B7280">Cost: another resource, permission model, list, and retention rule.</text>

  
  <g filter="url(#xl02threeop-soft)">
    <rect x="100" y="672" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="100" y="672" width="6" height="90" fill="#D97706" clip-path="url(#xl02threeop-k5)"/>
  </g>
  <circle cx="138" cy="717" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,706.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="164" y="724" font-size="18.5" font-weight="600" fill="#111827">Use a verb endpoint</text>

  <g filter="url(#xl02threeop-soft)">
    <rect x="556" y="693" width="584" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="556" y="693" width="6" height="48" fill="#D97706" clip-path="url(#xl02threeop-k6)"/>
  </g>
  <circle cx="590" cy="717" r="4.5" fill="#D97706"/>
  <text x="614" y="724" font-size="18.5" font-weight="600" fill="#111827">POST /reports/rpt_91C:recalculate</text>

  <circle cx="108" cy="787" r="3.5" fill="#D97706"/>
  <text x="122" y="792" font-size="15.5" fill="#6B7280">Only when no stable result resource exists and no field change would be accurate.</text>
  <circle cx="108" cy="817" r="3.5" fill="#D97706"/>
  <text x="122" y="822" font-size="15.5" fill="#6B7280">Cost: retry, permission, and status rules need explicit documentation.</text>

  
  <rect x="40" y="896" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="941" text-anchor="middle" font-size="16" fill="#475569">Do not invent a fake noun such as /order-cancel-actions only to avoid writing the word cancel.</text>
</svg>