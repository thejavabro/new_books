<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four concentric rings: Frameworks and Drivers outside, then Interface Adapters, Use Cases, and Entities at the center. Arrows show that each outer ring depends on the inner ring; a dashed arrow from Entities to an outer ring is crossed out, because there is no dependency on an outer ring">
  <defs>
    <filter id="m11b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m11b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m11b-k1"><rect x="40" y="222" width="270" height="96" rx="12"/></clipPath>
    <clipPath id="m11b-k2"><rect x="40" y="417" width="270" height="96" rx="12"/></clipPath>
    <clipPath id="m11b-k3"><rect x="40" y="612" width="270" height="96" rx="12"/></clipPath>
    <clipPath id="m11b-k4"><rect x="990" y="542" width="210" height="96" rx="12"/></clipPath>
    <marker id="m11b-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m11b-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m11b-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="m11b-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The dependency rule: all dependencies point inward</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each ring depends only on the rings inside it, and Entities depends on no outer ring.</text>



  <g fill="none" stroke-width="2">
    <path d="M0,0" stroke="#2563EB"/>
    <path d="M0,0" stroke="#059669"/>
    <path d="M0,0" stroke="#D97706"/>
    <path d="M0,0" stroke="#DB2777"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m11b-soft)">
    <rect x="40" y="222" width="270" height="96" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="222" width="6" height="96" fill="#2563EB" clip-path="url(#m11b-k1)"/>
  </g>
  <text x="60" y="264.25" font-size="21.5" font-weight="600" fill="#111827">Outer ring depends</text>
  <text x="60" y="289.75" font-size="21.5" font-weight="600" fill="#111827">on inner ring</text>
  <g filter="url(#m11b-soft)">
    <rect x="40" y="417" width="270" height="96" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="417" width="6" height="96" fill="#059669" clip-path="url(#m11b-k2)"/>
  </g>
  <text x="60" y="459.25" font-size="21.5" font-weight="600" fill="#111827">Depends on</text>
  <text x="60" y="484.75" font-size="21.5" font-weight="600" fill="#111827">inner ring</text>
  <g filter="url(#m11b-soft)">
    <rect x="40" y="612" width="270" height="96" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="612" width="6" height="96" fill="#D97706" clip-path="url(#m11b-k3)"/>
  </g>
  <text x="60" y="654.25" font-size="21.5" font-weight="600" fill="#111827">Depends on</text>
  <text x="60" y="679.75" font-size="21.5" font-weight="600" fill="#111827">inner ring</text>
  <g filter="url(#m11b-soft)">
    <rect x="990" y="542" width="210" height="96" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="990" y="542" width="6" height="96" fill="#DB2777" clip-path="url(#m11b-k4)"/>
  </g>
  <text x="1010" y="584.25" font-size="21.5" font-weight="600" fill="#111827">No dependency</text>
  <text x="1010" y="609.75" font-size="21.5" font-weight="600" fill="#111827">on outer ring</text>

  <circle cx="660" cy="470" r="320" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="660" cy="470" r="240" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <circle cx="660" cy="470" r="160" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <circle cx="660" cy="470" r="80" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="660" y="190" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">Frameworks and Drivers</text>
  <text x="660" y="214" text-anchor="middle" font-size="17" fill="#475569">(Web, Database, External Services)</text>
  <text x="660" y="270" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">Interface Adapters</text>
  <text x="660" y="294" text-anchor="middle" font-size="17" fill="#475569">(Controllers, Presenters, Gateways)</text>
  <text x="660" y="350" text-anchor="middle" font-size="19.5" font-weight="600" fill="#B45309">Use Cases</text>
  <text x="660" y="374" text-anchor="middle" font-size="17" fill="#475569">(Application Business Rules)</text>
  <text x="660" y="456" text-anchor="middle" font-size="19.5" font-weight="600" fill="#4338CA">Entities</text>
  <text x="660" y="480" text-anchor="middle" font-size="17" fill="#475569">(Enterprise</text>
  <text x="660" y="500" text-anchor="middle" font-size="17" fill="#475569">Business Rules)</text>
  <path d="M310,270 L451.6,350.9" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m11b-m-blue)"/>
  <path d="M310,465 L500.0,467.7" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#m11b-m-emerald)"/>
  <path d="M310,660 L589.7,508.2" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#m11b-m-amber)"/>
  <path d="M734.2,500 H1014" fill="none" stroke="#DB2777" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#m11b-m-pink)"/>
  <g stroke="#DB2777" stroke-width="7" stroke-linecap="round">
    <path d="M1023,483 L1057,517"/>
    <path d="M1057,483 L1023,517"/>
  </g>


</svg>