<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="reshard-title reshard-desc">
<title id="reshard-title">Resharding is a live migration</title>
<desc id="reshard-desc">Stand up the new topology, dual-write to both placements, backfill history with an idempotent replay, verify with counts and checksums and sampled reads, cut reads over gradually, and only then stop dual-writing and remove the old placement.</desc>
<defs>
<marker id="reshard-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="reshard-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="reshard-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="reshard-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="702" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Resharding is a live migration</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Your key was right until it was not.</text>
<rect x="40" y="624" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="624" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="352" height="166" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V278A6 6 0 0 0 46 284H54Z" fill="#5EC9EC"/>
<circle cx="216" cy="158" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="216" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="216" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Stand up</text>
<text x="216" y="240" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the new topology,</text><text x="216" y="265" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">no traffic on it</text>
<path d="M398 201H438" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M398 201H438" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reshard-marker-slate)"/>
<rect x="444" y="118" width="352" height="166" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M458 118H450A6 6 0 0 0 444 124V278A6 6 0 0 0 450 284H458Z" fill="#39D5AA"/>
<circle cx="620" cy="158" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="620" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Dual-write</text>
<text x="620" y="240" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">every change to both</text><text x="620" y="265" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">old and new</text>
<path d="M802 201H842" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M802 201H842" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reshard-marker-slate)"/>
<rect x="848" y="118" width="352" height="166" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M862 118H854A6 6 0 0 0 848 124V278A6 6 0 0 0 854 284H862Z" fill="#39D5AA"/>
<circle cx="1024" cy="158" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1024" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1024" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Backfill</text>
<text x="1024" y="240" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">replay history,</text><text x="1024" y="265" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">safe to run twice</text>
<rect x="40" y="328" width="352" height="166" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 328H46A6 6 0 0 0 40 334V488A6 6 0 0 0 46 494H54Z" fill="#F3CF6A"/>
<circle cx="216" cy="368" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="216" y="376" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="216" y="418" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Verify</text>
<text x="216" y="450" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">counts, checksums,</text><text x="216" y="475" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">sampled reads</text>
<path d="M398 411H438" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M398 411H438" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reshard-marker-slate)"/>
<rect x="444" y="328" width="352" height="166" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M458 328H450A6 6 0 0 0 444 334V488A6 6 0 0 0 450 494H458Z" fill="#AC8BE8"/>
<circle cx="620" cy="368" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="376" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="620" y="418" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Cut reads</text>
<text x="620" y="450" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a fraction at a time,</text><text x="620" y="475" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">old path ready</text>
<path d="M802 411H842" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M802 411H842" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reshard-marker-slate)"/>
<rect x="848" y="328" width="352" height="166" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M862 328H854A6 6 0 0 0 848 334V488A6 6 0 0 0 854 494H862Z" fill="#F28B9D"/>
<circle cx="1024" cy="368" r="21" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1024" y="376" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="1024" y="418" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Remove</text>
<text x="1024" y="450" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">stop dual-writing,</text><text x="1024" y="475" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">drop the old copy</text>
<path d="M1024 284V306H216V322" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1024 284V306H216V322" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#reshard-marker-slate)"/>
<rect x="40" y="518" width="1160" height="80" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="518" width="5" height="80" rx="2.5" fill="#F3CF6A"/><text x="64" y="551" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Step 4 is the one that gets skipped, and step 6 is the one postponed for a year.</text><text x="64" y="577" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Neither is optional if you want to be able to roll back.</text>
<text x="66" y="658" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Choose a scheme that makes this possible before you need it: virtual nodes or slots, not hash(key) mod N.</text>
</svg>