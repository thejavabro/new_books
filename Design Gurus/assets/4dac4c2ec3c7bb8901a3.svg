<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Dead letter queue: a message that keeps failing is retried a limited number of times, then moved to the dead letter queue for later review">
  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
  <defs>
    <marker id="dm6-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="dm6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dm6-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="dm6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="dm6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="264" y1="208" x2="356" y2="208" stroke="#D97706" stroke-width="2" marker-end="url(#dm6-amber)"/>
  <text x="310" y="184" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>

  <line x1="604" y1="208" x2="696" y2="208" stroke="#D97706" stroke-width="2" marker-end="url(#dm6-amber)"/>
  <text x="650" y="184" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">deliver</text>

  <line x1="944" y1="208" x2="1026" y2="208" stroke="#059669" stroke-width="2" marker-end="url(#dm6-emerald)"/>
  <text x="985" y="184" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">success</text>

  <path d="M820,170 C820,60 480,60 480,170" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dm6-amber)"/>
  <text x="650" y="64" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">failure: retry a limited number of times</text>

  <path d="M480,246 C480,330 590,330 590,420" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#dm6-red)"/>
  <text x="330" y="330" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">moved after the retry limit</text>

  <line x1="744" y1="460" x2="916" y2="460" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#dm6-slate)"/>
  <text x="830" y="436" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reviewed later</text>

  
  <g filter="url(#dm6-soft)">
    <rect x="40" y="170" width="220" height="76" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="360" y="170" width="240" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="700" y="170" width="240" height="76" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="1030" y="170" width="180" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="440" y="420" width="300" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="920" y="420" width="280" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="202" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="150" y="230" font-size="20" fill="#64748B" text-anchor="middle">publishes orders</text>
  <text x="480" y="202" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Main queue</text>
  <text x="480" y="230" font-size="20" fill="#64748B" text-anchor="middle">orders waiting</text>
  <text x="820" y="202" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer</text>
  <text x="820" y="230" font-size="20" fill="#64748B" text-anchor="middle">tries to process</text>
  <text x="1120" y="202" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Processed</text>
  <text x="1120" y="230" font-size="20" fill="#64748B" text-anchor="middle">acknowledged</text>
  <text x="590" y="452" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Dead letter queue</text>
  <text x="590" y="480" font-size="20" fill="#64748B" text-anchor="middle">holds poison messages</text>
  <text x="1060" y="452" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Error handler</text>
  <text x="1060" y="480" font-size="20" fill="#64748B" text-anchor="middle">inspect, fix, or replay</text>

  
  <line x1="70" y1="550" x2="98" y2="550" stroke="#D97706" stroke-width="3"/>
  <text x="108" y="556" font-size="20" fill="#475569">message flow</text>
  <line x1="282" y1="550" x2="310" y2="550" stroke="#DC2626" stroke-width="3"/>
  <text x="320" y="556" font-size="20" fill="#475569">failure routing</text>
  <line x1="525" y1="550" x2="553" y2="550" stroke="#059669" stroke-width="3"/>
  <text x="563" y="556" font-size="20" fill="#475569">successful processing</text>
</svg>