<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Long polling repeats waiting HTTP requests. WebSocket lets both sides send on one connection. SSE streams text events from server to browser.">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="rt8-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rt8-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rt8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="21" y="40" width="386" height="640" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="427" y="40" width="386" height="640" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="833" y="40" width="386" height="640" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="214" y="78" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Long Polling</text>
  <text x="214" y="118" font-size="20" fill="#64748B" text-anchor="middle">a new request</text>
  <text x="214" y="144" font-size="20" fill="#64748B" text-anchor="middle">after each response</text>
  <text x="620" y="78" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">WebSocket</text>
  <text x="620" y="118" font-size="20" fill="#64748B" text-anchor="middle">two way over</text>
  <text x="620" y="144" font-size="20" fill="#64748B" text-anchor="middle">one connection</text>
  <text x="1026" y="78" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server Sent Events</text>
  <text x="1026" y="118" font-size="20" fill="#64748B" text-anchor="middle">one way stream</text>
  <text x="1026" y="144" font-size="20" fill="#64748B" text-anchor="middle">over one connection</text>

  
  <line x1="120" y1="274" x2="120" y2="462" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt8-blue)"/>
  <line x1="214" y1="462" x2="214" y2="274" stroke="#059669" stroke-width="2" marker-end="url(#rt8-emerald)"/>
  <line x1="308" y1="274" x2="308" y2="462" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#rt8-blue)"/>
  <text x="120" y="304" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. request</text>
  <text x="214" y="350" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. response</text>
  <text x="214" y="376" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">when data is ready</text>
  <text x="308" y="422" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. request</text>
  <text x="308" y="448" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">again</text>

  
  <rect x="460" y="234" width="320" height="268" rx="12" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="268" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one open channel</text>
  <line x1="490" y1="298" x2="490" y2="478" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rt8-blue)"/>
  <line x1="750" y1="478" x2="750" y2="298" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#rt8-blue)"/>
  <text x="620" y="380" font-size="20" fill="#1E40AF" text-anchor="middle">messages flow</text>
  <text x="620" y="406" font-size="20" fill="#1E40AF" text-anchor="middle">both ways, anytime</text>

  
  <line x1="930" y1="274" x2="930" y2="462" stroke="#3B82F6" stroke-width="2" marker-end="url(#rt8-blue)"/>
  <text x="930" y="304" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. subscribe once</text>
  <text x="1100" y="298" font-size="20" fill="#065F46" text-anchor="middle">2. events,</text>
  <text x="1100" y="324" font-size="20" fill="#065F46" text-anchor="middle">one after another</text>
  <line x1="1040" y1="462" x2="1040" y2="342" stroke="#059669" stroke-width="2.5" marker-end="url(#rt8-emerald)"/>
  <line x1="1100" y1="462" x2="1100" y2="342" stroke="#059669" stroke-width="2.5" marker-end="url(#rt8-emerald)"/>
  <line x1="1160" y1="462" x2="1160" y2="342" stroke="#059669" stroke-width="2.5" marker-end="url(#rt8-emerald)"/>

  
  <g filter="url(#rt8-soft)">
    <rect x="74" y="174" width="280" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="74" y="502" width="280" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="550" y="174" width="140" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="550" y="502" width="140" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="886" y="174" width="280" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="886" y="502" width="280" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="214" y="211" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="214" y="539" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="620" y="211" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="620" y="539" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <text x="1026" y="211" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="1026" y="539" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>

  
  <text x="214" y="622" font-size="20" fill="#64748B" text-anchor="middle">asks again after</text>
  <text x="214" y="648" font-size="20" fill="#64748B" text-anchor="middle">every message</text>
  <text x="620" y="622" font-size="20" fill="#64748B" text-anchor="middle">both sides send anytime,</text>
  <text x="620" y="648" font-size="20" fill="#64748B" text-anchor="middle">no new request per message</text>
  <text x="1026" y="622" font-size="20" fill="#64748B" text-anchor="middle">server streams, browser</text>
  <text x="1026" y="648" font-size="20" fill="#64748B" text-anchor="middle">reconnects itself</text>
</svg>