<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client request enters the API gateway, which assigns trace ID 9f2e and passes it to the order service, which calls the payment and inventory services with the same trace ID, and publishes an OrderCreated event through the message broker that the notification service consumes with the same trace ID. The trace view shows nested spans: API gateway 210 ms encloses order service 190 ms, which encloses inventory service 70 ms followed by payment service 80 ms; the notification service span of 50 ms starts after the response">
