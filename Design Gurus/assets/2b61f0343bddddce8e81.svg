<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="880" viewBox="0 0 1300 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A production RAG chatbot at scale: the knowledge plane keeps a tenant-sharded index fresh by change data capture, and each request passes through the assistant, the semantic cache, permission-filtered retrieval, and the gateway to the serving fleet, metering as it goes">
  <rect x="0" y="0" width="1300" height="880" fill="#FFFFFF"/>
  <defs>
    <marker id="s" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="v" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7C3AED"/>
    </marker>
    <marker id="g" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  
  <rect x="440" y="34" width="820" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="464" y="70" font-size="22" font-weight="700" fill="#5B21B6">The knowledge plane, running whether or not anyone asks</text>

  <rect x="464" y="88" width="330" height="74" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="629" y="120" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Content and catalog</text>
  <text x="629" y="148" font-size="20" fill="#334155" text-anchor="middle">edited by humans, all day</text>

  <line x1="798" y1="125" x2="842" y2="125" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#v)"/>
  <text x="820" y="106" font-size="20" fill="#5B21B6" text-anchor="middle">CDC</text>

  <rect x="846" y="88" width="390" height="74" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1041" y="120" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Tenant-sharded vector index</text>
  <text x="1041" y="148" font-size="20" fill="#334155" text-anchor="middle">permission tags, rebuildable from source</text>

  <path d="M846,184 L846,214 L807,214 L807,254" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#v)"/>

  
  <rect x="40" y="256" width="275" height="180" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="177" y="294" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">1. Assistant API</text>
  <text x="62" y="326" font-size="20" fill="#334155">Answers stream back</text>
  <text x="62" y="354" font-size="20" fill="#334155">token by token. Sticky</text>
  <text x="62" y="382" font-size="20" fill="#334155">per conversation, but</text>
  <text x="62" y="410" font-size="20" fill="#334155">the history store is truth.</text>
  <line x1="317" y1="346" x2="353" y2="346" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="355" y="256" width="275" height="180" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="492" y="294" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">2. Semantic cache</text>
  <text x="377" y="326" font-size="20" fill="#334155">A near-identical question</text>
  <text x="377" y="354" font-size="20" fill="#334155">asked in other words is</text>
  <text x="377" y="382" font-size="20" fill="#334155">answered here, in about</text>
  <text x="377" y="410" font-size="20" fill="#334155">40 ms, for almost nothing.</text>
  <line x1="632" y1="346" x2="668" y2="346" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="650" y="246" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">miss</text>

  <rect x="670" y="256" width="275" height="180" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="807" y="294" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">3. Retrieve and rerank</text>
  <text x="692" y="326" font-size="20" fill="#334155">Only the chunks this</text>
  <text x="692" y="354" font-size="20" fill="#334155">tenant and this user may</text>
  <text x="692" y="382" font-size="20" fill="#334155">read. The permission</text>
  <text x="692" y="410" font-size="20" fill="#334155">check happens here.</text>
  <line x1="947" y1="346" x2="983" y2="346" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  <rect x="985" y="256" width="275" height="180" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="1122" y="294" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">4. LLM gateway</text>
  <text x="1007" y="326" font-size="20" fill="#334155">One set of keys, token</text>
  <text x="1007" y="354" font-size="20" fill="#334155">caps per tenant, and the</text>
  <text x="1007" y="382" font-size="20" fill="#334155">fallback ladder when a</text>
  <text x="1007" y="410" font-size="20" fill="#334155">provider stops answering.</text>

  
  <line x1="177" y1="436" x2="177" y2="486" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="40" y="488" width="275" height="172" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="177" y="524" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Tools are sagas</text>
  <text x="62" y="556" font-size="20" fill="#334155">Cancelling an order is a</text>
  <text x="62" y="584" font-size="20" fill="#334155">real write: idempotency</text>
  <text x="62" y="612" font-size="20" fill="#334155">keys, compensation,</text>
  <text x="62" y="640" font-size="20" fill="#334155">an approval step.</text>

  
  <line x1="1122" y1="436" x2="1122" y2="486" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <rect x="560" y="488" width="700" height="122" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
  <text x="584" y="524" font-size="20" font-weight="700" fill="#0F172A">Serving: the self-hosted fleet first, providers on overflow</text>
  <text x="584" y="556" font-size="20" fill="#334155">Continuous batching and warm pools, because a cold GPU</text>
  <text x="584" y="584" font-size="20" fill="#334155">takes minutes to become useful and traffic does not wait.</text>

  <line x1="900" y1="610" x2="900" y2="654" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <text x="923" y="642" font-size="20" fill="#475569">every call is metered</text>

  <rect x="560" y="656" width="700" height="112" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="584" y="692" font-size="20" font-weight="700" fill="#5B21B6">A usage log per tenant, written once per call</text>
  <text x="584" y="724" font-size="20" fill="#334155">Invoices read it exactly once. Dashboards upsert from it, where</text>
  <text x="584" y="752" font-size="20" fill="#334155">a repeated row costs nothing. Bills are why the difference matters.</text>

  
  <text x="40" y="820" font-size="20" font-weight="700" fill="#0F172A">Every stage is a pattern from an earlier module, pointed at a new workload: the cache from Module 4, the</text>
  <text x="40" y="850" font-size="20" font-weight="700" fill="#0F172A">gateway and its budgets from Module 8, the fallback ladder from Module 5, the saga from Module 7.</text>
</svg>