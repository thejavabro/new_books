<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="924" viewBox="0 0 1240 924" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A graph labelled with discovery and low-link values, marking two articulation points and two bridges"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="924" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="620" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">A child that cannot reach above its parent proves the parent holds it on</text>
<line x1="268.284" y1="258.284" x2="411.716" y2="401.716" stroke="#94A3B8" stroke-width="3"/>
<line x1="475.777" y1="412.111" x2="604.223" y2="347.889" stroke="#94A3B8" stroke-width="3"/>
<line x1="601.194" y1="320.299" x2="278.806" y2="239.701" stroke="#94A3B8" stroke-width="3"/>
<line x1="680" y1="330" x2="840" y2="330" stroke="#DB2777" stroke-width="3"/>
<line x1="920" y1="330" x2="1040" y2="330" stroke="#DB2777" stroke-width="3"/>
<circle cx="240" cy="230" r="40" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="240" y="238" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">0</text>
<text x="240" y="172" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">disc 1</text>
<text x="240" y="308" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">low 1</text>
<circle cx="440" cy="430" r="40" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="440" y="438" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="440" y="372" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">disc 2</text>
<text x="440" y="508" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">low 1</text>
<circle cx="640" cy="330" r="40" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<text x="640" y="338" text-anchor="middle" font-size="22.5" font-weight="600" fill="#BE185D">2</text>
<text x="640" y="272" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">disc 3</text>
<text x="640" y="408" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">low 1</text>
<circle cx="880" cy="330" r="40" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<text x="880" y="338" text-anchor="middle" font-size="22.5" font-weight="600" fill="#BE185D">3</text>
<text x="880" y="272" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">disc 4</text>
<text x="880" y="408" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">low 4</text>
<circle cx="1080" cy="330" r="40" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
<text x="1080" y="338" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">4</text>
<text x="1080" y="272" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">disc 5</text>
<text x="1080" y="408" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#475569">low 5</text>
<text x="760" y="250" text-anchor="middle" font-size="19.5" font-weight="600" fill="#BE185D">bridge</text>
<text x="980" y="250" text-anchor="middle" font-size="19.5" font-weight="600" fill="#BE185D">bridge</text>
<text x="90" y="570" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">at node 2, the child 3 has low 4, which is not below disc 3, so 2 is a cut</text>
<text x="90" y="602" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">at node 1, the child 2 has low 1, which is below disc 2, so 1 is not</text>
<text x="90" y="640" text-anchor="start" font-size="19.5" font-weight="normal" fill="#475569">node 0 is the root, and it has one child in the search tree, so it is safe</text>
<rect x="40" y="708" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="730" width="255" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="191" y="756" text-anchor="middle" font-size="19.5" font-weight="600" fill="#BE185D">articulation point</text>
<text x="348" y="756" font-size="19.5" fill="#475569">removing it splits the graph into separate parts</text>
<rect x="64" y="778" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="804" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">ordinary node</text>
<text x="348" y="804" font-size="19.5" fill="#475569">its subtree has another route back up</text>
<rect x="64" y="826" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="852" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">disc and low</text>
<text x="348" y="852" font-size="19.5" fill="#475569">when it was first reached, and the earliest it can reach</text>
</svg>