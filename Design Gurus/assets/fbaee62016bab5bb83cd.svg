<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="712" viewBox="0 0 1240 712" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array cut in half, with the target sum for one group">
<defs>
<filter id="pn-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="712" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Split [1, 6, 11, 5] into two groups of 2 with the closest sums</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The whole array adds up to 23, so a perfect split would give each group 11.5</text>
<rect x="40" y="106" width="1160" height="460" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One group takes 2 numbers, some from the left half and the rest from the right</text>
<rect x="337" y="194" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="401" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="401" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="483" y="194" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="547" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="547" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="629" y="194" width="128" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="693" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">11</text>
<text x="693" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="775" y="194" width="128" height="60" rx="8" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="839" y="231.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="839" y="276" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<path d="M620,176 L620,272" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="474" y="168" text-anchor="middle" font-size="17.5" font-weight="600" fill="#1D4ED8">left half</text>
<text x="766" y="168" text-anchor="middle" font-size="17.5" font-weight="600" fill="#5B21B6">right half</text>
<text x="315" y="232" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<text x="523" y="338" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">from the left</text>
<text x="551" y="337" font-size="18" fill="#475569">not listed yet</text>
<text x="523" y="478" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">from the right</text>
<text x="551" y="477" font-size="18" fill="#475569">not listed yet</text>
<text x="620" y="408" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">The difference between the groups is 23 minus twice the sum of one of them</text>
<rect x="40" y="588" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="628" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">So the job is to get one group's sum as close to 11.5 as possible</text>
<text x="620" y="660" text-anchor="middle" font-size="18.5" fill="#475569">Both groups are decided at once, because whatever one does not take, the other does</text>
</svg>