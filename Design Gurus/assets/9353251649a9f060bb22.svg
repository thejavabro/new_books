<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="812" viewBox="0 0 1240 812" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Adding a key to a Bloom filter sets three bits, and checking a key whose bits include a zero proves the key was never added">
  <rect x="0" y="0" width="1240" height="812" fill="#FFFFFF"/>
  <defs>
    <marker id="ca5-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ca5-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A Bloom filter is a bit array plus k hash functions</text>

  
  <rect x="40" y="72" width="1160" height="320" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#92400E">Adding a key: hash it 3 times, set those 3 bits to 1</text>

  <rect x="520" y="128" width="200" height="56" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="164" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">user:7</text>

  <path d="M600 186 L368 250" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ca5-amber)"/>
  <path d="M620 186 L656 250" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ca5-amber)"/>
  <path d="M640 186 L872 250" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ca5-amber)"/>
  <text x="452" y="214" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">h1</text>
  <text x="672" y="222" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">h2</text>
  <text x="800" y="214" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">h3</text>

  <g font-size="20" text-anchor="middle">
    <rect x="188" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="224" y="298" fill="#64748B">0</text>
    <rect x="260" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="296" y="298" fill="#64748B">0</text>
    <rect x="332" y="258" width="72" height="64" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/><text x="368" y="298" fill="#92400E" font-weight="600">1</text>
    <rect x="404" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="440" y="298" fill="#64748B">0</text>
    <rect x="476" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="512" y="298" fill="#64748B">0</text>
    <rect x="548" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="584" y="298" fill="#64748B">0</text>
    <rect x="620" y="258" width="72" height="64" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/><text x="656" y="298" fill="#92400E" font-weight="600">1</text>
    <rect x="692" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="728" y="298" fill="#64748B">0</text>
    <rect x="764" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="800" y="298" fill="#64748B">0</text>
    <rect x="836" y="258" width="72" height="64" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/><text x="872" y="298" fill="#92400E" font-weight="600">1</text>
    <rect x="908" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="944" y="298" fill="#64748B">0</text>
    <rect x="980" y="258" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="1016" y="298" fill="#64748B">0</text>
  </g>
  <text x="620" y="356" font-size="20" fill="#475569" text-anchor="middle">The key itself is never stored. Only these bits are.</text>

  
  <rect x="40" y="420" width="1160" height="320" rx="14" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="454" font-size="20" font-weight="600" fill="#1E40AF">Checking a different key: one bit is 0, so the answer is certain</text>

  <rect x="520" y="476" width="200" height="56" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="620" y="512" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle" font-family="&#39;Cascadia Mono&#39;, Consolas, monospace">user:9</text>

  <path d="M600 534 L440 598" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca5-blue)"/>
  <path d="M620 534 L656 598" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca5-blue)"/>
  <path d="M640 534 L1016 598" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ca5-blue)"/>

  <g font-size="20" text-anchor="middle">
    <rect x="188" y="606" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="224" y="646" fill="#64748B">0</text>
    <rect x="260" y="606" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="296" y="646" fill="#64748B">0</text>
    <rect x="332" y="606" width="72" height="64" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="368" y="646" fill="#92400E">1</text>
    <rect x="404" y="606" width="72" height="64" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/><text x="440" y="646" fill="#B91C1C" font-weight="600">0</text>
    <rect x="476" y="606" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="512" y="646" fill="#64748B">0</text>
    <rect x="548" y="606" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="584" y="646" fill="#64748B">0</text>
    <rect x="620" y="606" width="72" height="64" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="656" y="646" fill="#92400E">1</text>
    <rect x="692" y="606" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="728" y="646" fill="#64748B">0</text>
    <rect x="764" y="606" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="800" y="646" fill="#64748B">0</text>
    <rect x="836" y="606" width="72" height="64" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/><text x="872" y="646" fill="#92400E">1</text>
    <rect x="908" y="606" width="72" height="64" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="944" y="646" fill="#64748B">0</text>
    <rect x="980" y="606" width="72" height="64" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="3"/><text x="1016" y="646" fill="#B91C1C" font-weight="600">0</text>
  </g>
  <text x="620" y="704" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">A zero anywhere means the key was definitely never added. No cache or database lookup needed.</text>

  
  <rect x="40" y="758" width="1160" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="785" font-size="20" fill="#334155" text-anchor="middle">If all 3 bits happened to be 1, the answer is only "probably present", so you still check the real store.</text>
</svg>