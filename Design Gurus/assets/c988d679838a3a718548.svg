<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="658" viewBox="0 0 1240 658" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="tradeoff-title tradeoff-desc">
<title id="tradeoff-title">What a complete trade-off contains</title>
<desc id="tradeoff-desc">The options stated fairly, the cost of each in measurable terms, and the choice with a condition attached. The condition is what converts an opinion into a decision and gives an interviewer something specific to disagree with.</desc>
<defs>
<marker id="tradeoff-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="tradeoff-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="tradeoff-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="tradeoff-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="658" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What a complete trade-off contains</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three parts, and most candidates give only the last one, without its condition.</text>
<rect x="40" y="580" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="580" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="210" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V322A6 6 0 0 0 46 328H54Z" fill="#5EC9EC"/>
<circle cx="226" cy="158" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="226" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="226" y="212" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The options</text>
<text x="226" y="280" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">stated fairly, including the one</text><text x="226" y="305" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">you will reject</text>
<rect x="434" y="118" width="372" height="210" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V322A6 6 0 0 0 440 328H448Z" fill="#39D5AA"/>
<circle cx="620" cy="158" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="620" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="620" y="212" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The cost of each</text>
<text x="620" y="280" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">in terms that could actually be</text><text x="620" y="305" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">measured</text>
<rect x="828" y="118" width="372" height="210" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V322A6 6 0 0 0 834 328H842Z" fill="#F3CF6A"/>
<circle cx="1014" cy="158" r="21" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1014" y="166" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1014" y="212" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The choice, with its</text><text x="1014" y="240" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">condition</text>
<text x="1014" y="280" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">"...unless the write rate were ten</text><text x="1014" y="305" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">times higher"</text>
<rect x="828" y="342" width="372" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="364" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">most give only the choice,</text><text x="1014" y="390" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">without the condition</text>
<rect x="40" y="422" width="560" height="132" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="422" width="5" height="132" rx="2.5" fill="#F28B9D"/><text x="64" y="468" font-size="26" font-weight="700" fill="#A83147" text-anchor="start">"It depends."</text><text x="64" y="494" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Correct, and worthless alone.</text><text x="64" y="520" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">An observation</text>
<rect x="640" y="422" width="560" height="132" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="422" width="5" height="132" rx="2.5" fill="#39D5AA"/><text x="664" y="455" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">"It depends on the read ratio,</text><text x="664" y="481" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">and here is each side of ten to one."</text><text x="664" y="507" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">The same insight, made usable.</text><text x="664" y="533" font-size="19" font-weight="700" fill="#169B77" text-anchor="start">A decision. Cost: one sentence.</text>
<text x="66" y="614" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The signal is not which option you pick. It is whether you knew you were picking.</text>
</svg>