<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same functional requirement at two different scales produces two completely different architectures. The non-functional requirements are what decide the design.">
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
  <defs>
    <marker id="fn-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="fn-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="fn-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#B45309"/></marker>
    <marker id="fn-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="fn-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Same feature. The non-functional requirements built two different systems.</text>
  <rect x="21" y="70" width="590" height="500" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="629" y="70" width="590" height="500" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="316" y="106" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">"A user can shorten a URL"</text>
  <text x="924" y="106" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">"A user can shorten a URL"</text>
  <rect x="66" y="124" width="500" height="62" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="316" y="152" font-size="20" fill="#1E40AF" text-anchor="middle">1,000 users, 10 requests/sec</text>
  <text x="316" y="176" font-size="20" fill="#1E40AF" text-anchor="middle">no stated latency target</text>
  <rect x="674" y="124" width="500" height="62" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="924" y="152" font-size="20" fill="#B45309" text-anchor="middle">100M users, 500k redirects/sec</text>
  <text x="924" y="176" font-size="20" fill="#B45309" text-anchor="middle">p99 under 50ms, 99.99% up, global</text>
  <g filter="url(#fn-soft)"><rect x="216" y="226" width="200" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/></g>
  <text x="316" y="261" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <line x1="316" y1="282" x2="316" y2="308" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="216" y="314" width="200" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/></g>
  <text x="316" y="349" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server</text>
  <line x1="316" y1="370" x2="316" y2="396" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="216" y="402" width="200" height="56" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/></g>
  <text x="316" y="437" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Database</text>
  <text x="316" y="512" font-size="20" fill="#64748B" text-anchor="middle">One server and one database.</text>
  <text x="316" y="538" font-size="20" fill="#64748B" text-anchor="middle">Anything more would be waste.</text>
  <rect x="844" y="214" width="160" height="48" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="924" y="245" font-size="20" font-weight="600" fill="#64748B" text-anchor="middle">Client</text>
  <line x1="924" y1="262" x2="924" y2="268" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="844" y="272" width="160" height="48" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/></g>
  <text x="924" y="303" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">CDN</text>
  <line x1="924" y1="320" x2="924" y2="326" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="824" y="330" width="200" height="48" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/></g>
  <text x="924" y="361" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">Load Balancer</text>
  <line x1="847" y1="378" x2="814" y2="396" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="766" y="400" width="96" height="48" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/></g>
  <text x="814" y="431" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">app</text>
  <line x1="924" y1="378" x2="924" y2="396" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="876" y="400" width="96" height="48" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/></g>
  <text x="924" y="431" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">app</text>
  <line x1="1001" y1="378" x2="1034" y2="396" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="986" y="400" width="96" height="48" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/></g>
  <text x="1034" y="431" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">app</text>
  <line x1="1082" y1="424" x2="1098" y2="424" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="1098" y="400" width="116" height="48" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/></g>
  <text x="1156" y="431" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">cache</text>
  <line x1="814" y1="448" x2="814" y2="454" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="766" y="458" width="96" height="48" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/></g>
  <text x="814" y="489" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">shard</text>
  <line x1="924" y1="448" x2="924" y2="454" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="876" y="458" width="96" height="48" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/></g>
  <text x="924" y="489" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">shard</text>
  <line x1="1034" y1="448" x2="1034" y2="454" stroke="#94A3B8" stroke-width="2" marker-end="url(#fn-s)"/>
  <g filter="url(#fn-soft)"><rect x="986" y="458" width="96" height="48" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/></g>
  <text x="1034" y="489" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">shard</text>
  <text x="924" y="538" font-size="20" fill="#64748B" text-anchor="middle">Same feature, ten times the components.</text>
  <rect x="21" y="594" width="1198" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="626" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Functional requirements say which boxes exist. Non-functional requirements decide how many, and where.</text>
</svg>