<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1282" viewBox="0 0 1240 1282" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated WhatsApp architecture: online delivery through stateful gateways and a Redis session cache, offline queueing with push notifications, group fan out, and media handling">
  <defs>
    <filter id="wa-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="wa-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="wa-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="wa-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="wa-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="wa-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1282" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">WhatsApp: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Stateful gateways, the session lookup that routes every message, and the offline queue</text>

  <rect x="24" y="96" width="1192" height="360" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Both online · 1.7 million messages a second at peak, under 200ms</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#wa-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">send</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#wa-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pipe</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#wa-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">persist</text>
  <path d="M776,232 L776,300" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#wa-emerald)"/>
  <text x="794" y="274" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">where is B?</text>
  <path d="M890,342 L975,342" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#wa-blue)"/>
  <text x="933" y="330" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <g filter="url(#wa-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="666" y="156" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M666,319 L666,365 A110,15 0 0 0 886,365 L886,319" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="319" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="979" y="304" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User A</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">WebSocket</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Gateway 1</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">stateful, holds it</text>
  <text x="776" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Message Service</text>
  <text x="776" y="216" font-size="20" fill="#64748B" text-anchor="middle">stateless brain</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cassandra</text>
  <text x="1089" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">by chat_id, then time</text>
  <text x="776" y="353" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis sessions</text>
  <text x="776" y="410" font-size="20" fill="#065F46" text-anchor="middle">user to gateway</text>
  <text x="1089" y="338" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User B</text>
  <text x="1089" y="364" font-size="20" fill="#64748B" text-anchor="middle">via Gateway 2</text>

  <rect x="24" y="486" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="518" font-size="20" font-weight="600" fill="#92400E">2. Recipient offline · the message is queued, never dropped</text>
  <path d="M264,584 L349,584" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#wa-amber)"/>
  <text x="307" y="572" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">queue</text>
  <path d="M577,584 L662,584" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#wa-amber)"/>
  <text x="620" y="572" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">notify</text>
  <path d="M890,584 L975,584" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#wa-amber)"/>
  <text x="933" y="572" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">wake</text>
  <g filter="url(#wa-soft)">
    <rect x="40" y="546" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,561 L353,607 A110,15 0 0 0 573,607 L573,561" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="463" cy="561" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="666" y="546" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="979" y="546" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Message Service</text>
  <text x="150" y="606" font-size="20" fill="#64748B" text-anchor="middle">Redis says null</text>
  <text x="463" y="595" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Unread queue</text>
  <text x="463" y="652" font-size="20" fill="#5B21B6" text-anchor="middle">per user, in Cassandra</text>
  <text x="776" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Push Service</text>
  <text x="776" y="606" font-size="20" fill="#64748B" text-anchor="middle">APNS and FCM</text>
  <text x="1089" y="580" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User B</text>
  <text x="1089" y="606" font-size="20" fill="#64748B" text-anchor="middle">wakes and syncs</text>

  <rect x="24" y="728" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="760" font-size="20" font-weight="600" fill="#92400E">3. Group fan out · one send becomes up to 256 deliveries</text>
  <path d="M264,826 L349,826" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#wa-amber)"/>
  <text x="307" y="814" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>
  <path d="M577,826 L662,826" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#wa-amber)"/>
  <text x="620" y="814" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consume</text>
  <path d="M890,826 L975,826" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#wa-amber)"/>
  <text x="933" y="814" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">deliver</text>
  <g filter="url(#wa-soft)">
    <rect x="40" y="788" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,803 L353,849 A110,15 0 0 0 573,849 L573,803" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="803" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="788" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="979" y="788" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Message Service</text>
  <text x="150" y="848" font-size="20" fill="#64748B" text-anchor="middle">one event</text>
  <text x="463" y="837" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="463" y="894" font-size="20" fill="#92400E" text-anchor="middle">sender is not blocked</text>
  <text x="776" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Fan out workers</text>
  <text x="776" y="848" font-size="20" fill="#64748B" text-anchor="middle">look up members</text>
  <text x="1089" y="822" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Gateways</text>
  <text x="1089" y="848" font-size="20" fill="#64748B" text-anchor="middle">one push each</text>

  <rect x="24" y="970" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="1002" font-size="20" font-weight="600" fill="#475569">4. Media · 1 PB a day, so binaries never touch the database</text>
  <path d="M364,1068 L456,1068" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#wa-blue)"/>
  <text x="410" y="1056" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">PUT</text>
  <path d="M784,1068 L876,1068" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#wa-blue)"/>
  <text x="830" y="1056" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">URL only</text>
  <g filter="url(#wa-soft)">
    <rect x="40" y="1030" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M460,1045 L460,1091 A160,15 0 0 0 780,1091 L780,1045" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="620" cy="1045" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="880" y="1030" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Sender</text>
  <text x="200" y="1090" font-size="20" fill="#64748B" text-anchor="middle">uploads first</text>
  <text x="620" y="1079" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3</text>
  <text x="620" y="1136" font-size="20" fill="#5B21B6" text-anchor="middle">the blob lives here</text>
  <text x="1040" y="1064" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">CDN</text>
  <text x="1040" y="1090" font-size="20" fill="#64748B" text-anchor="middle">receiver downloads</text>
  <line x1="44" y1="1242" x2="72" y2="1242" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1249" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1242" x2="344.576" y2="1242" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1249" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1233" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1249" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1233" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1249" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1233" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1249" font-size="20" fill="#475569">core service</text>
</svg>