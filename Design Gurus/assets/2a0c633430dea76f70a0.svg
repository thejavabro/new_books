<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Use it when all of these hold: traffic spikes are extreme and unpredictable, writes are heavy and contended, the working set fits in memory, brief inconsistency is acceptable, and caching and replicas are not enough. Avoid it when any of these hold: load is steady and predictable, the data set is far larger than memory, transactions must span many entities, or the team cannot yet run a distributed grid">
  <defs>
    <filter id="m14o-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m14o-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="590" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When to use space-based architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Choose it when every condition on the left holds; avoid it when any condition on the right applies.</text>

  <rect x="40" y="118" width="560" height="430" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="148" font-size="19.5" font-weight="600" fill="#047857">Use it when all of these hold</text>
  <rect x="640" y="118" width="560" height="430" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="148" font-size="19.5" font-weight="600" fill="#BE185D">Avoid it when any of these hold</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <rect x="64" y="198" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,213) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="230.5" font-size="18.5" fill="#1F2937">Traffic spikes are extreme and unpredictable</text>
  <rect x="64" y="264" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,279) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="296.5" font-size="18.5" fill="#1F2937">Writes are heavy and contended</text>
  <rect x="64" y="330" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,345) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="362.5" font-size="18.5" fill="#1F2937">The working set fits in memory</text>
  <rect x="64" y="396" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,411) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="428.5" font-size="18.5" fill="#1F2937">Brief inconsistency is acceptable</text>
  <rect x="64" y="462" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(78,477) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="494.5" font-size="18.5" fill="#1F2937">Caching and replicas are not enough</text>
  <rect x="664" y="198" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,213) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="230.5" font-size="18.5" fill="#1F2937">Load is steady and predictable</text>
  <rect x="664" y="264" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,279) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="296.5" font-size="18.5" fill="#1F2937">The data set is far larger than memory</text>
  <rect x="664" y="330" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,345) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="362.5" font-size="18.5" fill="#1F2937">Transactions must span many entities</text>
  <rect x="664" y="396" width="512" height="52" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(678,411) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="714" y="428.5" font-size="18.5" fill="#1F2937">The team cannot yet run a distributed grid</text>




</svg>