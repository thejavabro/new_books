  </g>
  <circle cx="688" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,230.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="714" y="248" font-size="18.5" font-weight="600" fill="#111827">Lowercase collection words</text>
  <text x="658" y="311" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <text x="712" y="311" font-size="15.5" fill="#6B7280">/saved-articles</text>
  <text x="658" y="334" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>
  <text x="712" y="334" font-size="15.5" fill="#94A3B8">/SavedArticles</text>

  
  <g filter="url(#xl04mechani-lift)">
    <rect x="84" y="372" width="506" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="84" y="372" width="9" height="90" fill="#2563EB" clip-path="url(#xl04mechani-k3)"/>
  </g>
  <circle cx="122" cy="417" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,406.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="148" y="424" font-size="18.5" font-weight="600" fill="#111827">Hyphens between words</text>
  <text x="92" y="487" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <text x="146" y="487" font-size="15.5" fill="#6B7280">/home-timeline</text>
  <text x="92" y="510" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>
  <text x="146" y="510" font-size="15.5" fill="#94A3B8">/home_timeline</text>

  
  <g filter="url(#xl04mechani-soft)">
    <rect x="650" y="372" width="506" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="650" y="372" width="6" height="90" fill="#2563EB" clip-path="url(#xl04mechani-k4)"/>
  </g>
  <circle cx="688" cy="417" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,406.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="714" y="424" font-size="18.5" font-weight="600" fill="#111827">No verbs in ordinary paths</text>
  <text x="658" y="487" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <text x="712" y="487" font-size="15.5" fill="#6B7280">POST /orders</text>
  <text x="658" y="510" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>
  <text x="712" y="510" font-size="15.5" fill="#94A3B8">/create-order</text>

  
  <rect x="40" y="560" width="1160" height="410" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="592" font-size="16.5" font-weight="600" fill="#5B21B6">How the path is put together</text>
  <text x="64" y="614" font-size="15.5" fill="#6B7280">what a path carries, and where each part sits</text>

  
  <g filter="url(#xl04mechani-soft)">
    <rect x="84" y="630" width="506" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="84" y="630" width="6" height="90" fill="#7C3AED" clip-path="url(#xl04mechani-k5)"/>
  </g>
  <circle cx="122" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,664.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="148" y="682" font-size="18.5" font-weight="600" fill="#111827">No file extensions</text>
  <text x="92" y="745" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <text x="146" y="745" font-size="15.5" fill="#6B7280">/orders/ord_7M2K</text>
  <text x="92" y="768" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>
  <text x="146" y="768" font-size="15.5" fill="#94A3B8">/orders/ord_7M2K.json</text>

  
  <g filter="url(#xl04mechani-soft)">
    <rect x="650" y="630" width="506" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="650" y="630" width="6" height="90" fill="#7C3AED" clip-path="url(#xl04mechani-k6)"/>
  </g>
  <circle cx="688" cy="675" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,664.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="714" y="682" font-size="18.5" font-weight="600" fill="#111827">Opaque ids, never names</text>
  <text x="658" y="745" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <text x="712" y="745" font-size="15.5" fill="#6B7280">/orders/ord_7M2K</text>
  <text x="658" y="768" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>
  <text x="712" y="768" font-size="15.5" fill="#94A3B8">/orders/zara-first-order</text>

  
  <g filter="url(#xl04mechani-soft)">
    <rect x="84" y="806" width="506" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="84" y="806" width="6" height="90" fill="#7C3AED" clip-path="url(#xl04mechani-k7)"/>
  </g>
  <circle cx="122" cy="851" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,840.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="148" y="858" font-size="18.5" font-weight="600" fill="#111827">No trailing slash</text>
  <text x="92" y="921" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <text x="146" y="921" font-size="15.5" fill="#6B7280">/orders</text>
  <text x="92" y="944" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>
  <text x="146" y="944" font-size="15.5" fill="#94A3B8">/orders/</text>

  
  <g filter="url(#xl04mechani-soft)">
    <rect x="650" y="806" width="506" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="650" y="806" width="6" height="90" fill="#7C3AED" clip-path="url(#xl04mechani-k8)"/>
  </g>
  <circle cx="688" cy="851" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,840.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="714" y="858" font-size="18.5" font-weight="600" fill="#111827">One version prefix, at the front</text>
  <text x="658" y="921" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <text x="712" y="921" font-size="15.5" fill="#6B7280">/v1/orders</text>
  <text x="658" y="944" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>
  <text x="712" y="944" font-size="15.5" fill="#94A3B8">/orders/v1</text>

  
  <rect x="40" y="994" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1036" text-anchor="middle" font-size="16" fill="#475569">Consistency helps clients learn the API's naming rules.</text>
  <text x="620" y="1066" text-anchor="middle" font-size="16" fill="#475569">JSON fields use snake_case and URL words use hyphens. Two conventions, no exceptions.</text>
</svg>