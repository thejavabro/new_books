<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1138" viewBox="0 0 1240 1138" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Eight mechanical URL rules, each with the form this course publishes and the form it avoids: plural collections, lowercase, hyphens, no verbs, no file extensions, opaque ids, no trailing slash, and one version prefix at the front.">
  <defs>
    <filter id="xl04mechani-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl04mechani-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl04mechani-k1"><rect x="84" y="196" width="506" height="90" rx="12"/></clipPath>
    <clipPath id="xl04mechani-k2"><rect x="650" y="196" width="506" height="90" rx="12"/></clipPath>
    <clipPath id="xl04mechani-k3"><rect x="84" y="372" width="506" height="90" rx="12"/></clipPath>
    <clipPath id="xl04mechani-k4"><rect x="650" y="372" width="506" height="90" rx="12"/></clipPath>
    <clipPath id="xl04mechani-k5"><rect x="84" y="630" width="506" height="90" rx="12"/></clipPath>
    <clipPath id="xl04mechani-k6"><rect x="650" y="630" width="506" height="90" rx="12"/></clipPath>
    <clipPath id="xl04mechani-k7"><rect x="84" y="806" width="506" height="90" rx="12"/></clipPath>
    <clipPath id="xl04mechani-k8"><rect x="650" y="806" width="506" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1138" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Eight naming conventions used in this course</text>
  <text x="440" y="77" font-size="15.5" fill="#6B7280">the form to publish and the form to avoid</text>
  <rect x="900" y="55" width="124" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="962" y="77" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <rect x="1044" y="55" width="124" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1106" y="77" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>

  
  <rect x="40" y="126" width="1160" height="410" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="158" font-size="16.5" font-weight="600" fill="#1D4ED8">How the words in a path are written</text>
  <text x="64" y="180" font-size="15.5" fill="#6B7280">number, case, separators, and word choice</text>

  
  <g filter="url(#xl04mechani-soft)">
    <rect x="84" y="196" width="506" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="196" width="6" height="90" fill="#2563EB" clip-path="url(#xl04mechani-k1)"/>
  </g>
  <circle cx="122" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,230.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="148" y="248" font-size="18.5" font-weight="600" fill="#111827">Plural nouns for collections</text>
  <text x="92" y="311" font-size="15.5" font-weight="600" fill="#047857">Use</text>
  <text x="146" y="311" font-size="15.5" fill="#6B7280">/orders<tspan dx="18">/saved-articles</tspan></text>
  <text x="92" y="334" font-size="15.5" font-weight="600" fill="#BE185D">Avoid</text>
  <text x="146" y="334" font-size="15.5" fill="#94A3B8">/order<tspan dx="18">/savedArticle</tspan></text>

  
  <g filter="url(#xl04mechani-soft)">
    <rect x="650" y="196" width="506" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
