<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-label="Where this design saturates first. The cache breaks when the hot working set outgrows memory, and the fix is to shard it by key. A single shard breaks when one viral link concentrates reads, and the cache absorbs that. The key pool breaks if writes outrun the generator, so alert on pool depth. The key generation service is a single point of failure, answered by a standby and by the block each server already holds.">
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.09"/></filter>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.20"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DB2777"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>
  <rect width="1240" height="650" fill="#FFFFFF"/>
  <text x="96" y="56" font-size="18" font-weight="700" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">What saturates</text>
  <text x="420" y="56" font-size="18" font-weight="700" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">When</text>
  <text x="700" y="56" font-size="18" font-weight="700" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">What you do about it</text>
  <path d="M40 72 H 1200" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="40" y="96" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M40 110 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#D97706"/>
  <circle cx="76" cy="142" r="19" fill="#FFFBEB"/>
  <g transform="translate(64.5 130.5) scale(0.9583)" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#B45309"><path d="M13.5 2.5L5.5 13.5h5l-1 8 8-11h-5z" fill="currentColor" stroke="none"/></g>
  <text x="104" y="148" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The cache</text>
  <text x="420" y="136" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the hot working set</text>
  <text x="420" y="161" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">outgrows one machine</text>
  <text x="700" y="136" font-size="18" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">shard the cache by key, and accept a lower</text>
  <text x="700" y="161" font-size="18" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">hit rate while it warms</text>
  <rect x="40" y="204" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M40 218 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#7C3AED"/>
  <circle cx="76" cy="250" r="19" fill="#F5F3FF"/>
  <g transform="translate(64.5 238.5) scale(0.9583)" fill="none" stroke="#6D28D9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6D28D9"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="104" y="256" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One database shard</text>
  <text x="420" y="244" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a single viral link makes</text>
  <text x="420" y="269" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">one key hot</text>
  <text x="700" y="244" font-size="18" font-weight="600" fill="#6D28D9" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the cache absorbs it, because the hot key is</text>
  <text x="700" y="269" font-size="18" font-weight="600" fill="#6D28D9" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the one thing certain to be cached</text>
  <rect x="40" y="312" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M40 326 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#059669"/>
  <circle cx="76" cy="358" r="19" fill="#ECFDF5"/>
  <g transform="translate(64.5 346.5) scale(0.9583)" fill="none" stroke="#047857" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#047857"><rect x="3" y="5" width="18" height="4.4" rx="1.4"/><rect x="3" y="10.8" width="18" height="4.4" rx="1.4"/><rect x="3" y="16.6" width="18" height="4.4" rx="1.4"/></g>
  <text x="104" y="364" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The key pool</text>
  <text x="420" y="352" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">writes outrun the</text>
  <text x="420" y="377" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">generator</text>
  <text x="700" y="352" font-size="18" font-weight="600" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">alert on pool depth, not on pool empty, and</text>
  <text x="700" y="377" font-size="18" font-weight="600" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">keep days of buffer</text>
  <rect x="40" y="420" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M40 434 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#DC2626"/>
  <circle cx="76" cy="466" r="19" fill="#FEF2F2"/>
  <g transform="translate(64.5 454.5) scale(0.9583)" fill="none" stroke="#B91C1C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#B91C1C"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2M5.3 5.3l2.3 2.3M16.4 16.4l2.3 2.3M18.7 5.3l-2.3 2.3M7.6 16.4l-2.3 2.3"/></g>
  <text x="104" y="472" font-size="20" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The key service</text>
  <text x="420" y="460" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the process dies while</text>
  <text x="420" y="485" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">holding buffered keys</text>
  <text x="700" y="460" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a standby takes over, and each server still</text>
  <text x="700" y="485" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">has its own block to spend</text>
  <rect x="40" y="548" width="1160" height="62" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="620" y="586" font-size="20" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">None of these is a redesign. Naming the limit and the response is the whole of step 7.</text>
</svg>