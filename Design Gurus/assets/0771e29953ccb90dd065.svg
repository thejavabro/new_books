<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The name blog.example.com. read from right to left: the dot is the root, com is the top-level domain, example is the second-level domain, and blog is a subdomain.">
  <defs>
    <filter id="ds2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ds2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ds2-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds2-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds2-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds2-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="ds2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Reading a domain name</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">blog.example.com.  Read it from right to left, from the most general part.</text>



  <g fill="none" stroke-width="2">
    <path d="M949,185 H896" stroke="#64748B" marker-end="url(#ds2-m-slate)"/>
    <path d="M646,185 H593" stroke="#64748B" marker-end="url(#ds2-m-slate)"/>
    <path d="M343,185 H290" stroke="#64748B" marker-end="url(#ds2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ds2-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#D97706" clip-path="url(#ds2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">blog</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">subdomain</text>
  <g filter="url(#ds2-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ds2-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">example</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">second-level domain</text>
  <g filter="url(#ds2-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#ds2-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">com</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">top-level domain (TLD)</text>
  <g filter="url(#ds2-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ds2-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">. (the dot)</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the root</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">gTLD</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">a generic TLD, like .com, .org, or .net</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">ccTLD</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">a country or territory TLD, like .uk or .us</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">FQDN</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">the full name down to the root dot: blog.example.com.</text>
</svg>