<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six-step data migration sequence: separate the tables in the schema, remove cross-capability joins, move the tables out, keep both stores in sync with dual writes or change data capture, cut reads over, then retire the old tables">
  <defs>
    <marker id="m02-l04-data-migration-steps-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m02-l04-data-migration-steps-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m02-l04-data-migration-steps-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m02-l04-data-migration-steps-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m02-l04-data-migration-steps-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <g fill="none" stroke-width="2.5">
    <path d="M390,115 L456,115" stroke="#475569" marker-end="url(#m02-l04-data-migration-steps-sl)"/>
    <path d="M800,115 L866,115" stroke="#475569" marker-end="url(#m02-l04-data-migration-steps-sl)"/>
    <path d="M1040,170 L1040,205 Q1040,220 1025,220 L50,220 Q35,220 35,235 L35,285 Q35,300 50,300 L216,300" stroke="#D97706" stroke-width="3" marker-end="url(#m02-l04-data-migration-steps-am)"/>
    <path d="M390,355 L456,355" stroke="#3B82F6" marker-end="url(#m02-l04-data-migration-steps-bl)"/>
    <path d="M800,355 L866,355" stroke="#059669" marker-end="url(#m02-l04-data-migration-steps-em)"/>
  </g>
  <text x="620" y="262" font-size="20" text-anchor="middle" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the transition period: two stores must hold the same data</text>

  <g filter="url(#m02-l04-data-migration-steps-soft)">
    <rect x="50" y="60" width="340" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="220" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Separate the capability's</text>
  <text x="220" y="130" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">tables inside the schema</text>
  <text x="220" y="158" text-anchor="middle" font-size="20" fill="#64748B">still inside the monolith</text>

  <g filter="url(#m02-l04-data-migration-steps-soft)">
    <rect x="460" y="60" width="340" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="630" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Remove cross-capability</text>
  <text x="630" y="130" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">joins and foreign keys</text>
  <text x="630" y="158" text-anchor="middle" font-size="20" fill="#64748B">the tables stand on their own</text>

  <g filter="url(#m02-l04-data-migration-steps-soft)">
    <rect x="870" y="60" width="340" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1040" y="100" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3. Move the tables to the</text>
  <text x="1040" y="130" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service's own database</text>
  <text x="1040" y="158" text-anchor="middle" font-size="20" fill="#64748B">data moves with the capability</text>

  <g filter="url(#m02-l04-data-migration-steps-soft)">
    <rect x="50" y="300" width="340" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="220" y="340" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">4. Keep both stores in sync</text>
  <text x="220" y="370" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">with dual writes or CDC</text>
  <text x="220" y="398" text-anchor="middle" font-size="20" fill="#64748B">both stores hold the same data</text>

  <g filter="url(#m02-l04-data-migration-steps-soft)">
    <rect x="460" y="300" width="340" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="630" y="340" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">5. Cut reads over</text>
  <text x="630" y="370" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">to the new store</text>
  <text x="630" y="398" text-anchor="middle" font-size="20" fill="#64748B">verify with shadow reads first</text>

  <g filter="url(#m02-l04-data-migration-steps-soft)">
    <rect x="870" y="300" width="340" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1040" y="355" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">6. Retire the old tables</text>
  <text x="1040" y="385" text-anchor="middle" font-size="20" fill="#64748B">the migration is complete</text>

  <g stroke-width="4">
    <line x1="40" y1="470" x2="74" y2="470" stroke="#475569"/>
    <line x1="300" y1="470" x2="334" y2="470" stroke="#D97706"/>
    <line x1="760" y1="470" x2="794" y2="470" stroke="#3B82F6"/>
    <line x1="40" y1="510" x2="74" y2="510" stroke="#059669"/>
  </g>
  <text x="84" y="477" font-size="20" fill="#475569">Step order</text>
  <text x="344" y="477" font-size="20" fill="#475569">Sync phase: dual writes or CDC</text>
  <text x="804" y="477" font-size="20" fill="#475569">Cutover: reads move over</text>
  <text x="84" y="517" font-size="20" fill="#475569">Old tables unread: safe to retire</text>
</svg>