<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="866" viewBox="0 0 1240 866" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="operate-title operate-desc">
<title id="operate-title">What it costs and who runs it</title>
<desc id="operate-desc">Infrastructure is not the expensive thing at this size, which is the whole justification for buying rather than building.</desc>
<defs>
<marker id="operate-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="operate-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="operate-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="operate-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="866" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What it costs and who runs it</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Infrastructure is not the expensive thing at this size.</text>
<rect x="40" y="788" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="788" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A plausible monthly bill at early traffic</text>
<rect x="40" y="168" width="560" height="46" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="198" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">application hosting</text><text x="584" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~400</text>
<rect x="40" y="220" width="560" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="56" y="250" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">managed database, primary and replica</text><text x="584" y="250" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~700</text>
<rect x="40" y="272" width="560" height="46" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="302" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">object storage and transfer</text><text x="584" y="302" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~150</text>
<rect x="40" y="324" width="560" height="46" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="56" y="354" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">queue and worker</text><text x="584" y="354" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~120</text>
<rect x="40" y="376" width="560" height="46" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="56" y="406" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">managed search, if adopted</text><text x="584" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~300</text>
<rect x="40" y="428" width="560" height="46" rx="9" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="56" y="458" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">observability</text><text x="584" y="458" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">~250</text>
<rect x="640" y="168" width="560" height="86" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="203.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">about 1,920 a month, against five engineers</text><text x="920" y="230.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">who cost orders of magnitude more</text>
<rect x="640" y="270" width="560" height="86" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="305.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Observability at thirteen percent looks</text><text x="920" y="332.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">disproportionate and is correct</text>
<rect x="640" y="372" width="560" height="86" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="407.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">because the alternative to tooling</text><text x="920" y="434.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">is engineer time</text>
<text x="40" y="516" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Operable by a team with no operations capacity</text>
<rect x="40" y="534" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="568" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One place to look</text>
<rect x="40" y="598" width="372" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="60" y="621.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">logs, metrics and traces in</text><text x="60" y="646.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one tool, even a dearer one</text>
<rect x="434" y="534" width="372" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="568" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Alerts a human can act on</text>
<rect x="434" y="598" width="372" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="454" y="621.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a small number, each with</text><text x="454" y="646.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a runbook entry</text>
<rect x="828" y="534" width="372" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1014" y="568" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Boring reversible deploys</text>
<rect x="828" y="598" width="372" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="848" y="621.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">several a day, halted</text><text x="848" y="646.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">automatically on error rate</text>
<rect x="40" y="686" width="1160" height="76" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="716.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Failure here is about recovery rather than redundancy, and a tested restore is</text><text x="620" y="743.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the one property most startups do not have</text>
<text x="66" y="822" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">At three in the morning, one tool to look in and one action to revert.</text>
</svg>