  </g>
  <text x="964" y="402" font-size="18.5" font-weight="600" fill="#111827">Automation script</text>
  <text x="1030" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">Deterministic filtered pages</text>

  
  <g filter="url(#yl05fourcal-lift)">
    <rect x="470" y="230" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="470" y="230" width="9" height="90" fill="#64748B" clip-path="url(#yl05fourcal-k5)"/>
  </g>
  <circle cx="508" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,264.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="534" y="282" font-size="18.5" font-weight="600" fill="#111827">One package service</text>

  
  <rect x="40" y="530" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="575" text-anchor="middle" font-size="16" fill="#475569">One implementation, four caller-appropriate contracts.</text>
