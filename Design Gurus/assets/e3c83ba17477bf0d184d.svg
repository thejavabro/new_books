  <text x="144" y="402" font-size="18.5" font-weight="600" fill="#111827">Internal team</text>
  <text x="210" y="465" font-size="15.5" text-anchor="middle" fill="#6B7280">Rich or bulk access</text>

  
  <g filter="url(#yl05fourcal-soft)">
    <rect x="900" y="350" width="260" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
