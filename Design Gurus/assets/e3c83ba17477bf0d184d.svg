<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="646" viewBox="0 0 1240 646" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One package service in the center with four callers around it. The first-party app wants a compact screen read. The public partner wants a stable idempotent write. The internal team wants rich or bulk access. The automation script wants deterministic filtered pages. One implementation can expose four caller-appropriate contracts.">
  <defs>
    <marker id="yl05fourcal-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="yl05fourcal-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="yl05fourcal-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="yl05fourcal-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="yl05fourcal-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl05fourcal-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl05fourcal-k1"><rect x="80" y="110" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="yl05fourcal-k2"><rect x="900" y="110" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="yl05fourcal-k3"><rect x="80" y="350" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="yl05fourcal-k4"><rect x="900" y="350" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="yl05fourcal-k5"><rect x="470" y="230" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="646" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="460" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One service, four caller views</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">each caller asks the same service for a different shape</text>

  
