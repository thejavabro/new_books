<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Each Java, Python, C++, or C# thread is one kernel thread, while Java runs many virtual threads on a few kernel threads">
  <defs>
    <filter id="l05ku-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="l05ku-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="l05ku-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="l05ku-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="l05ku-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <clipPath id="l05ku-k1"><rect x="76" y="110" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="l05ku-k2"><rect x="578" y="110" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="l05ku-k3"><rect x="936" y="110" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="l05ku-k4"><rect x="76" y="355" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="l05ku-k5"><rect x="578" y="355" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="l05ku-k6"><rect x="936" y="355" width="240" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>

  <rect x="40" y="40" width="1160" height="215" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="20" font-weight="600" fill="#475569">One-to-one model</text>
  <rect x="40" y="285" width="1160" height="215" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="315" font-size="20" font-weight="600" fill="#475569">Many-to-many (M:N) model</text>

  <g fill="none" stroke-width="2">
    <path d="M356,155 H578" stroke="#2563EB" marker-end="url(#l05ku-bl)"/>
    <path d="M848,155 H936" stroke="#64748B" marker-end="url(#l05ku-sl)"/>
    <path d="M356,400 H578" stroke="#7C3AED" marker-end="url(#l05ku-vi)"/>
    <path d="M848,400 H936" stroke="#64748B" marker-end="url(#l05ku-sl)"/>
  </g>
  <g font-size="20" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="467" y="143" fill="#1D4ED8">one each</text>
    <text x="892" y="143" fill="#334155">run on</text>
    <text x="467" y="388" fill="#5B21B6">Java moves them</text>
    <text x="892" y="388" fill="#334155">run on</text>
  </g>

  <g filter="url(#l05ku-soft)">
    <rect x="76" y="110" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#l05ku-k1)"/>
  </g>
  <circle cx="114" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="162" font-size="20" font-weight="600" fill="#111827">4 language threads</text>

  <g filter="url(#l05ku-soft)">
    <rect x="578" y="110" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="578" y="110" width="6" height="90" fill="#64748B" clip-path="url(#l05ku-k2)"/>
  </g>
  <circle cx="616" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(605.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="642" y="162" font-size="20" font-weight="600" fill="#111827">4 kernel threads</text>

  <g filter="url(#l05ku-soft)">
    <rect x="936" y="110" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="936" y="110" width="6" height="90" fill="#059669" clip-path="url(#l05ku-k3)"/>
  </g>
  <circle cx="974" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(963.56,144.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3.5" width="18" height="7" rx="1.5"/><rect x="3" y="13.5" width="18" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/>
  </g>
  <text x="1000" y="162" font-size="20" font-weight="600" fill="#111827">Cores</text>

  <g filter="url(#l05ku-soft)">
    <rect x="60" y="339" width="280" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  </g>

  <g filter="url(#l05ku-soft)">
    <rect x="68" y="347" width="280" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
  </g>

  <g filter="url(#l05ku-lift)">
    <rect x="76" y="355" width="280" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="76" y="355" width="9" height="90" fill="#7C3AED" clip-path="url(#l05ku-k4)"/>
  </g>
  <circle cx="114" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,389.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="407" font-size="20" font-weight="600" fill="#111827">10,000 virtual threads</text>

  <g filter="url(#l05ku-soft)">
    <rect x="578" y="355" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="578" y="355" width="6" height="90" fill="#64748B" clip-path="url(#l05ku-k5)"/>
  </g>
  <circle cx="616" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(605.56,389.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="642" y="407" font-size="20" font-weight="600" fill="#111827">A few kernel threads</text>

  <g filter="url(#l05ku-soft)">
    <rect x="936" y="355" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="936" y="355" width="6" height="90" fill="#059669" clip-path="url(#l05ku-k6)"/>
  </g>
  <circle cx="974" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(963.56,389.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3.5" width="18" height="7" rx="1.5"/><rect x="3" y="13.5" width="18" height="7" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/>
  </g>
  <text x="1000" y="407" font-size="20" font-weight="600" fill="#111827">Cores</text>

  <text x="216" y="230" font-size="20" text-anchor="middle" fill="#6B7280">Java, Python, C++, or C#</text>
  <text x="713" y="230" font-size="20" text-anchor="middle" fill="#6B7280">the operating system schedules them</text>
  <text x="1056" y="230" font-size="20" text-anchor="middle" fill="#6B7280">only kernel threads run here</text>
  <text x="216" y="475" font-size="20" text-anchor="middle" fill="#6B7280">Java user threads</text>
  <text x="713" y="475" font-size="20" text-anchor="middle" fill="#6B7280">about one per core</text>
  <text x="1056" y="475" font-size="20" text-anchor="middle" fill="#6B7280">only kernel threads run here</text>

  <rect x="40" y="530" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="575" text-anchor="middle" font-size="20" fill="#475569">User threads are cheap to create, but only kernel threads run on cores.</text>
</svg>