<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">A state-update flow can support several patterns</title><desc id="desc">The UI sends events to a state owner, which sends state back to the UI and requests effects. The effect handler returns result events to that same owner.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="780" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">A state-update flow can support several patterns</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">A ViewModel can use explicit events and a reducer.</tspan></text><rect x="50" y="230" width="310" height="230" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="272" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">UI</tspan></text><text x="72" y="320" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Render current state</tspan><tspan x="72" dy="32">Send user events</tspan></text><rect x="445" y="230" width="310" height="230" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="467" y="272" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="467" dy="0">State owner</tspan></text><text x="467" y="320" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="467" dy="0">Apply events</tspan><tspan x="467" dy="32">Produce state</tspan><tspan x="467" dy="32">Request effects</tspan></text><rect x="840" y="230" width="310" height="230" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="862" y="272" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="862" dy="0">Effect handler</tspan></text><text x="862" y="320" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="862" dy="0">Run repository work</tspan><tspan x="862" dy="32">Report result events</tspan></text><path d="M370 330 H435" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 330 H830" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 220 V170 H205 V220" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="155" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="280" dy="0">Screen state</tspan></text><path d="M995 470 V530 H600 V470" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="710" y="570" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="710" dy="0">Result event</tspan></text><rect x="50" y="625" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="671" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Both user events and operation results return to the same state owner.</tspan></text></g></svg>