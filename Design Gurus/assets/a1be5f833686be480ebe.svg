<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Health-checked DNS removes the address of a server that fails its checks. Weighted DNS sends, for example, 90 percent of answers to one version and 10 percent to another. Location-based DNS returns the address of the nearest region.">
  <defs>
    <filter id="dl2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dl2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="dl2-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dl2-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dl2-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Smarter DNS answers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Many DNS services choose each answer with more information than a simple rotation.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#dl2-soft)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="90" fill="#059669" clip-path="url(#dl2-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">Health-checked</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">checks servers often</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">removes failed ones</text>
  <g filter="url(#dl2-soft)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="140" width="6" height="90" fill="#D97706" clip-path="url(#dl2-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">Weighted</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">splits answers by share</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">like 90% and 10%</text>
  <g filter="url(#dl2-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#dl2-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">Location-based</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">returns the nearest region</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">judged by the resolver location</text>

  <rect x="40" y="340" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="365" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Still cached</text>
  <text x="323" y="390" font-size="18.5" fill="#475569">every change reaches users only after cached answers expire</text>
</svg>