  <rect x="40" y="612" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="657" text-anchor="middle" font-size="20" fill="#475569">Each worker counts into its own array, and the main thread adds up the arrays after every join.</text>
