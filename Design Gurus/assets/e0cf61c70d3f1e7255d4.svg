<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A nonce rejects a duplicate outright because a second copy is hostile, while an idempotency key accepts a duplicate and replays the stored result because an honest client is retrying">
  <rect x="0" y="0" width="1240" height="708" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two mechanisms that both see a duplicate, and disagree about what it means</text>

  
  <rect x="50" y="88" width="560" height="452" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M50 100 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#FEF2F2"/>
  <text x="330" y="122" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Nonce: a duplicate is an attack</text>

  <text x="70" y="180" font-size="20" font-weight="600" fill="#475569">Who sends the second copy</text>
  <text x="70" y="210" font-size="20" fill="#0F172A">Someone who captured the first one.</text>

  <text x="70" y="262" font-size="20" font-weight="600" fill="#475569">What the server does</text>
  <text x="70" y="292" font-size="20" fill="#0F172A">Remembers every nonce it has seen and</text>
  <text x="70" y="318" font-size="20" fill="#0F172A">refuses any request that repeats one.</text>

  <text x="70" y="370" font-size="20" font-weight="600" fill="#475569">The answer</text>
  <rect x="70" y="386" width="520" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="330" y="415" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">401, and nothing happens</text>

  <text x="70" y="472" font-size="20" font-weight="600" fill="#475569">Goal</text>
  <text x="70" y="502" font-size="20" fill="#0F172A">Stop work that was never authorised twice.</text>

  
  <rect x="630" y="88" width="560" height="452" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <path d="M630 100 a12 12 0 0 1 12 -12 h536 a12 12 0 0 1 12 12 v40 h-560 z" fill="#ECFDF5"/>
  <text x="910" y="122" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Idempotency key: a duplicate is a retry</text>

  <text x="650" y="180" font-size="20" font-weight="600" fill="#475569">Who sends the second copy</text>
  <text x="650" y="210" font-size="20" fill="#0F172A">The original client, unsure it got through.</text>

  <text x="650" y="262" font-size="20" font-weight="600" fill="#475569">What the server does</text>
  <text x="650" y="292" font-size="20" fill="#0F172A">Recognises the key, skips the work, and</text>
  <text x="650" y="318" font-size="20" fill="#0F172A">returns what it returned the first time.</text>

  <text x="650" y="370" font-size="20" font-weight="600" fill="#475569">The answer</text>
  <rect x="650" y="386" width="520" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="910" y="415" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">200, the original result again</text>

  <text x="650" y="472" font-size="20" font-weight="600" fill="#475569">Goal</text>
  <text x="650" y="502" font-size="20" fill="#0F172A">Let an honest client retry without harm.</text>

  
  <rect x="50" y="576" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="612" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Both keep track of what they have seen. They differ on what a repeat deserves.</text>
  <text x="620" y="642" font-size="20" fill="#334155" text-anchor="middle">A payment API usually wants both: a nonce to keep strangers out, a key to keep the client safe.</text>
</svg>