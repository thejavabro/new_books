<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="804" viewBox="0 0 1240 804" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A bi-encoder embeds the question and each chunk separately, so chunks are embedded ahead of time, while a cross-encoder reads the question and one chunk together in one pass">
  <defs>
    <marker id="c5hy3-m64748b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c5hy3-mb45309" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B45309"/>
    </marker>
    <filter id="c5hy3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c5hy3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c5hy3-k1"><rect x="60" y="144" width="144" height="90" rx="12"/></clipPath>
    <clipPath id="c5hy3-k2"><rect x="241" y="144" width="158" height="90" rx="12"/></clipPath>
    <clipPath id="c5hy3-k3"><rect x="436" y="144" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="c5hy3-k4"><rect x="200" y="454" width="166" height="90" rx="12"/></clipPath>
    <clipPath id="c5hy3-k5"><rect x="457" y="454" width="166" height="90" rx="12"/></clipPath>
    <clipPath id="c5hy3-k6"><rect x="768" y="144" width="294" height="90" rx="12"/></clipPath>
    <clipPath id="c5hy3-k7"><rect x="768" y="314" width="294" height="90" rx="12"/></clipPath>
    <clipPath id="c5hy3-k8"><rect x="768" y="469" width="294" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="804" fill="#FFFFFF"/>
  <text x="40" y="62" font-size="18.5" font-weight="700" fill="#111827">Bi-encoders: fast because they work apart</text>
  <text x="740" y="62" font-size="18.5" font-weight="700" fill="#111827">Cross-encoders: careful because they read together</text>
  <rect x="40" y="84" width="660" height="220" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="114" font-size="16.5" font-weight="600" fill="#B45309">Ahead of time: a batch job</text>
  <rect x="40" y="394" width="660" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="424" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: at request time</text>
  <rect x="740" y="84" width="460" height="530" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="764" y="114" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: for each candidate</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M204,189 H241" marker-end="url(#c5hy3-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M399,189 H436" marker-end="url(#c5hy3-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M366,499 H457" marker-end="url(#c5hy3-m64748b)"/></g>
  <g fill="none" stroke="#B45309" stroke-width="2"><path d="M540,271 V454" marker-end="url(#c5hy3-mb45309)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M915,271 V314" marker-end="url(#c5hy3-m64748b)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M915,441 V469" marker-end="url(#c5hy3-m64748b)"/></g>
  <g filter="url(#c5hy3-soft)">
    <rect x="60" y="144" width="144" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="60" y="144" width="6" height="90" fill="#D97706" clip-path="url(#c5hy3-k1)"/>
  </g>
  <circle cx="98" cy="189" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,178.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="124" y="196" font-size="18.5" font-weight="600" fill="#111827">Chunk</text>
  <text x="132" y="259" font-size="15.5" text-anchor="middle" fill="#6B7280">each of 10 million</text>
  <g filter="url(#c5hy3-soft)">
    <rect x="241" y="144" width="158" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="241" y="144" width="6" height="90" fill="#D97706" clip-path="url(#c5hy3-k2)"/>
  </g>
  <circle cx="279" cy="189" r="18" fill="#FFFFFF"/>
  <g transform="translate(268.56,178.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="305" y="196" font-size="18.5" font-weight="600" fill="#111827">Encoder</text>
  <text x="320" y="259" font-size="15.5" text-anchor="middle" fill="#6B7280">reads the chunk alone</text>
  <g filter="url(#c5hy3-soft)">
    <rect x="436" y="144" width="245" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="436" y="144" width="6" height="90" fill="#D97706" clip-path="url(#c5hy3-k3)"/>
  </g>
  <circle cx="474" cy="189" r="18" fill="#FFFFFF"/>
  <g transform="translate(463.56,178.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="500" y="196" font-size="18.5" font-weight="600" fill="#111827">Chunk embedding</text>
  <text x="558.5" y="259" font-size="15.5" text-anchor="middle" fill="#6B7280">stored in the ANN index</text>
  <g filter="url(#c5hy3-soft)">
    <rect x="200" y="454" width="166" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="200" y="454" width="6" height="90" fill="#2563EB" clip-path="url(#c5hy3-k4)"/>
  </g>
  <circle cx="238" cy="499" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,488.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="264" y="506" font-size="18.5" font-weight="600" fill="#111827">Question</text>
  <text x="283" y="569" font-size="15.5" text-anchor="middle" fill="#6B7280">embedded when it arrives</text>
  <g filter="url(#c5hy3-soft)">
    <rect x="457" y="454" width="166" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="457" y="454" width="6" height="90" fill="#2563EB" clip-path="url(#c5hy3-k5)"/>
  </g>
  <circle cx="495" cy="499" r="18" fill="#FFFFFF"/>
  <g transform="translate(484.56,488.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="521" y="506" font-size="18.5" font-weight="600" fill="#111827">Compare</text>
  <text x="540" y="569" font-size="15.5" text-anchor="middle" fill="#6B7280">one fast score, such as cosine similarity</text>
  <g filter="url(#c5hy3-soft)">
    <rect x="768" y="144" width="294" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="768" y="144" width="6" height="90" fill="#2563EB" clip-path="url(#c5hy3-k6)"/>
  </g>
  <circle cx="806" cy="189" r="18" fill="#FFFFFF"/>
  <g transform="translate(795.56,178.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="832" y="196" font-size="18.5" font-weight="600" fill="#111827">Question and one chunk</text>
  <text x="915" y="259" font-size="15.5" text-anchor="middle" fill="#6B7280">read together, token by token</text>
  <g filter="url(#c5hy3-lift)">
    <rect x="768" y="314" width="294" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="768" y="314" width="9" height="90" fill="#2563EB" clip-path="url(#c5hy3-k7)"/>
  </g>
  <circle cx="806" cy="359" r="18" fill="#FFFFFF"/>
  <g transform="translate(795.56,348.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="832" y="366" font-size="18.5" font-weight="600" fill="#111827">One model pass</text>
  <text x="915" y="429" font-size="15.5" text-anchor="middle" fill="#6B7280">every token compared with every token</text>
  <g filter="url(#c5hy3-soft)">
    <rect x="768" y="469" width="294" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="768" y="469" width="6" height="90" fill="#059669" clip-path="url(#c5hy3-k8)"/>
  </g>
  <circle cx="806" cy="514" r="18" fill="#FFFFFF"/>
  <g transform="translate(795.56,503.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="832" y="521" font-size="18.5" font-weight="600" fill="#111827">Relevance score</text>
  <text x="915" y="584" font-size="15.5" text-anchor="middle" fill="#6B7280">one score for the pair</text>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="528" y="354" fill="#B45309">never waits for the query</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="929" y="298" fill="#BE185D">nothing computed ahead of time</text></g>
  <text x="370" y="648" font-size="15.5" text-anchor="middle" fill="#6B7280">Millions of chunks, in a few milliseconds</text>
  <text x="970" y="648" font-size="15.5" text-anchor="middle" fill="#6B7280">A few dozen to about a hundred candidates</text>
  <rect x="40" y="688" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="733" text-anchor="middle" font-size="16" fill="#475569">Bi-encoders do first-stage retrieval, and cross-encoders do reranking.</text>
</svg>