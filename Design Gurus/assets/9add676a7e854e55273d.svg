<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Request flow. 1, the client, a browser or mobile app, sends an HTTP or HTTPS request over 2, the internet, to 3, the load balancer, which terminates TLS, distributes requests and runs health checks. The load balancer sends static content requests to 4a, the web servers (Nginx, Apache and so on; often the same Nginx process as the load balancer), which serve the static assets (HTML, CSS, JavaScript) directly; it sends dynamic requests to 4b, the application servers (Python, Java, Go and so on). Responses return to the client along the same path, through the load balancer">
  <defs>
    <filter id="m03e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m03e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m03e-k1"><rect x="40" y="140" width="256" height="90" rx="12"/></clipPath>
    <clipPath id="m03e-k2"><rect x="440" y="140" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="m03e-k3"><rect x="770" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="m03e-k4"><rect x="680" y="600" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="m03e-k5"><rect x="270" y="600" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="m03e-k6"><rect x="850" y="400" width="350" height="90" rx="12"/></clipPath>
    <marker id="m03e-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m03e-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Presentation tier: how incoming HTTP requests are handled</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Static requests go to the web servers; dynamic requests go to the application servers. Responses return along the same path.</text>



  <g fill="none" stroke-width="2">
    <path d="M296,185 H440" stroke="#2563EB" marker-end="url(#m03e-m-blue)"/>
    <path d="M650,185 H770" stroke="#2563EB" marker-end="url(#m03e-m-blue)"/>
    <path d="M800,230 V600" stroke="#2563EB" marker-end="url(#m03e-m-blue)"/>
    <path d="M1040,230 V400" stroke="#2563EB" marker-end="url(#m03e-m-blue)"/>
    <path d="M680,645 H560" stroke="#2563EB" marker-end="url(#m03e-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="368" y="150" fill="#1D4ED8">HTTP/HTTPS</text>
    <text x="368" y="174" fill="#1D4ED8">request</text>
    <text x="620" y="610" fill="#1D4ED8">static content</text>
    <text x="620" y="634" fill="#1D4ED8">request</text>
    <text x="788" y="410" fill="#1D4ED8" text-anchor="end">3 and 4a are often</text>
    <text x="788" y="434" fill="#1D4ED8" text-anchor="end">one Nginx process</text>
  </g>

  <g filter="url(#m03e-soft)">
    <rect x="40" y="140" width="256" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#m03e-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="179.25" font-size="21.5" font-weight="600" fill="#111827">1. Client</text>
  <text x="104" y="204.75" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#m03e-soft)">
    <rect x="440" y="140" width="210" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="440" y="140" width="6" height="90" fill="#64748B" clip-path="url(#m03e-k2)"/>
  </g>
  <circle cx="478" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h11a4 4 0 0 0 .6-7.95A6 6 0 0 0 7.1 9.1 4.75 4.75 0 0 0 7 18.5z"/></g>
  <text x="504" y="192" font-size="21.5" font-weight="600" fill="#111827">2. Internet</text>
  <g filter="url(#m03e-soft)">
    <rect x="770" y="140" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="770" y="140" width="6" height="90" fill="#64748B" clip-path="url(#m03e-k3)"/>
  </g>
  <circle cx="808" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/><path d="M12 7.2V12M12 12l-7 4.8M12 12v4.8M12 12l7 4.8"/></g>
  <text x="834" y="192" font-size="21.5" font-weight="600" fill="#111827">3. Load balancer</text>
  <g filter="url(#m03e-soft)">
    <rect x="680" y="600" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="680" y="600" width="6" height="90" fill="#2563EB" clip-path="url(#m03e-k4)"/>
  </g>
  <circle cx="718" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,634.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="744" y="652" font-size="21.5" font-weight="600" fill="#111827">4a. Web servers</text>
  <g filter="url(#m03e-soft)">
    <rect x="270" y="600" width="290" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="270" y="600" width="6" height="90" fill="#7C3AED" clip-path="url(#m03e-k5)"/>
  </g>
  <circle cx="308" cy="645" r="18" fill="#FFFFFF"/>
  <g transform="translate(297.56,634.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="334" y="652" font-size="21.5" font-weight="600" fill="#111827">Static assets</text>
  <g filter="url(#m03e-soft)">
    <rect x="850" y="400" width="350" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="850" y="400" width="6" height="90" fill="#059669" clip-path="url(#m03e-k6)"/>
  </g>
  <circle cx="888" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,434.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="914" y="452" font-size="21.5" font-weight="600" fill="#111827">4b. Application servers</text>
  <text x="104" y="204.75" font-size="17" fill="#4B5563">browser or mobile app</text>
  <text x="920" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">terminates TLS</text>
  <text x="920" y="286" font-size="18.5" text-anchor="middle" fill="#6B7280">distributes requests</text>
  <text x="920" y="313" font-size="18.5" text-anchor="middle" fill="#6B7280">health checks</text>
  <text x="820" y="719" font-size="18.5" text-anchor="middle" fill="#6B7280">Nginx, Apache, and so on</text>
  <text x="415" y="719" font-size="18.5" text-anchor="middle" fill="#6B7280">HTML, CSS, JS</text>
  <text x="415" y="746" font-size="18.5" text-anchor="middle" fill="#6B7280">served directly by web servers</text>
  <text x="1025" y="519" font-size="18.5" text-anchor="middle" fill="#6B7280">Python, Java, Go, and so on</text>




</svg>