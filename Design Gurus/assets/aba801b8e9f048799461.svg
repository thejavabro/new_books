<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A login sequence: the user submits credentials, the application checks them against the user database, then accepts or rejects the attempt">
  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="se2-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se2-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="se2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="se2-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="se2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="200" y1="112" x2="200" y2="790" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="620" y1="112" x2="620" y2="790" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1040" y1="112" x2="1040" y2="790" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="208" y1="192" x2="612" y2="192" stroke="#3B82F6" stroke-width="2" marker-end="url(#se2-blue)"/>
  <text x="410" y="168" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. enters username and password</text>

  <line x1="628" y1="302" x2="1032" y2="302" stroke="#3B82F6" stroke-width="2" marker-end="url(#se2-blue)"/>
  <text x="830" y="278" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. looks up the account record</text>

  <line x1="1032" y1="412" x2="628" y2="412" stroke="#7C3AED" stroke-width="2" marker-end="url(#se2-violet)"/>
  <text x="830" y="388" font-size="20" fill="#5B21B6" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">returns the stored credentials (hashed)</text>

  <line x1="612" y1="608" x2="208" y2="608" stroke="#059669" stroke-width="2" marker-end="url(#se2-emerald)"/>
  <text x="410" y="557" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. match: logged in,</text>
  <text x="410" y="584" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a session or token is issued</text>

  <line x1="612" y1="738" x2="208" y2="738" stroke="#DC2626" stroke-width="2" marker-end="url(#se2-red)"/>
  <text x="410" y="714" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. no match: the attempt is rejected</text>

  
  <g filter="url(#se2-soft)">
    <rect x="90" y="40" width="220" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="470" y="40" width="300" height="72" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="200" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="200" y="98" font-size="20" fill="#64748B" text-anchor="middle">person logging in</text>
  <text x="620" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Application</text>
  <text x="620" y="98" font-size="20" fill="#64748B" text-anchor="middle">runs the identity check</text>

  <g filter="url(#se2-soft)">
    <path d="M945,44 L945,98 A95,15 0 0 0 1135,98 L1135,44" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="44" rx="95" ry="15" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1040" y="76" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User database</text>

  
  <g filter="url(#se2-soft)">
    <rect x="460" y="452" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="483" font-size="20" fill="#334155" text-anchor="middle">3. compares the input with</text>
  <text x="620" y="510" font-size="20" fill="#334155" text-anchor="middle">the stored hash</text>

  
  <line x1="100" y1="850" x2="128" y2="850" stroke="#3B82F6" stroke-width="3"/>
  <text x="138" y="857" font-size="20" fill="#475569">request</text>
  <line x1="290" y1="850" x2="318" y2="850" stroke="#7C3AED" stroke-width="3"/>
  <text x="328" y="857" font-size="20" fill="#475569">stored data</text>
  <line x1="561" y1="850" x2="589" y2="850" stroke="#059669" stroke-width="3"/>
  <text x="599" y="857" font-size="20" fill="#475569">success</text>
  <line x1="751" y1="850" x2="779" y2="850" stroke="#DC2626" stroke-width="3"/>
  <text x="789" y="857" font-size="20" fill="#475569">failure</text>
</svg>