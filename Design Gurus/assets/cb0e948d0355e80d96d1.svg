<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="842" viewBox="0 0 1240 842" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three workable conflict rules for offline sync: last write wins by server acceptance order, a conditional write with If-Match that returns 412, and keeping both versions as a conflict resource the product can resolve. Each rule is shown with the case it fits and the cost it carries.">
  <defs>
    <filter id="p3g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3g-k1"><rect x="76" y="146" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3g-k2"><rect x="76" y="342" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3g-k3"><rect x="76" y="538" width="460" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="842" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Three conflict rules, three costs</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M640,71 L644.5,75.5 L652,65.5"/>
  </g>
  <text x="666" y="77" font-size="15.5" fill="#6B7280">use it when</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M840,66 L851,77 M851,66 L840,77"/>
  </g>
  <text x="865" y="77" font-size="15.5" fill="#6B7280">the cost it carries</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3g-soft)">
    <rect x="76" y="146" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p3g-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Last write wins</text>
  <text x="1164" y="198" text-anchor="end" font-size="15.5" fill="#6B7280">the server keeps the write it accepts last</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,256 L82.5,260.5 L90,250.5"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">Fields are low value, edits are easy to repeat, and collisions are rare.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,277 L89,288 M89,277 L78,288"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Simple and automatic, but one valid change can disappear.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3g-soft)">
    <rect x="76" y="342" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#2563EB" clip-path="url(#p3g-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">Conditional write with If-Match</text>
  <text x="1164" y="394" text-anchor="end" font-size="15.5" fill="#6B7280">a stale write is refused with 412</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,452 L82.5,456.5 L90,446.5"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">Silent loss is unacceptable, but an automatic merge is not justified.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,473 L89,484 M89,473 L78,484"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Prevents lost updates, but moves resolution to the client and sometimes the user.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3g-soft)">
    <rect x="76" y="538" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#2563EB" clip-path="url(#p3g-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">Keep both</text>
  <text x="1164" y="590" text-anchor="end" font-size="15.5" fill="#6B7280">both versions live on as a conflict resource</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,648 L82.5,652.5 L90,642.5"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">The content is valuable and neither version can safely disappear.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,669 L89,680 M89,669 L78,680"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">Preserves work, but adds conflict resources, storage, lifecycle, and a screen.</text>

  
  <rect x="40" y="726" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="771" text-anchor="middle" font-size="16" fill="#475569">Never use a phone timestamp to decide the winner. A device clock may simply be wrong.</text>
</svg>