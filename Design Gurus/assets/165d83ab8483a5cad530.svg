<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three brokers side by side: RabbitMQ routes messages through an exchange into queues, Kafka appends records to a replayable log, and ActiveMQ serves JMS queues and topics">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="dm7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="dm7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="40" y="60" width="370" height="514" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="435" y="60" width="370" height="514" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="830" y="60" width="370" height="514" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="225" y="94" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">RabbitMQ</text>
  <text x="225" y="120" font-size="20" fill="#64748B" text-anchor="middle">the smart router</text>
  <text x="620" y="94" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="620" y="120" font-size="20" fill="#64748B" text-anchor="middle">the durable log</text>
  <text x="1015" y="94" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">ActiveMQ</text>
  <text x="1015" y="120" font-size="20" fill="#64748B" text-anchor="middle">the JMS workhorse</text>

  
  <line x1="225" y1="218" x2="225" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#dm7-slate)"/>
  <path d="M235,328 C235,348 210,350 185,362" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm7-slate)"/>
  <path d="M295,328 C295,348 320,350 345,362" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm7-slate)"/>

  
  <g filter="url(#dm7-soft)">
    <rect x="135" y="166" width="180" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="115" y="252" width="220" height="76" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="70" y="362" width="150" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="230" y="362" width="150" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="225" y="199" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="225" y="284" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Exchange</text>
  <text x="225" y="312" font-size="20" fill="#64748B" text-anchor="middle">routes by rules</text>
  <text x="145" y="395" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Queue A</text>
  <text x="305" y="395" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Queue B</text>

  <text x="225" y="468" font-size="20" fill="#64748B" text-anchor="middle">Routes each message to queues.</text>
  <text x="225" y="495" font-size="20" fill="#64748B" text-anchor="middle">Deletes it once acknowledged.</text>

  
  <path d="M700,218 C735,235 740,250 740,286" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm7-slate)"/>
  <path d="M580,338 C580,362 620,362 620,392" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm7-slate)"/>
  <text x="702" y="368" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pulls in order</text>

  
  <g filter="url(#dm7-soft)">
    <rect x="530" y="166" width="180" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="465" y="286" width="70" height="52" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="545" y="286" width="70" height="52" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="625" y="286" width="70" height="52" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="705" y="286" width="70" height="52" rx="6" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="530" y="392" width="180" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="199" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="620" y="238" font-size="20" fill="#5B21B6" text-anchor="middle">topic partition</text>
  <text x="620" y="265" font-size="20" fill="#5B21B6" text-anchor="middle">(append-only log)</text>
  <text x="500" y="319" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">0</text>
  <text x="580" y="319" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1</text>
  <text x="660" y="319" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">2</text>
  <text x="740" y="319" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">3</text>
  <text x="620" y="425" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer</text>

  <text x="620" y="468" font-size="20" fill="#64748B" text-anchor="middle">Append-only log. Messages are</text>
  <text x="620" y="495" font-size="20" fill="#64748B" text-anchor="middle">kept and can be replayed.</text>

  
  <line x1="1015" y1="218" x2="1015" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#dm7-slate)"/>
  <line x1="1015" y1="356" x2="1015" y2="374" stroke="#475569" stroke-width="2" marker-end="url(#dm7-slate)"/>

  
  <g filter="url(#dm7-soft)">
    <rect x="925" y="166" width="180" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="875" y="252" width="280" height="104" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="925" y="374" width="180" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1015" y="199" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="1015" y="284" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">JMS broker</text>
  <rect x="905" y="302" width="100" height="36" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="1025" y="302" width="100" height="36" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="955" y="327" font-size="20" fill="#0F172A" text-anchor="middle">Queue</text>
  <text x="1075" y="327" font-size="20" fill="#0F172A" text-anchor="middle">Topic</text>
  <text x="1015" y="407" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer</text>

  <text x="1015" y="468" font-size="20" fill="#64748B" text-anchor="middle">Queues (point to point)</text>
  <text x="1015" y="495" font-size="20" fill="#64748B" text-anchor="middle">and topics (pub/sub).</text>
  <text x="1015" y="522" font-size="20" fill="#64748B" text-anchor="middle">Speaks many protocols.</text>
</svg>