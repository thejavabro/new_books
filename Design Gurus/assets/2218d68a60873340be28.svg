<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="546" viewBox="0 0 1240 546" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before the scan">
<defs>
<filter id="ms-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="546" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the longest subarray of [1, 2, 3, -2, 5] that adds up to 5?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Counting is not enough here, because the length of each match matters</text>
<rect x="40" y="106" width="1160" height="296" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The table records where each running sum was first reached</text>
<text x="334" y="210" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">array</text>
<rect x="356" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="404" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="404" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="464" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="512" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="512" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="572" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="620" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="680" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="728" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-2</text>
<text x="728" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="788" y="172" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="836" y="209.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="836" y="254" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<text x="540" y="326" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">first seen at</text>
<text x="568" y="325" font-size="18" fill="#475569">nothing recorded yet</text>
<rect x="40" y="416" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="456" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Record only the FIRST index a running sum is reached at, never overwrite it</text>
<text x="620" y="488" text-anchor="middle" font-size="18.5" fill="#475569">An earlier start makes a longer subarray, so the first occurrence is the useful one</text>
</svg>