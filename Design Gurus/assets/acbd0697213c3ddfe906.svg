<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="712" viewBox="0 0 1240 712" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="seam-title seam-desc">
<title id="seam-title">The seam decides the second migration</title>
<desc id="seam-desc">Without a narrow interface, every module queries the specialized store directly and replacing it becomes a rewrite. With one, replacing the store changes one module and can be estimated.</desc>
<defs>
<marker id="seam-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="seam-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="seam-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="seam-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="712" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The seam decides the second migration</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The difference it makes is the difference between two kinds of project.</text>
<rect x="40" y="634" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="634" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="560" height="382" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V494A6 6 0 0 0 46 500H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Without a seam</text>
<rect x="68" y="174" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="148" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Orders</text>
<path d="M148 222V234" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="240" y="174" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Billing</text>
<path d="M320 222V234" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="412" y="174" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="492" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Search UI</text>
<path d="M492 222V234" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="68" y="246" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="148" y="275" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reports</text>
<path d="M148 294V306" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="240" y="246" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="275" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Admin</text>
<path d="M320 294V306" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="412" y="246" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="492" y="275" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Jobs</text>
<path d="M492 294V306" fill="none" stroke="#CE475C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="320" y="338" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">every module queries the store directly</text>
<rect x="64" y="384" width="512" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="64" y="384" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="88" y="414" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Replacing it is a rewrite</text><text x="88" y="440" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">its query language and consistency model</text><text x="88" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">have become assumptions everywhere</text>
<rect x="640" y="118" width="560" height="382" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V494A6 6 0 0 0 646 500H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">With a seam</text>
<rect x="668" y="174" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="748" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Orders</text>
<rect x="840" y="174" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Billing</text>
<rect x="1012" y="174" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1092" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Search UI</text>
<rect x="668" y="228" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="748" y="257" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reports</text>
<rect x="840" y="228" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="257" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Admin</text>
<rect x="1012" y="228" width="160" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1092" y="257" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Jobs</text>
<path d="M920 280V310" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 280V310" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#seam-marker-slate)"/>
<rect x="745" y="314" width="350" height="46" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="920" y="343" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one narrow interface</text>
<rect x="664" y="384" width="512" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="664" y="384" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="688" y="414" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Replacing it is a bounded migration</text><text x="688" y="440" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one module changes, the interface does not,</text><text x="688" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the work can be estimated</text>
<rect x="40" y="524" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="524" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="557.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The expensive migration is not the one INTO the specialized store.</text><text x="64" y="586.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">It is the one out of it, two years later, when the choice turns out to be wrong.</text>
<text x="66" y="667" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Teams that skip the seam do not have a database problem. They have a coupling problem that involves a database.</text>
</svg>