<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Expand-contract version lifecycle as a state machine: old surface only, then old and new both live, then usage of the old surface tracked, looping back while the old surface still has traffic, and only when measured traffic reaches zero does a deprecation window run and the old surface get removed, leaving the new surface only.">
  <defs>
    <marker id="m06-l06-version-lifecycle-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l06-version-lifecycle-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l06-version-lifecycle-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m06-l06-version-lifecycle-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m06-l06-version-lifecycle-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="770" fill="#FFFFFF"/>

  <g filter="url(#m06-l06-version-lifecycle-soft)">
    <rect x="90" y="200" width="290" height="120" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="235" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Old surface only</text>
  <text x="235" y="283" text-anchor="middle" font-size="20" fill="#64748B">the starting contract</text>
  <g filter="url(#m06-l06-version-lifecycle-soft)">
    <rect x="430" y="200" width="290" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="575" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Old and new both live</text>
  <text x="575" y="283" text-anchor="middle" font-size="20" fill="#64748B">the producer supports both</text>
  <g filter="url(#m06-l06-version-lifecycle-soft)">
    <rect x="800" y="200" width="340" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="970" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Usage of the old surface</text>
  <text x="970" y="283" text-anchor="middle" font-size="20" fill="#64748B">is tracked, not assumed</text>
  <g filter="url(#m06-l06-version-lifecycle-soft)">
    <rect x="110" y="470" width="300" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="260" y="521" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Deprecation window</text>
  <text x="260" y="553" text-anchor="middle" font-size="20" fill="#64748B">communicated in advance</text>
  <g filter="url(#m06-l06-version-lifecycle-soft)">
    <rect x="520" y="470" width="280" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="660" y="521" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">New surface only</text>
  <text x="660" y="553" text-anchor="middle" font-size="20" fill="#64748B">the old one is removed</text>
  <g filter="url(#m06-l06-version-lifecycle-soft)">
    <rect x="900" y="470" width="280" height="120" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="1040" y="521" text-anchor="middle" font-size="20" fill="#475569">You cannot retire</text>
  <text x="1040" y="553" text-anchor="middle" font-size="20" fill="#475569">what you cannot measure</text>

  <g fill="none" stroke-width="2.5">
    <path d="M68,260 L82,260" stroke="#475569" stroke-width="2" marker-end="url(#m06-l06-version-lifecycle-sl)"/>
    <path d="M380,260 L422,260" stroke="#3B82F6" marker-end="url(#m06-l06-version-lifecycle-bl)"/>
    <path d="M720,260 L792,260" stroke="#475569" stroke-width="2" marker-end="url(#m06-l06-version-lifecycle-sl)"/>
    <path d="M945,200 L945,120 L575,120 L575,192" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l06-version-lifecycle-rd)"/>
    <path d="M945,320 L945,400 L260,400 L260,462" stroke="#059669" marker-end="url(#m06-l06-version-lifecycle-em)"/>
    <path d="M410,530 L512,530" stroke="#059669" marker-end="url(#m06-l06-version-lifecycle-em)"/>
    <path d="M800,530 L825,530" stroke="#059669" stroke-width="2" marker-end="url(#m06-l06-version-lifecycle-em)"/>
  </g>

  <circle cx="55" cy="260" r="12" fill="#475569"/>
  <circle cx="843" cy="530" r="13" fill="#FFFFFF" stroke="#059669" stroke-width="2.5"/>
  <circle cx="843" cy="530" r="7" fill="#059669"/>

  <text x="401" y="180" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Expand</text>
  <text x="756" y="180" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consumers migrate</text>
  <text x="760" y="102" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the old surface still has traffic</text>
  <text x="600" y="382" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">measured traffic reaches zero</text>
  <text x="461" y="450" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">contract: remove the old surface</text>

  <line x1="60" y1="650" x2="96" y2="650" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="657" font-size="20" fill="#475569">Expand: the new surface ships beside the old one</text>
  <line x1="60" y1="690" x2="96" y2="690" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="697" font-size="20" fill="#475569">Not done yet: the old surface still has traffic</text>
  <line x1="60" y1="730" x2="96" y2="730" stroke="#059669" stroke-width="4"/>
  <text x="108" y="737" font-size="20" fill="#475569">Contract: measured to zero, then removed</text>
</svg>