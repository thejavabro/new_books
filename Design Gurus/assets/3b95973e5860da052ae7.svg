<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="536" viewBox="0 0 1240 536" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four steps of a strangler fig migration. Identify one function to move, put the facade in front so traffic can go either way, replace one function at a time, then retire the old system. The bar under each step shows how much traffic the legacy system still answers, which only shrinks">
  <defs>
    <marker id="sf4-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <filter id="sf4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sf4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sf4-k1"><rect x="72" y="110" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sf4-k2"><rect x="357" y="110" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sf4-k3"><rect x="642" y="110" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sf4-k4"><rect x="927" y="110" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="sf4-b1"><rect x="72" y="226" width="240" height="22" rx="6"/></clipPath>
    <clipPath id="sf4-b2"><rect x="357" y="226" width="240" height="22" rx="6"/></clipPath>
    <clipPath id="sf4-b3"><rect x="642" y="226" width="240" height="22" rx="6"/></clipPath>
    <clipPath id="sf4-b4"><rect x="927" y="226" width="240" height="22" rx="6"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="536" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="292" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">The migration runs in four steps, and the old system shrinks at every one</text>

  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M312,155 L353,155" marker-end="url(#sf4-bl)"/>
    <path d="M597,155 L638,155" marker-end="url(#sf4-bl)"/>
    <path d="M882,155 L923,155" marker-end="url(#sf4-bl)"/>
  </g>

  
  <g filter="url(#sf4-soft)">
    <rect x="72" y="110" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#sf4-k1)"/>
  </g>
  <circle cx="110" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="136" y="162" font-size="18.5" font-weight="600" fill="#111827">1. Identify</text>
  <g clip-path="url(#sf4-b1)">
    <rect x="72" y="226" width="240" height="22" fill="#94A3B8"/>
  </g>
  <rect x="72" y="226" width="240" height="22" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="192" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">pick one function to move</text>
  <text x="192" y="296" font-size="15.5" text-anchor="middle" fill="#94A3B8">the smallest useful slice</text>

  
  <g filter="url(#sf4-soft)">
    <rect x="357" y="110" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="357" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#sf4-k2)"/>
  </g>
  <circle cx="395" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(384.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="421" y="162" font-size="18.5" font-weight="600" fill="#111827">2. Route</text>
  <g clip-path="url(#sf4-b2)">
    <rect x="357" y="226" width="240" height="22" fill="#94A3B8"/>
    <rect x="547" y="226" width="50" height="22" fill="#6EE7B7"/>
  </g>
  <rect x="357" y="226" width="240" height="22" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="477" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">put the facade in front</text>
  <text x="477" y="296" font-size="15.5" text-anchor="middle" fill="#94A3B8">it can send traffic either way</text>

  
  <g filter="url(#sf4-soft)">
    <rect x="642" y="110" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="642" y="110" width="6" height="90" fill="#2563EB" clip-path="url(#sf4-k3)"/>
  </g>
  <circle cx="680" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(669.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="706" y="162" font-size="18.5" font-weight="600" fill="#111827">3. Replace</text>
  <g clip-path="url(#sf4-b3)">
    <rect x="642" y="226" width="240" height="22" fill="#94A3B8"/>
    <rect x="732" y="226" width="150" height="22" fill="#6EE7B7"/>
  </g>
  <rect x="642" y="226" width="240" height="22" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="762" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">move one function at a time</text>
  <text x="762" y="296" font-size="15.5" text-anchor="middle" fill="#94A3B8">repeat until nothing is left</text>

  
  <g filter="url(#sf4-lift)">
    <rect x="927" y="110" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="927" y="110" width="9" height="90" fill="#059669" clip-path="url(#sf4-k4)"/>
  </g>
  <circle cx="965" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(954.56,144.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="991" y="162" font-size="18.5" font-weight="600" fill="#111827">4. Retire</text>
  <g clip-path="url(#sf4-b4)">
    <rect x="927" y="226" width="240" height="22" fill="#6EE7B7"/>
  </g>
  <rect x="927" y="226" width="240" height="22" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="1047" y="273" font-size="15.5" text-anchor="middle" fill="#6B7280">delete the old system</text>
  <text x="1047" y="296" font-size="15.5" text-anchor="middle" fill="#94A3B8">and the facade if you want</text>

  
  <rect x="40" y="368" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="392" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="414" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Legacy share</text>
  <text x="288" y="414" font-size="15.5" fill="#475569">the grey part of each bar is the traffic the old system still answers, and it only ever shrinks</text>

  <rect x="64" y="436" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="458" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">New share</text>
  <text x="288" y="458" font-size="15.5" fill="#475569">the green part is traffic already served by new services, so every step ships something usable</text>
</svg>