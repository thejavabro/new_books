<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="784" viewBox="0 0 1240 784" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="mismatch-title mismatch-desc">
<title id="mismatch-title">Classifying the mismatches</title>
<desc id="mismatch-desc">Falling mismatches on old rows are the backfill working. A mismatch on a recently written row is a dual-write defect. A mismatch after the count reached zero is a writer nobody knew about.</desc>
<defs>
<marker id="mismatch-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="mismatch-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="mismatch-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="mismatch-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="784" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Classifying the mismatches</text>
<text x="40" y="86" font-size="21" fill="#4A5568">What the mismatches mean depends on when they appear, and this is the part worth memorizing.</text>
<rect x="40" y="706" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="706" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="520" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="300" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">On old rows, falling steadily</text>
<path d="M566 154H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 154H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mismatch-marker-slate)"/>
<rect x="610" y="118" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="160" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the backfill is still working; expected and not a problem</text>
<rect x="40" y="206" width="520" height="72" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="300" y="248" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">On rows written after dual writing went on</text>
<path d="M566 242H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 242H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mismatch-marker-slate)"/>
<rect x="610" y="206" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="235.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a dual-write bug; the new path is wrong for current</text><text x="630" y="260.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">traffic and the backfill will not fix it</text>
<rect x="40" y="294" width="520" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="300" y="336" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">After the count already reached zero</text>
<path d="M566 330H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 330H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mismatch-marker-slate)"/>
<rect x="610" y="294" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="323.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">something writes the old representation outside the</text><text x="630" y="348.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dual-write path: a job, an admin tool, a monthly script</text>
<rect x="40" y="384" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="384" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="425" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The comparison keeps running after it reaches zero, because of the third row.</text>
<rect x="40" y="472" width="1160" height="94" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="472" width="5" height="94" rx="2.5" fill="#F28B9D"/><text x="64" y="510.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The write path you forgot about</text><text x="64" y="539.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">is almost never in the code you were looking at.</text>
<rect x="40" y="584" width="1160" height="94" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="584" width="5" height="94" rx="2.5" fill="#39D5AA"/><text x="64" y="624" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The gate for moving reads</text><text x="64" y="650" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Zero mismatches, sustained across a full business cycle, including monthly jobs.</text>
<text x="66" y="740" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A backfill that has finished is not a backfill that is correct.</text>
</svg>