<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="828" viewBox="0 0 1240 828" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="inside-title inside-desc">
<title id="inside-title">What it means inside your system</title>
<desc id="inside-desc">The perimeter assumption appears between services as well as around them, and the zero-trust version separates three questions that are usually collapsed into one.</desc>
<defs>
<marker id="inside-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="inside-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="inside-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="inside-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="828" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What it means inside your system</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The part that is an architecture decision rather than a purchase is how services treat each other.</text>
<rect x="40" y="750" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="750" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="130" rx="12" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="130" rx="2.5" fill="#D5E3EF"/><text x="64" y="150" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">service A calls service B</text><text x="64" y="176" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">B checks only whether the caller is in the private network</text><text x="64" y="202" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">B does not check who the caller is, whether they may do this,</text><text x="64" y="228" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">or on whose behalf the request is made</text>
<text x="40" y="278" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The zero-trust version answers all three, and they are separate</text>
<circle cx="60" cy="328" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="335" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="296" width="400" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="290" y="334" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Who is calling</text>
<path d="M496 328H540" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 328H540" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#inside-marker-slate)"/>
<rect x="550" y="296" width="650" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="570" y="334" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a verified service identity, not an address</text>
<circle cx="60" cy="400" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="407" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="368" width="400" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="290" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">May this caller do this</text>
<path d="M496 400H540" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 400H540" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#inside-marker-slate)"/>
<rect x="550" y="368" width="650" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="570" y="393.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">per operation. The order service may read</text><text x="570" y="418.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">inventory, not write it</text>
<circle cx="60" cy="472" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="479" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="440" width="400" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="290" y="478" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">On whose behalf</text>
<path d="M496 472H540" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 472H540" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#inside-marker-slate)"/>
<rect x="550" y="440" width="650" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="570" y="465.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the end user propagated, so the final service</text><text x="570" y="490.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">checks object-level permissions</text>
<rect x="40" y="534" width="1160" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="534" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="64" y="564" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The third is the hardest and the most valuable</text><text x="64" y="590" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">If B trusts that A already checked whether this user may see this object,</text><text x="64" y="616" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">then any bug in A becomes a data exposure in B.</text>
<rect x="40" y="662" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="662" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="699" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A proportionate position: service authentication everywhere, identity propagation on customer-data paths</text>
<text x="66" y="784" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This is not free in latency or complexity, so the design should say where it applies.</text>
</svg>