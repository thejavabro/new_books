<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Before: users reach one load balancer, three app servers and one database, so the load balancer and the database are single points of failure. After: two load balancers, app servers in two zones, and a primary database with a replica.">
  <defs>
    <filter id="av3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="av3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="av3-k1"><rect x="64" y="180" width="176" height="90" rx="12"/></clipPath>
    <clipPath id="av3-k2"><rect x="286" y="180" width="266" height="90" rx="12"/></clipPath>
    <clipPath id="av3-k3"><rect x="598" y="180" width="266" height="90" rx="12"/></clipPath>
    <clipPath id="av3-k4"><rect x="910" y="180" width="266" height="90" rx="12"/></clipPath>
    <clipPath id="av3-k5"><rect x="64" y="450" width="176" height="90" rx="12"/></clipPath>
    <clipPath id="av3-k6"><rect x="286" y="450" width="266" height="90" rx="12"/></clipPath>
    <clipPath id="av3-k7"><rect x="598" y="450" width="266" height="90" rx="12"/></clipPath>
    <clipPath id="av3-k8"><rect x="910" y="450" width="266" height="90" rx="12"/></clipPath>
    <marker id="av3-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Finding and removing single points of failure</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three app servers do not help when the only database fails.</text>

  <rect x="40" y="120" width="1160" height="230" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Before: one load balancer and one database</text>
  <rect x="40" y="390" width="1160" height="230" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="420" font-size="19.5" font-weight="600" fill="#475569">After: every part has a copy</text>

  <g fill="none" stroke-width="2">
    <path d="M240,225 H286" stroke="#2563EB" marker-end="url(#av3-m-blue)"/>
    <path d="M552,225 H598" stroke="#2563EB" marker-end="url(#av3-m-blue)"/>
    <path d="M864,225 H910" stroke="#2563EB" marker-end="url(#av3-m-blue)"/>
    <path d="M240,495 H286" stroke="#2563EB" marker-end="url(#av3-m-blue)"/>
    <path d="M552,495 H598" stroke="#2563EB" marker-end="url(#av3-m-blue)"/>
    <path d="M864,495 H910" stroke="#2563EB" marker-end="url(#av3-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#av3-soft)">
    <rect x="64" y="180" width="176" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#av3-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Users</text>
  <g filter="url(#av3-soft)">
    <rect x="286" y="180" width="266" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="286" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#av3-k2)"/>
  </g>
  <circle cx="324" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(313.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="350" y="232" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <text x="419" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">one copy: a SPOF</text>
  <g filter="url(#av3-soft)">
    <rect x="598" y="180" width="266" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="598" y="180" width="6" height="90" fill="#059669" clip-path="url(#av3-k3)"/>
  </g>
  <circle cx="636" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(625.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="662" y="232" font-size="21.5" font-weight="600" fill="#111827">App servers</text>
  <text x="731" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">three copies</text>
  <g filter="url(#av3-soft)">
    <rect x="910" y="180" width="266" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="910" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#av3-k4)"/>
  </g>
  <circle cx="948" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(937.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="974" y="232" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="1043" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">one copy: a SPOF</text>
  <g filter="url(#av3-soft)">
    <rect x="64" y="450" width="176" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="450" width="6" height="90" fill="#64748B" clip-path="url(#av3-k5)"/>
  </g>
  <circle cx="102" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,484.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="502" font-size="21.5" font-weight="600" fill="#111827">Users</text>
  <g filter="url(#av3-soft)">
    <rect x="286" y="450" width="266" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="286" y="450" width="6" height="90" fill="#059669" clip-path="url(#av3-k6)"/>
  </g>
  <circle cx="324" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(313.56,484.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="350" y="502" font-size="21.5" font-weight="600" fill="#111827">Load balancers</text>
  <text x="419" y="569" font-size="18.5" text-anchor="middle" fill="#6B7280">two, a standby takes over</text>
  <g filter="url(#av3-soft)">
    <rect x="598" y="450" width="266" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="598" y="450" width="6" height="90" fill="#059669" clip-path="url(#av3-k7)"/>
  </g>
  <circle cx="636" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(625.56,484.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="662" y="502" font-size="21.5" font-weight="600" fill="#111827">App servers</text>
  <text x="731" y="569" font-size="18.5" text-anchor="middle" fill="#6B7280">copies in two zones</text>
  <g filter="url(#av3-soft)">
    <rect x="910" y="450" width="266" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="910" y="450" width="6" height="90" fill="#059669" clip-path="url(#av3-k8)"/>
  </g>
  <circle cx="948" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(937.56,484.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="974" y="502" font-size="21.5" font-weight="600" fill="#111827">Databases</text>
  <text x="1043" y="569" font-size="18.5" text-anchor="middle" fill="#6B7280">a primary and a replica</text>

  <rect x="40" y="650" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">SPOF</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">if this one part fails, every request fails</text>
  <rect x="64" y="725" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="750" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Has a copy</text>
  <text x="323" y="750" font-size="18.5" fill="#475569">another copy takes over, so requests keep working</text>
</svg>