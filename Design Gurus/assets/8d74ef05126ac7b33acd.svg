<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Non-functional requirements for a Reddit style platform: millions of users, 99.9 percent uptime, fast feeds and votes; strong consistency for accounts and new content, eventual for vote counts, and efficient storage of billions of items">
  <defs>
    <filter id="rddn-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rddn-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rddn-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rddn-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rddn-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rddn-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rddn-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rddn-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Reddit style platform: non-functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">How well it has to work. Targets first, then where correctness actually has to be strict.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Targets the design must hit</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#B45309">Where correctness has to be strict</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#rddn-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#rddn-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Millions of users</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">and a growing pile of</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">user generated content</text>
  <g filter="url(#rddn-lift)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="450" y="175" width="9" height="90" fill="#059669" clip-path="url(#rddn-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Fast feed and vote</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a page load or a vote</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">should feel immediate</text>
  <g filter="url(#rddn-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#rddn-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">99.9% uptime</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">degrade rather than fail</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">when a part goes down</text>
  <g filter="url(#rddn-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#rddn-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Strong for writes</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">registering an account or</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">posting must not be lost</text>
  <g filter="url(#rddn-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#D97706" clip-path="url(#rddn-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Eventual for counts</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a vote total may lag,</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">and nobody is harmed</text>
  <g filter="url(#rddn-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#64748B" clip-path="url(#rddn-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Billions of rows</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">stored and retrieved without</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">the cost running away</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Mixed consistency</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">the same product can be strict about content and relaxed about counts; naming which is which is the design</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Read heavy</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">far more people read a post than write one, so the feed path decides the cost of the system</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Storage growth</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">content is never deleted in practice, so the store only grows and has to stay cheap per row</text>
</svg>