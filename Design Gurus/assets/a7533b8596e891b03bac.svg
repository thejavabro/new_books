<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1070" viewBox="0 0 1240 1070" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two bands compared. Top: an order service and a reporting service both read and write one shared set of order tables, so renaming one column needs both teams to agree first. Bottom: database per service, where each service owns a private store and the two services talk through an API call or an event.">
  <defs>
    <marker id="m05-l01-shared-database-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l01-shared-database-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m05-l01-shared-database-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m05-l01-shared-database-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1070" fill="#FFFFFF"/>

  <rect x="60" y="70" width="1120" height="380" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="110" font-size="20" font-weight="600" fill="#B91C1C">Shared database: one service with two front doors</text>
  <text x="1160" y="110" text-anchor="end" font-size="20" fill="#64748B">every migration is a cross-team negotiation</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <rect x="90" y="150" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="215" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order service</text>
  <text x="215" y="223" text-anchor="middle" font-size="20" fill="#64748B">owns the tables</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <rect x="400" y="150" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="540" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Reporting service</text>
  <text x="540" y="223" text-anchor="middle" font-size="20" fill="#64748B">reads them directly</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <path d="M190,310 L190,400 A180,20 0 0 0 550,400 L550,310" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <ellipse cx="370" cy="310" rx="180" ry="20" fill="#F8FAFC" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="370" y="347" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order tables</text>
  <text x="370" y="377" text-anchor="middle" font-size="20" fill="#64748B">one schema, two teams</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <rect x="720" y="290" width="460" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="950" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Rename one column and</text>
  <text x="950" y="362" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">both teams must agree first</text>
  <text x="950" y="394" text-anchor="middle" font-size="20" fill="#64748B">the schema is now a public API</text>

  <rect x="60" y="490" width="1120" height="410" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="530" font-size="20" font-weight="600" fill="#065F46">Database per service: two real services</text>
  <text x="1160" y="530" text-anchor="end" font-size="20" fill="#64748B">the owner's API or its events are the only way in</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <rect x="90" y="600" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="215" y="641" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order service</text>
  <text x="215" y="673" text-anchor="middle" font-size="20" fill="#64748B">only reader and writer</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <rect x="400" y="600" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="540" y="641" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Reporting service</text>
  <text x="540" y="673" text-anchor="middle" font-size="20" fill="#64748B">asks through the API</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <path d="M75,760 L75,850 A140,20 0 0 0 355,850 L355,760" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="215" cy="760" rx="140" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="215" y="797" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Private order store</text>
  <text x="215" y="827" text-anchor="middle" font-size="20" fill="#64748B">free to change</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <path d="M400,760 L400,850 A140,20 0 0 0 680,850 L680,760" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="540" cy="760" rx="140" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="540" y="797" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Private reporting store</text>
  <text x="540" y="827" text-anchor="middle" font-size="20" fill="#64748B">its own shape</text>
  <g filter="url(#m05-l01-shared-database-soft)">
    <rect x="720" y="740" width="460" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="950" y="796" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Either team can rename a column</text>
  <text x="950" y="828" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the API contract does not change</text>

  <g fill="none" stroke-width="2.5">
    <path d="M215,250 C215,275 300,265 322,282" stroke="#3B82F6" marker-end="url(#m05-l01-shared-database-bl)"/>
    <path d="M540,250 C540,275 450,265 428,282" stroke="#3B82F6" marker-end="url(#m05-l01-shared-database-bl)"/>
    <path d="M550,355 L712,355" stroke="#DC2626" marker-end="url(#m05-l01-shared-database-rd)"/>
    <path d="M215,700 L215,732" stroke="#3B82F6" marker-end="url(#m05-l01-shared-database-bl)"/>
    <path d="M540,700 L540,732" stroke="#3B82F6" marker-end="url(#m05-l01-shared-database-bl)"/>
    <path d="M340,650 L392,650" stroke="#059669" marker-end="url(#m05-l01-shared-database-em)"/>
    <path d="M680,805 L712,805" stroke="#059669" marker-end="url(#m05-l01-shared-database-em)"/>
  </g>

  <text x="366" y="578" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">API call or event</text>

  <line x1="60" y1="950" x2="96" y2="950" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="957" font-size="20" fill="#475569">Data access: a service reading and writing tables</text>
  <line x1="60" y1="990" x2="96" y2="990" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="997" font-size="20" fill="#475569">Coupling cost: the shared schema became a public API</text>
  <line x1="60" y1="1030" x2="96" y2="1030" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1037" font-size="20" fill="#475569">The only contract: an API call or an event</text>
</svg>