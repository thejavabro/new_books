<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A prefix array built in one pass, with a range sum answered by subtracting two entries"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker></defs><rect x="0" y="0" width="1240" height="772" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="420" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">One pass builds the running totals, then any range is one subtraction</text>
<text x="168" y="190" text-anchor="end" font-size="19.5" font-weight="600" fill="#475569">values</text>
<rect x="240" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="286" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">3</text>
<text x="286" y="138" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#94A3B8">i=0</text>
<rect x="342" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="388" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="388" y="138" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#94A3B8">i=1</text>
<rect x="444" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="490" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">4</text>
<text x="490" y="138" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#94A3B8">i=2</text>
<rect x="546" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="592" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="592" y="138" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#94A3B8">i=3</text>
<rect x="648" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="694" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">5</text>
<text x="694" y="138" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#94A3B8">i=4</text>
<rect x="750" y="148" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="796" y="189" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">9</text>
<text x="796" y="138" text-anchor="middle" font-size="17.5" font-weight="normal" fill="#94A3B8">i=5</text>
<text x="168" y="300" text-anchor="end" font-size="19.5" font-weight="600" fill="#4338CA">prefix</text>
<rect x="189" y="258" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="235" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">0</text>
<rect x="291" y="258" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="337" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">3</text>
<rect x="393" y="258" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="439" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">4</text>
<rect x="495" y="258" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="541" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">8</text>
<rect x="597" y="258" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="643" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">9</text>
<rect x="699" y="258" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="745" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">14</text>
<rect x="801" y="258" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="847" y="299" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">23</text>
<text x="189" y="392" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">query 1 to 3:   prefix[4] - prefix[1]  =  9 - 3  =  6, which is 1 + 4 + 1</text>
<rect x="40" y="508" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="530" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="556" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">the values</text>
<text x="348" y="556" font-size="19.5" fill="#475569">the original array, which never changes</text>
<rect x="64" y="578" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="604" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">running totals</text>
<text x="348" y="604" font-size="19.5" fill="#475569">each one is the sum of everything up to that point</text>
<rect x="64" y="626" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="652" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the two read</text>
<text x="348" y="652" font-size="19.5" fill="#475569">a range sum needs exactly two of them</text>
<rect x="64" y="674" width="255" height="38" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="191" y="700" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">padding</text>
<text x="348" y="700" font-size="19.5" fill="#475569">prefix[0] is zero, which removes the special case at index 0</text>
</svg>