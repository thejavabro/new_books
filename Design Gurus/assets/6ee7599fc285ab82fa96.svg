<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1226" viewBox="0 0 1240 1226" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The eight alternatives to an ordinary REST request, each with the problem it solves and the lesson that designs it. gRPC and GraphQL change how a caller makes a call. Server-Sent Events, WebSockets, long polling, and webhooks change how a caller learns about a change. Job resources and large-transfer contracts change what one request is expected to finish.">
  <defs>
    <filter id="p0-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p0-k1"><rect x="130" y="174" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p0-k2"><rect x="730" y="174" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p0-k3"><rect x="130" y="429" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p0-k4"><rect x="730" y="429" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p0-k5"><rect x="130" y="620" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p0-k6"><rect x="730" y="620" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p0-k7"><rect x="130" y="875" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p0-k8"><rect x="730" y="875" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1226" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Eight alternatives, and the problem each one solves</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">eight alternatives, six lessons</text>

  
  <rect x="40" y="126" width="1160" height="231" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">How to call</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">changes how a caller makes a call</text>

  <g filter="url(#p0-soft)">
    <rect x="130" y="174" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="130" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p0-k1)"/>
  </g>
  <circle cx="168" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="194" y="226" font-size="18.5" font-weight="600" fill="#111827">gRPC</text>
  <text x="320" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">Small typed messages exchanged in volume</text>
  <text x="320" y="312" text-anchor="middle" font-size="15.5" fill="#6B7280">between controlled services</text>
  <text x="320" y="335" text-anchor="middle" font-size="15.5" fill="#94A3B8">Designed in lesson 2</text>

  <g filter="url(#p0-soft)">
    <rect x="730" y="174" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="730" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p0-k2)"/>
  </g>
  <circle cx="768" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="794" y="226" font-size="18.5" font-weight="600" fill="#111827">GraphQL</text>
  <text x="920" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">Clients that need materially different</text>
  <text x="920" y="312" text-anchor="middle" font-size="15.5" fill="#6B7280">connected field sets</text>
  <text x="920" y="335" text-anchor="middle" font-size="15.5" fill="#94A3B8">Designed in lesson 3</text>

  
  <rect x="40" y="381" width="1160" height="422" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="411" font-size="16.5" font-weight="600" fill="#5B21B6">How to learn</text>
  <text x="1176" y="411" text-anchor="end" font-size="15.5" fill="#6B7280">changes how a caller learns about a change</text>

  <g filter="url(#p0-soft)">
    <rect x="130" y="429" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="130" y="429" width="6" height="90" fill="#7C3AED" clip-path="url(#p0-k3)"/>
  </g>
  <circle cx="168" cy="474" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,463.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="194" y="481" font-size="18.5" font-weight="600" fill="#111827">SSE</text>
  <text x="320" y="544" text-anchor="middle" font-size="15.5" fill="#6B7280">A browser that only receives updates on the</text>
  <text x="320" y="567" text-anchor="middle" font-size="15.5" fill="#6B7280">live channel</text>
  <text x="320" y="590" text-anchor="middle" font-size="15.5" fill="#94A3B8">Designed in lesson 5</text>

  <g filter="url(#p0-soft)">
    <rect x="730" y="429" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="730" y="429" width="6" height="90" fill="#7C3AED" clip-path="url(#p0-k4)"/>
  </g>
  <circle cx="768" cy="474" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,463.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="794" y="481" font-size="18.5" font-weight="600" fill="#111827">WebSockets</text>
  <text x="920" y="544" text-anchor="middle" font-size="15.5" fill="#6B7280">A session where both sides send frequently</text>
  <text x="920" y="590" text-anchor="middle" font-size="15.5" fill="#94A3B8">Designed in lesson 5</text>

  <g filter="url(#p0-soft)">
    <rect x="130" y="620" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="130" y="620" width="6" height="90" fill="#7C3AED" clip-path="url(#p0-k5)"/>
  </g>
  <circle cx="168" cy="665" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,654.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="194" y="672" font-size="18.5" font-weight="600" fill="#111827">Long polling</text>
  <text x="320" y="735" text-anchor="middle" font-size="15.5" fill="#6B7280">Live updates where streaming is not</text>
  <text x="320" y="758" text-anchor="middle" font-size="15.5" fill="#6B7280">available</text>
  <text x="320" y="781" text-anchor="middle" font-size="15.5" fill="#94A3B8">Designed in lesson 5</text>

  <g filter="url(#p0-soft)">
    <rect x="730" y="620" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="730" y="620" width="6" height="90" fill="#7C3AED" clip-path="url(#p0-k6)"/>
  </g>
  <circle cx="768" cy="665" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,654.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="794" y="672" font-size="18.5" font-weight="600" fill="#111827">Webhooks</text>
  <text x="920" y="735" text-anchor="middle" font-size="15.5" fill="#6B7280">A partner server that needs an event after</text>
  <text x="920" y="758" text-anchor="middle" font-size="15.5" fill="#6B7280">the call ended</text>
  <text x="920" y="781" text-anchor="middle" font-size="15.5" fill="#94A3B8">Designed in lesson 6</text>

  
  <rect x="40" y="827" width="1160" height="231" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="857" font-size="16.5" font-weight="600" fill="#B45309">What one request finishes</text>
  <text x="1176" y="857" text-anchor="end" font-size="15.5" fill="#6B7280">changes what one request is expected to finish</text>

  <g filter="url(#p0-soft)">
    <rect x="130" y="875" width="380" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="130" y="875" width="6" height="90" fill="#D97706" clip-path="url(#p0-k7)"/>
  </g>
  <circle cx="168" cy="920" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,909.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="194" y="927" font-size="18.5" font-weight="600" fill="#111827">Job resource</text>
  <text x="320" y="990" text-anchor="middle" font-size="15.5" fill="#6B7280">Work that cannot finish within the request</text>
  <text x="320" y="1013" text-anchor="middle" font-size="15.5" fill="#6B7280">deadline</text>
  <text x="320" y="1036" text-anchor="middle" font-size="15.5" fill="#94A3B8">Designed in lesson 7</text>

  <g filter="url(#p0-soft)">
    <rect x="730" y="875" width="380" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="730" y="875" width="6" height="90" fill="#D97706" clip-path="url(#p0-k8)"/>
  </g>
  <circle cx="768" cy="920" r="18" fill="#FFFFFF"/>
  <g transform="translate(757.56,909.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="794" y="927" font-size="18.5" font-weight="600" fill="#111827">Large transfer</text>
  <text x="920" y="990" text-anchor="middle" font-size="15.5" fill="#6B7280">Bytes too large for one connection to be</text>
  <text x="920" y="1013" text-anchor="middle" font-size="15.5" fill="#6B7280">the unit of retry</text>
  <text x="920" y="1036" text-anchor="middle" font-size="15.5" fill="#94A3B8">Designed in lesson 8</text>

  
  <rect x="40" y="1082" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1124" text-anchor="middle" font-size="16" fill="#475569">Lessons 2 and 3 cover gRPC and GraphQL. Lesson 4 compares them with REST.</text>
  <text x="620" y="1152" text-anchor="middle" font-size="16" fill="#475569">None of these replaces REST across a product. Each answers one pressure at one boundary.</text>
</svg>