<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="632" viewBox="0 0 1240 632" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Signals that CQRS is worth its complexity, and signals that a plain CRUD model is the better answer">
  <rect x="0" y="0" width="1240" height="632" fill="#FFFFFF"/>
  <defs>
    <filter id="dp5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">CQRS earns its complexity, or it does not</text>

  
  <rect x="40" y="72" width="1160" height="222" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#065F46">Reach for it when</text>

  <g filter="url(#dp5-soft)">
    <rect x="70" y="130" width="346" height="142" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="436" y="130" width="346" height="142" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="802" y="130" width="346" height="142" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="243" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Reads dwarf writes</text>
  <text x="243" y="204" font-size="20" fill="#475569" text-anchor="middle">A scoreboard read by</text>
  <text x="243" y="232" font-size="20" fill="#475569" text-anchor="middle">millions and updated</text>
  <text x="243" y="260" font-size="20" fill="#475569" text-anchor="middle">by one feed.</text>

  <text x="609" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Rich write-side rules</text>
  <text x="609" y="204" font-size="20" fill="#475569" text-anchor="middle">Validation and workflow</text>
  <text x="609" y="232" font-size="20" fill="#475569" text-anchor="middle">that has no business</text>
  <text x="609" y="260" font-size="20" fill="#475569" text-anchor="middle">near a read query.</text>

  <text x="975" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">You need an audit trail</text>
  <text x="975" y="204" font-size="20" fill="#475569" text-anchor="middle">Event sourcing pairs</text>
  <text x="975" y="232" font-size="20" fill="#475569" text-anchor="middle">naturally, and gives you</text>
  <text x="975" y="260" font-size="20" fill="#475569" text-anchor="middle">every change on record.</text>

  
  <rect x="40" y="322" width="1160" height="222" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="356" font-size="20" font-weight="600" fill="#B91C1C">Stay with plain CRUD when</text>

  <g filter="url(#dp5-soft)">
    <rect x="70" y="380" width="346" height="142" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="436" y="380" width="346" height="142" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="802" y="380" width="346" height="142" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <text x="243" y="418" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">It is forms over data</text>
  <text x="243" y="454" font-size="20" fill="#475569" text-anchor="middle">One model serves both</text>
  <text x="243" y="482" font-size="20" fill="#475569" text-anchor="middle">sides perfectly well.</text>

  <text x="609" y="418" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Stale reads are unsafe</text>
  <text x="609" y="454" font-size="20" fill="#475569" text-anchor="middle">If the screen must show</text>
  <text x="609" y="482" font-size="20" fill="#475569" text-anchor="middle">the write immediately,</text>
  <text x="609" y="510" font-size="20" fill="#475569" text-anchor="middle">the lag is a defect.</text>

  <text x="975" y="418" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The team is small</text>
  <text x="975" y="454" font-size="20" fill="#475569" text-anchor="middle">Two models, a projection</text>
  <text x="975" y="482" font-size="20" fill="#475569" text-anchor="middle">and a broker are real</text>
  <text x="975" y="510" font-size="20" fill="#475569" text-anchor="middle">operational weight.</text>

  <rect x="40" y="568" width="1160" height="44" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="596" font-size="20" fill="#334155" text-anchor="middle">CQRS relocates complexity, it does not remove it. Apply it to one bounded context, never the whole system.</text>
</svg>