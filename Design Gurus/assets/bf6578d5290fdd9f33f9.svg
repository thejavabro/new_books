<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A reverse proxy sits in front of the servers. The client sends every request to it, and it chooses a server, caches responses, handles TLS, routes by path, and limits how many requests one client can send.">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="px2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="px2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="px2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="px2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="px2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="px2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="px2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="px2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="px2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A reverse proxy stands in front of the servers and works for them</text>
  <g filter="url(#px2-soft)"><rect x="50" y="194" width="170" height="60" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="135" y="232" font-size="20" fill="#0F172A" text-anchor="middle">client</text>
  <line x1="224" y1="224" x2="316" y2="224" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#px2-s)"/>
  <g filter="url(#px2-soft)"><rect x="320" y="150" width="230" height="148" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/></g>
  <text x="435" y="200" font-size="22" font-weight="700" fill="#0F766E" text-anchor="middle">reverse</text>
  <text x="435" y="230" font-size="22" font-weight="700" fill="#0F766E" text-anchor="middle">proxy</text>
  <text x="435" y="266" font-size="18" fill="#64748B" text-anchor="middle">one public address</text>
  <g filter="url(#px2-soft)"><rect x="700" y="102" width="240" height="58" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="820" y="138" font-size="19" fill="#065F46" text-anchor="middle">web servers</text>
  <line x1="554" y1="224" x2="694" y2="130" stroke="#059669" stroke-width="2.2" marker-end="url(#px2-e)"/>
  <g filter="url(#px2-soft)"><rect x="700" y="196" width="240" height="58" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="820" y="232" font-size="19" fill="#065F46" text-anchor="middle">API servers</text>
  <line x1="554" y1="224" x2="694" y2="224" stroke="#059669" stroke-width="2.2" marker-end="url(#px2-e)"/>
  <g filter="url(#px2-soft)"><rect x="700" y="290" width="240" height="58" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="820" y="326" font-size="19" fill="#065F46" text-anchor="middle">image servers</text>
  <line x1="554" y1="224" x2="694" y2="318" stroke="#059669" stroke-width="2.2" marker-end="url(#px2-e)"/>
  <text x="990" y="116" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">IT DOES</text>
  <text x="990" y="152" font-size="19" fill="#0F172A" text-anchor="start">pick a server</text>
  <text x="990" y="186" font-size="19" fill="#0F172A" text-anchor="start">cache responses</text>
  <text x="990" y="220" font-size="19" fill="#0F172A" text-anchor="start">handle TLS</text>
  <text x="990" y="254" font-size="19" fill="#0F172A" text-anchor="start">route /api and /images</text>
  <text x="990" y="288" font-size="19" fill="#0F172A" text-anchor="start">limit and block requests</text>
  <rect x="50" y="388" width="1150" height="56" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="625" y="424" font-size="19" fill="#64748B" text-anchor="middle">The client only knows the proxy, so everything behind it can change without telling the client.</text>
</svg>