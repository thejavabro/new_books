    <marker id="m07j-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Choreography: event-driven order processing</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each service reacts to an event and publishes its own; no service directs the flow.</text>



