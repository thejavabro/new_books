<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Step 1: the order service creates the order and publishes OrderPlaced through the outbox to the event broker, for example Kafka. Step 2: the inventory service consumes OrderPlaced and reserves inventory. Step 3: it publishes InventoryReserved. Step 4: the payment service consumes InventoryReserved and processes payment. Step 5: it publishes PaymentProcessed. Step 6: the notification service consumes PaymentProcessed and sends the email. If payment fails, PaymentFailed makes the inventory service release the stock">
