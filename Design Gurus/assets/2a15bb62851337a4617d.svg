    <text x="266" y="136" fill="#1D4ED8" text-anchor="start">Publish OrderPlaced</text>
    <text x="235" y="161" fill="#1D4ED8" text-anchor="start">through the outbox</text>
    <text x="746" y="172" fill="#1D4ED8" text-anchor="start">Consume</text>
    <text x="715" y="197" fill="#1D4ED8" text-anchor="start">OrderPlaced</text>
    <text x="1166" y="322" fill="#1D4ED8" text-anchor="end">Publish</text>
    <text x="1166" y="347" fill="#1D4ED8" text-anchor="end">InventoryReserved</text>
    <text x="740" y="435" fill="#1D4ED8" text-anchor="start">Consume</text>
    <text x="709" y="460" fill="#1D4ED8" text-anchor="start">InventoryReserved</text>
    <text x="730" y="568" fill="#1D4ED8" text-anchor="start">Publish</text>
    <text x="700" y="593" fill="#1D4ED8" text-anchor="start">PaymentProcessed</text>
    <text x="190" y="462" fill="#1D4ED8" text-anchor="start">Consume</text>
