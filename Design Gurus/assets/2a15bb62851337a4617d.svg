    <text x="709" y="512" fill="#BE185D" text-anchor="start">PaymentFailed</text>
    <text x="718" y="268" fill="#BE185D" text-anchor="start">PaymentFailed:</text>
    <text x="718" y="293" fill="#BE185D" text-anchor="start">release the stock</text>
  </g>

