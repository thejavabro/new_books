<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="means-title means-desc">
<title id="means-title">What the pivot means</title>
<desc id="means-desc">Not a change of subject. The interview arriving at the part being assessed, which candidates who treat it as an interruption lose the signal to.</desc>
<defs>
<marker id="means-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="means-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="means-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="means-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="720" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the pivot means</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The interview arriving at the part that is actually being assessed.</text>
<rect x="40" y="642" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="642" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="60" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="60" rx="2.5" fill="#AC8BE8"/><text x="64" y="154" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A pivot is the interviewer telling you where the remaining points are</text>
<circle cx="60" cy="228" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="235" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="198" width="428" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="220.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">They found what they can</text><text x="306" y="247.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">evaluate you on</text>
<path d="M526 228H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 228H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#means-marker-slate)"/>
<rect x="570" y="198" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="234" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">usually their own area, or where the hard decisions live</text>
<circle cx="60" cy="300" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="307" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="270" width="428" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="292.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">They are checking</text><text x="306" y="319.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">understood against recited</text>
<path d="M526 300H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 300H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#means-marker-slate)"/>
<rect x="570" y="270" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="306" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a diagram can be memorized. The inside of a component cannot</text>
<circle cx="60" cy="372" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="379" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="342" width="428" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="378" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">They are giving you the floor</text>
<path d="M526 372H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 372H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#means-marker-slate)"/>
<rect x="570" y="342" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="365.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the most generous moment in the interview,</text><text x="590" y="390.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">frequently read as the most threatening</text>
<rect x="40" y="424" width="560" height="92" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="424" width="5" height="92" rx="2.5" fill="#F28B9D"/><text x="64" y="450" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Too shallow</text><text x="64" y="476" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">two sentences and back to the overview.</text><text x="64" y="502" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Reads as not having the depth</text>
<rect x="640" y="424" width="560" height="92" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="424" width="5" height="92" rx="2.5" fill="#F28B9D"/><text x="664" y="450" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Too deep</text><text x="664" y="476" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">twelve minutes inside one mechanism,</text><text x="664" y="502" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">losing the design it was supporting</text>
<rect x="40" y="540" width="1160" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="540" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="64" y="571" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The skill is going deep while keeping the connection to the whole visible.</text><text x="64" y="597" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">That is a structural problem, not a knowledge problem.</text>
<text x="66" y="676" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Both failure modes are common, and they are symmetrical.</text>
</svg>