<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1380" viewBox="0 0 1240 1380" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Notification pipeline: any service posts to an ingestion API that returns 202 Accepted and enqueues onto a routing queue, a preferences plus routing plus rendering stage expands each request into transactional and bulk queues per channel, and the email, SMS and push senders each drain their own queue into third party providers.">
  <defs>
    <marker id="m07-l09-notification-pipeline-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l09-notification-pipeline-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l09-notification-pipeline-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m07-l09-notification-pipeline-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1380" fill="#FFFFFF"/>

  <rect x="40" y="110" width="1160" height="210" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="152" font-size="20" font-weight="600" fill="#1E3A8A">Synchronous ingress: the only part a caller waits for</text>
  <text x="1180" y="152" text-anchor="end" font-size="20" fill="#64748B">transactional in seconds, bulk in minutes</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <rect x="70" y="180" width="280" height="110" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="210" y="242" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Any service</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <rect x="470" y="175" width="320" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="630" y="226" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Ingestion API</text>
  <text x="630" y="258" text-anchor="middle" font-size="20" fill="#64748B">it accepts, it does not send</text>

  <rect x="40" y="370" width="1160" height="830" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="412" font-size="20" font-weight="600" fill="#92400E">Queue-centric spine: a queue between every stage</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <path d="M440,490 L440,580 A190,20 0 0 0 820,580 L820,490" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="630" cy="490" rx="190" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="630" y="542" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Routing queue</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <rect x="70" y="470" width="340" height="140" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="240" y="515" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One queue, four jobs</text>
  <text x="240" y="547" text-anchor="middle" font-size="20" fill="#475569">durability, time decoupling,</text>
  <text x="240" y="579" text-anchor="middle" font-size="20" fill="#475569">load leveling, and scaling</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <rect x="850" y="470" width="320" height="140" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="1010" y="499" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Two tiers per channel</text>
  <text x="1010" y="531" text-anchor="middle" font-size="20" fill="#475569">senders drain transactional</text>
  <text x="1010" y="563" text-anchor="middle" font-size="20" fill="#475569">first, so a campaign never</text>
  <text x="1010" y="595" text-anchor="middle" font-size="20" fill="#475569">delays a password reset</text>

  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <rect x="70" y="670" width="1100" height="120" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="620" y="737" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Preferences, then routing, then rendering</text>

  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <path d="M70,900 L70,990 A170,20 0 0 0 410,990 L410,900" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="240" cy="900" rx="170" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="240" y="952" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Email queues</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <path d="M450,900 L450,990 A170,20 0 0 0 790,990 L790,900" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="620" cy="900" rx="170" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="620" y="952" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">SMS queues</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <path d="M830,900 L830,990 A170,20 0 0 0 1170,990 L1170,900" fill="#FDE68A" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="1000" cy="900" rx="170" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1000" y="952" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Push queues</text>

  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <rect x="70" y="1060" width="340" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="240" y="1111" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Email sender</text>
  <text x="240" y="1143" text-anchor="middle" font-size="20" fill="#64748B">to provider A or B</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <rect x="450" y="1060" width="340" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="620" y="1111" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">SMS sender</text>
  <text x="620" y="1143" text-anchor="middle" font-size="20" fill="#64748B">to provider A or B</text>
  <g filter="url(#m07-l09-notification-pipeline-soft)">
    <rect x="830" y="1060" width="340" height="120" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1000" y="1111" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Push sender</text>
  <text x="1000" y="1143" text-anchor="middle" font-size="20" fill="#64748B">to APNs or FCM</text>

  <g fill="none" stroke-width="2.5">
    <path d="M350,210 L462,210" stroke="#3B82F6" marker-end="url(#m07-l09-notification-pipeline-bl)"/>
    <path d="M462,262 L350,262" stroke="#059669" stroke-dasharray="6 5" marker-end="url(#m07-l09-notification-pipeline-em)"/>
    <path d="M630,295 L630,462" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l09-notification-pipeline-am)"/>
    <path d="M630,600 L630,662" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l09-notification-pipeline-am)"/>
    <path d="M240,790 L240,872" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l09-notification-pipeline-am)"/>
    <path d="M620,790 L620,872" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l09-notification-pipeline-am)"/>
    <path d="M1000,790 L1000,872" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l09-notification-pipeline-am)"/>
    <path d="M240,1010 L240,1052" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l09-notification-pipeline-bl)"/>
    <path d="M620,1010 L620,1052" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l09-notification-pipeline-bl)"/>
    <path d="M1000,1010 L1000,1052" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l09-notification-pipeline-bl)"/>
  </g>

  <text x="411" y="195" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the request</text>
  <text x="406" y="292" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">202 Accepted</text>
  <text x="650" y="440" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">queued, not delivered</text>

  <line x1="60" y1="1260" x2="96" y2="1260" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1267" font-size="20" fill="#475569">A synchronous call: the caller is waiting</text>
  <line x1="60" y1="1300" x2="96" y2="1300" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1307" font-size="20" fill="#475569">202 Accepted: queued, not delivered</text>
  <line x1="60" y1="1340" x2="96" y2="1340" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1347" font-size="20" fill="#475569">A queue hop: each stage drains at its own rate</text>
</svg>