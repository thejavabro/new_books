<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">A reply waits for its parent, not for every comment</title><desc id="desc">A pending reply waits until its parent has a confirmed server identity. If the parent is rejected, the reply cannot be submitted under that parent; preserve recoverable text and explain the state. Independent comments in other threads can continue instead of waiting behind this dependency.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="940" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">A reply waits for its parent, not for every comment</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Record the dependency while both comments still have local identities.</text><rect x="50" y="195" width="330" height="180" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="235" font-size="24" fill="#2563eb" font-weight="700">Pending parent</text><text x="72" y="276" font-size="21" fill="#334155" font-weight="400">Save the parent operation</text><text x="72" y="307" font-size="21" fill="#334155" font-weight="400">and its local identity.</text><rect x="435" y="195" width="330" height="180" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="457" y="235" font-size="24" fill="#059669" font-weight="700">Parent confirmed</text><text x="457" y="276" font-size="21" fill="#334155" font-weight="400">Record the server parent ID</text><text x="457" y="307" font-size="21" fill="#334155" font-weight="400">on the existing local record.</text><rect x="820" y="195" width="330" height="180" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="842" y="235" font-size="24" fill="#059669" font-weight="700">Submit its reply</text><text x="842" y="276" font-size="21" fill="#334155" font-weight="400">Use the confirmed parent ID.</text><text x="842" y="307" font-size="21" fill="#334155" font-weight="400">Keep the reply’s own</text><text x="842" y="338" font-size="21" fill="#334155" font-weight="400">operation identity.</text><path d="M388 285 H427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M773 285 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="435" y="465" width="330" height="170" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="457" y="505" font-size="24" fill="#c2410c" font-weight="700">Parent rejected</text><text x="457" y="546" font-size="21" fill="#334155" font-weight="400">No valid server parent ID</text><text x="457" y="577" font-size="21" fill="#334155" font-weight="400">was created.</text><rect x="820" y="465" width="330" height="170" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="505" font-size="24" fill="#c2410c" font-weight="700">Reply needs attention</text><text x="842" y="546" font-size="21" fill="#334155" font-weight="400">Do not send it unchanged.</text><text x="842" y="577" font-size="21" fill="#334155" font-weight="400">Explain the problem and</text><text x="842" y="608" font-size="21" fill="#334155" font-weight="400">preserve recoverable text.</text><path d="M215 383 V550 H427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M773 550 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="725" width="1100" height="145" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="765" font-size="24" fill="#7c3aed" font-weight="700">Independent thread</text><text x="72" y="806" font-size="21" fill="#334155" font-weight="400">A comment in another thread has no dependency on this parent.</text><text x="72" y="837" font-size="21" fill="#334155" font-weight="400">Its eligible work can continue under its own ordering and retry rules.</text></g></svg>