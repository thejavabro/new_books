<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="954" viewBox="0 0 1240 954" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every claim passes entailment, citation existence, and a treatment re-check before it renders; a failed claim is stripped with a note, retried once, or replaced by research pointers">
  <defs>
    <marker id="c8lg3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c8lg3-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="c8lg3-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="c8lg3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c8lg3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c8lg3-k1"><rect x="64" y="261" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="c8lg3-k2"><rect x="420" y="146" width="270" height="76" rx="12"/></clipPath>
    <clipPath id="c8lg3-k3"><rect x="420" y="268" width="270" height="76" rx="12"/></clipPath>
    <clipPath id="c8lg3-k4"><rect x="420" y="390" width="270" height="76" rx="12"/></clipPath>
    <clipPath id="c8lg3-k5"><rect x="860" y="261" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c8lg3-k6"><rect x="96" y="664" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="c8lg3-k7"><rect x="500" y="664" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="c8lg3-k8"><rect x="820" y="664" width="333" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="954" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1160" height="784" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">Before display: the attorney waits for every check</text>
  <rect x="390" y="96" width="330" height="419" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="414" y="126" font-size="16.5" font-weight="600" fill="#374151">Three synchronous checks</text>
  <rect x="64" y="590" width="1112" height="210" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="88" y="620" font-size="16.5" font-weight="600" fill="#374151">If any check fails</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M350,306 H390" marker-end="url(#c8lg3-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M720,306 H860" marker-end="url(#c8lg3-memerald)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M428,515 V590" marker-end="url(#c8lg3-mpink)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M730,709 H820" marker-end="url(#c8lg3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 5"><path d="M680,664 V515" marker-end="url(#c8lg3-mslate)"/></g>
  <g filter="url(#c8lg3-soft)">
    <rect x="64" y="261" width="286" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="261" width="6" height="90" fill="#2563EB" clip-path="url(#c8lg3-k1)"/>
  </g>
  <circle cx="102" cy="306" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,295.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="128" y="313" font-size="18.5" font-weight="600" fill="#111827">One claim</text>
  <text x="207" y="376" font-size="15.5" text-anchor="middle" fill="#6B7280">with a pinpoint citation and a quoted passage</text>
  <g filter="url(#c8lg3-soft)">
    <rect x="420" y="146" width="270" height="76" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="420" y="146" width="6" height="76" fill="#4F46E5" clip-path="url(#c8lg3-k2)"/>
  </g>
  <circle cx="458" cy="184" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,173.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="484" y="191" font-size="18.5" font-weight="600" fill="#111827">Per-claim entailment</text>
  <text x="555" y="247" font-size="15.5" text-anchor="middle" fill="#6B7280">does the quote entail the claim?</text>
  <g filter="url(#c8lg3-soft)">
    <rect x="420" y="268" width="270" height="76" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="420" y="268" width="6" height="76" fill="#4F46E5" clip-path="url(#c8lg3-k3)"/>
  </g>
  <circle cx="458" cy="306" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,295.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="484" y="313" font-size="18.5" font-weight="600" fill="#111827">Citation existence</text>
  <text x="555" y="369" font-size="15.5" text-anchor="middle" fill="#6B7280">document, page, and quote are real</text>
  <g filter="url(#c8lg3-soft)">
    <rect x="420" y="390" width="270" height="76" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="420" y="390" width="6" height="76" fill="#4F46E5" clip-path="url(#c8lg3-k4)"/>
  </g>
  <circle cx="458" cy="428" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,417.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="484" y="435" font-size="18.5" font-weight="600" fill="#111827">Treatment re-check</text>
  <text x="555" y="491" font-size="15.5" text-anchor="middle" fill="#6B7280">the case was not overturned</text>
  <g filter="url(#c8lg3-soft)">
    <rect x="860" y="261" width="280" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="860" y="261" width="6" height="90" fill="#059669" clip-path="url(#c8lg3-k5)"/>
  </g>
  <circle cx="898" cy="306" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,295.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="924" y="313" font-size="18.5" font-weight="600" fill="#111827">Claim renders</text>
  <text x="1000" y="376" font-size="15.5" text-anchor="middle" fill="#6B7280">link built from a document ID</text>
  <g filter="url(#c8lg3-soft)">
    <rect x="96" y="664" width="260" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="96" y="664" width="6" height="90" fill="#D97706" clip-path="url(#c8lg3-k6)"/>
  </g>
  <circle cx="134" cy="709" r="18" fill="#FFFFFF"/>
  <g transform="translate(123.56,698.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="96" y="652" font-size="15.5" font-weight="600" fill="#6B7280">not central</text>
  <text x="160" y="716" font-size="18.5" font-weight="600" fill="#111827">Strip with a note</text>
  <text x="226" y="779" font-size="15.5" text-anchor="middle" fill="#6B7280">the answer says one point was removed</text>
  <g filter="url(#c8lg3-soft)">
    <rect x="500" y="664" width="230" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="500" y="664" width="6" height="90" fill="#D97706" clip-path="url(#c8lg3-k7)"/>
  </g>
  <circle cx="538" cy="709" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,698.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="500" y="652" font-size="15.5" font-weight="600" fill="#6B7280">central</text>
  <text x="564" y="716" font-size="18.5" font-weight="600" fill="#111827">Retry once</text>
  <text x="615" y="779" font-size="15.5" text-anchor="middle" fill="#6B7280">tighter instructions name the failed claim</text>
  <g filter="url(#c8lg3-lift)">
    <rect x="820" y="664" width="333" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="820" y="664" width="9" height="90" fill="#DB2777" clip-path="url(#c8lg3-k8)"/>
  </g>
  <circle cx="858" cy="709" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,698.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="884" y="716" font-size="18.5" font-weight="600" fill="#111827">Refuse with research pointers</text>
  <text x="986.5" y="779" font-size="15.5" text-anchor="middle" fill="#6B7280">authorities found, each with its quote</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="790" y="292" fill="#047857">all three pass</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="416" y="558" fill="#BE185D">any check fails</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="775" y="695" fill="#475569">retry fails</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="694" y="558" fill="#475569">checked the same way</text></g>
  <rect x="40" y="854" width="1160" height="60" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="889.5" text-anchor="middle" font-size="15.5" fill="#374151">No claim reaches the attorney without passing all three checks.</text>
</svg>