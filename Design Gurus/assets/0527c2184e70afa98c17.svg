<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="caching-title caching-desc">
<title id="caching-title">Four levels of caching</title>
<desc id="caching-desc">Prompt caching changes the cost model rather than trimming it, and the design consequences are specific and easy to get wrong.</desc>
<defs>
<marker id="caching-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="caching-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="caching-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="caching-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="902" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four levels of caching</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Prompt caching changes the cost model rather than trimming it.</text>
<rect x="40" y="824" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="824" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="62" cy="146" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="62" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Exact response</text>
<path d="M536 146H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 146H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#caching-marker-slate)"/>
<rect x="580" y="118" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the same input, served without calling the model</text>
<circle cx="62" cy="214" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="62" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Prefix or prompt</text>
<path d="M536 214H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 214H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#caching-marker-slate)"/>
<rect x="580" y="186" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="207.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the processed state of a long shared prefix.</text><text x="600" y="232.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The best economics</text>
<circle cx="62" cy="282" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="62" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="440" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Semantic</text>
<path d="M536 282H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 282H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#caching-marker-slate)"/>
<rect x="580" y="254" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="275.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a near-identical question. Powerful, and a wrong</text><text x="600" y="300.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">hit answers a question nobody asked</text>
<circle cx="62" cy="350" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="62" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Retrieval</text>
<path d="M536 350H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 350H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#caching-marker-slate)"/>
<rect x="580" y="322" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="343.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the embedding and the passages, which are</text><text x="600" y="368.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">pure overhead to recompute</text>
<rect x="40" y="408" width="560" height="48" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="56" y="439" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">cache write</text><text x="584" y="439" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">somewhat more than ordinary input</text>
<rect x="640" y="408" width="560" height="48" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="656" y="439" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">cache read</text><text x="1184" y="439" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">a small fraction of ordinary input</text>
<text x="40" y="494" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The design consequences are specific and easy to get wrong</text>
<rect x="40" y="512" width="490" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="285" y="546" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Put the stable content first</text>
<path d="M536 540H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 540H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#caching-marker-slate)"/>
<rect x="580" y="512" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="546" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the cached prefix has to be an actual prefix</text>
<rect x="40" y="580" width="490" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="285" y="614" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep it warm or pay the write</text>
<path d="M536 608H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 608H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#caching-marker-slate)"/>
<rect x="580" y="580" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="614" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sparse traffic against a short lifetime can be worse off</text>
<rect x="40" y="648" width="490" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="285" y="682" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One token at the front invalidates all</text>
<path d="M536 676H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 676H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#caching-marker-slate)"/>
<rect x="580" y="648" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="682" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a timestamp early in the prompt disables the whole mechanism</text>
<rect x="40" y="728" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="728" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="769" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Most implementations use one level of caching when four exist.</text>
<text x="66" y="858" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Lifetimes are measured in minutes, and short prompts cannot be cached at all.</text>
</svg>