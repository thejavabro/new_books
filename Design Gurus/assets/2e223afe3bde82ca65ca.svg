<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="How a naive retry turns a small outage into a large one, and the three settings that prevent it. Retrying multiplies the load on a service that is already struggling, every caller retries in step because they all failed at the same moment, and the service never gets a quiet moment to recover. Backoff, jitter and a retry budget each remove one of those">
  <defs>
    <marker id="rt2-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="rt2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rt2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rt2-p1"><rect x="72" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="rt2-p2"><rect x="455" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="rt2-p3"><rect x="838" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="rt2-s1"><rect x="72" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="rt2-s2"><rect x="455" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="rt2-s3"><rect x="838" y="398" width="330" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">A naive retry turns a small outage into a large one</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#047857">Three settings, one for each</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M237,296 L237,394" marker-end="url(#rt2-em)"/>
    <path d="M620,296 L620,394" marker-end="url(#rt2-em)"/>
    <path d="M1003,296 L1003,394" marker-end="url(#rt2-em)"/>
  </g>

  <g filter="url(#rt2-soft)">
    <rect x="72" y="112" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#rt2-p1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">The Load Multiplies</text>
  <text x="237" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">3 retries turn 100 calls into 400</text>
  <text x="237" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">aimed at an already struggling service</text>

  <g filter="url(#rt2-soft)">
    <rect x="455" y="112" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="455" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#rt2-p2)"/>
  </g>
  <circle cx="493" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="519" y="164" font-size="18.5" font-weight="600" fill="#111827">Everyone Retries At Once</text>
  <text x="620" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">they all failed at the same moment</text>
  <text x="620" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">so they all come back together</text>

  <g filter="url(#rt2-lift)">
    <rect x="838" y="112" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="838" y="112" width="9" height="90" fill="#DB2777" clip-path="url(#rt2-p3)"/>
  </g>
  <circle cx="876" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="902" y="164" font-size="18.5" font-weight="600" fill="#111827">It Never Recovers</text>
  <text x="1003" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">it gets no quiet moment to catch up</text>
  <text x="1003" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">the retries keep it down</text>

  <g filter="url(#rt2-lift)">
    <rect x="72" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="72" y="398" width="9" height="90" fill="#059669" clip-path="url(#rt2-s1)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Exponential Backoff</text>
  <text x="237" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">each wait doubles</text>
  <text x="237" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">so the pressure drops fast</text>

  <g filter="url(#rt2-soft)">
    <rect x="455" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="455" y="398" width="6" height="90" fill="#059669" clip-path="url(#rt2-s2)"/>
  </g>
  <circle cx="493" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="519" y="450" font-size="18.5" font-weight="600" fill="#111827">Jitter</text>
  <text x="620" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">a small random amount per caller</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">spreads the retries apart</text>

  <g filter="url(#rt2-soft)">
    <rect x="838" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="838" y="398" width="6" height="90" fill="#059669" clip-path="url(#rt2-s3)"/>
  </g>
  <circle cx="876" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="902" y="450" font-size="18.5" font-weight="600" fill="#111827">A Retry Budget</text>
  <text x="1003" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">cap retries at a share of traffic</text>
  <text x="1003" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">say 10 percent, then stop</text>

  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The trap</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">retries feel free to the caller, but every one of them is real work for a service that is already failing</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Use with a breaker</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">a circuit breaker in front of the retry stops the attempts entirely once the service is clearly down</text>
</svg>