<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Retries in serverless functions: an event source such as a queue or stream invokes a function asynchronously or by polling; the function either succeeds or fails, and after a failure the platform retries the invocation after a delay. Idempotency prevents duplicate effects from retries and duplicate deliveries: the function runs an idempotent operation that claims the key with a conditional write and skips only if the earlier run completed, so the database receives no duplicate changes">
  <defs>
    <filter id="m15m-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m15m-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m15m-k1"><rect x="84" y="220" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="m15m-k2"><rect x="444" y="220" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m15m-k3"><rect x="834" y="220" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="m15m-k4"><rect x="444" y="400" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m15m-k5"><rect x="84" y="725" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="m15m-k6"><rect x="428" y="720" width="404" height="90" rx="12"/></clipPath>
    <marker id="m15m-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m15m-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m15m-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Retries and idempotency in serverless functions</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The platform retries failed asynchronous and poll-based invocations, so each function must be safe to run more than once.</text>

  <rect x="40" y="120" width="1160" height="400" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Retries in serverless functions</text>
  <rect x="40" y="550" width="1160" height="330" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="580" font-size="19.5" font-weight="600" fill="#047857">Idempotency prevents duplicate effects</text>
  <rect x="404" y="670" width="452" height="170" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="428" y="700" font-size="19.5" font-weight="600" fill="#047857">Idempotent operation</text>

  <g fill="none" stroke-width="2">
    <path d="M324,265 H444" stroke="#2563EB" marker-end="url(#m15m-m-blue)"/>
    <path d="M644,250 H834" stroke="#059669" marker-end="url(#m15m-m-emerald)"/>
    <path d="M544,310 V400" stroke="#DB2777" marker-end="url(#m15m-m-pink)"/>
    <path d="M644,445 H700 Q712,445 712,433 V292 Q712,280 700,280 H644" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m15m-m-blue)"/>
    <path d="M284,770 H404" stroke="#059669" marker-end="url(#m15m-m-emerald)"/>
    <path d="M856,770 H960" stroke="#059669" marker-end="url(#m15m-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="726" y="368" fill="#1D4ED8" text-anchor="start">Retry after delay</text>
  </g>

  <g filter="url(#m15m-soft)">
    <rect x="84" y="220" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="220" width="6" height="90" fill="#2563EB" clip-path="url(#m15m-k1)"/>
  </g>
  <circle cx="122" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,254.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="148" y="272" font-size="21.5" font-weight="600" fill="#111827">Event source</text>
  <text x="204" y="339" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, queue, stream)</text>
  <g filter="url(#m15m-soft)">
    <rect x="444" y="220" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="444" y="220" width="6" height="90" fill="#7C3AED" clip-path="url(#m15m-k2)"/>
  </g>
  <circle cx="482" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(471.56,254.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="508" y="272" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g filter="url(#m15m-soft)">
    <rect x="834" y="220" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="834" y="220" width="6" height="90" fill="#059669" clip-path="url(#m15m-k3)"/>
  </g>
  <circle cx="872" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(861.56,254.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="898" y="272" font-size="21.5" font-weight="600" fill="#111827">Success</text>
  <g filter="url(#m15m-soft)">
    <rect x="444" y="400" width="200" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="444" y="400" width="6" height="90" fill="#DB2777" clip-path="url(#m15m-k4)"/>
  </g>
  <circle cx="482" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(471.56,434.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="508" y="452" font-size="21.5" font-weight="600" fill="#111827">Failure</text>
  <g filter="url(#m15m-soft)">
    <rect x="84" y="725" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="84" y="725" width="6" height="90" fill="#7C3AED" clip-path="url(#m15m-k5)"/>
  </g>
  <circle cx="122" cy="770" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,759.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="148" y="777" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g filter="url(#m15m-soft)">
    <rect x="428" y="720" width="404" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="428" y="720" width="6" height="90" fill="#059669" clip-path="url(#m15m-k6)"/>
  </g>
  <circle cx="466" cy="765" r="18" fill="#FFFFFF"/>
  <g transform="translate(455.56,754.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="492" y="760.75" font-size="18.5" font-weight="600" fill="#111827">Claim the key with a conditional write</text>
  <text x="492" y="783.25" font-size="18.5" font-weight="600" fill="#111827">Skip only if the earlier run completed</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M960,715 L960,799 A100,16 0 0 0 1160,799 L1160,715" fill="#DBEAFE"/>
    <ellipse cx="1060" cy="715" rx="100" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1060" y="772" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="1060" y="849" font-size="18.5" text-anchor="middle" fill="#6B7280">(no duplicate changes)</text>
  <text x="64" y="180" font-size="18.5" fill="#6B7280">If an asynchronous or poll-based invocation fails, the platform automatically retries it after a delay.</text>
  <text x="64" y="610" font-size="18.5" fill="#6B7280">Retries and duplicate deliveries from event sources can run a function more than once</text>
  <text x="64" y="637" font-size="18.5" fill="#6B7280">for one event, so operations must be idempotent to avoid duplicate changes.</text>




</svg>