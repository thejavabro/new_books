<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="inventory-title inventory-desc">
<title id="inventory-title">The access pattern inventory</title>
<desc id="inventory-desc">Every way the data will be read and written, each with an entry point, a result shape, a frequency and a latency target. The list is the design document, and a schema is derived from it rather than the other way round.</desc>
<defs>
<marker id="inventory-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="inventory-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="inventory-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="inventory-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="736" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The access pattern inventory</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Write down every way the data will be read and written, and for each one record four things.</text>
<rect x="40" y="658" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="658" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The entry point</text>
<path d="M566 146H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 146H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#inventory-marker-slate)"/>
<rect x="610" y="118" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what value the caller already has</text>
<circle cx="60" cy="214" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="470" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What comes back</text>
<path d="M566 214H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 214H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#inventory-marker-slate)"/>
<rect x="610" y="186" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one item, a bounded list, an aggregate</text>
<circle cx="60" cy="282" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="470" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How often</text>
<path d="M566 282H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 282H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#inventory-marker-slate)"/>
<rect x="610" y="254" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an order of magnitude is enough</text>
<circle cx="60" cy="350" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="470" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How fast</text>
<path d="M566 350H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 350H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#inventory-marker-slate)"/>
<rect x="610" y="322" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if anybody is actually waiting</text>
<text x="40" y="418" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The second use, which is worth more than the first</text>
<rect x="40" y="436" width="560" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="463.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">If you cannot fill it in, you do not</text><text x="320" y="490.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">yet know enough to model</text>
<rect x="640" y="436" width="560" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="463.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"I do not know how this will be</text><text x="920" y="490.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">queried" is a legitimate finding</text>
<rect x="40" y="530" width="560" height="100" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="530" width="5" height="100" rx="2.5" fill="#5EC9EC"/><text x="64" y="571.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">That list is the actual design document.</text><text x="64" y="600.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">The schema comes after it.</text>
<rect x="640" y="530" width="560" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="530" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="664" y="557" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">The goal for every pattern</text><text x="664" y="586" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">One request, one partition, no filtering</text><text x="664" y="615" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">in the application.</text>
<text x="66" y="692" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An empty inventory argues for the relational default rather than for guessing.</text>
</svg>