<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Reliability and availability are independent, so all four combinations exist: available but not reliable, available and reliable, neither, and reliable but not available.">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="kd6-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="kd6-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="kd6-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="kd6-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="kd6-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="kd6-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="kd6-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="kd6-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Available means it answered. Reliable means the answer was correct.</text>
  <g filter="url(#kd6-soft)"><rect x="190" y="84" width="490" height="224" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="216" y="128" font-size="22" font-weight="700" fill="#B45309" text-anchor="start">Available, but not reliable</text>
  <text x="216" y="168" font-size="19" fill="#64748B" text-anchor="start">It always answers, and some of</text>
  <text x="216" y="198" font-size="19" fill="#64748B" text-anchor="start">the answers are wrong.</text>
  <text x="216" y="258" font-size="19" fill="#64748B" text-anchor="start">Example: a cache that keeps</text>
  <text x="216" y="288" font-size="19" fill="#64748B" text-anchor="start">returning old data.</text>
  <g filter="url(#kd6-soft)"><rect x="700" y="84" width="490" height="224" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="726" y="128" font-size="22" font-weight="700" fill="#065F46" text-anchor="start">Available and reliable</text>
  <text x="726" y="168" font-size="19" fill="#64748B" text-anchor="start">It answers, and the answers</text>
  <text x="726" y="198" font-size="19" fill="#64748B" text-anchor="start">are correct.</text>
  <text x="726" y="258" font-size="19" fill="#64748B" text-anchor="start">This is what you are trying</text>
  <text x="726" y="288" font-size="19" fill="#64748B" text-anchor="start">to build.</text>
  <g filter="url(#kd6-soft)"><rect x="190" y="340" width="490" height="224" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="216" y="384" font-size="22" font-weight="700" fill="#B91C1C" text-anchor="start">Neither</text>
  <text x="216" y="424" font-size="19" fill="#64748B" text-anchor="start">It is down often, and it is</text>
  <text x="216" y="454" font-size="19" fill="#64748B" text-anchor="start">wrong when it is running.</text>
  <text x="216" y="514" font-size="19" fill="#64748B" text-anchor="start">Example: one copy of the data</text>
  <text x="216" y="544" font-size="19" fill="#64748B" text-anchor="start">and no way to check it.</text>
  <g filter="url(#kd6-soft)"><rect x="700" y="340" width="490" height="224" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="726" y="384" font-size="22" font-weight="700" fill="#1E40AF" text-anchor="start">Reliable, but not available</text>
  <text x="726" y="424" font-size="19" fill="#64748B" text-anchor="start">It is correct every time it runs,</text>
  <text x="726" y="454" font-size="19" fill="#64748B" text-anchor="start">but it does not run all day.</text>
  <text x="726" y="514" font-size="19" fill="#64748B" text-anchor="start">Example: a job that runs only</text>
  <text x="726" y="544" font-size="19" fill="#64748B" text-anchor="start">at night, by design.</text>
  <path d="M170 84 V564" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="150" y="100" font-size="18" fill="#64748B" text-anchor="end">yes</text>
  <text x="150" y="556" font-size="18" fill="#64748B" text-anchor="end">no</text>
  <text x="118" y="324" font-size="18" font-weight="600" fill="#64748B" text-anchor="middle" transform="rotate(-90 118 324)">AVAILABLE</text>
  <path d="M190 584 H1180" fill="none" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="435" y="616" font-size="18" fill="#64748B" text-anchor="middle">no</text>
  <text x="945" y="616" font-size="18" fill="#64748B" text-anchor="middle">yes</text>
  <text x="620" y="654" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">RELIABLE</text>
</svg>