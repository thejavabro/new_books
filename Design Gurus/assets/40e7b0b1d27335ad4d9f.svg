<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="High-level Dropbox design where clients exchange file chunks with block servers backed by cloud storage, read and update metadata through metadata servers backed by a metadata database, and receive change notifications from synchronization servers.">
  <defs>
    <marker id="dbx02-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="dbx02-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="dbx02-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="dbx02-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="dbx02-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="dbx02-k1"><rect x="60" y="250" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="dbx02-k2"><rect x="430" y="80" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="dbx02-k3"><rect x="430" y="250" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="dbx02-k4"><rect x="430" y="420" width="320" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2">
    <path d="M145,250 V137 Q145,125 157,125 H430" stroke="#DB2777" marker-end="url(#dbx02-pk)"/>
    <path d="M750,125 L1000,125" stroke="#DB2777" marker-end="url(#dbx02-pk)"/>
    <path d="M230,270 L430,270" stroke="#2563EB" marker-end="url(#dbx02-bl)"/>
    <path d="M750,295 L1000,295" stroke="#7C3AED" marker-end="url(#dbx02-vi)"/>
    <path d="M730,340 L730,420" stroke="#7C3AED" marker-end="url(#dbx02-vi)"/>
    <path d="M430,465 H302 Q290,465 290,453 V334 Q290,322 278,322 H230" stroke="#059669" marker-end="url(#dbx02-em)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="293" y="115" fill="#BE185D">upload / download chunks</text>
    <text x="330" y="260" fill="#1D4ED8">read / update metadata</text>
    <text x="742" y="386" fill="#5B21B6" text-anchor="start">changes to broadcast</text>
    <text x="304" y="392" fill="#047857" text-anchor="start">change notifications</text>
  </g>

  
  <g filter="url(#dbx02-soft)">
    <rect x="60" y="250" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="250" width="6" height="90" fill="#2563EB" clip-path="url(#dbx02-k1)"/>
  </g>
  <circle cx="98" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,284.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="124" y="302" font-size="18.5" font-weight="600" fill="#111827">Clients</text>
  <text x="145" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">desktop, mobile, web</text>

  
  <g filter="url(#dbx02-soft)">
    <rect x="430" y="80" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="430" y="80" width="6" height="90" fill="#DB2777" clip-path="url(#dbx02-k2)"/>
  </g>
  <circle cx="468" cy="125" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,114.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="494" y="132" font-size="18.5" font-weight="600" fill="#111827">Block Servers</text>
  <text x="590" y="195" font-size="15.5" text-anchor="middle" fill="#6B7280">move file chunks with clients</text>

  
  <g filter="url(#dbx02-soft)">
    <rect x="430" y="250" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="430" y="250" width="6" height="90" fill="#7C3AED" clip-path="url(#dbx02-k3)"/>
  </g>
  <circle cx="468" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,284.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="494" y="302" font-size="18.5" font-weight="600" fill="#111827">Metadata Servers</text>
  <text x="590" y="365" font-size="15.5" text-anchor="middle" fill="#6B7280">file names, versions, chunk lists</text>

  
  <g filter="url(#dbx02-soft)">
    <rect x="430" y="420" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="430" y="420" width="6" height="90" fill="#059669" clip-path="url(#dbx02-k4)"/>
  </g>
  <circle cx="468" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,454.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 4v6h-6"/>
    <path d="M3 20v-6h6"/>
    <path d="M20.5 10a8.5 8.5 0 0 0-14.5-4.5L3 8"/>
    <path d="M3.5 14a8.5 8.5 0 0 0 14.5 4.5L21 16"/>
  </g>
  <text x="494" y="472" font-size="18.5" font-weight="600" fill="#111827">Synchronization Servers</text>
  <text x="590" y="535" font-size="15.5" text-anchor="middle" fill="#6B7280">notify clients about changes</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M1000,85 L1000,159 A85,16 0 0 0 1170,159 L1170,85" fill="#FEF3C7"/>
    <ellipse cx="1085" cy="85" rx="85" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1085" y="135" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Cloud Storage</text>
  <text x="1085" y="200" font-size="15.5" text-anchor="middle" fill="#6B7280">the chunks themselves</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M1000,255 L1000,329 A85,16 0 0 0 1170,329 L1170,255" fill="#EDE9FE"/>
    <ellipse cx="1085" cy="255" rx="85" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1085" y="305" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Metadata DB</text>

  
  <rect x="40" y="585" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="630" text-anchor="middle" font-size="16" fill="#475569">Block servers move file data, metadata servers answer lookups, and the synchronization servers tell every other device that something changed.</text>
</svg>