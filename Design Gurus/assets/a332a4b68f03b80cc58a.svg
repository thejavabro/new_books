<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="guard-title guard-desc">
<title id="guard-title">The version guard</title>
<desc id="guard-desc">A single guarded update is both idempotent and order-safe. A duplicate fails the condition because the versions are equal, and a message that arrives late fails it because its version is lower.</desc>
<defs>
<marker id="guard-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="guard-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="guard-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="guard-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="736" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The version guard</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A single guarded update is both idempotent and order-safe.</text>
<rect x="40" y="658" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="658" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="1160" height="150" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V262A6 6 0 0 0 46 268H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">The cheapest correct consumer you can write</text>
<rect x="70" y="174" width="1100" height="76" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="90" y="205" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">UPDATE orders SET status = :new_status, version = :incoming</text><text x="90" y="231" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">  WHERE id = :id AND version &lt; :incoming</text>
<text x="40" y="310" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What the condition does with each case</text>
<rect x="40" y="328" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="362" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A duplicate</text>
<path d="M526 356H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 356H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#guard-marker-slate)"/>
<rect x="570" y="328" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="362" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">versions are now equal, so version &lt; incoming is false</text>
<rect x="40" y="396" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="430" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A stale message</text>
<path d="M526 424H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 424H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#guard-marker-slate)"/>
<rect x="570" y="396" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="430" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">its version is lower, so the condition fails</text>
<rect x="40" y="464" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="498" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A genuine update</text>
<path d="M526 492H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 492H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#guard-marker-slate)"/>
<rect x="570" y="464" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="498" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">its version is higher, so it applies</text>
<rect x="40" y="548" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="548" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="582.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">One statement, both properties.</text><text x="64" y="609.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Idempotent against duplicates, and safe against reordering.</text>
<text x="66" y="692" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Setting the value outright alone lets state move backwards. The version is what stops it.</text>
</svg>