<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="classify-title classify-desc">
<title id="classify-title">Find what does not scale linearly</title>
<desc id="classify-desc">The analysis is mechanical once you know what to look for. Classify every component by how it responds to ten times the load.</desc>
<defs>
<marker id="classify-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="classify-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="classify-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="classify-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="832" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Find what does not scale linearly</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The analysis is mechanical once you know what to look for.</text>
<rect x="40" y="754" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="754" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scales by adding instances</text>
<path d="M566 148H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 148H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classify-marker-slate)"/>
<rect x="610" y="118" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stateless services, replicas, workers, the</text><text x="630" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cache tier. The majority, and not the answer</text>
<circle cx="60" cy="220" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scales until a limit</text>
<path d="M566 220H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 220H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classify-marker-slate)"/>
<rect x="610" y="190" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a single primary, a partition count, a</text><text x="630" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">connection pool. Works at ten times with tuning</text>
<circle cx="60" cy="292" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="470" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Does not scale without redesign</text>
<path d="M566 292H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 292H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classify-marker-slate)"/>
<rect x="610" y="262" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a single coordination point, a global lock,</text><text x="630" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an operation touching all the data</text>
<circle cx="60" cy="364" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="470" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scales fine and becomes unaffordable</text>
<path d="M566 364H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 364H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classify-marker-slate)"/>
<rect x="610" y="334" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a per-request cost invisible at the original</text><text x="630" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">scale and dominant at ten times</text>
<rect x="40" y="412" width="560" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="444" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The third is the answer</text>
<rect x="640" y="412" width="560" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="920" y="444" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The fourth is the trap</text>
<text x="40" y="506" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three questions that find it quickly</text>
<rect x="40" y="524" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="560" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Where is there exactly one of something?</text>
<path d="M526 554H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 554H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classify-marker-slate)"/>
<rect x="570" y="524" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="547.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one primary, one leader, one coordinator, one</text><text x="590" y="572.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">partition key with no spread</text>
<rect x="40" y="596" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="632" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What operation touches everything?</text>
<path d="M526 626H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 626H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classify-marker-slate)"/>
<rect x="570" y="596" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="619.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a fan-out to all users, a full scan, a cross-shard</text><text x="590" y="644.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">join, a global index rebuild</text>
<rect x="40" y="668" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="704" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">What grows faster than linearly?</text>
<path d="M526 698H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 698H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classify-marker-slate)"/>
<rect x="570" y="668" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="691.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rare, and when one is present it is almost</text><text x="590" y="716.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">certainly the answer</text>
<text x="66" y="788" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Single things are where the ceiling is.</text>
</svg>