<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Detailed Twitter search design: a client reaches the application server through a load balancer, aggregator servers fan a query out to every index server partition and merge the sorted partial results, while the Index-Builder server keeps a reverse index so a dead index server can be rebuilt from the tweet databases.">
  <defs>
    <marker id="ts03-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="ts03-mv" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="ts03-ma" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="ts03-ms" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="ts03-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ts03-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ts03-k1"><rect x="60" y="60" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="ts03-k2"><rect x="330" y="60" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="ts03-k3"><rect x="660" y="60" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="ts03-k4"><rect x="660" y="290" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="ts03-k5"><rect x="94" y="556" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ts03-k6"><rect x="340" y="556" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ts03-k7"><rect x="586" y="556" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="ts03-k8"><rect x="880" y="740" width="286" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  
  <rect x="70" y="500" width="770" height="170" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="94" y="530" font-size="16.5" font-weight="600" fill="#5B21B6">Index Servers</text>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M230,105 H330" marker-end="url(#ts03-mb)"/>
    <path d="M544,105 H660" marker-end="url(#ts03-mb)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M792,150 V290" marker-end="url(#ts03-mv)"/>
    <path d="M700,380 V500" stroke-width="2.5" marker-end="url(#ts03-mv)"/>
    <path d="M780,500 V467 Q780,455 792,455 H873 Q885,455 885,443 V380" marker-end="url(#ts03-mv)"/>
  </g>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M966,408 V740" marker-end="url(#ts03-ma)"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M880,785 H790 Q778,785 778,773 V670" marker-end="url(#ts03-ms)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="280" y="96" fill="#1D4ED8">search</text>
    <text x="680" y="455" fill="#5B21B6">query every partition</text>
    <text x="832" y="478" fill="#5B21B6">sorted partial results</text>
    <text x="966" y="590" fill="#B45309">tweets to re-index</text>
    <text x="778" y="720" fill="#475569">rebuild a dead server</text>
  </g>

  
  <g filter="url(#ts03-soft)">
    <rect x="60" y="60" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="60" width="6" height="90" fill="#2563EB" clip-path="url(#ts03-k1)"/>
  </g>
  <circle cx="98" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,94.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="124" y="112" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#ts03-soft)">
    <rect x="330" y="60" width="214" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="330" y="60" width="6" height="90" fill="#64748B" clip-path="url(#ts03-k2)"/>
  </g>
  <circle cx="368" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,94.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="394" y="112" font-size="18.5" font-weight="600" fill="#111827">Load Balancer</text>

  
  <g filter="url(#ts03-soft)">
    <rect x="660" y="60" width="265" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="660" y="60" width="6" height="90" fill="#2563EB" clip-path="url(#ts03-k3)"/>
  </g>
  <circle cx="698" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,94.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="724" y="112" font-size="18.5" font-weight="600" fill="#111827">Application Server</text>

  
  <g filter="url(#ts03-lift)">
    <rect x="660" y="290" width="265" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="660" y="290" width="9" height="90" fill="#7C3AED" clip-path="url(#ts03-k4)"/>
  </g>
  <circle cx="698" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,324.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="724" y="342" font-size="18.5" font-weight="600" fill="#111827">Aggregator Servers</text>
  <text x="792" y="405" font-size="15.5" text-anchor="middle" fill="#6B7280">merge and sort</text>
  <text x="792" y="428" font-size="15.5" text-anchor="middle" fill="#6B7280">per-partition results</text>

  
  <g filter="url(#ts03-soft)">
    <rect x="94" y="556" width="230" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="94" y="556" width="6" height="90" fill="#7C3AED" clip-path="url(#ts03-k5)"/>
  </g>
  <circle cx="132" cy="601" r="18" fill="#FFFFFF"/>
  <g transform="translate(121.56,590.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="158" y="608" font-size="18.5" font-weight="600" fill="#111827">Index Server 1</text>

  
  <g filter="url(#ts03-soft)">
    <rect x="340" y="556" width="230" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="340" y="556" width="6" height="90" fill="#7C3AED" clip-path="url(#ts03-k6)"/>
  </g>
  <circle cx="378" cy="601" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,590.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="404" y="608" font-size="18.5" font-weight="600" fill="#111827">Index Server 2</text>

  
  <g filter="url(#ts03-soft)">
    <rect x="586" y="556" width="230" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="586" y="556" width="6" height="90" fill="#7C3AED" clip-path="url(#ts03-k7)"/>
  </g>
  <circle cx="624" cy="601" r="18" fill="#FFFFFF"/>
  <g transform="translate(613.56,590.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="650" y="608" font-size="18.5" font-weight="600" fill="#111827">Index Server 3</text>

  <text x="455" y="692" font-size="15.5" text-anchor="middle" fill="#6B7280">each holds the inverted index over its own tweets;</text>
  <text x="455" y="715" font-size="15.5" text-anchor="middle" fill="#6B7280">primary plus replica</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M950,290 L950,400 A110,16 0 0 0 1170,400 L1170,290" fill="#FEF3C7"/>
    <ellipse cx="1060" cy="290" rx="110" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1060" y="352" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Tweet Databases</text>
  <text x="1060" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">125 storage servers,</text>
  <text x="1060" y="468" font-size="15.5" text-anchor="middle" fill="#6B7280">hashed by TweetID</text>

  
  <g filter="url(#ts03-soft)">
    <rect x="880" y="740" width="286" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="880" y="740" width="6" height="90" fill="#64748B" clip-path="url(#ts03-k8)"/>
  </g>
  <circle cx="918" cy="785" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,774.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="944" y="792" font-size="18.5" font-weight="600" fill="#111827">Index-Builder Server</text>
  <text x="1023" y="855" font-size="15.5" text-anchor="middle" fill="#6B7280">reverse index: which tweets each</text>
  <text x="1023" y="878" font-size="15.5" text-anchor="middle" fill="#6B7280">index server holds, for rebuilds</text>

  
  <rect x="40" y="920" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="944" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="966" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Search path</text>
  <text x="288" y="966" font-size="15.5" fill="#475569">fan out to every index server, aggregate, return</text>
  <rect x="64" y="988" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="1010" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Recovery path</text>
  <text x="288" y="1010" font-size="15.5" fill="#475569">the Index-Builder tells a replacement server which tweets to fetch</text>
</svg>