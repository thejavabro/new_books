<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="614" viewBox="0 0 1240 614" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A response returns complete token counts with final set to false. Within five minutes a usage record appears, still not final. Within twenty four hours reconciliation marks it final. The caller feature tag travels from the request through to the usage record unchanged.">
  <defs>
    <marker id="p28-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p28-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p28-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p28-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p28-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p28-k1"><rect x="80" y="112" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="p28-k2"><rect x="490" y="112" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="p28-k3"><rect x="900" y="112" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="p28-k4"><rect x="80" y="372" width="260" height="48" rx="10"/></clipPath>
    <clipPath id="p28-k5"><rect x="490" y="372" width="260" height="48" rx="10"/></clipPath>
    <clipPath id="p28-k6"><rect x="900" y="372" width="260" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="614" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="250" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">From an immediate estimate to a final usage record</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">three stages, in order</text>

  
  <g fill="none" stroke-width="2">
    <path d="M340,157 H490" stroke="#D97706" marker-end="url(#p28-am)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M750,157 H900" stroke="#059669" marker-end="url(#p28-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="415" y="146" fill="#B45309">within 5 minutes</text>
    <text x="825" y="146" fill="#047857">within 24 hours</text>
  </g>

  
  <g filter="url(#p28-soft)">
    <rect x="80" y="112" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="112" width="6" height="90" fill="#2563EB" clip-path="url(#p28-k1)"/>
  </g>
  <circle cx="118" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="144" y="164" font-size="18.5" font-weight="600" fill="#111827">At the response</text>
  <text x="210" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">token counts complete</text>
  <text x="210" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">"final": false</text>

  
  <g filter="url(#p28-soft)">
    <rect x="490" y="112" width="260" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="490" y="112" width="6" height="90" fill="#D97706" clip-path="url(#p28-k2)"/>
  </g>
  <circle cx="528" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="554" y="164" font-size="18.5" font-weight="600" fill="#111827">Recorded</text>
  <text x="620" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">one usage record exists</text>
  <text x="620" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">"final": false</text>

  
  <g filter="url(#p28-lift)">
    <rect x="900" y="112" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="900" y="112" width="9" height="90" fill="#059669" clip-path="url(#p28-k3)"/>
  </g>
  <circle cx="938" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="964" y="164" font-size="18.5" font-weight="600" fill="#111827">Reconciled</text>
  <text x="1030" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the billing authority</text>
  <text x="1030" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">"final": true</text>

  
  <rect x="40" y="310" width="1160" height="140" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="340" font-size="16.5" font-weight="600" fill="#475569">The caller's feature tag travels unchanged</text>
  <text x="1176" y="340" text-anchor="end" font-size="15.5" fill="#6B7280">the same value at every stage</text>

  <g fill="none" stroke-width="2">
    <path d="M340,396 H490" stroke="#64748B" marker-end="url(#p28-sl)"/>
    <path d="M750,396 H900" stroke="#64748B" marker-end="url(#p28-sl)"/>
  </g>

  <g filter="url(#p28-soft)">
    <rect x="80" y="372" width="260" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="80" y="372" width="6" height="48" fill="#64748B" clip-path="url(#p28-k4)"/>
  </g>
  <circle cx="114" cy="396" r="4.5" fill="#64748B"/>
  <text x="138" y="403" font-size="18.5" font-weight="600" fill="#111827">feature: summary</text>

  <g filter="url(#p28-soft)">
    <rect x="490" y="372" width="260" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="490" y="372" width="6" height="48" fill="#64748B" clip-path="url(#p28-k5)"/>
  </g>
  <circle cx="524" cy="396" r="4.5" fill="#64748B"/>
  <text x="548" y="403" font-size="18.5" font-weight="600" fill="#111827">feature: summary</text>

  <g filter="url(#p28-soft)">
    <rect x="900" y="372" width="260" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="900" y="372" width="6" height="48" fill="#64748B" clip-path="url(#p28-k6)"/>
  </g>
  <circle cx="934" cy="396" r="4.5" fill="#64748B"/>
  <text x="958" y="403" font-size="18.5" font-weight="600" fill="#111827">feature: summary</text>

  
  <rect x="40" y="474" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="516" text-anchor="middle" font-size="16" fill="#475569">A dashboard may show preliminary usage. An invoice waits for the final record.</text>
  <text x="620" y="544" text-anchor="middle" font-size="16" fill="#475569">The record keeps the pricing id accepted at admission, so a price change never rewrites history.</text>
</svg>