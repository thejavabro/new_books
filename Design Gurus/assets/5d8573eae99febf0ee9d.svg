<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="858" viewBox="0 0 1240 858" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="why-title why-desc">
<title id="why-title">Why this question gets asked</title>
<desc id="why-desc">The most common senior follow-up, asked for a specific reason rather than to see whether you know bigger numbers.</desc>
<defs>
<marker id="why-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="why-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="why-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="why-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="858" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why this question gets asked</text>
<text x="40" y="86" font-size="21" fill="#4A5568">"What would you change at ten times the scale" is the most common senior follow-up.</text>
<rect x="40" y="780" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="780" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do you know where your design breaks?</text>
<path d="M566 148H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 148H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-slate)"/>
<rect x="610" y="118" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a candidate who cannot answer has not analyzed</text><text x="630" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what they drew</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Can you tell breaking from growing?</text>
<path d="M566 220H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 220H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-slate)"/>
<rect x="610" y="190" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">most of a system scales by adding instances. The</text><text x="630" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">small part that does not is the answer</text>
<circle cx="60" cy="292" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="470" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Do you over-build?</text>
<path d="M566 292H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 292H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-slate)"/>
<rect x="610" y="262" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">answering with what you would have built instead</text><text x="630" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reveals the original was a guess</text>
<rect x="40" y="340" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="340" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="377" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Not "what is the big version". It is "which part stops working, and why that part".</text>
<text x="40" y="438" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">The three weak answers</text>
<rect x="40" y="456" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="492" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"Add more servers"</text>
<path d="M526 486H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 486H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-red)"/>
<rect x="570" y="456" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="492" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that is what happens by default</text>
<rect x="40" y="528" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="564" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"Use a different database"</text>
<path d="M526 558H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 558H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-red)"/>
<rect x="570" y="528" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="564" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not an answer unless you say which property failed</text>
<rect x="40" y="600" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="636" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A list of every technique you know</text>
<path d="M526 630H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 630H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-red)"/>
<rect x="570" y="600" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="623.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the worst of the three: it shows you cannot identify</text><text x="590" y="648.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which one this needs</text>
<rect x="40" y="678" width="1160" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="678" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="64" y="709" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The strong answer is short, specific and ordered</text><text x="64" y="735" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">One or two things break, which, why, the change, and what stays the same.</text>
<text x="66" y="814" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">That last clause is what separates levels, because it is a claim only confident analysis makes.</text>
</svg>