<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Clients send metadata updates through a shared request queue to the synchronization service, which applies them to the metadata database and notifies each device through its own response queue.">
  <defs>
    <marker id="dbx04-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="dbx04-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="dbx04-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>

    <filter id="dbx04-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dbx04-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="dbx04-k1"><rect x="60" y="270" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="dbx04-k2"><rect x="60" y="395" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="dbx04-k3"><rect x="60" y="560" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="dbx04-k4"><rect x="390" y="110" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dbx04-k5"><rect x="390" y="270" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dbx04-k6"><rect x="390" y="395" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dbx04-k7"><rect x="390" y="560" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="dbx04-k8"><rect x="908" y="300" width="310" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  
  <rect x="340" y="64" width="440" height="612" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="364" y="94" font-size="16.5" font-weight="600" fill="#475569">Message Queuing Service</text>

  
  <g fill="none" stroke-width="2">
    
    <path d="M230,300 H303 Q315,300 315,288 V142 Q315,130 327,130 H390" stroke="#DB2777" marker-end="url(#dbx04-pk)"/>
    <path d="M230,425 H283 Q295,425 295,413 V167 Q295,155 307,155 H390" stroke="#DB2777" marker-end="url(#dbx04-pk)"/>
    <path d="M230,590 H263 Q275,590 275,578 V192 Q275,180 287,180 H390" stroke="#DB2777" marker-end="url(#dbx04-pk)"/>
    
    <path d="M730,155 H868 Q880,155 880,167 V324 Q880,336 892,336 H908" stroke="#DB2777" stroke-width="2.5" marker-end="url(#dbx04-pk)"/>
    
    <path d="M908,314 L730,314" stroke="#059669" marker-end="url(#dbx04-em)"/>
    <path d="M908,358 H867 Q855,358 855,370 V428 Q855,440 843,440 H730" stroke="#059669" marker-end="url(#dbx04-em)"/>
    <path d="M908,376 H842 Q830,376 830,388 V593 Q830,605 818,605 H730" stroke="#059669" marker-end="url(#dbx04-em)"/>
    
    <path d="M390,330 L230,330" stroke="#059669" marker-end="url(#dbx04-em)"/>
    <path d="M390,455 L230,455" stroke="#059669" marker-end="url(#dbx04-em)"/>
    <path d="M390,620 L230,620" stroke="#059669" marker-end="url(#dbx04-em)"/>
    
    <path d="M1063,390 V474" stroke="#7C3AED" marker-end="url(#dbx04-vi)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="880" y="250" fill="#BE185D">take next update</text>
    <text x="800" y="341" fill="#047857">copy of the update</text>
    <text x="800" y="363" fill="#047857">per device</text>
    <text x="1063" y="437" fill="#5B21B6">apply update</text>
  </g>

  
  <g filter="url(#dbx04-soft)">
    <rect x="60" y="270" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="270" width="6" height="90" fill="#2563EB" clip-path="url(#dbx04-k1)"/>
  </g>
  <circle cx="98" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,304.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="124" y="322" font-size="18.5" font-weight="600" fill="#111827">Client A</text>

  <g filter="url(#dbx04-soft)">
    <rect x="60" y="395" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="395" width="6" height="90" fill="#2563EB" clip-path="url(#dbx04-k2)"/>
  </g>
  <circle cx="98" cy="440" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,429.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="124" y="447" font-size="18.5" font-weight="600" fill="#111827">Client B</text>

  <g filter="url(#dbx04-soft)">
    <rect x="60" y="560" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="560" width="6" height="90" fill="#2563EB" clip-path="url(#dbx04-k3)"/>
  </g>
  <circle cx="98" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,594.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="124" y="612" font-size="18.5" font-weight="600" fill="#111827">Client C</text>

  
  <g filter="url(#dbx04-lift)">
    <rect x="390" y="110" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="390" y="110" width="9" height="90" fill="#DB2777" clip-path="url(#dbx04-k4)"/>
  </g>
  <circle cx="428" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,144.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="454" y="162" font-size="18.5" font-weight="600" fill="#111827">Request Queue (shared)</text>
  <text x="560" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">all clients write metadata updates here</text>

  
  <g filter="url(#dbx04-soft)">
    <rect x="390" y="270" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="390" y="270" width="6" height="90" fill="#059669" clip-path="url(#dbx04-k5)"/>
  </g>
  <circle cx="428" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="454" y="322" font-size="18.5" font-weight="600" fill="#111827">Response Queue A</text>

  <g filter="url(#dbx04-soft)">
    <rect x="390" y="395" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="390" y="395" width="6" height="90" fill="#059669" clip-path="url(#dbx04-k6)"/>
  </g>
  <circle cx="428" cy="440" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,429.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="454" y="447" font-size="18.5" font-weight="600" fill="#111827">Response Queue B</text>
  <text x="560" y="510" font-size="15.5" text-anchor="middle" fill="#6B7280">one queue per subscribed device;</text>
  <text x="560" y="533" font-size="15.5" text-anchor="middle" fill="#6B7280">a message is deleted once received</text>

  <g filter="url(#dbx04-soft)">
    <rect x="390" y="560" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="390" y="560" width="6" height="90" fill="#059669" clip-path="url(#dbx04-k7)"/>
  </g>
  <circle cx="428" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,594.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="454" y="612" font-size="18.5" font-weight="600" fill="#111827">Response Queue C</text>

  
  <g filter="url(#dbx04-soft)">
    <rect x="908" y="300" width="310" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="908" y="300" width="6" height="90" fill="#7C3AED" clip-path="url(#dbx04-k8)"/>
  </g>
  <circle cx="946" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(935.56,334.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="972" y="352" font-size="18.5" font-weight="600" fill="#111827">Synchronization Service</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M968,490 L968,574 A95,16 0 0 0 1158,574 L1158,490" fill="#EDE9FE"/>
    <ellipse cx="1063" cy="490" rx="95" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1063" y="548" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Metadata DB</text>

  
  <rect x="40" y="710" width="1160" height="90" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="749" text-anchor="middle" font-size="16" fill="#475569">Clients and the synchronization service never talk directly. The shared request queue absorbs updates,</text>
  <text x="620" y="775" text-anchor="middle" font-size="16" fill="#475569">and every subscribed device gets its own response queue, so an offline device's notifications wait for it.</text>
</svg>