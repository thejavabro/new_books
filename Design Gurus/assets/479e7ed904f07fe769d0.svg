<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="806" viewBox="0 0 1240 806" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="residency-title residency-desc">
<title id="residency-title">Designing for residency when it is real</title>
<desc id="residency-desc">A home region per customer, a global layer holding only what may travel, and an explicit inventory of every path out. These designs fail on the paths nobody listed rather than the ones they handled.</desc>
<defs>
<marker id="residency-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="residency-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="residency-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="residency-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="806" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Designing for residency when it is real</text>
<text x="40" y="86" font-size="21" fill="#4A5568">When the requirement is genuine localization, the design is a partition rather than a replication topology.</text>
<rect x="40" y="728" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="728" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="76" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="148.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Each customer has a home region, and</text><text x="320" y="175.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">their personal data is only stored there</text>
<rect x="640" y="118" width="560" height="76" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="148.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A global layer holds only what may</text><text x="920" y="175.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">travel: identifiers and routing</text>
<rect x="40" y="208" width="1160" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Nothing crosses a region by accident. Every path between regions is listed and justified</text>
<text x="40" y="308" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And these are the paths that get missed</text>
<rect x="40" y="326" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="362" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backups</text>
<path d="M526 356H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 356H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#residency-marker-red)"/>
<rect x="570" y="326" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="349.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">replicated to another region for durability, which may be</text><text x="590" y="374.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">exactly what is forbidden</text>
<rect x="40" y="398" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="434" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Logs and traces</text>
<path d="M526 428H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 428H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#residency-marker-red)"/>
<rect x="570" y="398" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="421.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">routinely carrying personal data from request payloads</text><text x="590" y="446.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">to a central aggregator</text>
<rect x="40" y="470" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="506" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">High-cardinality metric labels</text>
<path d="M526 500H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 500H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#residency-marker-red)"/>
<rect x="570" y="470" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="493.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which can carry identifiers, as the data modeling</text><text x="590" y="518.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">module warned for another reason</text>
<rect x="40" y="542" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="578" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Internal tools</text>
<path d="M526 572H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 572H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#residency-marker-red)"/>
<rect x="570" y="542" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="565.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the support console, the warehouse, and the export</text><text x="590" y="590.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">somebody built</text>
<rect x="40" y="626" width="560" height="76" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="626" width="5" height="76" rx="2.5" fill="#39D5AA"/><text x="64" y="657" font-size="19" font-weight="700" fill="#169B77" text-anchor="start">An inventory of every path out of the</text><text x="64" y="683" font-size="19" font-weight="700" fill="#169B77" text-anchor="start">region is what the requirement needs.</text>
<rect x="640" y="626" width="560" height="76" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="626" width="5" height="76" rx="2.5" fill="#5EC9EC"/><text x="664" y="657" font-size="19" font-weight="700" fill="#155B9E" text-anchor="start">Latency, survival and residency are three</text><text x="664" y="683" font-size="19" font-weight="700" fill="#155B9E" text-anchor="start">designs. Only one needs both regions writing.</text>
<text x="66" y="762" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Dull work, and it is what the requirement actually needs.</text>
</svg>