<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="PACELC as a decision tree: during a partition choose availability or consistency, and the rest of the time choose low latency or consistency">
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <defs>
    <marker id="cp9-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="cp9-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M620,140 C620,180 320,170 320,208" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#cp9-slate)"/>
  <path d="M620,140 C620,180 920,170 920,208" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#cp9-slate)"/>
  <path d="M320,288 C320,320 180,318 180,352" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#cp9-slate)"/>
  <path d="M320,288 C320,320 460,318 460,352" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#cp9-slate)"/>
  <path d="M920,288 C920,320 780,318 780,352" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#cp9-slate)"/>
  <path d="M920,288 C920,320 1060,318 1060,352" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#cp9-slate)"/>

  <rect x="373" y="154" width="104" height="34" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.4"/>
  <text x="425" y="178" font-size="20" font-weight="700" fill="#B91C1C" text-anchor="middle">P: yes</text>
  <rect x="759" y="154" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
  <text x="815" y="178" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">E: else</text>

  
  <g filter="url(#cp9-soft)">
    <rect x="440" y="60" width="360" height="80" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <rect x="150" y="208" width="340" height="80" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="750" y="208" width="340" height="80" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="60" y="352" width="240" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="340" y="352" width="240" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="660" y="352" width="240" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="940" y="352" width="240" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="108" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Is the network partitioned?</text>
  <text x="320" y="244" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">During the partition,</text>
  <text x="320" y="272" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">pick one</text>
  <text x="920" y="244" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The rest of the time,</text>
  <text x="920" y="272" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">pick one</text>

  <text x="180" y="388" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Availability</text>
  <text x="180" y="416" font-size="20" fill="#64748B" text-anchor="middle">keep answering</text>
  <text x="460" y="388" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Consistency</text>
  <text x="460" y="416" font-size="20" fill="#64748B" text-anchor="middle">stop instead</text>
  <text x="780" y="388" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Latency</text>
  <text x="780" y="416" font-size="20" fill="#64748B" text-anchor="middle">answer fast</text>
  <text x="1060" y="388" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Consistency</text>
  <text x="1060" y="416" font-size="20" fill="#64748B" text-anchor="middle">wait for agreement</text>

  <text x="620" y="486" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">if P then A or C, else L or C</text>
</svg>