<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities for a reminder service: a user creates a reminder with an optional recurring schedule, time zone rules turn it into concrete trigger times, the scheduler fires an alert per occurrence, and channels deliver it">
  <defs>
    <filter id="rmdk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rmdk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rmdk-k1"><rect x="40" y="310" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="rmdk-k2"><rect x="330" y="310" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="rmdk-k3"><rect x="330" y="140" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="rmdk-k4"><rect x="330" y="480" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="rmdk-k5"><rect x="690" y="310" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="rmdk-k6"><rect x="1010" y="310" width="190" height="90" rx="12"/></clipPath>
    <marker id="rmdk-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="rmdk-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rmdk-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="rmdk-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="rmdk-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rmdk-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="902" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Reminder alert system: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One reminder is a rule. What actually gets delivered is each occurrence it expands into.</text>



  <g fill="none" stroke-width="2">
    <path d="M230,335 H330" stroke="#2563EB" marker-end="url(#rmdk-m-blue)"/>
    <path d="M580,230 V310" stroke="#D97706" marker-end="url(#rmdk-m-amber)"/>
    <path d="M598,480 V400" stroke="#64748B" marker-end="url(#rmdk-m-slate)"/>
    <path d="M610,335 H690" stroke="#4F46E5" marker-end="url(#rmdk-m-indigo)"/>
    <path d="M940,335 H1010" stroke="#7C3AED" marker-end="url(#rmdk-m-violet)"/>
    <path d="M1190,400 V648 Q1190,660 1178,660 H32 Q20,660 20,648 V367 Q20,355 32,355 H40" stroke="#059669" stroke-width="2.5" marker-end="url(#rmdk-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="280" y="322" fill="#1D4ED8">creates</text>
    <text x="665" y="272" fill="#B45309">repeats</text>
    <text x="665" y="445" fill="#475569">anchors</text>
    <text x="650" y="322" fill="#4338CA">expands</text>
    <text x="975" y="322" fill="#5B21B6">sent via</text>
    <text x="480" y="652" fill="#047857">delivered at the local time the user meant</text>
  </g>

  <g filter="url(#rmdk-soft)">
    <rect x="40" y="310" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#rmdk-k1)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="362" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="135" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">sets the reminder</text>
  <text x="135" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">picks the channels</text>
  <g filter="url(#rmdk-lift)">
    <rect x="330" y="310" width="280" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="330" y="310" width="9" height="90" fill="#4F46E5" clip-path="url(#rmdk-k2)"/>
  </g>
  <circle cx="368" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,344.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="394" y="362" font-size="21.5" font-weight="600" fill="#111827">Reminder</text>
  <text x="470" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">a message and a rule</text>
  <g filter="url(#rmdk-soft)">
    <rect x="330" y="140" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="330" y="140" width="6" height="90" fill="#D97706" clip-path="url(#rmdk-k3)"/>
  </g>
  <circle cx="368" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="394" y="192" font-size="21.5" font-weight="600" fill="#111827">Recurring Schedule</text>
  <text x="470" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">every 4 hours, or daily</text>
  <text x="470" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">one rule, many firings</text>
  <g filter="url(#rmdk-soft)">
    <rect x="330" y="480" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="330" y="480" width="6" height="90" fill="#64748B" clip-path="url(#rmdk-k4)"/>
  </g>
  <circle cx="368" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,514.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="394" y="532" font-size="21.5" font-weight="600" fill="#111827">Time Zone</text>
  <text x="470" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">and daylight saving</text>
  <text x="470" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">9 AM stays local 9 AM</text>
  <g filter="url(#rmdk-soft)">
    <rect x="690" y="310" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="690" y="310" width="6" height="90" fill="#7C3AED" clip-path="url(#rmdk-k5)"/>
  </g>
  <circle cx="728" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,344.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="754" y="362" font-size="21.5" font-weight="600" fill="#111827">Alert</text>
  <text x="815" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">one per occurrence</text>
  <text x="815" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">has its own delivery state</text>
  <g filter="url(#rmdk-soft)">
    <rect x="1010" y="310" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1010" y="310" width="6" height="90" fill="#059669" clip-path="url(#rmdk-k6)"/>
  </g>
  <circle cx="1048" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(1037.56,344.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="1074" y="362" font-size="21.5" font-weight="600" fill="#111827">Channel</text>
  <text x="1105" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">email, SMS, push</text>

  <rect x="40" y="700" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="725" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="750" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Occurrence</text>
  <text x="323" y="750" font-size="18.5" fill="#475569">a single firing of a repeating reminder; it succeeds or fails on its own and can be retried alone</text>
  <rect x="64" y="775" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="800" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Time zone</text>
  <text x="323" y="800" font-size="18.5" fill="#475569">stored with the rule, not resolved at write time, or a daylight saving shift moves every future alert</text>
  <rect x="64" y="825" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="850" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Due window</text>
  <text x="323" y="850" font-size="18.5" fill="#475569">the scheduler scans for what is due soon rather than sleeping on each reminder one by one</text>
</svg>