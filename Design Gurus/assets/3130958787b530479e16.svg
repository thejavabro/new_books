<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six steps in order. One, expand: create the assignments table, which no code uses yet. Two, write both: version 2 writes the old columns and the new table in one transaction and reads the old columns. Three, backfill: copy 9 million rows in batches, then compare counts and checksums. Four, read the new table: version 3 reads the new table and still writes both. Five, stop writing old: version 4 writes only the new table, and can roll back only to version 3. Six, contract: drop the old columns once no version uses them and no rollback to version 3 is needed. A warning below: never drop a column while a running version still writes it.">
  <defs>
    <filter id="md04d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md04d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md04d-k1"><rect x="40" y="120" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md04d-k2"><rect x="450" y="120" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md04d-k3"><rect x="860" y="120" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md04d-k4"><rect x="40" y="335" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md04d-k5"><rect x="450" y="335" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md04d-k6"><rect x="860" y="335" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md04d-k7"><rect x="40" y="540" width="1160" height="70" rx="12"/></clipPath>
    <marker id="md04d-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Expand-migrate-contract in six steps</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every step works with the code version that runs just before it during a rolling deployment.</text>



  <g fill="none" stroke-width="2">
    <path d="M380,165 H450" stroke="#64748B" marker-end="url(#md04d-m-slate)"/>
    <path d="M790,165 H860" stroke="#64748B" marker-end="url(#md04d-m-slate)"/>
    <path d="M1200,165 H1210 Q1222,165 1222,177 V290 Q1222,302 1210,302 H222 Q210,302 210,314 V335" stroke="#64748B" marker-end="url(#md04d-m-slate)"/>
    <path d="M380,380 H450" stroke="#64748B" marker-end="url(#md04d-m-slate)"/>
    <path d="M790,380 H860" stroke="#64748B" marker-end="url(#md04d-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#md04d-soft)">
    <rect x="40" y="120" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="120" width="6" height="90" fill="#059669" clip-path="url(#md04d-k1)"/>
  </g>
  <circle cx="78" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,154.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="104" y="172" font-size="21.5" font-weight="600" fill="#111827">1. Expand</text>
  <text x="210" y="239" font-size="18.5" text-anchor="middle" fill="#6B7280">Create the assignments table</text>
  <text x="210" y="266" font-size="18.5" text-anchor="middle" fill="#94A3B8">No code uses it yet</text>
  <g filter="url(#md04d-soft)">
    <rect x="450" y="120" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="120" width="6" height="90" fill="#7C3AED" clip-path="url(#md04d-k2)"/>
  </g>
  <circle cx="488" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,154.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M4 16.5v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></g>
  <text x="514" y="172" font-size="21.5" font-weight="600" fill="#111827">2. Write both</text>
  <text x="620" y="239" font-size="18.5" text-anchor="middle" fill="#6B7280">Version 2 writes old and new</text>
  <text x="620" y="266" font-size="18.5" text-anchor="middle" fill="#94A3B8">in one transaction, reads old</text>
  <g filter="url(#md04d-soft)">
    <rect x="860" y="120" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="860" y="120" width="6" height="90" fill="#D97706" clip-path="url(#md04d-k3)"/>
  </g>
  <circle cx="898" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,154.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="924" y="172" font-size="21.5" font-weight="600" fill="#111827">3. Backfill</text>
  <text x="1030" y="239" font-size="18.5" text-anchor="middle" fill="#6B7280">Copy 9 million rows in batches</text>
  <text x="1030" y="266" font-size="18.5" text-anchor="middle" fill="#94A3B8">then compare counts and checksums</text>
  <g filter="url(#md04d-soft)">
    <rect x="40" y="335" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="335" width="6" height="90" fill="#7C3AED" clip-path="url(#md04d-k4)"/>
  </g>
  <circle cx="78" cy="380" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,369.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="387" font-size="21.5" font-weight="600" fill="#111827">4. Read new table</text>
  <text x="210" y="454" font-size="18.5" text-anchor="middle" fill="#6B7280">Version 3 reads the new table</text>
  <text x="210" y="481" font-size="18.5" text-anchor="middle" fill="#94A3B8">and still writes both</text>
  <g filter="url(#md04d-soft)">
    <rect x="450" y="335" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="335" width="6" height="90" fill="#7C3AED" clip-path="url(#md04d-k5)"/>
  </g>
  <circle cx="488" cy="380" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,369.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M4 16.5v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></g>
  <text x="514" y="387" font-size="21.5" font-weight="600" fill="#111827">5. Stop writing old</text>
  <text x="620" y="454" font-size="18.5" text-anchor="middle" fill="#6B7280">Version 4 writes only new</text>
  <text x="620" y="481" font-size="18.5" text-anchor="middle" fill="#94A3B8">rollback only to version 3</text>
  <g filter="url(#md04d-soft)">
    <rect x="860" y="335" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="860" y="335" width="6" height="90" fill="#DB2777" clip-path="url(#md04d-k6)"/>
  </g>
  <circle cx="898" cy="380" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,369.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="924" y="387" font-size="21.5" font-weight="600" fill="#111827">6. Contract</text>
  <text x="1030" y="454" font-size="18.5" text-anchor="middle" fill="#6B7280">Drop the old columns once</text>
  <text x="1030" y="481" font-size="18.5" text-anchor="middle" fill="#94A3B8">no version uses them and no</text>
  <text x="1030" y="508" font-size="18.5" text-anchor="middle" fill="#94A3B8">rollback to version 3 is needed</text>
  <g filter="url(#md04d-soft)">
    <rect x="40" y="540" width="1160" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="40" y="540" width="6" height="70" fill="#DB2777" clip-path="url(#md04d-k7)"/>
  </g>
  <circle cx="78" cy="575" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,564.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/></g>
  <text x="104" y="582" font-size="19.5" font-weight="600" fill="#111827">Never drop a column while a running version still writes it</text>




</svg>