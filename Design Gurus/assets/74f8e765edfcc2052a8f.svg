<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1320" viewBox="0 0 1240 1320" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Clients on the internet reach the load balancer in the public network on TCP 443 and TCP 80; the load balancer security group allows inbound 443 and 80 from anywhere and outbound 8000 to the application tier security group; the application tier security group in the private network allows inbound 8000 from the load balancer security group only, outbound 5432 and 6379 to the data tier security group, and outbound 443 to the internet through a NAT gateway for payment and email APIs; the data tier security group allows inbound 5432 for PostgreSQL and 6379 for Redis from the application tier security group only and has no outbound access to the internet">
