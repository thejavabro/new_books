  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">N-tier security: public vs. private network access</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Only the load balancer is public; each private tier accepts traffic only from the group in front of it.</text>

