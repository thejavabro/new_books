<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="882" viewBox="0 0 1240 882" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="single-title single-desc">
<title id="single-title">The single-instance lock, done correctly</title>
<desc id="single-desc">SET with NX and PX makes acquisition atomic and bounded. The random token is what makes release safe, and a release that deletes without checking it will delete a lock that now belongs to somebody else.</desc>
<defs>
<marker id="single-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="single-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="single-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="single-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="882" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The single-instance lock, done correctly</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The random token is what makes release safe.</text>
<rect x="40" y="804" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="804" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="112" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V224A6 6 0 0 0 46 230H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Acquire, atomically</text>
<rect x="160" y="162" width="920" height="48" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="620" y="193" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">SET lock:report:42  &lt;random-token&gt;  NX  PX 30000</text>
<rect x="40" y="248" width="300" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="281" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">NX</text>
<path d="M346 275H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 275H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#single-marker-slate)"/>
<rect x="390" y="248" width="810" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="281" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sets only if absent, so acquisition is atomic</text>
<rect x="40" y="310" width="300" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="343" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">PX</text>
<path d="M346 337H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 337H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#single-marker-slate)"/>
<rect x="390" y="310" width="810" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="343" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an expiry, so a dead holder does not hold it forever</text>
<rect x="40" y="372" width="300" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="405" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the token</text>
<path d="M346 399H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 399H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#single-marker-slate)"/>
<rect x="390" y="372" width="810" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="405" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">identifies this acquisition, and is the part people leave out</text>
<text x="40" y="470" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">What a plain DEL release does</text>
<rect x="40" y="488" width="1160" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="517" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">your work overruns the expiry</text>
<rect x="40" y="540" width="1160" height="46" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="569" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the lock expires, and another worker acquires it</text>
<rect x="40" y="592" width="1160" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="621" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you finish, and delete their lock</text>
<rect x="40" y="644" width="1160" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="673" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a third worker acquires immediately, and two are running</text>
<rect x="40" y="716" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="716" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="753" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The naive release does not merely fail to protect you. It breaks the lock for everybody.</text>
<text x="66" y="838" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Release has to compare the token and delete atomically, which means a script.</text>
</svg>