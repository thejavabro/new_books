<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">Product uses Cart through a contract</title><desc id="desc">Product and Cart implementation depend on the Cart contract, while application setup connects the concrete implementation to Product.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="850" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Product uses Cart through a contract</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Arrows show code dependencies, not screen navigation.</tspan></text><rect x="50" y="185" width="450" height="210" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="227" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Product feature</tspan></text><text x="72" y="275" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Needs cart behavior</tspan><tspan x="72" dy="32">Does not import Cart UI</tspan></text><rect x="700" y="185" width="450" height="210" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="722" y="227" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="722" dy="0">Cart implementation</tspan></text><text x="722" y="275" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="722" dy="0">Owns cart data</tspan><tspan x="722" dy="32">Owns pending operations</tspan></text><rect x="350" y="495" width="500" height="150" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="372" y="537" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="372" dy="0">Cart contract</tspan></text><text x="372" y="585" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="372" dy="0">Actions and observable state</tspan></text><path d="M275 405 V445 H485 V485" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><path d="M925 405 V445 H715 V485" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="700" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="746" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Application setup supplies the implementation.</tspan></text></g></svg>