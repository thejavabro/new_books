<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="failover-title failover-desc">
<title id="failover-title">Failover: the order is the lesson</title>
<desc id="failover-desc">Detect by agreement, fence the old primary before promoting anything, promote, move traffic at the pooler rather than DNS, then rebuild. Skipping the fencing step lets the old primary return and accept writes, producing two divergent histories that cannot be reconciled automatically.</desc>
<defs>
<marker id="failover-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="failover-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="failover-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="failover-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="674" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Failover: the order is the lesson</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Skipping the fencing step lets the old primary return and accept writes.</text>
<rect x="40" y="596" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="596" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The order that works</text>
<rect x="40" y="168" width="216" height="128" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 168H46A6 6 0 0 0 40 174V290A6 6 0 0 0 46 296H54Z" fill="#5EC9EC"/>
<circle cx="84" cy="208" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="84" y="216" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="118" y="216" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Detect</text>
<text x="148" y="258" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">by agreement,</text><text x="148" y="283" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">not one checker</text>
<rect x="276" y="168" width="216" height="128" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M290 168H282A6 6 0 0 0 276 174V290A6 6 0 0 0 282 296H290Z" fill="#F28B9D"/>
<circle cx="320" cy="208" r="21" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="320" y="216" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="354" y="216" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Fence</text>
<text x="384" y="258" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">prove the old</text><text x="384" y="283" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">primary cannot write</text>
<rect x="512" y="168" width="216" height="128" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M526 168H518A6 6 0 0 0 512 174V290A6 6 0 0 0 518 296H526Z" fill="#39D5AA"/>
<circle cx="556" cy="208" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="556" y="216" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="590" y="216" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Promote</text>
<text x="620" y="258" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the timeline</text><text x="620" y="283" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">increments</text>
<rect x="748" y="168" width="216" height="128" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M762 168H754A6 6 0 0 0 748 174V290A6 6 0 0 0 754 296H762Z" fill="#39D5AA"/>
<circle cx="792" cy="208" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="792" y="216" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="826" y="216" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Cut over</text>
<text x="856" y="258" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">at the pooler,</text><text x="856" y="283" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">not at DNS</text>
<rect x="984" y="168" width="216" height="128" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M998 168H990A6 6 0 0 0 984 174V290A6 6 0 0 0 990 296H998Z" fill="#AC8BE8"/>
<circle cx="1028" cy="208" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1028" y="216" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1062" y="216" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Rebuild</text>
<text x="1092" y="258" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">rejoin, or restore</text><text x="1092" y="283" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">from backup</text>
<rect x="259" y="310" width="250" height="44" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="384" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the step teams skip</text>
<text x="40" y="400" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">What skipping step 2 produces</text>
<rect x="40" y="418" width="1160" height="152" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 418H46A6 6 0 0 0 40 424V564A6 6 0 0 0 46 570H54Z" fill="#F28B9D"/>
<rect x="90" y="442" width="270" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="225" y="464.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Old primary</text><text x="225" y="491.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">returns, still writing</text>
<rect x="880" y="442" width="270" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1015" y="464.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">New primary</text><text x="1015" y="491.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">also writing</text>
<path d="M366 472H484" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M366 472H484" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failover-marker-red)"/>
<path d="M874 472H756" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M874 472H756" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#failover-marker-red)"/>
<rect x="490" y="438" width="260" height="68" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="478" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">SPLIT-BRAIN</text>
<text x="620" y="548" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">Two histories, both real, no automatic way to reconcile them</text>
<text x="66" y="630" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Fencing is what separates a short outage from a reconciliation project. Raise it before you are asked.</text>
</svg>