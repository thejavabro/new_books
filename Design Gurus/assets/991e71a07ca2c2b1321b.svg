<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="872" viewBox="0 0 1240 872" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities for a news aggregator: sources publish articles, articles are tagged with categories and entities, subscriptions match a user to those tags, and matching articles land in the user feed by push or pull">
  <defs>
    <filter id="nwsk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nwsk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nwsk-k1"><rect x="40" y="310" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="nwsk-k2"><rect x="350" y="310" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nwsk-k3"><rect x="350" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nwsk-k4"><rect x="350" y="480" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nwsk-k5"><rect x="700" y="310" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nwsk-k6"><rect x="1010" y="310" width="190" height="90" rx="12"/></clipPath>
    <marker id="nwsk-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="nwsk-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="nwsk-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="nwsk-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="nwsk-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="872" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">News aggregator: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The feed is built by matching every new article against every subscription, not by searching on read.</text>



  <g fill="none" stroke-width="2">
    <path d="M250,335 H350" stroke="#64748B" marker-end="url(#nwsk-m-slate)"/>
    <path d="M575,310 V230" stroke="#D97706" marker-end="url(#nwsk-m-amber)"/>
    <path d="M575,400 V480" stroke="#059669" marker-end="url(#nwsk-m-emerald)"/>
    <path d="M600,335 H700" stroke="#4F46E5" marker-end="url(#nwsk-m-indigo)"/>
    <path d="M950,335 H1010" stroke="#7C3AED" marker-end="url(#nwsk-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="300" y="322" fill="#475569">publishes</text>
    <text x="655" y="272" fill="#B45309">tagged</text>
    <text x="655" y="445" fill="#047857">tagged</text>
    <text x="650" y="322" fill="#4338CA">matched</text>
    <text x="980" y="322" fill="#5B21B6">fan out</text>
  </g>

  <g filter="url(#nwsk-soft)">
    <rect x="40" y="310" width="210" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="310" width="6" height="90" fill="#64748B" clip-path="url(#nwsk-k1)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="104" y="362" font-size="21.5" font-weight="600" fill="#111827">News Source</text>
  <text x="145" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">RSS, API or site</text>
  <text x="145" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">tens of thousands of them</text>
  <g filter="url(#nwsk-lift)">
    <rect x="350" y="310" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="350" y="310" width="9" height="90" fill="#4F46E5" clip-path="url(#nwsk-k2)"/>
  </g>
  <circle cx="388" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,344.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="414" y="362" font-size="21.5" font-weight="600" fill="#111827">Article</text>
  <text x="475" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">title, snippet, url</text>
  <g filter="url(#nwsk-soft)">
    <rect x="350" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="350" y="140" width="6" height="90" fill="#D97706" clip-path="url(#nwsk-k3)"/>
  </g>
  <circle cx="388" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="414" y="192" font-size="21.5" font-weight="600" fill="#111827">Category</text>
  <text x="475" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">politics, sports, tech</text>
  <text x="475" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">several per article</text>
  <g filter="url(#nwsk-soft)">
    <rect x="350" y="480" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="350" y="480" width="6" height="90" fill="#059669" clip-path="url(#nwsk-k4)"/>
  </g>
  <circle cx="388" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,514.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="414" y="532" font-size="21.5" font-weight="600" fill="#111827">Entity</text>
  <text x="475" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">a person, org or keyword</text>
  <text x="475" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">found by entity recognition</text>
  <g filter="url(#nwsk-soft)">
    <rect x="700" y="310" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="700" y="310" width="6" height="90" fill="#7C3AED" clip-path="url(#nwsk-k5)"/>
  </g>
  <circle cx="738" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,344.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="764" y="362" font-size="21.5" font-weight="600" fill="#111827">Subscription</text>
  <text x="825" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">a user paired with a topic</text>
  <text x="825" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">source, category or entity</text>
  <g filter="url(#nwsk-soft)">
    <rect x="1010" y="310" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="1010" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#nwsk-k6)"/>
  </g>
  <circle cx="1048" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(1037.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="1074" y="362" font-size="21.5" font-weight="600" fill="#111827">User Feed</text>
  <text x="1105" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">newest first</text>
  <text x="1105" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">pull to refresh, or push</text>

  <rect x="40" y="670" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Feed update event</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">raised when a new article matches a subscription; this is what makes the feed near real time</text>
  <rect x="64" y="745" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="770" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Push and pull</text>
  <text x="323" y="770" font-size="18.5" fill="#475569">push sends a notification straight away, pull waits for the user to refresh; both are required</text>
  <rect x="64" y="795" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="820" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Entity recognition</text>
  <text x="323" y="820" font-size="18.5" fill="#475569">reads names out of the article text so a user can follow a person rather than a whole section</text>
</svg>