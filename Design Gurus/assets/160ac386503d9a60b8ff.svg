<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="When a request passes through three parts in a line, their availability numbers multiply and the result is worse than any single part. When two copies can each answer, the system is down only if both are down at the same time, so the result is better.">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="kd4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="kd4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="kd4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="kd4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="kd4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="kd4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="kd4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="kd4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Parts in a line make the number worse. Copies make it better.</text>
  <rect x="24" y="66" width="588" height="320" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="104" font-size="22" font-weight="600" fill="#B91C1C" text-anchor="middle">In a line: every part must work</text>
  <g filter="url(#kd4-soft)"><rect x="62" y="150" width="148" height="58" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="136" y="186" font-size="19" fill="#0F172A" text-anchor="middle">load balancer</text>
  <text x="136" y="232" font-size="19" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99.9%</text>
  <line x1="214" y1="179" x2="228" y2="179" stroke="#DC2626" stroke-width="2.2" marker-end="url(#kd4-r)"/>
  <g filter="url(#kd4-soft)"><rect x="244" y="150" width="148" height="58" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="318" y="186" font-size="19" fill="#0F172A" text-anchor="middle">service</text>
  <text x="318" y="232" font-size="19" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99.9%</text>
  <line x1="396" y1="179" x2="410" y2="179" stroke="#DC2626" stroke-width="2.2" marker-end="url(#kd4-r)"/>
  <g filter="url(#kd4-soft)"><rect x="426" y="150" width="148" height="58" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="500" y="186" font-size="19" fill="#0F172A" text-anchor="middle">database</text>
  <text x="500" y="232" font-size="19" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99.9%</text>
  <text x="318" y="296" font-size="23" font-weight="700" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">0.999 x 0.999 x 0.999 = 99.7%</text>
  <text x="318" y="336" font-size="19" fill="#64748B" text-anchor="middle">Three good parts give a worse system.</text>
  <text x="318" y="366" font-size="19" fill="#64748B" text-anchor="middle">Every extra step in the path has a price.</text>
  <rect x="628" y="66" width="588" height="320" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="104" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">Side by side: only one must answer</text>
  <g filter="url(#kd4-soft)"><rect x="706" y="150" width="208" height="58" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="810" y="186" font-size="19" fill="#0F172A" text-anchor="middle">machine A</text>
  <text x="810" y="232" font-size="19" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99%</text>
  <g filter="url(#kd4-soft)"><rect x="926" y="150" width="208" height="58" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1030" y="186" font-size="19" fill="#0F172A" text-anchor="middle">machine B</text>
  <text x="1030" y="232" font-size="19" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">99%</text>
  <text x="922" y="296" font-size="23" font-weight="700" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">1% x 1% = 0.01% down</text>
  <text x="922" y="336" font-size="19" fill="#64748B" text-anchor="middle">The pair is down only if both are down</text>
  <text x="922" y="366" font-size="19" fill="#64748B" text-anchor="middle">at the same time, so the pair is 99.99%.</text>
</svg>