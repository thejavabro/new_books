<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The checkout saga: four forward steps (create order, reserve stock, charge card, start fulfillment) each commit locally and announce the next, and when the card is declined at step 3 the compensations run in reverse order, releasing the reservation and cancelling the order.">
  <defs>
    <marker id="m05-l04-saga-steps-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l04-saga-steps-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l04-saga-steps-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="60" y="70" width="1120" height="250" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="110" font-size="20" font-weight="600" fill="#92400E">Forward path: four local transactions</text>
  <text x="1160" y="110" text-anchor="end" font-size="20" fill="#64748B">between steps the system sits in intermediate states</text>
  <g filter="url(#m05-l04-saga-steps-soft)">
    <rect x="80" y="180" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="205" y="220" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Create order</text>
  <text x="205" y="252" text-anchor="middle" font-size="20" fill="#64748B">Order service</text>
  <text x="205" y="284" text-anchor="middle" font-size="20" fill="#64748B">status: pending</text>
  <g filter="url(#m05-l04-saga-steps-soft)">
    <rect x="360" y="180" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="485" y="220" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Reserve stock</text>
  <text x="485" y="252" text-anchor="middle" font-size="20" fill="#64748B">Inventory service</text>
  <text x="485" y="284" text-anchor="middle" font-size="20" fill="#64748B">2 units held</text>
  <g filter="url(#m05-l04-saga-steps-soft)">
    <rect x="640" y="180" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="765" y="220" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3. Charge card</text>
  <text x="765" y="252" text-anchor="middle" font-size="20" fill="#64748B">Payment service</text>
  <text x="765" y="284" text-anchor="middle" font-size="20" fill="#64748B">charge $59</text>
  <g filter="url(#m05-l04-saga-steps-soft)">
    <rect x="920" y="180" width="250" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1045" y="220" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">4. Start fulfillment</text>
  <text x="1045" y="252" text-anchor="middle" font-size="20" fill="#64748B">Fulfillment service</text>
  <text x="1045" y="284" text-anchor="middle" font-size="20" fill="#64748B">order is confirmed</text>

  <rect x="60" y="400" width="1120" height="250" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="440" font-size="20" font-weight="600" fill="#B91C1C">Compensation path: undo in reverse order</text>
  <text x="1160" y="440" text-anchor="end" font-size="20" fill="#64748B">every step must be idempotent</text>
  <g filter="url(#m05-l04-saga-steps-soft)">
    <rect x="80" y="510" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="205" y="550" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cancel order</text>
  <text x="205" y="582" text-anchor="middle" font-size="20" fill="#64748B">Order service</text>
  <text x="205" y="614" text-anchor="middle" font-size="20" fill="#64748B">undoes step 1</text>
  <g filter="url(#m05-l04-saga-steps-soft)">
    <rect x="360" y="510" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="485" y="550" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Release reservation</text>
  <text x="485" y="582" text-anchor="middle" font-size="20" fill="#64748B">Inventory service</text>
  <text x="485" y="614" text-anchor="middle" font-size="20" fill="#64748B">undoes step 2</text>
  <g filter="url(#m05-l04-saga-steps-soft)">
    <rect x="660" y="510" width="520" height="130" rx="10" fill="#FFFFFF" stroke="#F87171" stroke-width="1.5"/>
  </g>
  <text x="920" y="550" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">No compensation for steps 3 and 4</text>
  <text x="920" y="582" text-anchor="middle" font-size="20" fill="#64748B">step 3 never completed, step 4 is last</text>
  <text x="920" y="614" text-anchor="middle" font-size="20" fill="#64748B">a compensation is a new business action</text>

  <g fill="none" stroke-width="2.5">
    <path d="M330,245 L352,245" stroke="#D97706" marker-end="url(#m05-l04-saga-steps-ab)"/>
    <path d="M610,245 L632,245" stroke="#D97706" marker-end="url(#m05-l04-saga-steps-ab)"/>
    <path d="M890,245 L912,245" stroke="#D97706" marker-end="url(#m05-l04-saga-steps-ab)"/>
    <path d="M765,310 L765,360 L485,360 L485,502" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m05-l04-saga-steps-rd)"/>
    <path d="M360,575 L338,575" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m05-l04-saga-steps-rd)"/>
  </g>

  <text x="345" y="160" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">order created</text>
  <text x="625" y="160" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">stock reserved</text>
  <text x="905" y="160" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">payment succeeded</text>
  <text x="620" y="348" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">card declined at step 3</text>

  <line x1="60" y1="700" x2="96" y2="700" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="707" font-size="20" fill="#475569">Forward step: commit locally, then announce the next step</text>
  <line x1="60" y1="740" x2="96" y2="740" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="747" font-size="20" fill="#475569">Compensation: undoes a completed step, in reverse order</text>
</svg>