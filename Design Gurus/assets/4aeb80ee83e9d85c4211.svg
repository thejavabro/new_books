<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="678" viewBox="0 0 1240 678" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One request drawn as a span waterfall across four services, showing that most of the 420 millisecond total is a single database query inside the catalog service">
  <rect x="0" y="0" width="1240" height="678" fill="#FFFFFF"/>
  <defs>
    <marker id="ob3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One request, four services, and where the 420 milliseconds went</text>

  <text x="270" y="94" font-size="20" font-weight="600" fill="#475569" text-anchor="end">service</text>

  <text x="270" y="157" font-size="20" fill="#0F172A" text-anchor="end">api-gateway</text>
  <rect x="280" y="130" width="900" height="40" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="730" y="157" font-size="20" fill="#1E40AF" text-anchor="middle">420 ms total</text>

  <text x="270" y="209" font-size="20" fill="#0F172A" text-anchor="end">auth-service</text>
  <rect x="301" y="182" width="65" height="40" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="380" y="209" font-size="20" fill="#334155">30 ms</text>

  <text x="270" y="261" font-size="20" fill="#0F172A" text-anchor="end">catalog-service</text>
  <rect x="376" y="234" width="738" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="745" y="261" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">345 ms</text>

  <text x="270" y="313" font-size="20" fill="#0F172A" text-anchor="end">postgres</text>
  <rect x="408" y="286" width="685" height="40" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="750" y="313" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">320 ms, one query</text>

  <text x="270" y="365" font-size="20" fill="#0F172A" text-anchor="end">render</text>
  <rect x="1125" y="338" width="43" height="40" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1115" y="365" font-size="20" fill="#334155" text-anchor="end">20 ms</text>

  <line x1="280" y1="398" x2="1190" y2="398" stroke="#475569" stroke-width="2" marker-end="url(#ob3-slate)"/>
  <text x="280" y="424" font-size="20" fill="#64748B" text-anchor="middle">0</text>
  <text x="494" y="424" font-size="20" fill="#64748B" text-anchor="middle">100 ms</text>
  <text x="708" y="424" font-size="20" fill="#64748B" text-anchor="middle">200 ms</text>
  <text x="922" y="424" font-size="20" fill="#64748B" text-anchor="middle">300 ms</text>
  <text x="1136" y="424" font-size="20" fill="#64748B" text-anchor="middle">400 ms</text>

  <rect x="50" y="456" width="1140" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="498" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">The gateway looks slow, but 320 of its 420 ms are one database query it is waiting on.</text>

  
  <rect x="50" y="556" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="592" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A trace does not tell you something is slow. It tells you which of the four services owns the slowness.</text>
  <text x="620" y="622" font-size="20" fill="#334155" text-anchor="middle">Without it you are guessing, and the service that looks slowest is usually the one doing the waiting.</text>
</svg>