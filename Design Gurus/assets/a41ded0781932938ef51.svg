<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="576" viewBox="0 0 1240 576" role="img" aria-label="Large files go into object storage and the database keeps only the metadata row pointing at them. The CDN then serves the file straight from object storage, so neither the database nor your servers carry the bytes.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="576" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Uploading</text>
  <rect x="50" y="85" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="120" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Client</text>
  <text x="150" y="145" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">uploads a photo</text>
  <rect x="370" y="85" width="240" height="74" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="490" y="129" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Upload service</text>
  <line x1="252" y1="122" x2="368" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="740" y="44" width="420" height="76" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="950" y="80" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Object storage</text>
  <text x="950" y="105" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the 2 MB file itself</text>
  <path d="M612 108 C 720 108, 720 82, 738 82" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ar-grn)"/>
  <text x="672" y="56" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the bytes</text>
  <path d="M740 177 v66 a210 13 0 0 0 420 0 v-66 z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <ellipse cx="950" cy="177" rx="210" ry="13" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="950" y="204" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Database</text>
  <text x="950" y="230" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">owner, created_at, path</text>
  <path d="M612 138 C 720 138, 720 194, 738 194" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <rect x="611" y="146" width="150" height="28" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <text x="686" y="167" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">one small row</text>
  <line x1="40" y1="286" x2="1200" y2="286" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="40" y="330" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reading</text>
  <rect x="50" y="363" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="407" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Client</text>
  <rect x="370" y="363" width="240" height="74" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="490" y="407" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">CDN</text>
  <rect x="740" y="363" width="420" height="74" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="950" y="407" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Object storage</text>
  <line x1="252" y1="400" x2="368" y2="400" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="612" y1="400" x2="738" y2="400" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="620" y="366" width="110" height="28" rx="8" fill="#FFFFFF" opacity="0.95"/>
  <text x="675" y="387" font-size="20" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">on a miss</text>
  <text x="490" y="458" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the database is never touched to serve a file</text>
  <rect x="40" y="496" width="1160" height="60" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="533" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Databases are bad at storing large files. Keep the bytes out and store the path instead.</text>
</svg>