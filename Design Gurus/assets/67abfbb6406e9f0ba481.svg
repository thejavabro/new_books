<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="798" viewBox="0 0 1240 798" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="wrong-title wrong-desc">
<title id="wrong-title">What goes wrong specifically here</title>
<desc id="wrong-desc">A monthly job writing through a forgotten path, reporting consumers outside your service, dual writing against upstream timeouts, and a comparison job that is itself significant load on the primary.</desc>
<defs>
<marker id="wrong-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="wrong-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="wrong-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="wrong-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="798" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What goes wrong specifically here</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four details that are particular to this table rather than general, and each has caught real teams.</text>
<rect x="40" y="720" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="720" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Month-end</text>
<path d="M526 150H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 150H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="118" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a job runs once a month and writes through a path nobody</text><text x="590" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">remembers; it will not appear in a week of testing</text>
<rect x="40" y="194" width="480" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reporting reads the old column</text>
<path d="M526 226H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 226H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="194" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">analytics, finance exports and a dashboard from two years</text><text x="590" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">ago, none of them in your deploy</text>
<rect x="40" y="270" width="480" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write latency during dual writing</text>
<path d="M526 302H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 302H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="270" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">four hundred writes a second each doing more work, against</text><text x="590" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">upstream timeouts set at the old latency</text>
<rect x="40" y="346" width="480" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The comparison job is itself load</text>
<path d="M526 378H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 378H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrong-marker-slate)"/>
<rect x="570" y="346" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">run it on a replica, and filter by row age so replication</text><text x="590" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">lag does not generate noise</text>
<rect x="40" y="442" width="1160" height="86" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="442" width="5" height="86" rx="2.5" fill="#F28B9D"/><text x="64" y="477.5" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">The retention period before dropping the old column</text><text x="64" y="504.5" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">is agreed with the people who own those reports, not estimated by you.</text>
<rect x="40" y="560" width="1160" height="128" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="560" width="5" height="128" rx="2.5" fill="#39D5AA"/><text x="64" y="591" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The attitude being assessed</text><text x="64" y="617" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Every decision optimizes for the migration being wrong somewhere,</text><text x="64" y="643" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">rather than for it finishing sooner.</text><text x="64" y="669" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">In a payments table that is the only defensible stance.</text>
<text x="66" y="754" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Noise in the comparison trains everybody to ignore the signal.</text>
</svg>