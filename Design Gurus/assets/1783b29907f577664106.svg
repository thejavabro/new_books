<rect x="712" y="350" width="38" height="38" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="731" y="376.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">b</text>
<rect x="60" y="408" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<rect x="80" y="414" width="42" height="42" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="101" y="442.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">b</text>
<text x="210" y="442" font-size="18.5" fill="#475569">top is also 'b', so the pair cancels</text>
<rect x="670" y="416" width="38" height="38" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="689" y="442.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<rect x="60" y="474" width="880" height="58" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<rect x="80" y="480" width="42" height="42" rx="8" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="101" y="508.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<text x="210" y="508" font-size="18.5" fill="#475569">top is also 'a', so the pair cancels</text>
<text x="676" y="508" text-anchor="start" font-size="18.5" fill="#6B7280">empty</text>
<rect x="60" y="540" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<rect x="80" y="546" width="42" height="42" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
