<text x="257" y="162.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<text x="257" y="200" text-anchor="middle" font-size="18.5" fill="#6B7280">3</text>
<rect x="284" y="132" width="46" height="46" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="307" y="162.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">c</text>
<text x="307" y="200" text-anchor="middle" font-size="18.5" fill="#6B7280">4</text>
