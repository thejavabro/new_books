<rect x="0" y="0" width="1000" height="822" fill="#FFFFFF"/>
<text x="500" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Removing adjacent duplicates with a stack</text>
<text x="500" y="90" text-anchor="middle" font-size="19" fill="#475569">Input: "abbaca". Each character either cancels the top of the stack or is pushed onto it.</text>
