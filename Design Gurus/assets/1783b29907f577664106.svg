<rect x="670" y="548" width="38" height="38" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="689" y="574.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">c</text>
<rect x="60" y="606" width="880" height="58" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<rect x="80" y="612" width="42" height="42" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="101" y="640.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<text x="210" y="640" font-size="18.5" fill="#475569">top is 'c', different, so push 'a'</text>
<rect x="670" y="614" width="38" height="38" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="689" y="640.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">c</text>
<rect x="712" y="614" width="38" height="38" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="731" y="640.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<rect x="60" y="694" width="880" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="84" y="714" width="190" height="38" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="179" y="739" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Answer: "ca"</text>
<text x="298" y="739" font-size="18.5" fill="#475569">whatever is left on the stack, read from the bottom up.</text>
<text x="84" y="770" font-size="18.5" fill="#475569">A character is only ever compared with the top of the stack, which is why one pass is enough.</text>
</svg>