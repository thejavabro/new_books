<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="822" viewBox="0 0 1000 822" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Stack trace for removing adjacent duplicates from the string abbaca">
