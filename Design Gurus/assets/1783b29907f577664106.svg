<text x="210" y="310" font-size="18.5" fill="#475569">stack is empty, so push 'a'</text>
<rect x="670" y="284" width="38" height="38" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="689" y="310.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<text x="724" y="309" text-anchor="start" font-size="18.5" fill="#6B7280">bottom to top</text>
