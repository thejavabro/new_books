<text x="408" y="162" text-anchor="start" font-size="18.5" fill="#6B7280">the input, index below each cell</text>
<text x="84" y="258" font-size="19.5" font-weight="600" fill="#475569">Step</text>
<text x="210" y="258" font-size="19.5" font-weight="600" fill="#475569">What happens</text>
<text x="670" y="258" font-size="19.5" font-weight="600" fill="#475569">Stack afterwards</text>
<rect x="60" y="276" width="880" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<rect x="80" y="282" width="42" height="42" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
