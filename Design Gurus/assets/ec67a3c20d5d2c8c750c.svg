<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six steps of a microservices design walkthrough in dependency order: requirements and scale in 5 minutes, boundaries and data ownership in 5 to 7 minutes, communication per edge in 5 minutes, data and consistency in 7 to 10 minutes, failure handling in 5 to 7 minutes, operations in 3 to 5 minutes, with each step feeding the next and the budgets adding up to about 35 minutes of design time.">
  <defs>
    <marker id="m07-l01-six-steps-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m07-l01-six-steps-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <rect x="40" y="110" width="1160" height="500" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="155" font-size="20" font-weight="600" fill="#334155">Dependency order: each step's output is the next step's input</text>
  <text x="1180" y="155" text-anchor="end" font-size="20" fill="#64748B">about 35 minutes of design time</text>

  <g filter="url(#m07-l01-six-steps-soft)">
    <rect x="50" y="220" width="350" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="225" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1. Requirements and scale</text>
  <text x="225" y="313" text-anchor="middle" font-size="20" fill="#64748B">5 min: verbs, numbers, what is hard</text>
  <g filter="url(#m07-l01-six-steps-soft)">
    <rect x="445" y="220" width="350" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="265" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">2. Boundaries and data</text>
  <text x="620" y="297" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">ownership</text>
  <text x="620" y="329" text-anchor="middle" font-size="20" fill="#64748B">5 to 7 min: who writes what</text>
  <g filter="url(#m07-l01-six-steps-soft)">
    <rect x="840" y="220" width="350" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1015" y="281" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3. Communication per edge</text>
  <text x="1015" y="313" text-anchor="middle" font-size="20" fill="#64748B">5 min: sync or async, by who waits</text>
  <g filter="url(#m07-l01-six-steps-soft)">
    <rect x="50" y="440" width="350" height="140" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
  </g>
  <text x="225" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">4. Data and consistency</text>
  <text x="225" y="533" text-anchor="middle" font-size="20" fill="#64748B">7 to 10 min: sagas and idempotency</text>
  <g filter="url(#m07-l01-six-steps-soft)">
    <rect x="445" y="440" width="350" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">5. Failure handling</text>
  <text x="620" y="533" text-anchor="middle" font-size="20" fill="#64748B">5 to 7 min: the two scariest edges</text>
  <g filter="url(#m07-l01-six-steps-soft)">
    <rect x="840" y="440" width="350" height="140" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1015" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">6. Operations</text>
  <text x="1015" y="533" text-anchor="middle" font-size="20" fill="#64748B">3 to 5 min: canaries, tracing, alerts</text>

  <g fill="none" stroke="#475569" stroke-width="2.5">
    <path d="M400,290 L437,290" marker-end="url(#m07-l01-six-steps-sl)"/>
    <path d="M795,290 L832,290" marker-end="url(#m07-l01-six-steps-sl)"/>
    <path d="M1015,360 L1015,404 L225,404 L225,432" marker-end="url(#m07-l01-six-steps-sl)"/>
    <path d="M400,510 L437,510" marker-end="url(#m07-l01-six-steps-sl)"/>
    <path d="M795,510 L832,510" marker-end="url(#m07-l01-six-steps-sl)"/>
  </g>

  <text x="620" y="382" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">each edge typed sync or async before you go deeper</text>

  <rect x="40" y="640" width="1160" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="683" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">Throughout: every time you draw an arrow, say what happens when that call is slow or fails.</text>
</svg>