<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A DBMS sits between the application and the data, and comes in a relational family that uses tables and SQL and a non-relational family with several other data models">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="db1-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="db1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="620" y1="118" x2="620" y2="150" stroke="#475569" stroke-width="2.5" marker-end="url(#db1-slate)"/>
  <line x1="440" y1="222" x2="330" y2="256" stroke="#475569" stroke-width="2.5" marker-end="url(#db1-slate)"/>
  <line x1="800" y1="222" x2="910" y2="256" stroke="#475569" stroke-width="2.5" marker-end="url(#db1-slate)"/>

  <g filter="url(#db1-soft)">
    <rect x="440" y="60" width="360" height="58" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="440" y="154" width="360" height="68" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="60" y="260" width="500" height="150" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="680" y="260" width="500" height="150" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="620" y="97" font-size="20" fill="#0F172A" text-anchor="middle">Users and applications</text>
  <text x="620" y="196" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Database Management System</text>

  <text x="310" y="300" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Relational (RDBMS)</text>
  <text x="310" y="338" font-size="20" fill="#334155" text-anchor="middle">Tables with predefined relationships</text>
  <text x="310" y="368" font-size="20" fill="#2563EB" text-anchor="middle">queried with SQL</text>
  <text x="310" y="396" font-size="20" fill="#475569" text-anchor="middle">MySQL, PostgreSQL, SQL Server, Oracle</text>

  <text x="930" y="300" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Non-relational (NoSQL)</text>
  <text x="930" y="338" font-size="20" fill="#334155" text-anchor="middle">Key-value, document, column, graph</text>
  <text x="930" y="368" font-size="20" fill="#059669" text-anchor="middle">scales horizontally</text>
  <text x="930" y="396" font-size="20" fill="#475569" text-anchor="middle">MongoDB, Redis, Cassandra, Neo4j</text>

  <text x="620" y="448" font-size="20" fill="#475569" text-anchor="middle">The DBMS is the software you actually talk to, and it keeps the data consistent, secure and reachable</text>
</svg>