<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With one counter per server the user stays under every local limit while sending ten times the intended total">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="rl8-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rl8-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="rl8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="230" y1="235" x2="305" y2="235" stroke="#475569" stroke-width="2.5" marker-end="url(#rl8-slate)"/>
  <line x1="490" y1="235" x2="595" y2="92" stroke="#475569" stroke-width="2" marker-end="url(#rl8-slate)"/>
  <line x1="490" y1="235" x2="595" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#rl8-slate)"/>
  <line x1="490" y1="235" x2="595" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#rl8-slate)"/>
  <line x1="490" y1="235" x2="595" y2="332" stroke="#475569" stroke-width="2" marker-end="url(#rl8-slate)"/>
  <line x1="940" y1="60" x2="940" y2="364" stroke="#94A3B8" stroke-width="2"/>
  <line x1="940" y1="212" x2="995" y2="212" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rl8-red)"/>

  <g filter="url(#rl8-soft)">
    <rect x="50" y="190" width="180" height="90" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <rect x="310" y="195" width="180" height="80" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <rect x="600" y="60" width="300" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="600" y="140" width="300" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="600" y="220" width="300" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="600" y="300" width="300" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="1000" y="170" width="200" height="86" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>

  <text x="140" y="228" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">One user</text>
  <text x="140" y="258" font-size="20" fill="#475569" text-anchor="middle">limit 100 a minute</text>
  <text x="400" y="242" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Load balancer</text>

  <text x="750" y="99" font-size="20" fill="#1E3A8A" text-anchor="middle">Server 1: count 100</text>
  <text x="750" y="179" font-size="20" fill="#1E3A8A" text-anchor="middle">Server 2: count 100</text>
  <text x="750" y="259" font-size="20" fill="#1E3A8A" text-anchor="middle">Server 3: count 100</text>
  <text x="750" y="339" font-size="20" fill="#1E3A8A" text-anchor="middle">and 7 more</text>

  <text x="1100" y="208" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">Served:</text>
  <text x="1100" y="238" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">1,000</text>

  <text x="620" y="425" font-size="20" font-weight="600" fill="#DC2626" text-anchor="middle">Each server counts to 100, stays inside its own limit, and allows it</text>
  <text x="620" y="458" font-size="20" fill="#475569" text-anchor="middle">The effective limit is the intended limit multiplied by the number of servers</text>
</svg>