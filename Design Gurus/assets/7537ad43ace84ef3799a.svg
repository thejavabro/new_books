  <text x="320" y="839.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Shared</text>
  <text x="320" y="864.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">database</text>
  <g stroke="#2563EB" stroke-width="1.5">
