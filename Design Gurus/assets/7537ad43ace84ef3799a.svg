<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1324" viewBox="0 0 1240 1324" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels compare a well-designed monolith, where a client calls one application of four separate modules that call each other only through their interfaces, over a shared database, with a big ball of mud, where the same four modules call each other in every direction; six check rows and six cross rows list the traits of each">
