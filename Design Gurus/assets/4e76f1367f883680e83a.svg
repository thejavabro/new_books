<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="744" viewBox="0 0 1240 744" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="three-title three-desc">
<title id="three-title">Three words, three different things</title>
<desc id="three-desc">The indicator is a measurement, the objective is a target for it over a window, and the agreement is a contract with a consequence. Collapsing them is where most confusion about reliability targets comes from.</desc>
<defs>
<marker id="three-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="three-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="three-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="three-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="744" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three words, three different things</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Collapsing them is where most confusion about reliability targets comes from.</text>
<rect x="40" y="666" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="666" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="150" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="115" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">SLI</text>
<rect x="206" y="118" width="270" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="341" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the indicator</text>
<path d="M482 148H516" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M482 148H516" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#three-marker-slate)"/>
<rect x="526" y="118" width="674" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="546" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a measurement computed from data the system already produces</text>
<path d="M115 180V204" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M115 180V204" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#three-marker-slate)"/>
<rect x="40" y="206" width="150" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="115" y="242" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">SLO</text>
<rect x="206" y="206" width="270" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="341" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the objective</text>
<path d="M482 236H516" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M482 236H516" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#three-marker-slate)"/>
<rect x="526" y="206" width="674" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="546" y="242" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a target for that measurement, over a stated window</text>
<path d="M115 268V292" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M115 268V292" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#three-marker-slate)"/>
<rect x="40" y="294" width="150" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="115" y="330" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">SLA</text>
<rect x="206" y="294" width="270" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="341" y="330" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the agreement</text>
<path d="M482 324H516" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M482 324H516" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#three-marker-slate)"/>
<rect x="526" y="294" width="674" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="546" y="330" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a contract with a consequence if you miss it</text>
<rect x="40" y="372" width="1160" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="372" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="64" y="408" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Each depends on the one before it</text><text x="64" y="434" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">You cannot target what you do not measure, or promise what you have not held.</text>
<rect x="40" y="478" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="478" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="519" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The usual state: an inherited SLA, no SLO, and an SLI nobody has computed.</text>
<rect x="40" y="568" width="560" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="610" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The SLA is a commercial decision</text>
<rect x="640" y="568" width="560" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="596.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The SLO is an engineering one,</text><text x="920" y="623.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">and has to be the stricter</text>
<text x="66" y="700" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The objective exists so you find out you are in trouble before the contract does.</text>
</svg>