<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="915" viewBox="0 0 1240 915" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The nine findings of the copilot critique in five severity tiers, critiqued from the top: violated invariants, missing feedback loops, reliability gaps, economics, and quality opportunities">
  <defs>
    <filter id="c8st-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c8st-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c8st-k1"><rect x="100" y="56" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k2"><rect x="468" y="56" width="716" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k3"><rect x="100" y="202" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k4"><rect x="468" y="202" width="716" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k5"><rect x="100" y="348" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k6"><rect x="468" y="348" width="716" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k7"><rect x="100" y="494" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k8"><rect x="468" y="494" width="716" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k9"><rect x="100" y="640" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="c8st-k10"><rect x="468" y="640" width="716" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="915" fill="#FFFFFF"/>
  <path d="M52,56 V743" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
  <path d="M40,741 L64,741 L52,759 Z" fill="#64748B"/>
  <text transform="translate(84,407.5) rotate(-90)" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">critique in this order</text>
  <g filter="url(#c8st-soft)">
    <rect x="100" y="56" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="100" y="56" width="6" height="90" fill="#7C3AED" clip-path="url(#c8st-k1)"/>
  </g>
  <circle cx="138" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,90.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="164" y="108" font-size="18.5" font-weight="600" fill="#111827">Tier 1: Violated invariants</text>
  <text x="270" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">the harm cannot be undone</text>
  <g filter="url(#c8st-soft)">
    <rect x="468" y="56" width="716" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="468" y="56" width="6" height="90" fill="#7C3AED" clip-path="url(#c8st-k2)"/>
  </g>
  <text x="496" y="82.5" font-size="15.5" fill="#111827">1. No permission filtering on retrieval</text>
  <text x="496" y="106.5" font-size="15.5" fill="#111827">2. The SQL tool is under-scoped</text>
  <text x="496" y="130.5" font-size="15.5" fill="#111827">3. No injection defense</text>
  <g filter="url(#c8st-soft)">
    <rect x="100" y="202" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="100" y="202" width="6" height="90" fill="#4F46E5" clip-path="url(#c8st-k3)"/>
  </g>
  <circle cx="138" cy="247" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,236.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="164" y="254" font-size="18.5" font-weight="600" fill="#111827">Tier 2: Missing feedback loops</text>
  <text x="270" y="317" font-size="15.5" text-anchor="middle" fill="#6B7280">nobody can see the other problems</text>
  <g filter="url(#c8st-soft)">
    <rect x="468" y="202" width="716" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="468" y="202" width="6" height="90" fill="#4F46E5" clip-path="url(#c8st-k4)"/>
  </g>
  <text x="496" y="240.5" font-size="15.5" fill="#111827">4. No evaluation of any kind</text>
  <text x="496" y="264.5" font-size="15.5" fill="#111827">5. Nothing to learn from</text>
  <g filter="url(#c8st-soft)">
    <rect x="100" y="348" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="348" width="6" height="90" fill="#2563EB" clip-path="url(#c8st-k5)"/>
  </g>
  <circle cx="138" cy="393" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,382.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="164" y="400" font-size="18.5" font-weight="600" fill="#111827">Tier 3: Reliability gaps</text>
  <text x="270" y="463" font-size="15.5" text-anchor="middle" fill="#6B7280">the team can see and fix them</text>
  <g filter="url(#c8st-soft)">
    <rect x="468" y="348" width="716" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="468" y="348" width="6" height="90" fill="#2563EB" clip-path="url(#c8st-k6)"/>
  </g>
  <text x="496" y="386.5" font-size="15.5" fill="#111827">6. The nightly full re-index</text>
  <text x="496" y="410.5" font-size="15.5" fill="#111827">7. No fallback ladder</text>
  <g filter="url(#c8st-soft)">
    <rect x="100" y="494" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="100" y="494" width="6" height="90" fill="#D97706" clip-path="url(#c8st-k7)"/>
  </g>
  <circle cx="138" cy="539" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,528.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="164" y="546" font-size="18.5" font-weight="600" fill="#111827">Tier 4: Economics</text>
  <text x="270" y="609" font-size="15.5" text-anchor="middle" fill="#6B7280">the design can be made cheaper later</text>
  <g filter="url(#c8st-soft)">
    <rect x="468" y="494" width="716" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="468" y="494" width="6" height="90" fill="#D97706" clip-path="url(#c8st-k8)"/>
  </g>
  <text x="496" y="544.5" font-size="15.5" fill="#111827">8. A frontier model on every query</text>
  <g filter="url(#c8st-soft)">
    <rect x="100" y="640" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="100" y="640" width="6" height="90" fill="#059669" clip-path="url(#c8st-k9)"/>
  </g>
  <circle cx="138" cy="685" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,674.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="164" y="692" font-size="18.5" font-weight="600" fill="#111827">Tier 5: Quality opportunities</text>
  <text x="270" y="755" font-size="15.5" text-anchor="middle" fill="#6B7280">they pay off once quality can be measured</text>
  <g filter="url(#c8st-soft)">
    <rect x="468" y="640" width="716" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="468" y="640" width="6" height="90" fill="#059669" clip-path="url(#c8st-k10)"/>
  </g>
  <text x="496" y="690.5" font-size="15.5" fill="#111827">9. Pure vector retrieval</text>
  <rect x="40" y="799" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="844" text-anchor="middle" font-size="16" fill="#475569">Say the findings from the top tier down, each with a consequence and a fix.</text>
</svg>