<g font-size="15.5" font-weight="600" fill="#5B21B6">
<text x="704" y="325">table</text>
<text x="704" y="363">column</text>
<text x="704" y="401">column</text>
<text x="704" y="439">rule</text>
</g>
<g font-size="15.5" fill="#111827">
<text x="800" y="325">Contacts</text>
<text x="800" y="363">name, text, never empty</text>
<text x="800" y="401">phone, text, never empty</text>
<text x="800" y="439">phone must be unique</text>
</g>

<rect x="40" y="534" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="572" font-size="16" fill="#475569">The catalog is what makes a database describe itself. A plain file has no such part, so only the program that wrote it can read it.</text>
</svg>