<text x="554" y="104" font-size="18.5" font-weight="600" fill="#111827">Any application</text>

<rect x="76" y="252" width="548" height="224" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="100" y="282" font-size="16.5" font-weight="600" fill="#1D4ED8">The data</text>
<g stroke="#93C5FD" stroke-width="1.2">
<rect x="100" y="300" width="250" height="38" fill="#DBEAFE"/>
<rect x="350" y="300" width="250" height="38" fill="#DBEAFE"/>
<rect x="100" y="338" width="250" height="38" fill="#FFFFFF"/>
<rect x="350" y="338" width="250" height="38" fill="#FFFFFF"/>
<rect x="100" y="376" width="250" height="38" fill="#FFFFFF"/>
<rect x="350" y="376" width="250" height="38" fill="#FFFFFF"/>
<rect x="100" y="414" width="250" height="38" fill="#FFFFFF"/>
<rect x="350" y="414" width="250" height="38" fill="#FFFFFF"/>
</g>
<g font-size="15.5" font-weight="600" fill="#1D4ED8">
<text x="116" y="325">name</text>
<text x="366" y="325">phone</text>
</g>
<g font-size="15.5" fill="#111827">
<text x="116" y="363">Priya Sharma</text>
<text x="366" y="363">98765 43210</text>
<text x="116" y="401">Arun Nair</text>
<text x="366" y="401">91234 56789</text>
<text x="116" y="439">Meera Rao</text>
<text x="366" y="439">99887 76655</text>
</g>

<rect x="664" y="252" width="500" height="224" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="688" y="282" font-size="16.5" font-weight="600" fill="#5B21B6">The catalog</text>
<g stroke="#C4B5FD" stroke-width="1.2" fill="#FFFFFF">
<rect x="688" y="300" width="452" height="38"/>
<rect x="688" y="338" width="452" height="38"/>
<rect x="688" y="376" width="452" height="38"/>
<rect x="688" y="414" width="452" height="38"/>
