<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="638" viewBox="0 0 1240 638" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A database holds both the stored data and a catalog describing that data, so an application can ask what tables and columns exist">
