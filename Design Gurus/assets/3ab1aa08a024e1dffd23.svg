<path d="M680,150 V170 Q680,182 692,182 H902 Q914,182 914,194 V252" stroke="#7C3AED" marker-end="url(#rdb04-mviolet)"/>
</g>
<g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
<text x="455" y="172" fill="#1D4ED8">give me the rows</text>
<text x="808" y="172" fill="#5B21B6">what columns exist?</text>
</g>

