<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="SQL and NoSQL compared on storage, schema, querying, scalability and transactional guarantees">
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <defs>
    <filter id="db2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="380" y="72" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">SQL</text>
  <text x="920" y="72" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">NoSQL</text>

  <g filter="url(#db2-soft)">
    <rect x="200" y="96" width="360" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="200" y="180" width="360" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="200" y="264" width="360" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="200" y="348" width="360" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="200" y="432" width="360" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

    <rect x="740" y="96" width="360" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="740" y="180" width="360" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="740" y="264" width="360" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="740" y="348" width="360" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="740" y="432" width="360" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="650" y="139" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Storage</text>
  <text x="650" y="223" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Schema</text>
  <text x="650" y="307" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Querying</text>
  <text x="650" y="391" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Scaling</text>
  <text x="650" y="475" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Transactions</text>

  <text x="380" y="139" font-size="20" fill="#1E3A8A" text-anchor="middle">Tables of rows and columns</text>
  <text x="380" y="223" font-size="20" fill="#1E3A8A" text-anchor="middle">Fixed, decided up front</text>
  <text x="380" y="307" font-size="20" fill="#1E3A8A" text-anchor="middle">SQL, powerful and general</text>
  <text x="380" y="391" font-size="20" fill="#1E3A8A" text-anchor="middle">Vertical, and expensive</text>
  <text x="380" y="475" font-size="20" fill="#1E3A8A" text-anchor="middle">ACID compliant</text>

  <text x="920" y="139" font-size="20" fill="#065F46" text-anchor="middle">Key-value, document, graph</text>
  <text x="920" y="223" font-size="20" fill="#065F46" text-anchor="middle">Dynamic, extended as you go</text>
  <text x="920" y="307" font-size="20" fill="#065F46" text-anchor="middle">Varies with the data model</text>
  <text x="920" y="391" font-size="20" fill="#065F46" text-anchor="middle">Horizontal, on cheap hardware</text>
  <text x="920" y="475" font-size="20" fill="#065F46" text-anchor="middle">Usually traded for availability</text>
</svg>