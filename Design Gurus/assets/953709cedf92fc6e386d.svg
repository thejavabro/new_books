<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="908" viewBox="0 0 1240 908" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same resource changed two ways. PUT replaces the whole representation, so a field the caller leaves out is reset to its default. PATCH changes only the named fields, so a field the caller leaves out is unchanged.">
  <defs>
    <filter id="xl03putvspa-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl03putvspa-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <marker id="xl03putvspa-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <clipPath id="xl03putvspa-k1"><rect x="64" y="92" width="352" height="48" rx="10"/></clipPath>
    <clipPath id="xl03putvspa-k2"><rect x="444" y="92" width="352" height="48" rx="10"/></clipPath>
    <clipPath id="xl03putvspa-k3"><rect x="824" y="92" width="352" height="48" rx="10"/></clipPath>
    <clipPath id="xl03putvspa-k4"><rect x="84" y="270" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl03putvspa-k5"><rect x="84" y="366" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl03putvspa-k6"><rect x="84" y="462" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03putvspa-k7"><rect x="84" y="628" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03putvspa-k8"><rect x="684" y="270" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl03putvspa-k9"><rect x="684" y="366" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl03putvspa-k10"><rect x="684" y="462" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="xl03putvspa-k11"><rect x="684" y="628" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="908" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="72" font-size="16.5" font-weight="600" fill="#475569">The difference is what an omitted field means</text>
  <text x="1176" y="72" text-anchor="end" font-size="15.5" fill="#6B7280">current preferences on the server</text>

  <g filter="url(#xl03putvspa-soft)">
    <rect x="64" y="92" width="352" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="92" width="6" height="48" fill="#64748B" clip-path="url(#xl03putvspa-k1)"/>
  </g>
  <circle cx="98" cy="116" r="4.5" fill="#64748B"/>
  <text x="122" y="123" font-size="18.5" font-weight="600" fill="#111827">email_updates: true</text>

  <g filter="url(#xl03putvspa-soft)">
    <rect x="444" y="92" width="352" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="444" y="92" width="6" height="48" fill="#64748B" clip-path="url(#xl03putvspa-k2)"/>
  </g>
  <circle cx="478" cy="116" r="4.5" fill="#64748B"/>
  <text x="502" y="123" font-size="18.5" font-weight="600" fill="#111827">product_updates: false</text>

  <g filter="url(#xl03putvspa-soft)">
    <rect x="824" y="92" width="352" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="824" y="92" width="6" height="48" fill="#64748B" clip-path="url(#xl03putvspa-k3)"/>
  </g>
  <circle cx="858" cy="116" r="4.5" fill="#64748B"/>
  <text x="882" y="123" font-size="18.5" font-weight="600" fill="#111827">weekly_summary: true</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M430,164 V195" marker-end="url(#xl03putvspa-sl)"/>
    <path d="M810,164 V195" marker-end="url(#xl03putvspa-sl)"/>
  </g>

  
  <rect x="44" y="196" width="552" height="572" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="84" y="232" font-size="16.5" font-weight="600" fill="#1D4ED8">The PUT request</text>
  <text x="84" y="254" font-size="15.5" fill="#6B7280">replace the whole representation</text>

  <g filter="url(#xl03putvspa-soft)">
    <rect x="84" y="270" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="270" width="6" height="48" fill="#2563EB" clip-path="url(#xl03putvspa-k4)"/>
  </g>
  <circle cx="118" cy="294" r="4.5" fill="#2563EB"/>
  <text x="142" y="301" font-size="18.5" font-weight="600" fill="#111827">PUT /profiles/usr_82M/preferences</text>

  <text x="84" y="352" font-size="15.5" font-weight="600" fill="#1D4ED8">The request body</text>
  <g filter="url(#xl03putvspa-soft)">
    <rect x="84" y="366" width="472" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="366" width="6" height="48" fill="#2563EB" clip-path="url(#xl03putvspa-k5)"/>
  </g>
  <circle cx="118" cy="390" r="4.5" fill="#2563EB"/>
  <text x="142" y="397" font-size="18.5" font-weight="600" fill="#111827">{ "email_updates": false }</text>

  <text x="84" y="448" font-size="15.5" font-weight="600" fill="#1D4ED8">What the server ends up with</text>

  <g filter="url(#xl03putvspa-lift)">
    <rect x="84" y="462" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="84" y="462" width="9" height="90" fill="#2563EB" clip-path="url(#xl03putvspa-k6)"/>
  </g>
  <circle cx="122" cy="507" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,496.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="148" y="514" font-size="18.5" font-weight="600" fill="#111827">Omitted fields are reset</text>
  <text x="320" y="577" font-size="15.5" text-anchor="middle" fill="#6B7280">product_updates and weekly_summary are reset</text>
  <text x="320" y="600" font-size="15.5" text-anchor="middle" fill="#94A3B8">this API defines defaults for omitted fields</text>

  <g filter="url(#xl03putvspa-soft)">
    <rect x="84" y="628" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="628" width="6" height="90" fill="#2563EB" clip-path="url(#xl03putvspa-k7)"/>
  </g>
  <circle cx="122" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,662.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="148" y="680" font-size="18.5" font-weight="600" fill="#111827">Idempotent</text>
  <text x="320" y="743" font-size="15.5" text-anchor="middle" fill="#6B7280">sending it twice leaves the same state</text>

  
  <rect x="644" y="196" width="552" height="572" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="684" y="232" font-size="16.5" font-weight="600" fill="#B45309">The PATCH request</text>
  <text x="684" y="254" font-size="15.5" fill="#6B7280">change only the named fields</text>

  <g filter="url(#xl03putvspa-soft)">
    <rect x="684" y="270" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="270" width="6" height="48" fill="#D97706" clip-path="url(#xl03putvspa-k8)"/>
  </g>
  <circle cx="718" cy="294" r="4.5" fill="#D97706"/>
  <text x="742" y="301" font-size="18.5" font-weight="600" fill="#111827">PATCH /profiles/usr_82M/preferences</text>

  <text x="684" y="352" font-size="15.5" font-weight="600" fill="#B45309">The request body</text>
  <g filter="url(#xl03putvspa-soft)">
    <rect x="684" y="366" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="366" width="6" height="48" fill="#D97706" clip-path="url(#xl03putvspa-k9)"/>
  </g>
  <circle cx="718" cy="390" r="4.5" fill="#D97706"/>
  <text x="742" y="397" font-size="18.5" font-weight="600" fill="#111827">{ "email_updates": false }</text>

  <text x="684" y="448" font-size="15.5" font-weight="600" fill="#B45309">What the server ends up with</text>

  <g filter="url(#xl03putvspa-lift)">
    <rect x="684" y="462" width="472" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="684" y="462" width="9" height="90" fill="#D97706" clip-path="url(#xl03putvspa-k10)"/>
  </g>
  <circle cx="722" cy="507" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,496.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="748" y="514" font-size="18.5" font-weight="600" fill="#111827">Omitted fields are unchanged</text>
  <text x="920" y="577" font-size="15.5" text-anchor="middle" fill="#6B7280">product_updates and weekly_summary are untouched</text>
  <text x="920" y="600" font-size="15.5" text-anchor="middle" fill="#94A3B8">each keeps the value it already had</text>

  <g filter="url(#xl03putvspa-soft)">
    <rect x="684" y="628" width="472" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="628" width="6" height="90" fill="#D97706" clip-path="url(#xl03putvspa-k11)"/>
  </g>
  <circle cx="722" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,662.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="748" y="680" font-size="18.5" font-weight="600" fill="#111827">Not idempotent by method alone</text>
  <text x="920" y="743" font-size="15.5" text-anchor="middle" fill="#6B7280">the method alone gives no such guarantee</text>

  
  <rect x="40" y="792" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="837" text-anchor="middle" font-size="16" fill="#475569">Use PUT for a complete replacement at a known URL. Use PATCH when absent fields must not change.</text>
</svg>