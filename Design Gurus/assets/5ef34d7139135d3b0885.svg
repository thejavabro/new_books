<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="why-title why-desc">
<title id="why-title">Ask why you want the lock</title>
<desc id="why-desc">An efficiency lock stops duplicate work and costs money when it fails. A correctness lock stops two actors acting at once and corrupts data when it fails. They need completely different engineering.</desc>
<defs>
<marker id="why-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="why-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="why-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="why-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="664" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Ask why you want the lock</text>
<text x="40" y="86" font-size="21" fill="#4A5568">These need completely different engineering, and the same mechanism is not appropriate for both.</text>
<rect x="40" y="586" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="586" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="420" y="118" width="400" height="50" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="149" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">Why do you want the lock?</text>
<path d="M520 174V206" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M520 174V206" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-green)"/>
<path d="M720 174V206" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M720 174V206" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-red)"/>
<rect x="40" y="212" width="560" height="216" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 212H46A6 6 0 0 0 40 218V422A6 6 0 0 0 46 428H54Z" fill="#39D5AA"/><text x="70" y="248" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Efficiency</text>
<text x="570" y="248" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">so the same work is not done twice</text>
<rect x="72" y="268" width="500" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="301" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">two workers building the same report</text>
<rect x="72" y="328" width="500" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="361" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">two jobs warming the same cache</text>
<text x="320" y="408" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">a failure costs money and time</text>
<rect x="640" y="212" width="560" height="216" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 212H646A6 6 0 0 0 640 218V422A6 6 0 0 0 646 428H654Z" fill="#F28B9D"/><text x="670" y="248" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Correctness</text>
<text x="1170" y="248" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">so two actors cannot act at once</text>
<rect x="672" y="268" width="500" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="301" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">two processes writing the same file</text>
<rect x="672" y="328" width="500" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="361" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">two workers moving the same money</text>
<text x="920" y="408" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">a failure corrupts data</text>
<rect x="40" y="452" width="1160" height="106" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="452" width="5" height="106" rx="2.5" fill="#AC8BE8"/><text x="64" y="482" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">For efficiency, a best-effort lock is fine and the worst case is a duplicate.</text><text x="64" y="511" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">For correctness, a best-effort lock is worse than no lock,</text><text x="64" y="540" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">because it produces confidence rather than safety.</text>
<text x="66" y="620" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Naming which kind you have is the first senior move available in this topic.</text>
</svg>