<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="692" viewBox="0 0 1240 692" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="twogoals-title twogoals-desc">
<title id="twogoals-title">Two goals that get confused</title>
<desc id="twogoals-desc">Surviving a region failure and serving distant users faster are different problems with different designs. Recovery point and recovery time objectives are the numbers that settle the choice between arrangements.</desc>
<defs>
<marker id="twogoals-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="twogoals-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="twogoals-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="twogoals-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="692" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two goals that get confused</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Multi-region is asked for as one thing and is actually two, with different designs and different costs.</text>
<rect x="40" y="614" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="614" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V276A6 6 0 0 0 46 282H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Surviving a region failure</text>
<rect x="72" y="176" width="496" height="86" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="212.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">An availability goal. Needs a full copy of your</text><text x="92" y="237.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">write path, ready to take over.</text>
<rect x="640" y="118" width="560" height="164" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V276A6 6 0 0 0 646 282H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Serving distant users faster</text>
<rect x="672" y="176" width="496" height="86" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="212.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A latency goal. Needs a read path near the user,</text><text x="692" y="237.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and often nothing on the write path at all.</text>
<rect x="40" y="300" width="1160" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="333" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Teams that mix them up build the expensive answer to the cheap question</text>
<text x="40" y="392" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And the two numbers that settle the choice</text>
<rect x="40" y="410" width="560" height="76" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="320" y="440.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">RPO</text><text x="320" y="467.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">how much data you can afford to lose</text>
<rect x="640" y="410" width="560" height="76" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="920" y="440.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">RTO</text><text x="920" y="467.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">how long you can afford to be down</text>
<rect x="40" y="502" width="1160" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="502" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="64" y="536.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Pick the numbers first, then the cheapest arrangement that reaches them.</text><text x="64" y="565.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Most teams do this backwards.</text>
<text x="66" y="648" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Most teams choose an architecture and then discover what recovery point it happens to give them.</text>
</svg>