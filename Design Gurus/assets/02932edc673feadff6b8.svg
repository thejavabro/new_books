<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1150" viewBox="0 0 1240 1150" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Source code flows through six filters in order: lexical analysis (the lexer) converts characters into tokens; syntax analysis (the parser) builds an abstract syntax tree (AST) from the tokens; semantic analysis checks types and semantic rules and produces a checked AST; IR generation converts the AST to an intermediate representation (IR) in three-address form; optimization improves the IR, for example folding b = a + 1 into b = 6; code generation turns the IR into target code such as machine code or bytecode, the output">
