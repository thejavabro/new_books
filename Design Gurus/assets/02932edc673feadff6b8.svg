  <text x="104" y="299" font-size="21.5" font-weight="600" fill="#111827">Lexical analysis (lexer)</text>
  <text x="104" y="327" font-size="18.5" fill="#6B7280">Converts characters into tokens</text>
  <text x="104" y="449" font-size="21.5" font-weight="600" fill="#111827">Syntax analysis (parser)</text>
  <text x="104" y="477" font-size="18.5" fill="#6B7280">Builds an AST from tokens</text>
  <text x="104" y="599" font-size="21.5" font-weight="600" fill="#111827">Semantic analysis</text>
  <text x="104" y="627" font-size="18.5" fill="#6B7280">Checks types and semantic rules</text>
  <text x="104" y="749" font-size="21.5" font-weight="600" fill="#111827">IR generation</text>
  <text x="104" y="777" font-size="18.5" fill="#6B7280">Converts the AST to an intermediate representation</text>
  <text x="104" y="899" font-size="21.5" font-weight="600" fill="#111827">Optimization (optimizer)</text>
  <text x="104" y="927" font-size="18.5" fill="#6B7280">Improves the IR, for example folding a + 1 into 6</text>
  <text x="104" y="1049" font-size="21.5" font-weight="600" fill="#111827">Code generation</text>
  <text x="104" y="1077" font-size="18.5" fill="#6B7280">Turns the IR into machine code or bytecode</text>
