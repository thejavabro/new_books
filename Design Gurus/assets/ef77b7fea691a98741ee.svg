  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Chord DHT: consistent hashing and ring-based routing</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Nodes and keys share one ring, lookups jump through finger tables, and each key belongs to the next node clockwise.</text>

  <rect x="40" y="120" width="1160" height="470" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Nodes and keys on a ring</text>
