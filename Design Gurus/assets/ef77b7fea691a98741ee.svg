  <text x="450" y="1535.75" font-size="18.5" font-weight="600" fill="#111827">Node D is responsible</text>
  <text x="450" y="1558.25" font-size="18.5" font-weight="600" fill="#111827">for key 50</text>
  <text x="64" y="178" font-size="18.5" fill="#6B7280">Nodes and keys are placed on a circular identifier</text>
  <text x="64" y="204" font-size="18.5" fill="#6B7280">space using consistent hashing.</text>
  <text x="64" y="678" font-size="18.5" fill="#6B7280">A lookup for a key is forwarded through the finger</text>
  <text x="64" y="704" font-size="18.5" fill="#6B7280">table to the node closest to the key without passing</text>
  <text x="64" y="730" font-size="18.5" fill="#6B7280">it, so each hop at least halves the remaining distance.</text>
  <text x="64" y="756" font-size="18.5" fill="#6B7280">The last hop goes to the key's successor, Node D.</text>
  <text x="64" y="1178" font-size="18.5" fill="#6B7280">The key is stored on the first node clockwise from the</text>
  <text x="64" y="1204" font-size="18.5" fill="#6B7280">key ID. For key 50, Node D is responsible.</text>
