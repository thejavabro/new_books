<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="914" viewBox="0 0 1240 914" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The conversation list makes one call and the thread makes two parallel calls, while one WebSocket is opened once for the whole application. Reconnect is tried in order: live replay by event id, then changes by sync position, then a full snapshot. The outbox drains one change at a time per conversation and stops on the first failure.">
  <defs>
    <marker id="p3r-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p3r-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p3r-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3r-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3r-k1"><rect x="80" y="174" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p3r-k2"><rect x="460" y="174" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p3r-k3"><rect x="840" y="174" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p3r-k4"><rect x="80" y="410" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="p3r-k5"><rect x="455" y="410" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="p3r-k6"><rect x="830" y="410" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="p3r-k7"><rect x="100" y="650" width="220" height="48" rx="10"/></clipPath>
    <clipPath id="p3r-k8"><rect x="460" y="650" width="220" height="48" rx="10"/></clipPath>
    <clipPath id="p3r-k9"><rect x="820" y="650" width="220" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="914" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Two screens, one connection, three ways back</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">how the client loads, listens and recovers</text>

  
  <rect x="40" y="126" width="1160" height="212" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">The two screens, and the one connection they share</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">the WebSocket is opened once, not per screen</text>

  
  <g filter="url(#p3r-soft)">
    <rect x="80" y="174" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p3r-k1)"/>
  </g>
  <circle cx="118" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="144" y="226" font-size="18.5" font-weight="600" fill="#111827">Conversation list</text>
  <text x="240" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">1 HTTP call</text>
  <text x="240" y="312" font-size="15.5" text-anchor="middle" fill="#94A3B8">1 blocking network stage</text>

  
  <g filter="url(#p3r-soft)">
    <rect x="460" y="174" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="460" y="174" width="6" height="90" fill="#2563EB" clip-path="url(#p3r-k2)"/>
  </g>
  <circle cx="498" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="524" y="226" font-size="18.5" font-weight="600" fill="#111827">Conversation thread</text>
  <text x="620" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">2 parallel HTTP calls</text>
  <text x="620" y="312" font-size="15.5" text-anchor="middle" fill="#94A3B8">1 blocking network stage</text>

  
  <g filter="url(#p3r-lift)">
    <rect x="840" y="174" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="840" y="174" width="9" height="90" fill="#7C3AED" clip-path="url(#p3r-k3)"/>
  </g>
  <circle cx="878" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,208.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="904" y="226" font-size="18.5" font-weight="600" fill="#111827">One shared WebSocket</text>
  <text x="1000" y="289" font-size="15.5" text-anchor="middle" fill="#6B7280">opened once per application</text>
  <text x="1000" y="312" font-size="15.5" text-anchor="middle" fill="#94A3B8">not reopened per screen</text>

  
  <rect x="40" y="362" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="392" font-size="16.5" font-weight="600" fill="#475569">Reconnect in order. Each step is used only when the one before it cannot serve.</text>
  <text x="1176" y="392" text-anchor="end" font-size="15.5" fill="#6B7280">three ways back</text>

  
  <g fill="none" stroke-width="2">
    <path d="M410,455 H455" stroke="#64748B" marker-end="url(#p3r-sl)"/>
    <path d="M785,455 H830" stroke="#64748B" marker-end="url(#p3r-sl)"/>
  </g>

  
  <g filter="url(#p3r-soft)">
    <rect x="80" y="410" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="410" width="6" height="90" fill="#059669" clip-path="url(#p3r-k4)"/>
  </g>
  <circle cx="118" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,444.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="144" y="462" font-size="18.5" font-weight="600" fill="#111827">Live replay by event id</text>
  <text x="245" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">10,000 events or 10 minutes</text>

  
  <g filter="url(#p3r-soft)">
    <rect x="455" y="410" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="455" y="410" width="6" height="90" fill="#D97706" clip-path="url(#p3r-k5)"/>
  </g>
  <circle cx="493" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,444.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="519" y="462" font-size="18.5" font-weight="600" fill="#111827">Changes by sync position</text>
  <text x="620" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">30 days</text>

  
  <g filter="url(#p3r-soft)">
    <rect x="830" y="410" width="330" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="830" y="410" width="6" height="90" fill="#DB2777" clip-path="url(#p3r-k6)"/>
  </g>
  <circle cx="868" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(857.56,444.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="894" y="462" font-size="18.5" font-weight="600" fill="#111827">Full snapshot</text>
  <text x="995" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">then a fresh position</text>

  
  <rect x="40" y="574" width="1160" height="176" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="604" font-size="16.5" font-weight="600" fill="#B45309">The outbox sends one change at a time per conversation</text>
  <text x="1176" y="604" text-anchor="end" font-size="15.5" fill="#6B7280">three queued changes, sent in order</text>

  
  <g fill="none" stroke-width="2">
    <path d="M320,674 H460" stroke="#059669" marker-end="url(#p3r-em)"/>
    <path d="M680,674 H752" stroke="#DB2777"/>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="3" stroke-linecap="round">
    <path d="M760,664 L780,684"/>
    <path d="M780,664 L760,684"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="750" y="634" fill="#BE185D">a failure stops this queue</text>
  </g>

  
  <g filter="url(#p3r-soft)">
    <rect x="100" y="650" width="220" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="100" y="650" width="6" height="48" fill="#64748B" clip-path="url(#p3r-k7)"/>
  </g>
  <circle cx="134" cy="674" r="4.5" fill="#64748B"/>
  <text x="158" y="681" font-size="18.5" font-weight="600" fill="#111827">change 1</text>
  <text x="210" y="723" font-size="15.5" text-anchor="middle" fill="#6B7280">sent</text>

  
  <g filter="url(#p3r-soft)">
    <rect x="460" y="650" width="220" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="460" y="650" width="6" height="48" fill="#64748B" clip-path="url(#p3r-k8)"/>
  </g>
  <circle cx="494" cy="674" r="4.5" fill="#64748B"/>
  <text x="518" y="681" font-size="18.5" font-weight="600" fill="#111827">change 2</text>
  <text x="570" y="723" font-size="15.5" text-anchor="middle" fill="#6B7280">failed</text>

  
  <g filter="url(#p3r-soft)">
    <rect x="820" y="650" width="220" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="820" y="650" width="6" height="48" fill="#64748B" clip-path="url(#p3r-k9)"/>
  </g>
  <circle cx="854" cy="674" r="4.5" fill="#64748B"/>
  <text x="878" y="681" font-size="18.5" font-weight="600" fill="#111827">change 3</text>
  <text x="930" y="723" font-size="15.5" text-anchor="middle" fill="#6B7280">still queued</text>

  
  <rect x="40" y="774" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="816" text-anchor="middle" font-size="16" fill="#475569">Event ids repair a live delivery gap. Sync positions repair durable application state.</text>
  <text x="620" y="844" text-anchor="middle" font-size="16" fill="#475569">They are not interchangeable.</text>
</svg>