<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Top: a traditional layered architecture where the presentation layer calls the business logic layer, which calls the data access layer, which calls the database; the repository interface can sit in the business or the data access layer. Bottom: Clean Architecture as four concentric rings, Frameworks and Drivers outside, then Interface Adapters, Use Cases, and Entities at the center">
