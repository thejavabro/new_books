    <filter id="m11a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m11a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m11a-k1"><rect x="64" y="170" width="240" height="100" rx="12"/></clipPath>
    <clipPath id="m11a-k2"><rect x="355" y="170" width="240" height="100" rx="12"/></clipPath>
    <clipPath id="m11a-k3"><rect x="646" y="170" width="240" height="100" rx="12"/></clipPath>
