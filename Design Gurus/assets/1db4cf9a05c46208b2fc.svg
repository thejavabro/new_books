    <clipPath id="m11a-k6"><rect x="64" y="805" width="310" height="90" rx="12"/></clipPath>
    <clipPath id="m11a-k7"><rect x="64" y="965" width="310" height="90" rx="12"/></clipPath>
    <marker id="m11a-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m11a-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m11a-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m11a-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="m11a-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1170" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Traditional layered architecture vs. Clean Architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The layered stack runs from presentation down to the database; Clean Architecture nests four rings with the entities at the center.</text>

  <rect x="40" y="110" width="1160" height="270" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Traditional layered architecture</text>
  <text x="1176" y="140" text-anchor="end" font-size="17" fill="#475569">Arrows are calls; the repository interface can sit in the business or the data access layer</text>
  <rect x="40" y="410" width="1160" height="720" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="440" font-size="19.5" font-weight="600" fill="#475569">Clean Architecture</text>

  <g fill="none" stroke-width="2">
    <path d="M304,220 H355" stroke="#64748B" marker-end="url(#m11a-m-slate)"/>
    <path d="M595,220 H646" stroke="#64748B" marker-end="url(#m11a-m-slate)"/>
    <path d="M886,220 H937" stroke="#64748B" marker-end="url(#m11a-m-slate)"/>
    <path d="M0,0" stroke="#2563EB"/>
    <path d="M0,0" stroke="#059669"/>
    <path d="M0,0" stroke="#D97706"/>
    <path d="M0,0" stroke="#4F46E5"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="329.5" y="208" fill="#475569">calls</text>
    <text x="620.5" y="208" fill="#475569">calls</text>
    <text x="911.5" y="208" fill="#475569">calls</text>
  </g>

  <g filter="url(#m11a-soft)">
    <rect x="64" y="170" width="240" height="100" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="170" width="6" height="100" fill="#2563EB" clip-path="url(#m11a-k1)"/>
  </g>
  <circle cx="102" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,209.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="128" y="214.25" font-size="21.5" font-weight="600" fill="#111827">Presentation</text>
  <text x="128" y="239.75" font-size="21.5" font-weight="600" fill="#111827">layer</text>
  <text x="184" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">UI and controllers</text>
  <text x="184" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">handles HTTP requests,</text>
  <text x="184" y="353" font-size="18.5" text-anchor="middle" fill="#94A3B8">renders responses</text>
  <g filter="url(#m11a-soft)">
    <rect x="355" y="170" width="240" height="100" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="355" y="170" width="6" height="100" fill="#059669" clip-path="url(#m11a-k2)"/>
  </g>
  <circle cx="393" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(382.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="419" y="214.25" font-size="21.5" font-weight="600" fill="#111827">Business logic</text>
  <text x="419" y="239.75" font-size="21.5" font-weight="600" fill="#111827">layer</text>
  <text x="475" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">services</text>
  <text x="475" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">implements business rules</text>
  <text x="475" y="353" font-size="18.5" text-anchor="middle" fill="#94A3B8">and application logic</text>
  <g filter="url(#m11a-soft)">
    <rect x="646" y="170" width="240" height="100" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="646" y="170" width="6" height="100" fill="#D97706" clip-path="url(#m11a-k3)"/>
  </g>
  <circle cx="684" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="710" y="214.25" font-size="21.5" font-weight="600" fill="#111827">Data access</text>
  <text x="710" y="239.75" font-size="21.5" font-weight="600" fill="#111827">layer</text>
  <text x="766" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">repositories and ORM</text>
  <text x="766" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">talks to the database</text>
  <text x="766" y="353" font-size="18.5" text-anchor="middle" fill="#94A3B8">using repositories or ORM</text>
  <g filter="url(#m11a-soft)">
    <rect x="64" y="485" width="310" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="485" width="6" height="90" fill="#2563EB" clip-path="url(#m11a-k4)"/>
  </g>
  <text x="84" y="537" font-size="21.5" font-weight="600" fill="#111827">Frameworks and Drivers</text>
  <g filter="url(#m11a-soft)">
    <rect x="64" y="645" width="310" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="645" width="6" height="90" fill="#059669" clip-path="url(#m11a-k5)"/>
  </g>
  <text x="84" y="697" font-size="21.5" font-weight="600" fill="#111827">Interface Adapters</text>
  <g filter="url(#m11a-soft)">
    <rect x="64" y="805" width="310" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="805" width="6" height="90" fill="#D97706" clip-path="url(#m11a-k6)"/>
  </g>
  <text x="84" y="857" font-size="21.5" font-weight="600" fill="#111827">Use Cases</text>
  <g filter="url(#m11a-soft)">
    <rect x="64" y="965" width="310" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="64" y="965" width="6" height="90" fill="#4F46E5" clip-path="url(#m11a-k7)"/>
  </g>
  <text x="84" y="1017" font-size="21.5" font-weight="600" fill="#111827">Entities</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M937,186 L937,254 A120,16 0 0 0 1177,254 L1177,186" fill="#DBEAFE"/>
    <ellipse cx="1057" cy="186" rx="120" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1057" y="235" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="1057" y="304" font-size="18.5" text-anchor="middle" fill="#6B7280">PostgreSQL or MySQL</text>
  <text x="1057" y="331" font-size="18.5" text-anchor="middle" fill="#94A3B8">stores application data</text>

  <circle cx="760" cy="780" r="320" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="760" cy="780" r="240" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <circle cx="760" cy="780" r="160" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <circle cx="760" cy="780" r="80" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="760" y="500" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">Frameworks and Drivers</text>
  <text x="760" y="524" text-anchor="middle" font-size="17" fill="#475569">(Web, Database, External Services)</text>
  <text x="760" y="580" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">Interface Adapters</text>
  <text x="760" y="604" text-anchor="middle" font-size="17" fill="#475569">(Controllers, Presenters, Gateways)</text>
  <text x="760" y="660" text-anchor="middle" font-size="19.5" font-weight="600" fill="#B45309">Use Cases</text>
  <text x="760" y="684" text-anchor="middle" font-size="17" fill="#475569">(Application Business Rules)</text>
  <text x="760" y="762" text-anchor="middle" font-size="19.5" font-weight="600" fill="#4338CA">Entities</text>
  <text x="760" y="786" text-anchor="middle" font-size="17" fill="#475569">(Enterprise</text>
  <text x="760" y="806" text-anchor="middle" font-size="17" fill="#475569">Business Rules)</text>
