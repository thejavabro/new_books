<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="975" viewBox="0 0 1240 975" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A classic design is a one-way request path, while an AI design links its request path to a feedback loop that collects data, retrains, evaluates, and promotes the next model">
  <defs>
    <marker id="lts-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="lts-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#047857"/>
    </marker>
    <marker id="lts-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="lts-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lts-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lts-k1"><rect x="70" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k2"><rect x="505" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k3"><rect x="930" y="136" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k4"><rect x="70" y="410" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k5"><rect x="505" y="410" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k6"><rect x="930" y="410" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k7"><rect x="70" y="665" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k8"><rect x="360" y="665" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k9"><rect x="650" y="665" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="lts-k10"><rect x="930" y="665" width="240" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="975" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#334155">Classic design: a one-way path</text>
  <rect x="40" y="330" width="1160" height="485" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#1D4ED8">AI design: a cycle</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M310,181 H505" marker-end="url(#lts-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M745,181 H930" marker-end="url(#lts-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M310,455 H505" marker-end="url(#lts-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M745,455 H930" marker-end="url(#lts-mslate)"/></g>
  <g fill="none" stroke="#047857" stroke-width="2"><path d="M525,500 V563 Q525,575 513,575 H202 Q190,575 190,587 V665" marker-end="url(#lts-memerald)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M310,710 H360" marker-end="url(#lts-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M600,710 H650" marker-end="url(#lts-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M890,710 H930" marker-end="url(#lts-mslate)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M1050,665 V627 Q1050,615 1038,615 H737 Q725,615 725,603 V500" marker-end="url(#lts-mviolet)"/></g>
  <g filter="url(#lts-soft)">
    <rect x="70" y="136" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="136" width="6" height="90" fill="#64748B" clip-path="url(#lts-k1)"/>
  </g>
  <circle cx="108" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,170.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="134" y="188" font-size="18.5" font-weight="600" fill="#111827">Customer request</text>
  <text x="190" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">the app sends a request</text>
  <g filter="url(#lts-soft)">
    <rect x="505" y="136" width="240" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="505" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#lts-k2)"/>
  </g>
  <circle cx="543" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(532.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="569" y="188" font-size="18.5" font-weight="600" fill="#111827">Order service</text>
  <text x="625" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">reads and writes the database</text>
  <g filter="url(#lts-soft)">
    <rect x="930" y="136" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="930" y="136" width="6" height="90" fill="#059669" clip-path="url(#lts-k3)"/>
  </g>
  <circle cx="968" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="994" y="188" font-size="18.5" font-weight="600" fill="#111827">Response</text>
  <text x="1050" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">right or wrong, and done</text>
  <g filter="url(#lts-soft)">
    <rect x="70" y="410" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="410" width="6" height="90" fill="#64748B" clip-path="url(#lts-k4)"/>
  </g>
  <circle cx="108" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,444.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="134" y="462" font-size="18.5" font-weight="600" fill="#111827">Customer request</text>
  <text x="190" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">checkout opens</text>
  <g filter="url(#lts-lift)">
    <rect x="505" y="410" width="240" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="505" y="410" width="9" height="90" fill="#2563EB" clip-path="url(#lts-k5)"/>
  </g>
  <circle cx="543" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(532.56,444.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="569" y="462" font-size="18.5" font-weight="600" fill="#111827">Model server</text>
  <text x="625" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">runs the current model</text>
  <g filter="url(#lts-soft)">
    <rect x="930" y="410" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="930" y="410" width="6" height="90" fill="#059669" clip-path="url(#lts-k6)"/>
  </g>
  <circle cx="968" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,444.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="994" y="462" font-size="18.5" font-weight="600" fill="#111827">Prediction shown</text>
  <text x="1050" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">a delivery estimate</text>
  <g filter="url(#lts-soft)">
    <rect x="70" y="665" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="70" y="665" width="6" height="90" fill="#059669" clip-path="url(#lts-k7)"/>
  </g>
  <circle cx="108" cy="710" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,699.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="134" y="717" font-size="18.5" font-weight="600" fill="#111827">Collect data</text>
  <text x="190" y="780" font-size="15.5" text-anchor="middle" fill="#6B7280">join real outcomes as labels</text>
  <g filter="url(#lts-soft)">
    <rect x="360" y="665" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="360" y="665" width="6" height="90" fill="#D97706" clip-path="url(#lts-k8)"/>
  </g>
  <circle cx="398" cy="710" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,699.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="424" y="717" font-size="18.5" font-weight="600" fill="#111827">Retrain</text>
  <text x="480" y="780" font-size="15.5" text-anchor="middle" fill="#6B7280">train a candidate on fresh data</text>
  <g filter="url(#lts-soft)">
    <rect x="650" y="665" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="650" y="665" width="6" height="90" fill="#64748B" clip-path="url(#lts-k9)"/>
  </g>
  <circle cx="688" cy="710" r="18" fill="#FFFFFF"/>
  <g transform="translate(677.56,699.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="705.5" font-size="18.5" font-weight="600" fill="#111827">Evaluate the</text>
  <text x="714" y="728.5" font-size="18.5" font-weight="600" fill="#111827">candidate</text>
  <text x="770" y="780" font-size="15.5" text-anchor="middle" fill="#6B7280">score it against the current model</text>
  <g filter="url(#lts-soft)">
    <rect x="930" y="665" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="930" y="665" width="6" height="90" fill="#7C3AED" clip-path="url(#lts-k10)"/>
  </g>
  <circle cx="968" cy="710" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,699.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="994" y="705.5" font-size="18.5" font-weight="600" fill="#111827">Promote the</text>
  <text x="994" y="728.5" font-size="18.5" font-weight="600" fill="#111827">winner</text>
  <text x="1050" y="780" font-size="15.5" text-anchor="middle" fill="#6B7280">a small share of traffic first</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="357.5" y="561" fill="#047857">every prediction, logged</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="887.5" y="601" fill="#5B21B6">next model version</text></g>
  <rect x="40" y="859" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="904" text-anchor="middle" font-size="16" fill="#475569">The request path looks almost the same. Only the AI design feeds its results back into the next model.</text>
</svg>