  <text x="124" y="750" font-size="19.5" font-weight="600" fill="#475569">Stores</text>
  <rect x="40" y="1070" width="1160" height="236" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="1100" font-size="19.5" font-weight="600" fill="#5B21B6">Offline, where the recommendations are actually made</text>

