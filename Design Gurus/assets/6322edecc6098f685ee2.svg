  <text x="978" y="832" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Recommendations</text>
  <text x="978" y="904" font-size="18.5" text-anchor="middle" fill="#6B7280">one precomputed row set</text>
  <text x="978" y="931" font-size="18.5" text-anchor="middle" fill="#94A3B8">per user, rewritten offline</text>

  <rect x="40" y="1350" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1375" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1400" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">The answer is precomputed</text>
  <text x="323" y="1400" font-size="18.5" fill="#475569">no model runs while a user waits, the row was written hours ago</text>
  <rect x="64" y="1425" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1450" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Events are the input</text>
  <text x="323" y="1450" font-size="18.5" fill="#475569">every play, pause and skip is a signal, and there are billions of them a day</text>
  <rect x="64" y="1475" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="1500" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Three speeds at once</text>
  <text x="323" y="1500" font-size="18.5" fill="#475569">nightly batch for the model, near real time for signals, instant for trending</text>
