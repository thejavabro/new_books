  </g>
  <text x="274" y="832" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Profiles</text>
  <text x="274" y="904" font-size="18.5" text-anchor="middle" fill="#6B7280">accounts and watch history</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M476,780 L476,854 A150,16 0 0 0 776,854 L776,780" fill="#D1FAE5"/>
    <ellipse cx="626" cy="780" rx="150" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="626" y="832" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Catalogue</text>
  <text x="626" y="904" font-size="18.5" text-anchor="middle" fill="#6B7280">titles, genres, artwork</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M828,780 L828,854 A150,16 0 0 0 1128,854 L1128,780" fill="#EDE9FE"/>
