  <rect x="0" y="0" width="1240" height="1620" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Netflix recommendations: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The request path only reads a precomputed answer. Everything that makes the answer good happens offline, hours earlier.</text>

  <rect x="40" y="380" width="1160" height="296" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#1D4ED8">Serving, each service behind its own cache</text>
