  <text x="128" y="492" font-size="21.5" font-weight="600" fill="#111827">User profile</text>
  <text x="224" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">who is watching</text>
  <g filter="url(#nfx1-soft)">
    <rect x="460" y="440" width="320" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="460" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#nfx1-k5)"/>
