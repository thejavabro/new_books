<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The messaging grid sends requests to a processing unit, where they reach request handling. Inside it, the application logic layer does request handling, business logic and in-memory operations; the local in-memory data grid holds a data partition or a full copy of the data; the replication engine syncs with peer units and handles failover. The replication engine syncs with peer units, exchanging data both ways with other processing units">
