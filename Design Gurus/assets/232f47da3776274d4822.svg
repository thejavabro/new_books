<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The tasks with their prerequisite counts">
<defs>
<filter id="to-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">In what order can these 6 tasks be done?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Each arrow points from a task to one that cannot start until it is finished</text>
<rect x="40" y="106" width="1160" height="484" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The number under each task is how many prerequisites it still has left</text>
<path d="M557,262 Q746,167.51999999999998 935,262" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M935,262 L926,250 L933,246 Z" fill="#94A3B8"/>
<path d="M305,262 Q620,166 935,262" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M935,262 L926,250 L933,246 Z" fill="#94A3B8"/>
<path d="M305,262 Q557,166 809,262" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M809,262 L800,250 L807,246 Z" fill="#94A3B8"/>
<path d="M431,262 Q620,167.51999999999998 809,262" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M809,262 L800,250 L807,246 Z" fill="#94A3B8"/>
<path d="M683,262 Q620,207.84 557,262" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M557,262 L566,250 L559,246 Z" fill="#94A3B8"/>
<path d="M431,262 Q557,187.68 683,262" fill="none" stroke="#94A3B8" stroke-width="2"/>
<path d="M683,262 L674,250 L681,246 Z" fill="#94A3B8"/>
<text x="227" y="308" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">tasks</text>
<rect x="249" y="270" width="112" height="60" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="305" y="307.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="305" y="352" text-anchor="middle" font-size="15.5" fill="#94A3B8">nothing waiting</text>
<rect x="375" y="270" width="112" height="60" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="431" y="307.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="431" y="352" text-anchor="middle" font-size="15.5" fill="#94A3B8">nothing waiting</text>
<rect x="501" y="270" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="557" y="307.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="557" y="352" text-anchor="middle" font-size="15.5" fill="#94A3B8">waiting on 1</text>
<rect x="627" y="270" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="683" y="307.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="683" y="352" text-anchor="middle" font-size="15.5" fill="#94A3B8">waiting on 1</text>
<rect x="753" y="270" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="809" y="307.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="809" y="352" text-anchor="middle" font-size="15.5" fill="#94A3B8">waiting on 2</text>
<rect x="879" y="270" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="935" y="307.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="935" y="352" text-anchor="middle" font-size="15.5" fill="#94A3B8">waiting on 2</text>
<text x="227" y="418" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">ready now</text>
<rect x="249" y="380" width="96" height="60" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="297" y="417.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="359" y="380" width="96" height="60" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="407" y="417.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="227" y="514" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">order so far</text>
<text x="255" y="513" font-size="18" fill="#475569">nothing scheduled yet</text>
<text x="620" y="566" text-anchor="middle" font-size="19" font-weight="600" fill="#047857">2 tasks have nothing waiting on them, so either could start first</text>
<rect x="40" y="610" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="650" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A task can start the moment its count reaches zero</text>
<text x="620" y="682" text-anchor="middle" font-size="18.5" fill="#475569">So the whole job is: take a task with a count of zero, then lower the counts it was blocking</text>
</svg>