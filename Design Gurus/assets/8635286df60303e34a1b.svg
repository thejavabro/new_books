<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With no front door, three clients each call three services directly: nine couplings, and every service repeats auth, rate limiting, and TLS.">
  <defs>
    <marker id="m03-l06-client-service-sprawl-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m03-l06-client-service-sprawl-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <rect x="40" y="100" width="370" height="560" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="138" font-size="20" font-weight="600" fill="#334155">Clients hardcode the topology</text>

  <rect x="800" y="100" width="400" height="560" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="822" y="138" font-size="20" font-weight="600" fill="#B91C1C">Edge concerns, once per service</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#m03-l06-client-service-sprawl-blue)">
    <path d="M390,209 C560,209 650,209 816,209"/>
    <path d="M390,235 C560,235 650,379 816,379"/>
    <path d="M390,261 C560,261 650,549 816,549"/>
    <path d="M390,379 C560,379 650,235 816,235"/>
    <path d="M390,405 C560,405 650,405 816,405"/>
    <path d="M390,431 C560,431 650,575 816,575"/>
    <path d="M390,549 C560,549 650,261 816,261"/>
    <path d="M390,575 C560,575 650,431 816,431"/>
    <path d="M390,601 C560,601 650,601 816,601"/>
  </g>

  <g filter="url(#m03-l06-client-service-sprawl-soft)">
    <rect x="60" y="180" width="330" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="225" y="231" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Mobile app</text>
  <text x="225" y="261" text-anchor="middle" font-size="20" fill="#64748B">6 calls per screen</text>
  <g filter="url(#m03-l06-client-service-sprawl-soft)">
    <rect x="60" y="350" width="330" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="225" y="401" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Web app</text>
  <text x="225" y="431" text-anchor="middle" font-size="20" fill="#64748B">the same addresses</text>
  <g filter="url(#m03-l06-client-service-sprawl-soft)">
    <rect x="60" y="520" width="330" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="225" y="571" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Third parties</text>
  <text x="225" y="601" text-anchor="middle" font-size="20" fill="#64748B">outside your release cycle</text>

  <g filter="url(#m03-l06-client-service-sprawl-soft)">
    <rect x="820" y="170" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1000" y="216" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog</text>
  <rect x="840" y="236" width="320" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1000" y="265" text-anchor="middle" font-size="20" fill="#B91C1C">auth, rate limits, TLS</text>
  <g filter="url(#m03-l06-client-service-sprawl-soft)">
    <rect x="820" y="340" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1000" y="386" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <rect x="840" y="406" width="320" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1000" y="435" text-anchor="middle" font-size="20" fill="#B91C1C">auth, rate limits, TLS</text>
  <g filter="url(#m03-l06-client-service-sprawl-soft)">
    <rect x="820" y="510" width="360" height="130" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1000" y="556" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders</text>
  <rect x="840" y="576" width="320" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="1000" y="605" text-anchor="middle" font-size="20" fill="#B91C1C">auth, rate limits, TLS</text>

  <text x="605" y="140" text-anchor="middle" font-size="20" font-weight="600" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">3 clients x 3 services = 9 couplings</text>

  <text x="620" y="720" text-anchor="middle" font-size="20" fill="#475569">1. Clients must know the topology, so a rename becomes an app release.</text>
  <text x="620" y="752" text-anchor="middle" font-size="20" fill="#475569">2. Every service repeats the auth and rate limit code, and one will be wrong.</text>
  <text x="620" y="784" text-anchor="middle" font-size="20" fill="#475569">3. One screen means six calls over a slow mobile link.</text>

  <line x1="50" y1="840" x2="86" y2="840" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="847" font-size="20" fill="#475569">Direct client-to-service call, synchronous: the caller waits</text>
  <rect x="50" y="872" width="36" height="26" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="98" y="893" font-size="20" fill="#475569">Edge concerns reimplemented in every service</text>
</svg>