<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="482" viewBox="0 0 1240 482" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Explicit feedback is cheap but sparse, behavioral proxies are inferred from what users do, and task-level outcomes show whether the real task got done">
  <defs>
    <marker id="c4ev2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="c4ev2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c4ev2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c4ev2-k1"><rect x="98" y="136" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev2-k2"><rect x="485" y="136" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev2-k3"><rect x="872" y="136" width="270" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="482" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="270" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Online signals: from cheap to rich</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M368,181 H485" marker-end="url(#c4ev2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M755,181 H872" marker-end="url(#c4ev2-mslate)"/></g>
  <g filter="url(#c4ev2-soft)">
    <rect x="98" y="136" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="98" y="136" width="6" height="90" fill="#64748B" clip-path="url(#c4ev2-k1)"/>
  </g>
  <circle cx="136" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(125.56,170.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="98" y="124" font-size="15.5" font-weight="600" fill="#6B7280">1. cheap</text>
  <text x="162" y="188" font-size="18.5" font-weight="600" fill="#111827">Explicit feedback</text>
  <text x="233" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">thumbs-up or thumbs-down;</text>
  <text x="233" y="272" font-size="15.5" text-anchor="middle" fill="#6B7280">sparse, often from annoyed users</text>
  <g filter="url(#c4ev2-soft)">
    <rect x="485" y="136" width="270" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="485" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#c4ev2-k2)"/>
  </g>
  <circle cx="523" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(512.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="485" y="124" font-size="15.5" font-weight="600" fill="#6B7280">2. inferred</text>
  <text x="549" y="188" font-size="18.5" font-weight="600" fill="#111827">Behavioral proxies</text>
  <text x="620" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">what users do with the answer</text>
  <g filter="url(#c4ev2-lift)">
    <rect x="872" y="136" width="270" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="872" y="136" width="9" height="90" fill="#059669" clip-path="url(#c4ev2-k3)"/>
  </g>
  <circle cx="910" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(899.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="872" y="124" font-size="15.5" font-weight="600" fill="#6B7280">3. richest</text>
  <text x="936" y="188" font-size="18.5" font-weight="600" fill="#111827">Task-level outcomes</text>
  <text x="1007" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">resolved, no human agent, no repeat contact</text>
  <rect x="422" y="270" width="158" height="30" rx="15" fill="#FFE4E6"/>
  <text x="501" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#BE123C">regenerate: failure</text>
  <rect x="590" y="270" width="228" height="30" rx="15" fill="#D1FAE5"/>
  <text x="704" y="290" font-size="14" font-weight="600" text-anchor="middle" fill="#047857">copy code or a link: success</text>
  <rect x="40" y="366" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="411" text-anchor="middle" font-size="16" fill="#475569">Task-level outcomes measure the task itself, not an inferred proxy.</text>
</svg>