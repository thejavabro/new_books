<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. A domain object with identity, which DDD calls an entity, such as Order with _order_id, _customer_id, _line_items, _total and _status and the methods add_item, confirm and cancel: identified by a unique ID, has a lifecycle, defined by its identity and business rules, state can change. A value object such as Money with amount and currency and the methods add, subtract and is_positive: no unique identity, defined entirely by its value, immutable, and two value objects with the same value are equal">
  <defs>
    <filter id="m11e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m11e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Domain objects vs. value objects in the Entities ring</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A domain object is known by its identity and changes over time; a value object is known only by its value.</text>

  <rect x="40" y="110" width="570" height="680" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#4338CA">Domain object (DDD entity)</text>
  <rect x="630" y="110" width="570" height="680" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="654" y="140" font-size="19.5" font-weight="600" fill="#047857">Value object</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <rect x="64" y="548" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <g transform="translate(78,559) scale(0.92)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="576.5" font-size="18.5" fill="#1F2937">Identified by a unique ID</text>
  <rect x="64" y="602" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <g transform="translate(78,613) scale(0.92)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="630.5" font-size="18.5" fill="#1F2937">Has a lifecycle (draft, confirmed, shipped, cancelled)</text>
  <rect x="64" y="656" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <g transform="translate(78,667) scale(0.92)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="684.5" font-size="18.5" fill="#1F2937">Defined by its identity and business rules</text>
  <rect x="64" y="710" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <g transform="translate(78,721) scale(0.92)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="738.5" font-size="18.5" fill="#1F2937">State can change over time</text>
  <rect x="654" y="548" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(668,559) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="704" y="576.5" font-size="18.5" fill="#1F2937">No unique identity</text>
  <rect x="654" y="602" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(668,613) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="704" y="630.5" font-size="18.5" fill="#1F2937">Defined entirely by its value (amount + currency)</text>
  <rect x="654" y="656" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(668,667) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="704" y="684.5" font-size="18.5" fill="#1F2937">Immutable (value does not change)</text>
  <rect x="654" y="710" width="522" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(668,721) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="704" y="738.5" font-size="18.5" fill="#1F2937">Two value objects with the same value are equal</text>

  <text x="64" y="172" font-size="18.5" fill="#475569">Has a unique identity and lifecycle</text>
  <text x="654" y="172" font-size="18.5" fill="#475569">Defined only by its value, no identity</text>
  <rect x="64" y="210" width="320" height="311" rx="12" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="86" y="245" font-size="21.5" font-weight="600" fill="#111827">Order</text>
  <path d="M82,262 H366" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="86" y="288" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937"><tspan fill="#4338CA">_order_id</tspan>: str</text>
  <text x="86" y="315" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937"><tspan fill="#4338CA">_customer_id</tspan>: str</text>
  <text x="86" y="342" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937"><tspan fill="#4338CA">_line_items</tspan>: list[LineItem]</text>
  <text x="86" y="369" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937"><tspan fill="#4338CA">_total</tspan>: Money</text>
  <text x="86" y="396" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937"><tspan fill="#4338CA">_status</tspan>: OrderStatus</text>
  <path d="M82,415 H366" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="86" y="445" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937">add_item()</text>
  <text x="86" y="472" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937">confirm()</text>
  <text x="86" y="499" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937">cancel()</text>
  <rect x="654" y="210" width="320" height="230" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="676" y="245" font-size="21.5" font-weight="600" fill="#111827">Money</text>
  <path d="M672,262 H956" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="676" y="288" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937"><tspan fill="#047857">amount</tspan>: Decimal</text>
  <text x="676" y="315" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937"><tspan fill="#047857">currency</tspan>: str</text>
  <path d="M672,334 H956" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="676" y="364" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937">add(other: Money)</text>
  <text x="676" y="391" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937">subtract(other: Money)</text>
  <text x="676" y="418" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="17.5" fill="#1F2937">is_positive()</text>


</svg>