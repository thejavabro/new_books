<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1724" viewBox="0 0 1240 1724" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Google News high level design: clients reach an API gateway that routes to feed update, feed delivery, user management and search services, which read polyglot storage behind a cache, while an ingestion pipeline publishes new articles to Kafka for feed generation, search indexing and notifications">
