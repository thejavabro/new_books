  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">web and mobile</text>
  <g filter="url(#nws1-lift)">
    <rect x="400" y="150" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="400" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#nws1-k2)"/>
