  <circle cx="998" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(987.56,184.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="1024" y="202" font-size="21.5" font-weight="600" fill="#111827">CDN</text>
  <text x="1080" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">articles and images</text>
  <g filter="url(#nws1-soft)">
    <rect x="64" y="440" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#nws1-k4)"/>
  </g>
  <circle cx="102" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="128" y="492" font-size="21.5" font-weight="600" fill="#111827">Feed updates</text>
  <text x="189" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">real time push</text>
  <g filter="url(#nws1-soft)">
    <rect x="351" y="440" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="351" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#nws1-k5)"/>
  </g>
  <circle cx="389" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(378.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="415" y="492" font-size="21.5" font-weight="600" fill="#111827">Feed delivery</text>
  <text x="476" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">assembles the feed</text>
  <g filter="url(#nws1-soft)">
    <rect x="638" y="440" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="638" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#nws1-k6)"/>
  </g>
  <circle cx="676" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(665.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="702" y="492" font-size="21.5" font-weight="600" fill="#111827">User accounts</text>
  <text x="763" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">profiles and topics</text>
  <g filter="url(#nws1-soft)">
    <rect x="925" y="440" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="925" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#nws1-k7)"/>
  </g>
  <circle cx="963" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(952.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="989" y="492" font-size="21.5" font-weight="600" fill="#111827">Search</text>
  <text x="1050" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">keyword, category, tag</text>
  <g filter="url(#nws1-soft)">
    <rect x="64" y="1184" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="1184" width="6" height="90" fill="#7C3AED" clip-path="url(#nws1-k8)"/>
  </g>
  <circle cx="102" cy="1229" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,1218.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="1236" font-size="21.5" font-weight="600" fill="#111827">New_Article</text>
  <text x="189" y="1303" font-size="18.5" text-anchor="middle" fill="#6B7280">the Kafka topic</text>
  <g filter="url(#nws1-soft)">
    <rect x="351" y="1184" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="351" y="1184" width="6" height="90" fill="#7C3AED" clip-path="url(#nws1-k9)"/>
  </g>
  <circle cx="389" cy="1229" r="18" fill="#FFFFFF"/>
  <g transform="translate(378.56,1218.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="415" y="1236" font-size="21.5" font-weight="600" fill="#111827">Feed generation</text>
  <text x="476" y="1303" font-size="18.5" text-anchor="middle" fill="#6B7280">per user, ahead of time</text>
  <g filter="url(#nws1-soft)">
    <rect x="638" y="1184" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="638" y="1184" width="6" height="90" fill="#7C3AED" clip-path="url(#nws1-k10)"/>
  </g>
  <circle cx="676" cy="1229" r="18" fill="#FFFFFF"/>
  <g transform="translate(665.56,1218.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="702" y="1236" font-size="21.5" font-weight="600" fill="#111827">Search indexer</text>
  <text x="763" y="1303" font-size="18.5" text-anchor="middle" fill="#6B7280">a pool of workers</text>
  <g filter="url(#nws1-soft)">
    <rect x="925" y="1184" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="925" y="1184" width="6" height="90" fill="#7C3AED" clip-path="url(#nws1-k11)"/>
  </g>
  <circle cx="963" cy="1229" r="18" fill="#FFFFFF"/>
  <g transform="translate(952.56,1218.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="989" y="1236" font-size="21.5" font-weight="600" fill="#111827">Notifications</text>
  <text x="1050" y="1303" font-size="18.5" text-anchor="middle" fill="#6B7280">push, in app, email</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M124,700 L124,774 A150,16 0 0 0 424,774 L424,700" fill="#D1FAE5"/>
    <ellipse cx="274" cy="700" rx="150" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="274" y="752" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Articles</text>
  <text x="274" y="824" font-size="18.5" text-anchor="middle" fill="#6B7280">NoSQL, articles and feeds</text>
  <text x="274" y="851" font-size="18.5" text-anchor="middle" fill="#94A3B8">and the analytics on them</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M476,700 L476,774 A150,16 0 0 0 776,774 L776,700" fill="#E0E7FF"/>
    <ellipse cx="626" cy="700" rx="150" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="626" y="752" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Users</text>
  <text x="626" y="824" font-size="18.5" text-anchor="middle" fill="#6B7280">SQL, accounts and the</text>
  <text x="626" y="851" font-size="18.5" text-anchor="middle" fill="#94A3B8">topics each one follows</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M828,700 L828,774 A150,16 0 0 0 1128,774 L1128,700" fill="#E2E8F0"/>
    <ellipse cx="978" cy="700" rx="150" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="978" y="752" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Media</text>
  <text x="978" y="824" font-size="18.5" text-anchor="middle" fill="#6B7280">blob store</text>
  <text x="978" y="851" font-size="18.5" text-anchor="middle" fill="#94A3B8">images and video</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M476,904 L476,978 A150,16 0 0 0 776,978 L776,904" fill="#FEF3C7"/>
    <ellipse cx="626" cy="904" rx="150" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="626" y="956" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Cache</text>
  <text x="626" y="1028" font-size="18.5" text-anchor="middle" fill="#6B7280">Redis</text>
  <text x="626" y="1055" font-size="18.5" text-anchor="middle" fill="#94A3B8">the front page, over and over</text>

  <rect x="40" y="1404" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1429" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1454" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Read is the easy half</text>
  <text x="323" y="1454" font-size="18.5" fill="#475569">by the time a user asks for a feed, the work of building it is already done</text>
  <rect x="64" y="1479" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1504" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Precompute the feed</text>
  <text x="323" y="1504" font-size="18.5" fill="#475569">a new article fans out into millions of feeds, which is the expensive part</text>
  <rect x="64" y="1529" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="1554" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Freshness is the product</text>
  <text x="323" y="1554" font-size="18.5" fill="#475569">a news feed that is an hour stale is worthless, unlike almost any other feed</text>
  <rect x="64" y="1579" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="1604" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Search is separate</text>
  <text x="323" y="1604" font-size="18.5" fill="#475569">the index is rebuilt from the same topic, so search and feeds never disagree for long</text>
</svg>