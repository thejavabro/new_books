    <clipPath id="nws1-k10"><rect x="638" y="1184" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="nws1-k11"><rect x="925" y="1184" width="250" height="90" rx="12"/></clipPath>
    <marker id="nws1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="nws1-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
