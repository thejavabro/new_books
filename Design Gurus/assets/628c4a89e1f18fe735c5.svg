  <rect x="0" y="0" width="1240" height="1724" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Google News: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Reading is a normal serving stack. What makes this system hard is everything happening on the left of it, before an article is ever requested.</text>

  <rect x="40" y="380" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#1D4ED8">Services that answer a request</text>
  <rect x="100" y="640" width="1100" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="124" y="670" font-size="19.5" font-weight="600" fill="#475569">Storage</text>
  <rect x="40" y="1124" width="1160" height="236" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="1154" font-size="19.5" font-weight="600" fill="#5B21B6">Fan out, none of it on the request path</text>

  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#nws1-m-blue)"/>
    <path d="M1080,150 V132 Q1080,120 1068,120 H172 Q160,120 160,132 V144" stroke="#D97706" marker-end="url(#nws1-m-amber)"/>
    <path d="M540,312 V374" stroke="#2563EB" stroke-width="2.5" marker-end="url(#nws1-m-blue)"/>
    <path d="M400,580 V634" stroke="#64748B" stroke-width="2.5" marker-end="url(#nws1-m-slate)"/>
    <path d="M60,1118 V586" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#nws1-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="336" y="183" fill="#1D4ED8">HTTPS</text>
    <text x="620" y="110" fill="#B45309">cached articles and images</text>
    <text x="680" y="345" fill="#1D4ED8">routes to services</text>
    <text x="530" y="610" fill="#475569">reads and writes</text>
    <text x="180" y="1102" fill="#5B21B6">generated feeds and alerts</text>
  </g>

