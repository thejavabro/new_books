<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="2062" viewBox="0 0 1240 2062" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Eight patterns that lower an interviewer&#39;s confidence, each shown with why it lowers confidence and the one-line repair that raises it again, from starting with a database or transport through exposing one endpoint per table, unbounded scope, and choosing without stating a cost.">
  <defs>
    <filter id="p47-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p47-k1"><rect x="76" y="170" width="620" height="90" rx="12"/></clipPath>
    <clipPath id="p47-k2"><rect x="76" y="396" width="620" height="90" rx="12"/></clipPath>
    <clipPath id="p47-k3"><rect x="76" y="622" width="620" height="90" rx="12"/></clipPath>
    <clipPath id="p47-k4"><rect x="76" y="848" width="620" height="90" rx="12"/></clipPath>
    <clipPath id="p47-k5"><rect x="76" y="1074" width="620" height="90" rx="12"/></clipPath>
    <clipPath id="p47-k6"><rect x="76" y="1300" width="620" height="90" rx="12"/></clipPath>
    <clipPath id="p47-k7"><rect x="76" y="1526" width="620" height="90" rx="12"/></clipPath>
    <clipPath id="p47-k8"><rect x="76" y="1752" width="620" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="2062" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Eight patterns that lower confidence, and the repair for each</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M640,66 L651,77 M651,66 L640,77"/>
  </g>
  <text x="663" y="77" font-size="15.5" fill="#6B7280">why it lowers confidence</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M890,71 L894.5,75.5 L902,65.5"/>
  </g>
  <text x="916" y="77" font-size="15.5" fill="#6B7280">the one-line repair</text>

  
  <rect x="40" y="126" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="154" font-size="16.5" font-weight="600" fill="#475569">Pattern 1</text>
  <g filter="url(#p47-soft)">
    <rect x="76" y="170" width="620" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="170" width="6" height="90" fill="#DB2777" clip-path="url(#p47-k1)"/>
  </g>
  <circle cx="114" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,204.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="222" font-size="18.5" font-weight="600" fill="#111827">Starts with a database, protocol, or transport</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,275 L89,286 M89,275 L78,286"/>
  </g>
  <text x="104" y="286" font-size="15.5" fill="#6B7280">The trigger and caller job are still unknown.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,306 L82.5,310.5 L90,300.5"/>
  </g>
  <text x="104" y="312" font-size="15.5" fill="#6B7280">"The primary caller is ___ completing ___; I will choose the protocol after the contract pressure is clear."</text>

  
  <rect x="40" y="352" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="380" font-size="16.5" font-weight="600" fill="#475569">Pattern 2</text>
  <g filter="url(#p47-soft)">
    <rect x="76" y="396" width="620" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="396" width="6" height="90" fill="#DB2777" clip-path="url(#p47-k2)"/>
  </g>
  <circle cx="114" cy="441" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,430.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="448" font-size="18.5" font-weight="600" fill="#111827">Exposes one endpoint per database table</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,501 L89,512 M89,501 L78,512"/>
  </g>
  <text x="104" y="512" font-size="15.5" fill="#6B7280">Storage boundaries replace caller-visible concepts.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,532 L82.5,536.5 L90,526.5"/>
  </g>
  <text x="104" y="538" font-size="15.5" fill="#6B7280">"I will keep only nouns callers identify and act on independently; the storage model may differ."</text>

  
  <rect x="40" y="578" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="606" font-size="16.5" font-weight="600" fill="#475569">Pattern 3</text>
  <g filter="url(#p47-soft)">
    <rect x="76" y="622" width="620" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="622" width="6" height="90" fill="#DB2777" clip-path="url(#p47-k3)"/>
  </g>
  <circle cx="114" cy="667" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,656.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="674" font-size="18.5" font-weight="600" fill="#111827">Scope grows with every possible feature</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,727 L89,738 M89,727 L78,738"/>
  </g>
  <text x="104" y="738" font-size="15.5" fill="#6B7280">The answer never reaches a complete operation.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,758 L82.5,762.5 L90,752.5"/>
  </g>
  <text x="104" y="764" font-size="15.5" fill="#6B7280">"I will support ___ and ___; the remaining features are explicit non-goals for this answer."</text>

  
  <rect x="40" y="804" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="832" font-size="16.5" font-weight="600" fill="#475569">Pattern 4</text>
  <g filter="url(#p47-soft)">
    <rect x="76" y="848" width="620" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="848" width="6" height="90" fill="#DB2777" clip-path="url(#p47-k4)"/>
  </g>
  <circle cx="114" cy="893" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,882.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="900" font-size="18.5" font-weight="600" fill="#111827">Lists many endpoints but completes none</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,953 L89,964 M89,953 L78,964"/>
  </g>
  <text x="104" y="964" font-size="15.5" fill="#6B7280">Names provide no input, failure, retry, or limit evidence.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,984 L82.5,988.5 L90,978.5"/>
  </g>
  <text x="104" y="990" font-size="15.5" fill="#6B7280">"I will stop the operation list and design the highest-risk create end to end."</text>

  
  <rect x="40" y="1030" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1058" font-size="16.5" font-weight="600" fill="#475569">Pattern 5</text>
  <g filter="url(#p47-soft)">
    <rect x="76" y="1074" width="620" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1074" width="6" height="90" fill="#DB2777" clip-path="url(#p47-k5)"/>
  </g>
  <circle cx="114" cy="1119" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1108.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="1126" font-size="18.5" font-weight="600" fill="#111827">Describes only success</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1179 L89,1190 M89,1179 L78,1190"/>
  </g>
  <text x="104" y="1190" font-size="15.5" fill="#6B7280">The caller cannot recover or choose a next action.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1210 L82.5,1214.5 L90,1204.5"/>
  </g>
  <text x="104" y="1216" font-size="15.5" fill="#6B7280">"For this operation I will name invalid input, authorization, missing resource, conflict, limit, and temporary server behavior."</text>

  
  <rect x="40" y="1256" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1284" font-size="16.5" font-weight="600" fill="#475569">Pattern 6</text>
  <g filter="url(#p47-soft)">
    <rect x="76" y="1300" width="620" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1300" width="6" height="90" fill="#DB2777" clip-path="url(#p47-k6)"/>
  </g>
  <circle cx="114" cy="1345" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1334.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 12a8.5 8.5 0 0 1 14.5-6"/>
    <path d="M14 6.5H18V3"/>
    <path d="M20.5 12a8.5 8.5 0 0 1-14.5 6"/>
    <path d="M10 17.5H6V21"/>
  </g>
  <text x="140" y="1352" font-size="18.5" font-weight="600" fill="#111827">Says "we retry"</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1405 L89,1416 M89,1405 L78,1416"/>
  </g>
  <text x="104" y="1416" font-size="15.5" fill="#6B7280">Repetition may duplicate money, messages, bookings, or jobs.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1436 L82.5,1440.5 L90,1430.5"/>
  </g>
  <text x="104" y="1442" font-size="15.5" fill="#6B7280">"I will name who retries, which failures qualify, the backoff, and the idempotency or method semantics that make repetition safe."</text>

  
  <rect x="40" y="1482" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1510" font-size="16.5" font-weight="600" fill="#475569">Pattern 7</text>
  <g filter="url(#p47-soft)">
    <rect x="76" y="1526" width="620" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1526" width="6" height="90" fill="#DB2777" clip-path="url(#p47-k7)"/>
  </g>
  <circle cx="114" cy="1571" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1560.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="1578" font-size="18.5" font-weight="600" fill="#111827">Says "eventually consistent" or "cache it" without a number</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1631 L89,1642 M89,1631 L78,1642"/>
  </g>
  <text x="104" y="1642" font-size="15.5" fill="#6B7280">Freshness and staleness remain untestable.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1662 L82.5,1666.5 L90,1656.5"/>
  </g>
  <text x="104" y="1668" font-size="15.5" fill="#6B7280">"I will publish who may cache the response, for how long, and when a successful write becomes visible to which caller."</text>

  
  <rect x="40" y="1708" width="1160" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="1736" font-size="16.5" font-weight="600" fill="#475569">Pattern 8</text>
  <g filter="url(#p47-soft)">
    <rect x="76" y="1752" width="620" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="1752" width="6" height="90" fill="#DB2777" clip-path="url(#p47-k8)"/>
  </g>
  <circle cx="114" cy="1797" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1786.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v17.5M7 21h10"/>
    <path d="M4.5 7.5h3.5l4-2 4 2h3.5"/>
    <path d="M4.5 7.5l-3 6.5h6z"/>
    <path d="M19.5 7.5l-3 6.5h6z"/>
  </g>
  <text x="140" y="1804" font-size="18.5" font-weight="600" fill="#111827">Chooses a technology or rule without stating what it costs</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1857 L89,1868 M89,1857 L78,1868"/>
  </g>
  <text x="104" y="1868" font-size="15.5" fill="#6B7280">The interviewer cannot see judgment or rejected alternatives.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1888 L82.5,1892.5 L90,1882.5"/>
  </g>
  <text x="104" y="1894" font-size="15.5" fill="#6B7280">"I choose ___ because ___; I accept ___ and would switch when ___ becomes true."</text>

  
  <rect x="40" y="1946" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1991" text-anchor="middle" font-size="16" fill="#475569">Every repair is one sentence the candidate can say out loud, which is what turns the pattern back into evidence.</text>
</svg>