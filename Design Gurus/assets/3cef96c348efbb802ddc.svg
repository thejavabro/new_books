<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="666" viewBox="0 0 1240 666" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ordering-title ordering-desc">
<title id="ordering-title">The ordering rule</title>
<desc id="ordering-desc">Backfilling before dual writing leaves a window in which a write reaches only the old representation and nothing records that it happened. Enabling dual writing first removes the window entirely.</desc>
<defs>
<marker id="ordering-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ordering-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ordering-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ordering-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="666" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The ordering rule</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Dual write and backfill are two halves of one operation, and the order between them is not a preference.</text>
<rect x="40" y="588" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="588" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="64" y="157" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Backfill first, dual write second: there is a gap, and writes fall into it</text>
<rect x="40" y="198" width="1160" height="140" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/>
<rect x="70" y="228" width="400" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="270" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">backfill reads the row</text>
<rect x="475" y="228" width="270" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="610" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the gap</text>
<rect x="750" y="228" width="420" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="960" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">dual writing is live</text>
<text x="620" y="322" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">a write here reaches the old representation only, and nothing records it</text>
<rect x="40" y="352" width="1160" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="352" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="64" y="391" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Turn on dual writing first. Start the backfill second. Never the other way round.</text>
<rect x="40" y="432" width="1160" height="130" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="432" width="5" height="130" rx="2.5" fill="#AC8BE8"/><text x="64" y="464" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What the right order gives the backfill</text><text x="64" y="490" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A fixed set. It only handles rows that existed before it started,</text><text x="64" y="516" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">because the application is handling everything current.</text><text x="64" y="542" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Data that is not changing underneath it is what makes the job tractable.</text>
<text x="66" y="622" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">You discover the gap later, as rows that disagree for no apparent reason.</text>
</svg>