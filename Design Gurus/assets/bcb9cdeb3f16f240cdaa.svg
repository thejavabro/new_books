<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1134" viewBox="0 0 1240 1134" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated Google Search architecture: politeness aware crawling, MapReduce inversion, scatter gather serving with global re ranking, and caching">
  <defs>
    <filter id="gs-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="gs-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="gs-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="gs-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="gs-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="gs-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1134" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Google Search: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Crawl, invert, then answer from 50 billion pages with a funnel</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#92400E">1. Crawling · politeness matters more than speed, 11.5 GB/s in</text>
  <path d="M264,194 L349,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gs-amber)"/>
  <text x="307" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">next</text>
  <path d="M577,194 L662,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gs-amber)"/>
  <text x="620" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hash</text>
  <path d="M890,194 L975,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gs-amber)"/>
  <text x="933" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">store</text>
  <g filter="url(#gs-soft)">
    <path d="M40,171 L40,217 A110,15 0 0 0 260,217 L260,171" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="150" cy="171" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">URL frontier</text>
  <text x="150" y="262" font-size="20" fill="#92400E" text-anchor="middle">priority, not FIFO</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Fetcher</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">robots and DNS</text>
  <text x="776" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Fingerprint</text>
  <text x="776" y="216" font-size="20" fill="#64748B" text-anchor="middle">64 bit, skips dupes</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Content store</text>
  <text x="1089" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">keyed by reversed URL</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#92400E">2. Indexing · turn documents with words into words with documents</text>
  <path d="M264,436 L349,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gs-amber)"/>
  <text x="307" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">clean</text>
  <path d="M577,436 L662,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gs-amber)"/>
  <text x="620" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">emit</text>
  <path d="M890,436 L975,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#gs-amber)"/>
  <text x="933" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pack</text>
  <g filter="url(#gs-soft)">
    <path d="M40,413 L40,459 A110,15 0 0 0 260,459 L260,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="150" cy="413" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="353" y="398" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="398" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,413 L979,459 A110,15 0 0 0 1199,459 L1199,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="413" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Raw HTML</text>
  <text x="150" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">5 PB of it</text>
  <text x="463" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Tokenise</text>
  <text x="463" y="458" font-size="20" fill="#64748B" text-anchor="middle">fold case, stem</text>
  <text x="776" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Invert</text>
  <text x="776" y="458" font-size="20" fill="#64748B" text-anchor="middle">map then reduce</text>
  <text x="1089" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Posting lists</text>
  <text x="1089" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">delta encoded, 1.5 PB</text>

  <rect x="24" y="580" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#1E40AF">3. Serving · a funnel, because expensive ranking cannot touch billions</text>
  <path d="M264,678 L349,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gs-blue)"/>
  <text x="307" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">query</text>
  <path d="M577,678 L662,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gs-blue)"/>
  <text x="620" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">scatter</text>
  <path d="M890,678 L975,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gs-blue)"/>
  <text x="933" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">top 10</text>
  <g filter="url(#gs-soft)">
    <rect x="40" y="640" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="640" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M666,655 L666,701 A110,15 0 0 0 886,701 L886,655" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="655" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="979" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="150" y="700" font-size="20" fill="#64748B" text-anchor="middle">two words</text>
  <text x="463" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Search Service</text>
  <text x="463" y="700" font-size="20" fill="#64748B" text-anchor="middle">scatter and gather</text>
  <text x="776" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Index shards</text>
  <text x="776" y="746" font-size="20" fill="#5B21B6" text-anchor="middle">2,000 of them, cheap maths</text>
  <text x="1089" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Re-rank</text>
  <text x="1089" y="700" font-size="20" fill="#64748B" text-anchor="middle">PageRank, 10k left</text>

  <rect x="24" y="822" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="854" font-size="20" font-weight="600" fill="#475569">4. Making 500ms possible · cache, tier, and never wait for the slowest shard</text>
  <path d="M364,920 L456,920" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gs-blue)"/>
  <text x="410" y="908" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>
  <path d="M784,920 L876,920" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#gs-blue)"/>
  <text x="830" y="908" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">slow tail</text>
  <g filter="url(#gs-soft)">
    <path d="M40,897 L40,943 A160,15 0 0 0 360,943 L360,897" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="200" cy="897" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="460" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Result cache</text>
  <text x="200" y="988" font-size="20" fill="#065F46" text-anchor="middle">popular queries, short TTL</text>
  <text x="620" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Tiered index</text>
  <text x="620" y="942" font-size="20" fill="#64748B" text-anchor="middle">good pages first</text>
  <text x="1040" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Hedged reads</text>
  <text x="1040" y="942" font-size="20" fill="#64748B" text-anchor="middle">ask a second replica</text>
  <line x1="44" y1="1094" x2="72" y2="1094" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1101" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1094" x2="344.576" y2="1094" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1101" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1085" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1101" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1085" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1101" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1085" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1101" font-size="20" fill="#475569">core service</text>
</svg>