<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Non-functional requirements for a flash sale: millions of concurrent users, key actions under 500 milliseconds, zero downtime during the sale window; absorbed by rapid autoscaling and bot protection">
  <defs>
    <filter id="flsn-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="flsn-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="flsn-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="flsn-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="flsn-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="flsn-k4"><rect x="80" y="430" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="flsn-k5"><rect x="640" y="430" width="520" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Flash sale: non-functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">How well it has to work. The numbers are extreme because the whole event lasts minutes.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">Targets the design must hit</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#B45309">How it copes with the spike</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#flsn-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#flsn-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Millions at once</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">traffic spikes the second</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">the sale opens</text>
  <g filter="url(#flsn-lift)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="450" y="175" width="9" height="90" fill="#059669" clip-path="url(#flsn-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">Under 500 ms</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">loading the page and</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">pressing buy</text>
  <g filter="url(#flsn-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#flsn-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Zero downtime</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">the window is minutes,</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">so an outage is the event</text>
  <g filter="url(#flsn-soft)">
    <rect x="80" y="430" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#D97706" clip-path="url(#flsn-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">Scale in minutes</text>
  <text x="340" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">provision ahead, then</text>
  <text x="340" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">autoscale on the surge</text>
  <g filter="url(#flsn-soft)">
    <rect x="640" y="430" width="520" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="640" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#flsn-k5)"/>
  </g>
  <circle cx="678" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="704" y="482" font-size="21.5" font-weight="600" fill="#111827">Keep bots out</text>
  <text x="900" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">scripted buyers would take</text>
  <text x="900" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">the stock and the capacity</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Spike shape</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">load is not a curve here, it is a wall. Capacity has to exist before the sale opens, not scale into it</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Graceful failure</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">a clear sold out message is a good outcome; a timeout or a 500 is not</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Abuse</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">bots are both a fairness problem and a load problem, which is why rate limiting is a scale requirement</text>
</svg>