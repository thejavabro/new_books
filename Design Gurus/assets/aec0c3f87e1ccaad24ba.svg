<text x="174" y="780" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">atomic value</text>
<text x="308" y="780" font-size="15.5" fill="#475569">one value in one cell, so the database can compare, sort and index it</text>
<rect x="64" y="802" width="220" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="174" y="824" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">rows go up</text>
<text x="308" y="824" font-size="15.5" fill="#475569">three rows become five, and the name is now repeated, which 2NF and 3NF remove</text>
<rect x="64" y="846" width="220" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
