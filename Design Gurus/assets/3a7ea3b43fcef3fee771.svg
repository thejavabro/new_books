<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="924" viewBox="0 0 1240 924" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="While offline the client holds local state, a sync position and two queued changes that already carry idempotency keys. On reconnect it reads the changes after that position, applies one update and one deletion, and commits the new position. Only then does it send queued changes one at a time, and only success advances to the next one.">
  <defs>
    <marker id="p3j-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p3j-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p3j-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p3j-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p3j-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3j-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3j-k1"><rect x="76" y="100" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3j-k2"><rect x="470" y="100" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3j-k3"><rect x="864" y="100" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3j-k4"><rect x="470" y="240" width="300" height="48" rx="10"/></clipPath>
    <clipPath id="p3j-k5"><rect x="470" y="300" width="300" height="48" rx="10"/></clipPath>
    <clipPath id="p3j-k6"><rect x="460" y="494" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p3j-k7"><rect x="70" y="644" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="p3j-k8"><rect x="355" y="644" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="p3j-k9"><rect x="640" y="644" width="245" height="90" rx="12"/></clipPath>
    <clipPath id="p3j-k10"><rect x="925" y="644" width="245" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="924" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="370" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Catch up first, then upload one change at a time</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">read the changes after the stored position</text>

  
  <g fill="none" stroke-width="2">
    <path d="M376,145 H470" stroke="#2563EB" marker-end="url(#p3j-bl)"/>
    <path d="M770,145 H864" stroke="#059669" marker-end="url(#p3j-em)"/>
  </g>

  
  <g filter="url(#p3j-soft)">
    <rect x="76" y="100" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="100" width="6" height="90" fill="#D97706" clip-path="url(#p3j-k1)"/>
  </g>
  <circle cx="114" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,134.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="152" font-size="18.5" font-weight="600" fill="#111827">While offline</text>
  <text x="226" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">local state, position sync_81M</text>
  <text x="226" y="238" font-size="15.5" text-anchor="middle" fill="#94A3B8">two queued changes,</text>
  <text x="226" y="261" font-size="15.5" text-anchor="middle" fill="#94A3B8">each with its idempotency key</text>

  
  <g filter="url(#p3j-soft)">
    <rect x="470" y="100" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#p3j-k2)"/>
  </g>
  <circle cx="508" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="534" y="152" font-size="18.5" font-weight="600" fill="#111827">Catch up</text>
  <text x="620" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">GET /changes?after=sync_81M</text>

  <g filter="url(#p3j-soft)">
    <rect x="470" y="240" width="300" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="240" width="6" height="48" fill="#2563EB" clip-path="url(#p3j-k4)"/>
  </g>
  <circle cx="504" cy="264" r="4.5" fill="#2563EB"/>
  <text x="528" y="271" font-size="18.5" font-weight="600" fill="#111827">note.updated</text>

  <g filter="url(#p3j-soft)">
    <rect x="470" y="300" width="300" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="300" width="6" height="48" fill="#2563EB" clip-path="url(#p3j-k5)"/>
  </g>
  <circle cx="504" cy="324" r="4.5" fill="#2563EB"/>
  <text x="528" y="331" font-size="18.5" font-weight="600" fill="#111827">note.deleted</text>

  <text x="620" y="373" font-size="15.5" text-anchor="middle" fill="#94A3B8">one update and one deletion to apply</text>

  
  <g filter="url(#p3j-soft)">
    <rect x="864" y="100" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="864" y="100" width="6" height="90" fill="#059669" clip-path="url(#p3j-k3)"/>
  </g>
  <circle cx="902" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(891.56,134.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="928" y="152" font-size="18.5" font-weight="600" fill="#111827">Commit</text>
  <text x="1014" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">new position sync_92B</text>
  <text x="1014" y="238" font-size="15.5" text-anchor="middle" fill="#94A3B8">stored after both changes apply</text>

  
  <rect x="40" y="434" width="1160" height="360" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="464" font-size="16.5" font-weight="600" fill="#475569">Only after the catch up, send queued changes one at a time</text>
  <text x="1176" y="464" text-anchor="end" font-size="15.5" fill="#6B7280">four possible responses</text>

  
  <g fill="none" stroke-width="2">
    <path d="M470,584 V586 Q470,598 458,598 H204.5 Q192.5,598 192.5,610 V644" stroke="#059669" stroke-width="2.5" marker-end="url(#p3j-em)"/>
    <path d="M550,584 V602 Q550,614 538,614 H489.5 Q477.5,614 477.5,626 V644" stroke="#D97706" marker-end="url(#p3j-am)"/>
    <path d="M690,584 V602 Q690,614 702,614 H750.5 Q762.5,614 762.5,626 V644" stroke="#DB2777" marker-end="url(#p3j-pm)"/>
    <path d="M770,584 V586 Q770,598 782,598 H1035.5 Q1047.5,598 1047.5,610 V644" stroke="#DB2777" marker-end="url(#p3j-pm)"/>
  </g>

  
  <g filter="url(#p3j-lift)">
    <rect x="460" y="494" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="460" y="494" width="9" height="90" fill="#64748B" clip-path="url(#p3j-k6)"/>
  </g>
  <circle cx="498" cy="539" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,528.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="524" y="546" font-size="18.5" font-weight="600" fill="#111827">Send one queued change</text>

  
  <g filter="url(#p3j-soft)">
    <rect x="70" y="644" width="245" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="70" y="644" width="6" height="90" fill="#059669" clip-path="url(#p3j-k7)"/>
  </g>
  <circle cx="108" cy="689" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,678.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="134" y="696" font-size="18.5" font-weight="600" fill="#111827">Success</text>
  <text x="192.5" y="759" font-size="15.5" text-anchor="middle" fill="#6B7280">advance to change 2</text>

  
  <g filter="url(#p3j-soft)">
    <rect x="355" y="644" width="245" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="355" y="644" width="6" height="90" fill="#D97706" clip-path="url(#p3j-k8)"/>
  </g>
  <circle cx="393" cy="689" r="18" fill="#FFFFFF"/>
  <g transform="translate(382.56,678.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="419" y="696" font-size="18.5" font-weight="600" fill="#111827">Retryable</text>
  <text x="477.5" y="759" font-size="15.5" text-anchor="middle" fill="#6B7280">wait, same body and key</text>

  
  <g filter="url(#p3j-soft)">
    <rect x="640" y="644" width="245" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="640" y="644" width="6" height="90" fill="#DB2777" clip-path="url(#p3j-k9)"/>
  </g>
  <circle cx="678" cy="689" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,678.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="704" y="696" font-size="18.5" font-weight="600" fill="#111827">412</text>
  <text x="762.5" y="759" font-size="15.5" text-anchor="middle" fill="#6B7280">read, reapply, new key</text>

  
  <g filter="url(#p3j-soft)">
    <rect x="925" y="644" width="245" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="925" y="644" width="6" height="90" fill="#DB2777" clip-path="url(#p3j-k10)"/>
  </g>
  <circle cx="963" cy="689" r="18" fill="#FFFFFF"/>
  <g transform="translate(952.56,678.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="989" y="696" font-size="18.5" font-weight="600" fill="#111827">409 resync</text>
  <text x="1047.5" y="759" font-size="15.5" text-anchor="middle" fill="#6B7280">snapshot, re-evaluate</text>

  
  <rect x="40" y="818" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="863" text-anchor="middle" font-size="16" fill="#475569">Only success advances the queue. The other three stop this dependency scope.</text>
</svg>