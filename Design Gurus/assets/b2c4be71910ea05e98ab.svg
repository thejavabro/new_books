<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="High-level Kafka architecture: producers write records to a cluster of brokers, consumers pull from the cluster, and a controller quorum inside the cluster replicates the metadata log using KRaft">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="dm10-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="dm10-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="dm10-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="262" y1="216" x2="356" y2="216" stroke="#3B82F6" stroke-width="2" marker-end="url(#dm10-blue)"/>
  <line x1="262" y1="404" x2="356" y2="404" stroke="#3B82F6" stroke-width="2" marker-end="url(#dm10-blue)"/>
  <text x="309" y="310" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">publish</text>

  <line x1="884" y1="216" x2="970" y2="216" stroke="#059669" stroke-width="2" marker-end="url(#dm10-emerald)"/>
  <line x1="884" y1="404" x2="970" y2="404" stroke="#059669" stroke-width="2" marker-end="url(#dm10-emerald)"/>
  <text x="927" y="310" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pull</text>

  
  <rect x="360" y="80" width="520" height="520" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="110" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Kafka Cluster</text>

  
  <path d="M852,496 L852,181" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="830" y1="181" x2="852" y2="181" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="830" y1="297" x2="852" y2="297" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="830" y1="413" x2="852" y2="413" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5"/>

  
  <g filter="url(#dm10-soft)">
    <rect x="410" y="136" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="410" y="252" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="410" y="368" width="420" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="172" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Broker 1</text>
  <text x="620" y="200" font-size="20" fill="#64748B" text-anchor="middle">stores messages in topics</text>
  <text x="620" y="288" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Broker 2</text>
  <text x="620" y="316" font-size="20" fill="#64748B" text-anchor="middle">each server runs one broker</text>
  <text x="620" y="404" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Broker 3</text>
  <text x="620" y="432" font-size="20" fill="#64748B" text-anchor="middle">add brokers to scale</text>

  
  <g filter="url(#dm10-soft)">
    <rect x="382" y="496" width="476" height="84" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="620" y="528" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Controller quorum (KRaft)</text>
  <text x="620" y="558" font-size="20" fill="#64748B" text-anchor="middle">metadata log, agreed by majority</text>

  
  <g filter="url(#dm10-soft)">
    <rect x="40" y="180" width="220" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="40" y="368" width="220" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="210" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer 1</text>
  <text x="150" y="238" font-size="20" fill="#64748B" text-anchor="middle">writes to a topic</text>
  <text x="150" y="398" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer 2</text>
  <text x="150" y="426" font-size="20" fill="#64748B" text-anchor="middle">writes to a topic</text>

  
  <g filter="url(#dm10-soft)">
    <rect x="972" y="180" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="972" y="368" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1092" y="210" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer 1</text>
  <text x="1092" y="238" font-size="20" fill="#64748B" text-anchor="middle">subscribes to a topic</text>
  <text x="1092" y="398" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer 2</text>
  <text x="1092" y="426" font-size="20" fill="#64748B" text-anchor="middle">pulls new messages</text>

  
  <line x1="40" y1="500" x2="68" y2="500" stroke="#3B82F6" stroke-width="3"/>
  <text x="78" y="507" font-size="20" fill="#475569">producers write records</text>
  <line x1="40" y1="538" x2="68" y2="538" stroke="#059669" stroke-width="3"/>
  <text x="78" y="545" font-size="20" fill="#475569">consumers pull records</text>
  <line x1="40" y1="576" x2="68" y2="576" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="78" y="583" font-size="20" fill="#475569">metadata replication</text>
</svg>