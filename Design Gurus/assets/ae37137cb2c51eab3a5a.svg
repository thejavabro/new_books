<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Eight steps across five components. 1, the client makes a method call such as create_order(items) on the client stub. 2, the stub serializes the call into bytes for the broker. 3, the broker routes the request over the network to the server skeleton. 4, the skeleton deserializes it into an object and calls the server, which executes the method. 5, the server returns the method result to the skeleton. 6, the skeleton serializes it into bytes. 7, the broker returns the response over the network to the client stub. 8, the stub deserializes it into an object for the client">
  <defs>
    <filter id="m12c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m12c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m12c-k1"><rect x="340" y="125" width="560" height="80" rx="12"/></clipPath>
    <clipPath id="m12c-k2"><rect x="340" y="300" width="560" height="80" rx="12"/></clipPath>
    <clipPath id="m12c-k3"><rect x="340" y="475" width="560" height="80" rx="12"/></clipPath>
    <clipPath id="m12c-k4"><rect x="340" y="650" width="560" height="80" rx="12"/></clipPath>
    <clipPath id="m12c-k5"><rect x="340" y="825" width="560" height="80" rx="12"/></clipPath>
    <marker id="m12c-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="950" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How client stubs and server skeletons work</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Steps 1 to 4 carry the method call down to the server; steps 5 to 8 carry the result back.</text>



  <g fill="none" stroke-width="2">
    <path d="M560,205 V300" stroke="#2563EB" marker-end="url(#m12c-m-blue)"/>
    <path d="M680,300 V205" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12c-m-blue)"/>
    <path d="M560,380 V475" stroke="#2563EB" marker-end="url(#m12c-m-blue)"/>
    <path d="M680,475 V380" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12c-m-blue)"/>
    <path d="M560,555 V650" stroke="#2563EB" marker-end="url(#m12c-m-blue)"/>
    <path d="M680,650 V555" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12c-m-blue)"/>
    <path d="M560,730 V825" stroke="#2563EB" marker-end="url(#m12c-m-blue)"/>
    <path d="M680,825 V730" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12c-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="544" y="239" fill="#1D4ED8" text-anchor="end">1. Method call</text>
    <text x="696" y="239" fill="#1D4ED8" text-anchor="start">8. Deserialize</text>
    <text x="544" y="414" fill="#1D4ED8" text-anchor="end">2. Serialize</text>
    <text x="696" y="414" fill="#1D4ED8" text-anchor="start">7. Return response</text>
    <text x="544" y="589" fill="#1D4ED8" text-anchor="end">3. Route to server</text>
    <text x="696" y="589" fill="#1D4ED8" text-anchor="start">6. Serialize</text>
    <text x="544" y="764" fill="#1D4ED8" text-anchor="end">4. Deserialize</text>
    <text x="696" y="764" fill="#1D4ED8" text-anchor="start">5. Method result</text>
  </g>

  <g filter="url(#m12c-soft)">
    <rect x="340" y="125" width="560" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="340" y="125" width="6" height="80" fill="#64748B" clip-path="url(#m12c-k1)"/>
  </g>
  <circle cx="378" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,154.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="404" y="172" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m12c-soft)">
    <rect x="340" y="300" width="560" height="80" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="340" y="300" width="6" height="80" fill="#4F46E5" clip-path="url(#m12c-k2)"/>
  </g>
  <circle cx="378" cy="340" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,329.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="404" y="347" font-size="21.5" font-weight="600" fill="#111827">Client stub</text>
  <g filter="url(#m12c-lift)">
    <rect x="340" y="475" width="560" height="80" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="340" y="475" width="9" height="80" fill="#7C3AED" clip-path="url(#m12c-k3)"/>
  </g>
  <circle cx="378" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,504.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="404" y="522" font-size="21.5" font-weight="600" fill="#111827">Broker</text>
  <g filter="url(#m12c-soft)">
    <rect x="340" y="650" width="560" height="80" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="340" y="650" width="6" height="80" fill="#4F46E5" clip-path="url(#m12c-k4)"/>
  </g>
  <circle cx="378" cy="690" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,679.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="404" y="697" font-size="21.5" font-weight="600" fill="#111827">Server skeleton</text>
  <g filter="url(#m12c-soft)">
    <rect x="340" y="825" width="560" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="825" width="6" height="80" fill="#2563EB" clip-path="url(#m12c-k5)"/>
  </g>
  <circle cx="378" cy="865" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,854.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="404" y="872" font-size="21.5" font-weight="600" fill="#111827">Server</text>
  <text x="876" y="172" font-size="18.5" text-anchor="end" fill="#6B7280">Calls method</text>
  <text x="876" y="347" font-size="18.5" text-anchor="end" fill="#6B7280">Proxy on client side</text>
  <text x="876" y="522" font-size="18.5" text-anchor="end" fill="#6B7280">Routes request</text>
  <text x="876" y="697" font-size="18.5" text-anchor="end" fill="#6B7280">Proxy on server side</text>
  <text x="876" y="872" font-size="18.5" text-anchor="end" fill="#6B7280">Executes method</text>
  <text x="544" y="265" font-size="18.5" text-anchor="end" fill="#6B7280">(for example, create_order(items))</text>
  <text x="696" y="265" font-size="18.5" text-anchor="start" fill="#6B7280">(convert to object)</text>
  <text x="544" y="440" font-size="18.5" text-anchor="end" fill="#6B7280">(convert to bytes, over network)</text>
  <text x="696" y="440" font-size="18.5" text-anchor="start" fill="#6B7280">(over network)</text>
  <text x="544" y="615" font-size="18.5" text-anchor="end" fill="#6B7280">(over network)</text>
  <text x="696" y="615" font-size="18.5" text-anchor="start" fill="#6B7280">(convert to bytes, over network)</text>
  <text x="544" y="790" font-size="18.5" text-anchor="end" fill="#6B7280">(convert to object)</text>
  <text x="696" y="790" font-size="18.5" text-anchor="start" fill="#6B7280">(return value)</text>




</svg>