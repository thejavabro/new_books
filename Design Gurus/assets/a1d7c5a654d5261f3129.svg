<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" style="background-color:#ffffff">
<defs>
<marker id="qa" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="40" y="50" width="270" height="76" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="50" width="270" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="175" y="69" text-anchor="middle" font-weight="bold">Client</text>
<text x="52" y="98" font-family="monospace" font-size="11.5">prototype.copy()</text>
<text x="52" y="116" font-size="11.5" fill="#414d60">never names a concrete class</text>

<rect x="480" y="40" width="420" height="180" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="480" y="40" width="420" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="690" y="59" text-anchor="middle" font-weight="bold">NotificationTemplate</text>
<text x="492" y="88">- subject : String</text>
<text x="492" y="108">- body : String</text>
<text x="492" y="128">- channels : List&lt;String&gt;</text>
<line x1="480" y1="142" x2="900" y2="142" stroke="#6c8ebf"/>
<text x="492" y="164">+ NotificationTemplate(subject, body)</text>
<text x="762" y="164" font-size="10.5" fill="#b4322c">the expensive path</text>
<text x="492" y="186">- NotificationTemplate(other)</text>
<text x="762" y="186" font-size="10.5" fill="#2f7a55">the copy constructor</text>
<text x="492" y="208">+ copy() : NotificationTemplate</text>

<path d="M 310 88 L 475 88" stroke="#000000" fill="none" marker-end="url(#qa)"/>
<text x="336" y="80" font-size="11.5" fill="#414d60">calls copy()</text>

<path d="M 690 220 L 690 250 L 175 250 L 175 130" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#qa)"/>
<text x="360" y="242" font-size="11.5" fill="#414d60">returns a new, independent instance</text>

<rect x="40" y="286" width="860" height="112" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="62" y="312" font-size="12.5" fill="#414d60">There is no Prototype interface here, and often there does not need to be. The pattern is the copy method, not a class hierarchy.</text>
<text x="62" y="336" font-size="12.5" fill="#414d60">Add an interface when the client holds several unrelated types and needs to copy whichever one it has.</text>
<text x="62" y="364" font-size="12.5" fill="#414d60">The public constructor runs the expensive setup. The private one copies an existing object and runs none of it.</text>
<text x="62" y="386" font-size="12.5" fill="#414d60">That is the whole pattern: two ways in, and the cheap one starts from something already correct.</text>
</g>
</svg>